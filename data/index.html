121", "description": "TRENDnet TEW-751DR是TRENDnet公司的N600双频无线路由器，TEW-733GR是同厂商的N300无线路由器，两者均运行闭源嵌入式固件；固件中的UPnP/WFA（Wi-Fi Alliance注册）服务由多功能CGI程序htdocs/cgibin实现，wfadev.cgi是设备启动时创建的指向该程序的符号链接入口，用于处理WFA设备的SOAP控制请求。\n受影响版本中，wfadev_main对POST /wfadev.cgi请求不进行任何会话或凭证校验，直接读取HTTP_SOAPACTION环境变量中的SOAPAction请求头，并把#之前的内容传入共享SOAP响应构造函数FUN_0040ed90；该函数在4100字节栈缓冲区上通过sprintf拼接响应报文，写入过程无任何长度边界检查，全部14个WFA动作处理函数均经由其输出响应。SOAPAction前缀超过约3960字节即溢出栈缓冲区，该CGI二进制未启用栈保护且为非PIE，CGI进程以root权限运行，远程攻击者在无需认证的情况下可使进程崩溃形成拒绝服务，栈内容被覆盖后亦存在进一步代码执行的可能；经固件比对，官方最新固件1.03B03中的同一函数仍无边界检查。\n修复版本中通过厂商固件更新消除该漏洞的方案截至2026年11月28日尚未发布，官方最新固件1.03B03仍受影响；在修复固件发布前，建议关闭设备UPnP功能，将UPnP/WFA服务默认监听的49152端口限制为仅可信局域网主机访问，并在边界防火墙阻断WAN侧对该端口的访问，以降低被利用风险。", "effects": [{"comp_name": "TEW-733GR", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.03B01]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "TEW-751DR", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.03B03]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "栈缓冲区溢出", "kind_en": "基于堆栈的缓冲区溢出", "last_modified_time": "2026-11-28", "level": "Critical", "mps_id": "MPS-ma3i-k5f0", "poc": false, "poc_url": [], "published_time": "2026-11-28", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ma3i-k5f0", "name": "https://www.oscs1024.com/hd/MPS-ma3i-k5f0"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-138003", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-138003"}, {"url": "https://vuldb.com/vuln/444938", "name": "VDB-444938 | TRENDnet TEW-751DR UPnP/WFA wfadev.cgi FUN_0040ed90 stack-based overflow"}, {"url": "https://vuldb.com/vuln/444938/cti", "name": "VDB-444938 | CTI Indicators (IOB, IOC, IOA)"}, {"url": "https://vuldb.com/cve/CVE-2026-138003", "name": "CVE-2026-138003 | CVE Analysis and Report"}, {"url": "https://vuldb.com/submit/1066758", "name": "Submit #1066758 | TRENDnet TEW-751DR 1.03B01 Stack-based Buffer Overflow (CWE-121)"}, {"url": "https://gist.github.com/qwq-nm/4120495fb8a560921da0f102fa90fa0d", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "TRENDnet路由器栈溢出漏洞", "_translated": true, "_saved_at": "2026-11-27T23:08:52+00:00", "_first_saved_at": "2026-11-27T23:08:52+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ma3i-k5f0"}, {"analysis_status": 0, "articles": [{"content": "应用程序在处理用户输入时的不完善或缺乏验证机制，所以攻击者能够通过向应用程序发送恶意输入，利用应用程序对输入数据的错误处理方式来注入自己的恶意代码。这些恶意代码会被应用程序误认为是合法的指令或数据，并在执行过程中被执行。", "title": "什么是代码注入"}, {"content": "应用程序使用可执行动态代码的函数来执行用户可控的参数，当应用程序对于用户输入过滤不完全时，攻击者可以注入恶意代码并控制代码执行流程。", "title": "代码注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对所有用户输入进行验证和过滤，确保只接受预期的有效输入。这包括对输入数据进行输入长度验证、类型检查和格式验证等。\r\n- 使用参数化查询或预编译语句：对于数据库查询操作，应该使用参数化查询或预编译语句，确保输入数据不会被误认为是执行代码。\r\n- 最小特权原则：应用程序在执行操作系统命令或动态代码时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。\r\n- 安全编码实践：开发人员应该采用安全编码实践，包括避免使用eval函数、避免拼接用户输入的字符串作为代码执行等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止代码注入攻击。", "title": "如何预防代码注入"}], "cnvd_id": "", "cve_id": "CVE-2026-137305", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-94", "description": "Grav Form 是 Grav CMS 的官方表单插件，以 Composer 包 getgrav/grav-plugin-form 形式发布的 PHP 开源组件，用于在 Grav 页面中定义与处理表单，包含文件上传字段和邮件通知等动作。\n受影响版本中，Form::uploadFiles() 直接采用 .1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-770", "description": "Apache SkyWalking BanyanDB 是 Apache SkyWalking 开源的可观测性数据库，作为 SkyWalking 平台的默认存储后端，通过 gRPC 向外部提供 Property 属性查询服务。\n受影响版本中，liaison 模块对外注册的 gRPC 接口 PropertyService.Query 将客户端可控的 limit 直接用作结果缓冲区容量：sortedQueryWithDedup 执行 resultBuffer := make([]*propertyWithCount, 0, req.Limit)，数据节点侧 banyand/property/db/db.go 的 Query 同样执行 make([]QueriedProperty, 0, req.Limit)，limit 为 uint32 且缺少上限校验，未认证的远程攻击者携带超大 limit 发送一个带排序条件的查询请求，即可触发数十吉字节的预分配，导致服务器内存耗尽、进程被终止，造成拒绝服务。\n修复版本中通过引入查询准入控制解决该问题：admitQuery 将 limit 与 offset 组成的查询窗口限制在 100000 以内并通过 protector.QueryBudget 按内存预算预留资源，propertyQueryCapacity 将结果缓冲区容量提示收敛到 1024，查询执行过程中再按实际分配逐项计费，窗口超限或预算耗尽的请求直接返回错误，阻断无上限的结果缓冲区预分配。", "effects": [{"comp_name": "skywalking-banyandb", "ecosystem": "linux", "versions": [{"affected_version": "[0.11.0,0.11.1)", "min_fixed_version": "0.11.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "不加限制或调节的资源分配", "kind_en": "不受限制或节流地分配资源", "last_modified_time": "2026-11-26", "level": "High", "mps_id": "MPS-174e-6b1d", "poc": false, "poc_url": [], "published_time": "2026-11-26", "reference_url_list": [{"url": "https://www.openwall.com/lists/oss-security/2026/11/26/1", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-86470", "name": ""}, {"url": "https://skywalking.apache.org/", "name": ""}, {"url": "https://github.com/apache/skywalking-banyandb/pull/1334", "name": ""}, {"url": "https://github.com/apache/skywalking-banyandb/commit/e4c6be3def1c97dd201dcd863d4fc45771ac6989", "name": ""}, {"url": "https://github.com/apache/skywalking-banyandb/releases/tag/v0.11.1", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "BanyanDB Property查询内存耗尽拒绝服务漏洞", "_translated": true, "_saved_at": "2026-11-26T13:27:36+00:00", "_first_saved_at": "2026-11-26T13:27:36+00:00", "_sourc cca6bff177917afcb", "name": ""}, {"url": "https://github.com/assimp/assimp/releases/tag/v6.0.6", "name": "assimp v6.0.6 Release Notes"}, {"url": "https://github.com/assimp/assimp/blob/v6.0.5/code/AssetLib/MD5/MD5Loader.cpp#L200-L230", "name": ""}, {"url": "https://www.vulncheck.com/advisories/assimp-before-6.0.6-out-of-bounds-write-via-md5-importer-makedataunique", "name": "VulnCheck Advisory: Assimp before 6.0.6 Out-of-Bounds Write via MD5 Importer MakeDataUnique"}], "scope_influence": "", "tags": ["应用软件", "开源"], "title": "6.0.6 之前的 Assimp 通过 MD5 导入器 MakeDataUnique 越界写入", "_translated": true, "_saved_at": "2026-11-25T21:24:36+00:00", "_first_saved_at": "2026-11-25T21:24:36+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-8pta-u36v"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-136459", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "cwe": "CWE-79", "description": "Nexter Extension（全称 Nexter Extension – Security, Performance, Code Snippets \u0026 Site Toolkit）是 POSIMYTH 开发的 WordPress 开源插件，经 WordPress.org 官方插件目录分发，提供 SEO、安全加固、性能优化、代码片段与站点工具箱等扩展功能。\n受影响版本中，插件 SEO（Content SEO）模块启用后 nofollow_comments 选项默认开启，Nexter_Content_SEO::filter_nofollow_comment_links 挂载于 comment_text 与 get_comment_author_link 过滤器，以正则 /\u003ca\\s([^\u003e]+)\u003e/i 匹配评论锚点并按字符串拼接方式重建标签；未认证攻击者向 wp-comments-post.php 提交一条评论，在链接的 title 等引号包裹的属性值中放置 \"\u003e\" 与 \"rel=\" 文本，正则在属性值内部的 \"\u003e\" 处截断标签，剩余文本被浏览器重新解析为新的标签属性，注入 onfocus 等可执行脚本属性，载荷在用户访问被注入页面时执行，构成存储型 XSS。\n修复版本中通过改用 WordPress HTML API（WP_HTML_Tag_Processor）解析评论锚点并经 set_attribute 写回 rel 属性，引号包裹的属性值被完整解析且属性输出转义，属性值内部的 \"\u003e\" 不再截断标签，切断了脚本属性注入路径；该修复随 2026-11-25 发布的 4.9.2 版本提供。", "effects": [{"comp_name": "nexter-extension", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,4.9.2)", "min_fixed_version": "4.9.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-11-26", "level": "High", "mps_id": "MPS-dbao-1jft", "poc": false, "poc_url": [], "published_time": "2026-11-26", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-dbao-1jft", "name": "https://www.oscs1024.com/ ------------------------------------------------- |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-137284", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "cwe": "CWE-79", "description": "JetFormBuilder（Dynamic Blocks Form Builder）是 jetmonsters 开发的 WordPress 开源表单构建插件，用于在站点前端搭建表单并执行 Insert/Update Post 等提交动作。\n受影响版本中，未认证攻击者提交的表单字段值经 Insert/Update Post 动作的 fields_map 映射后，由 Post_Meta_Property::do_after() 通过 update_post_meta() 原样写入文章元数据；Get_From_DB 选项源读取该元数据键时将原始 meta_value 同时作为 Radio 或 Checkbox 选项的 value 与 label 回读并输出到页面标记，输入清理与输出转义不充分；在页面存在宏默认值字段而加载 dynamic.value.js 的条件下，前端 parseInput() 使用未限定自身表单边界的 closest('.jet-form-builder-row') 解析字段设置，攻击者存储的内容进入浏览器端字段设置解析路径并被执行，访问者打开被注入页面时任意网页脚本得以运行，形成存储型 XSS。\n修复版本中通过新增 findFieldWrapper() 辅助函数并应用于 dynamic.value、Observable、calculated.field、media.field 与 advanced.reporting 等前端模块，要求 closest() 解析到的包装元素位于当前字段所属表单的根节点内，字段设置只从自身表单标记读取，切断跨表单读取设置并执行存储载荷的路径；该修复随 3.6.8.3 版本发布。", "effects": [{"comp_name": "jetformbuilder", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,3.6.8.3)", "min_fixed_version": "3.6.8.3", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exp e@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:H/A:N", "severity": "medium", "base_score": 6.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-863", "description": "Friendica 是开源 PHP 去中心化社交网络平台，采用 AGPL-3.0 许可发布，用于自建可与 ActivityPub 联邦网络互通的社交站点。\n受影响版本中，mod/item.php 的 item_edit() 函数通过 Post::selectFirst(Item::ITEM_FIELDLIST, ['id' =\u003e $request['post_id'], 'uid' =\u003e $uid]) 获取待编辑帖子，查询条件仅匹配当前用户存储的帖子副本 id，未校验该副本是否为用户本人的原始帖子，也未校验 author-id 是否属于当前用户。已登录本地用户向 /item 发起 POST 请求并提交自己存储副本对应的 post_id 后，函数按共享 uri-id 调用 Post\\Media::deleteByURIId 删除原帖附件，并通过 Item::update 将攻击者可控的 body、title、content-warning 等字段写入共享内容，篡改结果继续展示在原作者名下。\n修复版本中通过改用 Post::selectOriginFirst 查询并附加 author-id 等于当前用户公开联系 ID、deleted 为 false 的条件，将可编辑范围限定为本人原创且未删除的帖子，同时隐藏非本人帖子的编辑入口，阻断越权编辑与附件删除。", "effects": [{"comp_name": "friendica", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2026.05-1]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-11-26", "level": "High", "mps_id": "MPS-uj4c-91xn", "poc": false, "poc_url": [], "published_time": "2026-11-26", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-uj4c-91xn", "name": "https://www.oscs1024.com/hd/MPS-uj4c-91xn"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-137309", "name": "https://nvd.nist.gov/vuln/detail/CVE-202 命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-80485", "cvss": {"cvssv31": [{"source": "security_alert@emc.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.4}]}, "cvss_score": 8.4, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-78", "description": "Dell Secure Connect Gateway Virtual Edition 是 Dell 提供的闭源商业虚拟设备，用于在企业环境与 Dell 技术支持之间建立安全连接，并集中收集、上传受管设备的日志与遥测数据。\n受影响版本中，产品在涉及操作系统命令执行的流程中未对特殊元素进行正确中和，未认证的本地攻击者可注入可控输入并被命令解析执行，形成 OS 命令注入，官方公告指出利用该漏洞可导致脚本注入。\n修复版本中通过官方在 5.36.00.16 版本发布的修复程序消除相关流程的命令注入缺陷，阻断可控输入进入操作系统命令执行路径，避免本地攻击者触发脚本注入。", "effects": [{"comp_name": "secure_connect_gateway", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,5.36.00.16)", "min_fixed_version": "5.36.00.16", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-11-27", "level": "High", "mps_id": "MPS-1aqx-c7pl", "poc": false, "poc_url": [], "published_time": "2026-11-27", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-1aqx-c7pl", "name": "https://www.oscs1024.com/hd/MPS-1aqx-c7pl"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-80485", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-80485"}, {"url": "https://www.dell.com/support/kbdoc/en-cv/000534756/dsa-2026-507-security-update-for-dell-secure-connect-gateway-virtual-edition-multiple-vulnerabilities-version-2", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "Dell SCG VE命令注入漏洞", "_translated": true, "_saved_at": "2026-11-27T14:35:41+00:00", "_first_saved_at": "2026-11-27T14:35:41+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-1aqx-c7pl"}, {"analysis_status": 0, "articles": [{"content": "- 编写代码时没有正确处理输入数据或没有正确验证用户输入而导致的。", "title": "什么是关键资源权限分配不当"}, {"content": "- 弱密码或未使用的密码：当管理员或系统管理员在创建帐户时，没有使用强密码或未对帐户进行密码更新时，可能会发生这种情况。弱密码可能会被黑客破解或通过其他方式轻松访问系统。\n- 未正确配置权限：在系统中，不同的资源通常需要不同的权限才能访问。如果管理员未正确配置权限，那么未经授权的用户可能会通过欺骗系统或利用其他漏洞来访问关键资源。\n- 权限重用：在某些情况下，管理员可能会将某些权限分配给某个用户，但这些权限并未被正确地限制或授权给该用户。如果其他用户尝试使用这些权限访问关键资源，那么他们可能会获得未经授权的访问权限。\n- 未正确验证用户输入：当开发人员没有正确验证用户输入时，可能会发生这种情况。例如，如果开发人员未正确过滤用户输入的用户名或密码，那么黑客可能会利用这些信息轻松地访问系统。\n", "title": "关键资源权限分配不当常见的攻击方式"}, {"content": "- 使用强密码：管理员应该使用强密码来保护系统，并定期更改密码。强密码应该包括数字、字母和符号，并且应该不同于其他帐户使用的密码。\n- 正确配置权限：管理员应该正确配置系统中不同资源所需的权限。用户可以被授予访问特定资源的权限，但不应该被授予访问其他资源的权限。\n- 权限限制：管理员应该使用权限限制来限制用户对特定资源的访问。例如，用户可以被授予访问特定文件夹的权限，但不能访问其他文件夹。\n- 输入验证：开发人员应该正确验证用户输入。例如，他们可以过滤用户输入的用户名和密码，以确保它们符合预期的格式。\n- 安全培训：管理员和用户应该接受安全培训，以便了解如何识别和避免常见的安全漏洞，例如不正确权限授予漏洞。\n- 定期更新和修补软件：系统软件和应用程序应该定期更新和修补，以确保它们不受最新安全漏洞的影响。", "title": "如何预防关键资源权限分配不当"}], "cnvd_id": "", "cve_id": "CVE-2026-80501", "cvss": {"cvssv31": [{"source": "security_alert@emc.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-732", "description": "Dell Secure Connect Gateway Virtual Edition 是 Dell 提供的闭源商业虚拟设备，用于为企业的服务器、网络与存储设备提供统一的安全连接、远程访问与监控管理能力。\n受影响版本中，系统对关键资源的权限分配不正确，本地低权限攻击者可以访问或修改本应受保护的关键资源，干扰网关服务的正常运行，最终导致拒绝服务。\n修复版本中通过修正关键资源的权限分配，限制本地低权限账户对相关资源的访问，消除由此引发的拒绝服务风险。", "effects": [{"comp_name": "secure_connect_gateway", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,5.36.00.16)", "min_fixed_version": "5.36.00.16", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "关键资源权限分配不当", "kind_en": "关键资源的权限分配不正确", "last_modified_time": "2026-11-27", "level": "High", "mps_id": "MPS-496l-ozgn", "poc": false, " "2026-11-27", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-bw62-9yxe", "name": "https://www.oscs1024.com/hd/MPS-bw62-9yxe"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-80498", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-80498"}, {"url": "https://www.dell.com/support/kbdoc/en-cv/000534756/dsa-2026-507-security-update-for-dell-secure-connect-gateway-virtual-edition-multiple-vulnerabilities-version-2", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "Dell SCG 硬编码加密密钥漏洞", "_translated": true, "_saved_at": "2026-11-27T14:35:40+00:00", "_first_saved_at": "2026-11-27T14:35:40+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-bw62-9yxe"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2026-80500", "cvss": {"cvssv31": [{"source": "security_alert@emc.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N", "severity": "high", "base_score": 7.7}]}, "cvss_score": 7.7, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N", "cwe": "CWE-287", "description": "Dell Secure Connect Gateway（SCG）Virtual Edition 是 Dell 提供的闭源虚拟化网关设备，以虚拟设备形式部署在客户数据中心，用于在本地 Dell 基础设施与 Dell 后端支持体系之间建立安全连接，集中完成遥测上报、远程支持访问与设备连通性管理。\n受影响版本中，5.36.00.16 之前的版本在认证环节存在校验缺陷（CWE-287），认证流程未能有效鉴别本地访问请求的合法性，未通过身份认证的攻击者在获得虚拟机本地访问环境后可绕过认证校验，获得对网关受保护功能的未授权访问，导致机密性与完整性受损，官方 CVSS 基础评分为 7.7（CVSS:3.1/AV:L/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N）。\n修复版本中通过 5.36.00.16 安全更新修复该认证校验缺陷，阻断未认证的本地访问请求继续进入受保护的管理功能，Dell 在 DSA-2026-507 中说明升级至 5.36.00.16 及以上版本可修复该漏洞。", "effects": [{"comp_name": "secure_connect_gateway_virtual_edition", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,5.36.00.16)", "min_fixed_version": "5.36.00.16", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "身份验证不当", "kind_en": "认证不当", "last_modified_time": "2026-11-27", "level": "High", "mps_id": "MPS-qf5c-d926", "poc": false, "poc_url": [], "published_time": "2026-11-27", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-qf5c-d926", "name": "https://www.oscs1024.com/hd/MPS-qf5c-d926"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-80500", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-80500"}, {"url": "https://www.dell.com/support/kbdoc/en-cv/000534756/dsa-2026-507-security-update-for-dell-secure-connect-gateway-virtual-edition-multiple-vulnerabilities-version-2", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Dell SCG Virtual Edition认证缺陷漏洞", "_translated": true, "_saved_at": "2026-11-27T14:35:43+00:00", "_first_saved_at": "2026-11-27T14:35:43+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-qf5c-d926"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "cnvd_id": "", "cve_id": "CVE-2026-135626", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-269", "description": "The Simple Membership plugin for WordPress is vulnerable to Privilege Escalation in all versions up to, and including, 4.9.0 This is due to the `SwpmLevelForm::role()` function applying only `sanitize_text_field()` to the user-supplied `role` parameter with no allowlist, permitting the `administrator` role to be stored verbatim into `swpm_membership_tbl` and subsequently applied to a member's WordPress account via `$user-\u003eadd_role()` inside `update_wp_user_role()` — also without any role allowlist — when the `swpm_membership_level_changed` action fires. This makes it possible for authenticated attackers with Contributor-level access and above to create a membership level specifying the `administrator` WordPress role, assign themselves to that level, and thereby elevate their own WordPress account to full Administrator, gaining complete site control including the ability to install plugins, edit themes, and manage users. Exploitation requires that the site owner has lowered the plugin's \"Admin Dashboard Access Permission\" setting from its default `manage_options` capability to a lesser capability such as `edit_posts`, `edit_published_posts`, or `edit_pages`, which grants lower-privileged users access to the SWPM admin dashboard where the vulnerable level-creation form resides. Successful exploitation causes the attacker's own account to receive the complete administrator role.", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-11-27", "level": "High", "mps_id": "MPS-2hr6-agil", "poc": false, "poc_url": [], "published_time": "2026-11-27", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-2hr6-agil", "name": "https://www.oscs1024.com/hd/MPS-2hr6-agil"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-135626", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-135626"}, {"url": "https://downloads.wordpress.org/plugin/simple-membership.4.9.1.zip", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/simple-membership/tags/4.9.0/classes/class.swpm-admin-registration.php#L160", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/simple-membership/tags/4.9.0/classes/class.swpm-level-form.php#L35", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/simple-membership/tags/4.9.0/classes/class.swpm-membership-level.php#L61", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/simple-membership/tags/4.9.0/classes/class.swpm-self-action-handler.php#L133", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/simple-membership/tags/4.9.0/classes/class.swpm-utils-member.php#L641", "name": ""}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/0e71c156-9259-4490-9d4a-b2df645891a3?source=cve", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-135626漏洞", "_translated": true, "_saved_at": "2026-11-28T05:53:55+00:00", "_first_saved_at": "2026-11-27T04:42:50+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-2hr6-agil"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "cnvd_id": "", "cve_id": "CVE-2026-135627", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-269", "description": "The Simple Membership plugin for WordPress is vulnerable to Privilege Escalation in all versions up to, and including, 4.9.0 The vulnerability exists because the `bulk_operation_menu()` function accepts the `swpm_bulk_change_level_to` parameter from `$_REQUEST` with only `sanitize_text_field()` applied, and passes it to `SwpmMemberUtils::update_membership_level_and_role()` without the `id != 1` allowlist exclusion that every other level-selection path in the plugin enforces — leaving membership level 1, which the installer maps to the WordPress `administrator` role on every fresh install, freely selectable as a bulk-change target. This makes it possible for authenticated attackers with Contributor-level access and above to elevate their own WordPress account to the full Administrator role, gaining complete site control including plugin installation, user creation, and all other administrator capabilities. Exploitation requires that an administrator has first lowered the plugin's \"Admin Dashboard Access Permission\" setting from its default of `manage_options` to a lesser capability such as `edit_posts` (Contributor), `edit_published_posts` (Author), or `edit_pages` (Editor), which is a non-default granted-access configuration; the bulk screen's nonce protection (`swpm_bulk_change_level_nonce_action`) does not mitigate the issue because the nonce is emitted on the same page the delegated lower-role user can already reach. Successful exploitation causes the attacker's own account to receive the complete administrator role.", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-11-27", "level": "High", "mps_id": "MPS-p5dz-b147", "poc": false, "poc_url": [], "published_time": "2026-11-27", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-p5dz-b147", "name": "https://www.oscs1024.com/hd/MPS-p5dz-b147"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-135627", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-135627"}, {"url": "https://downloads.wordpress.org/plugin/simple-membership.4.9.1.zip", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/simple-membership/tags/4.9.0/classes/class.swpm-members.php#L564", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/simple-membership/tags/4.9.0/classes/class.swpm-members.php#L575", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/simple-membership/tags/4.9.0/classes/class.swpm-self-action-handler.php#L133", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/simple-membership/tags/4.9.0/classes/class.swpm-utils-member.php#L264", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/simple-membership/tags/4.9.0/classes/class.swpm-utils-member.php#L641", "name": ""}, {"url": "https://www 段时，把 settings-\u003eNumber 初始化为 0 后作为 Settings 数组下标写入设置项字段，并在循环末尾递增该下标；GSM_MultiWAPSettings 中的 Settings 数组在 include/gammu-wap.h 中固定为 4 个元素，函数内未对该下标做边界检查，段内出现超过 4 个 TitleNN 键时会经 ReadBackupText 向堆对象越界写入攻击者可控内容，通过 gammu convertbackup、restore 命令或库接口 GSM_ReadBackupFile 加载此类备份文件可导致堆内存损坏与进程崩溃。\n修复版本中通过在写入每个设置项前检查 settings-\u003eNumber 是否达到 Settings 数组容量、超限时返回 ERR_CORRUPTED，并由 LoadBackup 对 WAP 与 MMS 两类段统一检查该返回值转入错误处理，使超出数组容量的备份段被拒绝解析，切断堆越界写入路径。", "effects": [{"comp_name": "gammu", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.45.2)", "min_fixed_version": "1.45.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "堆缓冲区溢出", "kind_en": "基于堆的缓冲区溢出", "last_modified_time": "2026-11-28", "level": "High", "mps_id": "MPS-q91p-7smn", "poc": false, "poc_url": [], "published_time": "2026-11-28", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-q91p-7smn", "name": "https://www.oscs1024.com/hd/MPS-q91p-7smn"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-138163", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-138163"}, {"url": "https://github.com/gammu/gammu/security/advisories/GHSA-vppj-6q2c-vq79", "name": "GitHub Security Advisory (GHSA-vppj-6q2c-vq79)"}, {"url": "https://github.com/gammu/gammu/commit/e0bf2fa08a78afebd493f7f00ea12ef9276ff52e", "name": ""}, {"url": "https://github.com/gammu/gammu/releases/tag/1.45.2", "name": "Gammu 1.45.2 Release Notes"}, {"url": "https://github.com/gammu/gammu/blob/1.45.1/libgammu/service/backup/backtext.c#L2814-L2896", "name": ""}, {"url": "https://github.com/gammu/gammu", "name": ""}, {"url": "https://www.vulncheck.com/advisories/gammu-before-1.45.2-heap-buffer-overflow-via-readwapsettingsentry", "name": "VulnCheck Advisory: Gammu before 1.45.2 Heap Buffer Overflow via ReadWAPSettingsEntry()"}], "scope_influence": "", "tags": ["应用软件"], "title": "Gammu堆缓冲区溢出漏洞", "_translated": true, "_saved_at": "2026-11-28T05:53:49+00:00", "_first_saved_at": "2026-11-28T05:53:49+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-q91p-7smn"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过构造恶意的数据，将过多的数据输入到程序的缓冲区中，使得缓冲区的空间被填满，从而溢出到程序的栈 (stack) 或堆 (heap) 中，导致程序崩溃、拒绝服务、数据泄露等安全问题。\n", "title": "什么是经典缓冲区溢出"}, {"content": "| 类型        | 描述                                                         |\n| ----------- | ------------------------------------------------------------ |\n| 代码注入攻击      | 攻击者通过向程序的缓冲区输入恶意代码，从而控制程序执行流程，实现对程序操作的恶意操作。例如，攻击者可以通过向 Web 应用程序的输入框中输入恶意代码，从而执行任意的代码，破坏系统、窃取数据等。 |\n| 数据覆盖攻击      | 攻击者通过向程序的缓冲区输入过多的数据，从而覆盖程序中的重要数据或代码，实现对程序操作的恶意操作。例如，攻击者可以通过向聊天应用程序的输入框中输入过多的表情符号，从而覆盖程序中的重要数据，例如聊天消息、账号密码等。 |\n| 栈溢出攻击 | 攻击者通过向程序的栈中输入过多的数据，从而溢出到栈外部，实现对程序操作的恶意操作。例如，攻击者可以通过向游戏应用程序的输入框中输入过多的道具名称，从而覆盖程序中的重要数据，例如游戏数据、账号密码等。 |\n| 堆溢出攻击       | 攻击者通过向程序的堆中输入过多的数据，从而溢出到堆外部，实现对程序操作的恶意操作。例如，攻击者可以通过向操作系统工具的输入框中输入过多的命令，从而覆盖程序中的重要数据，例如系统文件、配置文件等。 |", "title": "经典缓冲区溢出常见的攻击方式"}, {"content": "- 输入验证：在程序输入处对输入数据进行严格的验证和过滤，确保输入数据符合预期的格式和类型，避免被攻击者注入恶意命令或数据。可以使用正则表达式、格式字符串等方式进行输入验证。\n- 输出过滤：在程序输出处对输出数据进行严格的过滤和检查，确保输出数据符合预期的格式和类型，避免被攻击者截获和篡改。可以使用安全的输出过滤库等方式进行输出过滤。\n- 使用安全的编程模型：使用安全的编程模型，例如避免使用原生的缓冲区管理函数，使用安全的框架和库来处理输入数据和执行命令，避免缓冲区溢出漏洞。\n- 数据库加密和访问控制：对于敏感数据和命令，使用加密和访问控制措施，确保只有授权用户可以访问和执行命令，避免被攻击者窃取和篡改。\n- 定期更新和升级：定期更新和升级应用程序和库的版本，确保应用程序和库的最新版本包含了最新的安全补丁和修复措施，避免安全漏洞的出现和利用。\n- 安全审计和监控：定期对系统和应用程序进行安全审计和监控，及时发现和阻止潜在的安全漏洞和攻击，确保系统和数据的安全和可靠性。", "title": "如何预防经典缓冲区溢出"}], "cnvd_id": "", "cve_id": "CVE-2026-138161", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.5}]}, "cvss_score": 8.5, "cvss_vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-120", "description": "Gammu 是开源手机管理工具与函数库，采用 GPL-2.0 许可证发布，用于在计算机与手机之间管理短信、通讯录、日历等数据，并提供文本备份文件的格式转换与恢复功能。\n受影响版本中，libgammu/service/backup/backtext.c 的 LoadBackup() 从备份文件 [Checksum] 段读取 MD5 字段后，直接调用 strcpy() 复制到 GSM_Backup 结构中固定 100 字节的 MD5Original 数组，缺少长度校验；当用户使用 convertbackup 或 restore 命令加载 MD5 值超长的恶意备份文件时，越界写入覆盖相邻的校验字段与通讯录、日历条目指针，导致内存破坏与进程崩溃，并存在潜在代码执行风险。\n修复版本中通过在复制前校验 MD5 值必须为 32 个十六进制字符，长度或字符集不符合时返回 ERR_CORRUPTED 并拒绝加载，校验通过后改用 memcpy() 固定复制 33 字节，切断了超长 MD5 值进入固定缓冲区的路径；该修复随 1.45.2 版本发布。", "effects": [{"comp_name": "gammu", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.45.2)", "min_fixed_version": "1.45.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "经典缓冲区溢出", "kind_en": "不检查输入大小的缓冲区复制（“经典缓冲区溢出”）", "last_modified_time": "2026-11-28", "level": "High", "mps_id": "MPS-xob7-9e5g", "poc": false, "poc_url": [], "published_time": "2026-11-28", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-xob7-9e5g", "name": "https://www.oscs1024.com/hd/MPS-xob7-9e5g"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-138161", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-138161"}, {"url": "https://github.com/gammu/gammu/security/advisories/GHSA-cp4c-2vv3-mrr7", "name": "GitHub Security Advisory (GHSA-cp4c-2vv3-mrr7)"}, {"url": "https://github.com/gammu/gammu/commit/91f62b818edaa221276d898e19ad4d092c36cdcb", "name": ""}, {"url": "https://github.com/gammu/gammu/releases/tag/1.45.2", "name": "Gammu 1.45.2 Release Notes"}, {"url": "https://github.com/gammu/gammu/blob/1.45.1/libgammu/service/backup/backtext.c#L3282", "name": ""}, {"url": "https://github.com/gammu/gammu", "name": ""}, {"url": "https://www.vulncheck.com/advisories/gammu-before-1.45.2-buffer-overflow-via-loadbackup-md5-checksum", "name": "VulnCheck Advisory: Gammu before 1.45.2 Buffer Overflow via LoadBackup() MD5 Checksum"}], "scope_influence": "", "tags": ["应用软件"], "title": "Gammu 备份文件缓冲区溢出", "_translated": true, "_saved_at": "2026-11-28T05:53:50+00:00", "_first_saved_at": "2026-11-28T05:53:50+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-xob7-9e5g"}, {"analysis_status": 0, "articles": [{"content": "跨界内存读是指应用程序在读取内存时，未正确验证或限制读取的内存范围。攻击者利用这种漏洞可以读取应用程序内存中的敏感数据，如密码、加密密钥、会话令牌等。常见的原因是由于缓冲区溢出、格式化字符串漏洞或其他内存错误导致的。", "title": "什么是越界读取"}, {"content": "攻击者可以通过不当构造的输入来触发跨界内存读漏洞。攻击者可能会通过向应用程序发送特定的输入，使其读取超过预期的内存区域。攻击者可以利用这个漏洞来获取敏感信息，如其他用户的数据、操作系统的敏感数据或应用程序的内部状态。", "title": "越界读取常见的攻击方式"}, {"content": "- 输入验证和限制：应用程序应对所有输入数据进行严格的验证和限制。确保输入数据的长度、格式和内容符合预期，避免超出缓冲区或访问非预期的内存区域。\n- 内存安全编程实践：开发人员应使用安全的编程实践，如避免使用不安全的函数、正确处理内存分配和释放操作，以及遵循最小特权原则。\n- 使用安全的编程语言和库：选择使用安全性较高的编程语言和库，这些语言和库在内存管理和安全性方面提供了更多的保护机制。\n- 定期进行代码审查和安全测试：定期审查应用程序的代码，并进行安全测试，以发现潜在的跨界内存读漏洞。使用静态代码分析工具和漏洞扫描工具来辅助检测和修复问题。\n- 实施防御性编程技术：应用程序应采用防御性编程技术，如使用随机化地址空间布局（ASLR）、堆栈保护机制（如堆栈溢出保护）和数据执行预防（DEP）等。\n- 及时更新和修补：及时应用程序和操作系统的安全更新和补丁，以确保已知的跨界内存读漏洞得到修复。及时更新相关软件和库，以避免使用已知存在漏洞的版本。", "title": "如何预防越界读取"}], "attack_vector_type": "Local", "cnvd_id": "", "cve_id": "CVE-2026-137941", "cvss": {"cvssv31": [{"source": "secalert@redhat.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "cwe": "CWE-125", "description": "GIMP 是 GNOME 项目开发的开源跨平台图像编辑器，广泛用于照片后期、图像合成与数字绘画，XCF 为其原生工程文件格式，非破坏性图层滤镜的参数会随 XCF 一并保存。\n受影响版本中，app/operations/gimplevelsconfig.c 的 GimpLevelsConfig 以固定 5 元素数组 low_input、high_input、gamma、low_output、high_output 存储各通道参数，channel 属性基于 GimpHistogramChannel 枚举，该枚举注册了包含 GIMP_HISTOGRAM_LUMINANCE（5）与 GIMP_HISTOGRAM_RGB（6）在内的 7 个值；gimp_levels_config_set_property 在 PROP_CHANNEL 分支未做范围校验直接写入 self-\u003echannel，后续 per-channel 属性处理又以 self-\u003echannel 作为数组下标读写。攻击者构造带非破坏性 Levels 图层滤镜并把 channel 设为 LUMINANCE 或 RGB 的 XCF 文件，GIMP 打开文件经 XCF 加载器还原滤镜配置时触发堆越界读与越界写，越界写把攻击者可控的 gdouble 写入堆上配置对象之后的固定偏移，可能导致崩溃或任意代码执行。\n修复版本中通过在 gimp_levels_config_set_property 的 PROP_CHANNEL 分支增加 GIMP_HISTOGRAM_VALUE 至 GIMP_HISTOGRAM_ALPHA 的范围校验，仅当通道枚举值落在合法区间时才写入 self-\u003echannel 并发出属性通知，使越界通道下标不再进入 per-channel 数组读写，从而切断上述越界访问路径。", "effects": [{"comp_name": "gimp", "ecosystem": "linux", "versions": [{"affected_version": "[3.0.0,3.2.8]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[2.10.0,2.10.38]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界读取", "kind_en": "越界读取", "last_modified_time": "2026-11-28", "level": "High", "mps_id": "MPS-hl91-wt02", "poc": false, "poc_url": [], "published_time": "2026-11-28", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-hl91-wt02", "name": "https://www.oscs1024.com/hd/MPS-hl91-wt02"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-137941", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-137941"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-137941", "name": ""}, {"url": "https://gitlab.gnome.org/GNOME/gimp/-/commit/47f51b5b538cf1b27634b4c6f4f98b553138dbad", "name": ""}, {"url": "https://gitlab.gnome.org/GNOME/gimp/-/issues/17004", "name": ""}], "scope_influence": "", "tags": ["应用软件", "开源", "终端软件"], "title": "GIMP 堆越界读写漏洞", "_translated": true, "_saved_at": "2026-11-27T23:08:53+00:00", "_first_saved_at": "2026-11-27T23:08:53+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-hl91-wt02"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-138027", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/ otboot_partitions 函数；该修复目前以上游 PR #908 形式存在，截至 2026-11-28 尚未随正式发布版本提供。", "effects": [{"comp_name": "tuned", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.28.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-11-28", "level": "High", "mps_id": "MPS-xlvz-foy1", "poc": false, "poc_url": [], "published_time": "2026-11-28", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-xlvz-foy1", "name": "https://www.oscs1024.com/hd/MPS-xlvz-foy1"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-137974", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-137974"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-137974", "name": ""}, {"url": "https://bugzilla.redhat.com/show_bug.cgi?id=2585500", "name": "RHBZ#2585500"}], "scope_influence": "", "tags": ["应用软件"], "title": "tuned spindown-disk本地提权漏洞", "_translated": true, "_saved_at": "2026-11-27T23:08:54+00:00", "_first_saved_at": "2026-11-27T23:08:54+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-xlvz-foy1"}]}</script>
  <script>
    const payload = JSON.parse(document.getElementById("payload").textContent);
    const levelLabels = payload.level_labels || {};
    const items = payload.items || [];
    let filtered = items.slice();
    let activeId = null;

    const $ = (id) => document.getElementById(id);
    $("generatedAt").textContent = payload.generated_at || "-";
    $("retention").textContent = payload.retention_days ?? "-";
    $("cutoff").textContent = payload.cutoff_date || "-";
    $("count").textContent = String(payload.count ?? items.length);

    function levelClass(level) {
      const cn = levelLabels[level] || level || "";
      if (level === "Critical" || cn === "严重") return "crit";
      if (level === "High" || cn === "高危") return "high";
      return "other";
    }
    function levelText(level) {
      return levelLabels[level] || level || "-";
    }
    function esc(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }
    function scoreText(v) {
      if (v === null || v === undefined || v === "" || v === -1) return "-";
      return String(v);
    }

    function renderList() {
      const list = $("list");
      $("listCount").textContent = String(filtered.length);
      if (!filtered.length) {
        list.innerHTML = '<div class="empty">没有匹配项</div>';
        return;
      }
      list.innerHTML = filtered.map((it) => {
        const id = it.mps_id || it.cve_id;
        const active = id === activeId ? " active" : "";
        return `
          <button class="item${active}" data-id="${esc(id)}" type="button">
            <div class="item-top">
              <span class="cve">${esc(it.cve_id || it.mps_id || "-")}</span>
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
            </div>
            <div class="title">${esc(it.title || "-")}</div>
            <div class="item-foot">
              <span>CVSS ${esc(scoreText(it.cvss_score))}</span>
              <span>${esc(it.published_time || "-")}</span>
              ${it.poc ? "<span>POC</span>" : ""}
            </div>
          </button>`;
      }).join("");
      list.querySelectorAll(".item").forEach((btn) => {
        btn.addEventListener("click", () => selectById(btn.dataset.id));
      });
    }

    function refsHtml(it) {
      const refs = Array.isArray(it.reference_url_list) ? it.reference_url_list : [];
      const links = [];
      if (it._source_page) links.push({ url: it._source_page, name: "OSCS 详情" });
      if (it.cve_id) links.push({ url: `https://nvd.nist.gov/vuln/detail/${it.cve_id}`, name: "NVD" });
      refs.forEach((r) => {
        if (r && r.url) links.push({ url: r.url, name: r.name || r.url });
      });
      const seen = new Set();
      const uniq = [];
      for (const l of links) {
        if (seen.has(l.url)) continue;
        seen.add(l.url);
        uniq.push(l);
      }
      if (!uniq.length) return '<div class="box">无参考链接</div>';
      return `<div class="refs">${uniq.map((l) =>
        `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name || l.url)}</a>`
      ).join("")}</div>`;
    }

    function articlesHtml(it) {
      const arts = Array.isArray(it.articles) ? it.articles : [];
      if (!arts.length) return "";
      return `<div class="section"><h3>相关说明</h3>${arts.map((a) => `
        <div class="article">
          <h4>${esc(a.title || "说明")}</h4>
          <p>${esc(a.content || "")}</p>
        </div>`).join("")}</div>`;
    }

    function renderDetail(it) {
      const detail = $("detail");
      if (!it) {
        detail.innerHTML = '<div class="empty">暂无数据</div>';
        return;
      }
      const pocUrls = Array.isArray(it.poc_url) ? it.poc_url : [];
      detail.innerHTML = `
        <div class="d-head">
          <div>
            <h1 class="d-title">${esc(it.title || "-")}</h1>
            <div class="ids">
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
              <span class="chip">${esc(it.cve_id || "无 CVE")}</span>
              <span class="chip">${esc(it.mps_id || "-")}</span>
              ${it.poc ? '<span class="chip">有 POC</span>' : ""}
              ${it.exp ? '<span class="chip">有 EXP</span>' : ""}
            </div>
          </div>
          <div class="actions">
            ${it._source_page ? `<a class="btn" href="${esc(it._source_page)}" target="_blank" rel="noopener">OSCS</a>` : ""}
            ${it.cve_id ? `<a class="btn" href="https://nvd.nist.gov/vuln/detail/${esc(it.cve_id)}" target="_blank" rel="noopener">NVD</a>` : ""}
          </div>
        </div>
        <div class="grid">
          <div class="stat"><div class="k">CVSS</div><div class="v">${esc(scoreText(it.cvss_score))}</div></div>
          <div class="stat"><div class="k">向量</div><div class="v">${esc(it.cvss_vector || "-")}</div></div>
          <div class="stat"><div class="k">CWE</div><div class="v">${esc(it.cwe || "-")}</div></div>
          <div class="stat"><div class="k">类型</div><div class="v">${esc(it.kind || it.kind_en || "-")}</div></div>
          <div class="stat"><div class="k">公开</div><div class="v">${esc(it.published_time || "-")}</div></div>
          <div class="stat"><div class="k">利用成本</div><div class="v">${esc(it.exploit_requirement_cost || "-")}</div></div>
          <div class="stat"><div class="k">可利用性</div><div class="v">${esc(it.exploitability || "-")}</div></div>
          <div class="stat"><div class="k">修复建议</div><div class="v">${esc(it.fix_suggestion || "-")}</div></div>
        </div>
        <div class="section"><h3>描述</h3><div class="box">${esc(it.description || "无描述")}</div></div>
        ${it.scope_influence ? `<div class="section"><h3>影响范围</h3><div class="box">${esc(it.scope_influence)}</div></div>` : ""}
        ${pocUrls.length ? `<div class="section"><h3>POC 链接</h3><div class="refs">${pocUrls.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join("")}</div></div>` : ""}
        <div class="section"><h3>参考链接</h3>${refsHtml(it)}</div>
        ${articlesHtml(it)}
      `;
    }

    function selectById(id) {
      const it = filtered.find((x) => (x.mps_id || x.cve_id) === id) ||
                 items.find((x) => (x.mps_id || x.cve_id) === id);
      if (!it) return;
      activeId = it.mps_id || it.cve_id;
      renderList();
      renderDetail(it);
      const btn = document.querySelector(`.item[data-id="${CSS.escape(activeId)}"]`);
      if (btn) btn.scrollIntoView({ block: "nearest" });
      history.replaceState(null, "", "#" + encodeURIComponent(activeId));
    }

    function applyFilter(q) {
      const query = (q || "").trim().toLowerCase();
      filtered = !query ? items.slice() : items.filter((it) => {
        const blob = [
          it.cve_id, it.mps_id, it.title, it.kind, it.kind_en, it.cwe, it.description, it.level
        ].map((x) => String(x || "").toLowerCase()).join(" ");
        return blob.includes(query);
      });
      renderList();
      if (filtered.length) {
        const still = filtered.some((x) => (x.mps_id || x.cve_id) === activeId);
        selectById(still ? activeId : (filtered[0].mps_id || filtered[0].cve_id));
      } else {
        activeId = null;
        renderDetail(null);
      }
    }

    $("search").addEventListener("input", (e) => applyFilter(e.target.value));

    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement !== $("search")) {
        e.preventDefault();
        $("search").focus();
        return;
      }
      if (!filtered.length) return;
      const idx = filtered.findIndex((x) => (x.mps_id || x.cve_id) === activeId);
      if (e.key === "ArrowDown") {
        e.preventDefault();
        const next = filtered[Math.min(filtered.length - 1, Math.max(0, idx) + 1)];
        selectById(next.mps_id || next.cve_id);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        const prev = filtered[Math.max(0, idx - 1)];
        selectById(prev.mps_id || prev.cve_id);
      }
    });

    const hashId = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    if (hashId && items.some((x) => (x.mps_id || x.cve_id) === hashId)) {
      activeId = hashId;
      renderList();
      selectById(hashId);
    } else if (items.length) {
      selectById(items[0].mps_id || items[0].cve_id);
    } else {
      renderList();
      renderDetail(null);
    }
  </script>
</body>
