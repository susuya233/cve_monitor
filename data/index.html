44)]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "不充分的划分", "kind_en": "不适当的隔离或划分", "last_modified_time": "2026-09-25", "level": "High", "mps_id": "MPS-1ruj-5xh7", "poc": false, "poc_url": [], "published_time": "2026-09-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-1ruj-5xh7", "name": "https://www.oscs1024.com/hd/MPS-1ruj-5xh7"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-95699", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-95699"}, {"url": "https://raw.githubusercontent.com/cisagov/CSAF/develop/csaf_files/VA/white/2026/va-26-267-01.json", "name": ""}, {"url": "https://www.mrsteam.com/contactus/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "MrSteam iSteamX 不正确的隔离或划分", "_translated": true, "_saved_at": "2026-09-25T01:06:22+00:00", "_first_saved_at": "2026-09-24T22:55:39+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-1ruj-5xh7"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2026-85056", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:L/A:N", "severity": "high", "base_score": 8.2}]}, "cvss_score": 8.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:L/A:N", "cwe": "CWE-287", "description": "ZITADEL 是一个开源身份管理平台。从 4.0.0 到 4.16.1，ZITADEL Login V2 在密码验证后创建浏览器会话，并且可以在以后的身份验证请求中重用该会话，而无需验证用户注册的 TOTP、OTP 或 U2F 第二因素。当放弃 MFA 步骤并再次开始登录时，仅当组织启用强制 MFA 或仅对本地用户强制 MFA 时，会话有效性检查才需要 MFA，因此在为客户应用程序完成 OIDC 或 SAML 回调时可以跳过自愿注册因素。登录 V1、ZITADEL 控制台、管理和管理 API 以及用户自我管理不受影响。此问题已在版本 4.16.1 中修复。", "effects": [{"comp_name": "github.com/zitadel/zitadel", "ecosystem": "go", "versions": [{"affected_version": "(-∞,v1.80.0-v2.20.0.20260717062356-56f4798ed31f)", "min_fixed_version": "v1.80.0-v2.20.0.20260717062356-56f4798ed31f", "repository": "go", "solutions": [], "upstream": true}]}, {"comp_name": "zitadel", "ecosystem": "linux", "versions": [{"affected_version": "[4.0.0,4.16.1)", "min_fixed_version": "4.16.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "身份验证不当", "kind_en": "认证不当", "last_modified_time": "2026-09-25", "level": "High", "mps_id": "MPS-lfz5-sgpo", "poc": false, "poc_url": [], "published_time": "2026-09-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-lfz5-sgpo", "name": "https://www.oscs1024.com/hd/MPS-lfz5-sgpo"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-85056", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-85056"}, {"url": "https://github.com/zitadel/zitadel/security/advisories/GHSA-9993-rfwp-rhwf", "name": "https://github.com/zitadel/zitadel/security/advisories/GHSA-9993-rfwp-rhwf"}, {"url": "https://github.com/zitadel/zitadel/commit/049dbb25a56587fb3980c85c99819cad69f637db", "name": "https://github.com/zitadel/zitadel/commit/049dbb25a56587fb3980c85c99819cad69f637db"}, {"url": "https://github.com/zitadel/zitadel/commit/56f4798ed31fc1cfcd9a0e7f6f0152289d2fdc43", "name": "https://github.com/zitadel/zitadel/commit/56f4798ed31fc1cfcd9a0e7f6f0152289d2fdc43"}, {"url": "https://github.com/zitadel/zitadel/releases/tag/v4.16.1", "name": "https://github.com/zitadel/zitadel/releases/tag/v4.16.1"}], "scope_influence": "", "tags": ["go", "应用软件"], "title": "ZITADEL：通过 Login V2 中的会话重用绕过 MFA", "_translated": true, "_saved_at": "2026-09-24T19:42:59+00:00", "_first_saved_at": "2026-09-24T19:42:59+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-lfz5-sgpo"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-87720", "cvss": {"cvssv4": [{"source": "cve-coordination@google.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:L/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.6}]}, "cvss_score": 7.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:L/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-863", "description": "Gerrit Code Review 版本 2.16.0 到 3.12.9、3.13.0 到 3.13.8、3.14.0 到 3.14.2 中的项目名称规范化 (ProjectUtil.stripGitSuffix) 和 ProjectCache 逐出逻辑 (ProjectCacheImpl) 中的授权不正确 (CWE-863) 允许经过身份验证的用户（如果存储库以前是未经身份验证的用户） public），通过跨 REST API、Gtiles 或 SSH Git 命令使用重复的 .git 后缀（例如 project.git.git）精心设计的请求，导致私有存储库内容未经授权泄露，并持久恢复已撤销的项目所有者管理权限。由于在构造逻辑 ProjectCache 键时，Gerrit 仅删除单个终端 .git 后缀，而 JGit (FileKey.lenient) 将后缀别名解析为磁盘上的同一规范裸存储库，因此撤销对规范项目名称的读取访问权限或删除所有者规则无法在缓存有效性窗口期间逐出缓存的别名 ProjectState，从而允许读取新创建的私有提交或写入 refs/meta/config。此问题已在 Gerrit Code Review 版本 3.12.10、3.13.9 和 3.14.3 中修复。", "effects": [{"comp_name": "Gerrit", "ecosystem": "linux", "versions": [{"affected_version": "(3.13.0,3.13.9)", "min_fixed_version": "3.13.9", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(3.14.0,3.14.3)", "min_fixed_version": "3.14.3", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(2.16.0,3.12.10)", "min_fixed_version": "3.12.10", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-09-25", "level": "High", "mps_id": "MPS-0cv3-5npd", "poc": false, "poc_url": [], "published_time": "2026-09-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-0cv3-5npd", "name": "https://www.oscs1024.com/hd/MPS-0cv3-5npd"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-87720", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-87720"}, {"url": "https://issues.gerritcodereview.com/issues/538883789", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-87720漏洞", "_translated": true, "_saved_at": "2026-09-25T01:06:19+00:00", "_first_saved_at": "2026-09-24T22:55:33+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-0cv3-5npd"}]}</script>
  <script>
    const payload = JSON.parse(document.getElementById("payload").textContent);
    const levelLabels = payload.level_labels || {};
    const items = payload.items || [];
    let filtered = items.slice();
    let activeId = null;

    const $ = (id) => document.getElementById(id);
    $("generatedAt").textContent = payload.generated_at || "-";
    $("retention").textContent = payload.retention_days ?? "-";
    $("cutoff").textContent = payload.cutoff_date || "-";
    $("count").textContent = String(payload.count ?? items.length);

    function levelClass(level) {
      const cn = levelLabels[level] || level || "";
      if (level === "Critical" || cn === "严重") return "crit";
      if (level === "High" || cn === "高危") return "high";
      return "other";
    }
    function levelText(level) {
      return levelLabels[level] || level || "-";
    }
    function esc(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }
    function scoreText(v) {
      if (v === null || v === undefined || v === "" || v === -1) return "-";
      return String(v);
    }

    function renderList() {
      const list = $("list");
      $("listCount").textContent = String(filtered.length);
      if (!filtered.length) {
        list.innerHTML = '<div class="empty">没有匹配项</div>';
        return;
      }
      list.innerHTML = filtered.map((it) => {
        const id = it.mps_id || it.cve_id;
        const active = id === activeId ? " active" : "";
        return `
          <button class="item${active}" data-id="${esc(id)}" type="button">
            <div class="item-top">
              <span class="cve">${esc(it.cve_id || it.mps_id || "-")}</span>
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
            </div>
            <div class="title">${esc(it.title || "-")}</div>
            <div class="item-foot">
              <span>CVSS ${esc(scoreText(it.cvss_score))}</span>
              <span>${esc(it.published_time || "-")}</span>
              ${it.poc ? "<span>POC</span>" : ""}
            </div>
          </button>`;
      }).join("");
      list.querySelectorAll(".item").forEach((btn) => {
        btn.addEventListener("click", () => selectById(btn.dataset.id));
      });
    }

    function refsHtml(it) {
      const refs = Array.isArray(it.reference_url_list) ? it.reference_url_list : [];
      const links = [];
      if (it._source_page) links.push({ url: it._source_page, name: "OSCS 详情" });
      if (it.cve_id) links.push({ url: `https://nvd.nist.gov/vuln/detail/${it.cve_id}`, name: "NVD" });
      refs.forEach((r) => {
        if (r && r.url) links.push({ url: r.url, name: r.name || r.url });
      });
      const seen = new Set();
      const uniq = [];
      for (const l of links) {
        if (seen.has(l.url)) continue;
        seen.add(l.url);
        uniq.push(l);
      }
      if (!uniq.length) return '<div class="box">无参考链接</div>';
      return `<div class="refs">${uniq.map((l) =>
        `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name || l.url)}</a>`
      ).join("")}</div>`;
    }

    function articlesHtml(it) {
      const arts = Array.isArray(it.articles) ? it.articles : [];
      if (!arts.length) return "";
      return `<div class="section"><h3>相关说明</h3>${arts.map((a) => `
        <div class="article">
          <h4>${esc(a.title || "说明")}</h4>
          <p>${esc(a.content || "")}</p>
        </div>`).join("")}</div>`;
    }

    function renderDetail(it) {
      const detail = $("detail");
      if (!it) {
        detail.innerHTML = '<div class="empty">暂无数据</div>';
        return;
      }
      const pocUrls = Array.isArray(it.poc_url) ? it.poc_url : [];
      detail.innerHTML = `
        <div class="d-head">
          <div>
            <h1 class="d-title">${esc(it.title || "-")}</h1>
            <div class="ids">
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
              <span class="chip">${esc(it.cve_id || "无 CVE")}</span>
              <span class="chip">${esc(it.mps_id || "-")}</span>
              ${it.poc ? '<span class="chip">有 POC</span>' : ""}
              ${it.exp ? '<span class="chip">有 EXP</span>' : ""}
            </div>
          </div>
          <div class="actions">
            ${it._source_page ? `<a class="btn" href="${esc(it._source_page)}" target="_blank" rel="noopener">OSCS</a>` : ""}
            ${it.cve_id ? `<a class="btn" href="https://nvd.nist.gov/vuln/detail/${esc(it.cve_id)}" target="_blank" rel="noopener">NVD</a>` : ""}
          </div>
        </div>
        <div class="grid">
          <div class="stat"><div class="k">CVSS</div><div class="v">${esc(scoreText(it.cvss_score))}</div></div>
          <div class="stat"><div class="k">向量</div><div class="v">${esc(it.cvss_vector || "-")}</div></div>
          <div class="stat"><div class="k">CWE</div><div class="v">${esc(it.cwe || "-")}</div></div>
          <div class="stat"><div class="k">类型</div><div class="v">${esc(it.kind || it.kind_en || "-")}</div></div>
          <div class="stat"><div class="k">公开</div><div class="v">${esc(it.published_time || "-")}</div></div>
          <div class="stat"><div class="k">利用成本</div><div class="v">${esc(it.exploit_requirement_cost || "-")}</div></div>
          <div class="stat"><div class="k">可利用性</div><div class="v">${esc(it.exploitability || "-")}</div></div>
          <div class="stat"><div class="k">修复建议</div><div class="v">${esc(it.fix_suggestion || "-")}</div></div>
        </div>
        <div class="section"><h3>描述</h3><div class="box">${esc(it.description || "无描述")}</div></div>
        ${it.scope_influence ? `<div class="section"><h3>影响范围</h3><div class="box">${esc(it.scope_influence)}</div></div>` : ""}
        ${pocUrls.length ? `<div class="section"><h3>POC 链接</h3><div class="refs">${pocUrls.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join("")}</div></div>` : ""}
        <div class="section"><h3>参考链接</h3>${refsHtml(it)}</div>
        ${articlesHtml(it)}
      `;
    }

    function selectById(id) {
      const it = filtered.find((x) => (x.mps_id || x.cve_id) === id) ||
                 items.find((x) => (x.mps_id || x.cve_id) === id);
      if (!it) return;
      activeId = it.mps_id || it.cve_id;
      renderList();
      renderDetail(it);
      const btn = document.querySelector(`.item[data-id="${CSS.escape(activeId)}"]`);
      if (btn) btn.scrollIntoView({ block: "nearest" });
      history.replaceState(null, "", "#" + encodeURIComponent(activeId));
    }

    function applyFilter(q) {
      const query = (q || "").trim().toLowerCase();
      filtered = !query ? items.slice() : items.filter((it) => {
        const blob = [
          it.cve_id, it.mps_id, it.title, it.kind, it.kind_en, it.cwe, it.description, it.level
        ].map((x) => String(x || "").toLowerCase()).join(" ");
        return blob.includes(query);
      });
      renderList();
      if (filtered.length) {
        const still = filtered.some((x) => (x.mps_id || x.cve_id) === activeId);
        selectById(still ? activeId : (filtered[0].mps_id || filtered[0].cve_id));
      } else {
        activeId = null;
        renderDetail(null);
      }
    }

    $("search").addEventListener("input", (e) => applyFilter(e.target.value));

    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement !== $("search")) {
        e.preventDefault();
        $("search").focus();
        return;
      }
      if (!filtered.length) return;
      const idx = filtered.findIndex((x) => (x.mps_id || x.cve_id) === activeId);
      if (e.key === "ArrowDown") {
        e.preventDefault();
        const next = filtered[Math.min(filtered.length - 1, Math.max(0, idx) + 1)];
        selectById(next.mps_id || next.cve_id);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        const prev = filtered[Math.max(0, idx - 1)];
        selectById(prev.mps_id || prev.cve_id);
      }
    });

    const hashId = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    if (hashId && items.some((x) => (x.mps_id || x.cve_id) === hashId)) {
      activeId = hashId;
      renderList();
      selectById(hashId);
    } else if (items.length) {
      selectById(items[0].mps_id || items[0].cve_id);
    } else {
      renderList();
      renderDetail(null);
    }
  </script>
</body>
</html>
