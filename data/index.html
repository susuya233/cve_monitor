      min-height: 70vh;

      padding: 12px;
      background: transparent;
      color: inherit;

.gov/vuln/detail/CVE-2025-41769", "name": "https://nvd.nist.gov/vuln/detail/CVE-2025-41769"}, {"url": "https://phoenixcontact.csaf-tp.certvde.com/.well-known/csaf/white/2026/vde-2025-056.json", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2025-41769漏洞", "_translated": true, "_saved_at": "2026-08-12T12:54:56+00:00", "_first_saved_at": "2026-08-12T09:06:49+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-s4gt-j213"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-66659", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:N/A:L", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:N/A:L", "cwe": "CWE-89", "description": "Essekia Tablesome 表中 SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）漏洞允许盲 SQL 注入。\n\n此问题影响 Tablesome 表：从 n/a 到 1.2.9。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-08-12", "level": "Critical", "mps_id": "MPS-xov5-icaq", "poc": false, "poc_url": [], "published_time": "2026-08-12", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-xov5-icaq", "name": "https://www.oscs1024.com/hd/MPS-xov5-icaq"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-66659", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-66659"}, {"url": "https://patchstack.com/database/wordpress/plugin/tablesome/vulnerability/wordpress-tablesome-plugin-1-2-9-sql-injection-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-66659漏洞", "_translated": true, "_saved_at": "2026-08-12T12:54:59+00:00", "_first_saved_at": "2026-08-12T09:06:51+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-xov5-icaq"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2026-59500", "cvss": {"cvssv31": [{"source": "cna@cyber.gov.il", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:N", "severity": "critical", "base_score": 10}]}, "cvss_score": 10, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:N", "cwe": "CWE-287", "description": "CWE-287：身份验证不当", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement [], "title": "CVE-2026-73299漏洞", "_translated": true, "_saved_at": "2026-08-12T18:54:19+00:00", "_first_saved_at": "2026-08-12T18:54:19+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-woav-pk9s"}, {"analysis_status": 0, "articles": [{"content": "应用程序在处理用户输入时的不完善或缺乏验证机制，所以攻击者能够通过向应用程序发送恶意输入，利用应用程序对输入数据的错误处理方式来注入自己的恶意代码。这些恶意代码会被应用程序误认为是合法的指令或数据，并在执行过程中被执行。", "title": "什么是代码注入"}, {"content": "应用程序使用可执行动态代码的函数来执行用户可控的参数，当应用程序对于用户输入过滤不完全时，攻击者可以注入恶意代码并控制代码执行流程。", "title": "代码注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对所有用户输入进行验证和过滤，确保只接受预期的有效输入。这包括对输入数据进行输入长度验证、类型检查和格式验证等。\r\n- 使用参数化查询或预编译语句：对于数据库查询操作，应该使用参数化查询或预编译语句，确保输入数据不会被误认为是执行代码。\r\n- 最小特权原则：应用程序在执行操作系统命令或动态代码时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。\r\n- 安全编码实践：开发人员应该采用安全编码实践，包括避免使用eval函数、避免拼接用户输入的字符串作为代码执行等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止代码注入攻击。", "title": "如何预防代码注入"}], "cnvd_id": "", "cve_id": "CVE-2026-73268", "cvss": {"cvssv31": [{"source": "secalert@redhat.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.9}]}, "cvss_score": 9.9, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "cwe": "CWE-94", "description": "多集群引擎 (MCE) 的集群管理器控制器组件中发现了一个缺陷。对 ClusterCurator 资源具有创建或更新权限的租户可以注入任意作业规范。这是可能的，因为 CreateJob() 函数在解组 spec.install.overrideJob 原始扩展时不会验证用户控制的输入。成功利用该漏洞允许注入的作业以控制器提升的权限运行，从而导致任意代码执行和权限升级，从而可能访问集群范围的秘密。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "代码注入", "kind_en": "代码生成控制不当（“代码注入”）", "last_modified_time": "2026-08-13", "level": "Critical", "mps_id": "MPS-01zh-6a29", "poc": false, "poc_url": [], "published_time": "2026-08-13", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-01zh-6a29", "name": "https://www.oscs1024.com/hd/MPS-01zh-6a29"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73268", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73268"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-73268", "name": ""}, {"url": "https://bugzilla.redhat.com/show_bug.cgi?id=2514219", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-73268漏洞", "_translated": true, "_saved_at": "2026-08-12T20:48:34+00:00", "_first_saved_at": "2026-08-12T20:48:34+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-01zh-6a29"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-73294", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.9}]}, "cvss_score": 9.9, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "cwe": "CWE-88", "description": "Semaphore UI 是一个用于管理 DevOps 工具的 Web 界面。在 2.18.17 和 2.19.5-beta2 之前，存储库 git_url 处理通过 POST /api/project/{id}/repositories 和计划的提交哈希轮询将攻击者控制的 --upload-pack 选项传递给 CmdGitClient.GetLastRemoteCommitHash，允许项目经理或所有者在 Semaphore 服务器进程中执行任意操作系统命令。此问题已在版本 2.18.17 和 2.19.5-beta2 中修复。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "参数注入或修改", "kind_en": "命令中参数分隔符的不正确中和（“参数注入”）", "last_modified_time": "2026-08-13", "level": "Critical", "mps_id": "MPS-v6ax-qnps", "poc": false, "poc_url": [], "published_time": "2026-08-13", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-v6ax-qnps", "name": "https://www.oscs1024.com/hd/MPS-v6ax-qnps"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73294", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73294"}, {"url": "https://github.com/semaphoreui/semaphore/commit/7e8a9434bd81b82cf42220151c74801ea97542d6", "name": ""}, {"url": "https://github.com/semaphoreui/semaphore/commit/a7a7a33a64aea382a0726b3722856f298663eacf", "name": ""}, {"url": "https://github.com/semaphoreui/semaphore/security/advisories/GHSA-xp7j-h7jc-4w8p", "name": ""}, {"url": "https://github.com/semaphoreui/semaphore/tree/v2.18.17", "name": ""}, {"url": "https://github.com/semaphoreui/semaphore/tree/v2.19.5-beta2", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-73294漏洞", "_translated": true, "_saved_at": "2026-08-12T17:54:37+00:00", "_first_saved_at": "2026-08-12T17:54:37+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-v6ax-qnps"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "cnvd_id": "", "cve_id": "CVE-2026-73269", "cvss": {"cvssv31": [{"source": "secalert@redhat.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.9}]}, "cvss_score": 9.9, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "cwe": "CWE-269", "description": "在 cluster-curator-controller 组件中发现了一个缺陷。本地用户通过创建具有特定命名约定的 ClusterCurator 资源，可以触发集群范围的 ClusterRoleBinding 的创建。这允许用户将其权限从命名空间本地访问升级到集群范围的控制。此权限升级授予广泛的权限，包括访问和操作机密、管理集群操作以及删除托管集群或节点池的能力。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-08-13", "level": "Critical", "mps_id": "MPS-yw7g-k03c", "poc": false, "poc_url": [], "published_time": "2026-08-13", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-yw7g-k03c", "name": "https://www.oscs1024.com/hd/MPS-yw7g-k03c"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73269", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73269"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-73269", "name": ""}, {"url": "https://bugzilla.redhat.com/show_bug.cgi?id=2514220", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-73269漏洞", "_translated": true, "_saved_at": "2026-08-12T20:48:35+00:00", "_first_saved_at": "2026-08-12T20:48:35+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-yw7g-k03c"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-49819", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-862", "description": "UpSnap 是一款局域网唤醒网络应用程序。版本 4.4.1 到 5.3.5 容易受到 `pb.HandlerInitSuperuser` (`backend/pb/handlers.go:249`) 中缺少身份验证/权限升级链的影响，可通过 `POST /api/upsnap/init-superuser` 访问。易受攻击的代码缺乏任何身份验证、设置令牌、IP 允许列表或速率限制，并且仅通过“totalSuperusers \u003e 0”计数检查（每次全新安装时都会出现错误）进行控制，从而允许未经身份验证的网络相邻攻击者注册初始超级用户帐户，接收长期存在的 JWT，并在“backend/networking/wake.go:43”（“exec.CommandContext(ctx, “/bin/sh”、“-c”、wake_cmd)`)。 5.4.0 版本修复了该问题。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-08-13", "level": "Critical", "mps_id": "MPS-qvut-kio8", "poc": false, "poc_url": [], "published_time": "2026-08-13", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-qvut-kio8", "name": "https://www.oscs1024.com/hd/MPS-qvut-kio8"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-49819", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-49819"}, {"url": "https://github.com/seriousm4x/UpSnap/releases/tag/5.4.0", "name": ""}, {"url": "https://github.com/seriousm4x/UpSnap/security/advisories/GHSA-w4jr-728f-5jhq", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-49819漏洞", "_translated": true, "_saved_at": "2026-08-13T01:23:36+00:00", "_first_saved_at": "2026-08-13T01:23:36+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-qvut-kio8"}, {"analysis_status": 0, "articles": [{"content": "- 程序未正确处理用户上传的文件，从而导致程序可以读取、处理或存储未经授权的文件\n", "title": "什么是任意文件上传"}, {"content": "- 欺骗攻击：攻击者可以通过发送伪造的文件来欺骗程序，从而导致程序读取、处理或存储未经授权的文件。\n- 文件格式攻击：攻击者可以通过选择特定的文件格式，例如压缩文件或 ZIP 文件，从而利用上传的文件来篡改程序的执行结果或窃取程序中的重要数据。\n", "title": "任意文件上传常见的攻击方式"}, {"content": "- 使用安全文件传输协议 (FTP):使用安全 FTP 协议可以确保上传的文件格式、大小、权限等符合预期，同时可以防止文件读取、篡改或存储漏洞。\n- 使用文件上传过滤器：使用文件上传过滤器可以过滤上传的文件，以确保文件的格式、大小、权限等符合预期，同时可以防止文件读取、篡改或存储漏洞。\n- 使用白名单机制：使用白名单机制可以只允许特定的文件格式、大小、权限等存在的文件上传，从而防止非法文件的上传和攻击。\n- 定期更新和升级程序：定期更新和升级程序可以修复已知的漏洞，并增强程序的安全性。", "title": "如何预防任意文件上传"}], "cnvd_id": "", "cve_id": "CVE-2026-49827", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-434", "description": "WebErpMesv2 是一个工业资源管理和制造执行系统 ​​Web。 1.19 及之前的版本允许任何自行注册的用户通过 HR Expense scan_file 参数上传任意 PHP 文件，从而导致远程执行代码。结合开放注册（无需邀请）和损坏的角色中间件（CheckUserRole 默默吞下 RouteNotFoundException），该链实际上是针对任何默认安装的未经身份验证的 RCE。该问题已在提交 5c54862fa044b363fd2be03d586750e81afd6818 中修复。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "任意文件上传", "kind_en": "危险类型文件无限制上传", "last_modified_time": "2026-08-13", "level": "Critical", "mps_id": "MPS-tk2o-nl1i", "poc": false, "poc_url": [], "published_time": "2026-08-13", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-tk2o-nl1i", "name": "https://www.oscs1024.com/hd/MPS-tk2o-nl1i"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-49827", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-49827"}, {"url": "https://github.com/SMEWebify/WebErpMesv2/commit/5c54862fa044b363fd2be03d586750e81afd6818", "name": ""}, {"url": "https://github.com/SMEWebify/WebErpMesv2/security/advisories/GHSA-chhq-7p67-2ff9", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-49827漏洞", "_translated": true, "_saved_at": "2026-08-13T14:21:14+00:00", "_first_saved_at": "2026-08-13T14:21:14+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-tk2o-nl1i"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-71193", "cvss": {"cvssv31": [{"source": "cve@mitre.org", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:N/I:H/A:H", "severity": "critical", "base_score": 9.6}]}, "cvss_score": 9.6, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:N/I:H/A:H", "cwe": "CWE-863", "description": "在 22.0.1 之前的 OpenStack Designate 中，区域创建检查（_is_subzone、_is_superzone 和重复区域数据库约束）的范围仅限于目标池。经过身份验证的用户可以通过 AttributeFilter 调度程序将区域调度到不同的池，从而创建与另一个租户的区域冲突的重叠区域，从而绕过这些检查。这可以实现跨租户 DNS 劫持（将流量重定向到攻击者控制的 IP）和 DNS 拒绝服务（NODATA 响应）。利用该漏洞需要在scheduler_filters中启用AttributeFilter的多池部署，这是一个非默认但有记录且受支持的自助服务分层配置。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-08-13", "level": "Critical", "mps_id": "MPS-ac6y-nh4x", "poc": false, "poc_url": [], "published_time": "2026-08-13", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ac6y-nh4x", "name": "https://www.oscs1024.com/hd/MPS-ac6y-nh4x"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-71193", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-71193"}, {"url": "https://launchpad.net/bugs/2160533", "name": ""}, {"url": "https://security.openstack.org/ossa/OSSA-2026-034.html", "name": ""}, {"url": "https://www.openwall.com/lists/oss-security/2026/08/11/6", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-71193漏洞", "_translated": true, "_saved_at": "2026-08-13T01:23:40+00:00", "_first_saved_at": "2026-08-13T01:23:40+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ac6y-nh4x"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-73300", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.6}]}, "cvss_score": 9.6, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:H/I:H/A:H", "cwe": "CWE-89", "description": "Budibase 是一个开源低代码平台。在3.40.0之前，Budibase中的MySQL集成组件配置有multipleStatements: true，允许在单个查询中执行多个SQL语句。攻击者可以通过用户输入字段注入恶意 SQL 命令，从而导致数据库完全受损。该漏洞已在 3.40.0 中修复。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-08-13", "level": "Critical", "mps_id": "MPS-s16y-r09k", "poc": false, "poc_url": [], "published_time": "2026-08-13", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-s16y-r09k", "name": "https://www.oscs1024.com/hd/MPS-s16y-r09k"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73300", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73300"}, {"url": "https://github.com/Budibase/budibase/releases/tag/3.40.0", "name": ""}, {"url": "https://github.com/Budibase/budibase/security/advisories/GHSA-q6x4-v3qx-85qw", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-73300漏洞", "_translated": true, "_saved_at": "2026-08-12T18:54:25+00:00", "_first_saved_at": "2026-08-12T18:54:25+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-s16y-r09k"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-49481", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:N", "severity": "critical", "base_score": 9.6}]}, "cvss_score": 9.6, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:N", "cwe": "CWE-78", "description": "UpSnap 是一款局域网唤醒网络应用程序。由于使用 ip 和 mac 字段存在不安全的 shell 命令模板插值，5.4.0 之前的版本在 UpSnap 的设备管理功能中存在操作系统命令注入漏洞。用户控制的值可以插入到wake_cmd和shutdown_cmd模板中，并通过/bin/sh -c (Linux)或cmd /C (Windows)执行，无需清理，从而实现经过身份验证的远程代码执行(RCE)。具有创建或编辑设备权限的低权限用户可以在 UpSnap 托管服务器上执行任意操作系统命令。 5.4.0 版本修复了该问题。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026 A:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.2}]}, "cvss_score": 9.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-150", "description": "### 影响\n\n这会影响 Windows 上使用“escape”和“escapeAll” API 将“shell”显式配置为 CMD 或“true”（默认 shell 为 CMD）的 Shescape 用户。\n\n攻击者可能能够根据原始命令实现 shell 注入。\n\n```javascript\n从“node:child_process”导入* as cp；\n从“shescape”导入 { Shescape }；\n\n// 1.前提条件\n常量选项 = {\n    外壳：“cmd.exe”，\n    // 或者\n    shell: true, // 仅当默认 shell 是 CMD 时\n};\n\n// 2. 有效负载\nconst Payload = \"x) else if a==a (echo y\";\n\n// 3. 用法\nconst shescape = new Shescape(选项);\n让逃逸的Payload；\n\nescapedPayload = shescape.escape(payload);\n// 或者\nescapedPayload = shescape.escapeAll([有效负载]);\n\n// 并且（示例）\nconst result = cp.execSync(`如果定义为 FALSY (echo ${escapedPayload})`, options);\n\n// 4.影响\nconsole.log(结果.toString());\n// 输出“y”而不是“”\n\n````\n\n### 补丁\n\n此错误已在 [v2.1.14] 和 [v3.0.1] 中修复，您现在可以升级到。\n\n如果您已经在使用 Shescape v3，则无需进一步更改。如果您使用的是 Shescape v2，建议升级，因为该版本将于 2026 年 9 月 28 日达到终止状态，请按照[迁移指南]升级到 v3。\n\n对于低于 v2.0.0 的 Shescape 版本，不会发布任何补丁。\n\n### 解决方法\n\n或者，Shescape 的用户可以从不受信任的输入中删除所有“(”和“)”实例。\n\n### 欲了解更多信息\n\n- 对 v2 的 Pull 请求 [#2651] 和 v3 的 [#2649] 进行评论\n- 对 v2 的提交 [b4b34c3] 和 v3 的提交 [43d70b5] 发表评论\n- 在\u003chttps://github.com/ericcornelissen/shescape/issues\u003e打开一个问题（新问题\u003e问题）", "effects": [{"comp_name": "shescape", "ecosystem": "npm", "versions": [{"affected_version": "(-∞,2.1.14)", "min_fixed_version": "2.1.14", "repository": "npm", "solutions": [], "upstream": true}, {"affected_version": "[3.0.0,3.0.1)", "min_fixed_version": "3.0.1", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "转义、元或控制序列转义处理不恰当", "kind_en": "转义、元或控制序列的不正确中和", "last_modified_time": "2026-08-13", "level": "Critical", "mps_id": "MPS-6ofs-4bv8", "poc": false, "poc_url": [], "published_time": "2026-08-13", "reference_url_list": [{"url": "https://github.com/ericcornelissen/shescape/security/advisories/GHSA-w4hw-qcx7-56pr", "name": ""}, {"url": "https://github.com/ericcornelissen/shescape/pull/2649", "name": ""}, {"url": "https://github.com/ericcornelissen/shescape/pull/2651", "name": ""}, {"url": "https://github.com/ericcornelissen/shescape/commit/43d70b59d09bbe5c3fd02ef08b3a123e977ed9de", "name": ""}, {"url": "https://github.com/ericcornelissen/shescape/commit/b4b34c394e7f9da2775bb75381066b9a228c425f", "name": ""}, {"url": "https://github.com/ericcornelissen/shescape/blob/dea8893a5877893d8d4923dbf253080e08899e6d/docs/migration.md", "name": ""}, {"url": "https://github.com/ericcornelissen/shescape/releases/tag/v2.1.14", "name": ""}, {"url": "https://github.com/ericcornelissen/shescape/releases/tag/v3.0.1", "name": ""}, {"url": "https://github.com/advisories/GHSA-w4hw-qcx7-56pr", "name": ""}], "scope_influence": "", "tags": ["npm", "开源", "终端软件"], "title": "Shescape：在 Windows 上使用 CMD 通过未转义括号进行 Shell 注入", "_translated": true, "_saved_at": "2026-08-12T21:38:58+00:00", "_first_saved_at": "2026-08-12T21:38:58+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-6ofs-4bv8"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-73332", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:R/S:C/C:H/I:H/A:N", "severity": "high", "base_score": 8.7}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:A/VC:H/VI:H/VA:N/SC:H/SI:H/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.2}]}, "cvss_score": 9.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:A/VC:H/VI:H/VA:N/SC:H/SI:H/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-89", "description": "CamaleonCMS 在 cama_contact_form 插件中包含一个存储的跨站点脚本漏洞，该漏洞允许低权限的经过身份验证的攻击者通过联系表单编辑端点向 before_html 字段提交未经净化的内容来注入任意 HTML，而该端点缺乏适当的授权控制。攻击者可以将恶意脚本负载持久保存到数据库中，并在加载联系表单时在受害者的浏览器中执行，从而实现 cookie 盗窃、针对管理界面伪造经过身份验证的请求以及查看用户的会话接管。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-08-13", "level": "Critical", "mps_id": "MPS-9h8x-3kil", "poc": false, "poc_url": [], "published_time": "2026-08-13", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-9h8x-3kil", "name": "https://www.oscs1024.com/hd/MPS-9h8x-3kil"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73332", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73332"}, {"url": "https://enrik-m.github.io/posts/Camaleon-CMS-Vulnerabilties/#32-stored-xss-in-contact-form", "name": ""}, {"url": "https://github.com/owen2345/camaleon-cms", "name": ""}, {"url": "https://www.vulncheck.com/advisories/camaleoncms-cama-contact-form-plugin-stored-xss-via-before-html-field", "name": ""}, {"url": "https://enrik-m.github.io/posts/Camaleon-CMS-Vulnerabilties/#32-stored-xss-in-contact-form", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-73332漏洞", "_translated": true, "_saved_at": "2026-08-12T21:39:15+00:00", "_first_saved_at": "2026-08-12T21:39:15+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-9h8x-3kil"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-73329", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:R/S:C/C:H/I:H/A:N", "severity": "high", "base_score": 8.7}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:A/VC:H/VI:H/VA:N/SC:H/SI:H/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.2}]}, "cvss_score": 9.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:A/VC:H/VI:H/VA:N/SC:H/SI:H/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-79", "description": "CamaleonCMS 包含一个存储的跨站点脚本漏洞，该漏洞允许经过身份验证的低权限用户通过在草稿创建期间将未经净化的 HTML 有效负载注入到帖子标题参数中来在管理员浏览器中执行任意 JavaScript。攻击者可以通过草稿创建端点将恶意 HTML 有效负载作为草稿标题提交，该负载会在不转义的情况下保留到数据库中，并随后在管理草稿列表中呈现为原始 HTML，从而导致管理员会话泄露、cookie 盗窃和伪造经过身份验证的请求。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-08-13", "level": "Critical", "mps_id": "MPS-nezu-y928", "poc": false, "poc_url": [], "published_time": "2026-08-13", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-nezu-y928", "name": "https://www.oscs1024.com/hd/MPS-nezu-y928"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73329", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73329"}, {"url": "https://enrik-m.github.io/posts/Camaleon-CMS-Vulnerabilties/#44-stored-xss-via-draft-post-title", "name": ""}, {"url": "https://github.com/owen2345/camaleon-cms", "name": ""}, {"url": "https://www.vulncheck.com/advisories/camaleoncms-stored-xss-via-draft-post-title-creation-endpoint", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-73329漏洞", "_translated": true, "_saved_at": "2026-08-12T21:39:14+00:00", "_first_saved_at": "2026-08-12T21:39:14+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-nezu-y928"}, {"analysis_status": 0, "articles": [{"content": "由于应用程序或系统中存在敏感信息未经适当保护而被泄露给攻击者或未经授权的用户，这些敏感信息可能包括用户凭据、个人身份信息、敏感业务数据、系统配置信息等。信息暴露漏洞通常是由于设计、实施或配置错误引起的，例如不正确的访问控制、弱密码策略、缺乏加密、错误的日志处理等。", "title": "什么是未授权敏感信息泄露"}, {"content": "- 直接访问敏感信息：攻击者可以通过直接访问不正确配置或不受保护的资源来获取敏感信息，如通过公开可访问的URL、未经授权的文件目录访问等。\n- 越权访问：攻击者可能利用访问控制错误或不正确的权限配置来获取他们没有权限访问的敏感信息。\n- 错误信息披露：应用程序在错误处理过程中可能泄露敏感信息，例如将错误消息中的敏感数据返回给客户端或显示在日志文件中。\n- 信息泄露通过响应：攻击者可能利用应用程序在响应中不正确地包含敏感信息，如通过网页源代码、响应头部或响应消息体中的敏感数据。", "title": "未授权敏感信息泄露常见的攻击方式"}, {"content": "- 访问控制：确保只有经过授权的用户能够访问敏感信息，使用强大的身份验证和授权机制。\n- 数据加密：对于敏感信息，使用适当的加密算法对数据进行加密，包括数据传输和存储过程中的加密。\n- 错误处理和日志安全：正确处理错误情况，避免在错误消息中暴露敏感信息。同时，确保日志记录功能的安全性，避免将敏感信息记录在日志文件中。\n- 安全配置和最佳实践：遵循安全最佳实践，对应用程序、服务器和系统进行适当的配置，包括访问控制、权限管理、密码策略等。\n- 审计和监控：实施日志审计和监控机制，及时检测和响应任何异常活动或潜在的信息暴露事件。\n- 安全开发实践：在应用程序开发过程中，进行安全代码审查、漏洞扫描和安全测试，以及敏感信息的正确处理和保护。", "title": "如何预防未授权敏感信息泄露"}], "cnvd_id": "", "cve_id": "CVE-2026-72804", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:N/A:N", "severity": "high", "base_score": 8.6}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:H/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.2}]}, "cvss_score": 9.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:H/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-200", "description": "v3.7.4 之前的 SiYuan 版本无法验证 getGraph 和 getLocalGraph 端点中的发布密码层，从而允许匿名读者检索受密码保护文档的块级内容。攻击者可以调用这些端点，而无需提供密码来读取受保护的文档内容和完整的参考拓扑。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "未授权敏感信息泄露", "kind_en": "向未经授权的行为者泄露敏感信息", "last_modified_time": "2026-08-13", "level": "Critical", "mps_id": "MPS-r4wv-31s0", "poc": false, "poc_ur ope_influence": "", "tags": [], "title": "CVE-2026-59503漏洞", "_translated": true, "_saved_at": "2026-08-13T11:01:23+00:00", "_first_saved_at": "2026-08-13T11:01:23+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-8b0z-mijn"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2026-73501", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N", "severity": "critical", "base_score": 9.1}]}, "cvss_score": 9.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N", "cwe": "CWE-287", "description": "kin-openapi 是一个用于处理 OpenAPI 文件的 Go 项目。在 0.144.0 之前，openapi3filter/validation_handler.go 中的 ValidationHandler.Load() 默默地将 nil AuthenticationFunc 替换为 NoopAuthenticationFunc，后者返回 nil 而不检查凭据。当应用程序依赖 ValidationHandler 作为其执行中间件时，这种替换会导致未经身份验证的请求满足每个 OpenAPI 安全要求。无操作回调可防止到达失败关闭的 ErrAuthenticationServiceMissing 路径，并将请求转发到可能需要 API 密钥、OAuth 令牌或其他安全方案的受保护处理程序。此问题已在版本 0.144.0 中修复。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "身份 ": "https://www.oscs1024.com/hd/MPS-8bli-k04d"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2025-41770", "name": "https://nvd.nist.gov/vuln/detail/CVE-2025-41770"}, {"url": "https://phoenixcontact.csaf-tp.certvde.com/.well-known/csaf/white/2026/vde-2025-056.json", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2025-41770漏洞", "_translated": true, "_saved_at": "2026-08-12T12:54:55+00:00", "_first_saved_at": "2026-08-12T09:06:46+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-8bli-k04d"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-64954", "cvss": {"cvssv31": [{"source": "cve@rapid7.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:C/C:H/I:H/A:N", "severity": "high", "base_score": 8.2}]}, "cvss_score": 8.2, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:C/C:H/I:H/A:N", "cwe": "CWE-862", "description": "Velociraptor 允许通过笔记本中的 VQL 查询来安排新集合。对于计划新收集的用户，他们需要 COLLECT_CLIENT 权限。但是，当用户可以运行重置授权提供程序的 VQL 查询时，不会强制执行此操作。\n\n这允许可以运行任意 VQL 的用户（通常具有“分析师”角色）启动新集合（通常需要“调查员”角色）。此漏洞是从分析师角色升级为调查员角色。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-08-12", "level": "High", "mps_id": "MPS-dfiw-k783", "poc": false, "poc_url": [], "published_time": "2026-08-12", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-dfiw-k783", "name": "https://www.oscs1024.com/hd/MPS-dfiw-k783"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-64954", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-64954"}, {"url": "http://docs.velociraptor.app/announcements/advisories/cve-2026-64954/", "name": ""}, {"url": "https://github.com/Velocidex/velociraptor/commit/d7de958e846d3742a7a3a8538fd463e4f12fc528", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-64954漏洞", "_translated": true, "_saved_at": "2026-08-12T12:55:02+00:00", "_first_saved_at": "2026-08-12T07:15:48+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-dfiw-k783"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过构造恶意的数据，将过多的数据输入到程序的缓冲区中，使得缓冲区的空间被填满，从而溢出到程序的栈 (stack) 或堆 (heap) 中，导致程序崩溃、拒绝服务、数据泄露等安全问题。\n", "title": "什么是经典缓冲区溢出"}, {"content": "| 类型        | 描述                                                         |\n| ----------- | ------------------------------------------------------------ |\n| 代码注入攻击      | 攻击者通过向程序的缓冲区输入恶意代码，从而控制程序执行流程，实现对程序操作的恶意操作。例如，攻击者可以通过向 Web 应用程序的输入框中输入恶意代码，从而执行任意的代码，破坏系统、窃取数据等。 |\n| 数据覆盖攻击      | 攻击者通过向程序的缓冲区输入过多的数据，从而覆盖程序中的重要数据或代码，实现对程序操作的恶意操作。例如，攻击者可以通过向聊天应用程序的输入框中输入过多的表情符号，从而覆盖程序中的重要数据，例如聊天消息、账号密码等。 |\n| 栈溢出攻击 | 攻击者通过向程序的栈中输入过多的数据，从而溢出到栈外部，实现对程序操作的恶意操作。例如，攻击者可以通过向游戏应用程序的输入框中输入过多的道具名称，从而覆盖程序中的重要数据，例如游戏数据、账号密码等。 |\n| 堆溢出攻击       | 攻击者通过向程序的堆中输入过多的数据，从而溢出到堆外部，实现对程序操作的恶意操作。例如，攻击者可以通过向操作系统工具的输入框中输入过多的命令，从而覆盖程序中的重要数据，例如系统文件、配置文件等。 |", "title": "经典缓冲区溢出常见的攻击方式"}, {"content": "- 输入验证：在程序输入处对输入数据进行严格的验证和过滤，确保输入数据符合预期的格式和类型，避免被攻击者注入恶意命令或数据。可以使用正则表达式、格式字符串等方式进行输入验证。\n- 输出过滤：在程序输出处对输出数据进行严格的过滤和检查，确保输出数据符合预期的格式和类型，避免被攻击者截获和篡改。可以使用安全的输出过滤库等方式进行输出过滤。\n- 使用安全的编程模型：使用安全的编程模型，例如避免使用原生的缓冲区管理函数，使用安全的框架和库来处理输入数据和执行命令，避免缓冲区溢出漏洞。\n- 数据库加密和访问控制：对于敏感数据和命令，使用加密和访问控制措施，确保只有授权用户可以访问和执行命令，避免被攻击者窃取和篡改。\n- 定期更新和升级：定期更新和升级应用程序和库的版本，确保应用程序和库的最新版本包含了最新的安全补丁和修复措施，避免安全漏洞的出现和利用。\n- 安全审计和监控：定期对系统和应用程序进行安全审计和监控，及时发现和阻止潜在的安全漏洞和攻击，确保系统和数据的安全和可靠性。", "title": "如何预防经典缓冲区溢出"}], "cnvd_id": "", "cve_id": "CVE-2026-70465", "cvss": {"cvssv31": [{"source": "psirt@fortinet.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.1}]}, "cvss_score": 8.1, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-120", "description": "Fortinet FortiClientWindows 7.4.0 至 7.4.3、FortiClientWindows 7.2.0 至 7.2.11 中存在不检查输入大小的缓冲区复制（“经典缓冲区溢出”）漏洞，可能允许未经身份验证的攻击者更改或制作对目标主机的 DNS 响应，从而通过恶意数据包执行任意代码。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "经典缓冲区溢出", "kind_en": "不检查输入大小的缓冲区复制（“经典缓冲区溢出”）", "last_modified_time": "2026-08-12", "level": "High", "mps_id": "MPS-4vaq-e2y6", "poc": false, "poc_url": [], "published_time": "2026-08-12", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-4vaq-e2y6", "name": "https://www.oscs1024.com/hd/MPS-4vaq-e2y6"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-70465", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-70465"}, {"url": "https://fortiguard.fortinet.com/psirt/FG-IR-26-156", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-70465漏洞", "_translated": true, "_saved_at": "2026-08-12T16:51:49+00:00", "_first_saved_at": "2026-08-12T14:18:04+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-4vaq-e2y6"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-19594", "cvss": {"cvssv31": [{"source": "412d305a-227d-44f9-a262-a31ba44f2aea", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:H/A:H", "severity": "high", "base_score": 8.1}]}, "cvss_score": 8.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:H/A:H", "cwe": "CWE-141", "description": "1.13.0 之前的 Snowflake Python API (`snowflake.core`) 版本中输入清理不足，导致通过两个相关弱点进行混乱的代理权限升级：通过未编码的 `..` 标识符路径段进行路径遍历 (CWE-22)，以及通过查询字符串值中未编码的 `\u0026`/`#`/`=` 字符进行 HTTP 参数污染 (CWE-141)。有权访问基于 Snowflake.core 构建的下游应用程序的攻击者可以通过提供“..”作为对象名称来利用路径遍历，从而导致“snowflake.core”向父资源发出 REST 请求，或者通过将“\u0026”/“#”/“=”注入到自由格式名称字段中来利用参数污染，以覆盖对交换、克隆或重命名操作的限制——所有这些操作都在应用程序的特权会话下执行。成功利用该漏洞需要攻击者控制基于snowflake.core构建的应用程序中的标识符或对象名称字符串，并将其传递到更高权限的Snowflake会话下的“snowflake.core”（例如，EXECUTE AS OWNER存储过程、Streamlit应用程序或本机应用程序）。 Snowflake Python API 版本 1.13.0 中提供了该修复程序，该版本还解决了一些其他安全问题。用户必须手动升级。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "参数分隔符转义处理不恰当", "kind_en": "参数/参数分隔符的不正确中和", "last_modified_time": "2026-08-12", "level": "High", "mps_id": "MPS-lyni-ud47", "poc": false, "poc_url": [], "published_time": "2026-08-12", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-lyni-ud47", "name": "https://www.oscs1024.com/hd/MPS-lyni-ud47"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-19594", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-19594"}, {"url": "https://pypi.org/project/snowflake.core/1.13.0/", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-19594漏洞", "_translated": true, "_saved_at": "2026-08-12T12:55:01+00:00", "_first_saved_at": "2026-08-12T09:06:54+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-lyni-ud47"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2026-18961", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.1}]}, "cvss_score": 8.1, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-287", "description": "WordPress 的社交登录、密码、Magic Link 和电子邮件 OTP – VentraConnect 插件的无密码登录在 1.4.3 及之前的所有版本中都容易通过未经验证的提供商电子邮件绕过身份验证。这是因为插件信任 Spotify 的 /v1/me 端点返回的未经验证的电子邮件字段作为邮箱所有权的证明 - Generic::normalize_common() 将此值复制到规范化配置文件中，而不需要 email_verified 断言，而 User_Links::link_or_login_user() 随后将其直接传递给 get_user_by('email', $email) 并通过 wp_set_auth_cookie() 发出持久身份验证 cookie无需特定于提供商的验证电子邮件门、本地邮箱质询或登录批准步骤。这使得未经身份验证的攻击者可以通过受控的 Spotify OAuth 流程提供已知的目标电子邮件地址，以任何现有 WordPress 用户（包括管理员）身份登录，从而获得对该网站的完全管理访问权限。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "身份验证不当", "kind_en": "认证不当", "last_modified_time": "2026-08-12", "level": "High", "mps_id": "MPS-q6xk-i9n3", "poc": false, "poc_url": [], "published_time": "2026-08-12", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-q6xk-i9n3", "name": "https://www.oscs1024.com/hd/MPS-q6xk-i9n3"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-18961", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-18961"}, {"url": "https://developer.spotify.com/documentation/web-api/reference/get-current-users-profile", "name": ""}, {"url": "https://plugins.svn.wordpress.org/ventraconnect-social-login/tags/1.4.3/includes/class-oauth.php", "name": ""}, {"url": "h 致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-49473", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-863", "description": "Cedar 授权中间件通过 req.originalUrl 匹配 Cedar action，而 Express 仅按 path 路由，导致攻击者可通过追加查询字符串使中间件评估宽松策略而 Express 仍执行受限制路由，从而绕过更严格的访问控制。\n受影响版本中，@cedar-policy/authorization-for-expressjs 在 src/index.ts 的 ExpressAuthorizationMiddleware 类中，getMatchedAction() 方法与 middleware() 方法均以 req.originalUrl 作为 currentUrl 进行 Cedar action 匹配。当应用对 /users 与 /users/{id} 等重叠路径前缀分别定义权限要求不同的 Cedar action 时，发送 GET /users/?x=1 会使中间件把 currentUrl 视为含 ?x=1 的字符串并匹配到 /users/{id} 这条宽松 action，而 Express 仍把请求路由到 /users 受限处理器，导致越权访问。\n修复版本中通过将 getMatchedAction() 与 middleware() 中 currentUrl 的来源从 req.originalUrl 替换为 req.path，使 Cedar action 匹配只依据路径部分而忽略查询字符串，确保中间件评估的 action 与 Express 实际路由的处理器一致，并新增回归测试验证对 /users/?x=1 等请求的拒绝行为。", "effects": [{"comp_name": "@cedar-policy/authorization-for-expressjs", "ecosystem": "npm", "versions": [{"affected_version": "(-∞,0.2.0]", "min_fixed_version": "", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-08-13", "level": "High", "mps_id": "MPS-fgbj-3n5w", "poc": false, "poc_url": [], "published_time": "2026-08-13", "reference_url_list": [{"url": "https://github.com/cedar-policy/authorization-for-expressjs/security/advisories/GHSA-g4w6-vmgf-xqvx", "name": ""}, {"url": "https://github.com/cedar-policy/authorization-for-expressjs/releases/tag/v0.3.0", "name": ""}, {"url": "https://github.com/advisories/GHSA-g4w6-vmgf-xqvx", "name": ""}], "scope_influence": "", "tags": ["npm", "开源"], "title": "Cedar Authorization for Express.js 授权绕过漏洞", "_translated": true, "_saved_at": "2026-08-13T01:23:34+00:00", "_first_saved_at": "2026-08-13T01:23:34+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-fgbj-3n5w"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-44741", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1 nt": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "cnvd_id": "", "cve_id": "CVE-2026-73293", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-269", "description": "Semaphore UI 是一个用于管理 DevOps 工具的 Web 界面。  在 2.18.19 之前以及从 2.19.0-alpha3 到 2.19.5-beta5，ProjectMiddleware 和 GetProjectOrGlobalRoleBySlug 允许项目经理使用 POST /api/project/{id}/roles 创建权限位掩码 15 的自定义经理角色，覆盖内置经理权限并授予 CanUpdateProject 和 CanManageProjectUsers 所有者功能。此问题已在版本 2.18.19 和 2.19.5-beta5 中修复。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-08-13", "level": "High", "mps_id": "MPS-tlc9-82rf", "poc": false, "poc_url": [], "published_time": "2026-08-13", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-tlc9-82rf", "name": "https://www.oscs1024.com/hd/MPS-tlc9-82rf"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73293", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73293"}, {"url": "https://github.com/semaphoreui/semaphore/commit/1c4bb65df114962134f8829d4a03667106a01a68", "name": ""}, {"url": "https://github.com/semaphoreui/semaphore/commit/bb2a4e1f08c8023e618f8dd6eaca73554f2c33bb", "name": ""}, {"url": "https://github.com/semaphoreui/semaphore/releases/tag/v2.18.19", "name": ""}, {"url": "https://github.com/semaphoreui/semaphore/releases/tag/v2.19.5-beta5", "name": ""}, {"url": "https://github.com/semaphoreui/semaphore/security/advisories/GHSA-cxvf-gvfq-36w2", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-73293漏洞", "_translated": true, "_saved_at": "2026-08-12T17:54:28+00:00", "_first_saved_at": "2026-08-12T17:54:28+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-tlc9-82rf"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-49467", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-304", "description": "Pingvin Share X 是一个安全且简单的自托管文件共享平台。版本 1.5.0 到 1.18.0 中存在一个漏洞，允许攻击者在管理基于时间的一次性密码 (TOTP) 设置时绕过密码验证。根本原因是在调用“authTotp.service.ts”中的异步“verifyPassword”方法和“auth.service.ts”中的“authenticateUser”方法时缺少“await”关键字。在 JavaScript 中，未等待的“Promise”总是真实的。因此，逻辑旨在当密码不正确时抛出“ForbiddenException”。它永远不会执行，因为表达式评估“Promise”对象的存在而不是其解析的布尔结果。通过确保正确等待所有异步身份验证调用，该漏洞在版本 1.18.1 中得到修复。没有官方的解决方法。如果用户被锁定，管理员必须在数据库中手动重置用户的 TOTP 状态。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "认证中关键步骤缺失", "kind_en": "缺少身份验证的关键步骤", "last_modified_time": "2026-08-13", "level": "High", "mps_id": "MPS-u2wl-d7p1", "poc": false, "poc_url": [], "published_time": "2026-08-13", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-u2wl-d7p1", "name": "https://www.oscs1024.com/hd/MPS-u2wl-d7p1"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-49467", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-49467"}, {"url": "https://github.com/smp46/pingvin-share-x/security/advisories/GHSA-59q6-jvp6-w282", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-49467漏洞", "_translated": true, "_saved_at": "2026-08-12T18:54:34+00:00", "_first_saved_at": "2026-08-12T18:54:34+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-u2wl-d7p1"}, {"analysis_status": 0, "articles": [{"content": "由于应用程序或系统中存在敏感信息未经适当保护而被泄露给攻击者或未经授权的用户，这些敏感信息可能包括用户凭据、个人身份信息、敏感业务数据、系统配置信息等。信息暴露漏洞通常是由于设计、实施或配置错误引起的，例如不正确的访问控制、弱密码策略、缺乏加密、错误的日志处理等。", "title": "什么是未授权敏感信息泄露"}, {"content": "- 直接访问敏感信息：攻击者可以通过直接访问不正确配置或不受保护的资源来获取敏感信息，如通过公开可访问的URL、未经授权的文件目录访问等。\n- 越权访问：攻击者可能利用访问控制错误或不正确的权限配置来获取他们没有权限访问的敏感信息。\n- 错误信息披露：应用程序在错误处理过程中可能泄露敏感信息，例如将错误消息中的敏感数据返回给客户端或显示在日志文件中。\n- 信息泄露通过响应：攻击者可能利用应用程序在响应中不正确地包含敏感信息，如通过网页源代码、响应头部或响应消息体中的敏感数据。", "title": "未授权敏感信息泄露常见的攻击方式"}, {"content": "- 访问控制：确保只有经过授权的用户能够访问敏感信息，使用强大的身份验证和授权机制。\n- 数据加密：对于敏感信息，使用适当的加密算法对数据进行加密，包括数据传输和存储过程中的加密。\n- 错误处理和日志安全：正确处理错误情况，避免在错误消息中暴露敏感信息。同时，确保日志记录功能的安全性，避免将敏感信息记录在日志文件中。\n- 安全配置和最佳实践：遵循安全最佳实践，对应用程序、服务器和系统进行适当的配置，包括访问控制、权限管理、密码策略等。\n- 审计和监控：实施日志审计和监控机制，及时检测和响应任何异常活动或潜在的信息暴露事件。\n- 安全开发实践：在应用程序开发过程中，进行安全代码审查、漏洞扫描和安全测试，以及敏感信息的正确处理和保护。", "title": "如何预防未授权敏感信息泄露"}], "cnvd_id": "", "cve_id": "CVE-2026-73622", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "high", "base_score": 7.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE- we": "CWE-639", "description": "Microsoft 容器迁移解决方案加速器是一个多服务应用程序，提供多代理、AI 驱动的迁移解决方案，用于将容器服务配置迁移到 Azure Kubernetes 服务。在版本 2.1.2 及更早版本中，容器迁移解决方案加速器中发现了一个安全漏洞，特别是经过身份验证的 IDOR（不安全的直接对象引用），该漏洞允许用户读取、写入和删除属于其他经过身份验证的用户的进程。该问题影响多个 API 端点，其中缺少所有权检查，从而导致同一组织内的用户之间的迁移数据未经授权的访问和修改。该漏洞存在于进程和文件管理 API 中，应用程序依赖 Entra ID 身份验证，但缺乏用户之间适当的授权控制。经过身份验证的用户无需进行适当的授权检查即可访问、修改和删除属于其他用户的进程和文件。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "通过用户控制密钥绕过授权机制", "kind_en": "通过用户控制的密钥绕过授权", "last_modified_time": "2026-08-13", "level": "High", "mps_id": "MPS-g7fs-ojed", "poc": false, "poc_url": [], "published_time": "2026-08-13", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-g7fs-ojed", "name": "https://www.oscs1024.com/hd/MPS-g7fs-ojed"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73298", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73298"}, {"url": "https://github.com/microsoft/Container-Migration-Solution-Accelerator/security/advisories/GHSA-27mc-pccp-3x2x", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-73298漏洞", "_translated": true, "_saved_at": "2026-08-12T18:54:28+00:00", "_first_saved_at": "2026-08-12T18:54:28+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-g7fs-ojed"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-73625", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-78", "description": "3.1.54 之前的 GitPython 版本在 check_unsafe_options 防护中包含远程代码执行漏洞，可以通过在单字符 kwarg 值中走私 git 选项来绕过该漏洞。攻击者可以向 clone_from、fetch、pull、push、ls_remote、iter_commits、blame 或 archive 方法提供精心设计的选项字典，以通过 --upload-pack 参数执行任意操作系统命令。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-08-13", "level": "High", "mps_id": "MPS-ilay-35eg", "poc": false, "poc_url": [], "published_time": "2026-08-13", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ilay-35eg", "name": "https://www.oscs1024.com/hd/MPS-ilay-35eg"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73625", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73625"}, {"url": "https://github.com/gitpython-developers/GitPython/security/advisories/GHSA-r9mr-m37c-5fr3", "name": ""}, {"url": "https://www.vulncheck.com/advisories/gitpython-before-remote-code-execution-via-kwarg-value-smuggling", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-73625漏洞", "_translated": true, "_saved_at": "2026-08-13T12:56:33+00:00", "_first_saved_at": "2026-08-13T12:56:33+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ilay-35eg"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-73327", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:H/UI:R/S:C/C:H/I:H/A:H", "severity": "high", "base_score": 7.6}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:H/AT:N/PR:H/UI:A/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:H/AT:N/PR:H/UI:A/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-22", "description": "Joomla 6.1.1 在 com_joomlaupdate 扩展中包含一个路径遍历漏洞，该漏洞允许超级用户提取精心制作的存档，其中包含 ZIP 条目文件名中的目录遍历序列或绝对路径。攻击者可以向 extract.php 提取例程提供带有父目录段或绝对路径的恶意 ZIP 条目名称，导致文件写入预期目标根目录之外，并通过植入的 PHP 文件实现持久远程代码执行。", "effects": [], "ep 且每个连接都会在挂起的映射中进行跟踪。无限制的 goroutine 和映射增长会耗尽 etcd 进程中的内存，导致 etcd 集群（以及当 etcd 支持 Kubernetes 时，控制平面）的可用性丧失。\n\n### 补丁\n_问题解决了吗？用户应该升级到什么版本？_\n\n该漏洞已在以下版本中修复：\n\n-etcd 3.7.1\n-etcd 3.6.14\n-etcd 3.5.33\n\n### 解决方法\n_用户有没有办法在不升级的情况下修复或修复该漏洞？_\n\n如果无法立即升级，则限制网络访问。通过防火墙规则或网络策略限制哪些主机可以到达 etcd 的客户端 (gRPC) 端口，从而减少可以尝试利用的人。\n\n### 记者\n\nVMware 博通", "effects": [{"comp_name": "go.etcd.io/etcd/v3", "ecosystem": "go", "versions": [{"affected_version": "[3.6.0,3.6.14)", "min_fixed_version": "3.6.14", "repository": "go", "solutions": [], "upstream": true}, {"affected_version": "[3.5.0,3.5.33)", "min_fixed_version": "3.5.33", "repository": "go", "solutions": [], "upstream": true}, {"affected_version": "[3.7.0-alpha.0,3.7.1)", "min_fixed_version": "3.7.1", "repository": "go", "solutions": [], "upstream": true}, {"affected_version": "[v3.6.0,v3.6.14)", "min_fixed_version": "v3.6.14", "repository": "go", "solutions": [], "upstream": true}, {"affected_version": "(-∞,v3.5.33)", "min_fixed_version": "v3.5.33", "repository": "go", "solutions": [], "upstream": true}, {"affected_version": "[v3.7.0-alpha.0,v3.7.1)", "min_fixed_version": "v3.7.1", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "不加限制或调节的资源分配", "kind_en": "不受限制或节流地分配资源", "last_modified_time": "2026-08-13", "level": "High", "mps_id": "MPS-ndg4-j7hk", "poc": false, "poc_url": [], "published_time": "2026-08-13", "reference_url_list": [{"url": "https://github.com/etcd-io/etcd/security/advisories/GHSA-6vch-q96h-7gc3", "name": ""}, {"url": "https://github.com/etcd-io/etcd/pull/22130", "name": ""}, {"url": "https://github.com/etcd-io/etcd/commit/2e07efce9745004eb4773cffaada9b5cdf77cff2", "name": ""}, {"url": "https://github.com/etcd-io/etcd/commit/f73cba7d920019f91a1ea1f6697833e42731f057", "name": ""}, {"url": "https://github.com/etcd-io/etcd/releases/tag/v3.5.33", "name": ""}, {"url": nalysis_status": 0, "articles": [{"content": "由于应用程序或系统中存在敏感信息未经适当保护而被泄露给攻击者或未经授权的用户，这些敏感信息可能包括用户凭据、个人身份信息、敏感业务数据、系统配置信息等。信息暴露漏洞通常是由于设计、实施或配置错误引起的，例如不正确的访问控制、弱密码策略、缺乏加密、错误的日志处理等。", "title": "什么是未授权敏感信息泄露"}, {"content": "- 直接访问敏感信息：攻击者可以通过直接访问不正确配置或不受保护的资源来获取敏感信息，如通过公开可访问的URL、未经授权的文件目录访问等。\n- 越权访问：攻击者可能利用访问控制错误或不正确的权限配置来获取他们没有权限访问的敏感信息。\n- 错误信息披露：应用程序在错误处理过程中可能泄露敏感信息，例如将错误消息中的敏感数据返回给客户端或显示在日志文件中。\n- 信息泄露通过响应：攻击者可能利用应用程序在响应中不正确地包含敏感信息，如通过网页源代码、响应头部或响应消息体中的敏感数据。", "title": "未授权敏感信息泄露常见的攻击方式"}, {"content": "- 访问控制：确保只有经过授权的用户能够访问敏感信息，使用强大的身份验证和授权机制。\n- 数据加密：对于敏感信息，使用适当的加密算法对数据进行加密，包括数据传输和存储过程中的加密。\n- 错误处理和日志安全：正确处理错误情况，避免在错误消息中暴露敏感信息。同时，确保日志记录功能的安全性，避免将敏感信息记录在日志文件中。\n- 安全配置和最佳实践：遵循安全最佳实践，对应用程序、服务器和系统进行适当的配置，包括访问控制、权限管理、密码策略等。\n- 审计和监控：实施日志审计和监控机制，及时检测和响应任何异常活动或潜在的信息暴露事件。\n- 安全开发实践：在应用程序开发过程中，进行安全代码审查、漏洞扫描和安全测试，以及敏感信息的正确处理和保护。", "title": "如何预防未授权敏感信息泄露"}], "cnvd_id": "", "cve_id": "CVE-2026-59499", "cvss": {"cvssv31": [{"source": "cna@cyber.gov.il", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:N/A:N", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:N/A:N", "cwe": "CWE-200", "description": "CWE-200：敏感曝光\n向未经授权的行为者提供的信息", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "未授权敏感信息泄露", "kind_en": "向未经授权的行为者泄露敏感信息", "last_modified_time": "2026-08-13", "level": "High", "mps_id": "MPS-ge94-ipl3", "poc": false, "poc_url": [], "published_time": "2026-08-13", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ge94-ipl3", "name": "https://www.oscs1024.com/hd/MPS-ge94-ipl3"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-59499", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-59499"}, {"url": "https://www.gov.il/en/departments/dynamiccollectors/cve_advisories_listing?skip=0", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-59499漏洞", "_translated": true, "_saved_at" rce_page": "https://www.oscs1024.com/hd/MPS-ko0y-x9iw"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，从而导致未授权的用户或资源可以被访问或篡改。", "title": "什么是访问控制不当"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n", "title": "访问控制不当常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防访问控制不当"}], "cnvd_id": "", "cve_id": "CVE-2026-59505", "cvss": {"cvssv31": [{"source": "cna@cyber.gov.il", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:N/A:N", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:N/A:N", "cwe": "CWE-284", "description": "CWE-284：访问控制不当", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "访问控制不当", "kind_en": "访问控制不当", "last_modified_time": "2026-08-13", "level": "High", "mps_id": "MPS-y261-r5go", "poc": false, "poc_url": [], "published_time": "2026-08-13", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-y261-r5go", "name": "https://www.oscs1024.com/hd/MPS-y261-r5go"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-59505", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-59505"}, {"url": "https://www.gov.il/en/departments/dynamiccollectors/cve_advisories_listing?skip=0", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-59505漏洞", "_translated": true, "_saved_at": "2026-08-13T11:01:28+00:00", "_first_saved_at": "2026-08-13T11:01:28+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-y261-r5go"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-71473", "cv lysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，从而导致未授权的用户或资源可以被访问或篡改。", "title": "什么是访问控制不当"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n", "title": "访问控制不当常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防访问控制不当"}], "cnvd_id": "", "cve_id": "CVE-2026-59501", "cvss": {"cvssv31": [{"source": "cna@cyber.gov.il", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:L/A:N", "severity": "high", "base_score": 8.2}]}, "cvss_score": 8.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:L/A:N", "cwe": "CWE-284", "description": "CWE-284：访问控制不当", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "访问控制不当", "kind_en": "访问控制不当", "last_modified_time": "2026-08-13", "level": "High", "mps_id": "MPS-96il-hdoe", "poc": false, "poc_url": [], "published_time": "2026-08-13", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-96il-hdoe", "name": "https://www.oscs1024.com/hd/MPS-96il-hdoe"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-59501", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-59501"}, {"url": "https://www.gov.il/en/departments/dynamiccollectors/cve_advisories_listing?skip=0", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-59501漏洞", "_translated": true, "_saved_at": "2026-08-13T11:01:25+00:00", "_first_saved_at": "2026-08-13T11:01:25+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-96il-hdoe"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-73303", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:C/C:H/I:H/A:N", "severity": "high", "base_score": 8.2}]}, "cvss_score": 8.2, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:C/C:H/I:H/A:N", "cwe": "CWE-639", "description": "## 总结\n\n帐户门户 (`account.budibase.app`) 上的`POST /api/v2/email` 使用客户端提供的 `accountId` 启动电子邮件更改工作流程，该工作流**未针对经过身份验证的会话进行验证**。登录的攻击者提供受害者的“accountId”和他们控制的电子邮件地址；验证码被发送到攻击者的地址，完成工作流程会更改**受害者的**帐户电子邮件。然后，攻击者通过受控地址重置受害者帐户的密码并登录——完全接管帐户，无需受害者交互。\n\n## 漏洞详细信息\n\n端点会话检查“currentEmail”字段（不匹配返回 403），但不强制执行“body.accountId === session.accountId”。帐户门户前端仅提交登录用户自己的 accountId，因此在正常使用中两者始终匹配 - 服务器仅信任正文值。拥有受害者“accountId”的攻击者可以将工作流程指向受害者的帐户，同时传递自己的“currentEmail”以清除会话检查。\n\n这比直接密码重置更强大：“PUT /api/v2/auth/password {email}”已经存在，并且仅在知道受害者的电子邮件时才被控制，但重置链接会发送到帐户上的地址 - 受害者的收件箱，攻击者无法控制该地址。此 IDOR 首先将受害者的电子邮件移动到攻击者控制的收件箱，以便攻击者收到重置链接并设置他们知道的密码。\n\n**accountId 可获取性。** 我们检查了非管理员免费账户可访问的每个端点 - `GET /api/global/users` （任何用户记录中都没有 UUID）、`GET /api/global/auditlogs/search` （没有 accountId 字段）、`GET /api/global/users/invites` （仅代码 + 电子邮件 + 名称）、`GET /api/v2/tenant` （一个租户内部 UUID，而不是用户 accountId），帐户门户前端（仅传递会话自己的 accountId）和所有未经身份验证的端点 - 并且受害者的“accountId”不存在于其中任何一个端点中。攻击者必须通过正常 API 表面以外的其他渠道（支持渠道、屏幕截图、泄漏、事先泄露等）获取 UUID。\n\n## 重现步骤\n\n**设置：** `https://account.budibase.app` 上的两个帐户门户帐户 — 帐户 A（攻击者）和帐户 B（受害者）。从账户 B 的会话中，“GET /api/auth/self”返回“account.accountId”——这是攻击者需要的值。\n\n1. **启动指向受害者 accountId 的电子邮件更改工作流程，newEmail = 攻击者控制。**\n\n``http\nPOST /api/v2/电子邮件 HTTP/1.1\n主机：account.budibase.app\n内容类型：application/json\nCookie：budibase:auth=\u003cACCOUNT_A_JWT\u003e\n\n{\"currentEmail\":\"\u003cACCOUNT_A_EMAIL\u003e\",\"newEmail\":\"attacker-control@example.net\",\"accountId\":\"\u003cVICTIM_ACCOUNT_ID\u003e\"}\n````\n\n响应：`201 Created`，设置 `budibase:change_email:correlationkey` (HttpOnly)、`:instancekey`、`:status`、`:newemail` cookie。即使调用者是账户 A，工作流程也会针对受害者的 accountId 启动。\n\n2. **使用攻击者控制的收件箱中的代码完成更改（或直接从步骤 1 中设置的“correlationkey”cookie 中读取）。**\n\n``http\nPOST /api/v2/email/验证 HTTP/1.1\n主机：account.budibase.app\n内容类型：application/json\nCookie: budibase:auth=\u003cACCOUNT_A_JWT\u003e; budibase:change_email:correlationkey=\u003c代码\u003e; budibase:change_email:instancekey=\u003cKEY\u003e\n\n{\"verificationCode\":\"\u003ccode\u003e\",\"processInstanceKey\":\"\u003ckey\u003e\"}\n````\n\n响应：“200 OK”。受害者的帐户电子邮件现在是“attacker-control@example.net”。\n\n3. **确认更改影响了受害者，而不是调用者（误报控制）。**\n\n- 帐户 A（呼叫者）仍然使用自己的原始电子邮件登录 - 200，未更改。\n- 帐户 B（受害者）的原始电子邮件现已被拒绝 — 403，被锁定。\n- `attacker-control@example.net` 现在登录受害者的帐户 — 200。\n\n4. **接管账户。**\n\n``http\nPUT /api/v2/auth/密码 HTTP/1.1\n主机：account.budibase.app\n内容类型：application/json\n\n{“电子邮件”：“攻击者控制@example.net”}\n````响应：“202 Accepted”，重置链接发送到攻击者自己的收件箱。使用“PUT /api/v2/auth/password/verification”完成重置，然后使用攻击者选择的密码以受害者身份登录。随后“GET /api/auth/self”返回受害者真实的“accountId”和“tenantId”——完全帐户接管，通过真正独立的帐户/租户（不是同一帐户自测试）确认。\n\n## 影响\n\n获得受害者的“accountId”（带外 - 它不会在我们能找到的正常跨用户 API 表面中的任何地方公开）的经过身份验证的帐户门户用户可以接管该受害者的帐户：将登录电子邮件重写到攻击者地址，设置新密码，并访问受害者的租户、应用程序和存储的数据源凭据（REST/SQL/S3 身份验证）。受害者自己的帐户被锁定。一旦 accountId 已知，从初始 IDOR 写入到受害者完全登录的每一步都是确定性的，并且 100% 可靠 - 不需要额外的漏洞或猜测，因为该链只使用平台自己的库存密码重置流程。\n\n## 修复\n\n在开始或完成电子邮件更改工作流程之前，验证正文的“accountId”是否等于经过身份验证的会话的“accountId”（相同的检查已应用于“currentEmail”）。不要信任客户端提供的“accountId”来选择工作流程目标。", "effects": [{"comp_name": "@budibase/server", "ecosystem": "npm", "versions": [{"affected_version": "(-∞,3.38.1]", "min_fixed_version": "", "repository": "npm", "solutions": [], "upstream": true}]}, {"comp_name": "budibase", "ecosystem": "npm", "versions": [{"affected_version": "(-∞,3.40.0)", "min_fixed_version": "3.40.0", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "通过用户控制密钥绕过授权机制", "kind_en": "通过用户控制的密钥绕过授权", "last_modified_time": "2026-08-13", "level": "High", "mps_id": "MPS-joez-4b63", "poc": false, "poc_url": [], "published_time": "2026-08-13", "reference_url_list": [{"url": "https://github.com/Budibase/budibase/s
