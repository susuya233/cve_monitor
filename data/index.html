\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-82119", "cvss": {"cvssv31": [{"source": "hirt@hitachi.co.jp", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-78", "description": "HiRDB 是 Hitachi 开发的商业关系数据库管理系统，为闭源软件，面向企业关键业务场景提供高可用数据库服务，支持 AIX、HP-UX、Solaris、Linux 和 Windows 平台。\n受影响版本中，HiRDB 存在操作系统命令注入漏洞（CWE-78），攻击者可以将恶意内容注入 HiRDB 处理过程中调用的操作系统命令，远程利用无需任何权限与用户交互，成功利用可在数据库服务器上执行任意操作系统命令，导致机密信息泄露、数据被篡改或服务中断。厂商公告未披露受影响的具体功能模块与攻击入口。\n修复版本中通过官方安全更新消除该操作系统命令注入风险，HiRDB Server Version 10 需升级至 10-12-01、10-11-02 或 10-08-05 及之后修订版本，HiRDB Server Version 9、Version 9(32) 及对应附加功能版本需联系 Hitachi 支持服务代表获取相应修复版本。", "effects": [{"comp_name": "HiRDB Server Version 10", "ecosystem": "linux", "versions": [{"affected_version": "[10-00,10-12-01)", "min_fixed_version": "10-12-01", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "HiRDB Server Version 9", "ecosystem": "linux", "versions": [{"affected_version": "[09-00,09-66-22]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "HiRDB Server Version 9(32)", "ecosystem": "linux", "versions": [{"affected_version": "[09-02,09-66-22]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "HiRDB Server with Additional Function Version 9", "ecosystem": "linux", "versions": [{"affected_version": "[  9", "ecosystem": "linux", "versions": [{"affected_version": "[09-00,09-66/V]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "HiRDB Server with Additional Function Version 9(32)", "ecosystem": "linux", "versions": [{"affected_version": "[09-00,09-66-/V]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "栈缓冲区溢出", "kind_en": "基于堆栈的缓冲区溢出", "last_modified_time": "2026-10-27", "level": "Critical", "mps_id": "MPS-wdp3-4neu", "poc": false, "poc_url": [], "published_time": "2026-10-27", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-wdp3-4neu", "name": "https://www.oscs1024.com/hd/MPS-wdp3-4neu"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-82122", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-82122"}, {"url": "https://www.hitachi.com/products/it/software/security/info/vuls/hitachi-sec-2026-144/index.html", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "HiRDB 栈缓冲区溢出漏洞", "_translated": true, "_saved_at": "2026-10-27T11:25:06+00:00", "_first_saved_at": "2026-10-27T11:25:06+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-wdp3-4neu"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-86577", "cvss": {"cvssv31": [{"source": "hirt@hitachi.co.jp", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:L", "severity": "critical", "base_score": 9.4}]}, "cvss_score": 9.4, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:L", "cwe": "CWE-787", "description": "日立 JP1/Base 是闭源商业基础组件，为 JP1 集成管理与作业管理产品提供共用能力。JP1/Integrated Management 3 - Manager 以及 JP1/Automatic Job Management System 3 的 Manager、Agent 和 Agent Minimal Edition 因内置 JP1/Base 受到同一问题影响。\n受影响版本中，JP1/Base 存在越界写入缺陷。CNA 评定该问题可通过网络在无需权限、无需用户交互且攻击复杂度低的条件下触发，机密性与完整性影响为高，可用性影响为低。公开材料未披露写入点所在函数、长度检查或具体输入字段。\n修复版本中通过发布已修复的 JP1/Base 组件更新消除该越界写入。JP1/Integrated Management 3 - Manager、JP1/Automatic Job Management System 3 - Manager、Windows 与 Linux 上的 Agent 及 Agent Minimal Edition 的修复版本为 13-50-31，AIX 上的 Agent 修复版本为 13-10-31，JP1/Base 的修复版本为 12-50-54 与 11-50-36。", "effects": [{"comp_name": "JP1/Automatic Job Management System 3 - Agent", "ecosystem": "linux", "versions": [{"affected_version": "[13-50,13-50-04]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[13-00,13-00-06]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[13-10,13-10-06]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "JP1/Automatic Job Management System 3 - Agent Minimal Edition", "ecosystem": "linux", "versions": [{"affected_version": "[13-50,13-50-02]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[13-10,13-10-06]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[13-00,13-00-06]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "JP1/Automatic Job M a2"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-86575", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-86575"}, {"url": "https://www.hitachi.com/products/it/software/security/info/vuls/hitachi-sec-2026-155/index.html", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "JP1栈缓冲区溢出", "_translated": true, "_saved_at": "2026-10-27T11:25:07+00:00", "_first_saved_at": "2026-10-27T11:25:07+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-zejd-19a2"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-93857", "cvss": {"cvssv4": [{"source": "5d1c2695-1a31-4499-88ae-e847036fd7e3", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.2}]}, "cvss_score": 9.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-787", "description": "WatchGuard Fireware OS 是 WatchGuard Firebox 防火墙与统一威胁管理设备使用的闭源操作系统，SIP proxy 用于按防火墙策略处理 SIP 会话流量。\n受影响版本中，SIP proxy 在处理经由已启用 SIP proxy 的策略传入的远程请求时存在栈缓冲区溢出。远程且未认证的攻击者可借此在设备上执行任意代码。厂商将该问题归类为 CWE-120、CWE-121 与 CWE-787，并说明只有 Firebox 上配置了 SIP proxy 时才具备暴露条件。公开资料未披露具体源码路径或函数。\n修复版本中通过发布 Default 平台的 Fireware OS 2026.4 与 12.12.4，以及 T15/T35 平台的 12.5.22，结束对应受影响区间。厂商未公开补丁差异与修复 commit，无法确认 SIP proxy 内部改动。", "effects": [{"comp_name": "fireware", "ecosystem": "linux", "versions": [{"affected_version": "[12.0,12.12.4)", "min_fixed_version": "12.12.4", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[2025.1,2026.4)", "min_fixed_version": "2026.4", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[12.0,12.5.22)", "min_fixed_version": "12.5.22", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-10-28", "level": "Critical", "mps_id": "MPS-nxae-0lfv", "poc": false, "poc_url": [], "published_time": "2026-10-28", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-nxae-0lfv", "name": "https://www.oscs1024.com/hd/MPS-nxae-0lfv"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-93857", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-93857"}, {"url": "https://psirt.watchguard.com/CVE-2026-93857", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Fireware SIP栈溢出", "_translated": true, "_saved_at": "2026-10-27T17:14:36+00:00", "_first_saved_at": "2026-10-27T17:14:36+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-nxae-0lfv"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用 es": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-116067", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:L/A:N", "severity": "high", "base_score": 8.2}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:L/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:L/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-22", "description": "Paisa 是一个使用 Go 编写的开源（AGPL-3.0）个人财务管理工具，通过 Web 界面管理 ledger 记账文件与表格，提供资产负债、现金流等报表展示。\n受影响版本中，/api/editor/file、/api/editor/file/delete_backups、/api/sheets/file、/api/sheets/file/delete_backups 接口对应的 GetFile、DeleteBackups、GetSheet、DeleteSheetBackups 处理函数直接使用 filepath.Join(dir, file.Name) 拼接客户端提交的文件名，缺少同文件 SaveFile 已有的 BuildSubPath 路径边界校验，name 参数携带 ../ 序列可越出期刊目录，经 readLedgerFile 执行 os.ReadFile 读取服务器进程可访问的任意文件；DeleteBackups 与 DeleteSheetBackups 还通过 filepath.Glob 匹配并以 os.Remove 删除期刊或表格目录之外的 *.backup.* 备份文件。默认部署未配置 user_accounts 时 TokenAuthMiddleware 不做认证，攻击者无需凭据可远程利用。\n修复版本中通过在四个处理函数中调用 utils.BuildSubPath 校验文件名未越出基准目录，非法名称直接返回 Invalid file name，并新增 utils.Glob 使用 regexp.QuoteMeta 固定字面文件名后基于 os.DirFS 在目录内匹配备份文件，切断了路径穿越读取与任意备份删除链路。", "effects": [{"comp_name": "paisa", "ecosystem": "linux", "versions": [{"affected_version": "[0,0.7.8)", "min_fixed_version": "0.7.8", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-10-25", "level": "High", "mps_id": "MPS-3ci5-8kbf", "poc": false, "poc_url": [], "published_time": "2026-10-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-3ci5-8kbf", "name": "https://www.oscs1024.com/hd/MPS-3ci5-8kbf"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-116067", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-116067"}, {"url": "https://github.com/ananthakumaran/paisa/issues/420", "name": "GitHub Issue #420"}, {"url": "https://github.com/ananthakumaran/paisa", "name": ""}, {"url": "https://github.com/ananthakumaran/paisa/blob/v0.7.7/internal/server/editor.go#L49-L70", "name": ""}, {"url": "https://github.com/ananthakumaran/paisa/commit/035949351f7c0d0f90ecf767aa1e28b4d5a0ae31", "name": ""}, {"url": "https://github.com/ananthakumaran/paisa/releases/tag/v0.7.8", "name": "v0.7.8 Release Notes"}, {"url": "https://www.vulncheck.com/advisories/paisa-before-0.7.8-path-traversal-via-editor-and-sheet-api", "name": "VulnCheck Advisory: Paisa before 0.7.8 Path Traversal via Editor and Sheet API"}], "scope_influence": "", "tags": ["应用软件"], "title": "Paisa 路径穿越漏洞", "_translated": true, "_saved_at": "2026-10-25T13:30:22+00:00", "_first_saved_at": "2026-10-25T13:30:22+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-3ci5-8kbf"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-116211", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:L/A:N", "severity": "high", "base_score": 8.2}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:L/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:L/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-89", "description": "YesWiki 是一个基于 PHP 与 MySQL/MariaDB 的开源维基和协作建站系统（AGPL-3.0 许可），其 Bazar 模块提供表单定义与数据条目的创建、管理能力，广泛用于知识库与社区协作站点。\n受影响版本中，Bazar 条目创建请求里的 date_maj_fiche 字段经 EntryManager::create() 原样传入 PageManager::save() 的第 5 个参数 $forcedDate，PageManager 在 includes/services/PageManager.php:381 以 $time = '\"' . $forcedDate . '\"' 将其裸拼接进 INSERT INTO ... SET 语句，而同语句的 tag、owner、user、body 等列均经 dbService-\u003eescape() 转义，该值是语句中唯一未转义的插值；攻击者用双引号闭合 time 字符串字面量后可注入子查询，把 wiki_users 表的账号与密码哈希写入新建页面的可控列并读取回显，默认配置下未认证用户可经 saisir_fiche 表单入口直达同一漏洞路径。\n修复版本中通过在 PageManager::save() 中为 $forcedDate 增加严格 datetime 正则校验（^\\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2}:\\d{2}$），不匹配的值回退为 now()，使外部请求值不再进入 SQL 语句，并以回归测试覆盖恶意 forcedDate 被忽略、合法日期仍生效的场景。", "effects": [{"comp_name": "yeswiki/yeswiki", "ecosystem": "composer", "versions": [{"affected_version": "[4.5.0,4.7.0)", "min_fixed_version": "4.7.0", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-10-25", "level": "High", "mps_id": "MPS-6die-ajpb", "poc": false, "poc_url": [], "published_time": "2026-10-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-6die-ajpb", "name": "https://www.oscs1024.com/hd/MPS-6die-ajpb"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-116211", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-116211"}, {"url": "https://github.com/YesWiki/yeswiki/security/advisories/GHSA-wjf7-hrf3-9gcx", "name": "GitHub Security Advisory (GHSA-wjf7-hrf3-9gcx)"}, {"url": "https://www.vulncheck.com/advisories/yeswiki-4.5.0-before-4.7.0-sql-injection-via-date-maj-fiche-in-bazar-entry-create", "name": "VulnCheck Advisory: YesWiki 4.5.0 before 4.7.0 SQL Injection via date_maj_fiche in Bazar entry create"}], "scope_influence": "", "tags": ["php", "开源"], "title": "YesWiki SQL注入漏洞", "_translated": true, "_saved_at": "2026-10-25T20:16:32+00:00", "_first_saved_at": "2026-10-25T17:21:38+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-6die-ajpb"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-116068", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/S 同步功能。\n受影响版本中，premium 备份加密位于 rotkehlchen/crypto.py 的 encrypt() 函数，该方法仅执行一次无盐 SHA-256 将用户登录口令直接变换为 AES-256-CBC 密钥，无盐值且无迭代拉伸；已登录用户通过 PUT /api/1/premium/sync（action=upload）触发上传时，rotkehlchen/data_handler.py 的 compress_and_encrypt_db() 以该弱密钥加密压缩后的 SQLite 用户数据库并存储到 premium 服务器，攻击者获取备份 blob 后可实施 GPU 并行的离线口令爆破，解密出 exchange API 密钥、钱包地址与交易历史等敏感数据。\n修复版本中通过以 encrypt_backup()/decrypt_backup() 重写备份加密：使用随机盐 Argon2id（默认 time_cost=8、256MiB 内存、8 lanes）派生主密钥并经 HKDF 拆分出 AES-256-GCM 加密密钥与 key commitment，密文按 64KiB 分块认证加密且含 last_modify_ts 的头部整体作为附加认证数据，同步流程同时拒绝降级回旧格式备份，显著提高离线爆破口令的计算成本。", "effects": [{"comp_name": "rotki", "ecosystem": "linux", "versions": [{"affected_version": "[0,1.44.2)", "min_fixed_version": "1.44.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "使用具有不充分计算复杂性的口令哈希", "kind_en": "使用密码哈希但计算量不足", "last_modified_time": "2026-10-25", "level": "High", "mps_id": "MPS-sh20-zqp1", "poc": false, "poc_url": [], "published_time": "2026-10-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-sh20-zqp1", "name": "https://www.oscs1024.com/hd/MPS-sh20-zqp1"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-116071", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-116071"}, {"url": "https://github.com/rotki/rotki/issues/13393", "name": "GitHub Issue #13393"}, {"url": "https://github.com/rotki/rotki", "name": ""}, {"url": "https://github.com/rotki/rotki/pull/13401", "name": ""}, {"url": "https://github.com/rotki/rotki/blob/v1.44.1/rotkehlchen/crypto.py#L17-L45", "name": ""}, {"url": "https://github.com/rotki/rotki/blob/v1.44.1/rotkehlchen/data_handler.py#L263-L294", "name": ""}, {"url": "https://github.com/rotki/rotki/releases/tag/v1.44.2", "name": "v1.44.2 Release Notes"}, {"url": "https://www.vulncheck.com/advisories/rotki-before-1.44.2-weak-key-derivation-for-premium-cloud-backup-encryption", "name": "VulnCheck Advisory: rotki before 1.44.2 Weak Key Derivation for Premium Cloud Backup Encryption"}], "scope_influence": "", "tags": ["应用软件"], "title": "rotki弱密钥派生漏洞", "_translated": true, "_saved_at": "2026-10-25T13:30:20+00:00", "_first_saved_at": "2026-10-25T13:30:20+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-sh20-zqp1"}, {"analysis_status": 0, "articles": [{"content": "跨站点请求伪造 (CSRF)通过利用网站对用户请求的信任进行攻击。当用户在网站A登录并在同一浏览器会话中访问网站B时，攻击者可以构造特制的请求并诱使用户执行，以使网站B误以为这些请求是用户合法发起的。\n攻击者通常通过欺骗用户点击恶意链接、在受信任的网站中植入恶意代码或通过钓鱼等手段来实施CSRF攻击，一旦用户执行了恶意请求，攻击者可以以用户的身份执行任意操作，包括更改用户密码、发起资金转账或删除重要数据等。", "title": "什么是CSRF"}, {"content": "- 链接欺骗：攻击者通过向用户发送包含恶意链接的电子邮件或社交媒体消息，诱使用户点击并执行恶意请求。\n- 图片引用攻击：攻击者通过在恶意网站上包含指向目标网站的图片引用，以触发用户浏览器自动发送目标网站的请求。\n- XSS利用：如果目标网站存在XSS漏洞，攻击者可以注入恶意脚本，以使用户在浏览器中执行恶意请求。", "title": "CSRF常见的攻击方式"}, {"content": "- 随机令牌：网站可以在每个请求中包含一个随机生成的令牌（CSRF Token），并验证该令牌的有效性，以确认请求的来源是合法的。\n- SameSite Cookie：使用SameSite属性来限制跨站点请求，将Cookie的发送限制在同一站点上，减少了跨站请求伪造的风险。\n- 双重验证：对于敏感操作，网站可以要求用户进行额外的验证，例如输入验证码、提供第二个因素的身份验证等。\n- 强化浏览器策略：网站可以设置Content-Security-Policy（CSP）头，限制浏览器执行恶意脚本的能力，减少CSRF攻击的风险。\n- 限制用户操作：网站可以要求用户在执行敏感操作之前进行明确的确认或授权，防止恶意请求被误触发。\n- 安全编码实践：开发人员应遵循安全编码实践，对用户输入进行适当的验证和过滤，防止恶意请求的注入。", "title": "如何预防CSRF"}], "cnvd_id": "", "cve_id": "CVE-2026-116204", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:N/I:H/A:H", "severity": "high", "base_score": 8.1}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:N/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:N/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-352", "description": "YesWiki 是一个采用 AGPL-3.0 协议开源的 PHP Wiki 协作系统，提供多用户页面编辑、权限控制、表单与插件扩展等能力。\n受影响版本中，tools/security/actions/despam.php 的 despam 管理动作在 isset($_POST['clean']) 分支内遍历 $_POST['suppr'] 数组并逐个调用 PageController::delete() 删除页面，同时按 $_POST['rev'] 数组将任意历史修订恢复为当前版本，整个流程仅依赖会话态的 UserIsAdmin() 判定，缺少 CSRF Token 与 Origin/Referer 校验；结合默认 default_write_acl='*' 与 allow_raw_html=true，未认证攻击者可在 Wiki 页面植入自动提交的 HTML 表单，管理员浏览该页面时浏览器携带管理员会话发出同站 POST，导致 PagePrincipale、GererConfig 等任意页面被删除或当前内容被旧版本覆盖。\n修复版本中通过在 despam 动作表单中输出 csrf-token 隐藏字段，并在进入 clean 处理分支前调用 CsrfTokenController::checkToken('main', 'POST', 'csrf-token', false) 强制校验请求，校验失败的跨站请求被拒绝，切断了上述利用链。", "effects": [{"comp_name": "yeswiki/yeswiki", "ecosystem": "composer", "versions": [{"affected_version": "(-∞,4.7.0)", "min_fixed_version": "4.7.0", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "CSRF", "kind_en": "跨站请求伪造 (CSRF)", "last_modified_time": "2026-10-25", "level": "High", "mps_id": "MPS-2co8-5sv0", "poc": false, "poc_url": [], "published_time": "2026-10-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-2co8-5sv0", "name": "https://www.oscs1024.com/hd/MPS-2co8-5sv0"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-116204", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-116204"}, {"url": "https://github.com/YesWiki/yeswiki/security/advisories/GHSA-cv88-hx5q-vq72", "name": "GitHub Security Advisory (GHSA-cv88-hx5q-vq72)"}, {"url": "https://www.vulncheck.com/advisories/yeswiki-before-4.7.0-csrf-via-despam-admin-action", "name": "VulnCheck Advisory: YesWiki before 4.7.0 CSRF via despam Admin Action"}], "scope_influence": "", "tags": ["php", "开源"], "title": "YesWiki despam动作CSRF漏洞", "_translated": true, "_saved_at": "2026-10-25T17:21:39+00:00", "_first_saved_at": "2026-10-25T17:21:39+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-2co8-5sv0"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-116208", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:N/I:H/A:H", "severity": "high", "base_score": 8.1}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:N/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:N/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-862", "description": "YesWiki 是一个基于 PHP 的开源 Wiki 与协作平台，其 Bazar 模块提供表单与条目管理，并通过 ActivityPub 支持联邦内容同步，将远端主体发布的条目镜像到本地。\n受影响版本中，ActivityPub 同步处理器 ActivityPubService::syncActorPosts 处理远端 outbox 返回的 Create、Update、Delete 活动并回收本地镜像条目时缺少逐活动授权校验：跨主体 Delete 活动以 forceEvenIfNotOwner=true 直接调用 EntryManager::delete，Create 与 Update 未校验来源主机与条目归属，垃圾回收逻辑仅按主机名匹配批量删除本地条目。运行恶意 ActivityPub 服务器的攻击者在管理员发起同步时提交包含跨主体 activity 的毒化 outbox，可删除、覆盖、伪造或批量删除其他联邦主体的镜像 ied_time": "2026-10-26", "level": "High", "mps_id": "MPS-14b2-3fae", "poc": false, "poc_url": [], "published_time": "2026-10-26", "reference_url_list": [{"url": "https://cybersecuritynews.com/microsoft-security-updates-for-brotli-and-net-tarballs-vulnerability/", "name": ""}, {"url": "https://github.com/dotnet/aspnetcore/security/advisories/GHSA-r6pf-x897-gm86", "name": ""}, {"url": "https://github.com/dotnet/announcements/issues/495", "name": ""}, {"url": "https://github.com/dotnet/announcements/issues/496", "name": ""}, {"url": "https://devblogs.microsoft.com/dotnet/dotnet-october-2026-oob-security-updates/", "name": ""}, {"url": "https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-114148", "name": ""}, {"url": "https://github.com/dotnet/aspnetcore/discussions/70040", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-114148", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": ".NET归档所有权提权", "_translated": true, "_saved_at": "2026-10-26T14:46:10+00:00", "_first_saved_at": "2026-10-26T14:46:10+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-14b2-3fae"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "attack_vector_type": "Local", "cnvd_id": "", "cve_id": "CVE-2026-84633", "cvss": {}, "cvss_score": 8.4, "cvss_vector": "", "cwe": "CWE-22", "description": "Apple Neural Engine 是 macOS 内置的闭源神经网络推理组件，部署在 Apple 芯片设备上，用于在本机执行机器学习计算。\n受影响版本中，该组件的路径校验不足，本地应用传入的路径可穿越到沙箱允许范围之外，从而导致应用突破沙箱限制。公开公告未给出具体文件、函数或参数。\n修复版本中通过改进路径校验阻止越界路径继续被接受，应用无法再借助路径穿越突破沙箱。修复包含在 macOS Golden Gate 27 中。", "effects": [{"comp_name": "macos", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,27)", "min_fixed_version": "27", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-10-27", "level": "High", "mps_id": "MPS-elhi-tv1y", "poc": false, "poc_url": [], "published_time": "2026-10-27", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-elhi-tv1y", "name": "https://www.oscs1024.com/hd/MPS-elhi-tv1y"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-84633", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-84633"}, {"url": "https://support.apple.com/en-us/149035", "name": ""}], "scope_influence": "", "tags": ["AI", "操作系统"], "title": "macOS神经引擎沙箱逃逸", "_translated": true, "_saved_at": "2026-10-27T05:52:18+00:00", "_first_saved_at": "2026-10-27T05:52:18+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-elhi-tv1y"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-85299", "cvss": {"cvssv4": [{"source": "f45cbf4e-4146-4068-b7e1-655ffc2c548c", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:H/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:Clear", "severity": "high", "base_score": 8.3}]}, "cvss_score": 8.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:H/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:Clear", "cwe": "CWE-862", "description": "Google Compute Engine 是 Google Cloud 的托管计算服务，用于创建和管理虚拟机、持久磁盘与磁盘快照，控制面不公开源码。\n受影响版本中，disks.createSnapshot 与 regionDisks.createSnapshot 存在缺失授权。已认证但缺少目标磁盘相应 IAM 权限的调用方，可通过这两个接口跨项目导出磁盘数据。\n修复版本中通过 Google 于 2026-08-31 实施的平台侧补丁消除上述接口的授权缺失，缺少相应 IAM 权限的调用方无法再跨项目导出磁盘数据。Compute Engine 为托管服务，公告说明客户无需自行操作。", "effects": [{"comp_name": "compute_engine", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2026-08-31)", "min_fixed_version": "2026-08-31", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-10-27", "level": "High", "mps_id": "MPS-ba8i-slhg", "poc": false, "poc_url": [], "published_time": "2026-10-27", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ba8i-slhg", "name": "https://www.oscs1024.com/hd/MPS-ba8i-slhg"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-85299", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-85299"}, {"url": "https://docs.cloud.google.com/compute/docs/security-bulletins#gcp-2026-073", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "GCE快照授权缺失", "_translated": true, "_saved_at": "2026-10-27T11:25:13+00:00", "_first_saved_at": "2026-10-27T11:25:13+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ba8i-slhg"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-72753", "cvss": {"cvssv31": [{"source": "sep@nlnetlabs.nl", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:L/A:H", "severity": "high", "base_score": 8.2}]}, "cvss_score": 8.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:L/A:H", "cwe": "CWE-755", "description": "Routinator 是 NLnet Labs 发布的开源 RPKI 依赖方软件，使用 Rust 编写，通过 RRDP 拉取存储库对象并生成路由源验证数据。\n受影响版本中，Notification::from_response 解析 RRDP notification 后只调用 NotificationFile::sort_deltas 按 serial 排序，不拒绝 serial 不连续的 delta 列表。RepositoryUpdate::calc_deltas 只要求最后一条 delta 的 serial 等于 notification serial，再从本地下一序号起整段应用后续 delta，空洞对应的发布内容不会写入本地仓库，但仓库 serial 仍会推进到 notification 的 serial。delta 条目过多时，解析并保留这些条目可能耗尽内存。\n修复版本中通过把 Notification::from_response 的 sort_deltas 替换为 sort_and_verify_deltas(Some(delta_list_limit))，并将依赖 rpki 升级到 0.20.0。sort_and_verify_deltas 按 serial 升序排列，超过上限时只保留最新条目，并核对相邻 serial 是否连续；NotificationFile::_parse 在 delta 数量达到 delta_limit 时标记 DeltaListError::Oversized，delta_update 据此回退到 snapshot，不再把超限 delta 列表留在增量更新路径中。", "effects": [{"comp_name": "routinator", "ecosystem": "cargo", "versions": [{"affected_version": "(-∞,0.15.3)", "min_fixed_version": "0.15.3", "repository": "cargo", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "对异常条件的处理不恰当", "kind_en": "Improper Handling of Exceptional Conditions", "last_modified_time": "2026-10-27", "level": "High", "mps_id": "MPS-x3rf-8jbn", "poc": false, "poc_url": [], "published_time": "2026-10-27", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-x3rf-8jbn", "name": "https://www.oscs1024.com/hd/MPS-x3rf-8jbn"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-72753", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-72753"}, {"url": "https://www.nlnetlabs.nl/downloads/routinator/CVE-2026-72753.txt", "name": ""}], "scope_influence": "", "tags": [], "title": "Routinator增量漏洞", "_translated": true, "_saved_at": "2026-10-26T20:15:57+00:00", "_first_saved_at": "2026-10-26T20:15:57+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-x3rf-8jbn"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "attack_vector_type": "Local", "cnvd_id": "", "cve_id": "CVE-2026-84599", "cvss": {}, "cvss_score": 7.8, "cvss_vector": "", "cwe": "CWE-787", "description": "Apple iOS/iPadOS、macOS、tvOS、visionOS 与 watchOS 是苹果公司闭源操作系统，分别运行于 iPhone、iPad、Mac、Apple TV、Apple Vision Pro 与 Apple Watch 设备，内核负责内存管理、进程调度与硬件层隔离。\n受影响版本中，操作系统内核在内存处理流程中存在缺陷，设备本地运行的应用可触发内核内存破坏，导致意外系统终止或内核内存损坏，官方公告未披露受影响的具体函数与代码路径。\n修复版本中通过改进内核内存处理消除了该缺陷，涉及版本包括 iOS 26.7.2 与 iPadOS 26.7.2、iOS 27 与 iPadOS 27、macOS Golden Gate 27、macOS Sequoia 15.8、macOS Tahoe 26.7、tvOS 27、visionOS 27 与 watchOS 27。", "effects": [{"comp_name": "iphone_os", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,26.7.2)", "min_fixed_version": "26.7.2", "reposit scope_influence": "", "tags": ["操作系统"], "title": "Apple内核内存破坏漏洞", "_translated": true, "_saved_at": "2026-10-27T05:52:21+00:00", "_first_saved_at": "2026-10-27T05:52:21+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-cs48-dlb2"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "attack_vector_type": "Local", "cnvd_id": "", "cve_id": "CVE-2026-86916", "cvss": {"cvssv31": [{"source": "134c704f-9b21-4f2e-91b3-4a467353bcc0", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-416", "description": "Apple iOS、iPadOS 与 macOS 是闭源操作系统，内核负责进程隔离、权限控制与内存管理。\n受影响版本中，内核存在释放后使用缺陷。在默认安装的系统上，本地应用可能触发该缺陷并以内核权限执行任意代码。Apple 将问题描述为内存管理缺陷，未披露具体源码位置。\n修复版本中通过改进内存管理消除该释放后使用条件，本地应用不再能借助该缺陷获得内核权限代码执行能力。", "effects": [{"comp_name": "ipados", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,26.7)", "min_fixed_version": "26.7", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "iphone_os", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,26.7)", "min_fixed_version": "26.7", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "macos", "ecosystem": "linux", "versions": [{"affected_ go", "versions": [{"affected_version": "(-∞,0.15.3)", "min_fixed_version": "0.15.3", "repository": "cargo", "solutions": [], "upstream": true}]}, {"comp_name": "rpki", "ecosystem": "cargo", "versions": [{"affected_version": "(-∞,0.20.0)", "min_fixed_version": "0.20.0", "repository": "cargo", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "对异常条件的处理不恰当", "kind_en": "Improper Handling of Exceptional Conditions", "last_modified_time": "2026-10-27", "level": "High", "mps_id": "MPS-psky-ntev", "poc": false, "poc_url": [], "published_time": "2026-10-27", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-psky-ntev", "name": "https://www.oscs1024.com/hd/MPS-psky-ntev"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-72758", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-72758"}, {"url": "https://www.nlnetlabs.nl/downloads/routinator/CVE-2026-72756.txt", "name": ""}], "scope_influence": "", "tags": [], "title": "Routinator畸形AS范围内存耗尽", "_translated": true, "_saved_at": "2026-10-26T20:15:54+00:00", "_first_saved_at": "2026-10-26T20:15:54+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-psky-ntev"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-72756", "cvss": {"cvssv31": [{"source": "sep@nlnetlabs.nl", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-755", "description": "Routinator 是 NLnet Labs 发布的开源 RPKI 依赖方软件，用于收集并验证路由源授权数据，默认通过 RRDP 同步发布点对象。\n受影响版本中，经 RRDP 取得的文件若带有无法落盘的 rsync URI，例如文件名过长，或目录名与已有文件名重叠，StoredPoint::create 会按清单 URI 拼接本地存储路径，并调用 fatal::create_dir_all 与 File::create。这些调用失败时返回 Failed，随后转换为致命 RunFailed，服务器模式和一次性验证都会退出进程，路由源验证随之中断。\n修复版本中通过将 AlreadyExists、InvalidFilename、IsADirectory 和 NotADirectory 视为可恢复的 PubPointFailed，并在 PubPoint: S-cw30-z4rv"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-93434", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-93434"}, {"url": "https://psirt.watchguard.com/CVE-2026-93434", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Fireware OS XPath注入", "_translated": true, "_saved_at": "2026-10-27T17:14:34+00:00", "_first_saved_at": "2026-10-27T17:14:34+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-cw30-z4rv"}, {"analysis_status": 0, "articles": [{"content": "- 编写代码时没有正确处理输入数据或没有正确验证用户输入而导致的。", "title": "什么是关键资源权限分配不当"}, {"content": "- 弱密码或未使用的密码：当管理员或系统管理员在创建帐户时，没有使用强密码或未对帐户进行密码更新时，可能会发生这种情况。弱密码可能会被黑客破解或通过其他方式轻松访问系统。\n- 未正确配置权限：在系统中，不同的资源通常需要不同的权限才能访问。如果管理员未正确配置权限，那么未经授权的用户可能会通过欺骗系统或利用其他漏洞来访问关键资源。\n- 权限重用：在某些情况下，管理员可能会将某些权限分配给某个用户，但这些权限并未被正确地限制或授权给该用户。如果其他用户尝试使用这些权限访问关键资源，那么他们可能会获得未经授权的访问权限。\n- 未正确验证用户输入：当开发人员没有正确验证用户输入时，可能会发生这种情况。例如，如果开发人员未正确过滤用户输入的用户名或密码，那么黑客可能会利用这些信息轻松地访问系统。\n", "title": "关键资源权限分配不当常见的攻击方式"}, {"content": "- 使用强密码：管理员应该使用强密码来保护系统，并定期更改密码。强密码应该包括数字、字母和符号，并且应该不同于其他帐户使用的密码。\n- 正确配置权限：管理员应该正确配置系统中不同资源所需的权限。用户可以被授予访问特定资源的权限，但不应该被授予访问其他资源的权限。\n- 权限限制：管理员应该使用权限限制来限制用户对特定资源的访问。例如，用户可以被授予访问特定文件夹的权限，但不能访问其他文件夹。\n- 输入验证：开发人员应该正确验证用户输入。例如，他们可以过滤用户输入的用户名和密码，以确保它们符合预期的格式。\n- 安全培训：管理员和用户应该接受安全培训，以便了解如何识别和避免常见的安全漏洞，例如不正确权限授予漏洞。\n- 定期更新和修补软件：系统软件和应用程序应该定期更新和修补，以确保它们不受最新安全漏洞的影响。", "title": "如何预防关键资源权限分配不当"}], "cnvd_id": "", "cve_id": "CVE-2026-92377", "cvss": {"cvssv31": [{"source": "psirt@teamviewer.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-732", "description": "TeamViewer 是 TeamViewer 公司的商业闭源远程连接软件，Windows 版 Full Client 与 Host 中的补丁管理更新机制用于获取并安装补丁管理组件的更新。\n受影响版本中，补丁管理更新机制在通过进程间通信获取更新信息时缺少访问控制校验，低权限本地认证攻击者可伪造 IPC 响应提供一个已签名可执行文件，并使该可执行文件从用户可写的临时目录加载恶意 DLL，最终以 NT AUTHORITY\\SYSTEM 权限执行任意代码，实现本地提权。\n修复版本中通过厂商安全更新修复补丁管理更新机制中的访问控制缺陷，切断伪造 IPC 响应进入更新流程的路径，15.82 及以上版本不再受该问题影响，维护分支用户需升级至 15.64.10、14.7.48868 或 13.2.36231，官方建议升级至最新版本 15.83。", "effects": [{"comp_name": "teamviewer", "ecosystem": "linux", "versions": [{"affected_version": "[14.7,14.7.48868)", "min_fixed_version": "14.7.48868", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[15.64,15.64.10)", "min_fixed_version": "15.64.10", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,15.82)", "min_fixed_version": "15.82", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[13.2,13.2.36231)", "min_fixed_version": "13.2.36231", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "关键资源权限分配不当", "kind_en": "关键资源的权限分配不正确", "last_modified_time": "2026-10-28", "level": "High", "mps_id": "MPS-cmnp-qtv9", "poc": false, "poc_url": [], "published_time": "2026-10-28", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-cmnp-qtv9", "name": "https://www.oscs1024.com/hd/MPS-cmnp-qtv9"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-92377", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-92377"}, {"url": "https://www.teamviewer.com/en/resources/trust-center/security-bulletins/tv-2026-1012/", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "TeamViewer补丁管理本地提权漏洞", "_translated": true, "_saved_at": "2026-10-27T17:14:34+00:00", "_first_saved_at": "2026-10-27T17:14:34+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-cmnp-qtv9"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-92374", "cvss": {"cvssv31": [{"source": "psirt@teamviewer.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-367", "description": "TeamViewer 是商业闭源远程访问与远程支持软件，Full Client 与 Host 用于远程控制、远程管理和 IT 支持等场景，其 macOS 版本通过特权助手执行需要 root 权限的安装操作。\n受影响版本中，macOS 特权助手在处理安装包时存在 TOCTOU 竞态条件并伴随符号链接处理不当，安装包校验与实际安装之间存在时间窗口，低权限本地攻击者可借助符号链接在该窗口内替换校验对象，绕过安装包校验并让特权助手安装恶意包，最终获得 root 权限。\n修复版本中通过官方安全更新收紧特权助手对安装包的校验与安装处理，消除校验与使用之间的竞态窗口以及符号链接滥用空间，阻止低权限用户再通过该路径安装未经验证的包，建议升级至 15.83 及以上版本。", "effects": [{"comp_name": "teamviewer", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,15.83)", "min_fixed_version": "15.83", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "检查时间与使用时间(TOCTOU)的竞争条件", "kind_en": "检查时间使用时间 (TOCTOU) 竞争条件", "last_modified_time": "2026-10-28", "level": "High", "mps_id": "MPS-d3pt-8ioh", "poc": false, "poc_url": [], "published_time": "2026-10-28", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-d3pt-8ioh", "name": "https://www.oscs1024.com/hd/MPS-d3pt-8ioh"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-92374", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-92374"}, {"url": "https://www.teamviewer.com/en/resources/trust-center/security-bulletins/tv-2026-1011/", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "TeamViewer macOS权限提升漏洞", "_translated": true, "_saved_at": "2026-10-27T17:14:38+00:00", "_first_saved_at": "2026-10-27T17:14:38+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-d3pt-8ioh"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2026-92376", "cvss": {"cvssv31": [{"source": "psirt@teamviewer.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-287", "description": "TeamViewer Remote Management Monitoring 是 TeamViewer Germany GmbH 的商业闭源远程管理附加组件，在 Windows 上由 ITbrain_Monitoring_Service.exe 以系统服务形式提供设备监控。\n受影响版本中，该组件的进程间通信机制未正确认证 IPC broker。本地低权限已认证攻击者可冒充 IPC broker，使 Monitoring 服务以 NT AUTHORITY\\SYSTEM 权限执行任意代码，从而完成本地权限提升。\n修复版本中通过将 ITbrain_Monitoring_Service.exe 更新到 26.10.1，消除允许低权限本地用户冒充 IPC broker 并驱动 Monitoring 服务以 NT AUTHORITY\\SYSTEM 执行任意代码的认证缺陷。厂商通过自动更新交付该组件，公开材料未披露具体源码改动。", "effects": [{"comp_name": "remote_management_monitoring", "ecosystem": "linux", "versions": [{"affected_version": "[0,26.10.1)", "min_fixed_version": "26.10.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "身份验证不当", "kind_en": "认证不当", "last_modified_time": "2026-10-28", "level": "High", "mps_id": "MPS-piqu-1a38", "poc": false, "poc_url": [], "published_time": "2026-10-28", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-piqu-1a38", "name": "https://www.oscs1024.com/hd/MPS-piqu-1a38"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-92376", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-92376"}, {"url": "https://www.teamviewer.com/en/resources/trust-center/security-bulletins/tv-2026-1012/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "监控服务IPC提权漏洞", "_translated": true, "_saved_at": "2026-10-27T17:14:36+00:00", "_first_saved_at": "2026-10-27T17:14:36+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-piqu-1a38"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-93862", "cvss": {"cvssv4": [{"source": "5d1c2695-1a31-4499-88ae-e847036fd7e3", "vector": "CVSS:4.0/AV:A/AC:L/AT:N/PR:N/UI:N/VC:L/VI:L/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:4.0/AV:A/AC:L/AT:N/PR:N/UI:N/VC:L/VI:L/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-823", "description": "WatchGuard Fireware OS 是 WatchGuard Firebox 系列防火墙设备运行的闭源商业固件，提供网络边界防护、VPN 与 FireCluster 高可用集群等能力。\n受影响版本中，FireCluster Sync 处理逻辑对集群互联网络上接收的同步报文缺少充分的长度与索引校验，攻击者位于集群互联链路（例如控制一台集群对端设备或具备链路中间人位置）时，可反复发送构造的同步流量触发越界读取，导致集群同步进程崩溃并形成持续拒绝服务。\n修复版本中通过官方发布的 Fireware OS 更新修复该问题，WatchGuard 已在 2026.4 与 12.12.4 版本（T15/T35 设备为 12.5.22）提供修复，升级后可消除集群同步进程因越界读取而崩溃的风险。", "effects": [{"comp_name": "fireware_os", "ecosystem": "linux", "versions": [{"affected_version": "[2025.1,2026.4)", "min_fixed_version": "2026.4", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[12.0,12.12.4)", "min_fixed_version": "12.12.4", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[12.0,12.5.22)", "min_fixed_version": "12.5.22", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "使用越界的指针偏移", "kind_en": "使用超出范围的指针偏移量", "last_modified_time": "2026-10-28", "level": "High", "mps_id": "MPS-j8vt-a79m", "poc": false, "poc_url": [], "published_time": "2026-10-28", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-j8vt-a79m", "name": "https://www.oscs1024.com/hd/MPS-j8vt-a79m"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-93862", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-93862"}, {"url": "https://psirt.watchguard.com/CVE-2026-93862", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Fireware OS 越界读取漏洞", "_translated": true, "_saved_at": "2026-10-27T17:14:31+00:00", "_first_saved_at": "2026-10-27T17:14:31+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-j8vt-a79m"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-93864", "cvss": {"cvssv4": [{"source": "5d1c2695-1a31-4499-88ae-e847036fd7e3", "vector": "CVSS:4.0/AV:L/AC:L/AT:P/PR:L/UI:N/VC:N/VI:H/VA:H/SC:N/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:L/AC:L/AT:P/PR:L/UI:N/VC:N/VI:H/VA:H/SC:N/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-377", "description": "WatchGuard Fireware OS 是 WatchGuard Firebox 防火墙设备使用的闭源操作系统，firewalld 是其中的防火墙守护进程。\n受影响版本中，firewalld 存在链接跟随缺陷。已在设备本地取得低权限系统进程代码执行能力的攻击者，可通过放置可控文件系统对象并触发列表更新，使该守护进程以 root 权限覆写任意文件，并篡改防火墙 IP 集合数据；写入内容受到部分约束。\n修复版本中通过发布 Fireware OS 2026.4、12.12.4 以及 T15/T35 平台的 12.5.22，消除 firewalld 列表更新路径上的链接跟随，阻止低权限本地进程再借文件系统对象以 root 权限覆写任意文件或篡改防火墙 IP 集合数据。", "effects": [{"comp_name": "fireware_os", "ecosystem": "linux", "versions": [{"affected_version": "[12.0,12.12.4)", "min_fixed_version": "12.12.4", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[2025.1,2026.4)", "min_fixed_version": "2026.4", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[12.0,12.5.22)", "min_fixed_version": "12.5.22", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "不安全的临时文件", "kind_en": "不安全的临时文件", "last_modified_time": "2026-10-28", "level": "High", "mps_id": "MPS-cx9t-re1i", "poc": false, "poc_url": [], "published_time": "2026-10-28", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-cx9t-re1i", "name": "https://www.oscs1024.com/hd/MPS-cx9t-re1i"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-93864", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-93864"}, {"url": "https://psirt.watchguard.com/CVE-2026-93864", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Fireware OS链接跟随", "_translated": true, "_saved_at": "2026-10-27T17:14:30+00:00", "_first_saved_at": "2026-10-27T17:14:30+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-cx9t-re1i"}]}</script>
  <script>
    const payload = JSON.parse(document.getElementById("payload").textContent);
    const levelLabels = payload.level_labels || {};
    const items = payload.items || [];
    let filtered = items.slice();
    let activeId = null;

    const $ = (id) => document.getElementById(id);
    $("generatedAt").textContent = payload.generated_at || "-";
    $("retention").textContent = payload.retention_days ?? "-";
    $("cutoff").textContent = payload.cutoff_date || "-";
    $("count").textContent = String(payload.count ?? items.length);

    function levelClass(level) {
      const cn = levelLabels[level] || level || "";
      if (level === "Critical" || cn === "严重") return "crit";
      if (level === "High" || cn === "高危") return "high";
      return "other";
    }
    function levelText(level) {
      return levelLabels[level] || level || "-";
    }
    function esc(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }
    function scoreText(v) {
      if (v === null || v === undefined || v === "" || v === -1) return "-";
      return String(v);
    }

    function renderList() {
      const list = $("list");
      $("listCount").textContent = String(filtered.length);
      if (!filtered.length) {
        list.innerHTML = '<div class="empty">没有匹配项</div>';
        return;
      }
      list.innerHTML = filtered.map((it) => {
        const id = it.mps_id || it.cve_id;
        const active = id === activeId ? " active" : "";
        return `
          <button class="item${active}" data-id="${esc(id)}" type="button">
            <div class="item-top">
              <span class="cve">${esc(it.cve_id || it.mps_id || "-")}</span>
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
            </div>
            <div class="title">${esc(it.title || "-")}</div>
            <div class="item-foot">
              <span>CVSS ${esc(scoreText(it.cvss_score))}</span>
              <span>${esc(it.published_time || "-")}</span>
              ${it.poc ? "<span>POC</span>" : ""}
            </div>
          </button>`;
      }).join("");
      list.querySelectorAll(".item").forEach((btn) => {
        btn.addEventListener("click", () => selectById(btn.dataset.id));
      });
    }

    function refsHtml(it) {
      const refs = Array.isArray(it.reference_url_list) ? it.reference_url_list : [];
      const links = [];
      if (it._source_page) links.push({ url: it._source_page, name: "OSCS 详情" });
      if (it.cve_id) links.push({ url: `https://nvd.nist.gov/vuln/detail/${it.cve_id}`, name: "NVD" });
      refs.forEach((r) => {
        if (r && r.url) links.push({ url: r.url, name: r.name || r.url });
      });
      const seen = new Set();
      const uniq = [];
      for (const l of links) {
        if (seen.has(l.url)) continue;
        seen.add(l.url);
        uniq.push(l);
      }
      if (!uniq.length) return '<div class="box">无参考链接</div>';
      return `<div class="refs">${uniq.map((l) =>
        `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name || l.url)}</a>`
      ).join("")}</div>`;
    }

    function articlesHtml(it) {
      const arts = Array.isArray(it.articles) ? it.articles : [];
      if (!arts.length) return "";
      return `<div class="section"><h3>相关说明</h3>${arts.map((a) => `
        <div class="article">
          <h4>${esc(a.title || "说明")}</h4>
          <p>${esc(a.content || "")}</p>
        </div>`).join("")}</div>`;
    }

    function renderDetail(it) {
      const detail = $("detail");
      if (!it) {
        detail.innerHTML = '<div class="empty">暂无数据</div>';
        return;
      }
      const pocUrls = Array.isArray(it.poc_url) ? it.poc_url : [];
      detail.innerHTML = `
        <div class="d-head">
          <div>
            <h1 class="d-title">${esc(it.title || "-")}</h1>
            <div class="ids">
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
              <span class="chip">${esc(it.cve_id || "无 CVE")}</span>
              <span class="chip">${esc(it.mps_id || "-")}</span>
              ${it.poc ? '<span class="chip">有 POC</span>' : ""}
              ${it.exp ? '<span class="chip">有 EXP</span>' : ""}
            </div>
          </div>
          <div class="actions">
            ${it._source_page ? `<a class="btn" href="${esc(it._source_page)}" target="_blank" rel="noopener">OSCS</a>` : ""}
            ${it.cve_id ? `<a class="btn" href="https://nvd.nist.gov/vuln/detail/${esc(it.cve_id)}" target="_blank" rel="noopener">NVD</a>` : ""}
          </div>
        </div>
        <div class="grid">
          <div class="stat"><div class="k">CVSS</div><div class="v">${esc(scoreText(it.cvss_score))}</div></div>
          <div class="stat"><div class="k">向量</div><div class="v">${esc(it.cvss_vector || "-")}</div></div>
          <div class="stat"><div class="k">CWE</div><div class="v">${esc(it.cwe || "-")}</div></div>
          <div class="stat"><div class="k">类型</div><div class="v">${esc(it.kind || it.kind_en || "-")}</div></div>
          <div class="stat"><div class="k">公开</div><div class="v">${esc(it.published_time || "-")}</div></div>
          <div class="stat"><div class="k">利用成本</div><div class="v">${esc(it.exploit_requirement_cost || "-")}</div></div>
          <div class="stat"><div class="k">可利用性</div><div class="v">${esc(it.exploitability || "-")}</div></div>
          <div class="stat"><div class="k">修复建议</div><div class="v">${esc(it.fix_suggestion || "-")}</div></div>
        </div>
        <div class="section"><h3>描述</h3><div class="box">${esc(it.description || "无描述")}</div></div>
        ${it.scope_influence ? `<div class="section"><h3>影响范围</h3><div class="box">${esc(it.scope_influence)}</div></div>` : ""}
        ${pocUrls.length ? `<div class="section"><h3>POC 链接</h3><div class="refs">${pocUrls.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join("")}</div></div>` : ""}
        <div class="section"><h3>参考链接</h3>${refsHtml(it)}</div>
        ${articlesHtml(it)}
      `;
    }

    function selectById(id) {
      const it = filtered.find((x) => (x.mps_id || x.cve_id) === id) ||
                 items.find((x) => (x.mps_id || x.cve_id) === id);
      if (!it) return;
      activeId = it.mps_id || it.cve_id;
      renderList();
      renderDetail(it);
      const btn = document.querySelector(`.item[data-id="${CSS.escape(activeId)}"]`);
      if (btn) btn.scrollIntoView({ block: "nearest" });
      history.replaceState(null, "", "#" + encodeURIComponent(activeId));
    }

    function applyFilter(q) {
      const query = (q || "").trim().toLowerCase();
      filtered = !query ? items.slice() : items.filter((it) => {
        const blob = [
          it.cve_id, it.mps_id, it.title, it.kind, it.kind_en, it.cwe, it.description, it.level
        ].map((x) => String(x || "").toLowerCase()).join(" ");
        return blob.includes(query);
      });
      renderList();
      if (filtered.length) {
        const still = filtered.some((x) => (x.mps_id || x.cve_id) === activeId);
        selectById(still ? activeId : (filtered[0].mps_id || filtered[0].cve_id));
      } else {
        activeId = null;
        renderDetail(null);
      }
    }

    $("search").addEventListener("input", (e) => applyFilter(e.target.value));

    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement !== $("search")) {
        e.preventDefault();
        $("search").focus();
        return;
      }
      if (!filtered.length) return;
      const idx = filtered.findIndex((x) => (x.mps_id || x.cve_id) === activeId);
      if (e.key === "ArrowDown") {
        e.preventDefault();
        const next = filtered[Math.min(filtered.length - 1, Math.max(0, idx) + 1)];
        selectById(next.mps_id || next.cve_id);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        const prev = filtered[Math.max(0, idx - 1)];
        selectById(prev.mps_id || prev.cve_id);
      }
    });

    const hashId = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    if (hashId && items.some((x) => (x.mps_id || x.cve_id) === hashId)) {
      activeId = hashId;
      renderList();
      selectById(hashId);
    } else if (items.length) {
      selectById(items[0].mps_id || items[0].cve_id);
    } else {
      renderList();
      renderDetail(null);
    }
  </script>
</body>
</html>
