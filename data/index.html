  <style>
    :root {
      --bg0: #071015;
      --bg1: #0d1a20;
      --bg2: #12242c;
      --panel: rgba(14, 28, 34, 0.88);
      --line: rgba(140, 190, 170, 0.16);
      --text: #e7f2ec;
      --muted: #8aa39a;
      --accent: #2fd3a2;
      --accent-dim: rgba(47, 211, 162, 0.14);
      --crit: #ff5a4e;
      --crit-bg: rgba(255, 90, 78, 0.14);
      --high: #ff9a3c;
      --high-bg: rgba(255, 154, 60, 0.14);
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; min-height: 100%;
      color: var(--text);
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(47, 211, 162, 0.16), transparent 55%),
        radial-gradient(900px 500px at 100% 0%, rgba(255, 90, 78, 0.10), transparent 50%),
        linear-gradient(160deg, var(--bg0), var(--bg1) 45%, #0a151b);
    }
    body::before {
      content: "";
      position: fixed; inset: 0; pointer-events: none; opacity: 0.35;
      background-image:
        linear-gradient(rgba(140, 190, 170, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(140, 190, 170, 0.05) 1px, transparent 1px);
      background-size: 28px 28px;
      mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
    }
    .shell {
      position: relative;
      max-width: 1280px;
      margin: 0 auto;
      padding: 28px 20px 40px;
      display: grid;
      gap: 18px;
      min-height: 100vh;
    }
    header.hero {
      display: grid;
      gap: 10px;
      padding: 22px 24px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(135deg, rgba(18, 36, 44, 0.95), rgba(10, 22, 28, 0.9));
      box-shadow: var(--shadow);
    }
    .brand {
      font-family: Syne, sans-serif;
      font-weight: 800;
      font-size: clamp(1.6rem, 3vw, 2.2rem);
      letter-spacing: -0.03em;
      line-height: 1.1;
    }
    .brand span { color: var(--accent); }
    .sub {
      color: var(--muted);
      font-size: 0.95rem;
      max-width: 62ch;
    }
    .meta {
      display: flex; flex-wrap: wrap; gap: 8px 14px;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.78rem;
      color: var(--muted);
    }
    .meta b { color: var(--text); font-weight: 500; }
    .layout {
      display: grid;
      grid-template-columns: minmax(280px, 360px) 1fr;
      gap: 16px;
      min-height: 70vh;
    }
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
    }
    .panel {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 520px;
    }
    .panel-hd {
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
    }
    .panel-hd h2 {
      margin: 0; font-size: 0.92rem; font-weight: 600; letter-spacing: 0.02em;
    }
    .search {
      width: 100%;
      margin: 0 16px 12px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: rgba(0,0,0,0.25);
      color: var(--text);
      font: inherit;
      outline: none;
    }
    .search:focus { border-color: rgba(47, 211, 162, 0.5); box-shadow: 0 0 0 3px var(--accent-dim); }
    .list {
      overflow: auto;
      padding: 0 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .item {
      text-align: left;
      width: 100%;
      border: 1px solid transparent;
      border-radius: 12px;
      padding: 12px;
      background: transparent;
      color: inherit;
      cursor: pointer;
      transition: background .15s, border-color .15s, transform .15s;
    }
    .item:hover { background: rgba(255,255,255,0.03); border-color: var(--line); }
    .item.active {
      background: var(--accent-dim);
      border-color: rgba(47, 211, 162, 0.35);
    }
    .item-top {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      margin-bottom: 6px;
    }
    .cve {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.82rem;
      font-weight: 600;
    }
    .title {
      font-size: 0.86rem;
      color: #c8ddd4;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;

    .item-foot {
      margin-top: 8px;

      font-family: "JetBrains Mono", monospace;
      font-size: 0.72rem;
      color: var(--muted);

      display: inline-flex; align-items: center;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .badge.crit { color: #ffb4ad; background: var(--crit-bg); }
    .badge.high { color: #ffd0a3; background: var(--high-bg); }
    .badge.other { color: var(--muted); background: rgba(255,255,255,0.06); }
    .detail {
      overflow: auto;
      padding: 18px 20px 28px;
    }
    .empty {
      margin: auto; color: var(--muted); text-align: center; padding: 40px 20px;
    }
    .d-head {
      display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .d-title {
      font-family: Syne, sans-serif;
      font-size: clamp(1.25rem, 2.2vw, 1.7rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0 0 8px;
      line-height: 1.2;
    }
    .ids {
      display: flex; flex-wrap: wrap; gap: 8px;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.82rem;
    }
    .chip {
      padding: 4px 10px;
      border-radius: 8px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--line);
      color: #cfe4da;
    }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.03);
      color: var(--text);
      text-decoration: none;
      font-size: 0.85rem;
      transition: border-color .15s, background .15s;
    }
    .btn:hover { border-color: rgba(47,211,162,.45); background: var(--accent-dim); }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
      margin: 16px 0 20px;
    }
    .stat {
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(0,0,0,0.18);
    }
    .stat .k { color: var(--muted); font-size: 0.75rem; margin-bottom: 6px; }
    .stat .v {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.95rem;
      font-weight: 600;
      word-break: break-all;
    }
    .section { margin-top: 18px; }
    .section h3 {
      margin: 0 0 8px;
      font-size: 0.9rem;
      color: #b7d0c6;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .box {
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(0,0,0,0.2);
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.92rem;
      color: #d7e8e0;
    }
    .refs { display: flex; flex-direction: column; gap: 8px; }
    .refs a {
      color: var(--accent);
      text-decoration: none;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.8rem;
      word-break: break-all;
    }
    .refs a:hover { text-decoration: underline; }
    .article {
      margin-top: 10px;
      padding: 12px 14px;
      border-left: 3px solid rgba(47,211,162,.45);
      background: rgba(47,211,162,.05);
      border-radius: 0 10px 10px 0;
    }
    .article h4 { margin: 0 0 6px; font-size: 0.92rem; }
    .article p { margin: 0; color: #c5d8cf; font-size: 0.88rem; white-space: pre-wrap; }
    .hint { color: var(--muted); font-size: 0.78rem; }
    .count-pill {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(255,255,255,0.06);
      color: var(--muted);
    }

ical；按 Chromium 严重性准则，该级别表示攻击者可在用户完整权限下读写底层平台资源。\n修复版本中通过新增 VerifyBaseLevelFootprint，在 Limit3DTexturePotFootprintTo4GB 开启且纹理维度为 3D 时，若按 2 的幂取整后的字节占用大于 uint32 最大值，则返回显存不足错误，在 OpenGL Texture::Create 与 Vulkan InternalTexture::Initialize 把纹理交给驱动之前拒绝创建。OpenGL 后端默认仅对 ImgTec 供应商启用该限制，Vulkan 后端默认仅在 MayBeImaginationProprietary() 成立时启用该限制。", "effects": [{"comp_name": "google-chrome:google-chrome", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,157.0.8103.38)", "min_fixed_version": "157.0.8103.38", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "经典缓冲区溢出", "kind_en": "不检查输入大小的缓冲区复制（“经典缓冲区溢出”）", "last_modified_time": "2026-11-04", "level": "Critical", "mps_id": "MPS-8a22-d922", "poc": false, "poc_url": [], "published_time": "2026-11-04", "reference_url_list": [{"url": "https://chromereleases.googleblog.com/2026/11/stable-channel-update-for-desktop.html", "name": ""}, {"url": "https://issues.chromium.org/issues/567735302", "name": ""}, {"url": "https://github.com/google/dawn/commit/c2e5529ac8b0b1b487f227938344480c4400aaa6", "name": ""}, {"url": "https://github.com/google/dawn/commit/62fa0852b8dec9966d9621f2dd6e7aea51f1a01d", "name": ""}, {"url": "https://dawn-review.googlesource.com/c/dawn/+/352155", "name": ""}, {"url": "https://dawn-review.googlesource.com/c/dawn/+/348055", "name": ""}, {"url": "https://chromium.googlesource.com/chromium/src/+/157.0.8103.38/DEPS", "name": ""}, {"url": "https://chromium.googlesource.com/chromium/src/+/main/docs/security/severity-guidelines.md", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Dawn三维纹理缓冲区溢出", "_translated": true, "_saved_at": "2026-11-03T21:25:33+00:00", "_first_saved_at": "2026-11-03T21:25:33+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-8a22-d922"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "cnvd_id": "", "cve_id": "CVE-2026-82418", "cvss": {"cvssv31": [{"source": "psirt@us.ibm.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-416", "description": "IBM Watson Speech Services Cartridge 是 IBM Cloud Pak for Data 上的商业语音服务组件，运行于 Red Hat OpenShift 平台，提供语音识别与语音合成能力，其语音运行时随附 Python cryptography 预编译 wheel，wheel 内嵌 OpenSSL 加密库。\n受影响版本中，4.0.0 至 5.4.0 版本随附的 cryptography wheel 内嵌了存在缺陷的 OpenSSL 版本，PKCS#7 签名验证流程在处理签名消息时存在释放后使用缺陷，远程攻击者可向受影响服务提交构造的 PKCS#7 或 S/MIME 签名消息触发该缺陷，破坏内存并执行任意代码。\n修复版本中通过 IBM 发布的 5.4.0 Patch 8 更新语音运行时随附的 cryptography wheel，消除 PKCS#7 签名验证流程中的释放后使用缺陷，该补丁适用于 4.0.0 至 5.4.0 全部受影响版本。", "effects": [{"comp_name": "watson_speech_services_cartridge", "ecosystem": "linux", "versions": [{"affected_version": "[4.0.0,5.4.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "UAF", "kind_en": "免费后使用", "last_modified_time": "2026-11-05", "level": "Critical", "mps_id": "MPS-al6e-kvop", "poc": false, "poc_url": [], "published_time": "2026-11-05", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-al6e-kvop", "name": "https://www.oscs1024.com/hd/MPS-al6e-kvop"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-82418", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-82418"}, {"url": "https://www.ibm.com/support/pages/node/7293510", "name": ""}], "scope_influence": "", "tags": ["AI", "应用软件"], "title": "IBM Watson语音服务组件释放后使用漏洞", "_translated": true, "_saved_at": "2026-11-04T22:20:02+00:00", "_first_saved_at": "2026-11-04T22:20:02+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-al6e-kvop"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-100109", "cvss": {"cvssv3": [{"source": "contact@wpscan.com", "vector": "CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-862", "description": "Security For WooCommerce 是一款发布在 WordPress 官方插件目录的开源 WooCommerce 商店安全插件（插件目录标识 ultimate-security-for-woocommerce），提供 IP 与国家访问限制、登录保护、双因素认证、临时登录等功能。\n受影响版本中，插件将创建临时用户的 AJAX 动作 usfw_create_temporary_user 同时注册到 wp_ajax 与 wp_ajax_nopriv 钩子，未登录访问者可直接请求 admin-ajax.php 触发该动作；处理函数只验证插件在全部前台页面输出的共享 nonce，未执行任何 current_user_can 能力检查，并允许调用方通过 role 参数指定新建账号的角色，攻击者传入 role=administrator 与自身控制的邮箱即可创建站点管理员账号，随后经 WordPress 密码找回流程取得该账号会话并接管站点。\n修复版本中通过，WPScan 将该漏洞标记为无已知修复版本，最新版本 1.0.16 仍受影响，站点可暂时停用并移除该插件，排查并删除来源不明的管理员账号，或通过 WAF 拦截针对 action=usfw_create_temporary_user 的未授权请求。", "effects": [{"comp_name": "ultimate-security-for-woocommerce", "ecosystem": "linux", "versions": [{"affected_version": "[1.0.10,1.0.16]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-11-05", "level": "Critical", "mps_id": "MPS-nu9l-ibps", "poc": false, "poc_url": [], "published_time": "2026-11-05", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-nu9l-ibps", "name": "https://www.oscs1024.com/hd/MPS-nu9l-ibps"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-100109", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-100109"}, {"url": "https://wpscan.com/vulnerability/b4d26eb3-ab32-456e-9f69-9ab300fdf44c/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Security For WooCommerce 未授权提权漏洞", "_translated": true, "_saved_at": "2026-11-05T11:46:06+00:00", "_first_saved_at": "2026-11-05T11:46:06+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-nu9l-ibps"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-123025", "cvss": {"cvssv4": [{"source": "cve@mitre.org", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.4}]}, "cvss_score": 9.4, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-78", "description": "OPNsense os-acme-client 是 OPNsense 防火墙的开源 ACME 客户端插件，基于 acme.sh 实现证书的自动签发与续期，其 Google Cloud DNS 验证模块依赖 gcloud 命令行工具完成 DNS-01 验证。\n受影响版本中，具备证书签发或续期权限的已认证用户可通过 WebGUI/API 将 DNS 验证配置中的 dns_gcloud_key 字段设置为恶意 JSON 内容，DnsGcloud::prepare() 使用 json_decode 提取其中的 project_id 与 client_email 赋值给 gcloud_project 与 gcloud_account 后，未做任何校验或转义，直接拼接进传给 LeUtils::run_shell_command() 的 gcloud 命令字符串，并由 proc_open() 以 root 身份执行，攻击者在 JSON 字段中注入 shell 元字符可以 root 权限执行任意命令。\n修复版本中通过 Shell::exec_safe() 以 %s 占位符构造上述 gcloud 命令，对 gcloud_config、gcloud_key_file、gcloud_account 与 gcloud_project 逐一执行 escapeshellarg 转义后再传入 LeUtils::run_shell_command()，使 dns_gcloud_key 中的可控内容无法再改变 shell 命令结构，切断了命令注入路径。", "effects": [{"comp_name": "os-acme-client", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,4.18)", "min_fixed_version": "4.18", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "低", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-11-05", "level": "Critical", "mps_id": "MPS-xbpe-l75t", "poc": true, "poc_url": [], "published_time": "2026-11-05", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-xbpe-l75t", "name": "https://www.oscs1024.com/hd/MPS-xbpe-l75t"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-123025", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-123025"}, {"url": "https://github.com/opnsense/plugins/pull/5873", "name": ""}], "scope_influence": "", "tags": ["poc", "应用软件"], "title": "OPNsense os-acme-client 命令注入漏洞", "_translated": true, "_saved_at": "2026-11-05T11:46:13+00:00", "_first_saved_at": "2026-11-05T11:46:13+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-xbpe-l75t"}, {"analysis_status": 0, "articles": [{"content": "- 命令注入是一种攻击，其目标是通过易受攻击的应用程序在主机操作系统上执行任意命令。 当应用程序将不安全的用户提供的数据（表单、cookie、HTTP 标头等）传递到系统 shell 时，就会产生缺陷。攻击者通过构造恶意的命令或数据，将其注入到程序执行的上下文中，从而绕过程序的输入验证和安全措施，实现对程序操作的恶意操作。", "title": "什么是命令注入"}, {"content": "- 文件上传：攻击者通过构造恶意的文件上传请求，将包含恶意命令的文件上传到服务器，从而利用命令注入漏洞执行恶意命令。\n- SQL 注入：攻击者通过构造恶意的 SQL 查询语句，将包含恶意命令的 SQL 语句注入到数据库中，从而执行恶意命令，窃取数据或者破坏系统。\n- 命令执行：攻击者通过在 Web 应用程序的表单提交数据中注入恶意命令，从而执行恶意命令，例如删除文件、格式化硬盘等。\n- 命令注入漏洞的旁路攻击：攻击者可以利用命令注入漏洞旁路控制程序的执行流程，从而窃取数据、破坏系统、控制程序等。\n", "title": "命令注入常见的攻击方式"}, {"content": "- 输入验证：在程序输入处对输入数据进行严格的验证和过滤，确保输入数据符合预期的格式和类型，避免被攻击者注入恶意命令。\n- 输出过滤：在程序输出处对输出数据进行严格的过滤和检查，确保输出数据符合预期的格式和类型，避免被攻击者截获和篡改。\n- 使用安全的编程模型：使用安全的编程模型，例如避免使用原生的命令执行方式，使用安全的框架和库来处理输入数据和执行命令，避免命令注入漏洞。\n- 数据库加密和访问控制：对于敏感数据和命令，使用加密和访问控制措施，确保只有授权用户可以访问和执行命令，避免被攻击者窃取和篡改。\n- 定期更新和升级：定期更新和升级应用程序和库的版本，确保应用程序和库的最新版本包含了最新的安全补丁和修复措施，避免安全漏洞的出现和利用。\n- 安全审计和监控：定期对系统和应用程序进行安全审计和监控，及时发现和阻止潜在的安全漏洞和攻击，确保系统和数据的安全和可靠性。", "title": "如何预防命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-122051", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:N/AC:L/Au:N/C:C/I:C/A:C", "severity": "high", "base_score": 10}], "cvssv3": [{"source": "VulDB", "vector": "CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H/E:P/RL:X/RC:C", "severity": "critical", "base_score": 10}], "cvssv31": [{"source": "cna@vuldb.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 10}], "cvssv4": [{"source": "cna@vuldb.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-77", "description": "Edimax BR-6208AC 是 Edimax 推出的双频无线路由器，运行闭源固件，通过内置 Boa Web 服务提供设备管理界面，面向家庭与小规模办公网络。\n受影响版本中，固件 1.32 的管理端点 /goform/mp 通过 websGetVar 读取 POST 参数 command，仅在该值首个分号处截断，未做其他过滤，随后以 sprintf 将其拼接为固定命令模板 /bin/rftest.sh %s \u003e /tmp/rftest.out 并传入 system() 执行；攻击者在 command 参数中插入管道符可绕过分号截断处理，使任意命令在设备系统上以 Web 服务进程权限运行，公开 PoC 已验证可远程创建文件并回显执行结果。\n修复版本中通过，可通过将设备管理界面限制于可信网络、关闭面向外网的远程管理能力并阻断对 /goform/mp 的未授权访问来降低风险；厂商在披露前已收到通报但未回应，截至 2026-11-05 未发布修复固件，后续需关注 Edimax 官方固件更新并在新版本发布后及时升级。", "effects": [{"comp_name": "br-6208ac", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.32]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "命令注入", "kind_en": "命令中使用的特殊元素的不正确中和（“命令注入”）", "last_modified_time": "2026-11-05", "level": "Critical", "mps_id": "MPS-9a4s-u2yf", "poc": false, "poc_url": [], "published_time": "2026-11-05", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-9a4s-u2yf", "name": "https://www.oscs1024.com/hd/MPS-9a4s-u2yf"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-122051", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-122051"}, {"url": "https://vuldb.com/vuln/431135", "name": "VDB-43 格的验证和过滤，确保输入数据符合预期的格式和类型，避免被攻击者注入恶意命令或数据。可以使用正则表达式、格式字符串等方式进行输入验证。\n- 输出过滤：在程序输出处对输出数据进行严格的过滤和检查，确保输出数据符合预期的格式和类型，避免被攻击者截获和篡改。可以使用安全的输出过滤库等方式进行输出过滤。\n- 使用安全的编程模型：使用安全的编程模型，例如避免使用原生的缓冲区管理函数，使用安全的框架和库来处理输入数据和执行命令，避免缓冲区溢出漏洞。\n- 数据库加密和访问控制：对于敏感数据和命令，使用加密和访问控制措施，确保只有授权用户可以访问和执行命令，避免被攻击者窃取和篡改。\n- 定期更新和升级：定期更新和升级应用程序和库的版本，确保应用程序和库的最新版本包含了最新的安全补丁和修复措施，避免安全漏洞的出现和利用。\n- 安全审计和监控：定期对系统和应用程序进行安全审计和监控，及时发现和阻止潜在的安全漏洞和攻击，确保系统和数据的安全和可靠性。", "title": "如何预防经典缓冲区溢出"}], "cnvd_id": "", "cve_id": "CVE-2026-76955", "cvss": {"cvssv31": [{"source": "security@zyxel.com.tw", "vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-120", "description": "Zyxel 无线接入点、FWA7 与安全路由器固件是 Zyxel 发布的闭源网络设备固件，用于提供无线接入、网状组网与安全路由，zdp_wtp 是这些固件中的二进制组件。\n受影响版本中，固件二进制 zdp_wtp 存在缓冲区溢出。同一局域网内无需认证的攻击者可向受影响设备发送触发该溢出的输入，并在设备上提升权限。\n修复版本中通过安装 Zyxel 为各受影响型号发布的补丁固件，修复 zdp_wtp 缓冲区溢出并阻断局域网未授权权限提升。公开资料未披露补丁内的具体代码改动。", "effects": [{"comp_name": "FWA7 Leaf Plus", "ecosystem": "linux", "versions": [{"affected_version": "[[, 7.40(ACQL.2)C0),+∞)", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "FWA7 Root", "ecosystem": "linux", "versions": [{"affected_version": "[[, 7.40(ACUJ.2)C0),+∞)", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "FWA7 Root Plus", "ecosystem": "linux", "versions": [{"affected_version": "[[, 7.40(ACQK.2)C0),+∞)", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "IAP500BE", "ecosystem": "linux", "versions": [{"affected_version": "[[, 7.40(ACPJ.2)C0),+∞)", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "NWA110AX", "ecosystem": "linux", "versions": [{"affected_version": "[[, 7.12(ABTG.1)C0),+∞)", "min_fixed_version": "", "repository": "unmanaged", "soluti  "fix_suggestion": "建议修复", "kind": "使用候选路径或通道进行的认证绕过", "kind_en": "使用备用路径或通道绕过身份验证", "last_modified_time": "2026-11-03", "level": "High", "mps_id": "MPS-gtqo-1n3r", "poc": false, "poc_url": [], "published_time": "2026-11-03", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-gtqo-1n3r", "name": "https://www.oscs1024.com/hd/MPS-gtqo-1n3r"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-71450", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-71450"}, {"url": "https://www.johnsoncontrols.com/trust-center/cybersecurity/security-advisories", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "EasyIO认证绕过漏洞", "_translated": true, "_saved_at": "2026-11-03T07:28:18+00:00", "_first_saved_at": "2026-11-03T00:19:50+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-gtqo-1n3r"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-115215", "cvss": {"cvssv4": [{"source": "emo@eclipse.org", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-772", "description": "Eclipse ThreadX NetX Duo 是 Eclipse 基金会维护的开源嵌入式 TCP/IP 协议栈，采用 MIT 许可证。其 NetX Secure 组件提供 DTLS 服务端，用于在资源受限设备上为 UDP 通信建立安全会话。\n受影响版本中，DTLS 服务端的 _nx_secure_dtls_receive_callback 在 nx_secure_dtls_session_cache_find 未命中时，对长度达到 DTLS 记录头且记录类型不是 Alert 的数据报直接调用 nx_secure_dtls_session_cache_get_new，按源地址和端口占用固定会话池中的一个槽位，并调用 connect_notify。HelloVerifyRequest 的 cookie 存放在该会话内，分配之前不能完成回程可达性校验。槽位仅在应用结束、删除或重置会话，或停止服务时经 _nx_secure_dtls_session_reset 释放；_nx_secure_dtls_session_start 在握手超时或重试耗尽后返回，且不重置会话。远程、无需凭据的攻击者对每个伪造源地址或端口发送一个数据报，便可占满应用设定的 nx_dtls_server_sessions_count。池满后新对端收到 internal_error，nx_secure_dtls_server_session_start 返回 NX_SECURE_TLS_NO_FREE_DTLS_SESSIONS。该状态持续到应用重置被占用的会话；应用若不重置，状态不会自行结束。此问题不影响机密性与完整性。6.5.2.202603a 为 GHSA-7c5f-gmpm-f655 增加的 cookie 比较只决定已有会话是否继续握手，不能避免提前分配。\n修复版本中通过在未知来源进入会话分配前调用 _nx_secure_dtls_server_cookie_check，对未分片且会话标识不超过 32 字节的初始 ClientHello 发送无状态 HelloVerifyRequest，发送时不分配会话。cookie 由服务端周期性轮换的密钥对客户端地址、客户端端口、服务端端口以及 ClientHello 的版本、随机数、会话标识、密码套件和压缩方法计算 HMAC。只有携带有效 cookie 的 ClientHello 才会调用 nx_secure_dtls_session_cache_get_new 并触发 connect_notify。未知来源的其他数据报被丢弃且不回复。", "effects": [{"comp_name": "netxduo", "ecosystem": "linux", "versions": [{"affected_version": "[6.0,6.5.2.202603b)", "min_fixed_version": "6.5.2.202603b", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "对已超过有效生命周期的资源丧失索引", "kind_en": "有效生命周期后缺少资源释放", "last_modified_time": "2026-11-03", "level": "High", "mps_id": "MPS-j6vf-kaow", "poc": false, "poc_url": [], "published_time": "2026-11-03", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-j6vf-kaow", "name": "https://www.oscs1024.com/hd/MPS-j6vf-kaow"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-115215", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-115215"}, {"url": "https://github.com/eclipse-threadx/netxduo/security/advisories/GHSA-3p2g-x7hh-3w4c", "name": ""}, {"url": "https://gitlab.eclipse.org/security/cve-assignment/-/work_items/487", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "NetX Duo DTLS会话耗尽", "_translated": true, "_saved_at": "2026-11-03T00:19:56+00:00", "_first_saved_at": "2026-11-03T00:19:56+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-j6vf-kaow"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-120091", "cvss": {"cvssv4": [{"source": "security@temporal.io", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/ tream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "资源默认不安全", "kind_en": "使用不安全默认值初始化资源", "last_modified_time": "2026-11-03", "level": "High", "mps_id": "MPS-yziu-4crs", "poc": false, "poc_url": [], "published_time": "2026-11-03", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-yziu-4crs", "name": "https://www.oscs1024.com/hd/MPS-yziu-4crs"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-120091", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-120091"}, {"url": "https://github.com/temporalio/temporal/releases/tag/v1.32.2", "name": "First fixed 1.32 release"}, {"url": "https://github.com/temporalio/temporal/releases/tag/v1.31.5", "name": "First fixed 1.31 release"}, {"url": "https://github.com/temporalio/temporal-auto-scaled-workers/pull/165", "name": "Fix pull request, Kubernetes compute provider removed from default builds"}, {"url": "https://github.com/temporalio/temporal/pull/12843", "name": "Fix pull request, compute configuration validation requires namespace write access"}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-89139", "name": "CVE-2026-89139, related compute provider vulnerability in the same module"}], "scope_influence": "", "tags": ["go"], "title": "Temporal Server命令注入", "_translated": true, "_saved_at": "2026-11-03T00:19:54+00:00", "_first_saved_at": "2026-11-03T00:19:54+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-yziu-4crs"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过向受信任的数据序列化过程中添加恶意数据，从而在序列化和反序列化过程中执行恶意代码的攻击漏洞。这种漏洞通常存在于使用序列化 (serialization) 机制存储和传输数据的程序中。\n", "title": "什么是反序列化"}, {"content": "- 注入攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码注入到程序中，从而实现代码执行的目的。\n- 反射攻击：攻击者使用反射机制，在序列化过程中动态生成恶意数据，并将恶意代码注入到程序中，从而实现代码执行的目的。\n- 缓冲区溢出攻击：攻击者通过在序列化过程中向缓冲区输入恶意数据，导致缓冲区溢出，从而破坏程序的内存管理，实现代码执行的目的。\n- 格式字符串攻击：攻击者通过在序列化过程中输入恶意数据，导致程序使用错误的格式字符串，从而实现代码执行的目的。\n- 数据流攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码作为一个数据流传递给程序，从而实现代码执行的目的。\n", "title": "反序列化常见的攻击方式"}, {"content": "- 不信任输入数据：程序应该严格检查输入数据的有效性，并避免使用不受信任的数据。\n- 使用安全的序列化机制：程序应该使用安全的序列化机制，如 JSON 或 XML 序列化，而不是第三方序列化库。\n- 最小特权原则：程序应该限制对受信任数据的处理权限，并避免在运行时修改数据。\n- 代码审查和漏洞扫描：程序应该进行代码审查和漏洞扫描，以发现和修复潜在的安全漏洞。\n", "title": "如何预防反序列化"}], "cnvd_id": "", "cve_id": "CVE-2026-120833", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.5}]}, "cvss_score": 8.5, "cvss_vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-502", "description": "labbench 是 NIST 维护的开源 Python 实验室自动化库，通过 PyPI 分发，用于把实验流程写成可复用脚本，并对外提供 labbench.read 与 labbench.read_relational 读取表格数据和关系型实验数据。\n受影响版本中，src/labbench/_data.py 的 read() 在 reader_guess 中把扩展名 p 与 pickle 直接映射到 pandas.read_pickle。format 为 auto 时仅依据路径扩展名选择读取器，显式传入 p 或 pickle 时同样选择该读取器，并在后续分支调用 pandas.read_pickle。read_relational() 先调用 read() 加载根表，再由 MungeReader 按根表记录的成员路径再次调用 read()，关系型归档内扩展名为 p 或 pickle 的成员因此进入同一反序列化路径。用户加载攻击者提供的数据文件或关系型归档时，pickle 会在本地进程中执行任意代码。\n修复版本中通过新增 read_pickle()，在环境变量 LABBENCH_AUTOLOAD_PICKLE 未设置或取值为空、0、false、no、off 时抛出 RuntimeError 并拒绝调用 pandas.read_pickle，同时把 reader_guess 中 p 与 pickle 的目标改为 read_pickle，使 read() 与 read_relational() 在默认配置下不再自动反序列化不可信 pickle 数据。", "effects": [{"comp_name": "labbench", "ecosystem": "pip", "versions": [{"affected_version": "[0,0.46.1)", "min_fixed_version": "0.46.1", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "高", "fix_suggestion": "建议修复", "kind": "反序列化", "kind_en": "不可信数据的反序列化", "last_modified_time": "2026-11-03", "level": "High", "mps_id": "MPS-yg2s-7i8r", "poc": true, "poc_url": [], "published_time": "2026-11-03", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-yg2s-7i8r", "name": "https://www.oscs1024.com/hd/MPS-yg2s-7i8r"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-120833", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-120833"}, {"url": "https://github.com/usnistgov/labbench/pull/32", "name": "GitHub Pull Request #32"}, {"url": "https://github.com/usnistgov/labbench/commit/ac9b9b18cba67cb8e85eb563b6bb7dc1092b4c54", "name": "Patch Commit"}, {"url": "https://github.com/usnistgov/labbench/blob/0.46.0/src/labbench/_data.py#L1664-L1666", "name": ""}, {"url": "https://github.com/usnistgov/labbench/blob/0.46.1/ChangeLog.md", "name": "labbench ChangeLog"}, {"url": "https://pypi.org/project/labbench/0.46.1/", "name": ""}, {"url": "https://github.com/usnistgov/labbench", "name": ""}, {"url": "https://www.vulncheck.com/advisories/labbench-before-0.46.1-deserialization-of-untrusted-data-via-read-pickle-auto-dispatch", "name": "VulnCheck Advisory: labbench before 0.46.1 Deserialization of Untrusted Data via read() Pickle Auto-Dispatch"}], "scope_influence": "", "tags": ["poc", "python", "开源"], "title": "labbench反序列化漏洞", "_translated": true, "_saved_at": "2026-11-03T07:28:13+00:00", "_first_saved_at": "2026-11-03T07:28:13+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-yg2s-7i8r"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用了空指针，并在不进行有效检查的情况下对其进行取消引用操作。当程序试图取消引用空指针时，由于空指针不指向任何有效的内存地址，会导致程序崩溃或产生未定义的行为。这种错误通常发生在开发者未对指针进行正确的初始化或验证时。", "title": "什么是空指针取消引用"}, {"content": "- 拒绝服务：攻击者可以通过构造恶意输入或请求，触发程序中的空指针取消引用错误，导致程序崩溃或无法正常运行。这可能导致拒绝服务攻击，使系统无法提供正常的服务。\r\n- 内存信息泄露：攻击者可以通过利用空指针取消引用错误，访问程序中的敏感内存信息。这可能包括栈上的变量、函数指针或其他敏感数据，从而暴露系统的机密信息。\r\n- 代码执行：在某些情况下，空指针取消引用错误可能导致执行恶意代码或注入恶意代码的机会。攻击者可以通过精心构造的输入，利用空指针取消引用错误来执行任意的代码，进而获取系统控制权或执行未经授权的操作。", "title": "空指针取消引用常见的攻击方式"}, {"content": "- 指针初始化和验证：开发者应该正确地初始化指针，并在使用指针之前进行有效的验证，确保指针不为空。在取消引用指针之前，应始终检查其是否为空。\r\n- 异常处理和错误恢复：程序应该具备健壮的异常处理和错误恢复机制，以便在发生空指针取消引用错误时能够适当地处理异常，而不是导致程序崩溃或暴露敏感信息。\r\n- 防御性编程：采用防御性编程的原则，如避免在未经验证的指针上进行操作，避免使用未初始化的指针等，以防止空指针取消引用错误的发生。\r\n- 静态代码分析和测试：使用静态代码分析工具和测试技术来检测和识别潜在的空指针取消引用错误。这些工具可以帮助发现代码中可能存在的空指针问题，并及时修复。\r\n- 强制性编码标准和最佳实践：制定强制性的编码标准和最佳实践，包括良好的指针使用和管理规范，以帮助开发者编写更可靠、安全的代码。", "title": "如何预防空指针取消引用"}], "cnvd_id": "", "cve_id": "CVE-2026-115403", "cvss": {"cvssv4": [{"source": "emo@eclipse.org", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.2}]}, "cvss_score": 8.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-476", "description": "Eclipse ThreadX NetX Duo 是 Eclipse 基金会维护的开源嵌入式双栈 TCP/IP 协议栈，为实时操作系统设备提供 IPv4/IPv6 通信与 BSD 套接字接口。\n受影响版本中，在同时启用 NX_BSD_ENABLE、NX_BSD_RAW_SUPPORT 与 FEATURE_NX_IPV6 的构建里，应用对 AF_INET6 原始套接字设置 IP_RAW_IPV6_HDRINCL 后发送自带 IPv6 首部的报文时，_nxd_bsd_ipv6_packet_send 会为尚未进入目的地址表的链路外目的地调用 _nx_icmpv6_dest_table_add。当默认路由器的邻居缓存项未知时，该函数在检查返回状态之前读取 dest_entry_ptr 的 nx_ipv6_destination_entry_nd_entry。目的地址表已满或无法为下一跳建立邻居缓存时，添加操作返回 NX_NOT_SUCCESSFUL 且表项指针为空，发送线程因此发生空指针解引用并崩溃。远程发送方可借助 ICMPv6 Packet Too Big 报文填满目的地址表。\n修复版本中通过先判断 _nx_icmpv6_dest_table_add 返回 NX_SUCCESS，再读取目的表项中的邻居缓存指针，使添加失败时进入原有的报文释放路径，不再解引用空指针。", "effects": [{"comp_name": "netxduo", "ecosystem": "linux", "versions": [{"affected_version": "[6.0,6.5.2.202603b)", "min_fixed_version": "6.5.2.202603b", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "空指针取消引用", "kind_en": "空指针取消引用", "last_modified_time": "2026-11-03", "level": "High", "mps_id": "MPS-2yzv-95sb", "poc": false, "poc_url": [], "published_time": "2026-11-03", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-2yzv-95sb", "name": "https://www.oscs1024.com/hd/MPS-2yzv-95sb"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-115403", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-115403"}, {"url": "https://github.com/eclipse-threadx/netxduo/security/advisories/GHSA-9w9h-x3fh-m3fp", "name": ""}, {"url": "https://gitlab.eclipse.org/security/cve-assignment/-/work_items/500", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "NetX Duo空指针解引用", "_translated": true, "_saved_at": "2026-11-03T00:19:57+00:00", "_first_saved_at": "2026-11-03T00:19:57+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-2yzv-95sb"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "cnvd_id": "", "cve_id": "CVE-2026-99238", "cvss": {"cvssv31": [{"source": "416baaa9-dc9f-4396-8d5f-8c081fb06d67", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-416", "description": "Linux内核是开源的操作系统内核，其tracing子系统（ftrace）基于tracefs提供跟踪实例与持久化缓冲管理，persistent trace实例在内核模块加载或卸载时更新已记录的模块信息，用于维护跨启动的模块映射。\n受影响版本中，模块加载与卸载通知回调trace_module_notify()调用trace_module_record()遍历全局实例链表ftrace_trace_arrays，该遍历未持有trace_types_lock；并发的跟踪实例删除路径instance_rmdir()在持有该锁的情况下将实例移出链表并释放，模块加载或卸载与实例删除并发时可能访问已释放的trace_array，形成use-after-free。\n修复版本中通过在trace_module_record()入口处添加guard(mutex)(\u0026trace_types_lock)持锁遍历实例链表，使模块通知路径与实例删除操作互斥，消除对已释放trace_array的访问。", "effects": [{"comp_name": "linux_kernel", "ecosystem": "linux", "versions": [{"affected_version": "[6.15,7.4)", "min_fixed_version": "7.4", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "UAF", "kind_en": "免费后使用", "last_modified_time": "2026-11-03", "level": "High", "mps_id": "MPS-4d8g-z7x3", "poc": false, "poc_url": [], "published_time": "2026-11-03", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-4d8g-z7x3", "name": "https://www.oscs1024.com/hd/MPS-4d8g-z7x3"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-99238", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-99238"}, {"url": "https://git.kernel.org/stable/c/57408eac99b0d8a005796346d317d31f0ca4e07a", "name": ""}, {"url": "https://git.kernel.org/stable/c/dab2bd4d67ad5eaa95019a9511f8d379401b5021", "name": ""}, {"url": "https://git.kernel.org/stable/c/244c442f54601a24c86ad90572bf36fc3df41c5e", "name": ""}], "scope_influence": "", "tags": ["操作系统"], "title": "Linux内核tracing子系统use-after-free漏洞", "_translated": true, "_saved_at": "2026-11-02T17:40:49+00:00", "_first_saved_at": "2026-11-02T17:40:49+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-4d8g-z7x3"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射 a77f1707f26029da", "name": ""}, {"url": "https://git.kernel.org/stable/c/d3afd7803f9bc2a8c4270199497b60158b2fc647", "name": ""}], "scope_influence": "", "tags": ["操作系统"], "title": "蓝牙L2CAP信道重复关联", "_translated": true, "_saved_at": "2026-11-02T17:40:51+00:00", "_first_saved_at": "2026-11-02T17:40:51+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-je50-nvch"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "cnvd_id": "", "cve_id": "CVE-2026-99231", "cvss": {"cvssv31": [{"source": "416baaa9-dc9f-4396-8d5f-8c081fb06d67", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-416", "description": "Linux 内核中的 io_uring 是随 5.1 版本引入的开源异步 I/O 框架，通过 io_uring_setup 与 io_uring_enter 系统调用向用户态提供提交队列和完成队列，其中 IORING_OP_WAITID 操作用于以异步方式等待本进程子进程的状态变化，对应实现位于内核文件 io_uring/waitid.c。\n受影响版本中，子进程退出唤醒时在等待队列锁保护下执行的回调 io_waitid_wait() 先通过 list_del_init 摘除等待项并以 smp_store_release 清空 iw-\u003ehead，随后才以 atomic_fetch_inc(\u0026iw-\u003erefs) 竞争请求所有权；而 io_waitid_remove_wq() 仅在 iw-\u003ehead 非空时才获取等待队列锁，因此另一 CPU 上持有引用的释放或取消路径（__do_wait() 找到其他子进程后的完成路径，或 __io_waitid_cancel() 取消路径）可在此窗口内完成请求并释放 io_kiocb，回调随后仍对已释放请求执行 atomic_fetch_inc(\u0026iw-\u003erefs)，递增的实为复用该请求内存的下一个操作的同名字段，计数恰为零时回调还会在其上调度 io_waitid_cb()，形成 slab-use-after-free，官方 KASAN 记录显示请求被 IORING_OP_RECV 复用后在 __wake_up_common() 触发释放后访问。\n修复版本中通过调整 io_waitid_wait() 的执行顺序消除竞争窗口：先以 atomic_fetch_inc(\u0026iw-\u003erefs) 竞争请求所有权，仅在实际取得所有权后才以 smp_store_release 清空 iw-\u003ehead；未取得所有权时保留 iw-\u003ehead，使请求拥有者必须先获取回调调用方持有的等待队列锁才能完成并释放请求，重复对已摘除节点执行 list_del_init 无副作用，该修复已回传至 6.12.115、6.18.60 与 7.2.14。", "effects": [{"comp_name": "linux_kernel", "ecosystem": "linux", "versions": [{"affected_version": "[6.12.113,6.12.115)", "min_fixed_version": "6.12.115", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.18.52,6.18.60)", "min_fixed_version": "6.18.60", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.19,7.2.14)", "min_fixed_version": "7.2.14", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "UAF", "kind_en": "免费后使用", "last_modified_time": "2026-11-03", "level": "High", "mps_id": "MPS-ji4s-kbzn", "poc": false, "poc_url": [], "published_time": "2026-11-03", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ji4s-kbzn", "name": "https://www.oscs1024.com/hd/MPS-ji4s-kbzn"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-99231", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-99231"}, {"url": "https://git.kernel.org/stable/c/bf01da1a9cca4a54e5c30b8344e52c26afb87be7", "name": ""}, {"url": "https://git.kernel.org/stable/c/8381a912c65b8de16e8a848225c7c5a56b6ea834", "name": ""}, {"url": "https://git.kernel.org/stable/c/c10ad2813e15186fb51b37a4d17fafddc99e89a5", "name": ""}], "scope_influence": "", "tags": ["操作系统"], "title": "Linux内核io_uring waitid释放后使用漏洞", "_translated": true, "_saved_at": "2026-11-02T17:40:53+00:00", "_first_saved_at": "2026-11-02T17:40:53+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ji4s-kbzn"}, {"analysis_status": 0, "articles": [{"content": "跨界内存读是指应用程序在读取内存时，未正确验证或限制读取的内存范围。攻击者利用这种漏洞可以读取应用程序内存中的敏感数据，如密码、加密密钥、会话令牌等。常见的原因是由于缓冲区溢出、格式化字符串漏洞或其他内存错误导致的。", "title": "什么是越界读取"}, {"content": "攻击者可以通过不当构造的输入来触发跨界内存读漏洞。攻击者可能会通过向应用程序发送特定的输入，使其读取超过预期的内存区域。攻击者可以利用这个漏洞来获取敏感信息，如其他用户的数据、操作系统的敏感数据或应用程序的内部状态。", "title": "越界读取常见的攻击方式"}, {"content": "- 输入验证和限制：应用程序应对所有输入数据进行严格的验证和限制。确保输入数据的长度、格式和内容符合预期，避免超出缓冲区或访问非预期的内存区域。\n- 内存安全编程实践：开发人员应使用安全的编程实践，如避免使用不安全的函数、正确处理内存分配和释放操作，以及遵循最小特权原则。\n- 使用安全的编程语言和库：选择使用安全性较高的编程语言和库，这些语言和库在内存管理和安全性方面提供了更多的保护机制。\n- 定期进行代码审查和安全测试：定期审查应用程序的代码，并进行安全测试，以发现潜在的跨界内存读漏洞。使用静态代码分析工具和漏洞扫描工具来辅助检测和修复问题。\n- 实施防御性编程技术：应用程序应采用防御性编程技术，如使用随机化地址空间布局（ASLR）、堆栈保护机制（如堆栈溢出保护）和数据执行预防（DEP）等。\n- 及时更新和修补：及时应用程序和操作系统的安全更新和补丁，以确保已知的跨界内存读漏洞得到修复。及时更新相关软件和库，以避免使用已知存在漏洞的版本。", "title": "如何预防越界读取"}], "cnvd_id": "", "cve_id": "CVE-2026-99236", "cvss": {"cvssv31": [{"source": "416baaa9-dc9f-4396-8d5f-8c081fb06d67", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-125", "description": "Linux 内核是开源的操作系统内核，其 tracing 子系统通过 tracefs 与 perf 接口提供事件过滤能力，用于按表达式匹配并筛选跟踪事件。\n受影响版本中，predicate_parse() 的外层解析循环在输入以 \u0026\u0026、|| 或一元 ! 结尾时会带着未消解的运算符状态直接进入收尾阶段，prog[0].target 保持为 -1，第二轮优化遍历以该值作为下标访问 prog 数组并读取 prog[-1]，构成数组起始位置之前的越界读，相邻 slab 内存中的数据还可能被复制进通过前向跳转检查的分支目标；本地攻击者可通过 PERF_EVENT_IOC_SET_FILTER 或写入 tracefs 事件 filter 文件触达该解析路径。\n修复版本中通过在外层循环结束后增加已解析谓词计数 N 的非零检查，直接返回 -EINVAL 并记录 FILT_ERR_INVALID_FILTER 错误，使非空表达式只有在内部循环消解完全部运算符后才允许进入收尾阶段，从而阻断越界下标访问。", "effects": [{"comp_name": "linux_kernel", "ecosystem": "linux", "versions": [{"affected_version": "[4.17,7.4)", "min_fixed_version": "7.4", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.12,6.12.115)", "min_fixed_version": "6.12.115", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.18,6.18.60)", "min_fixed_version": "6.18.60", "repo  {"url": "https://git.kernel.org/stable/c/64993d970dde2a2da353e9e99595a4fa88ec27d9", "name": ""}, {"url": "https://git.kernel.org/stable/c/5bcdf3c18c3471122ee9652b0e2f5cdb718d9a46", "name": ""}], "scope_influence": "", "tags": ["操作系统"], "title": "Linux内核过滤器越界读漏洞", "_translated": true, "_saved_at": "2026-11-02T17:40:47+00:00", "_first_saved_at": "2026-11-02T17:40:47+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-n15w-aykh"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "cnvd_id": "", "cve_id": "CVE-2026-99233", "cvss": {"cvssv31": [{"source": "416baaa9-dc9f-4396-8d5f-8c081fb06d67", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-416", "description": "Linux kernel 是开源的操作系统内核，其 tracing 子系统通过 tracefs 向用户态提供 ftrace 跟踪能力，直方图触发器（hist trigger）与合成事件（synthetic event）用于对跟踪事件进行统计与跨事件关联。\n受影响版本中，event_hist_trigger_parse() 与 hist_unreg_all() 在注册或注销直方图时调用 find_synth_event() 按事件名称查找合成事件并调整其引用计数 se-\u003eref，该查找通过 strcmp 仅比较名称，不校验 event_call 对象身份；当某个非合成 trace 事件的名称与合成事件同名时，在该事件上注册或移除直方图会错误修改合成事件的引用计数，按照先在非合成事件上注册直方图、后创建并移除同名合成事件的顺序操作，se-\u003eref 会在缺少配对递增的情况下被递减，合成事件对象在仍被直方图 action 持有指针时被释放，最终形成释放后使用。\n修复版本中通过新增 find_synth_event_call() 在名称匹配之外增加 \u0026se-\u003ecall 与 file-\u003eevent_call 的指针一致性校验，event_hist_trigger_parse() 的注册与注销路径以及 hist_unreg_all() 改用该函数执行查找，仅当命中的合成事件确实对应当前 event_call 时才调整 se-\u003eref，切断了引用计数失配导致合成事件被提前释放的因果链。", "effects": [{"comp_name": "linux_kernel", "ecosystem": "linux", "versions": [{"affected_version": "[4.17,6.1.191)", "min_fixed_version": "6.1.191", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[4.17,6.12.115)", "min_fixed_version": "6.12.115", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[4.17,6.6.161)", "min_fixed_version": "6.6.161", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[4.17,7.2.15)", "min_fixed_version": "7.2.15", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[4.17,7.3.1)", "min_fixed_version": "7.3.1", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[4.17,6.18.60)", "min_fixed_version": "6.18.60", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[4.17,7.4)", "min_fixed_version": "7.4", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "UAF", "kind_en": "免费后使用", "last_modified_time": "2026-11-03", "level": "High", "mps_id": "MPS-qwn5-z2lj", "poc": false, "poc_url": [], "published_time": "2026-11-03", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-qwn5-z2lj", "name": "https://www.oscs1024.com/hd/MPS-qwn5-z2lj"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-99233", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-99233"}, {"url": "https://git.kernel.org/stable/c/381f543ed35c434d5b707369aa5dcd69ecf440af", "name": ""}, {"url": "https://git.kernel.org/stable/c/4472579bd1c83708b6fe623c870cdf728e947205", "name": ""}, {"url": "https://git.kernel.org/stable/c 常终止。\n修复版本中通过修改 spp_tc_pfield_parse_second，不再把第二字节扩展位解释为后续 P 字段仍存在，并在 base_unit_octets 或 fractional_octets 超过上限时返回 SPP_TC_PARSER_ERROR；同时将 SPP_TC_UNSEGMENTED_FRACTIONAL_MAX_OCTETS 从 (3+3) 调整为 (3+7)，使 fractional_buf 覆盖规范允许的分数部分长度，在数据写入前拒绝越界计数。", "effects": [{"comp_name": "ud3tn", "ecosystem": "linux", "versions": [{"affected_version": "[0,0.15.2)", "min_fixed_version": "0.15.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-11-03", "level": "High", "mps_id": "MPS-hvyx-p5br", "poc": false, "poc_url": [], "published_time": "2026-11-03", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-hvyx-p5br", "name": "https://www.oscs1024.com/hd/MPS-hvyx-p5br"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-121513", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-121513"}, {"url": "https://gitlab.com/d3tn/ud3tn/-/work_items/288", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "µD3TN SPP解析器堆溢出", "_translated": true, "_saved_at": "2026-11-03T15:42:51+00:00", "_first_saved_at": "2026-11-03T15:42:51+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-hvyx-p5br"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-121510", "cvss": {"cvssv31": [{"source": "cve@gitlab.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-787", "description": "µD3TN 是 D3TN GmbH 维护的开源延迟容忍网络协议栈，运行于 POSIX 系统，用于处理 Bundle Protocol v6 与 v7 以及 MTCP、SMTCP、TCPCLv3 等汇聚层。\n受影响版本中，发往本节点的 BPv6 管理记录在 bundle6_parse_administrative_record 内由 record_parser_read_byte 逐字节解析源端点标识。长度字段读完后按 record_bundle_source_str_length 加 1 分配缓冲区，并把 uint16_t 计数器 bytes_remaining 设为该长度；拷贝阶段先执行 bytes_remaining-- 再与 0 比较。声明长度为 0 时只分配 1 字节，计数器从 0 下溢为 65535，随后的输入写出分配区，远程未认证攻击者可造成堆内存破坏并使节点不可用。\n修复版本中通过在长度阶段把 bytes_remaining 为 0 判定为非法并设置 PARSER_STATUS_ERROR，使零长度源端点标识不再进入拷贝阶段，避免计数器下溢后的堆越界写。", "effects": [{"comp_name": "µD3TN", "ecosystem": "linux", "versions": [{"affected_version": "[0,0.15.2)", "min_fixed_version": "0.15.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-11-03", "level": "High", "mps_id": "MPS-mojb-aldg", "poc": false, "poc_url": [], "published_time": "2026-11-03", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-mojb-aldg", "name": "https://www.oscs1024.com/hd/MPS-mojb-aldg"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-121510", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-121510"}, {"url": "https://gitlab.com/d3tn/ud3tn/-/work_items/289", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "µD3TN管理记录越界写", "_translated": true, "_saved_at": "2026-11-03T15:42:57+00:00", "_first_saved_at": "2026-11-03T15:42:57+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-mojb-aldg"}, {"analysis_status": 0, "articles": [{"content": "跨界内存读是指应用程序在读取内存时，未正确验证或限制读取的内存范围。攻击者利用这种漏洞可以读取应用程序内存中的敏感数据，如密码、加密密钥、会话令牌等。常见的原因是由于缓冲区溢出、格式化字符串漏洞或其他内存错误导致的。", "title": "什么是越界读取"}, {"content": "攻击者可以通过不当构造的输入来触发跨界内存读漏洞。攻击者可能会通过向应用程序发送特定的输入，使其读取超过预期的内存区域。攻击者可以利用这个漏洞来获取敏感信息，如其他用户的数据、操作系统的敏感数据或应用程序的内部状态。", "title": "越界读取常见的攻击方式"}, {"content": "- 输入验证和限制：应用程序应对所有输入数据进行严格的验证和限制。确保输入数据的长度、格式和内容符合预期，避免超出缓冲区或访问非预期的内存区域。\n- 内存安全编程实践：开发人员应使用安全的编程实践，如避免使用不安全的函数、正确处理内存分配和释放操作，以及遵循最小特权原则。\n- 使用安全的编程语言和库：选择使用安全性较高的编程语言和库，这些语言和库在内存管理和安全性方面提供了更多的保护机制。\n- 定期进行代码审查和安全测试：定期审查应用程序的代码，并进行安全测试，以发现潜在的跨界内存读漏洞。使用静态代码分析工具和漏洞扫描工具来辅助检测和修复问题。\n- 实施防御性编程技术：应用程序应采用防御性编程技术，如使用随机化地址空间布局（ASLR）、堆栈保护机制（如堆栈溢出保护）和数据执行预防（DEP）等。\n- 及时更新和修补：及时应用程序和操作系统的安全更新和补丁，以确保已知的跨界内存读漏洞得到修复。及时更新相关软件和库，以避免使用已知存在漏洞的版本。", "title": "如何预防越界读取"}], "attack_vector_type": "Adjacent", "cnvd_id": "", "cve_id": "CVE-2026-120830", "cvss": {"cvssv31": [{"source": "secalert@redhat.com", "vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:C/C:H/I:N/A:N", "severity": "high", "base_score": 7.4}]}, "cvss_score": 7.4, "cvss_vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:C/C:H/I:N/A:N", "cwe": "CWE-125", "description": "libslirp 是 freedesktop.org 维护的开源用户态 TCP/IP 库，供 QEMU 和容器运行时为客户机或容器提供用户态网络。\n受影响版本中，icmp_forward_error() 组装 ICMP 差错响应时，引用原始 IPv4 报文的长度 s_ip_len 取自 IP 首部字段 ip_len，只在超过 ICMP_MAXDATALEN 时被截断，未与源 mbuf 的实际长度 msrc-\u003em_len 比较。截断或畸形报文可使随后的 memcpy 按该长度越过 msrc-\u003em_data 末尾读取宿主堆，并把读到的内容写入返回给客户机或容器的 ICMP 差错报文。\n修复版本中通过在拷贝前将 s_ip_len 限制为不超过 msrc-\u003em_len，使引用长度不再超出源缓冲区，从而阻止宿主堆数据进入 ICMP 差错响应。", "effects": [{"comp_name": "libslirp", "ecosystem": "linux", "versions": [{"affected_version": "[4.4.0,4.9.7)", "min_fixed_version": "4.9.7", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "极高", "fix_suggestion": "建议修复", "kind": "越界读取", "kind_en": "越界读取", "last_modified_time": "2026-11-03", "level": "High", "mps_id": "MPS-d7cn-6pqu", "poc": true, "poc_url": [], "published_ le6_fragment_bundle 与 bundle7_fragment_bundle 以 uint64_t 加法 fragment_offset + fragment_length 对比 payload 长度。守护进程启用 --external-dispatch 时，AAP 2.0 束分发模块返回的 DispatchResult.NextHopEntry.fragment_offset 被原样传入分片器；接近 2^64 的偏移使加法回绕并通过检查，memcpy 从 payload 缓冲区之前拷贝 fragment_length 字节并转发到下一跳，从而向对端泄露相邻堆内存，偏移落入未映射地址时进程退出。\n修复版本中通过在 bundle_processor_execute_bdm_dispatch 调用分片器之前增加边界检查，当 fragment_offset 大于等于 ADU 或 payload 长度，或 fragment_length 大于剩余长度时直接中止该次转发，避免回绕后的偏移进入 memcpy。", "effects": [{"comp_name": "ud3tn", "ecosystem": "linux", "versions": [{"affected_version": "[0,0.15.2)", "min_fixed_version": "0.15.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界读取", "kind_en": "越界读取", "last_modified_time": "2026-11-03", "level": "High", "mps_id": "MPS-5uqv-3eoy", "poc": false, "poc_url": [], "published_time": "2026-11-03", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-5uqv-3eoy", "name": "https://www.oscs1024.com/hd/MPS-5uqv-3eoy"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-121511", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-121511"}, {"url": "https://gitlab.com/d3tn/ud3tn/-/work_items/290", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "µD3TN分片器越界读", "_translated": true, "_saved_at": "2026-11-03T15:42:54+00:00", "_first_saved_at": "2026-11-03T15:42:54+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-5uqv-3eoy"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-121727", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-191", "description": "Kore 是 Joris Vink 开源发布的 C 语言 Web 应用框架与 HTTP 服务器，采用多 worker 进程模型处理并发请求，常用于构建高性能 Web 服务与 API 后端。\n受影响版本中，http_header_recv 对携带请求体的 POST、PUT 或 DELETE 请求只依据头部声明的 content_length 与 http_body_max 做一次上限校验，随后以 nb-\u003es_off - len 计算首个报文段中紧随头部的 body 字节数并交给 http_body_update 执行 req-\u003econtent_length -= len 扣减；未认证攻击者声明较小的 Content-Length 并在同一报文段中发送超过声明值的字节数，该无符号扣减发生整数下溢回绕为极大值，绕过 http_body_max 限制，worker 反复重置接收缓冲并持续调用 kore_buf_append 将网络数据追加进内存缓冲 req-\u003ehttp_body，直至默认 60 秒 http_body_timeout 触发，造成 worker 内存耗尽与服务不可用。\n修复版本中通过在 http_header_recv 的超限校验中新增 (nb-\u003es_off - len) \u003e req-\u003econtent_length 判定条件，首个报文段实际携带的字节数超过声明值时置 HTTP_REQUEST_DELETE 并返回 HTTP_STATUS_REQUEST_ENTITY_TOO_LARGE，请求在进入 body 扣减逻辑前被拒绝，消除整数下溢并恢复 http_body_max 对内存缓冲增长的上限约束。", "effects": [{"comp_name": "kore", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,4.3.0)", "min_fixed_version": "4.3.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "超界折返", "kind_en": "整数下溢（环绕或环绕）", "last_modified_time": "2026-11-04", "level": "High", "mps_id": "MPS-fdx5-iklq", "poc": false, "poc_url": [], "published_time": "2026-11-04", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-fdx5-iklq", "name": "https://www.oscs1024.com/hd/MPS-fdx5-iklq"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-121727", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-121727"}, {"url": "https://github.com/jorisvink/kore/commit/1ff3c0f6f7973dc7fc8bf38369790ef2d8079b3b", "name": "Patch Commit"}, {"url": "https://github.com/jorisvink/kore", "name": ""}, {"url": "https://kore.io/releases/4.3.0", "name": "Kore 4.3.0 Release Notes"}, {"url": "https://github.com/jorisvink/kore/blob/4.3.0-rc5/src/http.c#L934", "name": ""}, {"url": "https://www.vulncheck.com/advisories/kore-before-4.3.0-integer-underflow-memory-exhaustion-via-http-header-recv", "name": "VulnCheck Advisory: Kore before 4.3.0 Integer Underflow Memory Exhaustion via http_header_recv()"}], "scope_influence": "", "tags": ["应用软件"], "title": "kore整数下溢内存耗尽漏洞", "_translated": true, "_saved_at": "2026-11-04T01:49:02+00:00", "_first_saved_at": "2026-11-04T01:49:02+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-fdx5-iklq"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-121731", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L 6.3.3", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "(-∞,5.19.12)", "min_fixed_version": "5.19.12", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "输入验证不恰当", "kind_en": "输入验证不当", "last_modified_time": "2026-11-04", "level": "High", "mps_id": "MPS-18ca-568c", "poc": false, "poc_url": [], "published_time": "2026-11-04", "reference_url_list": [{"url": "https://www.openwall.com/lists/oss-security/2026/11/03/17", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-108946", "name": ""}, {"url": "https://activemq.apache.org/", "name": ""}, {"url": "https://github.com/apache/activemq/pull/2682", "name": ""}, {"url": "https://github.com/apache/activemq/commit/afdbf624c92d60a5adef62d7fc584bb5d09fb33b", "name": ""}, {"url": "https://github.com/apache/activemq/commit/d7665d7497f7e48b676a62a0e294b512fa2dc9d3", "name": ""}, {"url": "https://github.com/apache/activemq/commit/ce5794bd44b7636b63ea4736eb5419472d3cb4c0", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "ActiveMQ连接标识校验缺失漏洞", "_translated": true, "_saved_at": "2026-11-03T21:25:34+00:00", "_first_saved_at": "2026-11-03T21:25:34+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-18ca-568c"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-87040", "cvss": {"cvssv31": [{"source": "vulnerabilities@zephyrproject.org", "vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:U/C:L/I:H/A:H", "severity": "high", "base_score": 8.3}]}, "cvss_score": 8.3, "cvss_vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:U/C:L/I:H/A:H", "cwe": "CWE-787", "description": "Zephyr 是 Linux 基金会旗下 Zephyr 项目开源维护的嵌入式实时操作系统，其蓝牙 LE 控制器为 Nordic nRF 系列射频提供链路层实现，广泛用于物联网、医疗与工业嵌入式设备的低功耗蓝牙通信。\n受影响版本中，nRF 链路层接收路径未校验空口 PDU 头部 LENGTH 字段是否超过无线收发器配置的最大接收长度。lll_conn.c 中 isr_rx_pdu() 在序列号与 MIC 校验通过后直接入队任意非空数据 PDU，而 nRF radio 硬件仅按 PCNF1.MAXLEN 截断 payload 并原样保存头部长度字节，攻击者在无线信号范围内发送长度字节最大为 255 的伪造 PDU（控制器默认编程的 lll-\u003edle.eff.max_rx_octets 为 27），形成 len 字段大于缓冲区实际容量的 node_rx；该缓冲区随后进入 hci.c 的 hci_acl_encode()，其 net_buf_add(buf, pdu_data-\u003elen) 与 memcpy 按未校验长度越界读取约 228 字节并越界写入 HCI ACL 缓冲池相邻内存，ISO 接收路径经 isoal_rx_append_to_sdu() 同样越界读取并把控制器内存作为 ISO 数据上送主机，导致远程内存破坏、控制器崩溃与内存信息泄露。\n修复版本中通过在接收路径统一增加长度边界校验解决该问题：isr_rx_pdu() 在解密后调用新增的 max_rx_octets_get() 比对 pdu_data_rx-\u003elen，超长 PDU 返回 -EINVAL 丢弃，lll_central_iso.c 与 lll_peripheral_iso.c 按 cis_lll-\u003erx.max_pdu、lll_sync_iso.c 按 lll-\u003emax_pdu、lll_scan_aux.c 按 LL_EXT_OCTETS_RX_MAX 同样丢弃超长 PDU，超长帧不再进入入队与 HCI 编码流程，越界读写与内存泄露链路被切断。", "effects": [{"comp_name": "zephyr", "ecosystem": "linux", "versions": [{"affected_version": "[4.4.0,4.5.0)", "min_fixed_version": "4.5.0", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[1.6.0,4.3.2)", "min_fixed_version": "4.3.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-11-04", "level": "High", "mps_id": "MPS-6faj-4ic7", "poc": false, "poc_url": [], "published_time": " 入”）", "last_modified_time": "2026-11-04", "level": "High", "mps_id": "MPS-00a1-18e7", "poc": false, "poc_url": [], "published_time": "2026-11-04", "reference_url_list": [{"url": "https://seclists.org/fulldisclosure/2026/Nov/7", "name": ""}, {"url": "https://github.com/apache/struts", "name": ""}, {"url": "https://github.com/apache/struts/blob/STRUTS_7_4_0/core/src/main/java/org/apache/struts2/ognl/SecurityMemberAccess.java", "name": ""}, {"url": "https://github.com/apache/struts/blob/STRUTS_7_4_0/core/src/main/resources/struts-excluded-classes.xml", "name": ""}, {"url": "https://github.com/apache/struts/blob/STRUTS_7_4_0/core/src/main/resources/org/apache/struts2/default.properties", "name": ""}, {"url": "https://struts.apache.org/security/", "name": ""}, {"url": "https://central.sonatype.com/artifact/org.apache.struts/struts2-core/7.4.0", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "Struts2 OGNL沙箱绕过", "_translated": true, "_saved_at": "2026-11-04T08:27:12+00:00", "_first_saved_at": "2026-11-04T08:27:12+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-00a1-18e7"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-87041", "cvss": {"cvssv31": [{"source": "vulnerabilities@zephyrproject.org", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-822", "description": "Zephyr 是 Linux 基金会托管的开源嵌入式实时操作系统，面向资源受限的物联网与嵌入式设备，RTIO 子系统为其提供异步 I/O 提交队列机制，并支持在 CONFIG_USERSPACE 下由用户态线程提交 I/O 请求。\n受影响版本中，RTIO 用户态提交队列校验函数 rtio_vrfy_sqe()（v4.3.0 前位于 subsys/rtio/rtio_handlers.c，其后位于 subsys/rtio/rtio_syscalls.c）使用 \u0026= 将 K_SYSCALL_MEMORY() 的返回值累加进 valid_sqe 标志，而该宏基于 K_SYSCALL_VERIFY_MSG() 实现、校验失败时返回非零值，导致缓冲区权限检查结果被反向采用。用户态线程经 rtio_sqe_copy_in_get_handles() 系统调用提交 SQE 时，指向内核内存的 tx.buf、rx.buf 或 txrx.tx_buf/txrx.rx_buf 指针被判定为合法并原样转发给 I2C、I3C、SPI 等 RTIO 总线驱动以内核特权解引用：RTIO_OP_RX 提交使外设数据写入攻击者指定的内核地址，RTIO_OP_TX 提交使内核内存经总线外泄，指向未映射地址的提交触发内核崩溃，攻击者由此突破 CONFIG_USERSPACE 用户态隔离边界。\n修复版本中通过为 RTIO_OP_TX、RTIO_OP_RX 与 RTIO_OP_TXRX 分支中的每处 K_SYSCALL_MEMORY() 检查结果取反后再累加进 valid_sqe，恢复权限判定的正确极性，使调用线程不可访问的缓冲区提交被拒绝，同时将 TXRX 发送缓冲区改为只读校验以对齐 SPI、I2C 与 I3C 处理器的既有行为，阻断内核内存经发送通道外泄。", "effects": [{"comp_name": "zephyr", "ecosystem": "linux", "versions": [{"affected_version": "[3.3.0,4.3.2)", "min_fixed_version": "4.3.2", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[4.4.0,4.5.0)", "min_fixed_version": "4.5.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "非可信指针解引用", "kind_en": "Untrusted Pointer Dereference", "last_modified_time": "2026-11-04", "level": "High", "mps_id": "MPS-8kvr-5yqf", "poc": false, "poc_url": [], "published_time": "2026-11-04", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-8kvr-5yqf", "name": "https://www.oscs1024.com/hd/MPS-8kvr-5yqf"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-87041", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-87041"}, {"url": "https://github.com/zephyrproject-rtos/zephyr/commit/454a848006595ce2d77fc2c9e458b0c557f5e4af", "name": "Fix commit"}, {"url": "https://github.com/zephyrproject-rtos/zephyr/security/advisories/GHSA-mvxr-jx9h-jxh4", "name": "GHSA-mvxr-jx9h-jxh4"}], "scope_influence": "", "tags": ["应用软件"], "title": "Zephyr RTIO 内核内存越权读写漏洞", "_translated": true, "_saved_at": "2026-11-04T08:27:15+00:00", "_first_saved_at": "2026-11-04T08:27:15+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-8kvr-5yqf"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-112445", "cvss": {}, "cvss_score": 7.8, "cvss_vector": "", "cwe": "CWE-250", "description": "macOS 是 Apple 开发的闭源桌面操作系统，launchd 作为系统首进程负责系统域后台作业的调度，/System/Library/LaunchDaemons 目录中的作业配置默认以 root 权限运行。\n受影响版本中，系统自带作业 com.apple.xpc.uscwoap 以 BootShell 配置启动 /bin/bash（参数 bash -sh），并将标准输入、输出与错误全部连接到 /dev/console，该作业位于 launchd 系统域且未指定降权账户，bash 进程以 UID 0 运行并从 /dev/console 读取命令；登录活动图形控制台的非管理员账号可以通过 launchctl 作业控制接口 kickstart 该作业，此时 /dev/console 设备由当前控制台用户持有，攻击者通过 TIOCSTI 终端控制接口向其输入队列注入字符，root 权限的 bash 将注入字符当作命令解释并执行，攻击者借此让 root bash 对自身副本执行 chown 0:0 与 chmod 4755，再运行该 setuid 副本获得 root shell，完成本地权限提升。\n修复版本中通过移除 com.apple.xpc.uscwoap 的 LaunchDaemon 配置切断上述利用链，macOS 27.2 删除该作业配置后，系统中不再存在以 root 身份从 /dev/console 读取命令的 bash 作业，TIOCSTI 注入路径随之失效，普通用户无法继续借道该作业获得 root 权限。", "effects": [{"comp_name": "macos", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,27.2)", "min_fixed_version": "27.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "高", "fix_suggestion": "建议修复", "kind": "带着不必要的权限执行", "kind_en": "使用不必要的权限执行", "last_modified_time": "2026-11-04", "level": "High", "mps_id": "MPS-9174-0892", "poc": true, "poc_url": [], "published_time": "2026-11-04", "reference_url_list": [{"url": "https://securityonline.info/macos-privilege-escalation-poc-cve-2026-112445/", "name": ""}, {"url": "https://github.com/Mas0nShi/CVE-2026-112445", "name": ""}, {"url": "https://support.apple.com/en-us/149521", "name": ""}], "scope_influence": "", "tags": ["poc", "操作系统"], "title": "macOS 本地权限提升漏洞", "_translated": true, "_saved_at": "2026-11-04T08:27:10+00:00", "_first_saved_at": "2026-11-04T08:27:10+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-9174-0892"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-87039", "cvss": {"cvssv31": [{"source": "vulnerabilities@zephyrproject.org", "vector": "CVSS:3.1/AV:L/AC:H/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:H/PR:L/UI:N/S:C/C:H/I:H/A:H", "cwe": "CWE-787", "description": "Zephyr 是 Zephyr Project 开源的嵌入式实时操作系统，广泛用于物联网与资源受限设备，其 CONFIG_USERSPACE 机制为用户态线程提供内核隔离，I2S 音频驱动位于内核 drivers/i2s 目录并由系统调用校验层保护。\n受影响版本中，drivers/i2s/i2s_handlers.c 的系统调用校验函数 z_vrfy_i2s_configure() 从用户内存拷贝 struct i2s_config 后，当 cfg-\u003eframe_clk_freq 为 0（取消流配置请求）时跳过 K_SYSCALL_OBJ(config.mem_slab, K_OBJ_MEM_SLAB) 对象归属校验与 block_size 合法性检查，未经校验的用户可控 mem_slab 指针直接传入驱动；drivers/i2s/i2s_litex.c 的 i2s_litex_configure() 对该场景仅记录告警，随后 memcpy() 保存完整配置并将流状态置为 I2S_STATE_READY，之后的 i2s_trigger(I2S_TRIGGER_START) 使能 FIFO 中断，中断处理函数 i2s_litex_isr_rx() 与 i2s_litex_isr_tx() 在内核态对攻击者提供的指针执行 k_mem_slab_alloc() 与 k_mem_slab_free()，构成内核态任意指针读写原语，绕过 CONFIG_USERSPACE 隔离边界；持有 I2S 设备对象访问权限的用户态线程单次 i2s_configure() 调用可触发，未启用 CONFIG_USERSPACE 的构建不受影响。\n修复版本中通过在 frame_clk_freq 为 0 的取消配置分支内清零 config.mem_slab 与 config.block_size 后再调用实现函数，驱动在该路径不再收到未校验指针，切断未校验指针进入驱动的传递链，同时保留调用方不持有内存 slab 时的取消流配置能力。", "effects": [{"comp_name": "zephyr", "ecosystem": "linux", "versions": [{"affected_version": "[4.4.0,4.5.0)", "min_fixed_version": "4.5.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-11-04", "level": "High", "mps_id": "MPS-tg25-6r8j", "poc": false, "poc_url": [], " 查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-121729", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:L/I:H/A:H", "severity": "high", "base_score": 8.3}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:L/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:L/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-862", "description": "emailflare 是 0xdps 开源（MIT 许可证）的自托管邮件发送平台，基于 Cloudflare Workers 构建，提供域名管理、API Key 发信接口（/v1/send）、收件箱、模板与统计等能力，代码以 pnpm monorepo 组织，包含 inbox-worker、inbox-server 服务与 email-core、inbox-core 等内部包。\n受影响版本中，inbox 服务的 /api/keys 路由仅要求登录会话而缺少角色授权：services/inbox-worker/src/routes/keys.ts 与 services/inbox-server/src/routes/keys.ts 的 GET /、POST /、DELETE /:id 处理逻辑均未挂载 requireAdmin 中间件，member、tester 等低权限已认证用户可以列出全部 API Key、创建新 Key 并吊销任意 Key；同时 email-core 的 keyCreateSchema 将 scope 默认值设为 global，缺省创建的 live 类型 Key（eflive_ 前缀）为全局作用域，而 /v1/* 的 requireApiKey 中间件对 global 作用域 Key 不做发信域名限制，攻击者可以铸造全局发信 Key 并以任意域名发送邮件，或吊销存量 Key 使依赖方集成失效。\n修复版本中通过在两个服务的 keys 路由注册 app.use(\"*\", requireAdmin) 并在 GET、POST、DELETE 各路由上追加该中间件，将 /api/keys 的访问限制为 admin 与 super-admin 角色；同时将 keyCreateSchema 的 scope 默认值改为 domain，并在 inbox-core 新增 verifyInboxSender 接入 compose 路由校验发件人与收件箱的归属关系，切断低权限用户铸造全局 Key、越权发信与破坏存量集成的链路。", "effects": [{"comp_name": "emailflare", "ecosystem": "linux", "versions": [{"a
