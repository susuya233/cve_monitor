ttps://www.oscs1024.com/hd/MPS-elqh-gaw0"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "cnvd_id": "", "cve_id": "CVE-2026-12878", "cvss": {"cvssv4": [{"source": "security@octopus.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-269", "description": "Codefresh 是 Octopus Deploy 提供的商业持续集成与持续交付平台，支持 Windows 与 Linux 本地部署，用于管理流水线、GitOps 与软件交付。\n受影响版本中，已认证用户可调用平台某个 API 端点，将自身权限提升为 Admin，从而获得该 Codefresh 实例的管理权限。\n修复版本中通过将 cfapi 组件从 22.3.13-onprem-043b24b 升级到 22.3.14-onprem-0acd021，并发布 Codefresh 2.11.15，阻止已认证用户再利用该 API 端点提升为 Admin 权限。", "effects": [{"comp_name": "Codefresh", "ecosystem": "linux", "versions": [{"affected_version": "[2.0.0,2.11.15)", "min_fixed_version": "2.11.15", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-08-25", "level": "High", "mps_id": "MPS-nfip-u4g9", "poc": false, "poc_url": [], "published_time": "2026-08-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-nfip-u4g9", "name": "https://www.oscs1024.com/hd/MPS-nfip-u4g9"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-12878", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-12878"}, {"url": "https://advisories.codefresh.io/post/2026/sa2026-01/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Codefresh权限提升漏洞", "_translated": true, "_saved_at": "2026-08-25T11:21:37+00:00", "_first_saved_at": "2026-08-25T11:21:37+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-nfip-u4g9"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过构造恶意的数据，将过多的数据输入到程序的缓冲区中，使得缓冲区的空间被填满，从而溢出到程序的栈 (stack) 或堆 (heap) 中，导致程序崩溃、拒绝服务、数据泄露等安全问题。\n", "title": "什么是经典缓冲区溢出"}, {"content": "| 类型        | 描述                                                         |\n| ----------- | ------------------------------------------------------------ |\n| 代码注入攻击      | 攻击者通过向程序的缓冲区输入恶意代码，从而控制程序执行流程，实现对程序操作的恶意操作。例如，攻击者可以通过向 Web 应用程序的输入框中输入恶意代码，从而执行任意的代码，破坏系统、窃取数据等。 |\n| 数据覆盖攻击      | 攻击者通过向程序的缓冲区输入过多的数据，从而覆盖程序中的重要数据或代码，实现对程序操作的恶意操作。例如，攻击者可以通过向聊天应用程序的输入框中输入过多的表情符号，从而覆盖程序中的重要数据，例如聊天消息、账号密码等。 |\n| 栈溢出攻击 | 攻击者通过向程序的栈中输入过多的数据，从而溢出到栈外部，实现对程序操作的恶意操作。例如，攻击者可以通过向游戏应用程序的输入框中输入过多的道具名称，从而覆盖程序中的重要数据，例如游戏数据、账号密码等。 |\n| 堆溢出攻击       | 攻击者通过向程序的堆中输入过多的数据，从而溢出到堆外部，实现对程序操作的恶意操作。例如，攻击者可以通过向操作系统工具的输入框中输入过多的命令，从而覆盖程序中的重要数据，例如系统文件、配置文件等。 |", "title": "经典缓冲区溢出常见的攻击方式"}, {"content": "- 输入验证：在程序输入处对输入数据进行严格的验证和过滤，确保输入数据符合预期的格式和类型，避免被攻击者注入恶意命令或数据。可以使用正则表达式、格式字符串等方式进行输入验证。\n- 输出过滤：在程序输出处对输出数据进行严格的过滤和检查，确保输出数据符合预期的格式和类型，避免被攻击者截获和篡改。可以使用安全的输出过滤库等方式进行输出过滤。\n- 使用安全的编程模型：使用安全的编程模型，例如避免使用原生的缓冲区管理函数，使用安全的框架和库来处理输入数据和执行命令，避免缓冲区溢出漏洞。\n- 数据库加密和访问控制：对于敏感数据和命令，使用加密和访问控制措施，确保只有授权用户可以访问和执行命令，避免被攻击者窃取和篡改。\n- 定期更新和升级：定期更新和升级应用程序和库的版本，确保应用程序和库的最新版本包含了最新的安全补丁和修复措施，避免安全漏洞的出现和利用。\n- 安全审计和监控：定期对系统和应用程序进行安全审计和监控，及时发现和阻止潜在的安全漏洞和攻击，确保系统和数据的安全和可靠性。", "title": "如何预防经典缓冲区溢出"}], "cnvd_id": "", "cve_id": "CVE-2026-71940", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.2}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-120", "description": "DrayTek VigorSwitch 是闭源商用以太网交换机产品系列，提供企业网络接入、PoE 供电和 Web 管理功能。\n受影响版本中，Web 管理组件 mainfunction.cgi 的 acl_general_setup Edit ACE 功能在将 name 字段复制到固定大小缓冲区时未校验长度。已通过身份验证的管理员可经 Web 管理接口提交超长输入，触发缓冲区溢出，导致拒绝服务或执行任意命令。\n修复版本中通过厂商发布的安全固件更新修复 acl_general_setup Edit ACE 路径中的缓冲区溢出，公开资料未披露更细粒度的源码修改。", "effects": [{"comp_name": "VigorSwitch FX2120", "ecosystem": "linux", "versions": [{"affected_version": "[0,3.9.10)", "min_fixed_version": "3.9.10", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "VigorSwitch G1280", "ecosystem": "linux", "versions": [{"affected_version": "[0,2.9.10)", "min_fixed_version": "2.9.10", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "VigorSwitch G1282", "ecosystem": "linux", "versions": [{"affected_version": "[0,2.9.10)", "min_fixed_version": "2.9.10", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "VigorSwitch G2100", "ecosystem": "linux", "versions": [{"affected_version": "[0,2.9.10)", "min_fixed_version": "2.9.10", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"com 程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-79673", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:N", "severity": "medium", "base_score": 6.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.5}]}, "cvss_score": 8.5, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-863", "description": "Ech0 是开源的自托管个人微博客平台，使用 Go 实现，提供访问令牌与细粒度 Scope，用于只读集成等场景。\n受影响版本中，PUT /user 以只读范围 profile:read 作为 RequireScopes 条件，但该接口会执行包括修改密码在内的写操作。攻击者持有管理员的 profile:read 访问令牌时，可向 UserHandler.UpdateUser 提交 password 字段；UserService.UpdateUser 仅校验 user.IsAdmin，随后将 userdto.Password 经 MD5 写入管理员密码。攻击者再用新密码调用 POST /login，获取 Type 为 session 的会话令牌，RequireScopes 对会话令牌直接放行，从而获得不受 Scope 约束的管理员权限。\n修复版本中通过新增 ScopeProfileWrite，将 PUT /user 的 RequireScopes 从 ScopeProfileRead 改为 ScopeProfileWrite，拒绝仅持有 profile:read 的访问令牌执行改密等写操作，切断向无限制会话令牌的提权路径。", "effects": [{"comp_name": "github.com/lin-snow/ech0", "ecosystem": "go", "versions": [{"affected_version": "(-∞,4.4.3)", "min_fixed_version": "4.4.3", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-08-25", "level": "High", "mps_id": "MPS-hupe-qw9n", "poc": false, "poc_url": [], "published_time": "2026-08-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-hupe-qw9n", "name": "https://www.oscs1024.com/hd/MPS-hupe-qw9n"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-79673", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-79673"}, {"url": "https://github.com/lin-snow/Ech0/security/advisories/GHSA-hm2h-wwwh-g49x", "name": ""}, {"url": "https://www.vulncheck.com/advisories/ech0-before-scope-bypass-via-profile-read-token", "name": ""}], "scope_influence": "", "tags": [], "title": "Ech0授权范围绕过漏洞", "_translated": true, "_saved_at": "2026-08-25T13:43:31+00:00", "_first_saved_at": "2026-08-25T12:35:44+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-hupe-qw9n"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-66109", "cvss": {"cvssv3": [{"source": "vultures@jpcert.or.jp", "vector": "CVSS:3.0/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}], "cvssv4": [{"source": "vultures@jpcert.or.jp", "vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X uence": "", "tags": ["应用软件"], "title": "Artifactory VCS SSRF漏洞", "_translated": true, "_saved_at": "2026-08-25T16:29:27+00:00", "_first_saved_at": "2026-08-25T16:29:27+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-rt5z-uwcb"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-78541", "cvss": {"cvssv4": [{"source": "f23511db-6c3e-4e32-a477-6aa17d310630", "vector": "CVSS:4.0/AV:A/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:L/SI:L/SA:L/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.5}]}, "cvss_score": 8.5, "cvss_vector": "CVSS:4.0/AV:A/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:L/SI:L/SA:L/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-78", "description": "TP-Link Archer BE3600 是面向家庭场景的商业 Wi-Fi 7 路由器，固件未以 GitHub 开源仓库形式发布，家长控制模块用于创建配置文件并生成相关云报告。\n受影响版本中，家长控制模块在保存配置文件名称时未安全过滤 shell 元字符。已通过认证的相邻网络攻击者在具备管理权限后，可将含有 shell 元字符的配置文件名称写入设备；该名称随后在每日云报告生成过程中被不安全带入操作系统命令，导致在受影响设备上执行任意命令，影响设备机密性、完整性与可用性。\n修复版本中通过官方固件 1.2.6 Build 20260617 更新家长控制模块对配置文件名称的处理，阻断恶意名称进入命令执 漏洞得到修复。及时更新相关软件和库，以避免使用已知存在漏洞的版本。", "title": "如何预防越界读取"}], "attack_vector_type": "Adjacent", "cnvd_id": "", "cve_id": "CVE-2026-75370", "cvss": {}, "cvss_score": 8.3, "cvss_vector": "", "cwe": "CWE-125", "description": "SpaceDot AcubeSAT OBC 是开源立方星星上计算机软件，运行于 Microchip ATSAMV71Q21B 微控制器，用于通过 CAN 总线处理 ECSS PUS 遥测遥控，并依赖 ecss-services 库完成报文解析与服务调度。\n受影响版本中，CAN::Application::parseTCMessage 在收到 messageType 为 0x21 的 CAN-TP 遥控后，调用 MessageParser::parseECSSTC 时把长度固定为 ECSSTCRequestStringSize（64 字节）。parseECSSTCHeader 按该长度读取 PUS 头并从 data[5] 起执行 std::copy，不核验 CAN 报文实际有效载荷。攻击者在 CAN 总线上发送短于 64 字节的遥控，即可控制 serviceType 与 messageType，使越界填充后的 Message 进入 MessageParser::execute，造成拒绝服务或执行非预期遥控。\n修复版本中通过向 parseECSSTCHeader 传入 CAN 报文实际载荷长度，替代硬编码的 64 字节，避免短报文触发越界拷贝。截至 2026-08-25，AcubeSAT OBC 软件与 ecss-services 公开仓库均未包含该修复，也未公布正式修复版本号。", "effects": [{"comp_name": "ecss-services", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.2]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "obc-software", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,eaf90ec]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界读取", "kind_en": "越界读取", "last_modified_time": "2026-08-25", "level": "High", "mps_id": "MPS-mjy2-c5zs", "poc": false, "poc_url": [], "published_time": "2026-08-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-mjy2-c5zs", "name": "https://www.oscs1024.com/hd/MPS-mjy2-c5zs"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-75370", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-75370"}, {"url": "https://github.com/dazuo233/cve/issues/5", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "AcubeSAT越界读写漏洞", "_translated": true, "_saved_at": "2026-08-24T20:22:28+00:00", "_first_saved_at": "2026-08-24T20:22:28+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-mjy2-c5zs"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-75542", "cvss": {"cvssv4": [{"source": "6b3ad84c-e1a6-4bf7-a703-f496b71e49db", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:H/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.3}]}, "cvss_score": 8.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:H/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-863", "description": "hexpm 是开源 Elixir 包仓库 hex.pm 的服务端实现，用于包发布、组织私有仓库以及基于 OAuth 的 API 访问控制。\n受影响版本中，持有 repositories 权限的 API 密钥通过 OAuth client_credentials 授权换取令牌时，HexpmWeb.API.OAuthController.validate_scopes_against_key/2 只要权限中含 :all_repositories 且请求的 scope 以 repository: 为前缀便予以放行，未把冒号后的组织名对照主体实际可达范围；expand_repositories_scope/3 只改写字面量 repositories，显式的 repository:\u003cname\u003e 会被原样写入令牌。CDN 边缘仅凭令牌中的 scope 声明授权且不查询数据库，攻击者可读取其无权访问的组织私有包，直至令牌过期。\n修复版本中通过将 validate_scopes_against_key 改为按主体解析组织名（reaches_repository?/2 调用 Hexpm.Permissions.verify_user_access/3，公开仓库 hexpm 仍对所有人开放），并在 Hexpm.OAuth.Tokens.create_for_org/6 签发时丢弃指向其他组织的 repository: 与 docs: 范围，阻止越权 scope 进入令牌，切断私有包读取路径。", "effects": [{"comp_name": "hexpm", "ecosystem": "linux", "versions": [{"affected_version": "[71829cb6f6559bcceb1ef4e43a2fb8cdd3af654b,bf0fb9d208f0acfabf7a2f7467c8231659e322a8)", "min_fixed_version": "bf0fb9d208f0acfabf7a2f7467c8231659e322a8", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[2025-10-18,2026-08-24)", "min_fixed_version": "2026-08-24", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-08-25", "level": "High", "mps_id": "MPS-vpun-fb2k", "poc": false, "poc_url": [], "published_time": "2026-08-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-vpun-fb2k", "name": "https://www.oscs1024.com/hd/MPS-vpun-fb2k"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-75542", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-75542"}, {"url": "https://cna.erlef.org/cves/CVE-2026-75542.html", "name": ""}, {"url": "https://github.com/hexpm/hexpm/commit/bf0fb9d208f0acfabf7a2f7467c8231659e322a8", "name": ""}, {"url": "https://github.com/hexpm/hexpm/security/advisories/GHSA-rfx8-w654-8cpr", "name": ""}, {"url": "https://osv.dev/vulnerability/EEF-CVE-2026-75542", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "hexpm不正确授权漏洞", "_translated": true, "_saved_at": "2026-08-24T22:19:23+00:00", "_first_saved_at": "2026-08-24T22:19:23+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-vpun-fb2k"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-77146", "cvss": {"cvssv4": [{"source": "f4fb688c-4412-4426-b4b8-421ecf27b14a", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:L/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.3}]}, "cvss_score": 8.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:L/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-862", "description": "femanager（Composer 包 in2code/femanager）是开源 TYPO3 第三方前端用户管理扩展，提供注册、资料编辑和邀请注册等能力，不属于 TYPO3 默认安装。\n受影响版本中，InvitationController 的 editAction 与 updateAction 在哈希缺失、目标用户不存在、已禁用或已删除等校验失败后调用 redirect(\"status\") 但未 return，后续逻辑仍继续执行。未认证访问者可直接请求公开的 updateAction，对任意已有前端用户执行 hashPassword() 并将 disable 置为 false 后持久化，从而重置密码并重新启用该账号。\n修复版本中通过在校验失败分支对 redirect() 补上 return，使无效输入立即结束控制器动作，阻断密码哈希写入与账号启用。", "effects": [{"comp_name": "in2code/femanager", "ecosystem": "composer", "versions": [{"affected_version": "[8.0.0,8.4.2)", "min_fixed_version": "8.4.2", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-08-25", "level": "High", "mps_id": "MPS-zcuh-80oy", "poc": false, "poc_url": [], "published_time": "2026-08-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-zcuh-80oy", "name": "https://www.oscs1024.com/hd/MPS-zcuh-80oy"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-77146", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-77146"}, {"url": "https://typo3.org/security/advisory/typo3-ext-sa-2026-024", "name": ""}], "scope_influence": "", "tags": ["php", "开源"], "title": "femanager邀请越权漏洞", "_translated": true, "_saved_at": "2026-08-25T10:25:01+00:00", "_first_saved_at": "2026-08-25T10:25:01+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-zcuh-80oy"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-77634", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.2}]}, "cvss_score": 8.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-93", "description": "CakePHP 是开源 PHP 快速开发框架，其 Mailer 组件用于构建和发送电子邮件。\n受影响版本中，SmtpTransport::_sendData 调用 Message::getHeadersString() 序列化邮件头时未剥离自定义头值中的 CRLF 字节。应用把用户可控数据传入 Message::setHeaders() 或 Message::addHeaders() 并通过 SmtpTransport 发信时，攻击者可注入额外邮件头并篡改收件人、主题或其他头字段。\n修复版本中通过向 getHeadersString() 传入回调，在写入 SMTP DATA 前用 str_replace(\"\\r\\n\", '', $val) 删除头值中的 CRLF，切断邮件头注入路径。", "effects": [{"comp_name": "cakephp/cakephp", "ecosystem": "composer", "versions": [{"affected_version": "[5.0.0,5.1.8)", "min_fixed_version": "5.1.8", "repository": "composer", "solutions": [], "upstream": true}, {"affected 用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2026-77567", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N", "severity": "high", "base_score": 8.1}]}, "cvss_score": 8.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N", "cwe": "CWE-287", "description": "Filament 是开源 Laravel 全栈组件库，用于快速构建管理后台与应用界面。\n受影响版本中，当账号启用基于应用的多因素认证并开启恢复码时，登录挑战表单对一次性验证码字段 code 的必填条件在 useRecoveryCode 为 true 时被关闭，同时 recoveryCode 的无条件必填在直接改写表单状态等情况下可能未生效。攻击者在使用合法密码通过第一因素后，可将挑战表单状态 data.multiFactor.app.useRecoveryCode 设为 true 并提交空的第二因素，绕过应用多因素认证完成登录。基于电子邮件的多因素认证不受影响。\n修复版本中通过将 AppAuthentication::getChallengeFormComponents() 中 code 的 required 条件改为仅在已选择恢复码路径且 recoveryCode 非空时才放宽，并取消 recoveryCode 的无条件 required，使恢复码为空时仍要求一次性验证码，切断挑战阶段绕过第二因素的路径。", "effects": [{"comp_name": "filament/filament", "ecosystem": "composer", "versions": [{"affected_version": "[5.0.0,5.7.0)", "min_fixed_version": "5.7.0", "repository": "composer", "solutions": [], "upstream": true}, {"affected_version": "[4.0.0,4.12.0)", "min_fixed_version": "4.12.0", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "身份验证不当", "kind_en": "认证不当", "last_modified_time": "2026-08-25", "level": "High", "mps_id": "MPS-43dt-91h8", "poc": false, "poc_url": [], "published_time": "2026-08-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-43dt-91h8", "name": "https://www.oscs1024.com/hd/MPS-43dt-91h8"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-77567", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-77567"}, {"url": "https://github.com/filamentphp/filament/commit/45534a6f87f50ac6df3b43680bb33f8da9ef207b", "name": ""}, {"url": "https://github.com/filamentphp/filament/releases/tag/v4.12.0", "name": ""}, {"url": "https://github.com/filamentphp/filament/releases/tag/v5.7.0", "name": ""}, {"url": "https://github.com/filamentphp/filament/security/advisories/GHSA-52xp-w8hr-xv3c", "name": ""}], "scope_influence": "", "tags": ["php", "开源"], "title": "Filament MFA绕过漏洞", "_translated": true, "_saved_at": "2026-08-24T22:19:22+00:00", "_first_saved_at": "2026-08-24T22:19:22+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-43dt-91h8"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-78562", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.1}]}, "cvss_score": 8.1, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-98", "description": "Verdure Core 是 Mikado-Themes 为 WordPress 商业主题 Verdure 提供的配套插件，用于主题短代码与自定义内容等核心能力，并非以 GitHub 公开源码仓库形式分发。\n受影响版本中，未认证攻击者可触发本地文件包含，将服务器上的任意文件纳入 PHP 包含并执行，从而绕过访问控制、获取敏感数据；在图片等所谓安全文件类型可被上传并包含的情况下，还可执行这些文件中的 PHP 代码。\n修复版本中通过官方安全更新消除该本地文件包含风险。截至 2026-08-25，Wordfence、NVD、CVE.org 与 Patchstack 均未公布已验证修复版本号，Patchstack 标注暂无官方补丁，建议停用该插件或部署虚拟补丁直至厂商发布安全更新。", "effects": [{"comp_name": "verdure-core", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.2]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "php远程文件包含", "kind_en": "PHP 程序中 Include/Require 语句的文件名控制不当（“PHP 远程文件包含”）", "last_modified_time": "2026-08-25", "level": "High", "mps_id": "MPS-7vco-iwle", "poc": false, "poc_url": [], "published_time": "2026-08-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-7vco-iwle", "name": "https://www.oscs1024.com/hd/MPS-7vco-iwle"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-78562", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-78562"}, {"url": "https://patchstack.com/database/wordpress/plugin/verdure-core/vulnerability/wordpress-verdure-core-plugin-1-2-local-file-inclusion-vulnerability", "name": ""}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/92abc078-4fdd-4afe-aa46-cdd3a18161f4?source=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Verdure Core本地文件包含漏洞", "_translated": true, "_saved_at": "2026-08-25T10:24:57+00:00", "_first_saved_at": "2026-08-25T10:24:57+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-7vco-iwle"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过向受信任的数据序列化过程中添加恶意数据，从而在序列化和反序列化过程中执行恶意代码的攻击漏洞。这种漏洞通常存在于使用序列化 (serialization) 机制存储和传输数据的程序中。\n", "title": "什么是反序列化"}, {"content": "- 注入攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码注入到程序中，从而实现代码执行的目的。\n- 反射攻击：攻击者使用反射机制，在序列化过程中动态生成恶意数据，并将恶意代码注入到程序中，从而实现代码执行的目的。\n- 缓冲区溢出攻击：攻击者通过在序列化过程中向缓冲区输入恶意数据，导致缓冲区溢出，从而破坏程序的内存管理，实现代码执行的目的。\n- 格式字符串攻击：攻击者通过在序列化过程中输入恶意数据，导致程序使用错误的格式字符串，从而实现代码执行的目的。\n- 数据流攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码作为一个数据流传递给程序，从而实现代码执行的目的。\n", "title": "反序列化常见的攻击方式"}, {"content": "- 不信任输入数据：程序应该严格检查输入数据的有效性，并避免使用不受信任的数据。\n- 使用安全的序列化机制：程序应该使用安全的序列化机制，如 JSON 或 XML 序列化，而不是第三方序列化库。\n- 最小特权原则：程序应该限制对受信任数据的处理权限，并避免在运行时修改数据。\n- 代码审查和漏洞扫描：程序应该进行代码审查和漏洞扫描，以发现和修复潜在的安全漏洞。\n", "title": "如何预防反序列化"}], "cnvd_id": "", "cve_id": "CVE-2026-59285", "cvss": {}, "cvss_score": 8.1, "cvss_vector": "", "cwe": "CWE-502", "description": "Spring for GraphQL 是开源 Java 框架，用于在 Spring 应用中提供 GraphQL 查询与分页能力，源码托管于 GitHub spring-projects/spring-graphql。\n受影响版本中，分页 Connection 查询会把客户端提供的 after 或 before 游标解码后交给 JsonKeysetCursorStrategy.fromCursor。当应用走 Jackson 2.x 回退路径时，Jackson2ObjectMapperCustomizer.customize 通过 allowIfBaseType(Map.class) 启用 polymorphic default typing，任意 Map 子类型可在反序列化实例化阶段执行非预期逻辑；在对外暴露分页字段且类路径存在可滥用类时，攻击者可构造恶意 GraphQL 请求导致远程代码执行。\n修复版本中通过将 Jackson 2.x 的 PolymorphicTypeValidator 收紧为仅允许 LinkedHashMap、HashMap 与 java.util.Collections 子类型，与 Jackson 3.x 配置对齐，阻止危险类型进入游标反序列化路径。", "effects": [{"comp_name": "org.springframework.graphql:spring-graphql", "ecosystem": "maven", "versions": [{"affected_version": "[2.0.0,2.0.5)", "min_fixed_version": "2.0.5", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "反序列化", "kind_en": "不可信数据的反序列化", "last_modified_time": "2026-08-25", "level": "High", "mps_id": "MPS-d08b-33d9", "poc": false, "poc_url": [], "published_time": "2026-08-25", "reference_url_list": [{"url": "https://cybersecuritynews.com/91-spring-vulnerabilities/", "name": ""}, {"url": "https://spring.io/security/cve-2026-59285", "name": ""}, {"url": "https://github.com/spring-projects/spring-graphql/commit/cb45b282eba10ff2af5c928acec1efb45e08604c", "name": ""}, {"url": "https://github.com/spring-projects/spring-graphql/releases/tag/v2.0.5", "name": ""}, {"url": "https://github.com/spring-projects/spring-graphql/issues/1496", "name": ""}, {"url": "https://cwe.mitre.org/data/definitions/502.html", "name": ""}, {"url": "https://www.sonatype.com/blog/91-spring-cves-highlight-the-growing-ai-vulnerability-consumption-problem", "name": ""}], "scope_influence": "", "tags": [], "title": "Spring GraphQL反序列化漏洞", "_translated": true, "_saved_at": "2026-08-25T13:43:30+00:00", "_first_saved_at": "2026-08-25T13:43:30+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-d08b-33d9"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-16231", "cvss": {"cvssv31": [{"source": "ce714d77-add3-4f53-aff5-83d477b104bb", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:N", "severity": "high", "base_score": 8.1}]}, "cvss_score": 8.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:N", "cwe": "CWE-79", "description": "hbs 是开源 npm 组件，作为 Express 的 Handlebars 视图引擎，用于服务端渲染 HTML 模板。\n受影响版本中，registerAsyncHelper 注册的异步 helper 在首次渲染时返回不透明占位符，双花括号表达式仅转义该占位符；渲染结束后，lib/hbs.js 的 middleware 在缓存、非缓存和 layout 三条路径上执行 res.replace(id, values[id])，用 callback 原始返回值替换占位符且不再做 HTML 转义。应用若把攻击者可控内容传入异步 helper 回调，即可向服务端渲染页面注入任意 HTML 与 JavaScript，形成存储型或反射型跨站脚本。\n修复版本中通过在上述替换路径统一调用 handlebars.Utils.escapeExpression 转义异步 helper 输出，切断未转义内容进入页面的链路；如需输出原始 HTML，须显式使用 hbs.SafeString。", "effects": [{"comp_name": "hbs", "ecosystem": "npm", "versions": [{"affected_version": "[2.1.0,4.3.0)", "min_fixed_version": "4.3.0", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-08-25", "level": "High", "mps_id": "MPS-iy23-c6dk", "poc": false, "poc_url": [], "published_time": "2026-08-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-iy23-c6dk", "name": "https://www.oscs1024.com/hd/MPS-iy23-c6dk"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-16231", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-16231"}, {"url": "https://cna.openjsf.org/security-advisories.html", "name": ""}, {"url": "https://github.com/pillarjs/hbs/security/advisories/GHSA-rg36-rxv9-2m9q", "name": ""}], "scope_influence": "", "tags": ["npm", "开源"], "title": "hbs异步Helper XSS", "_translated": true, "_saved_at": "2026-08-25T11:21:35+00:00", "_first_saved_at": "2026-08-25T11:21:35+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-iy23-c6dk"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-78566", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.1}]}, "cvss_score": 8.1, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-98", "description": "Shuffle 是 Edge-Themes 面向 WordPress 的商业音乐主题，通过 ThemeForest 付费分发，用于搭建带曲风皮肤与首页模板的音乐类站点 "应用软件"], "title": "Kalles Addons对象注入漏洞", "_translated": true, "_saved_at": "2026-08-25T11:21:33+00:00", "_first_saved_at": "2026-08-25T11:21:33+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-t2wv-j3sb"}, {"analysis_status": 0, "articles": [], "attack_vector_type": "Local", "cnvd_id": "", "cve_id": "CVE-2026-56135", "cvss": {}, "cvss_score": 7.9, "cvss_vector": "", "cwe": "CWE-122", "description": "NTFS-3G 是 Tuxera 维护的开源用户态 NTFS 读写驱动，通过 FUSE 在 Linux 等系统上挂载 Windows NTFS 分区，发行包常将 ntfs-3g 安装为 SUID-root 二进制。\n受影响版本中，以非默认 inherit 选项挂载恶意 NTFS 镜像后，在构造目录中创建文件会进入 build_inherited_id()。该函数仅按 parentattrsz + 3*usidsz + 3*gsidsz 为继承安全描述符分配堆缓冲，无法覆盖父目录 DACL/SACL 中大量 ACCESS_DENIED CREATOR_OWNER ACE 在 ntfs_inherit_acl() 中替换为更大属主 SID 并保留原文副本时的增长，导致 SUID-root 的 ntfs-3g 进程发生堆溢出。\n修复版本中通过在分配前调用 ntfs_inherit_acl_extra_size() 统计父目录 DACL 与 SACL 内全部 ALLOW/DENY 的 CREATOR_OWNER 与 CREATOR_GROUP ACE 所需最坏额外字节，并将该余量计入 newattrsz，使 ntfs_inherit_acl() 写入不会超出堆缓冲。", "effects": [{"comp_name": "ntfs-3g", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2026.7.7)", "min_fixed_version": "2026.7.7", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "堆缓冲区溢出", "kind_en": "基于堆的缓冲区溢出", "last_modified_time": "2026-08-25", "level": "High", "mps_id": "MPS-vbl6-047o", "poc": false, "poc_url": [], "published_time": "2026-08-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-vbl6-047o", "name": "https://www.oscs1024.com/hd/MPS-vbl6-047o"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-56135", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-56135"}, {"url": "https://github.com/tuxera/ntfs-3g/security/advisories/GHSA-c9qg-fh4v-mq8r", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "NTFS-3G堆溢出漏洞", "_translated": true, "_saved_at": "2026-08-24T22:19:24+00:00", "_first_saved_at": "2026-08-24T22:19:24+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-vbl6-047o"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-7455", "cvss": {"cvssv31": [{"source": "psirt@autodesk.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "cwe": "CWE-787", "description": "Autodesk 3ds Max 是 Autodesk 推出的闭源三维建模、动画与渲染软件，用于影视、游戏和可视化内容制作。\n受影响版本中，3ds Max 解析 FLT 文件时会发生越界写入。攻击者可诱使使用者打开或导入恶意 FLT 文件，造成进程崩溃、数据损坏，或在当前进程上下文中执行任意代码。\n修复版本中通过官方安全更新修正 FLT 文件解析过程中的越界写入，使 2026.3.4 与 2027.2.0 及后续对应版本不再因恶意 FLT 文件出现崩溃、数据损坏或任意代码执行；公开资料未披露更细粒度的源码修改。", "effects": [{"comp_name": "3ds_max", "ecosystem": "linux", "versions": [{"affected_version": "[2027.0.0,2027.2.0)", "min_fixed_version": "2027.2.0", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[2026.0.0,2026.3.4)", "min_fixed_version": "2026.3.4", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-08-25", "level": "High", "mps_id": "MPS-sq2b-14ek", "p : "high", "base_score": 7.7}]}, "cvss_score": 7.7, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:N/A:N", "cwe": "CWE-918", "description": "AWX 是开源 Ansible 自动化控制平台，Red Hat Ansible Automation Platform 的 Automation Controller 基于该项目，用于作业调度、清单管理和通知投递。\n受影响版本中，Webhook、Mattermost、Rocket.Chat 和 Grafana 通知后端把通知模板 URL 直接作为 HTTP 请求目标，未校验目标是否属于私网、回环或保留地址。组织通知管理员可通过通知模板接口写入内部或回环地址，使控制节点向外部不可达的内部服务发起请求。WebhookBackend.send_messages 还会读取 Location 并在主机变化后继续重放 Basic Authentication；GrafanaBackend.send_messages 则把 grafana_key 写入 Authorization 头发往配置的 grafana_url。\n修复版本中通过官方安全更新收紧通知后端对目标 URL 的处理，阻止控制节点向私网、回环或保留地址发起请求，并切断 Webhook 重定向过程中的凭据重放。", "effects": [{"comp_name": "automation-controller", "ecosystem": "linux", "versions": [{"affected_version": "[4.6,4.6.32)", "min_fixed_version": "4.6.32", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[4.7,4.7.16)", "min_fixed_version": "4.7.16", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SSRF", "kind_en": "服务器端请求伪造 (SSRF)", "last_modified_time": "2026-08-25", "level": "High", "mps_id": "MPS-yj0s-rp2i", "poc": false, "poc_url": [], "published_time": "2026-08-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-yj0s-rp2i", "name": "https://www.oscs1024.com/hd/MPS-yj0s-rp2i"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-71366", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-71366"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-71366", "name": ""}, {"url": "https://bugzilla.redhat.com/show_bug.cgi?id=2511902", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "AWX通知后端SSRF漏洞", "_translated": true, "_saved_at": "2026-08-24T17:25:36+00:00", "_first_saved_at": "2026-08-24T17:25:36+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-yj0s-rp2i"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2026-65633", "cvss": {"cvssv4": [{"source": "6b3ad84c-e1a6-4bf7-a703-f496b71e49db", "vector": "CVSS:4.0/AV:N/AC:H/AT:P/PR:N/UI:P/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.6}]}, "cvss_score": 7.6, "cvss_vector": "CVSS:4.0/AV:N/AC:H/AT:P/PR:N/UI:P/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-287", "description": "AshAuthentication 是 team-alembic 维护的开源 Elixir 认证库，以 Hex 包 ash_authentication 分发，为 Ash 资源提供密码、WebAuthn 等登录策略，并可通过 Plug 助手从 Authorization Bearer JWT 解析当前用户。\n受影响版本中，公开入口 AshAuthentication.Plug.Helpers.retrieve_from_bearer/3 校验 JWT 签名并拒绝含 act 声明的令牌，但不检查 purpose 是否等于 user。当资源保持 DSL 默认 require_token_presence_for_authentication?: false 时，后续 validate_token/3 直接返回 {:ok, nil}，不再按 purpose 查询令牌资源。WebAuthn 登录总会签发、以及 Password 策略在 sign_in_tokens_enabled?: true 时签发的 purpose 为 sign_in 的 JWT，可被直接放入 Authorization 头当作完整 bearer 凭证，写入 conn.assigns.current_user，绕过一次性兑换与吊销。\n修复版本中通过在 retrieve_from_bearer/3 增加 usable_as_bearer_token?/1，仅允许缺失 purpose 或 purpose 为 user 的令牌通过 bearer 边界，拒绝 sign_in、remember_me、totp_setup 等专用令牌被重放为完整认证凭证。", "effects": [{"comp_name": "ash_authentication", "ecosystem": "linux", "versions": [{"affected_version": "[3.10.5,4.14.2)", "min_fixed_version": "4.14.2", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[5.0.0-rc.0,5.0.0-rc.13)", "min_fixed_version": "5.0.0-rc.13", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "身份验证不当", "kind_en": "认证不当", "last_modified_time": "2026-08-25", "level": "High", "mps_id": "MPS-4d0m-vwaj", "poc": false, "poc_url": [], "published_time": "2026-08-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-4d0m-vwaj", "name": "https://www.oscs1024.com/hd/MPS-4d0m-vwaj"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-65633", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-65633"}, {"url": "https://cna.erlef.org/cves/CVE-2026-65633.html", "name": ""}, {"url": "https://github.com/team-alembic/ash_authentication/commit/124eddd1bbeb40289c3fe8831ac10677a19fcf09", "name": ""}, {"url": "https://github.com/team-alembic/ash_authentication/commit/8cf8b2d4426172be0900a3505e9491800b951750", "name": ""}, {"url": "https://github.com/team-alembic/ash_authentication/security/advisories/GHSA-6vcj-3h59-rrc3", "name": ""}, {"url": "https://osv.dev/vulnerability/EEF-CVE-2026-65633", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "AshAuthentication认证绕过", "_translated": true, "_saved_at": "2026-08-25T09:29:12+00:00", "_first_saved_at": "2026-08-25T09:29:12+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-4d0m-vwaj"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-69104", "cvss": {"cvssv31": [{"source": "reefs@jfrog.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:L/I:L/A:H", "severity": "high", "base_score": 7.6}]}, "cvss_score": 7.6, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:L/I:L/A:H", "cwe": "CWE-862", "description": "JFrog Artifactory 是商业二进制制品仓库管理软件，用于存储、代理和分发软件包，源码不对外公开。\n受影响版本中，已认证用户可在缺少所需仓库权限的情况下发起仓库迁移操作。该缺失授权会使攻击者读取本不应可见的仓库信息、擅自改变仓库状态，并造成服务中断。\n修复版本中通过收紧仓库迁移操作的权限校验，阻止缺少仓库权限的已认证用户再发起迁移，从而切断未授权信息泄露、状态变更与服务中断路径。", "effects": [{"comp_name": "artifactory", "ecosystem": "linux", "versions": [{"affected_version": "[7.161.0,7.161.19)", "min_fixed_version": "7.161.19", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-08-26", "level": "High", "mps_id": "MPS-jozc-s9dv", "poc": false, "poc_url": [], "published_time": "2026-08-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-jozc-s9dv", "name": "https://www.oscs1024.com/hd/MPS-jozc-s9dv"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-69104", "name": ", "repository": "pip", "solutions": [], "upstream": true}]}, {"comp_name": "praisonaiagents", "ecosystem": "pip", "versions": [{"affected_version": "(-∞,1.6.58)", "min_fixed_version": "1.6.58", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SSRF", "kind_en": "服务器端请求伪造 (SSRF)", "last_modified_time": "2026-08-25", "level": "High", "mps_id": "MPS-2mk0-39vf", "poc": false, "poc_url": [], "published_time": "2026-08-25", "reference_url_list": [{"url": "https://github.com/MervinPraison/PraisonAI/security/advisories/GHSA-5r34-2g38-6569", "name": ""}, {"url": "https://github.com/MervinPraison/PraisonAI/commit/2f9677abb2ea68eab864ee8b6a828fd0141612e1", "name": ""}, {"url": "https://github.com/MervinPraison/PraisonAI/releases/tag/v4.6.58", "name": ""}, {"url": "https://github.com/advisories/GHSA-5r34-2g38-6569", "name": ""}], "scope_influence": "", "tags": ["AI", "python", "开源"], "title": "praisonaiagents SSRF漏洞", "_translated": true, "_saved_at": "2026-08-25T15:36:45+00:00", "_first_saved_at": "2026-08-25T15:36:45+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-2mk0-39vf"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用了空指针，并在不进行有效检查的情况下对其进行取消引用操作。当程序试图取消引用空指针时，由于空指针不指向任何有效的内存地址，会导致程序崩溃或产生未定义的行为。这种错误通常发生在开发者未对指针进行正确的初始化或验证时。", "title": "什么是空指针取消引用"}, {"content": "- 拒绝服务：攻击者可以通过构造恶意输入或请求，触发程序中的空指针取消引用错误，导致程序崩溃或无法正常运行。这可能导致拒绝服务攻击，使系统无法提供正常的服务。\r\n- 内存信息泄露：攻击者可以通过利用空指针取消引用错误，访问程序中的敏感内存信息。这可能包括栈上的变量、函数指针或其他敏感数据，从而暴露系统的机密信息。\r\n- 代码执行：在某些情况下，空指针取消引用错误可能导致执行恶意代码或注入恶意代码的机会。攻击者可以通过精心构造的输入，利用空指针取消引用错误来执行任意的代码，进而获取系统控制权或执行未经授权的操作。", "title": "空指针取消引用常见的攻击方式"}, {"content": "- 指针初始化和验证：开发者应该正确地初始化指针，并在使用指针之前进行有效的验证，确保指针不为空。在取消引用指针之前，应始终检查其是否为空。\r\n- 异常处理和错误恢复：程序应该具备健壮的异常处理和错误恢复机制，以便在发生空指针取消引用错误时能够适当地处理异常，而不是导致程序崩溃或暴露敏感信息。\r\n- 防御性编程：采用防御性编程的原则，如避免在未经验证的指针上进行操作，避免使用未初始化的指针等，以防止空指针取消引用错误的发生。\r\n- 静态代码分析和测试：使用静态代码分析工具和测试技术来检测和识别潜在的空指针取消引用错误。这些工具可以帮助发现代码中可能存在的空指针问题，并及时修复。\r\n- 强制性编码标准和最佳实践：制定强制性的编码标准和最佳实践，包括良好的指针使用和管理规范，以帮助开发者编写更可靠、安全的代码。", "title": "如何预防空指针取消引用"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-63076", "cvss": {}, "cvss_score": 7.5, "cvss_vector": "", "cwe": "CWE-476", "description": "OpenSSL 是开源密码学工具库，提供 TLS/SSL 以及证书管理协议（CMP）的客户端与服务端实现，供应用完成证书申请与生命周期管理。\n受影响版本中，校验 CMP 口令基 MAC（id-PasswordBasedMAC）保护时，ossl_cmp_calc_protection() 通过 X509_ALGOR_get0() 读取 header-\u003eprotectionAlg 的参数类型与取值，只确认取值指针非空便将其强制转换为 ASN1_STRING 并当作 PBMParameter 解析，未核对参数的 ASN.1 类型。攻击者可将该参数编码为 BOOLEAN 等非 SEQUENCE 类型；ASN1_TYPE 联合体把布尔整型与指针字段重叠，使 ppval 成为伪造的非空指针（例如 0xff），随后 ASN1_STRING_get0_data() 发生无效指针解引用。该路径出现在计算 MAC 之前，无需掌握 PBM 共享密钥。远程未认证攻击者可向接受 PBM 保护消息的 CMP 服务端经 OSSL_CMP_SRV_process_request() 传入构造报文，或通过恶意/中间人 CMP 服务端让客户端在 OSSL_CMP_validate_msg() 响应校验中进入同一路径，造成应用崩溃并形成拒绝服务。\n修复版本中通过在解析 PBMParameter 前增加 pptype != V_ASN1_SEQUENCE 判断，拒绝非 SEQUENCE 类型的 protectionAlg 参数，切断无效指针解引用路径。", "effects": [{"comp_name": "openssl", "ecosystem": "linux", "versions": [{"affected_version": "[3.6.0,3.6.4)", "min_fixed_version": "3.6.4", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[3.0.0,3.0.22)", "min_fixed_version": "3.0.22", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[4.0.0,4.0.2)", "min_fixed_version": "4.0.2", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[3.5.0,3.5.8)", "min_fixed_version": "3.5.8", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[3.4.0,3.4.7)", "min_fixed_version": "3.4.7", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "空指针取消引用", "kind_en": "空指针取消引用", "last_modified_time": "2026-08-25", "level": "High", "mps_id": "MPS-3rgp-1nyx", "poc": false, "poc_url": ime": "2026-08-25", "level": "High", "mps_id": "MPS-7lic-v23p", "poc": false, "poc_url": [], "published_time": "2026-08-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-7lic-v23p", "name": "https://www.oscs1024.com/hd/MPS-7lic-v23p"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-66766", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-66766"}, {"url": "https://me.sap.com/notes/3771065", "name": ""}, {"url": "https://url.sap/sapsecuritypatchday", "name": ""}], "scope_influence": "", "tags": [], "title": "S/4HANA正则拒绝服务漏洞", "_translated": true, "_saved_at": "2026-08-25T02:16:13+00:00", "_first_saved_at": "2026-08-25T02:16:13+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-7lic-v23p"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-63072", "cvss": {}, "cvss_score": 7.5, "cvss_vector": "", "cwe": "CWE-787", "description": "OpenSSL 是开源密码学库，提供 TLS、CMS/S/MIME 等加密通信与消息处理能力。\n受影响版本中，CMS 解密在 cms_kek_cipher 中按 EVP_CipherUpdate 查询到的解包密钥长度分配输出缓冲区，而 AES-WRAP-PAD 在完整性失败路径上会向该缓冲区写入并清零最多 inlen 字节。攻击者可将合法 CMS 报文中的密钥包装 OID 改为 id-aesNNN-wrap-pad，使受害者调用 CMS_decrypt() 时触发紧邻分配区之后的固定 8 字节零值堆越界写，造成堆损坏并通常导致拒绝服务。\n修复版本中通过在 cms_kek_cipher 中按 outlen 与 inlen 的较大值分配解包输出缓冲区，使失败的 AES-WRAP-PAD 解包无法写越分配边界，切断该堆越界写路径。", "effects": [{"comp_name": "openssl", "ecosystem": "linux", "versions": [{"affected_version": "[3.5.0,3.5.8)", "min_fixed_version": "3.5.8", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[3.6.0,3.6.4)", "min_fixed_version": "3.6.4", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[3.0.0,3.0.22)", "min_fixed_version": "3.0.22", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[1.1.1,1.1.1zi)", "min_fixed_version": "1.1.1zi", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[3.4.0,3.4.7)", "min_fixed_version": "3.4.7", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[4.0.0,4.0.2)", "min_fixed_version": "4.0.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-08-25", "level": "High", "mps_id": "MPS-7res-oyju", "poc": false, "poc_url": [], "published_time": "2026-08-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-7res-oyju", "name": "https://www.oscs1024.com/hd/MPS-7res-oyju"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-63072", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-63072"}, {"url": "https://github.com/openssl/openssl/commit/2a3dac874c8057c1f0186849bf1ede1ae7b6b756", "name": ""}, {"url": "https://github.com/openssl/openssl/commit/87784ad619af36b8807c2044b3940006fccc1e42", "name": ""}, {"url": "https://github.com/openssl/openssl/commit/9530a5fd1aacaeccdced4478ea2340a480613335", "name": ""}, {"url": "https://github.com/openssl/openssl/commit/9ec2f6d2ae2bcad907cf7ee38584855bafe4979a", "name": ""}, {"url": "https://github.com/openssl/openssl/commit/a0c8ec557d9cac078f032d76cdf684fe743eb382", "name": ""}, {"url": "https://openssl-library.org/news/secadv/20260825.txt", "name": ""}], "scope_influence": "", "tags": [], "title": "OpenSSL CMS堆溢出", "_translated": true, "_saved_at": "2026-08-25T14:38:30+00:00", "_first_saved_at": "2026-08-25T14:38:30+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-7res-oyju"}, {"analysis_status": 0, "articles": [{"content": "跨界内存读是指应用程序在读取内存时，未正确验证或限制读取的内存范围。攻击者利用这种漏洞可以读取应用程序内存中的敏感数据，如密码、加密密钥、会话令牌等。常见的原因是由于缓冲区溢出、格式化字符串漏洞或其他内存错误导致的。", "title": "什么是越界读取"}, {"content": "攻击者可以通过不当构造的输入来触发跨界内存读漏洞。攻击者可能会通过向应用程序发送特定的输入，使其读取超过预期的内存区域。攻击者可以利用这个漏洞来获取敏感信息，如其他用户的数据、操作系统的敏感数据或应用程序的内部状态。", "title": "越界读取常见的攻击方式"}, {"content": "- 输入验证和限制：应用程序应对所有输入数据进行严格的验证和限制。确保输入数据的长度、格式和内容符合预期，避免超出缓冲区或访问非预期的内存区域。\n- 内存安全编程实践：开发人员应使用安全的编程实践，如避免使用不安全的函数、正确处理内存分配和释放操作，以及遵循最小特权原则。\n- 使用安全的编程语言和库：选择使用安全性较高的编程语言和库，这些语言和库在内存管理和安全性方面提供了更多的保护机制。\n- 定期进行代码审查和安全测试：定期审查应用程序的代码，并进行安全测试，以发现潜在的跨界内存读漏洞。使用静态代码分析工具和漏洞扫描工具来辅助检测和修复问题。\n- 实施防御性编程技术：应用程序应采用防御性编程技术，如使用随机化地址空间布局（ASLR）、堆栈保护机制（如堆栈溢出保护）和数据执行预防（DEP）等。\n- 及时更新和修补：及时应用程序和操作系统的安全更新和补丁，以确保已知的跨界内存读漏洞得到修复。及时更新相关软件和库，以避免使用已知存在漏洞的版本。", "title": "如何预防越界读取"}], "attack_vector_type": "Adjacent", "cnvd_id": "", "cve_id": "CVE-2026-75369", "cvss": {}, "cvss_score": 7.5, "cvss_vector": "", "cwe": "CWE-125", "description": "SpaceDot AcubeSAT OBC 软件是开源星载计算机固件，运行于 AcubeSAT 纳卫星的 ATSAMV71 平台，负责 ECSS 遥控遥测处理以及子系统间 CAN 通信。\n受影响版本中，CAN::Application::parsePerformFunctionMessage 在读取 6 字节函数 ID 后，固定循环 ECSSFunctionMaxArgLength（32）次调用 Message::readUint8；底层 Message::readByte 只按 1024 字节缓冲区容量检查 readPosition，不校验实际 dataSize。攻击者在 CAN 总线上发送 messageType 为 PerformFunction 且参数区短于 32 字节的报文后，循环会读出内部缓冲区残留字节，写入构造的 TC 并交给 MessageParser::execute，造成拒绝服务，并可能把残留数据当作函数参数继续处理。\n修复版本中通过按报文实际剩余长度读取参数字节，避免将内部缓冲区残留数据拷入遥测遥控执行路径；截至本报告分析日，公开仓库尚未发布对应修复提交或官方修复版本。", "effects": [{"comp_name": "cross-platform-software", "ecosystem": "linux", "versions": [{"affected_version": "[1cc365a5,5d333741]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "obc-software", "ecosystem": "linux", "versions": [{"affected_version": "[eaf90ec,eaf90ec]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界读取", "kind_en": "越界读取", "last_modified_time": "2026-08-25", "level": "High", "mps_id": "MPS-85jb-hskf", "poc": false, "poc_url": [], "published_time": "2026-08-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-85jb-hskf", "name": "https://www.oscs1024.com/hd/MPS-85jb-hskf"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-75369", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-75369"}, {"url": "https://github.com/dazuo233/cve/issues/4", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "AcubeSAT越界读取漏洞", "_translated": true, "_saved_at": "2026-08-24T21:22:30+00:00", "_first_saved_at": "2026-08-24T21:22:30+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-85jb-hskf"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-78576", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "cwe": "CWE-89", "description": "Readabler 是 merkulove 出品的 WordPress 无障碍商业插件，用于为网站提供字体缩放、对比度调节和文本朗读等可访问性能力。\n受影响版本中，插件对用户提供的参数转义不足，且未对既有 SQL 查询做充分预处理。未认证攻击者可向已有查询追加额外 SQL 语句，从数据库提取敏感信息。\n修复版本中通过官方安全更新收紧用户可控参数处理与 SQL 查询构造，阻断未认证攻击者向既有查询追加恶意 SQL 的路径。", "effects": [{"comp_name": "readabler", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.0.18)", "min_fixed_version": "2.0.18", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-08-25", "level": "High", "mps_id": "MPS-8asv-g3hf", "poc": false, "poc_url": [], "published_time": "2026-08-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-8asv-g3hf", "name": "https://www.oscs1024.com/hd/MPS-8asv-g3hf"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-78576", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-78576"}, {"url": "https://patchstack.com/database/wordpress/plugin/readabler/vulnerability/wordpress-readabler-plugin-2-0-18-sql-injection-vulnerability", "name": ""}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/baaa9688-dfdc-4ab2-b033-fe2b13a42e77?source=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Readabler SQL注入漏洞", "_translated": true, "_saved_at": "2026-08-25T11:21:32+00:00", "_first_saved_at": "2026-08-25T11:21:32+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-8asv-g3hf"}, {"analysis_status": 0, "articles": [{"content": "由于应用程序或系统中存在敏感信息未经适当保护而被泄露给攻击者或未经授权的用户，这些敏感信息可能包括用户凭据、个人身份信息、敏感业务数据、系统配置信息等。信息暴露漏洞通常是由于设计、实施或配置错误引起的，例如不正确的访问控制、弱密码策略、缺乏加密、错误的日志处理等。", "title": "什么是未授权敏感信息泄露"}, {"content": "- 直接访问敏感信息：攻击者可以通过直接访问不正确配置或不受保护的资源来获取敏感信息，如通过公开可访问的URL、未经授权的文件目录访问等。\n- 越权访问：攻击者可能利用访问控制错误或不正确的权限配置来获取他们没有权限访问的敏感信息。\n- 错误信息披露：应用程序在错误处理过程中可能泄露敏感信息，例如将错误消息中的敏感数据返回给客户端或显示在日志文件中。\n- 信息泄露通过响应：攻击者可能利用应用程序在响应中不正确地包含敏感信息，如通过网页源代码、响应头部或响应消息体中的敏感数据。", "title": "未授权敏感信息泄露常见的攻击方式"}, {"content": "- 访问控制：确保只有经过授权的用户能够访问敏感信息，使用强大的身份验证和授权机制。\n- 数据加密：对于敏感信息，使用适当的加密算法对数据进行加密，包括数据传输和存储过程中的加密。\n- 错误处理和日志安全：正确处理错误情况，避免在错误消息中暴露敏感信息。同时，确保日志记录功能的安全性，避免将敏感信息记录在日志文件中。\n- 安全配置和最佳实践：遵循安全最佳实践，对应用程序、服务器和系统进行适当的配置，包括访问控制、权限管理、密码策略等。\n- 审计和监控：实施日志审计和监控机制，及时检测和响应任何异常活动或潜在的信息暴露事件。\n- 安全开发实践：在应用程序开发过程中，进行安全代码审查、漏洞扫描和安全测试，以及敏感信息的正确处理和保护。", "title": "如何预防未授权敏感信息泄露"}], "cnvd_id": "", "cve_id": "CVE-2026-75099", "cvss": {}, "cvss_score": 7.5, "cvss_vector": "", "cwe": "CWE-200", "description": "Apache Allura 是 Apache 软件基金会的开源软件协作平台，用于托管代码仓库、缺陷跟踪、讨论区、Wiki 与博客，并默认提供以 /rest 为前缀的 REST API。\n受影响版本中，部分 REST 控制器未与 Web 界面实施同等访问控制。未认证请求可通过 /rest 路径直接读取本应隐藏的内容：TicketRestController.index 在工单已删除时仍返回完整 JSON；PostRestController.index 对已删除或待审核帖文缺少状态校验；博客草稿与论坛主题级 ACL 也未在 REST 入口强制执行。\n修复版本中通过将 REST 查询与权限检查对齐 Web 控制器切断该泄露路径：已删除工单在缺少 delete 权限时返回 404，已删除或非 ok 状态帖文对非版主隐藏，草稿博客要求 write 权限，论坛主题改为对 topic 执行 read 检查。", "effects": [{"comp_name": "allura", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.20.0)", "min_fixed_version": "1.20.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "未授权敏感信息泄露", "kind_en": "向未经授权的行为者泄露敏感信息", "last_modified_time": "2026-08-25", "level": "High", "mps_id": "MPS-bac9-2ee0", "poc": false, "poc_url": [], "published_time": "2026-08-25", "reference_url_list": [{"url": "http://www.mail-archive.com/announce@apache.org/msg11768.html", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-75099", "name": ""}, {"url": "https://lists.apache.org/thread/lnsfx58o6mx6m44qk4vzqrq8ccmrywcy", "name": ""}, {"url": "https://allura.apache.org/posts/2026-allura-1.20.0.html", "name": ""}, {"url": "htt 交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-78563", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "cwe": "CWE-79", "description": "NotificationX Pro 是 WPDeveloper 出品的 WordPress 商业插件，用于在站点上展示销售提醒、社会证明和通知栏等营销组件。\n受影响版本中，插件对输入缺少充分净化与输出转义，未认证攻击者可将任意 Web 脚本写入页面，用户访问被注入页面时脚本会在浏览器中执行。\n修复版本中通过补齐输入净化与输出转义切断该存储型脚本注入路径；截至 2026-08-25，厂商尚未发布明确修复版本，公开资料未披露具体源码改动。", "effects": [{"comp_name": "notificationx-pro", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,3.1.4]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-08-25", "level": "High", "mps_id": "MPS-axwk-0u92", "poc": false, "poc_url": [], "published_time": "2026-08-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-axwk-0u92", "name": "https://www.oscs1024.com/hd/MPS-axwk-0u92"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-78563", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-78563"}, {"url": "https://patchstack.com/database/wordpress/plugin/notificationx-pro/vulnerability/wordpress-notificationx-pro-plugin-3-1-4-cross-site-scripting-xss-vulnerability", "name": ""}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/0adad1bc-8803-4c20-ae9f-ab8b66d1e6df?source=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "NotificationX Pro存储型XSS", "_translated": true, "_saved_at": "2026-08-25T11:21:38+00:00", "_first_saved_at": "2026-08-25T10:24:54+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-axwk-0u92"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-71364", "cvss": {"cvssv31": [{"source": "secalert@redhat.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-22", "description": "AWX 是开源 Ansible 自动化控制平台，用于管理作业、项目和执行节点，Red Hat Ansible Automation Platform 的 Automation Controller 基于该项目构建。\n受影响版本中，归档类型项目在更新时由 project_archive 动作插件解压 zip 或 tar。该插件把项目目录路径与归档成员文件名直接 os.path.join，未做路径规范化、边界校验，也不拒绝目录穿越序列。攻击者只要控制归档内容（被攻陷的上游源、恶意归档 URL，或对明文 HTTP 下载实施中间人攻击），即可在 scm_type 为 archive 的项目更新过程中把文件写到执行节点上项目目录之外的任意位置，并以执行解压的用户身份覆盖 cron、SSH authorized_keys 或注入 playbook，进而造成远程代码执行。\n修复版本中通过官方安全更新收紧归档成员目标路径校验，阻止含穿越分量的成员写出项目目录边界。公开 GitHub 仓库 ansible/awx 尚未提供已验证修复提交。Ansible Automation Platform 2.5 应升级到包含 automation-controller 4.6.32 的更新，2.6 应升级到包含 automation-controller 4.7.16 的更新。", "effects": [{"comp_name": "automation-controller", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,4.7.16)", "min_fixed_version": "4.7.16", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,4.6.32)", "min_fixed_version": "4.6.32", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-08-25", "level": "High", "mps_id": "MPS-pf6z-eahi", "poc": false, "poc_url": [], "published_time": "2026-08-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-pf6z-eahi", "name": "https://www.oscs1024.com/hd/MPS-pf6z-eahi"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-71364", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-71364"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-71364", "name" L/A:N", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "cwe": "CWE-79", "description": "Forminator Forms 是 WPMU DEV 发布的开源 WordPress 表单构建插件，用于创建联系表单、支付表单和自定义表单，并提供 Stripe 与 PayPal 支付集成。\n受影响版本中，启用 Stripe Checkout Sessions 支付接口的表单在支付回流时会由 ForminatorFrontStripe.getCheckoutReturnErrorMessage 从页面 URL 读取 error_description 或 error_message 参数，再交给 show_error，使用 jQuery .html() 将未转义字符串写入 .forminator-response-message。未认证攻击者可让用户打开带有该查询参数的页面，从而在站点页面上下文执行脚本。该路径仅在承载 Forminator 表单且该表单使用 Stripe Checkout Sessions 支付接口时触发，该接口自 1.56.0 起成为默认。\n修复版本中通过将 show_error 改为先清空节点再以 jQuery .text() 写入纯文本错误信息，阻止 URL 参数作为 HTML 插入 DOM，切断脚本执行路径。", "effects": [{"comp_name": "forminator", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.57.0.1)", "min_fixed_version": "1.57.0.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-08-25", "level": "High", "mps_id": "MPS-rt4x-ivfu", "poc": false, "poc_url": [], "published_time": "2026-08-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-rt4x-ivfu", "name": "https://www.oscs1024.com/hd/MPS-rt4x-ivfu"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-18328", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-18328"}, {"url": "https://plugins.trac.wordpress.org/browser/forminator/tags/1.56.0/assets/js/front/front.stripe.js#L1539", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/forminator/tags/1.56.0/assets/js/front/front.stripe.js#L196", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/forminator/tags/1.56.0/assets/js/front/front.stripe.js#L468", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/forminator/tags/1.56.0/assets/js/front/front.stripe.js#L543", "name": ""}, {"url ://www.oscs1024.com/hd/MPS-0noc-5h7t", "name": "https://www.oscs1024.com/hd/MPS-0noc-5h7t"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-78678", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-78678"}, {"url": "https://github.com/gitpython-developers/GitPython/security/advisories/GHSA-5xxx-qhh7-9287", "name": ""}, {"url": "https://www.vulncheck.com/advisories/gitpython-before-arbitrary-file-read-via-repo-blame", "name": ""}], "scope_influence": "", "tags": ["python", "开源"], "title": "GitPython任意文件读取漏洞", "_translated": true, "_saved_at": "2026-08-25T03:42:57+00:00", "_first_saved_at": "2026-08-25T03:42:57+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-0noc-5h7t"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-78264", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:L", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:L", "cwe": "CWE-79", "description": "Toolset Blocks 是 OnTheGoSystems（Site Building with Toolset）出品的商业 WordPress 插件，用于在区块编辑器中可视化构建并展示动态内容。\n受影响版本中，未认证攻击者可构造包含恶意脚本的请求，插件在生成页面时未正确中和输入，形成反射型跨站脚本。受害者访问该请求对应页面后，脚本会在其浏览器中执行，可用于注入重定向、广告或其他 HTML 载荷。\n修复版本中通过官方安全更新收紧页面对未认证输入的输出处理，阻止恶意脚本被反射到响应中执行。", "effects": [{"comp_name": "toolset-blocks", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.6.27)", "min_fixed_version": "1.6.27", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-08-25", "level": "High", "mps_id": "MPS-0rdl-mqc7", "poc": false, "poc_url": [], "published_time": "2026-08-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-0rdl-mqc7", "name": "https://www.oscs1024.com/hd/MPS-0rdl-mqc7"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-78264", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-78264"}, {"url": "https://patchstack.com/database/wordpress/plugin/toolset-blocks/vulnerability/wordpress-toolset-blocks-plugin-1-6-26-cross-site-scripting-xss-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": [], "title": "Toolset Blocks反射型XSS", "_translated": true, "_saved_at": "2026-08-24T23:17:21+00:00", "_first_saved_at": "2026-08-24T23:17:21+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-0rdl- 对象中的 code 写入 coupon-info 的 innerHTML，再拼入订单摘要 HTML，未对优惠码做输出编码。未认证攻击者可诱导用户打开带恶意 coupon_code 的支付弹窗链接，在受害者浏览器中执行脚本。\n修复版本中通过 asp_sanitizeCouponCode 对优惠码做白名单过滤，将 coupon-info 展示从 innerHTML 改为 textContent，订单摘要中的优惠码先过滤再写入 HTML，并用 URLSearchParams 编码 Ajax 参数，切断恶意优惠码进入页面脚本执行路径。", "effects": [{"comp_name": "stripe-payments", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.1.3)", "min_fixed_version": "2.1.3", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-08-25", "level": "High", "mps_id": "MPS-cedw-jl6g", "poc": false, "poc_url": [], "published_time": "2026-08-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-cedw-jl6g", "name": "https://www.oscs1024.com/hd/MPS-cedw-jl6g"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-78282", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-78282"}, {"url": "https://patchstack.com/database/wordpress/plugin/stripe-payments/vulnerability/wordpress-stripe-payments-plugin-2-1-2-cross-site-scripting-xss-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Stripe Payments反射型XSS", "_translated": true, "_saved_at": "2026-08-25T00:55:36+00:00", "_first_saved_at": "2026-08-24T23:17:17+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-cedw-jl6g"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-77144", "cvss": {"cvssv4": [{"source": "f4fb688c-4412-4426-b4b8-421ecf27b14a", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:L/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:L/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/
