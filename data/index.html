onnection address from the original name, in which certain characters end the host name early. An unauthenticated party who can forge or change the DNS SRV response may redirect the connection to a host of their choice. TLS does not prevent this, because the driver verifies the server certificate against the redirected host name. This may result in unintended disclosure of application data and authentication credentials, and in altered query results. Applications that use mongodb:// connection strings are not affected.", "effects": [{"comp_name": "Node.js Driver", "ecosystem": "linux", "versions": [{"affected_version": "(3.3.3,7.8.0)", "min_fixed_version": "7.8.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "参数注入或修改", "kind_en": "命令中参数分隔符的不正确中和（“参数注入”）", "last_modified_time": "2026-11-13", "level": "Critical", "mps_id": "MPS-im7k-cv1b", "poc": false, "poc_url": [], "published_time": "2026-11-13", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-im7k-cv1b", "name": "https://www.oscs1024.com/hd/MPS-im7k-cv1b"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-126837", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-126837"}, {"url": "https://jira.mongodb.org/browse/NODE-7830", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-126837漏洞", "_translated": true, "_saved_at": "2026-11-14T08:26:46+00:00", "_first_saved_at": "2026-11-12T17:50:33+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-im7k-cv1b"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-126173", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-862", "description": "AutomatorWP Webhooks 是 AutomatorWP（一款 WordPress 无代码自动化插件）的官方付费 Webhooks 扩展，以闭源形式经厂商官网分发，用于让 WordPress 站点通过 webhook 与 Zapier 等外部应用双向收发数据，并提供 Receive Webhook 触发器与 Update User 等动作的组合能力。\n受影响版本中，webhook 接收链路在执行所配置的自动化动作前未验证请求者是否有权操作目标用户：当管理员按官方文档支持的方式将含 Is the user ID 字段的 Receive Webhook 触发器与 User ID 留空、Password 字段映射为 webhook password 标签的 Update User 动作配对后，未认证攻击者可向该 webhook URL 提交携带任意用户 ID 与新密码的请求，Update User 动作以触发器数据指定的账户为目标执行密码更新，攻击者得以重置包括管理员在内的任意 WordPress 账户密码，实现完整账户接管。\n修复版本中通过补全 webhook 自动化链路的用户授权校验消除上述越权执行路径，厂商已在 1.4.5 版本完成修复，Wordfence 漏洞数据库确认 1.4.5 为已修补版本，受影响站点应升级至 1.4.5 或更高版本。", "effects": [{"comp_name": "automatorwp-webhooks", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.4.5)", "min_fixed_version": "1.4.5", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-11-14", "level": "Critical", "mps_id": "MPS-n80q-1jmc", "poc": false, "poc_url": [], "published_time": "2026-11-14", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-n80q-1jmc", "name": "https://www.oscs1024.com/hd/MPS-n80q-1jmc"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-126173", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-126173"}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/04ea5758-2400-4885-8342-c57d61206ef1?source=cve", "name": ""}, {"url": "https://automatorwp.com/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "AutomatorWP Webhooks未授权账户接管漏洞", "_translated": true, "_saved_at": "2026-11-14T08:26:45+00:00", "_first_saved_at": "2026-11-14T08:26:45+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-n80q-1jmc"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2026-129349", "cvss": {}, "cvss_score": 9.1, "cvss_vector": "", "cwe": "CWE-287", "description": "Apache Shiro 是 Apache 软件基金会开源的 Java 安全框架，提供认证、授权、会话管理与加密能力，其 shiro-core 模块（org.apache.shiro:shiro-core）包含对接 LDAP 目录的 DefaultLdapRealm 与 JndiLdapRealm。\n受影响版本中，DefaultLdapRealm 构造函数默认调用 setCredentialsMatcher(new AllowAllCredentialsMatcher())，为该 Realm 安装无条件接受任意凭据的 AllowAllCredentialsMatcher；当应用将 authenticationCachingEnabled 设为 true（非默认配置）后，AuthenticatingRealm.getAuthenticationInfo 以用户名作为缓存键命中认证缓存并跳过 doGetAuthenticationInfo 中的 LDAP bind 校验，凭据校验退化为 assertCredentialsMatch 中的匹配器判定，而 AllowAllCredentialsMatcher 对任意密码均返回通过，攻击者在获知有效用户名且该用户此前成功登录过一次形成缓存后，可用任意密码通过该用户的身份认证。\n修复版本中通过移除 DefaultLdapRealm 构造函数中的 setCredentialsMatcher(new AllowAllCredentialsMatcher()) 调用完成修复，Realm 恢复继承 AuthenticatingRealm 默认的 SimpleCredentialsMatcher，认证缓存命中时提交的凭据仍会与缓存中的 AuthenticationInfo 实际比对，任意密码不再通过认证，修复随 3.0.1 版本发布。", "effects": [{"comp_name": "org.apache.shiro:shiro-core", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,3.0.1)", "min_fixed_version": "3.0.1", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "身份验证不当", "kind_en": "认证不当", "last_modified_time": "2026-11-14", "level": "Critical", "mps_id": "MPS-adb1-b3b5", "poc": false, "poc_url": [], "published_time": "2026-11-14", "reference_url_list": [{"url": "https://www.openwall.com/lists/oss-security/2026/11/14/8", "name": ""}, {"url": "https://github.com/apache/shiro/commit/c3cfcf752d784444497aa60abd305aa135329c5b", "name": ""}, {"url": "https://github.com/apache/shiro/releases/tag/shiro-root-3.0.1", "name": ""}, {"url": "https://shiro.apache.org/", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-129349", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "Apache Shiro认证缓存密码绕过漏洞", "_translated": true, "_saved_at": "2026-11-14T08:26:44+00:00", "_first_saved_at": "2026-11-14T08:26:44+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-adb1-b3b5"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-85101", "cvss": {"cvssv31": [{"source": "security@synology.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:H/A:L", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:H/A:L", "cwe": "CWE-288", "description": "Synology DiskStation Manager (DSM) 是群晖科技（Synology）用于 NAS 设备的闭源操作系统，提供文件服务、备份与管理功能，其内置的 rsync 服务用于远程备份与文件同步。\n受影响版本中，DSM 内置 rsync 服务存在使用替代路径或通道绕过身份认证的缺陷（CWE-288）。在启用 rsync 服务的设备上，远程攻击者无需凭据即可绕过认证并访问 rsync 服务，进而读取特定文件、写入任意文件并实施有限的拒绝服务攻击；官方公告未披露具体源码位置，该漏洞 CVSS 3.1 评分为 8.6。\n修复版本中通过官方安全更新修复 rsync 服务的认证校验逻辑，封堵了绕过身份认证的替代通道，阻断未授权的文件读取、写入与拒绝服务风险，对应修复版本为 DSM 7.2.1-69057-13、7.2.2-72806-10、7.3.2-86009-5 与 7.4.1-90080-1。", "effects": [{"comp_name": "diskstation_manager", "ecosystem": "linux", "versions": [{"affected_version": "[7.2.2-72806,7.2.2-72806-10)", "min_fixed_version": "7.2.2-72806-10", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[7.3.2-86009,7.3.2-86009-5)", "min_fixed_version": "7.3.2-86009-5", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[7.2.1-69057,7.2.1-69057-13)", "min_fixed_version": "7.2.1-69057-13", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[7.4.1-90080,7.4.1-90080-1)", "min_fixed_version": "7.4.1-90080-1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "使用候选路径或通道进行的认证绕过", "kind_en": "使用备用路径或通道绕过身份验证", "last_modified_time": "2026-11-12", "level": "High", "mps_id": "MPS-5u6w-gjiv", "poc": false, "poc_url": [], "published_time": "2026-11-12", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-5u6w-gjiv", "name": "https://www.oscs1024.com/hd/MPS-5u6w-gjiv"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-85101", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-85101"}, {"url": "https://www.synology.com/en-global/security/advisory/Synology_SA_26_19", "name": "Synology-SA-26:19 DSM"}], "scope_influence": "", "tags": ["应用软件"], "title": "Synology DSM rsync认证绕过漏洞", "_translated": true, "_saved_at": "2026-11-12T09:05:56+00:00", "_first_saved_at": "2026-11-12T09:05:56+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-5u6w-gjiv"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-93404", "cvss": {}, "cvss_score": 8.6, "cvss_vector": "", "cwe": "CWE-89", "description": "rsyslog 是一款开源的 Linux 与 Unix 平台 syslog 日志采集和转发守护进程，omclickhouse 是其可选输出模块，用于将日志消息渲染为 INSERT 语句写入 ClickHouse 数据库，该模块默认不加载。\n受影响版本中，内置 INSERT 模板 StdClickHouseFmt 在 8.1901.0 中缺少 SQL 模式声明，后续版本改用 STDSQL 模式，该模式转义由 runtime/template.c 的 doEscape 函数实现，仅将字段中的单引号翻倍为两个单引号，不处理反斜杠；ClickHouse 对单引号字符串字面量内的反斜杠序列有自身转义解释，能够提交日志消息且消息被路由至该动作的攻击者可构造以反斜杠结尾的消息内容抵消模板拼接的收尾单引号，篡改发送至 ClickHouse 的 INSERT 语句，伪造存储的日志记录或以所配置 ClickHouse 账户权限执行表达式。\n修复版本中通过将 StdClickHouseFmt 的转义模式由 STDSQL 改为反斜杠感知的 SQL 模式，新增 OMSR_RQD_TPL_OPT_SQL_BACKSLASH 模板要求，并在 runtime/action.c 的 addAction 中强制该动作模板 optFormatEscape 为 SQL_ESCAPE 且拒绝 strgen 与 subtree 模板，保证写入 ClickHouse 的字段均经反斜杠感知转义，切断日志内容逃逸字符串字面量的路径；官方将修复版本标签定为 2026-11-11 daily stable，正式编号版本发布前需采用对应每日构建。", "effects": [{"comp_name": "rsyslog", "ecosystem": "linux", "versions": [{"affected_version": "[8.1901.0,2026-11-11-daily-stable)", "min_fixed_version": "2026-11-11-daily-stable", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-11-12", "level": "High", "mps_id": "MPS-eeb9-f228", "poc": false, "poc_url": [], "published_time": "2026-11-12", "reference_url_list": [{"url": "https://www.openwall.com/lists/oss-security/2026/11/11/26", "name": ""}, {"url": "https://www.openwall.com/lists/oss-security/2026/11/11/26/1", "name": ""}, {"url": "https://github.com/rsyslog/rsyslog/security/advisories/GHSA-8rx7-ww92-p4vr", "name": ""}, {"url": "https://github.com/rsyslog/rsyslog", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "rsyslog omclickhouse SQL注入", "_translated": true, "_saved_at": "2026-11-12T01:13:50+00:00", "_first_saved_at": "2026-11-12T01:13:50+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-eeb9-f228"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-101107", "cvss": {"cvssv3": [{"source": "vultures@jpcert.or.jp", "vector": "CVSS:3.0/AV:A/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8}], "cvssv4": [{"source": "vultures@jpcert.or.jp", "vector": "CVSS:4.0/AV:A/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:A/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-78", "description": "Air Terminal 6 是 SoftBank 株式会社提供的家用 Wi-Fi 路由器设备，通过内置 Web 管理控制台提供设备配置管理能力，产品固件未公开源码。\n受影响版本中，Web 管理控制台的处理流程存在 OS 命令注入缺陷（CWE-78），能够登录 Web 管理界面的用户提交的输入可进入设备系统命令执行流程，最终以 root 权限执行任意命令；厂商公告未披露具体涉及的功能入口与源码位置。\n修复版本中通过厂商于 2026 年 9 月发布的修复固件收紧相关处理，消除以 root 权限执行任意命令的风险；修复固件已在联网设备上自动下发，未联网设备恢复联网后会自动获取，公开资料未披露具体代码修改。", "effects": [{"comp_name": "air_terminal_6", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.01.80]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-11-12", "level": "High", "mps_id": "MPS-wfzp-31or", "poc": false, "poc_url": [], "published_time": "2026-11-12", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-wfzp-31or", "name": "https://www.oscs1024.com/hd/MPS-wfzp-31or"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-101107", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-101107"}, {"url": "https://jvn.jp/en/jp/JVN64740097/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "SoftBank Air Terminal 6命令注入漏洞", "_translated": true, "_saved_at": "2026-11-12T09:05:54+00:00", "_first_saved_at": "2026-11-12T09:05:54+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-wfzp-31or"}, {"analysis_status": 0, "article s://www.oscs1024.com/hd/MPS-75sv-c01e"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过向受信任的数据序列化过程中添加恶意数据，从而在序列化和反序列化过程中执行恶意代码的攻击漏洞。这种漏洞通常存在于使用序列化 (serialization) 机制存储和传输数据的程序中。\n", "title": "什么是反序列化"}, {"content": "- 注入攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码注入到程序中，从而实现代码执行的目的。\n- 反射攻击：攻击者使用反射机制，在序列化过程中动态生成恶意数据，并将恶意代码注入到程序中，从而实现代码执行的目的。\n- 缓冲区溢出攻击：攻击者通过在序列化过程中向缓冲区输入恶意数据，导致缓冲区溢出，从而破坏程序的内存管理，实现代码执行的目的。\n- 格式字符串攻击：攻击者通过在序列化过程中输入恶意数据，导致程序使用错误的格式字符串，从而实现代码执行的目的。\n- 数据流攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码作为一个数据流传递给程序，从而实现代码执行的目的。\n", "title": "反序列化常见的攻击方式"}, {"content": "- 不信任输入数据：程序应该严格检查输入数据的有效性，并避免使用不受信任的数据。\n- 使用安全的序列化机制：程序应该使用安全的序列化机制，如 JSON 或 XML 序列化，而不是第三方序列化库。\n- 最小特权原则：程序应该限制对受信任数据的处理权限，并避免在运行时修改数据。\n- 代码审查和漏洞扫描：程序应该进行代码审查和漏洞扫描，以发现和修复潜在的安全漏洞。\n", "title": "如何预防反序列化"}], "cnvd_id": "", "cve_id": "CVE-2026-77882", "cvss": {"cvssv31": [{"source": "psirt@lenovo.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}], "cvssv4": [{"source": "psirt@lenovo.com", "vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.5}]}, "cvss_score": 8.5, "cvss_vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-502", "description": "A deserialization of untrusted data vulnerability was discovered in Lenovo System Update that could allow a local authenticated user to execute code with elevated privileges.", "effects": [{"comp_name": "system_update", "ecosystem": "linux", "versions": [{"affected_version": "[0,5.08.03.59]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "反序列化", "kind_en": "不可信数据的反序列化", "last_modified_time": "2026-11-12", "level": "High", "mps_id": "MPS-sq5t-8eod", "poc": false, "poc_url": [], "published_time": "2026-11-12", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-sq5t-8eod", "name": "https://www.oscs1024.com/hd/MPS-sq5t-8eod"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-77882", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-77882"}, {"url": "https://support.lenovo.com/us/en/product_security/LEN-232748", "name": ""}, {"url": "https://support.lenovo.com/us/en/downloads/ds012808", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "CVE-2026-77882漏洞", "_translated": true, "_saved_at": "2026-11-14T08:26:46+00:00", "_first_saved_at": "2026-11-11T18:17:03+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-sq5t-8eod"}, {"analysis_status": 3, "articles": [{"content": "由于整数类型的有限范围，在进行算术运算或操作时，结果可能超出类型的表示范围，导致溢出或环绕。溢出指的是结果超过了类型的最大值或小于了最小值，而环绕指的是结果绕回到类型的最小值或最大值。", "title": "什么是整数溢出或环绕"}, {"content": "- 缓冲区溢出：整数溢出可能导致缓冲区溢出漏洞。当整数溢出导致分配的缓冲区大小不足以容纳结果时，攻击者可以利用这个漏洞覆盖相邻的内存区域，执行恶意代码或篡改程序的状态。\r\n- 身份验证绕过：在进行身份验证或访问控制时，整数溢出可能导致绕过验证的漏洞。攻击者可以构造特殊的输入，使溢出的整数值绕过了预期的验证逻辑，从而获得未经授权的访问权限。\r\n- 数据篡改：整数溢出可能导致数据篡改漏洞。攻击者可以通过使整数溢出，修改计数器、索引或其他控制数据的值，导致程序在处理数据时发生错误或执行意外的操作。", "title": "整数溢出或环绕常见的攻击方式"}, {"content": "- 输入验证与限制：对用户输入的整数进行合理的验证和限制，确保其在允许的范围内。\r\n- 使用安全的整数操作函数：使用安全的整数操作函数，如`add_with_overflow()`、`sub_with_overflow()`、`mul_with_overflow()`等，这些函数会检查并处理溢出情况，确保计算结果在安全范围内。\r\n- 类型检查和转换：在进行整数运算或操作之前，进行类型检查和转换，确保操作数的类型和范围是合适的。\r\n- 强制性编码标准和最佳实践：制定强制性的编码标准和最佳实践，包括对整数运算和操作的规范和限制，以帮助程序员编写更可靠、安全的代码。\r\n- 静态代码分析和测试：使用静态代码分析工具和测试技术来检测和识别潜在的整数溢出问题。这些工具可以帮助发现代码中可能存在的溢出漏洞，并及时修复。", "title": "如何预防整数溢出或环绕"}], "cnvd_id": "", "cve_id": "CVE-2026-111760", "cvss": {"cvssv31": [{"source": "murphysec", "vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:R/S:C/C:H/I:H/A:H", "severity": "high", "base_score": 8}]}, "cvss_score": 8, "cvss_vector": "", "cwe": "CWE-190", "description": "Git 是广泛使用的开源分布式版本控制系统，为开发者工作机、构建服务器与代码托管平台提供代码版本管理与协作能力。\n受影响版本中，攻击者放入一条超长路径。Git 用较宽的整数 size_t 算出它有多长，记入索引的长度字段 ce_namelen 时只保留 32 位，记下的长度变成较小正数。这条路径的开头几个字符是 .git，后面还有很长一段。安全检查看的是带有后半段的整条路径，整条路径不是单独的名字 .git，检查通过。写到磁盘时，Git 只按记下的短长度保留开头几个字符，后半段被丢掉，文件名变成 .git。这条记录若是符号链接，子模块文件夹里的 .git 由路标小文件变成符号链接，指向攻击者准备的另一个目录。常见代码托管网站拒收这种超长路径，仓库要由攻击者自己提供，并且用户要做子模块递归克隆。Git 顺着这个 .git 进入该目录，把它当作子模块的仓库目录，可能执行里面的钩子。钩子是 Git 在克隆过程中自动调用的脚本，其中的命令以执行克隆的用户身份运行。命令跑在开发人员的电脑或持续集成任务里，攻击者能在这台机器上执行命令，并读取该用户能访问的代码和凭据。\n修复版本中通过在记入索引之前核对路径的真实长度。长度超过有符号整数的上限时，Git 拒绝这条路径，变短的长度不会被保存。安全检查和写到磁盘的文件名因此看到同一条路径，超长路径不会再被写成名叫 .git 的符号链接，克隆时也不会执行攻击者放在该目录里的钩子。索引路径还有长度上限 index.maxPathLen，默认 1073740799 字节。读取目录树和检出时也使用真实长度，避免在核对之前先被截短。", "effects": [{"comp_name": "enterprise_server", "ecosystem": "linux", "versions": [{"affected_version": "[3.20,3.20.11)", "min_fixed_version": "3.20.11", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[3.21,3.21.9)", "min_fixed_version": "3.21.9", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[3.22,3.22.4)", "min_fixed_version": "3.22.4", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[3.19,3.19.15)", "min_fixed_version": "3.19.15", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "git", "ecosystem": "linux", "versions": [{"affected_version": "[2.52.0-rc0,2.52.1)", "min_fixed_version": "2.52.1", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[2.54.0-rc0,2.54.1)", "min_fixed_version": "2.54.1", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,2.50.2)", "min_fixed_version": "2.50.2", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[2.53.0-rc0,2.53.1)", "min_fixed_version": "2.53.1", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[2.55.0-rc0,2.55.1)", "min_fixed_version": "2.55.1", "repository": "unmanaged", "solutions": ty": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:R/S:U/C:H/I:H/A:H", "cwe": "CWE-122", "description": "Git 合并两个分支的文本改动时，会参照两者的共同版本，判断各自改了什么，再尝试整合。这一过程称为文本三方合并，由 xdiff 模块处理。\n受影响版本中，xdiff 用有符号整数 int 累计合并结果的长度，Git 再按计算值分配缓冲区。旧代码未检查累加是否发生整数溢出。发生整数溢出后，Git 可能把偏小的计算值当作实际长度，分配的缓冲区便装不下完整的合并结果。后续写入可能越过缓冲区边界，导致进程崩溃或破坏内存。GitLab 和极狐 GitLab 的公告指出，这种越界写还可能导致在 Gitaly（仓库后端服务）中执行任意命令。\n修复版本中通过将累计长度的类型从 int 改为 size_t（C 语言中用于表示对象大小的无符号整数类型），并在累加时检查溢出，避免按错误长度分配缓冲区。如果累加发生溢出，或结果超过后续接口所用 long 类型的上限，Git 会停止处理该合并结果。", "effects": [{"comp_name": "git", "ecosystem": "linux", "versions": [{"affected_version": "[2.56.0-rc0,2.56.1)", "min_fixed_version": "2.56.1", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,2.50.2)", "min_fixed_version": "2.50.2", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[2.55.0-rc0,2.55.1)", "min_fixed_version": "2.55.1", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[2.51.0-rc0,2.51.3)", "min_fixed_version": "2.51.3", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[2.54.0-rc0,2.54.1)", "min_fixed_version": "2.54.1", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[2.53.0-rc0,2.53.1)", "min_fixed_version": "2.53.1", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[2.52.0-rc0,2.52.1)", "min_fixed_version": "2.52.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "gitlab", "ecosystem": "linux", "versions": [{"affected_version": "[16.2,19.3.8)", "min_fixed_version": "19.3.8", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[19.4,19.4.6)", "min_fixed_version": "19.4.6", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[19.5,19.5.4)", "min_fixed_version": "19.5.4", "repository": "unmanaged", "solut ---- |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-118597", "cvss": {"cvssv4": [{"source": "help@fluidattacks.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:H/UI:P/VC:H/VI:H/VA:N/SC:L/SI:L/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:H/UI:P/VC:H/VI:H/VA:N/SC:L/SI:L/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-79", "description": "Akaunting 是开源的免费自托管会计与发票管理软件，基于 PHP/Laravel 构建，面向中小企业提供记账、开票以及多公司与多用户权限管理能力。\n受影响版本中，内置 Manager 角色用户默认拥有 settings-invoice 读/写权限，可向 PATCH /{company_id}/settings/invoice 提交自定义付款期限字段 payment_terms，App\\Abstracts\\Http\\SettingController 的 update() 方法未对该字段做校验，直接以公司级设置 invoice.payment_terms 存储。Invoice 设置页将该存储值传入 PaymentTerm 组件，当值不属于预定义选项时 render() 方法将其写入 $value 并把选中项改为 custom，组件模板随后在第 123-129 行把 $value 直接拼接进 @interface 的 Alpine.js 事件处理表达式，Blade 的 HTML 转义无法阻止由标识符、点号、括号、逗号和数字组成的 JavaScript 表达式生效，同公司更高权限用户（含 Administrator）打开 Invoice 设置页时，浏览器在其已认证会话中执行攻击者控制的脚本。\n修复版本中通过官方建议的方式消除风险：不再将存储值拼接进 JavaScript 源码，改用 Laravel 的 @js()/Js::from 以数据形式输出，并将 invoice.payment_terms 校验为有界整数；截至 2026-11-12 官方尚未发布包含该修复的版本，3.3.1 与 master 分支仍保留相同拼接逻辑，官方修复发布前可改用预定义付款期限选项并限制 settings- 许在临时模式 pg_temp 中创建临时对象。厂商说明这允许以运行数据库的操作系统用户身份执行任意代码。\n修复版本中通过为命名复合类型的 Datum 打上属性版本号，并在 heap_deform_tuple() 拆解前调用核对函数 heap_datum_check()，比较 TupleDesc 与 Datum 是否兼容；版本不一致时拒绝拆解并报错，切断按错误布局读取旧值的路径。同一次安全更新还收紧了 ALTER COLUMN TYPE 在函数默认表达式等依赖仍然存在时的限制。", "effects": [{"comp_name": "postgresql", "ecosystem": "linux", "versions": [{"affected_version": "[17.0,17.12)", "min_fixed_version": "17.12", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,14.25)", "min_fixed_version": "14.25", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[16.0,16.16)", "min_fixed_version": "16.16", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[15.0,15.20)", "min_fixed_version": "15.20", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[18.0,18.7)", "min_fixed_version": "18.7", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "使用不兼容类型访问资源（类型混淆）", "kind_en": "使用不兼容类型访问资源（“类型混淆”）", "last_modified_time": "2026-11-13", "level": "High", "mps_id": "MPS-v3ym-xc8d", "poc": true, "poc_url": [], "published_time": "2026-11-13", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-v3ym-xc8d", "name": "https://www.oscs1024.com/hd/MPS-v3ym-xc8d"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-6460", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-6460"}, {"url": "https://www.postgresql.org/support/security/CVE-2026-6460/", "name": ""}, {"url": "https://github.com/postgres/postgres/commit/cfdd09589b9f19fbc78c244e7868f1af46c460b8", "name": "Commit"}], "scope_influence": "广", "tags": ["应用软件", "数据库"], "title": "PostgreSQL复合类型任意代码执行漏洞", "_translated": true, "_saved_at": "2026-11-13T04:37:50+00:00", "_first_saved_at": "2026-11-13T04:37:50+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-v3ym-xc8d"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-112182", "cvss": {"cvssv4": [{"source": "cve-coordination@incibe.es", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-862", "description": "OpenKM 社区版中工作流定义管理中存在未授权漏洞。 REST 端点“registerProcessDefinition”和“runProcessDefinition”需要身份验证，但不验证 WorkflowService 或较低层中的角色。具有“ROLE_USER”角色的攻击者可以注册并执行包含 BeanShell 脚本的流程定义，从而允许他们以服务的权限执行 Java 代码和操作系统命令。在官方 Docker 镜像中，该进程以 root 身份运行。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-11-13", "level": "High", "mps_id": "MPS-72en-96bd", "po 04:37:53+00:00", "_first_saved_at": "2026-11-13T04:37:53+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-d25x-usaz"}, {"analysis_status": 0, "articles": [{"content": "在程序试图读取、写入或复制内存缓冲区时，未对边界进行适当的检查和限制。缓冲区是用于存储数据的一块内存区域，当程序试图在缓冲区之外的位置进行操作时，就可能导致缓冲区溢出或下溢。攻击者可以利用这个漏洞来修改程序的执行流、执行任意代码或导致拒绝服务等安全问题。", "title": "什么是缓冲区溢出"}, {"content": "- 缓冲区溢出攻击：攻击者向输入缓冲区中注入超过其容量的数据，导致数据溢出到相邻的内存区域，可能覆盖关键数据、修改变量值或执行恶意代码。\n- 缓冲区下溢攻击：攻击者向输入缓冲区中注入少于其容量的数据，导致数据被读取时越过缓冲区边界，可能泄露敏感信息或破坏程序的正常执行流程。\n- 字符串格式化攻击：攻击者通过控制格式化字符串的输入，可以读取或写入任意内存位置，从而执行恶意操作。", "title": "缓冲区溢出常见的攻击方式"}, {"content": "- 输入验证和边界检查：对于所有接受用户输入的缓冲区操作，确保验证输入数据的长度和内容，以避免缓冲区溢出或下溢。\n- 使用安全的字符串操作函数：使用安全的字符串操作函数（如strncpy、strncat）替代不安全的函数（如strcpy、strcat），这些函数会在操作时自动限制操作的边界。\n- 使用内存安全工具：使用内存安全工具（如内存分析器、静态分析工具）来检测和修复潜在的缓冲区溢出问题。\n- 采用安全编码实践：遵循安全编码实践，如最小特权原则、避免使用不受信任的输入等。\n- 定期更新和修补程序：及时应用程序厂商提供的安全更新和补丁，以修复已知的缓冲区溢出漏洞。\n- 使用编程语言和框架提供的安全功能：利用编程语言和框架提供的安全特性，如内存安全函数、边界检查等。", "title": "如何预防缓冲区溢出"}], "cnvd_id": "", "cve_id": "CVE-2026-107411", "cvss": {"cvssv4": [{"source": "50a63c94-1ea7-4568-8c11-eb79e7c5a2b5", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-119", "description": "Citrix NetScaler ADC 与 Citrix NetScaler Gateway 是 Cloud Software Group 旗下的闭源应用交付与安全接入设备，用于负载均衡、大尺度 NAT（LSN）、网关与远程接入等场景。\n受影响版本中，设备的 RTSP ALG（实时流协议应用层网关）处理逻辑存在内存溢出缺陷（CWE-119），当设备配置了 RTSP 类型的 LB 虚拟服务器（add lb vserver \u003cn\u003e RTSP \u003cVIP\u003e 554）或在 LSN 组上启用 RTSP ALG（add lsn group \u003cgroup\u003e -clientname \u003cclient\u003e -rtspalg ENABLED）时，远程攻击者无需认证可直接向 RTSP 流量路径发送数据触发越界内存访问，导致设备行为异常或拒绝服务，官方 CVSS v4.0 基础评分为 8.7，主要影响可用性。\n修复版本中通过升级至 14.1-73.57、13.1-64.39、14.1-73.58 FIPS 或 13.1-37.293 及之后版本，Citrix 修复了 RTSP ALG 处理逻辑中的内存溢出缺陷，消除了上述配置路径下的越界内存访问与拒绝服务风险。", "effects": [{"comp_name": "netscaler_adc", "ecosystem": "linux", "versions": [{"affected_version": "[14.1,14.1-73.57)", "min_fixed_version": "14.1-73.57", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[13.1-FIPS/NDcPP,13.1-37.293)", "min_fixed_version": "13.1-37.293", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[13.1,13.1-64.39)", "min_fixed_version": "13.1-64.39", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[14.1-FIPS,14.1-73.58-FIPS)", "min_fixed_version": "14.1-73.58-FIPS", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "netscaler_gateway", "ecosystem": "linux", "versions": [{"affected_version": "[14.1,14.1-73.57)", "min_fixed_version": "14.1-73.57", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[13.1,13.1-64.39)", "min_fixed_version": "13.1-64.39", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "缓冲区溢出", "kind_en": "内存缓冲区范围内的操作限制不当", "last_modified_time": "2026-11-13", "level": "High", "mps_id": "MPS-l1u9-omtv", "poc": false, "poc_url": [], "published_time": "2026-11-13", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-l1u9-omtv", "name": "https://www.oscs1024.com/hd/MPS-l1u9-omtv"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-107411", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-107411"}, {"url": "https://support.citrix.com/support-home/kbsearch/article?articleNumber=CTX697305", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "NetScaler RTSP ALG内存溢出漏洞", "_translated": true, "_saved_at": "2026-11-13T04:37:55+00:00", "_first_saved_at": "2026-11-13T04:37:55+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-l1u9-omtv"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-107413", "cvss": {"cvssv4": [{"source": "50a63c94-1ea7-4568-8c11-eb79e7c5a2b5", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-122", "description": "Citrix NetScaler ADC 与 Citrix NetScaler Gateway 是 Cloud Software Group 旗下的商业应用交付与安全接入设备，为闭源软件，广泛用于负载均衡、混合多云部署与企业远程访问安全接入；设备配置 SAML action 后可作为 SAML 服务提供者处理联合身份认证。\n受影响版本中，SAML 认证处理流程在处理认证相关数据时存在基于堆的缓冲区溢出（CWE-122），官方公告确认该缺陷可导致设备出现不可预测或错误行为，或造成拒绝服务；按厂商 CVSS v4.0 评分，远程攻击者无需权限、无需用户交互即可经由网络触发，配置中不存在 add authentication samlAction 的部署不受影响。\n修复版本中通过厂商安全更新修正 SAML 认证流程对相关数据的内存处理，消除堆缓冲区溢出风险，管理员需将设备升级至 14.1-73.57、13.1-64.39、14.1-73.58 FIPS 或 13.1-37.293 及以上对应版本，使用 NetScaler 实例的 Secure Private Access 混合部署需同步升级。", "effects": [{"comp_name": "citrix_netscaler_adc", "ecosystem": "linux", "versions": [{"affected_version": "[14.1,14.1-73.57)", "min_fixed_version": "14.1-73.57", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[13.1,13.1-64.39)", "min_fixed_version": "13.1-64.39", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[14.1-FIPS,14.1-73.58-FIPS)", "min_fixed_version": "14.1-73.58-FIPS", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[13.1-FIPS/NDcPP,13.1-37.293)", "min_fixed_version": "13.1-37.293", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "citrix_netscaler_gateway", "ecosystem": "linux", "versions": [{"affected_version": "[14.1,14.1-73.57)", "min_fixed_version": "14.1-73.57", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[13.1,13.1-64.39)", "min_fixed_version": "13.1-64.39", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "堆缓冲区溢出", "kind_en": "基于堆的缓冲区溢出", "last_modified_time": "2026-11-13", "level": "High", "mps_id": "MPS-tf7i-3n6v", "poc": false, "poc_url": [], "published_time": "2026-11-13", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-tf7i-3n6v", "name": "https://www.oscs1024.com/hd/MPS-tf7i-3n6v"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-107413", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-107413"}, {"url": "https://support.citrix.com/support-home/kbsearch/article?articleNumber=CTX697305", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "NetScaler SAML认证堆溢出漏洞", "_translated": true, "_saved_at": "2026-11-13T04:37:57+00:00", "_first_saved_at": "2026-11-13T04:37:57+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-tf7i-3n6v"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-75577", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.2}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-78", "description": "Cudy TR3000 1.0 是 Shenzhen Cudy Technology Co., Ltd. 推出的 WiFi 6 便携式无线路由器，运行厂商闭源固件，通过基于 LuCI 的 Web 管理界面提供 WireGuard 等 VPN 组网功能。\n受影响版本中，/cgi-bin/luci/rpc/app 的 JSON-RPC 接口 vpn.export_conf 方法在导出 WireGuard 配置时将存储的 private_key 传入 wg pubkey shell 命令执行，且未对 shell 元字符进行中性化处理；拥有管理员权限的攻击者先保存包含 $() 命令替换的恶意 private_key，再调用 vpn.export_conf 方法，注入的命令以 root 权限在设备上执行。\n修复版本中通过 2.5.42 系统固件修复该命令注入漏洞，厂商已在官方下载中心发布 2.5.42 固件，升级后可消除通过 vpn.export_conf 与恶意 WireGuard 私钥以 root 权限执行任意命令的风险。", "effects": [{"comp_name": "tr3000", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.5.42)", "min_fixed_version": "2.5.42", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-11-13", "level": "High", "mps_id": "MPS-0dfa-wvjs", "poc": false, "poc_url": [], "published_time": "2026-11-13", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-0dfa-wvjs", "name": "https://www.oscs1024.com/hd/MPS-0dfa-wvjs"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-75577", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026- b_status()，并将 pg_database_dialects.go 中剩余的 LIKE 操作符、::regproc 类型转换与等号比较全部限定到 pg_catalog，使方言探测查询的函数、操作符与类型名称解析不再经过用户 search_path，攻击者植入 schema 的同名对象无法再被选中，提权链路被切断。", "effects": [{"comp_name": "aws-advanced-go-wrapper", "ecosystem": "linux", "versions": [{"affected_version": "[2026-04-06,2026-07-29)", "min_fixed_version": "2026-07-29", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "github.com/aws/aws-advanced-go-wrapper/awssql/v2", "ecosystem": "go", "versions": [{"affected_version": "[2.0.0,2.0.3)", "min_fixed_version": "2.0.3", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "不可信的搜索路径", "kind_en": "不受信任的搜索路径", "last_modified_time": "2026-11-13", "level": "High", "mps_id": "MPS-dj1l-fot3", "poc": false, "poc_url": [], "published_time": "2026-11-13", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-dj1l-fot3", "name": "https://www.oscs1024.com/hd/MPS-dj1l-fot3"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-126793", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-126793"}, {"url": "https://github.com/aws/aws-advanced-go-wrapper/releases/tag/release-2026-07-29", "name": ""}, {"url": "https://aws.amazon.com/security/security-bulletins/2026-182-aws/", "name": ""}, {"url": "https://github.com/aws/aws-advanced-go-wrapper/security/advisories/GHSA-fhr2-6r5v-gm9f", "name": ""}], "scope_influence": "", "tags": ["go", "应用软件"], "title": "AWS Go Wrapper 方言探测提权", "_translated": true, "_saved_at": "2026-11-12T23:04:46+00:00", "_first_saved_at": "2026-11-12T23:04:46+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-dj1l-fot3"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-75576", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.2}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-78", "description": "Cudy TR3000 1.0 是 Cudy（Shenzhen Cudy Technology）推出的 AX3000 便携式 Wi-Fi 6 路由器，固件基于 OpenWrt 21.02 与 LuCI Web 管理框架，属闭源商业固件，主要面向移动办公与旅行场景提供组网和 VPN 客户端能力。\n受影响版本中，管理后台 VPN 客户端配置页面（admin/network/vpn/client）的 CBI FileUpload 上传处理器未对 multipart 上传文件名做有效校验：攻击者以已认证管理员身份上传 .ovpn OpenVPN 配置文件时，含 $() 的文件名未经清理即参与构造 /etc/openvpn/client/ 下的 conf_file 路径并进入 cat %q 等命令模板，经 luci.sys 与 os.execute 交给 /bin/sh -c 执行；Lua %q 转义无法中和 $() 与反引号，命令替换以 root 权限运行，最终导致任意命令执行。\n修复版本中通过在上传处理链引入 uciname 数据类型校验（verify_datatype）与内部 sanitize 清理，再以 /etc/openvpn/client/\u003cname\u003e.ovpn 构造 conf_file 路径，并剔除配置内容中的注释与 auth-user-pass、askpass 等指令，切断了 multipart 文件名进入 shell 命令的路径。", "effec 会发生这种情况。例如，如果开发人员未正确过滤用户输入的用户名或密码，那么黑客可能会利用这些信息轻松地访问系统。\n", "title": "关键资源权限分配不当常见的攻击方式"}, {"content": "- 使用强密码：管理员应该使用强密码来保护系统，并定期更改密码。强密码应该包括数字、字母和符号，并且应该不同于其他帐户使用的密码。\n- 正确配置权限：管理员应该正确配置系统中不同资源所需的权限。用户可以被授予访问特定资源的权限，但不应该被授予访问其他资源的权限。\n- 权限限制：管理员应该使用权限限制来限制用户对特定资源的访问。例如，用户可以被授予访问特定文件夹的权限，但不能访问其他文件夹。\n- 输入验证：开发人员应该正确验证用户输入。例如，他们可以过滤用户输入的用户名和密码，以确保它们符合预期的格式。\n- 安全培训：管理员和用户应该接受安全培训，以便了解如何识别和避免常见的安全漏洞，例如不正确权限授予漏洞。\n- 定期更新和修补软件：系统软件和应用程序应该定期更新和修补，以确保它们不受最新安全漏洞的影响。", "title": "如何预防关键资源权限分配不当"}], "cnvd_id": "", "cve_id": "CVE-2026-82977", "cvss": {"cvssv4": [{"source": "support@hackerone.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:H/SI:L/SA:L/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.4}]}, "cvss_score": 8.4, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:H/SI:L/SA:L/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-732", "description": "Plesk Obsidian 是 WebPros 旗下闭源的商业服务器托管管理面板，用于 Linux 与 Windows 服务器上的站点、订阅与运维管理；GoAccess 统计集成自 18.0.77 起成为 Plesk for Linux 默认的网页统计工具，基于站点访问日志生成流量报表。\n受影响版本中，Plesk for Linux 的 GoAccess 网页统计功能对统计数据的访问权限控制不正确（CWE-732），在同一服务器上持有订阅账户的攻击者可以越权访问其他订阅站点的网页统计报表，泄露内容包括带查询字符串的完整请求 URL、访问者 IP 地址与来源页面，请求 URL 中携带的令牌等敏感值随之跨订阅暴露。\n修复版本中通过厂商安全更新收紧了网页统计数据的访问权限控制，消除了跨订阅越权读取路径，18.0.81.8、18.0.82.3 及之后版本不再受该问题影响；厂商同时建议对可能已在请求 URL 中暴露的令牌与密钥进行轮换。", "effects": [{"comp_name": "plesk_obsidian", "ecosystem": "linux", "versions": [{"affected_version": "[18.0.77,18.0.81.8)", "min_fixed_version": "18.0.81.8", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[18.0.82,18.0.82.3)", "min_fixed_version": "18.0.82.3", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kin \n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "cnvd_id": "", "cve_id": "CVE-2026-120221", "cvss": {"cvssv4": [{"source": "57a55968-44ac-464c-a794-6ba3baad09c4", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:L/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:N/R:A/V:X/RE:X/U:X", "severity": "high", "base_score": 8.2}]}, "cvss_score": 8.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:L/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:N/R:A/V:X/RE:X/U:X", "cwe": "CWE-416", "description": "在 FRRouting 8.4 及更高版本中，如果“bgp 侦听范围”使用的对等组也配置了源站点（“邻居 PG soo”），则当动态 BGP 邻居断开连接时，bgpd 会释放同一内存两次。每个动态邻居共享对等组的 SoO 值，而不是获取自己的副本，但在删除邻居时将其释放为自己的值，这种情况在其连接关闭时就会发生。第一次断开连接使对等组指向已释放的内存，第二次断开连接再次释放它，导致 bgpd 中止并丢弃路由器上的所有 BGP 会话。地址落在侦听范围内的任何主机都可以通过打开和关闭到 BGP 端口的两个 TCP 连接来触发此操作，无需发送任何 BGP 消息，也不知道 AS 编号，并且可以在每次 bgpd 重新启动时重复此操作。如果对等组有 TCP-MD5 密码，则只有知道该密码的主机才能触发它。合法动态邻居的两个普通襟翼具有相同的效果。在两次释放之间，显示配置（“show running-config”）或建立动态邻居也会读取释放的内存，这可能会在单次断开连接后使 bgpd 崩溃。只有将侦听范围与同一对等组上的 SoO 相结合的配置才会受到影响。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "UAF", "kind_en": "免费后使用", "last_modified_time": "2026-11-13", "level": "High", "mps_id": "MPS-7iav-0lyx", "poc": false, "poc_url": [], "published_time": "2026-11-13", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-7iav-0lyx", "name": "https://www.oscs1024.com/hd/MPS-7iav-0lyx"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-120221", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-120221"}, {"url": "https://github.com/FRRouting/frr/pull/21685/changes/6a96f515760dc278147fbf802777956ba80c7edd", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "frr：当动态邻居断开连接时，bgpd 双重释放对等组源站点", "_translated": true, "_saved_at": "2026-11-13T12:46:23+00:00", "_first_saved_at": "2026-11-13T12:46:23+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-7iav-0lyx"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2026-110279", "cvss": {}, "cvss_score": 8.1, "cvss_vector": "", "cwe": "CWE-287", "description": "IBM ContextForge MCP Gateway 是 Apache-2.0 开源的 AI 网关，PyPI 包名为 mcp-contextforge-gateway，用来把 MCP、A2A 与 REST 请求统一转发到上游服务器，并可自行持有上游凭据，例如按用户存储的 OAuth 令牌、client_credentials 令牌，以及网关配置的 bearer、basic 或自定义认证头。\n受影响版本中，已认证用户经公开 RPC 入口 handle_rpc、SSE 入口 sse_endpoint、WebSocket 入口 websocket_endpoint 或 Streamable HTTP 处理函数 handle_streamable_http 把请求送进网关时，请求里的上游授权头 X-Upstream-Authorization 进入透传头构造函数 get_passthrough_headers 与缓存路径 compute_passthrough_headers_cached；这两处读到该头后无条件把它改名为 Authorization 写进发往上游的头，改名不依赖全局开关 ENABLE_HEADER_PASSTHROUGH。工具服务 invoke_tool 在 REST 与 A2A 路径上把网关认证类型 gateway_auth_type 传成 None，缓存路径无法识别 oauth、bearer、basic、authheaders 已存凭据，调用者即可用自己的令牌替换网关代管的上游凭据，审计只记下调用者身份，上游却以另一套凭据执行，绕过按用户权限与审计归属。\n修复版本中通过增加网关代管认证类型集合 _GATEWAY_MANAGED_AUTH_TYPES，在 get_passthrough_headers 与 compute_passthrough_headers_cached 中对 oauth、bearer、basic、authheaders 丢弃 X-Upstream-Authorization 并记录告警，REST 与 A2A 调用改为传入真实的 tool_auth_type 与 a2a_agent_auth_type；token-exchange 仍保持拦截，none、未设置与 one_time_auth 仍允许改名。", "effects": [{"comp_name": "ibm_contextforge_mcp_gateway", "ecosystem": "linux", "versions": [{"affected_version": "[1.0.0,1.1.1)", "min_fixed_version": "1.1.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "mcp-contextforge-gateway", "ecosystem": "pip", "versions": [{"affected_version": "[1.0.0,1.1.1)", "min_fixed_version": "1.1.1", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "身份验证不当", "kind_en": "认证不当", "last_modified_time": "2026-11-13", "level": "High", "mps_id": "MPS-3u0j-nhif", "poc": false, "poc_url": [], "published_time": "2026-11-13", "reference_url_list": [{"url": "https://www.ibm.com/support/pages/node/7296490", "name": ""}, {"url": "https://github.com/IBM/mcp-context-forge/commit/724b13eef5a98cfb6db3274a88e90def6288a1d1", "name": ""}], "scope_influence": "", "tags": ["AI"], "title": "ContextForge凭据覆盖漏洞", "_translated": true, "_saved_at": "2026-11-13T04:37:51+00:00", "_first_saved_at": "2026-11-13T04:37:51+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-3u0j-nhif"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-109903", "cvss": {"cvssv31": [{"source": "meissner@suse.de", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-191", "description": "21.1  "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-1333", "description": "Soup Sieve is a CSS selector library designed to be used with Beautiful Soup 4. Prior to 3.0, the CSS_ESCAPES and IDENTIFIER regular-expression subpatterns can backtrack exponentially on runs of ambiguous digit escapes in an attribute-name or tag position of an otherwise valid selector. The failure occurs during selector compilation through soupsieve.compile() or Beautiful Soup select() before SELECTOR_LIMIT is applied, so an application that accepts untrusted selector strings can have a worker stalled by a short input. This issue is fixed in version 3.0.", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "ReDoS", "kind_en": "正则表达式复杂性低效", "last_modified_time": "2026-11-13", "level": "High", "mps_id": "MPS-487m-ypl5", "poc": false, "poc_url": [], "published_time": "2026-11-13", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-487m-ypl5", "name": "https://www.oscs1024.com/hd/MPS-487m-ypl5"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-126191", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-126191"}, {"url": "https://github.com/facelessuser/soupsieve/commit/dbfa2854ff31a863326bd6660d4e55c6f068db9e", "name": ""}, {"url": "https://github.com/facelessuser/soupsieve/pull/300", "name": ""}, {"url": "https://github.com/facelessuser/soupsieve/releases/tag/3.0", "name": ""}, {"url": "https://github.com/facelessuser/soupsieve/security/advisories/GHSA-6655-6qjp-jx7x", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-126191 漏洞", "_translated": true, "_saved_at": "2026-11-14T08:26:46+00:00", "_first_saved_at": "2026-11-12T17:50:34+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-487m-ypl5"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-127029", "cvss": {"cvssv31": [{"source": "secalert@redhat.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-787", "description": "FreeRADIUS 是开源的 RADIUS 认证与计费服务器，其 rlm_eap 模块在 eap 模块配置中显式添加 sim 配置块后支持 EAP-SIM 方案，用于基于 SIM 卡的移动网络用户认证。\n受影响版本中，EAP-SIM 处理流程将客户端提交的身份标识以未校验长度的方式复制进内部密钥派生结构 eapsim_keys 的 identity[MAX_STRING_LEN] 固定数组，随后 eapsim_calculate_keys 在派生会话密钥时把该身份连同 Kc、nonce_mt、versionlist 等字段打包进 256 字节的栈缓冲区 buf，身份长度超出限制时写入越过缓冲区末尾，未认证的远程客户端通过发送包含超长身份的 EAP-SIM 报文可触发栈缓冲区溢出，导致 radiusd 进程崩溃、认证服务中断。\n修复版本中通过将 identity 字段改为按实际长度分配的指针并仅在长度合法时保存身份，同时 eapsim_calculate_keys 改为在遍历各输入时逐段计算 SHA1、不再把数据预先打包进固定栈缓冲区，使密钥派生流程不再受身份长度影响，消除越界写入并恢复服务稳定性。", "effects": [{"comp_name": "freeradius", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,3.2.10]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-11-13", "level": "High", "mps_id": "MPS-ayqs-drev", "poc": false, "poc_url": [], "published_time": "2026-11-13", "reference_ eRADIUS 是一款开源的 RADIUS 认证、授权与计费服务器，广泛用于企业网络与 Wi-Fi 802.1X 等接入场景，其 EAP 模块通过 rlm_eap_fast 子模块支持 EAP-FAST 隧道认证。\n受影响版本中，rlm_eap_fast 模块的 _session_ticket 函数处理 ClientHello SessionTicket 扩展中的 PAC-Opaque 数据时，仅将 PAC 头部中攻击者可控的 length 字段与会话票据自身的长度比较，未按栈上固定大小的 opaque_plaintext 结构限制长度；远程未认证攻击者在 EAP-FAST 握手中发送带有超长 length 字段的 PAC-Opaque，eap_fast_decrypt 经 EVP_DecryptUpdate 将攻击者指定长度的解密输出写入该栈上结构，导致栈缓冲区溢出，服务器进程崩溃并造成拒绝服务，AES-256-GCM 标签校验发生在数据写入之后，攻击者无需持有合法 PAC 密钥即可触发。\n修复版本中通过在 _session_ticket 中新增两级长度校验解决该问题：读取 PAC 头部前检查 len 不小于 sizeof(opaque-\u003ehdr)，调用解密前检查 length 不超过 sizeof(*opaque) 与头部大小之差，将解密输出长度限定在目标栈结构容量内，超长 PAC 直接进入错误处理，切断了栈溢出写路径。", "effects": [{"comp_name": "freeradius", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,3.2.10]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,3.0.28]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-11-13", "level": "High", "mps_id": "MPS-ha1u-8sq0", "poc": false, "poc_url": [], "published_time": "2026-11-13", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ha1u-8sq0", "name": "https://www.oscs1024.com/hd/MPS-ha1u-8sq0"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-127030", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-127030"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-127030", "name": ""}, {"url": "https://bugzilla.redhat.com/show_bug.cgi?id=2572340", "name": "RHBZ#2572340"}, {"url": "https://github.com/FreeRADIUS/freeradius-server/commit/064567a08f3b9d9b4863fab6060fafe296ac7de9", "name": ""}, {"url": "https://github.com/FreeRADIUS/freeradius-server/commit/a5d09dad528d7a3a3c4c01158716ab85a12e09ef", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "FreeRADIUS EAP-FAST栈溢出漏洞", "_translated": true, "_saved_at": "2026-11-12T17:50:29+00:00", "_first_saved_at": "2026-11-12T17:50:29+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ha1u-8sq0"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-110278", "cvss": {}, "cvss_score": 7.4, "cvss_vector": "", "cwe": "CWE-294", "description": "IBM ContextForge MCP Gateway 是 Apache-2.0 开源的 AI 网关，PyPI 包名为 mcp-contextforge-gateway，用来把 MCP、A2A 与 REST 请求统一转发到上游服务器，并按全局开关 IDENTITY_PROPAGATION_ENABLED 与每个上游网关的 identity_propagation 配置，把调用用户的 ID、邮箱、组、团队、角色和管理员标记转给上游。\n受影响版本中，认证用户通过公开 RPC 入口 handle_rpc 提交 tools/call，或通过 Streamable HTTP 处理函数 call_tool 与适配器 _adapt_call_tool 调用工具，以及通过资源读取入口 read_resource 访问上游资源时，当前用户的用户上下文 UserContext 进入工具服务 invoke_tool 与资源服务；这两处拼装发往上游的 HTTP 头和 MCP 元数据 `_meta.user` 时，调用身份头构造函数 build_identity_headers 和 build_identity_meta，没有传入该上游网关的 identity_propagation 覆盖。配置解析函数 _resolve_config 在缺少网关对象时只读取全局 IDENTITY_PROPAGATION_ENABLED；全局打开且某个上游已把 identity_propagation.enabled 设为 false 时，仍会发出 X-Forwarded-User-* 头和 `_meta.user`，把用户身份交给本不该收到这些字段的第三方 MCP 服务器。IBM 还写明声明签名 Claims-Signature 对 `user_id:email` 做静态 HMAC，可被重放。\n修复版本中通过让 _resolve_config、build_identity_headers 和 build_identity_meta 接受每个网关的 identity_propagation 字典，并在 invoke_tool 从网关缓存取出该字段后传入；资源读取路径把网关对象交给 build_identity_headers。单个上游设置为 enabled: false 时不再带出身份头和 `_meta.user`。", "effects": [{"comp_name": "ibm_contextforge_mcp_gateway", "ecosystem": "linux", "versions": [{"affected_version": "[1.0.0,1.1.1)", "min_fixed_version": "1.1.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "mcp-contextforge-gateway", "ecosystem": "pip", "versions": [{"affected_version": "[1.0.0,1.1.1)", "min_fixed_version": "1.1.1", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "使用捕获-重放进行的认证绕过", "kind_en": "通过捕获重放绕过身份验证", "last_modified_time": "2026-11-13", "level": "High", "mps_id": "MPS-jw68-q13x", "poc": false, "poc_url": [], "published_time": "2026-11-13", "reference_url_list": [{"url": "https://www.ibm.com/support/pages/node/7296489", "name": ""}, {"url": "https://github.com/IBM/mcp-context-forge/commit/7386a32833a08b176c09223eb58fdbf2104c5068", "name": ""}], "scope_influence": "", "tags": ["AI"], "title": "ContextForge身份信息泄露漏洞", "_translated": true, "_saved_at": "2026-11-13T04:37:58+00:00", "_first_saved_at": "2026-11-13T04:37:58+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-jw68-q13x"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-82414", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-787", "description": "BACnet Stack is a BACnet open source protocol stack C library for embedded systems. From versions 1.4.0 to before 1.4.6, 1.5.0 to before 1.5.1, and 1.6.0 to before 1.6.1, the BACnet MS/TP receive path decodes COBS frames into an output pointer inside the same fixed input buffer, but passes the full input-buffer size as the decode capacity. A long valid COBS payload can therefore write past the end of the actual remaining buffer. This issue has been patched in versions 1.4.6, 1.5.1, 1.6.1, and 1.7.0.", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-11-14", "level": "High", "mps_id": "MPS-5adc-bj2i", "poc": false, "poc_url": [], "published_time": "2026-11-14", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-5adc-bj2i", "name": "https://www.oscs1024.com/hd/MPS-5adc-bj2i"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-82414", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-82414"}, {"url": "https://github.com/bacnet-stack/bacnet-stack/pull/1425", "name": ""}, {"url": "https://github.com/bacnet-stack/bacnet-stack/security/advisories/GHSA-8456-m9x4-j6mc", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-82414 漏洞", "_translated": true, "_saved_at": "2026-11-14T08:26:46+00:00", "_first_saved_at": "2026-11-13T20:13:46+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-5adc-bj2i"}, {"analysis_status": 0, "articles": [{"content": "跨界内存读是指应用程序在读取内存时，未正确验证或限制读取的内存范围。攻击者利用这种漏洞可以读取应用程序内存中的敏感数据，如密码、加密密钥、会话令牌等。常见的原因是由于缓冲区溢出、格式化字符串漏洞或其他内存错误导致的。", "title": "什么是越界读取"}, {"content": "攻击者可以通过不当构造的输入来触发跨界内存读漏洞。攻击者可能会通过向应用程序发送特定的输入，使其读取超过预期的内存区域。攻击者可以利用这个漏洞来获取敏感信息，如其他用户的数据、操作系统的敏感数据或应用程序的内部状态。", "title": "越界读取常见的攻击方式"}, {"content": "- 输入验证和限制：应用程序应对所有输入数据进行严格的验证和限制。确保输入数据的长度、格式和内容符合预期，避免超出缓冲区或访问非预期的内存区域。\n- 内存安全编程实践：开发人员应使用安全的编程实践，如避免使用不安全的函数、正确处理内存分配和释放操作，以及遵循最小特权原则。\n- 使用安全的编程语言和库：选择使用安全性较高的编程语言和库，这些语言和库在内存管理和安全性方面提供了更多的保护机制。\n- 定期进行代码审查和安全测试：定期审查应用程序的代码，并进行安全测试，以发现潜在的跨界内存读漏洞。使用静态代码分析工具和漏洞扫描工具来辅助检测和修复问题。\n- 实施防御性编程技术：应用程序应采用防御性编程技术，如使用随机化地址空间布局（ASLR）、堆栈保护机制（如堆栈溢出保护）和数据执行预防（DEP）等。\n- 及时更新和修补：及时应用程序和操作系统的安全更新和补丁，以确保已知的跨界内存读漏洞得到修复。及时更新相关软件和库，以避免使用已知存在漏洞的版本。", "title": "如何预防越界读取"}], "cnvd_id": "", "cve_id": "CVE-2026-62976", "cvss 如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-71531", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N", "severity": "high", "base_score": 8.1}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-863", "description": "PrestaShop 是开源 PHP 电子商务平台，通过 composer 包 prestashop/prestashop 分发，用于搭建多店铺在线商店，其 Webservice API 是面向外部系统的 REST 风格数据接口，多店铺部署下请求可携带 id_shop 或 id_shop_group 参数选择数据范围。\n受影响版本中，classes/webservice/WebserviceRequest.php 的 shopExists() 在收到 id_shop=all 时把店铺上下文直接扩展为安装内全部店铺，groupShopExists() 在收到 id_shop_group=N 时扩展为组内全部店铺，两者均未校验密钥实际关联的店铺；随后 shopHasRight() 对扩展后的店铺列表逐一拼接 wsas.id_shop = X 的 OR 条件，密钥只要关联其中任意一个店铺便通过校验，持有关联单一店铺密钥的攻击者可读取、修改或删除其他店铺的数据，包括客户记录中的 email、secure_key 与密码哈希。\n修复版本中通过新增 getAllowedShopIdsForCurrentKey() 载入密钥关联店铺，shopExists() 与 groupShopExists() 要求所选店铺全部位于密钥关联范围内，shopHasRight() 改为统计 COUNT(DISTINCT wsas.id_shop) 并要求与所选店铺数量全等的合取判断，配合 normalizeShopIds() 与 setNarrowShopContextFromSelection() 收窄店铺上下文，超出关联范围的请求统一返回 403，密钥访问边界被限制在其关联店铺内。", "effects": [{"comp_name": "prestashop/prestashop", "ecosystem": "composer", "versions": [{"affected_version": "[8.0.0,8.2.9)", "min_fixed_version": "8.2.9", "repository": "composer", "solutions": [], "upstream": true}, {"affected_version": "[9.0.0,9.2.1)", "min_fixed_version": "9.2.1", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitabilit X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-20", "description": "create-ecdh 是 browserify 生态下的开源 npm 加密组件，提供 Node.js crypto.createECDH 的可浏览器化实现，供前端打包工具以及缺少可用原生 ECDH 的 Node.js 版本执行椭圆曲线 Diffie-Hellman 密钥协商。\n受影响版本中，browser.js 的 ECDH.prototype.computeSecret 与 ECDH.prototype.setPublicKey 直接以 curve.keyFromPublic 解析对端公钥并执行点乘，未校验该点位于配置曲线或其素数阶子群，绕过了 elliptic 6.5.x 起 KeyPair.validate 与 KeyPair.derive 提供的公钥校验；攻击者向复用静态私钥的一方提交无效曲线或小子群上的低阶点，可依据协商结果通过中国剩余定理逐项恢复私钥模小因子的分量并最终还原完整私钥；ed25519 与 curve25519 曲线还接受低阶点，可强制产生可预测的共享密钥。\n修复版本中通过新增 validPublicKey 校验函数在 computeSecret 与 setPublicKey 中拒绝无穷远点、不在曲线上的点以及素数阶子群之外的点，并对 Montgomery 曲线显式拒绝 x 为 0 的低阶点，computeSecret 改用 keys.derive 推导共享密钥，无效公钥统一抛出 Public key is not valid for specified curve，行为与 Node.js 原生 ERR_CRYPTO_ECDH_INVALID_PUBLIC_KEY 一致。", "effects": [{"comp_name": "create-ecdh", "ecosystem": "npm", "versions": [{"affected_version": "(-∞,4.0.5)", "min_fixed_version": "4.0.5", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "输入验证不恰当", "kind_en": "输入验证不当", "last_modified_time": "2026-11-14", "level": "High", "mps_id": "MPS-8n0s-6dir", "poc": false, "poc_url": [], "published_time": "2026-11-14", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-8n0s-6dir", "name": "https://www.oscs1024.com/hd/MPS-8n0s-6dir"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-129319", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-129319"}, {"url": "https://github.com/browserify/createECDH/security/advisories/GHSA-32q7-f779-hw5r", "name": ""}, {"url": "https://github.com/browserify/createECDH/commit/1cfaf332773237e5fea4b51a2ad3efab4c22bec1", "name": ""}], "scope_influence": "", "tags": ["npm", "开源"], "title": "create-ecdh公钥校验缺失漏洞", "_translated": true, "_saved_at": "2026-11-14T08:26:43+00:00", "_first_saved_at": "2026-11-14T08:26:43+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-8n0s-6dir"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-128134", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-427", "description": "NLTK（Natural Language Toolkit）是开源 Python 自然语言处理工具包，提供分词、标注、句法分析等能力，nltk.parse.dependencygraph 模块用于构建依存句法图，并通过 Graphviz 的 dot 程序渲染 SVG 等图像输出。\n受影响版本中，dot2img 通过 find_binary(\"dot\") 解析 dot 二进制路径后，以 subprocess.run 直接执行解析出的绝对路径，未经过 nltk.pathsec.spawn_trusted 通道，resolve_trusted_executable 的属主与可写性校验以及 safe_env 的加载器环境清洗均不会运行，而 find_binary 的第一层校验只拒绝当前工作目录下的相对匹配，PATH 的 which 搜索阶段返回的绝对路径会原样通过。本地低权限攻击者在 POSIX 宿主上向受害者 PATH 中的组/全局可写目录植入或替换 dot 后，受害者调用 dot2img 或渲染 DependencyGraph（Jupyter 经 _repr_svg_ 自动触发）时植入的二进制以受害者身份执行，形成本地任意代码执行，未清洗的子进程环境同时暴露 LD_PRELOAD 等加载器注入面；该问题是 CVE-2026-78680 修复 translate/api.py 后 dot2img 遗留的可写绝对 PATH 元素绕过。\n修复版本中通过将 dot 的解析与执行收敛到受信路径切断该链路：dot2img 改用 find_binary_absolute 解析 dot 并拒绝含 .. 分量的路径，再经 spawn_trusted 校验二进制所在目录链无其他本地用户可写、拒绝 shell 并在 exec 前清洗加载器环境，植入的 dot 被 TrustError 拒绝执行。", "effects": [{"comp_name": "nltk", "ecosystem": "pip", "versions": [{"affected_version": "(-∞,3.10.4)", "min_fixed_version": "3.10.4", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "对搜索路径元素未加控制", "kind_en": "Uncontrolled Search Path Element", "last_modified_time": "2026-11-14", "level": "High", "mps_id": "MPS-h1jd-3fk2", "poc": false, "poc_url": [], "published_time": "2026-11-14", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-h1jd-3fk2", "name": "https://www.oscs1024.com/hd/MPS-h1jd-3fk2"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-128134", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-128134"}, {  1.4.6, 1.5.2, and 1.6.1, the BACnet/SC message decoder walks the header-option list by following each option's MORE bit. Nothing rejects a list whose last option still has the MORE bit set, and the decode walk has no upper bound on how many options it processes. A single crafted BVLC-SC frame makes the walk advance one option past the end of the message and read message[message_len], one byte out of bounds. When the bytes after the message carry more MORE-set option markers, the walk keeps going: it runs past the fixed 4-entry option array and writes decoded option fields out of bounds. On the server that decode array is the static global bsc_dm, so the out-of-bounds write lands in adjacent BSS. Both faults are reachable before authentication, from the first frame a peer sends on a BACnet/SC connection, and the bytes that follow the message are the same peer's prior-frame data. This issue has been patched in versions 1.4.6, 1.5.2, 1.6.1, and 1.7.0.", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-11-14", "level": "High", "mps_id": "MPS-aro9-egwd", "poc": false, "poc_url": [], "published_time": "2026-11-14", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-aro9-egwd", "name": "https://www.oscs1024.com/hd/MPS-aro9-egwd"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-97692", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-97692"}, {"url": "https://github.com/bacnet-stack/bacnet-stack/pull/1435", "name": ""}, {"url": "https://github.com/bacnet-stack/bacnet-stack/security/advisories/GHSA-gr74-333w-7wg8", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-97692漏洞", "_translated": true, "_saved_at": "2026-11-14T08:26:46+00:00", "_first_saved_at": "2026-11-13T20:13:44+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-aro9-egwd"}, {"analysis_status": 0, "articles"
