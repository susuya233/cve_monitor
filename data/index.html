:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-93", "description": "1.4.7 版本之前的 IXON VPN Client 中对 CRLF 序列的不正确中和允许攻击者以 root 或 SYSTEM 身份执行命令。本地服务接受的配置值将写入稍后由特权子进程使用的文件中，而行结束序列不会被中和，这允许将其他指令引入到该文件中。配置接口接受更改，而不验证或验证请求者的来源。注入的配置在客户端和操作系统重新启动后仍保留在磁盘上，并且 VPN 连接继续正常运行，因此用户看不到任何行为变化。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "CRLF注入", "kind_en": "Improper Neutralization of CRLF Sequences ('CRLF Injection')", "last_modified_time": "2026-09-05", "level": "Critical", "mps_id": "MPS-ztvf-1ejg", "poc": false, "poc_url": [], "published_time": "2026-09-05", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ztvf-1ejg", "name": "https://www.oscs1024.com/hd/MPS-ztvf-1ejg"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-75925", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-75925"}, {"url": "https://github.com/cisagov/CSAF/blob/develop/csaf_files/OT/white/2026/icsa-26-246-02.json", "name": ""}, {"url": "https://www.cisa.gov/news-events/ics-advisories/icsa-26-246-02", "name": ""}, {"url": "https://www.ixon.cloud/Advisories/ADV-2026-08-05.pdf", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-75925漏洞", "_translated": true, "_saved_at": "2026-09-05T00:33:22+00:00", "_first_saved_at": "2026-09-05T00:33:22+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ztvf-1ejg"}, {"analysis_status": 0, "articles": [{"content": "由于应用程序或系统中存在敏感信息未经适当保护而被泄露给攻击者或未经授权的用户，这些敏感信息可能包括用户凭据、个人身份信息、敏感业务数据、系统配置信息等。信息暴露漏洞通常是由于设计、实施或配置错误引起的，例如不正确的访问控制、弱密码策略、缺乏加密、错误的日志处理等。", "title": "什么是未授权敏感信息泄露"}, {"content": "- 直接访问敏感信息：攻击者可以通过直接访问不正确配置或不受保护的资源来获取敏感信息，如通过公开可访问的URL、未经授权的文件目录访问等。\n- 越权访问：攻击者可能利用访问控制错误或不正确的权限配置来获取他们没有权限访问的敏感信息。\n- 错误信息披露：应用程序在错误处理过程中可能泄露敏感信息，例如将错误消息中的敏感数据返回给客户端或显示在日志文件中。\n- 信息泄露通过响应：攻击者可能利用应用程序在响应中不正确地包含敏感信息，如通过网页源代码、响应头部或响应消息体中的敏感数据。", "title": "未授权敏感信息泄露常见的攻击方式"}, {"content": "- 访问控制：确保只有经过授权的用户能够访问敏感信息，使用强大的身份验证和授权机制。\n- 数据加密：对于敏感信息，使用适当的加密算法对数据进行加密，包括数据传输和存储过程中的加密。\n- 错误处理和日志安全：正确处理错误情况，避免在错误消息中暴露敏感信息。同时，确保日志记录功能的安全性，避免将敏感信息记录在日志文件中。\n- 安全配置和最佳实践：遵循安全最佳实践，对应用程序、服务器和系统进行适当的配置，包括访问控制、权限管理、密码策略等。\n- 审计和监控：实施日志审计和监控机制，及时检测和响应任何异常活动或潜在的信息暴露事件。\n- 安全开发实践：在应用程序开发过程中，进行安全代码审查、漏洞扫描和安全测试，以及敏感信息的正确处理和保护。", "title": "如何预防未授权敏感信息泄露"}], "cnvd_id": "", "cve_id": "CVE-2026-86190", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N", "severity": "critical", "base_score": 9.1}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-200", "description": "WWBN AVideo 是一个开源流媒体视频平台（GitHub 仓库 WWBN/AVideo，主体为 PHP），提供视频点播、直播、用户管理与观看统计等功能。\n受影响版本中，view/videoViewsInfo.json.php、view/videoViewsInfo.csv.php 与 view/videoViewsInfo.php 三个统计入口在请求携带 hash 参数时跳过 Video::canEdit() 权限检查，直接调用 VideoStatistic::getAllFromVideos_id() 获取统计数据；该函数使用 SELECT u.*, vs.* 将 users 表全部列并入观看记录并原样序列化输出，其中包括记录观看行为时经 setSession_id(session_id()) 写入的真实会话标识，以及 password、recoverPass、email、phone、address、birth_date、isAdmin 等 52 个字段，持有 hash 的匿名调用者可读取任意视频全部观看者的敏感数据，并冒用泄露的 session_id 劫持观看者会话，波及管理员账户。\n修复版本中通过在 VideoStatistic::getAllFromVideos_id() 中将查询改为仅选取 user_name、user_login、user_channelName、user_photoURL 等展示列，并在序列化前 unset($row['session_id']) 移除会话标识，使凭据与会话信息不再进入统计响应，同时在三个统计入口补充安全审查注释以保留 hash 免登录访问能力。", "effects": [{"comp_name": "AVideo", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,29.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": fal 2026-09-05T13:11:43+00:00", "_first_saved_at": "2026-09-05T13:11:43+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-zs9u-bpji"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-52766", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:H/A:H", "severity": "critical", "base_score": 9.1}]}, "cvss_score": 9.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:H/A:H", "cwe": "CWE-862", "description": "YesWiki 是一款开源的 PHP wiki 引擎，通过动作（action）插件机制向访客暴露页面编辑与管理能力；在默认 `default_write_acl='*'` 配置下，匿名用户可借助 `{{erasespamedcomments}}` 动作触发对任意 wiki 页面的删除操作，导致包括首页与管理页面在内的页面被永久删除。\n受影响版本中，YesWiki \u003c=4.6.5（artifact yeswiki/yeswiki）`actions/EraseSpamedCommentsAction.php::run()` 在处理 `$_POST['clean']` 与 `$_POST['suppr'][]` 前未做任何身份或权限校验、亦未校验目标 tag 是否为评论页面，其底层调用 `PageManager::deleteOrphaned()` 名义上仅删除孤立页面、实则对 `pages`、`links`、`acls`、`triples`、`referrers`、`tags` 表发起无条件 `DELETE`；由于默认动作 ACL 模型在 `includes/YesWiki.php` 中允许 `*` 通过 `CheckModuleACL`，匿名用户只需先创建一个内容为 `{{erasespamedcomments}}` 的触发页面，再以 `clean=yes\u0026suppr[]=\u003c目标 tag\u003e` 提交 POST 请求，便可从数据库中永久删除 `PagePrincipale` 等任意页面，并写入“Effacement de : …”回显日志。\n修复版本中通过 commit ed5b548a705c8091ba0282aaaba73ddda976abef 在 YesWiki 4.6.6 中对 `EraseSpamedCommentsAction::run()` 设置三道防线：入口处调用 `$wiki-\u003eUserIsAdmin()` 拒绝非管理员；循环体内使用 `$wiki-\u003eLoadPage($page)` 校验 `$pageData['comment_on']` 非空，仅删除真正的评论页面；同时把回显的 `$_POST['suppr']` 值以 `htmlspecialchars()` 转义，缓解响应型 XSS 风险，由此切断匿名用户借助 `suppr[]` 触发任意页面删除的因果链。", "effects": [{"comp_name": "yeswiki/yeswiki", "ecosystem": "composer", "versions": [{"affected_version": "(-∞,4.6.5]", "min_fixed_version": "", "repository": "composer", "solutions": [], "upstream": true}, {"affected_version": "(-∞,4.6.6)", "min_fixed_version": "4.6.6", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-09-05", "level": "Critical", "mps_id": "MPS-rga5-ds1j", "poc": false, "poc_url": [], "published_time": "2026-09-05", "reference_url_list": [{"url": "https://github.com/YesWiki/yeswiki/security/advisories/GHSA-6x7x-gcmf-7r8x", "name": ""}, {"url": "https://github.com/YesWiki/yeswiki/commit/ed5b548a705c8091ba0282aaaba73ddda976abef", "name": ""}, {"url": "https://github.com/advisories/GHSA-6x7x-gcmf-7r8x", "name": ""}], "scope_influence": "", "tags": ["php", "开源"], "title": "YesWiki erasespamedcomments 动作未授权任意页面删除漏洞", "_translated": true, "_saved_at": "2026-09-05T05:10:37+00:00", "_first_saved_at": "2026-09-05T05:10:37+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-rga5-ds1j"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-86218", "cvss": {"cvssv4": [{"source": "a5532a13-c4dd-4202-bef1-e0b8f2f8d12b", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 10}]}, "cvss_score": 10, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-96", "description": "N-central 是 N-able 公司面向托管服务提供商（MSP）的远程监控与管理（RMM）平台，用于集中管理与监控客户网络中的终端设备，为闭源商业软件，提供本地部署与云端托管两种形态。\n受影响版本中，N-central 存在身份认证前的远程代码执行缺陷，官方将其归类为 CWE-96（静态代码注入）；未经身份认证的远程攻击者可向服务器发送恶意请求，相关输入未被正确中和而被作为代码处理，从而在服务器上执行任意代码，整个过程无需任何用户账户与用户交互，可导致服务器被攻击者完全控制。\n修复版本中通过官方补丁消除该缺陷，官方未公开具体修复代码改动，受影响用户应升级至 2026.3.1.14 及以上版本。", "effects": [{"comp_name": "n-central", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2026.3.1.14)", "min_fixed_version": "2026.3.1.14", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "静态代码注入", "kind_en": "静态保存代码中指令的不正确中和（“静态代码注入”）", "last_modified_time": "2026-09-06", "level": "Critical", "mps_id": "MPS-bsim-txon", "poc": false, "poc_url": [], "published_time": "2026-09-06", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-bsim-txon", "name": "https://www.oscs1024.com/hd/MPS-bsim-txon"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-86218", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-86218"}, {"url": "https://me.n-able.com/s/security-advisory/aArVy0000002Ld3KAE/cve202686218-preauthentication-remote-code-execution", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "N-central 认证前远程代码执行漏洞", "_translated": true, "_saved_at": "2026-09-06T05:24:56+00:00", "_first_saved_at": "2026-09-06T05:24:56+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-bsim-txon"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2026-75816", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-287", "description": "Frontend Admin by DynamiApps（插件标识 acf-frontend-form-element）是一款开源 WordPress 前端表单插件，允许站点访客在前台创建与编辑文章、用户、分类等对象，wordpress.org 显示约 9000 个活跃安装。\n受影响版本中，表单提交时携带的 _acf_objects 加密令牌由 Display_Form::get_form_data() 解密后直接写入 post_id 等对象标识且未做数值校验；当令牌携带 user_1 之类的非数值字符串时，ActionPost::conditions_logic() 在 current_user_can('edit_post') 判定前提前返回，show_form 授权关卡失效。未认证攻击者获取插件自身签发的服务端签名令牌后构造提交，把指定字段值经 acf_update_value 与 pre_update_value 写入目标用户记录，覆盖包括管理员在内任意用户的注册邮箱，再借 WordPress 原生找回密码流程完成账户接管。\n修复版本中通过在 ActionPost::conditions_logic() 仅放行 none 与 add_post 两种合法非数值状态、其余非数值 post_id 一律强制复位为 none，使编辑权限判定必然执行；同时对 _acf_objects 与动态加载路径的对象标识增加 is_numeric() 与 absint() 校验并在 ActionTerm::conditions_logic() 应用同等约束，切断未授权提交向任意用户记录写入的路径。", "effects": [{"comp_name": "acf-frontend-form-element", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,3.29.13)", "min_fixed_version": "3.29.13", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "身份验证不当", "kind_en": "认证不当", "last_modified_time": "2026-09-06", "level": "Critical", "mps_id": "MPS-medj-5szy", "poc": false, "poc_url": [], "published_time": "2026-09-06", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-medj-5szy", "name": "https://www.oscs1024.com/hd/MPS-medj-5szy"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-75816", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-75816"}, {"url": "https://plugins.trac.wordpress.org/browser/acf-frontend-form-element/tags/3.29.10/main/frontend/fields/user/class-user-email.php#L127", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/acf-frontend-form-element/tags/3.29.10/main/frontend/forms/actions/post.php#L1001", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/acf-frontend-form-element/tags/3.29.10/main/frontend/forms/actions/post.php#L1224", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/acf-frontend-form-element/tags/3.29.10/main/frontend/forms/classes/display.php#L26", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/acf-frontend-form-element/tags/3.29.10/main/frontend/forms/classes/submit.php#L125", "name": ""}, {"url": "https://plugins.trac.wordpress.org/changeset/3664865/acf-frontend-form-element", "name": ""}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/f1637a3b-7b0f-485d-9d19-4f711f8c671b?source=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Frontend Admin 未授权账户接管漏洞", "_translated": true, "_saved_at": "2026-09-06T05:24:57+00:00", "_first_saved_at": "2026-09-06T05:24:57+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-medj-5szy"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-86149", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:N/AC:L/Au:M/C:C/I:C/A:C", "severity": "high", "base_score": 8.3}], "cvssv31": [{"source": "cna@vuldb.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.1}], "cvssv4": [{"source": "cna@vuldb.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.4}]}, "cvss_score": 9.4, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-78", "description": "Tenda CP3 是滕达科技（Tenda）推出的消费级 Wi-Fi 智能网络摄像头，固件为闭源商业软件，用于家庭与商铺场景的视频监控和远程查看。\n受影响版本中，固件 Net/NetCheckPing.cpp 内的网络检测（Ping）处理逻辑直接使用外部传入的 interface_name 与 host 参数构造并执行系统命令，未做转义或白名单校验，经身份认证的远程攻击者在这两个参数中插入 shell 元字符后可改变实际执行的命令，以设备进程权限执行任意操作系统命令，进而完全控制摄像头。\n修复版本中通过在命令拼接前对 interface_name 与 host 参数执行合法性校验并过滤 shell 元字符，可切断从参数注入到命令执行的利用链；截至 2026-09-05 官方尚未发布修复固件，建议关注厂商更新并在修复发布前采取访问限制等缓解措施。", "effects": [{"comp_name": "tenda:cp3_firmware", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,27.5.57.101]", "min_fixed_version": "", "repository": "unmanaged", "sol ": "critical", "base_score": 9.2}]}, "cvss_score": 9.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-88", "description": "MikroTik RouterOS 是 MikroTik 公司开发的闭源网络操作系统，运行于其路由器、交换机等网络设备，提供路由、防火墙、VPN 以及 SSH、WebFig 等管理通道，在运营商与中小企业网络中部署广泛。\n受影响版本中，SSH 登录路径未过滤以连字符开头的用户名：/nova/bin/login 保留了供内部组件经管道传递受信任登录信息的文件描述符传输逻辑，参数以“-”开头时 login 将剩余部分经 atoi 解析为文件描述符编号，并从该描述符读取受信任的用户名与授权策略掩码字段；攻击者以形如“-2”的用户名发起 SSH 会话触达登录辅助进程后，login 转而从攻击者可控的 PTY 输入读取这两个字段，注入的策略掩码（如 654958，对应完整权限集合 0x9fe6e）经 strtoul 解析后直接成为会话授权策略，受限会话由此获得完整管理员权限。\n修复版本中通过在 libumsg.so 新增 validLoginParamInput 校验函数切断上述链路：SSH 登录路径在派生 login 子进程前校验存储的 SSH 用户名，拒绝空值、前导“-”或空格、尾随空格以及控制字符与 DEL，构造用户名“-2”被 invalid user input 拒绝，受信任字段只能来自内部受控管道，会话授权策略掩码不再可被外部输入变更。", "effects": [{"comp_name": "routeros", "ecosystem": "linux", "versions": [{"affected_version": "[7.0.0,7.23.4)", "min_fixed_version": "7.23.4", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.0.0,6.49.21)", "min_fixed_version": "6.49.21", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[7.24,7.24.2)", "min_fixed_version": "7.24.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "参数注入或修改", "kind_en": "命令中参数分隔符的不正确中和（“参数注入”）", "last_modified_time": "2026-09-06", "level": "Critical", "mps_id": "MPS-ln7d-2twz", "poc": false, "poc_url": [], "published_time": "2026-09-06", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ln7d-2twz", "name": "https://www.oscs1024.com/hd/MPS-ln7d-2twz"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-86060", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-86060"}, {"url": "https://cert.pl/en/posts/2026/09/mikrotik-routeros-cve", "name": 存在于使用序列化 (serialization) 机制存储和传输数据的程序中。\n", "title": "什么是反序列化"}, {"content": "- 注入攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码注入到程序中，从而实现代码执行的目的。\n- 反射攻击：攻击者使用反射机制，在序列化过程中动态生成恶意数据，并将恶意代码注入到程序中，从而实现代码执行的目的。\n- 缓冲区溢出攻击：攻击者通过在序列化过程中向缓冲区输入恶意数据，导致缓冲区溢出，从而破坏程序的内存管理，实现代码执行的目的。\n- 格式字符串攻击：攻击者通过在序列化过程中输入恶意数据，导致程序使用错误的格式字符串，从而实现代码执行的目的。\n- 数据流攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码作为一个数据流传递给程序，从而实现代码执行的目的。\n", "title": "反序列化常见的攻击方式"}, {"content": "- 不信任输入数据：程序应该严格检查输入数据的有效性，并避免使用不受信任的数据。\n- 使用安全的序列化机制：程序应该使用安全的序列化机制，如 JSON 或 XML 序列化，而不是第三方序列化库。\n- 最小特权原则：程序应该限制对受信任数据的处理权限，并避免在运行时修改数据。\n- 代码审查和漏洞扫描：程序应该进行代码审查和漏洞扫描，以发现和修复潜在的安全漏洞。\n", "title": "如何预防反序列化"}], "cnvd_id": "", "cve_id": "CVE-2026-67399", "cvss": {}, "cvss_score": 9.8, "cvss_vector": "", "cwe": "CWE-502", "description": "WHMCS 是商业闭源的主机业务自动化与计费软件，用于订单、账单、客户门户，并对接主机面板、支付网关和域名注册商。\n受影响版本中，系统对伪造载荷缺少充分限制，未认证攻击者可提交伪造载荷，经多阶段请求进入不安全反序列化对象注入路径，在 WHMCS 主机上执行任意代码并完全控制安装及其数据。\n修复版本中通过官方安全更新收紧对伪造载荷的校验与反序列化限制，切断未认证请求进入危险执行路径；公开资料未披露更细粒度的源码修改。", "effects": [{"comp_name": "whmcs", "ecosystem": "linux", "versions": [{"affected_version": "[8.0.0,8.13.7)", "min_fixed_version": "8.13.7", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[9.0.0,9.0.8)", "min_fixed_version": "9.0.8", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "反序列化", "kind_en": "不可信数据的反序列化", "last_modified_time": "2026-09-07", "level": "Critical", "mps_id": "MPS-adb4-c817", "poc": false, "poc_url": [], "published_time": "2026-09-07", "reference_url_list": [{"url": "https://securityonline.info/whmcs-security-update-cve-2026-67399/", "name": ""}, {"url": "https://help.whmcs.com/m/125386/l/2118034-cve-2026-67399-whmcs-security-update-2026-09-03", "name": ""}, {"url": "https://docs.whmcs.com/releases/9-0/9-0-change-log/", "name": ""}, {"url": "https://docs.whmcs.com/releases/8-13/8-13-change-log/", "name": " gs": ["poc"], "title": "CVE-2026-48019漏洞", "_translated": true, "_saved_at": "2026-09-05T00:33:16+00:00", "_first_saved_at": "2026-09-05T00:33:16+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-7qnz-0fxs"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2025-9049", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-862", "description": "WordPress 的 Nokri – 求职板 WordPress 主题容易受到未经授权的数据修改，因为在 1.6.4 及之前的所有版本中缺少对“nokri_account_member_permissions”功能的功能检查。这使得具有订阅者级别及以上访问权限的经过身份验证的攻击者可以添加具有雇主帐户成员权限的新订阅者用户，而这些用户又可以通过更新任何用户（包括管理员用户）的电子邮件地址来升级权限。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-09-05", "level": "High", "mps_id": "MPS-78gn-jl9v", "poc": false, "poc_url": [], "published_time": "2026-09-05", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-78gn-jl9v", "name": "https://www.oscs1024.com/hd/MPS-78gn-jl9v"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2025-9049", "name": "https://nvd.nist.gov/vuln/detail/CVE-2025-9049"}, {"url": "https://themeforest.net/item/nokri-job-board-wordpress-theme/22677241#item-description__nokri-theme-change-logs", "name": ""}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/e079e886-70a5-4188-ad99-96fc37651ed0?source=cve", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2025-9049漏洞", "_translated": true, "_saved_at": "2026-09-05T13:11:48+00:00", "_first_saved_at": "2026-09-05T13:11:48+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-78gn-jl9v"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-52775", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-89", "description": "YesWiki `ReactionManager::deleteUserReaction()` 在 `else` 分支直接将 URL 路径参数 `$idreaction`、`$id` 拼接进 SQL `LIKE` 子句而未转义，使任意已认证用户通过 `DELETE /api/reactions/{idreaction}/{id}/{page}/{username}` 接口即可触发 SQL 注入，进而完整读写 wiki 数据库，包括 `yeswiki_users` 表中的密码哈希与邮箱数据。\n受影响版本中，YesWiki 4.6.6 之前的全部发布版本与 `doryphore-dev` 等开发分支在 `includes/services/ReactionManager.php` 第 356 行 `else` 分支通过 `'value LIKE \\'%user\\\":\\\"' . $user . '\\\",\\\"idReaction\\\":\\\"' . $reactionId . '\\\",\\\"id\\\":\\\"' . $id . '\\\"%\\''` 拼接方式将请求参数传入 `TripleStore::delete()`，而 `includes/controllers/ApiController.php` 第 728 行 `deleteReaction()` 通过 `@Route(..., options={\"acl\":{\"+\"}})` 限定仅需已认证用户即可由 `$idreaction` 与 `$id` 路径参数触发。\n修复版本中通过 commit `90ca54fb518e1c43a1ead6e4f5bf9f0389789841`（随 v4.6.6 发布）将同分支表达式改为 `'value LIKE \\'%user\\\":\\\"' . $this-\u003edbService-\u003eescape($user) . '\\\",\\\"idReaction\\\":\\\"' . $this-\u003edbService-\u003eescape($reactionId) . '\\\",\\\"id\\\":\\\"' . $this-\u003edbService-\u003eescape($id) . '\\\"%\\''`，使三个入参在进入 `TripleStore::delete()` 之前完成 SQL 转义，与 `if` 分支一致地切断用户可控字符串进入 SQL 拼接的路径。", "effects": [{"comp_name": "yeswiki/yeswiki", "ecosystem": "composer", "versions": [{"affected_version": "(-∞,4.6.6)", "min_fixed_version": "4.6.6", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-07-12", "level": "High", "mps_id": "MPS-jywh-5qun", "poc": false, "poc_url": [], "published_time": "2026-09-05", "reference_url_list": [{"url": "https://github.com/YesWiki/yeswiki/security/advisories/GHSA-4pf7-cc4r-g63h", "name": ""}, {"url": "https://github.com/YesWiki/yeswiki/commit/90ca54fb518e1c43a1ead6e4f5bf9f0389789841", "name": ""}, {"url": "https://github.com/advisories/GHSA-4pf7-cc4r-g63h", "name": ""}], "scope_influence": "", "tags": ["php", "开源"], "title": "YesWiki ReactionManager 已认证 SQL 注入漏洞", "_translated": true, "_saved_at": "2026-09-05T05:10:31+00:00", "_first_saved_at": "2026-09-05T05:10:31+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-jywh-5qun"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "cnvd_id": "", "cve_id": "CVE-2026-81543", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-269", "description": "适用于 WordPress 的 Abandoned Cart Pro for WooCommerce 插件在 10.7.1 及之前的所有版本中都容易受到权限升级的影响。这是由于缺少对多个 AJAX 操作（包括 wcap_save_connector_settings、wcap_send_manual_email、wcap_abandoned_cart_info 和 wcap_change_manual_email_data）的功能检查和随机数验证。这使得具有订阅者级别及以上访问权限的经过身份验证的攻击者可以修改 SMTP 连接器设置，以通过攻击者控制的服务器路由管理员恢复电子邮件，并拦截自动登录链接以获得完全管理访问权限。必须启用插件的自动登录功能，这是默认配置。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-09-05", "level": "High", "mps_id": "MPS-m16k-qg85", "poc": false, "poc_url": [], "published_time": "2026-09-05", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-m16k-qg85", "name": "https://www.oscs1024.com/hd/MPS IT 协议）的 RESTful API 插件，以 composer 包 getgrav/grav-plugin-api 发布，为站点提供基于 JWT 认证的用户、配置、媒体与邀请管理等远程管理接口。\n受影响版本中，InvitationsController::create() 在邀请人非超级管理员时调用 stripSuperFlags() 过滤邀请的 access 载荷，该函数仅清除嵌套形式 $access[$scope]['super']，未处理点号键形式（如 \"api.super\" =\u003e true）；权限解析侧 PermissionResolver::buildFlatAccess() 通过 Utils::arrayFlattenDotNotation() 将嵌套形式展平为点号键，两种形式在 resolveExact() 与 isSuperAdmin() 的判定中完全等价，携带 {\"api.super\": true} 的邀请绕过校验并随邀请记录持久化；公开接口 POST /api/v1/auth/invite/{token} 在 accept() 中以 $user-\u003eset('access', $record['access']) 将该载荷原样写入新账号并立即签发 JWT，持有 api.access 与 api.users.write 的非超级用户管理账号无需真实受邀者参与即可创建超级管理员账号。\n修复版本中通过在 stripSuperFlags() 的作用域循环内新增 unset($access[\"{$scope}.super\"])，与嵌套形式一并移除 admin.super 与 api.super 的点号键形式，使其与 UsersController::accessGrantsSuper() 的双形式判定保持一致，携带点号键越权标志的邀请在持久化前被清除，公开接受接口无法再将越权权限写入新账号，并新增回归测试覆盖两种载荷形式。", "effects": [{"comp_name": "getgrav/grav-plugin-api", "ecosystem": "composer", "versions": [{"affected_version": "[1.0.0,1.0.20)", "min_fixed_version": "1.0.20", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-09-05", "level": "High", "mps_id": "MPS-c70b-l2u4", "poc": false, "poc_url": [], "published_time": "2026-09-05", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-c70b-l2u4", "name": "https://www.oscs1024.com/hd/MPS-c70b-l2u4"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-86195", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-86195"}, {"url": "https://github.com/getgrav/grav/security/advisories/GHSA-m363-3hww-gcwc", "name": ""}, {"url": "https://www.vulncheck.com/advisories/grav-plugin-api-1.0.0-through-1.0.19-privilege-escalation-via-dot-keyed-super-flag", "name": ""}], "scope_influence": "", "tags": ["php", "开源"], "title": "Grav API 插件权限提升漏洞", "_translated": true, "_saved_at": "2026-0 洞", "_translated": true, "_saved_at": "2026-09-05T00:33:20+00:00", "_first_saved_at": "2026-09-05T00:33:20+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-g7fk-wh1q"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-86177", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-862", "description": "1.14.1之前的Pterodactyl Panel无法验证计划任务创建中特定于操作的权限，从而允许仅具有schedule.update权限的子用户执行任意控制台命令。攻击者可以创建并立即触发计划任务，这些任务运行游戏服务器控制台命令、控制服务器电源状态或在没有适当授权检查的情况下创建备份。", "effects": [], "epss": -1, "exp": fals :X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-290", "description": "Grav API 插件（getgrav/grav-plugin-api）是 Grav CMS 官方维护的开源 RESTful API 插件，为 Grav 2.0 站点提供令牌认证、用户与页面管理等 HTTP 接口。\n受影响版本中，POST /api/v1/auth/forgot-password 生成密码重置链接时依赖请求 Host 头：ResolvesAdminBaseUrl::resolveAdminBaseUrl() 的兜底返回值与 allowedAdminOrigins() 的白名单种子均取自 Uri::rootUrl(true)，在默认未设置 system.custom_base_url 时该值的主机部分来自 $_SERVER['HTTP_HOST']；未认证攻击者以任意账户邮箱和伪造的 Host 头调用该接口后，受害者邮箱收到的重置链接指向攻击者域名并携带服务端有效的重置令牌，受害者点击后，攻击者从自身访问日志读取令牌并调用 POST /api/v1/auth/reset-password 完成账号接管，超级管理员账号被接管将导致全站失陷。\n修复版本中通过新增 trustedAdminBaseUrl() 将重置、邀请与单点登录链接锚定到运维配置的 system.custom_base_url（未设置时取 plugins.login.site_host），resolveAdminBaseUrl() 与 allowedAdminOrigins() 不再使用请求派生的根 URL，并在 require_trusted_host 开启且无可信主机配置时扣发重置邮件，使重置链接无法再被投毒。", "effects": [{"comp_name": "getgrav/grav-plugin-api", "ecosystem": "composer", "versions": [{"affected_version": "(-∞,1.0.20)", "min_fixed_version": "1.0.20", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "使用欺骗进行的认证绕过", "kind_en": "通过欺骗绕过身份验证", "last_modified_time": "2026-09-05", "level": "High", "mps_id": "MPS-of4g-2nqu", "poc": false, "poc_url": [], "published_time": "2026-09-05", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-of4g-2nqu", "name": "https://www.oscs1024.com/hd/MPS-of4g-2nqu"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-86196", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-86196"}, {"url": "https://github.com/getgrav/grav/security/advisories/GHSA-262p-56vv-7v5r", "name": ""}, {"url": "https://www.vulncheck.com/advisories/grav-api-plugin-before-1.0.20-authentication-bypass-via-host-header", "name": ""}], "scope_influence": "", "tags": ["php", "开源"], "title": "Grav API 插件 Host 头投毒致账号接管", "_translated": true, "_saved_at": "2026-09-05T18:44:27+00:00", "_first_saved_at": "2026-09-05T16:28:08+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-of4g-2nqu"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-86193", "cvss": {"cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-863", "description": "grav-plugin-api 是 Grav CMS 官方维护的开源（MIT 许可）REST API 插件，为 Grav 站点提供 /api/v1 路径下的用户、页面、配置等管理接口，是新版管理后台进行用户管理的通道。\n受影响版本中，classes/Api/Controllers/UsersController.php 的目标超管防护以 accessGrantsSuper($target-\u003eget('access')) 判定目标账号是否为超级管理员，该检查只读取目标账号自身的 access 映射；而 Grav 实际授权层（核心 UserTrait::authorize() 与插件的 PermissionResolver）会合并用户组继承的权限，仅凭所属组持有 admin.super 或 api.super 的账号对这套防护不可见。持有 api.access 与 api.users.write 的非超管用户管理员请求 PATCH /api/v1/users/{username} 时可通过该防护，password 字段不在字段级权限白名单内，提交后直接改写目标账号口令，实现超级管理员账户接管；同一防护链中 api.php 的 authorizeApiKeyTarget() 对从存储加载、未经认证的用户对象调用 authorize('admin.super')，结果恒为 false，API Key 场景的目标防护从未生效。\n修复版本中通过新增 targetIsSuper() 与 accountIsSuper() 判定，在目标账号自身 access 之外遍历其所属用户组并读取 groups.{name}.access 配置，使组继承超管同样被识别为超管目标；update()、delete() 与 requireNotSuperTarget() 统一改用该判定，API Key 目标防护改为直接读取自身与组继承的有效访问映射而非依赖恒为 false 的 authorize()，切断了用户管理员改写组继承超管账号口令的越权路径。", "effects": [{"comp_name": "grav-plugin-api", "ecosystem": "linux", "versions": [{"affected_version": "[0,1.0.20)", "min_fixed_version": "1.0.20", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-09-05", "level": "High", "mps_id": "MPS-rj17-b9uo", "poc": false, "poc_url": [], "published_time": "2026-09-05", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-rj17-b9uo", "name": "https://www.oscs1024.com/hd/MPS-rj17-b9uo"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-86193", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-86193"}, {"url": "https://github.com/getgrav/grav/security/advisories/GHSA-vv8m-jqpm-38x4", "name": ""}, {"url": "https://www.vulncheck.com/advisories/grav-api-plugin-authentication-bypass-via-group-inherited-super", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Grav API 插件越权接管超管账户", "_translated": true, "_saved_at": "2026-09-05T18:44:28+00:00", "_first_saved_at": "2026-09-05T16:28:10+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-rj17-b9uo"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-86185", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:A/AC:L 如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-82684", "cvss": {"cvssv31": [{"source": "ics-cert@hq.dhs.gov", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N", "severity": "high", "base_score": 8.1}], "cvssv4": [{"source": "ics-cert@hq.dhs.gov", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-862", "description": "Tycon Systems TPDIN-Monitor-WEB3 版本 2.2.9 及更早版本容易受到缺少授权漏洞的影响。这可能允许攻击者提取系统凭据、配置或闪存内容。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-09-05", "level": "High", "mps_id": "MPS-iv6y-fa48", "poc": false, "poc_url": [], "published_time": "2026-09-05", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-iv6y-fa48", "name": "https://www.oscs1024.com/hd/MPS-iv6y-fa48"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-82684", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-82684"}, {"url": "https://firm.tyconsystems.com/tpdin-monitor-web3-v2/TPDIN-MONITOR-WEB3-V2_v2.4.2.tfw", "name": ""}, {"url": "https://firm.tyconsystems.com/tpdin-monitor-web3-v2/TPDIN-MONITOR-WEB3-V2_v2.4.2T.hex", "name": ""}, {"url": "https://github.com/cisagov/CSAF/blob/develop/csaf_files/OT/white/2026/icsa-26-246-08.json", "name": ""}, {"url": "https://www.cisa.gov/news-events/ics-advisories/icsa-26-246-08", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-82684漏洞", "_translated": true, "_saved_at": "2026-09-05T00:33:23+00:00", "_first_saved_at": "2026-09-05T00:33:23+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-iv6y-fa48"}, {"analysis_status": 0, "articles": [{"content": "跨站点请求伪造 (CSRF)通过利用网站对用户请求的信任进行攻击。当用户在网站A登录并在同一浏览器会话中访问网站B时，攻击者可以构造特制的请求并诱使用户执行，以使网站B误以为这些请求是用户合法发起的。\n攻击者通常通过欺骗用户点击恶意链接、在受信任的网站中植入恶意代码或通过钓鱼等手段来实施CSRF攻击，一旦用户执行了恶意请求，攻击者可以以用户的身份执行任意操作，包括更改用户密码、发起资金转账或删除重要数据等。", "title": "什么是CSRF"}, {"content": "- 链接欺骗：攻击者通过向用户发送包含恶意链接的电子邮件或社交媒体消息，诱使用户点击并执行恶意请求。\n- 图片引用攻击：攻击者通过在恶意网站上包含指向目标网站的图片引用，以触发用户浏览器自动发送目标网站的请求。\n- XSS利用：如果目标网站存在XSS漏洞，攻击者可以注入恶意脚本，以使用户在浏览器中执行恶意请求。", "title": "CSRF常见的攻击方式"}, {"content": "- 随机令牌：网站可以在每个请求中包含一个随机生成的令牌（CSRF Token），并验证该令牌的有效性，以确认请求的来源是合法的。\n- SameSite Cookie：使用SameSite属性来限制跨站点请求，将Cookie的发送限制在同一站点上，减少了跨站请求伪造的风险。\n- 双重验证：对于敏感操作，网站可以要求用户进行额外的验证，例如输入验证码、提供第二个因素的身份验证等。\n- 强化浏览器策略：网站可以设置Content-Security-Policy（CSP）头，限制浏览器执行恶意脚本的能力，减少CSRF攻击的风险。\n- 限制用户操作：网站可以要求用户在执行敏感操作之前进行明确的确认或授权，防止恶意请求被误触发。\n- 安全编码实践：开发人员应遵循安全编码实践，对用户输入进行适当的验证和过滤，防止恶意请求的注入。", "title": "如何预防CSRF"}], "cnvd_id": "", "cve_id": "CVE-2026-82712", "cvss": {"cvssv31": [{"source": "ics-cert@hq.dhs.gov", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}], "cvssv4": [{"source": "ics-cert@hq.dhs.gov", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:A/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV: ）受此漏洞影响，触发点位于 bazar 组件的 tools/bazar/controllers/ApiController.php 控制器 postFormActorInbox() 与 tools/bazar/services/HttpSignatureService.php 中 HttpSignatureService::verifySignature() 方法，原因是 verifySignature() 通过 parse_ini_string 解析 Signature 头部后，把攻击者可控的 sigConf['keyId'] 直接作为 URL 传入 httpClient-\u003erequest('GET', $sigConf['keyId']) 进行出站请求，既未限制协议（HTTPS-only）、也未校验目标是否落在私网/回环/链路本地地址范围内，且需至少一个 Bazar 表单启用 ActivityPub（bn_activitypub_enable='1'）即可达此流程。\n修复版本中通过在 v4.6.6 中合并的提交 87e627f33e79879827a3669fee2aa1244612c487（commit message：fix(bazar): GHSA-vw42-752g-5mrp）在 HttpSignatureService.php 新增私有方法 validateKeyIdUrl()，强制 keyId URL 必须为 https 协议、把主机解析得到的所有 IPv4（gethostbyname）与 IPv6（dns_get_record DNS_AAAA）地址均使用 FILTER_FLAG_NO_PRIV_RANGE|FILTER_FLAG_NO_RES_RANGE 校验拒绝 127.x、10.x、172.16/12、192.168.x、169.254.x、0.x、240.x、::1、fc00::/7，并单独补检 IPv6 fe80::/10 链路本地地址，随后在 verifySignature() 发起 httpClient-\u003erequest('GET', $keyId) 之前调用该新方法，由此切断任意出站目标到达出站 HTTP 请求的全部路径，公网以外的恶意 keyId 将被拒绝而不再触发服务端请求。", "effects": [{"comp_name": "yeswiki/yeswiki", "ecosystem": "composer", "versions": [{"affected_version": "[4.6.2,4.6.6)", "min_fixed_version": "4.6.6", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SSRF", "kind_en": "服务器端请求伪造 (SSRF)", "last_modified_time": "2026-07-12", "level": "High", "mps_id": "MPS-imdu-vtlo", "poc": false, "poc_url": [], "published_time": "2026-09-05", "reference_url_list": [{"url": "https://github.com/YesWiki/yeswiki/security/advisories/GHSA-vw42-752g-5mrp", "name": ""}, {"url": "http://github.com/YesWiki/yeswiki/commit/87e627f33e79879827a3669fee2aa1244612c487", "name": ""}, {"url": "https://github.com/advisories/GHSA-vw42-752g-5mrp", "name": ""}], "scope_influence": "", "tags": ["php", "开源"], "title": "YesWiki 未经身份验证 SSRF 漏洞", "_translated": true, "_saved_at": "2026-09-05T05:10:36+00:00", "_first_saved_at": "2026-09-05T05:10:36+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-imdu-vtlo"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-52767", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:H/A:L", "severity": "high", "base_score": 8.2}]}, "cvss_score": 8.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:H/A:L", "cwe": "CWE-347", "description": "YesWiki 是开源 PHP Wiki 引擎，其 Bazar 模块通过 ActivityPub 协议处理跨实例联邦内容；入站收件箱控制器调用 HttpSignatureService::verifySignature 校验请求签名时，以 `!openssl_verify(...)` 的布尔取反判定签名成败，但 `openssl_verify` 在内部错误时返回 `-1`（PHP 真值规则下为真），导致校验失败抛错被跳过，攻击者可在未认证情况下向启用 ActivityPub 的 Bazar 表单投递 Create/Update/Delete 活动，触发对 EntryManager::create/update/delete 的未授权调用。\n受影响版本中，`tools/bazar/services/HttpSignatureService.php` 中 `HttpSignatureService::verifySignature(Request $request)` 方法（v4.6.5 = origin/doryphore-dev HEAD）使用 `if (!openssl_verify(join(\"\\n\", $sigParts), base64_decode($sigConf['signature']), $actorPublicKey, strtoupper($sigConf['algorithm'])))` 判定签名；攻击者将 `keyId` 指向自建 actor URL、actor 文档返回 DSA 公钥、签名头中 `algorithm` 设为 `RSA-SHA256`，PHP 8.3 + OpenSSL 3.x 下 `openssl_verify` 因算法与公钥类型不匹配返回 `-1`，`!(-1)` 为 `false`，`throw new Exception('Signature verification failed')` 被跳过，控制器随后进入 `processActivity()` 并依次调用 `EntryManager::create()`、`EntryManager::update()`、`EntryManager::delete()` 对 `yeswiki_pages` 与 `yeswiki_triples` 表进行未授权 CRUD；composer 包 `yeswiki/yeswiki` 受影响版本区间为 `[4.6.2, 4.6.6)`。\n修复版本中通过提交 d1795e0301e1a1078f17b4b98f56fff70de2029e（已合入 v4.6.6）将 `if (!openssl_verify(...))` 改为 `if (openssl_verify(...) !== 1)`，仅在返回码严格等于成功值 `1` 时放行，从而同时拒绝签名无效（`0`）、内部错误（`-1`）与入参错误（`false`），切断攻击者通过伪造 actor 公钥与算法名触发 `-1` 的旁路逻辑。", "effects": [{"comp_name": "yeswiki/yeswiki", "ecosystem": "composer", "versions": [{"affected_version": "[4.6.2,4.6.6)", "min_fixed_version": "4.6.6", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "密码学签名的验证不恰当", "kind_en": "密码签名验证不当", "last_modified_time": "2026-07-12", "level": "High", "mps_id": "MPS-el47-sk58", "poc": false, "poc_url": [], "published_time": "2026-09-05", "reference_url_list": [{"url": "https://github.com/YesWiki/yeswiki/security/advisories/GHSA-mv28-wj57-f57g", "name": ""}, {"url": "https://github.com/YesWiki/yeswiki/commit/d1795e0301e1a1078f17b4b98f56fff70de2029e", "name": ""}, {"url": "https://github.com/advisories/GHSA-mv28-wj57-f57g", "name": ""}], "scope_influence": "", "tags": ["php", "开源"], "title": "YesWiki ActivityPub 签名验证绕过漏洞", "_translated": true, "_saved_at": "2026-09-05T05:10:32+00:00", "_first_saved_at": "2026-09-05T05:10:32+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-el47-sk58"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2026-18221", "cvss": {"cvssv31": [{"source": "psirt@us.ibm.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.1}]}, "cvss_score": 8.1, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-287", "description": "由于对客户端提供的身份验证参数的验证不正确，IBM i 7.6、7.5、7.4 和 7.3 可能允许远程攻击者获得未经授权的访问。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "身份验证不当", "kind_en": "认证不当", "last_modified_time": "2026-09-05", "level": "High", "mps_id": "MPS-yrxi-4ndb", "poc": false, "poc_url": [], "published_time": "2026-09-05", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-yrxi-4ndb", "name": "https://www.oscs1024.com/hd/MPS-yrxi-4ndb"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-18221", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-18221"}, {"url": "https://www.ibm.com/support/pages/node/7286186", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-18221漏洞", "_translated": true, "_saved_at": "2026-09-04T17:59:05+00:00", "_first_saved_at": "2026-09-04T17:59:05+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-yrxi-4ndb"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-52770", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "cwe": "CWE-89", "description": "YesWiki 是一款基于 PHP 编写的开源协作维基系统，其内置 Bazar 模块对外提供的条目列表 API 在处理数值型字段过滤条件时仅对用户输入执行 mysqli_real_escape_string 转义却未加引号或进行数值合法性校验，导致未认证远程攻击者可在 query / queries GET 参数中注入布尔 SQL 子查询，并依据返回条目数差异推断数据库内容。\n受影响版本中，yeswiki/yeswiki 组件在低于 4.6.6 的版本内，SearchManager::buildQueriesConditions() 方法在字段 _type_ 等于 number 时将经 mysqli_real_escape_string 转义但未加引号、未做数值校验的 $vValue 裸值拼接到 'CAST(... AS DOUBLE) ' . $vComparisonOperator . ' ' . $vValue 的 SQL 片段中，攻击者通过 ACL=public 的 /api/forms/{formId}/entries/{output}/{selectedEntries}、/api/entries/{output}/{selectedEntries} 和 /api/entries/bazarlist 路由在 query / queries GET 参数传入例如 100 OR (SELECT COUNT(*) FROM yeswiki_users)\u003e0 的载荷，在 WHERE 子句中嵌入任意只读布尔 SQL 表达式，利用返回条目数差异构成 boolean oracle 来推断 yeswiki_* 表中账号、密码哈希、密码恢复素材及维基元数据等敏感内容。\n修复版本中通过在 tools/bazar/services/SearchManager.php 的 SearchManager::buildQueriesConditions() 方法生成数值 WHERE 子句前对 trim($vValue) 增加 is_numeric 与 is_finite 双重校验，对非法数值用常量 FALSE 替代、对合法数值以 (float) trim($vValue) 强制转换后再拼接到 CAST 表达式右侧，从而切断 WHERE 子句中任意 SQL 表达式的写入路径；该修复在 yeswiki/yeswiki 4.6.6 版本中以 commit f3b0dd093a7ace47dc29a515faeb02635baceae2（commit message：fix(bazar): GHSA-qg78-vmvc-fhjw）落地。", "effects": [{"comp_name": "yeswiki/yeswiki", "ecosystem": "composer", "versions": [{"affected_version": "(-∞,4.6.6)", "min_fixed_version": "4.6.6", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-07-12", "level": "High", "mps_id": "MPS-hyvj-fpto", "poc": false, "poc_url": [], "published_time": "2026-09-05", "reference_url_list": [{"url": "https://github.com/YesWiki/yeswiki/security/advisories/GHSA-qg78-vmvc-fhjw", "name": ""}, {"url": "https://github.com/YesWiki/yeswiki/commit/f3b0dd093a7ace47dc29a515faeb02635baceae2", "name": ""}, {"url": "https://github.com/advisories/GHSA-qg78-vmvc-fhjw", "name": ""}], "scope_influence": "", "tags": ["php", "开源"], "title": "YesWiki 公共 Bazar 列表 API 数值过滤器 SQL 注入漏洞", "_translated": true, "_saved_at": "2026-09-05T05:10:35+00:00", "_first_saved_at": "2026-09-05T05:10:35+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-hyvj-fpto"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-84961", "cvss": {"cvssv31": [{"source": "ce714d77-add3-4f53-aff5-83d477b104bb", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:N", "severity": "high", "base_score": 7.4}]}, "cvss_score": 7.4, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:N", "cwe": "CWE-295", "description": "undici 的 BalancedPool 构造函数通过内部深度克隆传递其整个选项对象，该深度克隆将值序列化并重新解析为 JSON。由于 JSON 无法表示函数，因此任何函数值 TLS 选项（例如调用者提供的 checkServerIdentity 回调或 connect 选项内的自定义连接器）在到达 TLS 层之前都会被悄悄丢弃。因此，当通过 BalancedPool 到达时，应用程序的自定义 checkServerIdentity 的证书被写入拒绝，但仍通过节点的默认主机名和链检查的对等点将被接受。客户端、池和代理调度程序不受影响，因为它们在克隆之前提取 connect 和 tls 选项。这会影响从 7.24.1 到 7.29.1 以及从 8.0.0 到 8.10.2 的 undici 版本，并且仅当应用程序向 BalancedPool 提供函数值连接或 tls 选项时。用户应升级到 undici 7.29.1 或 8.10.2。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "证书验证不恰当", "kind_en": "证书验证不当", "last_modified_time": "2026-09-05", "level": "High", "mps_id": "MPS-68mf-jrhg", "poc": false, "poc_url": [], "published_time": "2026-09-05", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-68mf-jrhg", "name": "https://www.oscs1024.com/hd/MPS-68mf-jrhg"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-84961", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-84961"}, {"url": "https://cna.openjsf.org/security-advisories.html", "name": ""}, {"url": "https://github.com/nodejs/undici/security/advisories/GHSA-w293-vg96-wgc3", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-84961漏洞", "_translated": true, "_saved_at": "2026-09-04T17:59:01+00:00", "_first_saved_at": "2026-09-04T17:59:01+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-68mf-jrhg"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-85152", "cvss": {"cvssv31": [{"source": "ce714d77-add3-4f53-aff5-83d477b104bb", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:N", "severity": "high", "base_score": 7.4}]}, "cvss_score": 7.4, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:N", "cwe": "CWE-346", "description": "当缓存或重复数据删除拦截器直接组合到客户端或池上时，undici 8.10.0 会忽略缓存和请求重复数据删除键中的目标来源。由于内部缓存键回退到空源字符串，因此每当方法、路径和相关标头匹配时，都会返回来自一个上游源的可缓存或正在进行的响应，以针对对不同受信任源的请求，这允许跨源信息泄露和持久缓存中毒。记者演示了一种完整的身份验证绕过方法，其中使用攻击者控制的密钥签名的 JWT 被接受为属于受信任的发行者，并且从未联系过受信任的来源。这是 8.10.0 中引入的回归，影响 8.10.0 到 8.10.2 的 undici 版本。使用代理（在其调度选项中携带源）的应用程序不受影响。用户应升级到undici 8.10.2。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "源验证错误", "kind_en": "来源验证错误", "last_modified_time": "2026-09-05", "level": "High", "mps_id": "MPS-srm3-qwly", "poc": false, "poc_url": [], "published_time": "2026-09-05", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-srm3-qwly", "name": "https://www.oscs1024.com/hd/MPS-srm3-qwly"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-85152", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-85152"}, {"url": "https://cna.openjsf.org/security-advisories.html", "name": ""}, {"url": "https://github.com/nodejs/undici/security/advisories/GHSA-vp8m-p9jh-q5pm", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-85152漏洞", "_translated": true, "_saved_at": "2026-09-04T17:58:59+00:00", "_first_saved_at": "2026-09-04T17:58:59+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-srm3-qwly"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-83625", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "cwe": "CWE-79", "description": "由于输入清理和输出转义不足，适用于 WordPress 的 Supsystic 插件的联系表单在 1.10.2 及之前的所有版本中都容易受到通过 IP 地址标头的存储跨站点脚本攻击。这使得未经身份验证的攻击者可以在页面中注入任意 Web 脚本，每当用户访问注入的页面时就会执行这些脚本。未经身份验证的攻击者可以首先调用“updateNonce”操作（由于该操作不存在于插件的权限列表中，无需身份验证即可访问）来获取有效的随机数，然后在欺骗性 IP 标头（例如 X-Forwarded-For）中提交包含恶意负载的联系表单。", "effects": [], "epss": -1, "exp": false, "exploit_re ostgres-mcp-server/1.1.7/", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-85787漏洞", "_translated": true, "_saved_at": "2026-09-04T22:43:00+00:00", "_first_saved_at": "2026-09-04T22:43:00+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-y2rq-4mj0"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过构造恶意的数据，将过多的数据输入到程序的缓冲区中，使得缓冲区的空间被填满，从而溢出到程序的栈 (stack) 或堆 (heap) 中，导致程序崩溃、拒绝服务、数据泄露等安全问题。\n", "title": "什么是经典缓冲区溢出"}, {"content": "| 类型        | 描述                                                         |\n| ----------- | ------------------------------------------------------------ |\n| 代码注入攻击      | 攻击者通过向程序的缓冲区输入恶意代码，从而控制程序执行流程，实现对程序操作的恶意操作。例如，攻击者可以通过向 Web 应用程序的输入框中输入恶意代码，从而执行任意的代码，破坏系统、窃取数据等。 |\n| 数据覆盖攻击      | 攻击者通过向程序的缓冲区输入过多的数据，从而覆盖程序中的重要数据或代码，实现对程序操作的恶意操作。例如，攻击者可以通过向聊天应用程序的输入框中输入过多的表情符号，从而覆盖程序中的重要数据，例如聊天消息、账号密码等。 |\n| 栈溢出攻击 | 攻击者通过向程序的栈中输入过多的数据，从而溢出到栈外部，实现对程序操作的恶意操作。例如，攻击者可以通过向游戏应用程序的输入框中输入过多的道具名称，从而覆盖程序中的重要数据，例如游戏数据、账号密码等。 |\n| 堆溢出攻击       | 攻击者通过向程序的堆中输入过多的数据，从而溢出到堆外部，实现对程序操作的恶意操作。例如，攻击者可以通过向操作系统工具的输入框中输入过多的命令，从而覆盖程序中的重要数据，例如系统文件、配置文件等。 |", "title": "经典缓冲区溢出常见的攻击方式"}, {"content": "- 输入验证：在程序输入处对输入数据进行严格的验证和过滤，确保输入数据符合预期的格式和类型，避免被攻击者注入恶意命令或数据。可以使用正则表达式、格式字符串等方式进行输入验证。\n- 输出过滤：在程序输出处对输出数据进行严格的过滤和检查，确保输出数据符合预期的格式和类型，避免被攻击者截获和篡改。可以使用安全的输出过滤库等方式进行输出过滤。\n- 使用安全的编程模型：使用安全的编程模型，例如避免使用原生的缓冲区管理函数，使用安全的框架和库来处理输入数据和执行命令，避免缓冲区溢出漏洞。\n- 数据库加密和访问控制：对于敏感数据和命令，使用加密和访问控制措施，确保只有授权用户可以访问和执行命令，避免被攻击者窃取和篡改。\n- 定期更新和升级：定期更新和升级应用程序和库的版本，确保应用程序和库的最新版本包含了最新的安全补丁和修复措施，避免安全漏洞的出现和利用。\n- 安全审计和监控：定期对系统和应用程序进行安全审计和监控，及时发现和阻止潜在的安全漏洞和攻击，确保系统和数据的安全和可靠性。", "title": "如何预防经典缓冲区溢出"}], "cnvd_id": "", "cve_id": "CVE-2026-86165", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:N/AC:L/Au:N/C:C/I:C/A:C", "severity": "high", "base_score": 10}], "cvssv31": [{"source": "cna@vuldb.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}], "cvssv4": [{"source": "cna@vuldb.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/P ": ""}, {"url": "https://vuldb.com/vuln/399304/cti", "name": ""}, {"url": "https://www.tenda.com.cn/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "腾达HG10缓冲区溢出漏洞", "_translated": true, "_saved_at": "2026-09-06T05:24:53+00:00", "_first_saved_at": "2026-09-06T05:24:53+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-h1ta-ro3n"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-18480", "cvss": {}, "cvss_score": 8.8, "cvss_vector": "", "cwe": "CWE-269", "description": "SureCart 是一款面向 WordPress 的开源电商插件，以 GPLv2 或更高协议通过 WordPress.org 插件目录分发，提供购物车、结账、客户与订单管理能力。\n受影响版本中，编辑客户的 REST 路由 /surecart/v1/customers/{id} 经 edit_sc_customer 授权检查确认请求者可更新自己名下的客户记录后，CustomerController::edit 按请求中的客户编号反查关联的 WordPress 账户，并把请求体中的 email、first_name、last_name、phone 通过 wp_update_user 直接写入该账户；客户记录与 WordPress 账户的绑定缺乏唯一性校验，User::setCustomerId 允许绑定其他用户已持有的客户编号，结账列表接口又向任意已登录用户泄露客户编号与邮箱，订阅者级别账户得以把管理员关联账户的邮箱改写为受控值，再通过 WordPress 找回密码流程完成管理员账户接管。\n修复版本中通过重写 CustomerController::edit 切断该链条：先调用 parent::edit 完成平台侧客户更新，再经新增的 syncWPUser 依据平台返回的客户数据同步关联账户，同步前重新执行 edit_sc_customer 授权检查，字段写入统一收敛到 UsersService::applyCustomerToWPUser 且不再写入 email；同版本 User::setCustomerId 拒绝绑定其他用户已持有的客户编号，User::findByCustomerId 对歧义查询结果失败关闭，结账列表不再向缺少 edit_sc_checkouts 权限的用户输出编辑上下文字段。", "effects": [{"comp_name": "surecart", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,4.6.3)", "min_fixed_version": "4.6.3", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-09-06", "level": "High", "mps_id": "MPS-0b91-efoz", "poc": false, "poc_url": [], "published_time": "2026-09-06", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-0b91-efoz", "name": "https://www.oscs1024.com/hd/MPS-0b91-efoz"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-18480", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-18480"}, {"url": "https://wpscan.com/vulnerability/88839ada-9c59-44cb-96e6-3548e5a59b9f/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "SureCart 越权账户接管", "_translated": true, "_saved_at": "2026-09-06T10:05:36+00:00", "_first_saved_at": "2026-09-06T10:05:36+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-0b91-efoz"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-67277", "cvss": {"cvssv4": [{"source": "cvd@cert.pl", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:L/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:L/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-306", "description": "MikroTik RouterOS 是 MikroTik 路由器设备使用的闭源网络操作系统，基于 Linux 内核，提供路由、防火墙、带宽测试（btest）等网络服务，广泛部署于企业、运营商与家庭网络的边界位置。\n受影响版本中，btest 带宽测试服务在对应主会话完成认证之前接受 related 关联连接，未认证客户端可借助该状态启动 IPv4 nce_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-h302-es1i", "name": "https://www.oscs1024.com/hd/MPS-h302-es1i"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-67281", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-67281"}, {"url": "https://cert.pl/en/posts/2026/09/mikrotik-routeros-cve", "name": ""}, {"url": "https://cert.pl/en/posts/2026/09/vulnerabilities-in-mikrotik-routeros-actively-exploited/", "name": ""}, {"url": "https://forum.mikrotik.com/t/6-49-21-long-term-is-released/272802", "name": ""}, {"url": "https://forum.mikrotik.com/t/7-23-4-long-term-is-released/272801", "name": ""}, {"url": "https://forum.mikrotik.com/t/7-24-2-stable-is-released/272800", "name": ""}, {"url": "https://mikrotik.com/supportsec/september-2026-vulnerability/", "name": ""}, {"url": "https://npratley.net/reversing-mikrotiks-silent-patch-the-routeros-7-23-4-fix-they-wouldnt-explain/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "MikroTik RouterOS WebFig 任意文件读取漏洞", "_translated": true, "_saved_at": "2026-09-06T00:29:34+00:00", "_first_saved_at": "2026-09-05T20:53:37+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-h302-es1i"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-86258", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "medium", "base_score": 5.9}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.2}]}, "cvss_score": 8.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-22", "description": "nbviewer 是 Jupyter 项目开源的 Notebook 在线渲染 Web 服务，基于 Tornado 将 Jupyter Notebook 渲染为静态网页，并内置 localfiles 模式用于浏览与渲染本地文件系统中的 notebook。\n受影响版本中，nbviewer/providers/local/handlers.py 的 LocalFileHandler.can_show() 使用 fullpath.startswith(self.localfile_path) 判断目标路径是否位于配置根目录内，比较基准未附加路径分隔符，属于字符串前缀比较而非目录包含判断。攻击者请求 /localfile/../\u003csibling\u003e/file 形式的 URL 后，经 realpath 归一化得到的绝对路径在文本上以配置根为前缀均能通过该校验，get() 随后按该绝对路径读取并渲染文件内容，导致以 --localfiles 启动的实例泄露配置根同前缀兄弟目录（如 /data/notebooks 与 /data/notebooks_backup）中的 notebook 与凭据文件；常规 ../ 回溯仍被拦截，泄露范围限于同前缀兄弟目录。\n修复版本中通过将包含性判定改为目录级前缀匹配，以 self.localfile_path.rstrip(os.sep) + os.sep 为比较基准并检查 (fullpath + os.sep).startswith(prefix)，使比较以路径分隔符为边界，仅放行配置根目录的真实后代路径，切断了同前缀兄弟目录的越权读取链路。", "effects": [{"comp_name": "nbviewer", "ecosystem": "pip", "versions": [{"affected_version": "(-∞,1.0.1]", "min_fixed_version": "", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-09-06", "level": "High", "mps_id": "MPS-dc1e-my78", "poc": false, "poc_url": [], "published_time": "2026-09-06", "reference_url_list": [{"url": "h
