些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "cnvd_id": "", "cve_id": "CVE-2026-96627", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-269", "description": "Arcane 是一个用于管理 Docker 容器、镜像、网络和卷的界面。在2.6.0之前，backend/api/handlers/users.go中的UpdateUser为任何目标设置PasswordHash，而不比较调用者和目标权限。委派用户：更新权限的持有者可以提交全局管理员的密码更改、替换管理员密码并以该帐户身份进行身份验证，从而实现全局管理员帐户的完全接管。此问题已在 2.6.0 版本中修复。", "effects": [{"comp_name": "github.com/getarcaneapp/arcane/backend/v2", "ecosystem": "go", "versions": [{"affected_version": "(-∞,v2.6.0)", "min_fixed_version": "v2.6.0", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-10-17", "level": "High", "mps_id": "MPS-wkdh-3vn7", "poc": false, "poc_url": [], "published_time": "2026-10-17", "reference_url_list": [{"url": "https://github.com/getarcaneapp/arcane/security/advisories/GHSA-pw5q-rjx4-7f7p", "name": ""}, {"url": "https://github.com/getarcaneapp/arcane/pull/3426", "name": ""}, {"url": "https://github.com/ge 回的 JWT 传递到 credential::ops::store_session，而不验证浏览器获取元数据或请求来源。拥有 OpenHuman 帐户的攻击者可以导致运行本地核心的用户访问恶意页面，该页面请求环回端口 7788 上的 /auth/telegram 端点，将用户的活动本地会话切换到攻击者的后端帐户，并向攻击者公开与该会话相关的后续代理操作、内存写入和 Telegram 消息。此问题已在 0.56.0 版本中修复。", "effects": [{"comp_name": "openhuman", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,0.56.0)", "min_fixed_version": "0.56.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "会话固定", "kind_en": "会话固定", "last_modified_time": "2026-10-17", "level": "High", "mps_id": "MPS-0umr-wfj4", "poc": false, "poc_url": [], "published_time": "2026-10-17", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-0umr-wfj4", "name": "https://www.oscs1024.com/hd/MPS-0umr-wfj4"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-49410", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-49410"}, {"url": "https://github.com/tinyhumansai/openhuman/security/advisories/GHSA-c4m9-hw7m-vv3m", "name": "https://github.com/tinyhumansai/openhuman/security/advisories/GHSA-c4m9-hw7m-vv3m"}, {"url": "https://github.com/tinyhumansai/openhuman/pull/2331", "name": "https://github.com/tinyhumansai/openhuman/pull/2331"}, {"url": "https://github.com/tinyhumansai/openhuman/commit/b1bbc53fceed7d1f0cff90cbb0a42f4ab8e153a1", "name": "https://github.com/tinyhumansai/openhuman/commit/b1bbc53fceed7d1f0cff90cbb0a42f4ab8e153a1"}, {"url": "https://github.com/tinyhumansai/openhuman/releases/tag/v0.56.0", "name": "https://github.com/tinyhumansai/openhuman/releases/tag/v0.56.0"}], "scope_influence": "", "tags": ["应用软件"], "title": "OpenHuman /auth/telegram CSRF 允许攻击者控制的会话植入", "_translated": true, "_saved_at": "2026-10-17T00:57:53+00:00", "_first_saved_at": "2026-10-17T00:57:53+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-0umr-wfj4"}, {"analysis_status": 0, "articles": [{"content": "应用程序在处理用户输入时的不完善或缺乏验证机制，所以攻击者能够通过向应用程序发送恶意输入，利用应用程序对输入数据的错误处理方式来注入自己的恶意代码。这些恶意代码会被应用程序误认为是合法的指令或数据，并在执行过程中被执行。", "title": "什么是代码注入"}, {"content": "应用程序使用可执行动态代码的函数来执行用户可控的参数，当应用程序对于用户输入过滤不完全时，攻击者可以注入恶意代码并控制代码执行流程。", "title": "代码注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对所有用户输入进行验证和过滤，确保只接受预期的有效输入。这包括对输入数据进行输入长度验证、类型检查和格式验证等。\r\n- 使用参数化查询或预编译语句：对于数据库查询操作，应该使用参数化查询或预编译语句，确保输入数据不会被误认为是执行代码。\r\n- 最小特权原则：应用程序在执行操作系统命令或动态代码时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。\r\n- 安全编码实践：开发人员应该采用安全编码实践，包括避免使用eval函数、避免拼接用户输入的字符串作为代码执行等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止代码注入攻击。", "title": "如何预防代码注入"}], "cnvd_id": "", "cve_id": "CVE-2026-92798", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N", "severity": "high", "base_score": 8.1}]}, "cvss_score": 8.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N", "cwe": "CWE-94", "description": "WordPress 的用户注册和会员插件在 5.2.8 及以下版本中容易受到任意短代码执行的攻击，这是由于 UR_Smart_Tags::process() 的“referrer_url”分支中的输入清理不足，其中攻击者控制的 HTTP_REFERER 标头仅通过 sanitize_text_field() 传递（不会去除 WordPress 短代码分隔符），然后将其替换为内容限制消息随后通过 apply_shortcodes()/do_shortcode() 执行。这使得未经身份验证的攻击者可以在消息使用受支持的 {{referrer_url}} 智能标记的任何受限页面上执行任意注册的短代码。", "effects": [{"comp_name": "User Registration \u0026 Membership – Free \u0026 Paid Memberships, Subscriptions, Content Restriction, User Profile, Custom User Registration \u0026 Login Builder", "ecosystem": "linux", "versions": [{"affected_version": "(0,5.2.8]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "代码注入", "kind_en": "代码生成控制不当（“代码注入”）", "last_modified_time": "2026-10-17", "level": "High", "mps_id": "MPS-zcqt-d70r", "poc": false, "poc_url": [], "published_time": "2026-10-17", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-zcqt-d70r", "name": "https://www.oscs1024.com/hd/MPS-zcqt-d70r"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-92798", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-92798"}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/ec317df9-c7ef-49a3-9818-903dfe4bdd03?source=cve", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/user-registration/tags/5.2.8/includes/class-ur-smart-tags.php#L475", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/user-registration/tags/5.2.8/includes/class-ur-smart-tags.php#L474", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/user-registration/tags/5.2.8/modules/content-restriction/class-urcr-frontend.php#L1383", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/user-registration/tags/5.2.8/modules/content-restriction/functions-urcr-core.php#L693", "name": ""}, {"url": "https://plugins.trac.wordpress.org/changeset/3741339/user-registration/trunk/includes/class-ur-smart-tags.php", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-92798漏洞", "_translated": true, "_saved_at": "2026-10-17T16:47:36+00:00", "_first_saved_at": "2026-10-17T05:21:41+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-zcqt-d70r"}, {"analysis_status": 0, "articles": [{"content": "- 编写代码时没有正确处理输入数据或没有正确验证用户输入而导致的。", "title": "什么是关键资源权限分配不当"}, {"content": "- 弱密码或未使用的密码：当管理员或系统管理员在创建帐户时，没有使用强密码或未对帐户进行密码更新时，可能会发生这种情况。弱密码可能会被黑客破解或通过其他方式轻松访问系统。\n- 未正确配置权限：在系统中，不同的资源通常需要不同的权限才能访问。如果管理员未正确配置权限，那么未经授权的用户可能会通过欺骗系统或利用其他漏洞来访问关键资源。\n- 权限重用：在某些情况下，管理员可能会将某些权限分配给某个用户，但这些权限并未被正确地限制或授权给该用户。如果其他用户尝试使用这些权限访问关键资源，那么他们可能会获得未经授权的访问权限。\n- 未正确验证用户输入：当开发人员没有正确验证用户输入时，可能会发生这种情况。例如，如果开发人员未正确过滤用户输入的用户名或密码，那么黑客可能会利用这些信息轻松地访问系统。\n", "title": "关键资源权限分配不当常见的攻击方式"}, {"content": "- 使用强密码：管理员应该使用强密码来保护系统，并定期更改密码。强密码应该包括数字、字母和符号，并且应该不同于其他帐户使用的密码。\n- 正确配置权限：管理员应该正确配置系统中不同资源所需的权限。用户可以被授予访问特定资源的权限，但不应该被授予访问其他资源的权限。\n- 权限限制：管理员应该使用权限限制来限制用户对特定资源的访问。例如，用户可以被授予访问特定文件夹的权限，但不能访问其他文件夹。\n- 输入验证：开发人员应该正确验证用户输入。例如，他们可以过滤用户输入的用户名和密码，以确保它们符合预期的格式。\n- 安全培训：管理员和用户应该接受安全培训，以便了解如何识别和避免常见的安全漏洞，例如不正确权限授予漏洞。\n- 定期更新和修补软件：系统软件和应用程序应该定期更新和修补，以确保它们不受最新安全漏洞的影响。", "title": "如何预防关键资源权限分配不当"}], "cnvd_id": "", "cve_id": "CVE-2026-96424", "cvss": {"cvssv31": [{"source": "cve@gitlab.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-732", "description": "lomiri-upload-manager（lomiri-download-manager 的一部分）的 DBus 策略不正确，允许任意用户以 root 身份通过 DBus 读取任意文件", "effects": [{"comp_name": "lomiri-download-manager", "ecosystem": "linux", "versions": [{"affected_version": "(0.1.0,0.3.3)", "min_fixed_version": "0.3.3", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "关键资源权限分配不当", "kind_en": "关键资源的权限分配不正确", "last_modified_time": "2026-10-17", "level": "High", "mps_id": "MPS-upvx-gby7", "poc": false, "poc_url": [], "published_time": "2026-10-17", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-upvx-gby7", "name": "https://www.oscs1024.com/hd/MPS-upvx-gby7"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-96424", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-96424"}, {"url": "https://gitlab.com/ubports/development/core/lomiri-download-manager/-/work_items/18", "name": ""}, {"url": "https://gitlab.com/ubports/development/core/lomiri-download-manager/-/commit/779dfd5bbeb5fe8877627b772e5024e40eda38aa", "name": ""}, {"url": "https://forums.ubports.com/topic/12671/security-advisory-arbitrary-root-command-execution-and-unauthenticated-arbitrary-file-read-as-root-in-lomiri-download-manager", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "lomiri-download-manager 中关键资源的权限分配不正确", "_translated": true, "_saved_at": "2026-10-16T19:12:00+00:00", "_first_saved_at": "2026-10-16T19:12:00+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-upvx-gby7"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-111044", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:L/A:L", "severity": "high", "base_score": 7.6}]}, "cvss_score": 7.6, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:L/A:L", "cwe": "CWE-863", "description": "Sunshine 是 Moonlight 的自托管游戏直播主机。从 2026.329.165800 到 2026.906.222525，Sunshine 接受链接到存储的配对客户端证书的任何客户端证书，但不要求所提供的证书是确切的启用的配对身份。还对证书文本进行了比较，而没有对等效 PEM 编码进行规范化。保留其私钥的先前配对的客户端可以提供从其配对证书派生的备用证书并绕过禁用控制。等效的 PEM 编码也可能导致客户端身份处理不一致。从未配对过的客户端无法使用此问题，并且删除配对的客户端会删除其信任关系。此问题已在版本 2026.906.222525 中修复。", "effects": [{"comp_name": "Sunshine", "ecosystem": "linux", "versions": [{"affected_version": "[2026.329.165800,2026.906.222525)", "min_fixed_version": "2026.906.222525", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-10-17", "level": "High", "mps_id": "MPS-nxqi-p7r9", "poc": false, "poc_url": [], "published_time": "2026-10-17", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-nxqi-p7r9", "name": "https://www.oscs1024.com/hd/MPS-nxqi-p7r9"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-111044", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-111044"}, {"url": "https://github.com/LizardByte/Sunshine/security/advisories/GHSA-6jvv-jqr7-m6m3", "name": "https://github.com/LizardByte/Sunshine/security/advisories/GHSA-6jvv-jqr7-m6m3"}, {"url": "https://github.com/LizardByte/Sunshine/commit/4d768847fcd88cc94ac745c4611715c67d7d67e1", "name": "https://github.com/LizardByte/Sunshine/commit/4d768847fcd88cc94ac745c4611715c67d7d67e1"}, {"url": "https://github.com/LizardByte/Sunshine/releases/tag/v2026.906.222525", "name": "https://github.com/LizardByte/Sunshine/releases/tag/v2026.906.222525"}], "scope_influence": "", "tags": ["应用软件"], "title": "禁用的 Sunshine 客户端可以使用派生的客户端证书绕过吊销", "_translated": true, "_saved_at": "2026-10-17T00:57:56+00:00", "_first_saved_at": "2026-10-17T00:57:56+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-nxqi-p7r9"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用了空指针，并在不进行有效检查的情况下对其进行取消引用操作。当程序试图取消引用空指针时，由于空指针不指向任何有效的内存地址，会导致程序崩溃或产生未定义的行为。这种错误通常发生在开发者未对指针进行正确的初始化或验证时。", "title": "什么是空指针取消引用"}, {"content": "- 拒绝服务：攻击者可以通过构造恶意输入或请求，触发程序中的空指针取消引用错误，导致程序崩溃或无法正常运行。这可能导致拒绝服务攻击，使系统无法提供正常的服务。\r\n- 内存信息泄露：攻击者可以通过利用空指针取消引用错误，访问程序中的敏感内存信息。这可能包括栈上的变量、函数指针或其他敏感数据，从而暴露系统的机密信息。\r\n- 代码执行：在某些情况下，空指针取消引用错误可能导致执行恶意代码或注入恶意代码的机会。攻击者可以通过精心构造的输入，利用空指针取消引用错误来执行任意的代码，进而获取系统控制权或执行未经授权的操作。", "title": "空指针取消引用常见的攻击方式"}, {"content": "- 指针初始化和验证：开发者应该正确地初始化指针，并在使用指针之前进行有效的验证，确保指针不为空。在取消引用指针之前，应始终检查其是否为空。\r\n- 异常处理和错误恢复：程序应该具备健壮的异常处理和错误恢复机制，以便在发生空指针取消引用错误时能够适当地处理异常，而不是导致程序崩溃或暴露敏感信息。\r\n- 防御性编程：采用防御性编程的原则，如避免在未经验证的指针上进行操作，避免使用未初始化的指针等，以防止空指针取消引用错误的发生。\r\n- 静态代码分析和测试：使用静态代码分析工具和测试技术来检测和识别潜在的空指针取消引用错误。这些工具可以帮助发现代码中可能存在的空指针问题，并及时修复。\r\n- 强制性编码标准和最佳实践：制定强制性的编码标准和最佳实践，包括良好的指针使用和管理规范，以帮助开发者编写更可靠、安全的代码。", "title": "如何预防空指针取消引用"}], "cnvd_id": "", "cve_id": "CVE-2026-57486", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-476", "description": "pupnp 是用于开发 UPnP 设备和控制点应用程序的 SDK。在 2.0.2 之前，ixml/src/node.c 中的 ixmlNode_compare 将可为 null 的 nodeValue、namespaceURI、prefix 和 localName 字段直接传递给 strcmp。 ixmlDocument_createAttribute 创建的非命名空间属性可以合法地将这些字段保留为 NULL。当 ixmlElement_removeAttributeNode 通过 find_condition_node 比较具有相同 nodeName 的两个不同属性对象时，指针标识快捷方式不适用，并且比较取消引用 NULL，从而在攻击者控制的 XML 的应用程序处理到达此路径时导致进程崩溃。此问题已在 2.0.2 中修复。", "effects": [{"comp_name": "pupnp", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.0.2)", "min_fixed_version": "2.0.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "空指针取消引用", "kind_en": "空指针取消引用", "last_modified_time": "2026-10-17", "level": "High", "mps_id": "MPS-2iwy-cbgt", "poc": false, "poc_url": [], "published_time": "2026-10-17", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-2iwy-cbgt", "name": "https://www.oscs1024.com/hd/MPS-2iwy-cbgt"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-57486", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-57486"}, {"url": "https://github.com/pupnp/pupnp/security/advisories/GHSA-q54q-vx78-v9rq", "name": "https://github.com/pupnp/pupnp/security/advisories/GHSA-q54q-vx78-v9rq"}, {"url": "https://github.com/pupnp/pupnp/commit/4b2f775e3b98de3cfb096707bcde040c5562d9ec", "name": "https://github.com/pupnp/pupnp/commit/4b2f775e3b98de3cfb096707bcde040c5562d9ec"}, {"url": "https://github.com/pupnp/pupnp/releases/tag/release-2.0.2", "name": "https://github.com/pupnp/pupnp/releases/tag/release-2.0.2"}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "pupnp：ixmlNode_compare 中的 NULL 指针取消引用在非命名空间属性上崩溃", "_translated": true, "_saved_at": "2026-10-16T19:12:16+00:00", "_first_saved_at": "2026-10-16T19:12:16+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-2iwy-cbgt"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-110889", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "cwe": "CWE-209", "description": "Gantry 中生成包含敏感信息的错误消息 Gantry 5 框架中的漏洞 gantry5 允许检索嵌入的敏感数据。此问题影响 Gantry 5 框架：从不适用到 5.6.4。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "通过错误消息导致的信息暴露", "kind_en": "生成包含敏感信息的错误消息", "last_modified_time": "2026-10-17", "level": "High", "mps_id": "MPS-52zf-8elq", "poc": false, "poc_url": [], "published_time": "2026-10-17", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-52zf-8elq", "name": "https://www.oscs1024.com/hd/MPS-52zf-8elq"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-110889", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-110889"}, {"url": "https://patchstack.com/database/wordpress/plugin/gantry5/vulnerability/wordpress-gantry-5-framework-plugin-5-6-4-sensitive-data-exposure-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": [], "title": "WordPress Gantry 5 框架插件 \u003c= 5.6.4 - 敏感数据泄露漏洞", "_translated": true, "_saved_at": "2026-10-17T18:59:12+00:00", "_first_saved_at": "2026-10-17T13:34:55+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-52zf-8elq"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能有效地控制资源的使用，导致攻击者可以利用这个漏洞耗尽应用程序所依赖的资源。这些资源可以是计算资源（CPU、内存）、网络带宽、数据库连接或其他系统资源。攻击者可以通过发送特制的请求、恶意输入或其他方式，使应用程序消耗大量资源，导致拒绝服务或系统崩溃。", "title": "什么是拒绝服务"}, {"content": "- 消耗计算资源：攻击者可以发送计算密集型的请求，例如复杂的计算、无限循环或递归操作，以耗尽应用程序的计算资源，导致应用程序无法响应其他请求。\r\n- 消耗内存资源：攻击者可以发送大量的数据或恶意输入，以导致应用程序消耗过多的内存资源，从而使系统的可用内存耗尽，并导致应用程序崩溃或变得不可用。\r\n- 消耗网络带宽：攻击者可以发送大量的请求或大型数据包，以消耗应用程序所依赖的网络带宽。这会导致其他合法用户无法正常访问应用程序或降低系统的整体网络性能。\r\n- 消耗存储资源：攻击者可以发送大量的请求或上传大文件，以耗尽应用程序的存储资源，导致系统无法处理其他请求或存储新的数据。", "title": "拒绝服务常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对输入数据进行合理的验证和过滤，防止恶意输入导致资源消耗过高。\r\n- 实施资源限制：应用程序应该实施适当的资源限制策略，例如限制计算操作的时间或次数，限制内存使用量，限制并发连接数等，以防止资源被耗尽。\r\n- 异常处理与错误恢复：应用程序应该具备健壮的异常处理和错误恢复机制，以防止因意外错误导致资源泄漏或无法释放的情况。\r\n- 资源监控与警报：应用程序应该实施适当的资源监控和警报机制，及时发现异常的资源消耗情况，并采取相应的措施来应对。\r\n- 压力测试与性能优化：应用程序应该进行压力测试，以评估其在高负载情况下的性能，并进行必要的性能优化，以确保能够有效地处理大量请求而不耗尽资源。", "title": "如何预防拒绝服务"}], "cnvd_id": "", "cve_id": "CVE-2026-68498", "cvss": {"cvssv31": [{"source": "36c7be3b-2937-45df-85ea-ca7133ea542c", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-400", "description": "StreamReadConstraints.maxNameLength（默认 50,000 个字符）旨在限制单个 JSON 对象属性名称在解析时可以消耗的内存量，与限制普通字符串值的更大的 maxStringLength（默认 100,000,000 个字符）无关。对于基于字符输入构建的解析器（Reader、String 或 char[] 源，全部由 ReaderBasedJsonParser 提供），在累积名称时不会应用该绑定。相反，代码路径重新使用字符串值长度检查，默认情况下大约大 2000 倍。\n\n\n\n在字符输入慢速路径中，ReaderBasedJsonParser._parseName2() 将名称累积到 TextBuffer 中，并且当段填满时，调用 TextBuffer.finishCurrentSegment()，该方法仅验证 maxStringLength。一旦整个名称被扫描到其结束引号，就会在 CharsToNameCanonicalizer.findSymbol() 中进行正确的检查 StreamReadConstraints.validateNameLength(int)。到那时，全名（最多 maxStringLength 个字符）已经缓冲在内存中。\n\n\n\n可以通过此路径解析单个足够长的 JSON 对象属性名称的远程攻击者可以在抛出任何 StreamConstraintsException 之前强制分配大约 100,000,000 个字符（大约 200 MB，分段簿记会推高实际峰值使用量），而不是限制 API 承诺的大约 50,000 个字符（大约 100 KB）。在并发请求中重复此操作可能会耗尽堆并使进程崩溃。不需要身份验证或用户交互。由于 StreamReadConstraints.maxDocumentLength 默认情况下处于禁用状态 (-1)，因此没有其他任何东西首先绑定令牌，因此该问题在默认配置下是可利用的。\n\n\n\n字节输入解析器不受影响：UTF8StreamJsonParser、UTF8DataInputJsonParser 和非阻塞（异步）解析器通过 ParserBase._growNameDecodeBuffer() 在名称解码缓冲区每次增长时重新验证 maxNameLength，在仅分配数十 KB 后拒绝过大的名称。当从字符串、Reader 或 char[]（例如已读入字符串的 HTTP 请求正文）而不是从原始 UTF-8 字节解析不受信任的 JSON 时，应用程序就会暴露。\n\n\n\n此问题影响 2.16.0 中的 com.fasterxml.jackson.core:jackson-core 和 3.0.0 中的tools.jackson.core:jackson-core。 2.16.0 之前的版本不受影响，因为 StreamReadConstraints.maxNameLength 是在 jackson-core 2.16.0 中首次引入的。", "effects": [{"comp_name": "jackson-core", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.18.10]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,2.21.6]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,2.16.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,2.19.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,3.0.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,2.22.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,3.1.6]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,3.2.2]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,3.2.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,2.22.2]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "拒绝服务", "kind_en": "不受控制的资源消耗", "last_modified_time": "2026-10-17", "level": "High", "mps_id": "MPS-sqvx-7yd1", "poc": false, "poc_url": [], "published_time": "2026-10-17", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-sqvx-7yd1", "name": "https://www.oscs1024.com/hd/MPS-sqvx-7yd1"} sv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-400", "description": "pupnp 是用于开发 UPnP 设备和控制点应用程序的 SDK。在 22.0.4 之前，upnp/src/genlib/net/uri/uri.c 中的 parse_hostport 同步调用 getaddrinfo，而 parse_uri 正在处理来自 upnp/src/genlib/net/http/httpparser.c 中的入站 HTTP 请求目标的攻击者提供的主机名以及由 create_url_list 处理的 GENA SUBSCRIBE CALLBACK 标头upnp/src/gena/gena_device.c。未经身份验证的远程对等方可以选择缓慢或无响应的主机名，并在解析器超时时阻止有限的小型服务器工作线程，从而允许少量请求耗尽线程池并拒绝 UPnP 服务。此问题已在 22.0.4 中修复。", "effects": [{"comp_name": "pupnp", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,22.0.4)", "min_fixed_version": "22.0.4", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "拒绝服务", "kind_en": "不受控制的资源消耗", "last_modified_time": "2026-10-17", "level": "High", "mps_id": "MPS-wsy3-vx09", "poc": false, "poc_url": [], "published_time": "2026-10-17", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-wsy3-vx09", "name": "https://www.oscs1024.com/hd/MPS-wsy3-vx09"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-77630", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-77630"}, {"url": "https://github.com/pupnp/pupnp/security/advisories/GHSA-46ph-jff5-5h77", "name": "https://github.com/pupnp/pupnp/security/advisories/GHSA-46ph-jff5-5h77"}, {"url": "https://github.com/pupnp/pupnp/commit/5dba8070b4d64d976f8e6fc13f1f301befebe7d2", "name": "https://github.com/pupnp/pupnp/commit/5dba8070b4d64d976f8e6fc13f1f301befebe7d2"}, {"url": "https://github.com/pupnp/pupnp/releases/tag/release-22.0.4", "name": "https://github.com/pupnp/pupnp/releases/tag/release-22.0.4"}, {"url": "https://issues.oss-fuzz.com/issues/531780528", "name": "https://issues.oss-fuzz.com/issues/531780528"}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "pupnp：通过在 parse_uri()/GENA 回调解析中阻止 DNS 解析来拒绝服务", "_translated": true, "_saved_at": "2026-10-16T19:12:08+00:00", "_first_saved_at": "2026-10-16T19:12:08+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-wsy3-vx09"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-100316", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "severity": "high", "base_scor s/2.8.61/includes/class-wpinv-ajax.php#L359", "name": ""}, {"url": "https://github.com/AyeCode/invoicing/archive/refs/heads/master.zip", "name": ""}, {"url": "https://plugins.trac.wordpress.org/changeset/3750463/invoicing/trunk/includes/admin/meta-boxes/class-mb-payment-form.php", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-111110漏洞", "_translated": true, "_saved_at": "2026-10-17T18:59:13+00:00", "_first_saved_at": "2026-10-17T10:00:06+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-t9hz-bo3m"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-92263", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-78", "description": "SparkyFitness 是一款面向家庭的自托管、人工智能驱动的健康和健身追踪器。在 1.6.0 之前，api/admin/backup/restore 端点将上传的文件名插入到 shell 命令中。经过身份验证的全局管理员上传带有精心设计的文件名的恢复存档。管理员可以提供包含 shell 元字符的文件名的恢复存档。成功利用该漏洞可以使用服务器进程权限执行任意操作系统命令。此问题已在 1.6.0 版本中修复。", "effects": [{"comp_name": "SparkyFitness", "ecosystem": " 。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-96660", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "cwe": "CWE-79", "description": "由于输入清理和输出转义不足，WordPress 的用户注册和会员 – 免费和付费会员、订阅、内容限制、用户配置文件、自定义用户注册和登录生成器插件在 5.2.8 及之前的所有版本中很容易受到通过复选框字段值存储的跨站点脚本的攻击。这使得未经身份验证的攻击者可以在页面中注入任意 Web 脚本，每当用户访问注入的页面时就会执行这些脚本。 nopriv AJAX 操作 user_registration_user_form_submit 无需随机数验证即可到达 ur_process_registration()，这意味着任何未经身份验证的请求都可以到达易受攻击的代码路径。", "effects": [{"comp_name": "User Registration \u0026 Membership – Free \u0026 Paid Memberships, Subscriptions, Content Restriction, User Profile, Custom User Registration \u0026 Login Builder", "ecosystem": "linux", "versions": [{"affected_version": "(0,5.2.8]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "u 使用安全的整数操作函数，如`add_with_overflow()`、`sub_with_overflow()`、`mul_with_overflow()`等，这些函数会检查并处理溢出情况，确保计算结果在安全范围内。\r\n- 类型检查和转换：在进行整数运算或操作之前，进行类型检查和转换，确保操作数的类型和范围是合适的。\r\n- 强制性编码标准和最佳实践：制定强制性的编码标准和最佳实践，包括对整数运算和操作的规范和限制，以帮助程序员编写更可靠、安全的代码。\r\n- 静态代码分析和测试：使用静态代码分析工具和测试技术来检测和识别潜在的整数溢出问题。这些工具可以帮助发现代码中可能存在的溢出漏洞，并及时修复。", "title": "如何预防整数溢出或环绕"}], "cnvd_id": "", "cve_id": "CVE-2026-62439", "cvss": {"cvssv31": [{"source": "secalert@redhat.com", "vector": "CVSS:3.1/AV:L/AC:H/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7}]}, "cvss_score": 7, "cvss_vector": "CVSS:3.1/AV:L/AC:H/PR:N/UI:R/S:U/C:H/I:H/A:H", "cwe": "CWE-190", "description": "GIMP 中发现一个缺陷。在计算图像尺寸的内存缓冲区大小时，file-pvr 插件中会发生整数溢出。通过诱骗用户打开或预览特制的 PowerVR (.pvr) 文件，攻击者可以触发基于堆的缓冲区溢出，从而可能导致任意代码执行或通过应用程序崩溃导致拒绝服务 (DoS)。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "整数溢出或环绕", "kind_en": "整数溢出或环绕", "last_modified_time": "2026-10-17", "level": "High", "mps_id": "MPS-vlzf-p27c", "poc": false, "poc_url": [], "published_time": "2026-10-17", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-vlzf-p27c", "name": "https://www.oscs1024.com/hd/MPS-vlzf-p27c"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-62439", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-62439"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-62439", "name": ""}, {"url": "https://bugzilla.redhat.com/show_bug.cgi?id=2554464", "name": "RHBZ#2554464"}, {"url": "https://gitlab.gnome.org/GNOME/gimp/-/issues/16314", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-62439漏洞", "_translated": true, "_saved_at": "2026-10-17T00:57:50+00:00", "_first_saved_at": "2026-10-17T00:57:50+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-vlzf-p27c"}, {"analysis_status": 0, "articles": [{"content": "应用程序在处理用户输入时的不完善或缺乏验证机制，所以攻击者能够通过向应用程序发送恶意输入，利用应用程序对输入数据的错误处理方式来注入自己的恶意代码。这些恶意代码会被应用程序误认为是合法的指令或数据，并在执行过程中被执行。", "title": "什么是代码注入"}, {"content": "应用程序使用可执行动态代码的函数来执行用户可控的参数，当应用程序对于用户输入过滤不完全时，攻击者可以注入恶意代码并控制代码执行流程。", "title": "代码注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对所有用户输入进行验证和过滤，确保只接受预期的有效输入。这包括对输入数据进行输入长度验证、类型检查和格式验证等。\r\n- 使用参数化查询或预编译语句：对于数据库查询操作，应该使用参数化查询或预编译语句，确保输入数据不会被误认为是执行代码。\r\n- 最小特权原则：应用程序在执行操作系统命令或动态代码时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。\r\n- 安全编码实践：开发人员应该采用安全编码实践，包括避免使用eval函数、避免拼接用户输入的字符串作为代码执行等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止代码注入攻击。", "title": "如何预防代码注入"}], "cnvd_id": "", "cve_id": "CVE-2026-83531", "cvss": {}, "cvss_score": 8.8, "cvss_vector": "", "cwe": "CWE-94", "description": "Apache Camel 是开源 Java 集成框架，camel-dynamic-router 模块提供基于谓词的动态路由，dynamic-router-control 端点供路由参与者管理订阅。\n受影响版本中，DynamicRouterControlProducer 处理 subscribe 或 update 请求时，从 DynamicRouterControlMessage 的 predicate 与 expressionLanguage 字段，或从 CamelDynamicRouterPredicate 与 CamelDynamicRouterExpressionLanguage 消息头读取表达式和语言名称，再由 DynamicRouterControlService.obtainPredicateFromExpression 调用 CamelContext.resolveLanguage(expressionLanguage).createPredicate(predExpression) 编译为 Predicate。该路径没有语言白名单，默认也不拒绝来自控制消息的表达式。能够向被路由转发到该端点的传输发送消息的攻击者可指定任意可用表达式语言和表达式；编译后的谓词进入通道规则，并在后续经过对应 dynamic-router 端点的 Exchange 上以 Camel 进程权限执行。simple 语言始终在类路径上，移除其他表达式语言不能消除该问题。4.4.0 之前的控制通道只接受路由作者写在端点 URI 中的表达式。\n修复版本中通过新增默认值为 false 的 allowPredicateFromMessage 切断该链路。predicateValueToUse 在该选项关闭时，若控制消息携带 predicate 或 expressionLanguage 则抛出 IllegalArgumentException，并改用端点 URI 上由路由作者配置的表达式与语言。该选项不映射自消息头，只能由路由作者写在端点 URI 中。", "effects": [{"comp_name": "org.apache.camel:camel-dynamic-router", "ecosystem": "maven", "versions": [{"affected_version": "[4.4.0,4.18.5)", "min_fixed_version": "4.18.5", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[4.19.0,4.22.1)", "min_fixed_version": "4.22.1", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind" vulncheck.com/advisories/fleet-before-4.83.0-denial-of-service-via-unbounded-gzip-decompression", "name": "VulnCheck Advisory: Fleet before 4.83.0 Denial of Service via Unbounded Gzip Decompression"}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "4.83.0 之前的队列通过无限 Gzip 解压缩拒绝服务", "_translated": true, "_saved_at": "2026-10-17T23:42:02+00:00", "_first_saved_at": "2026-10-17T21:20:45+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-x2df-ivuj"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-110895", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:N/A:L", "severity": "high", "base_score": 8.5}]}, "cvss_score": 8.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:N/A:L", "cwe": "CWE-89", "description": "Support Genix（插件标识 support-genix-lite）是 DevItems 发布在 wordpress.org 的开源 WordPress 工单客服插件，采用 GPLv2 及以上协议，提供工单管理、知识库、AI 聊天机器人与客服自动化功能。\n受影响版本中，插件内置查询构建器 core/ApbdWpsQueryBuilder.php 在拼接 SQL 时未转义数据：_escape_str 仅去除不可见字符，_like 将 LIKE 匹配值原样嵌入语句；工单列表 api/v1/ApbdWpsAPI_Ticket.php 的 ticket_list() 使用 sanitize_text_field 处理 priority 筛选值后拼入 IN ('...') 原始条件，notifications() 将 src_by 的 val 原样拼进 like 片段并以原始 WHERE 模式下发，core/ApbdWpsAjaxDataResponse.php 的 setDateRange() 在日期时区转换失败时把含原始输入的错误文本拼入 BETWEEN 子句。持有客服代理或知识库管理角色的登录用户向工单列表与后台列表的 AJAX/REST 入口提交带单引号的筛选或搜索参数，注入内容随 WHERE 子句进入数据库查询，可读取或篡改站点数据库数据。\n修复版本中通过在数据入口与查询构建器两层加固解决该问题：_escape_str 改用 esc_sql 完成真实 SQL 转义并新增 decode_legacy_literal 处理历史斜杠字面量，_like 对匹配值强制转义，limit 将 offset 强制转整型，setDateRange 对转换结果执行日期时间正则校验，notifications 与 ticket_list 对筛选字段名启用白名单、对筛选值做字符集过滤并阻止覆盖工单归属作用域列，从而切断筛选与搜索参数进入 SQL 语句的注入路径。", "effects": [{"comp_name": "support-genix-lite", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.4.55)", "min_fixed_version": "1.4.55", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-10-18", "level": "High", "mps_id": "MPS-9g5v-y8il", "poc": false, "poc_url": [], "published_time": "2026-10-18", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-9g5v-y8il", "name": "https://www.oscs1024.com/hd/MPS-9g5v-y8il"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-110895", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-110895"}, {"url": "https://patchstack.com/database/wordpress/plugin/support-genix-lite/vulnerability/wordpress-support-genix-plugin-1-4-54-sql-injection-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Support Genix SQL注入漏洞", "_translated": true, "_saved_at": "2026-10-18T12:23:23+00:00", "_first_saved_at": "2026-10-18T12:23:23+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-9g5v-y8il"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2026-80312", "cvss": {}, "cvss_score": 8.2, "cvss_vector": "", "cwe": "CWE-287", "description": "Apache Camel 是 Apache 软件基金会维护的开源企业集成框架，camel-oauth（org.apache.camel:camel-oauth）提供可置于路由中的 OAuth 处理器，用于校验持有者令牌或执行授权码流程并保护其后的处理步骤。\n受影响版本中，OAuthBearerTokenProcessor、OAuthCodeFlowProcessor 与 OAuthCodeFlowCallback 的 process(Exchange) 在认证未能完成时仅写入 HTTP 响应后正常返回，没有调用 exchange.setRouteStop(true)。Authorization 头缺失或不能解析为 Bearer 令牌、授权码流程尚未建立会话，以及回调请求缺少 code 时，同一 Exchange 会继续执行后续路由步骤，未认证调用方到达本应受保护的端点。\n修复版本中通过 AbstractOAuthProcessor 的 reject 与 rejectUnauthorized 在拒绝路径写入响应并调用 exchange.setRouteStop(true)，OAuthCodeFlowProcessor 在 sendRedirect 返回 302 后同样停止路由，使认证失败的请求不再进入受保护步骤；缺失或格式不符的持有者凭据改为返回 401 与 WWW-Authenticate: Bearer。", "effects": [{"comp_name": "camel", "ecosystem": "linux", "versions": [{"affected_version": "[4.11.0,4.18.5)", "min_fixed_version": "4.18.5", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[4.19.0,4.22.1)", "min_fixed_version": "4.22.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "org.apache.camel:camel-oauth", "ecosystem": "maven", "versions": [{"affected_version": "[4.19.0,4.22.1)", "min_fixed_version": "4.22.1", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[4.11.0,4.18.5)", "min_fixed_version": "4.18.5", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": AX 端点，攻击者提供的 phone_number 经 phone_number_exist() 解析为目标账号，该查询未限制纯数字格式，命中多条记录时返回第一条用户，空值或重复的 phone_number 元数据可指向非预期账号；Firebase 验证通过后仅以 str_ends_with 做号码后缀比对，自定义网关分支只在 method 为 firebase 时执行绑定校验，其余方式直接按解析出的用户 ID 调用 wp_set_auth_cookie() 写入登录凭据，攻击者用自身手机号完成 OTP 验证后可登录到手机号元数据为空、重复或可后缀匹配的账号，进而接管管理员账号，实现权限提升。\n修复版本中通过在号码解析处强制纯数字校验并要求唯一命中、拒绝空值与重复记录，将 Firebase 号码比对改为对含国家码完整号码的 hash_equals 全等比较，对所有验证方式统一执行绑定检查，把邮箱验证码绑定到待验证邮箱并拒绝已被他人注册的邮箱，为管理员 AJAX 处理函数补充 manage_options 能力检查，切断了以自身验证凭据冒用他人账号身份的路径。", "effects": [{"comp_name": "login-with-phone-number", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.8.78)", "min_fixed_version": "1.8.78", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "特权授予不正确", "kind_en": "权限分配不正确", "last_modified_time": "2026-10-18", "level": "High", "mps_id": "MPS-4ib2-yfvq", "poc": false, "poc_url": [], "published_time": "2026-10-18", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-4ib2-yfvq", "name": "https://www.oscs1024.com/hd/MPS-4ib2-yfvq"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-110373", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-110373"}, {"url": "https://patchstack.com/database/wordpress/plugin/login-with-phone-number/vulnerability/wordpress-login-with-phone-number-plugin-1-8-77-privilege-escalation-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "手机号登录插件权限提升漏洞", "_translated": true, "_saved_at": "2026-10-18T12:23:24+00:00", "_first_saved_at": "2026-10-18T12:23:24+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-4ib2-yfvq"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-108762", "cvss": {}, "cvss_score": 7.5, "cvss_vector": "", "cwe": "CWE-22", "description": "Apache Kylin 是开源的分布式分析型数据仓库，提供大规模数据上的 SQL 与多维 OLAP 查询能力，元数据备份功能用于备份与恢复项目及全局元数据。\n受影响版本中，REST 接口 /api/system/delete_metadata_backup 将请求体中的 path 列表交给 OpsService.deleteMetadataBackup 处理，该方法以原始字符串的 startsWith 前缀比较限定删除范围，未规范化 .. 路径段、未解析符号链接，也未校验 scheme 与 authority，检查通过后直接对目标路径执行递归删除；持有项目管理员权限的用户提交携带 .. 的路径字符串，可使删除目标解析到项目备份根目录之外，进而递归删除 Kylin 工作文件系统上的任意目录，造成数据丢失与服务不可用。\n修复版本中通过 normalizePath 对待删路径与备份根路径统一做 resolvePath、URI 规范化与 makeQualified 处理，并以 isStrictDescendant 按 scheme、authority 和严格子路径关系重新判定删除边界，删除及空父目录清理均被限制在项目备份根内，阻止越界删除。", "effects": [{"comp_name": "kylin", "ecosystem": "linux", "versions": [{"affected_version": "[4.0.0,5.0.5)", "min_fixed_version": "5.0.5", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "org.apache.kylin:kylin", "ecosystem": "maven", "versions": [{"affected_version": "[4.0.0,5.0.5)", "min_fixed_version": "5.0.5", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-10-18", "level": "High", "mps_id": "MPS-8bf1-a4c8", "poc": false, "poc_url": [], "published_time": "2026-10-18", "reference_url_list": [{"url": "https://www.openwall.com/lists/oss-security/2026/10/16/13", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-108762", "name": ""}, {"url": "https://issues.apache.org/jira/browse/KYLIN-6105", "name": ""}, {"url": "https://kylin.apache.org/", "name": ""}, {"url": "https://github.com/apache/kylin/commit/f848745a831de8d67846e35404935714fbde8e95", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "Apache Kylin元数据备份路径限制绕过漏洞", "_translated": true, "_saved_at": "2026-10-18T12:23:18+00:00", "_first_saved_at": "2026-10-18T12:23:18+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-8bf1-a4c8"}, {"analysis_status": 0, "articles": [{"content": "由于应用程序或系统中存在敏感信息未经适当保护而被泄露给攻击者或未经授权的用户，这些敏感信息可能包括用户凭据、个人身份信息、敏感业务数据、系统配置信息等。信息暴露漏洞通常是由于设计、实施或配置错误引起的，例如不正确的访问控制、弱密码策略、缺乏加密、错误的日志处理等。", "title": "什么是未授权敏感信息泄露"}, {"content": "- 直接访问敏感信息：攻击者可以通过直接访问不正确配置或不受保护的资源来获取敏感信息，如通过公开可访问的URL、未经授权的文件目录访问等。\n- 越权访问：攻击者可能利用访问控制错误或不正确的权限配置来获取他们没有权限访问的敏感信息。\n- 错误信息披露：应用程序在错误处理过程中可能泄露敏感信息，例如将错误消息中的敏感数据返回给客户端或显示在日志文件中。\n- 信息泄露通过响应：攻击者可能利用应用程序在响应中不正确地包含敏感信息，如通过网页源代码、响应头部或响应消息体中的敏感数据。", "title": "未授权敏感信息泄露常见的攻击方式"}, {"content": "- 访问控制：确保只有经过授权的用户能够访问敏感信息，使用强大的身份验证和授权机制。\n- 数据加密：对于敏感信息，使用适当的加密算法对数据进行加密，包括数据传输和存储过程中的加密。\n- 错误处理和日志安全：正确处理错误情况，避免在错误消息中暴露敏感信息。同时，确保日志记录功能的安全性，避免将敏感信息记录在日志文件中。\n- 安全配置和最佳实践：遵循安全最佳实践，对应用程序、服务器和系统进行适当的配置，包括访问控制、权限管理、密码策略等。\n- 审计和监控：实施日志审计和监控机制，及时检测和响应任何异常活动或潜在的信息暴露事件。\n- 安全开发实践：在应用程序开发过程中，进行安全代码审查、漏洞扫描和安全测试，以及敏感信息的正确处理和保护。", "title": "如何预防未授权敏感信息泄露"}], "cnvd_id": "", "cve_id": "CVE-2026-85251", "cvss": {}, "cvss_score": 7.5, "cvss_vector": "", "cwe": "CWE-200", "description": "Apache Camel 是 Apache 软件基金会维护的开源集成框架，camel-http（org.apache.camel:camel-http）用于在路由中发起 HTTP 与 HTTPS 请求。\n受影响版本中，端点开启 followRedirects 后，下一跳主机由远端响应的 Location 决定，已配置的凭证仍会被送到该主机。OAuth2ClientConfigurer.configureHttpClient 通过 addRequestInterceptorFirst 注册的拦截器运行在 HttpClient 的 ProtocolExec 内并位于 RedirectExec 之下，每次跨主机重定向都会重新附加 Authorization: Bearer。未设置 authHost 时，HttpCredentialsHelper.getCred 48w", "name": "https://www.oscs1024.com/hd/MPS-esao-c48w"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-110383", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-110383"}, {"url": "https://patchstack.com/database/wordpress/plugin/signature-fluent-contract-forms-add-on/vulnerability/wordpress-electronic-signature-add-on-for-fluent-forms-plugin-2-0-5-insecure-direct-object-references-idor-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Fluent Forms签名插件IDOR漏洞", "_translated": true, "_saved_at": "2026-10-18T12:23:25+00:00", "_first_saved_at": "2026-10-18T12:23:25+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-esao-c48w"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-110897", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:L", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:L", "cwe": "CWE-79", "description": "PowerPack Lite for Beaver Builder（powerpack-addon-for-beaver-builder）是 IdeaBox Creations 开发的 WordPress 开源插件，为 Beaver Builder 页面构建器提供扩展模块、Facebook 集成和后台管理设置。\n受影响版本中，BB_PowerPack_Admin_Settings::save_integration() 将 $_POST['bb_powerpack_fb_app_id'] 仅经 trim 处理后写入 bb_powerpack_fb_app_id 选项，缺少 nonce 校验，服务端只检查 graph.facebook.com 响应码是否为 200；存储值随后在 Integration 设置页被未经 esc_attr 转义地输出到 input 的 value 属性，又被 pp_get_fb_sdk_url() 拼接进 Facebook SDK URL 并由 Facebook 模块的 frontend.js.php 输出到前台页面内联脚本，恶意字符串可在管理员浏览器或站点访客浏览器中执行任意 JavaScript。\n修复版本中通过在 save_integration() 中增加 pp-integration-settings nonce 校验、要求 App ID 为纯数字并经 sanitize_text_field() 清洗后入库，Integration 模板改用 esc_attr() 转义输出，pp_get_fb_sdk_url() 改用 esc_js() 且 pp_get_fb_app_id() 增加 ctype_digit 数字校验，错误提示与扩展设置分别经 wp_kses_post() 和 sanitize_key() 过滤，切断了存储注入与脚本执行的链路。", "effects": [{"comp_name": "powerpack-addon-for-beaver-builder", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.3.2)", "min_fixed_version": "1.3.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-10-18", "level": "High", "mps_id": "MPS-4n52-h8p1", "poc": false, "poc_url": [], "published_time": "2026-10-18", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-4n52-h8p1", "name": "https://www.oscs102 字符串攻击：攻击者通过在序列化过程中输入恶意数据，导致程序使用错误的格式字符串，从而实现代码执行的目的。\n- 数据流攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码作为一个数据流传递给程序，从而实现代码执行的目的。\n", "title": "反序列化常见的攻击方式"}, {"content": "- 不信任输入数据：程序应该严格检查输入数据的有效性，并避免使用不受信任的数据。\n- 使用安全的序列化机制：程序应该使用安全的序列化机制，如 JSON 或 XML 序列化，而不是第三方序列化库。\n- 最小特权原则：程序应该限制对受信任数据的处理权限，并避免在运行时修改数据。\n- 代码审查和漏洞扫描：程序应该进行代码审查和漏洞扫描，以发现和修复潜在的安全漏洞。\n", "title": "如何预防反序列化"}], "cnvd_id": "", "cve_id": "CVE-2026-78165", "cvss": {}, "cvss_score": 8.8, "cvss_vector": "", "cwe": "CWE-502", "description": "Apache Camel 是 Apache 软件基金会维护的开源集成框架。camel-spring-redis（Maven 坐标 org.apache.camel:camel-spring-redis）基于 Spring Data Redis 提供频道订阅与键值读写。\n受影响版本中，未设置 serializer 选项时 RedisConfiguration.getSerializer 惰性调用 createDefaultSerializer，构造不安装 java.io.ObjectInputFilter 的 JdkSerializationRedisSerializer。RedisConsumer.onMessage 在组装 Exchange 之前把订阅消息的原始字节交给 setBody，后者对该字节数组调用 deserialize；Spring DefaultDeserializer 通过 ConfigurableObjectInputStream.readObject 物化任意类图并执行 readObject。能够对已订阅频道执行 PUBLISH 的攻击者由此直接到达反序列化点，厂商将影响评定为远程代码执行。\n修复版本中通过为默认序列化器换上带过滤的反序列化转换器切断该路径。createDefaultSerializer 使用 FilteringDeserializer，在 readObject 之前按 deserializationFilter 选项、JVM 级 jdk.serialFilter 或默认允许名单安装 ObjectInputFilter，拒绝名单之外的类型；同一序列化器同时覆盖消费者、生产者读取命令和 SpringRedisIdempotentRepository。", "effects": [{"comp_name": "org.apache.camel:camel-spring-redis", "ecosystem": "maven", "versions": [{"affected_version": "[4.19.0,4.22.1)", "min_fixed_version": "4.22.1", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[2.11.0,4.18.5)", "min_fixed_version": "4.18.5", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "低", "fix_suggestion": "建议修复", "kind": "反序列化", "kind_en": "不可信数据的反序列化", "last_modified_time": "2026-10-19", "level": "High", "mps_id": "MPS-8777-42ef", "poc": true, "poc_url": [], "published_time": "2026-10-19", "reference_url_list": [{"url": "http://www.mail-archive.com/announce@apache.org/msg12345.html", "name": ""}, {"url": "https://camel.apache.org/security/CVE-2026-78165.html", "name": ""}, {"url": "https://camel.apache.org/security/", "name": ""}, {"url": "https://issues.apache.org/jira/browse/CAMEL-24421", "name": ""}, {"url": "https://github.com/apache/camel/pull/25587", "name": ""}, {"url": "https://github.com/apache/camel/commit/8db602a5ee105403fa40c1b821157c8d9d0c1977", "name": ""}, {"url": "https://github.com/apache/camel/pull/25588", "name": ""}, {"url": "https://github.com/apache/camel/commit/b2ba1ed90562e10e07bfb4a3cab60b817885e6de", "name": ""}, {"url": "https://github.com/apache/camel/pull/25589", "name": ""}, {"url": "https://github.com/apache/camel/commit/e721141ddcaeb9a08892730942b1b362c2da1c5c", "name": ""}, {"url": "https://github.com/apache/camel/pull/25734", "name": ""}, {"url": "https://github.com/apache/camel/commit/ddc7885a7add93326b3d549c565c43bbccad12dc", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-78165", "name": ""}], "scope_influence": "", "tags": ["java", "poc", "开源"], "title": "Camel Redis反序列化漏洞", "_translated": true, "_saved_at": "2026-10-19T00:41:54+00:00", "_first_saved_at": "2026-10-19T00:41:54+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-8777-42ef"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-109553", "cvss": {}, "cvss_score": 7.5, "cvss_vector": "", "cwe": "CWE-287", "description": "Gitea 是一个开源的轻量级自托管 Git 代码托管平台，提供 Web 界面、REST API 与内置 SSH 服务器，用于代码托管、代码评审与团队协作。\n受影响版本中，实例管理员通过 SSH_TRUSTED_USER_CA_KEYS 信任用户 CA 后，HTTP 签名认证（services/auth/httpsign.go 的 VerifyCert）与内置 SSH 服务器（modules/ssh/ssh.go 的 publicKeyHandler）在校验证书时把证书 ValidPrincipals 的每个条目交给 SearchPrincipalKey 按 content 在公钥表中匹配，该查询未限定密钥类型，而用户公钥、部署公钥与 principal 公钥共用同一张表；当 SSH_AUTHORIZED_PRINCIPALS_ALLOW=anything 时，普通用户可把受害者公钥内容注册为自己的 principal（AddPrincipalKey 仅按 content 加 KeyTypePrincipal 去重，不检查与用户密钥冲突），持有列出该 principal 的 CA 签名证书的攻击者通过证书校验与请求签名校验后命中受害者的用户公钥记录，服务端按该记录 OwnerID 调用 GetUserByID，攻击者以受害者身份通过 HTTP 签名 API 与内置 SSH 服务器完成认证并行使受害者权限，审计日志归因于受害者。\n修复版本中通过在 SearchPrincipalKey 的查询条件中追加 type = KeyTypePrincipal，使证书 principal 只匹配 principal 类型密钥，切断证书 principal 与受害者用户公钥的关联，阻止攻击者以他人身份通过 HTTP 签名 API 与内置 SSH 服务器完成认证。", "effects": [{"comp_name": "gitea.dev", "ecosystem": "go", "versions": [{"affected_version": "(-∞,28.2.0)", "min_fixed_version": "28.2.0", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "身份验证不当", "kind_en": "认证不当", "last_modified_time": "2026-10-19", "level": "High", "mps_id": "MPS-hzox-584r", "poc": false, "poc_url": [], "published_time": "2026-10-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-hzox-584r", "name": "https://www.oscs1024.com/hd/MPS-hzox-584r"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-109553", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-109553"}, {"url": "https://github.com/go-gitea/gitea/security/advisories/GHSA-vcp6-2qc6-gvq3", "name": "GitHub Security Advisory GHSA-vcp6-2qc6-gvq3"}, {"url": "https://github.com/go-gitea/gitea/pull/39839", "name": "Fix: go-gitea/gitea pull request #39839"}, {"url": "https://github.com/go-gitea/gitea/pull/39847", "name": "Fix backport to release/v28: go-gitea/gitea pull request #39847"}, {"url": "https://blog.gitea.com/release-of-28.2.0/", "name": "Gitea 28.2.0 release announcement"}, {"url": "https://github.com/go-gitea/gitea/releases/tag/v28.2.0", "name": "go-gitea/gitea v28.2.0 release"}], "scope_influence": "", "tags": ["go"], "title": "Gitea SSH证书认证绕过", "_translated": true, "_saved_at": "2026-10-18T22:09:44+00:00", "_first_saved_at": "2026-10-18T22:09:44+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-hzox-584r"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-79986", "cvss": {}, "cvss_score": 7.4, "cvss_vector": "", "cwe": "CWE-22", "description": "Apache Camel 是开源 Java 集成框架。camel-azure-files 提供 azure-files 端点，供路由轮询 Azure 文件共享，并按端点凭据检索、删除或重命名远程文件。\n受影响版本中，FilesConsumer.handleFile 与 asRemoteFile 使用 FilesPath.concat 把配置的轮询目录和共享目录列表返回的文件名直接拼接成远程路径，GenericFileConsumer.isValidFile 在接受该路径前不做词法规范化，也不检查结果是否仍位于被轮询目录内。列表名若包含父目录片段，默认消费者会按该越界路径检索文件；在配置 delete、move、preMove、moveFailed 或 readLock=rename 时，同一路径还会被用于删除或重命名。该名称来自远程列表而非路由参数。Azure Files REST 通常不返回非单一路径段的列表名，官方因此与其他远程文件消费者一并修复，而不是基于针对本方案已证实的利用样本。\n修复版本中通过在 jailStartingDirectory 为 true（默认值）时，让 GenericFileConsumer.isValidFile 调用 RemoteFileConsumer.isWithinStartingDirectory，使用 GenericFileHelper.isWithinDirectory 按正斜杠压缩路径并在路径段边界上确认其仍位于被轮询目录内；越界文件被跳过且只记录警告，后续远程操作不再使用该路径。", "effects": [{"comp_name": "org.apache.camel:camel-azure-files", "ecosystem": "maven", "versions": [{"affected_version": "[4.0.0,4.18.5)", "min_fixed_version": "4.18.5", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[4.19.0,4.22.1)", "min_fixed_version": "4.22.1", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "低", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-10-19", "level": "High", "mps_id": "MPS-5314-cf2f", "poc": true, "poc_url": [], "published_time": "2026-10-19", "reference_url_list": [{"url": "http://www.mail-archive.com/announce@apache.org/msg12335.html", "name": ""}, {"url": "https://camel.apache.org/security/CVE-2026-79986.html", "name": ""}, {"url": "https://camel.apache.org/security/CVE-2026-79986.txt.asc", "name": ""}, {"url": "https://issues.apache.org/jira/browse/CAMEL-24487", "name": ""}, {"url": "https://github.com/apache/camel/pull/25730", "name": ""}, {"url": "https://github.com/apache/camel/pull/25745", "name": ""}, {"url": "https://github.com/apache/camel/pull/25746", "name": ""}, {"url": "https://github.com/apache/camel/commit/177fb1fdff90632ebfd27772a625b720c1cab3e7", "name": ""}, {"url": "https://github.com/apache/camel/commit/b31b1754d26352ea823354c8660074aaba257c45", "name": ""}, {"url": "https://github.com/apache/camel/commit/c1165e4e663c3c3edc7bd30451ecc213fcf68cfd", "name": ""}, {"url": "https://github.com/apache/camel", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-79986", "name": ""}], "scope_influence": "", "tags": ["java", "poc", "开源"], "title": "Camel Azure Files路径穿越", "_translated": true, "_saved_at": "2026-10-19T00:41:53+00:00", "_first_saved_at": "2026-10-19T00:41:53+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-5314-cf2f"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "attack_vector_type": "Local", "cnvd_id": "", "cve_id": "CVE-2026-98788", "cvss": {}, "cvss_score": 7, "cvss_vector": "", "cwe": "CWE-416", "description": "Linux 内核是开源操作系统内核。其 futex 子系统为用户态同步维护按进程地址空间划分、并可在运行时扩容的私有哈希表，该功能由默认编译选项 CONFIG_FUTEX_PRIVATE_HASH 启用。\n受影响版本中，__futex_pivot_hash() 在调用 rcu_assign_pointer() 发布新的 mmph-\u003ehash 之前，先把 mmph-\u003ebatches 写成 get_state_synchronize_rcu() 的返回值。futex_ref_drop() 通过 poll_state_synchronize_rcu(mm-\u003efutex.phash.batches) 判断哈希发布后是否已经过一个 RCU 宽限期，而包裹这两次写入的 scoped_guard(rcu) 并不能阻止新的宽限期在中间开始。一旦出现该窗口，futex_ref_drop() 会在 futex_hash() 的读者仍持有旧哈希指针时继续执行，旧哈希对象随后由 kvfree_rcu() 释放，形成私有 futex 哈希释放后使用。本地普通用户无需额外配置，可通过 prctl(PR_FUTEX_HASH) 设置槽位数，或通过带 CLONE_VM 的 clone 走默认扩容路径进入该替换逻辑。\n修复版本中通过重排 __futex_pivot_hash() 的发布顺序修复该问题，先用 rcu_assign_pointer() 发布 mmph-\u003ehash，再将 mmph-\u003ebatches 更新为 get_state_synchronize_rcu() 的结果，并移除 scoped_guard(rcu)。batches 因此引用哈希指针发布之后才开始的宽限期，futex_ref_drop() 不再于读者仍持有旧哈希时提前放行。", "eff 少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "attack_vector_type": "Local", "cnvd_id": "", "cve_id": "CVE-2026-98773", "cvss": {}, "cvss_score": 7, "cvss_vector": "", "cwe": "CWE-416", "description": "Linux 内核是开源操作系统内核，cdc-acm 驱动把 USB CDC ACM 设备暴露为 ttyACM 串口。\n受影响版本中，acm_disconnect() 在断开路径上把 acm-\u003edisconnected 置位并调用 acm_poison_urbs()，再经 tty_port_tty_vhangup() 进入 acm_port_shutdown()。后者排空 delayed anchor 后无条件调用 acm_unpoison_urbs()，并在 ALWAYS_POLL_CTRL quirk 生效时重新提交 ctrlurb 与读 URB。并发的 acm_disconnect() 若在这些 URB 仍在传输时释放 URB 及其 DMA 缓冲区，acm_ctrl_irq() 或 acm_read_bulk_callback() 会访问已释放内存，造成释放后使用。该 quirk 仅由 USB ID 17ef:6161 的设备匹配项设置。\n修复版本中通过在 acm_port_shutdown() 排空 delayed anchor 之后检查 acm-\u003edisconnected 并提前返回，使断开路径上的 URB 保持 poisoned 且不再重新提交，避免完成回调访问已被释放的 DMA 内存。", "effects": [{"comp_name": "linux_kernel", "ecosystem": "linux", "versions": [{"affected_version": "[6.12.83,6.12.113)", "min_fixed_version": "6.12.113", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.18.24,6.18.56)", "min_fixed_version": "6.18.56", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[7.0.1,7.1)", "min_fixed_version": "7.1", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[7.1,7.2.10)", "min_fixed_version": "7.2.10", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.1.175,6.2)", "min_fixed_version": "6.2", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.6.136,6.7)", "min_fixed_version": "6.7", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.19.14,6.20)", "min_fixed_version": "6.20", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[7.3-rc1,7.3-rc6)", "min_fixed_version": "7.3-rc6", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "UAF", "kind_en": "免费后使用", "last_modified_time": "2026-10-19", "level": "High", "mps_id": "MPS-2rn5-fbsg", "poc": false, "poc_url": [], "published_time": "2026-10-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-2rn5-fbsg", "name": "https://www.oscs1024.com/hd/MPS-2rn5-fbsg"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-98773", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-98773"}, {"url": "https://git.kernel.org/stable/c/9742905d9ed5bf23ebe4c100dec80b6bc50fb522", "name": ""}, {"url": "https://git.kernel.org/stable/c/a0ed07b5bbb2d8fcef86810453216070691816e7", "name": ""}, {"url": "https://git.kernel.org/stable/c/420ca35af891d33522cc08504768ccd60a4c450a", "name": ""}, {"url": "https://git.kernel.org/stable/c/dc614d6bc991740d41d5a99ac7765c4b675dda88", "name": ""}], "scope_influence": "", "tags": ["操作系统"], "title": "cdc-acm释放后使用漏洞", "_translated": true, "_saved_at": "2026-10-18T19:10:54+00:00", "_first_saved_at": "2026-10-18T19:10:54+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-2rn5-fbsg"}]}</script>
  <script>
    const payload = JSON.parse(document.getElementById("payload").textContent);
    const levelLabels = payload.level_labels || {};
    const items = payload.items || [];
    let filtered = items.slice();
    let activeId = null;

    const $ = (id) => document.getElementById(id);
    $("generatedAt").textContent = payload.generated_at || "-";
    $("retention").textContent = payload.retention_days ?? "-";
    $("cutoff").textContent = payload.cutoff_date || "-";
    $("count").textContent = String(payload.count ?? items.length);

    function levelClass(level) {
      const cn = levelLabels[level] || level || "";
      if (level === "Critical" || cn === "严重") return "crit";
      if (level === "High" || cn === "高危") return "high";
      return "other";
    }
    function levelText(level) {
      return levelLabels[level] || level || "-";
    }
    function esc(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }
    function scoreText(v) {
      if (v === null || v === undefined || v === "" || v === -1) return "-";
      return String(v);
    }

    function renderList() {
      const list = $("list");
      $("listCount").textContent = String(filtered.length);
      if (!filtered.length) {
        list.innerHTML = '<div class="empty">没有匹配项</div>';
        return;
      }
      list.innerHTML = filtered.map((it) => {
        const id = it.mps_id || it.cve_id;
        const active = id === activeId ? " active" : "";
        return `
          <button class="item${active}" data-id="${esc(id)}" type="button">
            <div class="item-top">
              <span class="cve">${esc(it.cve_id || it.mps_id || "-")}</span>
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
            </div>
            <div class="title">${esc(it.title || "-")}</div>
            <div class="item-foot">
              <span>CVSS ${esc(scoreText(it.cvss_score))}</span>
              <span>${esc(it.published_time || "-")}</span>
              ${it.poc ? "<span>POC</span>" : ""}
            </div>
          </button>`;
      }).join("");
      list.querySelectorAll(".item").forEach((btn) => {
        btn.addEventListener("click", () => selectById(btn.dataset.id));
      });
    }

    function refsHtml(it) {
      const refs = Array.isArray(it.reference_url_list) ? it.reference_url_list : [];
      const links = [];
      if (it._source_page) links.push({ url: it._source_page, name: "OSCS 详情" });
      if (it.cve_id) links.push({ url: `https://nvd.nist.gov/vuln/detail/${it.cve_id}`, name: "NVD" });
      refs.forEach((r) => {
        if (r && r.url) links.push({ url: r.url, name: r.name || r.url });
      });
      const seen = new Set();
      const uniq = [];
      for (const l of links) {
        if (seen.has(l.url)) continue;
        seen.add(l.url);
        uniq.push(l);
      }
      if (!uniq.length) return '<div class="box">无参考链接</div>';
      return `<div class="refs">${uniq.map((l) =>
        `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name || l.url)}</a>`
      ).join("")}</div>`;
    }

    function articlesHtml(it) {
      const arts = Array.isArray(it.articles) ? it.articles : [];
      if (!arts.length) return "";
      return `<div class="section"><h3>相关说明</h3>${arts.map((a) => `
        <div class="article">
          <h4>${esc(a.title || "说明")}</h4>
          <p>${esc(a.content || "")}</p>
        </div>`).join("")}</div>`;
    }

    function renderDetail(it) {
      const detail = $("detail");
      if (!it) {
        detail.innerHTML = '<div class="empty">暂无数据</div>';
        return;
      }
      const pocUrls = Array.isArray(it.poc_url) ? it.poc_url : [];
      detail.innerHTML = `
        <div class="d-head">
          <div>
            <h1 class="d-title">${esc(it.title || "-")}</h1>
            <div class="ids">
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
              <span class="chip">${esc(it.cve_id || "无 CVE")}</span>
              <span class="chip">${esc(it.mps_id || "-")}</span>
              ${it.poc ? '<span class="chip">有 POC</span>' : ""}
              ${it.exp ? '<span class="chip">有 EXP</span>' : ""}
            </div>
          </div>
          <div class="actions">
            ${it._source_page ? `<a class="btn" href="${esc(it._source_page)}" target="_blank" rel="noopener">OSCS</a>` : ""}
            ${it.cve_id ? `<a class="btn" href="https://nvd.nist.gov/vuln/detail/${esc(it.cve_id)}" target="_blank" rel="noopener">NVD</a>` : ""}
          </div>
        </div>
        <div class="grid">
          <div class="stat"><div class="k">CVSS</div><div class="v">${esc(scoreText(it.cvss_score))}</div></div>
          <div class="stat"><div class="k">向量</div><div class="v">${esc(it.cvss_vector || "-")}</div></div>
          <div class="stat"><div class="k">CWE</div><div class="v">${esc(it.cwe || "-")}</div></div>
          <div class="stat"><div class="k">类型</div><div class="v">${esc(it.kind || it.kind_en || "-")}</div></div>
          <div class="stat"><div class="k">公开</div><div class="v">${esc(it.published_time || "-")}</div></div>
          <div class="stat"><div class="k">利用成本</div><div class="v">${esc(it.exploit_requirement_cost || "-")}</div></div>
          <div class="stat"><div class="k">可利用性</div><div class="v">${esc(it.exploitability || "-")}</div></div>
          <div class="stat"><div class="k">修复建议</div><div class="v">${esc(it.fix_suggestion || "-")}</div></div>
        </div>
        <div class="section"><h3>描述</h3><div class="box">${esc(it.description || "无描述")}</div></div>
        ${it.scope_influence ? `<div class="section"><h3>影响范围</h3><div class="box">${esc(it.scope_influence)}</div></div>` : ""}
        ${pocUrls.length ? `<div class="section"><h3>POC 链接</h3><div class="refs">${pocUrls.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join("")}</div></div>` : ""}
        <div class="section"><h3>参考链接</h3>${refsHtml(it)}</div>
        ${articlesHtml(it)}
      `;
    }

    function selectById(id) {
      const it = filtered.find((x) => (x.mps_id || x.cve_id) === id) ||
                 items.find((x) => (x.mps_id || x.cve_id) === id);
      if (!it) return;
      activeId = it.mps_id || it.cve_id;
      renderList();
      renderDetail(it);
      const btn = document.querySelector(`.item[data-id="${CSS.escape(activeId)}"]`);
      if (btn) btn.scrollIntoView({ block: "nearest" });
      history.replaceState(null, "", "#" + encodeURIComponent(activeId));
    }

    function applyFilter(q) {
      const query = (q || "").trim().toLowerCase();
      filtered = !query ? items.slice() : items.filter((it) => {
        const blob = [
          it.cve_id, it.mps_id, it.title, it.kind, it.kind_en, it.cwe, it.description, it.level
        ].map((x) => String(x || "").toLowerCase()).join(" ");
        return blob.includes(query);
      });
      renderList();
      if (filtered.length) {
        const still = filtered.some((x) => (x.mps_id || x.cve_id) === activeId);
        selectById(still ? activeId : (filtered[0].mps_id || filtered[0].cve_id));
      } else {
        activeId = null;
        renderDetail(null);
      }
    }

    $("search").addEventListener("input", (e) => applyFilter(e.target.value));

    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement !== $("search")) {
        e.preventDefault();
        $("search").focus();
        return;
      }
      if (!filtered.length) return;
      const idx = filtered.findIndex((x) => (x.mps_id || x.cve_id) === activeId);
      if (e.key === "ArrowDown") {
        e.preventDefault();
        const next = filtered[Math.min(filtered.length - 1, Math.max(0, idx) + 1)];
        selectById(next.mps_id || next.cve_id);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        const prev = filtered[Math.max(0, idx - 1)];
        selectById(prev.mps_id || prev.cve_id);
      }
    });

    const hashId = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    if (hashId && items.some((x) => (x.mps_id || x.cve_id) === hashId)) {
      activeId = hashId;
      renderList();
      selectById(hashId);
    } else if (items.length) {
      selectById(items[0].mps_id || items[0].cve_id);
    } else {
      renderList();
      renderDetail(null);
    }
  </script>
</body>
</html>
