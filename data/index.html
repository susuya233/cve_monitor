者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-82653", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:R/S:C/C:H/I:H/A:L", "severity": "high", "base_score": 8.9}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:P/VC:H/VI:H/VA:L/SC:H/SI:H/SA:L/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:P/VC:H/VI:H/VA:L/SC:H/SI:H/SA:L/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-79", "description": "思源笔记（SiYuan）是开源知识管理软件，基于 Electron 与 TypeScript 构建，支持通过内置集市安装插件、主题、图标、模板与挂件等扩展包。\n受影响版本中，app/src/dialog/confirmDialog.ts 的 confirmDialog() 将 text 参数直接拼入 content 模板并交由 Dialog 构造函数通过 innerHTML 渲染，而 app/src/config/bazaar.ts 的 bindEvent() 卸载确认与 _installLocalPackage() 本地包覆盖确认未对集市包名 installedItem.name、data.packageName 转义，app/src/util/mount.ts 的 openEncryptedNotebook() 未对加密笔记本名称转义，攻击者在集市包 name 字段插入 HTML/脚本载荷后，用户卸载该包、覆盖导入同名本地包或解锁加密笔记本时载荷即在客户端渲染进程中执行。\n修复版本中通过在上述调用点统一调用 escapeHtml() 对包名与笔记本名进行 HTML 转义后再拼入模板，使载荷以纯文本形式显示，切断了攻击者输入进入 innerHTML 的路径。", "effects": [{"comp_name": "siyuan", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,3.8.1)", "min_fixed_version": "3.8.1", "repository": 为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-82654", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:R/S:C/C:H/I:H/A:L", "severity": "high", "base_score": 8.9}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:P/VC:H/VI:H/VA:L/SC:H/SI:H/SA:L/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:P/VC:H/VI:H/VA:L/SC:H/SI:H/SA:L/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-79", "description": "SiYuan（思源笔记）是一款开源的块式笔记与知识管理软件，通过块引用、反向链接面板与面包屑在文档之间建立关联，提供桌面端与移动端客户端。\n受影响版本中，块的名称、别名与备注字段在多处前端渲染路径中未做 HTML 转义：app/src/protyle/hint/extend.ts 的 genHintItemHTML 将 item.name、item.alias、item.memo 直接拼入提示列表模板，app/src/protyle/wysiwyg/renderBacklink.ts 与 app/src/protyle/breadcrumb/index.ts 又将 item.name 以未转义形式写入 title 属性和元素内容，攻击者把块名称、别名或备注设置为含 HTML/脚本代码的字符串后，其他用户查看引用、反链或面包屑涉及该块的文档时，脚本会在其客户端执行；此前的转义已被一次无关改动移除，形成回归，反链面板与面包屑两处则从未覆盖。\n修复版本中通过在 app/src/util/escape.ts 新增 escapeSearchHighlight()，在保留内核插入的搜索高亮标签的同时转义其余 \u003c 字符，genHintItemHTML 与 hintRef 恢复对名称、别名、备注的转义，renderBacklink.ts 与 breadcrumb/index.ts 改用 escapeAttr(escapeHtml(decodeHTML(item.name))) 处理 title 属性并以 escapeSearchHighlight 输出显示内容，切断了块属性进入 HTML 上下文的注入路径。", "effects": [{"comp_name": "siyuan", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,3.8.1)", "min_fixed_version": "3.8.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-08-30", "level": "Critical", "mps_id": "MPS-vjq4-0hzd", "poc": false, "poc_url": [], "published_time": "2026-08-30", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-vjq4-0hzd", "name": "https://www.oscs1024.com/hd/MPS-vjq4-0hzd"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-82654", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-82654"}, {"url": "https://github.com/siyuan-note/siyuan/security/advisories/GHSA-hf87-qh3j-3p88", "name": ""}, {"url": "https://www.vulncheck.com/advisories/siyuan-before-3.8.1-stored-xss-via-block-name", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "思源笔记块名存储型XSS漏洞", "_translated": true, "_saved_at": "2026-08-30T17:06:59+00:00", "_first_saved_at": "2026-08-30T17:06:59+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-vjq4-0hzd"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "cnvd_id": "", "cve_id": "CVE-2026-82628", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:L/AC:L/Au:S/C:C/I:C/A:C", "severity": "medium", "base_score": 6.8}], "cvssv31": [{"source": "cna@vuldb.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}], "cvssv4": [{"source": "cna@vuldb.com", "vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-269", "description": "Colorful iGameCenter 是七彩虹出品的闭源硬件管控软件，用于显卡灯效同步、超频调节和硬件状态监控。\n受影响版本中，随软件分发的内核驱动 WinRing0x64.sys 在 IOCTL Dispatch 组件的 sub_11504 函数处理 PhysicalAddress、AlignNumer、AlignSize 参数时存在权限管理缺陷。本地低权限用户可向该接口提交可控参数，使权限被错误授予或提升，造成机密性、完整性与可用性的高影响，并跨越用户态到内核的作用域边界。\n修复版本中通过公开渠道尚未提供可验证的安全更新，未能消除 IOCTL Dispatch 对上述物理地址参数的权限管理缺陷；在厂商发布修复前，应卸载 iGameCenter 或禁用 WinRing0x64.sys。", "effects": [{"comp_name": "igamecenter", "ecosystem": "linux", "versions": [{"affected_version": "[2.0.0.81,2.0.0.81]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-08-31", "level": "Critical", "mps_id": "MPS-5y3c-q1ei", "poc": false, "poc_url": [], "published_time": "2026-08-31", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-5y3c-q1ei", "name": "https://www.oscs1024.com/hd/MPS-5y3c-q1ei"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-82628", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-82628"}, {"url": "https://vuldb.com/cve/CVE-2026-82628", "name": ""}, {"url": "https://vuldb.com/submit/893754", "name": ""}, {"url": "https://vuldb.com/vuln/397126", "name": ""}, {"url": "https://vuldb.com/vuln/397126/cti", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "iGameCenter权限管理漏洞", "_translated": true, "_saved_at": "2026-08-31T09:24:38+00:00", "_first_saved_at": "2026-08-31T09:24:38+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-5y3c-q1ei"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，从而导致未授权的用户或资源可以被访问或篡改。", "title": "什么是访问控制不当"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n", "title": "访问控制不当常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防访问控制不当"}], "cnvd_id": "", "cve_id": "CVE-2026-84200", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:A/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:A/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.4}]}, "cvss_score": 9.4, "cvss_vector": "CVSS:4.0/AV:A/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-284", "description": "Kyverno 版本 v1.9.0 至 v1.12.7 包含策略异常处理缺陷。当强制模式下的策略与两个 PolicyException 组合时，限制较少的异常优先，允许攻击者通过制作与第二个异常的名称模式匹配的资源名称（例如“*ingress*”）来绕过策略。这可用于规避策略，例如一个阻止主机路径卷。在 v1.13.0 中修复。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "访问控制不当", "kind_en": "访问控制不当", "last_modified_time": "2026-09-01", "level": "Critical", "mps_id": "MPS-ys96-1lqd", "poc": false, "poc_url": [], "published_time": "2026-09-01", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ys96-1lqd", "name": "https://www.oscs1024.com/hd/MPS-ys96-1lqd"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-84200", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-84200"}, {"url": "https://github.com/kyverno/kyverno/security/advisories/GHSA-gg4x-fgg2-h9w9", "name": ""}, {"url": "https://www.vulncheck.com/advisories/kyverno-before-1.13.0-policy-bypass-via-multiple-exceptions", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-84200漏洞", "_translated": true, "_saved_at": "2026-09-01T12:57:44+00:00", "_first_saved_at": "2026-09-01T12:57:44+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ys96-1lqd"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-76133", "cvss": {"cvssv31": [{"source": "ics-cert@hq.dhs.gov", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}], "cvssv4": [{"source": "ics-cert@hq.dhs.gov", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-327", "description": "成都亿佰特（Ebyte）NA111-M 是商业闭源串口以太网服务器固件，用于将串口数据转换为以太网数据，并提供网页配置、AT 指令和上位机配置能力。\n受影响版本中，认证相关操作使用了已弃用的哈希算法。攻击者在可操纵或预测认证交换的条件下，可削弱认证机制提供的保证并获得未授权访问。\n修复版本中通过更换认证路径中的弃用哈希算法来恢复认证保证；但截至 CISA 公告发布时，厂商虽曾表示正在开发补丁，尚未公布可用修复版本，当前需采取网络隔离等缓解措施。", "effects": [{"comp_name": "NA111-M", "ecosystem": "linux", "versions": [{"affected_version": "[9013-2-17,9013-2-17]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "密码算法不安全", "kind_en": "使用损坏或有风险的加密算法", "last_modified_time": "2026-09-01", "level": "Critical", "mps_id": "MPS-96l3-2pye", "poc": false, "poc_url": [], "published_time": "2026-09-01", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-96l3-2pye", "name": "https://www.oscs1024.com/hd/MPS-96l3-2pye"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-76133", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-76133"}, {"url": "https://github.com/cisagov/CSAF/blob/develop/csaf_files/OT/white/2026/icsa-26-237-06.json", "name": ""}, {"url": "https://www.cisa.gov/news-events/ics-advisories/icsa-26-237-06", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "NA111-M弱哈希认证漏洞", "_translated": true, "_saved_at": "2026-08-31T17:20:52+00:00", "_first_saved_at": "2026-08-31T17:20:52+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-96l3-2pye"}, {"analysis_status": 0, "articles": [{"content": "- 命令注入是一种攻击，其目标是通过易受攻击的应用程序在主机操作系统上执行任意命令。 当应用程序将不安全的用户提供的数据（表单、cookie、HTTP 标头等）传递到系统 shell 时，就会产生缺陷。攻击者通过构造恶意的命令或数据，将其注入到程序执行的上下文中，从而绕过程序的输入验证和安全措施，实现对程序操作的恶意操作。", "title": "什么是命令注入"}, {"content": "- 文件上传：攻击者通过构造恶意的文件上传请求，将包含恶意命令的文件上传到服务器，从而利用命令注入漏洞执行恶意命令。\n- SQL 注入：攻击者通过构造恶意的 SQL 查询语句，将包含恶意命令的 SQL 语句注入到数据库中，从而执行恶意命令，窃取数据或者破坏系统。\n- 命令执行：攻击者通过在 Web 应用程序的表单提交数据中注入恶意命令，从而执行恶意命令，例如删除文件、格式化硬盘等。\n- 命令注入漏洞的旁路攻击：攻击者可以利用命令注入漏洞旁路控制程序的执行流程，从而窃取数据、破坏系统、控制程序等。\n", "title": "命令注入常见的攻击方式"}, {"content": "- 输入验证：在程序输入处对输入数据进行严格的验证和过滤，确保输入数据符合预期的格式和类型，避免被攻击者注入恶意命令。\n- 输出过滤：在程序输出处对输出数据进行严格的过滤和检查，确保输出数据符合预期的格式和类型，避免被攻击者截获和篡改。\n- 使用安全的编程模型：使用安全的编程模型，例如避免使用原生的命令执行方式，使用安全的框架和库来处理输入数据和执行命令，避免命令注入漏洞。\n- 数据库加密和访问控制：对于敏感数据和命令，使用加密和访问控制措施，确保只有授权用户可以访问和执行命令，避免被攻击者窃取和篡改。\n- 定期更新和升级：定期更新和升级应用程序和库的版本，确保应用程序和库的最新版本包含了最新的安全补丁和修复措施，避免安全漏洞的出现和利用。\n- 安全审计和监控：定期对系统和应用程序进行安全审计和监控，及时发现和阻止潜在的安全漏洞和攻击，确保系统和数据的安全和可靠性。", "title": "如何预防命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-82971", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:N/AC:L/Au:N/C:C/I:C/A:C", "severity": "high", "base_score": 10}], "cvssv31": [{"source": "cna@vuldb.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 10}], "cvssv4": [{"source": "cna@vuldb.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-77", "description": "QVidium Opera11 是商业视频编解码与 IP 传输设备固件，用于在 IP 网络上编码、解码和传输广播级视频，不属于开源项目。厂商官网已公告停业，不再销售产品或提供支持。\n受影响版本中，CGI 脚本 /cgi-bin/net_tr.cgi 在处理 ipaddr 参数时存在命令注入。远程攻击者可操纵该参数，使输入进入系统命令执行路径并在设备上执行任意命令。官方记录同时标明利用代码已公开披露。\n修复版本中通过收紧 /cgi-bin/net_tr.cgi 对 ipaddr 参数的处理来切断命令注入路径的补丁尚未发布，厂商已停业且明确不再提供支持，公开资料未给出可升级的修复版本。", "effects": [{"comp_name": "opera11_firmware", "ecosystem": "linux", "versions": [{"affected_version": "[3.3.2a26-Ax4x-opera11,+∞)", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "命令注入", "kind_en": "命令中使用的特殊元素的不正确中和（“命令注入”）", "last_modified_time": "2026-09-01", "level": "Critical", "mps_id": "MPS-yl4a-ku1m", "poc": false, "poc_url": [], "published_time": "2026-09-01", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-yl4a-ku1m", "name": "https://www.oscs1024.com/hd/MPS-yl4a-ku1m"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-82971", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-82971"}, {"url": "https://uvxbywu62qm.feishu.cn/wiki/Tn2ewwaafigfabkMWJJcc3rhnud?from=from_copylink", "name": ""}, {"url": "https://vuldb.com/cve/CVE-2026-82971", "name": ""}, {"url": "https://vuldb.com/submit/880050", "name": ""}, {"url": "https://vuldb.com/vuln/397334", "name": ""}, {"url": "https://vuldb.com/vuln/397334/cti", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "QVidium Opera11命令注入漏洞", "_translated": true, "_saved_at": "2026-09-01T01:32:27+00:00", "_first_saved_at": "2026-09-01T01:32:27+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-yl4a-ku1m"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-84189", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:R/S:C/C:H/I:H/A:N", "severity": "high", "base_score": 8.1}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:P/VC:H/VI:H/VA:N/SC:H/SI:H/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.2}]}, "cvss_score": 9.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:P/VC:H/VI:H/VA:N/SC:H/SI:H/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-79", "description": "LibreNMS 到 26.4.0 将由管理员可配置的氧化集成 URL (oxydized.url) 返回的 JSON 字段（名称、ip、模型、作者、提交消息）渲染到设备 showconfig 页面中，而无需应用 htmlspecialchars()。将氧化 URL 指向攻击者控制的服务器 (SSRF) 的管理员可能会导致其返回恶意 JSON，从而导致存储/持久的跨站点脚本影响查看任何设备的 showconfig 选项卡的所有用户。已在 26.7.0 中修复。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-09-01", "level": "Critical", "mps_id": "MPS-gi9n-pxav", "poc": false, "poc_url": [], "published_time": "2026-09-01", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-gi9n-pxav", "name": "https://www.oscs1024.com/hd/MPS-gi9n-pxav"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-84189", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-84189"}, {"url": "https://github.com/librenms/librenms/security/advisories/GHSA-7gww-x7fh-jf9j", "name": ""}, {"url": "https://www.vulncheck.com/advisories/librenms-before-26.7.0-stored-xss-via-oxidized-api", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-84189漏洞", "_translated": true, "_saved_at": "2026-09-01T12:57:55+00:00", "_first_saved_at": "2026-09-01T12:57:55+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-gi9n-pxav"}, {"analysis_status": 0, "articles": [{"content": "- 命令注入是一种攻击，其目标是通过易受攻击的应用程序在主机操作系统上执行任意命令。 当应用程序将不安全的用户提供的数据（表单、cookie、HTTP 标头等）传递到系统 shell 时，就会产生缺陷。攻击者通过构造恶意的命令或数据，将其注入到程序执行的上下文中，从而绕过程序的输入验证和安全措施，实现对程序操作的恶意操作。", "title": "什么是命令注入"}, {"content": "- 文件上传：攻击者通过构造恶意的文件上传请求，将包含恶意命令的文件上传到服务器，从而利用命令注入漏洞执行恶意命令。\n- SQL 注入：攻击者通过构造恶意的 SQL 查询语句，将包含恶意命令的 SQL 语句注入到数据库中，从而执行恶意命令，窃取数据或者破坏系统。\n- 命令执行：攻击者通过在 Web 应用程序的表单提交数据中注入恶意命令，从而执行恶意命令，例如删除文件、格式化硬盘等。\n- 命令注入漏洞的旁路攻击：攻击者可以利用命令注入漏洞旁路控制程序的执行流程，从而窃取数据、破坏系统、控制程序等。\n", "title": "命令注入常见的攻击方式"}, {"content": "- 输入验证：在程序输入处对输入数据进行严格的验证和过滤，确保输入数据符合预期的格式和类型，避免被攻击者注入恶意命令。\n- 输出过滤：在程序输出处对输出数据进行严格的过滤和检查，确保输出数据符合预期的格式和类型，避免被攻击者截获和篡改。\n- 使用安全的编程模型：使用安全的编程模型，例如避免使用原生的命令执行方式，使用安全的框架和库来处理输入数据和执行命令，避免命令注入漏洞。\n- 数据库加密和访问控制：对于敏感数据和命令，使用加密和访问控制措施，确保只有授权用户可以访问和执行命令，避免被攻击者窃取和篡改。\n- 定期更新和升级：定期更新和升级应用程序和库的版本，确保应用程序和库的最新版本包含了最新的安全补丁和修复措施，避免安全漏洞的出现和利用。\n- 安全审计和监控：定期对系统和应用程序进行安全审计和监控，及时发现和阻止潜在的安全漏洞和攻击，确保系统和数据的安全和可靠性。", "title": "如何预防命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-83772", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:N/AC:L/Au:S/C:C/I:C/A:C", "severity": "high", "base_score": 9}], "cvssv31": [{"source": "cna@vuldb.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.9}], "cvssv4": [{"source": "cna@vuldb.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC VE-2026-82473", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-82473"}, {"url": "https://github.com/geo-chen/oss/blob/main/kubeedge.md", "name": ""}, {"url": "https://github.com/kubeedge/kubeedge", "name": ""}, {"url": "https://github.com/kubeedge/kubeedge/blob/v1.23.1/cloud/pkg/cloudhub/servers/httpserver/nodetask/report_status.go", "name": ""}, {"url": "https://github.com/kubeedge/kubeedge/blob/v1.23.1/cloud/pkg/cloudhub/servers/httpserver/server.go", "name": ""}, {"url": "https://www.vulncheck.com/advisories/kubeedge-cloudcore-through-1.23.1-missing-authentication-on-node-task-endpoints", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "KubeEdge CloudCore认证缺失漏洞", "_translated": true, "_saved_at": "2026-08-30T00:56:33+00:00", "_first_saved_at": "2026-08-29T19:04:16+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-wkyl-r5m6"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-82655", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "high", "base_score": 7.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-89", "description": "Admidio 是 PHP 语言开发的开源会员管理系统，面向组织与团体提供用户、角色与权限管理能力，可通过 Composer 以 admidio/admidio 包安装部署。\n受影响版本中，模块页面 modules/groups-roles/lists_show.php 加载 system/common.php 后未校验登录状态，其读取 GET 参数 relation_type_list 并未经格式校验即拆分为数组传入 ListConfiguration，getSQL 方法在该文件第 989 行至第 996 行将数组元素以单引号包裹拼接进 urt_uuid IN (...) 子句并以空参数数组执行查询，攻击者可利用反斜杠转义闭合单引号注入任意 SQL，并借助子查询报错与正常响应的差异形成布尔盲注；配合 role_list 传入格式合法但不存在的 UUID 时角色权限检查不会执行，未认证攻击者可读取包括用户密码哈希在内的全部数据库内容。\n修复版本中通过在 lists_show.php 中对 relation_type_list 的每个元素执行 Uuid::isValid 校验、遇到非法 UUID 直接抛出异常终止请求，并将 role_list 对非法值的静默剔除改为抛出异常，非 UUID 字符无法进入 SQL 拼接点，注入路径被切断，修复版本 5.0.12 已发布。", "effects": [{"comp_name": "admidio/admidio", "ecosystem": "composer", "versions": [{"affected_version": "(-∞,5.0.12)", "min_fixed_version": "5.0.12", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-08-30", "level": "High", "mps_id": "MPS-omxe-ba5y", "poc": false, "poc_url": [], "published_time": "2026-08-30", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-omxe-ba5y", "name": "https://www.oscs1024.com/hd/MPS-omxe-ba5y"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-82655", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-82655"}, {"url": "https://github.com/Admidio/admidio/security/advisories/GHSA-p5cp-mhvx-w392", "name": ""}, {"url": "https://www.vulncheck.com/advisories/admidio-before-5.0.12-sql-injection-via-relation-type-list", "name": ""}], "scope_influence": "", "tags": ["php", "开源"], "title": "Admidio SQL注入漏洞", "_translated": true, "_saved_at": "2026-08-30T17:07:02+00:00", "_first_saved_at": "2026-08-30T17:07:02+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-omxe-ba5y"}, {"analysis_status": 0, "articles": [{"content": "由于应用程序或系统中存在敏感信息未经适当保护而被泄露给攻击者或未经授权的用户，这些敏感信息可能包括用户凭据、个人身份信息、敏感业务数据、系统配置信息等。信息暴露漏洞通常是由于设计、实施或配置错误引起的，例如不正确的访问控制、弱密码策略、缺乏加密、错误的日志处理等。", "title": "什么是未授权敏感信息泄露"}, {"content": "- 直接访问敏感信息：攻击者可以通过直接访问不正确配置或不受保护的资源来获取敏感信息，如通过公开可访问的URL、未经授权的文件目录访问等。\n- 越权访问：攻击者可能利用访问控制错误或不正确的权限配置来获取他们没有权限访问的敏感信息。\n- 错误信息披露：应用程序在错误处理过程中可能泄露敏感信息，例如将错误消息中的敏感数据返回给客户端或显示在日志文件中。\n- 信息泄露通过响应：攻击者可能利用应用程序在响应中不正确地包含敏感信息，如通过网页源代码、响应头部或响应消息体中的敏感数据。", "title": "未授权敏感信息泄露常见的攻击方式"}, {"content": "- 访问控制：确保只有经过授权的用户能够访问敏感信息，使用强大的身份验证和授权机制。\n- 数据加密：对于敏感信息，使用适当的加密算法对数据进行加密，包括数据传输和存储过程中的加密。\n- 错误处理和日志安全：正确处理错误情况，避免在错误消息中暴露敏感信息。同时，确保日志记录功能的安全性，避免将敏感信息记录在日志文件中。\n- 安全配置和最佳实践：遵循安全最佳实践，对应用程序、服务器和系统进行适当的配置，包括访问控制、权限管理、密码策略等。\n- 审计和监控：实施日志审计和监控机制，及时检测和响应任何异常活动或潜在的信息暴露事件。\n- 安全开发实践：在应用程序开发过程中，进行安全代码审查、漏洞扫描和安全测试，以及敏感信息的正确处理和保护。", "title": "如何预防未授权敏感信息泄露"}], "cnvd_id": "", "cve_id": "CVE-2026-82657", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "high", "base_score": 7.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-200", "description": "Admidio 是一个开源（GPL-2.0）的 PHP 会员与组织管理网站系统，提供论坛、公告、活动、相册等模块，并通过 RSS 输出各模块最新内容。\n受影响版本中，交互入口 modules/forum.php 与 modules/announcements.php 会对登录专用模式（forum_module_enabled、announcements_module_enabled 为 2）执行 $gValidLogin 校验，而公开入口 rss/forum.php 与 rss/announcements.php 仅在模式为 0 时抛出 SYS_MODULE_DISABLED，缺少同样的登录专用边界；匿名攻击者发送 GET 请求，ForumService::rssFeed 与 AnnouncementsService::rssFeed 检查 enable_rss 后调用 findAll(0, 50)，把最多 50 条登录用户才可见的论坛主题或公告写入 RSS，泄露标题、完整正文、作者姓名、分类与时间戳；未设置查看角色限制的分类（新建分类的默认状态）不会被访客角色的分类可见性过滤拦截。\n修复版本中通过在 rss/forum.php 与 rss/announcements.php 增加模式为 2 且未登录时抛出 SYS_NO_RIGHTS 的分支，并把 rss/events.php、rss/links.php、rss/photos.php 的模式判断统一为相同边界，使 RSS 入口与交互模块页面执行一致的登录专用限制，匿名请求被拒绝，登录用户才能查看的内容不再经 RSS 外泄。", "effects": [{"comp_name": "admidio/admidio", "ecosystem": "composer", "versions": [{"affected_version": "[0,5.0.12)", "min_fixed_version": "5.0.12", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "未授权敏感信息泄露", "kind_en": "向未经授权的行为者泄露敏感信息", "last_modified_time": "2026-08-30", "level": "High", "mps_id": "MPS-pjes-72nf", "poc": false, "poc_url": [], "published_time": "2026-08-30", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-pjes-72nf", "name": "https://www.oscs1024.com/hd/MPS-pjes-72nf"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-82657", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-82657"}, {"url": "https://github.com/Admidio/admidio/security/advisories/GHSA-mg9h-42f8-2pmm", "name": ""}, {"url": "https://www.vulncheck.com/advisories/admidio-before-5.0.12-authentication-bypass-via-rss-feeds", "name": ""}], "scope_influence": "", "tags": ["php", "开源"], "title": "Admidio RSS 越权信息泄露", "_translated": true, "_saved_at": "2026-08-30T17:07:03+00:00", "_first_saved_at": "2026-08-30T17:07:03+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-pjes-72nf"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-82472", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N 进行加密而无需签名。\n\n此问题影响 oidcc：从 3.2.0-beta.1 到 3.9.0。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "密码学签名的验证不恰当", "kind_en": "密码签名验证不当", "last_modified_time": "2026-08-30", "level": "High", "mps_id": "MPS-q7zt-2jya", "poc": false, "poc_url": [], "published_time": "2026-08-30", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-q7zt-2jya", "name": "https://www.oscs1024.com/hd/MPS-q7zt-2jya"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-75759", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-75759"}, {"url": "https://cna.erlef.org/cves/CVE-2026-75759.html", "name": ""}, {"url": "https://github.com/erlef/oidcc/commit/5f62fbccdae8526ff62653b8901657a6c1400fd9", "name": ""}, {"url": "https://github.com/erlef/oidcc/security/advisories/GHSA-533g-4vf3-xwrj", "name": ""}, {"url": "https://osv.dev/vulnerability/EEF-CVE-2026-75759", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-75759漏洞", "_translated": true, "_saved_at": "2026-08-30T06:13:33+00:00", "_first_saved_at": "2026-08-30T06:13:33+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-q7zt-2jya"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2026-75807", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:R/S:U/C:H/I:H/A:H", "cwe": "CWE-287", "description": "SAML Single Sign On – SSO Login 是 miniOrange 发布在 WordPress.org 官方插件目录的开源插件（GPL/Expat 许可），用于在 WordPress 站点与 Okta、Entra ID、Google Workspace 等 SAML 2.0 身份提供商之间建立单点登录。\n受影响版本中，注册在 WordPress init 钩子上的 mo_saml_handle_login_validate() 会把任意访问者提交的 $_POST['SAMLResponse'] 交给 class-mo-saml-login-validate.php 中的 mo_saml_login_validate() 处理，该 ACS 处理器在产生签名校验结论之前（5.4.6 第 236 行）执行 update_option(MO_SAML_REQUIRED_CERTIFICATE, $saml_required_certificate)，把报文中携带的 X.509 证书持久化到 mo_saml_required_certificate 选项，而签名验证所依赖的 mo_saml_find_certificate()（class-mo-saml-utilities.php 第 739 行）在证书指纹不匹配时仅返回 false、不终止请求，未认证攻击者可借此把该选项替换为自有证书；当管理员在测试配置中收到 test_config_error_wpsamlerr004 证书不匹配提示并点击修复按钮后，第 292 行的 mo_saml_fix_certificate 分支会把该选项内容写入受信任的 X509_CERTIFICATE 配置，攻击者随后可用自有私钥为包括管理员在内的任意 WordPress 账户伪造 SAML 断言并获得完整特权会话。\n修复版本中通过删除签名校验结论产生前的证书持久化操作并整体移除 mo_saml_fix_certificate 一键修复分支，收到的证书仅在测试配置错误页经由 mo_saml_display_test_config_error_page()/mo_saml_render_certificate_mismatch_details() 转义展示供管理员人工核对、不再写入数据库，切断了攻击者证书被提升为受信任 IdP 签名证书的利用链。", "effects": [{"comp_name": "miniorange-saml-20-single-sign-on", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,5.4.7)", "min_fixed_version": "5.4.7", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "身份验证不当", "kind_en": "认证不当", "last_modified_time": "2026-08-30", "level": "High", "mps_id": "MPS-6ers-2zqf", "poc": false, "poc_url": [], "published_time": "2026-08-30", "ref lectron-builder 最早的 .onInit 钩子，在许可证页显示前执行，且可执行文件搜索路径包含安装程序启动目录。攻击者在该目录放置同名 TASKKILL.exe 后，用户启动安装程序即会执行该文件；选择为所有用户安装时，安装程序提升权限并再次进入 .onInit，从而以提升令牌完成本地提权。\n修复版本中通过将 TASKKILL、cmd 与 powershell 改为调用 $SYSDIR 下的绝对路径，并在 preInit 开头执行 SetOutPath \"$TEMP\"，使系统可执行文件不再从启动目录解析，阻断伪造二进制随安装程序提升执行。", "effects": [{"comp_name": "siyuan", "ecosystem": "linux", "versions": [{"affected_version": "[2.0.14,3.8.1)", "min_fixed_version": "3.8.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "对搜索路径元素未加控制", "kind_en": "Uncontrolled Search Path Element", "last_modified_time": "2026-08-30", "level": "High", "mps_id": "MPS-iqmc-ab1e", "poc": false, "poc_url": [], "published_time": "2026-08-30", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-iqmc-ab1e", "name": "https://www.oscs1024.com/hd/MPS-iqmc-ab1e"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-82649", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-82649"}, {"url": "https://github.com/siyuan-note/siyuan/commit/251596fc0de2f9528c00c224252fd073a99973f4", "name": ""}, {"url": "https://github.com/siyuan-note/siyuan/security/advisories/GHSA-9j65-967f-5rv3", "name": ""}, {"url": "https://www.vulncheck.com/advisories/siyuan-before-3.8.1-local-privilege-escalation-via-uncontrolled-search-path", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "思源笔记安装程序路径劫持", "_translated": true, "_saved_at": "2026-08-30T17:07:04+00:00", "_first_saved_at": "2026-08-30T17:07:04+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-iqmc-ab1e"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-56718", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "high", "base_score": 7.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-22", "description": "AJCloud AJY IPC 是南京安居云信息技术有限公司提供的闭源网络摄像机固件，设备通过内置 jdbhttpd Web 服务对外提供 HTTP 访问能力。\n受影响版本中，jdbhttpd Web 服务未正确限制 HTTP 请求 URI 中的路径穿越序列，未认证攻击者可向设备 80 端口发送包含穿越路径的请求，以 root 权限读取任意文件，包括明文 RTSP 凭据、Wi-Fi SSID 与预共享密钥、设备序列号以及云绑定参数。\n修复版本中通过官方固件更新收紧 jdbhttpd 对请求 URI 的路径处理，阻止路径穿越序列访问受限目录之外的文件，消除未认证任意文件读取风险。", "effects": [{"comp_name": "ajy_ipc_firmware", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,01.10715.11.37)", "min_fixed_version": "01.10715.11.37", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-08-31" s.MultiTenancy.rename_tenant/3 使用不会抛出异常的 Ecto.Adapters.SQL.query/2 执行 ALTER SCHEMA ... RENAME TO ...，丢弃其 {:ok, _} | {:error, _} 返回值并无条件返回 :ok。当新租户名与已有租户 schema 冲突、权限不足或锁超时时，PostgreSQL 会拒绝重命名，但失败不会传回调用方。manage_tenant 更新动作会把失败当成成功并提交租户行的新名称，使该租户记录指向另一已有租户的 schema，后续读写会落到其他租户数据上。\n修复版本中通过将 Ecto.Adapters.SQL.query/2 替换为失败时抛出异常的 Ecto.Adapters.SQL.query!/3，使外层事务回滚，切断把失败的 schema 重命名提交为成功的路径。", "effects": [{"comp_name": "ash_postgres", "ecosystem": "linux", "versions": [{"affected_version": "[0.25.0,2.13.0)", "min_fixed_version": "2.13.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "未加检查的返回值", "kind_en": "Unchecked Return Value", "last_modified_time": "2026-08-31", "level": "High", "mps_id": "MPS-i5sl-nwr1", "poc": false, "poc_url": [], "published_time": "2026-08-31", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-i5sl-nwr1", "name": "https://www.oscs1024.com/hd/MPS-i5sl-nwr1"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-78699", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-78699"}, {"url": "https://cna.erlef.org/cves/CVE-2026-78699.html", "name": ""}, {"url": "https://github.com/ash-project/ash_postgres/commit/8544ab15fe45784553c2d2da8ee1a388eee0174b", "name": ""}, {"url": "https://github.com/ash-project/ash_postgres/security/advisories/GHSA-6fqq-j9c4-5766", "name": ""}, {"url": "https://osv.dev/vulnerability/EEF-CVE-2026-78699", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "AshPostgres跨租户访问漏洞", "_translated": true, "_saved_at": "2026-08-30T17:06:58+00:00", "_first_saved_at": "2026-08-30T17:06:58+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-i5sl-nwr1"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-75760", "cvss": {"cvssv4": [{"source": "6b3ad84c-e1a6-4bf7-a703-f496b71e49db", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC ": [{"url": "https://www.oscs1024.com/hd/MPS-2t0y-i6ac", "name": "https://www.oscs1024.com/hd/MPS-2t0y-i6ac"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-82564", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-82564"}, {"url": "https://cna.erlef.org/cves/CVE-2026-82564.html", "name": ""}, {"url": "https://github.com/ash-project/ash_ai/commit/87f616d5bfbf7af43346f0701ae17f853789a602", "name": ""}, {"url": "https://github.com/ash-project/ash_ai/security/advisories/GHSA-jg86-xh36-h5xc", "name": ""}, {"url": "https://osv.dev/vulnerability/EEF-CVE-2026-82564", "name": ""}], "scope_influence": "", "tags": ["AI", "应用软件"], "title": "ash_ai身份绕过漏洞", "_translated": true, "_saved_at": "2026-08-31T02:57:38+00:00", "_first_saved_at": "2026-08-31T02:57:38+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-2t0y-i6ac"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-80223", "cvss": {"cvssv4": [{"source": "6b3ad84c-e1a6-4bf7-a703-f496b71e49db", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-863", "description": "ash_graphql 是 Ash 框架的开源 GraphQL 扩展库，以 Hex 包形式发布，用于为 Ash 资源生成查询、变更和订阅接口。\n受影响版本中，订阅解析器 AshGraphql.Graphql.Resolver.resolve/2 对通知载荷进行内存授权：快速路径调用 Ash.can/3 且设置 run_queries?: false，通过 Ash.Expr.eval/2 将读策略过滤器作用在内存记录上，不会真正发起查询。Ash 多租户约束施加在查询构建和数据层前缀阶段，不进入 query.filter，因此策略求值不含租户条件。单条通知子句没有任何租户守卫；批量子句只检查通知列表头部，其余条目仍仅在内存中授权。当租户 B 的通知被路由到租户 A 的订阅者时，只要策略过滤器为真，其他租户记录会被下发给该订阅者。\n修复版本中通过为单条跨租户通知新增 resolve/2 守卫子句，并在批量路径上调用 reject_other_tenant_notifications/2 丢弃与订阅者租户不一致的通知，阻止跨租户载荷进入内存授权快速路径，切断跨租户订阅泄露。", "effects": [{"comp_name": "ash_graphql", "ecosystem": "linux", "versions": [{"affected_version": "[1.4.0,1.11.0)", "min_fixed_version": "1.11.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-08-31", "level": "High", "mps_id": "MPS-li6k-nuh8", "poc": false, "poc_url": [], "published_time": "2026-08-31", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-li6k-nuh8", "name": "https://www.oscs1024.com/hd/MPS-li6k-nuh8"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-80223", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-80223"}, {"url": "https://cna.erlef.org/cves/CVE-2026-80223.html", "name": ""}, {"url": "https://github.com/ash-project/ash_graphql/commit/6e30b8b5a04bdeaed5d7514caa6b2d056d8d993e", "name": ""}, {"url": "https://github.com/ash-project/ash_graphql/security/advisories/GHSA-rcqc-59g2-gjg2", "name": ""}, {"url": "https://osv.dev/vulnerability/EEF-CVE-2026-80223", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "ash_graphql订阅越权", "_translated": true, "_saved_at": "2026-08-30T23:03:26+00:00", "_first_saved_at": "2026-08-30T20:23:02+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-li6k-nuh8"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过构造恶意的数据，将过多的数据输入到程序的缓冲区中，使得缓冲区的空间被填满，从而溢出到程序的栈 (stack) 或堆 (heap) 中，导致程序崩溃、拒绝服务、数据泄露等安全问题。\n", "title": "什么是经典缓冲区溢出"}, {"content": "| 类型        | 描述                                                         |\n| ----------- | ------------------------------------------------------------ |\n| 代码注入攻击      | 攻击者通过向程序的缓冲区输入恶意代码，从而控制程序执行流程，实现对程序操作的恶意操作。例如，攻击者可以通过向 Web 应用程序的输入框中输入恶意代码，从而执行任意的代码，破坏系统、窃取数据等。 |\n| 数据覆盖攻击      | 攻击者通过向程序的缓冲区输入过多的数据，从而覆盖程序中的重要数据或代码，实现对程序操作的恶意操作。例如，攻击者可以通过向聊天应用程序的输入框中输入过多的表情符号，从而覆盖程序中的重要数据，例如聊天消息、账号密码等。 |\n| 栈溢出攻击 | 攻击者通过向程序的栈中输入过多的数据，从而溢出到栈外部，实现对程序操作的恶意操作。例如，攻击者可以通过向游戏应用程序的输入框中输入过多的道具名称，从而覆盖程序中的重要数据，例如游戏数据、账号密码等。 |\n| 堆溢出攻击       | 攻击者通过向程序的堆中输入过多的数据，从而溢出到堆外部，实现对程序操作的恶意操作。例如，攻击者可以通过向操作系统工具的输入框中输入过多的命令，从而覆盖程序中的重要数据，例如系统文件、配置文件等。 |", "title": "经典缓冲区溢出常见的攻击方式"}, {"content": "- 输入验证：在程序输入处对输入数据进行严格的验证和过滤，确保输入数据符合预期的格式和类型，避免被攻击者注入恶意命令或数据。可以使用正则表达式、格式字符串等方式进行输入验证。\n- 输出过滤：在程序输出处对输出数据进行严格的过滤和检查，确保输出数据符合预期的格式和类型，避免被攻击者截获和篡改。可以使用安全的输出过滤库等方式进行输出过滤。\n- 使用安全的编程模型：使用安全的编程模型，例如避免使用原生的缓冲区管理函数，使用安全的框架和库来处理输入数据和执行命令，避免缓冲区溢出漏洞。\n- 数据库加密和访问控制：对于敏感数据和命令，使用加密和访问控制措施，确保只有授权用户可以访问和执行命令，避免被攻击者窃取和篡改。\n- 定期更新和升级：定期更新和升级应用程序和库的版本，确保应用程序和库的最新版本包含了最新的安全补丁和修复措施，避免安全漏洞的出现和利用。\n- 安全审计和监控：定期对系统和应用程序进行安全审计和监控，及时发现和阻止潜在的安全漏洞和攻击，确保系统和数据的安全和可靠性。", "title": "如何预防经典缓冲区溢出"}], "cnvd_id": "", "cve_id": "CVE-2026-83596", "cvss": {"cvssv31": [{"source": "secalert@redhat.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "cwe": "CWE-120", "description": "WebKitGTK 中发现了一个缺陷。由于内存处理不当，处理恶意 Web 内容可能会导致内存损坏。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_sug n2hex(random_bytes(16)) 生成不可预测备份文件名，并在 uploads 目录写入禁止目录索引的 .htaccess 规则，同时加强文件名校验与时间戳验证，切断未授权获取备份文件的路径。", "effects": [{"comp_name": "keep-backup-daily", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.1.4)", "min_fixed_version": "2.1.4", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "关键功能的认证机制缺失", "kind_en": "缺少关键功能的身份验证", "last_modified_time": "2026-09-01", "level": "High", "mps_id": "MPS-0o2r-qlus", "poc": false, "poc_url": [], "published_time": "2026-09-01", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-0o2r-qlus", "name": "https://www.oscs1024.com/hd/MPS-0o2r-qlus"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-75133", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-75133"}, {"url": "https://wordpress.org/plugins/keep-backup-daily/#developers", "name": ""}, {"url": "https://www.vulncheck.com/advisories/keep-backup-daily-wordpress-plugin-sensitive-information-exposure-via-kbd-cron-process", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Keep Backup Daily敏感信息泄露", "_translated": true, "_saved_at": "2026-08-31T17:20:53+00:00", "_first_saved_at": "2026-08-31T17:20:53+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-0o2r-qlus"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-82882", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-862", "description": "Devtron 是开源 Kubernetes 应用交付与运维平台，提供 CI/CD、部署编排和基于 Casbin 的访问控制。\n受影响版本中，GET /orchestrator/api-token/webhook 只通过 GetLoggedInUser 确认存在有效会话，不校验调用者对目标资源的权限。接口将调用者提供的 projectName、environmentName、appName 传入 GetAllApiTokensForWebhook，用已存储 API token 的 Casbin 策略匹配这些参数。超级管理员 token 的通配对象策略会对任意查询值返回通过，且 HideApiTokens 默认关闭，接口把超级管理员 JWT 明文返回给任意已认证账户，攻击者可据此获得平台完全控制权。\n修复版本中通过在 webhook 令牌查询路径上补齐调用者对目标项目、环境和应用的 trigger 权限校验，阻止低权限会话进入令牌枚举与明文返回流程。当前公开仓库最新标签仍为 v2.2.0，GitHub issue #7013 仍为开放状态，尚未确认已发布修复版本，可先设置 HIDE_API_TOKENS=true 并限制低权限账户。", "effects": [{"comp_name": "github.com/devtron-labs/devtron", "ecosystem": "go", "versions": [{"affected_version": "(-∞,2.2.0]", "min_fixed_version": "", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-09-01", "level": "High", "mps_id": "MPS-7sy9-eaf ed_at": "2026-08-31T17:20:51+00:00", "_first_saved_at": "2026-08-31T17:20:51+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-xghc-053v"}, {"analysis_status": 0, "articles": [{"content": "- 命令注入是一种攻击，其目标是通过易受攻击的应用程序在主机操作系统上执行任意命令。 当应用程序将不安全的用户提供的数据（表单、cookie、HTTP 标头等）传递到系统 shell 时，就会产生缺陷。攻击者通过构造恶意的命令或数据，将其注入到程序执行的上下文中，从而绕过程序的输入验证和安全措施，实现对程序操作的恶意操作。", "title": "什么是命令注入"}, {"content": "- 文件上传：攻击者通过构造恶意的文件上传请求，将包含恶意命令的文件上传到服务器，从而利用命令注入漏洞执行恶意命令。\n- SQL 注入：攻击者通过构造恶意的 SQL 查询语句，将包含恶意命令的 SQL 语句注入到数据库中，从而执行恶意命令，窃取数据或者破坏系统。\n- 命令执行：攻击者通过在 Web 应用程序的表单提交数据中注入恶意命令，从而执行恶意命令，例如删除文件、格式化硬盘等。\n- 命令注入漏洞的旁路攻击：攻击者可以利用命令注入漏洞旁路控制程序的执行流程，从而窃取数据、破坏系统、控制程序等。\n", "title": "命令注入常见的攻击方式"}, {"content": "- 输入验证：在程序输入处对输入数据进行严格的验证和过滤，确保输入数据符合预期的格式和类型，避免被攻击者注入恶意命令。\n- 输出过滤：在程序输出处对输出数据进行严格的过滤和检查，确保输出数据符合预期的格式和类型，避免被攻击者截获和篡改。\n- 使用安全的编程模型：使用安全的编程模型，例如避免使用原生的命令执行方式，使用安全的框架和库来处理输入数据和执行命令，避免命令注入漏洞。\n- 数据库加密和访问控制：对于敏感数据和命令，使用加密和访问控制措施，确保只有授权用户可以访问和执行命令，避免被攻击者窃取和篡改。\n- 定期更新和升级：定期更新和升级应用程序和库的版本，确保应用程序和库的最新版本包含了最新的安全补丁和修复措施，避免安全漏洞的出现和利用。\n- 安全审计和监控：定期对系统和应用程序进行安全审计和监控，及时发现和阻止潜在的安全漏洞和攻击，确保系统和数据的安全和可靠性。", "title": "如何预防命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-84190", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.2}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-77", "description": "26.5.0 之前的 LibreNMS 版本在 AboutController 中包含远程代码执行漏洞，其中 snmpget 配置参数未经适当验证就传递给 shell_exec()。经过身份验证的管理员可以修改 snmpget 配置以指向恶意可执行文件并通过访问 /about 端点来触发代码执行。", "effects": Au:S/C:C/I:C/A:C", "severity": "high", "base_score": 9}], "cvssv31": [{"source": "cna@vuldb.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.9}], "cvssv4": [{"source": "cna@vuldb.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-22", "description": "Dokploy 是开源的自托管 PaaS 平台，用于部署和管理容器化应用，并在 Settings 中提供 Traefik 动态配置文件的读写能力。\n受影响版本中，Settings 的 updateTraefikFile 接口把调用方传入的 path 交给 writeTraefikConfigInPath。该函数对 pathFile 只做 path.join 后即作为写入目标，本地调用 fs.writeFileSync，远程则通过 execAsyncRemote 把内容重定向到该路径，缺少将最终路径限制在 Traefik 配置目录内的校验。已认证用户可通过操控 path 参数实施目录穿越，向预期目录之外写入任意文件内容。\n修复版本中通过将 path 限制在约定的 Traefik 配置目录并拒绝目录穿越序列来阻断任意文件写入；官方披露记录显示厂商在告知后未回应，当前没有已验证的修复版本可供升级。", "effects": [{"comp_name": "dokploy", "ecosystem": "linux", "versions": [{"affected_version": "[0.29.0,0.29.7]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-09-01", "level": "High", "mps_id": "MPS-kref-znil", "poc": false, "poc_url": [], "published_time": "2026-09-01", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-kref-znil", "name": "https://www.oscs1024.com/hd/MPS-kref-znil"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-82954", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-82954"}, {"url": "https://vuldb.com/cve/CVE-2026-82954", "name": ""}, {"url": "https://vuldb.com/submit/879844", "name": ""}, {"url": "https://vuldb.com/vuln/397303", "name": ""}, {"url": "https://vuldb.com/vuln/397303/cti", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Dokploy路径穿越漏洞", "_translated": true, "_saved_at": "2026-09-01T01:32:28+00:00", "_first_saved_at": "2026-09-01T01:32:28+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-kref-znil"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-84194", "cvss": {"cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:L/SI:L/SA:L/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:L/SI:L/SA:L/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-78", "description": "LibreNMS 版本 \u003e= 23.10.0 和 \u003c 26.2.0（在 26.4.0 中修复）在 libvirt 发现中包含经过身份验证的操作系统命令注入漏洞。当启用 libvirt 支持 (enable_libvirt=true) 时，设备主机名 ($this-\u003egetDevice()-\u003ehostname) 将连接到 VminfoLibvirt.php 中的 shell 命令（ssh、virsh list/dumpxml/domstate），并传递给 exec()，无需 escapeshellarg() 或参数分隔。经过身份验证的管理员可以设置精心设计的设备主机名来注入任意操作系统命令，从而导致在发现工作线程上下文中远程执行代码。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-09-01", "level": "High", "mps_id": "MPS-qzmb-cv0k", "poc": false, "poc_url": [], "published_time": "2026-09-01", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-qzmb-cv0k", "name": "https://www.oscs1024.com/hd/MPS-qzmb-cv0k"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-84194", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-84194"}, {"url": "https://github.com/librenms/librenms/security/advisories/GHSA-wff2-9gjr-95f3", "name": ""}, {"url": "https://www.vulncheck.com/advisories/librenms-23.10.0-before-26.4.0-os-command-injection-via-hostname", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-84194漏洞", "_translated": true, "_saved_at": "2026-09-01T12:57:33+00:00", "_first_saved_at": "2026-09-01T12:57:33+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-qzmb-cv0k"}, {"analysis_status": 0, "articles": [{"content": "- 命令注入是一种攻击，其目标是通过易受攻击的应用程序在主机操作系统上执行任意命令。 当应用程序将不安全的用户提供的数据（表单、cookie、HTTP 标头等）传递到系统 shell 时，就会产生缺陷。攻击者通过构造恶意的命令或数据，将其注入到程序执行的上下文中，从而绕过程序的输入验证和安全措施，实现对程序操作的恶意操作。", "title": "什么是命令注入"}, {"content": "- 文件上传：攻击者通过构造恶意的文件上传请求，将包含恶意命令的文件上传到服务器，从而利用命令注入漏洞执行恶意命令。\n- SQL 注入：攻击者通过构造恶意的 SQL 查询语句，将包含恶意命令的 SQL 语句注入到数据库中，从而执行恶意命令，窃取数据或者破坏系统。\n- 命令执行：攻击者通过在 Web 应用程序的表单提交数据中注入恶意命令，从而执行恶意命令，例如删除文件、格式化硬盘等。\n- 命令注入漏洞的旁路攻击：攻击者可以利用命令注入漏洞旁路控制程序的执行流程，从而窃取数据、破坏系统、控制程序等。\n", "title": "命令注入常见的攻击方式"}, {"content": "- 输入验证：在程序输入处对输入数据进行严格的验证和过滤，确保输入数据符合预期的格式和类型，避免被攻击者注入恶意命令。\n- 输出过滤：在程序输出处对输出数据进行严格的过滤和检查，确保输出数据符合预期的格式和类型，避免被攻击者截获和篡改。\n- 使用安全的编程模型：使用安全的编程模型，例如避免使用原生的命令执行方式，使用安全的框架和库来处理输入数据和执行命令，避免命令注入漏洞。\n- 数据库加密和访问控制：对于敏感数据和命令，使用加密和访问控制措施，确保只有授权用户可以访问和执行命令，避免被攻击者窃取和篡改。\n- 定期更新和升级：定期更新和升级应用程序和库的版本，确保应用程序和库的最新版本包含了最新的安全补丁和修复措施，避免安全漏洞的出现和利用。\n- 安全审计和监控：定期对系统和应用程序进行安全审计和监控，及时发现和阻止潜在的安全漏洞和攻击，确保系统和数据的安全和可靠性。", "title": "如何预防命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-83524", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:N/AC:L/Au:S/C:C/I:C/A:C", "severity": "high", "base_score": 9}], "cvssv31": [{"source": "cna@vuldb.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.9}], "cvssv4": [{"source": "cna@vuldb.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-77", "description": "RedPort Optimizer wXa-203、wXa-213 与 wXa-223 是商业船用卫星通信 Wi-Fi 路由与语音网关设备，用于将卫星数据链路转为本地热点并提供防火墙与系统管理能力，源码未公开。\n受影响版本中，系统时钟组件的 /xgatev1/system/datetime.php 在调用 exec 处理外部输入时存在命令注入。具备普通用户权限的远程攻击者可操纵该接口，使输入进入命令执行路径，从而在设备上执行任意系统命令。该漏洞利用代码已被公开披露。\n修复版本中通过官方安全更新消除系统时钟 datetime.php 的命令注入风险；公开资料尚未给出已确认的修复版本，厂商在披露前未回应。", "effects": [{"comp_name": "optimizer_wxa-203", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,20260704]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "optimizer_wxa-213", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,20260704]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "optimizer_wxa-223", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,20260704]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit 26-08-31T22:17:08+00:00", "_first_saved_at": "2026-08-31T22:17:08+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-0gme-ho1n"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "cnvd_id": "", "cve_id": "CVE-2026-82807", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:L/AC:L/Au:S/C:C/I:C/A:C", "severity": "medium", "base_score": 6.8}], "cvssv31": [{"source": "cna@vuldb.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}], "cvssv4": [{"source": "cna@vuldb.com", "vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.5}]}, "cvss_score": 8.5, "cvss_vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-269", "description": "Ultra RAMDisk Pro 是 ieungSoft 提供的商业闭源 Windows 软件，用于创建内存虚拟磁盘和虚拟光驱，安装后会加载 WHQL 签名内核驱动 URDSCSI.sys。\n受影响版本中，URDSCSI.sys 向本地普通用户暴露控制设备 \\\\.\\UltraRAMDiskIOCTL。攻击者可打开该设备并向 IOCTL 0x222B30 发送命令 0x08，驱动会解析调用者提供的原生注册表路径、值名、类型与数据，随后在内核上下文调用 RtlCreateRegistryKey 与 RtlWriteRegistryValue，且缺少授权校验和路径限制。标准用户由此可绕过注册表 ACL 写入 HKLM 等受保护项，并进一步改写服务 ImagePath、COM 注册或开机启动项以实现本地权限提升。\n修复版本中通过限制非特权用户访问控制设备，并在注册表写入前增加授权校验与路径白名单，切断该内核态任意注册表写入链路。截至本报告编写时，厂商尚未发布修复版本。", "effects": [{"comp_name": "ultra_ramdisk_pro", "ecosystem": "linux", "versions": [{"affected_version": "[1.82,1.82]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-09-01", "level": "High", "mps_id": "MPS-3ay4-z9dl", "poc": false, "poc_url": [], "published_time": "2026-09-01", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-3ay4-z9dl", "name": "https://www.oscs1024.com/hd/MPS-3ay4-z9dl"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-82807", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-82807"}, {"url": "https://vuldb.com/cve/CVE-2026-82807", "name": ""}, {"url": "https://vuldb.com/submit/864537", "name": ""}, {"url": "https://vuldb.com/vuln/397226", "name": ""}, {"url": "https://vuldb.com/vuln/397226/cti", "name": ""}, {"url": "https://winslow1984.com/books/cve-collection/page/ultra-ramdisk-pro-182-kernel-driver-urdscsisys-local-privilege-escalation-via-arbitrary-registry-value-write", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Ultra RAMDisk本地提权漏洞", "_translated": true, "_saved_at": "2026-08-31T17:20:49+00:00", "_first_saved_at": "2026-08-31T17:20:49+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-3ay4-z9dl"}, {"analysis_status": 0, "articles": [{"content": "由于应用程序或系统中存在敏感信息未经适当保护而被泄露给攻击者或未经授权的用户，这些敏感信息可能包括用户凭据、个人身份信息、敏感业务数据、系统配置信息等。信息暴露漏洞通常是由于设计、实施或配置错误引起的，例如不正确的访问控制、弱密码策略、缺乏加密、错误的日志处理等。", "title": "什么是未授权敏感信息泄露"}, {"content": "- 直接访问敏感信息：攻击者可以通过直接访问不正确配置或不受保护的资源来获取敏感信息，如通过公开可访问的URL、未经授权的文件目录访问等。\n- 越权访问：攻击者可能利用访问控制错误或不正确的权限配置来获取他们没有权限访问的敏感信息。\n- 错误信息披露：应用程序在错误处理过程中可能泄露敏感信息，例如将错误消息中的敏感数据返回给客户端或显示在日志文件中。\n- 信息泄露通过响应：攻击者可能利用应用程序在响应中不正确地包含敏感信息，如通过网页源代码、响应头部或响应消息体中的敏感数据。", "title": "未授权敏感信息泄露常见的攻击方式"}, {"content": "- 访问控制：确保只有经过授权的用户能够访问敏感信息，使用强大的身份验证和授权机制。\n- 数据加密：对于敏感信息，使用适当的加密算法对数据进行加密，包括数据传输和存储过程中的加密。\n- 错误处理和日志安全：正确处理错误情况，避免在错误消息中暴露敏感信息。同时，确保日志记录功能的安全性，避免将敏感信息记录在日志文件中。\n- 安全配置和最佳实践：遵循安全最佳实践，对应用程序、服务器和系统进行适当的配置，包括访问控制、权限管理、密码策略等。\n- 审计和监控：实施日志审计和监控机制，及时检测和响应任何异常活动或潜在的信息暴露事件。\n- 安全开发实践：在应用程序开发过程中，进行安全代码审查、漏洞扫描和安全测试，以及敏感信息的正确处理和保护。", "title": "如何预防未授权敏感信息泄露"}], "cnvd_id": "", "cve_id": "CVE-2026-84195", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:N/A:N", "severity": "high", "base_score": 7.7}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:H/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.3}]}, "cvss_score": 8.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:H/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-200", "description": "1.16.4 之前的 Kyverno 会自动将准入控制器的 ServiceAccount 令牌附加到 apiCall 服务模式下的出站 HTTP 请求，而无需显式授权标头。攻击者可以通过将 apiCall 请求定向到外部或攻击者控制的端点来窃取令牌，从而获得对 Kyverno 策略和集群资源的完全控制。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "未授权敏感信息泄露", "kind_en": "向未经授权的行为者泄露敏感信息", "last_modified_time": "2026-09-01", "level": "High", "mps_id": "MPS-485c-yagu", "poc": false, "poc_url": [], "published_time": "2026-09-01", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-485c-yagu", "name": "https://www.oscs1024.com/hd/MPS-485c-yagu"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-84195", "name": "https://nvd.nist.gov/vuln/detail/CV 397", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-82397"}, {"url": "https://github.com/tornadoweb/tornado/commit/8d6363ed7b69d5f0da806efe34d256627a2191de", "name": ""}, {"url": "https://github.com/tornadoweb/tornado/pull/3704", "name": ""}, {"url": "https://github.com/tornadoweb/tornado/releases/tag/v6.5.8", "name": ""}, {"url": "https://github.com/tornadoweb/tornado/security/advisories/GHSA-mpf4-983q-p7j4", "name": ""}], "scope_influence": "", "tags": ["python", "开源"], "title": "Tornado表单解析拒绝服务", "_translated": true, "_saved_at": "2026-09-01T01:32:31+00:00", "_first_saved_at": "2026-09-01T01:32:31+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-is5q-ptxd"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-82392", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:N/I:H/A:L", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:N/I:H/A:L", "cwe": "CWE-22", "description": "pnpm 是一个包管理器。在 10.34.5 之前以及从 11.0.0 到 11.11.0，pnpm 使用 dp.parse(depPath).name 解析攻击者控制的 pnpm-lock.yaml 包密钥中的包名称，并在 deps/graph-builder/src/lockfileToDepGraph.ts 中使用它而不进行验证， pnpm11/deps/graph-builder/src/lockfileToDepGraph.ts。名称达到path.join(modules, pkgName)、storeController.importPackage和pnpm11/lockfile/to-pnp/src/index.ts，允许当用户运行pnpm install时将包内容写入node_modules之外。当angerlyAllowAllBuilds或匹配的allowBuilds条目允许生命周期脚本时，转义的包可以使用用户的权限执行代码。此问题已在版本 10.34.5 和 11.11.0 中修复。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-09-01", "level": "High", "mps_id": "MPS-6n3h-sepr", "poc": false, "poc_url": [], "published_time": "2026-09-01", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-6n3h-sepr", "name": "https://www.oscs1024.com/hd/MPS-6n3h-sepr"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-82392", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-82392"}, {"url": "https://github.com/pnpm/pnpm/commit/51300fd41c5e4c8f47635108e373cc3d1f324fa7", "name": ""}, {"url": "https://github.com/pnpm/pnpm/commit/78e29fe5583a1e5d69ea05e414eff310f78d5ed9", "name": ""}, {"url": "https://github.com/pnpm/pnpm/pull/12872", "name": ""}, {"url": "https://github.com/pnpm/pnpm/pull/12890", "name": ""}, {"url": "https://github.com/pnpm/pnpm/releases/tag/v10.34.5", "name": ""}, {"url": "https://github.com/pnpm/pnpm/releases/tag/v11.11.0", "name": ""}, {"url": "https://github.com/pnpm/pnpm/security/advisories/GHSA-c59q-g84q-2gj5", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-82392漏洞", "_translated": true, "_saved_at": "2026-08-31T22:17:06+00:00", "_first_saved_at": "2026-08-31T22:17:06+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-6n3h-sepr"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-75132", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:N", "severity": "medium", "base_score": 6.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-89", "description": "WAPT 是 Tranquil IT 出品的软件部署与配置管理平台，WAPT Server 提供主机清单、软件包仓库与控制台 REST API，当前受影响产品为 WAPT Enterprise。\n受影响版本中，GET `/api/v3/hosts` 接口的 `columns` 参数会被拼入 PostgreSQL 查询。已通过 WAPT 控制台认证的远程只读用户可注入任意 PostgreSQL 表达式及附加语句，绕过账号的主机范围限制，并读取数据库中其他行或表的信息。\n修复版本中通过在 waptserver 侧修复认证控制台用户对 SQL SELECT 查询范围限制的绕过，阻止该接口再被用于突破主机范围并读取其他数据。", "effects": [{"comp_name": "wapt", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.6.1.17852)", "min_fixed_version": "2.6.1.17852", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-09-01", "level": "High", "mps_id": "MPS-8s9y-ulx4", "poc": false, "poc_url": [], "published_time": "2026-09-01", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-8s9y-ulx4", "name": "https://www.oscs1024.com/hd/MPS-8s9y-ulx4"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-75132", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-75132"}, {"url": "https://www.vulncheck.com/advisories/wapt-server-sql-injection-via-api-v3-hosts-endpoint", "name": ""}, {"url": "https://www.wapt.fr/en/doc/wapt-changelog.html", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "WAPT SQL注入漏洞", "_translated": true, "_saved_at": "2026-08-31T17:20:55+00:00", "_first_saved_at": "2026-08-31T17:20:55+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-8s9y-ulx4"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-84192", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:L/A:N", "severity": "high", "base_score": 7.1}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:H/VI:L/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:H/VI:L/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-79", "description": "26.3.1 之前的 LibreNMS 在旧版 PHP 模板中包含一个存储的跨站点脚本漏洞，这些模板会输出源自 SNMP 和源自系统日志的数据而不转义。控制受监控网络设备的攻击者可以通过 SNMP 接口描述或系统日志程序字段注入任意 JavaScript，这些程序字段在经过身份验证的用户查看受影响的页面时执行。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-09-01", "level": "High", "mps_id": "MPS-a8ik-ebjt", "poc": false, "poc_url": [], "published_time": "2026-09-01", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-a8ik-ebjt", "name": "https://www.oscs1024.com/hd/MPS-a8ik-ebjt"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-84192", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-84192"}, {"url": "https://github.com/librenms/librenms/security/advisories/GHSA-7w8c-qgxg-m7jx", "name": ""}, {"url": "https://www.vulncheck.com/advisories/librenms-before-26.3.1-stored-xss-via-snmp-syslog-data", "name" 的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-82229", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:L", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:L", "cwe": "CWE-79", "description": "WordPress 社交登录和注册 \u003c= 7.8.2 版本中存在未经身份验证的跨站脚本 (XSS)。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-09-01", "level": "High", "mps_id": "MPS-x0lj-y9r4", "poc": false, "poc_url": [], "published_time": "2026-09-01", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-x0lj-y9r4", "name": "https://www.oscs1024.com/hd/MPS-x0lj-y9r4"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-82229", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-82229"}, {"url": "https://patchstack.com/database/wordpress/plugin/miniorange-login-openid/vulnerability/wordpress-wordpress-social-login-and-register-plugin-7-8-2-cross-site-scripting-xss-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-82229漏洞", "_translated": true, "_saved_at": "2026-08-31T22:17:14+00:00", "_first_saved_at": "2026-08-31T22:17:14+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-x0lj-y9r4"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-82346", "cvss": {"cvssv4": [{"source": "hp-security-alert@hp.com", "vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:A/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7}]}, "cvss_score": 7, "cvss_vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:A/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MV
