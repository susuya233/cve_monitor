:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-1321", "description": "Tinypool 是开源的 Node.js 最小化 worker 线程池库（npm 包 tinypool），基于 worker_threads 为宿主应用提供并行任务执行能力，被 Vitest 等测试框架用作底层 worker 池。\n受影响版本中，ThreadPool 构造函数通过对象展开 { ...kDefaultOptions, ...options, filename, maxQueue: 0 } 构建 this.options，该写法会把从 Object.prototype 继承的 execArgv、env 属性复制为自有属性；_addNewWorker() 随后将 this.options.execArgv 与 this.options.env 显式传给 worker_threads.Worker，Node.js 本身会忽略 Worker 选项中原型继承的值，tinypool 的显式读取绕过了该保护，攻击者事先在宿主进程中污染 Object.prototype.execArgv 或 Object.prototype.env（后者可携带 NODE_OPTIONS），即可让每个新建 worker 通过命令行预加载参数或 NODE_OPTIONS 加载攻击者指定的 JavaScript，以宿主进程权限执行任意代码，进而窃取 CI 密钥、签名材料或构建产物。\n修复版本中通过以 null 原型对象聚合选项切断该链路，ThreadPool 构造函数改为 Object.assign(Object.create(null), kDefaultOptions, options, { filename, maxQueue: 0 })，继承自 Object.prototype 的 execArgv、env 不再被复制为自有属性，Worker 无法再收到被污染的预加载参数与环境变量，并新增回归测试覆盖原型污染场景。", "effects": [{"comp_name": "tinypool", "ecosystem": "npm", "versions": [{"affected_version": "(-∞,2.1.1)", "min_fixed_version": "2.1.1", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "原型污染", "kind_en": "对象原型属性的控制不当的修改（“原型污染”）", "last_modified_time": "2026-10-03", "level": "Critical", "mps_id": "MPS-pzja-fh18", "poc": false, "poc_url": [], "published_time": "2026-10-03", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-pzja-fh18", "name": "https://www.oscs1024.com/hd/MPS-pzja-fh18"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-104848", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-104848"}, {"url": "https://github.com/tinylibs/tinypool/security/advisories/GHSA-5gmw-xhrv-c9v3", "name": "https://github.com/tinylibs/tinypool/security/advisories/GHSA-5gmw-xhrv-c9v3"}, {"url": "https://github.com/tinylibs/tinypool/pull/134", "name": "https://github.com/tinylibs/tinypool/pull/134"}, {"url": "https://github.com/tinylibs/tinypool/commit/24df4e730e7d0857a6d226c9b58f8924227404fd", "name": "https://github.com/tinylibs/tinypool/commit/24df4e730e7d0857a6d226c9b58f8924227404fd"}, {"url": "https://github.com/tinylibs/tinypool/releases/tag/v2.1.1", "name": "https://github.com/tinylibs/tinypool/releases/tag/v2.1.1"}], "scope_influence": "", "tags": ["npm", "开源"], "title": "Tinypool原型污染致代码执行漏洞", "_translated": true, "_saved_at": "2026-10-02T18:53:18+00:00", "_first_saved_at": "2026-10-02T18:53:18+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-pzja-fh18"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-95102", "cvss": {"cvssv31": [{"source": "ics-cert@hq.dhs.gov", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:L", "severity": "critical", "base_score": 9.4}], "cvssv4": [{"source": "ics-cert@hq.dhs.gov", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:L/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:L/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-306", "description": "Monta monta.app 是 Monta 公司（总部位于荷兰）面向电动车充电运营商的云端充电运营管理平台，为商业充电桩提供接入、会话与充电运营管理能力，属闭源商业 SaaS 服务，部署于全球交通与能源行业的关键基础设施场景。\n受影响版本中，平台 WebSocket 端点缺乏身份认证机制，攻击者无需任何凭证，可使用公开充电地图上可获取的充电站标识建立未授权 WebSocket 连接并冒充充电站，进而访问敏感数据、执行未授权操作，并可能导致权限提升与整个充电系统失陷。\n修复版本中通过平台侧持续更新缓解：Monta 已在 WebSocket 层实施速率限制与自动连接节流，按 OCPP 规范以新的认证连接取代同一站标识的既有会话，并推动运营商启用 OCPP 1.6 Security Profile 2（HTTP Basic Auth over TLS）恢复连接级认证。", "effects": [{"comp_name": "monta_app", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,latest]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "关键功能的认证机制缺失", "kind_en": "缺少关键功能的身份验证", "last_modified_time": "2026-10-03", "level": "Critical", "mps_id": "MPS-58d0-6a22", "poc": false, "poc_url": [], "published_time": "2026-10-03", "reference_url_list": [{"url": "https://securityonline.info/monta-ev-charging-vulnerabilities/", "name": ""}, {"url": "https://www.cisa.gov/news-events/ics-advisories/icsa-26-274-02", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Monta 充电平台认证缺失漏洞", "_translated": true, "_saved_at": "2026-10-02T22:45:16+00:00", "_first_saved_at": "2026-10-02T22:45:16+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-58d0-6a22"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-70650", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:L/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:L/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-79", "description": "GetSimple CMS 是一个基于 PHP 的开源内容管理系统，GetSimple CMS CE 是其社区维护版本，页面数据以 XML 文件形式存储，用于搭建和维护小型网站。\n受影响版本中，页面在保存时已由 admin/changedata.php 通过 safe_slash_html() 与 var_out() 对 Keywords、Description、Menu text 和 Content 做 HTML 实体编码，而备份查看器 admin/backup-edit.php 展示页面备份时用 htmldecode() 与 strip_decode() 把这些字段还原为原文，并在第 121、122、123、128 行未重新转义直接输出，保存阶段建立的编码防护被解码输出抵消；能够编辑页面的已登录用户把 JavaScript 存入页面字段并再次保存生成备份（backups/pages/\u003cslug\u003e.bak.xml）后，管理员打开 backup-edit.php?p=view\u0026id=\u003cslug\u003e 查看该备份时，脚本在其后台会话中执行。\n修复版本中通过在 admin/backup-edit.php 的四处输出位置补上 htmlspecialchars($value, ENT_QUOTES, 'UTF-8') 转义，其中 Content 字段在 strip_decode() 解码后再次转义以防止 \u003c/textarea\u003e 闭合逃逸，使备份查看器恢复为编码输出，切断存储脚本进入 HTML 上下文的路径；该修复以 commit 9a4802d（消息 v3.3.23）合入 main 分支，截至 2026-10-02 官方尚未发布包含此修复的版本。", "effects": [{"comp_name": "GetSimpleCMS-CE", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,3.3.22]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-10-02", "level": "High", "mps_id": "MPS-9hjm-yek2", "poc": false, "poc_url": [], "published_time": "2026-10-02", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-9hjm-yek2", "name": "https://www.oscs1024.com/hd/MPS-9hjm-yek2"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-70650", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-70650"}, {"url": "https://github.com/GetSimpleCMS-CE/GetSimpleCMS-CE/security/advisories/GHSA-p6vf-2xr7-mcf4", "name": "https://github.com/GetSimpleCMS-CE/GetSimpleCMS-CE/security/advisories/GHSA-p6vf-2xr7-mcf4"}], "scope_influence": "", "tags": ["应用软件"], "title": "GetSimple CMS CE存储型XSS漏洞", "_translated": true, "_saved_at": "2026-10-01T20:44:01+00:00", "_first_saved_at": "2026-10-01T20:44:01+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-9hjm-yek2"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "cnvd_id": "", "cve_id": "CVE-2026-15897", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-269", "description": "Super Forms – Drag \u0026 Drop Form Builder 是一款 WordPress 拖拽式表单构建商业插件，源码在 GitHub 公开，其随主插件集成的 Register \u0026 Login 附加组件提供前端注册、登录与账户资料更新能力。\n受影响版本中，super_save_form AJAX 动作缺少能力检查，订阅者级别及以上的已认证用户可创建 register_login_action='update' 且 register_login_user_id_update='true' 的表单；提交表单时 SUPER_Register_Login::before_sending_email() 把表单数据中攻击者提供的 user_id 指定为目标账户并写入客户端数据，before_email_success_msg() 随后读取该 ID 并连同攻击者提交的 user_pass、user_email 直接传入 wp_update_user()，全程缺少属主与能力校验，攻击者可覆盖包括管理员在内任意现有账户的凭据，导致账户接管与站点完全失陷。\n修复版本中通过新增 SUPER_Register_Login::can_update_user() 将目标账户更新限制为本人或具备 edit_user 目标能力检查的用户，把待执行的用户更新动作绑定请求指纹并经 user_action_context_is_authorized() 授权后方允许调用 wp_update_user()，同时为 super_save_form 等表单管理 AJAX 动作补充 manage_options 能力检查，切断越权更新账户凭据的利用链。", "effects": [{"comp_name": "super_forms", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,6.3.317)", "min_fixed_version": "6.3.317", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-10-02", "level": "High", "mps_id": "MPS-wdit-axes", "poc": false, "poc_url": [], "published_time": "2026-10-02", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-wdit-axes", "name": "https://www.oscs1024.com/hd/MPS-wdit-axes"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-15897", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-15897"}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/94297481-9ebb-42cb-9362-be8bc52b126f?source=cve", "name": ""}, {"url": "https://github.com/RensTillmann/super-forms/pull/205", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "Super Forms 权限提升漏洞", "_translated": true, "_saved_at": "2026-10-02T06:33:51+00:00", "_first_saved_at": "2026-10-02T06:33:51+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-wdit-axes"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-96294", "cvss": {"cvssv4": [{"source": "security@apache.org", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-755", "description": "Apache Thrift 是开源的跨语言 RPC 框架，其 NodeJS 绑定以 npm 包 thrift 发布，内建的 web server 可把 HTTP 服务升级为 WebSocket 通道来承载 Thrift 消息。\n受影响版本中，web_server.js 的 createWebServer 在处理 HTTP upgrade 事件完成 WebSocket 握手后，未为升级后的 socket 注册 error 监听器，仅用内层 try/catch 处理帧解码异常；当该 socket 触发 error 事件（如远端异常断开连接）时，异常按 Node.js 事件约定以未捕获异常抛出，Node 进程随之退出，远程攻击者无需认证即可令整个 Thrift NodeJS 服务崩溃。\n修复版本中通过在 upgrade 处理器入口为升级后的 socket 注册 error 监听器解决该问题，错误被记录为 TWebSocketTransport Exception 日志并调用 socket.destroy() 关闭当前连接，单个 WebSocket 连接上的错误不再终结服务器进程。", "effects": [{"comp_name": "thrift", "ecosystem": "npm", "versions": [{"affected_version": "(-∞,0.25.0)", "min_fixed_version": "0.25.0", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "对异常条件的处理不恰当", "kind_en": "Improper Handling of Exceptional Conditions", "last_modified_time": "2026-10-02", "level": "High", "mps_id": "MPS-12ed-b2d3", "poc": false, "poc_url": [], "published_time": "2026-10-02", "reference_url_list": [{"url": "http://www.mail-archive.com/announce@apache.org/msg12129.html", "name": ""}, {"url": "https://github.com/apache/thrift/commit/40486d71c40464f3c69bd7eed7187f13c33ad1ee", "name": ""}, {"url": "https://github.com/apache/thrift/releases/tag/v0.25.0", "name": ""}, {"url": "https://www.npmjs.com/package/thrift", "name": ""}, {"url": "https://thrift.apache.org/", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-96294", "name": ""}], "scope_influence": "", "tags": ["npm", "开源"], "title": "Thrift NodeJS WebSocket 拒绝服务漏洞", "_translated": true, "_saved_at": "2026-10-02T13:27:45+00:00", "_first_saved_at": "2026-10-02T00:25:47+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-12ed-b2d3"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-94642", "cvss": {}, "cvss_score": 8.7, "cvss_vector": "", "cwe": "CWE-248", "description": "Apache Thrift 是 Apache 软件基金会的开源跨语言 RPC 框架，其 PHP 绑定以 composer 包 apache/thrift 发布，提供传输层、协议层与 TSimpleServer、TForkingServer 等服务端实现，用于在 PHP 进程中承载 Thrift RPC 服务。\n受影响版本中，TSimpleServer 的 serve() 主循环把 accept()、传输与协议工厂调用以及 processor 处理循环放在同一个 try 块内，且只捕获 TTransportException；协议层解析畸形报文时抛出的 TProtocolException 继承自 TException，并非传输异常，畸形 JSON 报文引发的 TypeError 等 \\Error 类型异常同样不受该 catch 约束，未捕获异常逸出 serve() 后整个 PHP 服务进程以致命错误退出。远程攻击者无需认证，向服务端口发送畸形请求数据（如二进制协议下 4 字节的 0xFFFFFFFF 版本头）即可触发该流程，造成拒绝服务。\n修复版本中通过重构 serve() 循环，将 accept() 的传输异常处理与单个连接的服务逻辑分离，后者移入内层 try 并在 finally 中关闭连接、以 catch (\\Throwable) 兜底，任何异常只结束当前连接，服务端继续接受后续客户端；TForkingServer 子进程的 handleChild 捕获范围同步扩大到 \\Throwable，处理结束后退出而不返回主循环。该修复包含在 0.25.0 版本中。", "effects": [{"comp_name": "apache/thrift", "ecosystem": "composer", "versions": [{"affected_version": "(-∞,0.25.0)", "min_fixed_version": "0.25.0", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "未捕获的异常", "kind_en": "未捕获的异常", "last_modified_time": "2026-10-02", "level": "High", "mps_id": "MPS-56eb-6be2", "poc": false, "poc_url": [], "published_time": "2026-10-02", "reference_url_list": [{"url": "http://www.mail-archive.com/announce@apache.org/msg12127.html", "name": ""}, {"url": "https://thrift.apache.org/", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-94642", "name": ""}, {"url": "https://github.com/apache/thrift/commit/24a0d02577612214dd607c4128e2864c5fe555ff", "name": ""}, {"url": "https://github.com/apache/thrift/releases/tag/v0.25.0", "name": ""}], "scope_influence": "", "tags": ["php", "开源"], "title": "Apache Thrift PHP未捕获异常漏洞", "_translated": true, "_saved_at": "2026-10-02T00:25:48+00:00", "_first_saved_at": "2026-10-02T00:25:48+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-56eb-6be2"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-71542", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-79", "description": "GetSimple CMS 是基于 PHP 的开源内容管理系统，GetSimple CMS CE 为其社区版，用于搭建和维护小型网站。\n受影响版本中，后台主题组件管理功能 admin/components.php 把表单提交的 title 参数经 safe_slash_html() 的 htmlspecialchars(ENT_QUOTES) 编码后写入 components.xml，存储阶段双引号已编码为 \u0026quot;；渲染阶段同文件把 cl($component-\u003etitle) 直接拼入删除链接的 title=\"...\" 双引号属性，而 cl()（admin/inc/basic.php）内部调用 html_entity_decode() 把 \u0026quot; 还原为字面双引号，strip_tags() 只能过滤标签字符、无法阻止不需要尖括号的属性与事件注入，攻击者可在 title 中保存形如 poc\"onmouseover=\"alert(1)\"style=\"position:absolute;width:100%;height:100%;top:0;left:0;\" 的载荷，使任何查看组件管理页面的认证用户浏览器持续执行任意 JavaScript。\n修复版本中通过，安全公告给出的修复方向是在输出环节按属性上下文重新编码标题，以属性上下文编码输出替代先解码再输出的 cl() 路径，使存储值在 title=\"...\" 属性中不再还原出字面双引号；在此之前可通过限制后台组件管理功能的账号使用范围、核查 components.xml 中已存储的 title 内容降低风险，待官方发布修复版本后及时升级。", "effects": [{"comp_name": "GetSimpleCMS-CE", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,3.3.22]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-10-02", "level": "High", "mps_id": "MPS-6gwo-91he", "poc": false, "poc_url": [], "published_time": "2026-10-02", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-6gwo-91he", "name": "https://www.oscs1024.com/hd/MPS-6gwo-91he"}, {"url": "https://nvd.nist.gov/vuln/de U:X", "cwe": "CWE-1284", "description": "Apache Thrift 是开源的跨语言 RPC 框架，其 Python 绑定提供 TZlibTransport 压缩传输层，用于在客户端与服务端之间传输 zlib 压缩数据。\n受影响版本中，lib/py/src/transport/TZlibTransport.py 的 readComp 方法先从底层传输读取压缩数据，再将上限 max_decompressed_size 与已解压计数 _bytes_decompressed 的差值 remaining 作为 max_length 传给 zlib.decompressobj.decompress。当会话解压量恰好达到上限时 remaining 为 0，CPython zlib 将 max_length=0 视为不限制输出，攻击者后续发送的高压缩比数据被完整解压写入读缓冲，unconsumed_tail 为空使 SIZE_LIMIT 检查不触发，单会话解压上限（默认 16384000 字节）失效，远程攻击者可用少量压缩流量耗尽服务端或客户端内存，造成拒绝服务。\n修复版本中通过在 readComp 读取底层传输前先计算剩余解压额度，额度用尽时立即抛出 SIZE_LIMIT 异常并停止读取，同时在构造函数中校验 max_decompressed_size 必须大于 0，恢复单会话解压总量的强制限制，0.25.0 版本已包含该修复。", "effects": [{"comp_name": "thrift", "ecosystem": "pip", "versions": [{"affected_version": "(-∞,0.25.0)", "min_fixed_version": "0.25.0", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "输入中指定数量的验证不当", "kind_en": "输入中指定数量的验证不正确", "last_modified_time": "2026-10-02", "level": "High", "mps_id": "MPS-8c11-8a02", "poc": false, "poc_url": [], "published_time": "2026-10-02", "reference_url_list": [{"url": "http://www.mail-archive.com/announce@apache.org/msg12160.html", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-94636", "name": ""}, {"url": "https://github.com/apache/thrift/commit/6527ef050f6d8573bbee056c50579135ca5be512", "name": ""}, {"url": "https://github.com/apache/thrift/releases/tag/v0.25.0", "name": ""}, {"url": "https://thrift.apache.org/", "name": ""}], "scope_influence": "", "tags": ["python", "开源"], "title": "Apache Thrift解压大小限制绕过漏洞", "_translated": true, "_saved_at": "2026-10-02T13:27:51+00:00", "_first_saved_at": "2026-10-02T13:27:51+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-8c11-8a02"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-94644", "cvss": {}, "cvss_score": 8.2, "cvss_vector": "", "cwe": "CWE-770", "description": "Apache Thrift 是 Apache 软件基金会开源的跨语言 RPC 与序列化框架，其 PHP 绑定以 composer 包 apache/thrift 发布，TJSONProtocol 负责在客户端与服务器之间以 JSON 编解码 Thrift 消息。\n受影响版本中，TJSONProtocol 的 readJSONString() 与 readJSONNumericChars() 按定界符解析 JSON 值：前者逐字符读取直到闭合引号并持续拼接进 $jsonString，后者把数字字符逐个累积进缓冲区，两个循环均不校验累计长度，构造函数也未提供字符串长度上限参数；与带长度前缀的 TBinaryProtocol、TCompactProtocol 不同，JSON 字符串和数字值以引号或非数字字符定界，攻击者向使用 JSON 协议的 PHP 服务端发送一条包含超长带引号字符串或超长数字字面量的消息，单个值的解析内存随线上字节数无上限增长，导致进程内存耗尽、服务不可用。\n修复版本中通过为 TJSONProtocol 与 TJSONProtocolFactory 增加 maxStringSize 构造参数（默认取 TProtocol::DEFAULT_MAX_STRING_SIZE 即 16384000 字节，0 表示不限制），在两个读取循环内逐字符调用 checkStringSize() 校验线上累计字节数，超限时抛出 TProtocolException（SIZE_LIMIT）终止解析，将单个 JSON 字符串与数字值的内存开销限制在与二进制协议一致的边界内。", "effects": [{"comp_name": "apache/thrift", "ecosystem": "composer", "versions": [{"affected_version": "(-∞,0.25.0)", "min_fixed_version": "0.25.0", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "不加限制或调节的资源分配", "kind_en": "不受限制或节流地分配资源", "last_modified_time": "2026-10-02", "level": "High", "mps_id": "MPS-b79a-ac7a", "poc": false, "poc_url": [], "published_time": "2026-10-02", "reference_url_list": [{"url": "http://www.mail-archive.com/announce@apache.org/msg12128.html", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-94644", "name": ""}, {"url": "https://thrift.apache.org/", "name": ""}, {"url": "https://github.com/apache/thrift/commit/cc3ac7649b88b4a97619845912193b3ed8a9f85a", "name": ""}, {"url": "https://github.com/apache/thrift/releases/tag/v0.25.0", "name": ""}, {"url": "https://packagist.org/packages/apache/thrift", "name": ""}], "scope_influence": "", "tags": ["php", "开源"], "title": "Thrift PHP JSON协议内存耗尽", "_translated": true, "_saved_at": "2026-10-02T00:25:49+00:00", "_first_saved_at": "2026-10-02T00:25:49+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-b79a-ac7a"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-96292", "cvss": {"cvssv4": [{"source": "security@apache.org", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.2}]}, "cvss_score": 8.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-1333", "description": "Apache Thrift 是 Apache 软件基金会开源的跨语言 RPC 框架，其 Lua 绑定中的 THttpTransport 用于在 HTTP 协议上承载 Thrift 消息，默认以服务端模式解析收到的 HTTP 请求。\n受影响版本中，lib/lua/THttpTransport.lua 的 THttpTransport:_parseHeaders 对每个头部行调用 string.gmatch(line, \"([%w%-]+)%s*:%s*(.+)\")，该模式未锚定且字段名部分为贪婪匹配，当请求头部行包含长串字段名字符而缺少冒号分隔时，匹配需在行内多个起点间反复回溯，单行解析开销随行长呈平方级增长；远程攻击者向基于该传输层的 Thrift Lua HTTP 服务端发送携带此类头部行的请求，即可耗尽服务端 CPU 资源，造成拒绝服务。\n修复版本中通过改用 string.find(line, ':', 1, true) 纯文本搜索定位首个冒号，再对冒号前后两段分别使用锚定模式 \"^%s*([%w%-]+)(.*)\" 与 \"^%s*(.+)\" 各自单次匹配完成解析，头部解析开销降为线性，消除平方级回溯路径。", "effects": [{"comp_name": "thrift", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,0.25.0)", "min_fixed_version": "0.25.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "ReDoS", "kind_en": "正则表达式复杂性低效", "last_modified_time": "2026-10-02", "level": "High", "mps_id": "MPS-c228-9cb1", "poc": false, "poc_url": [], "published_time": "2026-10-02", "reference_url_list": [{"url": "http://www.mail-archive.com/announce@apache.org/msg12187.html", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-96292", "name": ""}, {"url": "https://github.com/apache/thrift/commit/93e33392b707502396c83d68c96d1c8e3aad4963", "name": ""}, {"url": "https://github.com/apache/thrift/releases/tag/v0.25.0", "name": ""}, {"url": "https://thrift.apache.org/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Apache Thrift Lua 正则回溯拒绝服务漏洞", "_translated": true, "_saved_at": "2026-10-02T13:27:41+00:00", "_first_saved_at": "2026-10-02T13:27:41+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-c228-9cb1"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-94637", "cvss": {"cvssv4": [{"source": "security@apache.org", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.2}]}, "cvss_score": 8.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-409", "description": "Apache Thrift 是开源的跨语言 RPC 与序列化框架，Go 绑定中的 THeaderTransport 用于解析携带 THeader 协议头的帧数据，并按帧头声明的 transform 处理压缩载荷。\n受影响版本中，ReadFrame 方法对网络上传输的压缩帧长度做了上限校验，但 parseHeaders 按客户端在帧头中声明的 transform 列表调用 TransformReader.AddTransform 应用 ZLIB 解压时，zlib 解压器的输出没有对应的长度上限，攻击者向使用 THeader 传输的 Go 服务发送高压缩比数据后，服务端读取帧时会把少量线上数据解压成远超最大帧大小限制的内容，导致内存耗尽与服务不可用。\n修复版本中通过在 parseHeaders 应用 TransformZlib 时引入 limitedTransformReader，将解压输出限制在与线上帧相同的最大帧大小内，读取超过上限时返回 SIZE_LIMIT 协议异常，切断了解压数据放大导致资源耗尽的链路。", "effects": [{"comp_name": "github.com/apache/thrift", "ecosystem": "go", "versions": [{"affected_version": "(-∞,0.25.0)", "min_fixed_version": "0.25.0", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "对高度压缩数据的处理不恰当（数据放大攻击）", "kind_en": "高度压缩数据的不当处理（数据放大）", "last_modified_time": "2026-10-02", "level": "High", "mps_id": "MPS-e98a-2b74", "poc": false, "poc_url": [], "published_time": "2026-10-02", "reference_url_list": [{"url": "http://www.mail-archive. "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "低效算法复杂性", "kind_en": "低效的算法复杂性", "last_modified_time": "2026-10-02", "level": "High", "mps_id": "MPS-ec78-0a32", "poc": false, "poc_url": [], "published_time": "2026-10-02", "reference_url_list": [{"url": "http://www.mail-archive.com/announce@apache.org/msg12147.html", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-94653", "name": ""}, {"url": "https://thrift.apache.org/", "name": ""}, {"url": "https://github.com/apache/thrift/commit/77188b02e299aacf112591012c4fc56f343f7e4e", "name": ""}, {"url": "https://github.com/apache/thrift/releases/tag/v0.25.0", "name": ""}], "scope_influence": "", "tags": ["php", "开源"], "title": "Apache Thrift PHP 拒绝服务漏洞", "_translated": true, "_saved_at": "2026-10-02T13:27:47+00:00", "_first_saved_at": "2026-10-02T13:27:47+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ec78-0a32"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能有效地控制资源的使用，导致攻击者可以利用这个漏洞耗尽应用程序所依赖的资源。这些资源可以是计算资源（CPU、内存）、网络带宽、数据库连接或其他系统资源。攻击者可以通过发送特制的请求、恶意输入或其他方式，使应用程序消耗大量资源，导致拒绝服务或系统崩溃。", "title": "什么是拒绝服务"}, {"content": "- 消耗计算资源：攻击者可以发送计算密集型的请求，例如复杂的计算、无限循环或递归操作，以耗尽应用程序的计算资源，导致应用程序无法响应其他请求。\r\n- 消耗内存资源：攻击者可以发送大量的数据或恶意输入，以导致应用程序消耗过多的内存资源，从而使系统的可用内存耗尽，并导致应用程序崩溃或变得不可用。\r\n- 消耗网络带宽：攻击者可以发送大量的请求或大型数据包，以消耗应用程序所依赖的网络带宽。这会导致其他合法用户无法正常访问应用程序或降低系统的整体网络性能。\r\n- 消耗存储资源：攻击者可以发送大量的请求或上传大文件，以耗尽应用程序的存储资源，导致系统无法处理其他请求或存储新的数据。", "title": "拒绝服务常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对输入数据进行合理的验证和过滤，防止恶意输入导致资源消耗过高。\r\n- 实施资源限制：应用程序应该实施适当的资源限制策略，例如限制计算操作的时间或次数，限制内存使用量，限制并发连接数等，以防止资源被耗尽。\r\n- 异常处理与错误恢复：应用程序应该具备健壮的异常处理和错误恢复机制，以防止因意外错误导致资源泄漏或无法释放的情况。\r\n- 资源监控与警报：应用程序应该实施适当的资源监控和警报机制，及时发现异常的资源消耗情况，并采取相应的措施来应对。\r\n- 压力测试与性能优化：应用程序应该进行压力测试，以评估其在高负载情况下的性能，并进行必要的性能优化，以确保能够有效地处理大量请求而不耗尽资源。", "title": "如何预防拒绝服务"}], "cnvd_id": "", "cve_id": "CVE-2026-103760", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV: ve_id": "CVE-2026-92174", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-98", "description": "SiteOrigin Widgets Bundle 是一款开源 WordPress 小组件插件，通过 wordpress.org 分发，为站点提供价格表、按钮、轮播、联系表单等页面构建组件，并支持在块编辑器中实时预览小组件。\n受影响版本中，块编辑器预览接口 /wp-json/sowb/v1/widgets/previews 允许具备 edit_posts 能力的投稿者及以上用户提交 widgetData，SiteOrigin_Widget::update() 调用的 update_fields() 只遍历表单已声明字段，载荷中遗留的顶层 theme 键未经任何校验保留下来；Price Table 小组件渲染时 modify_instance() 在 columns 为非空数组的情况下把该键迁入 design.theme，get_template_name() 返回 get_style_name() 的取值并拼入模板路径 widgets/price-table/tpl/\u003ctheme\u003e.php，路径经 realpath() 解析后进入 @ include，攻击者携带 ../ 序列即可控制包含目标，包含并执行服务器上任意 .php 文件。\n修复版本中通过调整 SiteOrigin_Widget::update() 的处理顺序并收紧实例字段白名单切断该链路：先调用 modify_instance() 将遗留 theme 键迁入已声明的 design.theme 选择字段，使其接受 options 列表校验，随后 update_fields() 使用 array_intersect_key 按已声明字段、字段伴随键与面板信息白名单剔除未识别键，未声明键不再进入渲染路径与模板路径选择。", "effects": [{"comp_name": "so-widgets-bundle", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.74.0)", "min_fixed_version": "1.74.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "php远程文件包含", "kind_en": "PHP 程序中 Include/Require 语句的文件名控制不当（“PHP 远程文件包含”）", "last_modified_time": "2026-10-02", "level": "High", "mps_id": "MPS-e4k8-u5i0", "poc": false, "poc_url": [], "published_time": "2026-10-02", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-e4k8-u5i0", "name": "https://www.oscs1024.com/hd/MPS-e4k8-u5i0"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-92174", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-92174"}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/a184ee1a-5fe2-47d5-8db1-a226c73e5bb1?source=cve", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/so-widgets-bundle/tags/1.73.1/base/siteorigin-widget.class.php#L214", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/so-widgets-bundle/tags/1.73.1/base/inc/routes/siteorigin-widgets-resource.class.php#L140", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/so-widgets-bundle/tags/1.73.1/compat/block-editor/widget-block.php#L710", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/so-widgets-bundle/tags/1.73.1/widgets/price-table/price-table.php#L450", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/so-widgets-bundle/tags/1.73.1/widgets/price-table/price-table.php#L332", "name": ""}, {"url": "https://plugins.trac.wordpress.org/changeset/3605767/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "SiteOrigin Widgets Bundle 本地文件包含漏洞", "_translated": true, "_saved_at": "2026-10-02T06:33:47+00:00", "_first_saved_at": "2026-10-02T06:33:47+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-e4k8-u5i0"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能有效地控制资源的使用，导致攻击者可以利用这个漏洞耗尽应用程序所依赖的资源。这些资源可以是计算资源（CPU、内存）、网络带宽、数据库连接或其他系统资源。攻击者可以通过发送特制的请求、恶意输入或其他方式，使应用程序消耗大量资源，导致拒绝服务或系统崩溃。", "title": "什么是拒绝服务"}, {"content": "- 消耗计算资源：攻击者可以发送计算密集型的请求，例如复杂的计算、无限循环或递归操作，以耗尽应用程序的计算资源，导致应用程序无法响应其他请求。\r\n- 消耗内存资源：攻击者可以发送大量的数据或恶意输入，以导致应用程序消耗过多的内存资源，从而使系统的可用内存耗尽，并导致应用程序崩溃或变得不可用。\r\n- 消耗网络带宽：攻击者可以发送大量的请求或大型数据包，以消耗应用程序所依赖的网络带宽。这会导致其他合法用户无法正常访问应用程序或降低系统的整体网络性能。\r\n- 消耗存储资源：攻击者可以发送大量的请求或上传大文件，以耗尽应用程序的存储资源，导致系统无法处理其他请求或存储新的数据。", "title": "拒绝服务常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对输入数据进行合理的验证和过滤，防止恶意输入导致资源消耗过高。\r\n- 实施资源限制：应用程序应该实施适当的资源限制策略，例如限制计算操作的时间或次数，限制内存使用量，限制并发连接数等，以防止资源被耗尽。\r\n- 异常处理与错误恢复：应用程序应该具备健壮的异常处理和错误恢复机制，以防止因意外错误导致资源泄漏或无法释放的情况。\r\n- 资源监控与警报：应用程序应该实施适当的资源监控和警报机制，及时发现异常的资源消耗情况，并采取相应的措施来应对。\r\n- 压力测试与性能优化：应用程序应该进行压力测试，以评估其在高负载情况下的性能，并进行必要的性能优化，以确保能够有效地处理大量请求而不耗尽资源。", "title": "如何预防拒绝服务"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-86344", "cvss": {"cvssv31": [{"source": "secalert@redhat.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-400", "description": "389 Directory Server（389-ds-base）是 Red Hat 主导开发的开源 LDAP 目录服务器组件，以 C 语言实现，随 Red Hat Directory Server 与 Red Hat Enterprise Linux 以软件包形式分发，用于为网络客户端提供目录查询与认证服务。\n受影响版本中，工作线程在 connection_read_operation() 中读取 LDAPMessage 期间始终持有连接互斥锁 c_mutex；当同一连接先发送一个完整 LDAP 操作、随后跟随第二个不完整报文的起始字节时，该操作虽然完成，连接却因读缓冲区仍有数据被重新排队，第二个工作线程随后在 PR_Poll() 中等待剩余字节并持续持有 c_mutex，使第一个线程无法获得锁以刷写已完成操作的结果；每个此类连接占用一个工作线程直至 nsslapd-ioblocktimeout 超时，未认证远程攻击者以与线程池规模成比例的少量连接重复上述模式，可在默认配置下耗尽全部工作线程，导致所有客户端（匿名与已认证、明文与 TLS）无法获得服务。\n修复版本中通过在 connection_read_operation() 阻塞于 PR_Poll() 期间释放 c_mutex，并新增每连接读锁 c_readmutex 保证同一 PDU 仅由单个工作线程装配，在重新获取 c_mutex 后校验连接是否已关闭，同时按 c_readmutex、c_mutex、c_pdumutex 的顺序加锁以避免与 flush_ber() 死锁，使已完成操作的结果可及时刷写，切断了工作线程池耗尽的路径。", "effects": [{"comp_name": "389-ds-base", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,3.3.1]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "拒绝服务", "kind_en": "不受控制的资源消耗", "last_modified_time": "2026-10-02", "level": "High", "mps_id": "MPS-hqzu-ysgi", "poc": false, "poc_url": [], "published_time": "2026-10-02", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-hqzu-ysgi", "name": "https://www.oscs1024.com/hd/MPS-hqzu-ysgi"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-86344", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-86344"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-86344", "name": ""}, {"url": "https://bugzilla.redhat.com/show_bug.cgi?id=2529329", "name": "RHBZ#2529329"}], "scope_influence": "", "tags": ["应用软件"], "title": "389-ds-base 拒绝服务漏洞", "_translated": true, "_saved_at": "2026-10-02T00:25:53+00:00", "_first_saved_at": "2026-10-02T00:25:53+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-hqzu-ysgi"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-71452", "cvss": {"cvssv4": [{"source": "productsecurity@jci.com", "vector": "CVSS:4.0/AV:A/AC:L/AT:N/PR:H/UI:N/VC:L/VI:L/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:4.0/AV:A/AC:L/AT:N/PR:H/UI:N/VC:L/VI:L/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-78", "description": "Johnson Controls EasyIO FS32（FS-32）是商业闭源的可编程楼宇自动化网络控制器，用于商业与工业设施中暖通空调、照明与能源管理等楼宇功能的自动化管理，并可直接接入传感器与执行器。\n受影响版本中，该控制器固件存在操作系统命令注入漏洞（CWE-78），外部输入可进入操作系统命令执行流程并在控制器上执行任意命令；官方 CVSS v4.0 评级（AV:A/PR:H/UI:N）表明利用需接入与控制器相邻的网络并持有设备高权限账户，无需用户交互，成功利用后会进一步危及所接入楼宇自动化系统的机密性、完整性与可用性。\n修复版本中通过 3.0b63 固件消除该命令注入风险，官方记录将受影响范围限定为 3.0b63 之前版本，3.0b63 及以上版本不受影响；固件闭源，公开资料未披露具体修复代码。", "effects": [{"comp_name": "easyio_fs32", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,3.0b63)", "min_fixed_version": "3.0b63", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-10-02", "level": "High", "mps_id": "MPS-3m6z-kdb2", "poc": false, "poc_url": [], "published_time": "2026-10-02", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-3m6z-kdb2", "name": "https://www.oscs1024.com/hd/MPS-3m6z-kdb2"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-71452", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-71452"}, {"url": "https://www.johnsoncontrols.com/trust-center/cybersecurity/security-advisories", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "EasyIO FS32命令注入漏洞", "_translated": true, "_saved_at": "2026-10-02T00:25:54+00:00", "_first_saved_at": "2026-10-02T00:25:54+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-3m6z-kdb2"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-90438", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "cwe": "CWE-79", "description": "Ninja Forms 是 WordPress 官方插件目录中的开源表单构建插件（GPLv2 授权），用于搭建联系表单、问卷与计算器表单，提交数据保存在站点自身的数据库中。\n受影响版本中，未登录访问者通过 nf_ajax_submit AJAX 接口进入 includes/AJAX/Controllers/Submission.php 的 NF_AJAX_Controllers_Submission::submit()，当表单中的 Paragraph Text 字段开启 Show Rich Text Editor（textarea_rte）选项时，其提交值按富文本处理，经 includes/Helper.php 的 encode_submission_value 以 wp_kses_post 白名单过滤入库而未做完整转义；管理员打开后台 Submissions 提交编辑页时，前端文件 build/submissions.js 将该字段的存储值赋给 div.innerHTML 再读取 textContent，注入的网页脚本在该页面被访问时执行。\n修复版本中通过把富文本字段值的 HTML 剥离改为由 DOMParser 在独立惰性文档中解析并只读取 textContent（3.15.5，2026-09-28 发布），不再向 innerHTML 写入攻击者可控内容，查看提交页面时注入脚本无法执行。", "effects": [{"comp_name": "ninja-forms", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,3.15.5)", "min_fixed_version": "3.15.5", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "la 06:33:49+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-cxqe-yrna"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-82358", "cvss": {"cvssv31": [{"source": "9119a7d8-5eab-497f-8521-727c672e3725", "vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:U/C:N/I:H/A:N", "severity": "medium", "base_score": 6.5}], "cvssv4": [{"source": "9119a7d8-5eab-497f-8521-727c672e3725", "vector": "CVSS:4.0/AV:A/AC:L/AT:N/PR:N/UI:N/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:A/AC:L/AT:N/PR:N/UI:N/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-863", "description": "C-Open 是 RT-Labs AB 开源的嵌入式 CANopen 协议栈，以 C 语言实现，提供 NMT、SDO、PDO、心跳与紧急报文等服务，其中 SDO 服务器负责响应 CAN 总线上其他节点对对象字典（OD）的读写访问。\n受影响版本中，SDO 服务器处理下载段请求的 co_sdo_rx_download_seg_req 未校验当前任务类型，攻击者先对大于 64 位的只读 OD 条目发起 SDO 上传初始请求，使 CO_JOB_SDO_UPLOAD 任务的 sdo.data 指针指向只读对象的存储区，再发送下载段帧触发 memcpy 写入；由于 OD_WRITE 权限检查只存在于 co_sdo_rx_download_init_req 中，该写入不经过任何权限校验，CAN 总线上的任意未认证节点只需两帧 SDO 报文便能篡改设备的只读对象字典条目。\n修复版本中通过在 co_sdo_rx_download_seg_req 与 co_sdo_rx_upload_seg_req 入口增加任务类型校验，任务类型不匹配时返回 CO_SDO_ABORT_ACCESS 中止会话，切断了利用上传会话残留数据指针写入内存的路径，使只读 OD 条目在分段传输场景下无法被写入。", "effects": [{"comp_name": "c-open", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.1.1)", "min_fixed_version": "1.1.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-10-02", "level": "High", "mps_id": "MPS-9x4b-2izo", "poc": false, "poc_url": [], "published_time": "2026-10-02", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-9x4b-2izo", "name": "https://www.oscs1024.com/hd/MPS-9x4b-2izo"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-82358", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-82358"}, {"url": "https://rt-labs.com/wp-content/uploads/2026/09/RRTL-260929-01.pdf", "name": "url"}, {"url": "https://github.com/rtlabs-com/c-open/releases/tag/public%2Fv1.1.1", "name": "url"}, {"url": "https://raw.githubusercontent.com/cisagov/CSAF/develop/csaf_files/IT/white/2025/va-26-275-02.json", "name": "url"}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-82358", "name": "url"}], "scope_influence": "", "tags": ["应用软件"], "title": "C-Open SDO写保护绕过漏洞", "_translated": true, "_saved_at": "2026-10-01T20:43:57+00:00", "_first_saved_at": "2026-10-01T20:43:57+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-9x4b-2izo"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-71426", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-98", "description": "GetSimple CMS CE 是 GetSimple CMS 的社区版，一个基于 PHP 与 XML 文件存储的开源（GPL-3.0）轻量级内容管理系统，不依赖数据库，常用于搭建小型网站。\n受影响版本中，admin/changedata.php 保存页面时把表单参数 post-template 的值原样写入页面 XML 的 template 字段，既未做路径归一化也未按主题文件白名单校验；前端 index.php 渲染页面时把该字段拼接为 GSTHEMESPATH.$TEMPLATE.'/'.$template_file 并传入 include()，仅用 file_exists 判断存在性，携带 ../ 的穿越路径可越出主题目录包含服务器上任意可读文件，被包含文件中的 PHP 代码会随渲染执行，任意访客请求该页面时触发，可导致 gsconfig.php 中的 $SALT、data/users/*.xml 口令哈希等敏感文件泄露。\n修复版本中通过 main 分支修复提交在该写入口用 basename() 剥离 post-template 的路径成分并过滤空字节，强制模板为 .php 文件且排除 functions.php 与 *.inc.php，再经 realpath 校验模板必须位于当前主题目录内，否则回退为默认 template.php，从保存入口切断了目录穿越包含链；截至 2026-10-02 官方尚未发布包含该修复的版本，最新发布版本仍为 3.3.22。", "effects": [{"comp_name": "getsimple_cms", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,3.3.22]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "php远程文件包含", "kind_en": "PHP 程序中 Include/Require 语句的文件名控制不当（“PHP 远程文件包含”）", "last_modified_time": "2026-10-02", "level": "High", "mps_id": "MPS-g7zt-n2s6", "poc": false, "poc_url": [], "published_time": "2026-10-02", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-g7zt-n2s6", "name": "https://www.oscs1024.com/hd/MPS-g7zt-n2s6"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-71426", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-71426"}, {"url": "https://github.com/GetSimpleCMS-CE/GetSimpleCMS-CE/security/advisories/GHSA-559q-hqrv-m84x", "name": "https://github.com/GetSimpleCMS-CE/GetSimpleCMS-CE/security/advisories/GHSA-559q-hqrv-m84x"}], "scope_influence": "", "tags": ["应用软件"], "title": "GetSimple CMS CE 存储型本地文件包含漏洞", "_translated": true, "_saved_at": "2026-10-01T20:43:59+00:00", "_first_saved_at": "2026-10-01T20:43:59+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-g7zt-n2s6"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用了空指针，并在不进行有效检查的情况下对其进行取消引用操作。当程序试图取消引用空指针时，由于空指针不指向任何有效的内存地址，会导致程序崩溃或产生未定义的行为。这种错误通常发生在开发者未对指针进行正确的初始化或验证时。", "title": "什么是空指针取消引用"}, {"content": "- 拒绝服务：攻击者可以通过构造恶意输入或请求，触发程序中的空指针取消引用错误，导致程序崩溃或无法正常运行。这可能导致拒绝服务攻击，使系统无法提供正常的服务。\r\n- 内存信息泄露：攻击者可以通过利用空指针取消引用错误，访问程序中的敏感内存信息。这可能包括栈上的变量、函数指针或其他敏感数据，从而暴露系统的机密信息。\r\n- 代码执行：在某些情况下，空指针取消引用错误可能导致执行恶意代码或注入恶意代码的机会。攻击者可以通过精心构造的输入，利用空指针取消引用错误来执行任意的代码，进而获取系统控制权或执行未经授权的操作。", "title": "空指针取消引用常见的攻击方式"}, {"content": "- 指针初始化和验证：开发者应该正确地初始化指针，并在使用指针之前进行有效的验证，确保指针不为空。在取消引用指针之前，应始终检查其是否为空。\r\n- 异常处理和错误恢复：程序应该具备健壮的异常处理和错误恢复机制，以便在发生空指针取消引用错误时能够适当地处理异常，而不是导致程序崩溃或暴露敏感信息。\r\n- 防御性编程：采用防御性编程的原则，如避免在未经验证的指针上进行操作，避免使用未初始化的指针等，以防止空指针取消引用错误的发生。\r\n- 静态代码分析和测试：使用静态代码分析工具和测试技术来检测和识别潜在的空指针取消引用错误。这些工具可以帮助发现代码中可能存在的空指针问题，并及时修复。\r\n- 强制性编码标准和最佳实践：制定强制性的编码标准和最佳实践，包括良好的指针使用和管理规范，以帮助开发者编写更可靠、安全的代码。", "title": "如何预防空指针取消引用"}], "cnvd_id": "", "cve_id": "CVE-2026-82357", "cvss": {"cvssv31": [{"source": "9119a7d8-5eab-497f-8521-727c672e3725", "vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "medium", "base_score": 6.5}], "cvssv4": [{"source": "9119a7d8-5eab-497f-8521-727c672e3725", "vector": "CVSS:4.0/AV:A/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:A/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-476", "description": "RT-Labs C-Open 是瑞典 RT-Labs AB 开源的嵌入式 CANopen 协议栈，采用 C 语言实现并以 GPLv3 与商业许可双授权，用于在微控制器上构建 CANopen 节点，涵盖 NMT、SDO、PDO、EMCY 与 LSS 等协议模块。\n受影响版本中，LSS 模块处理身份查询报文时，co_lss_inquire_identity 函数将 co_entry_find 在身份对象 0x1018 中查找子索引的结果直接传入 co_od_get_value，未检查该结果是否为空；当用户应用程序定义的对象字典缺少身份对象 0x1018 的必需子索引（子索引 1 至 4）时，能够访问 CAN 总线的攻击者先发送 LSS 全局切换命令使设备进入配置状态，再发送查询厂商 ID、产品码、修订号或序列号的报文，随后触发空指针解引用，导致设备崩溃。\n修复版本中通过新增 co_lss_identity_get 对子索引查找结果判空，缺失子索引时以 UINT32_MAX 作为返回值，同时 co_lss_inquire_identity 拒绝超出合法范围的查询命令，co_lss_init 在初始化阶段校验身份对象 0x1018 及其子索引 1 至 4 完整存在，切断了空指针解引用路径。", "effects": [{"comp_name": "c-open", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.1.1)", "min_fixed_version": "1.1.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "空指针取消引用", "kind_en": "空指针取消引用", "last_modified_time": "2026-10-02", "level": "High", "mps_id": "MPS-ueds-jvax", "poc": false, "poc_url": [], "published_time": "2026-10-02", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ueds-jvax", "name": "https://www.oscs1024.com/hd/MPS-ueds-jvax"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-82357", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-82357"}, {"url": "https://rt-labs.com/wp-content/uploads/2026/09/RRTL-260929-01.pdf", "name": "url"}, {"url": "https://github.com/rtlabs-com/c-open/releases/tag/public%2Fv1.1.1", "name": "url"}, {"url": "https://raw.githubusercontent.com/cisagov/CSAF/develop/csaf_files/IT/white/2025/va-26-275-02.json", "name": "url"}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-82357", "name": "url"}], "scope_influence": "", "tags": ["应用软件"], "title": "C-Open LSS 空指针解引用漏洞", "_translated": true, "_saved_at": "2026-10-01T20:43:56+00:00", "_first_saved_at": "2026-10-01T20:43:56+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ueds-jvax"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-105115", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:L/A:H", es/icsa-26-274-02", "name": ""}, {"url": "https://github.com/cisagov/csaf/blob/develop/csaf_files/OT/white/2026/icsa-26-274-02.json", "name": ""}, {"url": "https://www.first.org/cvss/calculator/3.1#CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Monta认证限流缺失漏洞", "_translated": true, "_saved_at": "2026-10-02T22:45:13+00:00", "_first_saved_at": "2026-10-02T22:45:13+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-8485-4dac"}, {"analysis_status": 0, "articles": [{"content": "跨界内存读是指应用程序在读取内存时，未正确验证或限制读取的内存范围。攻击者利用这种漏洞可以读取应用程序内存中的敏感数据，如密码、加密密钥、会话令牌等。常见的原因是由于缓冲区溢出、格式化字符串漏洞或其他内存错误导致的。", "title": "什么是越界读取"}, {"content": "攻击者可以通过不当构造的输入来触发跨界内存读漏洞。攻击者可能会通过向应用程序发送特定的输入，使其读取超过预期的内存区域。攻击者可以利用这个漏洞来获取敏感信息，如其他用户的数据、操作系统的敏感数据或应用程序的内部状态。", "title": "越界读取常见的攻击方式"}, {"content": "- 输入验证和限制：应用程序应对所有输入数据进行严格的验证和限制。确保输入数据的长度、格式和内容符合预期，避免超出缓冲区或访问非预期的内存区域。\n- 内存安全编程实践：开发人员应使用安全的编程实践，如避免使用不安全的函数、正确处理内存分配和释放操作，以及遵循最小特权原则。\n- 使用安全的编程语言和库：选择使用安全性较高的编程语言和库，这些语言和库在内存管理和安全性方面提供了更多的保护机制。\n- 定期进行代码审查和安全测试：定期审查应用程序的代码，并进行安全测试，以发现潜在的跨界内存读漏洞。使用静态代码分析工具和漏洞扫描工具来辅助检测和修复问题。\n- 实施防御性编程技术：应用程序应采用防御性编程技术，如使用随机化地址空间布局（ASLR）、堆栈保护机制（如堆栈溢出保护）和数据执行预防（DEP）等。\n- 及时更新和修补：及时应用程序和操作系统的安全更新和补丁，以确保已知的跨界内存读漏洞得到修复。及时更新相关软件和库，以避免使用已知存在漏洞的版本。", "title": "如何预防越界读取"}], "cnvd_id": "", "cve_id": "CVE-2026-104433", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-125", "description": "Mooncake 是 kvcache-ai 开源的 KVCache 传输引擎（Apache-2.0），面向大模型推理场景提供跨节点 KV cache 传输与 P2P 握手能力，常与 SGLang、vLLM 等推理框架配合部署，属于大模型基础设施组件。\n受影响版本中，传输引擎默认在所有网络接口上启动 P2P 握手监听线程 SocketHandShakePlugin::startDaemon，对到达的 TCP 连接不要求认证，并把已连接套接字传入 include/common.h 的 readString。readString 从网络读取 8 字节 64 位长度后仅做上界检查，随后按该长度构造 std::vector\u003cchar\u003e 并无条件访问 buffer[0]；攻击者发送长度为 0 的握手帧时缓冲区为空，buffer[0] 构成越界读，发布构建下进程收到 SIGSEGV 终止，托管该引擎的 SGLang 推理服务随之不可用。\n修复版本中通过在 readString 中新增 length == 0 的提前返回，空长度帧不再构造缓冲区、不再访问 buffer[0]，切断零长度握手帧进入越界读的路径，0.3.12 及以上版本不受该问题影响。", "effects": [{"comp_name": "mooncake-transfer-engine", "ecosystem": "pip", "versions": [{"affected_version": "(-∞,0.3.12)", "min_fixed_version": "0.3.12", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界读取", "kind_en": "越界读取", "last_modified_time": "2026-10-03", "level": "High", "mps_id": "MPS-d02j-3n9c", "poc": false, "poc_url": [], "published_time": "2026-10-03", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-d02j-3n9c", "name": "https://www.oscs1024.com/hd/MPS-d02j-3n9c"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-104433", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-104433"}, {"url": "https://github.com/kvcache-ai/Mooncake/issues/4452", "name": "GitHub Issue #4452"}, {"url": "https://github.com/kvcache-ai/Mooncake/commit/c142b40590259360196d8e504b2193382529e7b4", "name": ""}, {"url": "https://github.com/kvcache-ai/Mooncake", "name": ""}, {"url": "https://www.vulncheck.com/advisories/mooncake-before-0.3.12-out-of-bounds-read-via-p2p-handshake-readstring", "name": "VulnCheck Advisory: Mooncake before 0.3.12 Out-of-Bounds Read via P2P Handshake readString"}], "scope_influence": "", "tags": ["AI", "python", "开源"], "title": "Mooncake 握手帧越界读漏洞", "_translated": true, "_saved_at": "2026-10-03T01:38:23+00:00", "_first_saved_at": PR:N/UI:N/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:Amber", "cwe": "CWE-863", "description": "Bouncy Castle for Java 是 Legion of the Bouncy Castle 开源发布的 Java 密码学库，其 org.bouncycastle.mls 模块（Maven 坐标 org.bouncycastle:bcmls-jdk18on）实现了 RFC 9420 定义的 MLS 安全群组通信协议，供应用构建端到端加密群组。\n受影响版本中，外部提交（external commit）提案列表校验函数 org.bouncycastle.mls.protocol.Group.validateExternalCachedProposals 只按类型统计提案并用 removedIsInTree 限制被移除叶子索引在树内，未校验被移除叶子与加入者本人的关系；普通提案校验器用于拦截自移除的 not_me 规则在该路径被有意跳过以支持合法的重同步提交，却没有补上等价的归属判定。任何持有群组公开 GroupInfo 的攻击者可构造携带指向任意成员 LeafIndex 的 Remove 提案的外部提交，成员端应用经 Group.handle 处理该消息时校验通过并应用移除，受害成员被逐出群组，攻击者的叶子占据其在 ratchet tree 中腾出的槽位并成为新纪元成员，可读取后续群组消息并伪造成员身份发言，Group.handle 全程不报错。\n修复版本中通过在 validateExternalCachedProposals 中引入 removesOwnPriorAppearance 归属校验切断该链路，取提交 path 字段中的加入者新叶子与被移除叶子，按凭证编码字节比较，仅当二者完全一致时接受携带 Remove 的外部提交；inferCommitType 与 validateCachedProposals 在发送侧与接收侧统一传入加入者叶子强制执行该规则，凭证按编码比较而非使用仅对 basic 类型填充的 Credential.getIdentity()，避免任意两个 x509 凭证被误判为同一参与者。", "effects": [{"comp_name": "bc-java", "ecosystem": "linux", "versions": [{"affected_version": "[1.73,1.86)", "min_fixed_version": "1.86", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "org.bouncycastle:bcmls-jdk18on", "ecosystem": "maven", "versions": [{"affected_version": "[1.78,1.86)", "min_fixed_version": "1.86", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-10-03", "level": "High", "mps_id": "MPS-o37w-al48", "poc": false, "poc_url": [], "published_time": "2026-10-03", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-o37w-al48", "name": "https://www.oscs1024.com/hd/MPS-o37w-al48"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-71890", "name": "https:// ": "使用硬编码密钥", "last_modified_time": "2026-10-03", "level": "High", "mps_id": "MPS-8rql-phkg", "poc": false, "poc_url": [], "published_time": "2026-10-03", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-8rql-phkg", "name": "https://www.oscs1024.com/hd/MPS-8rql-phkg"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-94591", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-94591"}, {"url": "https://www.cisa.gov/news-events/ics-advisories/icsa-26-274-01", "name": ""}, {"url": "https://github.com/cisagov/CSAF/blob/develop/csaf_files/OT/white/2026/icsa-26-274-01.json", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Armatura One 硬编码加密密钥漏洞", "_translated": true, "_saved_at": "2026-10-02T22:45:15+00:00", "_first_saved_at": "2026-10-02T22:45:15+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-8rql-phkg"}, {"analysis_status": 0, "articles": [{"content": "- 编写代码时没有正确处理输入数据或没有正确验证用户输入而导致的。", "title": "什么是关键资源权限分配不当"}, {"content": "- 弱密码或未使用的密码：当管理员或系统管理员在创建帐户时，没有使用强密码或未对帐户进行密码更新时，可能会发生这种情况。弱密码可能会被黑客破解或通过其他方式轻松访问系统。\n- 未正确配置权限：在系统中，不同的资源通常需要不同的权限才能访问。如果管理员未正确配置权限，那么未经授权的用户可能会通过欺骗系统或利用其他漏洞来访问关键资源。\n- 权限重用：在某些情况下，管理员可能会将某些权限分配给某个用户，但这些权限并未被正确地限制或授权给该用户。如果其他用户尝试使用这些权限访问关键资源，那么他们可能会获得未经授权的访问权限。\n- 未正确验证用户输入：当开发人员没有正确验证用户输入时，可能会发生这种情况。例如，如果开发人员未正确过滤用户输入的用户名或密码，那么黑客可能会利用这些信息轻松地访问系统。\n", "title": "关键资源权限分配不当常见的攻击方式"}, {"content": "- 使用强密码：管理员应该使用强密码来保护系统，并定期更改密码。强密码应该包括数字、字母和符号，并且应该不同于其他帐户使用的密码。\n- 正确配置权限：管理员应该正确配置系统中不同资源所需的权限。用户可以被授予访问特定资源的权限，但不应该被授予访问其他资源的权限。\n- 权限限制：管理员应该使用权限限制来限制用户对特定资源的访问。例如，用户可以被授予访问特定文件夹的权限，但不能访问其他文件夹。\n- 输入验证：开发人员应该正确验证用户输入。例如，他们可以过滤用户输入的用户名和密码，以确保它们符合预期的格式。\n- 安全培训：管理员和用户应该接受安全培训，以便了解如何识别和避免常见的安全漏洞，例如不正确权限授予漏洞。\n- 定期更新和修补软件：系统软件和应用程序应该定期更新和修补，以确保它们不受最新安全漏洞的影响。", "title": "如何预防关键资源权限分配不当"}], "cnvd_id": "", "cve_id": "CVE-2026-104854", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.5}]}, "cvss_score": 8.5, "cvss_vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-732", "description": "Nx 是 Nrwl 开源的 monorepo 构建编排工具（npm 包 nx），面向 TypeScript 及多语言代码库提供任务编排、项目图计算、构建缓存与守护进程加速，其常驻 daemon 与插件隔离 worker 通过 Unix domain socket 通信。\n受影响版本中，daemon 与 plugin worker 的 socket 目录由 tmp-dir.ts 的 socketDirName 以 workspaceRoot 与 pid 的哈希命名，并经 getSocketDir 以 mkdirSync 默认权限创建，未设置 owner-only 模式，plugin worker socket 更直接位于共享系统临时根目录，目录与 socket 文件对本机其他账户可达且连接不经过任何认证；攻击者连接 socket 后发送 PROCESS_IN_BACKGROUND 请求，handleProcessInBackground 按 payload.requirePath require 模块并调用其 default export，攻击者在本账户可写路径放置模块文件即可让 daemon 以运行 Nx 的账户执行任意代码，其余 handler 还会向同一未认证调用方返回工作区文件内容、项目图与任务哈希。\n修复版本中通过新增 owned-private-dir 守护重建 socket 目录约束：socket 根目录按 NX_SOCKET_DIR、/tmp/.nx/\u003cuid\u003e/sockets、~/.nx/sockets 回退链以 0700 owner-only 权限建立并复核，拒绝共享、symlink 与属主异常目录，socket 文件在监听后 chmod 0600，daemon 与 plugin worker 通道同时校验 workspaceRoot 并为插件 socket 名引入随机熵，切断了其他本地账户连接 socket 进而执行代码的路径。", "effects": [{"comp_name": "nx", "ecosystem": "npm", "versions": [{"affected_version": "[14.6.0,22.7.9)", "min_fixed_version": "22.7.9", "repository": "npm", "solutions": [], "upstream": true}, {"affected_version": "[23.0.0,23.1.2)", "min_fixed_version": "23.1.2", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "关键资源权限分配不当", "kind_en": "关键资源的权限分配不正确", "last_modified_time": "2026-10-03", "level": "High", "mps_id": "MPS-a3tw-ujgi", "poc": false, "poc_url": [], "published_time": "2026-10-03", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-a3tw-ujgi", "name": "https://www.oscs1024.com/hd/MPS-a3tw-ujgi"}, {"url": "h 5-a0262ff19630", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:Amber", "severity": "high", "base_score": 8.2}]}, "cvss_score": 8.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:Amber", "cwe": "CWE-347", "description": "Bouncy Castle 是广泛使用的 Java 开源密码学库，其 pg 模块以 Maven 坐标 org.bouncycastle:bcpg-jdk18on 发布，提供 OpenPGP 实现，1.81 起新增 org.bouncycastle.openpgp.api 高级 API 用于证书解析与签名验证。\n受影响版本中，OpenPGPCertificate 对子钥 Key Flags 存在两条不一致的解析路径：isSigningKey() 经 getApplyingSubpacket() 读取 Key Flags，子钥绑定签名缺少该子包时回退到主钥的 direct-key 或主 User ID 自签名，子钥继承主钥的 SIGN_DATA 被判定为可签名；verifyEmbeddedPrimaryKeyBinding() 读取绑定签名自身 hashed 子包中的 Key Flags，未发现 SIGN_DATA 时提前返回，未要求 RFC 9580 第 5.2.1.8 与第 10.1.3 节规定的 embedded Primary Key Binding（交叉认证）签名。攻击者只需持有受害者公开的签名子钥公钥，将其以自身可完成的子钥绑定签名嫁接到自己的主钥下并发布证书，验证方以该证书校验受害者的真实签名时，签名被归因到攻击者的证书，OpenPGPDocumentSignature.isValid() 返回 true，而 GnuPG 会拒绝同一证书与消息。\n修复版本中通过在 getApplyingSubpacket() 中增加 KEY_FLAGS 子包类型与 OpenPGPSubkey 类型判断，子钥不再从主钥的证书级签名继承 Key Flags，绑定签名缺少该子包的子钥不再具备任何能力，交叉认证校验读取的标志与其他能力判定一致，嫁接的签名子钥无法再通过高级 API 的签名验证。", "effects": [{"comp_name": "org.bouncycastle:bcpg-jdk18on", "ecosystem": "maven", "versions": [{"affected_version": "[1.81,1.86)", "min_fixed_version": "1.86", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "密码学签名的验证不恰当", "kind_en": "密码签名验证不当", "last_modified_time": "2026-10-03", "level": "High", "mps_id": "MPS-49nm-07uf", "poc": false, "poc_url": [], "published_time": "2026-10-03", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-49nm-07uf", "name": "https://www.oscs1024.com/hd/MPS-49nm-07uf"}, {"url": "https://nv
