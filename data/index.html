ty-advisories/CVE-2026-82320", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "SolarWinds Serv-U权限提升漏洞", "_translated": true, "_saved_at": "2026-11-24T18:33:40+00:00", "_first_saved_at": "2026-11-24T18:33:40+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-v9gc-3uws"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-123886", "cvss": {}, "cvss_score": 8.8, "cvss_vector": "", "cwe": "CWE-917", "description": "Spring Data Elasticsearch 是 Spring 官方维护的开源 Elasticsearch 数据访问模块，提供基于仓库接口与字符串型 @Query 注解的 Elasticsearch 查询构建能力，属于 Spring Data 家族的 Java 组件。\n受影响版本中，字符串型 @Query 查询的处理顺序为先由 QueryStringPlaceholderReplacer 将方法实参原样替换进 ?0 等位置占位符，再把拼接后的完整字符串交给 QueryStringSpELEvaluator 按 SpEL 模板解析执行，参数值在该阶段未做任何 SpEL 转义；应用将不可信输入作为此类仓库方法的参数传递时，攻击者提交形如 #{T(java.lang.Runtime).getRuntime().exec(...)} 的取值可在应用进程中执行任意代码，同时解析表达式缓存使用无界 ConcurrentHashMap，不同请求构造的不同查询串可持续占用内存直至耗尽。\n修复版本中通过调整 QueryStringProcessor.createQuery 的处理顺序切断该链路，SpEL 表达式先在声明的查询字符串上求值，位置占位符仅在求值结果的字面部分内替换，字符串参数值对引号与反斜杠进行转义，解析表达式缓存改为容量 256 的 ConcurrentLruCache，参数携带的 SpEL 表达式不再执行，缓存内存占用也受到上限约束。", "effects": [{"comp_name": "org.springframework.data:spring-data-elasticsearch", "ecosystem": "maven", "versions": [{"affected_version": "[6.1.0,6.1.3)", "min_fixed_version": "6.1.3", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[6.0.0,6.0.9)", "min_fixed_version": "6.0.9", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "表达式语言注入", "kind_en": "表达式语言语句中使用的特殊元素的不正确中和（“表达式语言注入”）", "last_modified_time": "2026-11-23", "level": "High", "mps_id": "MPS-b7c3-0f38", "poc": false, "poc_url": [], "published_time": "2026-11-23", "reference_url_list": [{"url": "https://securityonline.info/spring-security-vulnerabilities-november-2026/", "name": ""}, {"url": "https://spring.io/security/cve-2026-123886", "name": ""}, {"url": "https://github.com/spring-projects/spring-data-elasticsearch/commit/311bc4127136af531c3a3c9197170827251a8594", "name": ""}, {"url": "https://github.com/spring-projects/spring-data-elasticsearch/commit/1acdc7e1b0445a15104c4d7ab95e79201cb646d5", "name": ""}, {"url": "https://github.com/spring-projects/spring-data-elasticsearch/issues/3390", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "Spring Data Elasticsearch SpEL表达式注入漏洞", "_translated": true, "_saved_at": "2026-11-23T10:08:12+00:00", "_first_saved_at": "2026-11-23T10:08:12+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-b7c3-0f38"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-86312", "cvss": {}, "cvss_score": 8.8, "cvss_vector": "", "cwe": "CWE-863", "description": "Apache Solr 是 Apache 软件基金会开源的 Java 企业级搜索平台，提供全文检索、分布式检索、集合管理与规则化授权能力，被广泛用于企业检索和数据平台场景。\n受影响版本中，PingRequestHandler 的 handlePing 方法从请求参数读取 qt 并通过 core.getRequestHandler(qt) 选取该核任意已注册请求处理器作为委托，再以请求原始参数执行 core.execute，isShard=true 时还会将委托处理器的完整响应写回 ping 响应；该接口在规则化授权下仅需低权限 health 权限，官方 bin/solr auth 命令生成的样例 security.json 更将 health 权限设为无需认证，使仅持有 health 权限或未认证的客户端能够触发 /select 等本应要求 read、update 等更高权限的功能。\n修复版本中通过新增 resolveConfiguredParams 方法，仅从处理器自身配置的 invariants、appends、defaults 与 useParams 参数集解析委托处理器及执行参数，不再读取任何请求参数，并以子请求承载配置参数、通过 shards.qt 将分布式 ping 直接指向各分片的委托处理器，使请求参数无法改变 ping 的实际执行内容，切断了低权限客户端借助 ping 端点触发高权限功能的路径。", "effects": [{"comp_name": "org.apache.solr:solr-core", "ecosystem": "maven", "versions": [{"affected_version": "[10.0.0,10.1.0)", "min_fixed_version": "10.1.0", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[9.0.0,9.11.0)", "min_fixed_version": "9.11.0", "repository": "maven", "solutions": [], "upstream": true}]}, {"comp_name": "solr", "ecosystem": "linux", "versions": [{"affected_version": "[9.0.0,9.11.0)", "min_fixed_version": "9.11.0", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[10.0.0,10.1.0)", "min_fixed_version": "10.1.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-11-23", "level": "High", "mps_id": "MPS-d060-7c40", "poc": false, "poc_url": [], "published_time": "2026-11-23", "reference_url_list": [{"url": "http://www.mail-archive.com/announce@apache.org/msg12763.html", "name": ""}, {"url": "https://solr.apache.org/security-news.html", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-86312", "name": ""}, {"url": "https://github.com/apache/solr/pull/4890", "name": ""}, {"url": "https://github.com/apache/solr/commit/f567b7b1a9415c8bfcf3f64ddb51aa78eb007a8f", "name": ""}, {"url": "https://github.com/apache/solr/commit/a918d1fe97981fac56cd8ded80daf382786683a1", "name": ""}, {"url": "https://issues.apache.org/jira/browse/SOLR-18419", "name": ""}, {"url": "https://solr.apache.org", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "Apache Solr Ping接口权限绕过漏洞", "_translated": true, "_saved_at": t.gov/vuln/detail/CVE-2026-135742", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-135742"}, {"url": "https://code.ffmpeg.org/FFmpeg/FFmpeg/pulls/26081", "name": ""}, {"url": "https://github.com/FFmpeg/FFmpeg/commit/78afb1d6e99ba2d3264f053ae4c0e4487a9c824c", "name": "Patch Commit"}, {"url": "https://github.com/FFmpeg/FFmpeg/blob/n9.0.2/libavfilter/f_zmq.c#L138", "name": ""}, {"url": "https://github.com/FFmpeg/FFmpeg", "name": ""}, {"url": "https://www.vulncheck.com/advisories/ffmpeg-before-9.1-integer-truncation-via-zmq-filter-recv-msg", "name": "VulnCheck Advisory: FFmpeg before 9.1 Integer Truncation via zmq Filter recv_msg()"}], "scope_influence": "", "tags": ["应用软件"], "title": "FFmpeg整数截断漏洞", "_translated": true, "_saved_at": "2026-11-24T06:40:30+00:00", "_first_saved_at": "2026-11-24T06:40:30+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-jsch-8nu9"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-135740", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.5}]}, "cvss_score": 8.5, "cvss_vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-787", "description": "FFmpeg 是开源多媒体框架，采用 LGPL 或 GPL 许可，用于音视频编解码、滤镜处理和格式转换。其中 readeia608 滤镜从输入视频扫描 EIA-608 闭路字幕并写入帧元数据。\n受影响版本中，libavfilter/vf_readeia608.c 的 build_histogram() 按像素位深名义上限 s-\u003emax 分配直方图，但直接使用未钳制的 line[i].input 作为下标递增。config_input() 将 s-\u003emax 设为 (1 \u003c\u003c depth) - 1；位深大于 8 时 read_word() 以 uint16_t 读取亮度采样。攻击者提交 9、10、12 或 14 位灰度或 YUV 视频且采样值超过该名义上限时，直方图写入越过堆缓冲区，可造成进程崩溃，并可能进一步执行代码。\n修复版本中通过在 build_histogram() 内使用 FFMIN(line[i].input, s-\u003emax) 将下标限制到直方图上界后再递增计数，超过名义位深上限的亮度采样不再越过已分配堆内存。", "effects": [{"comp_name": "ffmpeg", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,9.1)", "min_fixed_version": "9.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-11-24", "level": "High", "mps_id": "MPS-bksp-6c0j", "poc": false, "poc_url": [], "published_time": "2026-11-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-bksp-6c0j", "name": "https://www.oscs1024.com/hd/MPS-bksp-6c0j"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-135740", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-135740"}, {"url": "https://code.ffmpeg.org/FFmpeg/FFmpeg/pulls/26121", "name": ""}, {"url": "https://github.com/FFmpeg/FFmpeg/commit/df1ddf75db9a1ff36a35019511e17f795cf20c55", "name": "Patch Commit"}, {"url": "https://github.com/FFmpeg/FFmpeg/blob/n9.0.2/libavfilter/vf_readeia608.c#L176", "name": ""}, {"url": "https://github.com/FFmpeg/FFmpeg", "name": ""}, {"url": "https://www.vulncheck.com/advisories/ffmpeg-before-9.1-heap-out-of-bounds-write-via-readeia608-filter-histogram", "name": "VulnCheck Advisory: FFmpeg before 9.1 Heap Out-of-Bounds Write via readeia608 Filter Histogram"}], "scope_influence": "", "tags": ["应用软件"], "title": "FFmpeg堆越界写漏洞", "_translated": true, "_saved_at": "2026-11-24T06:40:34+00:00", "_first_saved_at": "2026-11-24T06:40:34+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-bksp-6c0j"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-96298", "cvss": {}, "cvss_score": 8.3, "cvss_vector": "", "cwe": "CWE-862", "description": "Apache Texera（孵化中）是 Apache 软件基金会托管的开源可视化数据科学系统，用于协作设计数据分析工作流，并在 computing unit 中执行。\n受影响版本中，computing unit 的 workflow websocket 端点 /wsapi/workflow-websocket 未校验调用者是否被授予目标 computing unit。ServletAwareConfigurator.modifyHandshake 在缺少访问控制服务注入的身份头时把 UserComputingUnitAccess 固定为 WRITE，WorkflowWebsocketResource.myOnOpen 再按查询参数 wid 与 cuid 订阅对应工作流。已认证用户因而可以查看未被授予的 computing unit 中的工作流结果、控制执行并运行代码。本地 JVM 与单节点 Docker Compose 部署可直接连接；Kubernetes 部署中，可由集群内另一个 computing unit 中运行的代码发起连接。\n修复版本中通过为 computing unit pool 增加拒绝池内 Pod 互相入站访问的 NetworkPolicy，切断一个 computing unit 直接连接另一个 computing unit workflow websocket 的路径。本地 JVM 与 Docker Compose 部署仍不提供完整安全模型，仅供受信任用户使用。", "effects": [{"comp_name": "texera", "ecosystem": "linux", "versions": [{"affected_version": "[1.1.0,1.3.0)", "min_fixed_version": "1.3.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-11-24", "level": "High", "mps_id": "MPS-4890-0b25", "poc": false, "poc_url": [], "published_time": "2026-11-24", "reference_url_list": [{"url": "http://www.mail-archive.com/announce@apache.org/msg12777.html", "name": ""}, {"url": "https://texera.apache.org", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-96298", "name": ""}, {"url": "https://texera.apache.org/releases/1.3.0-incubating/", "name": ""}, {"url": "https://github.com/apache/texera/commit/3c87a969ccb1ec39110a1320fe378ee50a6972c3", "name": ""}, {"url": "https://github.com/apache/texera/commit/cf6faeb7b31ff3defeab77cc2bbd614035dabf82", "name": ""}, {"url": "https://github.com/apache/texera/pull/8777", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Texera计算单元授权缺失", "_translated": true, "_saved_at": "2026-11-23T22:23:17+00:00", "_first_saved_at": "2026-11-23T22:23:17+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-4890-0b25"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-96296", "cvss": {}, "cvss_score": 8.2, "cvss_vector": "", "cwe": "CWE-306", "description": "Apache Texera（Incubating）是 Apache 软件基金会孵化中的开源可视化数据科学工作流平台，用于编排数据处理流程并保存工作流执行结果。\n受影响版本中，Jersey 将后端挂载在 /api/*，UserQuotaResource.deleteCollection 暴露 DELETE /api/quota/deleteCollection/{eid}。该方法未声明 @Auth 或 @RolesAllowed，只接收路径参数 eid，并调用 deleteExecutionCollection，再由 WorkflowExecutionsResource.removeAllExecutionFiles 按 eid 删除 WORKFLOW_EXECUTIONS 记录，并清空对应的执行结果、运行统计和控制台日志。能够访问实例的未认证调用者可删除任意工作流执行结果。\n修复版本中通过为 UserQuotaResource 及其 deleteCollection 增加 REGULAR 与 ADMIN 的 @RolesAllowed，要求 @Auth 注入 SessionUser，并在删除前调用 validateUserCanAccessExecutions 校验调用者对目标执行的写权限，未认证或无写权限的请求无法删除执行结果。", "effects": [{"comp_name": "texera", "ecosystem": "linux", "versions": [{"affected_version": "[1.1.0-incubating,1.3.0-incubating)", "min_fixed_version": "1.3.0-incubating", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "关键功能的认证机制缺失", "kind_en": "缺少关键功能的身份验证", "last_modified_time": "2026-11-24", "level": "High", "mps_id": "MPS-034a-1a3a", "poc": false, "poc_url": [], "published_time": "2026-11-24", "reference_url_list": [{"url": "http://www.mail-archive.com/announce@apache.org/msg12781.html", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-96296", "name": ""}, {"url": "https://texera.apache.org", "name": ""}, {"url": "https://texera.apache.org/releases/1.3.0-incubating/", "name": ""}, {"url": "https://github.com/apache/texera/pull/9275", "name": ""}, {"url": "https://github.com/apache/texera/commit/19699e3c4b1b616729eb67e9ad126726b3cda0cb", "name": ""}, {"url": "https://github.com/apache/texera/commit/f373a1f8bd05911ffa2840d68e994095f1fcf35e", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Texera执行记录未授权删除", "_translated": true, "_saved_at": "2026-11-23T22:23:15+00:00", "_first_saved_at": "2026-11-23T22:23:15+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-034a-1a3a"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者 .mail-archive.com/announce@apache.org/msg12779.html", "name": ""}, {"url": "https://www.mail-archive.com/announce@apache.org/msg12779.html", "name": ""}, {"url": "https://texera.apache.org", "name": ""}, {"url": "https://texera.apache.org/releases/1.3.0-incubating/", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-96353", "name": ""}, {"url": "https://github.com/apache/texera/pull/9284", "name": ""}, {"url": "https://github.com/apache/texera/commit/e70bbbf838eda11d34f287a9d83f5fa97059041f", "name": ""}, {"url": "https://github.com/apache/texera/pull/7464", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Texera项目接口越权", "_translated": true, "_saved_at": "2026-11-23T22:23:16+00:00", "_first_saved_at": "2026-11-23T22:23:16+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-e80d-1466"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-82303", "cvss": {"cvssv31": [{"source": "security@elastic.co", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "cwe": "CWE-126", "description": "Elasticsearch 是 Elastic 开源的分布式搜索与分析引擎，基于 Java 实现，通过节点间传输协议在集群节点与远程集群之间交换请求和响应数据。\n受影响版本中，传输层 LZ4 解压组件 Lz4TransportDecompressor 的 decodeBlock 方法处理压缩块时，将入站网络缓冲区的完整底层数组交给 LZ4 解压器，未以块头声明的 compressedLength 作为读取上界。攻击者通过可达的传输接口提交压缩块头声明字面量长度超过其 compressedLength 的请求，解压器越过该块边界继续读取共享网络缓冲区中其他请求的残留数据，解压结果作为当前请求的负载返回，造成跨请求数据泄露；远程集群传输接口无需身份认证。\n修复版本中通过将解压器源数据封装为按 compressedLength 截取的 ByteBuffer 并校验实际读取字节数等于声明长度，不满足时抛出 IllegalStateException 拒绝该压缩块，阻断对共享缓冲区的越界读取，修复随 8.19.24、9.4.9、9.5.6 版本发布。", "effects": [{"comp_name": "elasticsearch", "ecosystem": "linux", "versions": [{"affected_version": "[8.0.0,8.19.24)", "min_fixed_version": "8.19.24", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[9.0.0,9.4.9)", "min_fixed_version": "9.4.9", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[7.14.0,7.17.29]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[9.5.0,9.5.6)", "min_fixed_version": "9.5.6", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "缓冲区上溢读取", "kind_en": "缓冲区超读", "last_modified_time": "2026-11-24", "level": "High", "mps_id": "MPS-8zns-7hcr", "poc": false, "poc_url": [], "published_time": "2026-11-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-8zns-7hcr", "name": "https://www.oscs1024.com/hd/MPS-8zns-7hcr"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-82303", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-82303"}, {"url": "https://discuss.elastic.co/t/391840", "name": ""}], "scope_influence": "", "tags": ["应用软件", "数据库"], "title": "Elasticsearch LZ4传输解压越界读取漏洞", "_translated": true, "_saved_at": "2026-11-23T22:23:18+00:00", "_first_saved_at": "2026-11-23T22:23:18+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-8zns-7hcr"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-129243", "cvss": {}, "cvss_score": 8.8, "cvss_vector": "", "cwe": "CWE-863", "description": "GeoServer 是开源 Java 地理空间数据服务器，gs-ows 模块中的 Dispatcher 负责解析并分发 WMS、WFS 等 OGC Web 服务请求。\n受影响版本中，Dispatcher.findService 在选择服务实现前会截去服务标识里第一个斜杠及其之前的前缀，但 Request.service 仍保存请求中的原始服务名。OperationSecurityCallback.operationDispatched 用该原始值匹配 security/services.properties 中的服务安全规则，名称不能命中时规则不会生效。默认配置只允许管理员调用 wfs.CreateStoredQuery 和 wfs.DropStoredQuery，未认证请求使用带前缀的服务名可以创建或删除 WFS 存储查询。图层与数据安全规则仍然生效。\n修复版本中通过在 Dispatcher.service 解析出实际服务后，将 Request.service 改写为 serviceDescriptor.getId()，使后续服务安全检查按实际执行的服务标识匹配规则，带前缀的服务名不能再绕过默认的存储查询权限限制。", "effects": [{"comp_name": "geoserver", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.27.7)", "min_fixed_version": "2.27.7", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[2.28.0,2.28.6)", "min_fixed_version": "2.28.6", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[3.0.0,3.0.2)", "min_fixed_version": "3.0.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "org.geoserver:gs-ows", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,2.27.7)", "min_fixed_version": "2.27.7", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[2.28.0,2.28.6)", "min_fixed_version": "2.28.6", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[3.0.0,3.0.2)", "min_fixed_version": "3.0.2", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-11-25", "level": "High", "mps_id": "MPS-8081-8bc7", "poc": false, "poc_url": [], "published_time": "2026-11-25", "reference_url_list": [{"url": "https://github.com/geoserver/geoserver/security/advisories/GHSA-rv5g-g2r9-58rj", "name": ""}, {"url": "https://geoserver.org/vulnerability/2026/11/23/cve-update.html", "name": ""}, {"url": "https://osgeo-org.atlassian.net/browse/GEOS-12195", "name": ""}, {"url": "https://github.com/geoserver/geoserver/pull/9922", "name": ""}, {"url": "https://github.com/geoserver/geoserver/commit/e5a79f69fc6d3375fc562ca89799a01796b58e9c", "name": ""}, {"url": "https://github.com/geoserver/geoserver/commit/a43218e551a45a9b103030b13553b3f8293813fe", "name": ""}, {"url": "https://github.com/geoserver/geoserver/commit/9a6169e6c0c96dcdd49c5566ad0e00852095548e", "name": ""}, {"url": "https://github.com/geoserver/geoserver/commit/d116fc8a171233b03468be17e88a76c83cfd5132", "name": ""}, {"url": "https://docs.geoserver.org/stable/en/user/security/service/", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "GeoServer服务授权绕过", "_translated": true, "_saved_at": "2026-11-25T02:53:54+00:00", "_first_saved_at": "2026-11-25T02:53:54+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-8081-8bc7"}, {"analysis_status": 0, "articles": [{"content": "跨站点请求伪造 (CSRF)通过利用网站对用户请求的信任进行攻击。当用户在网站A登录并在同一浏览器会话中访问网站B时，攻击者可以构造特制的请求并诱使用户执行，以使网站B误以为这些请求是用户合法发起的。\n攻击者通常通过欺骗用户点击恶意链接、在受信任的网站中植入恶意代码或通过钓鱼等手段来实施CSRF攻击，一旦用户执行了恶意请求，攻击者可以以用户的身份执行任意操作，包括更改用户密码、发起资金转账或删除重要数据等。", "title": "什么是CSRF"}, {"content": "- 链接欺骗：攻击者通过向用户发送包含恶意链接的电子邮件或社交媒体消息，诱使用户点击并执行恶意请求。\n- 图片引用攻击：攻击者通过在恶意网站上包含指向目标网站的图片引用，以触发用户浏览器自动发送目标网站的请求。\n- XSS利用：如果目标网站存在XSS漏洞，攻击者可以注入恶意脚本，以使用户在浏览器中执行恶意请求。", "title": "CSRF常见的攻击方式"}, {"content": "- 随机令牌：网站可以在每个请求中包含一个随机生成的令牌（CSRF Token），并验证该令牌的有效性，以确认请求的来源是合法的。\n- SameSite Cookie：使用SameSite属性来限制跨站点请求，将Cookie的发送限制在同一站点上，减少了跨站请求伪造的风险。\n- 双重验证：对于敏感操作，网站可以要求用户进行额外的验证，例如输入验证码、提供第二个因素的身份验证等。\n- 强化浏览器策略：网站可以设置Content-Security-Policy（CSP）头，限制浏览器执行恶意脚本的能力，减少CSRF攻击的风险。\n- 限制用户操作：网站可以要求用户在执行敏感操作之前进行明确的确认或授权，防止恶意请求被误触发。\n- 安全编码实践：开发人员应遵循安全编码实践，对用户输入进行适当的验证和过滤，防止恶意请求的注入。", "title": "如何预防CSRF"}], "cnvd_id": "", "cve_id": "CVE-2026-82359", "cvss": {}, "cvss_score": 8.8, "cvss_vector": "", "cwe": "CWE-352", "description": "Apache JSPWiki 是开源 Java Wiki 引擎，基于 Servlet 与 JSP 提供页面编辑、附件管理以及用户和权限控制。受影响发布物为 Maven 构件 org.apache.jspwiki:jspwiki-war，源码仓库为 apache/jspwiki。\n受影响版本中，3.0.0 的 jspwiki.war 没有在 WEB-INF/web.xml 注册 CsrfProtectionFilter。该过滤器只声明在 jspwiki-http-3.0.0.jar 的 META-INF/web-fragment.xml，并映射到 /*。该片段使用 Java EE 3.0 描述符，war 的 web.xml 使用 Jakarta Servlet 5.0 描述符。厂商公告确认该 CSRF 防护配置未生效，过滤器没有进入请求处理链。CsrfProtectionFilter.doFilter 不会在 POST 请求中比较参数 X-XSRF-TOKEN 与 Session.antiCsrfToken()，无效令牌也不会被重定向到 /error/Forbidden.html。已登录用户在跨站页面提交 POST 后，可以绕过同步令牌校验，执行页面删除、重命名、安装参数提交或工作流决策等状态变更。\n修复版本中通过将 CsrfProtectionFilter 及 url-pattern /* 写入 jspwiki-war 的 WEB-INF/web.xml，并删除 jspwiki-http 模块的 META-INF/web-fragment.xml，使 3.0.1 在部署时注册该过滤器。POST 请求重新进入 doFilter，令牌不匹配的请求被重定向到 /error/Forbidden.html。", "effects": [{"comp_name": "org.apache.jspwiki:jspwiki-war", "ecosystem": "maven", "versions": [{"affected_version": "[3.0.0,3.0.1)", "min_fixed_version": "3.0.1", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "CSRF", "kind_en": "跨站请求伪造 (CSRF)", "last_modified_time": "2026-11-25", "level": "High", "mps_id": "MPS-8de8-1460", "poc": false, "poc_url": [], "published_time": "2026-11-25", "reference_url_list": [{"url": "http://www.mail-archive.com/announce@apache.org/msg12814.html", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-82359", "name": ""}, {"url": "https://issues.apache.org/jira/browse/JSPWIKI-1303", "name": ""}, {"url": "https://jspwiki.apache.org/", "name": ""}, {"url": "https://github.com/apache/jspwiki/commit/96bffc7d8333dd97a190d66dc0a3371cca005bc3", "name": ""}, {"url": "https://github.com/apache/jspwiki/commit/96374c1d8f22d596ecc98a7a5bb9222683a444c2", "name": ""}, {"url": "https://github.com/apache/jspwiki/pull/526", "name": ""}, {"url": "https://repo1.maven.or : "2026-11-24T18:33:44+00:00", "_first_saved_at": "2026-11-24T18:33:44+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-1tdp-o6zy"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-82170", "cvss": {"cvssv31": [{"source": "security_alert@emc.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:N/A:N", "severity": "high", "base_score": 7.7}]}, "cvss_score": 7.7, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:N/A:N", "cwe": "CWE-918", "description": "Dell Virtual Storage Integrator（VSI）for VMware vSphere Web Client 是 Dell 提供的闭源 vCenter 插件，用于在 vSphere Client 中查看、供应、监控和管理 Dell 存储系统上的数据存储。\n受影响版本中，httpRest.js 存在服务端请求伪造缺陷。低权限远程攻击者可利用该缺陷未经授权访问内部服务，厂商评定机密性影响为高，完整性与可用性不受影响。\n修复版本中通过发布 10.12.0.0 修复 httpRest.js 的服务端请求伪造。公开资料未披露具体源码修改，厂商未提供临时缓解措施，升级后低权限远程攻击者不能再通过该缺陷未经授权访问内部服务。", "effects": [{"comp_name": "virtual_storage_integrator", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,10.12.0.0)", "min_fixed_version": "10.12.0.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SSRF", "kind_en": "服务器端请求伪造 (SSRF)", "last_modified_time": "2026-11-25", "level": "High", "mps_id": "MPS-9nvc-7h3b", "poc": false, "poc_url": [], "published_time": "2026-11-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-9nvc-7h3b", "name": "https://www.oscs1024.com/hd/MPS-9nvc-7h3b"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-82170", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-82170"}, {"url": "https://www.dell.com/support/kbdoc/en-us/000535705/dsa-2026-510-security-update-for-virtual-storage-integrator-for-vmware-vsphere-web-client-vulnerabilities", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "VSI服务端请求伪造", "_translated": true, "_saved_at": "2026-11-24T18:33:45+00:00", "_first_saved_at": "2026-11-24T18:33:45+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-9nvc-7h3b"}]}</script>
  <script>
    const payload = JSON.parse(document.getElementById("payload").textContent);
    const levelLabels = payload.level_labels || {};
    const items = payload.items || [];
    let filtered = items.slice();
    let activeId = null;

    const $ = (id) => document.getElementById(id);
    $("generatedAt").textContent = payload.generated_at || "-";
    $("retention").textContent = payload.retention_days ?? "-";
    $("cutoff").textContent = payload.cutoff_date || "-";
    $("count").textContent = String(payload.count ?? items.length);

    function levelClass(level) {
      const cn = levelLabels[level] || level || "";
      if (level === "Critical" || cn === "严重") return "crit";
      if (level === "High" || cn === "高危") return "high";
      return "other";
    }
    function levelText(level) {
      return levelLabels[level] || level || "-";
    }
    function esc(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }
    function scoreText(v) {
      if (v === null || v === undefined || v === "" || v === -1) return "-";
      return String(v);
    }

    function renderList() {
      const list = $("list");
      $("listCount").textContent = String(filtered.length);
      if (!filtered.length) {
        list.innerHTML = '<div class="empty">没有匹配项</div>';
        return;
      }
      list.innerHTML = filtered.map((it) => {
        const id = it.mps_id || it.cve_id;
        const active = id === activeId ? " active" : "";
        return `
          <button class="item${active}" data-id="${esc(id)}" type="button">
            <div class="item-top">
              <span class="cve">${esc(it.cve_id || it.mps_id || "-")}</span>
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
            </div>
            <div class="title">${esc(it.title || "-")}</div>
            <div class="item-foot">
              <span>CVSS ${esc(scoreText(it.cvss_score))}</span>
              <span>${esc(it.published_time || "-")}</span>
              ${it.poc ? "<span>POC</span>" : ""}
            </div>
          </button>`;
      }).join("");
      list.querySelectorAll(".item").forEach((btn) => {
        btn.addEventListener("click", () => selectById(btn.dataset.id));
      });
    }

    function refsHtml(it) {
      const refs = Array.isArray(it.reference_url_list) ? it.reference_url_list : [];
      const links = [];
      if (it._source_page) links.push({ url: it._source_page, name: "OSCS 详情" });
      if (it.cve_id) links.push({ url: `https://nvd.nist.gov/vuln/detail/${it.cve_id}`, name: "NVD" });
      refs.forEach((r) => {
        if (r && r.url) links.push({ url: r.url, name: r.name || r.url });
      });
      const seen = new Set();
      const uniq = [];
      for (const l of links) {
        if (seen.has(l.url)) continue;
        seen.add(l.url);
        uniq.push(l);
      }
      if (!uniq.length) return '<div class="box">无参考链接</div>';
      return `<div class="refs">${uniq.map((l) =>
        `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name || l.url)}</a>`
      ).join("")}</div>`;
    }

    function articlesHtml(it) {
      const arts = Array.isArray(it.articles) ? it.articles : [];
      if (!arts.length) return "";
      return `<div class="section"><h3>相关说明</h3>${arts.map((a) => `
        <div class="article">
          <h4>${esc(a.title || "说明")}</h4>
          <p>${esc(a.content || "")}</p>
        </div>`).join("")}</div>`;
    }

    function renderDetail(it) {
      const detail = $("detail");
      if (!it) {
        detail.innerHTML = '<div class="empty">暂无数据</div>';
        return;
      }
      const pocUrls = Array.isArray(it.poc_url) ? it.poc_url : [];
      detail.innerHTML = `
        <div class="d-head">
          <div>
            <h1 class="d-title">${esc(it.title || "-")}</h1>
            <div class="ids">
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
              <span class="chip">${esc(it.cve_id || "无 CVE")}</span>
              <span class="chip">${esc(it.mps_id || "-")}</span>
              ${it.poc ? '<span class="chip">有 POC</span>' : ""}
              ${it.exp ? '<span class="chip">有 EXP</span>' : ""}
            </div>
          </div>
          <div class="actions">
            ${it._source_page ? `<a class="btn" href="${esc(it._source_page)}" target="_blank" rel="noopener">OSCS</a>` : ""}
            ${it.cve_id ? `<a class="btn" href="https://nvd.nist.gov/vuln/detail/${esc(it.cve_id)}" target="_blank" rel="noopener">NVD</a>` : ""}
          </div>
        </div>
        <div class="grid">
          <div class="stat"><div class="k">CVSS</div><div class="v">${esc(scoreText(it.cvss_score))}</div></div>
          <div class="stat"><div class="k">向量</div><div class="v">${esc(it.cvss_vector || "-")}</div></div>
          <div class="stat"><div class="k">CWE</div><div class="v">${esc(it.cwe || "-")}</div></div>
          <div class="stat"><div class="k">类型</div><div class="v">${esc(it.kind || it.kind_en || "-")}</div></div>
          <div class="stat"><div class="k">公开</div><div class="v">${esc(it.published_time || "-")}</div></div>
          <div class="stat"><div class="k">利用成本</div><div class="v">${esc(it.exploit_requirement_cost || "-")}</div></div>
          <div class="stat"><div class="k">可利用性</div><div class="v">${esc(it.exploitability || "-")}</div></div>
          <div class="stat"><div class="k">修复建议</div><div class="v">${esc(it.fix_suggestion || "-")}</div></div>
        </div>
        <div class="section"><h3>描述</h3><div class="box">${esc(it.description || "无描述")}</div></div>
        ${it.scope_influence ? `<div class="section"><h3>影响范围</h3><div class="box">${esc(it.scope_influence)}</div></div>` : ""}
        ${pocUrls.length ? `<div class="section"><h3>POC 链接</h3><div class="refs">${pocUrls.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join("")}</div></div>` : ""}
        <div class="section"><h3>参考链接</h3>${refsHtml(it)}</div>
        ${articlesHtml(it)}
      `;
    }

    function selectById(id) {
      const it = filtered.find((x) => (x.mps_id || x.cve_id) === id) ||
                 items.find((x) => (x.mps_id || x.cve_id) === id);
      if (!it) return;
      activeId = it.mps_id || it.cve_id;
      renderList();
      renderDetail(it);
      const btn = document.querySelector(`.item[data-id="${CSS.escape(activeId)}"]`);
      if (btn) btn.scrollIntoView({ block: "nearest" });
      history.replaceState(null, "", "#" + encodeURIComponent(activeId));
    }

    function applyFilter(q) {
      const query = (q || "").trim().toLowerCase();
      filtered = !query ? items.slice() : items.filter((it) => {
        const blob = [
          it.cve_id, it.mps_id, it.title, it.kind, it.kind_en, it.cwe, it.description, it.level
        ].map((x) => String(x || "").toLowerCase()).join(" ");
        return blob.includes(query);
      });
      renderList();
      if (filtered.length) {
        const still = filtered.some((x) => (x.mps_id || x.cve_id) === activeId);
        selectById(still ? activeId : (filtered[0].mps_id || filtered[0].cve_id));
      } else {
        activeId = null;
        renderDetail(null);
      }
    }

    $("search").addEventListener("input", (e) => applyFilter(e.target.value));

    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement !== $("search")) {
        e.preventDefault();
        $("search").focus();
        return;
      }
      if (!filtered.length) return;
      const idx = filtered.findIndex((x) => (x.mps_id || x.cve_id) === activeId);
      if (e.key === "ArrowDown") {
        e.preventDefault();
        const next = filtered[Math.min(filtered.length - 1, Math.max(0, idx) + 1)];
        selectById(next.mps_id || next.cve_id);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        const prev = filtered[Math.max(0, idx - 1)];
        selectById(prev.mps_id || prev.cve_id);
      }
    });

    const hashId = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    if (hashId && items.some((x) => (x.mps_id || x.cve_id) === hashId)) {
      activeId = hashId;
      renderList();
      selectById(hashId);
    } else if (items.length) {
      selectById(items[0].mps_id || items[0].cve_id);
    } else {
      renderList();
      renderDetail(null);
    }
  </script>
</body>
</html>
