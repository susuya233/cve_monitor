bility": "中", "fix_suggestion": "建议修复", "kind": "使用基本弱点进行的认证绕过", "kind_en": "主要弱点导致身份验证绕过", "last_modified_time": "2026-09-06", "level": "High", "mps_id": "MPS-q6dx-umok", "poc": false, "poc_url": [], "published_time": "2026-09-06", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-q6dx-umok", "name": "https://www.oscs1024.com/hd/MPS-q6dx-umok"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-86207", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-86207"}, {"url": "https://documentation.n-able.com/N-central/Release_Notes/GA/Content/N-central_2026.3_HF3_Release_Notes.htm", "name": ""}, {"url": "https://me.n-able.com/s/security-advisory/aArVy0000002LUzKAM/cve202686207-authentication-bypass-leads-to-unauthorised-access-to-ncentral", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "N-central认证绕过漏洞", "_translated": true, "_saved_at": "2026-09-05T22:34:43+00:00", "_first_saved_at": "2026-09-05T20:53:43+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-q6dx-umok"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-84219", "cvss": {}, "cvss_score": 7.5, "cvss_vector": "", "cwe": "CWE-79", "description": "Kirki 是一款面向 WordPress 的 GPL 开源可视化页面构建器与主题定制器插件，站点页头、页脚和内容页由它在服务端渲染输出，并支持把文章评论作为动态内容绑定到页面元素。\n受影响版本中，Kirki 输出构建页面前会调用 HelperFunctions::decode_entities_without_creating_markup()，该函数先用区分大小写的正则 '/\u0026(?:lt|gt|#0*(?:60|62)|#[xX]0*3[ceCE]);/' 暂存角括号实体，再对其余内容执行 html_entity_decode()，未登录访客在评论中写入 \u0026LT;script\u0026GT;、\u0026#X3C; 这类大写或变体拼写时暂存正则无法命中，这些拼写被解码回字面 \u003c 与 \u003e，评论中存储的脚本在页面输出中恢复为可执行标记，并在包括管理员在内的任何查看者的浏览器会话中执行，当页头或页脚由 Kirki 搭建并展示评论时全站每个页面均受影响。\n修复版本中通过为暂存正则追加 i 修饰符使其不区分大小写，全部拼写变体在解码前统一暂存并在解码后原样还原，实体解码不再生成新的活动标记，6.3.0 同时将构建器评论查询限定为已批准状态，未批准评论不再进入渲染管线。", "effects": [{"comp_name": "kirki", "ecosystem": "linux", "versions": [{"affected_version": "[6.2.1,6.3.0)", "min_fixed_version": "6.3.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-09-06", "level": "High", "mps_id": "MPS-dk4t-07jb", "poc": false, "poc_url": [], "published_time": "2026-09-06", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-dk4t-07jb", "name": "https://www.oscs1024.com/hd/MPS-dk4t-07jb"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-84219", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-84219"}, {"url": "https://wpscan.com/vulnerability/e95bd1e3-6f61-423f-add6-519e1ca7bf66/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Kirki 未授权存储型 XSS", "_translated": true, "_saved_at": "2026-09-06T10:05:34+00:00", "_first_saved_at": "2026-09-06T10:05:34+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-dk4t-07jb"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过构造恶意的数据，将过多的数据输入到程序的缓冲区中，使得缓冲区的空间被填满，从而溢出到程序的栈 (stack) 或堆 (heap) 中，导致程序崩溃、拒绝服务、数据泄露等安全问题。\n", "title": "什么是经典缓冲区溢出"}, {"content": "| 类型        | 描述                                                         |\n| ----------- | ------------------------------------------------------------ |\n| 代码注入攻击      | 攻击者通过向程序的缓冲区输入恶意代码，从而控制程序执行流程，实现对程序操作的恶意操作。例如，攻击者可以通过向 Web 应用程序的输入框中输入恶意代码，从而执行任意的代码，破坏系统、窃取数据等。 |\n| 数据覆盖攻击      | 攻击者通过向程序的缓冲区输入过多的数据，从而覆盖程序中的重要数据或代码，实现对程序操作的恶意操作。例如，攻击者可以通过向聊天应用程序的输入框中输入过多的表情符号，从而覆盖程序中的重要数据，例如聊天消息、账号密码等。 |\n| 栈溢出攻击 | 攻击者通过向程序的栈中输入过多的数据，从而溢出到栈外部，实现对程序操作的恶意操作。例如，攻击者可以通过向游戏应用程序的输入框中输入过多的道具名称，从而覆盖程序中的重要数据，例如游戏数据、账号密码等。 |\n| 堆溢出攻击       | 攻击者通过向程序的堆中输入过多的数据，从而溢出到堆外部，实现对程序操作的恶意操作。例如，攻击者可以通过向操作系统工具的输入框中输入过多的命令，从而覆盖程序中的重要数据，例如系统文件、配置文件等。 |", "title": "经典缓冲区溢出常见的攻击方式"}, {"content": "- 输入验证：在程序输入处对输入数据进行严格的验证和过滤，确保输入数据符合预期的格式和类型，避免被攻击者注入恶意命令或数据。可以使用正则表达式、格式字符串等方式进行输入验证。\n- 输出过滤：在程序输出处对输出数据进行严格的过滤和检查，确保输出数据符合预期的格式和类型，避免被攻击者截获和篡改。可以使用安全的输出过滤库等方式进行输出过滤。\n- 使用安全的编程模型：使用安全的编程模型，例如避免使用原生的缓冲区管理函数，使用安全的框架和库来处理输入数据和执行命令，避免缓冲区溢出漏洞。\n- 数据库加密和访问控制：对于敏感数据和命令，使用加密和访问控制措施，确保只有授权用户可以访问和执行命令，避免被攻击者窃取和篡改。\n- 定期更新和升级：定期更新和升级应用程序和库的版本，确保应用程序和库的最新版本包含了最新的安全补丁和修复措施，避免安全漏洞的出现和利用。\n- 安全审计和监控：定期对系统和应用程序进行安全审计和监控，及时发现和阻止潜在的安全漏洞和攻击，确保系统和数据的安全和可靠性。", "title": "如何预防经典缓冲区溢出"}], "cnvd_id": "", "cve_id": "CVE-2026-86166", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:N/AC:L/Au:S/C:C/I:C/A:C", "severity": "high", "base_score": 9}], "cvssv31": [{"source": "cna@vuldb.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}], "cvssv4": [{"source": "cna@vuldb.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.4}]}, "cvss_score": 7.4, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-120", "description": "Tenda HG10 是腾达（Tenda）推出的 AC1200 双频 Wi-Fi xPON 光网络终端（ONT），其闭源固件内置 Boa Web 服务器，用于处理 Web 管理界面的表单请求，同一固件包同时覆盖 HG7、HG9、HG10C 等型号。\n受影响版本中，固件 bin/boa 的 formWanRedirect 表单处理函数（注册于 /boaform/formWanRedirect）通过 boaGetVar 读取 if 参数（WAN 接口名）后，未做任何长度校验即调用 strcpy 将其复制到 0x52DB70 处的固定大小缓冲区（与下一个相邻对象间隔 0x80 字节）；已登录的低权限用户通过 HTTP 请求提交超长 if 值即可越界写入相邻内存，导致 Boa 服务崩溃、设备停止响应。\n修复版本中通过，可通过将设备 Web 管理界面限制于可信内网、关闭 WAN 侧远程管理并使用强口令缓解该风险；经与官方最新固件 300002266（2026-05-27 发布）比对，formWanRedirect 中该无长度校验的 strcpy 调用仍然存在，建议关注腾达官方后续安全更新。", "effects": [{"comp_name": "HG10", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,300002266]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "经典缓冲区溢出", "kind_en": "不检查输入大小的缓冲区复制（“经典缓冲区溢出”）", "last_modified_time": "2026-09-06", "level": "High", "mps_id": "MPS-v8oy-eudz", "poc": false, "poc_url": [], "published_time": "2026-09-06", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-v8oy-eudz", "name": "https://www.oscs1024.com/hd/MPS-v8oy-eudz"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-86166", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-86166"}, {"url": "https://github.com/SunnyYANGyaya/cuicuishark-sheep-fishIOT/blob/main/Tenda/HG10/bof-formWanRedirect-if.md", "name": ""}, {"url": "https://vuldb.com/cve/CVE-2026-86166", "name": ""}, {"url": "https://vuldb.com/submit/895595", "name": ""}, {"url": "https://vuldb.com/vuln/399305", "name": ""}, {"url": "https://vuldb.com/vuln/399305/cti", "name": ""}, {"url": "https://www.tenda.com.cn/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Tenda HG10缓冲区溢出漏洞", "_translated": true, "_saved_at": "2026-09-06T05:24:55+00:00", "_first_saved_at": "2026-09-06T05:24:55+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-v8oy-eudz"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能有效地控制资源的使用，导致攻击者可以利用这个漏洞耗尽应用程序所依赖的资源。这些资源可以是计算资源（CPU、内存）、网络带宽、数据库连接或其他系统资源。攻击者可以通过发送特制的请求、恶意输入或其他方式，使应用程序消耗大量资源，导致拒绝服务或系统崩溃。", "title": "什么是拒绝服务"}, {"content": "- 消耗计算资源：攻击者可以发送计算密集型的请求，例如复杂的计算、无限循环或递归操作，以耗尽应用程序的计算资源，导致应用程序无法响应其他请求。\r\n- 消耗内存资源：攻击者可以发送大量的数据或恶意输入，以导致应用程序消耗过多的内存资源，从而使系统的可用内存耗尽，并导致应用程序崩溃或变得不可用。\r\n- 消耗网络带宽：攻击者可以发送大量的请求或大型数据包，以消耗应用程序所依赖的网络带宽。这会导致其他合法用户无法正常访问应用程序或降低系统的整体网络性能。\r\n- 消耗存储资源：攻击者可以发送大量的请求或上传大文件，以耗尽应用程序的存储资源，导致系统无法处理其他请求或存储新的数据。", "title": "拒绝服务常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对输入数据进行合理的验证和过滤，防止恶意输入导致资源消耗过高。\r\n- 实施资源限制：应用程序应该实施适当的资源限制策略，例如限制计算操作的时间或次数，限制内存使用量，限制并发连接数等，以防止资源被耗尽。\r\n- 异常处理与错误恢复：应用程序应该具备健壮的异常处理和错误恢复机制，以防止因意外错误导致资源泄漏或无法释放的情况。\r\n- 资源监控与警报：应用程序应该实施适当的资源监控和警报机制，及时发现异常的资源消耗情况，并采取相应的措施来应对。\r\n- 压力测试与性能优化：应用程序应该进行压力测试，以评估其在高负载情况下的性能，并进行必要的性能优化，以确保能够有效地处理大量请求而不耗尽资源。", "title": "如何预防拒绝服务"}], "cnvd_id": "", "cve_id": "CVE-2026-86255", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:N/A:H", "severity": "medium", "base_score": 6.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-400", "description": "wger 是一个开源的健身与体重管理平台，基于 Django 和 Django REST Framework 构建，提供训练计划、训练日志与统计分析等功能，并通过 REST API 服务 Web 与移动端客户端。\n受影响版本中，Routine 模型（wger/manager/models/routine.py）的 clean 方法仅校验 start 不晚于 end，RoutineSerializer（wger/manager/api/serializers.py）也未限制两个日期的跨度，任意注册用户可通过创建接口提交跨度达数十年的 start 与 end；routine 详情类接口处理请求时会进入 date_sequence 属性中按天推进的 while 循环，循环次数完全由用户提交的 end 决定且无上限，跨度 100 年的计划需迭代约 36525 次，每步还伴随当天槽位、条目、多种配置与训练日志的计算，单个请求即可占用工作线程数秒，反复请求会耗尽全部工作线程，使正常用户无法获得服务。\n修复版本中通过把校验迁移到序列化器层并限制计划时长来切断该链路：Routine 模型新增 MAX_DURATION_DAYS=120 的时长上限，RoutineSerializer 新增 validate 方法，对 end 早于 start 或跨度超过 120 天的提交返回校验错误，模型层原有的 clean 校验被移除并补充了对应的 API 测试，超长计划在创建阶段被直接拒绝，date_sequence 的循环上限不再受攻击者控制。", "effects": [{"comp_name": "wger", "ecosystem": "pip", "versions": [{"affected_version": "(-∞,2.6)", "min_fixed_version": "2.6", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "拒绝服务", "kind_en": "不受控制的资源消耗", "last_modified_time": "2026-09-06", "level": "High", "mps_id": "MPS-fjqi-tr79", "poc": false, "poc_url": [], "published_time": "2026-09-06", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-fjqi-tr79", "name": "https://www.oscs1024.com/hd/MPS-fjqi-tr79"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-86255", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-86255"}, {"url": "https://github.com/wger-project/wger/security/advisories/GHSA-v25j-wqcw-fvhj", "name": ""}, {"url": "https://www.vulncheck.com/advisories/wger-before-2.5-uncontrolled-resource-consumption-via-date-sequence", "name": ""}], "scope_influence": "", "tags": ["python", "开源"], "title": "wger 训练计划资源耗尽漏洞", "_translated": true, "_saved_at": "2026-09-06T13:53:36+00:00", "_first_saved_at": "2026-09-06T13:53:36+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-fjqi-tr79"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-86283", "cvss": {"cvssv4": [{"source": "5a6e4751-2f3f-4070-9419-94fb35b644e8", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-862", "description": "MISP 是一个开源的威胁情报共享平台（PHP/CakePHP 编写），用于组织间共享威胁事件、指标与归因信息，UiBeta 为其 2.5 系列提供新版界面的主题。\n受影响版本中，集合详情页控制器 CollectionsController::view() 通过 Event::fetchSimpleEvents($user, ...) 按调用者 ACL 解析集合元素，而 UiBeta 主题模板 app/View/Themed/UiBeta/Collections/view.ctp 随后仅以 ['Event.uuid' =\u003e $eventUuids] 条件对同一批元素 UUID 执行二次查询，缺失 Event::createEventConditions() 授权过滤；集合元素 UUID 由 CollectionElementsController::add() 保存时不做事件级授权校验，拥有集合查看权限的认证用户可读取无权访问事件的编号、info、日期、创建组织、全部事件标签与 galaxy cluster，形成事件边界的横向越权。\n修复版本中通过在模板内补齐调用者 ACL，以 $_me = $this-\u003eget('me') 取当前登录用户并用 Event::createEventConditions($_me) 构造授权条件、在其 AND 分支叠加 Event.uuid IN (...) 后再执行查询，同时将 attachClustersToEventIndex() 的用户参数统一为当前登录用户，未授权事件被 ACL 过滤，越权读取路径被切断。", "effects": [{"comp_name": "MISP", "ecosystem": "linux", "versions": [{"affected_version": "[2.5.41,2.5.46)", "min_fixed_version": "2.5.46", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-09-06", "level": "High", "mps_id": "MPS-ygno-tkpu", "poc": false, "poc_url": [], "published_time": "2026-09-06", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ygno-tkpu", "name": "https://www.oscs1024.com/hd/MPS-ygno-tkpu"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-86283", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-86283"}, {"url": "https://github.com/MISP/MISP/commit/44573e4a8.patch", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "MISP 集合视图越权访问漏洞", "_translated": true, "_saved_at": "2026-09-06T16:39:08+00:00", "_first_saved_at": "2026-09-06T16:39:08+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ygno-tkpu"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-19633", "cvss": {"cvssv31": [{"source": "f86ef6dc-4d3a-42ad-8f28-e6d5547a5007", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-89", "description": "PostgreSQL Anonymizer contains a vulnerability that allows unprivileged masked users to execute arbitrary code by abusing operators, domain casts, or view subqueries that carry untrusted expressions. When these objects are evaluated in the context of the extension’s masking mechanisms, the malicious code can run with elevated privileges. The issue is fixed in PostgreSQL Anonymizer 3.1.4 and later versions", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-09-07", "level": "High", "mps_id": "MPS-ycxn-i6mv", "poc": false, "poc_url": [], "published_time": "2026-09-07", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ycxn-i6mv", "name": "https://www.oscs1024.com/hd/MPS-ycxn-i6mv"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-19633", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-19633"}, {"url": "https://gitlab.com/dalibo/postgresql_anonymizer/-/issues/665", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-19633漏洞", "_translated": true, "_saved_at": "2026-09-07T23:23:31+00:00", "_first_saved_at": "2026-09-06T16:39:06+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ycxn-i6mv"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-84173", "cvss": {"cvssv4": [{"source": "emo@eclipse.org", "vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.3}]}, "cvss_score": 8.3, "cvss_vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-863", "description": "Eclipse Ankaios 是 Eclipse 基金会旗下的开源工作负载编排组件，采用 Apache-2.0 许可，面向车载高性能计算等场景管理容器化工作负载，并通过 Control Interface 向已认证工作负载提供集群状态读写能力。\n受影响版本中，agent 侧 Control Interface 授权器错误评估首段为通配符的多段 allow 规则。已认证工作负载在仅被 *.workloads.some_workload 这类作用域规则限制时，可提交 field_mask 或 update_mask 为空的 CompleteStateRequest 或 UpdateStateRequest。空 mask 会被转换成空 Path；AllowPathPattern::matches 在规则首段为 Wildcard 时跳过“规则长于请求路径则不匹配”的检查，随后 match_rule_with_path 对空路径 zip 后空循环并返回匹配成功，使该工作负载读取完整集群状态或在授权子树之外替换状态。\n修复版本中通过将跳过长度检查的条件收窄为规则仅由单独的 PathPatternSection::Wildcard 构成，使带作用域的前导通配符规则不再匹配空路径，从而阻断空 mask 请求越权读写完整集群状态。", "effects": [{"comp_name": "ankaios", "ecosystem": "linux", "versions": [{"affected_version": "[0.5.1,1.0.2)", "min_fixed_version": "1.0.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp cvss_vector": "", "cwe": "CWE-295", "description": "curl 是由 Daniel Stenberg 主导开发的开源命令行工具与 libcurl 跨平台数据传输库，广泛用于各类应用的 HTTP/HTTPS 等协议数据传输，可选用 OpenSSL 及其分支（BoringSSL、AWS-LC、LibreSSL、QuicTLS 等）作为 TLS 后端。\n受影响版本中，当应用配置 CURLOPT_PINNEDPUBLICKEY 并同时将 CURLOPT_SSL_VERIFYPEER 与 CURLOPT_SSL_VERIFYHOST 置 0 时，若服务器在 TLS 握手中不提供证书（如启用 AECDH-AES128-SHA 等匿名密码套件），lib/vtls/openssl.c 的 Curl_ossl_check_peer_cert 在获取到的服务器证书为空且两个校验开关均关闭时提前 goto out 并返回 CURLE_OK，跳过函数末尾的 ossl_check_pinned_key 公钥绑定比对，本应被拒绝的未认证连接被放行，中间人可冒充服务器完成传输。\n修复版本中通过在 Curl_ossl_check_peer_cert 中新增 pinned() 辅助函数读取当前连接的公钥绑定配置，并将无证书场景的提前放行条件收紧为对端校验全部关闭且未配置公钥绑定，配置 CURLOPT_PINNEDPUBLICKEY 而服务器未提供证书时返回 CURLE_PEER_FAILED_VERIFICATION 拒绝连接，公钥绑定在无证书握手中恢复强制执行。", "effects": [{"comp_name": "curl", "ecosystem": "linux", "versions": [{"affected_version": "[7.45.0,8.22.0)", "min_fixed_version": "8.22.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "证书验证不恰当", "kind_en": "证书验证不当", "last_modified_time": "2026-09-07", "level": "High", "mps_id": "MPS-snoa-287c", "poc": false, "poc_url": [], "published_time": "2026-09-07", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-snoa-287c", "name": "https://www.oscs1024.com/hd/MPS-snoa-287c"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-80230", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-80230"}, {"url": "https://curl.se/docs/CVE-2026-80230.html", "name": ""}, {"url": "https://curl.se/docs/CVE-2026-80230.json", "name": ""}, {"url": "https://hackerone.com/reports/3969300", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "curl 公钥绑定校验绕过漏洞", "_translated": true, "_saved_at": "2026-09-06T21:00:00+00:00", "_first_saved_at": "2026-09-06T18:48:16+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-snoa-287c"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-86347", "cvss": {"cvssv4": [{"source": "5a6e4751-2f3f-4070-9419-94fb35b644e8", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-862", "description": "MISP（Malware Information Sharing Platform）是开源威胁情报共享平台，用于收集、存储并在组织间共享安全事件与威胁指标。\n受影响版本中，ACL 列表将 templates/uploadFile 配置为通配符 *，ACLComponent::checkAccess() 会对任意已认证用户直接返回 true，绕过相邻模板管理操作所需的 perm_add 或 perm_template。低权限或只读用户可调用 TemplatesController::uploadFile()，该接口仅检查上传 size 大于 0 且 error 等于 0，随后把内容写入 app/tmp/files/，并无配额限制，重复上传会耗尽服务器磁盘空间。官方同时确认上传文件使用随机文件名、不存在路径穿越或可预测覆盖、临时目录位于 web 根目录之外且不会经 HTTP 按文件名直接回传，该问题不构成任意文件覆盖、存储型 XSS 或远程代码执行。\n修复版本中通过将 templates/uploadFile 的 ACL 从 * 改为 perm_add，使该上传入口与 populateEventFromTemplate 等消耗临时文件的操作权限一致，无 perm_add 的用户无法再写入该临时目录。", "effects": [{"comp_na , "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-86438"}, {"url": "https://github.com/laradashboard/laradashboard", "name": ""}, {"url": "https://github.com/laradashboard/laradashboard/blob/v1.3.1/app/Livewire/Marketplace/MarketplaceModuleBrowser.php#L76-L120", "name": ""}, {"url": "https://github.com/laradashboard/laradashboard/blob/v1.3.1/app/Policies/ModulePolicy.php#L32-L38", "name": ""}, {"url": "https://github.com/laradashboard/laradashboard/commit/738cc1a219ce459323ef1d09c3789075f1b8d2f2", "name": ""}, {"url": "https://github.com/laradashboard/laradashboard/releases/tag/v1.3.2", "name": ""}, {"url": "https://github.com/laradashboard/laradashboard/security/advisories/GHSA-4x9p-vg5m-vr6p", "name": ""}, {"url": "https://www.vulncheck.com/advisories/lara-dashboard-before-1.3.2-missing-authorization-in-marketplace-module-install-action", "name": ""}], "scope_influence": "", "tags": ["php", "开源"], "title": "Lara Dashboard授权绕过", "_translated": true, "_saved_at": "2026-09-07T23:23:25+00:00", "_first_saved_at": "2026-09-07T23:23:25+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-elg5-7f8u"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": ：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-80127", "cvss": {"cvssv31": [{"source": "security_alert@emc.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-78", "description": "Dell Secure Connect Gateway 是戴尔提供的企业监控与支持网关产品，以 Application 应用版和 Appliance 虚拟设备两种形态交付，用于监测戴尔服务器、存储和网络设备并采集故障遥测，源码未公开。\n受影响版本中，产品对操作系统命令所用特殊元素过滤不完整，已具备高权限且可远程访问的攻击者可将恶意内容注入操作系统命令并提升权限。\n修复版本中通过官方安全更新收紧命令参数处理，切断该命令注入路径；Application 升级至 5.36.00.00 及以上，Appliance 升级至 5.36.00.16 及以上。", "effects": [{"comp_name": "secure_connect_gateway", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,5.36.00.00)", "min_fixed_version": "5.36.00.00", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,5.36.00.16)", "min_fixed_version": "5.36.00.16", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-09-08", "level": "High", "mps_id": "MPS-xlnp-d0zk", "poc": false, "poc_url": [], "published_time": "2026-09-08", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-xlnp-d0zk", "name": "https://www.oscs1024.com/hd/MPS-xlnp-d0zk"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-80127", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-80127"}, {"url": "https://www.dell.com/support/kbdoc/en-in/000503426/dsa-2026-382-security-update-for-dell-secure-connect-gateway-virtual-edition-multiple-vulnerabilities?msockid=3021cac2195069ed3194ddad186a68f9", "name": ""}], "scope_influence": "", "tags": [], "title": "Dell SCG命令注入漏洞", "_translated": true, "_saved_at": "2026-09-07T17:02:48+00:00", "_first_saved_at": "2026-09-07T17:02:48+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-xlnp-d0zk"}]}</script>
  <script>
    const payload = JSON.parse(document.getElementById("payload").textContent);
    const levelLabels = payload.level_labels || {};
    const items = payload.items || [];
    let filtered = items.slice();
    let activeId = null;

    const $ = (id) => document.getElementById(id);
    $("generatedAt").textContent = payload.generated_at || "-";
    $("retention").textContent = payload.retention_days ?? "-";
    $("cutoff").textContent = payload.cutoff_date || "-";
    $("count").textContent = String(payload.count ?? items.length);

    function levelClass(level) {
      const cn = levelLabels[level] || level || "";
      if (level === "Critical" || cn === "严重") return "crit";
      if (level === "High" || cn === "高危") return "high";
      return "other";
    }
    function levelText(level) {
      return levelLabels[level] || level || "-";
    }
    function esc(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }
    function scoreText(v) {
      if (v === null || v === undefined || v === "" || v === -1) return "-";
      return String(v);
    }

    function renderList() {
      const list = $("list");
      $("listCount").textContent = String(filtered.length);
      if (!filtered.length) {
        list.innerHTML = '<div class="empty">没有匹配项</div>';
        return;
      }
      list.innerHTML = filtered.map((it) => {
        const id = it.mps_id || it.cve_id;
        const active = id === activeId ? " active" : "";
        return `
          <button class="item${active}" data-id="${esc(id)}" type="button">
            <div class="item-top">
              <span class="cve">${esc(it.cve_id || it.mps_id || "-")}</span>
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
            </div>
            <div class="title">${esc(it.title || "-")}</div>
            <div class="item-foot">
              <span>CVSS ${esc(scoreText(it.cvss_score))}</span>
              <span>${esc(it.published_time || "-")}</span>
              ${it.poc ? "<span>POC</span>" : ""}
            </div>
          </button>`;
      }).join("");
      list.querySelectorAll(".item").forEach((btn) => {
        btn.addEventListener("click", () => selectById(btn.dataset.id));
      });
    }

    function refsHtml(it) {
      const refs = Array.isArray(it.reference_url_list) ? it.reference_url_list : [];
      const links = [];
      if (it._source_page) links.push({ url: it._source_page, name: "OSCS 详情" });
      if (it.cve_id) links.push({ url: `https://nvd.nist.gov/vuln/detail/${it.cve_id}`, name: "NVD" });
      refs.forEach((r) => {
        if (r && r.url) links.push({ url: r.url, name: r.name || r.url });
      });
      const seen = new Set();
      const uniq = [];
      for (const l of links) {
        if (seen.has(l.url)) continue;
        seen.add(l.url);
        uniq.push(l);
      }
      if (!uniq.length) return '<div class="box">无参考链接</div>';
      return `<div class="refs">${uniq.map((l) =>
        `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name || l.url)}</a>`
      ).join("")}</div>`;
    }

    function articlesHtml(it) {
      const arts = Array.isArray(it.articles) ? it.articles : [];
      if (!arts.length) return "";
      return `<div class="section"><h3>相关说明</h3>${arts.map((a) => `
        <div class="article">
          <h4>${esc(a.title || "说明")}</h4>
          <p>${esc(a.content || "")}</p>
        </div>`).join("")}</div>`;
    }

    function renderDetail(it) {
      const detail = $("detail");
      if (!it) {
        detail.innerHTML = '<div class="empty">暂无数据</div>';
        return;
      }
      const pocUrls = Array.isArray(it.poc_url) ? it.poc_url : [];
      detail.innerHTML = `
        <div class="d-head">
          <div>
            <h1 class="d-title">${esc(it.title || "-")}</h1>
            <div class="ids">
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
              <span class="chip">${esc(it.cve_id || "无 CVE")}</span>
              <span class="chip">${esc(it.mps_id || "-")}</span>
              ${it.poc ? '<span class="chip">有 POC</span>' : ""}
              ${it.exp ? '<span class="chip">有 EXP</span>' : ""}
            </div>
          </div>
          <div class="actions">
            ${it._source_page ? `<a class="btn" href="${esc(it._source_page)}" target="_blank" rel="noopener">OSCS</a>` : ""}
            ${it.cve_id ? `<a class="btn" href="https://nvd.nist.gov/vuln/detail/${esc(it.cve_id)}" target="_blank" rel="noopener">NVD</a>` : ""}
          </div>
        </div>
        <div class="grid">
          <div class="stat"><div class="k">CVSS</div><div class="v">${esc(scoreText(it.cvss_score))}</div></div>
          <div class="stat"><div class="k">向量</div><div class="v">${esc(it.cvss_vector || "-")}</div></div>
          <div class="stat"><div class="k">CWE</div><div class="v">${esc(it.cwe || "-")}</div></div>
          <div class="stat"><div class="k">类型</div><div class="v">${esc(it.kind || it.kind_en || "-")}</div></div>
          <div class="stat"><div class="k">公开</div><div class="v">${esc(it.published_time || "-")}</div></div>
          <div class="stat"><div class="k">利用成本</div><div class="v">${esc(it.exploit_requirement_cost || "-")}</div></div>
          <div class="stat"><div class="k">可利用性</div><div class="v">${esc(it.exploitability || "-")}</div></div>
          <div class="stat"><div class="k">修复建议</div><div class="v">${esc(it.fix_suggestion || "-")}</div></div>
        </div>
        <div class="section"><h3>描述</h3><div class="box">${esc(it.description || "无描述")}</div></div>
        ${it.scope_influence ? `<div class="section"><h3>影响范围</h3><div class="box">${esc(it.scope_influence)}</div></div>` : ""}
        ${pocUrls.length ? `<div class="section"><h3>POC 链接</h3><div class="refs">${pocUrls.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join("")}</div></div>` : ""}
        <div class="section"><h3>参考链接</h3>${refsHtml(it)}</div>
        ${articlesHtml(it)}
      `;
    }

    function selectById(id) {
      const it = filtered.find((x) => (x.mps_id || x.cve_id) === id) ||
                 items.find((x) => (x.mps_id || x.cve_id) === id);
      if (!it) return;
      activeId = it.mps_id || it.cve_id;
      renderList();
      renderDetail(it);
      const btn = document.querySelector(`.item[data-id="${CSS.escape(activeId)}"]`);
      if (btn) btn.scrollIntoView({ block: "nearest" });
      history.replaceState(null, "", "#" + encodeURIComponent(activeId));
    }

    function applyFilter(q) {
      const query = (q || "").trim().toLowerCase();
      filtered = !query ? items.slice() : items.filter((it) => {
        const blob = [
          it.cve_id, it.mps_id, it.title, it.kind, it.kind_en, it.cwe, it.description, it.level
        ].map((x) => String(x || "").toLowerCase()).join(" ");
        return blob.includes(query);
      });
      renderList();
      if (filtered.length) {
        const still = filtered.some((x) => (x.mps_id || x.cve_id) === activeId);
        selectById(still ? activeId : (filtered[0].mps_id || filtered[0].cve_id));
      } else {
        activeId = null;
        renderDetail(null);
      }
    }

    $("search").addEventListener("input", (e) => applyFilter(e.target.value));

    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement !== $("search")) {
        e.preventDefault();
        $("search").focus();
        return;
      }
      if (!filtered.length) return;
      const idx = filtered.findIndex((x) => (x.mps_id || x.cve_id) === activeId);
      if (e.key === "ArrowDown") {
        e.preventDefault();
        const next = filtered[Math.min(filtered.length - 1, Math.max(0, idx) + 1)];
        selectById(next.mps_id || next.cve_id);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        const prev = filtered[Math.max(0, idx - 1)];
        selectById(prev.mps_id || prev.cve_id);
      }
    });

    const hashId = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    if (hashId && items.some((x) => (x.mps_id || x.cve_id) === hashId)) {
      activeId = hashId;
      renderList();
      selectById(hashId);
    } else if (items.length) {
      selectById(items[0].mps_id || items[0].cve_id);
    } else {
      renderList();
      renderDetail(null);
    }
  </script>
</body>
</html>
