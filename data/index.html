strict-to-same-domain-to-nested-sitemap-index-entries-allowing-server-side-request-forgery", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-72848漏洞", "_translated": true, "_saved_at": "2026-08-20T23:20:08+00:00", "_first_saved_at": "2026-08-20T23:20:08+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-enk6-3sqb"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-73267", "cvss": {"cvssv31": [{"source": "secalert@redhat.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:N/I:N/A:H", "severity": "high", "base_score": 7.7}]}, "cvss_score": 7.7, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:N/I:N/A:H", "cwe": "CWE-602", "description": "多集群引擎 (MCE) 的 clusterclaims-controller 组件中发现了一个缺陷。具有创建和删除 ClusterClaim 资源标准权限的租户可以通过操作“spec.namespace”字段来利用此漏洞。由于缺少所有权检查，这允许租户指定和删除任何 ManagedCluster，包括中心的本地集群或其他租户的集群。此漏洞可能会导致未经授权删除 ManagedClusters，从而导致拒绝服务。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "服务端安全的客户端实施", "kind_en": "服务器端安全的客户端实施", "last_modified_time": "2026-08-21", "level": "High", "mps_id": "MPS-i75r-vbgp", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-i75r-vbgp", "name": "https://www.oscs1024.com/hd/MPS-i75r-vbgp"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73267", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73267"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-73267", "name": ""}, {"url": "https://bugzilla.redhat.com/show_bug.cgi?id=2514218", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-73267漏洞", "_translated": true, "_saved_at": "2026-08-21T04:31:51+00:00", "_first_saved_at": "2026-08-21T04:31:51+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-i75r-vbgp"}, {"analysis_status": 0, "articles": [{"content": "由于应用程序或系统中存在敏感信息未经适当保护而被泄露给攻击者或未经授权的用户，这些敏感信息可能包括用户凭据、个人身份信息、敏感业务数据、系统配置信息等。信息暴露漏洞通常是由于设计、实施或配置错误引起的，例如不正确的访问控制、弱密码策略、缺乏加密、错误的日志处理等。", "title": "什么是未授权敏感信息泄露"}, {"content": "- 直接访问敏感信息：攻击者可以通过直接访问不正确配置或不受保护的资源来获取敏感信息，如通过公开可访问的URL、未经授权的文件目录访问等。\n- 越权访问：攻击者可能利用访问控制错误或不正确的权限配置来获取他们没有权限访问的敏感信息。\n- 错误信息披露：应用程序在错误处理过程中可能泄露敏感信息，例如将错误消息中的敏感数据返回给客户端或显示在日志文件中。\n- 信息泄露通过响应：攻击者可能利用应用程序在响应中不正确地包含敏感信息，如通过网页源代码、响应头部或响应消息体中的敏感数据。", "title": "未授权敏感信息泄露常见的攻击方式"}, {"content": "- 访问控制：确保只有经过授权的用户能够访问敏感信息，使用强大的身份验证和授权机制。\n- 数据加密：对于敏感信息，使用适当的加密算法对数据进行加密，包括数据传输和存储过程中的加密。\n- 错误处理和日志安全：正确处理错误情况，避免在错误消息中暴露敏感信息。同时，确保日志记录功能的安全性，避免将敏感信息记录在日志文件中。\n- 安全配置和最佳实践：遵循安全最佳实践，对应用程序、服务器和系统进行适当的配置，包括访问控制、权限管理、密码策略等。\n- 审计和监控：实施日志审计和监控机制，及时检测和响应任何异常活动或潜在的信息暴露事件。\n- 安全开发实践：在应用程序开发过程中，进行安全代码审查、漏洞扫描和安全测试，以及敏感信息的正确处理和保护。", "title": "如何预防未授权敏感信息泄露"}], "cnvd_id": "", "cve_id": "CVE-2026-73137", "cvss": {"cvssv31": [{"source": "secalert@redhat.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:N/A:N", "severity": "high", "base_score": 7.7}]}, "cvss_score": 7.7, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:N/A:N", "cwe": "CWE-200", "description": "红帽高级集群管理 (RHACM) 的 multicloud-operators-subscription 组件中发现了一个缺陷。具有 HelmRelease 创建权限的租户可以通过操纵“secretRef.Namespace”字段来利用此漏洞。这允许 HelmRelease 控制器中的 GetSecret() 函数从任何命名空间获取敏感凭据，然后将其发送到攻击者控制的 Helm 存储库。这可能导致凭证从任意命名空间 Secret 中泄露，从而导致信息泄露。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "未授权敏感信息泄露", "kind_en": "向未经授权的行为者泄露敏感信息", "last_modified_time": "2026-08-21", "level": "High", "mps_id": "MPS-o4y7-hsrp", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-o4y7-hsrp", "name": "https://www.oscs1024.com/hd/MPS-o4y7-hsrp"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73137", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73137"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-73137", "name": ""}, {"url": "https://bugzilla.redhat.com/show_bug.cgi?id=2514223", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-73137漏洞", "_translated": true, "_saved_at": "2026-08-20T22:20:17+00:00", "_first_saved_at": "2026-08-20T22:20:17+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-o4y7-hsrp"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-47877", "cvss": {}, "cvss_score": 7.6, "cvss_vector": "", "cwe": "CWE-79", "description": "Spring Security Authorization Server 是 Spring Security 提供的开源 OAuth2 / OpenID Connect 授权服务器实现，用于在 OAuth2 授权码流程中向最终用户展示客户端的授权请求并收集用户授权。\n受影响版本中，org.springframework.security.oauth2.server.authorization.web.DefaultConsentPage 类的 generateConsentPage 方法在拼接 HTML 时未对用户可控值进行 HTML 实体编码，直接将 clientId、principal.getName()、state、userCode、request.getRequestURI() 以及 requestedScopes 中的 scope 字符串拼接进 HTML 输出。攻击者可以通过构造恶意的 OAuth2 授权请求，将这些字段设置为包含 JavaScript 或 HTML 片段的值，这些值会在用户后续访问默认同意页时被原样渲染，从而触发反射型/存储型跨站脚本（XSS），可在最终用户的浏览器会话中执行任意脚本、窃取会话凭据或进行钓鱼等操作。使用自定义 consent page（通过 OAuth2AuthorizationServerConfigurer.authorizationEndpoint(c -\u003e c.consentPage(...)) 配置）的应用不受影响。\n修复版本中通过在 generateConsentPage 中引入 org.springframework.web.util.HtmlUtils.htmlEscape，对 clientId、state、principal.getName()、request.getRequestURI()、userCode 以及每个 scope 分别进行 HTML 实体编码后再拼接到 HTML 中，切断用户可控字符串直接进入响应体的路径，并新增回归测试 doFilterWhenAuthorizationRequestConsentRequiredThenConsentResponseHtmlEscaped 验证 HTML 转义已被应用。", "effects": [{"comp_name": "org.springframework.security:spring-security-oauth2-authorization-server", "ecosystem": "maven", "versions": [{"affected_version": "[7.1.0,7.1.0]", "min_fixed_version": "", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[7.0.0,7.0.6]", "min_fixed_version": "", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-08-21", "level": "High", "mps_id": "MPS-63ad-e9d1", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://spring.io/security/cve-2026-47877", "name": ""}, {"url": "https://github.com/spring-projects/spring-security/commit/ac15cdbea3f89b3b6882ff25e2a5a9a4b7b99a76", "name": ""}, {"url": "https://github.com/spring-projects/spring-security/releases/tag/7.0.7", "name": ""}, {"url": "https://nvd.nist.gov/vuln-metrics/cvss/v3-calculator?vector=AV:N/AC:L/PR:N/UI:R/S:C/C:H/I:L/A:N\u0026version=3.1", "name": ""}], "scope_influence": "", "tags": [], "title": "Spring Security Authorization Server 默认同意页跨站脚本漏洞", "_translated": true, "_saved_at": "2026-08-21T07:37:38+00:00", "_first_saved_at": "2026-08-21T06:35:32+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-63ad-e9d1"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，从而导致未授权的用户或资源可以被访问或篡改。", "title": "什么是访问控制不当"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n", "title": "访问控制不当常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防访问控制不当"}], "cnvd_id": "", "cve_id": "CVE-2026-65613", "cvss": {}, "cvss_score": 7.6, "cvss_vector": "", "cwe": "CWE-284", "description": "Apache CloudStack 是开源基础设施即服务（IaaS）云管理平台，提供计算、网络、存储资源编排和租户隔离能力，Webhook 模块用于把平台事件推送到外部 URL。\n受影响版本中，WebhookApiServiceImpl 的 listWebhookDeliveries 与 deleteWebhookDelivery 在按账号或域校验调用者可见 Webhook 之前就允许发起搜索与删除。listWebhookDeliveries 调用 webhookDeliveryJoinDao.searchAndCountByListApiParameters 时，仅在调用者显式传入 webhookId 时才用其过滤，否则直接调用 getIdsOfAccessibleWebhooks(caller) 返回 root admin 的空列表，导致非 admin 调用者提供的 webhookId 不在自身可见集时仍可越权命中其他账号下的交付记录并读取；deleteWebhookDelivery 直接把入参 webhookId 透传给 webhookDeliveryDao.deleteByDeleteApiParams，未先用 isCallerRootAdmin 与 getIdsOfAccessibleWebhooks 把可删除范围收缩到调用者自身可见的 Webhook，且 basicWebhookDeliveryApiCheck 调用时未传入 isCallerRootAdmin，跨账号交付也可被删除。\n修复版本中通过在 basicWebhookDeliveryApiCheck 增加 isCallerRootAdmin 形参并在 listWebhookDeliveries、deleteWebhookDelivery 中显式调用 accountManager.isRootAdmin 与 accountManager.isAdmin 重新判定调用者身份，把 list 与 delete 的范围限制到 getIdsOfAccessibleWebhooks 返回的可见 Webhook 集，同时把 isCallerRootAdmin 透传到 DAO 层 searchAndCountByListApiParameters 与 deleteByDeleteApiParams，避免 root admin 拿到空列表时退化为未过滤查询，切断了跨账号读取与跨账号删除路径。", "effects": [{"comp_name": "apache-cloudstack", "ecosystem": "linux", "versions": [{"affected_version": "[4.20.0.0,4.20.3.1)", "min_fixed_version": "4.20.3.1", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[4.21.0.0,4.22.1.1)", "min_fixed_version": "4.22.1.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "访问控制不当", "kind_en": "访问控制不当", "last_modified_time": "2026-08-21", "level": "High", "mps_id": "MPS-pxqk-jrd3", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-pxqk-jrd3", "name": "https://www.oscs1024.com/hd/MPS-pxqk-jrd3"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-65613", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-65613"}, {"url": "https://lists.apache.org/thread/g6cwddtjrwbh1d56wjz4cfp3fzfm4kbc", "name": ""}], "scope_influence": "", "tags": [], "title": "Apache CloudStack Webhook交付列表与删除授权绕过漏洞", "_translated": true, "_saved_at": "2026-08-21T10:23:02+00:00", "_first_saved_at": "2026-08-21T10:23:02+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-pxqk-jrd3"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-47851", "cvss": {}, "cvss_score": 7.5, "cvss_vector": "", "cwe": "CWE-674", "description": "Spring AI 是面向 AI 工程的开源 Java 框架，spring-ai-pdf-document-reader 子模块提供基于 PDF 文档目录（TOC/Outline）的段落切分能力，可与 LLM 检索增强生成管线协同摄取 PDF 资料。\n受影响版本中，ParagraphPdfDocumentReader 在解析 PDF 文档目录时调用 ParagraphManager.generateParagraphs 沿 PDOutlineNode 的 firstChild/nextSibling 链路递归生成段落树，未对递归深度或节点访问记录做任何限制。攻击者通过构造一份目录结构深度极大或条目之间存在循环引用的 PDF 文档，可在摄入线程触发 java.lang.StackOverflowError，使摄取流程异常终止并对依赖该管线检索的业务造成拒绝服务。\n修复版本中通过在 ParagraphManager.generateParagraphs 引入 REASONABLE_DEPTH（64 层）深度上限，并使用 HashSet\u003cCOSDictionary\u003e 记录已访问的 COS 对象来阻断循环引用，对扁平化方法 flatten 也同步追加深度校验，从源头切断无限递归路径并改抛 IllegalStateException 而非 StackOverflowError。", "effects": [{"comp_name": "Spring AI (product)", "ecosystem": "linux", "versions": [{"affected_version": "[2.0.0,2.0.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[1.1.0,1.1.8]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[1.0.0,1.0.9]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "org.springframework.ai:spring-ai-pdf-document-reader", "ecosystem": "maven", "versions": [{"affected_version": "[1.0.0,1.0.9]", "min_fixed_version": "", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[1.1.0,1.1.8]", "min_fixed_version": "", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[2.0.0,2.0.0]", "min_fixed_version": "", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "未经控制的递归", "kind_en": "Uncontrolled Recursion", "last_modified_time": "2026-08-21", "level": "High", "mps_id": "MPS-12d7-0d70", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://spring.io/security/cve-2026-47851", "name": ""}, {"url": "https://github.com/spring-projects/spring-ai/commit/8a1fd8ed79011f63c1d9c02fec52778416a3d2d2", "name": ""}, {"url": "https://github.com/spring-projects/spring-ai/issues/6753", "name": ""}, {"url": "https://nvd.nist.gov/vuln-metrics/cvss/v3-calculator?vector=AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H\u0026version=3.1", "name": ""}], "scope_influence": "", "tags": ["AI", "java", "开源"], "title": "Spring AI PDF Document Reader 目录树递归栈溢出漏洞", "_translated": true, "_saved_at": "2026-08-21T12:34:32+00:00", "_first_saved_at": "2026-08-21T12:34:32+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-12d7-0d70"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-16959", "cvss": {}, "cvss_score": 7.5, "cvss_vector": "", "cwe": "CWE-89", "description": "Media Library Assistant 是面向 WordPress 的开源媒体库增强插件，遵循 GPLv2+ 许可并托管于 WordPress.org 插件 SVN 仓库，主要用于扩展附件管理、媒体库查询与相册短代码。\n受影响版本中，MLAQuery::mla_query_list_table_items 入口接收用户提交的 mla_search_connector 参数后，由 _prepare_list_table_query 内部的 switch/case 直接将其写入 $clean_request，未做任何白名单校验；随后该值会作为 AND/OR 连接词拼接到搜索生成的 SQL WHERE 子句中。具有 Author 及以上权限的攻击者可构造恶意 mla_search_connector 参数，将任意 SQL 片段注入到 WordPress 数据库查询中，从而读取或篡改 wp_posts、wp_options 等表内容。\n修复版本中通过在 _prepare_list_table_query 的 switch 中新增 mla_search_connector 分支，仅当值匹配 OR 时保留 OR，否则统一规范化为 AND，使连接词被严格限制在两个常量之间，从根本上切断不可信值进入 SQL 字符串的链路。", "effects": [{"comp_name": "media-library-assistant", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,3.40)", "min_fixed_version": "3.40", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-08-21", "level": "High", "mps_id": "MPS-5yqg-f9kd", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-5yqg-f9kd", "name": "https://www.oscs1024.com/hd/MPS-5yqg-f9kd"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-16959", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-16959"}, {"url": "https://wpscan.com/vulnerability/7b13e3d3-42ee-4fe2-bb47-75bd2273f1b0/", "name": ""}], "scope_influence": "", "tags": [], "title": "Media Library Assistant SQL注入漏洞", "_translated": true, "_saved_at": "2026-08-21T08:32:41+00:00", "_first_saved_at": "2026-08-21T08:32:41+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-5yqg-f9kd"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-59279", "cvss": {}, "cvss_score": 7.5, "cvss_vector": "", "cwe": "CWE-770", "description": "Spring AI is an open-source application framework for building AI/LLM applications; its MCP module provides Model Context Protocol (MCP) server transports for integrating LLM agents with tools and data sources, and ships both a WebFlux and a WebMvc Streamable HTTP server transport provider.\n受影响版本中，MCP Streamable HTTP server transport 在 POST 请求处理方法 handlePost 收到 method 为 initialize 的 JSON-RPC 请求时，会无条件地通过 sessionFactory.startSession 创建新会话并写入 sessions 这个 ConcurrentHashMap，且默认不要求客户端认证，也没有对 sessions 容量做任何上限控制；远程攻击者可以持续发送 initialize 请求，使服务端在内存中累积无界的会话对象并最终耗尽可用内存，导致面向所有合法客户端的拒绝服务。\n修复版本中通过在 WebFluxStreamableServerTransportProvider 与 WebMvcStreamableServerTransportProvider 中引入 maxSessions 上限与会话空闲回收机制解决了该问题：构造器新增 maxSessions 与可选的 sessionIdleTimeout 参数，启动一个基于 Flux.interval 的 idleSessionScheduler 周期调用 evictIdleSessions，并新增 lastAccess 时间表 sessionLastAccessTimes；在 handlePost 创建会话前增加 if (this.sessions.size() \u003e= this.maxSessions) 检查，超限时返回 503 Service Unavailable 并以 INTERNAL_ERROR 消息 Max number of sessions reached 拒绝新增会话。", "effects": [{"comp_name": "org.springframework.ai:spring-ai-mcp", "ecosystem": "maven", "versions": [{"affected_version": "[2.0.0,2.0.0]", "min_fixed_version": "", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "不加限制或调节的资源分配", "kind_en": "不受限制或节流地分配资源", "last_modified_time": "2026-08-21", "level": "High", "mps_id": "MPS-9d85-d0a6", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://spring.io/security/cve-2026-59279", "name": ""}, {"url": "https://spring.io/security/cve-2026-59279/", "name": ""}, {"url": "https://github.com/spring-projects/spring-ai/commit/023867c80be379f53296fbb0002ac522d0d44449", "name": ""}, {"url": "https://github.com/spring-projects/spring-ai/blob/v2.0.1/mcp/transport/mcp-spring-webflux/src/main/java/org/springframework/ai/mcp/server/webflux/transport/WebFluxStreamableServerTransportProvider.java", "name": ""}, {"url": "https://github.com/spring-projects/spring-ai/blob/v2.0.1/mcp/transport/mcp-spring-webmvc/src/main/java/org/springframework/ai/mcp/server/webmvc/transport/WebMvcStreamableServerTransportProvider.java", "name": ""}, {"url": "https://github.com/spring-projects/spring-ai/releases/tag/v2.0.1", "name": ""}, {"url": "https://github.com/spring-projects/spring-ai/security/advisories", "name": ""}], "scope_influence": "", "tags": ["AI", "java", "开源"], "title": "Spring AI MCP Streamable HTTP 服务器传输无界会话分配拒绝服务", "_translated": true, "_saved_at": "2026-08-23T15:15:58+00:00", "_first_saved_at": "2026-08-21T12:34:30+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-9d85-d0a6"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-16323", "cvss": {"cvssv31": [{"source": "iletisim@usom.gov.tr", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "cwe": "CWE-698", "description": "ArchitectPanel Web Admin Panel 是 FuyaWeb Internet and Informatics Services 提供的商用 Web 管理面板，用于对网络与信息服务设备进行集中管理与维护，源代码未公开。\n受影响版本中，面板在基于重定向的访问控制路径上存在执行后重定向（Execution After Redirect，EAR）缺陷。攻击者可在未提供有效凭据的前提下，使服务端在重定向指令发出之后继续执行后续受保护逻辑，从而绕过认证并访问仅限管理员的接口与数据。\n修复版本中通过厂商安全更新收紧了认证路径在重定向后的执行控制，公开资料未披露更细粒度的源码修改，建议向厂商索取并部署 28072026 之后的修复构建。", "effects": [{"comp_name": "ArchitectPanel Web Admin Panel", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,28072026]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "重定向后执行（EAR）", "kind_en": "重定向后执行 (EAR)", "last_modified_time": "2026-08-21", "level": "High", "mps_id": "MPS-km3a-6rty", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-km3a-6rty", "name": "https://www.oscs1024.com/hd/MPS-km3a-6rty"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-16323", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-16323"}, {"url": "https://siberguvenlik.gov.tr/guvenlik-bildirimleri/detay/tr-26-0882", "name": ""}], "scope_influence": "", "tags": [], "title": "ArchitectPanel Web Admin Panel 执行后重定向（EAR）认证绕过漏洞", "_translated": true, "_saved_at": "2026-08-21T09:30:09+00:00", "_first_saved_at": "2026-08-21T09:30:09+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-km3a-6rty"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-77642", "cvss": {"cvssv31": [{"source": "cve@mitre.org", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:C/C:N/I:L/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:C/C:N/I:L/A:H", "cwe": "CWE-787", "description": "0.4.9.9 之前的 tor 在解析具有意外签名摘要类型的共识或分离签名时容易出现越界写入。对于大多数 Tor 角色来说影响很小，但对于目录权限来说影响可能很大。这是 TROVE-2026-019。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-08-21", "level": "High", "mps_id": "MPS-ognc-av43", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ognc-av43", "name": "https://www.oscs1024.com/hd/MPS-ognc-av43"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-77642", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-77642"}, {"url": "https://gitlab.torproject.org/tpo/core/tor/-/raw/tor-0.4.9.9/ChangeLog", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-77642漏洞", "_translated": true, "_saved_at": "2026-08-21T02:22:24+00:00", "_first_saved_at": "2026-08-20T23:20:00+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ognc-av43"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，从而导致未授权的用户或资源可以被访问或篡改。", "title": "什么是访问控制不当"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n", "title": "访问控制不当常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防访问控制不当"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-13736", "cvss": {}, "cvss_score": 7.5, "cvss_vector": "", "cwe": "CWE-284", "description": "NewPath WildApricotPress Add-on 是一款由 NewPath 提供的 WordPress 商业插件，用于在 WordPress 站点中集成并展示 WildApricot 成员目录，支持为成员资料字段设置 members-only 隐私标记。\n受影响版本中，插件注册的 WordPress REST 路由在处理 members-only 字段（如成员邮箱与电话）时未对当前请求强制执行 members-only 隐私判定，匿名访问者无需任何凭证即可直接调用该 REST 端点读取被配置为仅向登录成员公开的成员邮箱地址与电话号码，造成未授权个人敏感信息泄露。\n修复版本中通过在该 REST 路由的处理函数上按字段隐私配置进行权限校验，仅向具备访问权限的请求返回 members-only 字段，未登录或无权限请求不再暴露成员邮箱与电话等 PII，从而切断匿名读取受限字段的链路。", "effects": [{"comp_name": "wildapricotpress-add-on", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.0.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "访问控制不当", "kind_en": "访问控制不当", "last_modified_time": "2026-08-21", "level": "High", "mps_id": "MPS-ogrp-jv9e", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ogrp-jv9e", "name": "https://www.oscs1024.com/hd/MPS-ogrp-jv9e"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-13736", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-13736"}, {"url": "https://wpscan.com/vulnerability/97fe9780-ad69-4f36-9496-5ca9c0e2bc39/", "name": ""}], "scope_influence": "", "tags": [], "title": "NewPath WildApricotPress 插件未授权成员信息泄露漏洞", "_translated": true, "_saved_at": "2026-08-21T08:32:42+00:00", "_first_saved_at": "2026-08-21T08:32:42+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ogrp-jv9e"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-47827", "cvss": {"cvssv31": [{"source": "security@vmware.com", "vector": "CVSS:3.1/AV:A/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:A/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-78", "description": "Cloud Foundry BOSH CLI 是 Cloud Foundry 基金会发布的开源命令行工具，用于与 BOSH 部署交互，包括 SSH/SCP 到 BOSH 管理虚拟机、上传/下载 release、查看日志等。\n受影响版本中，BOSH CLI 在 Windows 平台上调用外部命令（用于 SSH/SCP 到目标虚拟机或与本地系统交互）时存在命令注入缺陷；攻击者可以通过影响传入命令行参数的字段触发任意 shell 命令执行，从而在运行 BOSH CLI 的用户主机上以当前用户权限执行任意命令。\n修复版本中通过在 BOSH CLI v7.10.10 中将构建工具链升级至 Go 1.26.7 并刷新 vendored 依赖（包括 github.com/cloudfoundry/bosh-utils、golang.org/x/crypto/ssh 等），消除了 Windows 平台上命令注入路径；用户升级到 v7.10.10 及以上即可避免该问题。", "effects": [{"comp_name": "github.com/cloudfoundry/bosh-cli", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,7.10.10)", "min_fixed_version": "7.10.10", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-08-21", "level": "High", "mps_id": "MPS-pray-6cjd", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-pray-6cjd", "name": "https://www.oscs1024.com/hd/MPS-pray-6cjd"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-47827", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-47827"}, {"url": "https://www.cloudfoundry.org/blog/cve-2026-47827-bosh-cli-powershell-injection/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "BOSH CLI Windows 命令注入漏洞", "_translated": true, "_saved_at": "2026-08-21T11:19:54+00:00", "_first_saved_at": "2026-08-21T11:19:54+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-pray-6cjd"}, {"analysis_status": 0, "articles": [], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-68745", "cvss": {}, "cvss_score": 7.4, "cvss_vector": "", "cwe": "CWE-347", "description": "Apache CloudStack 是开源 IaaS 云管理平台，使用 Java 实现，主要用于构建和管理公有云、私有云及混合云环境。\n受影响版本中，plugins/user-authenticators/saml2 模块的 SAML2LoginAPIAuthenticatorCmd.authenticate 方法在处理 SAML Response 时，签名校验守卫条件写成 idpMetadata.getSigningCertificate() != null \u0026\u0026 sig != null。当 IdP 元数据未注册签名证书而 SAML Response 仍包含 ds:Signature 元素时，整个签名校验块被静默跳过；攻击者只要再满足欺骗 IdP 的 IP 地址或在管理服务器上注册一个攻击者可控的 URL 之一，便可凭借一份携带任意虚假签名的 SAML Response 完成认证、获得合法会话，实现未授权身份绕过。同一漏洞模式在方法内层的 EncryptedAssertion 签名校验处再次出现。\n修复版本中通过将签名校验拆出为独立的 validateSAMLSignature 方法，并改为仅在 sig 为 null 时直接返回；签名存在时强制要求 IdP 已注册签名证书，无证书立即抛出 ACCOUNT_ERROR，SignatureValidator.validate 抛出 ValidationException 时同样抛出 ACCOUNT_ERROR，从根本上切断\"IdP 无签名证书即跳过验签\"的逻辑路径。", "effects": [{"comp_name": "apache-cloudstack", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,4.20.3.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,4.22.1.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "密码学签名的验证不恰当", "kind_en": "密码签名验证不当", "last_modified_time": "2026-08-21", "level": "High", "mps_id": "MPS-34k1-bvoi", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-34k1-bvoi", "name": "https://www.oscs1024.com/hd/MPS-34k1-bvoi"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-68745", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-68745"}, {"url": "https://lists.apache.org/thread/g6cwddtjrwbh1d56wjz4cfp3fzfm4kbc", "name": ""}], "scope_influence": "", "tags": [], "title": "Apache CloudStack SAML 认证绕过漏洞", "_translated": true, "_saved_at": "2026-08-21T10:23:04+00:00", "_first_saved_at": "2026-08-21T10:23:04+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-34k1-bvoi"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-47841", "cvss": {}, "cvss_score": 7.4, "cvss_vector": "", "cwe": "CWE-697", "description": "Spring Security 是开源 Java 安全框架，WebAuthn（Passkey）模块用于无密码认证。\n受影响版本中，WebAuthn 认证流程在校验 UserVerificationRequirement 时使用对象身份（==）而非 equals 比较；当应用启用分布式 HTTP 会话存储（如 Spring Session 配合 Redis、JDBC 或 Hazelcast）时，会话在反序列化后得到的 UserVerificationRequirement 实例与静态常量 REQUIRED 不是同一对象引用，恒等比较结果为 false，userVerification 校验被静默关闭。攻击者只要持有受害者的认证器设备，即可在不满足 PIN 或生物识别等用户验证要求的情况下完成 WebAuthn 认证。\n修复版本中通过将 UserVerificationRequirement 的比较方式由对象身份比较改为基于 equals 的内容比较，确保反序列化后的实例能够正确匹配 REQUIRED 常量，恢复 userVerification=REQUIRED 时的强制校验。", "effects": [{"comp_name": "org.springframework.security:spring-security-web", "ecosystem": "maven", "versions": [{"affected_version": "[7.0.0,7.0.7)", "min_fixed_version": "7.0.7", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[7.1.0,7.1.1)", "min_fixed_version": "7.1.1", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[6.5.0,6.5.12)", "min_fixed_version": "6.5.12", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[6.4.0,6.4.19)", "min_fixed_version": "6.4.19", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "不充分的比较", "kind_en": "不正确的比较", "last_modified_time": "2026-08-21", "level": "High", "mps_id": "MPS-e04f-2f84", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://spring.io/security/cve-2026-47841", "name": ""}, {"url": "https://nvd.nist.gov/vuln-metrics/cvss/v3-calculator?vector=AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:N\u0026version=3.1", "name": ""}], "scope_influence": "", "tags": [], "title": "Spring Security WebAuthn 用户验证绕过漏洞", "_translated": true, "_saved_at": "2026-08-21T06:35:37+00:00", "_first_saved_at": "2026-08-21T06:35:37+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-e04f-2f84"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-18409", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "cwe": "CWE-79", "description": "WPForms Pro 是商业 WordPress 插件，用于构建联系表单、订阅表单与其他用户提交表单，分发渠道为 WordPress 官方插件仓库与厂商官网，源码不在 GitHub 开源生态中托管。\n受影响版本中，插件对 Single Line Text 与 Paragraph Text 字段值未进行充分输入净化与输出转义。攻击者可借助插件自身注册的 wp_kses_allowed_html 过滤器把 'post' 白名单扩展为允许 iframe 元素携带 data-src 属性，而 data-src 不在 WordPress 的 URI 属性清理列表中，导致存放在 data-src 中的 javascript: URI 可绕过 kses 处理；随后在加载表单记录的页面中，由插件捆绑的管理脚本 view-entry.min.js 将 data-src 提升为 live src 属性，任何访问受污染页面的用户都会触发其中存储的 JavaScript 代码。\n修复版本中通过收紧 wp_kses_allowed_html 过滤器的扩展范围并更新 view-entry.min.js 阻止 javascript: URI 被提升为 src，从而切断存储型 XSS 链路，建议升级至官方最新版本。", "effects": [{"comp_name": "wpforms-pro", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.0.0.2]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-08-21", "level": "High", "mps_id": "MPS-5aj3-vlfh", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-5aj3-vlfh", "name": "https://www.oscs1024.com/hd/MPS-5aj3-vlfh"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-18409", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-18409"}, {"url": "https://wpforms.com/docs/how-to-view-recent-changes-to-the-wpforms-plugin-changelog/#Changelog", "name": ""}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/f26cbc41-8ed9-4dc6-a8bc-9986ecab5e6e?source=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "WPForms Pro 插件存储型 XSS 漏洞", "_translated": true, "_saved_at": "2026-08-21T05:27:01+00:00", "_first_saved_at": "2026-08-21T05:27:01+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-5aj3-vlfh"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-75796", "cvss": {}, "cvss_score": 7.2, "cvss_vector": "", "cwe": "CWE-269", "description": "AI Engine 是开源的 WordPress 插件（PHP），提供 AI 对话、内容生成、图像与 MCP（Model Context Protocol）工具等能力，源代码托管于 jordymeow/ai-engine 仓库。\n受影响版本中，labs/mcp-core.php 中 Meow_MWAI_Labs_MCP_Core::dispatch() 的 wp_create_user 与 wp_update_user 分支仅校验调用者持有 administrator 角色，未对目标账户做对象级权限检查。在 WordPress Multisite 环境下，子站点 Administrator 可通过 wp_update_user 直接修改任意账户（包括 Network Administrator）的密码或角色，并通过 wp_create_user 授予超出自身权限的角色，从而接管网络上任意账户。\n修复版本中通过在 dispatch() 的 wp_create_user 分支增加 current_user_can('create_users') 校验与目标角色在 get_editable_roles() 中的白名单校验，在 wp_update_user 分支增加 current_user_can('edit_user', $target_id) 与角色变更时的 current_user_can('promote_user') 校验，使对象级权限边界与 WordPress 后台一致，从而切断 Multisite 子站点管理员的越权提权链路。", "effects": [{"comp_name": "ai-engine", "ecosystem": "linux", "versions": [{"affected_version": "[2.8.0,3.6.1)", "min_fixed_version": "3.6.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-08-21", "level": "High", "mps_id": "MPS-gfb8-muzp", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-gfb8-muzp", "name": "https://www.oscs1024.com/hd/MPS-gfb8-muzp"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-75796", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-75796"}, {"url": "https://wpscan.com/vulnerability/919da0c7-7643-4903-9454-2fb66353f5cb/", "name": ""}], "scope_influence": "", "tags": [], "title": "AI Engine WordPress插件MCP用户工具权限提升漏洞", "_translated": true, "_saved_at": "2026-08-21T09:30:11+00:00", "_first_saved_at": "2026-08-21T08:32:36+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-gfb8-muzp"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，从而导致未授权的用户或资源可以被访问或篡改。", "title": "什么是访问控制不当"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n", "title": "访问控制不当常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防访问控制不当"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-16576", "cvss": {}, "cvss_score": 7.2, "cvss_vector": "", "cwe": "CWE-284", "description": "Dokan（dokan-lite）是一款开源的 WordPress 多商户市场解决方案插件，用于在 WooCommerce 之上提供多商户、订单、提现与商品管理能力。\n受影响版本中，AdminExtensionsController、AdminOnboardingController、SetupWizard 与 SetupWizardNoWC 四个安装/激活 WordPress.org 插件的入口仅以 manage_woocommerce 作为权限校验，而 Shop Manager 等持有 manage_woocommerce 的角色并不天然具备 install_plugins 与 activate_plugins。攻击者持有 Shop Manager 凭证向 /dokan/v1/extensions/install 提交任意插件 slug 即可写入任意插件；通过 /dokan/v1/onboarding 触发 create_onboarding，进入 install_required_plugins 后由 SetupWizard::install_plugin 调用 dokan_install_wp_org_plugin 触发后台安装并激活，实现任意代码执行。\n修复版本中通过将四条路径改为基于 install_plugins（必要时叠加 activate_plugins）的判定完成修补：AdminExtensionsController::register_routes 把 permission_callback 改为新增的 check_install_permission，仅要求 install_plugins；SetupWizard::user_can_install_plugin 同时校验 install_plugins 与 activate_plugins；AdminOnboardingController::install_required_plugins 复用该谓词跳过无权限安装；SetupWizardNoWC::install_woocommerce 在调度前调用该谓词拒绝未授权安装，关闭 Shop Manager 触发的提权链。", "effects": [{"comp_name": "dokan-lite", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,5.0.14)", "min_fixed_version": "5.0.14", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "访问控制不当", "kind_en": "访问控制不当", "last_modified_time": "2026-08-21", "level": "High", "mps_id": "MPS-nre1-i2ax", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-nre1-i2ax", "name": "https://www.oscs1024.com/hd/MPS-nre1-i2ax"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-16576", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-16576"}, {"url": "https://wpscan.com/vulnerability/ ror，再以返回记录的 report.projectId 调用 getProjectAccess 校验当前会话用户，无权限时直接抛出 TRPCForbiddenError，从而阻止越权读取；同时为 getByDashboardId、notification.createOrUpdateRule 与 share 路径补充了同类校验作为加固。", "effects": [{"comp_name": "openpanel", "ecosystem": "linux", "versions": [{"affected_version": "[2.2.0,2.3.0)", "min_fixed_version": "2.3.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "通过用户控制密钥绕过授权机制", "kind_en": "通过用户控制的密钥绕过授权", "last_modified_time": "2026-08-21", "level": "High", "mps_id": "MPS-9a5t-scix", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-9a5t-scix", "name": "https://www.oscs1024.com/hd/MPS-9a5t-scix"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-77768", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-77768"}, {"url": "https://github.com/Openpanel-dev/openpanel", "name": ""}, {"url": "https://github.com/Openpanel-dev/openpanel/blob/e8a0602cda5a4d4b463f11d298a1b078c446bf33/packages/trpc/src/routers/report.ts", "name": ""}, {"url": "https://github.com/Openpanel-dev/openpanel/commit/0a51b6805eed0b3da8376175acd5fa3d26819cb6", "name": ""}, {"url": "https://github.com/Openpanel-dev/openpanel/security/advisories/GHSA-9x7c-f87x-2243", "name": ""}, {"url": "https://www.vulncheck.com/advisories/openpanel-report-get-returns-any-report-by-identifier-without-checking-project-access", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "OpenPanel 报告读取授权绕过漏洞", "_translated": true, "_saved_at": "2026-08-21T12:34:36+00:00", "_first_saved_at": "2026-08-21T12:34:36+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-9a5t-scix"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-77769", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:N", "severi com/Openpanel-dev/openpanel", "name": ""}, {"url": "https://github.com/Openpanel-dev/openpanel/blob/e8a0602cda5a4d4b463f11d298a1b078c446bf33/packages/trpc/src/routers/report.ts", "name": ""}, {"url": "https://github.com/Openpanel-dev/openpanel/commit/0a51b6805eed0b3da8376175acd5fa3d26819cb6", "name": ""}, {"url": "https://github.com/Openpanel-dev/openpanel/security/advisories/GHSA-3q95-vc6f-vc9v", "name": ""}, {"url": "https://www.vulncheck.com/advisories/openpanel-report-list-queries-reports-by-an-unverified-dashboardid-crossing-organization-boundaries", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "OpenPanel report.list 跨组织枚举漏洞", "_translated": true, "_saved_at": "2026-08-21T12:34:33+00:00", "_first_saved_at": "2026-08-21T12:34:33+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-hcp6-f3u9"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-75115", "cvss": {"cvssv4": [{"source": "security@joomla.org", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:L/VA:L/SC:L/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7}]}, "cvss_score": 7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:L/VA:L/SC:L/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-22", "description": "YOOtheme Pro 是商业 Joomla 扩展，用于在 Joomla 站点中构建页面、表单与应用，属于闭源商业组件。\n受影响版本中，Filesystem 数据源的路径过滤逻辑未充分考虑 glob 通配语义，未授权但已认证且具备相应权限的攻击者，可构造 glob 模式绕过路径过滤读取任意文件内容。\n修复版本中通过收紧 Filesystem 数据源对路径模式的解析与判定，阻断利用 glob 通配进行的目录越界读取，使受信任权限用户只能访问预期目录下的文件。", "effects": [{"comp_name": "com_yootheme_pro", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,5.0.40]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-08-21", "level": "High", "mps_id": "MPS-3gv2-7ds5", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-3gv2-7ds5", "name": "https://www.oscs1024.com/hd/MPS-3gv2-7ds5"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-75115", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-75115"}, {"url": "https://www.yootheme.com/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "YOOtheme Pro 任意文件读取漏洞", "_translated": true, "_saved_at": "2026-08-21T15:26:41+00:00", "_first_saved_at": "2026-08-21T13:40:27+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-3gv2-7ds5"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-47879", "cvss": {}, "cvss_score": 7, "cvss_vector": "", "cwe": "CWE-22", "description": "Spring Cloud Gateway 是基于 Spring WebFlux 的开源 Java API 网关，提供路由、过滤和协议转换能力；JsonToGrpcGatewayFilterFactory 用于把 HTTP+JSON 请求转换为 gRPC 请求，需要一个 proto descriptor 资源定位。\n受影响版本中，JsonToGrpcGatewayFilterFactory 在调用 apply(Config) 构造 GatewayFilter 时，直接把 Config.protoDescriptor 透传给 resourceLoader.getResource(...) 读取 FileDescriptorSet，任何能够配置或修改 Spring Cloud Gateway 路由的攻击者都可以把 protoDescriptor 写成 file:/、http:// 等任意 Spring Resource 协议，从而读取宿主机文件或访问外部资源，造成敏感文件泄露与 SSRF。\n修复版本中通过为 JsonToGrpcGatewayFilterFactory 增加 EnvironmentAware 与 VALID_PROTO_DESCRIPTOR_PREFIXES_KEY（默认仅允许 classpath: 与 classpath*:），在 apply() 中先用 PathUtils.checkResource 校验 protoDescriptor 必须落在允许前缀内，否则抛出 IllegalArgumentException，从而切断任意 Spring Resource 加载路径。", "effects": [{"comp_name": "org.springframework.cloud:spring-cloud-gateway-server-webflux", "ecosystem": "maven", "versions": [{"affected_version": "[4.0.0,4.2.10)", "min_fixed_version": "4.2.10", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[4.3.0,4.3.6)", "min_fixed_version": "4.3.6", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[3.0.0,3.1.14)", "min_fixed_version": "3.1.14", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[5.0.0,5.0.3)", "min_fixed_version": "5.0.3", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-08-21", "level": "High", "mps_id": "MPS-8153-8373", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://spring.io/security/cve-2026-47879", "name": ""}, {"url": "https://github.com/spring-cloud/spring-cloud-gateway/commit/6c53fd1c95bad683de58614d92f6116f1a44a873", "name": ""}], "scope_influence": "", "tags": [], "title": "Spring Cloud Gateway JsonToGrpc 任意资源读取漏洞", "_translated": true, "_saved_at": "2026-08-23T15:15:58+00:00", "_first_saved_at": "2026-08-21T06:35:34+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-8153-8373"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-77584", "cvss": {"cvssv31": [{"source": "cve@mitre.org", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:L/I:H/A:L", "severity": "high", "base_score": 7}]}, "cvss_score": 7, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:L/I:H/A:L", "cwe": "CWE-821", "description": "0.4.9.10 之前的 Tor 不会拒绝到达已附加流的电路的 CONFLUX_LINK 信元。恶意客户端可以在同一电路上的 CONFLUX_LINK 之前发送 RELAY_COMMAND_BEGIN，附加一个退出流，该退出流随后将成为孤立流，在电路被释放时留下悬空的电路后向指针和释放后使用 (UAF)。这是 TROVE-2026-025。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "不正确的同步机制", "kind_en": "同步不正确", "last_modified_time": "2026-08-21", "level": "High", "mps_id": "MPS-q3yu-bkwi", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-q3yu-bkwi", "name": "https://www.oscs1024.com/hd/MPS-q3yu-bkwi"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-77584", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-77584"}, {"url": "https://gitlab.torproject.org/tpo/core/tor/-/raw/tor-0.4.9.10/ChangeLog", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-77584漏洞", "_translated": true, "_saved_at": "2026-08-20T22:20:12+00:00", "_first_saved_at": "2026-08-20T22:20:12+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-q3yu-bkwi"}, {"analysis_status": 0, "articles": [{"content": "- 命令注入是一种攻击，其目标是通过易受攻击的应用程序在主机操作系统上执行任意命令。 当应用程序将不安全的用户提供的数据（表单、cookie、HTTP 标头等）传递到系统 shell 时，就会产生缺陷。攻击者通过构造恶意的命令或数据，将其注入到程序执行的上下文中，从而绕过程序的输入验证和安全措施，实现对程序操作的恶意操作。", "title": "什么是命令注入"}, {"content": "- 文件上传：攻击者通过构造恶意的文件上传请求，将包含恶意命令的文件上传到服务器，从而利用命令注入漏洞执行恶意命令。\n- SQL 注入：攻击者通过构造恶意的 SQL 查询语句，将包含恶意命令的 SQL 语句注入到数据库中，从而执行恶意命令，窃取数据或者破坏系统。\n- 命令执行：攻击者通过在 Web 应用程序的表单提交数据中注入恶意命令，从而执行恶意命令，例如删除文件、格式化硬盘等。\n- 命令注入漏洞的旁路攻击：攻击者可以利用命令注入漏洞旁路控制程序的执行流程，从而窃取数据、破坏系统、控制程序等。\n", "title": "命令注入常见的攻击方式"}, {"content": "- 输入验证：在程序输入处对输入数据进行严格的验证和过滤，确保输入数据符合预期的格式和类型，避免被攻击者注入恶意命令。\n- 输出过滤：在程序输出处对输出数据进行严格的过滤和检查，确保输出数据符合预期的格式和类型，避免被攻击者截获和篡改。\n- 使用安全的编程模型：使用安全的编程模型，例如避免使用原生的命令执行方式，使用安全的框架和库来处理输入数据和执行命令，避免命令注入漏洞。\n- 数据库加密和访问控制：对于敏感数据和命令，使用加密和访问控制措施，确保只有授权用户可以访问和执行命令，避免被攻击者窃取和篡改。\n- 定期更新和升级：定期更新和升级应用程序和库的版本，确保应用程序和库的最新版本包含了最新的安全补丁和修复措施，避免安全漏洞的出现和利用。\n- 安全审计和监控：定期对系统和应用程序进行安全审计和监控，及时发现和阻止潜在的安全漏洞和攻击，确保系统和数据的安全和可靠性。", "title": "如何预防命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-77004", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:N/AC:L/Au:S/C:P/I:P/A:P", "severity": "medium", "base_score": 6.5}], "cvssv31": [{"source": "cna@vuldb.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:L/I:L/A:L", "severity": "high", "base_score": 7.4}], "cvssv4": [{"source": "cna@vuldb.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:L/VI:L/VA:L/SC:L/SI:L/SA:L/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "low", "base_score": 2.1}]}, "cvss_score": 2.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:L/VI:L/VA:L/SC:L/SI:L/SA:L/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-77", "description": "COMFAST CF-N1-S 是 Comfast 出品的闭源无线网络设备，固件提供基于 CGI 的 Web 管理接口，用于设备配置。\n受影响版本中，已登录管理面的攻击者可向 /cgi-bin/mbox-config?method=SET\u0026section=ptest_sn 提交 JSON 字段 sn。该路径把 sn 经 sprintf 拼入命令字符串后交给 popen 执行，可在设备上执行任意系统命令。\n修复版本中通过厂商安全固件更新切断 sn 进入 popen 的命令拼接路径；截至本报告日期，官方尚未公布修复版本与补丁细节。", "effects": [{"comp_name": "cf-n1-s", "ecosystem": "linux", "versions": [{"affected_version": "[2.6.0.1,2.6.0.1]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "命令注入", "kind_en": "命令中使用的特殊元素的不正确中和（“命令注入”）", "last_modified_time": "2026-08-21", "level": "High", "mps_id": "MPS-7o1x-gv4f", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-7o1x-gv4f", "name": "https://www.oscs1024.com/hd/MPS-7o1x-gv4f"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-77004", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-77004"}, {"url": "https://github.com/lxiansheng488-bit/-/blob/main/%E5%8E%82%E5%95%86comefast%20%20CF-N1-S%20V2.pdf", "name": ""}, {"url": "https://vuldb.com/cve/CVE-2026-77004", "name": ""}, {"url": "https://vuldb.com/submit/880584", "name": ""}, {"url": "https://vuldb.com/vuln/393623", "name": ""}, {"url": "https://vuldb.com/vuln/393623/cti", "name": ""}], "scope_influence": "", "tags": [], "title": "CF-N1-S命令注入漏洞", "_translated": true, "_saved_at": "2026-08-20T17:22:54+00:00", "_first_saved_at": "2026-08-20T17:22:54+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-7o1x-gv4f"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "cnvd_id": "", "cve_id": "CVE-2026-53527", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-269", "description": "LeafWiki 是开源的自托管 Go wiki 应用，提供 Markdown 内容管理与用户/角色管理能力。\n受影响版本中，PUT /api/users/:id 端点的 handleUpdateUser 仅通过 RequireSelfOrAdmin 中间件放行自身或管理员，但解构 JSON 后直接将 Role 字段传入 UpdateUserUseCase.Execute 并最终写回 UserService.UpdateUser，全程未校验请求者是否为管理员，使得任何已认证的低权限账号（如 viewer）都可以在更新自身用户名、邮箱的同时把 Role 改为 admin，登录态被刷成管理员。\n修复版本中通过在 handleUpdateUser 中调用 authmw.MustGetUser 取出当前请求者，并把 RequesterIsAdmin 标志传入 UpdateUserUseCase.Execute；当请求者不是管理员时不再接受请求体中的 Role、改为沿用 GetUserByID 取出的现有角色，同时把 JSON 中的 Role 字段从 binding:\"required\" 放宽为可空，从而切断普通用户自助提权的链路。", "effects": [{"comp_name": "github.com/perber/wiki", "ecosystem": "go", "versions": [{"affected_version": "[0.1.0,0.10.1)", "min_fixed_version": "0.10.1", "repository": "go", "solutions": [], "upstream": true}]}, {"comp_name": "perber:leafwiki", "ecosystem": "go", "versions": [{"affected_version": "[0.1.0,0.10.1)", "min_fixed_version": "0.10.1", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-08-22", "level": "High", "mps_id": "MPS-16xp-n0g2", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-16xp-n0g2", "name": "https://www.oscs1024.com/hd/MPS-16xp-n0g2"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-53527", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-53527"}, {"url": "https://github.com/perber/leafwiki/security/advisories/GHSA-jj4r-587p-r5h5", "name": ""}], "scope_influence": "", "tags": ["go"], "title": "LeafWiki用户更新API权限提升漏洞", "_translated": true, "_saved_at": "2026-08-21T23:17:36+00:00", "_first_saved_at": "2026-08-21T23:17:36+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-16xp-n0g2"}, {"analysis_status": 0, "articles": [{"content": "应用程序在处理用户输入时的不完善或缺乏验证机制，所以攻击者能够通过向应用程序发送恶意输入，利用应用程序对输入数据的错误处理方式来注入自己的恶意代码。这些恶意代码会被应用程序误认为是合法的指令或数据，并在执行过程中被执行。", "title": "什么是代码注入"}, {"content": "应用程序使用可执行动态代码的函数来执行用户可控的参数，当应用程序对于用户输入过滤不完全时，攻击者可以注入恶意代码并控制代码执行流程。", "title": "代码注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对所有用户输入进行验证和过滤，确保只接受预期的有效输入。这包括对输入数据进行输入长度验证、类型检查和格式验证等。\r\n- 使用参数化查询或预编译语句：对于数据库查询操作，应该使用参数化查询或预编译语句，确保输入数据不会被误认为是执行代码。\r\n- 最小特权原则：应用程序在执行操作系统命令或动态代码时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。\r\n- 安全编码实践：开发人员应该采用安全编码实践，包括避免使用eval函数、避免拼接用户输入的字符串作为代码执行等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止代码注入攻击。", "title": "如何预防代码注入"}], "cnvd_id": "", "cve_id": "CVE-2026-62675", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-94", "description": "Omnigent 是开源的 AI 代理编排框架与元控制台，使用 Apache-2.0 协议分发，可统一调度 Claude Code、Codex、Cursor、Pi 等编码代理，属于 AI / 智能体基础设施组件。\n受影响版本中，认证用户通过 multipart POST /v1/sessions 上传 agent bundle 时，omnigent/server/bundles.py 的 validate_agent_bundle 未拒绝 local_tools 中 server runtime 且 path 为点号 Python 导入路径的 callable 配置；runner 侧 omnigent/runner/tool_dispatch.py 的 _resolve_spec_callable 通过 importlib.import_module 解析该点号路径，_execute_spec_callable_tool 直接调用解析到的函数，攻击者只需将工具 path 指定为 subprocess.check_output 等模块函数，即可在 runner 进程权限下执行任意本地命令，读取 runner 文件、环境变量与凭据、影响工作区与内部服务可用性，无需管理员权限。\n修复版本中通过在 validate_agent_bundle 中新增 _is_dotted_callable_path 判定与 _reject_uploaded_callable_tools 递归扫描，禁止上传 bundle 声明 server runtime 且 path 为点号 Python 导入路径的本地 callable 工具，并在 enforce_handler_allowlist 为 True 的非信任上传路径上抛出 OmnigentError，从而切断恶意点号路径进入 importlib 解析与执行链路；本机 operator 自有 bundle 的合法 callable 能力由该信任开关托管，修复同时补齐 sub_agents 的递归扫描以避免恶意 callable 隐藏在子代理中。", "effects": [{"comp_name": "omnigent", "ecosystem": "pip", "versions": [{"affected_version": "(-∞,0.3.0)", "min_fixed_version": "0.3.0", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "代码注入", "kind_en": "代码生成控制不当（“代码注入”）", "last_modified_time": "2026-08-22", "level": "High", "mps_id": "MPS-572s-noku", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-572s-noku", "name": "https://www.oscs1024.com/hd/MPS-572s-noku"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-62675", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-62675"}, {"url": "https://github.com/omnigent-ai/omnigent/commit/1f3f398f41cbf97b905133c21e848621c21da6e0", "name": ""}, {"url": "https://github.com/omnigent-ai/omnigent/pull/1430", "name": ""}, {"url": "https://github.com/omnigent-ai/omnigent/releases/tag/v0.3.0", "name": ""}, {"url": "https://github.com/omnigent-ai/omnigent/security/advisories/GHSA-756x-9hf6-q4h4", "name": ""}], "scope_influence": "", "tags": ["AI", "python", "开源"], "title": "Omnigent Bundle上传RCE", "_translated": true, "_saved_at": "2026-08-21T19:21:17+00:00", "_first_saved_at": "2026-08-21T19:21:17+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-572s-noku"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-53528", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-23", "description": "LeafWiki 是开源的自托管 wiki 服务，使用 Go 语言实现，提供页面编辑与文件资产管理功能。\n受影响版本中，PUT /api/pages/\u003cpageID\u003e/assets/rename 端点接收的 old_filename 参数未做充分校验，被直接拼接进资产目录路径后调用 os.Rename 在文件系统层移动任意可读文件。攻击者只要持有编辑器或管理员身份，即可在服务端进程的访问权限范围内，把本地任意文件搬入页面资产目录并随后下载，造成敏感文件泄露或对应用完整性造成破坏。\n修复版本中通过在 RenameAsset 中对 oldFilename 调用 validateFilename 拒绝包含路径分隔符或 \"..\" 等穿越片段的输入，并保留对 newFilename 的 slug 校验，使文件移动严格限制在对应 page 的资产目录内。", "effects": [{"comp_name": "github.com/perber/leafwiki", "ecosystem": "go", "versions": [{"affected_version": "[v0.3.0,v0.10.1)", "min_fixed_version": "v0.10.1", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "相对路径遍历", "kind_en": "相对路径遍历", "last_modified_time": "2026-08-22", "level": "High", "mps_id": "MPS-5ji2-8teg", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-5ji2-8teg", "name": "https://www.oscs1024.com/hd/MPS-5ji2-8teg"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-53528", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-53528"}, {"url": "https://github.com/perber/leafwiki/security/advisories/GHSA-g2wp-jm5c-jqfj", "name": ""}], "scope_influence": "", "tags": ["go"], "title": "LeafWiki 资产重命名路径遍历漏洞", "_translated": true, "_saved_at": "2026-08-21T23:17:35+00:00", "_first_saved_at": "2026-08-21T23:17:35+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-5ji2-8teg"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-76789", "cvss": {}, "cvss_score": 8.8, "cvss_vector": "", "cwe": "CWE-79", "description": "Slider Hero with Video Background, Animation 是面向 WordPress 的开源滑块/横幅插件，发布于 WordPress.org 插件仓库，用于在页面中嵌入视差与粒子动画横幅。\n受影响版本中，插件在 Slider Type Change 与 Add-Slider 两个请求处理入口缺少权限与 nonce 校验：Slider Type Change 处理函数 qcld_slider_hero_change_effect 通过 wp_loaded 钩子挂载、未检查 is_admin 与 current_user_can；Add-Slider 处理函数 qcld_sliderhero_loaded_slider_callback 在 task=addslider 分支虽然判断 is_admin，但未校验 manage_options 能力与 referer nonce。任意未认证访问者可以构造 POST 请求，将恶意的滑块 type/params 写入数据库，而这些存储字段在管理员查看插件后台或前端访客加载嵌入滑块的页面时被直接回写到页面输出，未做转义，从而触发 JavaScript 执行。\n修复版本中通过在两个处理入口处分别增加 current_user_can('manage_options') 能力校验与 check_admin_referer('change_effect_action', 'slider_hero_nonce')、check_admin_referer('slider_hero_create_action') 等 nonce 校验，强制只有具备 manage_options 能力且携带合法一次性凭证的管理员请求才能修改滑块配置，从而切断未认证存储通道，并配合对输入字段的 wp_unslash / esc_attr / wp_kses_post 转义完成修复。", "effects": [{"comp_name": "slider-hero", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,9.1.3)", "min_fixed_version": "9.1.3", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-08-22", "level": "High", "mps_id": "MPS-akuw-5qcl", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-akuw-5qcl", "name": "https://www.oscs1024.com/hd/MPS-akuw-5qcl"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-76789", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-76789"}, {"url": "https://wpscan.com/vulnerability/f9f5485c-6231-492c-b214-8da87a2bf4d1/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Slider Hero 插件未授权存储型 XSS", "_translated": true, "_saved_at": "2026-08-22T11:15:27+00:00", "_first_saved_at": "2026-08-22T07:26:05+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-akuw-5qcl"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能有效地控制资源的使用，导致攻击者可以利用这个漏洞耗尽应用程序所依赖的资源。这些资源可以是计算资源（CPU、内存）、网络带宽、数据库连接或其他系统资源。攻击者可以通过发送特制的请求、恶意输入或其他方式，使应用程序消耗大量资源，导致拒绝服务或系统崩溃。", "title": "什么是拒绝服务"}, {"content": "- 消耗计算资源：攻击者可以发送计算密集型的请求，例如复杂的计算、无限循环或递归操作，以耗尽应用程序的计算资源，导致应用程序无法响应其他请求。\r\n- 消耗内存资源：攻击者可以发送大量的数据或恶意输入，以导致应用程序消耗过多的内存资源，从而使系统的可用内存耗尽，并导致应用程序崩溃或变得不可用。\r\n- 消耗网络带宽：攻击者可以发送大量的请求或大型数据包，以消耗应用程序所依赖的网络带宽。这会导致其他合法用户无法正常访问应用程序或降低系统的整体网络性能。\r\n- 消耗存储资源：攻击者可以发送大量的请求或上传大文件，以耗尽应用程序的存储资源，导致系统无法处理其他请求或存储新的数据。", "title": "拒绝服务常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对输入数据进行合理的验证和过滤，防止恶意输入导致资源消耗过高。\r\n- 实施资源限制：应用程序应该实施适当的资源限制策略，例如限制计算操作的时间或次数，限制内存使用量，限制并发连接数等，以防止资源被耗尽。\r\n- 异常处理与错误恢复：应用程序应该具备健壮的异常处理和错误恢复机制，以防止因意外错误导致资源泄漏或无法释放的情况。\r\n- 资源监控与警报：应用程序应该实施适当的资源监控和警报机制，及时发现异常的资源消耗情况，并采取相应的措施来应对。\r\n- 压力测试与性能优化：应用程序应该进行压力测试，以评估其在高负载情况下的性能，并进行必要的性能优化，以确保能够有效地处理大量请求而不耗尽资源。", "title": "如何预防拒绝服务"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-48050", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:L/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:L/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-400", "description": "Arc 是开源 Go 语言 API 网关组件,用于处理 SQL 查询和 API 请求。\n受影响版本中,internal/api/server.go 调用 app.Use(pprof.New()) 将 Go net/http/pprof 处理器无条件注册到公共 Fiber app,同时 cmd/arc/main.go 将 /debug/pprof 添加到认证中间件的 PublicPrefixes 列表,导致 auth middleware 在前缀匹配时提前返回跳过 token 检查,攻击者无需任何认证即可访问 /debug/pprof/heap 泄露内存中的 SQL 字符串、msgpack 记录、TokenInfo 缓存等敏感信息,或通过 /debug/pprof/profile?seconds=N 发起 CPU 耗尽型 DoS 攻击。\n修复版本中通过从公共 Fiber app 彻底移除 pprof 处理器,并改为通过 ARC_DEBUG_PPROF=1 opt-in 机制将 pprof 绑定到单独的 127.0.0.1:6060 监听器,同时从 PublicPrefixes 移除 /debug/pprof,并修复 PublicPrefixes 匹配器的 HasPrefix 逻辑添加锚定匹配、path.Clean 规范化和空前缀保护,切断了未授权访问路径。", "effects": [{"comp_name": "github.com/basekick-labs/arc/internal/api", "ecosystem": "go", "versions": [{"affected_version": "(-∞,v26.06.1)", "min_fixed_version": "v26.06.1", "repository": "go", "solutions": [], "upstream": true}]}, {"comp_name": "github.com/basekick-labs/arc/internal/auth", "ecosystem": "go", "versions": [{"affected_version": "(-∞,v26.06.1)", "min_fixed_version": "v26.06.1", "repository": "go", "solutions": [], "upstream": true}]}, {"comp_name": "govulncheck-vulndb", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,0.0.20260723T184607-160000.1.1)", "min_fixed_version": "0.0.20260723T184607-160000.1.1", "repository": "opensuse:leap:16.0", "solutions": [], "upstream": false}]}], "epss": 0.0009, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "拒绝服务", "kind_en": "不受控制的资源消耗", "last_modified_time": "2026-08-22", "level": "High", "mps_id": "MPS-g25d-kpc6", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://github.com/Basekick-Labs/arc/security/advisories/GHSA-j93g-rp6m-j32m", "name": ""}, {"url": "https://github.com/Basekick-Labs/arc/commit/32a4091fb949f9cf060cdd804a07f6450dc426a8", "name": ""}, {"url": "https://github.com/Basekick-Labs/arc/releases/tag/v26.06.1", "name": ""}, {"url": "https://github.com/advisories/GHSA-j93g-rp6m-j32m", "name": ""}], "scope_influence": "", "tags": ["go"], "title": "Arc pprof端点未授权访问漏洞", "_translated": true, "_saved_at": "2026-08-22T04:27:05+00:00", "_first_saved_at": "2026-08-22T00:53:26+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-g25d-kpc6"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "cnvd_id": "", "cve_id": "CVE-2026-19883", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-269", "description": "WPeMatico RSS Feed Fetcher 是面向 WordPress 的开源 RSS/Atom Feed 自动采集插件，可将订阅源内容按计划转化为文章并支持批量设置导入导出。\n受影响版本中，app/wpematico_functions.php 中的 wpematico_import_settings 函数以及 wpematico_process_actions 派发逻辑均未校验 current_user_can('manage_options')，仅依赖 is_user_logged_in 与 wpematico-tools nonce。已通过身份认证、拥有订阅者及以上权限的攻击者可向 admin-post.php 提交 wpematico-action=import_settings 与伪造的 txtsettings 文件，绕过权限检查进入 update_option 流程，对 default_role、users_can_register 等任意 WordPress 选项执行写入，从而将默认注册角色改为 administrator 并开启注册以获取管理员账户。\n修复版本中通过在 wpematico_import_settings、wpematico_export_settings、wpematico_save_danger_data、wpematico_debug_info_download、settings_save、process_button_click 等入口补齐 current_user_can('manage_options') 检查，重写 wpematico_process_actions 为 wpematico_dispatch_action 并按 action 名通过 wpematico_get_action_capability 分发能力要求，同时收紧 wpematico_import_settings 只允许导入属于 WPeMatico 自身及已激活 add-on 的选项键，从根本上切断订阅者向任意 WordPress 选项写入数据的提权链路。", "effects": [{"comp_name": "wpematico", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.8.25)", "min_fixed_version": "2.8.25", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-08-22", "level": "High", "mps_id": "MPS-nqov-cltk", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-nqov-cltk", "name": "https://www.oscs1024.com/hd/MPS-nqov-cltk"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-19883", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-19883"}, {"url": "https://github.com/etruel/wp :X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-1285", "description": "ratex-parser 在解析包含多字节 UTF-8 分隔符的 \\verb 命令时由于按字节下标切片触发 \"byte index is not a char boundary\" panic，且 release profile 设置 panic=\"abort\" 导致单个恶意输入即可终止整个进程，对所有渲染不可信 LaTeX 的服务构成拒绝服务风险。\n受影响版本中，crates.io 上的 crate ratex-parser 在 \u003c 0.1.11 的发布版本中，crates/ratex-parser/src/parser.rs 的 parse_symbol_inner 函数对 \\verb 参数先以 arg.starts_with('*') 与 \u0026arg[1..] 处理星号、再以 arg[1..arg.len() - 1] 按字节切片除去首尾分隔符，当分隔符为多字节字符（如 é = U+00E9，字节序列 C3 A9）时索引 1 落入多字节字符内部，越过 Rust 的 char boundary 校验后 panic，借 panic=abort 终止进程。\n修复版本中通过 0.1.11 发布的 commit 56bfa62b1d3b4691cc311d0a0758ad80b895af72 将 \\verb 参数先以 stripped.strip_prefix('*') 安全识别星号并收集为 Vec\u003cchar\u003e，再按字符下标 chars[1..chars.len() - 1] 切片得到 body，从根因上消除字节切片在多字节字符上发生 panic 的路径，并新增 ASCII 与多字节分隔符相关的正反向测试覆盖 \\verbéxé 等场景。", "effects": [{"comp_name": "crates.io:ratex-parser", "ecosystem": "cargo", "versions": [{"affected_version": "[0.0.0,0.1.11)", "min_fixed_version": "0.1.11", "repository": "cargo", "solutions": [], "upstream": true}]}, {"comp_name": "ratex-parser", "ecosystem": "cargo", "versions": [{"affected_version": "(-∞,0.1.11)", "min_fixed_version": "0.1.11", "repository": "cargo", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "输入中指定索引、位置或偏移的验证不当", "kind_en": "输入中指定索引、位置或偏移量的验证不正确", "last_modified_time": "2026-08-22", "level": "High", "mps_id": "MPS-1hb8-g75v", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://github.com/erweixin/RaTeX/security/advisories/GHSA-4hgp-59h5-gvrj", "name": ""}, {"url": "https://github.com/advisories/GHSA-4hgp-59h5-gvrj", "name": ""}], "scope_influence": "", "tags": [], "title": "ratex-parser 多字节 UTF-8 字符串切片导致拒绝服务漏洞", "_translated": true, "_saved_at": "2026-08-21T23:17:33+00:00", "_first_saved_at": "2026-08-21T23:17:33+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-1hb8-g75v"}, {"analysis_status": 0, "articles": [], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-77354", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-789", "description": "kin-openapi 是开源 Go 语言库，用于解析与校验 OpenAPI 3 规范定义的 HTTP 接口，是 Go 生态中常见的 OpenAPI 处理组件。\n受影响版本中，openapi3filter 在解码 style 为 deepObject 的查询参数时，先把攻击者控制的稀疏下标（来自形如 param[items][N]=x 的查询字符串）收集到 map[string]any，再调用 req_resp_decoder.go 中的 sliceMapToSlice 按最大下标 N 分配长度为 N+1 的稠密 []any；随后 buildResObj 又分配同样长度的第二份 []any。该分配在 schema 校验之前完成，因此即便 spec 声明 maxItems 也无法阻止。因此，未认证客户端仅需发送类似 ?param[items][50000000]=x 的 24 字节请求，就可迫使目标进程进行数 GB 级别堆分配，引发 OOM kill 或重启循环。\n修复版本中通过在 req_resp_decoder.go 中对从 deepObject 查询参数派生的整数下标加上可配置的硬上限（仅当 N 超过该上限时拒绝解码），切断了 max 与分配长度之间的无界传导，并使 schema 校验（含 maxItems）能在解码阶段前生效，从而阻止利用极小请求放大出数 GB 堆内存的链路。建议升级到 0.142.0 及以上版本。", "effects": [{"comp_name": "github.com/getkin/kin-openapi", "ecosystem": "go", "versions": [{"affected_version": "[0.124.0,0.142.0)", "min_fixed_version": "0.142.0", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "未经控制的内存分配", "kind_en": "大小值过大的内存分配", "last_modified_time": "2026-08-22", "level": "High", "mps_id": "MPS-45cv-jp2x", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://github.com/getkin/kin-openapi/security/advisories/GHSA-xhj3-7xw9-vr34", "name": ""}, {"url": "https://gith
