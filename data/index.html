 "title": "Incus 迁移实例配置覆盖权限绕过漏洞", "_translated": true, "_saved_at": "2026-08-21T16:25:19+00:00", "_first_saved_at": "2026-08-21T16:25:19+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-7604-vo5r"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-63343", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.9}]}, "cvss_score": 9.9, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "cwe": "CWE-73", "description": "Incus 是开源的系统容器与虚拟机管理器，由 Linux Containers 社区维护并以 Apache-2.0 协议在 GitHub（lxc/incus）发布，核心守护进程 incusd 通过 REST API 提供实例生命周期、镜像、存储、网络与实例元数据等能力。\n受影响版本中，攻击者可在上传的容器镜像根目录中放置名为 metadata.yaml 的符号链接，使其指向宿主上的任意路径。已认证的 Incus 用户启动基于该镜像的实例后，incusd 在处理实例元数据接口 PUT /1.0/instances/{name}/metadata 与 GET /1.0/instances/{name}/metadata 时，会通过 filepath.Join(inst.Path(), \"metadata.yaml\") 计算路径并使用 os.Open / os.WriteFile 直接操作该文件，没有先用 Lstat 拒绝符号链接，也没有用 os.OpenRoot 将其限定在实例根目录之内，导致符号链接被跟随，incusd 以 root 身份对宿主任意路径完成任意文件读或写。\n修复版本中通过将 cmd/incusd/instance_metadata.go 中 instanceMetadataGet、instanceMetadataPatch 与 doInstanceMetadataUpdate 对 metadata.yaml 的访问全部替换为基于 os.OpenRoot(inst.Path()) 的 root.Open(\"metadata.yaml\") 与 root.WriteFile(...) 调用，把符号链接解析限制在实例根目录之内，从而切断了从恶意镜像元数据到宿主任意文件的路径穿越链。", "effects": [{"comp_name": "github.com/lxc/incus", "ecosystem": "go", "versions": [{"affected_version": "[0,7.3.0)", "min_fixed_version": "7.3.0", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "文件名或路径的外部可控制", "kind_en": "文件名或路径的外部控制", "last_modified_time": "2026-08-21", "level": "Critical", "mps_id": "MPS-dqhx-lc8u", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-dqhx-lc8u", "name": "https://www.oscs1024.com/hd/MPS-dqhx-lc8 组合，把写入路径严格限制在实例根目录之内并禁止跟随其中的符号链接，从而切断由镜像符号链接触发的主机任意文件写入与代码执行链路。", "effects": [{"comp_name": "incus", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,7.3.0)", "min_fixed_version": "7.3.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "UNIX符号链接跟随", "kind_en": "UNIX 符号链接 (Symlink) 以下", "last_modified_time": "2026-08-21", "level": "Critical", "mps_id": "MPS-n0yt-48lh", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-n0yt-48lh", "name": "https://www.oscs1024.com/hd/MPS-n0yt-48lh"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-63125", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-63125"}, {"url": "https://github.com/lxc/incus/security/advisories/GHSA-6rqx-22hc-qm36", "name": ""}, {"url": "https://github.com/lxc/incus/security/advisories/GHSA-6rqx-22hc-qm36", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Incus backup.yaml 符号链接主机任意写漏洞", "_translated": true, "_saved_at": "2026-08-21T16:25:25+00:00", "_first_saved_at": "2026-08-21T16:25:25+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-n0yt-48lh"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，从而导致未授权的用户或资源可以被访问或篡改。", "title": "什么是访问控制不当"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n", "title": "访问控制不当常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防访问控制不当"}], "cnvd_id": "", "cve_id": "CVE-2026-66788", "cvss": {"cvssv31": [{"source": "secalert@redhat.com 流程。", "title": "代码注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对所有用户输入进行验证和过滤，确保只接受预期的有效输入。这包括对输入数据进行输入长度验证、类型检查和格式验证等。\r\n- 使用参数化查询或预编译语句：对于数据库查询操作，应该使用参数化查询或预编译语句，确保输入数据不会被误认为是执行代码。\r\n- 最小特权原则：应用程序在执行操作系统命令或动态代码时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。\r\n- 安全编码实践：开发人员应该采用安全编码实践，包括避免使用eval函数、避免拼接用户输入的字符串作为代码执行等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止代码注入攻击。", "title": "如何预防代码注入"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-18781", "cvss": {}, "cvss_score": 9.8, "cvss_vector": "", "cwe": "CWE-94", "description": "Drag and Drop Multiple File Upload for Contact Form 7 是 WordPress 上用于为 Contact Form 7 表单提供拖拽 / 多文件上传能力的开源插件，通过 wp_ajax_nopriv_dnd_codedropz_upload 等 AJAX 动作供前端调用。\n受影响版本中，dnd_upload_cf7_upload() 在获取上传文件名后先调用 dnd_cf7_remove_icons() 去除图标字符再用 wpcf7_antiscript_file_name() 做二次净化，但黑名单扩展名的合法性校验是针对“净化前”的文件名执行，而危险扩展名与完整基名检查又只在第一次出现后即决定后续走向；未认证攻击者可借助字符剥离把受限扩展名隐藏在合法扩展名尾部、或通过 .htaccess / web.config / .user.ini 等可改写服务行为的基名绕过最终持久化检查，从而上传被服务器解析为可执行代码的文件，最终在 Web 服务器进程权限下执行任意代码。\n修复版本中通过将 wpcf7_antiscript_file_name() 移到扩展名校验之前、把黑名单字符串匹配改为精确 in_array 反向比对、新增 .htaccess / web.config / .user.ini 完整基名比对、对每次净化后的最终文件名再做一次复核，并在 dnd_cf7_not_allowed_ext() 中加入 web.config，从源头阻止任何最终名包含可执行扩展或可改写服务器配置的关键基名的上传落到磁盘。", "effects": [{"comp_name": "drag-and-drop-multiple-file-upload-contact-form-7", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.3.9.9)", "min_fixed_version": "1.3.9.9", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "代码注入", "kind_en": "代码生成控制不当（“代码注入”）", "last_modified_time": "2026-08-21", "level": "Critical", "mps_id": "MPS-u05j-alro", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-u05j-alro", "name": "https://www.oscs1024.com/hd/MPS-u05j-alro"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-18781", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-18781"}, {"url": "https://wpscan.com/vulnerability/fb59519b-80ae-48e4-a31a-71d24ded205b/", "name": ""}], "scope_influence": "", "tags": [], "title": "Contact Form 7 拖放上传插件文件名绕过导致 RCE", "_translated": true, "_saved_at": "2026-08-21T09:30:12+00:00", "_first_saved_at": "2026-08-21T08:32:39+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-u05j-alro"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-77086", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.1}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.4}]}, "cvss_score": 9.4, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-22", "description": "SiYuan 是开源的个人知识管理与笔记系统，使用 Go 编写的 kernel 服务提供 HTTP API，并通过 Bazaar 集市管理插件、主题、图标、模板与挂件等扩展。\n受影响版本中，kernel/model/bazaar.go 的 getPackageInstallPath 函数将请求参数 packageName 与基础目录通过 filepath.Join 直接拼接，未校验是否包含 ../ 等路径遍历序列，导致全部 10 个 Bazaar 安装/卸载接口（POST /api/bazaar/installBazaarPlugin、uninstallBazaarPlugin、installBazaarWidget、uninstallBazaarWidget、installBazaarIcon、uninstallBazaarIcon、installBazaarTemplate、uninstallBazaarTemplate、installBazaarTheme、uninstallBazaarTheme）在收到形如 ../../../../target 的 packageName 时，安装流程会将下载的压缩包写入任意目录，卸载流程会调用 os.RemoveAll 递归删除任意目录。\n修复版本中通过在 getPackageInstallPath 入口新增 bazaar.IsValidPackageName 包名合法性校验，并结合 gulu.File.IsSubPath 对最终路径进行容器归属校验，使 ../ 等序列在路径构造阶段即被拒绝，从而切断任意位置文件写入与任意目录递归删除链路。", "effects": [{"comp_name": "github.com/siyuan-note/siyuan/kernel", "ecosystem": "go", "versions": [{"affected_version": "(-∞,3.7.4)", "min_fixed_version": "3.7.4", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-08-21", "level": "Critical", "mps_id": "MPS-1onp-j35b", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-1onp-j35b", "name": "https://www.oscs1024.com/hd/MPS-1onp-j35b"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-77086", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-77086"}, {"url": "https://github.com/siyuan-note/siyuan/security/advisories/GHSA-wr4w-7vjm-mmx3", "name": ""}, {"url": "https://www.vulncheck.com/advisories/siyuan-before-path-traversal-via-packagename", "name": ""}], "scope_influence": "", "tags": ["go"], "title": "SiYuan Bazaar install/uninstall packageName 路径遍历漏洞", "_translated": true, "_saved_at": "2026-08-21T12:34:41+00:00", "_first_saved_at": "2026-08-21T12:34:41+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-1onp-j35b"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-76156", "cvss": {"cvssv4": [{"source": "ART@zuso.ai", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.4}]}, "cvss_score": 9.4, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-78", "description": "从 v8.3.0 到 v8.5.1，Datiphy 数据管理中心的 api 端点中的操作系统命令注入允许经过身份验证的管理员以 root 身份执行任意操作系统命令。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-08-21", "level": "Critical", "mps_id": "MPS-2gtp-8513", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-2gtp-8513", "name": "https://www.oscs1024.com/hd/MPS-2gtp-8513"}, {"url 践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-77087", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.6}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.4}]}, "cvss_score": 9.4, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-862", "description": "Paperclip是开源的AI智能体管理与编排平台，使用TypeScript/Node.js构建，提供本地与多租户部署模式，用于调度本地编码代理与远程托管代理。\n受影响版本中，Paperclip在默认的local_trusted部署模式下，server/src/middleware/auth.ts的第24-27行对所有请求自动赋予isInstanceAdmin为true的本地板级actor，且server/src/middleware/private-hostname-guard.ts仅在authenticated与private模式下启用，导致服务器完全不校验请求的Host头部。攻击者只需诱导本地运行Paperclip的开发者访问包含恶意JavaScript的网页即可触发DNS重新绑定：浏览器先连接攻击者服务器获取页面，攻击者服务器关闭后JS脚本对rebind.attacker.com:3100发起fetch请求，浏览器回退到该域名A记录中的第二个IP即127.0.0.1，到达本地Paperclip服务端；同源策略下可调用POST /api/companies/import与POST /api/agents/:id/wakeup，通过server/src/adapters/process/execute.ts中无沙箱的spawn()执行任意系统命令，实现零点击、零凭证的远程代码执行。\n修复版本中通过将privateHostnameGuard中间件对local_trusted部署模式一并启用，以仅放行Host头部匹配localhost、127.0.0.1与[::1]的请求，阻断攻击者域名的DNS重新绑定回环到本地端口，同时保持local_trusted模式下的本机开发体验。", "effects": [{"comp_name": "paperclipai", "ecosystem": "npm", "versions": [{"affected_version": "(-∞,0.3.1)", "min_fixed_version": "0.3.1", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-08-21", "level": " ithub.com/headroomlabs-ai/headroom", "name": ""}, {"url": "https://github.com/headroomlabs-ai/headroom/blob/v0.29.0/headroom/proxy/handlers/openai.py", "name": ""}, {"url": "https://github.com/headroomlabs-ai/headroom/blob/v0.36.1/headroom/proxy/identity.py", "name": ""}, {"url": "https://github.com/headroomlabs-ai/headroom/pull/2207", "name": ""}, {"url": "https://www.vulncheck.com/advisories/headroom-proxy-treats-the-client-supplied-x-headroom-user-id-header-as-an-authenticated-identity", "name": ""}], "scope_influence": "", "tags": ["AI", "python", "开源"], "title": "Headroom代理授权绕过漏洞", "_translated": true, "_saved_at": "2026-08-21T14:28:19+00:00", "_first_saved_at": "2026-08-21T13:40:30+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-bpv1-yjim"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过向受信任的数据序列化过程中添加恶意数据，从而在序列化和反序列化过程中执行恶意代码的攻击漏洞。这种漏洞通常存在于使用序列化 (serialization) 机制存储和传输数据的程序中。\n", "title": "什么是反序列化"}, {"content": "- 注入攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码注入到程序中，从而实现代码执行的目的。\n- 反射攻击：攻击者使用反射机制，在序列化过程中动态生成恶意数据，并将恶意代码注入到程序中，从而实现代码执行的目的。\n- 缓冲区溢出攻击：攻击者通过在序列化过程中向缓冲区输入恶意数据，导致缓冲区溢出，从而破坏程序的内存管理，实现代码执行的目的。\n- 格式字符串攻击：攻击者通过在序列化过程中输入恶意数据，导致程序使用错误的格式字符串，从而实现代码执行的目的。\n- 数据流攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码作为一个数据流传递给程序，从而实现代码执行的目的。\n", "title": "反序列化常见的攻击方式"}, {"content": "- 不信任输入数据：程序应该严格检查输入数据的有效性，并避免使用不受信任的数据。\n- 使用安全的序列化机制：程序应该使用安全的序列化机制，如 JSON 或 XML 序列化，而不是第三方序列化库。\n- 最小特权原则：程序应该限制对受信任数据的处理权限，并避免在运行时修改数据。\n- 代码审查和漏洞扫描：程序应该进行代码审查和漏洞扫描，以发现和修复潜在的安全漏洞。\n", "title": "如何预防反序列化"}], "cnvd_id": "", "cve_id": "CVE-2026-77645", "cvss": {"cvssv4": [{"source": "0b655efc-079c-4cb9-9e8d-164871239f4e", "vector": "CVSS:4.0/AV:N/AC:H/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:L/SI:L/SA:L/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:Y/R:U/V:C/RE:M/U:Red", "severity": "critical", "base_score": 9.2}]}, "cvss_score": 9.2, "cvss_vector": "CVSS:4.0/AV:N/AC:H/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:L/SI:L/SA:L/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:Y/R:U/V:C/RE:M/U:Red", "cwe": "CWE-502", "description": "PTC Windchill 和 PTC FlexPLM 中报告了严重的远程代码执行 (RCE) 漏洞。该漏洞可能通过不可信数据的反序列化被利用。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "反序列化", "kind_en": "不可信数据的反序列化", "last_modified_time": "2026-08-21", "level": "Critical", "mps_id": "MPS-usyg-net5", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-usyg-net5", "name": "https://www.oscs1024.com/hd/MPS-usyg-net5"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-77645", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-77645"}, {"url": "https://www.ptc.com/en/support/article/CS474826", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-77645漏洞", "_translated": true, "_saved_at": "2026-08-21T00:56:58+00:00", "_first_saved_at": "2026-08-20T23:19:55+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-usyg-net5"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-76613", "cvss": {"cvssv4": [{"source": "security@joomla.org", "vector": "CVSS:4.0/AV:N/AC:H/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.2}]}, "cvss_score": 9.2, "cvss_vector": "CVSS:4.0/AV:N/AC:H/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-89", "description": "YOOtheme Pro 是商业 Joomla 扩展，提供可视化页面构建与内容模板能力，属于闭源商业软件。\n受影响版本中，扩展在处理 contributor 级别用户可控的字段时未对 SQL 查询进行充分过滤或参数化，导致具备 contributor 权限的认证用户可在提交内容中注入 SQL 片段并被带入查询执行，造成数据库层信息泄露或篡改。\n修复版本中通过收紧对用户可控字段的 SQL 处理，使用占位符参数化或类型校验切断注入路径，使 contributor 级别的输入无法再进入危险查询上下文。", "effects": [{"comp_name": "yootheme_pro", "ecosystem": "linux", "versions": [{"affected_version": "[1.0.0,5.0.40]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-08-21", "level": "Critical", "mps_id": "MPS-yuqk-1570", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-yuqk-1570", "name": "https://www.oscs1024.com/hd/MPS-yuqk-1570"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-76613", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-76613"}, {"url": "https://www.yootheme.com/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "YOOtheme Pro SQL注入漏洞", "_translated": true, "_saved_at": "2026-08-21T15:26:40+00:00", "_first_saved_at": "2026-08-21T13:40:21+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-yuqk-1570"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-73256", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N", "severity": "critical", "base_score": 9.1}]}, "cvss_score": 9.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N", "cwe": "CWE-444", "description": "Mongoose 是一个嵌入式 Web 服务器和网络库。在 7.22 之前，未经身份验证的远程攻击者可以通过发送带有 Transfer-Encoding：分块和冲突帧的请求来利用 HTTP/1.0 反向代理部署。 src/http.c 中的 http_cb() 函数以不可能的大于八的条件测试 hm.proto.len，即使 mg_http_parse() 需要八字节协议字符串，因此永远不会设置 is_http_1_0。 Mongoose 因此会处理 HTTP/1.0 代理可以忽略的分块编码，从而实现请求走私和未经授权的访问或状态更改。此问题已在 7.22 版本中修复。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "HTTP请求走私", "kind_en": "HTTP 请求的解释不一致（“HTTP 请求/响应走私”）", "last_modified_time": "2026-08-21", "level": "Critical", "mps_id": "MPS-f1wd-upsj", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-f1wd-upsj", "name": "https://www.oscs1024.com/hd/MPS-f1wd-upsj"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73256", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73256"}, {"url": "https://github.com/cesanta/mongoose/commit/a9df523f76f43a38bd53b4232b9cfd4c16869e71", "name": ""}, {"url": "https://github.com/cesanta/mongoose/pull/3611", "name": ""}, {"url": "https://github.com/cesanta/mongoose/releases/tag/7.22", "name": ""}, {"url": "https://github.com/cesanta/mongoose/security/advisories/GHSA-mgp5-rjrv-h5j3", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-73256漏洞", "_translated": true, "_saved_at": "2026-08-20T19:25:53+00:00", "_first_saved_at": "2026-08-20T19:25:53+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-f1wd-upsj"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-73257", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N", "severity": "critical", "base_score": 9.1}]}, "cvss_score": 9.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N", "cwe": "CWE-444", "description": "Mongoose 是一个嵌入式 Web 服务器和网络库。从版本 7.22 开始，未经身份验证的远程攻击者可以发送包含 Content-Length 和 Transfer-Encoding: chunked 的 HTTP 请求。 src/http.c 中 mg_http_parse() 和 http_cb() 路径中的 cl_count 和 te_count 检查接受两个标头并优先考虑分块编码，而内容长度优先的反向代理可以使用不同的请求边界。这种 CL.TE 去同步可以注入访问或修改另一个用户上下文中的资源的请求。此问题已在 7.22 版本中修复。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "HTTP请求走私", "kind_en": "HTTP 请求的解释不一致（“HTTP 请求/响应走私”）", "last_modified_time": "2026-08-21", "level": "Critical", "mps_id": "MPS-gfa1-l2cq", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-gfa1-l2cq", "name": "https://www.oscs1024.com/hd/MPS-gfa1-l2cq"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73257", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73257"}, {"url": "https://github.com/cesanta/mongoose/commit/a9df523f76f43a38bd53b4232b9cfd4c16869e71", "name": ""}, {"url": "https://github.com/cesanta/mongoose/pull/3611", "name": ""}, {"url": "https://github.com/cesanta/mongoose/releases/tag/7.22", "name": ""}, {"url": "https://github.com/cesanta/mongoose/security/advisories/GHSA-5wfq-r6mr-wqp6", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-73257漏洞", "_translated": true, "_saved_at": "2026-08-20T19:25:51+00:00", "_first_saved_at": "2026-08-20T19:25:51+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-gfa1-l2cq"}, {"analysis_status": 0, "articles": [], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-75501", "cvss": {}, "cvss_score": 9.1, "cvss_vector": "", "cwe": "CWE-306", "description": "Calix GS7 XGS (GS5239XG) 是运营商面向住宅用户部署的网关设备，运行 Calix 自有的 EXOS 固件，提供路由、NAT 和防火墙功能，固件内置的 UPnP 服务基于 MiniUPnPd 2.3.7 实现，用于 LAN 侧的自动端口映射。\n受影响版本中，EXOS 6.6.47 固件把 MiniUPnPd 的 UPnP IGD WANIPConnection SOAP 控制端点绑定到 WAN 侧接口的 TCP 5000，并且没有对该服务施加访问控制。MiniUPnPd 中处理 AddPortMapping、DeletePortMapping、GetGenericPortMappingEntry 与 GetExternalIPAddress 这几个 WANIPConnection 动作的 SOAP 请求处理器在收到 WAN 上到达的 SOAP 报文时会无条件信任请求来源，攻击者只要知道设备的公网 IP，就可以远程伪造 SOAP 调用来新增、删除或枚举 NAT 端口映射并查询设备的外网地址，效果等同于直接在防火墙上打洞，将 LAN 内部服务直接暴露到公网。\n修复版本中通过将 MiniUPnPd 的控制端点绑定仅限定到 LAN 接口、并在防火墙策略上禁止外部对 TCP 5000 的访问解决了该问题；CERT/CC 公告同时指出 Calix 暂未发布固件更新，受影响用户应在管理界面禁用 UPnP，或在网关和上游同时阻断对 TCP 5000 的入站流量。", "effects": [{"comp_name": "Calix GS7 XGS (GS5239XG) running EXOS firmware", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,6.6.47]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "关键功能的认证机制缺失", "kind_en": "缺少关键功能的身份验证", "last_modified_time": "2026-08-21", "level": "Critical", "mps_id": "MPS-m728-9a1w", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-m728-9a1w", "name": "https://www.oscs1024.com/hd/MPS-m728-9a1w"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-75501", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-75501"}, {"url": "https://drkq.github.io/security-research/calix-vu756733/", "name": ""}, {"url": "https://kb.cert.org/vuls/id/756733", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Calix GS7 XGS 住宅路由器 UPnP WANIPConnection 未认证远程访问漏洞", "_translated": true, "_saved_at": "2026-08-21T16:25:18+00:00", "_first_saved_at": "2026-08-21T16:25:18+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-m728-9a1w"}, {"analysis_status": 0, "articles": [], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-63046", "cvss": {}, "cvss_score": 9, "cvss_vector": "", "cwe": "CWE-88", "description": "Apache InLong 是 Apache 软件基金会旗下的一站式海量数据集成服务，提供数据采集、传输、聚合与排序能力，相关代码以 Java 实现并在 GitHub 上以 Apache-2.0 协议开源。\n受影响版本中，Manager 端的 ModuleController 公开 REST 接口允许具备 INLONG_ADMIN 角色的调用方在 ModuleRequest 中写入任意 startCommand / stopCommand / checkCommand / installCommand / uninstallCommand 字符串；该请求经 ModuleServiceImpl.save / update 持久化至 Manager 数据库后，Agent 端的 ModuleManager 在 installModule / startModule / stopModule / uninstallModule / isProcessAllStarted 等方法中，将这些字符串原样传入 org.apache.inlong.agent.utils.ExcuteLinux.exeCmd(String)，而后者内部使用 /bin/sh -c 派生子进程，整个调用链既无 shell 元字符过滤也无 argv[0] 白名单校验。攻击者只需在命令字符串中拼接 ; | \u0026 $( ) 等 shell 元字符或附加任意可执行文件名，即可在所有部署了该模块的 Agent 主机上以运行 Agent 进程的系统权限执行任意 shell 命令，构成由 Manager 管理员凭证通向 Agent 节点完整控制权的提权 / 远程代码执行路径。\n修复版本中通过PR #12151 将 ExcuteLinux 改造为基于 ProcessBuilder 的 argv 数组入口 exeCmd(String[]) / exeCmd(List,File,long) 与链式 exePipedCmd，彻底移除 /bin/sh -c 调用，并新增 ModuleCommandValidator 与 AllowedRootsResolver 在 Agent 端执行前对 argv[0]、元字符与工作目录根路径做白名单与路径根校验；同时 PR #12155 在 ModuleServiceImpl.save / update 中调用 ModuleCommandValidator.validateOnSave / validateOnUpdate 进行保存前白名单校验，发现违规时通过 ErrorCodeEnum.MODULE_COMMAND_NOT_IN_WHITELIST 抛出 BusinessException，从源头阻断非法命令进入持久化与执行链。", "effects": [{"comp_name": "org.apache.inlong:inlong-agent", "ecosystem": "maven", "versions": [{"affected_version": "[2.0.0,2.4.0)", "min_fixed_version": "2.4.0", "repository": "maven", "solutions": [], "upstream": true}]}, {"comp_name": "org.apache.inlong:inlong-manager", "ecosystem": "maven", "versions": [{"affected_version": "[2.0.0,2.4.0)", "min_fixed_version": "2.4.0", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "参数注入或修改", "kind_en": "命令中参数分隔符的不正确中和（“参数注入”）", "last_modified_time": "2026-08-21", "level": "Critical", "mps_id": "MPS-pabr-7ntd", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-pabr-7ntd", "name": "https://www.oscs1024.com/hd/MPS-pabr-7ntd"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-63046", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-63046"}, {"url": "http 式来注入自己的恶意代码。这些恶意代码会被应用程序误认为是合法的指令或数据，并在执行过程中被执行。", "title": "什么是代码注入"}, {"content": "应用程序使用可执行动态代码的函数来执行用户可控的参数，当应用程序对于用户输入过滤不完全时，攻击者可以注入恶意代码并控制代码执行流程。", "title": "代码注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对所有用户输入进行验证和过滤，确保只接受预期的有效输入。这包括对输入数据进行输入长度验证、类型检查和格式验证等。\r\n- 使用参数化查询或预编译语句：对于数据库查询操作，应该使用参数化查询或预编译语句，确保输入数据不会被误认为是执行代码。\r\n- 最小特权原则：应用程序在执行操作系统命令或动态代码时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。\r\n- 安全编码实践：开发人员应该采用安全编码实践，包括避免使用eval函数、避免拼接用户输入的字符串作为代码执行等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止代码注入攻击。", "title": "如何预防代码注入"}], "cnvd_id": "", "cve_id": "CVE-2026-76604", "cvss": {"cvssv4": [{"source": "security@joomla.org", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 10}]}, "cvss_score": 10, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-94", "description": "Fabrik 是 fabrikar.com 发布的开源 Joomla 组件，提供表单、列表与数据库管理能力，其 PHP form element 插件允许管理员在表单生命周期事件中执行自定义 PHP 代码。\n受影响版本中，plugins/fabrik_form/php/php.php 的 PlgFabrik_FormPHP 类在 onBeforeProcess、onAfterProcess、onLoad、onBeforeLoad 等事件回调中调用私有方法 _runPHP()，该方法读取插件参数 curl_code 并使用 FabrikWorker::parseMessageForPlaceHolder 将占位符替换为 $this-\u003ehtml 中的表单数据（来自表单提交请求），随后通过 eval($code) 直接执行构造出的字符串。由于该流程对调用者未做权限校验，未登录的远程攻击者通过向启用了 PHP form element 的表单发起 POST 提交即可控制占位符取值，使 eval 接收并执行任意 PHP 代码，最终在 Joomla/PHP 进程权限下执行系统命令。\n修复版本中通过发布 4.7.3 版本，由厂商在 fabrikar.com 提供修复后的分发包解决了该问题。", "effects": [{"comp_name": "fabrikar.com:fabrik", "ecosystem": "composer", "versions": [{"affected_version": "(-∞,4.7.3)", "min_fixed_version": "4.7.3", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "代码注入", "kind_en": "代码生成控制不当（“代码注入”）", "last_modified_time": "2026-08-22", "level": "Critical", "mps_id": "MPS-hrzk-w3c2", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-hrzk-w3c2", "name": "https://www.oscs1024.com/hd/MPS-hrzk-w3c2"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-76604", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-76604"}, {"url": "https://www.fabrikar.com/", "name": ""}], "scope_influence": "", "tags": ["php", "开源"], "title": "Fabrik Joomla 扩展 PHP 表单元素未经身份验证的代码注入漏洞", "_translated": true, "_saved_at": "2026-08-22T16:16:34+00:00", "_first_saved_at": "2026-08-22T16:16:34+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-hrzk-w3c2"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-69502", "cvss": {"cvssv31": [{"source": "secure@microsoft.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:N", "severity": "critical", "base_score": 10}]}, "cvss_score": 10, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:N", "cwe": "CWE-918", "description": "Azure SQL Database 是 Microsoft Azure 提供的托管关系型数据库即服务,属于闭源托管云产品。\n受影响版本中,Azure SQL Database 的服务端请求处理逻辑存在服务器端请求伪造(SSRF)缺陷,允许未经认证的攻击者通过网络向 Azure SQL Database 的服务侧端点构造请求,使服务端替攻击者访问本不应可达的内部资源,并由此进一步在 Azure SQL Database 权限模型内提升权限。\n修复版本中通过 Microsoft 官方安全更新收紧了 Azure SQL Database 服务侧对外部请求目标的校验与上下文限制,切断了借助 SSRF 进入权限提升路径的链路;Azure SQL Database 为托管云服务,公开材料未披露具体源码改动,用户无需也不可手动升级二进制,补丁由 Microsoft 平台侧推送。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SSRF", "kind_en": "服务器端请求伪造 (SSRF)", "last_modified_time": "2026-08-22", "level": "Critical", "mps_id": "MPS-ngky-fdth", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ngky-fdth", "name": "https://www.oscs1024.com/hd/MPS-ngky-fdth"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-69502", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-69502"}, {"url": "https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-69502", "name": ""}], "scope_influence": "", "tags": [], "title": "Azure SQL Database SSRF权限提升漏洞", "_translated": true, "_saved_at": "2026-08-21T18:27:52+00:00", "_first_saved_at": "2026-08-21T17:22:37+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ngky-fdth"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-77002", "cvss": {}, "cvss_score": 9.8, "cvss_vector": "", "cwe": "CWE-287", "description": "SmilePass Selfie Login 是面向 WordPress 的闭源第三方登录插件，通过人脸识别 API 为站点提供自助拍照登录功能，readme.txt 中声明的稳定标签为 1.0.2。\n受影响版本中，插件在 init_hooks 中通过 add_action('wp_ajax_nopriv_smilepass_login_action', array('Smilepass_Admin','smilepass_login_action')) 注册了对未登录用户开放的 AJAX 端点 wp_ajax_nopriv_smilepass_login_action，对应的 Smilepass_Admin::smilepass_login_action 方法在收到 $_POST['operation'] == 'login-checked' 时，仅依据请求者提交的 $_POST['user_id'] 调用 get_user_by('id', ...) 取得任意用户对象后，立即执行 wp_clear_auth_cookie、wp_set_current_user 与 wp_set_auth_cookie 完成登录会话写入，完全不校验身份、不校验 nonce，也不要求调用方提供任何与 selfie 校验相关的服务端凭据；任何未认证访问者只要向该 AJAX 端点提交 operation=login-checked 与目标 user_id，即可被服务端登记为该用户会话，包括管理员账号。\n修复版本中通过在 wp_ajax_nopriv_smilepass_login_action 端点上校验调用方提供的自拍/令牌或限制其调用权限来阻断身份冒用；官方尚未发布修复版本，WPScan 公告明确标注 No known fix，建议站点立即停用并移除该插件直至上游提供修复。", "effects": [{"comp_name": "selfie-login", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.0.2]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "身份验证不当", "kind_en": "认证不当", "last_modified_time": "2026-08-22", "level": "Critical", "mps_id": "MPS-2xva-4lyq", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-2xva-4lyq", "name": "https://www.oscs1024.com/hd/MPS-2xva-4lyq"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-77002", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-77002"}, {"url": "https://wpscan.com/vulnerability/51236907-a1b4-4c3b-8c39-adafcab7a2ef/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "SmilePass Selfie Login WordPress插件认证绕过", "_translated": true, "_saved_at": "2026-08-22T11:15:21+00:00", "_first_saved_at": "2026-08-22T07:26:01+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-2xva-4lyq"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码 ": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "身份验证不当", "kind_en": "认证不当", "last_modified_time": "2026-08-22", "level": "Critical", "mps_id": "MPS-ad6j-vgm5", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ad6j-vgm5", "name": "https://www.oscs1024.com/hd/MPS-ad6j-vgm5"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-18052", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-18052"}, {"url": "https://wpscan.com/vulnerability/e1e8c313-f7ea-4f3a-85c0-4f33dfe0710d/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "ManageWP Worker 认证绕过", "_translated": true, "_saved_at": "2026-08-22T09:21:23+00:00", "_first_saved_at": "2026-08-22T07:26:12+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ad6j-vgm5"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-76904", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-89", "description": "GeoTools 是开源 Java 地理空间数据处理库，其 modules/plugin/jdbc/jdbc-postgis 子模块提供 org.geotools.jdbc:gt-jdbc-postgis 组件，用于通过 PostGIS 数据存储执行 OGC Filter 表达式并翻译为 PostgreSQL SQL。\n受影响版本中，FilterToSqlHelper 的 encodeJsonArrayContains 在将 jsonArrayContains(\u003ccolumn\u003e, \u003cpointer\u003e, \u003cvalue\u003e) 过滤函数翻译为 SQL 时，调用私有方法 constructEquality 把 user-controlled 的 \u003cvalue\u003e 参数直接拼入 \"(@.%s == \\\"%s\\\")\" 模板，生成形如 jsonb_path_exists(col, '($.path == \\\"evil\\\")') 的查询字符串而未对 \u003cvalue\u003e 做 SQL 转义。攻击者在远程 OGC Filter 接口传入含 \" 或反斜杠的 \u003cvalue\u003e 即可中断 SQL 字面量并注入任意 SQL 表达式，导致在 PostGIS 后端执行非预期读写。\n修复版本中通过在 constructEquality 的 String 分支统一调用 escapeJsonLiteral（包装 EscapeSql.escapeLiteral(literal, true, true)）对 \u003cvalue\u003e 进行 SQL 字面量转义后再写入模板，同时新增 FilterToSqlHelper 测试用例验证 PostGIS 12+ 行为，切断利用者在 jsonArrayContains 过滤器上注入 SQL 表达式的链路。", "effects": [{"comp_name": "org.geotools.jdbc:gt-jdbc-postgis", "ecosystem": "maven", "versions": [{"affected_version": "[34.0,34.5)", "min_fixed_version": "34.5", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[30.5,33.6)", "min_fixed_version": "33.6", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[35.0,35.1)", "min_fixed_version": "35.1", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-08-22", "level": "Critical", "mps_id": "MPS-ce7i-fsl5", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://github.com/geotools/geotools/security/advisories/GHSA-mqjf-5f49-2fjh", "name": ""}, {"url": "https://github.com/geotools/geotools/pull/5829", "name": ""}, {"url": "https://github.com/geotools/geotools/commit/d821c4d321dd91c22e31fcd5b1ce676645da5176", "name": ""}, {"url": "https://github.com/geotools/geotools/releases/tag/33.6", "name": ""}, {"url": "https://github.com/geotools/geotools/releases/tag/34.5", "name": ""}, {"url": "https://github.com/geotools/geotools/releases/tag/35.1", "name": ""}, {"url": "https://osgeo-org.atlassian.net/browse/GEOT-7589", "name": ""}, {"url": "https://osgeo-org.atlassian.net/browse/GEOT-7958", "name": ""}, {"url": "https://osgeo-org.atlassian.net/browse/GEOT-7959", "name": ""}, {"url": "https://github.com/advisories/GHSA-mqjf-5f49-2fjh", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "GeoTools PostGIS DataStore jsonArrayContains SQL 注入漏洞", "_translated": true, "_saved_at": "2026-08-21T22:17:20+00:00", "_first_saved_at": "2026-08-21T22:17:20+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ce7i-fsl5"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-75866", "cvss": {}, "cvss_score": 9.8, "cvss_vector": "", "cwe": "CWE-862", "description": "Punk-OAuth2 是开源 Perl OAuth2 / OpenID Connect 发行版，包含 Punk::OAuth2::Server 授权服务端、Punk::OAuth2::Checker 资源端校验、Punk::OAuth2::Provider / Punk::OAuth2::JWKS 客户端侧等组件，全部以 XS（C）实现，路由 /authorize、/token、/revoke、/introspect、/jwks.json 由 Punk::Plugin::OAuth2 注册。\n受影响版本中，Punk::OAuth2::Server 的 /authorize 与 /token 处理路径缺少对客户端注册的 grant_types 与 scopes 的强制检查，Punk::OAuth2::Server::Store 中虽然以字段形式登记了这两个列表，但任何授权分支都未读取它们。/token 的 pox_srv_token 直接根据请求体中的 grant_type 派发分支，已注册 authorization_code 的客户端可发送 grant_type=client_credentials 直接换取自带任意 scope 的已签名 at+jwt；/authorize 的 pox_srv_authorize 把请求中的 scope 字符串原样写入授权码记录，再由出牌端签名进访问令牌，注册的 redirect_uris 是唯一被强制比对的字段；此外已注册但未配置 secret 的公开客户端在 client_credentials 分支中仅凭 client_id 即可通过认证。\n修复版本中通过在 /authorize 与 /token 入口新增 pox_grant_ok / pox_client_scope_ok 调用，按 Punk::OAuth2::Server::Store 中 deny by default 的 grant_types 与 scopes 重新校验请求，并在 client_credentials 分支拒绝 secret_digest 为空、is_public 为真的客户端，使令牌只能在客户端实际被授予的范围内被签发；不存在的字段或空集视为不允许任何授权，与 redirect_uris 的处理保持一致。", "effects": [{"comp_name": "Punk-OAuth2", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,0.03]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-08-22", "level": "Critical", "mps_id": "MPS-fz73-492v", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-fz73-492v", "name": "https://www.oscs1024.com/hd/MPS-fz73-492v"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-75866", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-75866"}, {"url": "https://datatracker.ietf.org/doc/html/rfc6749#section-3.3", "name": ""}, {"url": "https://datatracker.ietf.org/doc/html/rfc6749#section-5.2", "name": ""}, {"url": "https://metacpan.org/release/LNATION/Punk-OAuth2-0.03/view/lib/Punk/OAuth2/Server/Store.pm", "name": ""}, {"url": "https://metacpan.org/release/LNATION/Punk-OAuth2-0.04/changes", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Punk-OAuth2 服务端授权缺失漏洞", "_translated": true, "_saved_at": "2026-08-22T15:14:23+00:00", "_first_saved_at": "2026-08-22T15:14:23+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-fz73-492v"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-78003", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-918", "description": "Mailgun for WordPress 是开源 WordPress 插件，通过 Mailgun HTTP API 或 SMTP 提供网站邮件发送能力。\n受影响版本中，mailgun.php 中的 add_list 处理流程在解析 $_POST['addresses'] 时仅对其调用 sanitize_text_field()，未对派生出的 URL 路径或 Mailgun API endpoint 做白名单校验，攻击者通过路径遍历构造的 array key 最终进入 wp_remote_post 调用，使得任意未认证请求者都可以借用 WordPress 站点已配置的 Mailgun API key 对 Mailgun 控制面发起认证 POST 请求，包括建立可截获密码重置邮件的入站路由，从而演化为管理员账号接管。\n修复版本中通过在 add_list AJAX 流程中补充 nonce 校验以及对订阅地址的服务器端校验，阻止未经授权的请求进入 Mailgun API 调用链路，从而切断这条以站点 API key 为凭证的 SSRF 利用路径。", "effects": [{"comp_name": "mailgun", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.2.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SSRF", "kind_en": "服务器端请求伪造 (SSRF)", "last_modified_time": "2026-08-22", "level": "Critical", "mps_id": "MPS-vsm4-i0a2", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-vsm4-i0a2", "name": "https://www.oscs1024.com/hd/MPS-vsm4-i0a2"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-78003", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-78003"}, {"url": "https://plugins.trac.wordpress.org/browser/mailgun/tags/2.1.10/mailgun.php#L259", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/mailgun/tags/2.1.10/mailgun.php#L323", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/mailgun/tags/2.1.10/mailgun.php#L331", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/mailgun/tags/2.1.10/mailgun.php#L557", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/mailgun/trunk/mailgun.php#L259", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/mailgun/trunk/mailgun.php#L323", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/mailgun/trunk/mailgun.php#L331", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/mailgun/trunk/mailgun.php#L557", "name": ""}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/110e888d-69fc-4682-b908-2b62288c5227?source=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Mailgun for WordPress 插件 add_list SSRF 漏洞", "_translated": true, "_saved_at": "2026-08-22T12:26:00+00:00", "_first_saved_at": "2026-08-22T10:16:36+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-vsm4-i0a2"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "attack_vector_ 注入"}, {"content": "应用程序使用可执行动态代码的函数来执行用户可控的参数，当应用程序对于用户输入过滤不完全时，攻击者可以注入恶意代码并控制代码执行流程。", "title": "代码注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对所有用户输入进行验证和过滤，确保只接受预期的有效输入。这包括对输入数据进行输入长度验证、类型检查和格式验证等。\r\n- 使用参数化查询或预编译语句：对于数据库查询操作，应该使用参数化查询或预编译语句，确保输入数据不会被误认为是执行代码。\r\n- 最小特权原则：应用程序在执行操作系统命令或动态代码时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。\r\n- 安全编码实践：开发人员应该采用安全编码实践，包括避免使用eval函数、避免拼接用户输入的字符串作为代码执行等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止代码注入攻击。", "title": "如何预防代码注入"}], "cnvd_id": "", "cve_id": "CVE-2026-77992", "cvss": {"cvssv4": [{"source": "security@joomla.org", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.5}]}, "cvss_score": 9.5, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-94", "description": "Fabrik 是 fabrikar.com 发布的开源 Joomla 扩展，提供可视化表单构建、数据库管理与应用开发能力，PHP 实现。\n受影响版本中，Fabrik 的 calc 元素在将用户可控输入拼入 PHP heredoc 字符串时未对 heredoc 终止符进行充分校验，攻击者可注入额外的 heredoc 终止符与任意 PHP 代码；与此同时，onUpdateComment 控制器入口缺少访问控制检查，未授权远程调用者也可直接抵达该危险代码路径，从而在服务端执行任意 PHP。\n修复版本中通过将 calc 元素的用户输入做 heredoc 终止符与字符串上下文的安全处理，并在 onUpdateComment 入口补齐身份与权限校验，阻断未授权访问与代码注入组合利用路径。", "effects": [{"comp_name": "fabrikar.com:fabrik-extension-for-joomla", "ecosystem": "linux", "versions": [{"affected_version": "[1.0.0,4.7.2)", "min_fixed_version": "4.7.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "代码注入", "kind_en": "代码生成控制不当（“代码注入”）", "last_modified_time": "2026-08-22", "level": "Critical", "mps_id": "MPS-txp2-odu3", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://www.o ndler 加入运行期 Map 类型检查，使任意 Groovy 执行路径不再可达。", "effects": [{"comp_name": "athena-neptune", "ecosystem": "linux", "versions": [{"affected_version": "[2024.15.1,2026.30.1)", "min_fixed_version": "2026.30.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "eval注入", "kind_en": "动态评估代码中指令的不当中和（“评估注入”）", "last_modified_time": "2026-08-22", "level": "Critical", "mps_id": "MPS-c1lq-h5ke", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-c1lq-h5ke", "name": "https://www.oscs1024.com/hd/MPS-c1lq-h5ke"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-77810", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-77810"}, {"url": "https://aws.amazon.com/security/security-bulletins/2026-087-aws/", "name": ""}, {"url": "https://github.com/awslabs/aws-athena-query-federation/releases/tag/v2026.30.1", "name": ""}, {"url": "https://github.com/awslabs/aws-athena-query-federation/security/advisories/GHSA-v7c2-5wfg-qg44", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Athena Neptune连接器Gremlin QPT代码注入漏洞", "_translated": true, "_saved_at": "2026-08-21T21:17:53+00:00", "_first_saved_at": "2026-08-21T21:17:53+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-c1lq-h5ke"}, {"analysis_status": 0, "articles": [{"content": "应用程序在处理用户输入时的不完善或缺乏验证机制，所以攻击者能够通过向应用程序发送恶意输入，利用应用程序对输入数据的错误处理方式来注入自己的恶意代码。这些恶意代码会被应用程序误认为是合法的指令或数据，并在执行过程中被执行。", "title": "什么是代码注入"}, {"content": "应用程序使用可执行动态代码的函数来执行用户可控的参数，当应用程序对于用户输入过滤不完全时，攻击者可以注入恶意代码并控制代码执行流程。", "title": "代码注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对所有用户输入进行验证和过滤，确保只接受预期的有效输入。这包括对输入数据进行输入长度验证、类型检查和格式验证等。\r\n- 使用参数化查询或预编译语句：对于数据库查询操作，应该使用参数化查询或预编译语句，确保输入数据不会被误认为是执行代码。\r\n- 最小特权原则：应用程序在执行操作系统命令或动态代码时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。\r\n- 安全编码实践：开发人员应该采用安全编码实践，包括避免使用eval函数、避免拼接用户输入的字符串作为代码执行等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止代码注入攻击。", "title": "如何预防代码注入"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-77413", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-94", "description": "JSONata 是开源的 JSON 查询与转换语言，以 npm 包 jsonata 提供，被广泛用于在 Node.js 与浏览器端解析和执行 JSONata 表达式。\n受影响版本中，src/functions.js 中的 lookup 函数在根据键名取值时缺少 Object.prototype.hasOwnProperty 校验，攻击者只需提供可控的 JSONata 表达式即可绕过自有属性判定，借助 __lookupSetter__、__defineGetter__、constructor、valueOf 与 process.getBuiltinModule 等继承自原型链的成员访问 child_process，并借助 execSync 等命令执行接口以宿主进程权限执行任意代码。\n修复版本中通过为 lookup 函数补回 Object.prototype.hasOwnProperty.call(input, key) 检查，仅允许读取对象自身属性，切断继承链上的 setter/getter、constructor 与进程模块入口到达危险执行路径，1.x 分支修复包含在 1.8.8，2.x 分支修复包含在 2.2.0。", "effects": [{"comp_name": "jsonata", "ecosystem": "npm", "versions": [{"affected_version": "[2.0.0,2.2.0)", "min_fixed_version": "2.2.0", "repository": "npm", "solutions": [], "upstream": true}, {"affected_version": "(-∞,1.8.7]", "min_fixed_version": "", "repository": "npm", "solutions": [], "upstream": true}, {"affected_version": "(-∞,1.8.8)", "min_fixed_version": "1.8.8", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "代码注入", "kind_en": "代码生成控制不当（“代码注入”）", "last_modified_time": "2026-08-22", "level": "Critical", "mps_id": "MPS-1cto-q54h", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://github.com/jsonata-js/jsonata/security/advisories/GHSA-8gq3-vp5j-2grp", "name": ""}, {"url": "https://github.com/jsonata-js/jsonata/pull/794", "name": ""}, {"url": "https://github.com/jsonata-js/jsonata/commit/4b217d514376e30cba278941298d7ba97c4a6c6e", "name": ""}, {"url": "https://github.com/jsonata-js/jsonata/commit/4c5f4adfb90a9b500889d50f90050ca68888b50d", "name": ""}, {"url": "https://github.com/jsonata-js/jsonata/releases/tag/v1.8.8", "name": ""}, {"url": "https://github.com/jsonata-js/jsonata/releases/tag/v2.2.0", "name": ""}, {"url": "https://github.com/advisories/GHSA-8gq3-vp5j-2grp", "name": ""}], "scope_influence": "", "tags": ["npm", "开源"], "title": "JSONata原型链污染导致远程代码执行", "_translated": true, "_saved_at": "2026-08-21T22:17:16+00:00", "_first_saved_at": "2026-08-21T22:17:16+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-1cto-q54h"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-12710", "cvss": {"cvssv4": [{"source": "f45cbf4e-4146-4068-b7e1-655ffc2c548c", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:Clear", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:Clear", "cwe": "CWE-862", "description": "Google Cloud Application Integration 是 Google Cloud 提供的托管式应用集成服务，用于在工作流中连接和编排 Google Cloud 与第三方系统之间的数据与流程，属于闭源商业产品，由 Google 直接运维。\n受影响版本中，QueryEngineTask 在执行外部查询请求时缺少授权校验。具有网络访问能力的外部攻击者无需任何身份凭据即可绕过授权检查，借由 QueryEngineTask 接口读取对应 Application Integration 实例后端持有的敏感内部数据，造成敏感信息泄露。\n修复版本中通过 2026-04-04 部署的服务端补丁为 QueryEngineTask 补全了执行查询请求时所需的授权检查，仅允许具备相应权限的主体访问对应的内部数据，从而切断了外部攻击者越权访问敏感数据的链路，无需用户侧额外操作。", "effects": [{"comp_name": "google-cloud-application-integration", "ecosystem": "linux", "versions": [{"affected_version": "[2025-04-28,2026-04-04)", "min_fixed_version": "2026-04-04", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-08-22", "level": "Critical", "mps_id": "MPS-1pgc-ht9s", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-1pgc-ht9s", "name": "https://www.oscs1024.com/hd/MPS-1pgc-ht9s"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-12710", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-12710"}, {"url": "https://cloud.google.com/application-integration/docs/release-notes#August_21_2026", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Application Integration 授权缺失漏洞", "_translated": true, "_saved_at": "2026-08-22T12:26:01+00:00", "_first_saved_at": "2026-08-22T10:16:35+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-1pgc-ht9s"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-76602", "cvss": {"cvssv4": [{"source": "security@joomla.org", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-89", "description": "Fabrik 是面向 Joomla CMS 的开源应用与表单构建组件，提供可视化列表、表单、报表与应用搭建能力，由 fabrikar.com 维护，遵循 GPLv3 协议，源代码托管于 https://github.com/Fabrik/fabrik。\n受影响版本中，列表（list）视图由 components/com_fabrik/controllers/list.php 中的 FabrikControllerList::display 作为 Joomla MVC 对外入口处理，order_by / orderby URL 参数经 JFactory::getApplication()-\u003einput-\u003egetString() 读取后，被直接传入 components/com_fabrik/models/list.php 中 buildQueryOrder 函数拼装 ORDER BY 子句，仅对字段名调用 FabrikString::safeColName 转义，未对实际值进行白名单校验，攻击者可使用基于条件表达式的 payload 触发基于时间的盲注，读取数据库内容。\n修复版本中通过在 buildQueryOrder 中对 order_by / orderby 取值强制限定为列表已声明的元素字段名或已知列名，丢弃非白名单值并由 setOrderByAndDir 仅允许 session 写入，从而切断未认证 ORDER BY 注入路径。", "effects": [{"comp_name": "fabrikar.com:Fabrik extension for Joomla", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,4.7.3)", "min_fixed_version": "4.7.3", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-08-22", "level": "Critical", "mps_id": "MPS-5ne3-vx8r", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-5ne3-vx8r", "name": "https://www.oscs1024.com/hd/MPS-5ne3-vx8r"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-76602", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-76602"}, {"url": "https://www.fabrikar.com/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Fabrik Joomla 扩展 ORDER BY 注入漏洞", "_translated": true, "_saved_at": "2026-08-22T16:16:37+00:00", "_first_saved_at": "2026-08-22T16:16:37+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-5ne3-vx8r"}, {"analysis_status": 0, "articles": [{"content": "应用程序在处理用户输入时的不完善或缺乏验证机制，所以攻击者能够通过向应用程序发送恶意输入，利用应用程序对输入数据的错误处理方式来注入自己的恶意代码。这些恶意代码会被应用程序误认为是合法的指令或数据，并在执行过程中被执行。", "title": "什么是代码注入"}, {"content": "应用程序使用可执行动态代码的函数来执行用户可控的参数，当应用程序对于用户输入过滤不完全时，攻击者可以注入恶意代码并控制代码执行流程。", "title": "代码注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对所有用户输入进行验证和过滤，确保只接受预期的有效输入。这包括对输入数据进行输入长度验证、类型检查和格式验证等。\r\n- 使用参数化查询或预编译语句：对于数据库查询操作，应该使用参数化查询或预编译语句，确保输入数据不会被误认为是执行代码。\r\n- 最小特权原则：应用程序在执行操作系统命令或动态代码时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。\r\n- 安全编码实践：开发人员应该采用安全编码实践，包括避免使用eval函数、避免拼接用户输入的字符串作为代码执行等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止代码注入攻击。", "title": "如何预防代码注入"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-77415", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-94", "description": "JSONata 是开源的 JSON 查询与转换语言，作为 npm 包 jsonata 提供，常在 Node.js 服务中用于安全、灵活地读取并改写 JSON 数据。\n受影响版本中，调用方传入的 JSONata 表达式可在 evaluate 阶段被攻击者串联多个对象完整性缺陷以执行任意代码：通过覆盖内置符号 $clone 借助 evaluateTransformExpression 改写对象属性；通过 $merge.* 解构 JSONata 内部函数与 lambda；通过替换 proc.arguments.forEach 触发 applyProcedure 路径绕过并伪造 lambda 状态。这些原语组合后可访问原型 getter、原型链与构造函数，最终经 process.getBuiltinModule('child_process') 启动系统命令，并以宿主进程权限运行。\n修复版本中通过将 applyProcedure 中 proc.arguments.forEach 改为 Array.prototype.forEach.call，将多处 = {} 替换为 Object.create(null)，将 hasOwnProperty 与 for…in 替换为 Object.prototype.hasOwnProperty.call 与 Object.keys，并在 1.8.8 与 2.2.1 中补充回归测试，从而切断原型链污染与 applyProcedure 路径绕过，阻止任意代码执行。", "effects": [{"comp_name": "jsonata", "ecosystem": "npm", "versions": [{"affected_version": "[2.0.0,2.2.1)", "min_fixed_version": "2.2.1", "repository": "npm", "solutions": [], "upstream": true}, {"affected_version": "(-∞,1.8.8)", "min_fixed_version": "1.8.8", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "代码注入", "kind_en": "代码生成控制不当（“代码注入”）", "last_modified_time": "2026-08-22", "level": "Critical", "mps_id": "MPS-8yg9-d57b", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://github.com/jsonata-js/jsonata/security/advisories/GHSA-66mm-25pp-rfff", "name": ""}, {"url": "https://github.com/jsonata-js/jsonata/pull/799", "name": ""}, {"url": "https://github.com/jsonata-js/jsonata/pull/800", "name": ""}, {"url": "https://github.com/jsonata-js/jsonata/pull/802", "name": ""}, {"url": "https://github.com/jsonata-js/jsonata/commit/47c0e58542202c705726663166dbee5fcae47d06", "name": ""}, {"url": "https://github.com/jsonata-js/jsonata/commit/4b217d514376e30cba278941298d7ba97c4a6c6e", "name": ""}, {"url": "https://github.com/jsonata-js/jsonata/commit/59e25144fc3b7125f6befd71b8a6e14e1fa610d2", "name": ""}, {"url": "https://github.com/jsonata-js/jsonata/commit/f09df8416eab8ff44926fc6527c80fb8701de159", "name": ""}, {"url": "https://github.com/jsonata-js/jsonata/commit/f174348c7fa30f271b63ddedf0767e814004bc4d", "name": ""}, {"url": "https://github.com/jsonata-js/jsonata/releases/tag/v1.8.8", "name": ""}, {"url": "https://github.com/jsonata-js/jsonata/releases/tag/v2.2.1", "name": ""}, {"url": "https://github.com/advisories/GHSA-66mm-25pp-rfff", "name": ""}], "scope_influence": "", "tags": ["npm", "开源"], "title": "JSONata表达式任意代码执行漏洞", "_translated": true, "_saved_at": "2026-08-21T22:17:15+00:00", "_first_saved_at": "2026-08-21T22:17:15+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-8yg9-d57b"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-77234", "cvss": {"cvssv31": [{"source": "ff89ba41-3aa1-4d27-914a-91399e9639e5", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}], "cvssv4": [{"source": "ff89ba41-3aa1-4d27-914a-91399e9639e5", "vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-863", "description": "FreeRTOS-Kernel 是开源实时操作系统内核组件，由 AWS 维护并采用 MIT 协议，支持 ARM Cortex-M、RISC-V 等多种架构，提供任务调度、队列、信号量、软件定时器与基于 MPU 的内存隔离能力，常用于嵌入式与 IoT 设备。\n受影响版本中，在启用 MPU wrappers v2 的 ARMv8-M 等非安全端口上，软件定时器 API xTimerDelete 被实现为直接展开为 xTimerGenericCommand 的宏，绕过了本应执行权限校验的 MPU_xTimerDelete 包装函数；MPU wrappers v2 通过内核对象池索引将非特权任务与定时器对象隔离，缺失包装使非特权任务可以直接进入特权上下文完成任意软件定时器命令（包括 tmrCOMMAND_DELETE 之外的命令码），最终在特权内核上下文中获得任意代码执行能力，破坏 MPU 强制任务隔离。\n修复版本中通过 include/mpu_wrappers.h 增加 #define xTimerDelete MPU_xTimerDelete 映射，include/mpu_prototypes.h 增加 MPU_xTimerDelete 原型，include/timers.h 在 MPU wrappers v2 条件下将 xTimerDelete 改为函数原型，并在 portable/Common/mpu_wrappers_v2.c 新增 MPU_xTimerDelete 实现（先校验外部索引并经 MPU_GetTimerHandleAtIndex 取得内部句柄，再以 PRIVILEGED_FUNCTION 方式调用 xTimerGenericCommandFromTask 发送 tmrCOMMAND_DELETE，成功后调用 MPU_SetIndexFreeInKernelObjectPool 释放对象池索引），使非特权任务必须经特权包装函数进入定时器命令路径，从而切断绕过 MPU 隔离的利用链。", "effects": [{"comp_name": "FreeRTOS-Kernel", "ecosystem": "linux", "versions": [{"affected_version": "[7.0.0,11.3.1)", "min_fixed_version": "11.3.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-08-22", "level": "Critical", "mps_id": "MPS-lj24-9q0t", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-lj24-9q0t", "name": "https://www.oscs1024.com/hd/MPS-lj24-9q0t"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-77234", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-77234"}, {"url": "https://aws.amazon.com/security/security-bulletins/2026-086-aws/", "name": ""}, {"url": "https://github.com/FreeRTOS/FreeRTOS-Kernel/releases/tag/V11.3.1", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "FreeRTOS-Kernel MPU授权绕过漏洞", "_translated": true, "_saved_at": "2026-08-21T19:21:10+00:00", "_first_saved_at": "2026-08-21T19:21:10+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-lj24-9q0t"}, {"analysis_status": 0, "articles": [{"content": "应用程序在处理用户输入时的不完善或缺乏验证机制，所以攻击者能够通过向应用程序发送恶意输入，利用应用程序对输入数据的错误处理方式来注入自己的恶意代码。这些恶意代码会被应用程序误认为是合法的指令或数据，并在执行过程中被执行。", "title": "什么是代码注入"}, {"content": "应用程序使用可执行动态代码的函数来执行用户可控的参数，当应用程序对于用户输入过滤不完全时，攻击者可以注入恶意代码并控制代码执行流程。", "title": "代码注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对所有用户输入进行验证和过滤，确保只接受预期的有效输入。这包括对输入数据进行输入长度验证、类型检查和格式验证等。\r\n- 使用参数化查询或预编译语句：对于数据库查询操作，应该使用参数化查询或预编译语句，确保输入数据不会被误认为是执行代码。\r\n- 最小特权原则：应用程序在执行操作系统命令或动态代码时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。\r\n- 安全编码实践：开发人员应该采用安全编码实践，包括避免使用eval函数、避免拼接用户输入的字符串作为代码执行等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止代码注入攻击。", "title": "如何预防代码注入"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-77414", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-94", "description": "JSONata 是一个用 JavaScript 实现的开源 JSON 查询与转换语言，以 `jsonata` 包形式发布在 npm 注册库，常被集成在数据转换、规则引擎以及 LLM 代理工具调用流水线中。\n受影响版本中，`src/jsonata.js` 中由 `createFrame` 创建的环境帧使用普通对象 `var bindings = {}` 存放变量绑定，并通过 `bindings.hasOwnProperty(name)` 判定属性归属。由于该方法本身可被赋值覆盖，且 `bindings` 继承自 `Object.prototype`，攻击者可在 JSONata 表达式内通过 `$hasOwnProperty := $spread($string)`、`$__proto__ := $constructor` 等手法污染 `Object.prototype`，进而沿着原型链触达 `process.getBuiltinModule('child_process').execSync`，以宿主进程权限执行任意系统命令。\n修复版本中通过将 `bindings` 替换为 `Object.create(null)` 创建的无原型对象，并把属性检查改为 `Object.prototype.hasOwnProperty.call(bindings, name)`，从源头切断原型链访问路径，使 `$hasOwnProperty`、原型链遍历和 `$constructor` 等污染手法无法绕过环境帧查找逻辑。", "effects": [{"comp_name": "jsonata", "ecosystem": "npm", "versions": [{"affected_version": "(-∞,1.8.8)", "min_fixed_version": "1.8.8", "repository": "npm", "solutions": [], "upstream": true}, {"affected_version": "[2.0.0,2.2.1)", "min_fixed_version": "2.2.1", "repository": "npm", "solutions": [], "upstream": true}, {"affected_version": "[0,1.8.8)", "min_fixed_version": "1.8.8", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "代码注入", "kind_en": "代码生成控制不当（“代码注入”）", "last_modified_time": "2026-08-22", "level": "Critical", "mps_id": "MPS-ybsg-16z4", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://github.com/jsonata-js/jsonata/security/advisories/GHSA-2943-5xfg-gq5f", "name": ""}, {"url": "https://github.com/jsonata-js/jsonata/pull/799", "name": ""}, {"url": "https://github.com/jsonata-js/jsonata/commit/59e25144fc3b7125f6befd71b8a6e14e1fa610d2", "name": ""}, {"url": "https://github.com/jsonata-js/jsonata/commit/c41ef185136a7b96ca1049c7745a7503b82193de", "name": ""}, {"url": "https://github.com/jsonata-js/jsonata/commit/f09df8416eab8ff44926fc6527c80fb8701de159", "name": ""}, {"
