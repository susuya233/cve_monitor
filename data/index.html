  <style>

      --text: #e7f2ec;

      --crit: #ff5a4e;

      --radius: 16px;
    }
    * { box-sizing: border-box; }
    html, body {

    }
    body::before {

      background-image:

        linear-gradient(90deg, rgba(140, 190, 170, 0.05) 1px, transparent 1px);
      background-size: 28px 28px;
      mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
    }
    .shell {
      position: relative;
      max-width: 1280px;
      margin: 0 auto;
      padding: 28px 20px 40px;
      display: grid;
      gap: 18px;
      min-height: 100vh;
    }
    header.hero {
      display: grid;
      gap: 10px;
      padding: 22px 24px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(135deg, rgba(18, 36, 44, 0.95), rgba(10, 22, 28, 0.9));
      box-shadow: var(--shadow);
    }
    .brand {
      font-family: Syne, sans-serif;
      font-weight: 800;
      font-size: clamp(1.6rem, 3vw, 2.2rem);
      letter-spacing: -0.03em;
      line-height: 1.1;
    }
    .brand span { color: var(--accent); }
    .sub {
      color: var(--muted);
      font-size: 0.95rem;
      max-width: 62ch;
    }
    .meta {
      display: flex; flex-wrap: wrap; gap: 8px 14px;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.78rem;
      color: var(--muted);
    }
    .meta b { color: var(--text); font-weight: 500; }
    .layout {
      display: grid;
      grid-template-columns: minmax(280px, 360px) 1fr;
      gap: 16px;
      min-height: 70vh;
    }
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
    }
    .panel {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 520px;
    }
    .panel-hd {
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
    }
    .panel-hd h2 {
      margin: 0; font-size: 0.92rem; font-weight: 600; letter-spacing: 0.02em;
    }
    .search {
      width: 100%;
      margin: 0 16px 12px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: rgba(0,0,0,0.25);
      color: var(--text);
      font: inherit;
      outline: none;

      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .item {
      text-align: left;
      width: 100%;
      border: 1px solid transparent;
      border-radius: 12px;
      padding: 12px;
      background: transparent;
      color: inherit;
      cursor: pointer;
      transition: background .15s, border-color .15s, transform .15s;

      font-size: 0.82rem;
      font-weight: 600;

      overflow: auto;
      padding: 18px 20px 28px;
    }
    .empty {
      margin: auto; color: var(--muted); text-align: center; padding: 40px 20px;
    }
    .d-head {
      display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .d-title {
      font-family: Syne, sans-serif;
      font-size: clamp(1.25rem, 2.2vw, 1.7rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0 0 8px;
      line-height: 1.2;
    }
    .ids {
      display: flex; flex-wrap: wrap; gap: 8px;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.82rem;
    }
    .chip {
      padding: 4px 10px;
      border-radius: 8px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--line);
      color: #cfe4da;
    }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .btn {

      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.03);
      color: var(--text);
      text-decoration: none;

      background: rgba(0,0,0,0.2);
      line-height: 1.65;

      word-break: break-word;
      font-size: 0.92rem;
      color: #d7e8e0;

      font-family: "JetBrains Mono", monospace;
      font-size: 0.8rem;
      word-break: break-all;

      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(255,255,255,0.06);
      color: var(--muted);
    }

SA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-321", "description": "Crawlab 是基于 Golang 的开源分布式爬虫管理平台，用于调度、监控并在工作节点上运行多种语言的爬虫任务。\n受影响版本中，用户服务在 newUserServiceV2 初始化时将 HMAC-SHA256 JWT 签名密钥硬编码为字符串 crawlab，SetJwtSecret 与 WithJwtSecret 在工程中无调用点，配置项与环境变量均无法覆盖该密钥。未认证攻击者可使用该公开密钥伪造内置管理员令牌，经 Authorization 请求头进入 AuthorizationMiddlewareV2，通过 checkToken 校验后访问管理接口，并调用爬虫运行接口在工作节点上执行代码。\n修复版本中通过官方安全更新消除硬编码 JWT 签名密钥。截至本报告，CVE.org 与 VulnCheck 均未公布修复版本，GitHub Issue #1622 仍为 Open，v0.6.3 所依赖的 crawlab-core 与主分支 0485310 的 newUserServiceV2 均将 jwtSecret 设为 crawlab。", "effects": [{"comp_name": "github.com/crawlab-team/crawlab", "ecosystem": "go", "versions": [{"affected_version": "(-∞,0.6.3]", "min_fixed_version": "", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "使用硬编码的密码学密钥", "kind_en": "使用硬编码密钥", "last_modified_time": "2026-09-15", "level": "Critical", "mps_id": "MPS-6w2s-cbd4", "poc": false, "poc_url": [], "published_time": "2026-09-15", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-6w2s-cbd4", "name": "https://www.oscs1024.com/hd/MPS-6w2s-cbd4"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-90945", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-90945"}, {"url": "https://github.com/crawlab-team/crawlab/issues/1622", "name": "GitHub Issue #1622"}, {"url": "https://github.com/crawlab-team/crawlab", "name": ""}, {"url": "https://github.com/crawlab-team/crawlab/blob/0485310def8b4f31ea20997846a8d5e7dfc681e5/core/user/service_v2.go", "name": "core/user/service_v2.go at 0485310"}, {"url": "https://github.com/crawlab-team/crawlab-core/blob/main/user/service.go", "name": "crawlab-core user/service.go, the module vendored at v0.6.3"}, {"url": "https://www.vulncheck.com/advisories/crawlab-through-0.6.3-authentication-bypass-via-hard-coded-jwt-secret", "name": "VulnCheck Advisory: Crawlab through 0.6.3 Authentication Bypass via Hard-coded JWT Secret"}], "scope_influence": "", "tags": ["go"], "title": "Crawlab硬编码JWT密钥", "_translated": true, "_saved_at": "2026-09-15T00:09:13+00:00", "_first_saved_at": "2026-09-14T21:18:35+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-6w2s-cbd4"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-90943", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:R/S:C/C:H/I:H/A:N", "severity": "high", "base_score": 8.7}] ents through unescaped comment rendering"}, {"url": "https://github.com/parallax/filament-comments/blob/3.0.0/resources/views/comments.blade.php", "name": ""}, {"url": "https://github.com/parallax/filament-comments/blob/3.0.0/src/Policies/FilamentCommentPolicy.php", "name": ""}, {"url": "https://packagist.org/packages/parallax/filament-comments", "name": ""}, {"url": "https://www.vulncheck.com/advisories/parallax-filament-comments-through-3.0.0-stored-xss-via-comment-body", "name": "VulnCheck Advisory: parallax filament-comments through 3.0.0 Stored XSS via Comment Body"}], "scope_influence": "", "tags": ["php", "开源"], "title": "filament-comments存储型XSS", "_translated": true, "_saved_at": "2026-09-14T17:25:50+00:00", "_first_saved_at": "2026-09-14T17:25:50+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-bfw1-myev"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-90942", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:N", "severity": "critical", "base_score": 9.6}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:N/SC:H/SI:H/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:N/SC:H/SI:H/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-863", "description": "Casdoor 是开源身份认证与访问控制平台，提供 OAuth、OIDC 单点登录以及多组织用户管理能力。\n受影响版本中，/api/get-certs 与 /api/get-cert 仅在 !IsAdmin() 时调用 GetMaskedCert 掩码私钥，而 IsAdmin() 对任意组织管理员返回真；同时 object.GetCerts 以 WHERE owner='admin' OR owner=\u003c请求组织\u003e 把实例级 admin/cert-built-in 并入本组织结果，object.GetCert 在本组织找不到同名证书时回退 getCert(\"admin\", name)，组织管理员可读取全局 JWT 签名私钥并伪造任意组织（含全局管理员）令牌。\n修复版本中通过将私钥掩码限制为全局管理员、并停止把 admin 名下内置证书混入本组织查询，可切断跨组织读取签名私钥的链路；公开仓库截至 v4.4.0 及之后 master 提交仍保留上述逻辑，未找到已验证修复提交，应在官方补丁发布前轮换内置 JWT 证书并限制证书接口访问。", "effects": [{"comp_name": "github.com/casdoor/casdoor", "ecosystem": "go", "versions": [{"affected_version": "(-∞,4.4.0]", "min_fixed_version": "", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-09-15", "level": "Critical", "mps_id": "MPS-y7rd-06uv", "poc": false, "poc_url": [], "published_time": "2026-09-15", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-y7rd-06uv", "name": "https://www.oscs1024.com/hd/MPS-y7rd-06uv"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-90942", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-90942"}, {"url": "https://github.com/geo-chen/oss/blob/main/casdoor.md#finding-3-organization-admin-can-read-the-global-built-in-jwt-signing-private-key-via-apiget-certs-and-apiget-cert-incomplete-fix-of-3003--enables-cross-organization-token-forgery", "name": "Researcher write-up, Finding 3"}, {"url": "https://github.com/casdoor/casdoor/blob/v4.4.0/controllers/cert.go", "name": "controllers/cert.go at v4.4.0"}, {"url": "https://github.com/casdoor/casdoor/blob/v4.4.0/object/cert.go", "name": "object/cert.go at v4.4.0"}, {"url": "https://github.com/casdoor/casdoor", "name": ""}, {"url": "https://www.vulncheck.com/advisories/casdoor-through-4.4.0-private-key-exposure-via-certificate-endpoints", "name": "VulnCheck Advisory: Casdoor through 4.4.0 Private Key Exposure via Certificate Endpoints"}], "scope_influence": "", "tags": ["go"], "title": "Casdoor证书私钥泄露", "_translated": true, "_saved_at": "2026-09-15T00:09:14+00:00", "_first_saved_at": "2026-09-14T21:18:39+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-y7rd-06uv"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过向受信任的数据序列化过程中添加恶意数据，从而在序列化和反序列化过程中执行恶意代码的攻击漏洞。这种漏洞通常存在于使用序列化 (serialization) 机制存储和传输数据的程序中。\n", "title": "什么是反序列化"}, {"content": "- 注入攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码注入到程序中，从而实现代码执行的目的。\n- 反射攻击：攻击者使用反射机制，在序列化过程中动态生成恶意数据，并将恶意代码注入到程序中，从而实现代码执行的目的。\n- 缓冲区溢出攻击：攻击者通过在序列化过程中向缓冲区输入恶意数据，导致缓冲区溢出，从而破坏程序的内存管理，实现代码执行的目的。\n- 格式字符串攻击：攻击者通过在序列化过程中输入恶意数据，导致程序使用错误的格式字符串，从而实现代码执行的目的。\n- 数据流攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码作为一个数据流传递给程序，从而实现代码执行的目的。\n", "title": "反序列化常见的攻击方式"}, {"content": "- 不信任输入数据：程序应该严格检查输入数据的有效性，并避免使用不受信任的数据。\n- 使用安全的序列化机制：程序应该使用安全的序列化机制，如 JSON 或 XML 序列化，而不是第三方序列化库。\n- 最小特权原则：程序应该限制对受信任数据的处理权限，并避免在运行时修改数据。\n- 代码审查和漏洞扫描：程序应该进行代码审查和漏洞扫描，以发现和修复潜在的安全漏洞。\n", "title": "如何预防反序列化"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-62263", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.2}]}, "cvss_score": 9.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-502", "description": "OpenAM WebAuthn 认证模块的 ObjectInputFilter 仅依据 stream depth 是否大于 1 无条件放行所有非根对象而未校验实际类名，导致以 AuthenticatorImpl 为根、内嵌任意 gadget 链的反序列化流可在用户登录认证阶段触发任意代码执行，构成远程代码执行漏洞。\n受影响版本中，org.openidentityplatform.openam:openam-auth-webauthn 的 16.1.1 及以下版本中，WebAuthnAuthentication.deserialize 在调用 ObjectInputStream 反序列化外部可控的 authBytes 字节流之前注册的 setObjectInputFilter 回调，会先判断 filterInfo.depth() 是否大于 1，若是则无条件返回 ObjectInputFilter.Status.ALLOWED，再依据 filterInfo.serialClass().getName() 与 ALLOWED_AUTHENTICATOR_CLASSES 进行白名单匹配；由于 Java 反序列化过滤器会为对象图中的每一个类调用一次回调，而 depth==1 只在根对象的实际类解析时出现，因此白名单只能约束根对象的最终类型，AuthenticatorImpl 字段内任意嵌套的 gadget 类（包括不在 webauthn4j 包内、未列入任何白名单的应用或第三方类）在 readObject/readResolve 阶段会被无条件实例化并执行任意代码，攻击者通过 WebAuthn 登录请求中可控的 userHandle 输入即可触发，构成远程代码执行。\n修复版本中通过 16.1.2 中发布的提交 9dd0fbe07f70f118cf45042d3a9ffb32f3c21e08，WebAuthnAuthentication.deserialize 的过滤器回调移除了「depth \u003e 1 直接放行」的早退分支，改为对每一层 depth 都按 serialClass 的实际类名进行校验：先对数组类型递归取其组件类型，对 primitive 类型直接放行，再将类名与新增的 WEBAUTHN4J_PACKAGE_PREFIX（com.webauthn4j. 前缀）及 ALLOWED_JDK_CLASSES（涵盖 java.lang.Number/String/Enum、UUID、BigInteger、java.util.* 容器类及其不可变/单例视图）匹配，命中则放行，未命中则返回 REJECTED，同时仅在 depth==1 时强制根类必须为 AuthenticatorImpl；上述改动对对象图每一节点都强制走类名校验，覆盖了原过滤器只校验根类名的拦截缺陷，切断 gadget 链通过用户可控反序列化输入进入应用代码的路径。", "effects": [{"comp_name": "org.openidentityplatform.openam:openam-auth-webauthn", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,16.1.2)", "min_fixed_version": "16.1.2", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "反序列化", "kind_en": "不可信数据的反序列化", "last_modified_time": "2026-09-15", "level": "Critical", "mps_id": "MPS-30sz-phln", "poc": false, "poc_url": [], "published_time": "2026-09-15", "reference_url_list": [{"url": "https://github.com/OpenIdentityPlatform/OpenAM/security/advisories/GHSA-gf8h-gq53-288j", "name": ""}, {"url": "https://github.com/OpenIdentityPlatform/OpenAM/commit/9dd0fbe07f70f118cf45042d3a9ffb32f3c21e08", "name": ""}, {"url": "https://github.com/OpenIdentityPlatform/OpenAM/releases/tag/16.1.2", "name": ""}, {"url": "https://github.com/advisories/GHSA-gf8h-gq53-288j", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "OpenAM WebAuthn Java 反序列化远程代码执行漏洞", "_translated": true, "_saved_at": "2026-09-15T10:51:23+00:00", "_first_saved_at": "2026-09-15T10:51:23+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-30sz-phln"}, {"analysis_status": 0, "articles": [], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-48717", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:H/AT:P/PR:N/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.1}]}, "cvss_score": 9.1, "cvss_vector": "CVSS:4.0/AV:N/AC:H/AT:P/PR:N/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-285", "description": "OpenAM 是开源身份管理与 OAuth2/OIDC 实现，其 OAuth2 模块在授权码兑换环节处理 PKCE 验证时存在逻辑缺陷。\n受影响版本中，当 OAuth2 Provider 的 codeVerifierEnforced 配置关闭（默认为 false）时，AuthorizationCodeGrantTypeHandler.handle() 方法仅在请求附带 code_verifier 参数时才校验 PKCE；若攻击者省略该参数，授权码关联的 code_challenge 完全不被验证，形成 PKCE 绕过。攻击者拦截授权码后可跳过 code_verifier 直接兑换令牌，对使用默认配置的公开客户端部署可直接劫持用户会话。\n修复版本中通过在 AuthorizationCodeGrantTypeHandler.handle() 中增加 storedCodeChallenge 非空判断，使所有带 code_challenge 签发的授权码在兑换时必须提供匹配的 code_verifier，彻底消除省略参数即可绕过验证的条件。", "effects": [{"comp_name": "org.openidentityplatform.openam:openam-oauth2", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,16.1.1)", "min_fixed_version": "16.1.1", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权机制不恰当", "kind_en": "不当授权", "last_modified_time": "2026-07-03", "level": "Critical", "mps_id": "MPS-csft-e1n8", "poc": false, "poc_url": [], "published_time": "2026-09-15", "reference_url_list": [{"url": "https://github.com/OpenIdentityPlatform/OpenAM/security/advisories/GHSA-4v2w-2wqp-mc85", "name": ""}, {"url": "https://github.com/advisories/GHSA-4v2w-2wqp-mc85", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "OpenAM OAuth PKCE 授权绕过漏洞", "_translated": true, "_saved_at": "2026-09-15T10:51:22+00:00", "_first_saved_at": "2026-09-15T10:51:22+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-csft-e1n8"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "cnvd_id": "", "cve_id": "CVE-2026-12793", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-269", "description": "JetFormBuilder 是 Crocoblock 开源的 WordPress 动态表单构建插件，用于创建 Gutenberg 表单并处理提交与服务端校验。\n受影响版本中，Form_Handler 从 POST 参数 _jet_engine_booking_form_id 读取表单 ID 后仅做 absint，未校验目标文章是否为已发布的 jet-form-builder 表单。Block_Helper::get_blocks_by_post 会把该文章内容 parse_blocks 为表单 schema，提交流程随即执行 Advanced Validation 的 Server_Side_Rule；自定义回调可调用当时未列入黑名单的 wp_insert_user，未认证攻击者可创建管理员账号。\n修复版本中通过新增 Block_Helper::is_valid_form_post，只接受 post_type 为 jet-form-builder 且状态为 publish 的文章；Form_Handler::set_form_id 在校验失败时将 form_id 置 0 并中止提交，同时为 SSR 规则增加提交签名校验，并将 wp_insert_user、wp_update_user 加入回调黑名单。", "effects": [{"comp_name": "jetformbuilder", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,3.6.2.2)", "min_fixed_version": "3.6.2.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-09-16", "level": "Critical", "mps_id": "MPS-8iak-e2tw", "poc": false, "poc_url": [], "published_time": "2026-09-16", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-8iak-e2tw", "name": "https://www.oscs1024.com/hd/MPS-8iak-e2tw"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-12793", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-12793"}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/a61b2ecc-d4e1-4e71-9187-ddc3d3616a29?source=cve", "name": ""}, {"url": "https://plugins.trac.wordpress.org/changeset/3575346/jetformbuilder", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "JetFormBuilder权限提升漏洞", "_translated": true, "_saved_at": "2026-09-16T05:42:15+00:00", "_first_saved_at": "2026-09-16T05:42:15+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-8iak-e2tw"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-91843", "cvss": {"cvssv31": [{"source": "cve@checkpoint.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "C ce_action 后，攻击者可提交任意 truebooker_wp_user_id 与 truebooker_f_user_email，触发 wp_update_user 修改包括管理员在内的账户邮箱，并借助密码重置接管对应账户。\n修复版本中通过移除 wp_ajax_nopriv_admin_addcustomer 钩子，并在 truebooker_admin_addcustomer 中增加 current_user_can('edit_users') 判断，未授权请求直接返回 403，切断未登录修改任意用户邮箱的路径。", "effects": [{"comp_name": "truebooker-appointment-booking", "ecosystem": "linux", "versions": [{"affected_version": "[0,1.2.4)", "min_fixed_version": "1.2.4", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-09-16", "level": "Critical", "mps_id": "MPS-xocm-gkt1", "poc": false, "poc_url": [], "published_time": "2026-09-16", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-xocm-gkt1", "name": "https://www.oscs1024.com/hd/MPS-xocm-gkt1"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-14349", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-14349"}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/3a61ddbc-9118-4cad-a639-7822606a3181?source=cve", "name": ""}, {"url": "https://plugins.trac.wordpress.org/changeset?old_path=/truebooker-appointment-booking/tags/1.2.3/main/function_ajax.php\u0026new_path=/truebooker-appointment-booking/tags/1.2.4/main/function_ajax.php", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "TrueBooker授权绕过漏洞", "_translated": true, "_saved_at": "2026-09-16T05:42:13+00:00", "_first_saved_at": "2026-09-16T05:42:13+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-xocm-gkt1"}, {"analysis_status": 0, "articles": [{"content": "应用程序在处理用户输入时的不完善或缺乏验证机制，所以攻击者能够通过向应用程序发送恶意输入，利用应用程序对输入数据的错误处理方式来注入自己的恶意代码。这些恶意代码会被应用程序误认为是合法的指令或数据，并在执行过程中被执行。", "title": "什么是代码注入"}, {"content": "应用程序使用可执行动态代码的函数来执行用户可控的参数，当应用程序对于用户输入过滤不完全时，攻击者可以注入恶意代码并控制代码执行流程。", "title": "代码注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对所有用户输入进行验证和过滤，确保只接受预期的有效输入。这包括对输入数据进行输入长度验证、类型检查和格式验证等。\r\n- 使用参数化查询或预编译语句：对于数据库查询操作，应该使用参数化查询或预编译语句，确保输入数据不会被误认为是执行代码。\r\n- 最小特权原则：应用程序在执行操作系统命令或动态代码时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。\r\n- 安全编码实践：开发人员应该采用安全编码实践，包括避免使用eval函数、避免拼接用户输入的字符串作为代码执行等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止代码注入攻击。", "title": "如何预防代码注入"}], "cnvd_id": "", "cve_id": "CVE-2026-73453", "cvss": {"cvssv31": [{"source": "psirt@arista.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 10}], "cvssv4": [{"source": "psirt@arista.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.5}]}, "cvss_score": 9.5, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-94", "description": "Arista EOS 是 Arista Networks 的商业网络操作系统，用于数据中心和云网络交换机的控制与转发管理，源码未公开。\n受影响版本中，未认证攻击者可向已启用的 P4Runtime 服务在会话初始化阶段发送恶意报文，使不可信输入进入代码注入路径，在交换机上执行任意代码并取得完整管理控制。P4Runtime 默认关闭，官方给出的暴露条件为无 TLS、TLS 未配置可信证书，或 mTLS 已启用 accounting 且 gNSI Authz 关闭。\n修复版本中通过厂商安全更新消除 P4Runtime 会话初始化阶段对恶意报文的代码注入执行路径，使未认证客户端无法再借此取得交换机完整管理控制；已修复版本为 4.36.2F、4.35.6M、4.34.8M 及对应后续发行，更早受影响发行线需升级到上述版本。", "effects": [{"comp_name": "eos", "ecosystem": "linux", "versions": [{"affected_version": "[4.29.2F,4.30.0F)", "min_fixed_version": "4.30.0F", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[4.32.0F,4.33.0F)", "min_fixed_version": "4.33.0F", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[4.35.0F,4.35.6M)", "min_fixed_version": "4.35.6M", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[4.34.0F,4.34.8M)", "min_fixed_version": "4.34.8M", "repository": "unmanaged", "solutions": [], "upstream": true}, 也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-90822", "cvss": {"cvssv31": [{"source": "contact@securifera.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-78", "description": "运行终止固件版本 10.1.2r60p100 的 FatPipe MPVPN、WARP 和 IPVPN 设备在 xtremed 守护程序中包含操作系统命令注入漏洞。有权访问受影响管理界面的未经身份验证的远程攻击者可以向 AuthFormServlet 端点提交精心设计的输入，导致身份验证数据由 shell 处理，并允许以 root 身份执行任意命令。\n\n受影响的管理接口默认处于禁用状态，并且必须由客户在端点变得可访问之前启用。 FatPipe 建议限制对受信任管理网络的管理访问，并使用 WAN 访问控制列表来限制对受信任源的访问。", "effects": [{"comp_name": "IPVPN", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,10.1.2r60p100]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "MPVPN", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,10.1.2r60p100]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "WARP", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,10.1.2r60p100]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-09-17", "level": "Critical", "mps_id": "MPS-g4rv-e9tj", "poc": false, "poc_url": [], "published_time": "2026-09-17", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-g4rv-e9tj", "name": "https://www.oscs1024.com/hd/MPS-g4rv-e9tj"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-90822", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-90822"}, {"url": "https://www.securifera.com/advisories/", "name": ""}], "scope_infl 置错误的信任门不能用于假定内部或 LDAP 帐户。\n\n此问题影响 pgAdmin 4：从 6.2 到 9.18。", "effects": [{"comp_name": "pgAdmin 4", "ecosystem": "linux", "versions": [{"affected_version": "(6.2,9.18)", "min_fixed_version": "9.18", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "在安全决策中依赖未经信任的输入", "kind_en": "安全决策中对不可信输入的依赖", "last_modified_time": "2026-09-18", "level": "Critical", "mps_id": "MPS-dm0s-p2ck", "poc": false, "poc_url": [], "published_time": "2026-09-18", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-dm0s-p2ck", "name": "https://www.oscs1024.com/hd/MPS-dm0s-p2ck"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-86863", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-86863"}, {"url": "https://github.com/pgadmin-org/pgadmin4/issues/10383", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-86863漏洞", "_translated": true, "_saved_at": "2026-09-17T17:29:23+00:00", "_first_saved_at": "2026-09-17T17:29:23+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-dm0s-p2ck"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-91039", "cvss": {"cvssv4": [{"source": "6b3ad84c-e1a6-4bf7-a703-f496b71e49db", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.1}]}, "cvss_score": 9.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-290", "description": "team-alembic ash_authentication 中的欺骗绕过身份验证漏洞允许操作动态_oidc 策略的一个身份提供商连接的攻击者以通过不同连接建立的本地用户身份登录。\n\n该策略旨在通过将每个 UserIdentity 行的策略字段写入“\u003cname\u003e/\u003cconnection_id\u003e”来将每个连接保留在其自己的身份命名空间中，但该命名空间永远不会生效。 __connection_id__ 仅填充在dynamic_oidc/plug.ex 中按请求构建的临时运行时结构上，DynamicOidc.IdentityChange.change/3 通过 Info.strategy_for_action 从编译时 DSL 重新获取策略，生成持久结构，其 __connection_id__ 为其 defstruct 默认值 nil。因此，OAuth2.identity_strategy_name/1 在 oauth2/user_resolver.ex 和 oauth2/sign_in_preparation.ex 中回退到身份写入和读取的裸策略名称。由于身份资源的唯一键是（uid，策略），因此每个连接中的每个子都存在一行，并且身份匹配分支在任何电子邮件检查之前运行。这两种策略都不处理 iss，因此没有其他任何东西可以区分颁发者：OpenID Connect Core 第 5.7 节使 sub 仅在颁发者内唯一，因此两个编号主题的连接独立共享一个主题空间。\n\n此问题影响 ash_authentication：从 5.0.0-rc.10 到 5.0.0-rc.14 之前。", "effects": [{"comp_name": "ash_authentication", "ecosystem": "linux", "versions": [{"affected_version": "[5.0.0-rc.10,5.0.0-rc.14)", "min_fixed_version": "5.0.0-rc.14", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "使用欺骗进行的认证绕过", "kind_en": "通过欺骗绕过身份验证", "last_modified_time": "2026-09-18", "level": "Critical", "mps_id": "MPS-27pc-uwza", "poc": false, "poc_url": [], "published_time": "2026-09-18", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-27pc-uwza", "name": "https://www.oscs1024.com/hd/MPS-27pc-uwza"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-91039", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-91039"}, {"url": "https://github.com/team-alembic/ash_authentication/security/advisories/GHSA-73j9-m294-fvv9", "name": "GitHub Advisory"}, {"url": "https://cna.erlef.org/cves/CVE-2026-91039.html", "name": "EEF CNA record for CVE-2026-91039"}, {"url": "https://osv.dev/vulnerability/EEF-CVE-2026-91039", "name": "OSV record EEF-CVE-2026-91039"}, {"url": "https://github.com/team-alembic/ash_authentication/commit/64530644f9b37ebb76ca14aeb83a77597a0034b7", "name": "Introducing commit 6453064 in team-alembic/ash_authentication"}, {"url": "https://github.com/team-alembic/ash_authentication/commit/73ad16e452670bbf843550a13361bd41e72ad964", "name": "Fix commit 73ad16e in team-alembic/ash_authentication"}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-91039漏洞", "_translated": true, "_saved_at": "2026-09-17T17:29:12+00:00", "_first_saved_at": "2026-09-17T17:29:12+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-27pc-uwza"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-92073", "cvss": {"cvssv31": [{"source": "134c704f-9b21-4f2e-91b3-4a467353bcc0", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "cwe": "CWE-269", "description": "Mozilla Firefox 是开源 Web 浏览器，Enterprise Policies 用于通过 policies.json 或组策略锁定扩展的安装与启停。\n受影响版本中，企业将扩展列入 Extensions.Locked 或设置为 force_installed 后，偏好设置里的禁用扩展按钮仍会显示；about:addons、WebExtensions 的 browser.management.setEnabled 以及 Firefox Sync 同步路径均可调用 AddonManager 禁用接口。AddonInternal.setUserDisabled 未校验 Services.policies.isAllowed(\"disable-extension:id\")，导致本机用户或同一账号下其他客户端能够关闭管理员锁定的扩展。\n修复版本中通过在 setUserDisabled、management.setEnabled 与同步引擎中强制执行 disable-extension 策略，并按 PERM_CAN_DISABLE 隐藏禁用按钮，切断对策略锁定扩展的禁用路径。", "effects": [{"comp_na n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-16140", "cvss": {"cvssv31": [{"source": "44488dab-36db-4358-99f9-bc116477f914", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-863", "description": "OpenBMC 是开源基板管理控制器固件项目，phosphor-net-ipmid 是其网络 IPMI（RMCP+）服务实现，NVIDIA BlueField-3、H3C HDM3 等下游产品会集成该组件。\n受影响版本中，command::RAKP12 仅按 BMC 会话 ID 检索会话，不要求会话处于 setupInProgress，也不把请求绑定到打开该会话的对端。低权限账户完成 Open Session 与 RAKP Message 1/3 并进入 active 后，可对同一会话再发送指向已启用管理员账户的 RAKP Message 1，覆盖 userName、userID、reqMaxPrivLevel 与权限字段，同时保留原会话的完整性/机密性对象、报文密钥与序号状态。随后 Set Session Privilege Level 依据改写后的管理员字段将会话提升为 Administrator，攻击者无需管理员密码即可获得管理级 IPMI 能力。\n修复版本中通过官方尚未发布的会话授权修复切断该提权链；截至 2026-09-15 公开披露，厂商仅确认修复进行中，phosphor-net-ipmid 主线未见已验证修复提交，公开资料未给出修复版本号。", "effects": [{"comp_name": "phosphor-net-ipmid", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,759f0500a4d9f9e2063206ea64d60079175b7d75]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-09-15", "level": "High", "mps_id": "MPS-gjzh-rucm", "poc": false, "poc_url": [], "published_time": "2026-09-15", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-gjzh-rucm", "name": "https://www.oscs1024.com/hd/MPS-gjzh-rucm"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-16140", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-16140"}, {"url": "https://www.runzero ffected_version": "[0,759f0500a4d9f9e2063206ea64d60079175b7d75]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "使用硬编码的凭证", "kind_en": "使用硬编码凭证", "last_modified_time": "2026-09-15", "level": "High", "mps_id": "MPS-06i4-82gx", "poc": false, "poc_url": [], "published_time": "2026-09-15", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-06i4-82gx", "name": "https://www.oscs1024.com/hd/MPS-06i4-82gx"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-16141", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-16141"}, {"url": "https://www.runzero.com/advisories/openbmc-ipmi-auth-bypass-rakp-cve-2026-16141/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "OpenBMC IPMI认证绕过", "_translated": true, "_saved_at": "2026-09-15T15:23:35+00:00", "_first_saved_at": "2026-09-15T15:23:35+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-06i4-82gx"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "attack_vector_type": "Local", "cnvd_id": "", "cve_id": "CVE-2026-90947", "cvss": {"cvssv31": [{"source": "secalert@redhat.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "cwe": "CWE-787", "description": "GIMP 是开源图像处理程序，内置 Lighting Effects 滤镜插件，用于为图像施加光照效果，并支持通过预设文件保存和加载光源配置。\n受影响版本中，Lighting Effects 插件在 load_preset_response 中用 fscanf 从预设文件读取 Number of lights 计数值，未校验返回值，也未将计数值限制在 NUM_LIGHTS（6）以内，随后以该计数值为上界循环写入 mapvals.lightsource 固定数组。超过 6 个光源的预设文件会造成越界写，导致进程崩溃或在当前用户上下文执行任意代码。\n修复版本中通过将 num_lights 初始化为 0，并在写入循环前使用 CLAMP 将其限制到 [0, NUM_LIGHTS]，阻止超界计数值进入光源数组写入路径。", "effects": [{"comp_name": "gimp", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,3.2.6)", "min_fixed_version": "3.2.6", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-09-15", "level": "High", "mps_id": "MPS-mal0-h1d6", "poc": false, "poc_url": [], "published_time": "2026-09-15", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-mal0-h1d6", "name": "https://www.oscs1024.com/hd/MPS-mal0-h1d6"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-90947", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-90947"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-90947", "name": ""}, {"url": "https://bugzilla.redhat.com/show_bug.cgi?id=2533005", "name": "RHBZ#2533005"}, {"url": "https://gitlab.gnome.org/GNOME/gimp/-/work_items/16682", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "GIMP光照预设越界写漏洞", "_translated": true, "_saved_at": "2026-09-14T17:25:51+00:00", "_first_saved_at": "2026-09-14T17:25:51+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-mal0-h1d6"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-47426", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:L/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.6}]}, "cvss_score": 7.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:L/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-287", "description": "OpenAM 是开源身份访问管理组件，其 OAuth2 模块支持 private_key_jwt 客户端认证方式。\n受影响版本中，ClientCredentialsReader 类的 verifyJwtBearer 方法未验证 JWT 的 iss 与 sub 声明是否匹配客户端注册信息，同时 OpenAMClientRegistration 的 byJWKsURI 方法将 JWT 声称的 iss 用作缓存键而非绑定到注册客户端本身，导致攻击者可利用自己注册的 OAuth2 客户端向任意其他使用 jwks_uri 发布密钥的客户端伪造令牌。\n修复版本中通过在 ClientCredentialsReader 中新增 iss/sub 一致性校验，并在 OpenAMClientRegistration 中引入按 clientId|jwks_uri 为键的独立缓存 ClientJwksResolverCache，将解析器的绑定 issuer 限定为注册客户端的 client_id，切断了跨客户端伪装的攻击路径。", "effects": [{"comp_name": "org.openidentityplatform.openam:openam-oauth2", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,16.1.1)", "min_fixed_version": "16.1.1", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "身份验证不当", "kind_en": "认证不当", "last_modified_time": "2026-09-15", "level": "High", "mps_id": "MPS-il7x-8sz4", "poc": false, "poc_url": [], "published_time": "2026-09-15", "reference_url_list": [{"url": "https://github.com/OpenIdentityPlatform/OpenAM/security/advisories/GHSA-f2cx-463q-7m2c", "name": ""}, {"url": "https://github.com/advisories/GHSA-f2cx-463q-7m2c", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "OpenAM OAuth Client Impersonation漏洞", "_translated": true, "_saved_at": "2026-09-15T10:51:18+00:00", "_first_saved_at": "2026-09-15T10:51:18+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-il7x-8sz4"}, {"analysis_status": 0, "articles": [], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-47424", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-693", "description": "OpenAM是开源身份访问管理解决方案，提供身份认证、授权和联邦服务，其服务端脚本沙箱用于隔离用户脚本与JVM底层资源。\n受影响版本中，GroovySandboxValueFilter的onMethodCall方法缺少对ProcessGroovyMethods.execute()扩展方法的拦截检查。当脚本调用execute()方法时，ProcessGroovyMethods会在任何返回值过滤之前直接启动OS进程，导致沙箱的类allow/deny列表无法拦截该调用，脚本作者可借此在OpenAM JVM上执行任意操作系统命令。\n修复版本中通过在GroovySandboxValueFilter.onMethodCall中新增isProcessLaunchExtension检测逻辑，在方法分发前判断receiver类型是否为CharSequence、List或String[]数组，以及method是否为execute或通过invokeMethod调用的execute，命中条件时抛出SecurityException阻断进程执行。", "effects": [{"comp_name": "org.openidentityplatform.openam:openam-scripting", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,16.1.1)", "min_fixed_version": "16.1.1", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "保护机制失效", "kind_en": "保护机制失效", "last_modified_time": "2026-09-15", "level": "High", "mps_id": "MPS-7xr8-1sbu", "poc": false, "poc_url": [], "published_time": "2026-09-15", "reference_url_list": [{"url": "https://github.com/OpenIdentityPlatform/OpenAM/security/advisories/GHSA-69j4-qvqr-hpw3", "name": ""}, {"url": "https://github.com/advisories/GHSA-69j4-qvqr-hpw3", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "OpenAM Groovy沙箱逃逸导致远程代码执行漏洞", "_translated": true, "_saved_at": "2026-09-15T10:51:14+00:00", "_first_saved_at": "2026-09-15T10:51:14+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-7xr8-1sbu"}, {"analysis_status": 0, "articles": [], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-53660", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:H/AT:P/PR:N/UI:A/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.4}]}, "cvss_score": 7.4, "cvss_vector": "CVSS:4.0/AV:N/AC:H/AT:P/PR:N/UI:A/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-1275", "description": "OpenAM 是 ForgeRock/OpenIdentityPlatform 维护的开源 Java 访问管理与 SSO 组件，OpenAM Community Edition 以 Maven 包 org.openidentityplatform.openam:openam-core 发布，浏览器侧的会话标识由名为 iPlanetDirectoryPro 的 SSO cookie 承担，并同时兼任 OAuth2/OIDC 同意页的 CSRF 凭据。\n受影响版本中，默认配置由 ServicesDefaultValues 与 serverdefaults.properties 同时落下 com.iplanet.am.cookie.secure=false、com.sun.identity.cookie.httponly=false 与缺失的 SameSite 属性三处不安全的默认值，再加上 ConsentRequiredResource 直接把 SSO 令牌 ID 注入同意页用作 csrf 值，导致 iPlanetDirectoryPro 这个本应仅作服务端会话标识的 cookie 既能被浏览器脚本读取、又会被作为 OAuth2 同意决策的 anti-CSRF 凭据复用一个完整的会话身份：任何同源 XSS 都能直接读取 cookie 拿到会话令牌完成 SSO session 窃取与攻击者驱动的 OAuth 同意授权，而即便没有 XSS，未带 SameSite 的 cookie 也会被同站顶层导航带回，从而允许跨站请求伪造对同意决策接口发起绕过 CSRF 的授权同意，造成会话身份与 CSRF 边界被混为一体。\n修复版本中通过重新拆分 CsrfProtection 的职责解除了这一耦合，CsrfProtection#createCsrfToken 使用 SecureRandom 为每次授权请求生成独立的 csrf 令牌，对有状态会话作为受保护的 session 属性存储、对无状态会话以 __Host-oauth2_csrf（或明文 HTTP 下的 oauth2_csrf）双提交回写带 HttpOnly 与 SameSite 的 cookie 颁发与校验，ConsentRequiredResource 的同意页仅渲染该独立令牌、AuthorizeResource 与 DeviceCodeVerificationResource 不再以 SSO 令牌 ID 作为 csrf 比较对象；同时在 ServicesDefaultValues 中根据部署协议自动推导 com.iplanet.am.cookie.secure，并在 serverdefaults.properties 与 validserverconfig.properties 中新增 org.openidentityplatform.openam.cookie.samesite=Lax 的默认值，使 iPlanetDirectoryPro 不再被默认强行暴露给脚本并填补缺失的 SameSite 防护。", "effects": [{"comp_name": "org.openidentityplatform.openam:openam-core", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,16.1.1)", "min_fixed_version": "16.1.1", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "具有不正确 SameSite 属性的敏感 Cookie", "kind_en": "具有不正确 SameSite 属性的敏感 Cookie", "last_modified_time": "2026-09-15", "level": "High", "mps_id": "MPS-165c-wh4p", "poc": false, "poc_url": [], "published_time": "2026-09-15", "reference_url_list": [{"url": "https://github.com/OpenIdentityPlatform/OpenAM/security/advisories/GHSA-fpmh-vx4h-xc33", "name": ""}, {"url": "https://github.com/OpenIdentityPlatform/OpenAM/releases/tag/16.1.1", "name": ""}, {"url": "https://github.com/advisories/GHSA-fpmh-vx4h-xc33", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "OpenAM 默认 SSO Cookie 配置不安全漏洞", "_translated": true, "_saved_at": "2026-09-15T10:51:16+00:00", "_first_saved_at": "2026-09-15T10:51:16+00:00", ified_time": "2026-09-16", "level": "High", "mps_id": "MPS-j7l6-gi92", "poc": false, "poc_url": [], "published_time": "2026-09-16", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-j7l6-gi92", "name": "https://www.oscs1024.com/hd/MPS-j7l6-gi92"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-69486", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-69486"}, {"url": "https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-69486", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-69486 漏洞", "_translated": true, "_saved_at": "2026-09-16T00:58:02+00:00", "_first_saved_at": "2026-09-16T00:58:02+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-j7l6-gi92"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "cnvd_id": "", "cve_id": "CVE-2026-85893", "cvss": {"cvssv31": [{"source": "secure@microsoft.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "cwe": "CWE-416", "description": "Microsoft Edge（基于 Chromium）中的释放后使用允许未经授权的攻击者通过网络提升权限。", "effects": [{"comp_name": "edge_chromium", "ecosystem": "linux", "versions": [{"affected_version": "[1.0.0.0,153.0.4234.32)", "min_fixed_version": "153.0.4234.32", " 0:00", "_source_page": "https://www.oscs1024.com/hd/MPS-u85j-khq2"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-92466", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-862", "description": "zlt2000 microservices-platform 到 6.0.0 包含缺少授权漏洞，其中 zlt.security.auth.urlPermission.enable 标志默认为 false，从而在身份验证后禁用所有权限检查。没有角色的经过身份验证的用户可以绕过禁用的授权强制执行来访问管理 API，包括用户管理、角色分配和 Elasticsearch 索引操作。", "effects": [{"comp_name": "microservices-platform", "ecosystem": "linux", "versions": [{"affected_versio 的应用程序在主机操作系统上执行任意命令。 当应用程序将不安全的用户提供的数据（表单、cookie、HTTP 标头等）传递到系统 shell 时，就会产生缺陷。攻击者通过构造恶意的命令或数据，将其注入到程序执行的上下文中，从而绕过程序的输入验证和安全措施，实现对程序操作的恶意操作。", "title": "什么是命令注入"}, {"content": "- 文件上传：攻击者通过构造恶意的文件上传请求，将包含恶意命令的文件上传到服务器，从而利用命令注入漏洞执行恶意命令。\n- SQL 注入：攻击者通过构造恶意的 SQL 查询语句，将包含恶意命令的 SQL 语句注入到数据库中，从而执行恶意命令，窃取数据或者破坏系统。\n- 命令执行：攻击者通过在 Web 应用程序的表单提交数据中注入恶意命令，从而执行恶意命令，例如删除文件、格式化硬盘等。\n- 命令注入漏洞的旁路攻击：攻击者可以利用命令注入漏洞旁路控制程序的执行流程，从而窃取数据、破坏系统、控制程序等。\n", "title": "命令注入常见的攻击方式"}, {"content": "- 输入验证：在程序输入处对输入数据进行严格的验证和过滤，确保输入数据符合预期的格式和类型，避免被攻击者注入恶意命令。\n- 输出过滤：在程序输出处对输出数据进行严格的过滤和检查，确保输出数据符合预期的格式和类型，避免被攻击者截获和篡改。\n- 使用安全的编程模型：使用安全的编程模型，例如避免使用原生的命令执行方式，使用安全的框架和库来处理输入数据和执行命令，避免命令注入漏洞。\n- 数据库加密和访问控制：对于敏感数据和命令，使用加密和访问控制措施，确保只有授权用户可以访问和执行命令，避免被攻击者窃取和篡改。\n- 定期更新和升级：定期更新和升级应用程序和库的版本，确保应用程序和库的最新版本包含了最新的安全补丁和修复措施，避免安全漏洞的出现和利用。\n- 安全审计和监控：定期对系统和应用程序进行安全审计和监控，及时发现和阻止潜在的安全漏洞和攻击，确保系统和数据的安全和可靠性。", "title": "如何预防命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-88765", "cvss": {"cvssv31": [{"source": "cve@gitlab.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "high", "base_score": 8.5}]}, "cvss_score": 8.5, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:C/C:H/I:H/A:H", "cwe": "CWE-77", "description": "GitLab 是开源 DevOps 平台，Community Edition 源码公开，Enterprise Edition 提供 Advanced Search 等企业能力，用于代码托管、持续集成与仓库全文检索。\n受影响版本中，已认证用户导入含超长提交作者名等内容的 Git 项目导出包后，Advanced Search 索引会调用 Unicode 转换包装层 CharsetConverter.ConvertToUtf8。该方法把 utf16Buffer 的字节长度误当作 ICU destCapacity，容量被高估约一倍，超长输入越过缓冲区写入，可在 GitLab 服务器上远程执行代码。\n修复版本中通过将 convertToUtf16 的 destCapacity 改为按 UChar 个数计算，使超过真实容量的输入被拒绝，切断项目导入内容在索引阶段触发缓冲区溢出并执行代码的路径。", "effects": [{"comp_name": "gitlab", "ecosystem": "linux", "versions": [{"affected_version": "[12.3,19.1.8)", "min_fixed_version": "19.1.8", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[19.2,19.2.6)", "min_fixed_version": "19.2.6", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[19.3,19.3.2)", "min_fixed_version": "19.3.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "命令注入", "kind_en": "命令中使用的特殊元素的不正确中和（“命令注入”）", "last_modified_time": "2026-09-16", "level": "High", "mps_id": "MPS-6222-e9b7", "poc": false, "poc_url": [], "published_time": "2026-09-16", "reference_url_list": [{"url": "https://cybersecuritynews.com/gitlab-patches-critical-flaws/", "name": ""}, {"url": "https://docs.gitlab.com/releases/patches/patch-release-gitlab-19-3-2-released/", "name": ""}, {"url": "https://gitlab.com/gitlab-org/gitlab-elasticsearch-indexer/-/commit/a74eefbf9db3409e4be72d67d43234be226387de", "name": ""}, {"url": "https://gitlab.com/gitlab-org/gitlab-elasticsearch-indexer/-/tags/v5.14.13", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "GitLab EE缓冲区溢出", "_translated": true, "_saved_at": "2026-09-15T19:25:54+00:00", "_first_saved_at": "2026-09-15T19:25:54+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-6222-e9b7"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-83357", "cvss": {"cvssv31": [{"source": "secalert_us@oracle.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.1}]}, "cvss_score": 8.1, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "", "description": "Oracle GraalVM for JDK、Oracle Java SE 的 Oracle GraalVM 产品（组件：编译器）中存在漏洞。   受影响的支持版本是 Oracle GraalVM for JDK 17：23.0.13.1；适用于 JDK 21 的 Oracle GraalVM：23.1.12.1；  Oracle GraalVM：25.0.4.1。难以利用的漏洞允许未经身份验证的攻击者通过 HTTP 进行网络访问来危害 Oracle GraalVM for JDK、Oracle GraalVM。  成功攻击此漏洞可能会导致 Oracle GraalVM for JDK、Oracle GraalVM 被接管。 CVSS 3.1 基本分数 8.1（机密性、完整性和可用性影响）。  CVSS 矢量：（CVSS：3.1/AV：N/AC：H/PR：N/UI：N/S：U/C：H/I：H/A：H）。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "", "kind_en": "", "last_modified_time": "2026-09-16", "level": "High", "mps_id": "MPS-0t2j-rx76", "poc": false, "poc_url": [], "published_time": "2026-09-16", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-0t2j-rx76", "name": "https://www.oscs1024.com/hd/MPS-0t2j-rx76"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-83357", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-83357"}, {"url": "https://www.oracle.com/security-alerts/cspusep2026.html", "name": "Oracle Advisory"}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "CVE-2026-83357漏洞", "_translated": true, "_saved_at": "2026-09-16T00:58:10+00:00", "_first_saved_at": "2026-09-16T00:58:10+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-0t2j-rx76"}, {"analysis_status": 0, "articles": [{"content": "由于整数类型的有限范围，在进行算术运算或操作时，结果可能超出类型的表示范围，导致溢出或环绕。溢出指的是结果超过了类型的最大值或小于了最小值，而环绕指的是结果绕回到类型的最小值或最大值。", "title": "什么是整数溢出或环绕"}, {"content": "- 缓冲区溢出：整数溢出可能导致缓冲区溢出漏洞。当整数溢出导致分配的缓冲区大小不足以容纳结果时，攻击者可以利用这个漏洞覆盖相邻的内存区域，执行恶意代码或篡改程序的状态。\r\n- 身份验证绕过：在进行身份验证或访问控制时，整数溢出可能导致绕过验证的漏洞。攻击者可以构造特殊的输入，使溢出的整数值绕过了预期的验证逻辑，从而获得未经授权的访问权限。\r\n- 数据篡改：整数溢出可能导致数据篡改漏洞。攻击者可以通过使整数溢出，修改计数器、索引或其他控制数据的值，导致程序在处理数据时发生错误或执行意外的操作。", "title": "整数溢出或环绕常见的攻击方式"}, {"content": "- 输入验证与限制：对用户输入的整数进行合理的验证和限制，确保其在允许的范围内。\r\n- 使用安全的整数操作函数：使用安全的整数操作函数，如`add_with_overflow()`、`sub_with_overflow()`、`mul_with_overflow()`等，这些函数会检查并处理溢出情况，确保计算结果在安全范围内。\r\n- 类型检查和转换：在进行整数运算或操作之前，进行类型检查和转换，确保操作数的类型和范围是合适的。\r\n- 强制性编码标准和最佳实践：制定强制性的编码标准和最佳实践，包括对整数运算和操作的规范和限制，以帮助程序员编写更可靠、安全的代码。\r\n- 静态代码分析和测试：使用静态代码分析工具和测试技术来检测和识别潜在的整数溢出问题。这些工具可以帮助发现代码中可能存在的溢出漏洞，并及时修复。", "title": "如何预防整数溢出或环绕"}], "cnvd_id": "", "cve_id": "CVE-2026-92248", "cvss": {"cvssv31": [{"source": "secalert@redhat.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "cwe": "CWE-190", "description": "GIMP 中的 file-psd 插件中发现了一个缺陷。为特制的 PSD（Photoshop 文档）图像文件生成缩略图预览时，在嵌入 JPEG 标头的值相乘期间会发生整数溢出。这会导致堆分配过小，从而在解码图像数据时导致基于堆的缓冲区溢出。这种缓冲区溢出会破坏相邻的堆对象，从而允许受控的内存写入，从而导致应用程序崩溃或任意代码执行。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "整数溢出或环绕", "kind_en": "整数溢出或环绕", "last_modified_time": "2026-09-16", "level": "High", "mps_id": "MPS-mn25-ijr4", "poc": false, "poc_url": [], "published_time": "2026-09-16", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-mn25-ijr4", "name": "https://www.oscs1024.com/hd/MPS-mn25-ijr4"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-92248", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-92248"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-92248", "name": ""}, {"url": "https://bugzilla.redhat.com/show_bug.cgi?id=2534282", "name": "RHBZ#2534282"}, {"url": "https://gitlab.gnome.org/GNOME/gimp/-/work_items/16775", "name": ""}], "scope_influence": "", "tags": [], "title": "Gimp：为 psd 文件生成缩略图预览时整数溢出", "_translated": true, "_saved_at": "2026-09-16T00:58:07+00:00", "_first_saved_at": "2026-09-16T00:58:07+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-mn25-ijr4"}, {"analysis_status": 0, "articles": [{"content": "- 编写代码时没有正确处理输入数据或没有正确验证用户输入而导致的。", "title": "什么是关键资源权限分配不当"}, {"content": "- 弱密码或未使用的密码：当管理员或系统管理员在创建帐户时，没有使用强密码或未对帐户进行密码更新时，可能会发生这种情况。弱密码可能会被黑客破解或通过其他方式轻松访问系统。\n- 未正确配置权限：在系统中，不同的资源通常需要不同的权限才能访问。如果管理员未正确配置权限，那么未经授权的用户可能会通过欺骗系统或利用其他漏洞来访问关键资源。\n- 权限重用：在某些情况下，管理员可能会将某些权限分配给某个用户，但这些权限并未被正确地限制或授权给该用户。如果其他用户尝试使用这些权限访问关键资源，那么他们可能会获得未经授权的访问权限。\n- 未正确验证用户输入：当开发人员没有正确验证用户输入时，可能会发生这种情况。例如，如果开发人员未正确过滤用户输入的用户名或密码，那么黑客可能会利用这些信息轻松地访问系统。\n", "title": "关键资源权限分配不当常见的攻击方式"}, {"content": "- 使用强密码：管理员应该使用强密码来保护系统，并定期更改密码。强密码应该包括数字、字母和符号，并且应该不同于其他帐户使用的密码。\n- 正确配置权限：管理员应该正确配置系统中不同资源所需的权限。用户可以被授予访问特定资源的权限，但不应该被授予访问其他资源的权限。\n- 权限限制：管理员应该使用权限限制来限制用户对特定资源的访问。例如，用户可以被授予访问特定文件夹的权限，但不能访问其他文件夹。\n- 输入验证：开发人员应该正确验证用户输入。例如，他们可以过滤用户输入的用户名和密码，以确保它们符合预期的格式。\n- 安全培训：管理员和用户应该接受安全培训，以便了解如何识别和避免常见的安全漏洞，例如不正确权限授予漏洞。\n- 定期更新和修补软件：系统软件和应用程序应该定期更新和修补，以确保它们不受最新安全漏洞的影响。", "title": "如何预防关键资源权限分配不当"}], "cnvd_id": "", "cve_id": "CVE-2026-89793", "cvss": {}, "cvss_score": 7.8, "cvss_vector": "", "cwe": "CWE-732", "description": "Linux 内核是开源操作系统内核，其中 ublk 是基于 io_uring 的用户态块设备驱动，由用户态守护进程处理块 I/O。\n受影响版本中，ublk 字符设备 mmap 回调 ublk_ch_mmap 会拒绝带 VM_WRITE 的映射，但未清除 VM_MAYWRITE。用户态守护进程可用 PROT_READ 映射每队列命令缓冲区，再经 mprotect 升级为 PROT_WRITE，改写内核维护的 ublksrv_io_desc 字段，包括 addr、op_flags、nr_sectors 与 start_sector。\n修复版本中通过在 ublk_ch_mmap 拒绝写映射后调用 vm_flags_clear(vma, VM_MAYWRITE)，阻断经 mprotect 提升写权限的路径，修复后 mprotect 返回 -EACCES，命令缓冲区保持只读。", "effects": [{"comp_name": "linux_kernel", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,6.12.110)", "min_fixed_version": "6.12.110", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,7.3-rc2)", "min_fixed_version": "7.3-rc2", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,6.6.157)", "min_fixed_version": "6.6.157", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,6.18.51)", "min_fixed_version": "6.18.51", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,7.2.5)", "min_fixed_version": "7.2.5", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.7,6.12.110)", "min_fixed_version": "6.12.110", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.13,6.18.51)", "min_fixed_version": "6.18.51", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.0,6.6.157)", "min_fixed_version": "6.6.157", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[7.3-rc1,7.3-rc2)", "min_fixed_version": "7.3-rc2", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.19,7.2.5)", "min_fixed_version": "7.2.5", "repository": "unmanaged", "soluti -Fi 可视对讲监视器，用于门口机呼叫显示，并可通过 Wi-Fi 将通话转接到移动端应用。\n受影响版本中，监视器在下载固件更新时缺少 TLS 证书校验，攻击者可对更新通道实施中间人攻击，向设备投递被篡改的固件。\n修复版本中通过在固件更新下载通道补齐 TLS 证书校验，阻止不可信更新源，切断中间人篡改更新包的链路。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "证书验证不恰当", "kind_en": "证书验证不当", "last_modified_time": "2026-09-16", "level": "High", "mps_id": "MPS-aqpn-6srl", "poc": false, "poc_url": [], "published_time": "2026-09-16", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-aqpn-6srl", "name": "https://www.oscs1024.com/hd/MPS-aqpn-6srl"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-86474", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-86474"}, {"url": "https://fermax.com/security-advisories", "name": ""}], "scope_influence": "", "tags": [], "title": "VEO固件证书校验漏洞", "_translated": true, "_saved_at": "2026-09-16T10:40:19+00:00", "_first_saved_at": "2026-09-16T10:40:19+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-aqpn-6srl"}, {"analysis_status": 0, "articles": [{"content": "应用程序在处理用户输入时的不完善或缺乏验证机制，所以攻击者能够通过向应用程序发送恶意输入，利用应用程序对输入数据的错误处理方式来注入自己的恶意代码。这些恶意代码会被应用程序误认为是合法的指令或数据，并在执行过程中被执行。", "title": "什么是代码注入"}, {"content": "应用程序使用可执行动态代码的函数来执行用户可控的参数，当应用程序对于用户输入过滤不完全时，攻击者可以注入恶意代码并控制代码执行流程。", "title": "代码注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对所有用户输入进行验证和过滤，确保只接受预期的有效输入。这包括对输入数据进行输入长度验证、类型检查和格式验证等。\r\n- 使用参数化查询或预编译语句：对于数据库查询操作，应该使用参数化查询或预编译语句，确保输入数据不会被误认为是执行代码。\r\n- 最小特权原则：应用程序在执行操作系统命令或动态代码时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。\r\n- 安全编码实践：开发人员应该采用安全编码实践，包括避免使用eval函数、避免拼接用户输入的字符串作为代码执行等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止代码注入攻击。", "title": "如何预防代码注入"}], "cnvd_id": "", "cve_id": "CVE-2026-86792", "cvss": {}, "cvss_score": 7.5, "cvss_vector": "", "cwe": "CWE-94", "description": "Apache Airflow Apache Kafka Provider（apache-airflow-providers-apache-kafka）是开源工作流平台 Apache Airflow 的官方 Kafka 集成组件，用于连接 Kafka 集群并发布 DagRun 与 TaskInstance 状态事件。\n受影响版本中，KafkaBaseHook.get_conn 会读取 Kafka Connection extra 里 CALLBACK_CONFIG_KEYS（error_cb、oauth_cb 等）的 dotted-path 字符串，并由 _resolve_callbacks 直接调用 import_string 解析为 Python 可调用对象后交给 confluent-kafka 客户端执行，过程中没有 allowlist。当部署启用非默认的 Kafka event producer（dag_run_events_enabled 或 task_instance_events_enabled）时，该客户端会在 Scheduler 进程内构建，仅具备 Connection 编辑权限的用户即可在控制面执行任意代码；Google Managed Kafka 路径会覆盖用户提供的 oauth_cb，因此不受影响，普通 broker 与 Amazon MSK 会暴露该风险。\n修复版本中通过新增默认为空的 [apache_kafka] callback_allowlist 配置，仅在 extra 中的回调路径与允许列表完全匹配时才调用 import_string，切断不可信 Connection 回调进入 Scheduler 执行路径。", "effects": [{"comp_name": "apache-airflow-providers-apache-kafka", "ecosystem": "pip", "versions": [{"affected_version": "[1.15.0,2.0.0)", "min_fixed_version": "2.0.0", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "代码注入", "kind_en": "代码生成控制不当（“代码注入”）", "last_modified_time": "2026-09-16", "level": "High", "mps_id": "MPS-a63f-c956", "poc": false, "poc_url": [], "published_time": "2026-09-16", "reference_url_list": [{"url": "http://www.mail-archive.com/announce@apache.org/msg11929.html", "name": ""}, {"url": "https://www.mail-archive.com/announce@apache.org/msg11929.html", "name": ""}, {"url": "https://github.com/apache/airflow/pull/72208", "name": ""}, {"url": "https://github.com/apache/airflow/commit/d675437ccdf87a3e36d8c8559bdcff6e62a5f618", "name": ""}, {"url": "https://airflow.apache.org/docs/apache-airflow-providers-apache-kafka/2.0.0/changelog.html", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-86792", "name": ""}, {"url": "https://airflow.apache.org/", "name": ""}, {"url": "https://pypi.org/project/apache-airflow-providers-apache-kafka/2.0.0/", "name": ""}], "scope_influence": "", "tags": ["python", "开源"], "title": "Airflow Kafka回调RCE", "_translated": true, "_saved_at": "2026-09-15T19:25:50+00:00", "_first_saved_at": "2026-09-15T19:25:50+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-a63f-c956"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-89063", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "cwe": "CWE-639", "description": "Bookly（WordPress 插件 bookly-responsive-appointment-booking-tool）是开源在线预约与排班组件，用于在站点前台提供预约能力，并可通过 Cloud AI Assistant 以对话方式完成预约。\n受影响版本中，Bookly\\Frontend\\Modules\\Ai\\Ajax 将默认权限设为 anonymous，aiPoll() 与 aiSendMessage() 直接读取用户可控的 conversation_id 并调用 AiConversation::find() 加载会话；bookly_ai_conversations 没有 owner、user 或 session 标识，会话 ID 为连续整数。未认证攻击者可递增 conversation_id 枚举任意客户 AI 预约对话，读取姓名、邮箱、电话和预约细节，并向任意会话注入消息，随后由 Cloud AI worker 连同完整私有历史一并回放。\n修复版本中通过为会话表新增唯一 token，并以 authorizeConversation() 按 token 校验会话归属，使 aiPoll() 与 aiSendMessage() 不再接受连续整数 conversation_id 作为浏览器句柄，阻断未认证跨会话读取与注入。", "effects": [{"comp_name": "bookly-responsive-appointment-booking-tool", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,28.2)", "min_fixed_version": "28.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "通过用户控制密钥绕过授权机制", "kind_en": "通过用户控制的密钥绕过授权", "last_modified_time": "2026-09-16", "level": "High", "mps_id": "MPS-cztm-u6ke", "poc": false, "poc_url": [], "published_time": "2026-09-16", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-cztm-u6ke", "name": "https://www.oscs1024.com/hd/MPS-cztm-u6ke"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-89063", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-89063"}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/b6af015f-f954-4afb-9d65-56176f73672f?source=cve", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/bookly-responsive-appointment-booking-tool/tags/28.1/frontend/modules/ai/Ajax.php#L215", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/bookly-responsive-appointment-booking-tool/tags/28.1/frontend/modules/ai/Ajax.php#L212", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/bookly-responsive-appointment-booking-tool/tags/28.1/frontend/modules/ai/Ajax.php#L60", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/bookly-responsive-appointment-booking-tool/tags/28.1/frontend/modules/ai/Ajax.php#L38", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/bookly-responsive-appointment-booking-tool/tags/28.1/lib/base/Component.php#L67", "name": ""}], "scope_influence": "", "tags": ["应用软件", "AI"], "title": "Bookly AI会话IDOR漏洞", "_translated": true, "_saved_at": "2026-09-16T05:42:09+00:00", "_first_saved_at": "2026-09-16T05:42:09+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-cztm-u6ke"}, {"analysis_status": 0, "articles": [{"content": "跨界内存读是指应用程序在读取内存时，未正确验证或限制读取的内存范围。攻击者利用这种漏洞可以读取应用程序内存中的敏感数据，如密码、加密密钥、会话令牌等。常见的原因是由于缓冲区溢出、格式化字符串漏洞或其他内存错误导致的。", "title": "什么是越界读取"}, {"content": "攻击者可以通过不当构造的输入来触发跨界内存读漏洞。攻击者可能会通过向应用程序发送特定的输入，使其读取超过预期的内存区域。攻击者可以利用这个漏洞来获取敏感信息，如其他用户的数据、操作系统的敏感数据或应用程序的内部状态。", "title": "越界读取常见的攻击方式"}, {"content": "- 输入验证和限制：应用程序应对所有输入数据进行严格的验证和限制。确保输入数据的长度、格式和内容符合预期，避免超出缓冲区或访问非预期的内存区域。\n- 内存安全编程实践：开发人员应使用安全的编程实践，如避免使用不安全的函数、正确处理内存分配和释放操作，以及遵循最小特权原则。\n- 使用安全的编程语言和库：选择使用安全性较高的编程语言和库，这些语言和库在内存管理和安全性方面提供了更多的保护机制。\n- 定期进行代码审查和安全测试：定期审查应用程序的代码，并进行安全测试，以发现潜在的跨界内存读漏洞。使用静态代码分析工具和漏洞扫描工具来辅助检测和修复问题。\n- 实施防御性编程技术：应用程序应采用防御性编程技术，如使用随机化地址空间布局（ASLR）、堆栈保护机制（如堆栈溢出保护）和数据执行预防（DEP）等。\n- 及时更新和修补：及时应用程序和操作系统的安全更新和补丁，以确保已知的跨界内存读漏洞得到修复。及时更新相关软件和库，以避免使用已知存在漏洞的版本。", "title": "如何预防越界读取"}], "cnvd_id": "", "cve_id": "CVE-2026-85234", "cvss": {"cvssv31": [{"source": "secalert@redhat.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-125", "description": "tftp-hpa 是开源 TFTP 客户端与服务器套件，提供 in.tftpd 守护进程，用于无盘启动、固件分发和简单文件传输。\n受影响版本中，in.tftpd 的重映射引擎在 rewrite_string() 处理同时带有逆向匹配（~）与中止（a）且含非空自定义错误消息的规则时，会把 pmatch[] 全部置为 -1，再由 genmatchstring() 按 rm_so/rm_eo 做长度计算和 memcpy。远程未认证攻击者向已启用 `-m`/`--map-file` 的服务发送不匹配该规则的 RRQ 或 WRQ，即可触发越界读写并使守护进程崩溃。\n修复版本中通过在 do_genmatchstring() 中识别 MATCHONLY 与 pmatch[0].rm_so == -1 的无效匹配偏移，避免据此进行指针运算和内存拷贝，中止路径改为以 MATCHONLY 生成自定义错误消息，切断该越界路径。", "effects": [{"comp_name": "tftp-hpa", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,5.4)", "min_fixed_version": "5.4", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界读取", "kind_en": "越界读取", "last_modified_time": "2026-09-16", "level": "High", "mps_id": "MPS-xq8w-jsdv", "poc": false, "poc_url": [], "published_time": "2026-09-16", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-xq8w-jsdv", "name": "https://www.oscs1024.com/hd/MPS-xq8w-jsdv"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-85234", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-85234"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-85234", "name": ""}, {"url": "https://bugzilla.redhat.com/show_bug.cgi?id=2460997", "name": "RHBZ#2460997"}, {"url": "https://git.kernel.org/pub/scm/network/tftp/tftp-hpa.git/commit/?id=4b493532f5ce052a1c124acd0661233ec7918327", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "tftp-hpa重映射越界漏洞", "_translated": true, "_saved_at": "2026-09-15T19:25:55+00:00", "_first_saved_at": "2026-09-15T19:25:55+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-xq8w-jsdv"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-88065", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "cwe": "CWE-639", "description": "“tts-be”是时间表选择器的后端，旨在帮助学生更好地选择课程表。 2.1.0 之前的版本在多个 API 端点（例如“/api/student/{id}/photo”和“/api/course_unit/{id}/exchange/metadata”）中存在损坏的访问控制漏洞。通过链接这些未经身份验证的端点，远程攻击者可以使用后端作为开放代理来绕过授权检查，从而允许从上游大学系统枚举和提取敏感的个人身份信息（PII）。暴露的数据包括全名、学生证、课程表和照片。该问题已在 2.1.0 版本中修复。", "effects": [{"comp_name": "tts-be", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.1.0)", "min_fixed_version": "2.1.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "通过用户控制密钥绕过授权机制", "kind_en": "通过用户控制的密钥绕过授权", "last_modified_time": "2026-09-16", "level": "High", "mps_id": "MPS-y74d-qi08", "poc": false, "poc_url": [], "published_time": "2026-09-16", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-y74d-qi08", "name": "https://www.oscs1024.com/hd/MPS-y74d-qi08"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-88065", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-88065"}, {"url": "https://github.com/NIAEFEUP/tts-be/security/advisories/GHSA-fpfp-hr42-fvpm", "name": "https://github.com/NIAEFEUP/tts-be/security/advisories/GHSA-fpfp-hr42-fvpm"}], "scope_influence": "", "tags": ["应用软件"], "title": "“tts-be”应用程序存在访问控制损坏漏洞", "_translated": true, "_saved_at": "2026-09-15T22:38:04+00:00", "_first_saved_at": "2026-09-15T22:38:04+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-y74d-qi08"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-86466", "cvss": {}, "cvss_score": 7.4, "cvss_vector": "", "cwe": "CWE-346", "description": "Apache Airflow FAB provider（apache-airflow-providers-fab）是 Apache Airflow 的开源 Flask-AppBuilder 认证管理扩展，用于 Web 登录及 OAuth 身份源对接，并提供 Authentik 等 OAuth 提供方。\n受影响版本中，FAB 认证管理器在 Authentik OAuth 路径上由 get_oauth_user_info 读取 resp[\"id_token\"]，再经 _get_authentik_token_info 调用 _validate_jwt。_validate_jwt 只用 JWKS 解码令牌并执行 claims.validate()，未设置 claims_options，不校验 issuer 与 audience。攻击者可将同一 Authentik 实例为其他客户端签发的有效 id_token 提交给 Airflow，并以令牌所声明用户身份完成认证。\n修复版本中通过在 _get_authentik_token_info 为 _validate_jwt 传入 claims_options，将 iss 固定为 OpenID 元数据或 client_kwargs 中的 issuer、将 aud 固定为已配置的 client_id，并在无法解析 issuer 时失败关闭，从而拒绝面向其他应用或不可信签发方的 id_token。", "effects": [{"comp_name": "apache-airflow-providers-fab", "ecosystem": "pip", "versions": [{"affected_version": "(-∞,3.9.0)", "min_fixed_version": "3.9.0", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "源验证错误", "kind_en": "来源验证错误", "last_modified_time": "2026-09-16", "level": "High", "mps_id": "MPS-d710-fd9e", "poc": false, "poc_url": [], "published_time": "2026-09-16", "reference_url_list": [{"url": "http://www.mail-archive.com/announce@apache.org/msg11932.html", "name": ""}, {"url": "https://github.com/apache/airflow/pull/72645", "name": ""}, {"url": "https://github.com/apache/airflow/commit/d1acf31b44299bf460954437d446e52f43f9eeb3", "name": ""}, {"url": "https://airflow.apache.org/docs/apache-airflow-providers-fab/3.9.0/changelog.html", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-86466", "name": ""}, {"url": "https://airflow.apache.org/", "name": ""}], "scope_influence": "", "tags": ["python", "开源", "终端软件"], "title": "FAB Authentik认证绕过", "_translated": true, "_saved_at": "2026-09-15T19:25:52+00:00", "_first_saved_at": "2026-09-15T19:25:52+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-d710-fd9e"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-81899", "cvss": {"cvssv4": [{"source": "ff5b8ace-8b95-4078-9743-eac1ca5451de", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:H/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.3}]}, "cvss_score": 7.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:H/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-79", "description": "Concrete CMS 是开源内容管理系统，以 MIT 许可证在 GitHub 发布，用于站点内容发布以及用户与用户组管理。\n受影响版本中，组文件夹新增接口 add_group_folder_node 与编辑接口 update_group_folder_node 将请求字段 treeNodeGroupFolderName 未经 HTML 中和即写
