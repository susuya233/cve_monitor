: [], "cnvd_id": "", "cve_id": "CVE-2026-107279", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:L/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:L/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-757", "description": "AsyncHttpClient（AHC）是开源的 Java 异步 HTTP 客户端库，通过 Maven 坐标 org.asynchttpclient:async-http-client 发布，用于执行 HTTP 请求并异步处理 HTTP 响应。\n受影响版本中，客户端为 Digest 认证实现了基于 rspauth 的服务器相互认证校验，但 Realm.Builder.parseRawQop 在质询仅提供 qop=\"auth-int\" 时仍会选中 auth-int，而 AuthenticatorUtils.computeExpectedRspAuth 因 auth-int 的 rspauth 签名覆盖尚未读取的响应实体、在处理 Authentication-Info 头时无法计算期望值而返回 null，Interceptors.processAuthenticationInfo 将 null 视为无法校验的非致命结果，仅记录告警并照常交付响应，带有非法 rspauth 的响应被接受；处于中间人或伪造服务器位置的攻击者无需知晓共享密钥，通过返回仅含 qop=\"auth-int\" 的质询即可关闭整个交换的相互认证，被客户端当作通过认证的对端。\n修复版本中通过收紧 Realm.Builder.parseRawQop 的 qop 协商逻辑，不再选择 rspauth 无法校验的 auth-int，仅提供 auth-int 的质询回退为无 qop 的 RFC 2069 Digest 或导致认证失败，质询同时提供 auth 与 auth-int 的正常场景不受影响，修复包含在 3.0.13 版本。", "effects": [{"comp_name": "org.asynchttpclient:async-http-client", "ecosystem": "maven", "versions": [{"affected_version": "[3.0.12,3.0.13)", "min_fixed_version": "3.0.13", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "在会话协商时选择低安全性的算法（算法降级）", "kind_en": "协商期间选择安全性较低的算法（“算法降级”）", "last_modified_time": "2026-10-08", "level": "High", "mps_id": "MPS-1aop-eyc5", "poc": false, "poc_url": [], "published_time": "2026-10-08", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-1aop-eyc5", "name": "https://www.oscs1024.com/hd/MPS-1aop-eyc5"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-107279", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-107279"}, {"url": "https://github.com/AsyncHttpClient/async-http-client/security/advisories/GHSA-qhv6-3pmh-95q4", "name": "https://github.com/AsyncHttpClient/async-http-client/security/advisories/GHSA-qhv6-3pmh-95q4"}, {"url": "https://github.com/AsyncHttpClient/async-http-client/commit/a5422493b638226666a1ecb5f82826c7c7845b99", "name": "https://github.com/AsyncHttpClient/async-http-client/commit/a5422493b638226666a1ecb5f82826c7c7845b99"}, {"url": "https://github.com/AsyncHttpClient/async-http-client/releases/tag/async-http-client-project-3.0.13", "name": "https://github.com/AsyncHttpClient/async-http-client/releases/tag/async-http-client-project-3.0.13"}], "scope_influence": "", "tags": ["java", "开源"], "title": "AsyncHttpClient Digest 相互认证绕过漏洞", "_translated": true, "_saved_at": "2026-10-08T01:29:29+00:00", "_first_saved_at": "2026-10-08T01:29:29+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-1aop-eyc5"}, {"analysis_status": 0, "articles": [{"content": "跨站点请求伪造 (CSRF)通过利用网站对用户请求的信任进行攻击。当用户在网站A登录并在同一浏览器会话中访问网站B时，攻击者可以构造特制的请求并诱使用户执行，以使网站B误以为这些请求是用户合法发起的。\n攻击者通常通过欺骗用户点击恶意链接、在受信任的网站中植入恶意代码或通过钓鱼等手段来实施CSRF攻击，一旦用户执行了恶意请求，攻击者可以以用户的身份执行任意操作，包括更改用户密码、发起资金转账或删除重要数据等。", "title": "什么是CSRF"}, {"content": "- 链接欺骗：攻击者通过向用户发送包含恶意链接的电子邮件或社交媒体消息，诱使用户点击并执行恶意请求。\n- 图片引用攻击：攻击者通过在恶意网站上包含指向目标网站的图片引用，以触发用户浏览器自动发送目标网站的请求。\n- XSS利用：如果目标网站存在XSS漏洞，攻击者可以注入恶意脚本，以使用户在浏览器中执行恶意请求。", "title": "CSRF常见的攻击方式"}, {"content": "- 随机令牌：网站可以在每个请求中包含一个随机生成的令牌（CSRF Token），并验证该令牌的有效性，以确认请求的来源是合法的。\n- SameSite Cookie：使用SameSite属性来限制跨站点请求，将Cookie的发送限制在同一站点上，减少了跨站请求伪造的风险。\n- 双重验证：对于敏感操作，网站可以要求用户进行额外的验证，例如输入验证码、提供第二个因素的身份验证等。\n- 强化浏览器策略：网站可以设置Content-Security-Policy（CSP）头，限制浏览器执行恶意脚本的能力，减少CSRF攻击的风险。\n- 限制用户操作：网站可以要求用户在执行敏感操作之前进行明确的确认或授权，防止恶意请求被误触发。\n- 安全编码实践：开发人员应遵循安全编码实践，对用户输入进行适当的验证和过滤，防止恶意请求的注入。", "title": "如何预防CSRF"}], "cnvd_id": "", "cve_id": "CVE-2026-62142", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "cwe": "CWE-352", "description": "WP 2FA（插件标识 wp-2fa）是 Melapress 开源的 WordPress 双因素认证插件，用于为站点登录流程提供动态验证码、通行密钥与备份码等二次验证。\n受影响版本中，插件在 rest_authentication_errors 过滤器回调 bypass_cookie_nonce_for_login 里依据 $_SERVER['REQUEST_URI'] 路径是否包含子串 wp-2fa-methods/v1/login 来返回 null 并清除 rest_cookie_invalid_nonce 认证错误；该 URI 可被攻击者控制，且 WordPress 支持通过公开查询参数 rest_route 指定实际分发的路由，攻击者据此构造 URI 带有该子串、实际分发到任意敏感 REST 端点（如 /wp/v2/users）的请求并诱导已登录用户触发，请求在缺少 X-WP-Nonce 的情况下以受害者 Cookie 权限执行，形成针对站点 REST API 的跨站请求伪造。\n修复版本中通过改从 $GLOBALS['wp']-\u003equery_vars['rest_route'] 读取实际分发路由并做规范化处理，仅在路由完全等于 /wp-2fa-methods/v1/login/validate 时豁免 nonce 校验失败，阻断了伪造 URI 清除无关端点认证错误的路径。", "effects": [{"comp_name": "wp-2fa", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,4.2.0)", "min_fixed_version": "4.2.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "CSRF", "kind_en": "跨站请求伪造 (CSRF)", "last_modified_time": "2026-10-08", "level": "High", "mps_id": "MPS-9bj6-ely0", "poc": false, "poc_url": [], "published_time": "2026-10-08", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-9bj6-ely0", "name": "https://www.oscs1024.com/hd/MPS-9bj6-ely0"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-62142", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-62142"}, {"url": "https://patchstack.com/database/wordpress/plugin/wp-2fa/vulnerability/wordpress-wp-2fa-plugin-4-1-0-cross-site-request-forgery-csrf-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "WP 2FA REST接口CSRF漏洞", "_translated": true, "_saved_at": "2026-10-08T16:02:13+00:00", "_first_saved_at": "2026-10-08T16:02:13+00:00", " MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-129", "description": "Excelize 是 qax-os 开源的 Go 语言 Microsoft Excel 电子表格读写库（Go 模块 github.com/xuri/excelize/v2），用于在服务端创建、读取和修改 xlsx 文件。\n受影响版本中，pivotTable.go 的 extractPivotTableFields 以 xl/pivotCache/pivotCacheDefinitionN.xml 解析出的缓存字段名切片 order 为索引基准，而循环下标 fieldIdx 与 xl/pivotTables/pivotTableN.xml 中 dataField 元素 fld 属性解析出的整型 Fld 来自单独解析的部件且均未做边界校验；应用对攻击者提供的 xlsx 文件调用公开 API GetPivotTables 时，若缓存字段数量与透视字段数量不匹配或 fld 越界，将触发 Go 切片越界 panic，excelize 库内无 recover，panic 逃逸导致宿主进程或请求工作协程崩溃。\n修复版本中通过 master 分支提交 6258dceb 修复该问题：在两处索引前分别校验 fieldIdx 与 Fld 落在 order 切片范围内并跳过越界字段，消除切片越界路径；截至 2026-10-08 官方尚未发布包含该修复的正式版本。", "effects": [{"comp_name": "github.com/xuri/excelize/v2", "ecosystem": "go", "versions": [{"affected_version": "[2.8.1,2.11.0]", "min_fixed_version": "", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "对数组索引的验证不恰当", "kind_en": "数组索引验证不当", "last_modified_time": "2026-10-08", "level": "High", "mps_id": "MPS-39kc-8ytd", "poc": false, "poc_url": [], "published_time": "2026-10-08", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-39kc-8ytd", "name": "https://www.oscs1024.com/hd/MPS-39kc-8ytd"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-107211", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-107211"}, {"url": "https://github.com/qax-os/excelize/security/advisories/GHSA-mx22-3794-2vpv", "name": "https://github.com/qax-os/excelize/security/advisories/GHSA-mx22-3794-2vpv"}, {"url": "https://github.com/qax-os/excelize/pull/2435", "name": "https://github.com/qax-os/excelize/pull/2435"}, {"url": "https://github.com/qax-os/excelize/commit/6258dcebc4e2a2aed985c38a08098dfd908521d1", "name": "https://github.com/qax-os/excelize/commit/6258dcebc4e2a2aed985c38a08098dfd908521d1"}], "scope_influence": "", "tags": ["go"], "title": "Excelize 透视表索引越界漏洞", "_translated": true, "_saved_at": "2026-10-07T21:10:50+00:00", "_first_saved_at": "2026-10-07T21:10:50+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-39kc-8ytd"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用了空指针，并在不进行有效检查的情况下对其进行取消引用操作。当程序试图取消引用空指针时，由于空指针不指向任何有效的内存地址，会导致程序崩溃或产生未定义的行为。这种错误通常发生在开发者未对指针进行正确的初始化或验证时。", "title": "什么是空指针取消引用"}, {"content": "- 拒绝服务：攻击者可以通过构造恶意输入或请求，触发程序中的空指针取消引用错误，导致程序崩溃或无法正常运行。这可能导致拒绝服务攻击，使系统无法提供正常的服务。\r\n- 内存信息泄露：攻击者可以通过利用空指针取消引用错误，访问程序中的敏感内存信息。这可能包括栈上的变量、函数指针或其他敏感数据，从而暴露系统的机密信息。\r\n- 代码执行：在某些情况下，空指针取消引用错误可能导致执行恶意代码或注入恶意代码的机会。攻击者可以通过精心构造的输入，利用空指针取消引用错误来执行任意的代码，进而获取系统控制权或执行未经授权的操作。", "title": "空指针取消引用常见的攻击方式"}, {"content": "- 指针初始化和验证：开发者应该正确地初始化指针，并在使用指针之前进行有效的验证，确保指针不为空。在取消引用指针之前，应始终检查其是否为空。\r\n- 异常处理和错误恢复：程序应该具备健壮的异常处理和错误恢复机制，以便在发生空指针取消引用错误时能够适当地处理异常，而不是导致程序崩溃或暴露敏感信息。\r\n- 防御性编程：采用防御性编程的原则，如避免在未经验证的指针上进行操作，避免使用未初始化的指针等，以防止空指针取消引用错误的发生。\r\n- 静态代码分析和测试：使用静态代码分析工具和测试技术来检测和识别潜在的空指针取消引用错误。这些工具可以帮助发现代码中可能存在的空指针问题，并及时修复。\r\n- 强制性编码标准和最佳实践：制定强制性的编码标准和最佳实践，包括良好的指针使用和管理规范，以帮助开发者编写更可靠、安全的代码。", "title": "如何预防空指针取消引用"}], "cnvd_id": "", "cve_id": "CVE-2026-107213", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-476", "description": "Excelize 是开源 Go 语言 Excel 电子表格读写库（GitHub 仓库 qax-os/excelize，Go 模块 github.com/xuri/excelize/v2），广泛用于服务端读取、生成与修改 xlsx 文件。\n受影响版本中，File.GetSlicers 在入口仅检查工作表结构体的 ExtLst 字段是否为 nil，随后直接读取 ws.Drawing.RID 解析绘图关系；Drawing 与 ExtLst 是 xlsx 工作表 XML 中相互独立的两个可选子元素，当攻击者构造的工作表包含 extLst 而缺少 drawing 元素时 ws.Drawing 为 nil，代码库中无 recover 兜底，应用解析不可信文件并调用 GetSlicers 时触发空指针异常导致进程退出。\n修复版本中通过在 GetSlicers 入口条件补充 ws.Drawing == nil 判断切断该路径，工作表缺少 drawing 部分时提前返回空切片器，不再解引用空指针，并新增对应回归测试；该修复 commit 尚未包含在已发布版本中，需待上游发版后升级。", "effects": [{"comp_name": "github.com/xuri/excelize/v2", "ecosystem": "go", "versions": [{"affected_version": "[2.9.0,2.11.0]", "min_fixed_version": "", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "空指针取消引用", "kind_en": "空指针取消引用", "last_modified_time": "2026-10-08", "level": "High", "mps_id": "MPS-975r-4d6h", "poc": false, "poc_url": [], "published_time": "2026-10-08", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-975r-4d6h", "name": "https://www.oscs1024.com/hd/MPS-975r-4d6h"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-107213", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-107213"}, {"url": "https://github.com/qax-os/excelize/security/advisories/GHSA-r7x5-4969-99p7", "name": "https://github.com/qax-os/excelize/security/advisories/GHSA-r7x5-4969-99p7"}, {"url": "https://github.com/qax-os/excelize/pull/2434", "name": "https://github.com/qax-os/excelize/pull/2434"}, {"url": "https://github.com/qax-os/excelize/commit/8ffeb07ec9a350410f6922313f6b7e4f5cc79241", "name": "https://github.com/qax-os/excelize/commit/8ffeb07ec9a350410f6922313f6b7e4f5cc79241"}], "scope_influence": "", "tags": ["go"], "title": "Excelize空指针解引用漏洞", "_translated": true, "_saved_at": "2026-10-07T21:10:49+00:00", "_first_saved_at": "2026-10-07T21:10:49+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-975r-4d6h"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-44031", "cvss": {"cvssv31": [{"source": "33c584b5-0579-4c06-b2a0-8d8329fcab9c", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}], "cvssv4": [{"source": "33c584b5-0579-4c06-b2a0-8d8329fcab9c", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-674", "description": "Uncontrolled recursion in DcmSequenceOfItems::read() and DcmItem::read() in the dcmdata library of OFFIS DCMTK 3.7.0 allows a remote, unauthenticated attacker to cause a denial of service (stack exhaustion and process crash) via a DICOM dataset containing deeply nested sequences (SQ elements). The dataset can be sent in a C-STORE request to storescp, dcmrecv, dcmqrscp, or any other DICOM service built on DCMTK, because the received dataset is parsed before any authentication takes place.打开此类文件时，dcmdump 等本地工具也会崩溃。该问题已在提交 885ff0f10372bd589b5f44cea974f28a3964cb0f 中修复，它添加了可配置的序列嵌套深度限制（默认为 64）。", "effects": [{"comp_name": "DCMTK", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,3.7.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "未经控制的递归", "kind_en": "Uncontrolled Recursion", "last_modified_time": "2026-10-08", "level": "High", "mps_id": "MPS-ph7g-bas5", "poc": false, "poc_url": [], "published_time": "2026-10-08", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ph7g-bas5", "name": "https://www.oscs1024.com/hd/MPS-ph7g-bas5"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-44031", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-44031"}, {"url": "https://support.dcmtk.org/redmine/issues/1191", "name": "DCMTK issue #1191"}, {"url": "https://github.com/DCMTK/dcmtk/commit/885ff0f10372bd589b5f44cea974f28a3964cb0f", "name": "Fix commit"}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "CVE-2026-44031漏洞", "_translated": true, "_saved_at": "2026-10-10T00:26:07+00:00", "_first_saved_at": "2026-10-08T16:02:15+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ph7g-bas5"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-94581", "cvss": {"cvssv4": [{"source": "sirt@brocade.com", "vector": "CVSS:4.0/AV:A/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.5}]}, "cvss_score": 8.5, "cvss_vector": "CVSS:4.0/AV:A/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-78", "description": "Brocade Fabric OS 是 Broadcom 为 Brocade 光纤通道 SAN 交换机、导向器与扩展交换机提供的专有网络操作系统固件，用于存储网络的配置、监控与管理，并通过 REST API 管理接口对外提供管理能力。\n受影响版本中，REST API 管理接口处理 SSH known host 配置时未对参数值做充分过滤，持有管理员权限的远程认证攻击者在配置 SSH known host 设置时提交包含 shell 元字符的参数值，参数被拼接进主机系统命令执行流程，最终以 root 权限在主机系统上执行任意命令 24.com/hd/MPS-s3t8-g7xb", "name": "https://www.oscs1024.com/hd/MPS-s3t8-g7xb"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-94586", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-94586"}, {"url": "https://support.broadcom.com/external/content/SecurityAdvisories/0/39135", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Brocade Fabric OS 命令注入漏洞", "_translated": true, "_saved_at": "2026-10-08T08:17:16+00:00", "_first_saved_at": "2026-10-08T08:17:16+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-s3t8-g7xb"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "", "cvss": {}, "cvss_score": 8.1, "cvss_vector": "", "cwe": "CWE-416", "description": "V8 是 Google Chrome 浏览器内置的 JavaScript 引擎，其 V8 沙箱用于把渲染器内的攻击限制在 V8 堆内存中，外部指针表（ExternalPointerTable，EPT）管理指向堆外的指针，ArrayBufferSweeper 在垃圾回收时负责回收 ArrayBufferExtension 对象。\n受影响版本中，ExternalPointerTable::Mark() 与 ExternalPointerTable::Evacuate() 在 GC 标记与搬移外部指针槽位时均不校验表条目的类型标签是否属于访问槽位的标签范围。沙箱内攻击者把真实的 ArrayBufferExtension 句柄复制到普通对象（例如 Intl.Locale 持有的 Foreign::foreign_address_）槽位后，主 GC 中 MarkingVisitorBase::VisitExternalPointer() 会标记该 EPT 条目，但该槽位的 tag_range 不是 kArrayBufferExtensionTag，函数提前返回，不会调用 ArrayBufferExtension::Mark()；ArrayBufferSweeper::SweepListFull() 判定扩展未标记并调用 FinalizeAndDelete() 删除扩展，而 SharedArrayBuffer.prototype.byteLength 触发的 JSArrayBuffer::GetByteLength() 继续通过 ext-\u003eis_shared()、ext-\u003ebacking_store() 访问已释放的 ArrayBufferExtension，形成释放后使用，攻击者可据此以 V8 堆内读写原语逃逸 V8 沙箱。\n修复版本中通过把 slot.tag_range() 传入 ExternalPointerTable::Mark() 与 Evacuate()，并在 ExternalPointerTableEntry::Mark() 与搬移路径加入 SBXCHECK 校验条目标签必须落在期望标签范围内，跨标签别名句柄在 GC 期间触发受控崩溃，消除释放后使用并阻断沙箱逃逸。", "effects": [{"comp_name": "chrome", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,155.0.8047.0)", "min_fixed_version": "155.0.8047.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "chromium", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,155.0.8047.0)", "min_fixed_version": "155.0.8047.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "v8", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,15.5.19)", "min_fixed_version": "15.5.19", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "高", "fix_suggestion": "建议修复", "kind": "UAF", "kind_en": "免费后使用", "last_modified_time": "2026-10-08", "level": "High", "mps_id": "MPS-h8od-qbjc", "poc": true, "poc_url": [], "published_time": "2026-10-08", "reference_url_list": [{"url": "https://issues.chromium.org/issues/540033151", "name": ""}, {"url": "https://github.com/v8/v8/commit/4d21392dd1a42370df609ed21f44524dece2534d", "name": ""}, {"url": "https://chromium-review.googlesource.com/c/v8/v8/+/8364866", "name": ""}, {"url": "https://github.com/v8/v8/blob/4d21392dd1a42370df609ed21f44524dece2534d/test/mjsunit/sandbox/regress-540033151.js", "name": ""}, {"url": "https://github.com/chromium/chromium/commit/4a2486b7b491d9922a3fa74c9f9b4d87a6d7da56", "name": ""}, {"url": "https://github.com/v8/v8/releases/tag/15.5.19", "name": ""}, {"url": "https://github.com/chromium/chromium/releases/tag/155.0.8047.0", "name": com/hd/MPS-0dli-tqa1"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-94585", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-94585"}, {"url": "https://support.broadcom.com/external/content/SecurityAdvisories/0/39134", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Brocade Fabric OS SSO认证绕过漏洞", "_translated": true, "_saved_at": "2026-10-08T08:17:17+00:00", "_first_saved_at": "2026-10-08T08:17:17+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-0dli-tqa1"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-107281", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:H/AT:P/PR:L/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.6}]}, "cvss_score": 7.6, "cvss_vector": "CVSS:4.0/AV:N/AC:H/AT:P/PR:L/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-863", "description": "AsyncHttpClient 是一个基于 Netty 的开源 Java 异步 HTTP 客户端库（Apache-2.0 许可，Maven 坐标 org.asynchttpclient:async-http-client），用于执行 HTTP 请求并异步处理响应，支持 NTLM、Kerberos/SPNEGO 等认证方案与 HTTP/1.1 连接池复用。\n受影响版本中，NTLM 与 Negotiate（Kerberos/SPNEGO）认证的对象是连接而非请求，握手完成后服务器把该套接字上的后续请求都视为完成认证的首个主体；HTTP/1.1 连接池分区键由 ChannelPoolPartitioning.PerHostChannelPoolPartitioning.getPartitionKey 按目标 URI、虚拟主机与代理 host/port/type 生成，不含已认证主体，另一主体（或未配置主体的请求）发起的同目标请求经 NettyRequestSender.pollPooledChannel 按该键取回空闲连接后，复用先前主体认证的套接字，该请求在网络上不携带任何认证头，服务器以首个主体的身份执行它并把该主体权限下的响应返回给调用方，凭据本身不被泄露，被混淆的是请求的执行身份。\n修复版本中通过把认证主体并入面向连接方案的 HTTP/1.1 连接池分区键：新增 PrincipalScopedPartitionKey.scope 对 NTLM、KERBEROS、SPNEGO 返回包含 principal 的包装键，Basic、Digest 等按请求认证的方案与无主体场景保持原键，全部入池与取池路径（普通取池、round-robin override、重定向与重放、drain 归还）统一应用该键，使不同主体的连接不再互相复用，同一主体的连接复用与 maxConnectionsPerHost 语义保持不变。", "effects": [{"comp_name": "org.asynchttpclient:async-http-client", "ecosystem": "maven", "versions": [{"affected_version": "[2.0.0,2.16.1)", "min_fixed_version": "2.16.1", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[3.0.0,3.0.13)", "min_fixed_version": "3.0.13", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-10-08", "level": "High", "mps_id": "MPS-2my6-8r9u", "poc": false, "poc_url": [], "published_time": "2026-10-08", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-2my6-8r9u", "name": "https://www.oscs1024.com/hd/MPS-2my6-8r9u"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-107281", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-107281"}, {"url": "https://github.com/AsyncHttpClient/async-http-client/security/advisories/GHSA-vvp4-63h8-v5pm", "name": "https://github.com/AsyncHttpClient/async-http-client/security/advisories/GHSA-vvp4-63h8-v5pm"}, {"url": "https://github.com/AsyncHttpClient/async-http-client/commit/73813babf51231ee79f7da4f uestSender 的 isConnectAlreadyDone 方法以最近构建的请求是否为 CONNECT 来推断代理隧道已建立，代理拒绝 CONNECT 时该条件同样成立，连接仍是终止于代理的明文通道；Interceptors.exitAfterIntercept 随后把代理拒绝响应分发给面向源站请求的 401 与 30x 处理器，二者以 setReuseChannel(true) 在原连接上重建源站请求并附加源站 Authorization 头，攻击者控制的代理以 401、302 或 401 NTLM 响应 CONNECT 后，可在明文连接上直接读取 Basic 凭据，或驱动 NTLM 握手实施离线破解与中继。\n修复版本中通过在 NettyResponseFuture 中引入 tunnelEstablished 隧道状态，仅允许 ConnectSuccessInterceptor 在 CONNECT 成功后置位，isConnectAlreadyDone 要求该状态为真才跳过隧道建立，exitAfterIntercept 对 CONNECT 响应仅处理 200 与 407、其余状态原样返回调用方，被拒绝的连接随之关闭，源站凭据不再写入明文代理连接。", "effects": [{"comp_name": "org.asynchttpclient:async-http-client", "ecosystem": "maven", "versions": [{"affected_version": "[2.0.0,2.16.1)", "min_fixed_version": "2.16.1", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[3.0.0,3.0.12)", "min_fixed_version": "3.0.12", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "凭证保护不足", "kind_en": "凭证保护不足", "last_modified_time": "2026-10-08", "level": "High", "mps_id": "MPS-fr5k-d1az", "poc": false, "poc_url": [], "published_time": "2026-10-08", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-fr5k-d1az", "name": "https://www.oscs1024.com/hd/MPS-fr5k-d1az"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-107232", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-107232"}, {"url": "https://github.com/AsyncHttpClient/async-http-client/security/advisories/GHSA-v9f2-7rw2-gr2x", "name": "https://github.com/AsyncHttpClient/async-http-client/security/advisories/GHSA-v9f2-7rw2-gr2x"}, {"url": "https://github.com/AsyncHttpClient/async-http-client/commit/3a625cb892233c0a6653ac68823a25ffbc80f393", "name": "https://github.com/AsyncHttpClient/async-http-client/commit/3a625cb892233c0a6653ac68823a25ffbc80f393"}, {"url": "https://github.com/AsyncHttpClient/async-http-client/commit/a87e7b8c81a6f66a4ce23cd43097f ze/v2", "ecosystem": "go", "versions": [{"affected_version": "[2.3.1,2.11.0]", "min_fixed_version": "", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "未捕获的异常", "kind_en": "未捕获的异常", "last_modified_time": "2026-10-08", "level": "High", "mps_id": "MPS-vhn3-b04r", "poc": false, "poc_url": [], "published_time": "2026-10-08", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-vhn3-b04r", "name": "https://www.oscs1024.com/hd/MPS-vhn3-b04r"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-107214", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-107214"}, {"url": "https://github.com/qax-os/excelize/security/advisories/GHSA-2j4c-ffch-9f23", "name": "https://github.com/qax-os/excelize/security/advisories/GHSA-2j4c-ffch-9f23"}, {"url": "https://github.com/qax-os/excelize/pull/2395", "name": "https://github.com/qax-os/excelize/pull/2395"}, {"url": "https://github.com/qax-os/excelize/commit/22f76f9acb94b85b3eb9c4365ab4f750cebbc565", "name": "https://github.com/qax-os/excelize/commit/22f76f9acb94b85b3eb9c4365ab4f750cebbc565"}], "scope_influence": "", "tags": ["go"], "title": "Excelize 解密拒绝服务漏洞", "_translated": true, "_saved_at": "2026-10-07T21:10:48+00:00", "_first_saved_at": "2026-10-07T21:10:48+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-vhn3-b04r"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-107230", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:N", "severity": "high", "base_score": 7.4}]}, "cvss_score": 7.4, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:N", "cwe": "CWE-863", "description": "AsyncHttpClient 是开源的 Java 异步 HTTP 客户端库，基于 Netty 执行 HTTP 请求并异步处理响应，提供连接池、WebSocket 以及 NTLM、Kerberos、SPNEGO 等认证能力。\n受影响版本中，连接池分区键缺少区分认证身份的完整字段：3.x 的 PrincipalScopedPartitionKey.scope 只把源站 Realm 的 principal 字符串拼入池键，Kerberos、SPNEGO 依据票据缓存或默认 JAAS 登录认证时 principal 为空，池键退化为未隔离的基础键；代理 Realm 与 SOCKS、CONNECT 代理登录不参与键构造，2.x 则完全不按认证身份隔离池键；principal 字符串相同的身份（如 CORP\\alice 与 OTHER\\alice）共用同一分区。不同身份或带凭据与不带凭据的请求经同一个客户端实例访问同一主机时，后续请求会复用前一个身份已完成认证的 socket，服务端把该请求视为第一个身份处理，导致该身份的数据或权限暴露给其他调用方。\n修复版本中通过重写 PrincipalScopedPartitionKey 的池键构造，对源站与代理两个 Realm 分别计算 scheme、principal、password、ntlmDomain、ntlmHost、loginContextName、servicePrincipalName、realmName 与 customLoginConfig 等全部身份字段的 SHA-256 摘要并纳入池键，任一跳认证连接均生成隔离键且不再要求 principal 非空，SOCKS 或 CONNECT 代理登录认证的连接不再进入 HTTP/2 复用；SpnegoEngine 的 Kerberos 登录缓存改用 ConcurrentHashMap 并按除密码外的完整身份字段建键，切断跨身份复用认证连接的链路。", "effects": [{"comp_name": "org.asynchttpclient:async-http-client", "ecosystem": "maven", "versions": [{"affected_version": "[2.0.0,2.16.1]", "min_fixed_version": "", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[3.0.0,3.0.14)", "min_fixed_version": "3.0.14", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_e H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-290", "description": "Brocade Fabric OS 是博科（Brocade）光纤通道交换机与导向器运行的闭源网络操作系统，负责 SAN fabric 的管理、路由与交换机间通信。\n受影响版本中，交换机间远程执行服务在处理跨 fabric 的远程命令执行 IPC 帧时，接收端交换机以提升的处理级别执行帧内命令，且未对传输参数进行认证与校验。攻击者在控制 fabric 中单台已接入交换机并具备其管理员权限、目标成员启用远程执行功能的条件下，可伪造远程执行请求绕过认证并注入任意命令，以 root 权限在本机或 fabric 内其他受管交换机上执行命令，实现权限提升。\n修复版本中通过官方安全更新加强远程命令执行 IPC 帧的来源认证与参数校验，阻止未经验证的远程请求以提升处理级别执行，切断跨交换机提权与任意命令执行链路，Brocade 已在 Fabric OS 9.2.2d 与 10.0.1 中提供修复。", "effects": [{"comp_name": "fabric_os", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,9.2.2d)", "min_fixed_version": "9.2.2d", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[10.0.0,10.0.1)", "min_fixed_version": "10.0.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "使用欺骗进行的认证绕过", "kind_en": "通过欺骗绕过身份验证", "last_modified_time": "2026-10-08", "level": "High", "mps_id": "MPS-mh81-ezkp", "poc": false, "poc_url": [], "published_time": "2026-10-08", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-mh81-ezkp", "name": "https://www.oscs1024.com/hd/MPS-mh81-ezkp"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-87663", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-87663"}, {"url": "https://support.broadcom.com/external/content/SecurityAdvisories/0/39163", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Fabric OS权限绕过与命令注入漏洞", "_translated": true, "_saved_at": "2026-10-08T08:17:20+00:00", "_first_saved_at": "2026-10-08T08:17:20+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-mh81-ezkp"}, {"analysis_status": 0, "articles": [{"content": "跨站点请求伪造 (CSRF)通过利用网站对用户请求的信任进行攻击。当用户在网站A登录并在同一浏览器会话中访问网站B时，攻击者可以构造特制的请求并诱使用户执行，以使网站B误以为这些请求是用户合法发起的。\n攻击者通常通过欺骗用户点击恶意链接、在受信任的网站中植入恶意代码或通过钓鱼等手段来实施CSRF攻击，一旦用户执行了恶意请求，攻击者可以以用户的身份执行任意操作，包括更改用户密码、发起资金转账或删除重要数据等。", "title": "什么是CSRF"}, {"content": "- 链接欺骗：攻击者通过向用户发送包含恶意链接的电子邮件或社交媒体消息，诱使用户点击并执行恶意请求。\n- 图片引用攻击：攻击者通过在恶意网站上包含指向目标网站的图片引用，以触发用户浏览器自动发送目标网站的请求。\n- XSS利用：如果目标网站存在XSS漏洞，攻击者可以注入恶意脚本，以使用户在浏览器中执行恶意请求。", "title": "CSRF常见的攻击方式"}, {"content": "- 随机令牌：网站可以在每个请求中包含一个随机生成的令牌（CSRF Token），并验证该令牌的有效性，以确认请求的来源是合法的。\n- SameSite Cookie：使用SameSite属性来限制跨站点请求，将Cookie的发送限制在同一站点上，减少了跨站请求伪造的风险。\n- 双重验证：对于敏感操作，网站可以要求用户进行额外的验证，例如输入验证码、提供第二个因素的身份验证等。\n- 强化浏览器策略：网站可以设置Content-Security-Policy（CSP）头，限制浏览器执行恶意脚本的能力，减少CSRF攻击的风险。\n- 限制用户操作：网站可以要求用户在执行敏感操作之前进行明确的确认或授权，防止恶意请求被误触发。\n- 安全编码实践：开发人员应遵循安全编码实践，对用户输入进行适当的验证和过滤，防止恶意请求的注入。", "title": "如何预防CSRF"}], "cnvd_id": "", "cve_id": "CVE-2026-66479", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:L", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:L", "cwe": "CWE-352", "description": "WPComplete 是 Liquid Web / StellarWP（原 iThemes）面向 WordPress 课程与会员站点的学习进度跟踪插件，以 wpcomplete 为插件标识在 wordpress.org 以 GPLv2 或更高协议开源分发，用于在课程页面中提供完成按钮并统计学员完成进度。\n受影响版本中，插件无条件注册 admin-post.php?action=user_completion 入口，其处理函数 admin_user_completion 仅校验 edit_users 权限而不验证 nonce，攻击者可构造跨站请求诱骗具备 edit_users 权限的已登录管理员提交携带任意 button 值的请求，该值未净化即写入文章元数据与用户活动元数据，并在后台完成统计模板中未经转义直接回显，最终在管理员浏览器中执行攻击者脚本，形成存储型 XSS。\n修复版本中通过为 admin_user_completion 增加 wp_verify_nonce 一次性随机数校验、对 user_id 强制取整并用 sanitize_text_field 净化 button 参数以切断伪造请求的写入链路，同时在按钮完成、用户完成与 metabox 三个后台模板中补充 esc_html、esc_url、esc_attr、esc_js 输出转义，消除存储载荷的执行条件。", "effects": [{"comp_name": "wpcomplete", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.9.5.7)", "min_fixed_version": "2.9.5.7", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "CSRF", "kind_en": "跨站请求伪造 (CSRF)", "last_modified_time": "2026-10-08", "level": "High", "mps_id": "MPS-wfdg-382e", "poc": false, "poc_url": [], "published_time": "2026-10-08", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-wfdg-382e", "name": "https://www.oscs1024.com/hd/MPS-wfdg-382e"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-66479", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-66479"}, {"url": "https://patchstack.com/database/wordpress/plugin/wpcomplete/vulnerability/wordpress-wpcomplete-plugin-2-9-5-6-csrf-to-stored-xss-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "WPComplete CSRF存储型XSS", "_translated": true, "_saved_at": "2026-10-08T16:02:11+00:00", "_first_saved_at": "2026-10-08T16:02:11+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-wfdg-382e"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过向受信任的数据序列化过程中添加恶意数据，从而在序列化和反序列化过程中执行恶意代码的攻击漏洞。这种漏洞通常存在于使用序列化 (serialization) 机制存储和传输数据的程序中。\n", "title": "什么是反序列化"}, {"content": "- 注入攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码注入到程序中，从而实现代码执行的目的。\n- 反射攻击：攻击者使用反射机制，在序列化过程中动态生成恶意数据，并将恶意代码注入到程序中，从而实现代码执行的目的。\n- 缓冲区溢出攻击：攻击者通过在序列化过程中向缓冲区输入恶意数据，导致缓冲区溢出，从而破坏程序的内存管理，实现代码执行的目的。\n- 格式字符串攻击：攻击者通过在序列化过程中输入恶意数据，导致程序使用错误的格式字符串，从而实现代码执行的目的。\n- 数据流攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码作为一个数据流传递给程序，从而实现代码执行的目的。\n", "title": "反序列化常见的攻击方式"}, {"content": "- 不信任输入数据：程序应该严格检查输入数据的有效性，并避免使用不受信任的数据。\n- 使用安全的序列化机制：程序应该使用安全的序列化机制，如 JSON 或 XML 序列化，而不是第三方序列化库。\n- 最小特权原则：程序应该限制对受信任数据的处理权限，并避免在运行时修改数据。\n- 代码审查和漏洞扫描：程序应该进行代码审查和漏洞扫描，以发现和修复潜在的安全漏洞。\n", "title": "如何预防反序列化"}], "cnvd_id": "", "cve_id": "CVE-2026-94064", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-502", "description": "Neo | Barber Shop WordPress Theme 是 BuddhaThemes 通过 ThemeForest 销售的商业 WordPress 理发店主题（主题标识 neocut），用于搭建理发店、美发沙龙类网站，无公开源码仓库。\n受 ind": "反序列化", "kind_en": "不可信数据的反序列化", "last_modified_time": "2026-10-09", "level": "High", "mps_id": "MPS-ovhl-brca", "poc": false, "poc_url": [], "published_time": "2026-10-09", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ovhl-brca", "name": "https://www.oscs1024.com/hd/MPS-ovhl-brca"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-94065", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-94065"}, {"url": "https://patchstack.com/database/wordpress/theme/colorit/vulnerability/wordpress-colorfolio-theme-1-3-php-object-injection-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "ColorFolio对象注入漏洞", "_translated": true, "_saved_at": "2026-10-09T15:44:22+00:00", "_first_saved_at": "2026-10-09T15:44:22+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ovhl-brca"}, {"analysis_status": 0, "articles": [{"content": "由于应用程序或系统中存在敏感信息未经适当保护而被泄露给攻击者或未经授权的用户，这些敏感信息可能包括用户凭据、个人身份信息、敏感业务数据、系统配置信息等。信息暴露漏洞通常是由于设计、实施或配置错误引起的，例如不正确的访问控制、弱密码策略、缺乏加密、错误的日志处理等。", "title": "什么是未授权敏感信息泄露"}, {"content": "- 直接访问敏感信息：攻击者可以通过直接访问不正确配置或不受保护的资源来获取敏感信息，如通过公开可访问的URL、未经授权的文件目录访问等。\n- 越权访问：攻击者可能利用访问控制错误或不正确的权限配置来获取他们没有权限访问的敏感信息。\n- 错误信息披露：应用程序在错误处理过程中可能泄露敏感信息，例如将错误消息中的敏感数据返回给客户端或显示在日志文件中。\n- 信息泄露通过响应：攻击者可能利用应用程序在响应中不正确地包含敏感信息，如通过网页源代码、响应头部或响应消息体中的敏感数据。", "title": "未授权敏感信息泄露常见的攻击方式"}, {"content": "- 访问控制：确保只有经过授权的用户能够访问敏感信息，使用强大的身份验证和授权机制。\n- 数据加密：对于敏感信息，使用适当的加密算法对数据进行加密，包括数据传输和存储过程中的加密。\n- 错误处理和日志安全：正确处理错误情况，避免在错误消息中暴露敏感信息。同时，确保日志记录功能的安全性，避免将敏感信息记录在日志文件中。\n- 安全配置和最佳实践：遵循安全最佳实践，对应用程序、服务器和系统进行适当的配置，包括访问控制、权限管理、密码策略等。\n- 审计和监控：实施日志审计和监控机制，及时检测和响应任何异常活动或潜在的信息暴露事件。\n- 安全开发实践：在应用程序开发过程中，进行安全代码审查、漏洞扫描和安全测试，以及敏感信息的正确处理和保护。", "title": "如何预防未授权敏感信息泄露"}], "cnvd_id": "", "cve_id": "CVE-2026-83943", "cvss": {"cvssv31": [{"source": "secure@microsoft.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:C/C:H/I:H/A:N", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:C/C:H/I:H/A:N", "cwe": "CWE-200", "description": "Azure API Center 是 Microsoft Azure 提供的全托管 API 治理与编目服务，为闭源云服务，用于集中登记、发现和治理组织内的 API 资产及其版本、定义文件与元数据。\n受影响版本中，该云服务在面向网络的未授权访问路径上存在敏感信息暴露缺陷，未授权攻击者可通过网络获取本不应访问的敏感信息，官方评估该漏洞无需攻击者权限与用户交互，利用复杂度较高（AC:H），漏洞类型为信息泄露，官方未披露更细粒度的漏洞代码细节。\n修复版本中通过微软在服务端实施的安全修复切断了未授权访问路径，微软已完全缓解该漏洞，客户无需升级版本或更改配置，官方未观察到该漏洞被公开披露或在野利用。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "未授权敏感信息泄露", "kind_en": "向未经授权的行为者泄露敏感信息", "last_modified_time": "2026-10-09", "level": "High", "mps_id": "MPS-jt7e-g4or", "poc": false, "poc_url": [], "published_time": "2026-10-09", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-jt7e-g4or", "name": "https://www.oscs1024.com/hd/MPS-jt7e-g4or"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-83943", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-83943"}, {"url": "https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-83943", "name": "Azure API Center Information Disclosure Vulnerability"}], "scope_influence": "", "tags": ["应用软件"], "title": "Azure API Center 信息泄露漏洞", "_translated": true, "_saved_at": "2026-10-09T08:19:21+00:00", "_first_saved_at": "2026-10-09T01:38:37+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-jt7e-g4or"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-94067", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.1}]}, "cvss_score": 8.1, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-98", "description": "The Voux（主题目录名 thevoux-wp）是 Fuelthemes 在 ThemeForest 商业销售的 WordPress 新闻杂志主题，用于搭建杂志、编辑类网站。\n受影响版本中，主题在 PHP include/require 语句的文件名控制上存在缺陷（CWE-98），未认证攻击者可远程操纵文件包含路径中的文件名，使站点加载预期之外的本地文件，形成 PHP 本地文件包含并导致敏感信息泄露；Patchstack 提示攻击者可让站点加载不应访问的服务器文件，特定条件下可导致站点接管，官方公告未披露具体漏洞文件与参数。\n修复版本中通过，可通过部署 WAF 虚拟补丁规则拦截针对文件包含路径的恶意请求、收紧站点对外接口的访问控制并审计 Web 日志缓解风险；截至 2026-10-09 厂商尚未发布包含修复的版本，Patchstack 已为该漏洞上线虚拟补丁防护。", "effects": [{"comp_name": "thevoux-wp", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,6.9.5]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "php远程文件包含", "kind_en": "PHP 程序中 Include/Require 语句的文件名控制不当（“PHP 远程文件包含”）", "last_modified_time": "2026-10-09", "level": "High", "mps_id": "MPS-6mgi-5l0w", "poc": false, "poc_url": [], "published_time": "2026-10-09", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-6mgi-5l0w", "name": "https://www.oscs1024.com/hd/MPS-6mgi-5l0w"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-94067", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-94067"}, {"url": "https://patchstack.com/database/wordpress/theme/thevoux-wp/vulnerability/wordpress-the-voux-theme-6-9-5-local-file-inclusion-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "The Voux本地文件包含漏洞", "_translated": true, "_saved_at": "2026-10-09T15:44:18+00:00", "_first_saved_at": "2026-10-09T15:44:18+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-6mgi-5l0w"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-83947", "cvss": {"cvssv31": [{"source": "secure@microsoft.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:N/I:H/A:N", "severity": "high", "base_score": 7.7}]}, "cvss_score": 7.7, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:N/I:H/A:N", "cwe": "CWE-862", "description": "Azure Event Grid 是微软 Azure 提供的全托管事件路由服务，为闭源云服务，用于在应用与 Azure 服务之间以发布/订阅模式集中转发事件，并支持 Webhook 等多种事件处理目标。\n受影响版本中，服务端对特定网络功能缺少授权校验（CWE-862），持有低权限授权账户的攻击者可跨网络冒充合法实体，伪造事件来源或身份；官方 CVSS 评估该问题作用域改变（S:C），仅造成完整性影响（C:N/I:H/A:N），无需用户交互。\n修复版本中通过服务端更新补齐缺失的授权校验，切断攻击者冒充合法实体的路径；微软已在 Azure Event Grid 服务端完成完全缓解，客户无需执行任何操作，该 CVE 的发布目的为透明度说明。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-10-09", "level": "High", "mps_id": "MPS-x4z1-ourj", "poc": false, "poc_url": [], "published_time": "2026-10-09", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-x4z1-ourj", "name": "https://www.oscs1024.com/hd/MPS-x4z1-ourj"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-83947", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-83947"}, {"url": "https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-83947", "name": "Azure Event Grid Spoofing Vulnerability"}], "scope_influence": "", "tags": ["应用软件"], "title": "Azure Event Grid 欺骗漏洞", "_translated": true, "_saved_at": "2026-10-09T08:19:22+00:00", "_first_saved_at": "2026-10-09T01:38:38+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-x4z1-ourj"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能有效地控制资源的使用，导致攻击者可以利用这个漏洞耗尽应用程序所依赖的资源。这些资源可以是计算资源（CPU、内存）、网络带宽、数据库连接或其他系统资源。攻击者可以通过发送特制的请求、恶意输入或其他方式，使应用程序消耗大量资源，导致拒绝服务或系统崩溃。", "title": "什么是拒绝服务"}, {"content": "- 消耗计算资源：攻击者可以发送计算密集型的请求，例如复杂的计算、无限循环或递归操作，以耗尽应用程序的计算资源，导致应用程序无法响应其他请求。\r\n- 消耗内存资源：攻击者可以发送大量的数据或恶意输入，以导致应用程序消耗过多的内存资源，从而使系统的可用内存耗尽，并导致应用程序崩溃或变得不可用。\r\n- 消耗网络带宽：攻击者可以发送大量的请求或大型数据包，以消耗应用程序所依赖的网络带宽。这会导致其他合法用户无法正常访问应用程序或降低系统的整体网络性能。\r\n- 消耗存储资源：攻击者可以发送大量的请求或上传大文件，以耗尽应用程序的存储资源，导致系统无法处理其他请求或存储新的数据。", "title": "拒绝服务常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对输入数据进行合理的验证和过滤，防止恶意输入导致资源消耗过高。\r\n- 实施资源限制：应用程序应该实施适当的资源限制策略，例如限制计算操作的时间或次数，限制内存使用量，限制并发连接数等，以防止资源被耗尽。\r\n- 异常处理与错误恢复：应用程序应该具备健壮的异常处理和错误恢复机制，以防止因意外错误导致资源泄漏或无法释放的情况。\r\n- 资源监控与警报：应用程序应该实施适当的资源监控和警报机制，及时发现异常的资源消耗情况，并采取相应的措施来应对。\r\n- 压力测试与性能优化：应用程序应该进行压力测试，以评估其在高负载情况下的性能，并进行必要的性能优化，以确保能够有效地处理大量请求而不耗尽资源。", "title": "如何预防拒绝服务"}], "cnvd_id": "", "cve_id": "CVE-2026-84276", "cvss": {"cvssv31": [{"source": "psirt@us.ibm.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-400", "description": "IBM Guardium Data Protection 是 IBM 推出的商业数据安全平台，用于数据库活动监控、敏感数据发现与安全合规审计，edge-controller 是其边缘架构中负责与集中管理平面交互、接收并执行任务的控制组件，产品源码闭源。\n受影响版本中，edge-controller 的 gRPC 服务对远端提交的任务数据缺少类型校验，攻击者无需身份认证，通过网络向该服务发送畸形任务数据触发未受保护的类型断言，断言失败导致 edge-controller 进程意外终止，服务不可用，官方公告确认受影响版本为 12.2.2。\n修复版本中通过官方安全更新完成对该问题的修复，IBM 在 12.2.3 版本中提供修复程序（Fix Central 修复包 SqlGuard_12.0p15004_Edge），升级后畸形任务数据不再导致 edge-controller 进程终止，服务可用性恢复正常。", "effects": [{"comp_name": "guardium_data_protection", "ecosystem": "linux", "versions": [{"affected_version": "[12.2.2,12.2.3)", "min_fixed_version": "12.2.3", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "拒绝服务", "kind_en": "不受控制的资源消耗", "last_modified_time": "2026-10-09", "level": "High", "mps_id": "MPS-75ft-e61n", "poc": false, "poc_url": [], "published_time": "2026-10-09", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-75ft-e61n", "name": "https://www.oscs1024.com/hd/MPS-75ft-e61n"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-84276", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-84276"}, {"url": "https://www.ibm.com/support/pages/node/7288627", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "IBM Guardium 边缘控制器拒绝服务漏洞", "_translated": true, "_saved_at": "2026-10-08T21:43:37+00:00", "_first_saved_at": "2026-10-08T21:43:37+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-75ft-e61n"}, {"analysis_status": 0, "articles": [{"content": "- 条件竞争漏洞是由于程序中存在多个代码块同时访问同一个条件判断语句而导致的错误。在程序中，条件判断语句通常用于决定是否执行某些代码块。当一个程序有多个代码块同时访问同一个条件判断语句时，这些代码块可能会同时执行，从而导致程序执行结果出现不可预测的错误。", "title": "什么是竞争条件"}, {"content": "- 线程切换攻击：线程切换攻击是指攻击者通过利用竞争条件漏洞，使程序在执行时频繁切换线程，从而导致系统资源耗尽，最终实现拒绝服务攻击。\n- 内存泄漏攻击：内存泄漏攻击是指攻击者通过利用竞争条件漏洞，使得程序不断申请内存，但最终无法释放内存，从而导致内存泄漏，最终程序崩溃。\n- 缓存穿透攻击：缓存穿透攻击是指攻击者通过利用竞争条件漏洞，使得程序在访问缓存时，被缓存的数据并非当前最新的数据，从而攻击者可以获取到未更新的数据。\n- 指令重放攻击：指令重放攻击是指攻击者通过利用竞争条件漏洞，在程序执行时，将先前保存的指令序列重新执行，从而实现绕过某些验证，获取系统权限等攻击目的。\n", "title": "竞争条件常见的攻击方式"}, {"content": "- 使用互斥锁：在条件判断语句中，使用互斥锁来确保只有一个代码块能够访问变量。使用互斥锁可以提高程序的安全性和可靠性。\n- 使用条件封印：在条件判断语句中，将可能会修改变量的代码块封印起来，以确保这些代码块无法被其他代码块访问。\n- 使用条件过滤：在条件判断语句中，使用条件过滤来过滤掉那些不可能发生的条件判断语句。例如，对于一个包含多个条件判断语句的循环，可以只保留其中一个条件的判断，而将其他条件的判断语句过滤掉。\n- 使用性能优化：对于一些条件判断语句，可以使用性能优化来避免条件竞争的情况。例如，可以使用数组或链表等数据结构来存储条件判断语句中的变量，从而避免条件竞争的情况。", "title": "如何预防竞争条件"}], "cnvd_id": "", "cve_id": "CVE-2026-97032", "cvss": {}, "cvss_score": 7.5, "cvss_vector": "", "cwe": "CWE-362", "description": "Go 是 Google 开源的静态编译型编程语言，其标准库 net/http 内置 HTTP/2 服务器实现，该实现以 golang.org/x/net/http2 为上游，在 Go 1.26 打包于 net/http/h2_bundle.go，Go 1.27 起迁移至 net/http/internal/http2，广泛用于构建各类网络服务。\n受影响版本中，HTTP/2 服务器在处理客户端 SETTINGS 帧时，processSetting 对 SETTINGS_HEADER_TABLE_SIZE 立即调用 sc.hpackEncoder.SetMaxDynamicTableSize(s.Val) 修改连接共享的 HPACK 编码器，而异步写协程 writeFrameAsync 正在使用同一编码器编码响应 HEADERS 帧，两个 goroutine 无同步并发访问编码器形成数据竞争，恶意客户端在同一连接上反复发送请求并持续变更头部表大小，能够破坏编码器状态并触发 panic，导致服务器崩溃。\n修复版本中通过缓存客户端发送的 SETTINGS_HEADER_TABLE_SIZE，不再立即应用，改为在 startFrameWrite 发起下一次帧写入前按先最小值后最新值的顺序调用 SetMaxDynamicTableSize，使编码器修改只发生在无帧写入窗口内，消除数据竞争；修复随 Go 1.27.2 与 Go 1.26.9 发布，并同步至 golang.org/x/net v0.60.0。", "effects": [{"comp_name": "golang.org/x/net", "ecosystem": "go", "versions": [{"affected_version": "(-∞,0.60.0)", "min_fixed_version": "0.60.0", "repository": "go", "solutions": [], "upstream": true}]}, {"comp_name": "stdlib", "ecosystem": "go", "versions": [{"affected_version": "[1.27.0,1.27.2)", "min_fixed_version": "1.27.2", "repository": "go", "solutions": [], "upstream": true}, {"affected_version": "(-∞,1.26.9)", "min_fixed_version": "1.26.9", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "竞争条件", "kind_en": "使用共享资源并发执行且同步不正确（“竞争条件”）", "last_modified_time": "2026-10-09", "level": "High", "mps_id": "MPS-f28e-d41e", "poc": false, "poc_url": [], "published_time": "2026-10-09", "reference_url_list": [{"url": "https://www.openwall.com/lists/oss-security/2026/10/08/9", "name": ""}, {"url": "https://go.dev/issue/81867", "name": ""}, {"url": "https://github.com/golang/go/commit/ba8f5c9adecf4546e95cbeacb816f39ec88be183", "name": ""}, {"url": "https://github.com/golang/go/commit/12acaf3086437e140e2dd3b7d2c30fdd633c5fe0", "name": ""}, {"url": "https://github.com/golang/go/commit/6e049521882c944afc1e519a83971ec421dc2974", "name": ""}, {"url": "https://github.com/golang/net/commit/18ece0ce30bc35fa81fe72028bf309bb3ff3f4a5", "name": ""}, {"url": "https://go-review.googlesource.com/c/go/+/847313", "name": ""}, {"url": "https://go.dev/doc/devel/release#go1.27.2", "name": ""}], "scope_influence": "", "tags": ["go"], "title": "Go HTTP/2 HPACK 竞态致服务崩溃", "_translated": true, "_saved_at": "2026-10-08T21:43:36+00:00", "_first_saved_at": "2026-10-08T21:43:36+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-f28e-d41e"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-78659", "cvss": {}, "cvss_score": 7.5, "cvss_vector": "", "cwe": "CWE-770", "description": "golang.org/x/net 是 Go 官方维护的开源网络扩展库（BSD-3-Clause 许可），其 http2 包提供 HTTP/2 服务端与客户端实现，被大量 Go 服务直接依赖或经标准库 net/http 间接引入。\n受影响版本中，HTTP/2 服务端在 Framer 的 readMetaFrame 方法中使用单一 remainSize 预算按头部字面字节数扣减 maxHeaderListSize 限额；客户端在请求 HEADERS 头部中携带名为 trailer 的头部时，该头部按其少量报文字节计入预算，其以逗号分隔声明的字段数量不消耗预算，服务端随后按声明逐条填充 Request.Trailer 映射，每个映射条目产生固定内存开销，攻击者可绕过 Server.MaxHeaderValueCount 与 Server.MaxHeaderBytes 限制，以极小的请求成本使服务端内存不成比例增长并造成拒绝服务。\n修复版本中通过在 readMetaFrame 中为 trailer 声明引入独立的 trailersRemainSize 预算，并按声明字段数量乘以单个 HPACK 头部字段的固定开销计算内存占用，超限时同步清零头部与 trailer 两份预算，使 trailer 声明同样受头部大小限制约束，切断了以少量报文字节换取大量映射条目的资源消耗路径。", "effects": [{"comp_name": "golang.org/x/net", "ecosystem": "go", "versions": [{"affected_version": "(-∞,0.60.0)", "min_fixed_version": "0.60.0", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "不加限制或调节的资源分配", "kind_en": "不受限制或节流地分配资源", "last_modified_time": "2026-10-09", "level": "High", "mps_id": "MPS-f3b9-ed34", "poc": false, "poc_url": [], "published_time": "2026-10-09", "reference_url_list": [{"url": "https://www.openwall.com/lists/oss-security/2026/10/08/10", "name": ""}, {"url": "https://go.dev/issue/81857", "name": ""}, {"url": "https://github.com/golang/go/issues/81857", "name": ""}, {"url": "https://github.com/golang/net/commit/57f4235f83712a299328015548240512213a3852", "name": ""}, {"url": "https://go-review.googlesource.com/c/net/+/847185", "name": ""}, {"url": "https://github.com/golang/net/releases/tag/v0.60.0", "name": ""}], "scope_influence": "", "tags": ["go"], "title": "golang.org/x/net HTTP/2 内存耗尽漏洞", "_translated": true, "_saved_at": "2026-10-08T21:43:35+00:00", "_first_saved_at": "2026-10-08T21:43:35+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-f3b9-ed34"}, {"analysis_status": 0, "articles": [], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-67693", "cvss": {}, "cvss_score": 7.4, "cvss_vector": "", "cwe": "CWE-295", "description": "GnuTLS 是一个开源的 TLS/SSL 协议与 X.509 证书处理 C 语言库，被主流 Linux 发行版和大量服务端、客户端软件用于 TLS 通信与证书链验证。\n受影响版本中，证书链验证未对终端实体证书实施 Key Usage（KU）约束，lib/x509/verify.c 的 _gnutls_check_key_purpose() 只遍历 Extended Key Usage（EKU）OID，verify_crt() 仅对 CA 证书检查 keyCertSign 等用途位，TLS 层的 _gnutls_check_key_usage_for_sig()、check_key_usage_for_enc() 与 _gnutls_kx_supports_pk_usage() 在 key_usage 为 0 时按无限制处理；攻击者使用已受信任 CA 签发的 critical KU 全 0 且 EKU 含 id-kp-serverAuth 的终端实体证书时，certtool 链验证与 gnutls-cli 对端验证均返回 trusted，依赖 KU 策略的部署会接受语义无效的证书并建立 TLS 连接，造成敏感信息暴露。\n修复版本中通过，可在证书准入策略中拒绝 KU 扩展存在且所有位为 0 的终端实体证书，避免依赖 GnuTLS 对 KU 的强制执行，并在上游发布修复版本后及时升级验证。", "effects": [{"comp_name": "gnutls", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,3.8.13]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "证书验证不恰当", "kind_en": "证书验证不当", "last_modified_time": "2026-10-09", "level": "High", "mps_id": "MPS-d2zr-kc6j", "poc": false, "poc_url": [], "published_time": "2026-10-09", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-d2zr-kc6j", "name": "https://www.oscs1024.com/hd/MPS-d2zr-kc6j"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-67693", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-67693"}, {"url": "http://gnutls.com", "name": ""}, {"url": "https://gitlab.com/gnutls/gnutls/-/blob/3.8.13/lib/x509/verify.c#L1119-1178", "name": ""}, {"url": "https://gist.github.com/lkloliver/6fbfc191bc6163942c8017551ac3f238", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "GnuTLS证书用途校验缺陷", "_translated": true, "_saved_at": "2026-10-08T21:43:38+00:00", "_first_saved_at": "2026-10-08T21:43:38+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-d2zr-kc6j"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-107802", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:L/AC:L/AT:P/PR:N/UI:A/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:L/AC:L/AT:P/PR:N/UI:A/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-88", "description": "SumatraPDF 是 Windows 平台的开源多格式阅读器（GPLv3），支持 PDF、ePub、CHM 等格式，内置划词翻译功能，可调用 Grok Build、Claude Code、OpenAI Codex 等 AI CLI 完成翻译。\n受影响版本中，src/SelectionTranslate.cpp 的 BuildGrokTranslateCmdLineTemp、BuildClaudeTranslateCmdLineTemp、BuildCodexTranslateCmdLineTemp 仅用 str::ReplaceTemp 把翻译文本中的双引号替换为反斜杠引号，再经 fmt 拼入带引号的命令行并由 CreateProcessW 启动对应 CLI。Windows argv 解析要求引号前的连续反斜杠双倍输出，这种仅替换单个字符的转义使以 \\\" 结尾的文本提前闭合带引号参数，后续内容被解析为独立参数；NormalizeTextForPromptTemp 仅过滤 \\r、\\n、\\t，不会中和反斜杠与引号，攻击者因此可通过文档中被选中的文本或粘贴到翻译对话框源文框的文本，向 Grok Build、Claude Code、OpenAI Codex 注入 --model、--cwd 或 --always-approve、--dangerously-skip-permissions、--dangerously-bypass-approvals-and-sandbox 等任意参数。\n修复版本中通过重写 src/base/CmdLineArgsIter.cpp 的 QuoteCmdLineArgTemp 切断该链路：该函数按 CommandLineToArgvW 规则始终用引号包裹整个参数，将引号前的连续反斜杠按 2n+1 倍输出后输出转义引号、结尾反斜杠双倍输出，使含引号与反斜杠的文本无法突破参数边界；src/SelectionTranslate.cpp 三个翻译命令行构建函数与 AI 聊天侧边栏各 Provider 的命令行拼接统一改用该函数，并新增经 CommandLineToArgvW 回环验证的回归测试确认注入载荷保持为单一参数。", "effects": [{"comp_name": "sumatrapdf", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,3.6.1]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "参数注入或修改", "kind_en": "命令中参数分隔符的不正确中和（“参数注入”）", "last_modified_time": "2026-10-09", "level": "High", "mps_id": "MPS-1fqh-v76x", "poc": false, "poc_url": [], "published_time": "2026-10-09", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-1fqh-v76x", "name": "https://www.oscs1024.com/hd/MPS-1fqh-v76x"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-107802", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-107802"}, {"url": "https://github.com/sumatrapdfreader/sumatrapdf/security/advisories/GHSA-xvxg-cwmx-hr7j", "name": "https://github.com/sumatrapdfreader/sumatrapdf/security/advisories/GHSA-xvxg-cwmx-hr7j"}, {"url": "https://github.com/sumatrapdfreader/sumatrapdf/commit/6b88a751ab34a28bafca3bdd635aaa2f4c1e06b6", "name": "https://github.com/sumatrapdfreader/sumatrapdf/commit/6b88a751ab34a28bafca3bdd635aaa2f4c1e06b6"}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "SumatraPDF 参数注入漏洞", "_translated": true, "_saved_at": "2026-10-09T01:38:43+00:00", "_first_saved_at": "2026-10-09T01:38:43+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-1fqh-v76x"}, {"analysis_status": 0, "articles": [{"content": "跨站点请求伪造 (CSRF)通过利用网站对用户请求的信任进行攻击。当用户在网站A登录并在同一浏览器会话中访问网站B时，攻击者可以构造特制的请求并诱使用户执行，以使网站B误以为这些请求是用户合法发起的。\n攻击者通常通过欺骗用户点击恶意链接、在受信任的网站中植入恶意代码或通过钓鱼等手段来实施CSRF攻击，一旦用户执行了恶意请求，攻击者可以以用户的身份执行任意操作，包括更改用户密码、发起资金转账或删除重要数据等。", "title": "什么是CSRF"}, {"content": "- 链接欺骗：攻击者通过向用户发送包含恶意链接的电子邮件或社交媒体消息，诱使用户点击并执行恶意请求。\n- 图片引用攻击：攻击者通过在恶意网站上包含指向目标网站的图片引用，以触发用户浏览器自动发送目标网站的请求。\n- XSS利用：如果目标网站存在XSS漏洞，攻击者可以注入恶意脚本，以使用户在浏览器中执行恶意请求。", "title": "CSRF常见的攻击方式"}, {"content": "- 随机令牌：网站可以在每个请求中包含一个随机生成的令牌（CSRF Token），并验证该令牌的有效性，以确认请求的来源是合法的。\n- SameSite Cookie：使用SameSite属性来限制跨站点请求，将Cookie的发送限制在同一站点上，减少了跨站请求伪造的风险。\n- 双重验证：对于敏感操作，网站可以要求用户进行额外的验证，例如输入验证码、提供第二个因素的身份验证等。\n- 强化浏览器策略：网站可以设置Content-Security-Policy（CSP）头，限制浏览器执行恶意脚本的能力，减少CSRF攻击的风险。\n- 限制用户操作：网站可以要求用户在执行敏感操作之前进行明确的确认或授权，防止恶意请求被误触发。\n- 安全编码实践：开发人员应遵循安全编码实践，对用户输入进行适当的验证和过滤，防止恶意请求的注入。", "title": "如何预防CSRF"}], "cnvd_id": "", "cve_id": "CVE-2026-62026", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:L", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:L", "cwe": "CWE-352", "description": "Dashboard Notes 是 MIGHTYminnow 开发的 WordPress 开源插件（GPLv2 协议），用于在站点后台仪表盘中向客户展示便签与操作说明，支持为便签配置颜色、Logo 并按 URL 控制可见范围。\n受影响版本中，插件将 save_widget_context_settings 注册到 admin_init 钩子，使其在任意后台请求上执行；该函数仅检查当前用户是否具备 edit_theme_options 能力，整个插件未调用 wp_verify_nonce 或 check_admin_referer 校验请求合法性，随后把 $_POST['dn'] 提交的便签配置 array_merge 进内存并经 update_option 写入 dashboard_notes_options 选项；攻击者可构造跨站 POST 页面，诱导已登录管理员访问后以该管理员身份篡改仪表盘便签的样式、Logo URL 与可见性配置。\n修复版本中通过，可通过暂时停用该插件缓解；修复方向是在 save_widget_context_settings 处理请求前加入 check_admin_referer 等 nonce 校验，拒绝缺少有效令牌的跨站请求，从而切断上述伪造路径。", "effects": [{"comp_name": "dashboard-notes", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.0.3]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "CSRF", "kind_en": "跨站请求伪造 (CSRF)", "last_modified_time": "2026-10-09", "level": "High", "mps_id": "MPS-1l70-tn5g", "poc": false, "poc_url": [], "published_time": "2026-10-09", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-1l70-tn5g", "name": "https://www.oscs1024.com/hd/MPS-1l70-tn5g"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-62026", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-62026"}, {"url": "https://patchstack.com/database/wordpress/plugin/dashboard-notes/vulnerability/wordpress-dashboard-notes-plugin-1-0-3-cross-site-request-forgery-csrf-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Dashboard Notes 插件 CSRF 漏洞", "_translated": true, "_saved_at": "2026-10-09T15:44:25+00:00", "_first_saved_at": "2026-10-09T15:44:25+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-1l70-tn5g"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-94063", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:L", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:L", "cwe": "CWE-79", "description": "Education Center 是 ThemeREX 开发的商业 WordPress 主题（主题标识 education），面向学校、培训机构与教育中心类网站，通过 ThemeForest 发行，无公开源码仓库。\n受影响版本中，主题在 Web 页面 s": ["应用软件"], "title": "aBlocks 反射型 XSS", "_translated": true, "_saved_at": "2026-10-08T21:43:40+00:00", "_first_saved_at": "2026-10-08T21:43:40+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ydhl-ukrn"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-103634", "cvss": {}, "cvss_score": 8.6, "cvss_vector": "", "cwe": "CWE-787", "description": "Apache DataSketches C++（datasketches-cpp）是 Apache 软件基金会开源的流式数据概要算法库，提供 Count-Min、Theta、HLL 等概要结构，用于大数据系统中的近似统计与频率估计。\n受影响版本中，count_min_sketch 的公开反序列化入口 deserialize() 在非空分支执行的长度检查 ensure_minimum_memory(size, sizeof(W) * (1 + nbuckets * nhashes)) 未计入已读取的 16 字节前导，截断的序列化数据可通过检查，使权重与表数据的读取越过输入缓冲区末尾最多 16 字节；同时构造函数以 32 位运算计算 num_hashes 与 num_buckets 的乘积作为表长度，攻击者提交使该乘积回绕为 0 的参数组合后，2^30 上限检查同样以 32 位计算而失效，sketch 以空表反序列化成功，后续 update 与 get_estimate 将读写堆分配之外的内存，破坏堆数据并导致崩溃。\n修复版本中通过将输入长度检查改为包含 16 字节前导与实际表长度，并以 64 位运算计算表大小乘积与上限检查，使回绕的参数组合在构造阶段被拒绝，消除了反序列化与后续访问中的越界读写。", "effects": [{"comp_name": "datasketches-cpp", "ecosystem": "linux", "versions": [{"affected_version": "[4.1.0,5.3.0)", "min_fixed_version": "5.3.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-10-10", "level": "High", "mps_id": "MPS-b786-c043", "poc": false, "poc_url": [], "published_time": "2026-10-10", "reference_url_list": [{"url": "http://www.mail-archive.com/announce@apache.org/msg12258.html", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-103634", "name": ""}, {"url": "https://datasketches.apache.org", "name": ""}, {"url": "https://github.com/apache/datasketches-cpp/commit/70505c331d12551cce268a1417c90b8a698222d3", "name": ""}, {"url": "https://github.com/apache/datasketches-cpp/pull/538", "name": ""}, {"url": "https://github.com/apache/datasketches-cpp/releases/tag/5.3.0", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "DataSketches C++越界读写漏洞", "_translated": true, "_saved_at": "2026-10-10T00:26:00+00:00", "_first_saved_at": "2026-10-10T00:26:00+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-b786-c043"}, {"analysis_status": 0, "articles": [{"content": "跨界内存读是指应用程序在读取内存时，未正确验证或限制读取的内存范围。攻击者利用这种漏洞可以读取应用程序内存中的敏感数据，如密码、加密密钥、会话令牌等。常见的原因是由于缓冲区溢出、格式化字符串漏洞或其他内存错误导致的。", "title": "什么是越界读取"}, {"content": "攻击者可以通过不当构造的输入来触发跨界内存读漏洞。攻击者可能会通过向应用程序发送特定的输入，使其读取超过预期的内存区域。攻击者可以利用这个漏洞来获取敏感信息，如其他用户的数据、操作系统的敏感数据或应用程序的内部状态。", "title": "越界读取常见的攻击方式"}, {"content": "- 输入验证和限制：应用程序应对所有输入数据进行严格的验证和限制。确保输入数据的长度、格式和内容符合预期，避免超出缓冲区或访问非预期的内存区域。\n- 内存安全编程实践：开发人员应使用安全的编程实践，如避免使用不安全的函数、正确处理内存分配和释放操作，以及遵循最小特权原则。\n- 使用安全的编程语言和库：选择使用安全性较高的编程语言和库，这些语言和库在内存管理和安全性方面提供了更多的保护机制。\n- 定期进行代码审查和安全测试：定期审查应用程序的代码，并进行安全测试，以发现潜在的跨界内存读漏洞。使用静态代码分析工具和漏洞扫描工具来辅助检测和修复问题。\n- 实施防御性编程技术：应用程序应采用防御性编程技术，如使用随机化地址空间布局（ASLR）、堆栈保护机制（如堆栈溢出保护）和数据执行预防（DEP）等。\n- 及时更新和修补：及时应用程序和操作系统的安全更新和补丁，以确保已知的跨界内存读漏洞得到修复。及时更新相关软件和库，以避免使用已知存在漏洞的版本。", "title": "如何预防越界读取"}], "cnvd_id": "", "cve_id": "CVE-2026-107837", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:H", "severity": "high", "base_score": 8.2}]}, "cvss_score": 8.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:H", "cwe": "CWE-125", "description": "RIOT 是面向物联网与嵌入式设备的开源微控制器操作系统，其 GNRC 网络栈在 IEEE 802.15.4 等低功耗链路上提供 6LoWPAN 分片与重组能力。\n受影响版本中，sys/net/gnrc/network_layer/sixlowpan/gnrc_sixlowpan.c 的 _receive() 函数收到报文后仅执行 payload-\u003esize 不小于 1 字节的最小载荷检查，随后通过 sixlowpan_frag_is((sixlowpan_frag_t *)dispatch) 读取调度字节判定报文为分片，未校验报文 snip 是否容纳完整的 sixlowpan_frag_t 头部，攻击者向启用 GNRC 6LoWPAN 分片的设备发送带分片调度字节但长度不足的报文后，报文进入 gnrc_sixlowpan_frag_recv()，该函数将 pkt-\u003edata 直接按 sixlowpan_frag_t 或 sixlowpan_frag_n_t 结构解析并读取数据报长度、tag 与 offset 等字段，读取超出数据包缓冲区边界，可导致内存信息泄露与网络栈崩溃。\n修复版本中通过在 sys/include/net/gnrc/sixlowpan.h 新增 sixlowpan_frag_is_snip() 辅助函数，先检查 snip-\u003esize 不小于 sizeof(sixlowpan_frag_t)，对 FRAG_N 分片再要求不小于 sizeof(sixlowpan_frag_n_t)，并让 _receive() 使用该函数完成分片判定，长度不足的报文不再进入分片重组路径，越界读取被消除；修复已合入上游 master（PR #22504），并随 2026.07 版本发布。", "effects": [{"comp_name": "riot", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2026.07)", "min_fixed_version": "2026.07", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界读取", "kind_en": "越界读取", "last_modified_time": "2026-10-10", "level": "High", "mps_id": "MPS-16da-9foe", "poc": false, "poc_url": [], "published_time": "2026-10-10", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-16da-9foe", "name": "https://www.oscs1024.com/hd/MPS-16da-9foe"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-107837", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-107837"}, {"url": "https://github.com/RIOT-OS/RIOT/security/advisories/GHSA-m8mc-q4p7-p8j3", "name": "https://github.com/RIOT-OS/RIOT/security/advisories/GHSA-m8mc-q4p7-p8j3"}, {"url": "https://github.com/RIOT-OS/RIOT/pull/22504", "name": "https://github.com/RIOT-OS/RIOT/pull/22504"}, {"url": "https://github.com/RIOT-OS/RIOT/commit/0cae205cd1d110e0b8fce094714598322d56ce2d", "name": "https://githu n 前仅执行 ensure_minimum_memory(size, 8) 的 8 字节长度检查，随后仍按 32 字节前导区读取 items_seen、outer_tau_numer、outer_tau_denom 等字段，长度在 8 至 31 字节之间的截断输入最多可越过输入缓冲区末尾读取 24 字节；同时内嵌 sketch 的长度由 size - (PREAMBLE_LONGS_NON_EMPTY \u003c\u003c 3) 以无符号整数计算，size 小于 32 时回绕为极大值，使内嵌 sketch 自身的长度检查无法把读取限制在输入范围内，越界读取的字节可进入反序列化后的 union 状态，造成进程崩溃（拒绝服务）并可能暴露相邻内存内容。\n修复版本中通过在读取非空前导区前增加 ensure_minimum_memory(size, PREAMBLE_LONGS_NON_EMPTY \u003c\u003c 3) 校验，要求输入至少包含完整的 32 字节非空前导区，长度不足时在读取前抛出 std::out_of_range 异常，切断越界读取与长度回绕路径，消除崩溃与内存信息泄露风险。", "effects": [{"comp_name": "datasketches-cpp", "ecosystem": "linux", "versions": [{"affected_version": "[2.0.0-incubating,5.3.0)", "min_fixed_version": "5.3.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界读取", "kind_en": "越界读取", "last_modified_time": "2026-10-10", "level": "High", "mps_id": "MPS-5e48-0ebb", "poc": false, "poc_url": [], "published_time": "2026-10-10", "reference_url_list": [{"url": "http://www.mail-archive.com/announce@apache.org/msg12256.html", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-103636", "name": ""}, {"url": "https://github.com/apache/datasketches-cpp/pull/538", "name": ""}, {"url": "https://github.com/apache/datasketches-cpp/commit/412c47efa67e3c5e601bb0db1a97778eaca9c724", "name": ""}, {"url": "https://github.com/apache/datasketches-cpp/releases/tag/5.3.0", "name": ""}, {"url": "https://datasketches.apache.org", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "DataSketches C++ VarOpt反序列化越界读取漏洞", "_translated": true, "_saved_at": "2026-10-10T00:26:03+00:00", "_first_saved_at": "2026-10-10T00:26:03+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-5e48-0ebb"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-92705", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "cwe": "CWE-829", "description": "Aegisub 是 TypesettingTools 维护的开源跨平台字幕编辑器，采用 C++ 开发，用于字幕制作、时间轴调整与特效制作，并支持通过 Lua Automation 脚本扩展功能。\n受影响版本中，用户打开字幕文件时 SubsController::Load 发出的文件打开事件会触发 Automation4::LocalScriptManager::Reload，该方法读取 ASS 文件 Aegisub Project Garbage 节中 Automation Scripts 元数据引用的本地脚本路径，不询问用户是否信任脚本作者便直接调用 ScriptFactory::CreateFromFile 加载并执行对应脚本，攻击者分发恶意 ASS 文件及配套 Lua 脚本可在用户打开文件时以 Aegisub 进程权限执行任意代码；3.4.0 至 3.4.2 中 agi::fs::HasExtension 以 std::string 保留 NUL 之后字符校验扩展名，而文件系统操作按 NUL 截断路径，构造同时满足 ASS 与 Lua 语法的单一文件可在元数据中以 .lua 扩展名引用自身并被执行，形成单文件攻击变体。\n修复版本中通过三项修改切断攻击链：加载本地 Automation 脚本前弹出确认对话框并列出待加载脚本，用户确认后才加载执行；agi::fs::HasExtension 改为按 C 字符串截断，与文件系统操作保持一致；解析 Aegisub Project Garbage 与 Extradata 行时将嵌入的 NUL 字符替换为 Unicode 替换符，阻止单文件变体引用自身。", "effects": [{"comp_name": "Aegisub", "ecosystem": "linux", "versions": [{"affected_version": "[3.2.0,3.5.0)", "min_fixed_version": "3.5.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "从非可信控制范围包含功能例程", "kind_en": "包含来自不可信控制领域的功能", "last_modified_time": "2026-10-10", "level": "High", "mps_id": "MPS-z0o7-w6rl", "poc": false, "poc_url": [], "published_time": "2026-10-10", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-z0o7-w6rl", "name": "https://www.oscs1024.com/hd/MPS-z0o7-w6rl"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-92705", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-92705"}, {"url": "https://github.com/TypesettingTools/Aegisub/security/advisories/GHSA-67hq-5vgg-6f23", "name": "https://github.com/TypesettingTools/Aegisub/security/advisories/GHSA-67hq-5vgg-6f23"}, {"url": "https://github.com/TypesettingTools/Aegisub/commit/0a3073d59f10432eeebea65018b02ef4d0a87fff", "name": "https://github.com/TypesettingTools/Aegisub/commit/0a3073d59f10432eeebea65018b02ef4d0a87fff"}, {"url": "https://github.com/TypesettingTools/Aegisub/commit/b5bf23979e7453f7b1cc8ffeb82b3cc2d2ca75e6", "name": "https://github.com/TypesettingTools/Aegisub/commit/b5bf23979e7453f7b1cc8ffeb82b3cc2d2ca75e6"}, {"url": "https://github.com/TypesettingTools/Aegisub/commit/e4099055711cce327840870c050ce46e58f4aee0", "name": "https://github.com/TypesettingTools/Aegisub/commit/e4099055711cce327840870c050ce46e58f4aee0"}], "scope_influence": "", "tags": ["应用软件"], "title": "Aegisub任意代码执行漏洞", "_translated": true, "_saved_at": "2026-10-10T00:26:07+00:00", "_first_saved_at": "2026-10-10T00:26:07+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-z0o7-w6rl"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能有效地控制资源的使用，导致攻击者可以利用这个漏洞耗尽应用程序所依赖的资源。这些资源可以是计算资源（CPU、内存）、网络带宽、数据库连接或其他系统资源。攻击者可以通过发送特制的请求、恶意输入或其他方式，使应用程序消耗大量资源，导致拒绝服务或系统崩溃。", "title": "什么是拒绝服务"}, {"content": "- 消耗计算资源：攻击者可以发送计算密集型的请求，例如复杂的计算、无限循环或递归操作，以耗尽应用程序的计算资源，导致应用程序无法响应其他请求。\r\n- 消耗内存资源：攻击者可以发送大量的数据或恶意输入，以导致应用程序消耗过多的内存资源，从而使系统的可用内存耗尽，并导致应用程序崩溃或变得不可用。\r\n- 消耗网络带宽：攻击者可以发送大量的请求或大型数据包，以消耗应用程序所依赖的网络带宽。这会导致其他合法用户无法正常访问应用程序或降低系统的整体网络性能。\r\n- 消耗存储资源：攻击者可以发送大量的请求或上传大文件，以耗尽应用程序的存储资源，导致系统无法处理其他请求或存储新的数据。", "title": "拒绝服务常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对输入数据进行合理的验证和过滤，防止恶意输入导致资源消耗过高。\r\n- 实施资源限制：应用程序应该实施适当的资源限制策略，例如限制计算操作的时间或次数，限制内存使用量，限制并发连接数等，以防止资源被耗尽。\r\n- 异常处理与错误恢复：应用程序应该具备健壮的异常处理和错误恢复机制，以防止因意外错误导致资源泄漏或无法释放的情况。\r\n- 资源监控与警报：应用程序应该实施适当的资源监控和警报机制，及时发现异常的资源消耗情况，并采取相应的措施来应对。\r\n- 压力测试与性能优化：应用程序应该进行压力测试，以评估其在高负载情况下的性能，并进行必要的性能优化，以确保能够有效地处理大量请求而不耗尽资源。", "title": "如何预防拒绝服务"}], "cnvd_id": "", "cve_id": "CVE-2026-107839", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-400", "description": "ageLANServer 是一个以 AGPL-3.0 协议开源的跨平台 Web 服务器与启动器，用于在离线或局域网环境中为《帝国时代》与《神话时代》系列游戏提供多人对战服务，其内置的 AoE3 游戏服务器默认以 HTTPS 对外监听。\n受影响版本中，AoE3 的 POST /game/cloud/getFileURL 处理器经 i.Bind 使用 json.NewDecoder 直接解码请求体，全程没有请求体大小限制，也未对攻击者可控的 JSON names 数组长度设置上限，随后以 make(i.A, len(req.Names.Data)) 按数组长度直接预分配响应切片；默认配置 Authentication='disabled' 时，远程攻击者无需真实游戏凭据，通过 /game/login/platformlogin 获取会话后提交一条超大请求，便能迫使服务器分配与输入规模成正比的内存，导致进程崩溃或挂起、已连接玩家全部掉线，服务在重启前持续不可用。\n修复版本中通过在路由链新增 MaxBodySizeMiddleware 中间件并以 http.MaxBytesReader 将请求体上限设为 1MB，超限请求在 JSON 解码与内存分配前被拒绝，切断了超长 names 数组进入内存分配路径的链路，单条请求不再能引发内存过度分配。", "effects": [{"comp_name": "ageLANServer", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.15.2)", "min_fixed_version": "1.15.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "github.com/luskaner/ageLANServer/server", "ecosystem": "go", "versions": [{"affected_version": "(-∞,1.15.2)", "min_fixed_version": "1.15.2", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "拒绝服务", "kind_en": "不受控制的资源消耗", "last_modified_time": "2026-10-10", "level": "High", "mps_id": "MPS-1tws-4fki", "poc": false, "poc_url": [], "published_time": "2026-10-10", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-1tws-4fki", "name": "https://www.oscs1024.com/hd/MPS-1tws-4fki"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-107839", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-107839"}, {"url": "https://github.com/luskaner/ageLANServer/security/advisories/GHSA-4jfq-pmq9-257h", "name": "https://github.com/luskaner/ageLANServer/security/advisories/GHSA-4jfq-pmq9-257h"}, {"url": "https://github.com/luskaner/ageLANServer/commit/1dd40166a59356865c0a4b1800f32d05dc8bec79", "name": "https://github.com/luskaner/ageLANServer/commit/1dd40166a59356865c0a4b1800f32d05dc8bec79"}, {"url": "https://github.com/luskaner/ageLANServer/releases/tag/v1.15.2", "name": com/RIOT-OS/RIOT/security/advisories/GHSA-39j3-3v73-5mj2", "name": "https://github.com/RIOT-OS/RIOT/security/advisories/GHSA-39j3-3v73-5mj2"}, {"url": "https://github.com/RIOT-OS/RIOT/pull/22745", "name": "https://github.com/RIOT-OS/RIOT/pull/22745"}, {"url": "https://github.com/RIOT-OS/RIOT/commit/d3a47289c58d108575a19e623e4d3f647659e743", "name": "https://github.com/RIOT-OS/RIOT/commit/d3a47289c58d108575a19e623e4d3f647659e743"}], "scope_influence": "", "tags": ["应用软件"], "title": "RIOT nanocoap_fileserver远程拒绝服务漏洞", "_translated": true, "_saved_at": "2026-10-09T20:27:51+00:00", "_first_saved_at": "2026-10-09T20:27:51+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-7yge-vlwh"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过构造恶意的数据，将过多的数据输入到程序的缓冲区中，使得缓冲区的空间被填满，从而溢出到程序的栈 (stack) 或堆 (heap) 中，导致程序崩溃、拒绝服务、数据泄露等安全问题。\n", "title": "什么是经典缓冲区溢出"}, {"content": "| 类型        | 描述                                                         |\n| ----------- | ------------------------------------------------------------ |\n| 代码注入攻击      | 攻击者通过向程序的缓冲区输入恶意代码，从而控制程序执行流程，实现对程序操作的恶意操作。例如，攻击者可以通过向 Web 应用程序的输入框中输入恶意代码，从而执行任意的代码，破坏系统、窃取数据等。 |\n| 数据覆盖攻击      | 攻击者通过向程序的缓冲区输入过多的数据，从而覆盖程序中的重要数据或代码，实现对程序操作的恶意操作。例如，攻击者可以通过向聊天应用程序的输入框中输入过多的表情符号，从而覆盖程序中的重要数据，例如聊天消息、账号密码等。 |\n| 栈溢出攻击 | 攻击者通过向程序的栈中输入过多的数据，从而溢出到栈外部，实现对程序操作的恶意操作。例如，攻击者可以通过向游戏应用程序的输入框中输入过多的道具名称，从而覆盖程序中的重要数据，例如游戏数据、账号密码等。 |\n| 堆溢出攻击       | 攻击者通过向程序的堆中输入过多的数据，从而溢出到堆外部，实现对程序操作的恶意操作。例如，攻击者可以通过向操作系统工具的输入框中输入过多的命令，从而覆盖程序中的重要数据，例如系统文件、配置文件等。 |", "title": "经典缓冲区溢出常见的攻击方式"}, {"content": "- 输入验证：在程序输入处对输入数据进行严格的验证和过滤，确保输入数据符合预期的格式和类型，避免被攻击者注入恶意命令或数据。可以使用正则表达式、格式字符串等方式进行输入验证。\n- 输出过滤：在程序输出处对输出数据进行严格的过滤和检查，确保输出数据符合预期的格式和类型，避免被攻击者截获和篡改。可以使用安全的输出过滤库等方式进行输出过滤。\n- 使用安全的编程模型：使用安全的编程模型，例如避免使用原生的缓冲区管理函数，使用安全的框架和库来处理输入数据和执行命令，避免缓冲区溢出漏洞。\n- 数据库加密和访问控制：对于敏感数据和命令，使用加密和访问控制措施，确保只有授权用户可以访问和执行命令，避免被攻击者窃取和篡改。\n- 定期更新和升级：定期更新和升级应用程序和库的版本，确保应用程序和库的最新版本包含了最新的安全补丁和修复措施，避免安全漏洞的出现和利用。\n- 安全审计和监控：定期对系统和应用程序进行安全审计和监控，及时发现和阻止潜在的安全漏洞和攻击，确保系统和数据的安全和可靠性。", "title": "如何预防经典缓冲区溢出"}], "cnvd_id": "", "cve_id": "CVE-2026-75350", "cvss": {"cvssv31": [{"source": "cve@mitre.org", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-120", "description": "OpENer 是 EIPStackGroup 开源的 EtherNet/IP 适配器协议栈，以 C 语言实现，用于让工业现场设备以适配器角色接入 EtherNet/IP 网络并处理显式与隐式报文。\n受影响版本中，Identity 对象默认注册的 GetAttributeList 服务在 source/src/cip/cipcommon.c 中按 GetCipDataTypeLength 估算单条响应所需空间，未计入每条响应固定写入的属性 ID（2 字节）、status（1 字节）与 reserved（1 字节），单条属性至少低估 4 字节；远程攻击者通过 TCP 44818 端口发送携带大量属性项与合法 sockaddr 项的 Get_Attribute_List 显式请求后，累计低估使 message_router_response 越界写入并破坏 current_message_position，响应组装阶段 AssembleLinearMessage 继续编码合法 CPF 项时在 AddIntToMessage 中解引用该越界指针，进程崩溃，造成远程拒绝服务。\n修复版本中通过，可通过将 EtherNet/IP 端口 TCP/UDP 44818 限定于可信网络、阻断不可信主机的显式报文会话缓解远程拒绝服务风险；截至 2026-10-10，上游 master 分支至 d8820ef41 仍包含该缺陷代码，尚未发布包含修复的版本。", "effects": [{"comp_name": "OpENer", "ecosystem": "linux", "versions": [{"affected_version": "[8e6763e16,d8820ef41]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "经典缓冲区溢出", "kind_en": "不检查输入大小的缓冲区复制（“经典缓冲区溢出”）", "last_modified_time": "2026-10-10", "level": "High", "mps_id": "MPS-dxmo-7ic1", "poc": false, "poc_url": [], "published_time": "2026-10-10", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-dxmo-7ic1", "name": "https://www.oscs1024.com/hd/MPS-dxmo-7ic1"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-75350", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-75350"}, {"url": "https://github.com/EIPStackGroup/OpENer", "name": ""}, {"url": "https://github.com/EIPStackGroup/OpENer/blob/master/source/src/cip/cipcommon.c", "name": ""}, {"url": "https://github.com/EIPStackGroup/OpENer/blob/master/source/src/enet_
