 "2026-10-15T22:50:31+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-0xwo-qpnd"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-108452", "cvss": {"cvssv31": [{"source": "secure@microsoft.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-22", "description": "Improper limitation of a pathname to a restricted directory ('path traversal') in Microsoft Office SharePoint allows an authorized attacker to execute code over a network.", "effects": [{"comp_name": "sharepoint_server", "ecosystem": "linux", "versions": [{"affected_version": "[16.0.0,16.0.20326.20190)", "min_fixed_version": "16.0.20326.20190", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-10-16", "level": "High", "mps_id": "MPS-47zf-ah30", "poc": false, "poc_url": [], "published_time": "2026-10-16", "reference ，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "cnvd_id": "", "cve_id": "CVE-2026-108446", "cvss": {"cvssv31": [{"source": "secure@microsoft.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "cwe": "CWE-416", "description": "Use after free in Microsoft Office Excel allows an unauthorized attacker to execute code over a network.", "effects": [{"comp_name": "365_apps", "ecosystem": "linux", "versions": [{"affected_version": "[16.0.1,+∞)", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "office_2021", "ecosystem": "linux", "versions": [{"affected_version": "[16.0.1,16.0.14334.20974)", "min_fixed_version": "16.0.14334.20974", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[16.0.0.0,16.0.10417.20228)", "min_fixed_version": "16.0.10417.20228", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "office_2024", "ecosystem": "linux", "versions": [{"affected_version": "[16.0.0,16.0.17932.21056)", "min_fixed_version": "16.0.17932.21056", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "office_365", "ecosystem": "linux", "versions": [{"affected_version": "[1.0.0,16.114.26101123)", "min_fixed_version": "16.114.26101123", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "office_macos_2021", "ecosystem": "linux", "versions": [{"affected_version": "[16.0.1,16.114.26101123)", "min_fixed_version": "16.114.26101123", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "office_macos_2024", "ecosystem": "linux", "versions": [{"affected_version": "[16.0.0,16.114.26101 dmins to manage users outside their departments by supplying arbitrary user ids. Attackers holding sys:user:* permissions can call /admin/sys/user/info, update, or delete to read records, reset passwords and roles, or delete accounts.", "effects": [{"comp_name": "cool-admin-midway", "ecosystem": "linux", "versions": [{"affected_version": "(0,8.0.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "通过用户控制密钥绕过授权机制", "kind_en": "通过用户控制的密钥绕过授权", "last_modified_time": "2026-10-16", "level": "High", "mps_id": "MPS-81np-kcqx", "poc": false, "poc_url": [], "published_time": "2026-10-16", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-81np-kcqx", "name": "https://www.oscs1024.com/hd/MPS-81np-kcqx"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-111366", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-111366"}, {"url": "https://hackmd.io/@hieuPenguinnn/cool-admin-midway-base-crud-role-ownership-idor", "name": ""}, {"url": "https://github.com/cool-team-official/cool-admin-midway/blob/e545ef6f3b0c08581e34bd3207ca57d851ccc3ae/src/modules/base/service/sys/user.ts#L41-L70", "name": ""}, {"url": "https://github.com/cool-team-official/cool-admin-midway/blob/e545ef6f3b0c08581e34bd3207ca57d851ccc3ae/src/modules/base/service/sys/user.ts#L205-L229", "name": ""}, {"url": "https://github.com/cool-team-official/cool-admin-midway", "name": ""}, {"url": "https://www.vulncheck.com/advisories/cool-admin-midway-through-8.0.0-authorization-bypass-via-admin-sys-user-endpoints", "name": "VulnCheck Advisory: cool-admin-midway through 8.0.0 Authorization Bypass via /admin/sys/user Endpoints"}], "scope_influence": "", "tags": ["应用软件"], "title": "cool-admin-midway through 8.0.0 Authorization Bypass via /admin/sys/user Endpoints", "_translated": true, "_saved_at": "2026-10-18T02:36:18+00:00", "_first_saved_at": "2026-10-16T00:57:05+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-81np-kcqx"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-55103", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:N/A:N", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:N/A:N", "cwe": "CWE-863", "description": "Discourse ActivityPub adds ActivityPub support to Discourse. Prior to commit 1c8518b0f2abdf31cbea3e0b242f74d8994a9ba5, inbound ActivityPub processing does not sufficiently verify that the actor authenticated by the signed request matches the Activity actor and owns the referenced federated post. A remote attacker can exploit these missing identity and ownership checks to edit, delete, or reply to federated posts without the required permissions. This vulnerability is fixed with commit 1c8518b0f2abdf31cbea3e0b242f74d8994a9ba5.", "effects": [{"comp_name": "discourse-activity-pub", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1c8518b0f2abdf31cbea3e0b242f74d8994a9ba5)", "min_fixed_version": "1c8518b0f2abdf31cbea3e0b242f74d8994a9ba5", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-10-16", "level": "High", "mps_id": "MPS-vfa9-x68w", "poc": false, "poc_url": [], "published_time": "2026-10-16", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-vfa9-x68w", "name": "https://www.oscs1024.com/hd/MPS-vfa9-x68w"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-55103", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-55103"}, {"url": "https://github.com/discourse/discourse-activity-pub/security/advisories/GHSA-jw39-rch6-mhwf", "name": "https://github.com/discourse/discourse-activity-pub/security/advisories/GHSA-jw39-rch6-mhwf"}, {"url": "https://github.com/discourse/discourse-activity-pub/commit/1c8518b0f2abdf31cbea3e0b242f74d8994a9ba5", "name": "https://github.com/discourse/discourse-activity-pub/commit/1c8518b0f2abdf31cbea3e0b242f74d8994a9ba5"}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-55103漏洞", "_translated": true, "_saved_at": "2026-10-18T02:36:18+00:00", "_first_saved_at": "2026-10-15T19:38:04+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-vfa9-x68w"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-111399", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:N/A:L", "severity": "high", "base_score": 8.5}]}, "cvss_score": 8.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:N/A:L", "cwe": "CWE-89", "description": "PT Norther Lights 生产 MapSVG Mapsvg-lite-interactive-vector-maps 中 SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）漏洞允许 SQL 注入。此问题影响 MapSVG：从不适用到 8.16.1。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-10-16", "level": "High", "mps_id": "MPS-3087-k9vh", "poc": false, "poc_url": [], "published_time": "2026-10-16", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-3087-k9vh", "name": "https://www.oscs1024.com/hd/MPS-3087-k9vh"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-111399", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-111399"}, {"url": "https://patchstack.com/database/wordpress/plugin/mapsvg-lite-interactive-vector-maps/vulnerability/wordpress-mapsvg-plugin-8-16-1-sql-injection-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": [], "title": "WordPress MapSVG 插件 \u003c= 8.16.1 - SQL 注入漏洞", "_translated": true, "_saved_at": "2026-10-16T15:06:29+00:00", "_first_saved_at": "2026-10-16T15:06:29+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-3087-k9vh"}, {"analysis_status": 3, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "cnvd_id": "", "cve_id": "CVE-2026-92392", "cvss": {"cvssv31": [{"source": "134c704f-9b21-4f2e-91b3-4a467353bcc0", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.1}, {"source": "murphysec", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.1}]}, "cvss_score": 8.1, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-416", "description": "curl 是开源的网络传输工具，同时提供被其他程序直接调用的 libcurl 库。这个漏洞打的是发起 HTTP/2 上传的那个进程，可以是命令行 curl，也可以是业务系统里用 libcurl 向外发送日志、备份或附件的程序。接收上传的 HTTP/2 服务器负责触发发起上传的客户端的漏洞。\n受影响版本中，上传方把数据传到对方地址时，对方在数据还没传完时主动复位这条流，错误码为要求改用 HTTP/1.1（HTTP_1_1_REQUIRED）或拒绝该流（REFUSED_STREAM），curl 会把这次上传当成可以重试。收尾时它先告诉连接这次传输已经结束，再把还没发出去的内容写进同一条连接。连接已经忘掉原来的传输，把残留内容当成一次新请求，并保存指向原传输对象的指针。重试结束后程序释放该对象，连接上的指针还在，对方之后再发来数据时会用到已经释放的对象，上传进程因此崩溃。对方可以是攻击者搭建的接收端，也可以是原先可信、后来被控制的上传目的地。厂商说明，要把这种错误变成这台上传机器上的代码执行，触发方必须同时掌握 curl 版本与传输对象内存布局、处理器架构、匹配的 libc 分配器和堆布局、nghttp2 与 OpenSSL TLS 1.3 的分配行为（含会话票据）、固定的 CA 证书包，以及两条并行传输的稳定时序，并据此校准偏移和 libc 符号。现有利用大约只能放入 23 字节命令。\n修复版本中通过调整传输结束时的顺序修复该问题。程序先按原来的这次上传处理完残留数据，再通知连接放弃对这次传输的引用，避免残留内容被当成新请求后留下悬空指针。", "effects": [{"comp_name": "curl", "ecosystem": "linux", "versions": [{"affected_version": "[8.12.0,8.14.3)", "min_fixed_version": "8.14.3", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[8.15.0,8.16.2)", "min_fixed_version": "8.16.2", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[8.17.0,8.20.2)", "min_fixed_version": "8.20.2", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[8.21.0,8.23.0)", "min_fixed_version": "8.23.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": 0.00226, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "低", "fix_suggestion": "建议修复", "kind": "UAF", "kind_en": "免费后使用", "last_modified_time": "2026-10-16", "level": "High", "mps_id": "MPS-bgx2-s5cl", "poc": true, "poc_url": [], "published_time": "2026-10-16", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-bgx2-s5cl", "name": "https://www.oscs1024.com/hd/MPS-bgx2-s5cl"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-92392", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-92392"}, {"url": "https://curl.se/docs/CVE-2026-92392.json", "name": "json"}, {"url": "https://curl.se/docs/CVE-2026-92392.html", "name": "www"}, {"url": "https://hackerone.com/reports/4030333", "name": "issue"}, {"url": "https://github.com/curl/curl/commit/8b0744af5b1b631da5b938ca31c3f9895ad5a321", "name": "Commit"}, {"url": "https://github.com/curl/curl/commit/cd9107e0128191b7b5396b9eb81bbd20c2d36755", "name": "Commit"}], "scope_influence": "广", "tags": ["poc", "专家校准", "应用软件", "终端软件"], "title": "curl HTTP/2上传释放后使用漏洞", "_translated": true, "_saved_at": "2026-10-16T05:28:43+00:00", "_first_saved_at": "2026-10-16T05:28:43+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-bgx2-s5cl"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-109221", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:H/A:H", "severity": "high", "base_score": 8.1}]}, "cvss_score": 8.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:H/A:H", "cwe": "CWE-22", "description": "WordPress 的 Groundhogg — CRM、新闻通讯和营销自动化插件很容易受到任意文件删除的影响，因为在 4.9.3 及之前的所有版本中，copy_file 函数中的文件路径验证不足，这使得具有销售代表级别及以上访问权限的经过身份验证的攻击者可以删除服务器上的任意文件，这很容易导致在删除正确文件（例如 wp-config.php）时远程执行代码。任何拥有插件定义的 import_contacts 功能的用户都可以利用此功能，该功能默认授予插件的自定义销售代表角色。", "effects": [{"comp_name": "Groundhogg — CRM, Newsletters, and Marketing Automation", "ecosystem": "linux", "versions": [{"affected_version": "(0,4.9.3]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-10-16", "level": "High", "mps_id": "MPS-js5a-0xkt", "poc": false, "poc_url": [], "published_time": "2026-10-16", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-js5a-0xkt", "name": "https://www.oscs1024.com/hd/MPS-js5a-0xkt"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-109221", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-109221"}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/fb5100ac-cfe6-4e91-9349-6e8efa850147?source=cve", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/groundhogg/tags/4.9.3/includes/classes/traits/file-box.php#L94", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/groundhogg/tags/4.9.3/includes/c n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-55246", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "cwe": "CWE-787", "description": "bincookie is a header-only binarycookies parser. Prior to 0.1.9, bincookie_init_file() in bincookie.h allocates a buffer using the actual .binarycookies file length but trusts the file-controlled num_pages field as the loop bound for byte-swapping page_sizes entries. A crafted file can make the loop read and write beyond the heap allocation, and related unvalidated page sizes and cookie_offsets can drive additional out-of-bounds accesses in page and cookie iteration. Applications that parse an attacker-supplied binarycookies file may crash or suffer heap corruption that can potentially enable code execution. This issue is fixed in version 0.1.9.", "effects": [{"comp_name": "bincookie", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,0.1.9)", "min_fixed_version": "0.1.9", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-10-16", "level": "High", "mps_id": "MPS-qj8n-ug6h", "poc": false, "poc_url": [], "published_time": "2026-10-16", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-qj8n-ug6h", "name": "https://www.oscs1024.com/hd/MPS-qj8n-ug6h"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-55246", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-55246"}, {"url": "https://github.com/Tatsh/bincookie/security/advisories/GHSA-22pc-xxw4-q849", "name": "https://github.com/Tat 求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-110590", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "cwe": "CWE-862", "description": "WordPress 的 Klarna for WooCommerce 插件在 4.13.3 及之前的所有版本中都容易受到授权绕过，这是因为该插件未正确验证用户是否有权执行操作。这使得未经身份验证的攻击者可以访问任何订单的秘密 order_key 以及完整的计费和运输 PII（包括名字、姓氏、电子邮件地址、电话号码、街道地址、邮政编码、城市、地区和国家）作为 klarna_ payments_params JavaScript 变量内联发出，从而实现完整的商店范围订单枚举。由于 WooCommerce 订单 ID 是连续整数，并且不需要 order_key 或经过身份验证的会话，因此可以使用对订单支付端点的连续 GET 请求轻松枚举商店中的每个订单。", "effects": [{"comp_name": "Klarna for WooCommerce", "ecosystem": "linux", "versions": [{"affected_version": "(0,4.13.3]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-10-16", "level": "High", "mps_id": "MPS-xyfc-l6wn", "poc": false, "poc_url": [], "published_time": "2026-10-16", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-xyfc-l6wn", "name": "https://www.oscs1024.com/hd/MPS-xyfc-l6wn"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-110590", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-110590"}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/c3abb96e-6ee2-4992-a122-9f661da9a4d6?source=cve", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/klarna-payments-for-woocommerce/tags/4.13.3/classes/class-kp-assets.php#L185", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/klarna-payments-for-woocommerce/tags/4.13.3/classes/class-kp-assets.php#L198", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/klarna-payments-for-woocommerce/tags/4.13.3/classes/class-kp-assets.php#L204", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/klarna-payments-for-woocommerce/tags/4.13.3/classes/class-kp-assets.php#L159", "name": ""}, {"url": "https://github.com/krokedil/klarna-payments-for-woocommerce/compare/4.13.3...f5362605a9901b7f9264cfa3b22fd782a7a3097b", "name": ""}, {"url": "https://plugins.trac.wordpress.org/changeset/3740915/klarna-payments-for-woocommerce/trunk/classes/class-kp-assets.php", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-110590漏洞", "_translated": true, "_saved_at": "2026-10-16T10:29:41+00:00", "_first_saved_at": "2026-10-16T10:29:41+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-xyfc-l6wn"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "cnvd_id": "", "cve_id": "CVE-2026-111114", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-269", "description": "用于 WordPress 的 Nexter 扩展 – 安全、性能、代码片段和站点工具包插件在 4.7.11 及之前的所有版本中都容易受到权限升级的影响。存在该漏洞的原因是，当提供的用户名与经过身份验证的调用者匹配时，“role_switcher_to_view_admin_as()”中的“/?reset-view”处理程序不执行随机数或功能检查，而且该插件唯一的清理机制（“profile_update”挂钩）不执行任何操作。当 WordPress 通过“wp-admin/users.php?action=promote”执行批量角色更改时触发，它直接调用“WP_User::set_role()”并在“nxtext_view_admin_original_role”用户元中留下陈旧的“administrator”值。这使得具有订阅者级别或更高级别访问权限的经过身份验证的攻击者可以将过时的存储管理员角色恢复到自己的帐户，从而有效地将其权限升级为管理员。利用该漏洞需要攻击者的帐户之前拥有管理员角色并使用“查看管理员角色切换器”功能，然后再通过批量角色更改控件而不是“编辑用户”屏幕专门降级，因为只有批量路径会绕过“profile_update”挂钩，否则该挂钩会清除存储的原始角色。", "effects": [{"comp_name": "Nexter Extension – Security, Performance, Code Snippets \u0026 Site Toolkit", "ecosystem": "linux", "versions": [{"affected_version": "(0,4.7.11]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-10-16", "level": "High", "mps_id": "MPS-yw4g-3c0l", "poc": false, "poc_url": [], "published_time": "2026-10-16", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-yw4g-3c0l", "name": "https://www.oscs1024.com/hd/MPS-yw4g-3c0l"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-111114", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-111114"}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/ae86441d-5a95-45a7-869a-9e7872365a1f?source=cve", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/nexter-extension/tags/4.7.11/include/panel-settings/extensions/nexter-ext-view-admin-role.php#L287", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/nexter-extension/tags/4.7.11/include/panel-settings/extensions/nexter-ext-view-admin-role.php#L265", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/nexter-extension/tags/4.7.11/include/panel-settings/extensions/nexter-ext-view-admin-role.php#L51", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/nexter-extension/tags/4.7.11/include/panel-settings/extensions/nexter-ext-view-admin-role.php#L302", "name": ""}, {"url": "https://plugins.trac.wordpress.org/changeset/3740891/nexter-extension/trunk/include/panel-settings/extensions/nexter-ext-view-admin-role.php", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-111114漏洞", "_translated": true, "_saved_at": "2026-10-16T10:29:39+00:00", "_first_saved_at": "2026-10-16T10:29:39+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-yw4g-3c0l"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-109998", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "cwe": "CWE-79", "description": "由于输入清理和输出转义不足，WordPress 的 Mang Board 插件在 2.4.3 及之前的所有版本中都容易通过“content”参数受到存储跨站脚本攻击。这使得未经身份验证的攻击者可以在页面中注入任意 Web 脚本，每当用户访问注入的页面时就会执行这些脚本。这是可利用的，因为 wp_ajax_nopriv_mb_template 端点无需身份验证即可公开访问，对于 content_reply 模式不强制执行随机数验证，并且 admin-ajax.php 使用 Content-Type: text/html 进行响应，导致浏览器执行嵌入在 JSON 响应正文中的注入标签。", "effects": [{"comp_name": "Mang Board", "ecosystem": "linux", "versions": [{"affected_version": "(0,2.4.3]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-10-16", "level": "High", "mps_id": "MPS-c6yp-dnih", "poc": false, "poc_url": [], "published_time": "2026-10-16", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-c6yp-dnih", "name": "https://www.oscs1024.com/hd/MPS-c6yp-dnih"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-109998", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-109998"}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/9fe455dc-8138-49d0-97a1-b0dce111d23b?source=cve", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/mangboard/tags/2.4.3/api/mb-template.php#L150", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/mangboard/tags/2.4.3/api/mb-template.php#L177", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/mangboard/tags/2.4.3/api/mb-board.php#L24", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/mangboard/tags/2.4.3/includes/functions/func.api.php#L146", "name": ""}, {"url": "https://plugins.trac.wordpress.org/changeset?reponame=\u0026old=3738899%40mangboard\u0026new=3738899%40mangboard", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-109998漏洞", "_translated": true, "_saved_at": "2026-10-16T10:29:44+00:00", "_first_saved_at": "2026-10-16T10:29:44+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-c6yp-dnih"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-111363", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:N", "severity": "medium", "base_score": 6.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-639", "description": "BISHENG through 3.0.0-beta4 contains an insecure direct object reference vulnerability that allows authenticated low-privileged users to read other users' parsed documents by supplying arbitrary file_id values. Attackers can enumerate sequential file ids against GET /api/v1/knowledge/file_bbox to retrieve extracted page text from other users' and tenants' knowledge bases.", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "expl 和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "cnvd_id": "", "cve_id": "CVE-2026-96627", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-269", "description": "Arcane 是一个用于管理 Docker 容器、镜像、网络和卷的界面。在2.6.0之前，backend/api/handlers/users.go中的UpdateUser为任何目标设置PasswordHash，而不比较调用者和目标权限。委派用户：更新权限的持有者可以提交全局管理员的密码更改、替换管理员密码并以该帐户身份进行身份验证，从而实现全局管理员帐户的完全接管。此问题已在 2.6.0 版本中修复。", "effects": [{"comp_name": "github.com/getarcaneapp/arcane/backend/v2", "ecosystem": "go", "versions": [{"affected_version": "(-∞,v2.6.0)", "min_fixed_version": "v2.6.0", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-10-17", "level": "High", "mps_id": "MPS-wkdh-3vn7", "poc": false, "poc_url": [], "published_time": "2026-10-17", "reference_url_list": [{"url": "https://github.com/getarcaneapp/arcane/security/advisories/GHSA-pw5q-rjx4-7f7p", "name": ""}, {"url": "https://github.com/getarcaneapp/arcane/pull/3426", "name": ""}, {"url": "https://github.com/getarcaneapp/arcane/commit/21ea962f86d967dac8ae02a050f6e5f043d10fa1", "name": ""}, {"url": "https://github.com/getarcaneapp/arcane/releases/tag/b ，当应用程序对于用户输入过滤不完全时，攻击者可以注入恶意代码并控制代码执行流程。", "title": "代码注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对所有用户输入进行验证和过滤，确保只接受预期的有效输入。这包括对输入数据进行输入长度验证、类型检查和格式验证等。\r\n- 使用参数化查询或预编译语句：对于数据库查询操作，应该使用参数化查询或预编译语句，确保输入数据不会被误认为是执行代码。\r\n- 最小特权原则：应用程序在执行操作系统命令或动态代码时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。\r\n- 安全编码实践：开发人员应该采用安全编码实践，包括避免使用eval函数、避免拼接用户输入的字符串作为代码执行等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止代码注入攻击。", "title": "如何预防代码注入"}], "cnvd_id": "", "cve_id": "CVE-2026-92798", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N", "severity": "high", "base_score": 8.1}]}, "cvss_score": 8.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N", "cwe": "CWE-94", "description": "WordPress 的用户注册和会员插件在 5.2.8 及以下版本中容易受到任意短代码执行的攻击，这是由于 UR_Smart_Tags::process() 的“referrer_url”分支中的输入清理不足，其中攻击者控制的 HTTP_REFERER 标头仅通过 sanitize_text_field() 传递（不会去除 WordPress 短代码分隔符），然后将其替换为内容限制消息随后通过 apply_shortcodes()/do_shortcode() 执行。这使得未经身份验证的攻击者可以在消息使用受支持的 {{referrer_url}} 智能标记的任何受限页面上执行任意注册的短代码。", "effects": [{"comp_name": "User Registration \u0026 Membership – Free \u0026 Paid Memberships, Subscriptions, Content Restriction, User Profile, Custom User Registration \u0026 Login Builder", "ecosystem": "linux", "versions": [{"affected_version": "(0,5.2.8]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "代码注入", "kind_en": "代码生成控制不当（“代码注入”）", "last_modified_time": "2026-10-17", "level": "High", "mps_id": "MPS-zcqt-d70r", "poc": false, "poc_url": [], "published_time": "2026-10-17", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-zcqt-d70r", "name": "https://www.oscs1024.com/hd/MPS-zcqt-d70r"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-92798", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-92798"}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/ec317df9-c7ef-49a3-9818-903dfe4bdd03?source=cve", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/user-registration/tags/5.2.8/includes/class-ur-smart-tags.php#L475", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/user-registration/tags/5.2.8/includes/class-ur-smart-tags.php#L474", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/user-registration/tags/5.2.8/modules/content-restriction/class-urcr-frontend.php#L1383", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/user-registration/tags/5.2.8/modules/content-restriction/functions-urcr-core.php#L693", "name": ""}, {"url": "https://plugins.trac.wordpress.org/changeset/3741339/user-registration/trunk/includes/class-ur-smart-tags.php", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-92798漏洞", "_translated": true, "_saved_at": "2026-10-17T16:47:36+00:00", "_first_saved_at": "2026-10-17T05:21:41+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-zcqt-d70r"}, {"analysis_status": 0, "articles": [{"content": "- 编写代码时没有正确处理输入数据或没有正确验证用户输入而导致的。", "title": "什么是关键资源权限分配不当"}, {"content": "- 弱密码或未使用的密码：当管理员或系统管理员在创建帐户时，没有使用强密码或未对帐户进行密码更新时，可能会发生这种情况。弱密码可能会被黑客破解或通过其他方式轻松访问系统。\n- 未正确配置权限：在系统中，不同的资源通常需要不同的权限才能访问。如果管理员未正确配置权限，那么未经授权的用户可能会通过欺骗系统或利用其他漏洞来访问关键资源。\n- 权限重用：在某些情况下，管理员可能会将某些权限分配给某个用户，但这些权限并未被正确地限制或授权给该用户。如果其他用户尝试使用这些权限访问关键资源，那么他们可能会获得未经授权的访问权限。\n- 未正确验证用户输入：当开发人员没有正确验证用户输入时，可能会发生这种情况。例如，如果开发人员未正确过滤用户输入的用户名或密码，那么黑客可能会利用这些信息轻松地访问系统。\n", "title": "关键资源权限分配不当常见的攻击方式"}, {"content": "- 使用强密码：管理员应该使用强密码来保护系统，并定期更改密码。强密码应该包括数字、字母和符号，并且应该不同于其他帐户使用的密码。\n- 正确配置权限：管理员应该正确配置系统中不同资源所需的权限。用户可以被授予访问特定资源的权限，但不应该被授予访问其他资源的权限。\n- 权限限制：管理员应该使用权限限制来限制用户对特定资源的访问。例如，用户可以被授予访问特定文件夹的权限，但不能访问其他文件夹。\n- 输入验证：开发人员应该正确验证用户输入。例如，他们可以过滤用户输入的用户名和密码，以确保它们符合预期的格式。\n- 安全培训：管理员和用户应该接受安全培训，以便了解如何识别和避免常见的安全漏洞，例如不正确权限授予漏洞。\n- 定期更新和修补软件：系统软件和应用程序应该定期更新和修补，以确保它们不受最新安全漏洞的影响。", "title": "如何预防关键资源权限分配不当"}], "cnvd_id": "", "cve_id": "CVE-2026-96424", "cvss": {"cvssv31": [{"source": "cve@gitlab.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-732", "description": "lomiri-upload-manager（lomiri-download-manager 的一部分）的 DBus 策略不正确，允许任意用户以 root 身份通过 DBus 读取任意文件", "effects": [{"comp_name": "lomiri-download-manager", "ecosystem": "linux", "versions": [{"affected_version": "(0.1.0,0.3.3)", "min_fixed_version": "0.3.3", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "关键资源权限分配不当", "kind_en": "关键资源的权限分配不正确", "last_modified_time": "2026-10-17", "level": "High", "mps_id": "MPS-upvx-gby7", "poc": false, "poc_url": [], "published_time": "2026-10-17", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-upvx-gby7", "name": "https://www.oscs1024.com/hd/MPS-upvx-gby7"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-96424", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-96424"}, {"url": "https://gitlab.com/ubports/development/core/lomiri-download-manager/-/work_items/18", "name": ""}, {"url": "https://gitlab.com/ubports/development/core/lomiri-download-manager/-/commit/779dfd5bbeb5fe8877627b772e5024e40eda38aa", "name": ""}, {"url": "https://forums.ubports.com/topic/12671/security-advisory-arbitrary-root-command-execution-and-unauthenticated-arbitrary-file-read-as-root-in-lomiri-download-manager", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "lomiri-download-manager 中关键资源的权限分配不正确", "_translated": true, "_saved_at": "2026-10-16T19:12:00+00:00", "_first_saved_at": "2026-10-16T19:12:00+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-upvx-gby7"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-111044", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:L/A:L", "severity": "high", "base_score": 7.6}]}, "cvss_score": 7.6, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:L/A:L", "cwe": "CWE-863", "description": "Sunshine 是 Moonlight 的自托管游戏直播主机。从 2026.329.165800 到 2026.906.222525，Sunshine 接受链接到存储的配对客户端证书的任何客户端证书，但不要求所提供的证书是确切的启用的配对身份。还对证书文本进行了比较，而没有对等效 PEM 编码进行规范化。保留其私钥的先前配对的客户端可以提供从其配对证书派生的备用证书并绕过禁用控制。等效的 PEM 编码也可能导致客户端身份处理不一致。从未配对过的客户端无法使用此问题，并且删除配对的客户端会删除其信任关系。此问题已在版本 2026.906.222525 中修复。", "effects": [{"comp_name": "Sunshine", "ecosystem": "linux", "versions": [{"affected_version": "[2026.329.165800,2026.906.222525)", "min_fixed_version": "2026.906.222525", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-10-17", "level": "High", "mps_id": "MPS-nxqi-p7r9", "poc": false, "poc_url": [], "published_time": "2026-10-17", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-nxqi-p7r9", "name": "https://www.oscs1024.com/hd/MPS-nxqi-p7r9"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-111044", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-111044"}, {"url": "https://github.com/LizardByte/Sunshine/security/advisories/GHSA-6jvv-jqr7-m6m3", "name": "https://github.com/LizardByte/Sunshine/security/advisories/GHSA-6jvv-jqr7-m6m3"}, {"url": "https://github.com/LizardByte/Sunshine/commit/4d768847fcd88cc94ac745c4611715c67d7d67e1", "name": "https://github.com/LizardByte/Sunshine/commit/4d768847fcd88cc94ac745c4611715c67d7d67e1"}, {"url": "https://github.com/LizardByte/Sunshine/releases/tag/v2026.906.222525", "name": "https://github.com/LizardByte/Sunshine/releases/tag/v2026.906.222525"}], "scope_influence": "", "tags": ["应用软件"], "title": "禁用的 Sunshine 客户端可以使用派生的客户端证书绕过吊销", "_translated": true, "_saved_at": "2026-10-17T00:57:56+00:00", "_first_saved_at": "2026-10-17T00:57:56+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-nxqi-p7r9"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用了空指针，并在不进行有效检查的情况下对其进行取消引用操作。当程序试图取消引用空指针时，由于空指针不指向任何有效的内存地址，会导致程序崩溃或产生未定义的行为。这种错误通常发生在开发者未对指针进行正确的初始化或验证时。", "title": "什么是空指针取消引用"}, {"content": "- 拒绝服务：攻击者可以通过构造恶意输入或请求，触发程序中的空指针取消引用错误，导致程序崩溃或无法正常运行。这可能导致拒绝服务攻击，使系统无法提供正常的服务。\r\n- 内存信息泄露：攻击者可以通过利用空指针取消引用错误，访问程序中的敏感内存信息。这可能包括栈上的变量、函数指针或其他敏感数据，从而暴露系统的机密信息。\r\n- 代码执行：在某些情况下，空指针取消引用错误可能导致执行恶意代码或注入恶意代码的机会。攻击者可以通过精心构造的输入，利用空指针取消引用错误来执行任意的代码，进而获取系统控制权或执行未经授权的操作。", "title": "空指针取消引用常见的攻击方式"}, {"content": "- 指针初始化和验证：开发者应该正确地初始化指针，并在使用指针之前进行有效的验证，确保指针不为空。在取消引用指针之前，应始终检查其是否为空。\r\n- 异常处理和错误恢复：程序应该具备健壮的异常处理和错误恢复机制，以便在发生空指针取消引用错误时能够适当地处理异常，而不是导致程序崩溃或暴露敏感信息。\r\n- 防御性编程：采用防御性编程的原则，如避免在未经验证的指针上进行操作，避免使用未初始化的指针等，以防止空指针取消引用错误的发生。\r\n- 静态代码分析和测试：使用静态代码分析工具和测试技术来检测和识别潜在的空指针取消引用错误。这些工具可以帮助发现代码中可能存在的空指针问题，并及时修复。\r\n- 强制性编码标准和最佳实践：制定强制性的编码标准和最佳实践，包括良好的指针使用和管理规范，以帮助开发者编写更可靠、安全的代码。", "title": "如何预防空指针取消引用"}], "cnvd_id": "", "cve_id": "CVE-2026-57486", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-476", "description": "pupnp 是用于开发 UPnP 设备和控制点应用程序的 SDK。在 2.0.2 之前，ixml/src/node.c 中的 ixmlNode_compare 将可为 null 的 nodeValue、namespaceURI、prefix 和 localName 字段直接传递给 strcmp。 ixmlDocument_createAttribute 创建的非命名空间属性可以合法地将这些字段保留为 NULL。当 ixmlElement_removeAttributeNode 通过 find_condition_node 比较具有相同 nodeName 的两个不同属性对象时，指针标识快捷方式不适用，并且比较取消引用 NULL，从而在攻击者控制的 XML 的应用程序处理到达此路径时导致进程崩溃。此问题已在 2.0.2 中修复。", "effects": [{"comp_name": "pupnp", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.0.2)", "min_fixed_version": "2.0.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "空指针取消引用", "kind_en": "空指针取消引用", "last_modified_time": "2026-10-17", "level": "High", "mps_id": "MPS-2iwy-cbgt", "poc": false, "poc_url": [], "published_time": "2026-10-17", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-2iwy-cbgt", "name": "https://www.oscs1024.com/hd/MPS-2iwy-cbgt"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-57486", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-57486"}, {"url": "https://github.com/pupnp/pupnp/security/advisories/GHSA-q54q-vx78-v9rq", "name": "https://github.com/pupnp/pupnp/security/advisories/GHSA-q54q-vx78-v9rq"}, {"url": "https://github.com/pupnp/pupnp/commit/4b2f775e3b98de3cfb096707bcde040c5562d9ec", "name": "https://github.com/pupnp/pupnp/commit/4b2f775e3b98de3cfb096707bcde040c5562d9ec"}, {"url": "https://github.com/pupnp/pupnp/releases/tag/release-2.0.2", "name": "https://github.com/pupnp/pupnp/releases/tag/release-2.0.2"}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "pupnp：ixmlNode_compare 中的 NULL 指针取消引用在非命名空间属性上崩溃", "_translated": true, "_saved_at": "2026-10-16T19:12:16+00:00", "_first_saved_at": "20 其他合法用户无法正常访问应用程序或降低系统的整体网络性能。\r\n- 消耗存储资源：攻击者可以发送大量的请求或上传大文件，以耗尽应用程序的存储资源，导致系统无法处理其他请求或存储新的数据。", "title": "拒绝服务常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对输入数据进行合理的验证和过滤，防止恶意输入导致资源消耗过高。\r\n- 实施资源限制：应用程序应该实施适当的资源限制策略，例如限制计算操作的时间或次数，限制内存使用量，限制并发连接数等，以防止资源被耗尽。\r\n- 异常处理与错误恢复：应用程序应该具备健壮的异常处理和错误恢复机制，以防止因意外错误导致资源泄漏或无法释放的情况。\r\n- 资源监控与警报：应用程序应该实施适当的资源监控和警报机制，及时发现异常的资源消耗情况，并采取相应的措施来应对。\r\n- 压力测试与性能优化：应用程序应该进行压力测试，以评估其在高负载情况下的性能，并进行必要的性能优化，以确保能够有效地处理大量请求而不耗尽资源。", "title": "如何预防拒绝服务"}], "cnvd_id": "", "cve_id": "CVE-2026-68498", "cvss": {"cvssv31": [{"source": "36c7be3b-2937-45df-85ea-ca7133ea542c", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-400", "description": "StreamReadConstraints.maxNameLength（默认 50,000 个字符）旨在限制单个 JSON 对象属性名称在解析时可以消耗的内存量，与限制普通字符串值的更大的 maxStringLength（默认 100,000,000 个字符）无关。对于基于字符输入构建的解析器（Reader、String 或 char[] 源，全部由 ReaderBasedJsonParser 提供），在累积名称时不会应用该绑定。相反，代码路径重新使用字符串值长度检查，默认情况下大约大 2000 倍。\n\n\n\n在字符输入慢速路径中，ReaderBasedJsonParser._parseName2() 将名称累积到 TextBuffer 中，并且当段填满时，调用 TextBuffer.finishCurrentSegment()，该方法仅验证 maxStringLength。一旦整个名称被扫描到其结束引号，就会在 CharsToNameCanonicalizer.findSymbol() 中进行正确的检查 StreamReadConstraints.validateNameLength(int)。到那时，全名（最多 maxStringLength 个字符）已经缓冲在内存中。\n\n\n\n可以通过此路径解析单个足够长的 JSON 对象属性名称的远程攻击者可以在抛出任何 StreamConstraintsException 之前强制分配大约 100,000,000 个字符（大约 200 MB，分段簿记会推高实际峰值使用量），而不是限制 API 承诺的大约 50,000 个字符（大约 100 KB）。在并发请求中重复此操作可能会耗尽堆并使进程崩溃。不需要身份验证或用户交互。由于 StreamReadConstraints.maxDocumentLength 默认情况下处于禁用状态 (-1)，因此没有其他任何东西首先绑定令牌，因此该问题在默认配置下是可利用的。\n\n\n\n字节输入解析器不受影响：UTF8StreamJsonParser、UTF8DataInputJsonParser 和非阻塞（异步）解析器通过 ParserBase._growNameDecodeBuffer() 在名称解码缓冲区每次增长时重新验证 maxNameLength，在仅分配数十 KB 后拒绝过大的名称。当从字符串、Reader 或 char[]（例如已读入字符串的 HTTP 请求正文）而不是从原始 UTF-8 字节解析不受信任的 JSON 时，应用程序就会暴露。\n\n\n\n此问题影响 2.16.0 中的 com.fasterxml.jackson.core:jackson-core 和 3.0.0 中的tools.jackson.core:jackson-core。 2.16.0 之前的版本不受影响，因为 StreamReadConstraints.maxNameLength 是在 jackson-core 2.16.0 中首次引入的。", "effects": [{"comp_name": "jackson-core", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.18.10]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,2.21.6]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,2.16.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,2.19.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,3.0.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,2.22.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,3.1.6]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,3.2.2]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,3.2.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,2.22.2]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "拒绝服务", "kind_en": "不受控制的资源消耗", "last_modified_time": "2026-10-17", "level": "High", "mps_id": "MPS-sqvx-7yd1", "poc": false, "poc_url": [], "published_time": "2026-10-17", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-sqvx-7yd1", "name": "https://www.oscs1024.com/hd/MPS-sqvx-7yd1"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-68498", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-68498"}, {"url": "https://githu : 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-400", "description": "pupnp 是用于开发 UPnP 设备和控制点应用程序的 SDK。在 22.0.4 之前，upnp/src/genlib/net/uri/uri.c 中的 parse_hostport 同步调用 getaddrinfo，而 parse_uri 正在处理来自 upnp/src/genlib/net/http/httpparser.c 中的入站 HTTP 请求目标的攻击者提供的主机名以及由 create_url_list 处理的 GENA SUBSCRIBE CALLBACK 标头upnp/src/gena/gena_device.c。未经身份验证的远程对等方可以选择缓慢或无响应的主机名，并在解析器超时时阻止有限的小型服务器工作线程，从而允许少量请求耗尽线程池并拒绝 UPnP 服务。此问题已在 22.0.4 中修复。", "effects": [{"comp_name": "pupnp", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,22.0.4)", "min_fixed_version": "22.0.4", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "拒绝服务", "kind_en": "不受控制的资源消耗", "last_modified_time": "2026-10-17", "level": "High", "mps_id": "MPS-wsy3-vx09", "poc": false, "poc_url": [], "published_time": "2026-10-17", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-wsy3-vx09", "name": "https://www.oscs1024.com/hd/MPS-wsy3-vx09"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-77630", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-77630"}, {"url": "https://github.com/pupnp/pupnp/security/advisories/GHSA-46ph-jff5-5h77", "name": "https://github.com/pupnp/pupnp/security/advisories/GHSA-46ph-jff5-5h77"}, {"url": "https://github.com/pupnp/pupnp/commit/5dba8070b4d64d976f8e6fc13f1f301befebe7d2", "name": "https://github.com/pupnp/pupnp/commit/5dba8070b4d64d976f8e6fc13f1f301befebe7d2"}, {"url": "https://github.com/pupnp/pupnp/releases/tag/release-22.0.4", "name": "https://github.com/pupnp/pupnp/releases/tag/release-22.0.4"}, {"url": "https://issues.oss-fuzz.com/issues/531780528", "name": "https://issues.oss-fuzz.com/issues/531780528"}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "pupnp：通过在 parse_uri()/GENA 回调解析中阻止 DNS 解析来拒绝服务", "_translated": true, "_saved_at": "2026-10-16T19:12:08+00:00", "_first_saved_at": "2026-10-16T19:12:08+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-wsy3-vx09"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-100316", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "cwe": "CWE-79", "description": "由于输入清理和输出转义不足，适用 : ""}, {"url": "https://plugins.trac.wordpress.org/changeset/3750463/invoicing/trunk/includes/admin/meta-boxes/class-mb-payment-form.php", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-111110漏洞", "_translated": true, "_saved_at": "2026-10-17T18:59:13+00:00", "_first_saved_at": "2026-10-17T10:00:06+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-t9hz-bo3m"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-92263", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-78", "description": "SparkyFitness 是一款面向家庭的自托管、人工智能驱动的健康和健身追踪器。在 1.6.0 之前，api/admin/backup/restore 端点将上传的文件名插入到 shell 命令中。经过身份验证的全局管理员上传带有精心设计的文件名的恢复存档。管理员可以提供包含 shell 元字符的文件名的恢复存档。成功利用该漏洞可以使用服务器进程权限执行任意操作系统命令。此问题已在 1.6.0 版本中修复。", "effects": [{"comp_name": "SparkyFitness", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.6.0)", "min_fixed_version": "1.6.0", "repository": "unmanaged", "solutions": [], "upstream": t ie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-96660", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "cwe": "CWE-79", "description": "由于输入清理和输出转义不足，WordPress 的用户注册和会员 – 免费和付费会员、订阅、内容限制、用户配置文件、自定义用户注册和登录生成器插件在 5.2.8 及之前的所有版本中很容易受到通过复选框字段值存储的跨站点脚本的攻击。这使得未经身份验证的攻击者可以在页面中注入任意 Web 脚本，每当用户访问注入的页面时就会执行这些脚本。 nopriv AJAX 操作 user_registration_user_form_submit 无需随机数验证即可到达 ur_process_registration()，这意味着任何未经身份验证的请求都可以到达易受攻击的代码路径。", "effects": [{"comp_name": "User Registration \u0026 Membership – Free \u0026 Paid Memberships, Subscriptions, Content Restriction, User Profile, Custom User Registration \u0026 Login Builder", "ecosystem": "linux", "versions": [{"affected_version": "(0,5.2.8]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestio d": "过度许可的跨域白名单", "kind_en": "不受信任域的宽松跨域策略", "last_modified_time": "2026-10-17", "level": "High", "mps_id": "MPS-x3cg-6fiv", "poc": false, "poc_url": [], "published_time": "2026-10-17", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-x3cg-6fiv", "name": "https://www.oscs1024.com/hd/MPS-x3cg-6fiv"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-108372", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-108372"}, {"url": "https://github.com/loopx-project/loopx/security/advisories/GHSA-vx2m-gpq4-8j5q", "name": "https://github.com/loopx-project/loopx/security/advisories/GHSA-vx2m-gpq4-8j5q"}, {"url": "https://github.com/loopx-project/loopx/pull/3137", "name": "https://github.com/loopx-project/loopx/pull/3137"}, {"url": "https://github.com/loopx-project/loopx/commit/838720fba42bd22f71b5bb763ec406f7bdf4c940", "name": "https://github.com/loopx-project/loopx/commit/838720fba42bd22f71b5bb763ec406f7bdf4c940"}, {"url": "https://github.com/loopx-project/loopx/releases/tag/v0.4.5", "name": "https://github.com/loopx-project/loopx/releases/tag/v0.4.5"}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-108372漏洞", "_translated": true, "_saved_at": "2026-10-17T00:57:58+00:00", "_first_saved_at": "2026-10-17T00:57:58+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-x3cg-6fiv"}, {"analysis_status": 0, "articles": [{"content": "由于整数类型的有限范围，在进行算术运算或操作时，结果可能超出类型的表示范围，导致溢出或环绕。溢出指的是结果超过了类型的最大值或小于了最小值，而环绕指的是结果绕回到类型的最小值或最大值。", "title": "什么是整数溢出或环绕"}, {"content": "- 缓冲区溢出：整数溢出可能导致缓冲区溢出漏洞。当整数溢出导致分配的缓冲区大小不足以容纳结果时，攻击者可以利用这个漏洞覆盖相邻的内存区域，执行恶意代码或篡改程序的状态。\r\n- 身份验证绕过：在进行身份验证或访问控制时，整数溢出可能导致绕过验证的漏洞。攻击者可以构造特殊的输入，使溢出的整数值绕过了预期的验证逻辑，从而获得未经授权的访问权限。\r\n- 数据篡改：整数溢出可能导致数据篡改漏洞。攻击者可以通过使整数溢出，修改计数器、索引或其他控制数据的值，导致程序在处理数据时发生错误或执行意外的操作。", "title": "整数溢出或环绕常见的攻击方式"}, {"content": "- 输入验证与限制：对用户输入的整数进行合理的验证和限制，确保其在允许的范围内。\r\n- 使用安全的整数操作函数：使用安全的整数操作函数，如`add_with_overflow()`、`sub_with_overflow()`、`mul_with_overflow()`等，这些函数会检查并处理溢出情况，确保计算结果在安全范围内。\r\n- 类型检查和转换：在进行整数运算或操作之前，进行类型检查和转换，确保操作数的类型和范围是合适的。\r\n- 强制性编码标准和最佳实践：制定强制性的编码标准和最佳实践，包括对整数运算和操作的规范和限制，以帮助程序员编写更可靠、安全的代码。\r\n- 静态代码分析和测试：使用静态代码分析工具和测试技术来检测和识别潜在的整数溢出问题。这些工具可以帮助发现代码中可能存在的溢出漏洞，并及时修复。", "title": "如何预防整数溢出或环绕"}], "cnvd_id": "", "cve_id": "CVE-2026-62439", "cvss": {"cvssv31": [{"source": "secalert@redhat.com", "vector": "CVSS:3.1/AV:L/AC:H/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7}]}, "cvss_score": 7, "cvss_vector": "CVSS:3.1/AV:L/AC:H/PR:N/UI:R/S:U/C:H/I:H/A:H", "cwe": "CWE-190", "description": "GIMP 中发现一个缺陷。在计算图像尺寸的内存缓冲区大小时，file-pvr 插件中会发生整数溢出。通过诱骗用户打开或预览特制的 PowerVR (.pvr) 文件，攻击者可以触发基于堆的缓冲区溢出，从而可能导致任意代码执行或通过应用程序崩溃导致拒绝服务 (DoS)。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "整数溢出或环绕", "kind_en": "整数溢出或环绕", "last_modified_time": "2026-10-17", "level": "High", "mps_id": "MPS-vlzf-p27c", "poc": false, "poc_url": [], "published_time": "2026-10-17", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-vlzf-p27c", "name": "https://www.oscs1024.com/hd/MPS-vlzf-p27c"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-62439", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-62439"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-62439", "name": ""}, {"url": "https://bugzilla.redhat.com/show_bug.cgi?id=2554464", "name": "RHBZ#2554464"}, {"url": "https://gitlab.gnome.org/GNOME/gimp/-/issues/16314", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-62439漏洞", "_translated": true, "_saved_at": "2026-10-17T00:57:50+00:00", "_first_saved_at": "2026-10-17T00:57:50+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-vlzf-p27c"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-111923", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": 重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-109701", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:L", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:L", "cwe": "CWE-79", "description": "PAYCOMET for WooCommerce paytpv-for-woocommerce 中的网页生成期间输入不当中和（“跨站点脚本”）漏洞允许反射型 XSS。此问题影响 WooCommerce 的 PAYCOMET：从不适用到 5.45。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-10-18", "level": "High", "mps_id": "MPS-deiz-sut6", "poc": false, "poc_url": [], "published_time": "2026-10-18", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-deiz-sut6", "name": "https://www.oscs1024.com/hd/MPS-deiz-sut6"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-109701", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-109701"}, {"url": "https://patchstack.com/database/wordpress/plugin/paytpv-for-woocommerce/vulnerability/wordpress-paycomet-for-woocommerce-plugin-5-45-cross-site-scripting-xss-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-109701漏洞", "_translated": true, "_saved_at": "2026-10-17T18:59:11+00:00", "_first_saved_at": "2026-10-17T18:59:11+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-deiz-sut6"}]}</script>
  <script>
    const payload = JSON.parse(document.getElementById("payload").textContent);
    const levelLabels = payload.level_labels || {};
    const items = payload.items || [];
    let filtered = items.slice();
    let activeId = null;

    const $ = (id) => document.getElementById(id);
    $("generatedAt").textContent = payload.generated_at || "-";
    $("retention").textContent = payload.retention_days ?? "-";
    $("cutoff").textContent = payload.cutoff_date || "-";
    $("count").textContent = String(payload.count ?? items.length);

    function levelClass(level) {
      const cn = levelLabels[level] || level || "";
      if (level === "Critical" || cn === "严重") return "crit";
      if (level === "High" || cn === "高危") return "high";
      return "other";
    }
    function levelText(level) {
      return levelLabels[level] || level || "-";
    }
    function esc(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }
    function scoreText(v) {
      if (v === null || v === undefined || v === "" || v === -1) return "-";
      return String(v);
    }

    function renderList() {
      const list = $("list");
      $("listCount").textContent = String(filtered.length);
      if (!filtered.length) {
        list.innerHTML = '<div class="empty">没有匹配项</div>';
        return;
      }
      list.innerHTML = filtered.map((it) => {
        const id = it.mps_id || it.cve_id;
        const active = id === activeId ? " active" : "";
        return `
          <button class="item${active}" data-id="${esc(id)}" type="button">
            <div class="item-top">
              <span class="cve">${esc(it.cve_id || it.mps_id || "-")}</span>
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
            </div>
            <div class="title">${esc(it.title || "-")}</div>
            <div class="item-foot">
              <span>CVSS ${esc(scoreText(it.cvss_score))}</span>
              <span>${esc(it.published_time || "-")}</span>
              ${it.poc ? "<span>POC</span>" : ""}
            </div>
          </button>`;
      }).join("");
      list.querySelectorAll(".item").forEach((btn) => {
        btn.addEventListener("click", () => selectById(btn.dataset.id));
      });
    }

    function refsHtml(it) {
      const refs = Array.isArray(it.reference_url_list) ? it.reference_url_list : [];
      const links = [];
      if (it._source_page) links.push({ url: it._source_page, name: "OSCS 详情" });
      if (it.cve_id) links.push({ url: `https://nvd.nist.gov/vuln/detail/${it.cve_id}`, name: "NVD" });
      refs.forEach((r) => {
        if (r && r.url) links.push({ url: r.url, name: r.name || r.url });
      });
      const seen = new Set();
      const uniq = [];
      for (const l of links) {
        if (seen.has(l.url)) continue;
        seen.add(l.url);
        uniq.push(l);
      }
      if (!uniq.length) return '<div class="box">无参考链接</div>';
      return `<div class="refs">${uniq.map((l) =>
        `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name || l.url)}</a>`
      ).join("")}</div>`;
    }

    function articlesHtml(it) {
      const arts = Array.isArray(it.articles) ? it.articles : [];
      if (!arts.length) return "";
      return `<div class="section"><h3>相关说明</h3>${arts.map((a) => `
        <div class="article">
          <h4>${esc(a.title || "说明")}</h4>
          <p>${esc(a.content || "")}</p>
        </div>`).join("")}</div>`;
    }

    function renderDetail(it) {
      const detail = $("detail");
      if (!it) {
        detail.innerHTML = '<div class="empty">暂无数据</div>';
        return;
      }
      const pocUrls = Array.isArray(it.poc_url) ? it.poc_url : [];
      detail.innerHTML = `
        <div class="d-head">
          <div>
            <h1 class="d-title">${esc(it.title || "-")}</h1>
            <div class="ids">
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
              <span class="chip">${esc(it.cve_id || "无 CVE")}</span>
              <span class="chip">${esc(it.mps_id || "-")}</span>
              ${it.poc ? '<span class="chip">有 POC</span>' : ""}
              ${it.exp ? '<span class="chip">有 EXP</span>' : ""}
            </div>
          </div>
          <div class="actions">
            ${it._source_page ? `<a class="btn" href="${esc(it._source_page)}" target="_blank" rel="noopener">OSCS</a>` : ""}
            ${it.cve_id ? `<a class="btn" href="https://nvd.nist.gov/vuln/detail/${esc(it.cve_id)}" target="_blank" rel="noopener">NVD</a>` : ""}
          </div>
        </div>
        <div class="grid">
          <div class="stat"><div class="k">CVSS</div><div class="v">${esc(scoreText(it.cvss_score))}</div></div>
          <div class="stat"><div class="k">向量</div><div class="v">${esc(it.cvss_vector || "-")}</div></div>
          <div class="stat"><div class="k">CWE</div><div class="v">${esc(it.cwe || "-")}</div></div>
          <div class="stat"><div class="k">类型</div><div class="v">${esc(it.kind || it.kind_en || "-")}</div></div>
          <div class="stat"><div class="k">公开</div><div class="v">${esc(it.published_time || "-")}</div></div>
          <div class="stat"><div class="k">利用成本</div><div class="v">${esc(it.exploit_requirement_cost || "-")}</div></div>
          <div class="stat"><div class="k">可利用性</div><div class="v">${esc(it.exploitability || "-")}</div></div>
          <div class="stat"><div class="k">修复建议</div><div class="v">${esc(it.fix_suggestion || "-")}</div></div>
        </div>
        <div class="section"><h3>描述</h3><div class="box">${esc(it.description || "无描述")}</div></div>
        ${it.scope_influence ? `<div class="section"><h3>影响范围</h3><div class="box">${esc(it.scope_influence)}</div></div>` : ""}
        ${pocUrls.length ? `<div class="section"><h3>POC 链接</h3><div class="refs">${pocUrls.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join("")}</div></div>` : ""}
        <div class="section"><h3>参考链接</h3>${refsHtml(it)}</div>
        ${articlesHtml(it)}
      `;
    }

    function selectById(id) {
      const it = filtered.find((x) => (x.mps_id || x.cve_id) === id) ||
                 items.find((x) => (x.mps_id || x.cve_id) === id);
      if (!it) return;
      activeId = it.mps_id || it.cve_id;
      renderList();
      renderDetail(it);
      const btn = document.querySelector(`.item[data-id="${CSS.escape(activeId)}"]`);
      if (btn) btn.scrollIntoView({ block: "nearest" });
      history.replaceState(null, "", "#" + encodeURIComponent(activeId));
    }

    function applyFilter(q) {
      const query = (q || "").trim().toLowerCase();
      filtered = !query ? items.slice() : items.filter((it) => {
        const blob = [
          it.cve_id, it.mps_id, it.title, it.kind, it.kind_en, it.cwe, it.description, it.level
        ].map((x) => String(x || "").toLowerCase()).join(" ");
        return blob.includes(query);
      });
      renderList();
      if (filtered.length) {
        const still = filtered.some((x) => (x.mps_id || x.cve_id) === activeId);
        selectById(still ? activeId : (filtered[0].mps_id || filtered[0].cve_id));
      } else {
        activeId = null;
        renderDetail(null);
      }
    }

    $("search").addEventListener("input", (e) => applyFilter(e.target.value));

    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement !== $("search")) {
        e.preventDefault();
        $("search").focus();
        return;
      }
      if (!filtered.length) return;
      const idx = filtered.findIndex((x) => (x.mps_id || x.cve_id) === activeId);
      if (e.key === "ArrowDown") {
        e.preventDefault();
        const next = filtered[Math.min(filtered.length - 1, Math.max(0, idx) + 1)];
        selectById(next.mps_id || next.cve_id);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        const prev = filtered[Math.max(0, idx - 1)];
        selectById(prev.mps_id || prev.cve_id);
      }
    });

    const hashId = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    if (hashId && items.some((x) => (x.mps_id || x.cve_id) === hashId)) {
      activeId = hashId;
      renderList();
      selectById(hashId);
    } else if (items.length) {
      selectById(items[0].mps_id || items[0].cve_id);
    } else {
      renderList();
      renderDetail(null);
    }
  </script>
</body>
</html>
