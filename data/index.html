n- 代码审查和漏洞扫描：程序应该进行代码审查和漏洞扫描，以发现和修复潜在的安全漏洞。\n", "title": "如何预防反序列化"}], "cnvd_id": "", "cve_id": "CVE-2026-71513", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}, {"source": "murphysec", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-502", "description": "NLTK 是开源 Python 自然语言处理工具库，提供分词、句法分析、语料加载等能力，其中转移句法分析器会从 pickle 模型文件还原 scikit-learn 分类器。\n受影响版本中，AllowlistUnpickler.find_class 只按模块字符串是否属于 allowed_modules 前缀白名单决定是否还原全局对象，不检查全局名。pickle 协议 4 及以上会把带点号的 name 通过 getattr 链式解析。TransitionParser.parse 对调用方提供的 modelFile 调用 allowlisted_pickle_load，并把 numpy、scipy、sklearn 整棵模块树列入白名单。攻击者可提供不可信模型，使加载过程还原 sklearn.os.system 等白名单外可调用对象，从而执行任意命令。\n修复版本中通过在 find_class 中拒绝带点号的 name，阻止属性穿越到达 os.system，使恶意转移句法分析模型无法再沿该路径执行命令。", "effects": [{"comp_name": "nltk", "ecosystem": "pip", "versions": [{"affected_version": "[3.10.0,3.10.3)", "min_fixed_version": "3.10.3", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "反序列化", "kind_en": "不可信数据的反序列化", "last_modified_time": "2026-08-24", "level": "High", "mps_id": "MPS-84wv-10no", "poc": true, "poc_url": [], "published_time": "2026-08-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-84wv-10no", "name": "https://www.oscs1024.com/hd/MPS-84wv-10no"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-71513", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-71513"}, {"url": "https://github.com/nltk/nltk", "name": ""}, {"url": "https://github.com/nltk/nltk/blob/v3.10.2/nltk/picklesec.py#L119-L124", "name": ""}, {"url": "https://github.com/nltk/nltk/commit/c3e37113742a1ebeeb4f2ca58941f320f98805ea", "name": ""}, {"url": "https://www.vulncheck.com/advisories/nltk-through-remote-code-execution-via-allowlistunpickler-dotted-name-bypass", "name": ""}], "scope_influence": "广", "tags": ["python", "专家校准", "开源"], "title": "NLTK模型加载远程代码执行漏洞", "_translated": true, "_saved_at": "2026-08-24T03:49:27+00:00", "_first_saved_at": "2026-08-22T15:14:24+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-84wv-10no"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-78380", "cvss": {"cvssv4": [{"source": "5a6e4751-2f3f-4070-9419-94fb35b644e8", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-862", "description": "RansomLook fails to enforce the privacy status of ransomware groups and markets when distributing newly collected victim posts to external notification channels. The post-processing logic checks whether an individual post is marked private but does not verify whether the group or market to which the post belongs is configured as private.\n\nAs a result, newly parsed victim information associated with a private group or market may be automatically published through enabled Rocket.Chat, Mastodon, Bluesky, and e-mail notification channels despite the entity being explicitly configured to prevent public disclosure.\n\nA similar issue affects the public MISP feed. The feed previously determined privacy using groupinfo(), which only queries the group database. Consequently, victim information associated with private markets could be added to the public MISP feed because the corresponding market privacy flag was not evaluated.\n\nAn attacker or other unauthorized party able to access these public notification channels or the MISP feed may obtain victim information that was intended to remain private. Depending on the collected data, this may disclose victim names, ransomware activity, incident information, or other information associated with privately monitored groups and markets.\n\nThe fix introduces a common is_private_entity() check covering both groups and markets and prevents private entity posts from being distributed through external notification channels or the public MISP feed. Internal storage and dashboard alerting remain unaffected.", "effects": [] 据、个人身份信息、敏感业务数据、系统配置信息等。信息暴露漏洞通常是由于设计、实施或配置错误引起的，例如不正确的访问控制、弱密码策略、缺乏加密、错误的日志处理等。", "title": "什么是未授权敏感信息泄露"}, {"content": "- 直接访问敏感信息：攻击者可以通过直接访问不正确配置或不受保护的资源来获取敏感信息，如通过公开可访问的URL、未经授权的文件目录访问等。\n- 越权访问：攻击者可能利用访问控制错误或不正确的权限配置来获取他们没有权限访问的敏感信息。\n- 错误信息披露：应用程序在错误处理过程中可能泄露敏感信息，例如将错误消息中的敏感数据返回给客户端或显示在日志文件中。\n- 信息泄露通过响应：攻击者可能利用应用程序在响应中不正确地包含敏感信息，如通过网页源代码、响应头部或响应消息体中的敏感数据。", "title": "未授权敏感信息泄露常见的攻击方式"}, {"content": "- 访问控制：确保只有经过授权的用户能够访问敏感信息，使用强大的身份验证和授权机制。\n- 数据加密：对于敏感信息，使用适当的加密算法对数据进行加密，包括数据传输和存储过程中的加密。\n- 错误处理和日志安全：正确处理错误情况，避免在错误消息中暴露敏感信息。同时，确保日志记录功能的安全性，避免将敏感信息记录在日志文件中。\n- 安全配置和最佳实践：遵循安全最佳实践，对应用程序、服务器和系统进行适当的配置，包括访问控制、权限管理、密码策略等。\n- 审计和监控：实施日志审计和监控机制，及时检测和响应任何异常活动或潜在的信息暴露事件。\n- 安全开发实践：在应用程序开发过程中，进行安全代码审查、漏洞扫描和安全测试，以及敏感信息的正确处理和保护。", "title": "如何预防未授权敏感信息泄露"}], "cnvd_id": "", "cve_id": "CVE-2026-78386", "cvss": {"cvssv4": [{"source": "5a6e4751-2f3f-4070-9419-94fb35b644e8", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-200", "description": "RansomLook exposed sensitive operator-side scraping configuration through multiple unauthenticated API responses. Location records associated with ransomware groups and markets were returned largely verbatim to unauthenticated callers whenever the location itself was not marked as private.\n\n\nThese records could contain internal fields such as header, which may include authentication headers, session cookies, or other credentials used to access monitored websites; init_script, which may contain logic used to bypass CAPTCHA, anti-bot protections, or paywalls; and browser, which discloses details about the scraping environment.\n\n\nAn unauthenticated remote attacker could query the affected API endpoints and obtain these values. Leaked authentication material could potentially be replayed against the monitored service, while disclosure of scraping and bypass logic could allow site operators or other attackers to identify and defeat RansomLook's collection mechanisms.\n\n\nThe patch introduces an explicit allowlist of fields permitted in public location records and strips all operator-side fields before returning data to unauthenticated users.\n\n\nThe accompanying change from \u003cstring:postname\u003e to \u003cpath:postname\u003e appears to be a functional correction allowing legitimate post titles containing / and does not, based on this patch alone, represent the security issue.", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "未授权敏感信息泄露", "kind_en": "向未经授权的行为者泄露敏感信息", "last_modified_time": "2026-08-24", "level": "High", "mps_id": "MPS-k3ia-4yme", "poc": false, "poc_url": [], "published_time": "2026-08-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-k3ia-4yme", "name": "https://www.oscs1024.com/hd/MPS-k3ia-4yme"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-78386", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-78386"}, {"url": "https://github.com/RansomLook/RansomLook/commit/cc9182930306ff36c7b3424817d49f18df3c85d1", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-78386漏洞", "_translated": true, "_saved_at": "2026-08-26T04:34:02+00:00", "_first_saved_at": "2026-08-24T14:35:30+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-k3ia-4yme"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-78208", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "high", "base_score": 7.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "v 表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-10053", "cvss": {"cvssv31": [{"source": "cve@gitlab.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "high", "base_score": 8.5}, {"source": "murphysec", "vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "high", "base_score": 8.5}]}, "cvss_score": 8.5, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:C/C:H/I:H/A:H", "cwe": "CWE-22", "description": "GitLab 是开源 DevOps 平台，社区版和企业版都内置软件包注册表，用来托管 npm 等格式的软件包。\n受影响版本中，对项目拥有 Developer 及以上权限的已认证用户，可以向 npm 发布接口提交 JSON。请求体里的 name 缺少有效约束，后台会把它拼成「name-版本.tgz」当作落盘文件名。GitlabUploader 只在文件进入缓存前检查路径穿越，此时文件名仍是安全值；临时包在后台真正写入磁盘时，文件名已经换成带「../」的路径，检查不再进行。攻击者能以 git 系统用户身份，向其可写目录写入任意内容，直接危害是任意文件写入。远程代码执行还要同时满足这些条件：落盘名称固定带「-语义化版本.tgz」后缀、权限为 0644，无法覆盖 authorized_keys 等固定文件名；写入位置随后必须被当成脚本执行或加载，并且不依赖原始文件名（例如仓库 custom_hooks 目录会执行其中任意文件）；该文件还需要带可执行权限，或再结合其他改权限、加载该文件的能力。默认安装下，仅这次写入通常不足以独立完成代码执行。\n修复版本中通过在 GitlabUploader 落地写入前再次检查 filename、cache_dir、work_dir 和 store_dir，拦截含「../」的路径并抛出 PathTraversalAttackError，文件无法写出。", "effects": [{"comp_name": "gitlab", "ecosystem": "linux", "versions": [{"affected_version": "[18.8,19.0.6)", "min_fixed_version": "19.0.6", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[19.1,19.1.4)", "min_fixed_version": "19.1.4", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[19.2,19.2.2)", "min  CRLF injection vulnerability that allows remote attackers to inject arbitrary HTTP headers and response body content by embedding unsanitized carriage return and line feed sequences in the rt URL parameter and access_token cookie, which are reflected into Set-Cookie response headers. Attackers can craft malicious requests to induce authenticated users to execute arbitrary JavaScript in their browser context, enabling session token theft and account credential modification.", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "HTTP响应分割", "kind_en": "Improper Neutralization of CRLF Sequences in HTTP Headers ('HTTP Request/Response Splitting')", "last_modified_time": "2026-08-24", "level": "High", "mps_id": "MPS-3vem-ciso", "poc": false, "poc_url": [], "published_time": "2026-08-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-3vem-ciso", "name": "https://www.oscs1024.com/hd/MPS-3vem-ciso"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-39915", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-39915"}, {"url": "https://tim-doc.atlassian.net/wiki/spaces/eng/pages/230981636/Release+Notes", "name": ""}, {"url": "https://www.vulncheck.com/advisories/tim-flow-crlf-injection-via-rt-parameter-and-access-token-cookie", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-39915漏洞", "_translated": true, "_saved_at": "2026-08-26T04:34:02+00:00", "_first_saved_at": "2026-08-24T15:33:33+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-3vem-ciso"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-59561", "cvss": {"cvssv3": [{"source": "vultures@jpcert.or.jp", "vector": "CVSS:3.0/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}], "cvssv4": [{"source": "vultures@jpcert.or.jp", "vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:N/UI:A/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.4}]}, "cvss_score": 8.4, "cvss_vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:N/UI:A/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-78", "description": "Sakura Editor（樱花编辑器）是 Sakura Editor Development Community 维护的开源 Windows 文本编辑器，用于日常文本编辑，并提供从当前文件目录打开 PowerShell 等终端功能。\n受影响版本中，CViewCommander::Command_OPEN_POWERSHELL 将当前编辑文件所在目录路径 strFolder 直接嵌入 powershell.exe 的 -Command 参数，构造 Set-Location -Path '%s'。目录名中的单引号会提前结束该字符串，使后续内容作为 PowerShell 命令执行。用户若打开恶意构造目录中的文件并选择「打开 PowerShell」或「以管理员身份打开 PowerShell」，攻击者可以在用户主机上执行任意操作系统命令。\n修复版本中通过在拼接 -Command 前将目录路径中的单引号替换为 ''，使路径始终作为 PowerShell 单引号字符串的内容处理，阻断目录名注入命令。", "effects": [{"comp_name": "sakura_editor", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.4.3)", "min_fixed_version": "2.4.3", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", filtrating data or performing other malicious actions.", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "CSV 文件中的公式元素中和不当", "kind_en": "Improper Neutralization of Formula Elements in a CSV File", "last_modified_time": "2026-08-24", "level": "High", "mps_id": "MPS-9ozb-4pr6", "poc": false, "poc_url": [], "published_time": "2026-08-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-9ozb-4pr6", "name": "https://www.oscs1024.com/hd/MPS-9ozb-4pr6"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-78209", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-78209"}, {"url": "https://github.com/exceljs/exceljs", "name": ""}, {"url": "https://github.com/exceljs/exceljs/blob/v4.4.0/lib/csv/csv.js#L109-L182", "name": ""}, {"url": "https://github.com/mateocallec/exceljs-hardened/security/advisories/GHSA-9wxc-4rhw-hfrw", "name": ""}, {"url": "https://www.vulncheck.com/advisories/exceljs-through-csv-formula-injection-via-unescaped-cell-values", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-78209漏洞", "_translated": true, "_saved_at": "2026-08-26T04:34:02+00:00", "_first_saved_at": "2026-08-24T02:20:39+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-9ozb-4pr6"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-78385", "cvss": {"cvssv4": [{"source": "5a6e4751-2f3f-4070-9419-94fb35b644e8", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:N/VA:N/SC:H/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.2}]}, "cvss_score": 8.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:N/VA:N/SC:H/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-918", "description": "RansomLook contains insufficient resource validation in the analysis PDF generation functionality. Analysis documents are converted from Markdown to HTML and passed to WeasyPrint for PDF rendering. Prior to the fix, WeasyPrint used its default URL fetcher, allowing resource references contained in an analysis to be resolved without restrictions.\n\nAn authenticated attacker able to create or modify an analysis could embed crafted resource references using schemes such as file:// or http://. When the analysis was subsequently rendered as PDF, WeasyPrint would process these references with the privileges and network access of the RansomLook server.\n\nA malicious file:// reference could cause the renderer to access arbitrary files readable by the RansomLook process, potentially exposing sensitive configuration, credentials, or other local data through rendered resources. Network URLs could cause the server to initiate requests to localhost, internal network services, or external systems, resulting in server-side request forgery (SSRF) and potentially bypassing network-level access restrictions.\n\nThe patch introduces a dedicated WeasyPrint URL fetcher that permits only data: resources, the RansomLook report logo, and files contained within the analysis asset directory. Network resources and filesystem paths outside these explicitly permitted locations are rejected.", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "SSRF", "kind_en": "服务器端请求伪造 (SSRF)", "last_modified_time": "2026-08-24", "level": "High", "mps_id": "MPS-lpqy-37gs", "poc": false, "poc_url": [], "published_time": "2026-08-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-lpqy-37gs", "name": "https://www.oscs1024.com/hd/MPS-lpqy-37gs"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-78385", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-78385"}, {"url": "https://github.com/RansomLook/RansomLook/commit/34dc0285583dae483b4d48c8e98fff942b755f5f", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-78385漏洞", "_translated": true, "_saved_at": "2026-08-26T04:34:02+00:00", "_first_saved_at": "2026-08-24T14:36:06+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-lpqy-37gs"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-78381", "cvss": {"cvssv4": [{"source": "5a6e4751-2f3f-4070-9419-94fb35b644e8", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:N/VA:N/SC:H/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.2}]}, "cvss_score": 8.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:N/VA:N/SC:H/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-22", "description": "RansomLook contains a path traversal vulnerability in the handling of the screen field associated with group posts. The GroupPost.get API handler concatenates the database-controlled screen value directly with the application's source/ directory and opens the resulting path without verifying that the resolved file remains within the intended directory.\n\nBecause the screen field is free-form and can be populated either through the administrative post editor or through data imported from a remote RansomLook instance, a malicious upstream instance can provide traversal sequences such as ../config/generic.json. When the affected post is subsequently retrieved through the API, RansomLook resolves and reads the attacker-controlled path and returns the contents of the referenced file Base64-encoded in the API response.\n\nThis can allow an attacker (being admin) controlling imported post data to read arbitrary files accessible to the RansomLook process, potentially exposing sensitive configuration data, API credentials, password hashes, or other application secrets. The attack does not require the malicious upstream to possess an account on the affected RansomLook instance.\n\nThe vulnerability is addressed by resolving screen paths with os.path.realpath() and verifying that the resolved path remains beneath the application's source/ directory. Validation is performed both when values are written and immediately before files are read. Using canonical paths also prevents traversal through symbolic links that would bypass purely lexical path normalization checks.", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-08-24", "level": "High", "mps_id": "MPS-voab-7tie", "poc": false, "poc_url": [], "published_time": "2026-08-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-voab-7tie", "name": "https://www.oscs1024.com/hd/MPS-voab-7tie"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-78381", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-78381"}, {"url": "https://github.com/RansomLook/RansomLook/commit/274faccf65898e88ef54f35f304e0821a852a0b8", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-78381漏洞", "_translated": true, "_saved_at": "2026-08-26T04:34:02+00:00", "_first_saved_at": "2026-08-24T14:36:04+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-voab-7tie"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "", "cvss": {}, "cvss_score": 8, "cvss_vector": "", "cwe": "CWE-829", "description": "NocoBase 是开源的无代码/低代码后端框架，前端为 npm 包 @nocobase/server 及若干插件，其中 file-manager 插件提供本地文件存储与附件上传能力，插件管理器负责加载第三方扩展。\n受影响版本中，file-manager 插件的 storages:update 端点接受任意 documentRoot 字段而不做白名单校验，存储层 getDocumentRoot 直接以该值解析为绝对路径并作为 resolveSafePath 的根；攻击者拥有管理员凭据后，可把 documentRoot 改写到 Web 根或应用目录，再通过 attachments:upload 写入任意扩展名的文件。同时，pm:enable 端点把 ctx.action.params.filterByTk 原样传入 requireModule，最终对任意绝对路径执行 require()，对非 JS 文件抛出嵌入文件内容的 SyntaxError，对 JS 文件则直接执行。这两个缺陷串成完整链路，使持有管理员 Token 的攻击者能在服务器进程内运行任意 Node.js 代码，实现远程代码执行。\n修复版本中通过在插件启用路径上调用 assertSafePluginPackageName 拒绝含路径分隔符或 .. 的输入，并在 file-manager 插件新增存储路径校验中间件强制 documentRoot 落在白名单目录内，阻断恶意路径进入本地存储解析和 require 调用，从而切断该链式利用。", "effects": [{"comp_name": "@nocobase/server", "ecosystem": "npm", "versions": [{"affected_version": "(-∞,2.1.5)", "min_fixed_version": "2.1.5", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "从非可信控制范围包含功能例程", "kind_en": "包含来自不可信控制领域的功能", "last_modified_time": "2026-08-24", "level": "High", "mps_id": "MPS-fd72-0d1d", "poc": false, "poc_url": [], "published_time": "2026-08-24", "reference_url_list": [{"url": "https://github.com/advisories/GHSA-ghvf-qf6h-g8x5", "name": ""}, {"url": "https://github.com/nocobase/nocobase/security/advisories/GHSA-ghvf-qf6h-g8x5", "name": ""}, {"url": "https://github.com/nocobase/nocobase/pull/9628", "name": ""}, {"url": "https://github.com/nocobase/nocobase/pull/9701", "name": ""}, {"url": "https://github.com/nocobase/nocobase/commit/a89e5a999b608bcb4ec67a845e924af0fb58a7c7", "name": ""}, {"url": "https://github.com/nocobase/nocobase/commit/7c9ffe1427a529d62576b83c35222ba7ef9b8d11", "name": ""}, {"url": "https://api.github.com/advisories/GHSA-ghvf-qf6h-g8x5", "name": ""}], "scope_influence": "", "tags": ["npm", "开源"], "title": "NocoBase任意文件写入与本地文件包含链式远程代码执行漏洞", "_translated": true, "_saved_at": "2026-08-24T09:40:13+00:00", "_first_saved_at": "2026-08-24T09:40:13+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-fd72-0d1d"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-78414", "cvss": {"cvssv31": [{"source": "96d4e157-0bf0-48b3-8efd-382c68caf4e0", "vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8}]}, "cvss_score": 8, "cvss_vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "cwe": "CWE-79", "description": "Nx Witness VMS 是 Network Optix 出品的商业视频管理软件，提供 Web 管理界面用于站点运维和多站点合并。\n受影响版本中，攻击者若在同一网段控制一台 Nx 服务器，可将该服务器的站点名称设置为脚本载荷。已认证管理员打开“Merge with Another Site”对话框并展示站点选择列表时，载荷会在管理员浏览器中执行任意 JavaScript，窃取会话令牌并接管管理员账户。\n修复版本中通过官方安全更新修复 Web 管理界面“Merge Sites”对话框中的跨站脚本问题，阻止恶意站点名称再进入脚本执行路径。", "effects": [{"comp_name": "nx_witness_vms", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,6.1.3)", "min_fixed_version": "6.1.3", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-08-24", "level": "High", "mps_id": "MPS-pvh9-yq0w", "poc": false, "poc_url": [], "published_time": "2026-08-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-pvh9-yq0w", "name": "https://www.oscs1024.com/hd/MPS-pvh9-yq0w"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-78414", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-78414"}, {"url": "https://support.networkoptix.com/hc/en-us/articles/42950508518679-Security-Advisory-Cross-Site-Scripting-XSS-in-Merge-with-Another-Site-Dropdown", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Nx Witness站点合并XSS", "_translated": true, "_saved_at": "2026-08-24T16:29:38+00:00", "_first_saved_at": "2026-08-24T15:33:17+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-pvh9-yq0w"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-78270", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:C/C:H/I:N/A:L", "severity": "high", "base_score": 7.6}]}, "cvss_score": 7.6, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:C/C:H/I:N/A:L", "cwe": "CWE-89", "description": "Author SQL Injection in FluentCRM Pro \u003c= 3.1.12 versions.", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-08-24", "level": "High", "mps_id": "MPS-z6f5-xsyk", "poc": false, "poc_url": [], "published_time": "2026-08-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-z6f5-xsyk", "name": "https://www.oscs1024.com/hd/MPS-z6f5-xsyk"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-78270", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-78270"}, {"url": "https://patchstack.com/database/wordpress/plugin/fluentcampaign-pro/vulnerability/wordpress-fluentcrm-pro-plugin-3-1-12-sql-injection-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-78270漏洞", "_translated": true, "_saved_at": "2026-08-26T04:34:02+00:00", "_first_saved_at": "2026-08-24T12:37:03+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-z6f5-xsyk"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-76055", "cvss": {"cvssv4": [{"source": "disclosure@synopsys.com", "vector": "CVSS:4.0/AV:L/AC:L/AT:P/PR:N/UI:N/VC:H/VI:H/VA:L/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:4.0/AV:L/AC:L/AT:P/PR:N/UI:N/VC:H/VI:H/VA:L/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-78", "description": "blackduck-c-cpp 是 Black Duck 发布的 Python 扫描工具，以专有许可通过 PyPI 分发，用于结合 Coverity 构建捕获为 C/C++ 项目生成软件物料清单。\n受影响版本中，包管理器在遍历被扫描构建目录时，会把遇到的文件系统路径直接拼进 dpkg、rpm、ldd 等命令字符串，并通过 shell 执行且未做引号或转义处理。攻击者若能在该目录中创建含 shell 元字符的文件名，便可在扫描账户权限下执行操作系统命令，无需控制构建命令或工具配置。\n修复版本中通过将包管理器子进程改为 argv 列表并以 shell=False 方式调用，切断路径进入 shell 解释的链路，使文件名仅作为字面参数传递。", "effects": [{"comp_name": "blackduck-c-cpp", "ecosystem": "pip", "versions": [{"affected_version": "[0,3.0.7)", "min_fixed_version": "3.0.7", "repository": "pip", "solutions": [], "upstream": true}]}], "ep alizeIPv6 会跳过括号，并在遇到非法尾随文本时静默丢弃无效内容，把攻击者控制的畸形主机改写成另一个合法 IPv6 地址，且 parse 结果不设置 error。例如 normalize('http://[::not-valid]/private') 返回 http://[::]/private，Node HTTP 客户端会连到回环上的未指定地址；[fc00::not-hex] 与 [fe80::not-hex] 会折叠为唯一本地或链路本地地址。应用若先用 fast-uri 规范化不可信 URL，再据此发起出站请求或执行地址策略，可被导向本地或私网 IPv6 目标，形成服务端请求伪造与地址策略绕过。\n修复版本中通过重写 normalizeIPv6 并新增 normalizeIPv6Address，按完整 IPv6 文法校验括号 IP 字面量；index.js 的 parseWithStatus 在检测到畸形字面量时写入 URI host is malformed 错误，normalize 不再把畸形输入改写成合法地址，从而切断 SSRF 与策略绕过链路。", "effects": [{"comp_name": "fast-uri", "ecosystem": "npm", "versions": [{"affected_version": "[3.0.0,3.1.6)", "min_fixed_version": "3.1.6", "repository": "npm", "solutions": [], "upstream": true}, {"affected_version": "[4.0.0,4.1.3)", "min_fixed_version": "4.1.3", "repository": "npm", "solutions": [], "upstream": true}, {"affected_version": "[2.3.1,2.4.5)", "min_fixed_version": "2.4.5", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SSRF", "kind_en": "服务器端请求伪造 (SSRF)", "last_modified_time": "2026-08-24", "level": "High", "mps_id": "MPS-qwfg-kshe", "poc": false, "poc_url": [], "published_time": "2026-08-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-qwfg-kshe", "name": "https://www.oscs1024.com/hd/MPS-qwfg-kshe"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-75975", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-75975"}, {"url": "https://cna.openjsf.org/security-advisories.html", "name": ""}, {"url": "https://github.com/fastify/fast-uri/security/advisories/GHSA-f65p-4m7j-42xc", "name": ""}], "scope_influence": "", "tags": ["npm", "开源"], "title": "fast-uri畸形IPv6 SSRF", "_translated": true, "_saved_at": "2026-08-24T11:21:21+00:00", "_first_saved_at": "2026-08-24T10:31:33+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-qwfg-kshe"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-75931", "cvss": {"cvssv31": [{"source": "ce714d77-add3-4f53-aff5-83d477b104bb", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:H/A:N", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:H/A:N", "cwe": "CWE-436", "description": "fast-uri 是面向 Node.js 的开源 URI 解析库，提供 parse、resolve、normalize 与 equal 等公开接口，广泛用于 Fastify 生态中的 URI 处理。\n受影响版本中，parseWithStatus 仅在输入带有显式 scheme 且对应 schemeHandler.domainHost 为真时，才把 Unicode/IDN 主机规范为 ASCII。scheme-relative 引用在解析阶段没有 scheme，resolve() 在 resolveComponent 继承基 URI 的 http/https 后仍按原文序列化 host。应用若先提取 host 对照策略列表，再对同一引用调用 resolve，会对一个主机做出放行或拦截判断，而实际目的地是另一个主机，形成主机混淆与策略绕过。该问题是 CVE-2026-13676 的不完整修复变体。\n修复版本中通过抽出 canonicalizeHost，在 resolve() 已确定有效 scheme 后对 host 执行同样的 ASCII 规范化，转换失败则抛出错误并失败关闭，使 resolve 路径与后续再解析结果一致。", "effects": [{"comp_name": "fast-uri", "ecosystem": "npm", "versions": [{"affected_version": "[2.4.2,2.4.5)", "min_fixed_version": "2.4.5", "repository": "npm", "solutions": [], "upstream": true}, {"affected_version": "[3.1.3,3.1.6)", "min_fixed_version": "3.1.6", "repository": "npm", "solutions": [], "upstream": true}, {"affected_version": "[4.0.1,4.1.3)", "min_fixed_version": "4.1.3", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "解释冲突", "kind_en": "Interpretation Conflict", "last_modified_time": "2026-08-24", "level": "High", "mps_id": "MPS-w3r5-jnik", "poc": false, "poc_url": [], "published_time": "2026-08-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-w3r5-jnik", "name": "https://www.oscs1024.com/hd/MPS-w3r5-jnik"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-75931", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-75931"}, {"url": "https://cna.openjsf.org/security-advisories.html", "name": ""}, {"url": "https://github.com/fastify/fast-uri/security/advisories/GHSA-5jgf-p345-68v8", "name": ""}], "scope_influence": "", "tags": ["npm", "开源"], "title": "fast-uri主机混淆漏洞", "_translated": true, "_saved_at": "2026-08-24T11:21:26+00:00", "_first_saved_at": "2026-08-24T10:31:31+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-w3r5-jnik"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过构造恶意的数据，将过多的数据输入到程序的缓冲区中，使得缓冲区的空间被填满，从而溢出到程序的栈 (stack) 或堆 (heap) 中，导致程序崩溃、拒绝服务、数据泄露等安全问题。\n", "title": "什么是经典缓冲区溢出"}, {"content": "| 类型        | 描述                                                         |\n| ----------- | ------------------------------------------------------------ |\n| 代码注入攻击      | 攻击者通过向程序的缓冲区输入恶意代码，从而控制程序执行流程，实现对程序操作的恶意操作。例如，攻击者可以通过向 Web 应用程序的输入框中输入恶意代码，从而执行任意的代码，破坏系统、窃取数据等。 |\n| 数据覆盖攻击      | 攻击者通过向程序的缓冲区输入过多的数据，从而覆盖程序中的重要数据或代码，实现对程序操作的恶意操作。例如，攻击者可以通过向聊天应用程序的输入框中输入过多的表情符号，从而覆盖程序中的重要数据，例如聊天消息、账号密码等。 |\n| 栈溢出攻击 | 攻击者通过向程序的栈中输入过多的数据，从而溢出到栈外部，实现对程序操作的恶意操作。例如，攻击者可以通过向游戏应用程序的输入框中输入过多的道具名称，从而覆盖程序中的重要数据，例如游戏数据、账号密码等。 |\n| 堆溢出攻击       | 攻击者通过向程序的堆中输入过多的数据，从而溢出到堆外部，实现对程序操作的恶意操作。例如，攻击者可以通过向操作系统工具的输入框中输入过多的命令，从而覆盖程序中的重要数据，例如系统文件、配置文件等。 |", "title": "经典缓冲区溢出常见的攻击方式"}, {"content": "- 输入验证：在程序输入处对输入数据进行严格的验证和过滤，确保输入数据符合预期的格式和类型，避免被攻击者注入恶意命令或数据。可以使用正则表达式、格式字符串等方式进行输入验证。\n- 输出过滤：在程序输出处对输出数据进行严格的过滤和检查，确保输出数据符合预期的格式和类型，避免被攻击者截获和篡改。可以使用安全的输出过滤库等方式进行输出过滤。\n- 使用安全的编程模型：使用安全的编程模型，例如避免使用原生的缓冲区管理函数，使用安全的框架和库来处理输入数据和执行命令，避免缓冲区溢出漏洞。\n- 数据库加密和访问控制：对于敏感数据和命令，使用加密和访问控制措施，确保只有授权用户可以访问和执行命令，避免被攻击者窃取和篡改。\n- 定期更新和升级：定期更新和升级应用程序和库的版本，确保应用程序和库的最新版本包含了最新的安全补丁和修复措施，避免安全漏洞的出现和利用。\n- 安全审计和监控：定期对系统和应用程序进行安全审计和监控，及时发现和阻止潜在的安全漏洞和攻击，确保系统和数据的安全和可靠性。", "title": "如何预防经典缓冲区溢出"}], "cnvd_id": "", "cve_id": "CVE-2026-78170", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:N/AC:L/Au:S/C:C/I:C/A:C", "severity": "high", "base_score": 9}], "cvssv31": [{"source": "cna@vuldb.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}], "cvssv4": [{"source": "cna@vuldb.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N Python 扫描工具，以 PyPI 包形式分发并采用专有许可，用于通过 Coverity Build Capture 包装 C/C++ 构建并生成软件组成分析物料清单。\n受影响版本中，当 API token 通过 BLACKDUCK_API_TOKEN 或 BD_HUB_TOKEN 环境变量传入时，RunBuildCapture.__init__ 读取 token 后未将其从进程环境中删除。工具随后在构建捕获与签名扫描阶段启动 cov-build、用户 build_cmd 以及签名扫描等子进程，这些子进程默认继承完整环境。能够在被扫描项目构建中执行代码的攻击者可通过 getenv 取得该 token；在文档所述扫描到新项目所需的最小权限下，该 token 可读取实例上的全部项目、物料清单与 code location，并创建、修改或删除项目、版本与 code location。\n修复版本中通过在读取 token 后立即删除 BLACKDUCK_API_TOKEN 与 BD_HUB_TOKEN，并将签名扫描子进程改为仅传递白名单环境变量，切断子进程继承 token 的路径。官方指出升级不能消除既有泄露，已通过环境变量向受影响版本提供过 token 的须轮换该 token。", "effects": [{"comp_name": "blackduck-c-cpp", "ecosystem": "pip", "versions": [{"affected_version": "[1.0.17,3.0.7)", "min_fixed_version": "3.0.7", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "通过处理环境导致的信息暴露", "kind_en": "Invocation of Process Using Visible Sensitive Information", "last_modified_time": "2026-08-24", "level": "High", "mps_id": "MPS-rlde-8im7", "poc": false, "poc_url": [], "published_time": "2026-08-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-rlde-8im7", "name": "https://www.oscs1024.com/hd/MPS-rlde-8im7"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-76054", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-76054"}, {"url": "https://community.blackduck.com/s/article/Black-Duck-Product-Security-Advisory-CVE-2026-76054-CVE-2026-76055", "name": ""}, {"url": "https://pypi.org/project/blackduck-c-cpp/", "name": ""}], "scope_influence": "", "tags": ["python", "开源"], "title": "blackduck-c-cpp令牌泄露", "_translated": true, "_saved_at": "2026-08-24T16:29:40+00:00", "_first_saved_at": "2026-08-24T15:33:28+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-rlde-8im7"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-39914", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:N", "severity": "medium", "base_score": 6.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-862", "description": "TIM Flow before 26.0.6 contains an improper authorization vulnerability that allows any authenticated user to submit arbitrary SQL queries to a privileged dashboard Excel export endpoint intended for administrative use only. Attackers can craft and submit unauthorized SQL queries to the export endpoint to retrieve sensitive database contents as a downloadable spreadsheet, bypassing role-based access controls.", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitabilit erate reports to disclose template contents including letterhead, boilerplate, and methodology text.", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "通过用户控制密钥绕过授权机制", "kind_en": "通过用户控制的密钥绕过授权", "last_modified_time": "2026-08-24", "level": "High", "mps_id": "MPS-wv4u-dz5o", "poc": false, "poc_url": [], "published_time": "2026-08-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-wv4u-dz5o", "name": "https://www.oscs1024.com/hd/MPS-wv4u-dz5o"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-78203", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-78203"}, {"url": "https://github.com/GhostManager/Ghostwriter", "name": ""}, {"url": "https://github.com/GhostManager/Ghostwriter/blob/v7.1.1/ghostwriter/reporting/views.py#L275-L315", "name": ""}, {"url": "https://github.com/GhostManager/Ghostwriter/commit/5b2a4a297e44c823c16f65b1ba101c742791cd0b", "name": ""}, {"url": "https://github.com/geo-chen/oss/blob/main/Ghostwriter.md", "name": ""}, {"url": "https://www.vulncheck.com/advisories/ghostwriter-before-cross-client-report-template-disclosure-via-unauthorized-template-swap", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-78203漏洞", "_translated": true, "_saved_at": "2026-08-26T04:34:02+00:00", "_first_saved_at": "2026-08-24T02:20:44+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-wv4u-dz5o"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-78197", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:N/AC:L/Au:N/C:P/I:P/A:P", "severity": "high", "base_score": 7.5}], "cvssv31": [{"source": "cna@vuldb.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:L/A:L", "severity": "high", "base_score": 7.3}], "cvssv4": [{"source": "cna@vuldb.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:L/VI:L/VA:L/SC:N/SI:N/SA:N/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "medium", "base_score": 5.5}]}, "cvss_score": 5.5, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:L/VI:L/VA:L/SC:N/SI:N/SA:N/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-89", "description": "SourceCodester Simple Online Food Ordering System 是开源 PHP/MySQL 在线点餐系统，提供前台菜单浏览、购物车下单以及后台用户与菜单管理。\n受影响版本中，后台脚本 /fos/admin/ajax.php 在 action=save_user 时不校验管理员会话，直接调用 Action::save_user；该方法用 extract($_POST) 取出 username，并以 username = '$username' 拼入 INSERT INTO users 或 UPDATE users 语句，远程攻击者可对 username 发起布尔或时间盲注，读写用户表及其他数据库内容。\n修复版本中通过将 username 改为预编译参数绑定并停止字符串拼接 SQL，切断该注入链；公开渠道尚未发布带版本号的官方修复包，部署方需自行对 save_user 做参数化查询，并限制 ajax.php 仅对已认证管理员开放。", "effects": [{"comp_name": "simple_online_food_ordering_system", "ecosystem": "linux", "versions": [{"affected_version": "[1.0,1.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-08-24", "level": "High", "mps_id": "MPS-rv49-u8ki", "poc": false, "poc_url": [], "published_time": "2026-08-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-rv49-u8ki", "name": "https://www.oscs1024.com/hd/MPS-rv49-u8ki"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-78197", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-78197"}, {"url": "https://github.com/wsx138/cve/issues/3", "name": ""}, {"url": "https://vuldb.com/cve/CVE-2026-78197", "name": ""}, {"url": "https://vuldb.com/submit/886034", "name": ""}, {"url": "https://vuldb.com/submit/886038", "name": ""}, {"url": "https://vuldb.com/vuln/394574", "name": ""}, {"url": "https://vuldb.com/vuln/394574/cti", "name": ""}, {"url": "https://www.sourcecodester.com/", "name": ""}], "scope_influence": "", "tags": [], "title": "在线点餐系统SQL注入", "_translated": true, "_saved_at": "2026-08-24T05:33:04+00:00", "_first_saved_at": "2026-08-24T05:33:04+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-rv49-u8ki"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-77143", "cvss": {"cvssv4": [{"source": "f4fb688c-4412-4426-b4b8-421ecf27b14a", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:L/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:L/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-862", "description": "pforum（TYPO3 扩展 Forum）是开源轻量论坛组件，用于在 TYPO3 站点中创建论坛、话题和帖子。\n受影响版本中，前端话题编辑接口 TopicController::updateAction 在服务端未校验请求访问者是否为该话题所有者。访客可从公开论坛列表读取话题标识，直接提交更新请求并覆盖他人话题内容。\n修复版本中通过 RestrictAccessEventListener 在 edit、update、delete、activate 动作分发前校验话题或帖子所有权，匿名模式改用 HMAC 签名令牌授权，阻止未授权覆盖。", "effects": [{"comp_name": "jweiland/pforum", "ecosystem": "composer", "versions": [{"affected_version": "(-∞,6.2.4)", "min_fixed_version": "6.2.4", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-08-25", "level": "High", "mps_id": "MPS-3vql-bmgu", "poc": false, "poc_url": [], "published_time": "2026-08-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-3vql-bmgu", "name": "https://www.oscs1024.com/hd/MPS-3vql-bmgu"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-77143", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-77143"}, {"url": "https://typo3.org/security/advisory/typo3-ext-sa-2026-021", "name": ""}], "scope_influence": "", "tags": ["php", "开源"], "title": "pforum话题越权漏洞", "_translated": true, "_saved_at": "2026-08-25T10:25:00+00:00", "_first_saved_at": "2026-08-25T10:25:00+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-3vql-bmgu"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2025-36940", "cvss": {}, "cvss_score": 8.8, "cvss_vector": "", "cwe": "CWE-416", "description": "Google Nest Hub（第二代）和 Nest Hub Max 是商用智能显示设备，运行基于开源 Fuchsia 的设备固件，其内核为 Zircon；pager proxy 用于在内核与用户态分页服务之间传递缺页请求。\n受影响版本中，Zircon 内核 pager proxy 存在释放后使用缺陷。已获得用户态执行能力的攻击者可触发该问题，将权限从用户态提升至应用处理器内核。\n修复版本中通过 2026 年 8 月 Nest 安全公告对应的固件更新修复 pager proxy 的释放后使用问题，切断从用户态提升至内核的路径。", "effects": [{"comp_name": "nest_hub", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,F30.1.1)", "min_fixed_version": "F30.1.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "nest_hub_max", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,F30.1.1)", "min_fixed_version": "F30.1.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "UAF", "kind_en": "免费后使用", "last_modified_time": "2026-08-25", "level": "High", "mps_id": "MPS-415s-j0mt", "poc": false, "poc_url": [], "published_time": "2026-08-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-415s-j0mt", "name": "https://www.oscs1024.com/hd/MPS-415s-j0mt"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2025-36940", "name": "https://nvd.nist.gov/vuln/detail/CVE-2025-36940"}, {"url": "https://support.google.com/product-documentation/answer/17072818?hl=en\u0026ref_topic=12974021\u0026sjid=10451061435205708316-NC", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Nest Hub内核UAF提权", "_translated": true, "_saved_at": "2026-08-24T18:30:52+00:00", "_first_saved_at": "2026-08-24T18:30:52+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-415s-j0mt"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-55541", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:L/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:L/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-862", "description": "PraisonAI 是开源多智能体协作框架，提供命令行工具与 HTTP 服务，用于编排和调用大模型智能体工作流。\n受影响版本中 品的商业 WordPress 插件，用于将 WooCommerce 商店与 Keap CRM 进行联系人、订单同步及自动化对接。\n受影响版本中，ajax_iwar_preview_email() 仅使用 is_admin() 作为授权判断，缺少能力校验。已认证的订阅者及以上用户可对任意邮箱地址渲染邮件预览合并字段，生成并获取任意 WordPress 用户（含管理员）的有效密码重置链接，完成账户接管。\n修复版本中通过官方对自动化配方工具的安全加固，阻止低权限用户再利用邮件预览接口获取任意账户的密码重置链接。", "effects": [{"comp_name": "InfusedWoo Pro", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,5.1.18)", "min_fixed_version": "5.1.18", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-08-25", "level": "High", "mps_id": "MPS-c7ba-e3hp", "poc": false, "poc_url": [], "published_time": "2026-08-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-c7ba-e3hp", "name": "https://www.oscs1024.com/hd/MPS-c7ba-e3hp"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-19892", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-19892"}, {"url": "https://downloads.infusedwoo.com/updater/iw5.php?changelog", "name": ""}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/207fc33b-ccf6-4c39-976d-41e6a89ad1ec?source=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "InfusedWoo权限提升漏洞", "_translated": true, "_saved_at": "2026-08-25T06:36:16+00:00", "_first_saved_at": "2026-08-25T05:26:01+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-c7ba-e3hp"}, {"analysis_status": 0, "articles": [{"content": "- 程序未正确处理用户上传的文件，从而导致程序可以读取、处理或存储未经授权的文件\n", "title": "什么是任意文件上传"}, {"content": "- 欺骗攻击：攻击者可以通过发送伪造的文件来欺骗程序，从而导致程序读取、处理或存储未经授权的文件。\n- 文件格式攻击：攻击者可以通过选择特定的文件格式，例如压缩文件或 ZIP 文件，从而利用上传的文件来篡改程序的执行结果或窃取程序中的重要数据。\n", "title": "任意文件上传常见的攻击方式"}, {"content": "- 使用安全文件传输协议 (FTP):使用安全 FTP 协议可以确保上传的文件格式、大小、权限等符合预期，同时可以防止文件读取、篡改或存储漏洞。\n- 使用文件上传过滤器：使用文件上传过滤器可以过滤上传的文件，以确保文件的格式、大小、权限等符合预期，同时可以防止文件读取、篡改或存储漏洞。\n- 使用白名单机制：使用白名单机制可以只允许特定的文件格式、大小、权限等存在的文件上传，从而防止非法文件的上传和攻击。\n- 定期更新和升级程序：定期更新和升级程序可以修复已知的漏洞，并增强程序的安全性。", "title": "如何预防任意文件上传"}], "cnvd_id": "", "cve_id": "CVE-2026-16601", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-434", "description": "CM Map Locations 是 CreativeMinds 发布的开源 WordPress 插件，用于在 Google 地图上展示、检索并管理多个地点，可作为门店定位与地点目录使用。\n受影响版本中，前台地点编辑页通过 wp_localize_script 将 cmloc-editor-media nonce 写入 CMLOC_Editor_Images 对象，已登录订阅者可以读取。攻击者向 admin-ajax.php 提交 action=cmloc_route_image_upload、该 nonce 以及 $_FILES 后，DashboardController::cmloc_route_image_upload 只校验 nonce，未检查 upload_files 能力，也未校验 MIME 与真实图片类型，并把文件交给 Attachment::uploadMedia。uploadMedia 把原始文件名拼入上传目录并调用 move_uploaded_file，攻击者可写入可执行文件并实现远程代码执行。\n修复版本中通过在 cmloc_route_image_upload 增加 current_user_can('upload_files') 校验，并用 wp_check_filetype_and_ext 与 getimagesize 将上传限制为 JPEG、PNG、GIF、WebP 图片，阻断订阅者上传可执行文件。", "effects": [{"comp_name": "cm-map-locations", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.1.9)", "min_fixed_version": "2.1.9", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "任意文件上传", "kind_en": "危险类型文件无限制上传", "last_modified_time": "2026-08-25", "level": "High", "mps_id": "MPS-ctxn-r731", "poc": false, "poc_url": [], "published_time": "2026-08-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ctxn-r731", "name": "https://www.oscs1024.com/hd/MPS-ctxn-r731"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-16601", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-16601"}, {"url": "https://plugins.trac.wordpress.org/browser/cm-map-locations/tags/2.1.8/controller/DashboardController.php#L105", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/cm-map-locations/tags/ 漏或无法释放的情况。\r\n- 资源监控与警报：应用程序应该实施适当的资源监控和警报机制，及时发现异常的资源消耗情况，并采取相应的措施来应对。\r\n- 压力测试与性能优化：应用程序应该进行压力测试，以评估其在高负载情况下的性能，并进行必要的性能优化，以确保能够有效地处理大量请求而不耗尽资源。", "title": "如何预防拒绝服务"}], "cnvd_id": "", "cve_id": "CVE-2026-78551", "cvss": {"cvssv4": [{"source": "5a6e4751-2f3f-4070-9419-94fb35b644e8", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:L/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:L/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-400", "description": "RansomLook 是开源勒索软件团伙与泄露站点追踪平台，用于采集、展示相关威胁情报并提供 Web 管理后台。\n受影响版本中，公开路由 /login 对应的 login() 在本地认证时先判断用户名是否位于 users_table，仅当用户名存在才调用 check_password_hash。不存在的用户名会更快返回，远程未认证攻击者可测量响应时差枚举有效账号。该接口同时未限制失败认证次数，攻击者可对已知账号进行口令猜测、字典或撞库攻击；有效账号的每次尝试都会执行密钥派生，高频请求可占满同步 Gunicorn worker 并造成拒绝服务。\n修复版本中通过在用户名不存在时仍对随机生成的占位口令哈希执行 check_password_hash，消除用户名相关时差，并按客户端 IP 在 Valkey/Redis 中限制失败次数，5 分钟内失败 5 次后封锁 1 小时。", "effects": [{"comp_name": "ransomlook", "ecosystem": "linux", "versions": [{"affected_version": "[0,2.0.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "拒绝服务", "kind_en": "不受控制的资源消耗", "last_modified_time": "2026-08-25", "level": "High", "mps_id": "MPS-ewqi-yz7k", "poc": false, "poc_url": [], "published_time": "2026-08-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ewqi-yz7k", "name": "https://www.oscs1024.com/hd/MPS-ewqi-yz7k"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-78551", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-78551"}, {"url": "https://github.com/RansomLook/RansomLook/commit/8602740347b0e928ad9fbaf5bc6ff242337dec6b", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "RansomLook登录爆破漏洞", "_translated": true, "_saved_at": "2026-08-24T21:22:29+00:00", "_first_saved_at": "2026-08-24T21:22:29+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ewqi-yz7k"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-49050", "cvss": {}, "cvss_score": 8.8, "cvss_vector": "", "cwe": "CWE-863", "description": "Apache DolphinScheduler 是开源分布式工作流调度平台，dolphinscheduler-api 模块对外提供 REST 接口，用于工作流编排以及用户与访问令牌管理。\n受影响版本中，AccessTokenController 的 POST /access-tokens 将请求参数 userId 传入 AccessTokenServiceImpl.createToken。createToken 在 canOperatorPermissions 通过后直接按该 userId 写入令牌，而 AccessTokenResourcePermissionCheck.permissionCheck 对任意用户恒返回 true，普通登录用户可为管理员或其他用户签发访问令牌。\n修复版本中通过 checkAccessTokenTargetUserIsLoginUserOrAdmin 限制非管理员只能为自己创建或更新令牌，并在更新路径用 checkAccessTokenOwnerIsLoginUserOrAdmin 校验既有令牌归属，阻止普通用户再签发或改派管理员令牌。", "effects": [{"comp_name": "org.apache.dolphinscheduler:dolphinscheduler-api", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,3.4.2)", "min_fixed_version": "3.4.2", "repository": "mav tor": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-915", "description": "Craft CMS 是开源内容管理系统，基于 PHP 与 Yii 构建网站及内容工作流，可通过 Composer 以 craftcms/cms 安装和更新。\n受影响版本中，控制面板元素搜索接口会读取请求体中的 condition 配置。ElementSearchController::actionSearch 先用 Component::cleanseConfig() 清除外层数组中以 as 或 on 开头的 Yii 行为与事件键，随后 Conditions::createCondition() 将仍为 JSON 字符串的 condition.config 解码并合并进配置，且不再调用 cleanseConfig()。解码后的 as/on 键会进入 ElementCondition::setFieldLayouts()，再由 Fields::createLayout() 通过 Craft::createObject() 实例化 FieldLayout，被 Yii 解释为行为或事件配置，使已登录控制面板的用户能够以 PHP/Web 进程身份执行操作系统命令。\n修复版本中通过在 Conditions::createCondition() 对 JSON 解码结果重新执行 Component::cleanseConfig()，并在 createConditionRule() 合并 type 配置前同样清洗，剥离藏在 JSON 中的 as/on 键，阻止解码后的配置再进入 Yii 行为或事件绑定路径。", "effects": [{"comp_name": "craftcms/cms", "ecosystem": "composer", "versions": [{"affected_version": "[5.0.0-RC1,5.10.6)", "min_fixed_version": "5.10.6", "repository": "composer", "solutions": [], "upstream": true}, {"affected_version": "[4.0.0-RC1,4.18.2)", "min_fixed_version": "4.18.2", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "动态确定对象属性修改的控制不恰当", "kind_en": "动态确定的对象属性的受控修改不当", "last_modified_time": "2026-08-25", "level": "High", "mps_id": "MPS-qsa0-xvw6", "poc": false, "poc_url": [], "published_time": "2026-08-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-qsa0-xvw6", "name": "https://www.oscs1024.com/hd/MPS-qsa0-xvw6"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-78416", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-78416"}, {"url": "https://github.com/craftcms/cms/releases/tag/5.10.6", "name": ""}, {"url": "https://www.hckrt.com/hacktivity/HCKRT-JD662P", "name": ""}], "scope_influence": "", "tags": ["php", "开源"], "title": "Craft CMS条件配置RCE", "_translated": true, "_saved_at": "2026-08-24T17:25:31+00:00", "_first_saved_at": "2026-08-24T17:25:31+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-qsa0-xvw6"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-9254", "cvss": {"cvssv4": [{"source": "f23511db-6c3e-4e32-a477-6aa17d310630", "vector": "CVSS:4.0/AV:A/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:L/SI:L/SA:L/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:A/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:L/SI:L/SA:L/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-78", "description": "TP-Link Archer BE800、Archer BE3600 和 Archer AX75 是商业家用无线路由器，用于提供家庭 Wi-Fi 接入、流量转发和家长控制等网络管理功能，固件未开源。\n受影响版本中，家长控制功能对部分参数中的特殊字符过滤和转义不充分，局域网内未认证攻击者可将命令注入载荷送入操作系统命令执行路径，并以 root 权限执行任意命令，造成设备被完全控制，同时影响设备及所承载网络流量的机密性、完整性和可用性。\n修复版本中通过厂商固件更新收紧家长控制相关参数的过滤与转义处理，阻断未认证局域网攻击者将特殊字符注入操作系统命令的路径。", "effects": [{"comp_name": "archer_ax75", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.1.6 Build 260716)", "min_fixed_version": "1.1.6 Build 260716", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "archer_be3600", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.2.6 Build 20260617)", "min_fixed_version": "1.2.6 Build 20260617", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "archer_be800", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.4.2 Build 260708)", "min_fixed_version": "1.4.2 Build 260708", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-08-25", "level": "High", "mps_id": "MPS-rpx9-sdoa", "poc": false, "poc_url": [], "published_time": "2026-08-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-rpx9-sdoa", "name": "https://www.oscs1024.com/hd/MPS-rpx9-sdoa"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-9254", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-9254"}, {"url": "https://www.tp-link.com/en/support/download/archer-ax75/v1/#Firmware", "name": ""}, {"url": "https://www.tp-link.com/en/support/download/archer-be3600/v1/#Firmware", "name": ""}, {"url": "https://www.tp-link.com/en/support/download/archer-be800/v1/#Firmware", "name": ""}, {"url": "https://www.tp-link.com/kr/support/download/archer-be3600/v1/#Firmware", "name": ""}, {"url": "https://www.tp-link.com/us/support/download/archer-ax75/v1/#Firmware", "name": ""}, {"url": "https://www.tp-link.com/us/support/download/a E:X/U:X", "cwe": "CWE-863", "description": "AzuraCast 是开源自托管网络电台管理套件，用于管理电台资料、媒体库，并生成 Liquidsoap 自动点播脚本。\n受影响版本中，PUT /api/station/{station_id}/profile/edit 仅要求 StationPermissions::Profile，却以 GROUP_GENERAL 反序列化 Station.backend_config。AbstractArrayEntity::fromArray() 会对所有公开属性赋值且不做字段级权限校验，使 custom_config_top、custom_config、custom_config_pre_playlists、custom_config_pre_live、custom_config_pre_fade、custom_config_bottom 可被写入。ConfigWriter::writeCustomConfigurationSection() 将这些值原样写入生成的 Liquidsoap .liq 脚本；攻击者可在其中使用 process.run() 或 process.exec()，由内置同步任务在 needs_restart 置位后自动重启后端并执行操作系统命令。\n修复版本中通过在 putProfileAction 中校验 StationPermissions::Broadcasting，对不具备该权限的请求删除 backend_config 内全部自定义配置字段，阻止资料编辑接口越权写入 Liquidsoap 脚本，切断代码注入执行链。", "effects": [{"comp_name": "azuracast/azuracast", "ecosystem": "composer", "versions": [{"affected_version": "(-∞,0.23.8)", "min_fixed_version": "0.23.8", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-08-25", "level": "High", "mps_id": "MPS-u0w2-asin", "poc": false, "poc_url": [], "published_time": "2026-08-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-u0w2-asin", "name": "https://www.oscs1024.com/hd/MPS-u0w2-asin"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-76836", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-76836"}, {"url": "https://github.com/AzuraCast/AzuraCast", "name": ""}, {"url": "https://github.com/AzuraCast/AzuraCast/blob/0.23.8/backend/src/Entity/Station.php", "name": ""}, {"url": "https://github.com/AzuraCast/AzuraCast/blob/0.23.8/backend/src/Radio/Backend/Liquidsoap/ConfigWriter.php", "name": ""}, {"url": "https://github.com/AzuraCast/AzuraCast/security/advisories/GHSA-q8wg-3qg7-8pc7", "name": ""}, {"url": "https://www.vulncheck.com/advisories/azuracast-through-liquidsoap-configuration-write-via-profile-edit-serialization-group-bypass", "name": ""}], "scope_influence": "", "tags": ["php", "开源"], "title": "AzuraCast越权代码注入", "_translated": true, "_saved_at": "2026-08-24T19:23:50+00:00", "_first_saved_at": "2026-08-24T19:23:50+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-u0w2-asin"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-78677", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "high", "base_score": 7.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-22", "description": "GitPython 是开源 Python 库，用于以编程方式克隆、读写和管理 Git 仓库。\n受影响版本中，公开接口 Repo.clone_from() 与 Repo.clone() 会把 keyword 参数和 multi_options 转 76-1.html", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "乐晴医事系统远程代码执行", "_translated": true, "_saved_at": "2026-08-25T05:26:02+00:00", "_first_saved_at": "2026-08-25T04:32:51+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-0vjg-x1a9"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-78284", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:N/I:N/A:H", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:N/I:N/A:H", "cwe": "CWE-22", "description": "MasterStudy LMS 是 StylemixThemes 以 GPLv2 发布的开源 WordPress 学习管理插件，用于创建、管理和销售在线课程。\n受影响版本中，WPCFTO_Settings::stm_regenerate_fonts 处理 AJAX 动作 wpcfto_regenerate_fonts 时，将权限条件写成 ! current_user_can( 'manage_options' ) \u0026\u0026 ! class_exists( 'WPCFTO_WebFont_Loader' )。WPCFTO_WebFont_Loader 随插件加载后始终存在，该判断无法拦截未授权请求；stm_wpcfto_nonces 还在前台 wp_head 输出该动作 nonce。攻击者可借 name 参数指定任意选项，把选项键拼接到字体目录路径后调用 WPCFTO_WebFont_Loader::deleteDirFiles 递归删除，删除目标不受字体目录边界约束，从而删除站点任意文件。\n修复版本中通过将权限判断改为必须具备 manage_options 且存在 WebFont 加载类，仅向具备管理权限的用户下发 wpcfto_regenerate_fonts nonce，强制 name 与当前 option_name 一致 注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-71943", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.2}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-78", "description": "DrayTek VigorSwitch 是商用以太网交换机产品系列，固件未开源，提供 Web 管理界面用于设备网络配置与运维。\n受影响版本中，Web 管理组件 mainfunction.cgi 的 setDevNet 函数在命令执行前未充分过滤 username 与 password 字段。远程攻击者在持有设备 Web 管理有效管理员凭证后，可通过构造恶意输入触发操作系统命令注入，并以 root 权限执行任意命令。\n修复版本中通过发布对应型号固件更新，消除 setDevNet 对 username 与 password 字段过滤不足导致的命令注入风险。", "effects": [{"comp_name": "VigorSwitch FX2120", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,3.9.10)", "min_fixed_version": "3.9.10", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "VigorSwitch G1280", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.9.10)", "min_fixed_version": "2.9.10", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "VigorSwitch G1282", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.9.10)", "min_fixed_version": "2.9.10", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "VigorSwitch G2100", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.9.10)", "min_fixed_version": "2.9.1
