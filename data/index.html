      min-height: 70vh;

      padding: 12px;
      background: transparent;
      color: inherit;

      margin-bottom: 14px;

t.gov/vuln/detail/CVE-2025-41769", "name": "https://nvd.nist.gov/vuln/detail/CVE-2025-41769"}, {"url": "https://phoenixcontact.csaf-tp.certvde.com/.well-known/csaf/white/2026/vde-2025-056.json", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2025-41769漏洞", "_translated": true, "_saved_at": "2026-08-12T12:54:56+00:00", "_first_saved_at": "2026-08-12T09:06:49+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-s4gt-j213"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-66659", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:N/A:L", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:N/A:L", "cwe": "CWE-89", "description": "Essekia Tablesome 表中 SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）漏洞允许盲 SQL 注入。\n\n此问题影响 Tablesome 表：从 n/a 到 1.2.9。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-08-12", "level": "Critical", "mps_id": "MPS-xov5-icaq", "poc": false, "poc_url": [], "published_time": "2026-08-12", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-xov5-icaq", "name": "https://www.oscs1024.com/hd/MPS-xov5-icaq"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-66659", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-66659"}, {"url": "https://patchstack.com/database/wordpress/plugin/tablesome/vulnerability/wordpress-tablesome-plugin-1-2-9-sql-injection-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-66659漏洞", "_translated": true, "_saved_at": "2026-08-12T12:54:59+00:00", "_first_saved_at": "2026-08-12T09:06:51+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-xov5-icaq"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2026-59500", "cvss": {"cvssv31": [{"source": "cna@cyber.gov.il", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:N", "severity": "critical", "base_score": 10}]}, "cvss_score": 10, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:N", "cwe": "CWE-287", "description": "CWE-287：身份验证不当", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requiremen  [], "title": "CVE-2026-73299漏洞", "_translated": true, "_saved_at": "2026-08-12T18:54:19+00:00", "_first_saved_at": "2026-08-12T18:54:19+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-woav-pk9s"}, {"analysis_status": 0, "articles": [{"content": "应用程序在处理用户输入时的不完善或缺乏验证机制，所以攻击者能够通过向应用程序发送恶意输入，利用应用程序对输入数据的错误处理方式来注入自己的恶意代码。这些恶意代码会被应用程序误认为是合法的指令或数据，并在执行过程中被执行。", "title": "什么是代码注入"}, {"content": "应用程序使用可执行动态代码的函数来执行用户可控的参数，当应用程序对于用户输入过滤不完全时，攻击者可以注入恶意代码并控制代码执行流程。", "title": "代码注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对所有用户输入进行验证和过滤，确保只接受预期的有效输入。这包括对输入数据进行输入长度验证、类型检查和格式验证等。\r\n- 使用参数化查询或预编译语句：对于数据库查询操作，应该使用参数化查询或预编译语句，确保输入数据不会被误认为是执行代码。\r\n- 最小特权原则：应用程序在执行操作系统命令或动态代码时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。\r\n- 安全编码实践：开发人员应该采用安全编码实践，包括避免使用eval函数、避免拼接用户输入的字符串作为代码执行等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止代码注入攻击。", "title": "如何预防代码注入"}], "cnvd_id": "", "cve_id": "CVE-2026-73268", "cvss": {"cvssv31": [{"source": "secalert@redhat.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.9}]}, "cvss_score": 9.9, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "cwe": "CWE-94", "description": "多集群引擎 (MCE) 的集群管理器控制器组件中发现了一个缺陷。对 ClusterCurator 资源具有创建或更新权限的租户可以注入任意作业规范。这是可能的，因为 CreateJob() 函数在解组 spec.install.overrideJob 原始扩展时不会验证用户控制的输入。成功利用该漏洞允许注入的作业以控制器提升的权限运行，从而导致任意代码执行和权限升级，从而可能访问集群范围的秘密。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "代码注入", "kind_en": "代码生成控制不当（“代码注入”）", "last_modified_time": "2026-08-13", "level": "Critical", "mps_id": "MPS-01zh-6a29", "poc": false, "poc_url": [], "published_time": "2026-08-13", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-01zh-6a29", "name": "https://www.oscs1024.com/hd/MPS-01zh-6a29"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73268", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73268"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-73268", "name": ""}, {"url": "https://bugzilla.redhat.com/show_bug.cgi?id=2514219", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-73268漏洞", "_translated": true, "_saved_at": "2026-08-12T20:48:34+00:00", "_first_saved_at": "2026-08-12T20:48:34+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-01zh-6a29"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-73294", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.9}]}, "cvss_score": 9.9, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "cwe": "CWE-88", "description": "Semaphore UI 是一个用于管理 DevOps 工具的 Web 界面。在 2.18.17 和 2.19.5-beta2 之前，存储库 git_url 处理通过 POST /api/project/{id}/repositories 和计划的提交哈希轮询将攻击者控制的 --upload-pack 选项传递给 CmdGitClient.GetLastRemoteCommitHash，允许项目经理或所有者在 Semaphore 服务器进程中执行任意操作系统命令。此问题已在版本 2.18.17 和 2.19.5-beta2 中修复。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "参数注入或修改", "kind_en": "命令中参数分隔符的不正确中和（“参数注入”）", "last_modified_time": "2026-08-13", "level": "Critical", "mps_id": "MPS-v6ax-qnps", "poc": false, "poc_url": [], "published_time": "2026-08-13", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-v6ax-qnps", "name": "https://www.oscs1024.com/hd/MPS-v6ax-qnps"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73294", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73294"}, {"url": "https://github.com/semaphoreui/semaphore/commit/7e8a9434bd81b82cf42220151c74801ea97542d6", "name": ""}, {"url": "https://github.com/semaphoreui/semaphore/commit/a7a7a33a64aea382a0726b3722856f298663eacf", "name": ""}, {"url": "https://github.com/semaphoreui/semaphore/security/advisories/GHSA-xp7j-h7jc-4w8p", "name": ""}, {"url": "https://github.com/semaphoreui/semaphore/tree/v2.18.17", "name": ""}, {"url": "https://github.com/semaphoreui/semaphore/tree/v2.19.5-beta2", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-73294漏洞", "_translated": true, "_saved_at": "2026-08-12T17:54:37+00:00", "_first_saved_at": "2026-08-12T17:54:37+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-v6ax-qnps"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "cnvd_id": "", "cve_id": "CVE-2026-73269", "cvss": {"cvssv31": [{"source": "secalert@redhat.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.9}]}, "cvss_score": 9.9, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "cwe": "CWE-269", "description": "在 cluster-curator-controller 组件中发现了一个缺陷。本地用户通过创建具有特定命名约定的 ClusterCurator 资源，可以触发集群范围的 ClusterRoleBinding 的创建。这允许用户将其权限从命名空间本地访问升级到集群范围的控制。此权限升级授予广泛的权限，包括访问和操作机密、管理集群操作以及删除托管集群或节点池的能力。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-08-13", "level": "Critical", "mps_id": "MPS-yw7g-k03c", "poc": false, "poc_url": [], "published_time": "2026-08-13", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-yw7g-k03c", "name": "https://www.oscs1024.com/hd/MPS-yw7g-k03c"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73269", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73269"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-73269", "name": ""}, {"url": "https://bugzilla.redhat.com/show_bug.cgi?id=2514220", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-73269漏洞", "_translated": true, "_saved_at": "2026-08-12T20:48:35+00:00", "_first_saved_at": "2026-08-12T20:48:35+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-yw7g-k03c"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-49819", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-862", "description": "UpSnap 是一款局域网唤醒网络应用程序。版本 4.4.1 到 5.3.5 容易受到 `pb.HandlerInitSuperuser` (`backend/pb/handlers.go:249`) 中缺少身份验证/权限升级链的影响，可通过 `POST /api/upsnap/init-superuser` 访问。易受攻击的代码缺乏任何身份验证、设置令牌、IP 允许列表或速率限制，并且仅通过“totalSuperusers \u003e 0”计数检查（每次全新安装时都会出现错误）进行控制，从而允许未经身份验证的网络相邻攻击者注册初始超级用户帐户，接收长期存在的 JWT，并在“backend/networking/wake.go:43”（“exec.CommandContext(ctx, “/bin/sh”、“-c”、wake_cmd)`)。 5.4.0 版本修复了该问题。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-08-13", "level": "Critical", "mps_id": "MPS-qvut-kio8", "poc": false, "poc_url": [], "published_time": "2026-08-13", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-qvut-kio8", "name": "https://www.oscs1024.com/hd/MPS-qvut-kio8"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-49819", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-49819"}, {"url": "https://github.com/seriousm4x/UpSnap/releases/tag/5.4.0", "name": ""}, {"url": "https://github.com/seriousm4x/UpSnap/security/advisories/GHSA-w4jr-728f-5jhq", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-49819漏洞", "_translated": true, "_saved_at": "2026-08-13T01:23:36+00:00", "_first_saved_at": "2026-08-13T01:23:36+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-qvut-kio8"}, {"analysis_status": 0, "articles": [{"content": "- 程序未正确处理用户上传的文件，从而导致程序可以读取、处理或存储未经授权的文件\n", "title": "什么是任意文件上传"}, {"content": "- 欺骗攻击：攻击者可以通过发送伪造的文件来欺骗程序，从而导致程序读取、处理或存储未经授权的文件。\n- 文件格式攻击：攻击者可以通过选择特定的文件格式，例如压缩文件或 ZIP 文件，从而利用上传的文件来篡改程序的执行结果或窃取程序中的重要数据。\n", "title": "任意文件上传常见的攻击方式"}, {"content": "- 使用安全文件传输协议 (FTP):使用安全 FTP 协议可以确保上传的文件格式、大小、权限等符合预期，同时可以防止文件读取、篡改或存储漏洞。\n- 使用文件上传过滤器：使用文件上传过滤器可以过滤上传的文件，以确保文件的格式、大小、权限等符合预期，同时可以防止文件读取、篡改或存储漏洞。\n- 使用白名单机制：使用白名单机制可以只允许特定的文件格式、大小、权限等存在的文件上传，从而防止非法文件的上传和攻击。\n- 定期更新和升级程序：定期更新和升级程序可以修复已知的漏洞，并增强程序的安全性。", "title": "如何预防任意文件上传"}], "cnvd_id": "", "cve_id": "CVE-2026-49827", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-434", "description": "WebErpMesv2 是一个工业资源管理和制造执行系统 ​​Web。 1.19 及之前的版本允许任何自行注册的用户通过 HR Expense scan_file 参数上传任意 PHP 文件，从而导致远程执行代码。结合开放注册（无需邀请）和损坏的角色中间件（CheckUserRole 默默吞下 RouteNotFoundException），该链实际上是针对任何默认安装的未经身份验证的 RCE。该问题已在提交 5c54862fa044b363fd2be03d586750e81afd6818 中修复。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "任意文件上传", "kind_en": "危险类型文件无限制上传", "last_modified_time": "2026-08-13", "level": "Critical", "mps_id": "MPS-tk2o-nl1i", "poc": false, "poc_url": [], "published_time": "2026-08-13", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-tk2o-nl1i", "name": "https://www.oscs1024.com/hd/MPS-tk2o-nl1i"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-49827", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-49827"}, {"url": "https://github.com/SMEWebify/WebErpMesv2/commit/5c54862fa044b363fd2be03d586750e81afd6818", "name": ""}, {"url": "https://github.com/SMEWebify/WebErpMesv2/security/advisories/GHSA-chhq-7p67-2ff9", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-49827漏洞", "_translated": true, "_saved_at": "2026-08-13T14:21:14+00:00", "_first_saved_at": "2026-08-13T14:21:14+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-tk2o-nl1i"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-71193", "cvss": {"cvssv31": [{"source": "cve@mitre.org", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:N/I:H/A:H", "severity": "critical", "base_score": 9.6}]}, "cvss_score": 9.6, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:N/I:H/A:H", "cwe": "CWE-863", "description": "在 22.0.1 之前的 OpenStack Designate 中，区域创建检查（_is_subzone、_is_superzone 和重复区域数据库约束）的范围仅限于目标池。经过身份验证的用户可以通过 AttributeFilter 调度程序将区域调度到不同的池，从而创建与另一个租户的区域冲突的重叠区域，从而绕过这些检查。这可以实现跨租户 DNS 劫持（将流量重定向到攻击者控制的 IP）和 DNS 拒绝服务（NODATA 响应）。利用该漏洞需要在scheduler_filters中启用AttributeFilter的多池部署，这是一个非默认但有记录且受支持的自助服务分层配置。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-08-13", "level": "Critical", "mps_id": "MPS-ac6y-nh4x", "poc": false, "poc_url": [], "published_time": "2026-08-13", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ac6y-nh4x", "name": "https://www.oscs1024.com/hd/MPS-ac6y-nh4x"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-71193", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-71193"}, {"url": "https://launchpad.net/bugs/2160533", "name": ""}, {"url": "https://security.openstack.org/ossa/OSSA-2026-034.html", "name": ""}, {"url": "https://www.openwall.com/lists/oss-security/2026/08/11/6", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-71193漏洞", "_translated": true, "_saved_at": "2026-08-13T01:23:40+00:00", "_first_saved_at": "2026-08-13T01:23:40+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ac6y-nh4x"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-73300", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.6}]}, "cvss_score": 9.6, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:H/I:H/A:H", "cwe": "CWE-89", "description": "Budibase 是一个开源低代码平台。在3.40.0之前，Budibase中的MySQL集成组件配置有multipleStatements: true，允许在单个查询中执行多个SQL语句。攻击者可以通过用户输入字段注入恶意 SQL 命令，从而导致数据库完全受损。该漏洞已在 3.40.0 中修复。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-08-13", "level": "Critical", "mps_id": "MPS-s16y-r09k", "poc": false, "poc_url": [], "published_time": "2026-08-13", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-s16y-r09k", "name": "https://www.oscs1024.com/hd/MPS-s16y-r09k"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73300", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73300"}, {"url": "https://github.com/Budibase/budibase/releases/tag/3.40.0", "name": ""}, {"url": "https://github.com/Budibase/budibase/security/advisories/GHSA-q6x4-v3qx-85qw", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-73300漏洞", "_translated": true, "_saved_at": "2026-08-12T18:54:25+00:00", "_first_saved_at": "2026-08-12T18:54:25+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-s16y-r09k"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-49481", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:N", "severity": "critical", "base_score": 9.6}]}, "cvss_score": 9.6, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:N", "cwe": "CWE-78", "description": "UpSnap 是一款局域网唤醒网络应用程序。由于使用 ip 和 mac 字段存在不安全的 shell 命令模板插值，5.4.0 之前的版本在 UpSnap 的设备管理功能中存在操作系统命令注入漏洞。用户控制的值可以插入到wake_cmd和shutdown_cmd模板中，并通过/bin/sh -c (Linux)或cmd /C (Windows)执行，无需清理，从而实现经过身份验证的远程代码执行(RCE)。具有创建或编辑设备权限的低权限用户可以在 UpSnap 托管服务器上执行任意操作系统命令。 5.4.0 版本修复了该问题。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "202 VA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.2}]}, "cvss_score": 9.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-150", "description": "### 影响\n\n这会影响 Windows 上使用“escape”和“escapeAll” API 将“shell”显式配置为 CMD 或“true”（默认 shell 为 CMD）的 Shescape 用户。\n\n攻击者可能能够根据原始命令实现 shell 注入。\n\n```javascript\n从“node:child_process”导入* as cp；\n从“shescape”导入 { Shescape }；\n\n// 1.前提条件\n常量选项 = {\n    外壳：“cmd.exe”，\n    // 或者\n    shell: true, // 仅当默认 shell 是 CMD 时\n};\n\n// 2. 有效负载\nconst Payload = \"x) else if a==a (echo y\";\n\n// 3. 用法\nconst shescape = new Shescape(选项);\n让逃逸的Payload；\n\nescapedPayload = shescape.escape(payload);\n// 或者\nescapedPayload = shescape.escapeAll([有效负载]);\n\n// 并且（示例）\nconst result = cp.execSync(`如果定义为 FALSY (echo ${escapedPayload})`, options);\n\n// 4.影响\nconsole.log(结果.toString());\n// 输出“y”而不是“”\n\n````\n\n### 补丁\n\n此错误已在 [v2.1.14] 和 [v3.0.1] 中修复，您现在可以升级到。\n\n如果您已经在使用 Shescape v3，则无需进一步更改。如果您使用的是 Shescape v2，建议升级，因为该版本将于 2026 年 9 月 28 日达到终止状态，请按照[迁移指南]升级到 v3。\n\n对于低于 v2.0.0 的 Shescape 版本，不会发布任何补丁。\n\n### 解决方法\n\n或者，Shescape 的用户可以从不受信任的输入中删除所有“(”和“)”实例。\n\n### 欲了解更多信息\n\n- 对 v2 的 Pull 请求 [#2651] 和 v3 的 [#2649] 进行评论\n- 对 v2 的提交 [b4b34c3] 和 v3 的提交 [43d70b5] 发表评论\n- 在\u003chttps://github.com/ericcornelissen/shescape/issues\u003e打开一个问题（新问题\u003e问题）", "effects": [{"comp_name": "shescape", "ecosystem": "npm", "versions": [{"affected_version": "(-∞,2.1.14)", "min_fixed_version": "2.1.14", "repository": "npm", "solutions": [], "upstream": true}, {"affected_version": "[3.0.0,3.0.1)", "min_fixed_version": "3.0.1", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "转义、元或控制序列转义处理不恰当", "kind_en": "转义、元或控制序列的不正确中和", "last_modified_time": "2026-08-13", "level": "Critical", "mps_id": "MPS-6ofs-4bv8", "poc": false, "poc_url": [], "published_time": "2026-08-13", "reference_url_list": [{"url": "https://github.com/ericcornelissen/shescape/security/advisories/GHSA-w4hw-qcx7-56pr", "name": ""}, {"url": "https://github.com/ericcornelissen/shescape/pull/2649", "name": ""}, {"url": "https://github.com/ericcornelissen/shescape/pull/2651", "name": ""}, {"url": "https://github.com/ericcornelissen/shescape/commit/43d70b59d09bbe5c3fd02ef08b3a123e977ed9de", "name": ""}, {"url": "https://github.com/ericcornelissen/shescape/commit/b4b34c394e7f9da2775bb75381066b9a228c425f", "name": ""}, {"url": "https://github.com/ericcornelissen/shescape/blob/dea8893a5877893d8d4923dbf253080e08899e6d/docs/migration.md", "name": ""}, {"url": "https://github.com/ericcornelissen/shescape/releases/tag/v2.1.14", "name": ""}, {"url": "https://github.com/ericcornelissen/shescape/releases/tag/v3.0.1", "name": ""}, {"url": "https://github.com/advisories/GHSA-w4hw-qcx7-56pr", "name": ""}], "scope_influence": "", "tags": ["npm", "开源", "终端软件"], "title": "Shescape：在 Windows 上使用 CMD 通过未转义括号进行 Shell 注入", "_translated": true, "_saved_at": "2026-08-12T21:38:58+00:00", "_first_saved_at": "2026-08-12T21:38:58+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-6ofs-4bv8"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-73332", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:R/S:C/C:H/I:H/A:N", "severity": "high", "base_score": 8.7}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:A/VC:H/VI:H/VA:N/SC:H/SI:H/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.2}]}, "cvss_score": 9.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:A/VC:H/VI:H/VA:N/SC:H/SI:H/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-89", "description": "CamaleonCMS 在 cama_contact_form 插件中包含一个存储的跨站点脚本漏洞，该漏洞允许低权限的经过身份验证的攻击者通过联系表单编辑端点向 before_html 字段提交未经净化的内容来注入任意 HTML，而该端点缺乏适当的授权控制。攻击者可以将恶意脚本负载持久保存到数据库中，并在加载联系表单时在受害者的浏览器中执行，从而实现 cookie 盗窃、针对管理界面伪造经过身份验证的请求以及查看用户的会话接管。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-08-13", "level": "Critical", "mps_id": "MPS-9h8x-3kil", "poc": false, "poc_url": [], "published_time": "2026-08-13", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-9h8x-3kil", "name": "https://www.oscs1024.com/hd/MPS-9h8x-3kil"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73332", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73332"}, {"url": "https://enrik-m.github.io/posts/Camaleon-CMS-Vulnerabilties/#32-stored-xss-in-contact-form", "name": ""}, {"url": "https://github.com/owen2345/camaleon-cms", "name": ""}, {"url": "https://www.vulncheck.com/advisories/camaleoncms-cama-contact-form-plugin-stored-xss-via-before-html-field", "name": ""}, {"url": "https://enrik-m.github.io/posts/Camaleon-CMS-Vulnerabilties/#32-stored-xss-in-contact-form", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-73332漏洞", "_translated": true, "_saved_at": "2026-08-12T21:39:15+00:00", "_first_saved_at": "2026-08-12T21:39:15+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-9h8x-3kil"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-73329", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:R/S:C/C:H/I:H/A:N", "severity": "high", "base_score": 8.7}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:A/VC:H/VI:H/VA:N/SC:H/SI:H/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.2}]}, "cvss_score": 9.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:A/VC:H/VI:H/VA:N/SC:H/SI:H/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-79", "description": "CamaleonCMS 包含一个存储的跨站点脚本漏洞，该漏洞允许经过身份验证的低权限用户通过在草稿创建期间将未经净化的 HTML 有效负载注入到帖子标题参数中来在管理员浏览器中执行任意 JavaScript。攻击者可以通过草稿创建端点将恶意 HTML 有效负载作为草稿标题提交，该负载会在不转义的情况下保留到数据库中，并随后在管理草稿列表中呈现为原始 HTML，从而导致管理员会话泄露、cookie 盗窃和伪造经过身份验证的请求。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-08-13", "level": "Critical", "mps_id": "MPS-nezu-y928", "poc": false, "poc_url": [], "published_time": "2026-08-13", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-nezu-y928", "name": "https://www.oscs1024.com/hd/MPS-nezu-y928"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73329", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73329"}, {"url": "https://enrik-m.github.io/posts/Camaleon-CMS-Vulnerabilties/#44-stored-xss-via-draft-post-title", "name": ""}, {"url": "https://github.com/owen2345/camaleon-cms", "name": ""}, {"url": "https://www.vulncheck.com/advisories/camaleoncms-stored-xss-via-draft-post-title-creation-endpoint", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-73329漏洞", "_translated": true, "_saved_at": "2026-08-12T21:39:14+00:00", "_first_saved_at": "2026-08-12T21:39:14+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-nezu-y928"}, {"analysis_status": 0, "articles": [{"content": "由于应用程序或系统中存在敏感信息未经适当保护而被泄露给攻击者或未经授权的用户，这些敏感信息可能包括用户凭据、个人身份信息、敏感业务数据、系统配置信息等。信息暴露漏洞通常是由于设计、实施或配置错误引起的，例如不正确的访问控制、弱密码策略、缺乏加密、错误的日志处理等。", "title": "什么是未授权敏感信息泄露"}, {"content": "- 直接访问敏感信息：攻击者可以通过直接访问不正确配置或不受保护的资源来获取敏感信息，如通过公开可访问的URL、未经授权的文件目录访问等。\n- 越权访问：攻击者可能利用访问控制错误或不正确的权限配置来获取他们没有权限访问的敏感信息。\n- 错误信息披露：应用程序在错误处理过程中可能泄露敏感信息，例如将错误消息中的敏感数据返回给客户端或显示在日志文件中。\n- 信息泄露通过响应：攻击者可能利用应用程序在响应中不正确地包含敏感信息，如通过网页源代码、响应头部或响应消息体中的敏感数据。", "title": "未授权敏感信息泄露常见的攻击方式"}, {"content": "- 访问控制：确保只有经过授权的用户能够访问敏感信息，使用强大的身份验证和授权机制。\n- 数据加密：对于敏感信息，使用适当的加密算法对数据进行加密，包括数据传输和存储过程中的加密。\n- 错误处理和日志安全：正确处理错误情况，避免在错误消息中暴露敏感信息。同时，确保日志记录功能的安全性，避免将敏感信息记录在日志文件中。\n- 安全配置和最佳实践：遵循安全最佳实践，对应用程序、服务器和系统进行适当的配置，包括访问控制、权限管理、密码策略等。\n- 审计和监控：实施日志审计和监控机制，及时检测和响应任何异常活动或潜在的信息暴露事件。\n- 安全开发实践：在应用程序开发过程中，进行安全代码审查、漏洞扫描和安全测试，以及敏感信息的正确处理和保护。", "title": "如何预防未授权敏感信息泄露"}], "cnvd_id": "", "cve_id": "CVE-2026-72804", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:N/A:N", "severity": "high", "base_score": 8.6}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:H/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.2}]}, "cvss_score": 9.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:H/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-200", "description": "v3.7.4 之前的 SiYuan 版本无法验证 getGraph 和 getLocalGraph 端点中的发布密码层，从而允许匿名读者检索受密码保护文档的块级内容。攻击者可以调用这些端点，而无需提供密码来读取受保护的文档内容和完整的参考拓扑。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "未授权敏感信息泄露", "kind_en": "向未经授权的行为者泄露敏感信息", "last_modified_time": "2026-08-13", "level": "Critical", "mps_id": "MPS-r4wv-31s0", "poc": false, "poc_u cope_influence": "", "tags": [], "title": "CVE-2026-59503漏洞", "_translated": true, "_saved_at": "2026-08-13T11:01:23+00:00", "_first_saved_at": "2026-08-13T11:01:23+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-8b0z-mijn"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2026-73501", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N", "severity": "critical", "base_score": 9.1}]}, "cvss_score": 9.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N", "cwe": "CWE-287", "description": "kin-openapi 是一个用于处理 OpenAPI 文件的 Go 项目。在 0.144.0 之前，openapi3filter/validation_handler.go 中的 ValidationHandler.Load() 默默地将 nil AuthenticationFunc 替换为 NoopAuthenticationFunc，后者返回 nil 而不检查凭据。当应用程序依赖 ValidationHandler 作为其执行中间件时，这种替换会导致未经身份验证的请求满足每个 OpenAPI 安全要求。无操作回调可防止到达失败关闭的 ErrAuthenticationServiceMissing 路径，并将请求转发到可能需要 API 密钥、OAuth 令牌或其他安全方案的受保护处理程序。此问题已在版本 0.144.0 中修复。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "身份验证不当", "kind_en": "认证不当", "last_modified_time": "2026-08-13", "level": "Critical", "mps_id": "MPS-kohq-3gpc", "poc": false, "poc_url": [], "published_time": "2026-08-13", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-kohq-3gpc", "name": "https://www.oscs1024.com/hd/MPS-kohq-3gpc"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73501", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73501"}, {"url": "https://github.com/getkin/kin-openapi/commit/f0407d53b0730280266f454b755010e7eeb985da", "name": ""}, {"url": "https://github.com/getkin/kin-openapi/releases/tag/v0.144.0", "name": ""}, {"url": "https://github.com/getkin/kin-openapi/security/advisories/GHSA-r277-6w6q-xmqw", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-73501漏洞", "_translated": true, "_saved_at": "2026-08-12T23:34:53+00:00", "_first_saved_at": "2026-08-12T23:34:53+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-kohq-3gpc"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-73656", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:L/I:H/A:H", "severity": "critical", "base_score": 9.9}]}, "cvss_score": 9.9, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:L/I:H/A:H", "cwe": "CWE-862", "description": "Trigger.dev 是一个用于构建和部署完全托管的 AI 代理和工作流程的平台。在 4.5.6 之前，POST /api/v1/deployments/:deploymentId/background-workers 会在 apps/webapp/app/v3/services/createDeploymentBackgroundWorkerV4.server.ts 中调用 CreateDeploymentBackgroundWorkerServiceV4.call()，其中，workerDeployment.findFirst() 通过FriendlyId 选择部署，而无需使用environmentId 谓词。拥有一个项目的有效 API 密钥的调用者可以提交另一个项目的部署标识符，将攻击者拥有的后台工作人员链接到受害者部署，并将受害者部署从“构建”移动到“部署”。此问题已在版本 4.5.6 中修复。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-08-14", "level": "Critical", "mps_id": "MPS-2cvl-dhup", "poc": false, "poc_url": [], "published_time": "2026-08-14", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-2cvl-dhup", "name": "https://www.oscs1024.com/hd/MPS-2cvl-dhup"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73656", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73656"}, {"url": "https://github.com/triggerdotdev/trigger.dev/commit/34b1a181c2a1d33a53ebab88f84b05f81fea4254", "name": ""}, {"url": "https://github.com/triggerdotdev/trigger.dev/pull/4199", "name": ""}, {"url": "https://github.com/triggerdotdev/trigger.dev/releases/tag/v4.5.2", "name": ""}, {"url": "https://github.com/triggerdotdev/trigger.dev/security/advisories/GHSA-j6vv-pq9h-f4wj", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-73656漏洞", "_translated": true, "_saved_at": "2026-08-13T21:38:22+00:00", "_first_saved_at": "2026-08-13T21:38:22+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-2cvl-dhup"}, {"analysis_status": 0, "articles": [{"content": "应用程序在处理用户输入时的不完善或缺乏验证机制，所以攻击者能够通过向应用程序发送恶意输入，利用应用程序对输入数据的错误处理方式来注入自己的恶意代码。这些恶意代码会被应用程序误认为是合法的指令或数据，并在执行过程中被执行。", "title": "什么是代码注入"}, {"content": "应用程序使用可执行动态代码的函数来执行用户可控的参数，当应用程序对于用户输入过滤不完全时，攻击者可以注入恶意代码并控制代码执行流程。", "title": "代码注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对所有用户输入进行验证和过滤，确保只接受预期的有效输入。这包括对输入数据进行输入长度验证、类型检查和格式验证等。\r\n- 使用参数化查询或预编译语句：对于数据库查询操作，应该使用参数化查询或预编译语句，确保输入数据不会被误认为是执行代码。\r\n- 最小特权原则：应用程序在执行操作系统命令或动态代码时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。\r\n- 安全编码实践：开发人员应该采用安全编码实践，包括避免使用eval函数、避免拼接用户输入的字符串作为代码执行等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止代码注入攻击。", "title": "如何预防代码注入"}], "cnvd_id": "", "cve_id": "CVE-2026-73649", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-94", "description": "### 总结\n\nvelocityjs v2.1.6 中通过对 Function 构造函数的属性读取来实现远程代码执行 (RCE)。这绕过了 GHSA-j658-c2gf-x6pq（“#set 路径分配中的原型污染”）的修复 - 该建议仅在 #set 分配处理程序 (set.cjs) 中阻止了构造函数/__proto__/prototype，但属性读取表达式未经过过滤。任何呈现攻击者控制的 Velocity 模板的应用程序都容易受到服务器上任意代码执行的攻击。\n\n### 详细信息\n\nGHSA-j658-c2gf-x6pq 将 isBlockedPathKey() 添加到 dist/cjs/compile/set.cjs:35-43，它会阻止 __proto__、构造函数和原型键。但是，此检查仅在 #set 指令分配值时运行 - 它验证分配目标路径，而不是正在评估的值表达式。\n值表达式通过 dist/cjs/compile/references.cjs:16 中的 getReferences() 进行计算，它在第 81 行调用 getAttributes()。第 88-89 行的属性访问没有过滤：\n// 参考文献.cjs:81-91\ngetAttributes（属性，baseRef，ast）{\n  if (property.type === \"属性\") {\n    返回baseRef[属性.id]；  // ← “构造函数”、“原型”等上没有块。\n  }\n  ...\n}\n同时，set.cjs:35-43 正确地阻止了这些键，但仅限于 #set 目标：\n// 设置.cjs:35-43\nisBlockedPathKey(baseRef, key, isEnd) {\n  if (key === PROTO_KEY) 返回 true;          //“__proto__”\n  if (key === \"prototype\" \u0026\u0026 typeof baseRef === \"function\") return true;\n  return !isEnd \u0026\u0026 PROTOTYPE_CHAIN_KEYS.has(key) \u0026\u0026 !hasOwnProperty(baseRef, key);\n}\n漏洞利用链：\n1. $x.constructor → getAttributes() → {}[\"constructor\"] → 对象\n2. .constructor → getAttributes() → 对象[\"constructor\"] → 函数\n3. (\"return process.mainModule.require('child_process').execSync('whoami')\") → 调用 Function(...) → 创建一个函数\n4.#set将结果赋值给$f，然后将其渲染为$r\n#set 处理程序验证 $f 作为赋值目标（通过 - f 未被阻止），但从不检查右侧表达式以进行原型链遍历。\n\n### 概念验证\n\nconst 速度 = require('velocityjs');\n\nconst template = \"#set($f=$x.constructor.constructor(\\\"return process.mainModule.require('child_process').execSync('whoami').toString()\\\"))#set($r=$f())$r\";\n\nconsole.log(velocity.render(template, { x: {} }));\n// 输出：\u003c当前操作系统用户名\u003e\n在velocityjs v2.1.6、Node.js v24.15.0、Windows 上进行了验证。\n\n### 影响\n\n类型：远程代码执行 (RCE)\n\n任何使用velocityjs呈现攻击者控制的Velocity模板的应用程序都容易受到整个服务器的攻击。攻击者可以执行任意 shell 命令、读取环境变量、访问云凭据以及访问内部网络资源。\n现有的通报 GHSA-j658-c2gf-x6pq 建立了威胁模型：“任何呈现攻击者控制模板的应用程序”。这一发现表明修复并不完整——添加了 #se​​t 阻塞，但属性读取表达式仍未过滤，这使得问题变得更糟（RCE 与原型污染）。\n\n### 补丁\n\n已在 [velocityjs 2.1.7](https://www.npmjs.com/package/velocityjs/v/2.1.7) 中修复。该修复已合并到 [pull request #192](https://github.com/shepherdwind/velocity.js/pull/192) 中，并作为 [v2.1.7](https://github.com/shepherdwind/velocity.js/releases/tag/v2.1.7) 发布。用户应升级到2.1.7或更高版本。", "effects": [{"comp_name": "velocityjs", "ecosystem": "npm", "versions": [{"affected_version": "(-∞,2.1.6]", "min_fixed_version": "", "repository": "npm", "solutions": [], "upstream": true}, {"affected_version": "(-∞,2.1.7)", "min_fixed_version": "2.1.7", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "代码注入", "kind_en": "代码生成控制不当（“代码注入”）", "last_modified_time": "2026-08-14", "level": "Critical", "mps_id": "MPS-2dgi-697b", "poc": false, "poc_url": [], "published_time": "2026-08-14", "reference_url_list": [{"url": "https://github.com/shepherdwind/velocity.js/security/advisories/GHSA-7gfh-x38p-prh3", "name": ""}, {"url": "https://github.com/shepherdwind/velocity.js/pull/192", "name": ""}, {"url": "https://github.com/shepherdwind/velocity.js/commit/f8e47a6c4607249b9c967d3a1ced959b4dd64dba", "name": ""}, {"url": "https://github.com/shepherdwind/velocity.js/releases/tag/v2.1.7", "name": ""}, {"url": "https://github.com/advisories/GHSA-7gfh-x38p-prh3", "name": ""}], "scope_influence": "", "tags": ["npm", "开源"], "title": "Velocity.js：通过属性读取到函数构造函数来远程执行代码（绕过 GHSA-j658-c2gf-x6pq 修复）", "_translated": true, "_saved_at": "2026-08-13T19:53:44+00:00", "_first_saved_at": "2026-08-13T19:53:44+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-2dgi-697b"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-12949", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-640", "description": "WordPress 的愿望清单会员插件在 3.34.1 及以下版本中容易因数据真实性验证不充分而遭受帐户接管。这是由于 wpm_register() 函数仅针对 GET reg 参数验证注册 cookie，同时接受 POST mergewith 和 POST wpm_id 参数，而不验证 mergewith 用户 ID 是否引用了绑定到当前注册事务的临时或不完整的注册者。这使得未经身份验证的攻击者可以通过提供任意用户的数字 ID 作为 mergewith 值来接管任何现有的 WordPress 帐户（包括管理员帐户），这会导致 wp_update_user() 用攻击者控制的值覆盖目标帐户的用户名（另外通过直接 $wpdb UPDATE 写入）、密码、电子邮件地址、名字和姓氏，同时明确抑制 WordPress 密码和电子邮件更改通知电子邮件。当 wpm_id 引用不存在的成员资格级别时，不会将任何角色密钥添加到更新负载中，从而导致 wp_update_user() 保留目标用户的现有角色（包括管理员），从而使完全权限升级成为接管的直接结果。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "忘记口令恢复机制弱", "kind_en": "忘记密码的弱密码恢复机制", "last_modified_time": "2026-08-14", "level": "Critical", "mps_id": "MPS-3kaq-b4mi", "poc": false, "poc_url": [], "published_time": "2026-08-14", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-3kaq-b4mi", "name": "https://www.oscs1024.com/hd/MPS-3kaq-b4mi"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-12949", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-12949"}, {"url": "https://wishlistmember.com/", "name": ""}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/84afe5a7-1bf4-4b83-bf77-efbb003a30cd? 认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-73653", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:L", "severity": "critical", "base_score": 9.4}]}, "cvss_score": 9.4, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:L", "cwe": "CWE-862", "description": "## 总结\n\n浏览器模式公开了一组内置“命令”，这些命令在测试运行器的 Node.js 端运行，并且可以触摸本地文件系统（截取屏幕截图、管理 Playwright 跟踪、上传“\u003cinput type=\"file\"\u003e”文件、比较屏幕截图）。\n\n其中几个命令接受来自浏览器的文件路径并对其进行操作，而无需检查“allowWrite”权限门，也不将路径限制为项目目录。因此，可以访问浏览器模式 API 的客户端可以在 Vitest 进程可以访问的任何位置读取、创建、覆盖或删除文件，即使当“allowWrite”为“false”时也是如此。\n\n当浏览器模式 API 暴露于网络时（例如设置了“test.api.host”，或者可以从另一台机器或源访问开发服务器），这一点最为重要。在该配置中，“allowWrite”默认为“false”，正是为了阻止文件访问，并且这些命令绕过了该保护。在具有受信任测试代码的默认仅本地主机设置中，没有不受信任的一方可以利用它。无论您依赖“allowWrite: false”来包含不受信任的测试代码，这一差距仍然很重要，因为这些命令会忽略该标志。\n\n## Affected commands and impact\n\n|命令 |运营|影响 |\n|---|---|---|\n| `upload` (Playwright + WebdriverIO) |阅读 | Arbitrary local file read;内容加载到页面中并可由测试代码读取。影响最大的案例。 |\n| `takeScreenshot` (Playwright + WebdriverIO) |写 |将 PNG 写入任意路径（逐字使用绝对路径），创建父目录。 |\n| `screenshotMatcher` |写 | Writes reference/diff PNGs;从客户端路径派生的目录允许部分遍历。 |\n| `stopChunkTrace` |写 |将 Playwright 跟踪“.zip”写入可通过跟踪名称中的“../”转义的路径。 |\n| `删除跟踪` |删除| Deletes arbitrary files by path. |\n| `注释痕迹` |阅读（披露）|记录客户端控制的附件路径，报告者将其复制到附件目录中，从而公开文件内容。 |\n\n写入不允许攻击者选择文件内容（它们生成 PNG 图像或跟踪存档），因此完整性影响是在任意路径创建、覆盖或删除文件，而不是写入选定的有效负载。读取（“upload”、“annotateTraces”）更为严重，因为它们会暴露任意文件的完整内容。\n\n该修复程序为每个文件接触提供程序命令添加了“allowWrite”检查，以检查写入/删除操作以及对项目根目录的路径限制（与现有的“fs”命令模式匹配），因此客户端提供的绝对路径和“../”遍历将被拒绝。", "effects": [{"comp_name": "@vitest/browser", "ecosystem": "npm", "versions": [{"affected_version": "[5.0.0-beta.1,5.0.0-beta.6)", "min_fixed_version": "5.0.0-beta.6", "repository": "npm", "solutions": [], "upstream": true}, {"affected_version": "(-∞,3.2.7)", "min_fixed_version": "3.2.7", "repository": "npm", "solutions": [], "upstream": true}, {"affected_version": "[4.0.0,4.1.10)", "m ypto”，但 jsbn 检查\n“window.crypto”，而不是“globalThis.crypto”，因此永远不会采用安全路径。\n因此，默认生成的每个 SM2 私钥\n`sm2.generateKeyPairHex()` 和每个签名临时标量都源自\n非加密来源，并且可以被可以观察到的攻击者**预测**\n一些 `Math.random()` 输出并估计生成时间。\n\n这是库的**默认**（无参数）路径；未选择呼叫者\n需要参数或配置才能触发它。已转载\n端到端针对未修改的真实 npm 包（`sm-crypto@0.4.0` +\n`jsbn@1.1.0`);下面的 PoC 针对实际安装的软件包运行，而不是\n复制。该缺陷在最新发布的版本 (0.4.0) 上仍然存在，并且\n不属于任何现有的“JuneAndGreen/sm-crypto”问题（0 afldl 问题\n存在；最近的问题是不相关的 SM3/HKDF/PBKDF2 功能请求）。\n\n## 详细信息\n\n`jsbn@1.1.0` `index.js` — RNG 池初始化（在 Node 中进行回退）：\n\n````js\nif (rng_pool == null) {\n  rng_pool = 新数组(); rng_pptr = 0;变量t；\n  if (typeof window !== \"undefined\" \u0026\u0026 window.crypto) { // \u003c-- Node 中为 false\n    if (window.crypto.getRandomValues) { /* webcrypto */ }\n    ...\n  }\n  while (rng_pptr \u003c rng_psize) { // \u003c-- 后备路径\n    t = Math.floor(65536 * Math.random());                  // Math.random()\n    rng_pool[rng_pptr++] = t \u003e\u003e\u003e 8;\n    rng_pool[rng_pptr++] = t \u0026 255;\n  }\n  rng_pptr = 0;\n  rng_seed_time();                                           // + Date.getTime()\n}\n````\n\n`sm-crypto` `src/sm2/utils.js`:\n\n````js\nconst { SecureRandom } = require('jsbn');\nconst rng = new SecureRandom();                              // 单模块范围的 RNG\n...\n函数generateKeyPairHex(a, b, c) {\n  常量随机 = a ?新的大整数（a，b，c）\n                   : new BigInteger(n.bitLength(), rng);     // 使用 rng\n  const d = random.mod(n.subtract(BigInteger.ONE)).add(BigInteger.ONE); // 私钥\n  ...\n}\n````\n\n默认（无参数）调用路径使用“rng”，即 jsbn ARC4 实例种子\n来自“Math.random()”+时间。相同的“rng”为签名提供了短暂的信息\nSM2 签名期间的标量。\n\n## 概念验证\n\nPoC 针对实际安装的 npm 软件包运行。它固定“Math.random”\n和 `Date` **之前** `require('sm-crypto')` 所以 jsbn 的种子池是从构建的\n受控输入。然后三个独立的新鲜节点进程产生\n**相同** SM2 私钥，证明密钥是以下的纯确定性函数\n那些非加密来源。它还打印一个探针来确认回退\n分支是在 Node.js 中获取的。\n\n### 一行复制器\n\n````bash\nWORK=$(mktemp -d) \u0026\u0026 cd \"$WORK\" \u0026\u0026 npm init -y \u003e/dev/null \\\n  \u0026\u0026 npm install sm-crypto@0.4.0 jsbn@1.1.0 \u003e/dev/null \\\n  \u0026\u0026 导出 NODE_PATH=\"$WORK/node_modules\" \\\n  \u0026\u0026 节点 poc.js 探测 \u0026\u0026 节点 poc.js 确定性 \u0026\u0026 节点 poc.js 确定性\n````\n\n### `poc.js`\n\n````js\n/*\n * Node.js 中 sm-crypto 可预测默认 RNG 的 PoC。\n *\n * sm-crypto (npm 0.4.0) 使用以下命令生成 SM2 私钥/临时标量\n * jsbn 的 SecureRandom。在浏览器中，jsbn 从 window.crypto 种子 ARC4，但在\n * Node.js `window` 未定义，因此 CSPRNG 分支被跳过，池被\n * 由 Math.random() 加上 new Date().getTime() 填充。两者都是\n * 非加密；时间是攻击者可估计的，V8 的 Math.random 是\n * 可恢复的 xorshift128+ 流。因此 SM2 密钥由\n * 默认路径是可预测的。\n ** 这个 PoC 证明关键是这两个输入的确定性函数：我们\n * 在 sm-crypto 之前将 Math.random 和时钟固定为固定值（因此\n * jsbn) 被加载，然后生成密钥对。使用相同的固定重新运行\n * 值复制完全相同的私钥。\n */\n\nconst MODE = process.argv[2] || '探测'; // '探测' | “确定性”\n\nif (MODE === '确定性') {\n  // --- 在需要 sm-crypto/jsbn 之前固定熵源 ---\n  const 固定时间 = 1700000000000;\n  让 s = 0x12345678 \u003e\u003e\u003e 0;\n  Math.random = 函数 () {\n    // 微小的确定性 LCG 代表（已经是非加密的）Math.random\n    s = (Math.imul(s, 1103515245) + 12345) \u003e\u003e\u003e 0;\n    返回s/0x100000000；\n  };\n  const RealDate = globalThis.Date;\n  类固定日期扩展 RealDate {\n    构造函数(...a) { super(...(a.length === 0 ? [fixedTime] : a)); }\n  }\n  固定日期.now = () =\u003e 固定时间;\n  globalThis.Date = 固定日期;\n}\n\nconst sm2 = require('sm-crypto').sm2;\nconst kp = sm2.generateKeyPairHex();\nconsole.log('PRIVATE=' + kp.privateKey);\n\nif (MODE === '探测') {\n  console.log('--- 探测 ---');\n  console.log('typeof window =', typeof window, '(Node 中未定义 =\u003e jsbn CSPRNG 分支已跳过)');\n  console.log('typeof globalThis.crypto =', typeof globalThis.crypto, '(Node Web Crypto 存在，但 jsbn 检查 window.crypto，而不是 globalThis.crypto)');\n  console.log('Math.random 样本 =', Math.random());\n  console.log('Date.now() =', Date.now(), '(攻击者可估计，混合到 ARC4 种子中)');\n}\n````\n\n真实捕获的输出：\n\n````\n===== PROBE（真正的默认路径，无需修补）=====\n私人=6072e45733a4187791ec28ce906fef18c7d33c8529969e1a852833c4349cfc38\n--- 探头 ---\ntypeof window = undefined（Node 中未定义 =\u003e jsbn CSPRNG 分支已跳过）\ntypeof globalThis.crypto = object（Node Web Crypto 存在，但 jsbn 检查 window.crypto，而不是 globalThis.crypto）\nMath.随机样本 = 0.704452488761137\nDate.now() = 1784455686795（攻击者可估计，混合到 ARC4 种子中）\n\n===== 确定性（Math.random + 在需要 sm-crypto 之前固定的日期） =====\n--- 运行 #1 --- PRIVATE=143268fa0939b4da09eab8c9a2e027a04555b6c433fef4f54fc5edd517c0a6b1\n--- 运行 #2 --- PRIVATE=143268fa0939b4da09eab8c9a2e027a04555b6c433fef4f54fc5edd517c0a6b1\n````\n\n两次确定性运行产生**相同** SM2 私钥，\n演示的关键是“Math.random()”+挂钟时间的纯函数。\n\n## 影响\n\n**使用生成的任何 SM2 密钥对的私钥恢复/签名伪造\nNode.js 中的默认 API。** 这是最严重的一类缺陷\n维护的 SM2 库：*默认*密钥生成路径是\n在其主要运行时是非加密的。\n\n- **私钥恢复。** 使用默认 API 生成的任何 SM2 密钥对\n  节点源自“Math.random()”+挂钟时间。攻击者可以\n  观察一些 `Math.random()` 输出（V8 `xorshift128+` 状态是\n  可从〜4个观察到的双打中恢复）并估计生成时间可以\n  复制私钥并伪造签名。\n- **签署临时重用/伪造。** 相同的 RNG 为临时提供数据\n  SM2 签名期间的标量“k”；可预测的“k”泄露了来自\n  单一签名（SM2 类似于 EC-Schnorr：`s = (k^-1)(e + d·r) mod n`）。\n- 预认证/无需特权：任何可以诱导受害者的人\n  生成密钥或签署消息（正常 API 使用）的位置是\n  预测秘密材料。\n\n### 建议修复\n\n从 Node.js 中的 CSPRNG 中播种 RNG。 `sm-crypto` 中最简单的修复是\n将 jsbn ARC4 实例替换为 Web Crypto / `crypto.randomBytes`：\n\n````js\n// src/sm2/utils.js\nconst nodeCrypto = (typeof require === '函数') ?要求（'加密'）：空；\n函数 csrandBytes(n) {\n  if (nodeCrypto) 返回nodeCrypto.randomBytes(n);          // 节点\n  if (globalThis.crypto) { // Web 加密（浏览器/节点 ≥ 19）\n    const b = new Uint8Array(n); globalThis.crypto.getRandomValues(b);返回b；\n  }\n  抛出新错误（'没有可用的 CSPRNG'）；\n}\n````\n\n并使用它直接生成私钥/临时密钥，或者重新播种\njsbn 池。 jsbn 中有一个单独的（上游）修复程序需要检查除了“window.crypto”之外，还有“globalThis.crypto”。\n\n### 受影响的版本\n\n- npm `sm-crypto` **0.4.0**（最新，发布于 2026 年 1 月 20 日）。取决于\n  `jsbn ^1.1.0`（`jsbn@1.1.0`，其`index.js` RNG 是根本原因）。\n- 运行时：Node.js（主要运行时；在浏览器中 jsbn CSPRNG 分支\n  被采取）。\n\n## 信用\n\n由 diff/ambidiff 安全研究工作 (afldl) 报告。", "effects": [{"comp_name": "sm-crypto", "ecosystem": "npm", "versions": [{"affected_version": "(-∞,0.5.0)", "min_fixed_version": "0.5.0", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "使用具有密码学弱点缺陷的PRNG", "kind_en": "使用弱加密伪随机数生成器 se, "poc_url": [], "published_time": "2026-08-12", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-8bli-k04d", "name": "https://www.oscs1024.com/hd/MPS-8bli-k04d"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2025-41770", "name": "https://nvd.nist.gov/vuln/detail/CVE-2025-41770"}, {"url": "https://phoenixcontact.csaf-tp.certvde.com/.well-known/csaf/white/2026/vde-2025-056.json", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2025-41770漏洞", "_translated": true, "_saved_at": "2026-08-12T12:54:55+00:00", "_first_saved_at": "2026-08-12T09:06:46+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-8bli-k04d"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-64954", "cvss": {"cvssv31": [{"source": "cve@rapid7.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:C/C:H/I:H/A:N", "severity": "high", "base_score": 8.2}]}, "cvss_score": 8.2, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:C/C:H/I:H/A:N", "cwe": "CWE-862", "description": "Velociraptor 允许通过笔记本中的 VQL 查询来安排新集合。对于计划新收集的用户，他们需要 COLLECT_CLIENT 权限。但是，当用户可以运行重置授权提供程序的 VQL 查询时，不会强制执行此操作。\n\n这允许可以运行任意 VQL 的用户（通常 表达式、格式字符串等方式进行输入验证。\n- 输出过滤：在程序输出处对输出数据进行严格的过滤和检查，确保输出数据符合预期的格式和类型，避免被攻击者截获和篡改。可以使用安全的输出过滤库等方式进行输出过滤。\n- 使用安全的编程模型：使用安全的编程模型，例如避免使用原生的缓冲区管理函数，使用安全的框架和库来处理输入数据和执行命令，避免缓冲区溢出漏洞。\n- 数据库加密和访问控制：对于敏感数据和命令，使用加密和访问控制措施，确保只有授权用户可以访问和执行命令，避免被攻击者窃取和篡改。\n- 定期更新和升级：定期更新和升级应用程序和库的版本，确保应用程序和库的最新版本包含了最新的安全补丁和修复措施，避免安全漏洞的出现和利用。\n- 安全审计和监控：定期对系统和应用程序进行安全审计和监控，及时发现和阻止潜在的安全漏洞和攻击，确保系统和数据的安全和可靠性。", "title": "如何预防经典缓冲区溢出"}], "cnvd_id": "", "cve_id": "CVE-2026-70465", "cvss": {"cvssv31": [{"source": "psirt@fortinet.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.1}]}, "cvss_score": 8.1, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-120", "description": "Fortinet FortiClientWindows 7.4.0 至 7.4.3、FortiClientWindows 7.2.0 至 7.2.11 中存在不检查输入大小的缓冲区复制（“经典缓冲区溢出”）漏洞，可能允许未经身份验证的攻击者更改或制作对目标主机的 DNS 响应，从而通过恶意数据包执行任意代码。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "经典缓冲区溢出", "kind_en": "不检查输入大小的缓冲区复制（“经典缓冲区溢出”）", "last_modified_time": "2026-08-12", "level": "High", "mps_id": "MPS-4vaq-e2y6", "poc": false, "poc_url": [], "published_time": "2026-08-12", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-4vaq-e2y6", "name": "https://www.oscs1024.com/hd/MPS-4vaq-e2y6"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-70465", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-70465"}, {"url": "https://fortiguard.fortinet.com/psirt/FG-IR-26-156", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-70465漏洞", "_translated": true, "_saved_at": "2026-08-12T16:51:49+00:00", "_first_saved_at": "2026-08-12T14:18:04+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-4vaq-e2y6"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-19594", "cvss": {"cvssv31": [{"source": "412d305a-227d-44f9-a262-a31ba44f2aea", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:H/A:H", "severity": "high", "base_score": 8.1}]}, "cvss_score": 8.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:H/A:H", "cwe": "CWE-141", "description": "1.13.0 之前的 Snowflake Python API (`snowflake.core`) 版本中输入清理不足，导致通过两个相关弱点进行混乱的代理权限升级：通过未编码的 `..` 标识符路径段进行路径遍历 (CWE-22)，以及通过查询字符串值中未编码的 `\u0026`/`#`/`=` 字符进行 HTTP 参数污染 (CWE-141)。有权访问基于 Snowflake.core 构建的下游应用程序的攻击者可以通过提供“..”作为对象名称来利用路径遍历，从而导致“snowflake.core”向父资源发出 REST 请求，或者通过将“\u0026”/“#”/“=”注入到自由格式名称字段中来利用参数污染，以覆盖对交换、克隆或重命名操作的限制——所有这些操作都在应用程序的特权会话下执行。成功利用该漏洞需要攻击者控制基于snowflake.core构建的应用程序中的标识符或对象名称字符串，并将其传递到更高权限的Snowflake会话下的“snowflake.core”（例如，EXECUTE AS OWNER存储过程、Streamlit应用程序或本机应用程序）。 Snowflake Python API 版本 1.13.0 中提供了该修复程序，该版本还解决了一些其他安全问题。用户必须手动升级。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "参数分隔符转义处理不恰当", "kind_en": "参数/参数分隔符的不正确中和", "last_modified_time": "2026-08-12", "level": "High", "mps_id": "MPS-lyni-ud47", "poc": false, "poc_url": [], "published_time": "2026-08-12", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-lyni-ud47", "name": "https://www.oscs1024.com/hd/MPS-lyni-ud47"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-19594", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-19594"}, {"url": "https://pypi.org/project/snowflake.core/1.13.0/", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-19594漏洞", "_translated": true, "_saved_at": "2026-08-12T12:55:01+00:00", "_first_saved_at": "2026-08-12T09:06:54+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-lyni-ud47"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2026-18961", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.1}]}, "cvss_score": 8.1, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-287", "description": "WordPress 的社交登录、密码、Magic Link 和电子邮件 OTP – VentraConnect 插件的无密码登录在 1.4.3 及之前的所有版本中都容易通过未经验证的提供商电子邮件绕过身份验证。这是因为插件信任 Spotify 的 /v1/me 端点返回的未经验证的电子邮件字段作为邮箱所有权的证明 - Generic::normalize_common() 将此值复制到规范化配置文件中，而不需要 email_verified 断言，而 User_Links::link_or_login_user() 随后将其直接传递给 get_user_by('email', $email) 并通过 wp_set_auth_cookie() 发出持久身份验证 cookie无需特定于提供商的验证电子邮件门、本地邮箱质询或登录批准步骤。这使得未经身份验证的攻击者可以通过受控的 Spotify OAuth 流程提供已知的目标电子邮件地址，以任何现有 WordPress 用户（包括管理员）身份登录，从而获得对该网站的完全管理访问权限。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "身份验证不当", "kind_en": "认证不当", "last_modified_time": "2026-08-12", "level": "High", "mps_id": "MPS-q6xk-i9n3", "poc": false, "poc_url": [], "published_time": "2026-08-12", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-q6xk-i9n3", "name": "https://www.oscs1024.com/hd/MPS-q6xk-i9n3"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-18961", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-18961"}, {"url": "https://developer.spotify.com/documentation/web-api/reference/get-current-users-profile", "name": ""}, rce_page": "https://www.oscs1024.com/hd/MPS-83q2-pfgw"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-49473", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-863", "description": "Cedar 授权中间件通过 req.originalUrl 匹配 Cedar action，而 Express 仅按 path 路由，导致攻击者可通过追加查询字符串使中间件评估宽松策略而 Express 仍执行受限制路由，从而绕过更严格的访问控制。\n受影响版本中，@cedar-policy/authorization-for-expressjs 在 src/index.ts 的 ExpressAuthorizationMiddleware 类中，getMatchedAction() 方法与 middleware() 方法均以 req.originalUrl 作为 currentUrl 进行 Cedar action 匹配。当应用对 /users 与 /users/{id} 等重叠路径前缀分别定义权限要求不同的 Cedar action 时，发送 GET /users/?x=1 会使中间件把 currentUrl 视为含 ?x=1 的字符串并匹配到 /users/{id} 这条宽松 action，而 Express 仍把请求路由到 /users 受限处理器，导致越权访问。\n修复版本中通过将 getMatchedAction() 与 middleware() 中 currentUrl 的来源从 req.originalUrl 替换为 req.path，使 Cedar action 匹配只依据路径部分而忽略查询字符串，确保中间件评估的 action 与 Express 实际路由的处理器一致，并新增回归测试验证对 /users/?x=1 等请求的拒绝行为。", "effects": [{"comp_name": "@cedar-policy/authorization-for-expressjs", "ecosystem": "npm", "versions": [{"affected_version": "(-∞,0.2.0]", "min_fixed_version": "", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-08-13", "level": "High", "mps_id": "MPS-fgbj-3n5w", "poc": false, "poc_url": [], "published_time": "2026-08-13", "reference_url_list": [{"url": "https://github.com/cedar-policy/authorization-for-expressjs/security/advisories/GHSA-g4w6-vmgf-xqvx", "name": ""}, {"url": "https://github.com/cedar-policy/authorization-for-expressjs/releases/tag/v0.3.0", "name": ""}, {"url": "https://github.com/advisories/GHSA-g4w6-vmgf-xqvx", "name": ""}], "scope_influence": "", "tags": ["npm", "开源"], "title": "Cedar Authorization for Express.js 授权绕过漏洞", "_translated": true, "_saved_at": "2026-08-13T01:23:34+00:00", "_first_saved_at": "2026-08-13T01:23:34+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-fgbj-3n5w"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-44741", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-89", "description": "Pimcore 的 Admin Classic Bundle 为 Pimcore 提供了后端 UI。 2.3.6 和 1.7.18 之前的版本在 Pimcore 的翻译网格日期过滤器中存在 SQL 注入漏洞 - 用户提供的过滤器 JSON 中的“property”字段会直接插入到“UNIX_TIMESTAMP(DATE(FROM_UNIXTIME(...)))”SQL 表达式中，而无需参数化或白名单验证。版本 2.3.6 和 1.7.18 修复了该问题。", "effects": [{"comp_name": "pimcore/admin-ui-classic-bundle", "ecosystem": "composer", "versions": [{"affected_version": "(-∞,1.7.18)", "min_fixed_version": "1.7.18", "repository": "composer", "solutions": [], "upstream": true}, {"affected_version": "[2.0.0-RC1,2.3.6)", "min_fixed_version": "2.3.6", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-08-13", "level": "High", "mps_id": "MPS-fz05-kor3", "poc": false, "poc_url": [], "published_time": "2026-08-13", "reference_url_list": [{"url": "https://github.com/pimcore/pimcore/security/advisories/GHSA-h4ph-crvj-9h92", "name": ""}, {"url": "https://github.com/pimcore/admin-ui-classic-bundle/pull/1111", "name": ""}, {"url": "https://github.com/pimcore/admin-ui-classic-bundle/commit/80e57a23d9e19574eddfe9b08e8f26785b2b0d90", "name": ""}, {"url": "https://github.com/pimcore/admin-ui-classic-bundle/releases/tag/v2.3.6", "name": ""}, {"url": "https://github.com/advisories/GHSA-h4ph-crvj-9h92", "name": ""}], "scope_influence": "", "tags": ["php", "开源"], "title": "Pimcore admin-ui-classic-bundle 翻译网格日期过滤器 SQL 注入漏洞", "_translated": true, "_saved_at": "2026-08-12T18:54:37+00:00", "_first_saved_at": "2026-08-12T18:54:37+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-fz05-kor3"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中 026-08-13T14:21:20+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-nt45-d3qz"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "cnvd_id": "", "cve_id": "CVE-2026-73293", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-269", "description": "Semaphore UI 是一个用于管理 DevOps 工具的 Web 界面。  在 2.18.19 之前以及从 2.19.0-alpha3 到 2.19.5-beta5，ProjectMiddleware 和 GetProjectOrGlobalRoleBySlug 允许项目经理使用 POST /api/project/{id}/roles 创建权限位掩码 15 的自定义经理角色，覆盖内置经理权限并授予 CanUpdateProject 和 CanManageProjectUsers 所有者功能。此问题已在版本 2.18.19 和 2.19.5-beta5 中修复。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-08-13", "level": "High", "mps_id": "MPS-tlc9-82rf", "poc": false, "poc_url": [], "published_time": "2026-08-13", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-tlc9-82rf", "name": "https://www.oscs1024.com/hd/MPS-tlc9-82rf"}, {" ttps://www.oscs1024.com/hd/MPS-u2wl-d7p1", "name": "https://www.oscs1024.com/hd/MPS-u2wl-d7p1"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-49467", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-49467"}, {"url": "https://github.com/smp46/pingvin-share-x/security/advisories/GHSA-59q6-jvp6-w282", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-49467漏洞", "_translated": true, "_saved_at": "2026-08-12T18:54:34+00:00", "_first_saved_at": "2026-08-12T18:54:34+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-u2wl-d7p1"}, {"analysis_status": 0, "articles": [{"content": "由于应用程序或系统中存在敏感信息未经适当保护而被泄露给攻击者或未经授权的用户，这些敏感信息可能包括用户凭据、个人身份信息、敏感业务数据、系统配置信息等。信息暴露漏洞通常是由于设计、实施或配置错误引起的，例如不正确的访问控制、弱密码策略、缺乏加密、错误的日志处理等。", "title": "什么是未授权敏感信息泄露"}, {"content": "- 直接访问敏感信息：攻击者可以通过直接访问不正确配置或不受保护的资源来获取敏感信息，如通过公开可访问的URL、未经授权的文件目录访问等。\n- 越权访问：攻击者可能利用访问控制错误或不正确的权限配置来获取他们没有权限访问的敏感信息。\n- 错误信息披露：应用程序在错误处理过程中可能泄露敏感信息，例如将错误消息中的敏感数据返回给客户端或显示在日志文件中。\n- 信息泄露通过响应：攻击者可能利用应用程序在响应中不正确地包含敏感信息，如通过网页源代码、响应头部或响应消息体中的敏感数据。", "title": "未授权敏感信息泄露常见的攻击方式"}, {"content": "- 访问控制：确保只有经过授权的用户能够访问敏感信息，使用强大的身份验证和授权机制。\n- 数据加密：对于敏感信息，使用适当的加密算法对数据进行加密，包括数据传输和存储过程中的加密。\n- 错误处理和日志安全：正确处理错误情况，避免在错误消息中暴露敏感信息。同时，确保日志记录功能的安全性，避免将敏感信息记录在日志文件中。\n- 安全配置和最佳实践：遵循安全最佳实践，对应用程序、服务器和系统进行适当的配置，包括访问控制、权限管理、密码策略等。\n- 审计和监控：实施日志审计和监控机制，及时检测和响应任何异常活动或潜在的信息暴露事件。\n- 安全开发实践：在应用程序开发过程中，进行安全代码审查、漏洞扫描和安全测试，以及敏感信息的正确处理和保护。", "title": "如何预防未授权敏感信息泄露"}], "cnvd_id": "", "cve_id": "CVE-2026-73622", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "high", "base_score": 7.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:
