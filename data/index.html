ache 软件基金会开源的跨语言 RPC 框架，其 Lua 绑定中的 THttpTransport 用于在 HTTP 协议上承载 Thrift 消息，默认以服务端模式解析收到的 HTTP 请求。\n受影响版本中，lib/lua/THttpTransport.lua 的 THttpTransport:_parseHeaders 对每个头部行调用 string.gmatch(line, \"([%w%-]+)%s*:%s*(.+)\")，该模式未锚定且字段名部分为贪婪匹配，当请求头部行包含长串字段名字符而缺少冒号分隔时，匹配需在行内多个起点间反复回溯，单行解析开销随行长呈平方级增长；远程攻击者向基于该传输层的 Thrift Lua HTTP 服务端发送携带此类头部行的请求，即可耗尽服务端 CPU 资源，造成拒绝服务。\n修复版本中通过改用 string.find(line, ':', 1, true) 纯文本搜索定位首个冒号，再对冒号前后两段分别使用锚定模式 \"^%s*([%w%-]+)(.*)\" 与 \"^%s*(.+)\" 各自单次匹配完成解析，头部解析开销降为线性，消除平方级回溯路径。", "effects": [{"comp_name": "thrift", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,0.25.0)", "min_fixed_version": "0.25.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "ReDoS", "kind_en": "正则表达式复杂性低效", "last_modified_time": "2026-10-02", "level": "High", "mps_id": "MPS-c228-9cb1", "poc": false, "poc_url": [], "published_time": "2026-10-02", "reference_url_list": [{"url": "http://www.mail-archive.com/announce@apache.org/msg12187.html", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-96292", "name": ""}, {"url": "https://github.com/apache/thrift/commit/93e33392b707502396c83d68c96d1c8e3aad4963", "name": ""}, {"url": "https://github.com/apache/thrift/releases/tag/v0.25.0", "name": ""}, {"url": "https://thrift.apache.org/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Apache Thrift Lua 正则回溯拒绝服务漏洞", "_translated": true, "_saved_at": "2026-10-02T13:27:41+00:00", "_first_saved_at": "2026-10-02T13:27:41+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-c228-9cb1"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-94637", "cvss": {"cvssv4": [{"source": "security@apache.org", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/A sis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-94653", "cvss": {"cvssv4": [{"source": "security@apache.org", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.2}]}, "cvss_score": 8.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-407", "description": "Apache Thrift 是 Apache 软件基金会开源的跨语言 RPC 框架，其 PHP 库提供帧式传输 TFramedTransport、内存缓冲 TMemoryBuffer 以及 HTTP 客户端传输 TCurlClient、TPsrHttpClient，用于 PHP 应用之间的远程调用通信。\n受影响版本中，TFramedTransport::read()、TMemoryBuffer::read()、TCurlClient::read() 与 TPsrHttpClient::read() 在返回 $len 字节后均以 substr() 对剩余缓冲区整体重新切片（如 $this-\u003erBuf = substr($this-\u003erBuf, $len)）。攻击者控制帧内容或 HTTP 响应体时，调用方按小块逐次读取一个大型缓冲区所需的 CPU 时间随其大小呈二次方增长，持续消耗 CPU 造成拒绝服务。\n修复版本中通过为各传输引入已读偏移量 $rPos、$responsePos，read() 改为从偏移量处 substr($buf, $pos, $len) 并仅推进偏移量，不再对剩余缓冲区重新切片，缓冲区在整体读完或写入时才压缩释放，小块读取的总耗时随数据量线性增长。", "effects": [{"comp_name": "apache/thrift", "ecosystem": "composer", "versions": [{"affected_version": "(-∞,0.25.0)", "min_fixed_version": "0.25.0", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "低效算法复杂性", "kind_en": "低效的算法复杂性", "last_modified_time": "2026-10-02", "level": "High", "mps_id": "MPS-ec78-0a32", "poc": false, "poc_url": [], "published_time": "2026-10-02", "reference_url_list": [{"url": "http://www.mail-archive.com/announce@apache.org/msg12147.html", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-94653", "name": ""}, {"url": "https://thrift.apache.org/", "name": ""}, {"url": "https://github.com/apache/thrift/commit/77188b02e299aacf112591012c4fc56f343f7e4e", "name": ""}, {"url": "https://github.com/apache/thrift/releases/tag/v0.25.0", "name": ""}], "scope_influence": "", "tags": ["php", "开源"], "title": "Apache Thrift PHP 拒绝服务漏洞", "_translated": true, "_saved_at": "2026-10-02T13:27:47+00:00", "_first_saved_at": "2026-10-02T13:27:47+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ec78-0a32"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能有效地控制资源的使用，导致攻击者可以利用这个漏洞耗尽应用程序所依赖的资源。这些资源可以是计算资源（CPU、内存）、网络带宽、数据库连接或其他系统资源。攻击者可以通过发送特制的请求、恶意输入或其他方式，使应用程序消耗大量资源，导致拒绝服务或系统崩溃。", "title": "什么是拒绝服务"}, {"content": "- 消耗计算资源：攻击者可以发送计算密集型的请求，例如复杂的计算、无限循环或递归操作，以耗尽应用程序的计算资源，导致应用程序无法响应其他请求。\r\n- 消耗内存资源：攻击者可以发送大量的数据或恶意输入，以导致应用程序消耗过多的内存资源，从而使系统的可用内存耗尽，并导致应用程序崩溃或变得不可用。\r\n- 消耗网络带宽：攻击者可以发送大量的请求或大型数据包，以消耗应用程序所依赖的网络带宽。这会导致其他合法用户无法正常访问应用程序或降低系统的整体网络性能。\r\n- 消耗存储资源：攻击者可以发送大量的请求或上传大文件，以耗尽应用程序的存储资源，导致系统无法处理其他请求或存储新的数据。", "title": "拒绝服务常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对输入数据进行合理的验证和过滤，防止恶意输入导致资源消耗过高。\r\n- 实施资源限制：应用程序应该实施适当的资源限制策略，例如限制计算操作的时间或次数，限制内存使用量，限制并发连接数等，以防止资源被耗尽。\r\n- 异常处理与错误恢复：应用程序应该具备健壮的异常处理和错误恢复机制，以防止因意外错误导致资源泄漏或无法释放的情况。\r\n- 资源监控与警报：应用程序应该实施适当的资源监控和警报机制，及时发现异常的资源消耗情况，并采取相应的措施来应对。\r\n- 压力测试与性能优化：应用程序应该进行压力测试，以评估其在高负载情况下的性能，并进行必要的性能优化，以确保能够有效地处理大量请求而不耗尽资源。", "title": "如何预防拒绝服务"}], "cnvd_id": "", "cve_id": "CVE-2026-103760", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "medium", "base_score": 5.9}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:H/AT:P/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.2}]}, "cvss_score": 8.2, "cvss_vector": "CVSS:4.0/AV:N/AC:H/AT:P/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-400", "description": "Mooncake 是 KVCache.ai 开源的面向大模型推理场景的 KV 缓存传输引擎，其 transfer engine 通过 P2P 握手守护进程承载 RDMA QP 建立、segment 元数据交换、notify 与 probe 等控制面交互。\n受影响版本中，mooncake::SocketHandShakePlugin::startDaemon 在单一监听线程内串行处理每个已接受连接，该套接字仅设置 SO_RCVTIMEO 而未设置 SO_SNDTIMEO，应答经 writeString 进入 writeFully 循环写且在 EAGAIN/EINTR 时无截止时间地重试；未认证攻击者向 handshake RPC 端口发送 Metadata 请求后停止读取应答，本地 segment 描述符体积随已注册缓冲区数量增长，大体积应答塞满发送缓冲区后监听线程永久阻塞在 write()，该引擎后续所有握手、元数据获取、notify 与 probe 请求全部停摆。\n修复版本中通过，可通过防火墙或安全组限制 handshake RPC 端口（默认 15000-17000 区间）仅允许可信对端访问，避免不可信主机直连；上游修复需为已接受套接字增加发送超时并将连接处理移出单一监听线程，方可切断该阻塞链，修复版本发布后应及时升级。", "effects": [{"comp_name": "mooncake-transfer-engine", "ecosystem": "pip", "versions": [{"affected_version": "(-∞,0.3.13.post1]", "min_fixed_version": "", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "拒绝服务", "kind_en": "不受控制的资源消耗", "last_modified_time": "2026-10-02", "level": "High", "mps_id": "MPS-fnhl-ixe9", "poc": false, "poc_url": [], "published_time": "2026-10-02", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-fnhl-ixe9", "name": "https://www.oscs1024.com/hd/MPS-fnhl-ixe9"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-103760", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-103760"}, {"url": "https://github.com/kvcache-ai/Mooncake/issues/4443", "name": "GitHub Issue #4443"}, {"url": "https://github.com/kvcache-ai/Mooncake/blob/719735896c86b56fabec6cf3e825fb2ea640597a/mooncake-transfer-engine/src/transfer_metadata_plugin.cpp#L730-L803", "name": ""}, {"url": "https://github.com/kvcache-ai/Mooncake", "name": ""}, {"url": "https://www.vulncheck.com/advisories/mooncake-transfer-engine-through-0.3.13-post1-denial-of-service-via-p2p-handshake-daemon-response-write", "name": "VulnCheck Advisory: Mooncake transfer engine through 0.3.13.post1 Denial of Service via P2P Handshake Daemon Response Write"}], "scope_influence": "", "tags": ["AI", "python", "开源"], "title": "Mooncake 握手守护进程拒绝服务漏洞", "_translated": true, "_saved_at": "2026-10-02T00:25:50+00:00", "_first_saved_at": "2026-10-02T00:25:50+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-fnhl-ixe9"}, {"analysis_status": 0, "articles": [{"content": "- 程序未正确处理用户上传的文件，从而导致程序可以读取、处理或存储未经授权的文件\n", "title": "什么是任意文件上传"}, {"content": "- 欺骗攻击：攻击者可以通过发送伪造的文件来欺骗程序，从而导致程序读取、处理或存储未经授权的文件。\n- 文件格式攻击：攻击者可以通过选择特定的文件格式，例如压缩文件或 ZIP 文件，从而利用上传的文件来篡改程序的执行结果或窃取程序中的重要数据。\n", "title": "任意文件上传常见的攻击方式"}, {"content": "- 使用安全文件传输协议 (FTP):使用安全 FTP 协议可以确保上传的文件格式、大小、权限等符合预期，同时可以防止文件读取、篡改或存储漏洞。\n- 使用文件上传过滤器：使用文件上传过滤器可以过滤上传的文件，以确保文件的格式、大小、权限等符合预期，同时可以防止文件读取、篡改或存储漏洞。\n- 使用白名单机制：使用白名单机制可以只允许特定的文件格式、大小、权限等存在的文件上传，从而防止非法文件的上传和攻击。\n- 定期更新和升级程序：定期更新和升级程序可以修复已知的漏洞，并增强程序的安全性。", "title": "如何预防任意文件上传"}], "cnvd_id": "", "cve_id": "CVE-2026-92820", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.1}]}, "cvss_score": 8.1, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-434", "description": "Ninja Forms - File Uploads 是 Saturday Drive 开发的 WordPress 商业表单插件 Ninja Forms 的文件上传扩展，用于为表单提供文件上传与外部存储能力，支持 Amazon S3、Dropbox、Google Drive 等外部对象存储，该扩展以闭源商业形式分发。\n受影响版本中，表单提交流程直接信任攻击者提交的上传文件路径并将其存储为上传记录的 file_path，该路径随后在未经校验的情况下被多个环节使用：通知邮件动作按该路径附加文件，形成任意文件读取；外部存储流程从远端取回内容并写入该路径，形成任意文件写入，在配置了外部存储的站点上可进一步导致远程代码执行；计划任务按该路径删除临时文件，形成任意文件删除。未认证攻击者可在服务器上读取、写入或删除任意文件。\n修复版本中通过将插件升级至 3.3.35 消除该问题，官方在 3.3.35 中修正了提交文件路径被直接信任的处理方式，使用外部文件上传（Amazon S3）动作的站点应尽快升级，以切断任意文件读取、写入与删除的利用链路。", "effects": [{"comp_name": "ninja-forms-uploads", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,3.3.35)", "min_fixed_version": "3.3.35", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "任意文件上传", "kind_en": "危险类型文件无限制上传", "last_modified_time": "2026-10-02", "level": "High", "mps_id": "MPS-2ahf-3e74", "poc": false, "poc_url": [], "published_time": "2026-10-02", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-2ahf-3e74", "name": "https://www.oscs1024.com/hd/MPS-2ahf-3e74"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-92820", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-92820"}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/6d5f0ec1-abcb-4aa2-a130-53682fa13f00?source=cve", "name": ""}, {"url": "https://ninjaforms.com/extensions/file-uploads/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Ninja Forms任意文件操作漏洞", "_translated": true, "_saved_at": "2026-10-02T06:33:48+00:00", "_first_saved_at": "2026-10-02T06:33:48+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-2ahf-3e74"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2025-71427", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:R/S:U/C:H/I:H/A:N", "severity": "medium", "base_score": 6.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:H/AT:P/PR:N/UI:P/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N .wordpress.org/browser/so-widgets-bundle/tags/1.73.1/widgets/price-table/price-table.php#L332", "name": ""}, {"url": "https://plugins.trac.wordpress.org/changeset/3605767/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "SiteOrigin Widgets Bundle 本地文件包含漏洞", "_translated": true, "_saved_at": "2026-10-02T06:33:47+00:00", "_first_saved_at": "2026-10-02T06:33:47+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-e4k8-u5i0"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能有效地控制资源的使用，导致攻击者可以利用这个漏洞耗尽应用程序所依赖的资源。这些资源可以是计算资源（CPU、内存）、网络带宽、数据库连接或其他系统资源。攻击者可以通过发送特制的请求、恶意输入或其他方式，使应用程序消耗大量资源，导致拒绝服务或系统崩溃。", "title": "什么是拒绝服务"}, {"content": "- 消耗计算资源：攻击者可以发送计算密集型的请求，例如复杂的计算、无限循环或递归操作，以耗尽应用程序的计算资源，导致应用程序无法响应其他请求。\r\n- 消耗内存资源：攻击者可以发送大量的数据或恶意输入，以导致应用程序消耗过多的内存资源，从而使系统的可用内存耗尽，并导致应用程序崩溃或变得不可用。\r\n- 消耗网络带宽：攻击者可以发送大量的请求或大型数据包，以消耗应用程序所依赖的网络带宽。这会导致其他合法用户无法正常访问应用程序或降低系统的整体网络性能。\r\n- 消耗存储资源：攻击者可以发送大量的请求或上传大文件，以耗尽应用程序的存储资源，导致系统无法处理其他请求或存储新的数据。", "title": "拒绝服务常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对输入数据进行合理的验证和过滤，防止恶意输入导致资源消耗过高。\r\n- 实施资源限制：应用程序应该实施适当的资源限制策略，例如限制计算操作的时间或次数，限制内存使用量，限制并发连接数等，以防止资源被耗尽。\r\n- 异常处理与错误恢复：应用程序应该具备健壮的异常处理和错误恢复机制，以防止因意外错误导致资源泄漏或无法释放的情况。\r\n- 资源监控与警报：应用程序应该实施适当的资源监控和警报机制，及时发现异常的资源消耗情况，并采取相应的措施来应对。\r\n- 压力测试与性能优化：应用程序应该进行压力测试，以评估其在高负载情况下的性能，并进行必要的性能优化，以确保能够有效地处理大量请求而不耗尽资源。", "title": "如何预防拒绝服务"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-86344", "cvss": {"cvssv31": [{"source": "secalert@redhat.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-400", "description": "389 Directory Server（389-ds-base）是 Red Hat 主导开发的开源 LDAP 目录服务器组件，以 C 语言实现，随 Red Hat Directory Server 与 Red Hat Enterprise Linux 以软件包形式分发，用于为网络客户端提供目录查询与认证服务。\n受影响版本中，工作线程在 connection_read_operation() 中读取 LDAPMessage 期间始终持有连接互斥锁 c_mutex；当同一连接先发送一个完整 LDAP 操作、随后跟随第二个不完整报文的起始字节时，该操作虽然完成，连接却因读缓冲区仍有数据被重新排队，第二个工作线程随后在 PR_Poll() 中等待剩余字节并持续持有 c_mutex，使第一个线程无法获得锁以刷写已完成操作的结果；每个此类连接占用一个工作线程直至 nsslapd-ioblocktimeout 超时，未认证远程攻击者以与线程池规模成比例的少量连接重复上述模式，可在默认配置下耗尽全部工作线程，导致所有客户端（匿名与已认证、明文与 TLS）无法获得服务。\n修复版本中通过在 connection_read_operation() 阻塞于 PR_Poll() 期间释放 c_mutex，并新增每连接读锁 c_readmutex 保证同一 PDU 仅由单个工作线程装配，在重新获取 c_mutex 后校验连接是否已关闭，同时按 c_readmutex、c_mutex、c_pdumutex 的顺序加锁以避免与 flush_ber() 死锁，使已完成操作的结果可及时刷写，切断了工作线程池耗尽的路径。", "effects": [{"comp_name": "389-ds-base", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,3.3.1]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "拒绝服务", "kind_en": "不受控制的资源消耗", "last_modified_time": "2026-10-02", "level": "High", "mps_id": "MPS-hqzu-ysgi", "poc": false, "poc_url": [], "published_time": "2026-10-02", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-hqzu-ysgi", "name": "https://www.oscs1024.com/hd/MPS-hqzu-ysgi"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-86344", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-86344"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-86344", "name": ""}, {"url": "https://bugzilla.redhat.com/show_bug.cgi?id=2529329", "name": "RHBZ#2529329"}], "scope_influence": "", "tags": ["应用软件"], "title": "389-ds-base 拒绝服务漏洞", "_translated": true, "_saved_at": "2026-10-02T00:25:53+00:00", "_first_saved_at": "2026-10-02T00:25:53+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-hqzu-ysgi"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-71452", "cvss": {"cvssv4": [{"source": "productsecurity@jci.com", "vector": "CVSS:4.0/AV:A/AC:L/AT:N/PR:H/UI:N/VC:L/VI:L/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:4.0/AV:A/AC:L/AT:N/PR:H/UI:N/VC:L/VI:L/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-78", "description": "Johnson Controls EasyIO FS32（FS-32）是商业闭源的可编程楼宇自动化网络控制器，用于商业与工业设施中暖通空调、照明与能源管理等楼宇功能的自动化管理，并可直接接入传感器与执行器。\n受影响版本中，该控制器固件存在操作系统命令注入漏洞（CWE-78），外部输入可进入操作系统命令执行流程并在控制器上执行任意命令；官方 CVSS v4.0 评级（AV:A/PR:H/UI:N）表明利用需接入与控制器相邻的网络并持有设备高权限账户，无需用户交互，成功利用后会进一步危及所接入楼宇自动化系统的机密性、完整性与可用性。\n修复版本中通过 3.0b63 固件消除该命令注入风险，官方记录将受影响范围限定为 3.0b63 之前版本，3.0b63 及以上版本不受影响；固件闭源，公开资料未披露具体修复代码。", "effects": [{"comp_name": "easyio_fs32", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,3.0b63)", "min_fixed_version": "3.0b63", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-10-02", "level": "High", "mps_id": "MPS-3m6z-kdb2", "poc": false, "poc_url": [], "published_time": "2026-10-02", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-3m6z-kdb2", "name": "https://www.oscs1024.com/hd/MPS-3m6z-kdb2"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-71452", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-71452"}, {"url": "https://www.johnsoncontrols.com/trust-center/cybersecurity/security-advisories", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "EasyIO FS32命令注入漏洞", "_translated": true, "_saved_at": "2026-10-02T00:25:54+00:00", "_first_saved_at": "2026-10-02T00:25:54+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-3m6z-kdb2"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-90438", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "cwe": "CWE-79", "description": "Ninja Forms 是 WordPress 官方插件目录中的开源表单构建插件（GPLv2 授权），用于搭建联系表单、问卷与计算器表单，提交数据保存在站点自身的数据库中。\n受影响版本中，未登录访问者通过 nf_ajax_submit AJAX 接口进入 includes/AJAX/Controllers/Submission.php 的 NF_AJAX_Controllers_Submission::submit()，当表单中的 Paragraph Text 字段开启 Show Rich Text Editor（textarea_rte）选项时，其提交值按富文本处理，经 includes/Helper.php 的 encode_submission_value 以 wp_kses_post 白名单过滤入库而未做完整转义；管理员打开后台 Submissions 提交编辑页时，前端文件 build/submissions.js 将该字段的存储值赋给 div.innerHTML 再读取 textContent，注入的网页脚本在该页面被访问时执行。\n修复版本中通过把富文本字段值的 HTML 剥离改为由 DOMParser 在独立惰性文档中解析并只读取 textContent（3.15.5，2026-09-28 发布），不再向 innerHTML 写入攻击者可控内容，查看提交页面时注入脚本无法执行。", "effects": [{"comp_name": "ninja-forms", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,3.15.5)", "min_fixed_version": "3.15.5", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-10-02", "level": "High", "mps_id": "MPS-cxqe-yrna", "poc": false, "poc_url": [], "published_time": "2026-10-02", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-cxqe-yrna", "name": "https://www.oscs1024.com/hd/MPS-cxqe-yrna"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-90438", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-90438"}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/a159485d-ce5b-46e7-8e63-a72012ccc180?source=cve", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/ninja-forms/tags/3.15.3/build/submissions.js#L1", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/ninja-forms/tags/3.15.3/includes/Helper.php#L261", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/ninja-forms/tags/3.15.3/includes/Database/Models/Submission.php#L308", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/ninja-forms/tags/3.15.3/includes/AJAX/Controllers/Submission.php#L61", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/ninja-forms/tags/3.15.2/build/submissions.js#L1", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/ninja-forms/tags/3.15.2/includes/Helper.php#L261", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/ninja-forms/tags/3.15.2/includes/Database/Models/Submission.php#L308", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/ninja-forms/tags/3.15.2/includes/AJAX/Controllers/Submission.php#L61", "name": ""}, {"url": "https://plugins.trac.wordpress.org/changeset?reponame=\u0026new=3717122%40ninja-forms%2Ftags%2F3.15.5\u0026old=3705719%40ninja-forms%2Ftags%2F3.15.4", "name": ""}, {"url": "https://plugins.trac.wordpress.org/changeset/3717122/ninja-forms/trunk/includes/AJAX/Controllers/Submission.php", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Ninja Forms 存储型 XSS", "_translated": true, "_saved_at": "2026-10-02T06:33:49+00:00", "_first_saved_at": "2026-10-02T06:33:49+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-cxqe-yrna"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-82358", "cvss": {"cvssv31": [{"source": "9119a7d8-5eab-497f-8521-727c672e3725", "vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:U/C:N/I:H/A:N", "severity": "medium", "base_score": 6.5}], "cvssv4": [{"source": "9119a7d8-5eab-497f-8521-727c672e3725", "vector": "CVSS:4.0/AV:A/AC:L/AT:N/PR:N/UI:N/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:A/AC:L/AT:N/PR:N/UI:N/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-863", "description": "C-Open 是 RT-Labs AB 开源的嵌入式 CANopen 协议栈，以 C 语言实现，提供 NMT、SDO、PDO、心跳与紧急报文等服务，其中 SDO 服务器负责响应 CAN 总线上其他节点对对象字典（OD）的读写访问。\n受影响版本中，SDO 服务器处理下载段请求的 co_sdo_rx_download_seg_req 未校验当前任务类型，攻击者先对大于 64 位的只读 OD 条目发起 SDO 上传初始请求，使 CO_JOB_SDO_UPLOAD 任务的 sdo.data 指针指向只读对象的存储区，再发送下载段帧触发 memcpy 写入；由于 OD_WRITE 权限检查只存在于 co_sdo_rx_download_init_req 中，该写入不经过任何权限校验，CAN 总线上的任意未认证节点只需两帧 SDO 报文便能篡改设备的只读对象字典条目。\n修复版本中通过在 co_sdo_rx_download_seg_req 与 co_sdo_rx_upload_seg_req 入口增加任务类型校验，任务类型不匹配时返回 CO_SDO_ABORT_ACCESS 中止会话，切断了利用上传会话残留数据指针写入内存的路径，使只读 OD 条目在分段传输场景下无法被写入。", "effects": [{"comp_name": "c-open", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.1.1)", "min_fixed_version": "1.1.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": 指针取消引用错误来执行任意的代码，进而获取系统控制权或执行未经授权的操作。", "title": "空指针取消引用常见的攻击方式"}, {"content": "- 指针初始化和验证：开发者应该正确地初始化指针，并在使用指针之前进行有效的验证，确保指针不为空。在取消引用指针之前，应始终检查其是否为空。\r\n- 异常处理和错误恢复：程序应该具备健壮的异常处理和错误恢复机制，以便在发生空指针取消引用错误时能够适当地处理异常，而不是导致程序崩溃或暴露敏感信息。\r\n- 防御性编程：采用防御性编程的原则，如避免在未经验证的指针上进行操作，避免使用未初始化的指针等，以防止空指针取消引用错误的发生。\r\n- 静态代码分析和测试：使用静态代码分析工具和测试技术来检测和识别潜在的空指针取消引用错误。这些工具可以帮助发现代码中可能存在的空指针问题，并及时修复。\r\n- 强制性编码标准和最佳实践：制定强制性的编码标准和最佳实践，包括良好的指针使用和管理规范，以帮助开发者编写更可靠、安全的代码。", "title": "如何预防空指针取消引用"}], "cnvd_id": "", "cve_id": "CVE-2026-82357", "cvss": {"cvssv31": [{"source": "9119a7d8-5eab-497f-8521-727c672e3725", "vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "medium", "base_score": 6.5}], "cvssv4": [{"source": "9119a7d8-5eab-497f-8521-727c672e3725", "vector": "CVSS:4.0/AV:A/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:A/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-476", "description": "RT-Labs C-Open 是瑞典 RT-Labs AB 开源的嵌入式 CANopen 协议栈，采用 C 语言实现并以 GPLv3 与商业许可双授权，用于在微控制器上构建 CANopen 节点，涵盖 NMT、SDO、PDO、EMCY 与 LSS 等协议模块。\n受影响版本中，LSS 模块处理身份查询报文时，co_lss_inquire_identity 函数将 co_entry_find 在身份对象 0x1018 中查找子索引的结果直接传入 co_od_get_value，未检查该结果是否为空；当用户应用程序定义的对象字典缺少身份对象 0x1018 的必需子索引（子索引 1 至 4）时，能够访问 CAN 总线的攻击者先发送 LSS 全局切换命令使设备进入配置状态，再发送查询厂商 ID、产品码、修订号或序列号的报文，随后触发空指针解引用，导致设备崩溃。\n修复版本中通过新增 co_lss_identity_get 对子索引查找结果判空，缺失子索引时以 UINT32_MAX 作为返回值，同时 co_lss_inquire_identity 拒绝超出合法范围的查询命令，co_lss_init 在初始化阶段校验身份对象 0x1018 及其子索引 1 至 4 完整存在，切断了空指针解引用路径。", "effects": [{"comp_name": "c-open", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.1.1)", "min_fixed_version": "1.1.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "空指针取消引用", "kind_en": "空指针取消引用", "last_modified_time": "2026-10-02", "level": "High", "mps_id": "MPS-ueds-jvax", "poc": false, "poc_url": [], "published_time": "2026-10-02", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ueds-jvax", "name": "https://www.oscs1024.com/hd/MPS-ueds-jvax"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-82357", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-82357"}, {"url": "https://rt-labs.com/wp-content/uploads/2026/09/RRTL-260929-01.pdf", "name": "url"}, {"url": "https://github.com/rtlabs-com/c-open/releases/tag/public%2Fv1.1.1", "name": "url"}, {"url": "https://raw.githubusercontent.com/cisagov/CSAF/develop/csaf_files/IT/white/2025/va-26-275-02.json", "name": "url"}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-82357", "name": "url"}], "scope_influence": "", "tags": ["应用软件"], "title": "C-Open LSS 空指针解引用漏洞", "_translated": true, "_saved_at": "2026-10-01T20:43:56+00:00", "_first_saved_at": "2026-10-01T20:43:56+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ueds-jvax"}]}</script>
  <script>
    const payload = JSON.parse(document.getElementById("payload").textContent);
    const levelLabels = payload.level_labels || {};
    const items = payload.items || [];
    let filtered = items.slice();
    let activeId = null;

    const $ = (id) => document.getElementById(id);
    $("generatedAt").textContent = payload.generated_at || "-";
    $("retention").textContent = payload.retention_days ?? "-";
    $("cutoff").textContent = payload.cutoff_date || "-";
    $("count").textContent = String(payload.count ?? items.length);

    function levelClass(level) {
      const cn = levelLabels[level] || level || "";
      if (level === "Critical" || cn === "严重") return "crit";
      if (level === "High" || cn === "高危") return "high";
      return "other";
    }
    function levelText(level) {
      return levelLabels[level] || level || "-";
    }
    function esc(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }
    function scoreText(v) {
      if (v === null || v === undefined || v === "" || v === -1) return "-";
      return String(v);
    }

    function renderList() {
      const list = $("list");
      $("listCount").textContent = String(filtered.length);
      if (!filtered.length) {
        list.innerHTML = '<div class="empty">没有匹配项</div>';
        return;
      }
      list.innerHTML = filtered.map((it) => {
        const id = it.mps_id || it.cve_id;
        const active = id === activeId ? " active" : "";
        return `
          <button class="item${active}" data-id="${esc(id)}" type="button">
            <div class="item-top">
              <span class="cve">${esc(it.cve_id || it.mps_id || "-")}</span>
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
            </div>
            <div class="title">${esc(it.title || "-")}</div>
            <div class="item-foot">
              <span>CVSS ${esc(scoreText(it.cvss_score))}</span>
              <span>${esc(it.published_time || "-")}</span>
              ${it.poc ? "<span>POC</span>" : ""}
            </div>
          </button>`;
      }).join("");
      list.querySelectorAll(".item").forEach((btn) => {
        btn.addEventListener("click", () => selectById(btn.dataset.id));
      });
    }

    function refsHtml(it) {
      const refs = Array.isArray(it.reference_url_list) ? it.reference_url_list : [];
      const links = [];
      if (it._source_page) links.push({ url: it._source_page, name: "OSCS 详情" });
      if (it.cve_id) links.push({ url: `https://nvd.nist.gov/vuln/detail/${it.cve_id}`, name: "NVD" });
      refs.forEach((r) => {
        if (r && r.url) links.push({ url: r.url, name: r.name || r.url });
      });
      const seen = new Set();
      const uniq = [];
      for (const l of links) {
        if (seen.has(l.url)) continue;
        seen.add(l.url);
        uniq.push(l);
      }
      if (!uniq.length) return '<div class="box">无参考链接</div>';
      return `<div class="refs">${uniq.map((l) =>
        `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name || l.url)}</a>`
      ).join("")}</div>`;
    }

    function articlesHtml(it) {
      const arts = Array.isArray(it.articles) ? it.articles : [];
      if (!arts.length) return "";
      return `<div class="section"><h3>相关说明</h3>${arts.map((a) => `
        <div class="article">
          <h4>${esc(a.title || "说明")}</h4>
          <p>${esc(a.content || "")}</p>
        </div>`).join("")}</div>`;
    }

    function renderDetail(it) {
      const detail = $("detail");
      if (!it) {
        detail.innerHTML = '<div class="empty">暂无数据</div>';
        return;
      }
      const pocUrls = Array.isArray(it.poc_url) ? it.poc_url : [];
      detail.innerHTML = `
        <div class="d-head">
          <div>
            <h1 class="d-title">${esc(it.title || "-")}</h1>
            <div class="ids">
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
              <span class="chip">${esc(it.cve_id || "无 CVE")}</span>
              <span class="chip">${esc(it.mps_id || "-")}</span>
              ${it.poc ? '<span class="chip">有 POC</span>' : ""}
              ${it.exp ? '<span class="chip">有 EXP</span>' : ""}
            </div>
          </div>
          <div class="actions">
            ${it._source_page ? `<a class="btn" href="${esc(it._source_page)}" target="_blank" rel="noopener">OSCS</a>` : ""}
            ${it.cve_id ? `<a class="btn" href="https://nvd.nist.gov/vuln/detail/${esc(it.cve_id)}" target="_blank" rel="noopener">NVD</a>` : ""}
          </div>
        </div>
        <div class="grid">
          <div class="stat"><div class="k">CVSS</div><div class="v">${esc(scoreText(it.cvss_score))}</div></div>
          <div class="stat"><div class="k">向量</div><div class="v">${esc(it.cvss_vector || "-")}</div></div>
          <div class="stat"><div class="k">CWE</div><div class="v">${esc(it.cwe || "-")}</div></div>
          <div class="stat"><div class="k">类型</div><div class="v">${esc(it.kind || it.kind_en || "-")}</div></div>
          <div class="stat"><div class="k">公开</div><div class="v">${esc(it.published_time || "-")}</div></div>
          <div class="stat"><div class="k">利用成本</div><div class="v">${esc(it.exploit_requirement_cost || "-")}</div></div>
          <div class="stat"><div class="k">可利用性</div><div class="v">${esc(it.exploitability || "-")}</div></div>
          <div class="stat"><div class="k">修复建议</div><div class="v">${esc(it.fix_suggestion || "-")}</div></div>
        </div>
        <div class="section"><h3>描述</h3><div class="box">${esc(it.description || "无描述")}</div></div>
        ${it.scope_influence ? `<div class="section"><h3>影响范围</h3><div class="box">${esc(it.scope_influence)}</div></div>` : ""}
        ${pocUrls.length ? `<div class="section"><h3>POC 链接</h3><div class="refs">${pocUrls.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join("")}</div></div>` : ""}
        <div class="section"><h3>参考链接</h3>${refsHtml(it)}</div>
        ${articlesHtml(it)}
      `;
    }

    function selectById(id) {
      const it = filtered.find((x) => (x.mps_id || x.cve_id) === id) ||
                 items.find((x) => (x.mps_id || x.cve_id) === id);
      if (!it) return;
      activeId = it.mps_id || it.cve_id;
      renderList();
      renderDetail(it);
      const btn = document.querySelector(`.item[data-id="${CSS.escape(activeId)}"]`);
      if (btn) btn.scrollIntoView({ block: "nearest" });
      history.replaceState(null, "", "#" + encodeURIComponent(activeId));
    }

    function applyFilter(q) {
      const query = (q || "").trim().toLowerCase();
      filtered = !query ? items.slice() : items.filter((it) => {
        const blob = [
          it.cve_id, it.mps_id, it.title, it.kind, it.kind_en, it.cwe, it.description, it.level
        ].map((x) => String(x || "").toLowerCase()).join(" ");
        return blob.includes(query);
      });
      renderList();
      if (filtered.length) {
        const still = filtered.some((x) => (x.mps_id || x.cve_id) === activeId);
        selectById(still ? activeId : (filtered[0].mps_id || filtered[0].cve_id));
      } else {
        activeId = null;
        renderDetail(null);
      }
    }

    $("search").addEventListener("input", (e) => applyFilter(e.target.value));

    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement !== $("search")) {
        e.preventDefault();
        $("search").focus();
        return;
      }
      if (!filtered.length) return;
      const idx = filtered.findIndex((x) => (x.mps_id || x.cve_id) === activeId);
      if (e.key === "ArrowDown") {
        e.preventDefault();
        const next = filtered[Math.min(filtered.length - 1, Math.max(0, idx) + 1)];
        selectById(next.mps_id || next.cve_id);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        const prev = filtered[Math.max(0, idx - 1)];
        selectById(prev.mps_id || prev.cve_id);
      }
    });

    const hashId = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    if (hashId && items.some((x) => (x.mps_id || x.cve_id) === hashId)) {
      activeId = hashId;
      renderList();
      selectById(hashId);
    } else if (items.length) {
      selectById(items[0].mps_id || items[0].cve_id);
    } else {
      renderList();
      renderDetail(null);
    }
  </script>
</body>
