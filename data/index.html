"CVE-2026-61572 漏洞", "_translated": true, "_saved_at": "2026-10-28T23:48:04+00:00", "_first_saved_at": "2026-10-28T23:48:04+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-mjsi-4n28"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-118245", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:N/SC:L/SI:L/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:N/SC:L/SI:L/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-79", "description": "Highcharts JS 是一个基于 SVG 的 JavaScript 图表库。从 1.0.0 到 4.2.2，Highcharts Dashboards 使用 ChartConstructor 作为 Highcharts 命名空间中的未经检查的属性查找，并使用组件容器和 ChartOptions 调用选定的成员。控制仪表板配置的攻击者可以选择公共实用程序函数而不是受支持的图表构造函数，从而导致攻击者控制的选项作为属性或属性复制到容器中。当板呈现时，标记和事件处理程序可以在托管页面源中执行。除了渲染板之外不需要用户交互。此问题已在 4.2.2 中修复。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-10-29", "level": "High", "mps_id": "MPS-oszb-lve6", "poc": false, "poc_url": [], "published_time": "2026-10-29", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-oszb-lve6", "name": "https://www.oscs1024.com/hd/MPS-oszb-lve6"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-118245", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-118245"}, {"url": "https://github.com/highcharts/highcharts/commit/98d3652cdc4f66fbccbbb8b4184ecd8f647f74de", "name": ""}, {"url": "https://github.com/highcharts/highcharts/releases/tag/dashboards-v4.2.2", "name": ""}, {"url": "https://github.com/highcharts/highcharts/security/advisories/GHSA-grj7-r4jv-pw9j", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-118245漏洞", "_translated": true, "_saved_at": "2026-10-28T19:14:50+00:00", "_first_saved_at": "2026-10-28T19:14:50+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-oszb-lve6"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-39736", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:N/A:L", "severity": "high", "base_score": 8.5}]}, "cvss_score": 8.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:N/A:L", "cwe": "CWE-89", "description": "JetEngine 是 Crocoblock 开发的 WordPress 商业插件，用于构建动态内容、自定义内容类型、列表展示与查询构建器等站点功能，采用闭源商业分发，不公开源码。\n受影响版本中，jet-engine 插件对进入 SQL 语句的特殊元素缺乏正确中和，拥有 Contributor 及以上权限的已认证用户能够将恶意输入注入插件构造的数据库查询，形成 SQL 注入并读取数据库中的敏感数据，官方记录确认影响 n/a 至 3.9.0.1 的全部版本。\n修复版本中通过官方 3.9.0.2 版本发布的安全更新消除上述注入路径，Patchstack 公告确认 3.9.0.2 为修复版本，用户应将插件升级至 3.9.0.2 或更高版本以消除 SQL 注入风险。", "effects": [{"comp_name": "jet-engine", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,3.9.0.1)", "min_fixed_version": "3.9.0.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-10-29", "level": "High", "mps_id": "MPS-uejc-m2o3", "poc": false, "poc_url": [], "published_time": "2026-10-29", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-uejc-m2o3", "name": "https://www.oscs1024.com/hd/MPS-uejc-m2o3"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-39736", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-39736"}, {"url": "http 文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-93851", "cvss": {"cvssv31": [{"source": "responsibledisclosure@mattermost.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:R/S:C/C:H/I:H/A:H", "severity": "high", "base_score": 8}]}, "cvss_score": 8, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:R/S:C/C:H/I:H/A:H", "cwe": "CWE-22", "description": "Mattermost 版本 11.9.x \u003c= 11.9.1、11.8.x \u003c= 11.8.5、11.7.x \u003c= 11.7.10 无法验证 Agents 插件提及提醒组件中的目标帖子 ID，这使得经过身份验证的用户可以在系统管理员可见的频道中发帖，从而导致管理员的浏览器发送意外的 API 请求，从而导致替换已安装的插件并执行代码在服务器上，通过精心制作的帖子，其中包含管理员点击的伪造提及提醒。 Mattermost 咨询 ID：MMSA-2026-00742", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-10-29", "level": "High", "mps_id": "MPS-te95-i24q", "poc": false, "poc_url": [], "published_time": "2026-10-29", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-te95-i24q", "name": "https://www.oscs1024.com/hd/MPS-te95-i24q"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-93851", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-93851"}, {"url": "https://mattermost.com/security-updates", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-93851漏洞 NION 结果通过“streamers_id”公开，而失败则返回渲染的查询和 MariaDB 错误。攻击者可以读取任意编码器数据库数据，包括存储的上游流式传输凭据、白名单配置和队列记录，而无需编码器凭据。 mysqli 驱动程序不允许使用堆叠语句，并且测试的数据库帐户缺乏全局 FILE 权限，因此演示的向量仅限于读取而不是服务器端文件写入。被盗的流式传输凭据可以提供持续的上游访问，直到轮换为止。此问题已在版本 8.1.0 中修复。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-10-29", "level": "High", "mps_id": "MPS-abkm-lvts", "poc": false, "poc_url": [], "published_time": "2026-10-29", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-abkm-lvts", "name": "https://www.oscs1024.com/hd/MPS-abkm-lvts"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-61569", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-61569"}, {"url": "https://github.com/WWBN/AVideo-Encoder/commit/8a6e2b8aedb87702656636d3fc8d9e26e559a762", "name": ""}, {"url": "https://github.com/WWBN/AVideo-Encoder/releases/tag/v8.1.0", "name": ""}, {"url": "https://github.com/WWBN/AVideo-Encoder/security/advisories/GHSA-2rrq-xf8q-3qpf", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-61569 漏洞", "_translated": true, "_saved_at": "2026-10-29T03:55:16+00:00", "_first_saved_at": "2026-10-28T23:48:00+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-abkm-lvts"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-111417", "cvss": {"cvssv31": [{"source": "14984358-7092-470d-8f34-ade47a7658a2", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "cwe": "CWE-639", "description": "由于提交的转换文档使用共享令牌，福昕官方网站的 HTML 到 PDF 转换服务存在访问控制漏洞。这可能允许未经授权的用户访问其他用户提交的文档。", "effects": [{"comp_name": "foxit.com", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,before2026-10-29]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "通过用户控制密钥绕过授权机制", "kind_en": "通过用户控制的密钥绕过授权", "last_modified_time": "2026-10-29", "level": "High", "mps_id": "MPS-ctyv-ehqi", "poc": false, "poc_url": [], "published_time": "2026-10-29", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ctyv-ehqi", "name": "https://www.oscs1024.com/hd/MPS-ctyv-ehqi"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-111417", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-111417"}, {"url": "https://www.foxit.com/support/security-bulletins.html", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "福昕官网HTML转PDF服务的跨用户文档访问", "_translated": true, "_saved_at": "2026-10-29T10:40:08+00:00", "_first_saved_at": "2026-10-29T10:40:08+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ctyv-ehqi"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-61571", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:L/A:L", "severity": "high", "base_score": 7.3}]}, "cvss_score": 7.3, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:L/A:L", "cwe": "CWE-862", "description": "AVideo是一个视频分享平台。在 8.1.0 之前，编码器缺乏全局身份验证层，并向匿名网络调用者公开控制和状态 PHP 端点。 `view/run.php` 有一个注释掉的保护并调用 `Encoder::run()`。 `view/queue.json.php` 调用 `Encoder::getAll(true)`，通过 `getSiteURL()` 显示流媒体 URL，并使用 `execRun()` 触发处理。 `view/status.php` 返回带通配符的 `Access-Control-Allow-Origin`，读取队列，触发处理，并在设置 `serverStatus` 时通过 `ServerMonitor::getMemory()` 公开主机内存统计信息。 `view/listFiles.json.php` 仅检查 `Login::canBulkEncode()`，只要 `disableBulkEncode` 为空（默认值），它就会允许匿名调用者。它的“path”参数通过“realpath()”解析，并通过“scandir()”列出，没有基目录限制。未经身份验证的攻击者可以驱动特权队列处理器、读取队列和流媒体站点信息、获取内存统计信息并枚举 Web 服务器用户可读的任何目录中的媒体文件名和路径。枚举仅限于配置的媒体扩展，本身并不公开任意文件内容。此问题已在版本 8.1.0 中修复。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-10-29", "level": "High", "mps_id": "MPS-2xuv-z8ri", "poc": false, "poc_url": [], "published_time": "2026-10-29", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-2xuv-z8ri", "name": "https://www.oscs1024.com/hd/MPS-2xuv-z8ri"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-61571", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-61571"}, {"url": "https://github.com/WWBN/AVideo-Encoder/commit/ac6097cd5fa7a24df82293bff66b136d559c16db", "name": ""}, {"url": "https://github.com/WWBN/AVideo-Encoder/releases/tag/v8.1.0", "name": ""}, {"url": "https://github.com/WWBN/AVideo-Encoder/security/advisories/GHSA-297p-4mj8-28wm", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-61571 漏洞", "_translated": true, "_saved_at": "2026-10-29T03:55:17+00:00", "_first_saved_at": "2026-10-28T23:48:02+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-2xuv-z8ri"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-118249", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:L/VI:H/VA:H/SC:L/SI:L/SA:L/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:L/VI:H/VA:H/SC:L/SI:L/SA:L/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-1321", "description": "Highcharts JS 是一个基于 SVG 的 JavaScript 图表库。从 13.0.0 到 13.1.0，Highcharts 通过直接使用点选项键作为列 ID 来构建系列数据列。因此，来自解析的点对象的自己的可枚举 __proto__ 和构造函数键可以将整数索引写入 Object.prototype 或 Object 构造函数。继承的值会影响整个页面的读取和 for-in 枚举，并且可能会中断渲染或改变消费应用程序的行为，而无需用户交互（除了渲染图表之外）。此问题已在 13.1.0 中修复。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "原型污染", "kind_en": "对象原型属性的控制不当的修改（“原型污染”）", "last_modified_time": "2026-10-29", "level": "High", "mps_id": "MPS-mv23-obk4", "poc": false, "poc_url": [], "published_time": "2026-10-29", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-mv23-obk4", "name": "https://www.oscs1024.com/hd/MPS-mv23-obk4"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-118249", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-118249"}, {"url": "https://github.com/highcharts/highcharts/commit/d3357705c8f348904441327e32f50ab528c3a205", "name": ""}, {"url": "https://github.com/highcharts/highcharts/pull/25321", "name": ""}, {"url": "https://github.com/highcharts/highcharts/releases/tag/v13.1.0", "name": ""}, {"url": "https://github.com/highcharts/highcharts/security/advisories/GHSA-gfvx-2c2g-38wq", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-118249 漏洞", "_translated": true, "_saved_at": "2026-10-28T19:14:46+00:00", "_first_saved_at": "2026-10-28T19:14:46+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-mv23-obk4"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-118250", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:L/VI:H/VA:H/SC:L/SI:L/SA:L/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:L/VI:H/VA:H/SC:L/SI:L/SA:L/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-1321", "description": "Highcharts JS 是一个基于 SVG 的 JavaScript 图表库。从 6.1.0 到 11.4.9、12.6.1 和 3.1.0，Highcharts 遵循点分隔的 series.keys 路径，而不过滤每个段。控制series.keys和匹配点数据的攻击者可以使用通过__proto__的路径将任意命名属性分配给Object.prototype。这些属性对页面中的所有 JavaScript 都是可见的，除了呈现图表之外不需要用户交互。此问题已在 11.4.9、12.6.1 和 3.1.0 中修复。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "原型污染", "kind_en": "对象原型属性的控制不当的修改（“原型污染”）", "last_modified_time": "2026-10-29", "level": "High", "mps_id": "MPS-q25z-do7w", "poc": false, "poc_url": [], "published_time": "2026-10-29", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-q25z-do7w", "name": "https://www.oscs1024.com/hd/MPS-q25z-do7w"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-118250", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-118250"}, {"url": "https://github.com/highcharts/highcharts/commit/fd4ee8140732618bbe71295aba55398fb1f8fa9e", "name": ""}, {"url": "https://github.com/highcharts/highcharts/pull/25313", "name": ""}, {"url": "https://github.com/highcharts/highcharts/releases/tag/v13.1.0", "name": ""}, {"url": "https://github.com/highcharts/highcharts/security/advisories/GHSA-rmqc-xvr3-v46c", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-118250 漏洞", "_translated": true, "_saved_at": "2026-10-28T19:14:44+00:00", "_first_saved_at": "2026-10-28T19:14:44+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-q25z-do7w"}, {"analysis_status": 0, "articles": [{"content": "应用程序在处理用户输入时的不完善或缺乏验证机制，所以攻击者能够通过向应用程序发送恶意输入，利用应用程序对输入数据的错误处理方式来注入自己的恶意代码。这些恶意代码会被应用程序误认为是合法的指令或数据，并在执行过程中被执行。", "title": "什么是代码注入"}, {"content": "应用程序使用可执行动态代码的函数来执行用户可控的参数，当应用程序对于用户输入过滤不完全时，攻击者可以注入恶意代码并控制代码执行流程。", "title": "代码注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对所有用户输入进行验证和过滤，确保只接受预期的有效输入。这包括对输入数据进行输入长度验证、类型检查和格式验证等。\r\n- 使用参数化查询或预编译语句：对于数据库查询操作，应该使用参数化查询或预编译语句，确保输入数据不会被误认为是执行代码。\r\n- 最小特权原则：应用程序在执行操作系统命令或动态代码时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。\r\n- 安全编码实践：开发人员应该采用安全编码实践，包括避免使用eval函数、避免拼接用户输入的字符串作为代码执行等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止代码注入攻击。", "title": "如何预防代码注入"}], "cnvd_id": "", "cve_id": "CVE-2026-54453", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-94", "description": "OpenCATS 是一个开源申请人跟踪系统和招聘 CRM，适用于人才中介机构和招聘团队。在版本 0.10.0 之前，`SettingsUI` (`manageProfessional`) 中的专业许可证配置功能接受管理员控制的许可证密钥输入，该密钥输入将重构为 `config.php` 中的 PHP `define()` 语句，而无需安全转义。由于应用程序包含“config.php”，精心设计的输入可以更改文件的 PHP 语法，并导致使用 Web 服务器进程权限持续执行任意 PHP。经过身份验证的管理员必须具有设置模块访问权限和更新专业许可证配置的权限，并且“config.php”对于此基于写入的路径必须是可写的。成功利用该漏洞可以读取、修改或删除应用程序数据，暴露候选人、联系人、公司、工作订单和用户帐户信息，更改安装或配置，并为进一步的攻击提供立足点。未经身份验证的利用和没有设置访问权限的利用不会建立。此问题已在 0.10.0 版本中修复。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "代码注入", "kind_en": "代码生成控制不当（“代码注入”）", "last_modified_time": "2026-10-29", "level": "High", "mps_id": "MPS-tuy2-blvg", "poc": false, "poc_url": [], "published_time": "2026-10-29", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-tuy2-blvg", "name": "https://www.oscs1024.com/hd/MPS-tuy2-blvg"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-54453", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-54453"}, {"url": "https://github.com/opencats/OpenCATS/commit/e422abf3b75d467bdee65277f56e41dfba928fc8", "name": ""}, {"url": "https://github.com/opencats/OpenCATS/pull/802", "name": ""}, {"url": "https://github.com/opencats/OpenCATS/security/advisories/GHSA-627w-743r-4cg2", "name": ""}, {"url": "https://github.com/opencats/OpenCATS/tree/v0.10.0", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-54453 漏洞", "_translated": true, "_saved_at": "2026-10-28T23:48:14+00:00", "_first_saved_at": "2026-10-28T23:48:14+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-tuy2-blvg"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-118244", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:L/UI:A/VC:H/VI:H/VA:N/SC:L/SI:L/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:L/UI:A/VC:H/VI:H/VA:N/SC:L/SI:L/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-79", "description": "Highcharts JS 是一个基于 SVG 的 JavaScript 图表库。从 12.0.0 到 12.6.1 和 13.1.0，当 DOMParser 在应用其允许列表之前无法返回文档时，Highcharts 会回退到将原始标记分配给innerHTML。在 Chromium 中，可信类型回调可能会在 beforeprint 处理程序运行时抛出，因此在 beforeprint 期间重绘图表的页面可以将不受信任的 HTML 文本选项插入到托管文档中。当打印开始时，该标记中的事件处理程序在页面原点运行。该问题影响 HTML 渲染的标题、标签、数据标签、响应文本以及同一包中发货的 Stock、地图和甘特图产品。此问题已在 12.6.1 和 13.1.0 中修复。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-10-29", "level": "High", "mps_id": "MPS-uoai-dpy2", "poc": false, "poc_url": [], "published_time": "2026-10-29", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-uoai-dpy2", "name": "https://www.oscs1024.com/hd/MPS-uoai-dpy2"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-118244", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-118244"}, {"url": "https://github.com/highcharts/highcharts/commit/abde7c576793bf50b0e0636e59b49630de6dd0d5", "name": ""}, {"url": "https://github.com/highcharts/highcharts/releases/tag/v13.1.0", "name": ""}, {"url": "https://github.com/highcharts/highcharts/security/advisories/GHSA-65hg-cf3f-5m39", "name": fects": [{"comp_name": "formidable", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,7.0)", "min_fixed_version": "7.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "注入", "kind_en": "下游组件使用的输出中特殊元素的不正确中和（“注入”）", "last_modified_time": "2026-10-30", "level": "High", "mps_id": "MPS-8qko-m20t", "poc": false, "poc_url": [], "published_time": "2026-10-30", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-8qko-m20t", "name": "https://www.oscs1024.com/hd/MPS-8qko-m20t"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-89435", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-89435"}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/87661de6-e835-495e-9bd2-4d64b4718108?source=cve", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/formidable/tags/6.35/classes/controllers/FrmAddonsController.php#L1514", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/formidable/tags/6.35/classes/controllers/FrmAddonsController.php#L1489", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/formidable/tags/6.35/classes/helpers/FrmAppHelper.php#L4934", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/formidable/tags/6.35/classes/controllers/FrmAddonsController.php#L1459", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/formidable/tags/6.35/classes/controllers/FrmAppController.php#L1167", "name": ""}, {"url": "https://plugins.trac.wordpress.org/changeset?reponame=\u0026new=3750372%40formidable%2Ftags%2F7.0\u0026old=3688662%40formidable%2Ftags%2F6.35", "name": ""}, {"url": "https://plugins.trac.wordpress.org/changeset/3746820/formidable/trunk/classes/controllers/FrmAddonsController.php", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "Formidable Forms任意插件安装漏洞", "_translated": true, "_saved_at": "2026-10-30T09:26:30+00:00", "_first_saved_at": "2026-10-30T09:26:30+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-8qko-m20t"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-91913", "cvss": {"cvssv31": [{"source": "security_alert@emc.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-78", "description": "Dell OpenManage Enterprise 是戴尔推出的闭源商业服务器生命周期管理平台，用于对数据中心内的服务器固件、配置、合规与系统更新进行集中监控和管理。\n受影响版本中，产品在处理低权限用户远程提交的输入时，未对操作系统命令中的特殊元素进行充分中和，携带命令分隔符等特殊元素的参数可进入命令执行流程并在宿主操作系统上执行附加命令，最终导致命令执行；厂商公告未披露具体受影响接口与源码位置。\n修复版本中通过厂商安全更新收紧相关功能对用户输入的处理，对操作系统命令中的特殊元素完成中和后再构造命令，阻断低权限用户输入进入命令执行流程；公开资料未披露更细粒度的源码修改，建议升级至 4.8.0 及以上版本。", "effects": [{"comp_name": "openmanage_enterprise", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,4.8.0)", "min_fixed_version": "4.8.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-10-30", "level": "High", "mps_id": "MPS-oxhu-wadm", "poc": false, "poc_url": [], "published_time": "2026-10-30", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-oxhu-wadm", "name": "https://www.oscs1024.com/hd/MPS-oxhu-wadm"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-91913", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-91913"}, {"url": "https://www.dell.com/support/kbdoc/en-us/000523220/dsa-2026-467-security-update-for-dell-openmanage-enterprise-vulnerabilities?msockid=3021cac2195069ed3194ddad186a68f9", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "OpenManage Enterprise命令注入漏洞", "_translated": true, "_saved_at": "2026-10-30T16:26:58+00:00", "_first_saved_at": "2026-10-30T16:26:58+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-oxhu-wadm"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-65584", "cvss": {}, "cvss_score": 7.8, "cvss_vector": "", "cwe": "CWE-121", "description": "Imagination Technologies Graphics DDK 是 PowerVR GPU 的闭源内核态驱动组件，随 SoC 与设备厂商的 Linux、Android 系统分发，负责 GPU 命令提交与 CPU、GPU 之间的同步管理。\n受影响版本中，当客户端 CCB 停滞在 FENCE 命令上时，rgxccb.c 的 DumpStalledContextInfo 以命令头 ui32CmdSize 推导的数量遍历全部 UFO，把处于未触发状态的 Linux/Android fence 同步检查点地址逐个写入大小固定为 PVRSRV_MAX_SYNCS 的栈数组 ui32UnsignalledUFOVaddrs，用户提交的普通同步原语不写入该数组；提交入口仅校验单一输入的数量上限，内核侧解析后追加的 fence 同步检查点未被计入总量，单条 FENCE 命令携带的未触发同步检查点数量超过栈数组容量时发生越界写入，造成内核内存破坏并通常导致内核崩溃。\n修复版本中通过修正该 UFO 地址数组容量不足的问题消除对内核栈的越界写入，官方记录标注 Graphics DDK 26.2 RTM 不受影响。", "effects": [{"comp_name": "imagination_graphics_ddk", "ecosystem": "linux", "versions": [{"affected_version": "[1.18 RTM2,+∞)", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[24.2 RTM2,+∞)", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[26.1 RTM2,+∞)", "min_fixed_version": "", "repository": VE-2026-61626", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:L/AC:H/AT:N/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.3}]}, "cvss_score": 7.3, "cvss_vector": "CVSS:4.0/AV:L/AC:H/AT:N/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-787", "description": "libass 是一个开源的便携式字幕渲染库，用于渲染 ASS/SSA（Advanced SubStation Alpha/SubStation Alpha）格式字幕，被 mpv、FFmpeg 等多媒体播放与转码软件广泛集成。\n受影响版本中，事件清理流程在清除 ReadOrder 重复检查位图标志位时未校验 ReadOrder 为负值的情况。当应用通过 ass_process_chunk 加载含负 ReadOrder 的 Matroska 字幕数据包且读序检查处于默认开启状态时，resize_read_order_bitmap 判定该值为非法并释放位图，将基指针置空；此后 ass_prune_events 或已启用的自动清理流程清理这些过期事件时，clear_read_order_bit 仍以负索引访问位图，在 NULL 附近的地址执行按位清零写入，清零地址与位偏移由攻击者通过数据包内容控制，常规系统环境下导致进程崩溃，形成拒绝服务。\n修复版本中通过在 clear_read_order_bit 入口增加 id \u003c 0 的判断并直接返回，跳过对负 ReadOrder 值的清位操作，切断负索引到 NULL 附近地址的写入路径，同时保持对含负 ReadOrder 数据包的解析兼容，修复版本为 0.17.5。", "effects": [{"comp_name": "libass", "ecosystem": "linux", "versions": [{"affected_version": "[0.17.4,0.17.5)", "min_fixed_version": "0.17.5", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-10-30", "level": "High", "mps_id": "MPS-iknc-jugh", "poc": false, "poc_url": [], "published_time": "2026-10-30", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-iknc-jugh", "name": "https://www.oscs1024.com/hd/MPS-iknc-jugh"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-61626", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-61626"}, {"url": "https://github.com/libass/libass/security/advisories/GHSA-5gf7-wjfm-vmvm", "name": "https://github.com/libass/libass/security/advisories/GHSA-5gf7-wjfm-vmvm"}, {"url": "https://github.com/libass/libass/commit/23da65a130bb8c5b2cf0c7df0dd7d424607f98f1", "name": "https://github.com/libass/libass/commit/23da65a130bb8c5b2cf0c7df0dd7d424607f98f1"}, {"url": "https://github.com/libass/libass/releases/tag/0.17.5", "name": "https://github.com/libass/libass/releases/tag/0.17.5"}], "scope_influence": "", "tags": ["开源"], "title": "libass 越界写入漏洞", "_translated": true, "_saved_at": "2026-10-30T16:26:50+00:00", "_first_saved_at": "2026-10-30T16:26:50+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-iknc-jugh"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-97645", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "cwe": "CWE-79", "description": "Gravity Forms 是 WordPress 商业表单插件（闭源发布），用于构建在线表单、收集与管理提交条目，被大量企业站点用于客户交互与数据采集。\n受影响版本中，List 字段提交值在存储与后台输出时未做充分的输入清理与输出转义，未认证攻击者可通过公开表单提交携带恶意脚本内容的 List 字段值并持久保存；管理员打开条目详情视图时页面包含注入内容，点击其中的链接并确认弹窗后，管理端 JavaScript 包中以事件委托方式绑定 data-dialog-callback 属性的处理器会调用该属性中攻击者指定的函数引用，最终在管理后台会话中执行任意 Web 脚本。\n修复版本中通过 3.1.3 版本引入的安全增强，加强相关字段值的输入清理与输出转义，阻止注入内容再进入管理端回调执行链路，建议用户升级至 3.1.3 及以上版本。", "effects": [{"comp_name": "gravityforms", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,3.1.3)", "min_fixed_version": "3.1.3", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-10-30", "level": "High", "mps_id": "MPS-3dgc-pa8i", "poc": false, "poc_url": [], "published_time": "2026-10-30", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-3dgc-pa8i", "name": "https://www.oscs1024.com/hd/MPS-3dgc-pa8i"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-97645", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-97645"}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/9889e718-381b-4d11-a234-0278037c61c4?source=cve", "name": ""}, {"url": "https://docs.gravityforms.com/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Gravity Forms List字段存储型XSS漏洞", "_translated": true, "_saved_at": "2026-10-30T09:26:27+00:00", "_first_saved_at": "2026-10-30T09:26:27+00:00", "_s 用于客户信息收集。\n受影响版本中，Post Excerpt、Post Custom Field 以及启用富文本编辑器的 Paragraph Text 字段允许提交原始 HTML，保存时 GF_Field::sanitize_entry_value() 经 wp_kses_post() 净化条目值，而 wp_kses_post 白名单允许 data-* 属性，未认证攻击者在公开表单中提交的 HTML 实体编码脚本载荷可存入 data-dialog-confirm 属性并在保存期存活；条目列表与条目详情等管理页面的展示函数信任保存期净化并直接输出存储的原始值，管理端 JavaScript 将该属性值传入 insertAdjacentHTML()，浏览器解码实体后执行任意脚本，管理员浏览相关页面即触发存储型 XSS，可导致会话窃取或管理操作伪造。\n修复版本中通过新增 GF_Field::get_entry_allowed_html() 构建条目展示白名单并显式移除 data-* 属性，切断 data-dialog-confirm 载荷的存活路径，条目值在输出时改为经 wp_kses() 按该白名单重新净化，消除实体编码载荷在管理端注入执行的链路。", "effects": [{"comp_name": "gravityforms", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,3.1.2)", "min_fixed_version": "3.1.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-10-30", "level": "High", "mps_id": "MPS-rpd2-khvb", "poc": false, "poc_url": [], "published_time": "2026-10-30", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-rpd2-khvb", "name": "https://www.oscs1024.com/hd/MPS-rpd2-khvb"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-90437", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-90437"}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/7aee2acb-f109-4ba7-91ed-e65868b32f4f?source=cve", "name": ""}, {"url": "https://docs.gravityforms.com/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Gravity Forms存储型XSS漏洞", "_translated": true, "_saved_at": "2026-10-30T09:26:29+00:00", "_first_saved_at": "2026-10-30T09:26:29+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-rpd2-khvb"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-86715", "cvss": {"cvssv31": [{"source": "iletisim@usom.gov.tr", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N", "cwe": "CWE-256", "description": "Vatos DLP 是土耳其 Kriptek（Crypttech Crypto and Informatics Technologies Industry and Trade Inc.）开发的商业数据泄漏防护软件，为闭源产品，用于企业终端与网络流量的数据防泄漏管理。\n受影响版本中，产品将口令以明文形式存储，具备本地低权限访问能力的使用者可读取存储的凭据并获得已知域凭据，进而在域环境中复用该凭据访问受保护资源，危及系统的机密性与完整性。\n修复版本中通过消除口令明文存储切断该利用链；官方未公开修复代码细节，土耳其 Siber Guvenlik Baskanligi 公告 TR-26-1432 建议将产品升级至 1.1.243 及以上版本。", "effects": [{"comp_name": "vatos_dlp", "ecosystem": "linux", "versions": [{"affected_version": "[1.1.176,1.1.243)", "min_fixed_version": "1.1.243", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "明文存储口令", "kind_en": "密码的明文存储", "last_modified_time": "2026-10-30", "level": "High", "mps_id": "MPS-a3br-dm2v", "poc": false, "poc_url": [], "published_time": "2026-10-30", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-a3br-dm2v", "name": "https://www.oscs1024.com/hd/MPS-a3br-dm2v"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-86715", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-86715"}, {"url": "https://siberguvenlik.gov.tr/guvenlik-bildirimleri/detay/tr-26-1432", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Vatos DLP口令明文存储漏洞", "_translated": true, "_saved_at": "2026-10-30T16:26:59+00:00", "_first_saved_at": "2026-10-30T16:26:59+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-a3br-dm2v"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-91914", "cvss": {"cvssv31": [{"source": "security_alert@emc.com", "vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:U/C:L/I:H/A:N", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:U/C:L/I:H/A:N", "cwe": "CWE-290", "description": "Dell OpenManage Enterprise 是 Dell 推出的闭源数据中心基础设施管理平台，提供服务器发现、监控、固件更新与资产集中管理能力，通常部署在企业内网管理网段。\n受影响版本中，身份认证校验环节存在 Authentication Bypass by Spoofing 缺陷（CWE-290），未经身份认证的相邻网络攻击者可伪造认证要素通过校验并窃取有效会话，进而以被窃会话访问管理控制台；官方未披露具体代码细节，受影响范围为 4.8.0 之前的全部版本。\n修复版本中通过 Dell 在 4.8.0 中发布的安全更新消除该认证绕过路径，公告未披露具体修复代码，也未提供临时缓解措施，用户需升级至 4.8.0 或更高版本。", "effects": [{"comp_name": "openmanage_enterprise", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,4.8.0)", "min_fixed_version": "4.8.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "使用欺骗进行的认证绕过", "kind_en": "通过欺骗绕过身份验证", "last_modified_time": "2026-10-30", "level": "High", "mps_id": "MPS-r5d2-mx3k", "poc": false, "poc_url": [], "published_time": "2026-10-30", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-r5d2-mx3k", "name": "https://www.oscs1024.com/hd/MPS-r5d2-mx3k"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-91914", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-91914"}, {"url": "https://www.dell.com/support/kbdoc/en-us/000523220/dsa-2026-467-security-update-for-dell-openmanage-enterprise-vulnerabilities?msockid=3021cac2195069ed3194ddad186a68f9", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "OpenManage Enterprise 认证绕过漏洞", "_translated": true, "_saved_at": "2026-10-30T16:26:56+00:00", "_first_saved_at": "2026-10-30T16:26:56+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-r5d2-mx3k"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "attack_vector_type": "Local", "cnvd_id": "", "cve_id": "CVE-2026-15466", "cvss": {}, "cvss_score": 7, "cvss_vector": "", "cwe": "CWE-416", "description": "Imagination Technologies Graphics DDK 是面向 PowerVR/Rogue 系列 GPU 的闭源图形驱动组件（内核态驱动模块），用于在 Linux 与 Android 设备上管理图形、计算与硬件性能计数器等 GPU 资源，广泛集成于搭载 Imagination GPU 的移动、汽车与消费电子平台。\n受影响版本中，本地普通用户通过 GPU 驱动 ioctl 关闭硬件性能计数器客户端流时，PVRSRVRGXCloseHWPerfClientStreamKM() 在流的销毁路径中缺少充分的锁保护，引用计数以非原子方式递减，并发关闭或连接清理与该路径竞争可导致对象被提前释放，其他代码路径继续访问已释放对象，造成对内核堆内存的读取或写入 UAF。\n修复版本中通过在硬件性能计数器客户端流的关闭与销毁路径补充锁保护并保证引用计数原子递减，消除并发销毁与并发使用之间的竞态，阻断内核堆 UAF 读写；官方 CVE 记录显示 26.2 RTM 为不受影响版本。", "effects": [{"comp_name": "Imagination Technologies Graphics DDK", "ecosystem": "linux", "versions": [{"affected_version": "[24.2 RTM2,24.2 RTM2]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[25.1 RTM2,25.3 RTM]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[26.1 RTM2,26.1 RTM2]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "UAF", "kind_en": "免费后使用", "last_modified_time": "2026-10-30", "level": "High", "mps_id": "MPS-mqnj-hu8a", "poc": false, "poc_url": [], "published_time": "2026-10-30", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-mqnj-hu8a", "name": "https://www.oscs1024.com/hd/MPS-mqnj-hu8a"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-15466", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-15466"}, {"url": "https://www.imaginationtech.com/gpu-driver-vulnerabilities/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Imagination GPU DDK UAF漏洞", "_translated": true, "_saved_at": "2026-10-30T02:19:51+00:00", "_first_saved_at": "2026-10-30T02:19:51+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-mqnj-hu8a"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过向受信任的数据序列化过程中添加恶意数据，从而在序列化和反序列化过程中执行恶意代码的攻击漏洞。这种漏洞通常存在于使用序列化 (serialization) 机制存储和传输数据的程序中。\n", "title": "什么是反序列化"}, {"content": "- 注入攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码注入到程序中，从而实现代码执行的目的。\n- 反射攻击：攻击者使用反射机制，在序列化过程中动态生成恶意数据，并将恶意代码注入到程序中，从而实现代码执行的目的。\n- 缓冲区溢出攻击：攻击者通过在序列化过程中向缓冲区输入恶意数据，导致缓冲区溢出，从而破坏程序的内存管理，实现代码执行的目的。\n- 格式字符串攻击：攻击者通过在序列化过程中输入恶意数据，导致程序使用错误的格式字符串，从而实现代码执行的目的。\n- 数据流攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码作为一个数据流传递给程序，从而实现代码执行的目的。\n", "title": "反序列化常见的攻击方式"}, {"content": "- 不信任输入数据：程序应该严格检查输入数据的有效性，并避免使用不受信任的数据。\n- 使用安全的序列化机制：程序应该使用安全的序列化机制，如 JSON 或 XML 序列化，而不是第三方序列化库。\n- 最小特权原则：程序应该限制对受信任数据的处理权限，并避免在运行时修改数据。\n- 代码审查和漏洞扫描：程序应该进行代码审查和漏洞扫描，以发现和修复潜在的安全漏洞。\n", "title": "如何预防反序列化"}], "cnvd_id": "", "cve_id": "CVE-2026-78527", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-502", "description": "GS Testimonial Slider（现已更名为 Solid Testimonials）是 GS Plugins 开发的开源 WordPress 推荐语轮播插件，发布于 WordPress.org 官方插件目录，用于创建和管理客户评价、推荐语轮播与视频评价等展示内容。\n受影响版本中，插件的导入导出 AJAX 端点 gs_tm_import_data 与 gs_tm_export_data 仅调用 check_ajax_referer 校验 nonce、未执行 current_user_can 能力校验，import__posts 函数将上传 data.json 中的 meta_input 键值对未经净化直接传入 wp_insert_post 写入 gs_testimonial 文章的 post meta；导出流程 export__testimonial 函数遍历文章全部 meta 值，对判定为序列化数据的值调用 maybe_unserialize 还原，低权限账户预先植入的恶意序列化对象字符串在该处被实例化，形成 PHP 对象注入，可进一步触发敏感信息泄露或代码执行等后果。\n修复版本中通过官方补丁消除该反序列化链路的方案尚未发布，Patchstack 记录显示截至 2026-10-30 无官方补丁可用，仅提供临时缓解规则；在官方修复发布前，可限制低权限账户使用导入导出功能并部署 WAF 拦截相关 AJAX 请求，待补丁发布后升级插件完成修复。", "effects": [{"comp_name": "gs-testimonial", "ecosystem": "linux", "versions": [{"affecte L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-502", "description": "Enable Media Replace 是 ShortPixel 开发的 WordPress 开源媒体替换插件，wordpress.org 官方目录显示安装量超过 60 万，用于在媒体库中直接替换附件文件并可选择更新指向旧文件的全部链接。\n受影响版本中，用户选择更新链接模式执行媒体替换时，Replacer 的 handleMetaData 会扫描 postmeta、commentmeta、termmeta、usermeta、options 等元数据表，并对 meta_value 命中被替换文件 URL 的行调用 replaceContent；该调用未传入 strict_check 参数，函数默认取 false，序列化内容以 allowed_classes=true 交给 unserialize 处理，低权限账户预置在元数据表中的恶意序列化对象会被实际实例化，形成 PHP 对象注入，在站点存在可用 POP 利用链时可升级为任意代码执行。\n修复版本中通过在 replaceContent 中统一以 allowed_classes=false 反序列化，并将 strict_check 默认值改为 true 且透传到数组与对象的递归子调用，任何序列化对象均降级为 __PHP_Incomplete_Class 并按原始字符串返回，切断了对象实例化路径。", "effects": [{"comp_name": "enable-media-replace", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,4.2.3)", "min_fixed_version": "4.2.3", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "反序列化", "kind_en": "不可信数据的反序列化", "last_modified_time": "2026-10-31", "level": "High", "mps_id": "MPS-zoki-lu0v", "poc": false, "poc_url": [], "published_time": "2026-10-31", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-zoki-lu0v", "name": "https://www.oscs1024.com/hd/MPS-zoki-lu0v"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73186", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73186"}, {"url": "https://patchstack.com/database/wordpress/plugin/enable-media-replace/vulnerability/wordpress-enable-media-replace-plugin-4-2-2-php-object-injection-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Enable Media Replace PHP对象注入漏洞", "_translated": true, "_saved_at": "2026-10-30T21:18:38+00:00", "_first_saved_at": "2026-10-30T21:18:38+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-zoki-lu0 运行，即使生成的客户端从未被调用。\n修复版本中通过 ParameterNaming.EscapeString 对 header 参数名与安全方案名称统一转义双引号、反斜杠与控制字符，使规格值无法闭合特性字符串字面量，并在默认校验阶段新增 AttributeStringValidator 拒绝包含越界字符的值，同时把同一编码器应用到路径与 Accept/Content-Type 等其余特性字符串发射点，从而切断注入链。", "effects": [{"comp_name": "refitter", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.1.2)", "min_fixed_version": "2.1.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "对输出编码和转义不恰当", "kind_en": "输出编码或转义不当", "last_modified_time": "2026-10-31", "level": "High", "mps_id": "MPS-cjlp-wh78", "poc": false, "poc_url": [], "published_time": "2026-10-31", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-cjlp-wh78", "name": "https://www.oscs1024.com/hd/MPS-cjlp-wh78"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-63346", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-63346"}, {"url": "https://github.com/christianhelle/refitter/security/advisories/GHSA-58x9-vjvp-6mx8", "name": "https://github.com/christianhelle/refitter/security/advisories/GHSA-58x9-vjvp-6mx8"}, {"url": "https://github.com/christianhelle/refitter/pull/1178", "name": "https://github.com/christianhelle/refitter/pull/1178"}, {"url": "https://github.com/christianhelle/refitter/commit/63a19b03699a9c267d6fab5f758ec26484db83a1", "name": "https://github.com/christianhelle/refitter/commit/63a19b03699a9c267d6fab5f758ec26484db83a1"}, {"url": "https://github.com/christianhelle/refitter/releases/tag/2.1.2", "name": "https://github.com/christianhelle/refitter/releases/tag/2.1.2"}, {"url": "https://github.com/user-attachments/files/29395048/maintainer-report.txt", "name": "https://github.com/user-attachments/files/29395048/maintainer-report.txt"}, {"url": "https://github.com/user-attachments/files/29395050/make_spec.py", "name": "https://github.com/user-attachments/files/29395050/make_spec.py"}, {"url": "https://github.com/user-attachments/files/29395051/reproduce.sh", "name": "https://github.com/user-attachments/files/29395051/reproduce.sh"}], "scope_influence": "", "tags": ["应用软件"], "title": "Refitter 代码注入漏洞", "_translated": true, "_saved_at": "2026-10-31T01:21:11+00:00", "_first_saved_at": "2026-10-31T01:21:11+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-cjlp-wh78"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-120135", "cvss": {}, "cvss_score": 8.2, "cvss_vector": "", "cwe": "CWE-674", "description": "Apache Thrift 是 Apache 基金会开源的跨语言 RPC 与序列化框架，libthrift（Maven 坐标 org.apache.thrift:libthrift）是其 Java 语言绑定库，广泛用于服务间远程调用与结构化数据的序列化解析。\n受影响版本中，org.apache.thrift.protocol.TProtocolUtil 的静态字段 maxSkipDepth 默认取 Integer.MAX_VALUE，skip() 方法在跳过 STRUCT、MAP、SET、LIST 类型字段时按子元素逐层递归调用自身，深度上限实际不可达。攻击者向解析其可控 Thrift 消息的服务发送深度嵌套的序列化数据（例如连续嵌套的结构体）时，skip() 会沿嵌套层持续递归，直至耗尽线程栈抛出 StackOverflowError，使处理该消息的服务线程崩溃，形成远程拒绝服务。\n修复版本中通过将 maxSkipDepth 默认值从 Integer.MAX_VALUE 收敛为 64，并把 skip() 的深度上限接入传输层 TConfiguration 的递归限制（setMaxSkipDepth 废弃为空操作，统一由 TConfiguration.setRecursionLimit 控制），深度超限时抛出带 DEPTH_LIMIT 类型的 TProtocolException，终止递归跳过过程，消除栈溢出导致的拒绝服务风险。0.24.0 版本包含上述修复。", "effects": [{"comp_name": "org.apache.thrift:libthrift", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,0.24.0)", "min_fixed_version": "0.24.0", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "未经控制的递归", "kind_en": "Uncontrolled Recursion", "last_modified_time": "2026-10-31", "level": "High", "mps_id": "MPS-7f9e-8da3", "poc": false, "poc_url": [], "published_time": "2026-10-31", "reference_url_list": [{"url": "http://www.mail-archive.com/announce@apache.org/msg12471.html", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-120135", "name": ""}, {"url": "https://thrift.apache.org/", "name": ""}, {"url": "https://github.com/apache/thrift/commit/735a976aeee3f1abdf20b20cc4352eeedcdbe758", "name": ""}, {"url": "https://github.com/apache/thrift/commit/deeebfac25c1f0fc6207c845ba05679522e53adf", "name": ""}, {"url": "https://github.com/apache/thrift/pull/3415", "name": ""}, {"url": "https://github.com/apache/thrift/releases/tag/v0.24.0", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "Apache Thrift 不受控递归漏洞", "_translated": true, "_saved_at": "2026-10-31T01:21:06+00:00", "_first_saved_at": "2026-10-31T01:21:06+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-7f9e-8da3"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-62162", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.2}]}, "cvss_score": 8.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-862", "description": "Hydra 是 Cardano 官方开源的二层（Layer-2）扩容方案（仓库 cardano-scaling/hydra，Apache-2.0 许可证），通过 Head 状态通道把链上资金转移到链下处理，用户可调用 hydra-node 提供的 HTTP 接口 POST /commit 向 Head 发起存款，存款以受链上 Plutus/Aiken 校验器保护的 UTxO 形式存在。\n受影响版本中，hydra-plutus/validators/deposit.ak 的 deposit 校验器在处理 Claim 赎回器时只检查 datum.head_id 与攻击者可控的 redeemer.currencySymbol 一致，并要求交易有效期落在存款截止时间之前，既不要求同一笔交易花费对应 Head 的状态代币 UTxO，也不对交易输出施加任何约束；受害者经 POST /commit 发起的存款确认上链后，任何能够构造并提交 Cardano 交易的第三方可在截止时间前直接观察并花费该待处理存款 UTxO，把其中资产重定向到任意地址，该笔独立花费不会触发 Head 校验器的任何安全检查，默认截止时间为 depositPeriod 的三倍，攻击窗口覆盖该期间内的全部待处理存款。\n修复版本中通过重定义 Claim 赎回器并新增 expect_increment_redeemer 检查切断该利用链：赎回器不再携带攻击者可控的 PolicyId，花费存款的交易必须在同一笔交易中消费对应 Head 状态代币 UTxO，且该 Head 输入的赎回器必须是 Head 校验器的 Increment 变体（构造子索引 1），同时在 hydra-plutus/src/Hydra/Contract/Head.hs 的 checkIncrement 中以 mustPreserveValue 强制 head 输入价值与全部非 head 脚本输入价值之和等于 head 输出价值，确保存款资产只能并入 Head 状态，无法被重定向到任意地址。", "effects": [{"comp_name": "hydra", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.1.0)", "min_fixed_version": "2.1.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-10-31", "level": "High", "mps_id": "MPS-jthi-dqnk", "poc": false, "poc_url": [], "published_time": "2026-10-31", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-jthi-dqnk", "name": "https://www.oscs1024.com/hd/MPS-jthi-dqnk"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-62162", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-62162"}, {"url": "https://github.com/cardano-scaling/hydra/security/advisories/GHSA-gfpc-m687-p7h5", "name": "https://github.com/cardano-scaling/hydra/security/advisories/GHSA-gfpc-m687-p7h5"}, {"url": "https://github.com/cardano-scaling/hydra/commit/ff60e4af4ecf05545a696a6d9bf1afeffe991de0", "name": "https://github.com/cardano-scaling/hydra/commit/ff60e4af4ecf05545a696a6d9bf1afeffe991de0"}, {"url": "https://github.com/cardano-scaling/hydra/releases/tag/2.1.0", "name": "https://github.com/cardano-scaling/hydra/releases/tag/2.1.0"}], "scope_influence": "", "tags": ["应用软件"], "title": "Hydra 存款盗取漏洞", "_translated": true, "_saved_at": "2026-10-30T21:18:40+00:00", "_first_saved_at": "2026-10-30T21:18:40+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-jthi-dqnk"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-63414", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:L/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.6}]}, "cvss_score": 7.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:L/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-863", "description": "shopify_app 是 Shopify 官方开源的 Ruby on Rails 引擎（gem），用于为 Shopify 嵌入式应用提供安装、认证、会话管理与 Admin API 访问能力，经 RubyGems 分发。\n受影响版本中，token exchange 认证控制器的辅助方法 current_shopify_domain 以清洗后的 shop 查询参数（sanitized_shop_name）优先于会话商店域名，返回值可被请求中的 shop 参数控制，而非来自经验证 ID token 或会话推导的商店身份；持有商店 A 有效会话的攻击者在已认证请求中附带指向商店 B 的 shop 参数后，依赖 current_shopify_domain 或 params[:shop] 做授权判定、租户定位、存储访问令牌选择或数据隔离的应用代码会切换到商店 B 上下文执行，导致跨商店未授权访问与越权操作。\n修复版本中通过重写 current_shopify_domain 使其仅从经验证 ID token 或会话解析已认证商店域名，新增 authenticated_shopify_domain 与 requested_shopify_domain 分别暴露可信上下文与请求上下文，并在 activate_shopify_session 中校验二者，shop 参数与已认证商店不一致时返回 401，切断攻击者可控参数进入授权上下文的路径。", "effects": [{"comp_name": "shopify_app", "ecosystem": "linux", "versions": [{"affected_version": "[22.1.0,23.0.3)", "min_fixed_version": "23.0.3", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-10-31", "level": "High", "mps_id": "MPS-x6u2-g58w", "poc": false, "poc_url": [], "published_time": "2026-10-31", "reference_url_list": [{"url": "https://github.com/Shopify/shopify_app/security/advisories/GHSA-6j52-38f8-qhxr", "name": ""}, {"url": "https://github.com/Shopify/shopify_app/releases/tag/v23.0.3", "name": ""}, {"url": "https://github.com/advisories/GHSA-6j52-38f8-qhxr", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "shopify_app 跨商店授权绕过", "_translated": true, "_saved_at": "2026-10-31T01:21:08+00:00", "_first_saved_at": "2026-10-31T01:21:08+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-x6u2-g58w"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-62264", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "cwe": "CWE-306", "description": "@sylphx/pdf-reader-mcp 是 SylphxAI/anymd 开源仓库（MIT 许可）发布的 npm 包，提供读取 PDF 并转换为 Markdown 的 MCP 服务器，供 AI 代理与大模型客户端通过 stdio 或 HTTP 传输调用。\n受影响版本中，HTTP 传输读取 MCP_API_KEY 环境变量并输出 API key authentication enabled 启动日志，但 src/index.ts 的 createTransport 未把该值传入传输配置，src/mcp.ts 的 startHttpServer 注册的 /mcp 请求处理逻辑不校验 X-API-Key 请求头，/mcp 端点接受未认证请求；配合默认绑定 0.0.0.0，任何能访问该端口的客户端可调用全部 PDF 工具并读取服务器进程可打开的任意 PDF 内容，URL 形式的文档来源还引入有限的 SSRF 攻击面。\n修复版本中通过在 src/mcp.ts 新增 isApiKeyValid，以 SHA-256 与 timingSafeEqual 对 X-API-Key 做常量时间比较，对配置了 MCP_API_KEY 的 /mcp 请求强制校验并对缺失或不匹配返回 401，同时把 MCP_HTTP_HOST 默认值从 0.0.0.0 改为 127.0.0.1，在非回环绑定且未配置密钥时输出启动告警，切断未认证调用链。", "effects": [{"comp_name": "@sylphx/pdf-reader-mcp", "ecosystem": "npm", "versions": [{"affected_version": "[2.2.0,3.0.1)", "min_fixed_version": "3.0.1", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "关键功能的认证机制缺失", "kind_en": "缺少关键功能的身份验证", "last_modified_time": "2026-10-31", "level": "High", "mps_id": "MPS-58mc-rosi", "poc": false, "poc_url": [], "published_time": "2026-10-31", "reference_url_list": [{"url": "https://github.com/SylphxAI/pdf-reader-mcp/security/advisories/GHSA-q344-5v34-gm84", "name": ""}, {"url": "https://github.com/SylphxAI/anymd/pull/332", "name": ""}, {"url": "https://github.com/SylphxAI/anymd/commit/4c35f72862d729301e3912ab8c8317d2828cf4c2", "name": ""}, {"url": "https://github.com/SylphxAI/anymd/releases/tag/v3.0.1", "name": ""}, {"url": "https://github.com/advisories/GHSA-q344-5v34-gm84", "name": ""}], "scope_influence": "", "tags": ["AI", "npm", "开源"], "title": "pdf-reader-mcp未授权访问漏洞", "_translated": true, "_saved_at": "2026-10-30T21:18:39+00:00", "_first_saved_at": "2026-10-30T21:18:39+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-58mc-rosi"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "cnvd_id": "", "cve_id": "CVE-2026-120040", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-269", "description": "Mail logging \u0026 Catcher（WP Mail Catcher）是 WordPress 开源邮件日志插件（GitHub 开源，GPL-3.0 许可），自动将站点发出的邮件记录为日志，供管理员查看、重发与导出。\n受影响版本中，插件通过 wp_mail 过滤器在 src/Loggers/WpMail.php 的 getTransformedMailArgs 中将邮件正文原样写入日志 message 字段，未对敏感链接做脱敏；当管理员把插件的 default_view_role 设置改为 read 等低权限能力后，订阅者级别用户可通过 src/Bootstrap.php 中 route() 的 single_mail 动作读取日志条目，src/Views/HtmlMessage.php 与 src/Views/TextMessage.php 输出 message 内容，泄露其中管理员密码重置链接的 action=rp 与 key 参数值，攻击者凭借该有效重置密钥完成 WordPress 密码重置流程，将账户提升为管理员。\n修复版本中通过新增 src/Redactor.php 的 Redactor 类，在 LogHelper::saveMail 保存与 Logs::dbResultTransform 读取两个环节调用 redactLog，由默认注册的 redactSensitiveUrls 将包含 action=rp 或 key= 参数的 URL 替换为 [redacted]，默认启用 redact_sensitive_urls 设置，历史日志在读取阶段同样被脱敏，随 2.3.0 版本发布，切断管理员密码重置密钥泄露链路。", "effects": [{"comp_name": "wp-mail-catcher", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.3.0)", "min_fixed_version": "2.3.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-10-31", "level": "High", "mps_id": "MPS-ats9-o5hy", "poc": false, "poc_url": [], "published_time": "2026-10-31", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ats9-o5hy", "name": "https://www.oscs1024.com/hd/MPS-ats9-o5hy"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-120040", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-120040"}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/599e46ed-a71c-41d1-839f-6bb76808a58f?source=cve", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/wp-mail-catcher/tags/2.2.0/src/Bootstrap.php#L259", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/wp-mail-catcher/tags/2.2.0/src/Bootstrap.php#L101", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/wp-mail-catcher/tags/2.2.0/src/Loggers/WpMail.php#L42", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/wp-mail-catcher/tags/2.2.0/src/Views/TextMessage.php#L10", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/wp-mail-catcher/tags/2.2.0/src/Views/HtmlMessage.php#L9", "name": ""}, {"url": "https://github.com/JWardee/wp-mail-catcher/releases/tag/v2.3.0", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "WP Mail Catcher敏感信息泄露漏洞", "_translated": true, "_saved_at": "2026-10-31T07:52:51+00:00", "_first_saved_at": "2026-10-31T07:52:51+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ats9-o5hy"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2026-63398", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:H/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.4}]}, "cvss_score": 7.4, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:H/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-287", "description": "Coop 是 ROOST 开源的审核与内容审查工具，托管于 GitHub（roostorg/coop），基于 Node.js 与 TypeScript 构建，面向多组织（多租户）场景提供内容审核与仲裁能力，各组织可独立配置 SAML 单点登录。\n受影响版本中，SAML 策略的 verify 回调在 /saml/login/:orgId/callback 认证流程中仅按断言中的 email 调用 kyselyUserFindByEmail 查询用户，未将查询与回调路径中的组织 ID 绑定。攻击者作为其所辖组织的管理员配置并控制该组织 SAML IdP 签名密钥后，可向目标组织的 SAML 回调提交以受害者邮箱为主题的断言；当目标组织注册的 SAML 证书与攻击者控制的签名证书相同时，断言通过目标组织证书校验，按邮箱的查询命中目标组织内的用户并创建其会话，攻击者在目标组织无需任何权限便能获得该用户身份，形成跨租户账户接管。\n修复版本中通过在 server/graphql/datasources/userKyselyPersistence.ts 新增 kyselyUserFindByEmailAndOrg 将用户查询同时限定 email 与 org_id，并新增 server/graphql/utils/resolveSamlUser.ts 与 getOrgIdFromPath 从回调路径解析组织 ID，SAML 登录与登出共用按组织限定的 verify 回调；跨组织邮箱不再命中查询，认证被拒绝，缺失或非字符串的 email claim 也在查询前被拒绝。", "effects": [{"comp_name": "coop", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.0.2)", "min_fixed_version": "1.0.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "身份验证不当", "kind_en": "认证不当", "last_modified_time": "2026-10-31", "level": "High", "mps_id": "MPS-e59c-7udi", "poc": false, "poc_url": [], "published_time": "2026-10-31", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-e59c-7udi", "name": "https://www.oscs1024.com/hd/MPS-e59c-7udi"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-63398", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-63398"}, {"url": "https://github.com/roostorg/coop/security/advisories/GHSA-2v93-383c-9fw2", "name": "https://github.com/roostorg/coop/security/advisories/GHSA-2v93-383c-9fw2"}, {"url": "https://github.com/roostorg/coop/pull/783", "name": "https://github.com/roostorg/coop/pull/783"}, {"url": "https://github.com/roostorg/coop/commit/d1be81b6b33abc1162ee6b9952d4bd1ca761b071", "name": "https://github.com/roostorg/coop/commit/d1be81b6b33abc1162ee6b9952d4bd1ca761b071"}, {"url": "https://github.com/roostorg/coop/releases/tag/1.0.2", "name": "https://github.com/roostorg/coop/releases/tag/1.0.2"}], "scope_influence": "", "tags": ["应用软件"], "title": "Coop SAML 跨租户认证绕过漏洞", "_translated": true, "_saved_at": "2026-10-31T01:21:09+00:00", "_first_saved_at": "2026-10-31T01:21:09+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-e59c-7udi"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-119089", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "cwe": "CWE-79", "description": "ThirstyAffiliates 是托管在 wordpress.org 插件目录的开源联盟营销插件（slug 为 thirstyaffiliates，GPLv2 或更高许可），用于创建、缩短和跟踪联盟推广链接，其注册的前端内容过滤流程同时作用于文章内容与区块渲染输出。\n受影响版本中，Affiliate_Links_CPT 的 add_affiliate_link_tag 方法把编辑器专用的 \u003cta\u003e 标签连同 \u003ca\u003e 标签的属性白名单写入所有 wp_kses_allowed_html 上下文，评论内容清洗阶段该标签连同 href 属性一并放行；在区块主题下，评论内容经由 Comment Content 区块流入 render_block 过滤器，Link_Picker 的 gutenberg_transform_ta_tags_to_link 方法使用 get_string_between 从匹配文本中朴素截取 linkid 与 href，未经 esc_url 转义直接拼入 \u003ca href=...\u003e 输出，href 中的未编码方括号还可提前截断 [thirstylink] 短代码并使剩余内容按原始标记输出，攻击者使用已通过审核的评论邮箱提交恶意评论后，可在页面中注入任意 Web 脚本。\n修复版本中通过仅在 post 上下文放行 \u003cta\u003e 标签、新增 unwrap_ta_tags_in_comment_text 过滤器在 comment_text 阶段剥离评论中的 \u003cta\u003e 标签，并改用 wp_kses_hair 解析属性、absint 限定 linkid 为整数、esc_url 转义
