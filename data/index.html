able-srp-setpass 构建选项、静态插件注册与 SRP 文档；由于 SRP SASL 机制从未形成标准（仅存在过期草案 draft-burdis-cat-srp-sasl），移除插件后 srp_server_mech_step2 等缺陷代码不复存在。该修复已合入 master 分支，截至 2026-11-15 尚未进入任何发布版本，最新发布版本 2.1.28（2022-02-22）仍受影响。", "effects": [{"comp_name": "cyrus-sasl", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.1.28]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "身份验证不当", "kind_en": "认证不当", "last_modified_time": "2026-11-15", "level": "Critical", "mps_id": "MPS-g3uj-etyh", "poc": false, "poc_url": [], "published_time": "2026-11-15", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-g3uj-etyh", "name": "https://www.oscs1024.com/hd/MPS-g3uj-etyh"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-129483", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-129483"}, {"url": "https://github.com/cyrusimap/cyrus-sasl/issues/896", "name": ""}, {"url": "https://seclists.org/oss-sec/2026/q4/122", "name": ""}, {"url": "https://gist.github.com/afldl/18d15d3f5a1df99411e35000c7de80db", "name": ""}, {"url": "https://github.com/cyrusimap/cyrus-sasl/commit/fb3724f43dc50247ff2bf02135457d6d77031654", "name": ""}, {"url": "https://github.com/cyrusimap/cyrus-sasl/blob/cyrus-sasl-2.1.28/plugins/srp.c#L2046-L2050", "name": ""}, {"url": "https://www.vulncheck.com/advisories/cyrus-sasl-through-2.1.28-srp-authentication-bypass-via-plugins-srp-c", "name": "VulnCheck Advisory: Cyrus SASL through 2.1.28 SRP Authentication Bypass via plugins/srp.c"}], "scope_influence": "", "tags": ["应用软件"], "title": "Cyrus SASL SRP认证绕过漏洞", "_translated": true, "_saved_at": "2026-11-15T15:12:18+00:00", "_first_saved_at": "2026-11-15T15:12:18+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-g3uj-etyh"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-129261", "cvss": {"cvssv2": [{ ion": "可选修复", "kind": "参数注入或修改", "kind_en": "命令中参数分隔符的不正确中和（“参数注入”）", "last_modified_time": "2026-11-16", "level": "Critical", "mps_id": "MPS-qtrb-kiyc", "poc": true, "poc_url": [], "published_time": "2026-11-16", "reference_url_list": [{"url": "https://github.com/nltk/nltk/security/advisories/GHSA-x8q7-6c7m-52gw", "name": ""}, {"url": "https://github.com/nltk/nltk/commit/b36212795a522d2b7b176cf0e0d9d8da489ba6e6", "name": ""}], "scope_influence": "", "tags": [], "title": "NLTK Java代码执行漏洞", "_translated": true, "_saved_at": "2026-11-16T07:32:22+00:00", "_first_saved_at": "2026-11-16T07:32:22+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-qtrb-kiyc"}, {"analysis_status": 3, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2026-129349", "cvss": {"cvssv4": [{"source": "security@apache.org", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:N/AU:Y/R:U/V:C/RE:L/U:Red", "severity": "critical", "base_score": 9.1}, {"source": "murphysec", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:N/AU:Y/R:U/V:C/RE:L/U:Red", "severity": "critical", "base_score": 9.1}]}, "cvss_score": 9.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:N/AU:Y/R:U/V:C/RE:L/U:Red", "cwe": "CWE-287", "description": "Apache Shiro 是 Apache 软件基金会开源的 Java 安全框架，提供认证、授权、会话管理与加密能力，其 shiro-core 模块（org.apache.shiro:shiro-core）包含对接 LDAP 目录的 DefaultLdapRealm 与 JndiLdapRealm。\n受影响版本中，DefaultLdapRealm 构造函数默认调用 setCredentialsMatcher(new AllowAllCredentialsMatcher())，为该 Realm 安装无条件接受任意凭据的 AllowAllCredentialsMatcher；当应用将 authenticationCachingEnabled 设为 true（非默认配置）后，AuthenticatingRealm.getAuthenticationInfo 以用户名作为缓存键命中认证缓存并跳过 doGetAuthenticationInfo 中的 LDAP bind 校验，凭据校验退化为 assertCredentialsMatch 中的匹配器判定，而 AllowAllCredentialsMatcher 对任意密码均返回通过，攻击者在获知有效用户名且该用户此前成功登录过一次形成缓存后，可用任意密码通过该用户的身份认证。\n修复版本中通过移除 DefaultLdapRealm 构造函数中的 setCredentialsMatcher(new AllowAllCredentialsMatcher()) 调用完成修复，Realm 恢复继承 AuthenticatingRealm 默认的 SimpleCredentialsMatcher，认证缓存命中时提交的凭据仍会与缓存中的 AuthenticationInfo 实际比对，任意密码不再通过认证，修复随 3.0.1 版本发布。", "effects": [{"comp_name": "org.apache.shiro:shiro-core", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,3.0.1)", "min_fixed_version": "3.0.1", "repository": "maven", "solutions": [], "upstream": true}]}, {"comp_name": "shiro", "ecosystem": "linux", "versions": [{"affected_version": "影响所有版本", "min_fixed_version": "", "repository": "debian:12", "solutions": [], "upstream": false}, {"affected_version": "影响所有版本", "min_fixed_version": "", "repository": "debian:13", "solutions": [], "upstream": false}, {"affected_version": "影响所有版本", "min_fixed_version": "", "repository": "debian:14", "solutions": [], "upstream": false}, {"affected_version": "影响所有版本", "min_fixed_version": "", "repository": "debian:unstable", "solutions": [], "upstream": false}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "低", "fix_suggestion": "建议修复", "kind": "身份验证不当", "kind_en": "认证不当", "last_modified_time": "2026-11-16", "level": "Critical", "mps_id": "MPS-adb1-b3b5", "poc": true, "poc_url": [], "published_time": "2026-11-16", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-adb1-b3b5", "name": "https://www.oscs1024.com/hd/MPS-adb1-b3b5"}, {"url": "https://www.openwall.com/lists/oss-security/2026/11/14/8", "name": ""}, {"url": "https://github.com/apache/shiro/commit/c3cfcf752d784444497aa60abd305aa135329c5b", "name": ""}, {"url": "https://github.com/apache/shiro/releases/tag/shiro-root-3.0.1", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-129349", "name": ""}], "scope_influence": "小", "tags": ["java", "poc", "开源"], "title": "Apache Shiro认证缓存密码绕过漏洞", "_translated": true, "_saved_at": "2026-11-16T07:32:29+00:00", "_first_saved_at": "2026-11-14T08:26:44+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-adb1-b3b5"}, {"analysis_status": 0, "articles": [{"content": "- 编写代码时没有正确处理输入数据或没有正确验证用户输入而导致的。", "title": "什么是关键资源权限分配不当"}, {"content": "- 弱密码或未使用的密码：当管理员或系统管理员在创建帐户时，没有使用强密码或未对帐户进行密码更新时，可能会发生这种情况。弱密码可能会被黑客破解或通过其他方式轻松访问系统。\n- 未正确配置权限：在系统中，不同的资源通常需要不同的权限才能访问。如果管理员未正确配置权限，那么未经授权的用户可能会通过欺骗系统或利用其他漏洞来访问关键资源。\n- 权限重用：在某些情况下，管理员可能会将某些权限分配给某个用户，但这些权限并未被正确地限制或授权给该用户。如果其他用户尝试使用这些权限访问关键资源，那么他们可能会获得未经授权的访问权限。\n- 未正确验证用户输入：当开发人员没有正确验证用户输入时，可能会发生这种情况。例如，如果开发人员未正确过滤用户输入的用户名或密码，那么黑客可能会利用这些信息轻松地访问系统。\n", "title": "关键资源权限分配不当常见的攻击方式"}, {"content": "- 使用强密码：管理员应该使用强密码来保护系统，并定期更改密码。强密码应该包括数字、字母和符号，并且应该不同于其他帐户使用的密码。\n- 正确配置权限：管理员应该正确配置系统中不同资源所需的权限。用户可以被授予访问特定资源的权限，但不应该被授予访问其他资源的权限。\n- 权限限制：管理员应该使用权限限制来限制用户对特定资源的访问。例如，用户可以被授予访问特定文件夹的权限，但不能访问其他文件夹。\n- 输入验证：开发人员应该正确验证用户输入。例如，他们可以过滤用户输入的用户名和密码，以确保它们符合预期的格式。\n- 安全培训：管理员和用户应该接受安全培训，以便了解如何识别和避免常见的安全漏洞，例如不正确权限授予漏洞。\n- 定期更新和修补软件：系统软件和应用程序应该定期更新和修补，以确保它们不受最新安全漏洞的影响。", "title": "如何预防关键资源权限分配不当"}], "cnvd_id": "", "cve_id": "CVE-2026-130327", "cvss": {"cvssv31": [{"source": "cve@mitre.org", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H", "cwe": "CWE-732", "description": "Open Object Rexx（ooRexx）是开源 Rexx 解释器，RXAPI（rxapi）为其本地进程间通信守护进程，用于在同一主机的解释器实例之间保存宏空间、数据队列和外部注册信息。\n受影响版本中，Unix 上的 RXAPI 对通信端点授予过宽权限。SysLocalAPIManager::startServerProcess 在启动 rxapi 前调用 umask(0)；未设置 XDG_RUNTIME_DIR 时，SysServerLocalSocketConnectionManager::getServiceLocation 将套接字和锁文件放到 /tmp，APIService::acquireLock 以模式 0666 创建锁文件，任意本地用户可连接该端点并写入宏空间，后续 Rexx 脚本会执行这些宏。4.0.0 至 4.2.0 的 APIServer::initServer 还对 localhost 端口 10010（REXX_API_PORT）调用 make，客户端 LocalAPIManager 通过 open 接入，该通道没有认证。\n修复版本中通过在 APIService::main 创建锁文件和套接字之前设置 umask(077)，将 acquireLock 的文件模式改为 0600，并删除 startServerProcess 里的 umask(0)，阻断其他本地用户访问通信端点；同时从 ServiceMessage.hpp 移除 REXX_API_PORT 10010，并让 getServiceLocation 在回退到 /tmp 前优先使用可用的 TMPDIR。", "effects": [{"comp_name": "oorexx", "ecosystem": "linux", "versions": [{"affected_version": "[4.0.0,5.1.0)", "min_fixed_version": "5.1.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "关键资源权限分配不当", "kind_en": "关键资源的权限分配不正确", "last_modified_time": "2026-11-17", "level": "Critical", "mps_id": "MPS-ef84-luzg", "poc": false, "poc_url": [], "published_time": "2026-11-17", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ef84-luzg", "name": "https://www.oscs1024.com/hd/MPS-ef84-luzg"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-130327", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-130327"}, {"url": "https://sourceforge.net/p/oorexx/bugs/1981/", "name": ""}, {"url": "https://sourceforge.net/p/oorexx/code-0/12916/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "ooRexx RXAPI越权", "_translated": true, "_saved_at": "2026-11-17T01:25:57+00:00", "_first_saved_at": "2026-11-17T01:25:57+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ef84-luzg"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-130320", "cvss": {"cvssv31": [{"source": "cve@mitre.org", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H", "cwe": "CWE-122", "description": "Open Object Rexx（ooRexx）是开源的面向对象 Rexx 解释器。RXAPI 是其默认提供的本地 API 服务进程，负责在同一主机上的解释器进程之间管理数据队列、宏空间和外部函数注册。\n受影响版本中，APIServer::processMessages 从本地连接读入 ServiceMessage 后，APIServer::getInstance 对未见过的 userid 执行 new APIServerInstance。构造函数 APIServerInstance::APIServerInstance 使用 strcpy 把消息字段 userid 复制到位于对象末尾的定长数组 userid[MAX_USERID_LENGTH]。当该字段在数组长度内没有 NUL 终止符时，写入会越过堆对象边界，造成堆缓冲区溢出，并可能进一步执行任意代码。同一消息中的 nameArg 也被当作未确认边界的 C 字符串交给队列名和宏名处理。\n修复版本中通过把 userid 的复制改为按目标缓冲区长度截断并强制写入 NUL 的 Utilities::strncpy，同时把 isUser 改为 strncmp(message.userid, userid, sizeof(userid))，阻止未终止的 userid 再越过对象边界。名称字段 nameArg 的拷入同样改为带长度上限且保证终止的 Utilities::strncpy。", "effects": [{"comp_name": "ooRexx", "ecosystem": "linux", "versions": [{"affected_version": "[4.0.0,5.2.0)", "min_fixed_version": "5.2.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "堆缓冲区溢出", "kind_en": "基于堆的缓冲区溢出", "last_modified_time": "2026-11-17", "level": "Critical", "mps_id": "MPS-jv67-yup8", "poc": false, "poc_url": [], "published_time": "2026-11-17", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-jv67-yup8", "name": "https://www.oscs1024.com/hd/MPS-jv67-yup8"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-130320", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-130320"}, {"url": "https://sourceforge.net/p/oorexx/bugs/1982/", "name": ""}, {"url": "https://sourceforge.net/p/oorexx/code-0/12916/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "ooRexx RXAPI堆溢出", "_translated": true, "_saved_at": "2026-11-17T01:25:56+00:00", "_first_saved_at": "2026-11-17T01:25:56+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-jv67-yup8"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-129465", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-639", "description": "Zr.Admin.NET 是 izhaorui 开源的 .NET 前后端分离通用后台管理框架，采用 MIT 协议发布，提供用户、角色、部门、菜单、工作流等企业后台管理能力。\n受影响版本中，个人中心接口 PUT /system/user/profile 对应的 SysProfileController.UpdateProfile 直接信任请求体中的 UserId，SysUserService.ChangeUser 按该 UserId 更新 NickName、Email、Phonenumber、Status 等字段，全程未校验该标识与当前会话身份的归属关系，任意已登录用户可改写其他账号资料；攻击者把默认安装中 UserId 为 1 的管理员手机号改为自己控制的号码后，经匿名接口 /checkMobile 获取短信验证码，再由匿名接口 /PhoneLogin 凭手机号与验证码签发管理员令牌，完成管理员账号接管。\n修复版本中通过，可通过在 UpdateProfile 中强制以当前会话身份覆盖请求体 UserId、为 ChangeUser 补充归属校验，并对手机号变更与短信登录入口增加审计与限制进行缓解。", "effects": [{"comp_name": "Zr.Admin.NET", "ecosystem": "linux", "versions": [{"affected_version": "[af07ffc5d18e7876d3780d1ff5ee776b80950399,eb9228a23014f6000c06cab2f10ae0d44ecbbd3a]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "通过用户控制密钥绕过授权机制", "kind_en ++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-129464", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-22", "description": "Zr.Admin.NET 是 izhaorui 在 GitHub 开源（MIT 协议）的 .NET 通用后台管理快速开发框架，提供权限、文件、工作流、商城等模块，用于快速搭建 Web 管理系统。\n受影响版本中，CommonController.DownloadFile 将请求参数 path 直接作为服务器文件路径传入 BaseController.DownFile，后者仅判断文件存在后调用 System.IO.File.OpenRead 读取内容，全程未执行 Path.GetFullPath 归一化，也未限制在授权目录边界内，任意登录用户通过绝对路径或 ../ 序列可读取服务器任意文件；读取 appsettings 配置获得 JwtSettings SecretKey 后，由于令牌校验仅反序列化 userdata 声明，攻击者可伪造携带 RoleKeys=admin 的令牌接管管理员权限。\n修复版本中通过，可通过在网关或应用层拦截携带绝对路径与 ../ 序列的 path 参数、限制普通账号访问下载接口并轮换 JwtSettings SecretKey 缓解风险，上游发布修复版本后应及时升级。", "effects": [{"comp_name": "zr_admin_net", "ecosystem": "linux", "versions": [{"affected_version": "[0ee1ab8af5e3861766746d25acba1184111befcb,eb9228a23014f6000c06cab2f10ae0d44ecbbd3a]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "up ttps://vuldb.com/vuln/437464", "name": "VDB-437464 | DrayTek Vigor2960 File Existence Check mainfunction.cgi check_file_exist heap-based overflow"}, {"url": "https://vuldb.com/vuln/437464/cti", "name": "VDB-437464 | CTI Indicators (IOB, IOC, IOA)"}, {"url": "https://vuldb.com/cve/CVE-2026-129453", "name": "CVE-2026-129453 | CVE Analysis and Report"}, {"url": "https://vuldb.com/submit/1044963", "name": "Submit #1044963 | DrayTek Vigor2960 Vigor2960 1.5.1.6 (revision 8218) Authenticated check_file_exist Heap Memory Corruption"}, {"url": "https://github.com/yikesoftware/DrayTek_Vigor2960_Security_Analysis/tree/main/cases/DRV2960-0020-authenticated-check-file-exist-direct-cgi-core", "name": ""}, {"url": "https://fw.draytek.com.tw/Vigor2960/Firmware/v1.5.1.7/Vigor2960_v1.5.1.7.zip", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Vigor2960 堆缓冲区溢出漏洞", "_translated": true, "_saved_at": "2026-11-15T15:12:24+00:00", "_first_saved_at": "2026-11-15T15:12:24+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-c0wh-vj9e"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-125832", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:N/A:L", "severity": "high", "base_score": 8.5}]}, "cvss_score": 8.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:N/A:L", "cwe": "CWE-89", "description": "WP Data Access（wp-data-access）是开源 WordPress 插件，用于在站点中发布数据表、表单、仪表盘和图表，并按条件查询数据库。\n受影响版本中，已登录用户请求已发布 Data Table 时，ajax 动作 wp_ajax_wpda_datatables 进入 WPDA_Data_Tables::get_data。该方法取得出版物 pub_default_where 后，继续拼接请求中的 search[value] 以及 filter_field_name、filter_field_value，再对整段 WHERE 调用 WPDA::substitute_environment_vars。该函数发现 $$USERID$$、$$USER$$ 或 $$EMAIL$$ 时，把标记替换为占位符并对整段子句执行 $wpdb-\u003eprepare。检索条件在拼接时已经写入 LIKE 百分号，请求也可以自行带入上述标记，于是用户输入进入格式字符串并被再次解释，查询结构可被改写，导致数据库敏感信息泄露并带来低程度的可用性影响。\n修复版本中通过仅对 pub_default_where 调用 substitute_environment_vars，在追加 search[value] 和字段过滤条件之前完成环境变量替换，使用户输入不再进入该函数的占位符替换和 $wpdb-\u003eprepare。", "effects": [{"comp_name": "wp-data-access", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,5.5.93)", "min_fixed_version": "5.5.93", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-11-15", "level": "High", "mps_id": "MPS-dgip-ac53", "poc": false, "poc_url": [], "published_time": "2026-11-15", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-dgip-ac53", "name": "https://www.oscs1024.com/hd/MPS-dgip-ac53"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-125832", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-125832"}, {"url": "https://patchstack.com/database/wordpress/plugin/wp-data-access/vulnerability/wordpress-wp-data-access-plugin-5-5-92-sql-injection-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "WP Data Access SQL注入", "_translated": true, "_saved_at": "2026-11-15T15:12:20+00:00", "_first_saved_at": "2026-11-15T15:12:20+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS 1.3400)", "min_fixed_version": "1.3400", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "输入的句法正确性验证不当", "kind_en": "输入语法正确性验证不当", "last_modified_time": "2026-11-15", "level": "High", "mps_id": "MPS-ol9d-me8i", "poc": false, "poc_url": [], "published_time": "2026-11-15", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ol9d-me8i", "name": "https://www.oscs1024.com/hd/MPS-ol9d-me8i"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2015-10149", "name": "https://nvd.nist.gov/vuln/detail/CVE-2015-10149"}, {"url": "https://github.com/PerlDancer/Dancer/commit/5a68fddbaef903fd3bd58517ce585cde986716e4.patch", "name": ""}, {"url": "https://github.com/PerlDancer/Dancer/issues/1117", "name": ""}, {"url": "https://github.com/PerlDancer/Dancer/issues/1118", "name": ""}, {"url": "https://github.com/PerlDancer/Dancer/pull/1172", "name": ""}, {"url": "https://metacpan.org/release/BIGPRESH/Dancer-1.3400/changes", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Dancer会话ID校验缺失漏洞", "_translated": true, "_saved_at": "2026-11-15T00:37:26+00:00", "_first_saved_at": "2026-11-15T00:37:26+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ol9d-me8i"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "cnvd_id": "", "cve_id": "CVE-2026-129456", "cvss": {"cvssv4": [{"source": "57a55968-44ac-464c-a794-6ba3baad09c4", "vector": "CVSS:4.0/AV:N/AC:H/AT:P/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:L/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:N/R:A/V:X/RE:X/U:X", "severity": "high", "base_score": 7.7}]}, "cvss_score": 7.7, "cvss_vector": "CVSS:4.0/AV:N/AC:H/AT:P/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:L/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:N/R:A/V:X/RE:X/U:X", "cwe": "CWE-416", "description": "FRR（FRRouting）是开源的 IP 路由协议套件，其中的 bgpd 守护进程负责与对等体建立 BGP 会话并维护路由表，广泛部署于 Linux 路由器与网络设备。\n受影响版本中，bgpd 接受邻居发送的 RFC 9012 Tunnel Encapsulation 属性（类型 23），bgp_attr_encap() 对外层 TLV 长度与属性剩余长度不一致的情况仅记录日志并继续处理；已建立 BGP 会话的邻居通过 UPDATE 消息携带此类畸形属性，使 intern 化的子 TLV 链引用计数失衡，该链在 Adj-RIB-In 条目与 RIB 路径仍持有引用时被释放，后续路由替换、撤销或会话拆除触发 encap_unintern() 读取已释放内存并二次释放，bgpd 因内存记账断言失败退出，路由器上全部 BGP 会话中断，攻击者可在 bgpd 重启后重复触发。\n修复版本中通过在 bgp_attr_encap() 中将长度不一致判定为畸形属性，以 flog_err 记录错误日志并经 bgp_attr_malformed() 返回 BGP_NOTIFY_UPDATE_OPT_ATTR_ERR 通知，拒绝处理该属性，切断引用计数失衡与后续对已释放内存的访问路径，bgpd 不再因该属性崩溃。", "effects": [{"comp_name": "frrouting", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,10.2.6)", "min_fixed_version": "10.2.6", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[10.3,10.3.4)", "min_fixed_version": "10.3.4", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[10.6,10.6.0)", "min_fixed_version": "10.6.0", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[10.4,10.4.4)", "min_fixed_version": "10.4.4", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[10.5,10.5.4)", "min_fixed_version": "10.5.4", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": fa  "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-125780", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-22", "description": "Woocommerce Custom Product Addons Pro 是 Acowebs 开发的 WordPress 商业付费插件（插件目录 woo-custom-product-addons-pro），用于通过表单构建器为 WooCommerce 商品页面添加自定义选项字段，文件上传字段经由 admin-ajax.php 的 AJAX 上传与购物车提交流程处理。\n受影响版本中，未认证攻击者可以向 admin-ajax.php 的 wcpa_ajax_submit 入口提交购物车请求，插件在 WCPA_Form::submited_data() 中直接读取 $_REQUEST 内以字段名命名的 _ajax 参数并传入 move_file()；move_file() 将上传根目录、wcpa_uploads 与攻击者可控的相对路径直接拼接，复制完成后执行 @unlink 删除该路径，全程缺少目录边界校验，攻击者提交包含 ../ 序列的路径能够删除站点目录外的任意可读文件，例如 WordPress 配置文件 wp-config.php，造成站点核心文件丢失与服务中断。\n修复版本中通过发布 5.9.2 修复版本消除该路径穿越删除链，厂商未公开修复补丁细节，官方记录确认 5.9.2 及以上版本不再受影响，建议用户直接升级以切断攻击者对上传目录之外文件的删除能力。", "effects": [{"comp_name": "woo-custom-product-addons-pro", "ecosystem": "linux", "versions": [{"affected_version": "[0,5.9.2)", "min_fixed_version": "5.9.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-11-15", "level": "High", "mps_id": "MPS-fu31-yrzt", "poc": false, "poc_url": [], "published_time": "2026-11-15", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-fu31-yrzt", "name": "https://www.oscs1024.com/hd/MPS-fu31-yrzt"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-125780", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-125780"}, {"url": "https://patchstack.com/database/wordpress/plugin/woo-custom-product-addons-pro/vulnerability/wordpress-woocommerce-custom-product-addons-pro-plugin-5-9-0-arbitrary-file-deletion-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Acowebs WooCommerce产品插件任意文件删除漏洞", "_translated": true, "_saved_at": "2026-11-15T15:12:27+00:00", "_first_saved_at": "2026-11-15T15:12:27+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-fu31-yrzt"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-120687", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "cwe": "CWE-79", "description": "FooBox（Lightbox \u0026 Modal Popup WordPress Plugin – FooBox）是 FooPlugins 维护的 WordPress 开源灯箱插件，用于为站点图片和相册提供弹窗浏览与字幕展示，源码公开托管于 WordPress 官方插件目录，插件服务端生成配置、字幕逻辑由客户端脚本 foobox.free.min.js 完成。\n受影响版本中，客户端 Wordpress 附加组件的字幕生成处理器读取 .wp-caption 容器内 img 的 alt 属性作为字幕描述，先将该值写入独立 div 的 innerHTML 以还原字符实体并执行字幕去重比较，随后才调用净化函数处理字幕文本，未净化内容先于净化进入 innerHTML；bbPress 2.6.20 的 bbp_filter_kses 过滤链允许 img 与 pre 标签并在属性值中保留数字字符引用，攻击者借此保存形如 \u0026#60;img onerror=...\u0026#62; 的编码载荷，页面被访问时实体还原为真实标签并在该 innerHTML 写入点解析执行，在浏览用户浏览器上下文中运行任意 Web 脚本；安装 bbPress 且存在公开论坛时订阅者及以上权限可利用，默认 WordPress 环境需要撰稿人及以上权限，构成存储型 DOM XSS。\n修复版本中通过调整字幕处理顺序切断上述链路：2.8.8 版本在字符串化后先对字幕标题与描述调用净化函数，再进入 innerHTML 解码与去重比较，确保写入 innerHTML 的内容均为净化后文本，编码载荷失去在该写入点解析执行的入口。", "effects": [{"comp_name": "foobox-image-lightbox", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.8.8)", "min_fixed_version": "2.8.8", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-11-14", "level": "High", "mps_id": "MPS-a4ty-972b", "poc": false, "poc_url": [], "published_time": "2026-11-15", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-a4ty-972b", "name": "https://www.oscs1024.com/hd/MPS-a4ty-972b"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-120687", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-120687"}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/66b5a5a2-8f70-4a85-ad03-8bd159cafdf5?source=cve", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/foobox-image-lightbox/tags/2.8.7/free/js/foobox.free.min.js", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/foobox-image-lightbox/tags/2.8.7/free/includes/class-script-generator.php#L175", "name": ""}, {"url": "https://plug 些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-116753", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "cwe": "CWE-79", "description": "Multi Step for Contact Form 7（cf7-multi-step）是 Ninja Team 开发的 WordPress 开源插件，用于将 Contact Form 7 长表单拆分为多步骤表单，活跃安装量约一万。\n受影响版本中，插件注册的 REST 路由 cf7mls/v1/cf7mls_validation 对未认证请求开放，攻击者可通过 multipart 表单字段名（数组键）携带任意脚本；当目标表单启用 Save every step 选项且 Database for Contact Form 7 插件处于激活状态时，NjtCF7MLSValidation 类的 cf7mls_validation_callback 函数把整个 $_POST 数组赋给 $posted_data，并在后续循环中以数组键作为 name 写入 wp_cf7_data_entry 表，该键未做任何字符校验，叠加输出转义不足，含脚本的字段名被持久化并在用户访问相关页面时执行，形成存储型 XSS。\n修复版本中通过构建合法字段名白名单（表单 tag 名称与 submit_time、submit_ip、submit_user_id），并在写入数据库前跳过白名单之外的数组键，使攻击者控制的字段名不再进入 wp_cf7_data_entry 表，切断存储型 XSS 注入链。", "effects": [{"comp_name": "cf7-multi-step", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.9.2)", "min_fixed_version": "2.9.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-11-14", "level": "High", "mps_id": "MPS-t0u7-iwhg", "poc": false, "poc_url": [], "published_time": "2026-11-15", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-t0u7-iwhg", "name": "https://www.oscs1024.com/hd/MPS-t0u7-iwhg"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-116753", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-116753"}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/b9700627-97f2-4da1-a984-934062bd5014?source=cve", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/cf7-multi-step/tags/2.9.1/inc/frontend/validation.php#L330", "name": ""}, {"u ent": "由于应用程序或系统中存在敏感信息未经适当保护而被泄露给攻击者或未经授权的用户，这些敏感信息可能包括用户凭据、个人身份信息、敏感业务数据、系统配置信息等。信息暴露漏洞通常是由于设计、实施或配置错误引起的，例如不正确的访问控制、弱密码策略、缺乏加密、错误的日志处理等。", "title": "什么是未授权敏感信息泄露"}, {"content": "- 直接访问敏感信息：攻击者可以通过直接访问不正确配置或不受保护的资源来获取敏感信息，如通过公开可访问的URL、未经授权的文件目录访问等。\n- 越权访问：攻击者可能利用访问控制错误或不正确的权限配置来获取他们没有权限访问的敏感信息。\n- 错误信息披露：应用程序在错误处理过程中可能泄露敏感信息，例如将错误消息中的敏感数据返回给客户端或显示在日志文件中。\n- 信息泄露通过响应：攻击者可能利用应用程序在响应中不正确地包含敏感信息，如通过网页源代码、响应头部或响应消息体中的敏感数据。", "title": "未授权敏感信息泄露常见的攻击方式"}, {"content": "- 访问控制：确保只有经过授权的用户能够访问敏感信息，使用强大的身份验证和授权机制。\n- 数据加密：对于敏感信息，使用适当的加密算法对数据进行加密，包括数据传输和存储过程中的加密。\n- 错误处理和日志安全：正确处理错误情况，避免在错误消息中暴露敏感信息。同时，确保日志记录功能的安全性，避免将敏感信息记录在日志文件中。\n- 安全配置和最佳实践：遵循安全最佳实践，对应用程序、服务器和系统进行适当的配置，包括访问控制、权限管理、密码策略等。\n- 审计和监控：实施日志审计和监控机制，及时检测和响应任何异常活动或潜在的信息暴露事件。\n- 安全开发实践：在应用程序开发过程中，进行安全代码审查、漏洞扫描和安全测试，以及敏感信息的正确处理和保护。", "title": "如何预防未授权敏感信息泄露"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-123006", "cvss": {}, "cvss_score": 8.8, "cvss_vector": "", "cwe": "CWE-200", "description": "Gitea 是开源自托管 Git 服务，Go 模块为 gitea.dev，用于代码托管、仓库检索以及提交状态展示。\n受影响版本中，已登录用户调用仪表盘使用的 GET /repo/search 时，routers/web/repo 包的 SearchRepo 把完整 git_model.CommitStatus 赋给 WebSearchRepository.LatestCommitStatus 并经 ctx.JSON 输出。FindReposLatestCommitStatuses 将仓库对象写入 CommitStatus.Repo，该仓库的 Owner 是完整 user_model.User，而 Passwd、PasswdHashAlgo、Salt、Rands、Email 未设置 json:\"-\"，响应因此带出当前用户可见且存在 commit status 的仓库所有者的密码哈希、哈希算法、盐、Rands 与主邮箱，并一并带出内部仓库对象。\n修复版本中通过 SearchRepo 只拷贝 State 与 TargetURL 到 WebSearchCommitStatus，并为 CommitStatus 的 Repo 与 Creator 增加 json:\"-\"，切断完整用户记录进入该接口响应的路径。", "effects": [{"comp_name": "gitea.dev", "ecosystem": "go", "versions": [{"affected_version": "[28.0.0,28.4.0)", "min_fixed_version": "28.4.0", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "未授权敏感信息泄露", "kind_en": "向未经授权的行为者泄露敏感信息", "last_modified_time": "2026-11-16", "level": "High", "mps_id": "MPS-58nd-eos0", "poc": false, "poc_url": [], "published_time": "2026-11-16", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-58nd-eos0", "name": "https://www.oscs1024.com/hd/MPS-58nd-eos0"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-123006", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-123006"}, {"url": "https://blog.gitea.com/release-of-28.4.0/", "name": ""}, {"url": "https://github.com/go-gitea/gitea/pull/40377", "name": ""}, {"url": "https://github.com/go-gitea/gitea/pull/40384", "name": ""}, {"url": "https://github.com/go-gitea/gitea/releases/tag/v28.4.0", "name": ""}, {"url": "https://github.com/go-gitea/gitea/security/advisories/GHSA-frjx-8pcw-8c9q", "name": ""}], "scope_influence": "", "tags": ["go"], "title": "Gitea仓库搜索信息泄露", "_translated": true, "_saved_at": "2026-11-16T00:37:16+00:00", "_first_saved_at": "2026-11-16T00:37:16+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-58nd-eos0"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-82156", "cvss": {"cvssv31": [{"source": "security_alert@emc.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-863", "description": "Dell PowerStore 是戴尔开发的闭源企业存储阵列，PowerStoreT OS 运行于 PowerStore T 系列设备，用于提供块存储、文件服务与设备管理。\n受影响版本中，PowerStoreT OS 5.1.x 存在授权绕过缺陷。已具备低权限的攻击者可通过网络绕过授权限制，将权限提升为管理员，进而对存储系统的机密性、完整性与可用性造成高影响。\n修复版本中通过将 PowerStoreT OS 升级到 5.1.0.0-2798105 及以上版本消除该授权绕过路径，低权限身份不能再由此提升为管理员。厂商未公开源码级修改。", "effects": [{"comp_name": "PowerStore 1000T", "ecosystem": "linux", "versions": [{"affected_version": "[5.1,5.1.0.0-2798105)", "min_fixed_version": "5.1.0.0-2798105", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "PowerStore 1200T", "ecosystem": "linux", "versions": [{"affected_version": "[5.1,5.1.0.0-2798105)", "min_fixed_version": "5.1.0.0-2798105", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "PowerStore 1500", "ecosystem": "linux", "versions": [{"affected_version": "[5.1,5.1.0.0-2798105)", "min_fixed_version": "5.1.0.0-2798105", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "PowerStore 3000T", "ecosystem": "linux", "versions": [{"affected_version": "[5.1,5.1.0.0-2798105)", "min_fixed_version": "5.1.0.0-2798105", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "PowerStore 3200Q", "ecosystem": "linux", "versions": [{"affected_version": "[5.1,5.1.0.0-2798105)", "min_fixed_version": "5.1.0.0-2798105", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "PowerStore 3200T", "ecosystem": "linux", "versions": [{"affected_version": "[5.1,5.1.0.0-2798105)", "min_fixed_version": "5.1.0.0-2798105", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "PowerStore 5000T", "ecosystem": "linux", "versions": [{"affected_version": "[5.1,5.1.0.0-2798105)", "min_fixed_version": "5.1.0.0-2798105", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "PowerStore 500T", "ecos  "published_time": "2026-11-16", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-nzl5-tpia", "name": "https://www.oscs1024.com/hd/MPS-nzl5-tpia"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-82156", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-82156"}, {"url": "https://www.dell.com/support/kbdoc/en-us/000527640/dsa-2026-479-dell-powerstore-t-security-update-for-multiple-vulnerabilities", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "PowerStore授权绕过漏洞", "_translated": true, "_saved_at": "2026-11-16T07:32:24+00:00", "_first_saved_at": "2026-11-16T07:32:24+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-nzl5-tpia"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-129540", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-89", "description": "VoAPI 是用于聚合和分发大模型 API 的网关系统。GitHub 公开仓库只包含部署文件和占位程序，服务端以闭源容器镜像 voapi/voapi 发布，提供多用户令牌、渠道转发、日志和站点配置管理。\n受影响版本中，列表查询把前端提交的 search 参数键名当作 SQL 列名拼接，只对参数值做预编译绑定。已登录的普通用户调用 GET /api/log 等列表接口时，可以改写查询条件并读取 option 表 ps_site 记录中的 HS256 JWT 签名密钥，再保留自身 userId 与 sign、将 role 改为 manager 后访问 /api/m/* 管理接口，读取用户与渠道数据并修改站点配置。默认部署允许自行注册。\n修复版本中通过限制可过滤列名并停止拼接外部键名来消除该注入的补丁并未发布。截至 2026-11-16，CVE.org 只确认 1.0.0 至 1.2.0 受影响，GitHub 在公告之后没有新提交，维护者说明公开社区版已长期无人维护。", "effects": [{"comp_name": "voapi", "ecosystem": "linux", "versions": [{"affected_version": "[1.0.0,1.2.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-11-16", "level": "High", "mps_id": "MPS-o431-dupg", "poc": false, "poc_url": [], "published_time": "2026-11-16", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-o431-dupg", "name": "https://www.oscs1024.com/hd/MPS-o431-dupg"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-129540", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-129540"}, {"url": "https://vul.yulun.ac.cn/20261115/voapi/", "name": ""}, {"url": "https://github.com/VoAPI/VoAPI/issues/78", "name": ""}, {"url": "https://www.vulncheck.com/advisories/voapi-1.0.0-through-1.2.0-sql-injection-via-search-filter-key", "name": "VulnCheck Advisory: VoAPI 1.0.0 through 1.2.0 SQL Injection via search Filter Key"}], "scope_influence": "", "tags": ["AI", "应用软件"], "title": "VoAPI SQL注入漏洞", "_translated": true, "_saved_at": "2026-11-16T07:32:33+00:00", "_first_saved_at": "2026-11-16T07:32:33+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-o431-dupg"}, {"analysis_status": 0, "articles": [{"content": "- 条件竞争漏洞是由于程序中存在多个代码块同时访问同一个条件判断语句而导致的错误。在程序中，条件判断语句通常用于决定是否执行某些代码块。当一个程序有多个代码块同时访问同一个条件判断语句时，这些代码块可能会同时执行，从而导致程序执行结果出现不可预测的错误。", "title": "什么是竞争条件"}, {"content": "- 线程切换攻击：线程切换攻击是指攻击者通过利用竞争条件漏洞，使程序在执行时频繁切换线程，从而导致系统资源耗尽，最终实现拒绝服务攻击。\n- 内存泄漏攻击：内存泄漏攻击是指攻击者通过利用竞争条件漏洞，使得程序不断申请内存，但最终无法释放内存，从而导致内存泄漏，最终程序崩溃。\n- 缓存穿透攻击：缓存穿透攻击是指攻击者通过利用竞争条件漏洞，使得程序在访问缓存时，被缓存的数据并非当前最新的数据，从而攻击者可以获取到未更新的数据。\n- 指令重放攻击：指令重放攻击是指攻击者通过利用竞争条件漏洞，在程序执行时，将先前保存的指令序列重新执行，从而实现绕过某些验证，获取系统权限等攻击目的。\n", "title": "竞争条件常见的攻击方式"}, {"content": "- 使用互斥锁：在条件判断语句中，使用互斥锁来确保只有一个代码块能够访问变量。使用互斥锁可以提高程序的安全性和可靠性。\n- 使用条件封印：在条件判断语句中，将可能会修改变量的代码块封印起来，以确保这些代码块无法被其他代码块访问。\n- 使用条件过滤：在条件判断语句中，使用条件过滤来过滤掉那些不可能发生的条件判断语句。例如，对于一个包含多个条件判断语句的循环，可以只保留其中一个条件的判断，而将其他条件的判断语句过滤掉。\n- 使用性能优化：对于一些条件判断语句，可以使用性能优化来避免条件竞争的情况。例如，可以使用数组或链表等数据结构来存储条件判断语句中的变量，从而避免条件竞争的情况。", "title": "如何预防竞争条件"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-125423", "cvss": {}, "cvss_score": 8.5, "cvss_vector": "", "cwe": "CWE-362", "description": "Gitea 是使用 Go 开发的开源自托管 Git 服务，模块路径为 gitea.dev，用于在自有环境中托管代码仓库并提供网页与 API 访问。\n受影响版本中，开启 auto_init 创建仓库时，CreateRepositoryDirectly 在 git 裸仓库、委托钩子和初始提交完成前已将数据库记录写成 RepositoryReady，Git Smart HTTP 的 ServiceReceivePack 可以在该窗口写入对象。prepareRepoCommit 通过 git.CloneRepoToLocal 把仓库检出到临时目录，再用 os.WriteFile 覆盖 README.md。检出结果中的 README.md 若是指向 hooks/post-receive.d/gitea 的符号链接，写入会跟随链接改写仍保持可执行位的委托钩子，内容来自默认 README 模板并插入未经 shell 转义的仓库描述。initRepoCommit 随后执行 git.PushFromLocal，服务端 post-receive 以运行 Gitea 的操作系统账户执行被改写的钩子。\n修复版本中通过 prepareRepoCommit 先写入模板文件，再删除临时目录中的 .git 并调用 git.InitRepositoryLocal，初始提交不再基于对已有仓库内容的检出。CreateRepositoryDirectly 在初始化完成前将状态固定为 RepositoryBeingMigrated，httpBase 对 IsBeingCreated 的仓库拒绝 Git HTTP 访问，初始化成功且 needsUpdateToReady 为真时才更新为 RepositoryReady。", "effects": [{"comp_name": "gitea.dev", "ecosystem": "go", "versions": [{"affected_version": "(-∞,28.4.0)", "min_fixed_version": "28.4.0", "repository": "go", "solutions": [], "upstream": true}]}], " , "cnvd_id": "", "cve_id": "CVE-2026-125823", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-770", "description": "Gutenverse 是 Jegstudio 发布的开源 WordPress 区块与页面构建插件，用于在区块编辑器和站点编辑器中搭建页面、模板与站点布局。\n受影响版本中，插件默认注册无需认证的 REST 接口 gutenverse-client/v1/postblock/data 与 gutenverse-client/v1/postlist/data，并把请求中的 attributes 传入文章区块查询。Post_Abstract::filter_attribute 对 numberPost 与 paginationNumberPost 只执行 intval，未把结果限制为正数。paginationMode 不属于 loadmore 或 scrollload 时，count_total_page 会用 numberPost 覆盖后续页步长；该步长为 0 或负数且剩余量大于 0 时，while 循环无法减少剩余量，单个 HTTP 请求持续占用 PHP 进程并导致站点拒绝服务。\n修复版本中通过把 numberPost 与 paginationNumberPost 的下限限制为 1，并将 count_total_page 的递减循环改为按不小于 1 的步长计算页数，切断异常分页参数导致的不可终止循环。", "effects": [{"comp_name": "gutenverse", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,4.2.3)", "min_fixed_version": "4.2.3", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "不加限制或调节的资源分配", "kind_en": "不受限制或节流地分配资源", "last_modified_time": "2026-11-16", "level": "High", "mps_id": "MPS-kqxb-iowd", "poc": false, "poc_url": [], "published_time": "2026-11-16", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-kqxb-iowd", "name": "https://www.oscs1024.com/hd/MPS-kqxb-iowd"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-125823", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-125823"}, {"url": "https://patchstack.com/database/wordpress/plugin/gutenverse/vulnerability/wordpress-gutenverse-plugin-4-2-2-denial-of-service-attack-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Gutenverse分页拒绝服务", "_translated": true, "_saved_at": "2026-11-16T00:37:19+00:00", "_first_saved_at": "2026-11-15T20:42:59+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-kqxb-iowd"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-125817", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:L", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:L", "cwe": "CWE-79", "description": "Feedzy RSS Feeds（feedzy-rss-feeds）是 Themeisle 维护的开源 WordPress 插件，用于聚合、展示并导入外部 RSS 与 Atom 源。\n受影响版本中，管理员在导入界面校验 RSS 源时，Feedzy_Rss_Feeds_Admin 的 validate_feed 把远端频道标题原样放入返回 JSON 的 title 与 message。导入页脚本 handle_validation_response 将 url 和 message 拼成 HTML，showMessage 再用 jQuery 的 html 选项写入页面。攻击者无需站点账号。管理员校验其控制的源后，标题中的 HTML 在后台页面执行，造成存储型跨站脚本。导入预览中 get_dry_run_results 也会把远端错误文本直接写入状态 HTML。\n修复版本中通过在 validate_feed 先用 wp_strip_all_tags 去掉频道标题中的标记并解码为纯文本，在 handle_validation_response 用 escapeText 编码 url 与 message，并对 get_dry_run_results 的状态文本使用 esc_html，使校验结果和预览状态只按文本显示，不再进入 HTML 解析。", "effects": [{"comp_name": "feedzy-rss-feeds", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,5.2.16)", "min_fixed_version": "5.2.16", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-11-16", "level": "High", "mps_id": "MPS-183s-icur", "poc": false, "poc_url": [], "published_time": "2026-11-16", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-183s-icur", "name": "https://www.oscs1024.com/hd/MPS-183s-icur"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-125817", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-125817"}, {"url": "https://patchstack.com/database/wordpress/plugin/feedzy-rss-feeds/vulnerability/wordpress-feedzy-plugin-5-2-15-cross-site-scripting-xss-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Feedzy存储型XSS", "_translated": true, "_saved_at": "2026-11-16T00:37:23+00:00", "_first_saved_at": "2026-11-15T20:43:02+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-183s-icur"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式 append_city_url、belingogeo_insert_city_url 以及 belingogeo_generate_links 读取 geo_city 之后调用 sanitize_title，将城市片段限制为安全 slug 再写入 URL，阻断恶意标记进入页面输出。", "effects": [{"comp_name": "belingogeo", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.13.4)", "min_fixed_version": "1.13.4", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-11-16", "level": "High", "mps_id": "MPS-8e90-2d47", "poc": false, "poc_url": [], "published_time": "2026-11-16", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-8e90-2d47", "name": "https://www.oscs1024.com/hd/MPS-8e90-2d47"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-125830", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-125830"}, {"url": "https://patchstack.com/database/wordpress/plugin/belingogeo/vulnerability/wordpress-belingogeo-plugin-1-13-3-cross-site-scripting-xss-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "belingoGeo反射型XSS", "_translated": true, "_saved_at": "2026-11-16T00:37:20+00:00", "_first_saved_at": "2026-11-15T20:43:00+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-8e90-2d47"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过构造恶意的数据，将过多的数据输入到程序的缓冲区中，使得缓冲区的空间被填满，从而溢出到程序的栈 (stack) 或堆 (heap) 中，导致程序崩溃、拒绝服务、数据泄露等安全问题。\n", "title": "什么是经典缓冲区溢出"}, {"content": "| 类型        | 描述                                                         |\n| ----------- | ------------------------------------------------------------ |\n| 代码注入攻击      | 攻击者通过向程序的缓冲区输入恶意代码，从而控制程序执行流程，实现对程序操作的恶意操作。例如，攻击者可以通过向 Web 应用程序的输入框中输入恶意代码，从而执行任意的代码，破坏系统、窃取数据等。 |\n| 数据覆盖攻击      | 攻击者通过向程序的缓冲区输入过多的数据，从而覆盖程序中的重要数据或代码，实现对程序操作的恶意操作。例如，攻击者可以通过向聊天应用程序的输入框中输入过多的表情符号，从而覆盖程序中的重要数据，例如聊天消息、账号密码等。 |\n| 栈溢出攻击 | 攻击者通过向程序的栈中输入过多的数据，从而溢出到栈外部，实现对程序操作的恶意操作。例如，攻击者可以通过向游戏应用程序的输入框中输入过多的道具名称，从而覆盖程序中的重要数据，例如游戏数据、账号密码等。 |\n| 堆溢出攻击       | 攻击者通过向程序的堆中输入过多的数据，从而溢出到堆外部，实现对程序操作的恶意操作。例如，攻击者可以通过向操作系统工具的输入框中输入过多的命令，从而覆盖程序中的重要数据，例如系统文件、配置文件等。 |", "title": "经典缓冲区溢出常见的攻击方式"}, {"content": "- 输入验证：在程序输入处对输入数据进行严格的验证和过滤，确保输入数据符合预期的格式和类型，避免被攻击者注入恶意命令或数据。可以使用正则表达式、格式字符串等方式进行输入验证。\n- 输出过滤：在程序输出处对输出数据进行严格的过滤和检查，确保输出数据符合预期的格式和类型，避免被攻击者截获和篡改。可以使用安全的输出过滤库等方式进行输出过滤。\n- 使用安全的编程模型：使用安全的编程模型，例如避免使用原生的缓冲区管理函数，使用安全的框架和库来处理输入数据和执行命令，避免缓冲区溢出漏洞。\n- 数据库加密和访问控制：对于敏感数据和命令，使用加密和访问控制措施，确保只有授权用户可以访问和执行命令，避免被攻击者窃取和篡改。\n- 定期更新和升级：定期更新和升级应用程序和库的版本，确保应用程序和库的最新版本包含了最新的安全补丁和修复措施，避免安全漏洞的出现和利用。\n- 安全审计和监控：定期对系统和应用程序进行安全审计和监控，及时发现和阻止潜在的安全漏洞和攻击，确保系统和数据的安全和可靠性。", "title": "如何预防经典缓冲区溢出"}], "cnvd_id": "", "cve_id": "CVE-2026-129606", "cvss": {"cvssv31": [{"source": "PSIRT@samsung.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:N/I:H/A:H", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:N/I:H/A:H", "cwe": "CWE-120", "description": "Samsung mTower 是 Samsung 开源的轻量级可信执行环境固件，面向 Arm Cortex-M 等微控制器，用于在安全世界运行可信应用。其 HOTP 可信应用按 RFC 4226 在安全世界保存共享密钥并计算一次性口令。\n受影响版本中，非安全世界调用 HOTP_TA_InvokeCommandEntryPoint 并传入命令 TA_HOTP_CMD_REGISTER_SHARED_KEY 时，register_shared_key() 只核对参数类型，随后把调用方给出的 params[0].memref.size 当作 memcpy 长度，将 params[0].memref.buffer 复制进固定 64 字节的安全世界数组 K[]。该长度不受 sizeof(K) 约束，超长复制会覆盖 K[] 之后的安全世界 .bss，破坏安全世界内存完整性并可使安全世界停止响应。同文件 hmac_sha1() 虽有 MIN_KEY_SIZE 与 MAX_KEY_SIZE 检查，但该检查位于后续 TA_HOTP_CMD_GET_HOTP 路径，不能阻止这次复制。\n修复版本中通过在 memcpy 之前拒绝空缓冲区，并在密钥长度小于 MIN_KEY_SIZE 或大于 sizeof(K) 时返回 TEE_ERROR_BAD_PARAMETERS，使超长或过短的长度不再进入复制。", "effects": [{"comp_name": "mTower", "ecosystem": "linux", "versions": [{"affected_version": "[0.2.0,0.6.1)", "min_fixed_version": "0.6.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "经典缓冲区溢出", "kind_en": "不检查输入大小的缓冲区复制（“经典缓冲区溢出”）", "last_modified_time": "2026-11-16", "level": "High", "mps_id": "MPS-cs3a-wjqn", "poc": false, "poc_url": [], "published_time": "2026-11-16", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-cs3a-wjqn", "name": "https://www.oscs1024.com/hd/MPS-cs3a-wjqn"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-129606", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-129606"}, {"url": "https://github.com/Samsung/mTower/pull/254", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "mTower HOTP缓冲区溢出", "_translated": true, "_saved_at": "2026-11-16T07:32:23+00:00", "_first_saved_at": "2026-11-16T07:32:23+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-cs3a-wjqn"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-125760", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:L", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:L", "cwe": "CWE-79", "description": "Bit Assist（插件标识 bit-assist）是 Bit Apps 发布的开源 WordPress 聊天挂件插件，用于在站点页面提供多渠道客服入口，公开源码位于 GitHub 仓库 bit-apps-pro/bit-assist-wp。\n受影响版本中，IframeController::iframe 将查询参数 clientDomain 解析后来源写入 Content-Security-Policy 的 frame-ancestors，Widget.onMessageReceived 接收父页面 postMessage 时不核验来源，handleWindowLoaded 直接使用消息里的 apiEndPoint 请求挂件数据，showCallToAction 再通过 globalInnerHTML 把 call_to_action.text 写入 DOM。未认证攻击者可诱导用户浏览器加载该公开 iframe，使挂件改为向攻击者控制的接口取数，返回内容在 WordPress 站点源内按 HTML 解析。\n修复版本中通过限制 iframe 只向域名格式合法且已启用挂件的来源输出，并由服务端固定 apiEndPoint，同时在 onMessageReceived 校验消息的 source 与 origin，将行动号召文案改为 globalInnerText 以纯文本写入，切断跨源消息替换数据源后在页面中解析 HTML 的路径。", "effects": [{"comp_name": "bit-assist", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.8.5)", "min_fixed_version": "1.8.5", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-11-16", "level": "High", "mps_id": "MPS-g27c-6ear", "poc": false, "poc_url": [], "published_time": "2026-11-16", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-g27c-6ear", "name": "https://www.oscs1024.com/hd/MPS-g27c-6ear"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-125760", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-125760"}, {"url": "https://patchstack.co 本中，未登录访客通过 wpdAddComment 提交的评论正文进入 WpdiscuzCore::addComment() 并写入 comment_content。渲染评论时，WpdiscuzWalker::start_el() 在默认开启的 enableImageConversion 条件下调用 WpdiscuzHelper::makeClickable()，再由 replaceUrlToImg() 把匹配到的图片 URL 替换为 a 与 img 标记。7.6.75 中该匹配规则只排除紧邻 URL 之前的引号和竖线，仍会命中 HTML 标记内部的链接，替换结果插入原标记后形成存储型跨站脚本。审核者查看待审评论时脚本执行，评论获准后，打开该页面的访客也会执行该脚本。\n修复版本中通过收紧 makeClickable() 的 URL 匹配规则解决该问题，要求匹配位置不在引号之后且不位于 HTML 标记内部，并禁止 URL 含有引号或尖括号，使 Image URL Conversion 不再转换 HTML 标记中的链接。", "effects": [{"comp_name": "wpdiscuz", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,7.7.0)", "min_fixed_version": "7.7.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-11-16", "level": "High", "mps_id": "MPS-mv8l-kte3", "poc": false, "poc_url": [], "published_time": "2026-11-16", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-mv8l-kte3", "name": "https://www.oscs1024.com/hd/MPS-mv8l-kte3"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-125818", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-125818"}, {"url": "https://patchstack.com/database/wordpress/plugin/wpdiscuz/vulnerability/wordpress-wpdiscuz-plugin-7-6-75-cross-site-scripting-xss-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "wpDiscuz存储型XSS", "_translated": true, "_saved_at": "2026-11-16T00:37:21+00:00", "_first_saved_at": "2026-11-15T20:43:01+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-mv8l-kte3"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键 ts": [{"comp_name": "wp-file-upload", "ecosystem": "linux", "versions": [{"affected_version": "[0,5.2.4)", "min_fixed_version": "5.2.4", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-11-16", "level": "High", "mps_id": "MPS-pl4j-zkb7", "poc": false, "poc_url": [], "published_time": "2026-11-16", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-pl4j-zkb7", "name": "https://www.oscs1024.com/hd/MPS-pl4j-zkb7"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-125822", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-125822"}, {"url": "https://patchstack.com/database/wordpress/plugin/wp-file-upload/vulnerability/wordpress-wordpress-file-upload-plugin-5-2-3-cross-site-scripting-xss-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "文件上传插件存储型XSS", "_translated": true, "_saved_at": "2026-11-16T00:37:17+00:00", "_first_saved_at": "2026-11-15T20:42:58+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-pl4j-zkb7"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-91115", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "cwe": "CWE-470", "description": "Silverstripe Framework is a PHP framework which powers the Silverstripe CMS. From 6.0.0 until 6.2.13, the writer option of i18nTextCollectorTask is passed to the dependency injector without validating that it names an allowed writer implementation. A crafted dev task URL can therefore instantiate arbitrary objects with attacker-controlled constructor arguments and execute code on the server. An administrator can be induced to run the task by following a link because the nested task did not require confirmation, and a site in dev mode exposes the path without authentication. CMS 5 is not affected. This issue is fixed in version 6.2.13.", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "使用外部可控制的输入来选择类或代码（不安全的反射）", "kind_en": "使用外部控制输入来选择类或代码（“不安全反射”）", "last_modified_time": "2026-11-17", "level": "High", "mps_id": "MPS-1t8e-ul6b", "poc": false, "poc_url": [], "published_time": "2026-11-17", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-1t8e-ul6b", "name": "https://www.oscs1024.com/hd/MPS-1t8e-ul6b"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-91115", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-91115"}, {"url": "https://github.com/silverstripe/silverstripe-framework/commit/2df498b1fad25db95dbd882117dcd0527a5fdbfa", "name": ""}, {"url": "https://github.com/silverstripe/silverstripe-framework/pull/12035", "name": ""}, {"url": "https://github.com/silverstripe/silverstripe-framework/releases/tag/6.2.13", "name": ""}, {"url": "https://github.com/silverstripe/silverstripe-framework/security/advisories/GHSA-c94f-87xg-65wf", "name": ""}, {"url": "https://www.silverstripe.org/download/security-releases/cve-2026-91115", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-91115 漏洞", "_translated": true, "_saved_at": "2026-11-17T09:59:47+00:00", "_first_saved_at": "2026-11-16T17:46:41+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-1t8e-ul6b"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-109138", "cvss": {"cvssv4": [{"source": "30a5e7fb-040d-440a-8cdf-a4a2068ce72e", "vector": "CVSS:4.0/AV:A/AC:L/AT:N/PR:N/UI:N/VC:N/VI:H/VA:N/SC:N/SI:H/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.3}]}, "cvss_score": 8.3, "cvss_vector": "CVSS:4.0/AV:A/AC:L/AT:N/PR:N/UI:N/VC:N/VI:H/VA:N/SC:N/SI:H/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-863", "description": "Nordic Semiconductor nRF Door Lock and Access Control Add-on 是面向 nRF Connect SDK 的开源附加组件，源码位于 nrfconnect/ncs-door-lock-and-access-control，用于构建兼容 Aliro 与 Matter 的门锁和门禁读卡器参考应用。\n受影响版本中，在启用 CONFIG_DOOR_LOCK_CREDENTIAL_ISSUER_CA 与 CONFIG_DOOR_LOCK_STEP_UP_PHASE 的构建里，AccessManager::VerifyAccessCredential 对未预先登记的用户公钥改走 Access Document 路径，并调用 AccessManagerImpl::ProcessValidityIteration。该方法用 IsPublicKeyStored 在已配置签发方数组中查找 Credential Issuer，查找失败时 VerifyOrReturnStatus 返回 ALIRO_NO_ERROR，跳过 ValidityIteration 凭证回滚校验。仅经证书链信任、未写入该数组的签发方在提高迭代号撤销旧凭证后，持有仍由其正确签名的旧 Access Document 的主体仍可获得物理通行授权。默认 Matter 配置不受影响。\n修复版本中通过 1aeeedbe50d062abc4f49469e8df58fa806cd0ec 删除查找失败即返回成功的分支，ProcessValidityIteration 改为按已解析签发方索引读取并校验迭代号；ProcessAccessDocument 使用 FindCredentialIssuerKeyIndex 同时覆盖已配置签发方和证书学习到的签发方，未知签发方在证书密钥存储启用时先记录当前迭代号，否则返回 ALIRO_ERROR_NOT_IMPLEMENTED，使旧 Access Document 不能再因查找失败绕过回滚检查。", "effects": [{"comp_name": "nRF Door Lock and Access Control Add-on", "ecosystem": "linux", "versions": [{"affected_version": "[1.0.0,1.2.0)", "min_fixed_version": "1.2.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-11-17", "level": "High", "mps_id": "MPS-i2sf-t3hx", "poc": false, "poc_url": [], "published_time": "2026-11-17", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-i2sf-t3hx", "name": "https://www.oscs1024.com/hd/MPS-i2sf-t3hx"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-109138", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-109138"}, {"url": "https://docs.nordicsemi.com/r/bundle/struct_sa/page/struct/sa.html", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "nRF门锁凭证回滚绕过", "_translated": true, "_saved_at": "2026-11-17T09:59:47+00:00", "_first_saved_at": "2026-11-17T09:59:47+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-i2sf-t3hx"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-121864", "cvss": {"cvssv31": [{"source": "vulnreport@tenable.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "high", "base_score": 8.5}], "cvssv4": [{"source": "vulnreport@tenable.com", "vector": "CVSS:4.0/AV:N/AC:H/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.7}]}, "cvss_score": 7.7, "cvss_vector": "CVSS:4.0/AV:N/AC:H/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-73", "description": "nanobot 是 HKUDS 团队在 GitHub 开源的轻量级个人 AI 代理（Python 编写，MIT 协议），通过网关接入 Telegram、Discord、WhatsApp 等聊天渠道与 WebSocket 界面，为大模型代理提供 exec 等 shell 工具，并支持基于 Linux bubblewrap（bwrap）或 macOS Seatbelt 的沙箱化命令执行。\n受影响版本中，exec 工具把代理指定的 shell 参数交给 _resolve_shell 校验，该函数对绝对路径仅检查文件名属于 sh、bash、zsh 且带有可执行位，随后原样返回该路径；_prepare_command 先把命令包装为 bwrap 沙箱命令，_spawn 再以调用方选择的 shell 作为宿主机顶层进程执行被包装的命令，攻击者诱导代理在工作区写入名为 bash 的可执行文件并以该路径作为 shell 调用 exec 后，该文件在沙箱外以 nanobot 进程的系统权限运行，绕过 bwrap 对工作区的限制，访问该服务账号可触达的宿主机资源。\n修复版本中通过 0.4.1 版本（commit 4dd3fbec）把 _prepare_command 中的沙箱包装移到 shell 解析之后，将调用方选择的 shell 与登录配置文件一并包进沙箱内执行，并改用操作系统默认可执行路径解析 bwrap 启动器，启动器缺失时直接报错拒绝执行，切断在沙箱外启动代理可控 shell 的利用链。", "effects": [{"comp_name": "nanobot", "ecosystem": "linux", "versions": [{"affected_version": "[0.2.1,0.4.1)", "min_fixed_version": "0.4.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "nanobot-ai", "ecosystem": "pip", "versions": [{"affected_version": "[0.2.1,0.4.1)", "min_fixed_version": "0.4.1", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "文件名或路径的外部可控制", "kind_en": "文件名或路径的外部控制", "last_modified_time": "2026-11-17", "level": "High", "mps_id": "MPS-5u3r-t8ew", "poc": false, "poc_url": [], "published_time": "2026-11-17", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-5u3r-t8ew", "name": "https://www.oscs1024.com/hd/MPS-5u3r-t8ew"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-121864", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-121864"}, {"url": "https://github.com/HKUDS/nanobot/releases/tag/v0.4.1", "name": ""}, {"url": "https://github.com/HKUDS/nanobot/security/advisories/GHSA-5v87-m222-qr94", "name": ""}, {"url": "https://www.tenable.com/security/research/tra-2026-68", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "nanobot 沙箱逃逸漏洞", "_translated": true, "_saved_at": "2026-11-17T09:59:41+00:00", "_first_saved_at": "2026-11-17T09:59:41+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-5u3r-t8ew"}, {"analysis_status": 0, "articles" 径与目录存在性，宿主机上任意已存在目录被设为新会话的工作区根目录，Agent 可读取并外传 nanobot 服务账号在该目录下可读的文件。\n修复版本中通过，0.4.1 将工作区变更收回到已认证 WebUI 属主边界，workspace_project_selection_available 仅对 webui 连接返回 True，scope_for_message 以操作员配置构造基线并以其为上限执行提升校验，遗留文本帧经 dispatch_legacy_message 进入同一工作区边界授权，普通客户端被限制在操作员配置的工作区权限内，无法再选择配置外目录作为会话根目录。", "effects": [{"comp_name": "nanobot-ai", "ecosystem": "pip", "versions": [{"affected_version": "[0.3.5,0.4.1)", "min_fixed_version": "0.4.1", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-11-17", "level": "High", "mps_id": "MPS-b1xz-tgci", "poc": false, "poc_url": [], "published_time": "2026-11-17", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-b1xz-tgci", "name": "https://www.oscs1024.com/hd/MPS-b1xz-tgci"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-121865", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-121865"}, {"url": "https://github.com/HKUDS/nanobot/releases/tag/v0.4.1", "name": ""}, {"url": "https://github.com/HKUDS/nanobot/security/advisories/GHSA-hg87-wf6q-3m38", "name": ""}, {"url": "https://www.tenable.com/security/research/tra-2026-69", "name": ""}], "scope_influence": "", "tags": ["应用软件", "AI"], "title": "nanobot WebSocket 工作区越权漏洞", "_translated": true, "_saved_at": "2026-11-17T09:59:39+00:00", "_first_saved_at": "2026-11-17T09:59:39+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-b1xz-tgci"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-119643", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "cwe": "CWE-79", "description": "MembershipWorks（WordPress.org 插件标识 memberfindme）是按 GPL-2.0 发布的开源插件，用于通过短代码和小部件把 MembershipWorks 账户中的会员、活动与名录数据嵌入网站。\n受影响版本中，sf_shortcode()、sf_widget_event_do() 与 sf_widget_folder_do() 从 MembershipWorks SaaS API 取回会员或活动数据后，把 nam、ttl、url、adn、szp、ezp 直接拼进页面 HTML，未做输出编码。sf_widget_folder_do() 在会员幻灯片分支还会把 nam 放入图片 alt，并由 onerror 执行 this.parentNode.innerHTML=this.alt，属性值被浏览器还原后按 HTML 解析。未认证攻击者可借助写入该接口的会员或活动字段注入脚本，脚本随接口数据保存，并在访客打开展示页面时于浏览器中执行。\n修复版本中通过为 nam、ttl、url、adn、szp、ezp 增加 esc_html、esc_url 或 wp_kses_post 编码，并把幻灯片图片 onerror 从 innerHTML 赋值改为 textContent 赋值，切断接口数据进入 HTML 解析的路径。", "eff A:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-672", "description": "nRF Door Lock and Access Control Add-on 是 Nordic Semiconductor 的开源 nRF Connect SDK 附加组件，包含 aliro-access-control-app 与 matter-aliro-door-lock-app 两套 Aliro 门禁参考应用，用于在门锁上验证移动凭证并控制开门。\n受影响版本中，持久化 Access Document 使用版本 1 结构，StoreAccessDocument 未写入 validFrom 与 validUntil。缓存公钥路径从 Aliro::Interface::Access::ProcessAccessRequest 进入 AccessManagerImpl::_VerifyAccessCredential 后调用 VerifyPublicKey，该函数在公钥与已存记录一致时直接返回成功。Kpersistent 快速路径从另一重载 ProcessAccessRequest 进入 AccessManagerImpl::_VerifyKPersistentKey，解析出对应公钥后直接授权，不复核 Access Document 有效期。曾在有效期内完成首次出示且缓存记录仍保留的限时 Aliro 凭证，过期后仍可获得物理开门授权。\n修复版本中通过将 validFrom、validUntil 与时间校验标志保存到版本 2 的 Access Document，并在 VerifyPublicKey 匹配公钥后调用 IsStoredAccessDocumentValid 复核有效期，过期则删除记录并拒绝授权；_VerifyKPersistentKey 在取得公钥后改为调用 VerifyPublicKey，阻断过期凭证继续开门。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "在过期或释放后对资源进行操作", "kind_en": "资源过期或释放后的操作", "last_modified_time": "2026-11-17", "level": "High", "mps_id": "MPS-ahgf-tbzv", "poc": false, "poc_url": [], "published_time": "2026-11-17", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ahgf-tbzv", "name": "https://www.oscs1024.com/hd/MPS-ahgf-tbzv"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-109148", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-109148"}, {"url": "https://docs.nordicsemi.com/r/bundle/struct_sa/page/struct/sa.html", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Aliro门锁过期凭证绕过", "_translated": true, "_saved_at": "2026-11-17T09:59:45+00:00", "_first_saved_at": "2026-11-17T09:59:45+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ahgf-tbzv"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通
