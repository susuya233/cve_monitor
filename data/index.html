；同时外层 TOC 成员循环未在达到 MaxFiles、扫描超时或收到中止标志后停止。攻击者将高压缩比 deflate 流封装为 XAR GZIP 成员并提交扫描，引擎会持续解压并把全部输出写入临时文件直至流结束，可超出配置限额耗尽临时存储并陷入长时间循环，造成拒绝服务。\n修复版本中通过在写入前跟踪成员累计解压输出并校验 out_size 与本次解压字节之和，超出 MaxFileSize 或 MaxScanSize 时将本次写入截断到剩余配额并停止当前成员解压，超出部分计入聚合扫描配额避免后续成员重复占用；同时在提取每个成员前检查文件数、超时与中止标志，向上传播 CL_ETIMEOUT 与 CL_EMAXFILES 退出条件，切断了利用无界解压写入耗尽临时存储的路径。", "effects": [{"comp_name": "clamav", "ecosystem": "linux", "versions": [{"affected_version": "[0.98,1.4.7)", "min_fixed_version": "1.4.7", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[1.5.0,1.5.5)", "min_fixed_version": "1.5.5", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "行为工作流的不恰当实施", "kind_en": "Improper Enforcement of Behavioral Workflow", "last_modified_time": "2026-11-19", "level": "High", "mps_id": "MPS-4jcl-r1m5", "poc": false, "poc_url": [], "published_time": "2026-11-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-4jcl-r1m5", "name": "https://www.oscs1024.com/hd/MPS-4jcl-r1m5"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-76516", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-76516"}, {"url": "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-clamav-multi-e93M3vdA", "name": "cisco-sa-clamav-multi-e93M3vdA"}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "ClamAV XAR GZIP解压限额绕过致拒绝服务漏洞", "_translated": true, "_saved_at": "2026-11-18T18:36:43+00:00", "_first_saved_at": "2026-11-18T18:36:43+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-4jcl-r1m5"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-76422", "cvss": {"cvssv31": [{"source": "psirt@cisco.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-134", "description": "ClamAV 是 Cisco Talos 维护的开源防病毒引擎，用于邮件网关、终端防护等场景的文件扫描与恶意软件检测。\n受影响版本中，Rust 模块的日志桥接层 libclamav_rust/src/logging.rs 在 ClamLogger::log 方法中将已渲染完成的日志消息指针直接用作 C 侧变参日志函数 cli_dbgmsg_no_inline、cli_errmsg、cli_infomsg_simple、cli_warnmsg 的格式化字符串。在启用调试日志功能时，攻击者提交的待扫描文件中的可控文本（如归档内条目名等解析结果）可进入日志消息，其中的百分号指示符被变参函数当作格式说明符解析并读取不存在的变参参数，导致扫描进程终止，也可能造成内存信息泄露或内存破坏。\n修复版本中通过为全部 Rust 到 C 的日志调用改用固定 %s 格式说明符，并将已渲染的消息作为数据参数传入，日志内容不再被解释为格式化字符串，切断格式指示符注入路径，消除扫描进程崩溃风险。", "effects": [{"comp_name": "clamav", "ecosystem": "linux", "versions": [{"affected_version": "[0.105.0,1.4.7)", "min_fixed_version": "1.4.7", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[1.5.0,1.5.5)", "min_fixed_version": "1.5.5", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "使用外部控制的格式字符串", "kind_en": "使用外部控制的格式字符串", "last_modified_time": "2026-11-19", "level": "High", "mps_id": "MPS-8j7u-9il6", "poc": false, "poc_url": [], "published_time": "2026-11-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-8j7u-9il6", "name": "https://www.oscs1024.com/hd/MPS-8j7u-9il6"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-76422", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-76422"}, {"url": "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-clamav-multi-e93M3vdA", "name": "cisco-sa-clamav-multi-e93M3vdA"}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "ClamAV 格式字符串漏洞", "_translated": true, "_saved_at": "2026-11-18T18:36:45+00:00", "_first_saved_at": "2026-11-18T18:36:45+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-8j7u-9il6"}, {"analysis_status": 0, "articles": [{"content": "跨界内存读是指应用程序在读取内存时，未正确验证或限制读取的内存范围。攻击者利用这种漏洞可以读取应用程序内存中的敏感数据，如密码、加密密钥、会话令牌等。常见的原因是由于缓冲区溢出、格式化字符串漏洞或其他内存错误导致的。", "title": "什么是越界读取"}, {"content": "攻击者可以通过不当构造的输入来触发跨界内存读漏洞。攻击者可能会通过向应用程序发送特定的输入，使其读取超过预期的内存区域。攻击者可以利用这个漏洞来获取敏感信息，如其他用户的数据、操作系统的敏感数据或应用程序的内部状态。", "title": "越界读取常见的攻击方式"}, {"content": "- 输入验证和限制：应用程序应对所有输入数据进行严格的验证和限制。确保输入数据的长度、格式和内容符合预期，避免超出缓冲区或访问非预期的内存区域。\n- 内存安全编程实践：开发人员应使用安全的编程实践，如避免使用不安全的函数、正确处理内存分配和释放操作，以及遵循最小特权原则。\n- 使用安全的编程语言和库：选择使用安全性较高的编程语言和库，这些语言和库在内存管理和安全性方面提供了更多的保护机制。\n- 定期进行代码审查和安全测试：定期审查应用程序的代码，并进行安全测试，以发现潜在的跨界内存读漏洞。使用静态代码分析工具和漏洞扫描工具来辅助检测和修复问题。\n- 实施防御性编程技术：应用程序应采用防御性编程技术，如使用随机化地址空间布局（ASLR）、堆栈保护机制（如堆栈溢出保护）和数据执行预防（DEP）等。\n- 及时更新和修补：及时应用程序和操作系统的安全更新和补丁，以确保已知的跨界内存读漏洞得到修复。及时更新相关软件和库，以避免使用已知存在漏洞的版本。", "title": "如何预防越界读取"}], "cnvd_id": "", "cve_id": "CVE-2026-76430", "cvss": {"cvssv31": [{"source": "psirt@cisco.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-125", "description": "ClamAV 是 Cisco Talos 团队维护的开源反病毒引擎（GPL-2.0），以 libclamav 库及 clamscan、clamd 等工具提供，广泛用于邮件网关、文件上传扫描与终端防护产品（含 Cisco Secure Endpoint），可解析扫描 UPX 加壳的 PE 可执行文件。\n受影响版本中，libclamav 的 cli_scanpe 在解包 UPX 文件时让全部解码尝试共享同一块按 dsize + 8192 字节分配的堆缓冲区，并以指针方式传递逻辑输出长度 dsize；NRV2B/NRV2D/NRV2E 解码成功后 pefromupx 会把 *dsize 更新为重建 PE 的 foffset，随后的 LZMA 解码器 upx_inflatelzma 仍复用该缓冲区并按放大后的长度写入，而 pefromupx 仅以可被放大的 *dsize + 8192 作为 memcpy(dst, newbuf, foffset) 的边界依据，未对照真实分配容量校验长度，攻击者提交构造的 UPX 文件即可使长度检查失效，造成堆内存越界读取并使扫描进程崩溃，形成拒绝服务。\n修复版本中通过引入不可变的分配容量 dst_capacity 切断该链条：解码前校验 *dsize 不超过容量，优先匹配显式 LZMA stub 并在首个解码成功后停止复用目的缓冲区，要求 LZMA 输出完整结束并清理失败输出，把重建 PE 的段拷贝同时限制在解码输入与物理目的缓冲区边界内，并以无符号运算解码 NRV 回引偏移，消除越界访问导致的扫描进程崩溃。", "effects": [{"comp_name": "clamav", "ecosystem": "linux", "versions": [{"affected_version": "[0.94.1,1.4.7)", "min_fixed_version": "1.4.7", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[1.5.0,1.5.5)", "min_fixed_version": "1.5.5", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界读取", "kind_en": "越界读取", "last_modified_time": "2026-11-19", "level": "High", "mps_id": "MPS-hn8k-73r1", "poc": false, "poc_url": [], "published_time": "2026-11-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-hn8k-73r1", "name": "https://www.oscs1024.com/hd/MPS-hn8k-73r1"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-76430", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-76430"}, {"url": "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-clamav-multi-e93M3vdA", "name": "cisco-sa-clamav-multi-e93M3vdA"}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "ClamAV UPX堆越界读漏洞", "_translated": true, "_saved_at": "2026-11-18T18:36:47+00:00", "_first_saved_at": "2026-11-18T18:36:47+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-hn8k-73r1"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能有效地控制资源的使用，导致攻击者可以利用这个漏洞耗尽应用程序所依赖的资源。这些资源可以是计算资源（CPU、内存）、网络带宽、数据库连接或其他系统资源。攻击者可以通过发送特制的请求、恶意输入或其他方式，使应用程序消耗大量资源，导致拒绝服务或系统崩溃。", "title": "什么是拒绝服务"}, {"content": "- 消耗计算资源：攻击者可以发送计算密集型的请求，例如复杂的计算、无限循环或递归操作，以耗尽应用程序的计算资源，导致应用程序无法响应其他请求。\r\n- 消耗内存资源：攻击者可以发送大量的数据或恶意输入，以导致应用程序消耗过多的内存资源，从而使系统的可用内存耗尽，并导致应用程序崩溃或变得不可用。\r\n- 消耗网络带宽：攻击者可以发送大量的请求或大型数据包，以消耗应用程序所依赖的网络带宽。这会导致其他合法用户无法正常访问应用程序或降低系统的整体网络性能。\r\n- 消耗存储资源：攻击者可以发送大量的请求或上传大文件，以耗尽应用程序的存储资源，导致系统无法处理其他请求或存储新的数据。", "title": "拒绝服务常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对输入数据进行合理的验证和过滤，防止恶意输入导致资源消耗过高。\r\n- 实施资源限制：应用程序应该实施适当的资源限制策略，例如限制计算操作的时间或次数，限制内存使用量，限制并发连接数等，以防止资源被耗尽。\r\n- 异常处理与错误恢复：应用程序应该具备健壮的异常处理和错误恢复机制，以防止因意外错误导致资源泄漏或无法释放的情况。\r\n- 资源监控与警报：应用程序应该实施适当的资源监控和警报机制，及时发现异常的资源消耗情况，并采取相应的措施来应对。\r\n- 压力测试与性能优化：应用程序应该进行压力测试，以评估其在高负载情况下的性能，并进行必要的性能优化，以确保能够有效地处理大量请求而不耗尽资源。", "title": "如何预防拒绝服务"}], "cnvd_id": "", "cve_id": "CVE-2026-76515", "cvss": {"cvssv31": [{"source": "psirt@cisco.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-400", "description": "ClamAV 是 Cisco Talos 维护的开源反恶意软件扫描引擎，以 GPL-2.0 协议发布，提供 clamscan 命令行扫描器、clamd 扫描守护进程与 libclamav 扫描库，广泛用于邮件网关、文件上传检测和终端安全产品，其中 OLE2 解析器负责处理 Microsoft Compound File Binary（CFB）复合文档。\n受影响版本中，libclamav/ole2_extract.c 的 ole2_walk_property_tree() 在处理每个目录属性节点时都将 current_block 重置为 hdr-\u003eprop_start，并通过 ole2_get_next_block_number() 从头重走目录扇区 FAT 链定位属性所在扇区，重复遍历成本随属性节点数与目录链长叠加；该循环内唯一的超时检查 cli_json_timeout_cycle_check() 只在启用 JSON 元数据收集时才间接检查扫描时限，BAT/XBAT 扇区回读与 XBAT 链回溯均无截止时间检查，攻击者向扫描服务提交构造的 CFB 文件，可使 OLE2 解析超出 MaxScanTime 限制并陷入无限循环，耗尽扫描进程 CPU 造成拒绝服务。\n修复版本中通过新增 ole2_build_property_block_list() 一次性遍历并缓存可达的目录扇区链，配合 visited 位集检测环路、按文件长度限制扇区数上限，ole2_walk_property_tree() 改为按每扇区目录项数 entries_per_sector 直接从缓存定位属性，节点处理与 BAT/XBAT 链回溯统一接入 cli_checktimelimit() 实时时限检查，切断了反复重走 FAT 链的放大路径，保证 MaxScanTime 超时被及时强制执行。", "effects": [{"comp_name": "cisco:secure_endpoint_connector", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,8.6.4)", "min_fixed_version": "8.6.4", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,1.27.5)", "min_fixed_version": "1.27.5", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,1.29.3)", "min_fixed_version": "1.29.3", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "clamav", "ecosystem": "linux", "versions": [{"affected_version": "[0.98.1,1.4.7)", "min_fixed_version": "1.4.7", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[1.5.0,1.5.5)", "min_fixed_version": "1.5.5", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "拒绝服务", "kind_en": "不受控制的资源消耗", "last_modified_time": "2026-11-19", "level": "High", "mps_id": "MPS-no6g- ysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-76416", "cvss": {"cvssv31": [{"source": "psirt@cisco.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-835", "description": "ClamAV 是 Cisco Talos 维护的开源防病毒引擎，广泛用于邮件网关与终端防护产品，其 InstallShield 解析器负责解析附加在 PE 安装程序 overlay 中的 InstallShield 安装包数据。\n受影响版本中，libclamav/ishield.c 的 is_parse_hdr 函数直接信任 data1.hdr 头部 OBJECTS 结构声明的 files_cnt，文件表偏移按 h1_data_off、objs_dirs_off 与 dir_sz2 相加计算且未与头部实际大小比对。当声明的文件表记录未完整存在于头部映射中时，fmap_need_off 读取失败后循环仍按声明次数继续推进偏移，循环内亦未检查扫描时限，攻击者远程提交一个包含此类畸形头部的 PE 文件供扫描，可使扫描工作进程长时间被占用，造成拒绝服务。\n修复版本中通过在解析前校验头部声明与实际数据的一致性切断该循环：data_off、目录区偏移与文件表大小均被限制在头部范围内，迭代次数上限改为按 IS_FILEITEM 记录大小计算出的实际可用记录数，每轮迭代先检查扫描时限，映射失败时终止解析并回退到原始扫描，同时对目录与文件名偏移以及 cabinet 流边界补充越界校验。", "effects": [{"comp_name": "clamav", "ecosystem": "linux", "versions": [{"affected_version": "[0.96,1.4.7)", "min_fixed_version": "1.4.7", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[1.5.0,1.5.5)", "min_fixed_version": "1.5.5", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "不可达退出条件的循环（无限循环）", "kind_en": "具有无法到达的退出条件的循环（“无限循环”）", "last_modified_time": "2026-11-19", "level": "High", "mps_id": "MPS-v8gy-qaek", "poc": false, "poc_url": [], "published_time": "2026-11-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-v8gy-qaek", "name": "https://www.oscs1024.com/hd/MPS-v8gy-qaek"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-76416", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-76416"}, {"url": "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-clamav-multi-e93M3vdA", "name": "cisco-sa-clamav-multi-e93M3vdA"}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "ClamAV InstallShield解析器死循环漏洞", "_translated": true, "_saved_at": "2026-11-18T18:36:44+00:00", "_first_saved_at": "2026-11-18T18:36:44+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-v8gy-qaek"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-131181", "cvss": {}, "cvss_score": 7.1, "cvss_vector": "", "cwe": "CWE-943", "description": "Splunk Enterprise 是 Splunk 公司推出的商业化机器数据搜索与分析平台，用于索引、检索和可视化企业日志与安全数据，为闭源商业软件。\n受影响版本中，不持有 admin 或 power 角色的低权限用户可以通过数据模型加速（Data Model Acceleration）功能运行恶意 Search Processing Language（SPL）命令，并通过 REST API 执行超出自身权限的操作。漏洞成因为 Splunk Enterprise 在把用户提供的数据加入生成的搜索语句前未对其进行中性化处理，攻击者构造的数据直接以 SPL 语法进入生成的搜索，注入的命令随后在服务端执行。\n修复版本中通过在用户提供的数据进入生成的搜索语句之前增加中性化处理，切断低权限用户借数据模型加速注入 SPL 命令的路径；官方已在 Splunk Enterprise 10.4.5、10.2.9、10.0.12 和 9.4.16 版本修复该问题，公告未提供缓解措施。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "数据查询逻辑中特殊元素的不当中和", "kind_en": "数据查询逻辑中特殊元素的不当中和", "last_modified_time": "2026-11-19", "level": "High", "mps_id": "MPS-5295-24ea", "poc": false, "poc_url": [], "published_time": "2026-11-19", "reference_url_list": [{"url": "https://advisory.splunk.com/advisories/SVD-2026-1103", "name": ""}, {"url": "https://advisory.splunk.com/advisories/SVD-2026-1103#cve-2026-131181", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-131181", "name": ""}], "scope_influence": "", "tags": [], "title": "Splunk数据模型SPL注入", "_translated": true, "_saved_at": "2026-11-19T00:54:54+00:00", "_first_saved_at": "2026-11-19T00:54:54+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-5295-24ea"}]}</script>
  <script>
    const payload = JSON.parse(document.getElementById("payload").textContent);
    const levelLabels = payload.level_labels || {};
    const items = payload.items || [];
    let filtered = items.slice();
    let activeId = null;

    const $ = (id) => document.getElementById(id);
    $("generatedAt").textContent = payload.generated_at || "-";
    $("retention").textContent = payload.retention_days ?? "-";
    $("cutoff").textContent = payload.cutoff_date || "-";
    $("count").textContent = String(payload.count ?? items.length);

    function levelClass(level) {
      const cn = levelLabels[level] || level || "";
      if (level === "Critical" || cn === "严重") return "crit";
      if (level === "High" || cn === "高危") return "high";
      return "other";
    }
    function levelText(level) {
      return levelLabels[level] || level || "-";
    }
    function esc(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }
    function scoreText(v) {
      if (v === null || v === undefined || v === "" || v === -1) return "-";
      return String(v);
    }

    function renderList() {
      const list = $("list");
      $("listCount").textContent = String(filtered.length);
      if (!filtered.length) {
        list.innerHTML = '<div class="empty">没有匹配项</div>';
        return;
      }
      list.innerHTML = filtered.map((it) => {
        const id = it.mps_id || it.cve_id;
        const active = id === activeId ? " active" : "";
        return `
          <button class="item${active}" data-id="${esc(id)}" type="button">
            <div class="item-top">
              <span class="cve">${esc(it.cve_id || it.mps_id || "-")}</span>
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
            </div>
            <div class="title">${esc(it.title || "-")}</div>
            <div class="item-foot">
              <span>CVSS ${esc(scoreText(it.cvss_score))}</span>
              <span>${esc(it.published_time || "-")}</span>
              ${it.poc ? "<span>POC</span>" : ""}
            </div>
          </button>`;
      }).join("");
      list.querySelectorAll(".item").forEach((btn) => {
        btn.addEventListener("click", () => selectById(btn.dataset.id));
      });
    }

    function refsHtml(it) {
      const refs = Array.isArray(it.reference_url_list) ? it.reference_url_list : [];
      const links = [];
      if (it._source_page) links.push({ url: it._source_page, name: "OSCS 详情" });
      if (it.cve_id) links.push({ url: `https://nvd.nist.gov/vuln/detail/${it.cve_id}`, name: "NVD" });
      refs.forEach((r) => {
        if (r && r.url) links.push({ url: r.url, name: r.name || r.url });
      });
      const seen = new Set();
      const uniq = [];
      for (const l of links) {
        if (seen.has(l.url)) continue;
        seen.add(l.url);
        uniq.push(l);
      }
      if (!uniq.length) return '<div class="box">无参考链接</div>';
      return `<div class="refs">${uniq.map((l) =>
        `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name || l.url)}</a>`
      ).join("")}</div>`;
    }

    function articlesHtml(it) {
      const arts = Array.isArray(it.articles) ? it.articles : [];
      if (!arts.length) return "";
      return `<div class="section"><h3>相关说明</h3>${arts.map((a) => `
        <div class="article">
          <h4>${esc(a.title || "说明")}</h4>
          <p>${esc(a.content || "")}</p>
        </div>`).join("")}</div>`;
    }

    function renderDetail(it) {
      const detail = $("detail");
      if (!it) {
        detail.innerHTML = '<div class="empty">暂无数据</div>';
        return;
      }
      const pocUrls = Array.isArray(it.poc_url) ? it.poc_url : [];
      detail.innerHTML = `
        <div class="d-head">
          <div>
            <h1 class="d-title">${esc(it.title || "-")}</h1>
            <div class="ids">
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
              <span class="chip">${esc(it.cve_id || "无 CVE")}</span>
              <span class="chip">${esc(it.mps_id || "-")}</span>
              ${it.poc ? '<span class="chip">有 POC</span>' : ""}
              ${it.exp ? '<span class="chip">有 EXP</span>' : ""}
            </div>
          </div>
          <div class="actions">
            ${it._source_page ? `<a class="btn" href="${esc(it._source_page)}" target="_blank" rel="noopener">OSCS</a>` : ""}
            ${it.cve_id ? `<a class="btn" href="https://nvd.nist.gov/vuln/detail/${esc(it.cve_id)}" target="_blank" rel="noopener">NVD</a>` : ""}
          </div>
        </div>
        <div class="grid">
          <div class="stat"><div class="k">CVSS</div><div class="v">${esc(scoreText(it.cvss_score))}</div></div>
          <div class="stat"><div class="k">向量</div><div class="v">${esc(it.cvss_vector || "-")}</div></div>
          <div class="stat"><div class="k">CWE</div><div class="v">${esc(it.cwe || "-")}</div></div>
          <div class="stat"><div class="k">类型</div><div class="v">${esc(it.kind || it.kind_en || "-")}</div></div>
          <div class="stat"><div class="k">公开</div><div class="v">${esc(it.published_time || "-")}</div></div>
          <div class="stat"><div class="k">利用成本</div><div class="v">${esc(it.exploit_requirement_cost || "-")}</div></div>
          <div class="stat"><div class="k">可利用性</div><div class="v">${esc(it.exploitability || "-")}</div></div>
          <div class="stat"><div class="k">修复建议</div><div class="v">${esc(it.fix_suggestion || "-")}</div></div>
        </div>
        <div class="section"><h3>描述</h3><div class="box">${esc(it.description || "无描述")}</div></div>
        ${it.scope_influence ? `<div class="section"><h3>影响范围</h3><div class="box">${esc(it.scope_influence)}</div></div>` : ""}
        ${pocUrls.length ? `<div class="section"><h3>POC 链接</h3><div class="refs">${pocUrls.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join("")}</div></div>` : ""}
        <div class="section"><h3>参考链接</h3>${refsHtml(it)}</div>
        ${articlesHtml(it)}
      `;
    }

    function selectById(id) {
      const it = filtered.find((x) => (x.mps_id || x.cve_id) === id) ||
                 items.find((x) => (x.mps_id || x.cve_id) === id);
      if (!it) return;
      activeId = it.mps_id || it.cve_id;
      renderList();
      renderDetail(it);
      const btn = document.querySelector(`.item[data-id="${CSS.escape(activeId)}"]`);
      if (btn) btn.scrollIntoView({ block: "nearest" });
      history.replaceState(null, "", "#" + encodeURIComponent(activeId));
    }

    function applyFilter(q) {
      const query = (q || "").trim().toLowerCase();
      filtered = !query ? items.slice() : items.filter((it) => {
        const blob = [
          it.cve_id, it.mps_id, it.title, it.kind, it.kind_en, it.cwe, it.description, it.level
        ].map((x) => String(x || "").toLowerCase()).join(" ");
        return blob.includes(query);
      });
      renderList();
      if (filtered.length) {
        const still = filtered.some((x) => (x.mps_id || x.cve_id) === activeId);
        selectById(still ? activeId : (filtered[0].mps_id || filtered[0].cve_id));
      } else {
        activeId = null;
        renderDetail(null);
      }
    }

    $("search").addEventListener("input", (e) => applyFilter(e.target.value));

    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement !== $("search")) {
        e.preventDefault();
        $("search").focus();
        return;
      }
      if (!filtered.length) return;
      const idx = filtered.findIndex((x) => (x.mps_id || x.cve_id) === activeId);
      if (e.key === "ArrowDown") {
        e.preventDefault();
        const next = filtered[Math.min(filtered.length - 1, Math.max(0, idx) + 1)];
        selectById(next.mps_id || next.cve_id);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        const prev = filtered[Math.max(0, idx - 1)];
        selectById(prev.mps_id || prev.cve_id);
      }
    });

    const hashId = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    if (hashId && items.some((x) => (x.mps_id || x.cve_id) === hashId)) {
      activeId = hashId;
      renderList();
      selectById(hashId);
    } else if (items.length) {
      selectById(items[0].mps_id || items[0].cve_id);
    } else {
      renderList();
      renderDetail(null);
    }
  </script>
</body>
</html>
