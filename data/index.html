s/OT/white/2026/icsa-26-237-06.json", "name": ""}, {"url": "https://www.cisa.gov/news-events/ics-advisories/icsa-26-237-06", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "NA111-M弱哈希认证漏洞", "_translated": true, "_saved_at": "2026-08-31T17:20:52+00:00", "_first_saved_at": "2026-08-31T17:20:52+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-96l3-2pye"}, {"analysis_status": 0, "articles": [{"content": "- 命令注入是一种攻击，其目标是通过易受攻击的应用程序在主机操作系统上执行任意命令。 当应用程序将不安全的用户提供的数据（表单、cookie、HTTP 标头等）传递到系统 shell 时，就会产生缺陷。攻击者通过构造恶意的命令或数据，将其注入到程序执行的上下文中，从而绕过程序的输入验证和安全措施，实现对程序操作的恶意操作。", "title": "什么是命令注入"}, {"content": "- 文件上传：攻击者通过构造恶意的文件上传请求，将包含恶意命令的文件上传到服务器，从而利用命令注入漏洞执行恶意命令。\n- SQL 注入：攻击者通过构造恶意的 SQL 查询语句，将包含恶意命令的 SQL 语句注入到数据库中，从而执行恶意命令，窃取数据或者破坏系统。\n- 命令执行：攻击者通过在 Web 应用程序的表单提交数据中注入恶意命令，从而执行恶意命令，例如删除文件、格式化硬盘等。\n- 命令注入漏洞的旁路攻击：攻击者可以利用命令注入漏洞旁路控制程序的执行流程，从而窃取数据、破坏系统、控制程序等。\n", "title": "命令注入常见的攻击方式"}, {"content": "- 输入验证：在程序输入处对输入数据进行严格的验证和过滤，确保输入数据符合预期的格式和类型，避免被攻击者注入恶意命令。\n- 输出过滤：在程序输出处对输出数据进行严格的过滤和检查，确保输出数据符合预期的格式和类型，避免被攻击者截获和篡改。\n- 使用安全的编程模型：使用安全的编程模型，例如避免使用原生的命令执行方式，使用安全的框架和库来处理输入数据和执行命令，避免命令注入漏洞。\n- 数据库加密和访问控制：对于敏感数据和命令，使用加密和访问控制措施，确保只有授权用户可以访问和执行命令，避免被攻击者窃取和篡改。\n- 定期更新和升级：定期更新和升级应用程序和库的版本，确保应用程序和库的最新版本包含了最新的安全补丁和修复措施，避免安全漏洞的出现和利用。\n- 安全审计和监控：定期对系统和应用程序进行安全审计和监控，及时发现和阻止潜在的安全漏洞和攻击，确保系统和数据的安全和可靠性。", "title": "如何预防命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-82971", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:N/AC:L/Au:N/C:C/I:C/A:C", "severity": "high", "base_score": 10}], "cvssv31": [{"source": "cna@vuldb.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 10}], "cvssv4": [{"source": "cna@vuldb.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-77", "description": "QVidium Opera11 是商业视频编解码与 IP 传输设备固件，用于在 IP 网络上编码、解码和传输广播级视频，不属于开源项目。厂商官网已公告停业，不再销售产品或提供支持。\n受影响版本中，CGI 脚本 /cgi-bin/net_tr.cgi 在处理 ipaddr 参数时存在命令注入。远程攻击者可操纵该参数，使输入进入系统命令执行路径并在设备上执行任意命令。官方记录同时标明利用代码已公开披露。\n修复版本中通过收紧 /cgi-bin/net_tr.cgi 对 ipaddr 参数的处理来切断命令注入路径的补丁尚未发布，厂商已停业且明确不再提供支持，公开资料未给出可升级的修复版本。", "effects": [{"comp_name": "opera11_firmware", "ecosystem": "linux", "versions": [{"affected_version": "[3.3.2a26-Ax4x-opera11,+∞)", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "命令注入", "kind_en": "命令中使用的特殊元素的不正确中和（“命令注入”）", "last_modified_time": "2026-09-01", "level": "Critical", "mps_id": "MPS-yl4a-ku1m", "poc": false, "poc_url": [], "published_time": "2026-09-01", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-yl4a-ku1m", "name": "https://www.oscs1024.com/hd/MPS-yl4a-ku1m"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-82971", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-82971"}, {"url": "https://uvxbywu62qm.feishu.cn/wiki/Tn2ewwaafigfabkMWJJcc3rhnud?from=from_copylink", "name": ""}, {"url": "https://vuldb.com/cve/CVE-2026-82971", "name": ""}, {"url": "https://vuldb.com/submit/880050", "name": ""}, {"url": "https://vuldb.com/vuln/397334", "name": ""}, {"url": "https://vuldb.com/vuln/397334/cti", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "QVidium Opera11命令注入漏洞", "_translated": true, "_saved_at": "2026-09-01T01:32:27+00:00", "_first_saved_at": "2026-09-01T01:32:27+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-yl4a-ku1m"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-84189", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:R/S:C/C:H/I:H/A:N", "severity": "high", "base_score": 8.1}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:P/VC:H/VI:H/VA:N/SC:H/SI:H/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.2}]}, "cvss_score": 9.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:P/VC:H/VI:H/VA:N/SC:H/SI:H/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X 者注入恶意命令。\n- 输出过滤：在程序输出处对输出数据进行严格的过滤和检查，确保输出数据符合预期的格式和类型，避免被攻击者截获和篡改。\n- 使用安全的编程模型：使用安全的编程模型，例如避免使用原生的命令执行方式，使用安全的框架和库来处理输入数据和执行命令，避免命令注入漏洞。\n- 数据库加密和访问控制：对于敏感数据和命令，使用加密和访问控制措施，确保只有授权用户可以访问和执行命令，避免被攻击者窃取和篡改。\n- 定期更新和升级：定期更新和升级应用程序和库的版本，确保应用程序和库的最新版本包含了最新的安全补丁和修复措施，避免安全漏洞的出现和利用。\n- 安全审计和监控：定期对系统和应用程序进行安全审计和监控，及时发现和阻止潜在的安全漏洞和攻击，确保系统和数据的安全和可靠性。", "title": "如何预防命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-83772", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:N/AC:L/Au:S/C:C/I:C/A:C", "severity": "high", "base_score": 9}], "cvssv31": [{"source": "cna@vuldb.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.9}], "cvssv4": [{"source": "cna@vuldb.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-77", "description": "Cobham SATCOM VSAT7090 是 Cobham 面向船舶场景的海事卫星路由器产品，用于卫星通信接入与路由管理，属于闭源商业设备。\n受影响版本中，JSON 解析组件的 mail-report.sh 在 c_set_reports_decode 函数处理 sender 与 recipients 参数时存在命令注入，远程低权限攻击者可操纵上述参数使输入进入系统命令执行路径，从而在设备上执行任意命令。\n修复版本中通过厂商发布的安全更新切断该命令注入路径；公开披露时厂商未回应，当前未见已发布修复版本，建议限制相关管理接口访问并等待官方更新。", "effects": [{"comp_name": "satcom_vsat7090_maritime_satellite_router", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,20260704]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "命令注入", "kind_en": "命令中使用的特殊元素的不正确中和（“命令注入”）", "last_modified_time": "2026-09-01", "level": "Critical", "mps_id": "MPS-6uwo-j38r", "poc": false, "poc_url": [], "published_time": "2026-09-01", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-6uwo-j38r", "name": "https://www.oscs1024.com/hd/MPS-6uwo-j38r"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-83772", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-83772"}, {"url": "https://uvxbywu62qm.feishu.cn/wiki/ERgywyUVfiUM2lkfVLwc1swknXg?from=from_copylink", "name": ""}, {"url": "https://vuldb.com/cve/CVE-2026-83772", "name": ""}, {"url": "https://vuldb.com/submit/880057", "name": ""}, {"url": "https://vuldb.com/vuln/397501", "name": ""}, {"url": "https://vuldb.com/vuln/397501/cti", "name": ""}], "scope_influence": "", "tags": [], "title": "VSAT7090命令注入漏洞", "_translated": true, "_saved_at": "2026-09-01T07:05:28+00:00", "_first_saved_at": "2026-09-01T07:05:28+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-6uwo-j38r"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-84372", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-93", "description": "Predis is a flexible and feature-complete Redis and Valkey client for PHP. From version 3.0.0-RC1 until version 3.3.0, pipeline handling on aggregate cluster and replication connections reparses an already serialized RESP buffer in AbstractAggregateConnection::write() by splitting it with explode(\"\\r\\n\") instead of honoring RESP length prefixes. Attacker-controlled keys or values containing CRLF sequences can therefore be interpreted by Command::deserializeCommand() as additional commands. On cluster connections, ClusterStrategy::getFakeKey() can route injected keyless commands using the literal fake key value \"key\", permitting operations such as shard-wide cache deletion, targeted data modification, data reads, or node disruption. On replication connections, malformed reparsing can throw an uncaught exception and repeatedly terminate affected requests. Only pipeline() reaches this vulnerable path; transaction() and MULTI are not affected. This issue is fixed in version 3.3.0.", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "CRLF注入", "kind_en": "Improper Neutralization of CRLF Sequences ('CRLF Injection')", "last_modified_time": "2026-09-02", "level": "Critical", "mps_id": "MPS-kaq3-jr50", "poc": false, "poc_url": [], "published_time": "2026-09-02", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-kaq3-jr50", "name": "https://www.oscs1024.com/hd/MPS-kaq3-jr50"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-84372", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-84372"}, {"url": "https://github.com/predis/predis/commit/053cb4b6ac7fb1f469ead96a78d059bc0458e408", "name": ""}, {"url": "https://github.com/predis/predis/issues/1574", "name": ""}, {"url": "https://github.com/predis/predis/pull/1586", "name": ""}, {"url": "https://github.com/predis/predis/releases/tag/v3.3.0", "name": ""}, {"url": "https://github.com/predis/predis/security/advisories/GHSA-w6f5-v2h6-g786", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-84372漏洞", "_translated": true, "_saved_at": "2026-09-02T00:47:07+00:00", "_first_saved_at": "2026-09-01T22:55:53+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-kaq3-jr50"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-52111", "cvss": {}, "cvss_score": 9.8, "cvss_vector": "", "cwe": "CWE-863", "description": "Fast Note Sync Service 是开源笔记同步与在线管理服务，提供 WebGUI、远程 REST API 以及与 Obsidian 的笔记同步能力。\n受影响版本中，默认配置开启用户注册且将 admin-uid 设为 0。AdminControlHandler 的 CheckAdmin 与 GetConfig 把 AdminUID 为 0 当作不限制管理员身份，任意已认证用户都能访问 GET /api/admin/config 并取得 AuthTokenKey。用户 JWT 使用 AuthTokenKey 与 machine_id 拼接后签名，Docker 部署下 GetMachineID() 可能返回空串。攻击者可先调用 POST /api/user/register 获得普通账号，再读取签名密钥并伪造任意用户令牌，从而冒充管理员并读取、修改或删除同步笔记。\n修复版本中通过 UserService.IsRegisterEnabled 在 AdminUID 为 0 且系统已存在用户时自动关闭注册，切断未指定管理员时的自注册入口，阻止攻击者继续获取可用于越权的认证令牌。", "effects": [{"comp_name": "github.com/haierkeys/fast-note-sync-service", "ecosystem": "go", "versions": [{"affected_version": "(-∞,2.13.8)", "min_fixed_version": "2.13.8", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-09-02", "level": "Critical", "mps_id": "MPS-r7vl-uyf3", "poc": false, "poc_url": [], "published_time": "2026-09-02", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-r7vl-uyf3", "name": "https://www.oscs1024.com/hd/MPS-r7vl-uyf3"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-52111", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-52111"}, {"url": "https://gist.github.com/L4wCat/924c10c36d6d11651049787d547d411b", "name": ""}, {"url": "https://github.com/haierkeys/fast-note-sync-service -authentication-bypass-via-user-agent-header", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "AVideo认证绕过漏洞", "_translated": true, "_saved_at": "2026-09-02T00:47:03+00:00", "_first_saved_at": "2026-09-02T00:47:03+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-v5zo-f6yk"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-56718", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "high", "base_score": 7.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-22", "description": "AJCloud AJY IPC 是南京安居云信息技术有限公司提供的闭源网络摄像机固件，设备通过内置 jdbhttpd Web 服务对外提供 HTTP 访问能力。\n受影响版本中，jdbhttpd Web 服务未正确限制 HTTP 请求 URI 中的路径穿越序列，未认证攻击者可向设备 80 端口发送包含穿越路径的请求，以 root 权限读取任意文件，包括明文 RTSP 凭据、Wi-Fi SSID 与预共享密钥、设备序列号以及云绑定参数。\n修复版本中通过官方固件更新收紧 jdbhttpd 对请求 URI 的路径处理，阻止路径穿越序列访问受限目录之外的文件，消除未认证任意文件读取风险。", "effects": [{"comp_name": "ajy_ipc_firmware", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,01.10715.11.37)", "min_fixed_version": "01.10715.11.37", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-08-31", "level": "High", "mps_id": "MPS-n0f8-43y9", "poc": false, "poc_url": [], "published_time": "2026-08-31", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-n0f8-43y9", "name": "https://www.oscs1024.com/hd/MPS-n0f8-43y9"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-56718", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-56718"}, {"url": "https://www.ajcloud.net/", "name": ""}, {"url": "https://www.vulncheck.com/advisories/ajcloud-ajy-ipc-firmware-path-traversal-via-jdbhttpd", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "AJY IPC路径穿越漏洞", "_translated": true, "_saved_at": "2026-08-30T23:03:24+00:00", "_first_saved_at": "2026-08-30T23:03:24+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-n0f8-43y9"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-81636", "cvss": {"cvssv4": [{"source": "6b3ad84c-e1a6-4bf7-a703-f496b71e49db", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-770", "description": "ash_graphql 是开源 Elixir 组件，作为 Ash 框架的 GraphQL 扩展，用于从 Ash 资源生成 GraphQL API。\n受影响版本中，AshGraphql.Graphql.Resolver.query_complexity/3 仅在参数映射含 :limit 时用页大小乘以子字段复杂度；Relay 与 keyset 分页使用 first 与 last，落入返回 child_complexity + 1 的通配子句。未认证客户端发送嵌套查询如 posts(first: 500){edges{node{comments(first: 500){...}}}} 时，该查询被判定为廉价并通过 Absinthe max_complexity 上限，而等价的 limit 查询被拒绝，完整扇出被物化并导致无界数据库读取。\n修复版本中通过为 query_complexity/3 增加 first 与 last 子句，按请求页大小乘以子复杂度，使 Relay/keyset 分页计入真实扇出，并被复杂度上限拦截。", "effects": [{"comp_name": "ash_graphql", "ecosystem": "linux", "versions": [{"affected_version": "[0.16.23,1.11.0)", "min_fixed_version": "1.11.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "不加限制或调节的资源分配", "kind_en": "不受限制或节流地分配资源", "last_modified_time": "2026-08-31", "level": "High", "mps_id": "MPS-q0y1-i8fr", "poc": false, "poc_url": [], "published_time": "2026-08-31", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-q0y1-i8fr", "name": "https://www.oscs1024.com/hd/MPS-q0y1-i8fr"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-81636", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-81636"}, {"url": "https://cna.erlef.org/cves/CVE-2026-81636.html", "name": ""}, {"url": "https://github.com/ash-project/ash_graphql/commit/c3229f6a65cbabb32fd7ffcac881922d1b3b30ad", "name": ""}, {"url": "https://github.com/ash-project/ash_graphql/security/advisories/GHSA-mwc4-r9fc-h6mg", "name": ""}, {"url": "https://osv.dev/vulnerability/EEF-CVE-2026-81636", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "AshGraphql复杂度绕过漏洞", "_translated": true, "_saved_at": "2026-08-30T23:03:25+00:00", "_first_saved_at": "2026-08-30T20:23:03+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-q0y1-i8fr"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-78699", "cvss": {"cvssv4": [{"source": "6b3ad84c-e1a6-4bf7-a703-f496b71e49db", "vector": "CVSS:4.0/AV:L/AC:L/AT:P/PR:L/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:4.0/AV:L/AC:L/AT:P/PR:L/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-252", "description": "ash_postgres 是开源 Elixir 库，作为 Ash Framework 的 PostgreSQL 数据层，用于基于 PostgreSQL schema 实现多租户隔离。\n受影响版本中，AshPostgres.MultiTenancy.rename_tenant/3 使用不会抛出异常的 Ecto.Adapters.SQL.query/2 执行 ALTER SCHEMA ... RENAME TO ...，丢弃其 {:ok, _} | {:error, _} 返回值并无条件返回 :ok。当新租户名与已有租户 schema 冲突、权限不足或锁超时时，PostgreSQL 会拒绝重命名，但失败不会传回调用方。manage_tenant 更新动作会把失败当成成功并提交租户行的新名称，使该租户记录指向另一已有租户的 schema，后续读写会落到其他租户数据上。\n修复版本中通过将 Ecto.Adapters.SQL.query/2 替换为失败时抛出异常的 Ecto.Adapters.SQL.query!/3，使外层事务回滚，切断把失败的 schema 重命名提交为成功的路径。", "effects": [{"comp_name": "ash_postgres", "ecosystem": "linux", "versions": [{"affected_version": "[0.25.0,2.13.0)", "min_fixed_version": "2.13.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "未加检查的返回值", "kind_en": "Unchecked Return Value", "last_modified_time": "2026-08-31", "level": "High", "mps_id": "MPS-i5sl-nwr1", "poc": false, "poc_url": [], "published_time": "2026-08-31", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-i5sl-nwr1", "name": "https://www.oscs1024.com/hd/MPS-i5sl-nwr1"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-78699", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-78699"}, {"url": "https://cna.erlef.org/cves/CVE-2026-78699.html", "name": ""}, {"url": "https://github.com/ash-project/ash_postgres/commit/8544ab15fe45784553c2d2da8ee1a388eee0174b", "name": ""}, {" t/3 与 apply_constraints/3，拒绝非标量输入，使操作符 Map 无法再改写查询谓词，切断对未标识记录的更新与删除。", "effects": [{"comp_name": "ash_ai", "ecosystem": "linux", "versions": [{"affected_version": "[0.6.0,1.0.0)", "min_fixed_version": "1.0.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "通过用户控制密钥绕过授权机制", "kind_en": "通过用户控制的密钥绕过授权", "last_modified_time": "2026-08-31", "level": "High", "mps_id": "MPS-2t0y-i6ac", "poc": false, "poc_url": [], "published_time": "2026-08-31", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-2t0y-i6ac", "name": "https://www.oscs1024.com/hd/MPS-2t0y-i6ac"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-82564", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-82564"}, {"url": "https://cna.erlef.org/cves/CVE-2026-82564.html", "name": ""}, {"url": "https://github.com/ash-project/ash_ai/commit/87f616d5bfbf7af43346f0701ae17f853789a602", "name": ""}, {"url": "https://github.com/ash-project/ash_ai/security/advisories/GHSA-jg86-xh36-h5xc", "name": ""}, {"url": "https://osv.dev/vulnerability/EEF-CVE-2026-82564", "name": ""}], "scope_influence": "", "tags": ["AI", "应用软件"], "title": "ash_ai身份绕过漏洞", "_translated": true, "_saved_at": "2026-08-31T02:57:38+00:00", "_first_saved_at": "2026-08-31T02:57:38+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-2t0y-i6ac"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-80223", "cvss": {"cvssv4": [{"source": "6b3ad84c-e1a6-4bf7-a703-f496b71e49db", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-863", "description": "ash_graphql 是 Ash 框架的开源 GraphQL 扩展库，以 Hex 包形式发布，用于为 Ash 资源生成查询、变更和订阅接口。\n受影响版本中，订阅解析器 AshGraphql.Graphql.Resolver.resolve/2 对通知载荷进行内存授权：快速路径调用 Ash.can/3 且设置 run_queries?: false，通过 Ash.Expr.eval/2 将读策略过滤器作用在内存记录上，不会真正发起查询。Ash 多租户约束施加在查询构建和数据层前缀阶段，不进入 query.filter，因此策略求值不含租户条件。单条通知子句没有任何租户守卫；批量子句只检查通知列表头部，其余条目仍仅在内存中授权。当租户 B 的通知被路由到租户 A 的订阅者时，只要策略过滤器为真，其他租户记录会被下发给该订阅者。\n修复版本中通过为单条跨租户通知新增 resolve/2 守卫子句，并在批量路径上调用 reject_other_tenant_notifications/2 丢弃与订阅者租户不一致的通知，阻止跨租户载荷进入内存授权快速路径，切断跨租户订阅泄露。", "effects": [{"comp_name": "ash_graphql", "ecosystem": "linux", "versions": [{"affected_version": "[1.4.0,1.11.0)", "min_fixed_version": "1.11.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-08-31", "level": "High", "mps_id": "MPS-li6k-nuh8", "poc": false, "poc_url": [], "published_time": "2026-08-31", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-li6k-nuh8", "name": "https://www.oscs1024.com/hd/MPS-li6k-nuh8"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-80223", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-80223"}, {"url": "https://cna.erlef.org/cves/CVE-2026-80223.html", "name": ""}, {"url": "https://github.com/ash-project/ash_graphql/commit/6e30b8b5a04bdeaed5d7514caa6b2d056d8d993e", "name": ""}, {"url": "https://github.com/ash-project/ash_graphql/security/advisories/GHSA-rcqc-59g2-gjg2", "name": ""}, {"url": "https://osv.dev/vulnerability/EEF-CVE-2026-80223", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "ash_graphql订阅越权", "_translated": true, "_saved_at": "2026-08-30T23:03:26+00:00", "_first_saved_at": "2026-08-30T20:23:02+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-li6k-nuh8"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过构造恶意的数据，将过多的数据输入到程序的缓冲区中，使得缓冲区的空间被填满，从而溢出到程序的栈 (stack) 或堆 (heap) 中，导致程序崩溃、拒绝服务、数据泄露等安全问题。\n", "title": "什么是经典缓冲区溢出"}, {"content": "| 类型        | 描述                                                         |\n| ----------- | ------------------------------------------------------------ |\n| 代码注入攻击      | 攻击者通过向程序的缓冲区输入恶意代码，从而控制程序执行流程，实现对程序操作的恶意操作。例如，攻击者可以通过向 Web 应用程序的输入框中输入恶意代码，从而执行任意的代码，破坏系统、窃取数据等。 |\n| 数据覆盖攻击      | 攻击者通过向程序的缓冲区输入过多的数据，从而覆盖程序中的重要数据或代码，实现对程序操作的恶意操作。例如，攻击者可以通过向聊天应用程序的输入框中输入过多的表情符号，从而覆盖程序中的重要数据，例如聊天消息、账号密码等。 |\n| 栈溢出攻击 | 攻击者通过向程序的栈中输入过多的数据，从而溢出到栈外部，实现对程序操作的恶意操作。例如，攻击者可以通过向游戏应用程序的输入框中输入过多的道具名称，从而覆盖程序中的重要数据，例如游戏数据、账号密码等。 |\n| 堆溢出攻击       | 攻击者通过向程序的堆中输入过多的数据，从而溢出到堆外部，实现对程序操作的恶意操作。例如，攻击者可以通过向操作系统工具的输入框中输入过多的命令，从而覆盖程序中的重要数据，例如系统文件、配置文件等。 |", "title": "经典缓冲区溢出常见的攻击方式"}, {"content": "- 输入验证：在程序输入处对输入数据进行严格的验证和过滤，确保输入数据符合预期的格式和类型，避免被攻击者注入恶意命令或数据。可以使用正则表达式、格式字符串等方式进行输入验证。\n- 输出过滤：在程序输出处对输出数据进行严格的过滤和检查，确保输出数据符合预期的格式和类型，避免被攻击者截获和篡改。可以使用安全的输出过滤库等方式进行输出过滤。\n- 使用安全的编程模型：使用安全的编程模型，例如避免使用原生的缓冲区管理函数，使用安全的框架和库来处理输入数据和执行命令，避免缓冲区溢出漏洞。\n- 数据库加密和访问控制：对于敏感数据和命令，使用加密和访问控制措施，确保只有授权用户可以访问和执行命令，避免被攻击者窃取和篡改。\n- 定期更新和升级：定期更新和升级应用程序和库的版本，确保应用程序和库的  {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-82882", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-862", "description": "Devtron 是开源 Kubernetes 应用交付与运维平台，提供 CI/CD、部署编排和基于 Casbin 的访问控制。\n受影响版本中，GET /orchestrator/api-token/webhook 只通过 GetLoggedInUser 确认存在有效会话，不校验调用者对目标资源的权限。接口将调用者提供的 projectName、environmentName、appName 传入 GetAllApiTokensForWebhook，用已存储 API token 的 Casbin 策略匹配这些参数。超级管理员 token 的通配对象策略会对任意查询值返回通过，且 HideApiTokens 默认关闭，接口把超级管理员 JWT 明文返回给任意已认证账户，攻击者可据此获得平台完全控制权。\n修复版本中通过 ": "MPS-xghc-053v", "poc": false, "poc_url": [], "published_time": "2026-09-01", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-xghc-053v", "name": "https://www.oscs1024.com/hd/MPS-xghc-053v"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-77966", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-77966"}, {"url": "https://github.com/cisagov/CSAF/blob/develop/csaf_files/OT/white/2026/icsa-26-237-06.json", "name": ""}, {"url": "https://www.cisa.gov/news-events/ics-advisories/icsa-26-237-06", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "NA111-M授权缺失漏洞", "_translated": true, "_saved_at": "2026-08-31T17:20:51+00:00", "_first_saved_at": "2026-08-31T17:20:51+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-xghc-053v"}, {"analysis_status": 0, "articles": [{"content": "- 命令注入是一种攻击，其目标是通过易受攻击的应用程序在主机操作系统上执行任意命令。 当应用程序将不安全的用户提供的数据（表单、cookie、HTTP 标头等）传递到系统 shell 时，就会产生缺陷。攻击者通过构造恶意的命令或数据，将其注入到程序执行的上下文中，从而绕过程序的输入验证和安全措施，实现对程序操作的恶意操作。", "title": "什么是命令注入"}, {"content": "- 文件上传：攻击者通过构造恶意的文件上传请求，将包含恶意命令的文件上传到服务器，从而利用命令注入漏洞执行恶意命令。\n- SQL 注入：攻击者通过构造恶意的 SQL 查询语句，将包含恶意命令的 SQL 语句注入到数据库中，从而执行恶意命令，窃取数据或者破坏系统。\n- 命令执行：攻击者通过在 Web 应用程序的表单提交数据中注入恶意命令，从而执行恶意命令，例如删除文件、格式化硬盘等。\n- 命令注入漏洞的旁路攻击：攻击者可以利用命令注入漏洞旁路控制程序的执行流程，从而窃取数据、破坏系统、控制程序等。\n", "title": "命令注入常见的攻击方式"}, {"content": "- 输入验证：在程序输入处对输入数据进行严格的验证和过滤，确保输入数据符合预期的格式和类型，避免被攻击者注入恶意命令。\n- 输出过滤：在程序输出处对输出数据进行严格的过滤和检查，确保输出数据符合预期的格式和类型，避免被攻击者截获和篡改。\n- 使用安全的编程模型：使用安全的编程模型，例如避免使用原生的命令执行方式，使用安全的框架和库来处理输入数据和执行命令，避免命令注入漏洞。\n- 数据库加密和访问控制：对于敏感数据和命令，使用加密和访问控制措施，确保只有授权用户可以访问和执行命令，避免被攻击者窃取和篡改。\n- 定期更新和升级：定期更新和升级应用程序和库的版本，确保应用程序和库的最新版本包含了最新的安全补丁和修复措施，避免安全漏洞的出现和利用。\n- 安全审计和监控：定期对系统和应用程序进行安全审计和监控，及时发现和阻止潜在的安全漏洞和攻击，确保系统和数据的安全和可靠性。", "title": "如何预防命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-84190", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.2}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CV 对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-82954", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:N/AC:L/Au:S/C:C/I:C/A:C", "severity": "high", "base_score": 9}], "cvssv31": [{"source": "cna@vuldb.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.9}], "cvssv4": [{"source": "cna@vuldb.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-22", "description": "Dokploy 是开源的自托管 PaaS 平台，用于部署和管理容器化应用，并在 Settings 中提供 Traefik 动态配置文件的读写能力。\n受影响版本中，Settings 的 updateTraefikFile 接口把调用方传入的 path 交给 writeTraefikConfigInPath。该函数对 pathFile 只做 path.join 后即作为写入目标，本地调用 fs.writeFileSync，远程则通过 execAsyncRemote 把内容重定向到该路径，缺少将最终路径限制在 Traefik 配置目录内的校验。已认证用户可通过操控 path 参数实施目录穿越，向预期目录之外写入任意文件内容。\n修复版本中通过将 path 限制在约定的 Traefik 配置目录并拒绝目录穿越序列来阻断任意文件写入；官方披露记录显示厂商在告知后未回应，当前没有已验证的修复版本可供升级。", "effects": [{"comp_name": "dokploy", "ecosystem": "linux", "versions": [{"affected_version": "[0.29.0,0.29.7]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-09-01", "level": "High", "mps_id": "MPS-kref-znil", "poc": false, "poc_url": [], "published_time": "2026-09-01", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-kref-znil", "name": "https://www.oscs1024.com/hd/MPS-kref-znil"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-82954", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-82954"}, {"url": "https://vuldb.com/cve/CVE-2026-82954", "name": ""}, {"url": "https://vuldb.com/submit/879844", "name": ""}, {"url": "https://vuldb.com/vuln/397303", "name": ""}, {"url": "https://vuldb.com/vuln/397303/cti", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Dokploy路径穿越漏洞", "_translated": true, "_saved_at": "2026-09-01T01:32:28+00:00", "_first_saved_at": "2026-09-01T01:32:28+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-kref-znil"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-84194", "cvss": {"cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:L/SI:L/SA:L/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:L/SI:L/SA:L/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-78", "description": "LibreNMS 版本 \u003e= 23.10.0 和 \u003c 26.2.0（在 26.4.0 中修复）在 libvirt 发现中包含经过身份验证的操作系统命令注入漏洞。当启用 libvirt 支持 (enable_libvirt=true) 时，设备主机名 ($this-\u003egetDevice()-\u003ehostname) 将连接到 VminfoLibvirt.php 中的 shell 命令（ssh、virsh list/dumpxml/domstate），并传递给 exec()，无需 escapeshellarg() 或参数分隔。经过身份验证的管理员可以设置精心设计的设备主机名来注入任意操作系统命令，从而导致在发现工作线程上下文中远程执行代码。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-09-01", "level": "High", "mps_id": "MPS-qzmb-cv0k", "poc": false, "poc_url": [], "published_time": "2026-09-01", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-qzmb-cv0k", "name": "https://www.oscs1024.com/hd/MPS-qzmb-cv0k"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-84194", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-84194"}, {"url": "https://github.com/librenms/librenms/security/advisories/GHSA-wff2-9gjr-95f3", "name": ""}, {"url": "https://www.vulncheck.com/advisories/librenms-23.10.0-before-26.4.0-os-command-injection-via-hostname", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-84194漏洞", "_translated": true, "_saved_at": "2026-09-01T12:57:33+00:00", "_first_saved_at": "2026-09-01T12:57:33+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-qzmb-cv0k"}, {"analysis_status": 0, "articles": [{"content": "- 命令注入是一种攻击，其目标是通过易受攻击的应用程序在主机操作系统上执行任意命令。 当应用程序将不安全的用户提供的数据（表单、cookie、HTTP 标头等）传递到系统 shell 时，就会产生缺陷。攻击者通过构造恶意的命令或数据，将其注入到程序执行的上下文中，从而绕过程序的输入验证和安全措施，实现对程序操作的恶意操作。", "title": "什么是命令注入"}, {"content": "- 文件上传：攻击者通过构造恶意的文件上传请求，将包含恶意命令的文件上传到服务器，从而利用命令注入漏洞执行恶意命令。\n- SQL 注入：攻击者通过构造恶意的 SQL 查询语句，将包含恶意命令的 SQL 语句注入到数据库中，从而执行恶意命令，窃取数据或者破坏系统。\n- 命令执行：攻击者通过在 Web 应用程序的表单提交数据中注入恶意命令，从而执行恶意命令，例如删除文件、格式化硬盘等。\n- 命令注入漏洞的旁路攻击：攻击者可以利用命令注入漏洞旁路控制程序的执行流程，从而窃取数据、破坏系统、控制程序等。\n", "title": "命令注入常见的攻击方式"}, {"content": "- 输入验证：在程序输入处对输入数据进行严格的验证和过滤，确保输入数据符合预期的格式和类型，避免被攻击者注入恶意命令。\n- 输出过滤：在程序输出处对输出数据进行严格的过滤和检查，确保输出数据符合预期的格式和类型，避免被攻击者截获和篡改。\n- 使用安全的编程模型：使用安全的编程模型，例如避免使用原生的命令执行方式，使用安全的框架和库来处理输入数据和执行命令，避免命令注入漏洞。\n- 数据库加密和访问控制：对于敏感数据和命令，使用加密和访问控制措施，确保只有授权用户可以访问和执行命令，避免被攻击者窃取和篡改。\n- 定期更新和升级：定期更新和升级应用程序和库的版本，确保应用程序和库的最新版本包含了最新的安全补丁和修复措施，避免安全漏洞的出现和利用。\n- 安全审计和监控：定期对系统和应用程序进行安全审计和监控，及时发现和阻止潜在的安全漏洞和攻击，确保系统和数据的安全和可靠性。", "title": "如何预防命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-83524", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:N/AC:L/Au:S/C:C/I:C/A:C", "severity": "high", "base_score": 9}], "cvssv31": [{"source": "cna@vuldb.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.9}], "cvssv4": [{"source": "cna@vuldb.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-77", "description": "RedPort Optimizer wXa-203、wXa-213 与 wXa-223 是商业船用卫星通信 Wi-Fi 路由与语音网关设备，用于将卫星数据链路转为本地热点并提供防火墙与系统管理能力，源码未公开。\n受影响版本中，系统时钟组件的 /xgatev1/system/datetime.php 在调用 exec 处理外部输入时存在命令注入。具备普通用户权限的远程攻击者可操纵该接口，使输入进入命令执行路径，从而在设备上执行任意系统命令。该漏洞利用代码已被公开披露。\n修复版本中通过官方安全更新消除系统时钟 datetime.php 的命令注入风险；公开资料尚未给出已确认的修复版本，厂商在披露前未回应。", "effects": [{"comp_name": "optimizer_wxa-203", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,20260704]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "optimizer_wxa-213", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,20260704]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "optimizer_wxa-223", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,20260704]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "命令注入", "kind_en": "命令中使用的特殊元素的不正确中和（“命令注入”）", "last_modified_time": "2026-09-01", "level": "High", "mps_id": "MPS-xfaz-h9ck", "poc": false, "poc_url": [], "published_time": "2026-09-01", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-xfaz-h9ck", "name": "https://www.oscs1024.com/hd/MPS-xfaz-h9ck"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-83524", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-83524"}, {"url": "https://uvxbywu62qm.feishu.cn/wiki/EA4TwFTx0ih9IhkJX5QcnCmlnSd?from=from_copylink", "name": ""}, {"url": "https://vuldb.com/cve/CVE-2026-83524", "name": ""}, {"url": "https://vuldb.com/submit/880051", "name": ""}, {"url": "https://vuldb.com/vuln/397374", "name": ""}, {"url": "https://vuldb.com/vuln/397374/cti", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Optimizer命令注入漏洞", "_translated": true, "_saved_at": "2026-09-01T01:32:26+00:00", "_first_saved_at": "2026-09-01T01:32:26+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-xfaz-h9ck"}, {"analysis_status": 0, "articles": [{"content": "由于整数类型的有限范围，在进行算术运算或操作时，结果可能超出类型的表示范围，导致溢出或环绕。溢出指的是结果超过了类型的最大值或小于了最小值，而环绕指的是结果绕回到类型的最小值或最大值。", "title": "什么是整数溢出或环绕"}, {"content": "- 缓冲区溢出：整数溢出可能导致缓冲区溢出漏洞。当整数溢出导致分配的缓冲区大小不足以容纳结果时，攻击者可以利用这个漏洞覆盖相邻的内存区域，执行恶意代码或篡改程序的状态。\r\n- 身份验证绕过：在进行身份验证或访问控制时，整数溢出可能导致绕过验证的漏洞。攻击者可以构造特殊的输入，使溢出的整数值绕过了预期的验证逻辑，从而获得未经授权的访问权限。\r\n- 数据篡改：整数溢出可能导致数据篡改漏洞。攻击者可以通过使整数溢出，修改计数器、索引或其他控制数据的值，导致程序在处理数据时发生错误或执行意外的操作。", "title": "整数溢出或环绕常见的攻击方式"}, {"content": "- 输入验证与限制：对用户输入的整数进行合理的验证和限制，确保其在允许的范围内。\r\n- 使用安全的整数操作函数：使用安全的整数操作函数，如`add_with_overflow()`、`sub_with_overflow()`、`mul_with_overflow()`等，这些函数会检查并处理溢出情况，确保计算结果在安全范围内。\r\n- 类型检查和转换：在进行整数运算或操作之前，进行类型检查和转换，确保操作数的类型和范围是合适的。\r\n- 强制性编码标准和最佳实践：制定强制性的编码标准和最佳实践，包括对整数运算和操作的规范和限制，以帮助程序员编写更可靠、安全的代码。\r\n- 静态代码分析和测试：使用静态代码分析工具和测试技术来检测和识别潜在的整数溢出问题。这些工具可以帮助发现代码中可能存在的溢出漏洞，并及时修复。", "title": "如何预防整数溢出或环绕"}], "cnvd_id": "", "cve_id": "CVE-2026-82908", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:L/AC:L/Au:S/C:C/I:C/A:C", "severity": "medium", "base_score": 6.8}], "cvssv31": [{"source": "cna@vuldb.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}], "cvssv4": [{"source": "cna@vuldb.com", "vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.5}]}, "cvss_score": 8.5, "cvss_vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-190", "description": "MSI Dragon Center 中发现漏洞，最高版本为 2.0.155.0。受此漏洞影响的是组件MMIO Write Path Handler的库NTIOLib_X64.sys中的函数MmioWritePath。对参数 count/elementSize 执行操作会导致整数溢出。攻击需要本地方法。该漏洞已被公开并且可以被使用。我们很早就就此事联系了供应商，但没有以任何方式做出回应。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "整数溢出或环绕", "kind_en": "整数溢出或环绕", "last_modified_time": "2026-09-01", "level": "High", "mps_id": "MPS-0gme-ho1n", "poc": false, "poc_url": [], "published_time": "2026-09-01", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-0gme-ho1n", "name": "https://www.oscs1024.com/hd/MPS-0gme-ho1n"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-82908", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-82908"}, {"url": "https://drive.google.com/file/d/10o_-3GOMAvl3tDqQIWYw45rv7MpxYitk/view", "name": ""}, {"url": "https://vuldb.com/cve/CVE-2026-82908", "name": ""}, {"url": "https://vuldb.com/submit/877502", "name": ""}, {"url": "https://vuldb.com/vuln/397288", "name": ""}, {"url": "https://vuldb.com/vuln/397288/cti", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-82908漏洞", "_translated": true, "_saved_at": "2026-08-31T22:17:08+00:00", "_first_saved_at": "2026-08-31T22:17:08+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-0gme-ho1n"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "cnvd_id": "", "cve_id": "CVE-2026-82807", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:L/AC:L/Au:S/C:C/I:C/A:C", "severity": "medium", "base_score": 6.8}], "cvssv31": [{"source": "cna@vuldb.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}], "cvssv4": [{"source": "cna@vuldb.com", "vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.5}]}, "cvss_score": 8.5, "cvss_vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-269", "description": "Ultra RAMDisk Pro 是 ieungSoft 提供的商业闭源 Windows 软件，用于创建内存虚拟磁盘和虚拟光驱，安装后会加载 WHQL 签名内核驱动 URDSCSI.sys。\n受影响版本中，URDSCSI.sys 向本地普通用户暴露控制设备 \\\\.\\UltraRAMDiskIOCTL。攻击者可打开该设备并向 IOCTL 0x222B30 发送命令 0x08，驱动会解析调用者提供的原生注册表路径、值名、类型与数据，随后在内核上下文调用 RtlCreateRegistryKey 与 RtlWriteRegistryValue，且缺少授权校验和路径限制。标准用户由此可绕过注册表 ACL 写入 HKLM 等受保护项，并进一步改写服务 ImagePath、COM 注册或开机启动项以实现本地权限提升。\n修复版本中通过限制非特权用户访问控制设备，并在注册表写入前增加授权校验与路径白名单，切断该内核态任意注册表写入链路。截至本报告编写时，厂商尚未发布修复版本。", "effects": [{"comp_name": "ultra_ramdisk_pro", "ecosystem": "linux", "versions": [{"affected_version": "[1.82,1.82]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-09-01", "level": "High", "mps_id": "MPS-3ay4-z9dl", "poc": false, "poc_url": [], "published_time": "2026-09-01", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-3ay4-z9dl", "name": "https://www.oscs1024.com/hd/MPS-3ay4-z9dl"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-82807", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-82807"}, {"url": "https://vuldb.com/cve/CVE-2026-82807", "name": ""}, {"url": "https://vuldb.com/submit/864537", "name": ""}, {"url": "https://vuldb.com/vuln/397226", "name": ""}, {"url": "https://vuldb.com/vuln/397226/cti", "name": ""}, {"url": "https://winslow1984.com/books/cve-collection/page/ultra-ramdisk-pro-182-kernel-driver-urdscsisys-local-privilege-escalation-via-arbitrary-registry-value-write", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Ultra RAMDisk本地提权漏洞", "_translated": true, "_saved_at": "2026-08-31T17:20:49+00:00", "_first_saved_at": "2026-08-31T17:20:49+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-3ay4-z9dl"}, {"analysis_status": 0, "articles": [{"content": "由于应用程序或系统中存在敏感信息未经适当保护而被泄露给攻击者或未经授权的用户，这些敏感信息可能包括用户凭据、个人身份信息、敏感业务数据、系统配置信息等。信息暴露漏洞通常是由于设计、实施或配置错误引起的，例如不正确的访问控制、弱密码策略、缺乏加密、错误的日志处理等。", "title": "什么是未授权敏感信息泄露"}, {"content": "- 直接访问敏感信息：攻击者可以通过直接访问不正确配置或不受保护的资源来获取敏感信息，如通过公开可访问的URL、未经授权的文件目录访问等。\n- 越权访问：攻击者可能利用访问控制错误或不正确的权限配置来获取他们没有权限访问的敏感信息。\n- 错误信息披露：应用程序在错误处理过程中可能泄露敏感信息，例如将错误消息中的敏感数据返回给客户端或显示在日志文件中。\n- 信息泄露通过响应：攻击者可能利用应用程序在响应中不正确地包含敏感信息，如通过网页源代码、响应头部或响应消息体中的敏感数据。", "title": "未授权敏感信息泄露常见的攻击方式"}, {"content": "- 访问控制：确保只有经过授权的用户能够访问敏感信息，使用强大的身份验证和授权机制。\n- 数据加密：对于敏感信息，使用适当的加密算法对数据进行加密，包括数据传输和存储过程中的加密。\n- 错误处理和日志安全：正确处理错误情况，避免在错误消息中暴露敏感信息。同时，确保日志记录功能的安全性，避免将敏感信息记录在日志文件中。\n- 安全配置和最佳实践：遵循安全最佳实践，对应用程序、服务器和系统进行适当的配置，包括访问控制、权限管理、密码策略等。\n- 审计和监控：实施日志审计和监控机制，及时检测和响应任何异常活动或潜在的信息暴露事件。\n- 安全开发实践：在应用程序开发过程中，进行安全代码审查、漏洞扫描和安全测试，以及敏感信息的正确处理和保护。", "title": "如何预防未授权敏感信息泄露"}], "cnvd_id": "", "cve_id": "CVE-2026-84195", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:N/A:N", "severity": "high", "base_score": 7.7}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:H/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.3}]}, "cvss_score": 8.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:H/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-200", "description": "1.16.4 之前的 Kyverno 会自动将准入控制器的 ServiceAccount 令牌附加到 apiCall 服务模式下的出站 HTTP 请求，而无需显式授权标头。攻击者可以通过将 apiCall 请求 序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-82392", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:N/I:H/A:L", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:N/I:H/A:L", "cwe": "CWE-22", "description": "pnpm 是一个包管理器。在 10.34.5 之前以及从 11.0.0 到 11.11.0，pnpm 使用 dp.parse(depPath).name 解析攻击者控制的 pnpm-lock.yaml 包密钥中的包名称，并在 deps/graph-builder/src/lockfileToDepGraph.ts 中使用它而不进行验证， pnpm11/deps/graph-builder/src/lockfileToDepGraph.ts。名称达到path.join(modules, pkgName)、storeController.importPackage和pnpm11/lockfile/to-pnp/src/index.ts，允许当用户运行pnpm install时将包内容写入node_modules之外。当angerlyAllowAllBuilds或匹配的allowBuilds条目允许生命周期脚本时，转义的包可以使用用户的权限执行代码。此问题已在版本 10.34.5 和 11.11.0 中修复。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-09-01", "level": "High", "mps_id": "MPS-6n3h-sepr", "poc": false, "poc_url": [], "published_time": "2026-09-01", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-6n3h-sepr", "name": "https://www.oscs1024.com/hd/MPS-6n3h-sepr"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-82392", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-82392"}, {"url": "https://github.com/pnpm/pnpm/commit/51300fd41c5e4c8f47635108e373cc3d1f324fa7", "name": ""}, {"url": "https://github.com/pnpm/pnpm/commit/78e29fe5583a1e5d69ea05e414eff310f78d5ed9", "name": ""}, {"url": "https://github.com/pnpm/pnpm/pull/12872", "name": ""}, {"url": "https://github.com/pnpm/pnpm/pull/12890", "name": ""}, {"url": "https://github.com/pnpm/pnpm/releases/tag/v10.34.5", "name": ""}, {"url": "https://github.com/pnpm/pnpm/releases/tag/v11.11.0", "name": ""}, {"url": "https://github.com/pnpm/pnpm/security/advisories/GHSA-c59q-g84q-2gj5", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-82392漏洞", "_translated": true, "_saved_at": "2026-08-31T22:17:06+00:00", "_first_saved_at": "2026-08-31T22:17:06+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-6n3h-sepr"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-75132", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:N", "severity": "medium", "base_score": 6.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-89", "description": "WAPT 是 Tranquil IT 出品的软件部署与配置管理平台，WAPT Server 提供主机清单、软件包仓库与控制台 REST API，当前受影响产品为 WAPT Enterprise。\n受影响版本中，GET `/api/v3/hosts` 接口的 ` SS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-84192", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:L/A:N", "severity": "high", "base_score": 7.1}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:H/VI:L/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:H/VI:L/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-79", "description": "26.3.1 之前的 LibreNMS 在旧版 PHP 模板中包含一个存储的跨站点脚本漏洞，这些模板会输出源自 SNMP 和源自系统日志的数据而不转义。控制受监控网络设备的攻击者可以通过 SNMP 接口描述或系统日志程序字段注入任意 JavaScript，这些程序字段在经过身份验证的用户查看受影响的页面时执行。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网 ------------- |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-82229", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:L", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:L", "cwe": "CWE-79", "description": "WordPress 社交登录和注册 \u003c= 7.8.2 版本中存在未经身份验证的跨站脚本 (XSS)。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-09-01", "level": "High", "mps_id": "MPS-x0lj-y9r4", "poc": false, "poc_url": [], "published_time": "2026-09-01", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-x0lj-y9r4", "name": "https://www.oscs1024.com/hd/MPS-x0lj-y9r4"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-82229", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-82229"}, {"url": "https://patchstack.com/database/wordpress/plugin/miniorange-login-openid/vulnerability/wordpress-wordpress-social-login-and-register-plugin-7-8-2-cross-site-scripting-xss-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-82229漏洞", "_translated": true, "_saved_at": "2026-08-31T22:17:14+00:00", "_first_saved_ AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "cwe": "CWE-122", "description": "gvfs 是 GNOME 桌面环境默认使用的开源虚拟文件系统框架，通过 sftp、smb、ftp 等后端守护进程为文件管理器与 GIO 应用提供统一的网络文件系统挂载和读写能力，本次漏洞涉及其 SFTP 后端进程 gvfsd-sftp。\n受影响版本中，daemon/gvfsbackendsftp.c 的 read_reply() 把服务器返回的 32 位数据长度 count 直接作为读取长度，调用 g_input_stream_read_all() 写入按客户端请求大小 g_malloc (bytes_requested) 分配的 GVfsJobRead 缓冲区，全程未将 count 与 bytes_requested 比较；恶意 SFTP 服务器在响应 SSH_FXP_READ 时返回超过请求量的长度，便能向该堆缓冲区后方越界写入数据，破坏相邻堆内存，gvfsd-sftp 因 glibc 检测到堆损坏而 abort，形成可靠拒绝服务，越界数据可到达回复对象的 free_func 指针等控制流数据，存在进一步演变为代码执行的空间。\n修复版本中通过在 read_reply() 中增加服务器长度校验解决该问题：上游提交 5ab77256 先以 count = MIN (count, G_VFS_JOB_READ (job)-\u003ebytes_requested) 将读取长度截断到客户端请求大小，随后提交 1ff24454 与稳定分支提交 1590471a 按 SFTP 规范改为当 count 大于 bytes_requested 时直接返回 Invalid reply received 错误，使服务器返回的超长数据无法再越过客户端请求的缓冲区边界。", "effects": [{"comp_name": "gvfs", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.60.2)", "min_fixed_version": "1.60.2", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,1.61.90)", "min_fixed_version": "1.61.90", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "堆缓冲区溢出", "kind_en": "基于堆的缓冲区溢出", "last_modified_time": "2026-09-02", "level": "High", "mps_id": "MPS-r2da-blcv", "poc": false, "poc_url": [], "published_time": "2026-09-02", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-r2da-blcv", "name": "https://www.oscs1024.com/hd/MPS-r2da-blcv"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-84268", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-84268"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-84268", "name": ""}, {"url": "https://bugzilla.redhat.com/show_bug.cgi?id=2526485", "name": ""}, {"url": "https://gitlab.gnome.org/GNOME/gvfs/-/issues/862", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "gvfs SFTP后端堆缓冲区溢出漏洞", "_translated": true, "_saved_at": "2026-09-01T17:10:59+00:00", "_first_saved_at": "2026-09-01T17:10:59+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-r2da-blcv"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-84208", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "high", "base_score": 7.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-89", "description": "AVideo 是 WWBN 维护的开源音视频平台（Composer 包 wwbn/avideo），用于自建直播、点播与内容分发，User_Location 插件提供基于 IP 的地理位置识别。\n受影响版本中，plugin/User_Location/regions.json.php 与 cities.json.php 无认证校验，将 GET 参数 country、region 传入 IP2Location::getRegions() 与 getCities()，并以 country_name = '{$country_name}'、region_name /V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-290", "description": "WWBN AVideo 是开源视频托管与直播平台，用于自建视频站点与广播网络。\n受影响版本中，objects/functions.php 的 getRealIpAddr() 在 REMOTE_ADDR 为私网或回环地址时，会直接采信请求头 X-Real-IP 或 X-Forwarded-For，且未校验来源是否为受信任代理；getForwardedClientIpFromServerArray() 还优先返回调用方注入的首个合法 IPv4。objects/login.json.php 在校验凭据前调用 enforceRateLimit('login', 30, 300)，而限流键由 getRealIpAddr() 拼接。攻击者可对每次登录请求轮换伪造头，使计数分散到不同桶，绕过登录限流并无限制猜测账户口令。\n修复版本中通过新增 isRequestFromTrustedProxy()，将 getRealIpAddr() 读取转发头的条件从 isPrivateOrLoopbackIP($remoteAddr) 改为仅当 REMOTE_ADDR 位于 $global['trustedProxies'] 时才采信转发地址，并拒绝由转发头得到的回环地址，使未列入信任列表的客户端无法再指定限流键。", "effects": [{"comp_name": "AVideo", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,29.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "使用欺骗进行的认证绕过", "kind_en": "通过欺骗绕过身份验证", "last_modified_time": "2026-09-02", "level": "High", "mps_id": "MPS-8ny3-40sz", "poc": false, "poc_url": [], "published_time": "2026-09-02", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-8ny3-40sz", "name": "https://www.oscs1024.com/hd/MPS-8ny3-40sz"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-84476", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-84476"}, {"url": "https://github.com/WWBN/AVideo/security/advisories/GHSA-gg65-574p-h4wc", "name": ""}, {"url": "https://www.vulncheck.com/advisories/wwbn-avideo-authentication-bypass-via-x-real-ip-header", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "AVideo IP伪造绕过限流", "_translated": true, "_saved_at": "2026-09-02T00:47:06+00:00", "_first_saved_at": "2026-09-02T00:47:06+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-8ny3-40sz"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能有效地控制资源的使用，导致攻击者可以利用这个漏洞耗尽应用程序所依赖的资源。这些资源可以是计算资源（CPU、内存）、网络带宽、数据库连接或其他系统资源。攻击者可以通过发送特制的请求、恶意输入或其他方式，使应用程序消耗大量资源，导致拒绝服务或系统崩溃。", "title": "什么是拒绝服务"}, {"content": "- 消耗计算资源：攻击者可以发送计算密集型的请求，例如复杂的计算、无限循环或递归操作，以耗尽应用程序的计算资源，导致应用程序无法响应其他请求。\r\n- 消耗内存资源：攻击者可以发送大量的数据或恶意输入，以导致应用程序消耗过多的内存资源，从而使系统的可用内存耗尽，并导致应用程序崩溃或变得不可用。\r\n- 消耗网络带宽：攻击者可以发送大量的请求或大型数据包，以消耗应用程序所依赖的网络带宽。这会导致其他合法用户无法正常访问应用程序或降低系统的整体网络性能。\r\n- 消耗存储资源：攻击者可以发送大量的请求或上传大文件，以耗尽应用程序的存储资源，导致系统无法处理其他请求或存储新的数据。", "title": "拒绝服务常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对输入数据进行合理的验证和过滤，防止恶意输入导致资源消耗过高。\r\n- 实施资源限制：应用程序应该实施适当的资源限制策略，例如限制计算操作的时间或次数，限制内存使用量，限制并发连接数等，以防止资源被耗尽。\r\n- 异常处理与错误恢复：应用程序应该具备健壮的异常处理和错误恢复机制，以防止因意外错误导致资源泄漏或无法释放的情况。\r\n- 资源监控与警报：应用程序应该实施适当的资源监控和警报机制，及时发现异常的资源消耗情况，并采取相应的措施来应对。\r\n- 压力测试与性能优化：应用程序应该进行压力测试，以评估其在高负载情况下的性能，并进行必要的性能优化，以确保能够有效地处理大量请求而不耗尽资源。", "title": "如何预防拒绝服务"}], "cnvd_id": "", "cve_id": "CVE-2026-84304", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-400", "description": "gRPC-Go（模块路径 google.golang.org/grpc）是 gRPC 的开源 Go 语言实现，用于基于 HTTP/2 提供高性能远程过程调用。\n受影响版本中，HTTP/2 DATA 帧经 http2Server.handleData 进入 Stream.write 后，recvBuffer.put 会把每一帧单独存为 backlog 中的一条 recvMsg。未认证攻击者可将负载拆成海量 1 字节 DATA 帧并多路复用并发流；即便总字节数仍处于连接与流的流量控制窗口内，每帧的 recvMsg 结构体与缓冲元数据仍会不成比例地占用堆内存，最终导致进程 panic 或因内存耗尽退出。\n修复版本中通过 compactBacklogLocked 对接收缓冲做压缩：当未压缩后缀的堆开销相对实际负载过高且超过阈值时，把连续小缓冲合并为 BufferPool 中的单一大缓冲，切断按帧膨胀内存的路径。该压缩默认启用，可用环境变量 GRPC_GO_EXPERIMENTAL_ENABLE_RECEIVE_BUFFER_COMPACTION 临时关闭。", "effects": [{"comp_name": "google.golang.org/grpc", "ecosystem": "go", "versions": [{"affected_version": "(-∞,1.83.1)", "min_fixed_version": "1.83.1", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "拒绝服务", "kind_en": "不受控制的资源消耗", "last_modified_time": "2026-09-02", "level": "High", "mps_id": "MPS-rjov-gs27", "poc": false, "poc_url": [], "published_time": "2026-09-02", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-rjov-gs27", "name": "https://www.oscs1024.com/hd/MPS-rjov-gs27"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-84304", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-84304"}, {"url": "https://github.com/grpc/grpc-go/commit/7354d9c8debb4bcf2225bf429857078de310c176", "name": ""}, {"url": "https://github.com/grpc/grpc-go/commit/8cfeca0e1ee5ea0980dcc320e20240fa1079ec77", "name": ""}, {"url": "https://github.com/grpc/grpc-go/pull/9331", "name": ""}, {"url": "https://github.com/grpc/grpc-go/pull/9333", "name": ""}, {"url": "https://github.com/grpc/grpc-go/releases/tag/v1.83.1", "name": ""}, {"url": "https://github.com/grpc/grpc-go/security/advisories/GHSA-vp52-pcj8-j9qc", "name": ""}], "scope_influence": "", "tags": ["go"], "title": "gRPC-Go堆内存耗尽漏洞", "_translated": true, "_saved_at": "2026-09-01T20:23:32+00:00", "_first_saved_at": "2026-09-01T20:23:32+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-rjov-gs27"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-84482", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/M Compiler 用 secrets.token_hex(32) 生成对称 HMAC 密钥，_Job.compile 将其写入训练作业 Environment 的 REMOTE_FUNCTION_SECRET_KEY，并随流水线定义持久化。同一 AWS 账号内具备 sagemaker:DescribePipeline 权限的身份可从 DescribePipeline 响应提取该明文密钥，伪造带有效 HMAC 的载荷并覆盖 S3 对象，使受害用户流水线在其执行角色上下文中反序列化执行攻击者代码。\n修复版本中通过将 v3 步骤编译器的 _function_step_secret_token 替换为客户端持有的 ECDSA 私钥、仅把公钥写入流水线定义，并在 v2 中移除 hmac_key 及 REMOTE_FUNCTION_SECRET_KEY 存储，阻止对称密钥经 DescribePipeline 泄露后被用于伪造完整性签名。已用 @step 创建的流水线需在升级后调用 pipeline.upsert() 替换旧密钥材料；@remote 用户升级 SDK 即可，因每次调用会创建不含持久化密钥的新作业。", "effects": [{"comp_name": "sagemaker", "ecosystem": "pip", "versions": [{"affected_version": "(-∞,2.256.0)", "min_fixed_version": "2.256.0", "repository": "pip", "solutions": [], "upstream": true}, {"affected_version": "[3.0.0,3.11.0)", "min_fixed_version": "3.11.0", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "敏感数据的明文存储", "kind_en": "敏感信息的明文存储", "last_modified_time": "2026-09-02", "level": "High", "mps_id": "MPS-xm6t-lzkp", "poc": false, "poc_url": [], "published_time": "2026-09-02", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-xm6t-lzkp", "name": "https://www.oscs1024.com/hd/MPS-xm6t-lzkp"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-83551", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-83551"}, {"url": "https://aws.amazon.com/security/security-bulletins/2026-093-aws/", "name": ""}, {"url": "https://github.com/aws/sagemaker-python-sdk/releases/tag/v2.256.0", "name": ""}, {"url": "https://github.com/aws/sagemaker-python-sdk/releases/tag/v3.11.0", "name": ""}, {"url": "https://github.com/aws/sagemaker-python-sdk/security/advisories/GHSA-7xmc-crrw-fv5r", "name": ""}], "scope_influence": "", "tags": ["AI", "python", "开源"], "title": "SageMaker明文存储密钥", "_translated": true, "_saved_at": "2026-09-01T20:23:33+00:00", "_first_saved_at": "2026-09-01T20:23:33+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-xm6t-lzkp"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-83549", "cvss": {"cvssv31": [{"source": "134c704f-9b21-4f2e-91b3-4a467353bcc0", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-78", "description": "Post-authentication Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection') vulnerability has been identified in the SMA1000 Appliance Management Console (AMC) which in specific conditions could potentially enable a remote authenticated attacker as administrator to execute arbitrary OS commands, resulting in remote code execution.", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-09-02", "level": "High", "mps_id": "MPS-hse8-dqab", "poc": false, "poc_url": [], "published_time": "2026-09-02", "reference_url_list": [{"url": "h
