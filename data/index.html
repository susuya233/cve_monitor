at": "2026-08-14T20:25:03+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-5y9a-3gnx"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过向受信任的数据序列化过程中添加恶意数据，从而在序列化和反序列化过程中执行恶意代码的攻击漏洞。这种漏洞通常存在于使用序列化 (serialization) 机制存储和传输数据的程序中。\n", "title": "什么是反序列化"}, {"content": "- 注入攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码注入到程序中，从而实现代码执行的目的。\n- 反射攻击：攻击者使用反射机制，在序列化过程中动态生成恶意数据，并将恶意代码注入到程序中，从而实现代码执行的目的。\n- 缓冲区溢出攻击：攻击者通过在序列化过程中向缓冲区输入恶意数据，导致缓冲区溢出，从而破坏程序的内存管理，实现代码执行的目的。\n- 格式字符串攻击：攻击者通过在序列化过程中输入恶意数据，导致程序使用错误的格式字符串，从而实现代码执行的目的。\n- 数据流攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码作为一个数据流传递给程序，从而实现代码执行的目的。\n", "title": "反序列化常见的攻击方式"}, {"content": "- 不信任输入数据：程序应该严格检查输入数据的有效性，并避免使用不受信任的数据。\n- 使用安全的序列化机制：程序应该使用安全的序列化机制，如 JSON 或 XML 序列化，而不是第三方序列化库。\n- 最小特权原则：程序应该限制对受信任数据的处理权限，并避免在运行时修改数据。\n- 代码审查和漏洞扫描：程序应该进行代码审查和漏洞扫描，以发现和修复潜在的安全漏洞。\n", "title": "如何预防反序列化"}], "cnvd_id": "", "cve_id": "CVE-2025-7639", "cvss": {"cvssv4": [{"source": "ics-cert@hq.dhs.gov", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 10}]}, "cvss_score": 10, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-502", "description": "该漏洞如果被利用，可能会允许经过身份验证的不法分子 \n拥有“DNA权威-操作员”权限篡改序列化 \n数据，可能导致反序列化期间代码执行 \n在企业 SCADA 安全组“DNA Apps”的权限下。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "反序列化", "kind_en": "不可信数据的反序列化", "last_modified_time": "2026-08-15", "level": "Critical", "mps_id": "MPS-nv04-e6rg", "poc": false, "poc_url": [], "published_time": "2026-08-15", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-nv04-e6rg", "name": "https://www.oscs1024.com/hd/MPS-nv04-e6rg"}, {"url": "https://nvd.nist.gov/ requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-08-15", "level": "Critical", "mps_id": "MPS-9zgr-t52w", "poc": false, "poc_url": [], "published_time": "2026-08-15", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-9zgr-t52w", "name": "https://www.oscs1024.com/hd/MPS-9zgr-t52w"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-17186", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-17186"}, {"url": "https://www.ibm.com/support/pages/node/7283359", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-17186漏洞", "_translated": true, "_saved_at": "2026-08-14T21:19:30+00:00", "_first_saved_at": "2026-08-14T21:19:30+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-9zgr-t52w"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2026-15303", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC: 6-15826漏洞", "_translated": true, "_saved_at": "2026-08-15T14:16:09+00:00", "_first_saved_at": "2026-08-15T08:20:27+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-37ju-idyg"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2026-48528", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-287", "description": "Metacat 是数据存储库软件，可帮助研究人员保存、共享和发现数据。 Metacat 版本 2.0.0 到 3.4.0 在“/cn/v1/object”和“/cn/v2/object” REST API 端点中包含未经身份验证的 SQL 注入漏洞，原因是未经验证的用户输入可以传递到后端 SQL 数据库。可以修改`nodeId`参数来注入SQL命令，结果以错误消息的形式返回。 Metacat 将用户提供的数据附加到 SQL 查询中，而无需进行清理或参数化。这允许从底层 PostgresQL 数据库中提取任意数据，从而将受保护的信息完全暴露给攻击者。这是通过利用 Metacat 中的错误报告机制来实现的，其中 SQL 错误响应在 Metacat 返回的 XML 错误消息中镜像回调用者。例如，一种方法是使用 PostgreSQL“CAST”函数通过任意子查询的结果生成错误，然后将其注入 Metacat 返回的 XML 错误消息中。攻击者无需经过身份验证即可执行攻击。  此外，还可以执行在Metacat数据库中插入、更新和删除数据的任意SQL语句，从而导致数据库中的所有数据被完全泄露。针对这些漏洞已经开发并验证了完整的概念验证攻击。此漏洞的影响对于 DataONE 网络中的 Metacat 部署至关重要，其中数据库中的信息可能会被泄露、添加、更改或删除。这包括有关数据目录的管理信息、有关谁访问数据的访问日志信息、有关个人的识别信息（包括其 ORCID 标识符和客户端 IP 地址）、有关谁应该能够访问和修改数据的访问控制信息，以及数据系统的其他关键内部结构。此 SQL 注入漏洞已在 Metacat 3.4.1 版本中得到完全修复。如果无法立即升级到 Metacat 3.4.1，大多数部署可以通过禁用 web 应用程序部署中的“/cn” REST 端点来缓解该问题。 DataONE 网络中的成员存储库不需要或使用此 API，因为它仅由 DataONE 协调节点部署使用。因此，可以禁用此 API，而不会减少大多数部署的功能。要禁用易受攻击的端点，只需删除与两个 servlet“edu.ucsb.nceas.metacat.restservice.v1.CNRestServlet”和“edu.ucsb.nceas.metacat.restservice.v2.CNRestServlet”关联的 servlet 引擎中“/cn”端点的 servlet 和 servlet 映射即可。例如，在 Tomcat 中，从 Metacat 中的应用程序 web.xml 文件中删除相关的“servlet-mapping”元素。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "身份验证不当", "kind_en": "认证不当", "last_modified_time": "2026-08-15", "level": "Critical", "mps_id": "MPS-7c0b-42rw", "poc": false, "poc_url": [], "published_time": "2026-08-15", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-7c0b-42rw", "name": "https://www.oscs1024.com/hd/MPS-7c0b-42rw"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-48528", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-48528"}, {"url": "https://github.com/NCEAS/metacat/security/advisories/GHSA-6g6j-wh5h-77h5", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-48528漏洞", "_translated": true, "_saved_at": "2026-08-14T19:44:07+00:00", "_first_saved_at": "2026-08-14T18:44:19+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-7c0b-42rw"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户 ument、batch_upload_documents、get_upload_status、get_upload_history、remove_document、remove_documents_by_tags、search_document_content 这七个 /api/documents/* 路由处理器在签名中均缺少 Depends(require_read_access) / Depends(require_write_access) 形参，直接进入 storage.store、storage.delete_by_tags 等存储后端逻辑；当运维启用 HTTP REST 模式并配置 MCP_API_KEY 或 OAuth 时，/api/memories 路由会被 require_read_access/require_write_access 守卫拦截返回 401，但 /api/documents/* 路由仍允许任意请求访问，从而造成未授权的内存读写删链路。\n修复版本中通过，修复版本（10.67.1）中通过在 documents.py 头部 import 中补齐 Depends 并新增 from ..oauth.middleware import require_read_access, require_write_access, AuthenticationResult，然后为 upload_document、batch_upload_documents、remove_document、remove_documents_by_tags 等写操作路由添加 user: AuthenticationResult = Depends(require_write_access) 形参，为 get_upload_status、get_upload_history、search_document_content 等读操作路由添加 user: AuthenticationResult = Depends(require_read_access) 形参，使每一个进入 storage.store / storage.delete_by_tags 的请求都必须先经 MCP_API_KEY 或 OAuth 校验，未授权访问被 FastAPI 依赖注入在路由入口拦截，从而切断未认证读写删的利用路径；用户应升级至 10.67.1 及以上版本，或在升级前通过反向代理/防火墙限制对 /api/documents/* 的外部访问作为临时缓解。", "effects": [{"comp_name": "mcp-memory-service", "ecosystem": "pip", "versions": [{"affected_version": "[0,10.67.1)", "min_fixed_version": "10.67.1", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "关键功能的认证机制缺失", "kind_en": "缺少关键功能的身份验证", "last_modified_time": "2026-07-03", "level": "Critical", "mps_id": "MPS-maq4-8hue", "poc": false, "poc_url": [], "published_time": "2026-08-15", "reference_url_list": [{"url": "https://github.com/doobidoo/mcp-memory-service/security/advisories/GHSA-84hp-mqvj-3p8h", "name": ""}, {"url": "https://github.com/advisories/GHSA-84hp-mqvj-3p8h", "name": ""}], "scope_influence": "", "tags": ["AI", "python", "开源"], "title": "mcp-memory-service 文档 API 端点缺少身份认证漏洞", "_translated": true, "_saved_at": "2026-08-14T20:25:04+00:00", "_first_saved_at": "2026-08-14T20:25:04+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-maq4-8hue"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-73849", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-306", "description": "Emlog 是一个开源网站构建系统。在 2.6.26 及更早版本中，install.php 在没有身份验证的情况下接受 action=reinstall 并故意跳过已安装的检查，因为防护仅在 $act != 'reinstall' 时运行。远程攻击者可以提交主机名、dbuser、dbpasswd、dbname、dbprefix、用户名、密码和电子邮件值，以导致 file_put_contents('config.php', $config) 使用攻击者控制的数据库设置覆盖配置并创建新的管理员帐户。截至本次审查，尚无可用的固定版本。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "关键功能的认证机制缺失", "kind_en": "缺少关键功能的身份验证", "last_modified_time": "2026-08-15", "level": "Critical", "mps_id": "MPS-vbmn-tahu", "poc": false, "poc_url": [], "published_time": "2026-08-15", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-vbmn-tahu", "name": "https://www.oscs1024.com/hd/MPS-vbmn-tahu"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73849", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73849"}, {"url": "https://github.com/emlog/emlog/security/advisories/GHSA-v5qq-p8mp-3gxm", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-73849漏洞", "_translated": true, "_saved_at": "2026-08-14T19:44:05+00:00", "_first_saved_at": "2026-08-14T18:44:14+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-vbmn-tahu"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-19682", "cvss": {"cvssv31": [{"source": "vulnreport@tenable.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.9}], "cvssv4": [{"source": "vulnreport@tenable.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.4}]}, "cvss_score": 9.4, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-78", "description": "安全中心中存在命令注入漏洞，未经身份验证的远程攻击者可以利用此问题以服务帐户的权限在底层操作系统上执行任意命令。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-08-15", "level": "Critical", "mps_id": "MPS-edyj-8n3r", "poc": false, "poc_url": [], "published_time": "2026-08-15", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-edyj-8n3r", "name": "https://www.oscs1024.com/hd/MPS-edyj-8n3r"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-19682", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-19682"}, {"url": "https://www.tenable.com/security/tns-2026-22", "na l/socialite/commit/caf714f55d51ab0d914b40033d8b0f489d6219cc", "name": ""}, {"url": "https://github.com/laravel/socialite/pull/789", "name": ""}, {"url": "https://www.vulncheck.com/advisories/laravel-socialite-facebook-provider-authentication-bypass-via-nonce-replay", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-73683漏洞", "_translated": true, "_saved_at": "2026-08-14T23:16:08+00:00", "_first_saved_at": "2026-08-14T23:16:08+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-rfev-7jmz"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-67365", "cvss": {"cvssv4": [{"source": "security@joomla.org", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:L/VA:L/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.2}]}, "cvss_score": 9.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:L/VA:L/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-89", "description": "Joomla 扩展 - icagenda.com - iCagenda 中未经身份验证的 SQL 注入 \u003c 4.0.0-4.0.11 - mod_icagenda_calendar (iCagenda) 中未经身份验证的 SQL 注入，可通过 com_ajax 访问，无需会话、令牌或帐户。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-08-15", "level": "Critical", "mps_id": "MPS-xwy9-bghp", "poc": false, "poc_url": [], "published_time": "2026-08-15", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-xwy9-bghp", "name": "https://www.oscs1024.com/hd/MPS-xwy9-bghp"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-67365", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-67365"}, {"url": "https://www.icagenda.com/", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-67365漏洞", "_translated": true, "_saved_at": "2026-08-14T22:16:14+00:00", "_first_saved_at": "2026-08-14T21:19:14+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-xwy9-bghp"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-49457", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N", "severity": "critical", "base_score": 9.1}]}, "cvss_score": 9.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N", "cwe": "CWE-297", "description": "QUIC 客户端在 TLS 1.3 握手阶段未对服务器证书执行 CertificateVerify 签名、证书链与主机名校验，触发条件为业务代码调用 quic:connect/4 发起客户端连接，影响为网络路径上的中间人可凭任意证书冒充服务端，破坏连接机密性与完整性。\n受影响版本中 quic（hex 包 quic，GitHub 仓库 benoitc/erlang_quic）的所有 1.4.4 之前版本（\u003c= 1.4.3）在 TLS 1.3 握手过程中既未对服务器证书执行 CertificateVerify 签名校验，也未按 cacerts 选项对证书链做信任锚校验，同时未对 server_name 与证书做主机名匹配，使 verify 选项在客户端实际成为空操作；基于同一 QUIC 客户端实现的 HTTP/3 客户端同等受影响，仅 PSK 会话恢复握手因不发送证书而不受影响。\n修复版本中通过 1.4.4 提交 39d28b0d14d2c55888c1f1a15688e85d777fc4da 在 quic_connection.erl 的 process_tls_message 中对客户端引入 quic_tls:verify_certificate_verify/4 签名校验与新增模块 quic_cert:validate_server/4（基于 public_key:pkix_path_validation 与 public_key:pkix_verify_hostname）的证书链与主机名校验，将 verify 默认改为 true 并新增 中包括攻击者控制的文件名导致文件被写入预期目录之外的存档提取情况。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-08-16", "level": "Critical", "mps_id": "MPS-6qsp-bmcl", "poc": false, "poc_url": [], "published_time": "2026-08-16", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-6qsp-bmcl", "name": "https://www.oscs1024.com/hd/MPS-6qsp-bmcl"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-74764", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-74764"}, {"url": "https://github.com/pandora-analysis/pandora/commit/186b58d41e04248a154d274fffb5813e7fa2012e", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-74764漏洞", "_translated": true, "_saved_at": "2026-08-16T02:20:45+00:00", "_first_saved_at": "2026-08-15T23:14:04+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-6qsp-bmcl"}, {"analysis_status": 0, "articles": [{"content": "- 程序未正确处理用户上传的文件，从而导致程序可以读取、处理或存储未经授权的文件\n", "title": "什么是任意文件上传"}, {"content": "- 欺骗攻击：攻击者可以通过发送伪造的文件来欺骗程序，从而导致程序读取、处理或存储未经授权的文件。\n- 文件格式攻击：攻击者可以通过选择特定的文件格式，例如压缩文件或 ZIP 文件，从而利用上传的文件来篡改程序的执行结果或窃取程序中的重要数据。\n", "title": "任意文件上传常见的攻击方式"}, {"content": "- 使用安全文件传输协议 (FTP):使用安全 FTP 协议可以确保上传的文件格式、大小、权限等符合预期，同时可以防止文件读取、篡改或存储漏洞。\n- 使用文件上传过滤器：使用文件上传过滤器可以过滤上传的文件，以确保文件的格式、大小、权限等符合预期，同时可以防止文件读取、篡改或存储漏洞。\n- 使用白名单机制：使用白名单机制可以只允许特定的文件格式、大小、权限等存在的文件上传，从而防止非法文件的上传和攻击。\n- 定期更新和升级程序：定期更新和升级程序可以修复已知的漏洞，并增强程序的安全性。", "title": "如何预防任意文件上传"}], "cnvd_id": "", "cve_id": "CVE-2026-16098", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-434", "description": "WordPress 的 ProSolution WP 客户端插件在 2.0.10 及之前的所有版本中都容易通过 proSol_handleFileUpload 函数受到任意文件上传的攻击。这是由于缺少对攻击者控制的 Content-Disposition 标头文件名的验证（该文件名会在保存文件之前覆盖允许列出的多部分文件名），以及保存后扩展检查无法删除已写入的文件。这使得未经身份验证的攻击者可以上传可执行的文件，从而使远程代码执行成为可能。到达上传处理程序所需的随机数通过呈现作业门户短代码的任何前端页面上的 wp_localize_script 公开公开，允许未经身份验证的访问者获取有效的随机数并完全绕过该门控检查。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "任意文件上传", "kind_en": "危险类型文件无限制上传", "last_modified_time": "2026-08-16", "level": "Critical", "mps_id": "MPS-7cia-s25k", "poc": false, "poc_url": [], "published_time": "2026-08-16", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-7cia-s25k", "name": "https://www.oscs1024.com/hd/MPS-7cia-s25k"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-16098", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-16098"}, {"url": "https://plugins.trac.wordpress.org/browser/prosolution-wp-client/tags/2.0.6/includes/UploadHandler.php#L1090", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/prosolution-wp-client/tags/2.0.6/includes/UploadHandler.php#L1327", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/prosolution-wp-client/tags/2.0.6/includes/class-prosolwpclient.php#L254", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/prosolution-wp-client/tags/2.0.6/public/class-prosolwpclient-public.php#L1033", "name": ""}, {"url": "https://plugins.trac.wordpress.org/changeset?reponame=\u0026old=3644463%40prosolution-wp-client\u0026new=3644463%40prosolution-wp-client", "name": ""}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/3c4a7aef-09ec-4d17-87d6-f507d64e0afa?source=cve", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-16098漏洞", "_translated": true, "_saved_at": "2026-08-16T05:22:22+00:00", "_first_saved_at": "2026-08-16T05:22:22+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-7cia-s25k"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-19598", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-863", "description": "在 3.3.9 及之前的所有版本中，Pods – WordPress 的自定义内容类型和字段插件很容易通过授权绕过进行权限升级。该漏洞的存在是因为 pods_admin AJAX 路由器通过 pods_error() 汇集了每个访问检查（包括方法白名单、随机数验证、登录强制和功能门），该方法在 JSON 元盒加载器兼容性路径下仅将失败写入 PHP 错误日志并返回 false，而不是终止请求，从而使所有防护措施无效。  这使得未经身份验证的攻击者可以将其权限升级为管理员或覆盖任何用户帐户的密码（包括站点所有者的密码），从而实现完全站点接管，或执行其他管理员操作。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-08-16", "level": "Critical", "mps_id": "MPS-m6ji-8r40", "poc": false, "poc_url": [], "published_time": "2026-08-16", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-m6ji-8r40", "name": "https://www.oscs1024.com/hd/MPS-m6ji-8r40"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-19598", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-19598"}, {"url": "https://plugins.trac.wordpress.org/browser/pods/tags/3.3.9/includes/general.php#L400", "name": ""}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/3628032a-3121-45a7-8a78-cfcd8ba6af2f?source=cve", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-19598漏洞", "_translated": true, "_saved_at": "2026-08-15T22:14:38+00:00", "_first_saved_at": "2026-08-15T19:16:54+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-m6ji-8r40"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "cnvd_id": "", "cve_id": "CVE-2026-18432", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-269", "description": "WordPress 的 Frontend Admin by DynamiApps 插件在 3.29.9 及之前的所有版本中都容易受到权限升级的影响。该漏洞的存在是因为 `ActionUser::conditions_logic()` 在 `is_numeric()` 测试后面控制了 `current_user_can('edit_user', $user_id)` 授权检查，导致当 `$user_id` 是非数字字符串时完全跳过检查 — 这种情况可以通过将精心设计的值（例如 `1one`）传递到未经验证的未经验证的 `item_id` 参数来引发。 `wp_ajax_nopriv_frontend_admin/forms/change_form` AJAX 端点。这使得攻击者可以通过获取带有非数字用户 ID 的服务器签名“_acf_objects”负载来将权限升级为管理员，WordPress 随后将其强制为整数 1（默认管理员），从而允许攻击者覆盖该帐户的密码或电子邮件地址。 .trac.wordpress.org/browser/acf-frontend-form-element/tags/3.29.9/main/frontend/forms/classes/display.php#L37", "name": ""}, {"url": "https://plugins.trac.wordpress.org/changeset?reponame=\u0026old=3633030%40acf-frontend-form-element\u0026new=3633030%40acf-frontend-form-element", "name": ""}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/01404fad-7b5a-485a-b557-c608fe25e6c9?source=cve", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-18432漏洞", "_translated": true, "_saved_at": "2026-08-16T05:22:16+00:00", "_first_saved_at": "2026-08-16T05:22:16+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-unoy-trgw"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过向受信任的数据序列化过程中添加恶意数据，从而在序列化和反序列化过程中执行恶意代码的攻击漏洞。这种漏洞通常存在于使用序列化 (serialization) 机制存储和传输数据的程序中。\n", "title": "什么是反序列化"}, {"content": "- 注入攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码注入到程序中，从而实现代码执行的目的。\n- 反射攻击：攻击者使用反射机制，在序列化过程中动态生成恶意数据，并将恶意代码注入到程序中，从而实现代码执行的目的。\n- 缓冲区溢出攻击：攻击者通过在序列化过程中向缓冲区输入恶意数据，导致缓冲区溢出，从而破坏程序的内存管理，实现代码执行的目的。\n- 格式字符串攻击：攻击者通过在序列化过程中输入恶意数据，导致程序使用错误的格式字符串，从而实现代码执行的目的。\n- 数据流攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码作为一个数据流传递给程序，从而实现代码执行的目的。\n", "title": "反序列化常见的攻击方式"}, {"content": "- 不信任输入数据：程序应该严格检查输入数据的有效性，并避免使用不受信任的数据。\n- 使用安全的序列化机制：程序应该使用安全的序列化机制，如 JSON 或 XML 序列化，而不是第三方序列化库。\n- 最小特权原则：程序应该限制对受信任数据的处理权限，并避免在运行时修改数据。\n- 代码审查和漏洞扫描：程序应该进行代码审查和漏洞扫描，以发现和修复潜在的安全漏洞。\n", "title": "如何预防反序列化"}], "cnvd_id": "", "cve_id": "CVE-2024-13784", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-502", "description": "在 1.8.5 及之前的所有版本中，联系表单、调查、测验和弹出表单生成器 – WordPress 的 ARForms 插件很容易通过反序列化表单提交中的不受信任的输入而受到 PHP 对象注入的攻击。这使得未经身份验证的攻击者可以注入 PHP 对象。易受攻击的软件中不存在已知的 POP 链，这意味着除非网站上安装了另一个包含 POP 链的插件或主题，否则此漏洞不会产生影响。如果通过目标系统上安装的附加插件或主题存在 POP 链，则可能允许攻击者根据存在的 POP 链执行删除任意文件、检索敏感数据或执行代码等操作。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "反序列化", "kind_en": "不可信数据的反序列化", "last_modified_time": "2026-08-16", "level": "Critical", "mps_id": "MPS-w6m3-1dze", "poc": false, "poc_url": [], "published_time": "2026-08-16", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-w6m3-1dze", "name": "https://www.oscs1024.com/hd/MPS-w6m3-1dze"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2024-13784", "name": "https://nvd.nist.gov/vuln/detail/CVE-2024-13784"}, {"url": "https://wordpress.org/plugins/arforms-form-builder/", "name": ""}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/5e0116d6-91c3-4212-9c68-6b706ab09768?source=cve", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2024-13784漏洞", "_translated": true, "_saved_at": "2026-08-16T14:16:20+00:00", "_first_saved_at": "2026-08-16T10:16:44+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-w6m3-1dze"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-73052", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:R/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:P/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.4}]}, "cvss_score": 9.4, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:P/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-79", "description": "v3.7.4之前的SiYuan存储属性视图字段名称，不进行HTML转义，并通过排序菜单中的innerHTML将它们直接插入到选项元素中。攻击者可以通过重命名数据库字段来注入标记，以便在用户打开排序菜单时执行任意 JavaScript，并在桌面客户端中启用节点集成来执行代码。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-08-16", "level": "Critical", "mps_id": "MPS-2ljs-rn8t", "poc": false, "poc_url": [], "published_time": "2026-08-16", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-2ljs-rn8t", "name": "https://www.oscs1024.com/hd/MPS-2ljs-rn8t"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73052", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73052"} -option-color", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-73050漏洞", "_translated": true, "_saved_at": "2026-08-15T23:14:13+00:00", "_first_saved_at": "2026-08-15T23:14:13+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-v89j-4mac"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-74251", "cvss": {"cvssv4": [{"source": "security@joomla.org", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-89", "description": "Joomla 扩展 - phoca.cz - 通过 Phoca Cart 5.0.0-6.1.16 中的属性过滤器进行未经身份验证的 SQL 注入 - Phoca Cart 公共商店商品页面上的 a[]（属性）和 s[]（规范）GET 数组参数原始连接到 SQL WHERE 子句中，无需参数化或转义。未经身份验证的攻击者可以通过这些参数注入任意 SQL，从而通过基于时间的盲技术实现完整的数据库提取。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", " , "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-18316", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:H/A:H", "severity": "critical", "base_score": 9.1}]}, "cvss_score": 9.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:H/A:H", "cwe": "CWE-862", "description": "WordPress 的 Solace Extra 插件容易受到未经授权的修改和数据丢失，因为在 1.6.0 及以下版本中缺少对 import_zip() 函数的功能检查。该处理程序在 wp_ajax_action-import-zip 和 wp_ajax_nopriv_action-import-zip 上注册，并且仅验证“ajax-nonce”随机数，该随机数通过 wp_localize_script （不受限制的 admin_enqueue_scripts 挂钩）在每个管理页面上发出，因此任何经过身份验证的用户（包括订阅者）都可以访问该随机数。这使得具有订阅者级别及以上访问权限的经过身份验证的攻击者可以擦除导航菜单、侧边栏小部件（通过 update_option('sidebars_widgets', array())）、所有主题 mod（通过 remove_theme_mods()）和 Elementor 模板，以及触发任意演示内容导入。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-08-16", "level": "Critical", "mps_id": "MPS-0ugv-8dyb", "poc": false, "poc_url": [], "published_time": "2026-08-16", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-0ugv-8dyb", "name": "https://www.oscs1024.com/hd/MPS-0ugv-8dyb"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-18316", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-18316"}, {"url": "https://plugins.trac.wordpress.org/browser/solace-extra/tags/1.6.0/admin/class-solace-extra-admin.php#L289", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/solace-extra/tags/1.6.0/admin/import.php#L2382", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/solace-extra/tags/1.6.0/includes/class-solace-extra.php#L336", "name": ""}, {"url": "https://plugins.trac.wordpress.org/changeset?reponame=\u0026old=3627961%40solace-extra\u0026new=3627961%40solace-extra", "name": ""}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/4e427c4e-3e27-49e3-ba64-6241b430d5d8?source=cve", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-18316漏洞", "_translated": true, "_saved_at": "2026-08-16T06:29:41+00:00", "_first_saved_at": "2026-08-16T06:29:41+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-0ugv-8dyb"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-18855", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:H/A:H", "severity": "critical", "base_score": 9.1}]}, "cvss_score": 9.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:H/A:H", "cwe": "CWE-22", "description": "WordPress 的链接库插件容易受到任意文件删除的影响，因为在 7.9.4 及之前的所有版本中，ll_delete_link_fields 函数中的文件路径验证不足，这使得未经身份验证的攻击者可以删除服务器上的任意文件，当删除正确的文件（例如 wp-config.php）时，很容易导致远程代码执行。利用该漏洞需要管理员启用“删除链接时删除本地文件”插件选项（默认情况下禁用），并随后永久删除攻击者提交的链接，这是例行的审核操作。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-08-16", "level": "Critical", "mps_id": "MPS-r321-tnsl", "poc": false, "poc_url": [], "published_time": "2026-08-16", "reference_url_list": [{"ur 合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2026-19977", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:N/AC:L/Au:N/C:C/I:C/A:C", "severity": "high", "base_score": 10}], "cvssv31": [{"source": "cna@vuldb.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 10}], "cvssv4": [{"source": "cna@vuldb.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-287", "description": "EFM ipTIME A3004T 14.19.0 中检测到漏洞。受影响的元素是组件Session Validation 的函数httpcon_check_session_url。执行操作会导致身份验证不当。远程利用攻击是可能的。该漏洞现已公开并可能被使用。我们很早就就此事联系了供应商，但没有以任何方式做出回应。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "身份验证不当", "kind_en": "认证不当", "last_modified_time": "2026-08-17", "level": "Critical", "mps_id": "MPS-seuk-8wh2", "poc": false, "poc_url": [], "published_time": "2026-08-17", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-seuk-8wh2", "name": "https://www.oscs1024.com/hd/MPS-seuk-8wh2"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-19977", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-19977"}, {"url": "https://github.com/AdminSafe/CVE/issues/1", "name": ""}, {"url": "https://vuldb.com/cve/CVE-2026-19977", "name": ""}, {"url": "https://vuldb.com/submit/873848", "name": ""}, {"url": "https://vuldb.com/vuln/391156", "name": ""}, {"url": "https://vuldb.com/vuln/391156/cti", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-19977漏洞", "_translated": true, "_saved_at": "2026-08-17T04:35:03+00:00", "_first_saved_at": "2026-08-17T03:44:03+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-seuk-8wh2"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "cnvd_id": "", "cve_id": "CVE-2026-15001", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-269", "description": "bLoyal：WordPress 的 bLoyal 插件的忠诚度和促销在 3.1.611.78 及之前的所有版本中都容易受到权限升级的影响。这是由于 AJAX 操作 `save_bloyal_configuration_data` 和 `save_bloyal_accesskeyverification_data` 在没有任何功能或随机数检查的情况下注册，并且 `bloyal_customer_auto_login` 函数无条件信任存储在插件选项中的 API URL 返回的 `Customer.ExternalId` 值。这使得具有订阅者级及以上访问权限的经过身份验证的攻击者可以通过不受保护的 AJAX 操作覆盖插件的 bLoyal Loyalty Engine API URL (`bloyal_custom_loyaltyengine_api_url`) 和 `is_bloyal_custom_api_url` 标志，然后触发未经身份验证的 `/cart` REST 路由以导致 `bloyal_customer_auto_login` 获取客户来自攻击者控制的端点的数据，并使用攻击者提供的“Customer.ExternalId”调用“wp_set_auth_cookie()”，从而以包括站点管理员在内的任何 WordPress 用户身份进行身份验证。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-08-15", "level": "High", "mps_id": "MPS-4bw3-e12f", "poc": false, "poc_url": [], "published_time": "2026-08-15", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-4bw3-e12f", "name": "https://www.oscs1024.com/hd/MPS-4bw3-e12f"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-15001", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-15001"}, {"url": "https://plugins.trac.wordpress.org/browser/bloyal/tags/3.1.611.78/app/controller/class-bloyalcontroller.php#L2429", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/bloyal/tags/3.1.611.78/app/controller/class-bloyalcontroller.php#L2470", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/bloyal/tags/3.1.611.78/app/controller/class-bloyalcontroller.php#L2512", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/bloyal/tags/3.1.611.78/app/controller/class-bloyalcontroller.php#L421", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/bloyal/tags/3.1.611.78/app/controller/class-bloyalcontroller.php#L494", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/bloyal/tags/3.1.611.78/app/controller/class-bloyalcontroller.php#L806", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/bloyal/tags/3.1.611.78/bloyal.php#L1196", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/bloyal/tags/3.1.611.78/bloyal.php#L1553", "name": ""}, {"url": "https://plugin 或存储漏洞。\n- 使用白名单机制：使用白名单机制可以只允许特定的文件格式、大小、权限等存在的文件上传，从而防止非法文件的上传和攻击。\n- 定期更新和升级程序：定期更新和升级程序可以修复已知的漏洞，并增强程序的安全性。", "title": "如何预防任意文件上传"}], "cnvd_id": "", "cve_id": "CVE-2026-18438", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-434", "description": "Templately – Elementor 和 Gutenberg 模板库：6500 多个免费和专业版模板和云！ WordPress 插件在 3.7.1 及之前的所有版本中都容易通过 fetch_remote_file 函数受到远程代码执行的攻击。这是由于 fetch_remote_file 中的文件名验证/目标不匹配，其中文件类型验证是针对攻击者控制的内容处置文件名而不是 URL 路径派生的目标文件名执行的。这使得具有贡献者级别及以上访问权限的经过身份验证的攻击者可以在服务器上执行代码。 GIF+PHP 多语言文件通过 Content-Disposition 文件名将 wp_check_filetype_and_ext 验证为 image/gif，而实际目标路径是使用从 URL 路径派生的 .php 扩展名编写的，完全绕过了 unfiltered_upload 功能门。受影响的端点可以在此权限级别访问，因为 Templately 的整个 REST API（包括此攻击中使用的云导入端点（/templately/v1/clouds/upload 和 /templately/v1/insert））仅由 current_user_can('delete_posts') 检查授权，没有管理员或管理选项功能要求。相同的权限门还允许贡献者通过 /templately/v1/login 端点覆盖站点的全局 Templately 云连接，并将 global_signin 设置为 true。完整的补救措施应该纠正 fetch_remote_file 以根据实际目标文件名而不是 Content-Disposition 标头验证文件类型（并避免从请求 URL 派生写入路径），并将状态更改模板 REST 路由限制为适当的管理员级别功能。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "任意文件上传", "kind_en": "危险类型文件无限制上传", "last_modified_time": "2026-08-15", "level": "High", "mps_id": "MPS-saen-omwx", "poc": false, "poc_url": [], "published_time": "2026-08-15", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-saen-omwx", "name": "https://www.oscs1024.com/hd/MPS-saen-omwx"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-18438", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-18438"}, {"url": "https://plugins.trac.wordpress.org/browser/templately/tags/3.6.5/includes/API/API.php#L128", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/templately/tags/3.6.5 ""}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/4e68b2f2-12e4-4ff2-919d-26d6b21acd03?source=cve", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-18438漏洞", "_translated": true, "_saved_at": "2026-08-15T15:14:53+00:00", "_first_saved_at": "2026-08-15T11:14:05+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-saen-omwx"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "cnvd_id": "", "cve_id": "CVE-2026-15312", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-269", "description": "Propovoice：适用于 WordPress 的多合一客户端管理系统插件在 1.7.8 及之前的所有版本中都容易受到权限升级的影响。这是由于“create()”函数的 REST 端点无法根据允许的 WordPress 角色白名单验证用户提供的“role”参数，并且在将清理后的值直接传递给“WP_User::set_role()”之前忽略任何“promote_users”功能检查。这使得具有“ndpv_manager”级别及以上访问权限的经过身份验证的攻击者可以创建一个分配有“管理员”角色的新 WordPress 用户帐户，从而实现完全垂直权限升级。 “ndpv_manager”功能是 Propovoice 本身授予的子管理员 CRM 团队角色，这意味着攻击面不仅限于站点管理员，还扩展到该插件已提升为经理职位的任何用户。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-08-15", "level": "High", "mps_id": "MPS-sc1b-auf0", "poc": false, "poc_url": [], "published_time": "2026-08-15", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-sc1b-auf0", "name": "https://www.oscs1024.com/hd/MPS-sc1b-auf0"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-15312", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-15312"}, {"url": "https://plugins.trac.wordpress.org/browser/propovoice/trunk/includes/Api/Type/Team.php#L169", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/propovoice/trunk/includes/Api/Type/Team.php#L219", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/propovoice/trunk/includes/Api/Type/Team.php#L38", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/propovoice/trunk/includes/Api/Type/Team.php#L423", "name": ""}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/6a39e4d4-890d-46f9-8bb9-0fc858e6f1e2?source=cve", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-15312漏洞", "_translated": true, "_saved_at": "2026-08-15T04:23:24+00:00", "_first_saved_at": "2026-08-15T04:23:24+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-sc1b-auf0"}, {"analysis_status": 0, "articles": [{"content": "- 程序未正确处理用户上传的文件，从而导致程序可以读取、处理或存储未经授权的文件\n", "title": "什么是任意文件上传"}, {"content": "- 欺骗攻击：攻击者可以通过发送伪造的文件来欺骗程序，从而导致程序读取、处理或存储未经授权的文件。\n- 文件格式攻击：攻击者可以通过选择特定的文件格式，例如压缩文件或 ZIP 文件，从而利用上传的文件来篡改程序的执行结果或窃取程序中的重要数据。\n", "title": "任意文件上传常见的攻击方式"}, {"content": "- 使用安全文件传输协议 (FTP):使用安全 FTP 协议可以确保上传的文件格式、大小、权限等符合预期，同时可以防止文件读取、篡改或存储漏洞。\n- 使用文件上传过滤器：使用文件上传过滤器可以过滤上传的文件，以确保文件的格式、大小、权限等符合预期，同时可以防止文件读取、篡改或存储漏洞。\n- 使用白名单机制：使用白名单机制可以只允许特定的文件格式、大小、权限等存在的文件上传，从而防止非法文件的上传和攻击。\n- 定期更新和升级程序：定期更新和升级程序可以修复已知的漏洞，并增强程序的安全性。", "title": "如何预防任意文件上传"}], "cnvd_id": "", "cve_id": "CVE-2026-15965", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-434", "description": "WordPress 的 MaxUpload – 大文件上传 – 增加最大文件上传大小插件在 1.4.0 及之前的所有版本中都容易通过 handle_upload 函数受到任意文件上传的攻击。这是由于 handle_upload 函数中的文件名验证不匹配，其中扩展名和 MIME 检查应用于上传块的文件名，但不适用于从 resumableFilename 参数派生的最终组装文件名。这使得未经身份验证的攻击者可以上传可执行的文件，从而使远程代码执行成为可能。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "任意文件上传", "kind_en": "危险类型文件无限制上传", "last_modified_time": "2026-08-15", "level": "High", "mps_id": "MPS-u21h-4gti", "poc": false, "poc_url": [], "published_time": "2026-08-15", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-u21h-4gti", "name": "https://www.oscs1024.com/hd/MPS-u21h-4gti"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-15965", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-15965"}, {"url": "https://plugins.trac.wordpress.org/browser/maxupload-upload-larger-files-easily/tags/1.4.0/includes/uploader.php#L121", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/maxupload-upload-larger-files-easily/tags/1.4.0/includes/uploader.php#L174", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/maxupload-upload-larger-files-easily/tags/1.4.0/includes/uploader.php#L19", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/maxupload-upload-larger-files-easily/tags/1.4.0/includes/uploader.php#L201", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/maxupload-upload-larger-files-easily/tags/1.4.0/maxupload-wp.php#L88", "name": ""}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/70d90c0c-e3c6-4db9-b16d-1442e7e1dc3b?source=cve", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-15965漏洞", "_translated": true, "_saved_at": "2026-08-15T04:23:22+00:00", "_first_saved_at": "2026-08-15T04:23:22+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-u21h-4gti"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-73680", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-78", "description": "Cockpit CMS 2.14.0 及更早版本在 FFmpeg 集成中包含一个命令注入漏洞，该漏洞允许仅具有资产/上传权限的经过身份验证的用户通过上传带有 shell 元字符的文件名的视频文件来执行任意命令。在 slugify() 清理程序运行之前，未经清理的文件名会插入到通过 Process::fromShellCommandline() 执行的 shell 命令中，从而使注入的 shell 元字符（例如反引号、$() 和分号）能够转义 FFmpeg 命令上下文并以 Web 服务器用户身份执行。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", " d": "代码注入", "kind_en": "代码生成控制不当（“代码注入”）", "last_modified_time": "2026-08-15", "level": "High", "mps_id": "MPS-y6hi-jmtq", "poc": false, "poc_url": [], "published_time": "2026-08-15", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-y6hi-jmtq", "name": "https://www.oscs1024.com/hd/MPS-y6hi-jmtq"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73679", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73679"}, {"url": "https://github.com/DevVaibhav07/VULN-POC/blob/main/ImpressCMSRCCE.md", "name": ""}, {"url": "https://github.com/ImpressCMS/impresscms", "name": ""}, {"url": "https://www.vulncheck.com/advisories/impresscms-authenticated-rce-via-php-custom-tag-eval", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-73679漏洞", "_translated": true, "_saved_at": "2026-08-14T20:25:00+00:00", "_first_saved_at": "2026-08-14T20:25:00+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-y6hi-jmtq"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-63361", "cvss": {"cvssv4": [{"source": "help@fluidattacks.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:A/VC:H/VI:H/VA:N/SC:L/SI:L/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.5}]}, "cvss_score": 8.5, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:A/VC:H/VI:H/VA:N/SC:L/SI:L/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-79", "description": "LimeSurvey Community Edition 7.0.5 在 HTML 编辑器弹出端点中包含经过身份验证的反射跨站点脚本漏洞。文本和名称查询参数通过黑名单清理器传递，然后在没有上下文适当的输出编码的情况下进行渲染。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-08-15", "level": "High", "mps_id": "MPS-kbzm-er2d", "poc": false, "poc_url": [], "published_time": "2026-08-15", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-kbzm-er2d", "name": "https://www.oscs1024.com/hd/MPS-kbzm-er2d"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-63361", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-63361"}, {"url": "https://fluidattacks.com/es/advisories/mercedes", "name": ""}, {"url": "https://github.com/LimeSurvey/LimeSurvey", "name": ""}, {"url": "https://github.com/LimeSurvey/LimeSurvey/commit/a8993bfd05c4a11255b8400ed9c41a2c22e93aa4", "name": "" request.jwtVerify({ key }) 的每个请求验证密钥会被插件的全局配置密钥静默覆盖，因为选项合并最后应用全局密钥。因此，对不同授权域使用不同密钥（例如单独的用户密钥和管理密钥）的应用程序会在明确需要另一个密钥的路由上接受使用全局密钥签名的令牌。这使得普通的经过身份验证的用户可以在不知道任何秘密的情况下跨越基于密钥的信任边界。该问题已在 @fastify/jwt 10.2.2 中修复，其中显式的每次调用密钥优先于全局密钥。用户应升级到10.2.2。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "密码学签名的验证不恰当", "kind_en": "密码签名验证不当", "last_modified_time": "2026-08-15", "level": "High", "mps_id": "MPS-z6qk-0oji", "poc": false, "poc_url": [], "published_time": "2026-08-15", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-z6qk-0oji", "name": "https://www.oscs1024.com/hd/MPS-z6qk-0oji"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-18500", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-18500"}, {"url": "https://cna.openjsf.org/security-advisories.html", "name": ""}, {"url": "https://github.com/fastify/fastify-jwt/security/advisories/GHSA-j4cx-787j-xjqg", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-18500漏洞", "_translated": true, "_saved_at": "2026-08-15T18:19:13+00:00", "_first_saved_at": "2026-08-15T15:14:38+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-z6qk-0oji"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-69414", "cvss": {"cvssv31": [{"source": "secure@microsoft.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "", "description": "Microsoft 发现 Microsoft Defender 中的 Microsoft 恶意软件防护引擎存在权限提升，公开称为“ShieldBreak”。\n我们正在努力提供高质量的安全更新来解决此漏洞。当更新可用时，我们将在此 CVE 中提供信息。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "", "kind_en": "", "last_modified_time": "2026-08-15", "level": "High", "mps_id": "MPS-87op-dvqb", "poc": false, "poc_url": [], "published_time": "2026-08-15", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-87op-dvqb", "name": "https://www.oscs1024.com/hd/MPS-87op-dvqb"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-69414", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-69414"}, {"url": "https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-69414", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-69414漏洞", "_translated": true, "_saved_at": "2026-08-14T23:16:11+00:00", "_first_saved_at": "2026-08-14T23:16:11+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-87op-dvqb"}, {"analysis_status": 0, "articles": [{"content": "- 命令注入是一种攻击，其目标是通过易受攻击的应用程序在主机操作系统上执行任意命令。 当应用程序将不安全的用户提供的数据（表单、cookie、HTTP 标头等）传递到系统 shell 时，就会产生缺陷。攻击者通过构造恶意的命令或数据，将其注入到程序执行的上下文中，从而绕过程序的输入验证和安全措施，实现对程序操作的恶意操作。", "title": "什么是命令注入"}, {"content": "- 文件上传：攻击者通过构造恶意的文件上传请求，将包含恶意命令的文件上传到服务器，从而利用命令注入漏洞执行恶意命令。\n- SQL 注入：攻击者通过构造恶意的 SQL 查询语句，将包含恶意命令的 SQL 语句注入到数据库中，从而执行恶意命令，窃取数据或者破坏系统。\n- 命令执行：攻击者通过在 Web 应用程序的表单提交数据中注入恶意命令，从而执行恶意命令，例如删除文件、格式化硬盘等。\n- 命令注入漏洞的旁路攻击：攻击者可以利用命令注入漏洞旁路控制程序的执行流程，从而窃取数据、破坏系统、控制程序等。\n", "title": "命令注入常见的攻击方式"}, {"content": "- 输入验证：在程序输入处对输入数据进行严格的验证和过滤，确保输入数据符合预期的格式和类型，避免被攻击者注入恶意命令。\n- 输出过滤：在程序输出处对输出数据进行严格的过滤和检查，确保输出数据符合预期的格式和类型，避免被攻击者截获和篡改。\n- 使用安全的编程模型：使用安全的编程模型，例如避免使用原生的命令执行方式，使用安全的框架和库来处理输入数据和执行命令，避免命令注入漏洞。\n- 数据库加密和访问控制：对于敏感数据和命令，使用加密和访问控制措施，确保只有授权用户可以访问和执行命令，避免被攻击者窃取和篡改。\n- 定期更新和升级：定期更新和升级应用程序和库的版本，确保应用程序和库的最新版本包含了最新的安全补丁和修复措施，避免安全漏洞的出现和利用。\n- 安全审计和监控：定期对系统和应用程序进行安全审计和监控，及时发现和阻止潜在的安全漏洞和攻击，确保系统和数据的安全和可靠性。", "title": "如何预防命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-50523", "cvss": {"cvssv31": [{"source": "secure@microsoft.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-77", "description": "Microsoft PowerShell 中命令中使用的特殊元素的不正确中和（“命令注入”）允许授权攻击者在本地执行代码。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "命令注入", "kind_en": "命令中使用的特殊元素的不正确中和（“命令注入”）", "last_modified_time": "2026-08-15", "level": "High", "mps_id": "MPS-mwth-k9rf", "poc": false, "poc_url": [], "published_time": "2026-08-15", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-mwth-k9rf", "name": "https://www.oscs1024.com/hd/MPS-mwth-k9rf"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-50523", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-50523"}, {"url": "https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-50523", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-50523漏洞", "_translated": true, "_saved_at": "2026-08-14T23:16:13+00:00", "_first_saved_at": "2026-08-14T22:16:10+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-mwth-k9rf"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "cnvd_id": "", "cve_id": "CVE-2026-63700", "cvss": {"cvssv31": [{"source": "security_alert@emc.com", "vector": "CVSS:3.1/AV:L/AC:H/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:H/PR:L/UI:N/S:C/C:H/I:H/A:H", "cwe": "CWE-269", "description": "Dell Wyse Management Suite (WMS) 2605.0.2 之前的版本包含不正确的默认权限漏洞。具有本地访问权限的低权限攻击者可能会利用此漏洞，导致权限提升。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-08-15", "level": "High", "mps_id": "MPS-smha-y50r", "poc": false, "poc_url": [], "published_time": "2026-08-15", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-smha-y50r", "name": "https://www.oscs1024.com/hd/MPS-smha-y50r"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-63700", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-63700"}, {"url": "https://www.dell.com/support/kbdoc/en-us/000493271/dsa-2026-329-security-update-for-dell-wyse-management-suite-wms-for-multiple-vulnerabilities", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-63700漏洞", "_translated": true, "_saved_at": "2026-08-14T16:48:38+00:00", "_first_saved_at": "2026-08-14T16:48:38+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-smha-y50r"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-45699", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-191", "description": "Netatalk 是一个用于类 Unix 操作系统的免费开源文件服务器套件。在版本 3.1.19 到 4.4.2 中，Netatalk 的 afpd 守护程序的 copydir() 函数中存在基于堆栈的缓冲区溢出，这是由于在计算用于路径构建的剩余缓冲区大小时出现整数下溢。 copydir() 是一个实用程序函数，当文件操作跨越 AFP 共享卷内的设备边界时调用，这是标准库的 renameat() 无法处理的。该函数尝试使用 srem 和 drem 来跟踪源路径和目标路径的可用缓冲区空间。不正确的算术会导致 srem 和 drem 下溢至 SIZE_MAX。因此，针对 strlen(de-\u003ed_name) 的边界检查总是通过，从而允许 strcpy() 将文件名附加到几乎已满的堆栈缓冲区中。 4.4.3 版本修复了该问题。作为解决方法，将每个 AFP 共享卷配置为单个文件系统，换句话说，共享卷的子目录不应成为不同文件系统的安装点。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高" 输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-15162", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "cwe": "CWE-89", "description": "Object Sync for Salesforce 插件容易通过其 /wp-json/object-sync-for-salesforce/push/ REST 路由的 wordpress_object_type 参数遭受未经身份验证的 SQL 注入。路由的权限回调 (can_process()) 仅检查推送类的 HTTP 方法 - 无功能或随机数 - 因此未经身份验证的用户可以访问它。 wordpress_object_type 值直接连接到 SQL 查询中（post_type = \"$object_type\", class-object-sync-sf-wordpress.php:328），并通过 $wpdb-\u003eget_results() 执行，而不使用 $wpdb-\u003eprepare() (:578)。由于 REST 正文参数没有魔术引用，因此攻击者可以突破引用的字符串并注入任意 SQL。这使得未经身份验证的攻击者可以附加额外的 SQL 查询（基于时间的盲查询），从而能够从数据库中提取敏感信息，例如密码哈希值。仅需要有效的 wordpress_id（例如 1）——无需身份验证或 Salesforce 连接。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-08-15", "level": "High", "mps_id": "MPS-gxa6-kyzq", "poc": false, "poc_url": [], "published_time": "2026-08-15", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-gxa6-kyzq", "name": "https://www.oscs1024.com/hd/MPS-gxa6-kyzq"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-15162", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-15162"}, {"url": "https://plugins.trac.wordpress.org/browser/object-sync-for-salesforce/trunk/classes/class-object-sync-sf-rest.php#L224", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/object-sync-for-salesforce/trunk/classes/class-object-sync-sf-salesforce-push.php#L210", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/object-sync-for-salesforce/trunk/classes/class-object-sync-sf-wordpress.php#L328", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/object-sync-for-salesforce/trunk/classes/class-object-sync-sf-wordpress.php#L578", "name": ""}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/78f964a7-bed3-435e-94c5-750883a0c836?source=cve", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-15162漏洞", "_translated": true, "_saved_at": "2026-08-15T04:23:35+00:00", "_first_saved_at": "2026-08-15T04:23:35+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-gxa6-kyzq"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "cnvd_id": "", "cve_id": "CVE-2026-15142" ----- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-14433", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "cwe": "CWE-79", "description": "由于输入清理和输出转义不足，WordPress vcita 插件的 WordPress 在线预订和安排日历在 4.6.0 及之前的所有版本中很容易通过“business_id”参数受到存储跨站点脚本攻击。这使得未经身份验证的攻击者可以在页面中注入任意 Web 脚本，每当用户访问注入的页面时就会执行这些脚本。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-08-15", "level": "High", "mps_id": "MPS-8dlk-604p", "poc": false, "poc_url": [], "published_time": "2026-08-15", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-8dlk-604p", "name": "https://www.oscs1024.com/hd/MPS-8dlk-604p"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-14433", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-14433"}, {"url": "https://plugins.trac.wordpress.org/browser/meeting-scheduler-by-vcita/tags/4.6.0/vcita-api-functions.php#L17", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/meeting-scheduler-by auncher.py 中的 _detect_dev_source() 复用相同候选顺序并 rsync 攻击者控制的目录，作为次级代码执行入口。\n修复版本中通过 PR #47（commit 5d22091a25f0）将 CLAUDE_PROJECT_DIR 移出候选列表，并将 CORTEX_DEV_ROOT 的使用收紧为必须同时显式设置 CORTEX_DEV_SOURCE_SYNC=1 才会生效，仅保留 ~/Documents/Developments/Cortex 等用户自有目录作为兜底，对应版本为 v3.17.1（随后的 v3.17.2 同步做了一次分发修复）。", "effects": [{"comp_name": "neuro-cortex-memory", "ecosystem": "pip", "versions": [{"affected_version": "[3.17.0,3.17.1)", "min_fixed_version": "3.17.1", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "从非可信控制范围包含功能例程", "kind_en": "包含来自不可信控制领域的功能", "last_modified_time": "2026-08-15", "level": "High", "mps_id": "MPS-dqfz-8hs5", "poc": false, "poc_url": [], "published_time": "2026-08-15", "reference_url_list": [{"url": "https://github.com/cdeust/Cortex/security/advisories/GHSA-gvpp-v77h-5w8g", "name": ""}, {"url": "https://github.com/cdeust/Cortex/releases/tag/v3.17.1", "name": ""}, {"url": "https://github.com/advisories/GHSA-gvpp-v77h-5w8g", "name": ""}], "scope_influence": "", "tags": ["AI", "python", "开源"], "title": "Cortex MCP 服务器 open_visualization 工具存在任意代码执行漏洞", "_translated": true, "_saved_at": "2026-08-14T17:47:02+00:00", "_first_saved_at": "2026-08-14T17:47:02+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-dqfz-8hs5"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-16007", "cvss": {"cvssv4": [{"source": "ab69c47f-b95e-4bf2-b2d9-4b1fd1b24b4a", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:L/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:L/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-89", "description": "AppFlowy 的 qcuiknote 功能受到 SQL 注入漏洞的影响。有权访问该功能的经过身份验证的用户可以注入任意 SQL 来窃取底层 SQL 数据库中的数据。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-08-15", "level": "High", "mps_id": "MPS-ko8i-nwxa", "poc": false, "poc_url": [], "published_time": "2026-08-15", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ko8i-nwxa", "name": "https://www.oscs1024.com/hd/MPS-ko8i-nwxa"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-16007", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-16007"}, {"url": "https://projectblack.io/blog/appflowy-authenticated-sql-injection/", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-16007漏洞", "_translated": true, "_saved_at": "2026-08-15T14:16:13+00:00", "_first_saved_at": "2026-08-15T07:25:04+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ko8i-nwxa"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-49989", "cvss": {"cvssv31": [{"source": "github_advisory", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N", "severity": "low", "base_score": 0}], "cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-863", "description": "CrateDB 是开源的分布式 SQL 数据库，其 `io.crate.protocols.http.HttpBlobHandler` 处理的 `/_blobs/{table}/{digest}` HTTP 端点在已认证用户的请求中跳过 `Privileges`/`AccessControl` 校验，导致任何已认证用户可绕过 SQL 侧的 `GRANT` 权限直接读取、删除任意 blob（只要知道 SHA-1 摘要）并向任意 blob 表上传新内容。\n受影响版本中，`io.crate:crate` 的 `[, 6.2.8)` 与 `[6.3.0, 6.3.2)` 区间内，`server/src/main/java/io/crate/protocols/http/HttpBlobHandler.java` 的 `handleBlobRequest(HttpContent content)` 私有方法在根据 `HttpMethod` 分发到 `get/head/put/delete` 之前未调用 `Privileges.ensureUserHasPrivilege(roles, user, Permission.DQL|DML, Securable.TABLE, index)`，导致请求被认证放行后直接进入 `BlobService` 操作，SQL 路径返回 `MissingPrivilegeException` 而 HTTP 路径返回 `200 OK` 携带 blob 内容或 `204 No Content`，形成稳定的授权绕过。\n修复版本中通过在 6.2.8 / 6.3.2 引入抽象基类 `io.crate.protocols.http.HttpHandler` 并让 `HttpBlobHandler` 继承之，由基类在 `channelRead0` 中调用 `ensureSession(...)` 从 `Authorization` 头与 `HttpAuthUpstreamHandler` 设置的会话属性解析当前 `Role`，随后在 `handleBlobRequest` 中于 `GET/HEAD` 分支前增加 `Privileges.ensureUserHasPrivilege(roles, user, Permission.DQL, Securable.TABLE, index)`、于 `PUT/DELETE` 分支前增加 `Permission.DML` 的同一调用，将权限缺失抛出的 `MissingPrivilegeException` 交由现有异常映射转为 `403 Forbidden`，修复提交 `c8a0dccdbb3d01f1818190c2ed5cf6654f77eb6b` 在 6.2.x 分支被挑选为 `74c998c0dc`、在 6.3.x 分支被挑选为 `00bfe710d0`，使 HTTP 路径与 SQL 路径共享同一授权决策。", "effects": [{"comp_name": "io.crate:crate", "ecosystem": "maven", "versions": [{"affected_version": "[6.3.0,6.3.2)", "min_fixed_version": "6.3.2", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "(-∞,6.2.8)", "min_fixed_version": "6.2.8", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-08-15", "level": "High", "mps_id": "MPS-r5tv-g1z6", "poc": false, "poc_url": [], "published_time": "2026-08-15", "reference_url_list": [{"url": "https://github.com/crate/crate/security/advisories/GHSA-2xv8-gjwh-fv8p", "name": ""}, {"url": "https://github.com/advisories/GHSA-2xv8-gjwh-fv8p", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "CrateDB Blob HTTP 处理器授权绕过漏洞", "_translated": true, "_saved_at": "2026-08-14T17:47:01+00:00", "_first_saved_at": "2026-08-14T17:47:01+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-r5tv-g1z6"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-64887", "cvss": {"cvssv4": [{"source": "productsecurity@jci.com", "vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:N/UI:N/VC:H/VI:L/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X
