以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-62048", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:N/A:L", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:N/A:L", "cwe": "CWE-89", "description": "BookIt（插件标识 bookit）是 Liquid Web / StellarWP 开源的 WordPress 预约日历插件，以 GPLv2 或更高协议通过 WordPress 官方插件目录分发，用于管理员工、服务与客户的预约排期，其前端预约流程通过 admin-ajax 注册的无需登录 AJAX 接口完成。\n受影响版本中，bookit_book_appointment 等预约接口被注册为 wp_ajax_nopriv 动作并向未登录访客开放，2.6.0.7 之前的输入清洗规则未对 date_timestamp、start_time、end_time 做类型约束；员工服务关联查询 Staff_Services::get_staff_services 又把 implode 拼接的编号列表以未加引号的形式填入 WHERE staff_id IN (…) 片段，仅依赖只转义引号类字符的 esc_sql 过滤，不含引号的注入载荷可原样并入 SQL 语句，未认证攻击者可借此读取、篡改或删除数据库数据。\n修复版本中通过在 Staff_Services::get_staff_services 中改用 implode( ',', array_map( 'absint', $staffIds ) ) 重建 IN 列表，将元素强制为非负整数，并为 date_timestamp、start_time、end_time 补充 intval 清洗规则、在预约数据入库前强制整数转换，同时以服务端 validate() 返回的价格作为权威值，切断了未加引号拼接 SQL 的注入路径。", "effects": [{"comp_name": "bookit", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.6.0.7)", "min_fixed_version": "2.6.0.7", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-11-02", "level": "Critical", "mps_id": "MPS-cqwd-n3ml", "poc": false, "poc_url": [], "published_time": "2026-11-02", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-cqwd-n3ml", "name": "https://www.oscs1024.com/hd/MPS-cqwd-n3ml"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-62048", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-62048"}, {"url": "https://patchstack.com/database/wordpress/plugin/bookit/vulnerability/wordpress-bookit-plugin-2-6-0-6-sql-injection-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "BookIt 插件 SQL 注入漏洞", "_translated": true, "_saved_at": "2026-11-01T20:03:51+00:00", "_first_saved_at": "2026-11-01T20:03:51+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-cqwd-n3ml"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-120345", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:N/AC:L/Au:N/C:C/I:C/A:C", "severity": "high", "base_score": 10}], "cvssv3": [{"source": "VulDB", "vector": "CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H/E:P/RL:X/RC:R", "severity": "critical", "base_score": 10}], "cvssv31": [{"source": "cna@vuldb.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 10}], "cvssv4": [{"source": "cna@vuldb.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "c :H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-78", "description": "WAVLINK WN551X3-A 是闭源无线路由器固件，其 Web 后端程序 /bin/ioos 提供 WireGuard CLI Group Handler，用于管理 WireGuard 客户端分组。\n受影响版本中，该处理逻辑读取外部参数 group_name，未对命令元字符做中和，便将该值拼入交给 system() 执行的 uci 命令。远程攻击者可在以 root 身份运行的 /bin/ioos 中执行操作系统命令，从而控制设备。\n修复版本中通过官方固件更新消除该命令注入，但截至 2026-11-02 公开记录没有给出修复版本号、补丁或代码差异，不能确认具体修改内容。", "effects": [{"comp_name": "wn551x3-a", "ecosystem": "linux", "versions": [{"affected_version": "[M51X3_V251020-WO-182e965,M51X3_V251020-WO-182e965]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-11-02", "level": "Critical", "mps_id": "MPS-mknp-djwc", "poc": false, "poc_url": [], "published_time": "2026-11-02", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-mknp-djwc", "name": "https://www.oscs1024.com/hd/MPS-mknp-djwc"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-120344", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-120344"}, {"url": "https://vuldb.com/vuln/429669", "name": "VDB-429669 | WAVLINK WN551X3-A WireGuard CLI Group ioos system os command injection"}, {"url": "https://vuldb.com/vuln/429669/cti", "name": "VDB-429669 | CTI Indicators (IOB, IOC, TTP, IOA)"}, {"url": "https://vuldb.com/cve/CVE-2026-120344", "name": "CVE-2026-120344 | CVE Analysis and Report"}, {"url": "https://vuldb.com/submit/919551", "name": "Submit #919551 | Wavlink Router Firmware V251020-WO Command Injection"}, {"url": "https://github.com/senxitoyshuyi-ui/HACKALL/blob/main/WAVLINK_WN551X3-A%20Router/WAVLINK_WN551X3-A_wireguard_cli_group_command_injection.md", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "WN551X3 -9prc"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过构造恶意的数据，将过多的数据输入到程序的缓冲区中，使得缓冲区的空间被填满，从而溢出到程序的栈 (stack) 或堆 (heap) 中，导致程序崩溃、拒绝服务、数据泄露等安全问题。\n", "title": "什么是经典缓冲区溢出"}, {"content": "| 类型        | 描述                                                         |\n| ----------- | ------------------------------------------------------------ |\n| 代码注入攻击      | 攻击者通过向程序的缓冲区输入恶意代码，从而控制程序执行流程，实现对程序操作的恶意操作。例如，攻击者可以通过向 Web 应用程序的输入框中输入恶意代码，从而执行任意的代码，破坏系统、窃取数据等。 |\n| 数据覆盖攻击      | 攻击者通过向程序的缓冲区输入过多的数据，从而覆盖程序中的重要数据或代码，实现对程序操作的恶意操作。例如，攻击者可以通过向聊天应用程序的输入框中输入过多的表情符号，从而覆盖程序中的重要数据，例如聊天消息、账号密码等。 |\n| 栈溢出攻击 | 攻击者通过向程序的栈中输入过多的数据，从而溢出到栈外部，实现对程序操作的恶意操作。例如，攻击者可以通过向游戏应用程序的输入框中输入过多的道具名称，从而覆盖程序中的重要数据，例如游戏数据、账号密码等。 |\n| 堆溢出攻击       | 攻击者通过向程序的堆中输入过多的数据，从而溢出到堆外部，实现对程序操作的恶意操作。例如，攻击者可以通过向操作系统工具的输入框中输入过多的命令，从而覆盖程序中的重要数据，例如系统文件、配置文件等。 |", "title": "经典缓冲区溢出常见的攻击方式"}, {"content": "- 输入验证：在程序输入处对输入数据进行严格的验证和过滤，确保输入数据符合预期的格式和类型，避免被攻击者注入恶意命令或数据。可以使用正则表达式、格式字符串等方式进行输入验证。\n- 输出过滤：在程序输出处对输出数据进行严格的过滤和检查，确保输出数据符合预期的格式和类型，避免被攻击者截获和篡改。可以使用安全的输出过滤库等方式进行输出过滤。\n- 使用安全的编程模型：使用安全的编程模型，例如避免使用原生的缓冲区管理函数，使用安全的框架和库来处理输入数据和执行命令，避免缓冲区溢出漏洞。\n- 数据库加密和访问控制：对于敏感数据和命令，使用加密和访问控制措施，确保只有授权用户可以访问和执行命令，避免被攻击者窃取和篡改。\n- 定期更新和升级：定期更新和升级应用程序和库的版本，确保应用程序和库的最新版本包含了最新的安全补丁和修复措施，避免安全漏洞的出现和利用。\n- 安全审计和监控：定期对系统和应用程序进行安全审计和监控，及时发现和阻止潜在的安全漏洞和攻击，确保系统和数据的安全和可靠性。", "title": "如何预防经典缓冲区溢出"}], "cnvd_id": "", "cve_id": "CVE-2026-121156", "cvss": {}, "cvss_score": 9.6, "cvss_vector": "", "cwe": "CWE-120", "description": "Google Chrome 是 Google 基于开源 Chromium 发行的跨平台浏览器。Dawn 是其中的开源 WebGPU 实现（BSD 许可证，公开仓库为 google/dawn），负责在 OpenGL 与 Vulkan 等后端创建 GPU 纹理。\n受影响版本中，网页可通过 WebGPU 的 GPUDevice.createTexture 提交三维纹理尺寸。Dawn 在把纹理交给 Imagination（PowerVR/ImgTec）驱动之前，没有拒绝基级宽、高、深向上取整到 2 的幂后字节占用超过 32 位上限的请求。修复提交中的回归测试使用 513x513x513 的 RGBA8Unorm，取整后为 1024x1024x1024 且每纹素 4 字节，占用达到 4GiB。厂商公告将该问题定性为 Dawn 缓冲区溢出，严重性为 Critical；按 Chromium 严重性准则，该级别表示攻击者可在用户完整权限下读写底层平台资源。\n修复版本中通过新增 VerifyBaseLevelFootprint，在 Limit3DTexturePotFootprintTo4GB 开启且纹理维度为 3D 时，若按 2 的幂取整后的字节占用大于 uint32 最大值，则返回显存不足错误，在 OpenGL Texture::Create 与 Vulkan InternalTexture::Initialize 把纹理交给驱动之前拒绝创建。OpenGL 后端默认仅对 ImgTec 供应商启用该限制，Vulkan 后端默认仅在 MayBeImaginationProprietary() 成立时启用该限制。", "effects": [{"comp_name": "google-chrome:google-chrome", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,157.0.8103.38)", "min_fixed_version": "157.0.8103.38", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "经典缓冲区溢出", "kind_en": "不检查输入大小的缓冲区复制（“经典缓冲区溢出”）", "last_modified_time": "2026-11-04", "level": "Critical", "mps_id": "MPS-8a22-d922", "poc": false, "poc_url": [], "published_time": "2026-11-04", "reference_url_list": [{"url": "https://chromereleases.googleblog.com/2026/11/stable-channel-update-for-desktop.html", "name": ""}, {"url": "https://issues.chromium.org/issues/567735302", "name": ""}, {"url": "https://github.com/google/dawn/commit/c2e5529ac8b0b1b487f227938344480c4400aaa6", "name": ""}, {"url": "https://github.com/google/dawn/commit/62fa0852b8dec9966d9621f2dd6e7aea51f1a01d", "name": ""}, {"url": "https://dawn-review.googlesource.com/c/dawn/+/352155", "name": ""}, {"url": "https://dawn-review.googlesource.com/c/dawn/+/348055", "name": ""}, {"url": "https://chromium.googlesource.com/chromium/src/+/157.0.8103.38/DEPS", "name": ""}, {"url": "https://chromium.googlesource.com/chromium/src/+/main/docs/security/severity-guidelines.md", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Dawn三维纹理缓冲区溢出", "_translated": true, "_saved_at": "2026-11-03T21:25:33+00:00", "_first_saved_at": "2026-11-03T21:25:33+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-8a22-d922"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-120240", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:N/AC:L/Au:S/C:C/I:C/A:C", "severity": "high", "base_score": 9}], "cvssv3": [{"source": "VulDB", "vector": "CVSS:3.0/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H/E:P/RL:X/RC:R", "severity": "critical", "base_score": 9.9}], "cvssv31": [{"source": "cna@vuldb.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.9}], "cvssv4": [{"source": "cna@vuldb.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-78", "description": "WAVLINK WN553X1-B 是闭源无线路由器固件，WireGuard CLI Group Handler 由设备上的 /bin/ioos 处理分组配置。\n受影响版本中，sub_41A748 将调用方提供的 group_id 与 group_name 未经有效校验拼入操作系统命令并执行，远程已认证攻击者可注入系统命令，并以运行该组件的 root 权限控制设备。\n修复版本中通过阻断未校验的 group_id 与 group_name 进入操作系统命令执行来消除该问题；截至 2026-11-02，公开 CNA 记录没有给出已验证修复版本或修复提交，当前应限制管理接口的远程访问。", "effects": [{"comp_name": "wn553x1-b", "ecosystem": "linux", "versions": [{"affected_vers  引用是否为 null，随即执行 new byte[(int) getSize()]，在打开文件之前按客户端给出的长度分配数组。FolderUploadsFileManager.getFile 对尚未存储的目标路径仍返回 File 对象，因此没有真实上传也会进入分配。单次请求可占用接近 2GB 堆内存，重复请求可耗尽同一 Java 虚拟机的堆；长度转为 int 后为负时抛出 NegativeArraySizeException，而 get() 只捕获 IOException，该异常会离开此方法。\n修复版本中通过让 UploadInfo.getSize() 返回已存储文件的长度、让 UploadInfo.get() 仅在文件真实存在时读取磁盘字节，并让 respond 只把已存储结果交给 onUploadSuccess，使请求中的 size 不再决定堆分配。", "effects": [{"comp_name": "org.apache.wicket:wicket-core", "ecosystem": "maven", "versions": [{"affected_version": "[9.14.0,9.25.0)", "min_fixed_version": "9.25.0", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[10.0.0,10.12.0)", "min_fixed_version": "10.12.0", "repository": "maven", "solutions": [], "upstream": true}]}, {"comp_name": "wicket", "ecosystem": "linux", "versions": [{"affected_version": "[10.0.0,10.12.0)", "min_fixed_version": "10.12.0", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[9.14.0,9.25.0)", "min_fixed_version": "9.25.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "未经控制的内存分配", "kind_en": "大小值过大的内存分配", "last_modified_time": "2026-11-02", "level": "High", "mps_id": "MPS-8oyl-df7k", "poc": false, "poc_url": [], "published_time": "2026-11-02", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-8oyl-df7k", "name": "https://www.oscs1024.com/hd/MPS-8oyl-df7k"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-83594", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-83594"}, {"url": "https://lists.apache.org/thread.html/h5lxspxg746pzjd437n3n7mq5t3sfbcb", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "Wicket内存分配漏洞", "_translated": true, "_saved_at": "2026-11-02T00:08:37+00:00", "_first_saved_at": "2026-11-02T00:08:37+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-8oyl-df7k"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-84170", "cvss": {"cvssv4": [{"source": "security@apache.org", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:N/VI:L/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.3}]}, "cvss_score": 8.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:N/VI:L/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-770", "description": "Apache Wicket 是 Apache 软件基金会维护的开源 Java 组件化 Web 框架。wicket-core 中的 FileUploadToResourceField 把不经过 Form 的文件上传提交到单独挂载的 AbstractFileUploadResource。\n受影响版本中，AbstractFileUploadResource 是应用级单例，newResourceResponse 从请求查询参数 maxSize、fileMaxSize 和 fileCountMax 读取总大小、单文件大小和文件数量上限，并直接交给 multipart 解析器，这些数值没有绑定到发起上传的 FileUploadToResourceField。应用通过 setMaxSize、setFileMaxSize 和 setFileCountMax 配置的限制只在客户端省略对应参数时才被读取；客户端提交很大的 maxSize，或省略 fileMaxSize 与 fileCountMax 时，解析没有有效的总大小、单文件或文件数量上限。超过内存阈值的文件部分会写入容器临时目录，再复制到 IUploadsFileManager 目录下由请求命名的子目录，非文件部分会在解析时完整读入堆，单次请求即可消耗磁盘或堆内存。该资源默认没有授权注解，默认授权策略放行全部资源请求。此路径仅在应用使用 FileUploadToResourceField 或自行挂载 FileUploadResourceReference 时存在，8.x 没有该资源，Form 配合 FileUploadField 以及 AjaxFileDropBehavior 不走这条路径。\n修复版本中通过在解析请求前校验会话绑定的 HMAC 上传令牌，切断客户端自行指定上限的路径。FileUploadToResourceField 渲染时使用保存在会话中的随机密钥，对 uploadId 与三项上限计算 HmacSHA256；newResourceResponse 调用 hasValidUploadToken，只接受与请求中的上限一致且密钥属于已渲染会话的 uploadToken，缺失或不匹配的请求在进入 multipart 解析前被拒绝。", "effects": [{"comp_name": "org.apache.wicket:wicket-core", "ecosystem": "maven", "versions": [{"affected_version": "[10.0.0,10.9.1]", "min_fixed_version": "", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[9.14.0,9.25.0)", "min_fixed_version": "9.25.0", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "ex  "title": "锐捷交换机缓冲区溢出", "_translated": true, "_saved_at": "2026-11-01T20:03:43+00:00", "_first_saved_at": "2026-11-01T20:03:43+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-4wfm-c8h7"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-95863", "cvss": {"cvssv4": [{"source": "security@apache.org", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:P/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.6}]}, "cvss_score": 7.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:P/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-79", "description": "Apache Wicket 是 Apache 软件基金会的开源 Java 组件化 Web 框架，源码仓库为 apache/wicket，用于以服务端组件构建页面和表单。核心分发制品为 org.apache.wicket:wicket-core，扩展制品 org.apache.wicket:wicket-extensions 按同一版本线发布。\n受影响版本中，Component 构造函数对组件 id 只拒绝 ':' 与 '~'，setMarkupId(String) 与模板 id 属性进入组件后也不按 JavaScript 字符串上下文转义。渲染时 markup id 以及由组件 id 拼出的 input name 被放进单引号 JavaScript 字面量，含单引号或反斜杠的标识会结束该字面量，其后的内容在页面加载时于应用源站执行。9.x 与 10.x 的 OnEventHeaderItem.forMarkupId 将 markup id 拼为 Wicket.Event.add 的目标参数，并把脚本写入带有当次响应 nonce 的 script 元素，因此这两条版本线默认下发的 Content-Security-Policy 不能拦截该脚本。\n修复版本中通过在标识进入组件时拒绝危险字符，而不是在每个写出点逐一转义，切断未转义标识进入脚本字面量的路径。组件 id 与 markup id 不得再包含引号、反引号、反斜杠、花括号、尖括号、分号、与号或控制字符，markup id 还不得包含圆括号或方括号；构造组件、调用 setMarkupId 或读取模板 id 属性时，非法标识会抛出异常。", "effects": [{"comp_name": "org.apache.wicket:wicket-core", "ecosystem": "maven", "versions": [{"affected_version": "[9.0.0,9.25.0)", "min_fixed_version": "9.25.0", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[8.0.0,8.20.0)", "min_fixed_version": "8.20.0", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[10.0.0,10.12.0)", "min_fixed_version": "10.12.0", "repository": "maven", "solutions": [], "upstream": true}]}, {"comp_name": "org.apache.wicket:wicket-extensions", "ecosystem": "maven", "versions": [{"affected_version": "[9.0.0,9.25.0)", "min_fixed_version": "9.25.0", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[8.0.0,8.20.0)", "min_fixed_version": "8.20.0", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[10.0.0,10.12.0)", "min_fixed_version": "10.12.0", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "ex e 的脚本，此类 URL 无法携带该 nonce，默认策略可阻止脚本执行；策略被削弱或关闭时影响完整成立。Wicket 8.x 没有 Content-Security-Policy，按默认状态受影响。\n修复版本中通过将 DefaultLinkParser 的 URL 模式收窄为不区分大小写、且前面不能紧邻字母的 http、https 与 ftp，并让 URL_RENDER_STRATEGY.buildLink 对其他 scheme 直接返回原文、不再生成锚点，使可执行脚本的 scheme 不再进入 href。", "effects": [{"comp_name": "org.apache.wicket:wicket-extensions", "ecosystem": "maven", "versions": [{"affected_version": "[8.0.0,8.20.0)", "min_fixed_version": "8.20.0", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[9.0.0,9.25.0)", "min_fixed_version": "9.25.0", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[10.0.0,10.12.0)", "min_fixed_version": "10.12.0", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-11-02", "level": "High", "mps_id": "MPS-qtai-9fnk", "poc": false, "poc_url": [], "published_time": "2026-11-02", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-qtai-9fnk", "name": "https://www.oscs1024.com/hd/MPS-qtai-9fnk"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-83539", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-83539"}, {"url": "https://lists.apache.org/thread.html/xqdymd8g178sc112lmqbp53zlss53cwz", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "Wicket智能链接XSS", "_translated": true, "_saved_at": "2026-11-02T00:08:38+00:00", "_first_saved_at": "2026-11-02T00:08:38+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-qtai-9fnk"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-83559", "cvss": {"cvssv4": [{"source": "security@apache.org", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:A/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.4}]}, "cvss_score": 7.4, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:A/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-116", "description": "Apache Wicket 是 Apache 软件基金会维护的开源 Java 组件化 Web 框架，wicket-core 提供页面渲染以及把文本放入 JavaScript 字符串字面量前的转义方法。\n受影响版本中，org.apache.wicket.core.util.string.JavaScriptUtils.escapeQuotes 只把单引号替换为反斜杠加单引号、把双引号替换为反斜杠加双引号，没有先转义反斜杠。输入在引号前已经带有反斜杠时，输出会在该引号前留下两个反斜杠，前一个反斜杠抵消后一个反斜杠，引号仍可结束 JavaScript 字符串字面量，其后内容会在查看页面的用户会话中以应用源站脚本执行。应用按该方法的公开文档把返回值放入 JavaScript 字符串字面量，且传入值含攻击者可影响的数据时即会触发；AjaxEditableLabel 会把编辑失败的首条反馈消息写入单引号字面量，仅当该消息含此类数据时经该组件受影响，框架自带消息包并不插入输入值。\n修复版本中通过在 escapeQuotes 内先把反斜杠替换为两个反斜杠，再转义单引号和双引号，使引号前已有的反斜杠不能再抵消引号转义。9.25.0、10.12.0 与 11.0.0 同时把 escapeQuotesAndBackslash 改为直接委托给 escapeQuotes。", "effects": [{"comp_name": "org.apache.wicket:wicket-core", "ecosystem": "maven", "versions": [{"affected_version": "[8.0.0,8.20.0)", "min_fixed_version": "8.20.0", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[9.0.0,9.25.0)", "min_fixed_version": "9.25.0", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[10.0.0,10.12.0)", "min_fixed_version": "10.12.0", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "对输出编码和转义不恰当", "kind_en": "输出编码或转义不当", "last_modified_time": "2026-11-02", "level": "High", "mps_id": "MPS-xvc7-twum", "poc": false, "poc_url": [], "published_time": "2026-11-02", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-xvc7-twum", "name": "https://www.oscs1024.com/hd/MPS-xvc7-twum"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-83559", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-83559"}, {"url": "https://lists.apache.org/thread.html/77kc85ztkxdpp7wg7cv61c4539j9s1g3", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "Wicket脚本转义漏洞", "_translated": true, "_saved_at": "2026-11-02T00:08:39+00:00", "_first_saved_at": "2026-11-02T00:08:39+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-xvc7-twum"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-66570", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:L", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:L", "cwe": "CWE-79", "description": "WordPress File Upload（插件标识 wp-file-upload，现名 Iptanus File Upload）是 Nickboss（Iptanus）开发的开源 WordPress 文件上传插件，通过短代码在文章、页面或侧栏中提供可配置的上传表单，支持访客上传、分块传输与多种存储后端。\n受影响版本中，上传文件的内容检查 wfu_security_filecontent_checks() 依赖 wfu_content_scan_script_pattern() 的返回规则，仅当文件 MIME 类型以 text 开头时才扫描 \u003cscript\u003e 等脚本标记，默认参数 WFU_CHECKPHPTAGS_FILETYPES=commonimages 下扩展名不属于常见图片的非文本文件不进入任何内容扫描；默认配置允许访客上传（uploadrole 默认含 guests）且扩展名白名单默认为 *.*，未认证攻击者可上传以 \u003c!-- 等浏览器 HTML 嗅探特征字节开头、同时被 libmagic 识别为 video/3gpp 等非文本类型的复合文件，文件通过检查并存储到站点上传目录后，受害者直接访问该文件 URL 时浏览器按 HTML 渲染并执行内嵌脚本，窃取同源会话凭据，形成存储型 XSS。\n修复版本中通过在 wfu_security_filecontent_checks() 入口新增 wfu_file_leading_bytes_are_html() 前导字节检查，读取文件前 512 字节并模拟浏览器 HTML 嗅探签名，命中 \u003c!--、\u003c!doctype、\u003c?xml 或带终止字节校验的常见 HTML 标签特征时返回 WFU_ERROR_ADMIN_FILE_HASSCRIPTTAGS 拒绝上传，阻断以非文本类型伪装的 HTML 脚本文件进入站点存储，切断该存储型 XSS 利用链。", "effects": [{"comp_name": "wp-file-upload", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,5.2.2)", "min_fixed_version": "5.2.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-11-02", "level": "High", "mps_id": "MPS-4y3a-lx90", "poc": false, "poc_url": [], "published_time": "2026-11-02", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-4y3a-lx90", "name": "https://www.oscs1024.com/hd/MPS-4y3a-lx90"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-66570", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-66570"}, {"url": "https://patchstack.com/database/wordpress/plugin/wp-file-upload/vulnerability/wordpress-wordpress-file-upload-plugin-5-2-1-cross-site-scripting-xss-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "WordPress File Upload 存储型 XSS", "_translated": true, "_saved_at": "2026-11-01T20:03:49+00:00", "_first_saved_at": "2026-11-01T20:03:49+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-4y3a-lx90"}, {"analysis_status": 0, "articles": [], "attack_vector_type": "Local", "cnvd_id": "", "cve_id": "CVE-2026-74760", "cvss": {}, "cvss_score": 7.1, "cvss_vector": "", "cwe": "CWE-346", "description": "Google::Auth 是 Google 在 GitHub 开源的 Perl 语言云端认证库（google-auth-library-perl），实现应用默认凭证、用户 OAuth 授权与工作负载身份联邦等能力，随包发布的 gcloud-auth 命令行工具提供 login、application-default login 等登录命令。\n受影响版本中，gcloud-auth 的 login 与 application-default login 命令向授权请求附加随机 state 参数，回环回调处理函数 _wait_for_code 对监听器收到的首个请求只提取查询串中的 code，不读取也不比对 state；本机攻击进程抢在用户浏览器回调之前向 127.0.0.1 监听端口提交其自身 Google 账号的授权码后，命令行使用用户侧客户端凭证完成兑换，该流程未启用 PKCE，攻击者账号的 refresh_token 被写入令牌存储或 application_default_credentials.json，用户后续工具调用改以攻击者账号身份执行。\n修复版本中通过，可通过缓解措施阻断该利用链：仅在受信任的单用户环境中执行 gcloud-auth 登录命令并尽快完成浏览器授权，避免在存在不可信本地进程的主机上登录，登录完成后核对 application_default_credentials.json 与令牌存储中的账号归属，发现凭证被替换时立即执行 gcloud-auth revoke 并重新登录，官方发布包含 state 校验的版本后升级。", "effects": [{"comp_name": "google-auth", "ecosystem": "linux", "versions": [{"affected_version": "[0.11,0.12]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "源验证错误", "kind_en": "来源验证错误", "last_modified_time": "2026-11-02", "level": "High", "mps_id": "MPS-rgie-o5ny", "poc": false, "poc_url": [], "published_time": "2026-11-02", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-rgie-o5ny", "name": "https://www.oscs1024.com/hd/MPS-rgie-o5ny"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-74760", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-74760"}, {"url": "https://metacpan.org/release/CJCOLLIER/Google-Auth-0.12/source/bin/gcloud-auth.pl", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Google::Auth 授权码注入漏洞", "_translated": true, "_saved_at": "2026-11-01T20:03:48+00:00", "_first_saved_at": "2026-11-01T20:03:48+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-rgie-o5ny"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-107441", "cvss": {"cvssv31": [{"source": "security@zyxel.com.tw", "vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-787", "description": "Zyxel GS1900 系列是合勤科技的商用智能网管交换机，固件闭源，用于局域网接入、端口管理以及 Web 管理。\n受影响版本中，固件 CGI 程序存在越界写入。未经身份认证的相邻网络攻击者向 Web 管理接口发送构造的 HTTP 请求即可触发该缺陷，并可能在设备上执行操作系统命令。\n修复版本中通过发布各受影响型号的修复固件，消除 CGI 程序中的越界写入，使未认证相邻网络 HTTP 请求不能再导致操作系统命令执行。", "effects": [{"comp_name": "gs1900-10hp_firmware", "ecosystem": "linux", "versions": [{"affected_version": "[[, 2.90(AAZI.3)C0),+∞)", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "gs1900-16_firmware", "ecosystem": "linux", "versions": [{"affected_version": "[[, 2.90(AAHJ.3)C0),+∞)", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "gs1900-24_firmware", "ecosystem": "linux", "versions": [{"affected_ve s://www.oscs1024.com/hd/MPS-p8dz-otvw"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-107441", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-107441"}, {"url": "https://www.zyxel.com/global/en/support/security-advisories/zyxel-security-advisory-for-out-of-bounds-write-vulnerability-in-gs1900-series-switches-11-03-2026", "name": ""}], "scope_influence": "", "tags": ["poc", "应用软件"], "title": "GS1900越界写入漏洞", "_translated": true, "_saved_at": "2026-11-03T07:28:10+00:00", "_first_saved_at": "2026-11-03T07:28:10+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-p8dz-otvw"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过构造恶意的数据，将过多的数据输入到程序的缓冲区中，使得缓冲区的空间被填满，从而溢出到程序的栈 (stack) 或堆 (heap) 中，导致程序崩溃、拒绝服务、数据泄露等安全问题。\n", "title": "什么是经典缓冲区溢出"}, {"content": "| 类型        | 描述                                                         |\n| ----------- | ------------------------------------------------------------ |\n| 代码注入攻击      | 攻击者通过向程序的缓冲区输入恶意代码，从而控制程序执行流程，实现对程序操作的恶意操作。例如，攻击者可以通过向 Web 应用程序的输入框中输入恶意代码，从而执行任意的代码，破坏系统、窃取数据等。 |\n| 数据覆盖攻击      | 攻击者通过向程序的缓冲区输入过多的数据，从而覆盖程序中的重要数据或代码，实现对程序操作的恶意操作。例如，攻击者可以通过向聊天应用程序的输入框中输入过多的表情符号，从而覆盖程序中的重要数据，例如聊天消息、账号密码等。 |\n| 栈溢出攻击 | 攻击者通过向程序的栈中输入过多的数据，从而溢出到栈外部，实现对程序操作的恶意操作。例如，攻击者可以通过向游戏应用程序的输入框中输入过多的道具名称，从而覆盖程序中的重要数据，例如游戏数据、账号密码等。 |\n| 堆溢出攻击       | 攻击者通过向程序的堆中输入过多的数据，从而溢出到堆外部，实现对程序操作的恶意操作。例如，攻击者可以通过向操作系统工具的输入框中输入过多的命令，从而覆盖程序中的重要数据，例如系统文件、配置文件等。 |", "title": "经典缓冲区溢出常见的攻击方式"}, {"content": "- 输入验证：在程序输入处对输入数据进行严格的验证和过滤，确保输入数据符合预期的格式和类型，避免被攻击者注入恶意命令或数据。可以使用正则表达式、格式字符串等方式进行输入验证。\n- 输出过滤：在程序输出处对输出数据进行严格的过滤和检查，确保输出数据符合预期的格式和类型，避免被攻击者截获和篡改。可以使用安全的输出过滤库等方式进行输出过滤。\n- 使用安全的编程模型：使用安全的编程模型，例如避免使用原生的缓冲区管理函数，使用安全的框架和库来处理输入数据和执行命令，避免缓冲区溢出漏洞。\n- 数据库加密和访问控制：对于敏感数据和命令，使用加密和访问控制措施，确保只有授权用户可以访问和执行命令，避免被攻击者窃取和篡改。\n- 定期更新和升级：定期更新和升级应用程序和库的版本，确保应用程序和库的最新版本包含了最新的安全补丁和修复措施，避免安全漏洞的出现和利用。\n- 安全审计和监控：定期对系统和应用程序进行安全审计和监控，及时发现和阻止潜在的安全漏洞和攻击，确保系统和数据的安全和可靠性。", "title": "如何预防经典缓冲区溢出"}], "cnvd_id": "", "cve_id": "CVE-2026-76955", "cvss": {"cvssv31": [{"source": " scaled-workers 编入 Worker Service，由名为 k8s 的计算提供者管理 Kubernetes 中的 worker。1.30 发布线不包含该模块，不受影响。\n受影响版本中，k8sComputeProvider.buildRestConfig 把调用方请求中的 kubeconfig 交给 client-go 的 clientcmd.Load 与 NewDefaultClientConfig 构造 REST 客户端，ValidateConfig 在校验配置时调用该客户端读取 Deployment。厂商确认构造并使用该客户端可在 Worker Service 宿主机上、以服务进程账户执行调用方选择的命令。前端 frontend.WorkflowHandler 的 ValidateWorkerDeploymentVersionComputeConfig 注册为命名空间只读操作，持有单个命名空间读角色的已认证调用者即可进入，且不要求 worker deployment 已经存在；CreateWorkerDeploymentVersion 需要命名空间写角色。校验发生在配置提交阶段，不依赖扩缩容决策或任务到达。Worker Service 进程持有集群内每个命名空间的持久化凭据以及集群 TLS 材料，影响范围超出调用方命名空间。1.31.0 至 1.31.2 的 GetComputeProvider 在 workercontroller.compute_providers.enabled 为未设置的 nil 时跳过名单检查，默认放行已注册的 k8s 提供者；1.31.3 至 1.31.4 与 1.32.0 至 1.32.1 改为默认拒绝，仅当名单包含 k8s 时可达。workercontroller.enabled 不拦截该路径。\n修复版本中通过把 wci/workflow/compute_provider/k8s.go 的构建约束从 !release 改为 computeprovider_k8s \u0026\u0026 !release，使官方构建不再编译并经 init 注册 k8s 提供者，同时在 common/api/metadata.go 中把 ValidateWorkerDeploymentVersionComputeConfig 的 Access 从 AccessReadOnly 改为 AccessWrite，默认部署上的命令执行路径被切断。厂商说明该修复不改变客户端配置仍取自调用方请求；操作者若自行使用 computeprovider_k8s 标签编译并在名单中放行 k8s，请求中的 kubeconfig 仍会被接受。", "effects": [{"comp_name": "go.temporal.io/server", "ecosystem": "go", "versions": [{"affected_version": "[1.31.0,1.31.5)", "min_fixed_version": "1.31.5", "repository": "go", "solutions": [], "upstream": true}, {"affected_version": "[1.32.0,1.32.2)", "min_fixed_version": "1.32.2", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "资源默认不安全", "kind_en": "使用不安全默认值初始化资源", "last_modified_time": "2026-11-03", "level": "High", "mps_id": "MPS-yziu-4crs", "poc": false, "poc_url": [], "published_time": "2026-11-03", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-yziu-4crs", "name": "https://www.oscs1024.com/hd/MPS-yziu-4crs"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-120091" AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.5}]}, "cvss_score": 8.5, "cvss_vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-502", "description": "labbench 是 NIST 维护的开源 Python 实验室自动化库，通过 PyPI 分发，用于把实验流程写成可复用脚本，并对外提供 labbench.read 与 labbench.read_relational 读取表格数据和关系型实验数据。\n受影响版本中，src/labbench/_data.py 的 read() 在 reader_guess 中把扩展名 p 与 pickle 直接映射到 pandas.read_pickle。format 为 auto 时仅依据路径扩展名选择读取器，显式传入 p 或 pickle 时同样选择该读取器，并在后续分支调用 pandas.read_pickle。read_relational() 先调用 read() 加载根表，再由 MungeReader 按根表记录的成员路径再次调用 read()，关系型归档内扩展名为 p 或 pickle 的成员因此进入同一反序列化路径。用户加载攻击者提供的数据文件或关系型归档时，pickle 会在本地进程中执行任意代码。\n修复版本中通过新增 read_pickle()，在环境变量 LABBENCH_AUTOLOAD_PICKLE 未设置或取值为空、0、false、no、off 时抛出 RuntimeError 并拒绝调用 pandas.read_pickle，同时把 reader_guess 中 p 与 pickle 的目标改为 read_pickle，使 read() 与 read_relational() 在默认配置下不再自动反序列化不可信 pickle 数据。", "effects": [{"comp_name": "labbench", "ecosystem": "pip", "versions": [{"affected_version": "[0,0.46.1)", "min_fixed_version": "0.46.1", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "高", "fix_suggestion": "建议修复", "kind": "反序列化", "kind_en": "不可信数据的反序列化", "last_modified_time": "2026-11-03", "level": "High", "mps_id": "MPS-yg2s-7i8r", "poc": true, "poc_url": [], "published_time": "2026-11-03", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-yg2s-7i8r", "name": "https://www.oscs1024.com/hd/MPS-yg2s-7i8r"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-120833", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-120833"}, {"url": "https://github.com/usnistgov/labbench/pull/32", "name": "GitHub Pull Request #32"}, {"url": "https://github.com/usnistgov/labbench/commit/ac9b9b18cba67cb8e85eb563b6bb7dc1092b4c54", "name": "Patch Commit"}, {"url": "https://github.com/usnistgov/labbench/blob/0.46.0/src/labbench/_data.py#L1664-L1666", "name": ""}, {"url": "https://github.com/usnistgov/labbench/blob/0.46.1/ChangeLog.md", "name": "labbench ChangeLog"}, {"url": "https://pypi.org/project/labbench/0.46.1/", "name": ""}, {"url": "https://github.com/usnistgov/labbench", "name": ""}, {"url": "https://www.vulncheck.com/advisories/labbench-before-0.46.1-deserialization-of-untrusted-data-via-read-pickle-auto-dispatch", "name": "VulnCheck Advisory: labbench before 0.46.1 Deserialization of Untrusted Data via read() Pickle Auto-Dispatch"}], "scope_influence": "", "tags": ["poc", "python", "开源"], "title": "labbench反序列化漏洞", "_translated": true, "_saved_at": "2026-11-03T07:28:13+00:00", "_first_saved_at": "2026-11-03T07:28:13+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-yg2s-7i8r"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用了空指针，并在不进行有效检查的情况下对其进行取消引用操作。当程序试图取消引用空指针时，由于空指针不指向任何有效的内存地址，会导致程序崩溃或产生未定义的行为。这种错误通常发生在开发者未对指针进行正确的初始化或验证时。", "title": "什么是空指针取消引用"}, {"content": "- 拒绝服务：攻击者可以通过构造恶意输入或请求，触发程序中的空指针取消引用错误，导致程序崩溃或无法正常运行。这可能导致拒绝服务攻击，使系统无法提供正常的服务。\r\n- 内存信息泄露：攻击者可以通过利用空指针取消引用错误，访问程序中的敏感内存信息。这可能包括栈上的变量、函数指针或其他敏感数据，从而暴露系统的机密信息。\r\n- 代码执行：在某些情况下，空指针取消引用错误可能导致执行恶意代码或注入恶意代码的机会。攻击者可以通过精心构造的输入，利用空指针取消引用错误来执行任意的代码，进而获取系统控制权或执行未经授权的操作。", "title": "空指针取消引用常见的攻击方式"}, {"content": "- 指针初始化和验证：开发者应该正确地初始化指针，并在使用指针之前进行有效的验证，确保指针不为空。在取消引用指针之前，应始终检查其是否为空。\r\n- 异常处理和错误恢复：程序应该具备健壮的异常处理和错误恢复机制，以便在发生空指针取消引用错误时能够适当地处理异常，而不是导致程序崩溃或暴露敏感信息。\r\n- 防御性编程：采用防御性编程的原则，如避免在未经验证的指针上进行操作，避免使用未初始化的指针等，以防止空指针取消引用错误的发生。\r\n- 静态代码分析和测试：使用静态代码分析工具和测试技术来检测和识别潜在的空指针取消引用错误。这些工具可以帮助发现代码中可能存在的空指针问题，并及时修复。\r\n- 强制性编码标准和最佳实践：制定强制性的编码标准和最佳实践，包括良好的指针使用和管理规范，以帮助开发者编写更可靠、安全的代码。", "title": "如何预防空指针取消引用"}], "cnvd_id": "", "cve_id": "CVE-2026-115403", "cvss": {"cvssv4": [{"source": "emo@eclipse.org", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.2}]}, "cvss_score": 8.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-476", "description": "Eclipse ThreadX NetX Duo 是 Eclipse 基金会维护的开源嵌入式双栈 TCP/IP 协议栈，为实时操作系统设备提供 IPv4/IPv6 通信与 BSD 套接字接口。\n受影响版本中，在同时启用 NX_BSD_ENABLE、NX_BSD_RAW_SUPPORT 与 FEATURE_NX_IPV6 的构建里，应用对 AF_INET6 原始套接字设置 IP_RAW_IPV6_HDRINCL 后发送自带 IPv6 首部的报文时，_nxd_bsd_ipv6_packet_send 会为尚未进入目的地址表的链路外目的地调用 _nx_icmpv6_dest_table_add。当默认路由器的邻居缓存项未知时，该函数在检查返回状态之前读取 dest_entry_ptr 的 nx_ipv6_destination_entry_nd_entry。目的地址表已满或无法为下一跳建立邻居缓存时，添加操作返回 NX_NOT_SUCCESSFUL 且表项指针为空，发送线程因此发生空指针解引用并崩溃。远程发送方可借助 ICMPv6 Packet Too Big 报文填满目的地址表。\n修复版本中通过先判断 _nx_icmpv6_dest_table_add 返回 NX_SUCCESS，再读取目的表项中的邻居缓存指针，使添加失败时进入原有的报文释放路径，不再解引用空指针。", "effects": [{"comp_name": "netxduo", "ecosystem": "linux", "versions": [{"affected_version": "[6.0,6.5.2.202603b)", "min_fixed_version": "6.5.2.202603b", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "空指针取消引用", "kind_en": "空指针取消引用", "last_modified_time": "2026-11-03", "level": "High", "mps_id": "MPS-2yzv-95sb", "poc": false, "poc_url": [], "published_time": "2026-11-03", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-2yzv-95sb", "name": "https://www.oscs1024.com/hd/MPS-2yzv-95sb"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-115403", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-115403"}, {"url": "https://github.com/eclipse-threadx/netxduo/security/advisories/GHSA-9w9h-x3fh-m3fp", "name": ""}, {"url": "https://gitlab.eclipse.org/security/cve-assignment/-/work_items/500", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "NetX Duo空指针解引用", "_translated": true, "_saved_at": "2026-11-03T00:19:57+00:00", "_first_saved_at": "2026-11-03T00:19:57+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-2yzv-95sb"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "cnvd_id": "", "cve_id": "CVE-2026-99238", "cvss": {"cvssv31": [{"source": "416baaa9-dc9f-4396-8d5f-8c081fb06d67", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-416", "description": "Linux内核是开源的操作系统内核，其tracing子系统（ftrace）基于tracefs提供跟踪实例与持久化缓冲管理，persistent trace实例在内核模块加载或卸载时更新已记录的模块信息，用于维护跨启动的模块映射。\n受影响版本中，模块加载与卸载通知回调trace_module_notify()调用trace_module_record()遍历全局实例链表ftrace_trace_arrays，该遍历未持有trace_types_lock；并发的跟踪实例删除路径instance_rmdir()在持有该锁的情况下将实例移出链表并释放，模块加载或卸载与实例删除并发时可能访问已释放的trace_array，形成use-after-free。\n修复版本中通过在trace_module_record()入口处添加guard(mutex)(\u0026trace_types_lock)持锁遍历实例链表，使模块通知路径与实例删除操作互斥，消除对已释放trace_array的访问。", "effects": [{"comp_name": "linux_kernel", "ecosystem": "linux", "versions": [{"affected_version": "[6.15,7.4)", "min_fixed_version": "7.4", "repository": "unmanaged", "solutions": [], "upstream": tru }, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "cnvd_id": "", "cve_id": "CVE-2026-99231", "cvss": {"cvssv31": [{"source": "416baaa9-dc9f-4396-8d5f-8c081fb06d67", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-416", "description": "Linux 内核中的 io_uring 是随 5.1 版本引入的开源异步 I/O 框架，通过 io_uring_setup 与 io_uring_enter 系统调用向用户态提供提交队列和完成队列，其中 IORING_OP_WAITID 操作用于以异步方式等待本进程子进程的状态变化，对应实现位于内核文件 io_uring/waitid.c。\n受影响版本中，子进程退出唤醒时在等待队列锁保护下执行的回调 io_waitid_wait() 先通过 list_del_init 摘除等待项并以 smp_store_release 清空 iw-\u003ehead，随后才以 atomic_fetch_inc(\u0026iw-\u003erefs) 竞争请求所有权；而 io_waitid_remove_wq() 仅在 iw-\u003ehead 非空时才获取等待队列锁，因此另一 CPU 上持有引用的释放或取消路径（__do_wait() 找到其他子进程后的完成路径，或 __io_waitid_cancel() 取消路径）可在此窗口内完成请求并释放 io_kiocb，回调随后仍对已释放请求执行 atomic_fetch_inc(\u0026iw-\u003erefs)，递增的实为复用该请求内存的下一个操作的同名字段，计数恰为零时回调还会在其上调度 io_waitid_cb()，形成 slab-use-after-free，官方 KASAN 记录显示请求被 IORING_OP_RECV 复用后在 __wake_up_common() 触发释放后访问。\n修复版本中通过调整 io_waitid_wait() 的执行顺序消除竞争窗口：先以 atomic_fetch_inc(\u0026iw-\u003erefs) 竞争请求所有权，仅在实际取得所有权后才以 smp_store_release 清空 iw-\u003ehead；未取得所有权时保留 iw-\u003ehead，使请求拥有者必须先获取回调调用方持有的等待队列锁才能完成并释放请求，重复对已摘除节点执行 list_del_init 无副作用，该修复已回传至 6.12.115、6.18.60 与 7.2.14。", "effects": [{"comp_name": "linux_kernel", "ecosystem": "linux", "versions": [{"affected_version": "[6.12.113,6.12.115)", "min_fixed_ver 机制。\n- 定期进行代码审查和安全测试：定期审查应用程序的代码，并进行安全测试，以发现潜在的跨界内存读漏洞。使用静态代码分析工具和漏洞扫描工具来辅助检测和修复问题。\n- 实施防御性编程技术：应用程序应采用防御性编程技术，如使用随机化地址空间布局（ASLR）、堆栈保护机制（如堆栈溢出保护）和数据执行预防（DEP）等。\n- 及时更新和修补：及时应用程序和操作系统的安全更新和补丁，以确保已知的跨界内存读漏洞得到修复。及时更新相关软件和库，以避免使用已知存在漏洞的版本。", "title": "如何预防越界读取"}], "cnvd_id": "", "cve_id": "CVE-2026-99236", "cvss": {"cvssv31": [{"source": "416baaa9-dc9f-4396-8d5f-8c081fb06d67", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-125", "description": "Linux 内核是开源的操作系统内核，其 tracing 子系统通过 tracefs 与 perf 接口提供事件过滤能力，用于按表达式匹配并筛选跟踪事件。\n受影响版本中，predicate_parse() 的外层解析循环在输入以 \u0026\u0026、|| 或一元 ! 结尾时会带着未消解的运算符状态直接进入收尾阶段，prog[0].target 保持为 -1，第二轮优化遍历以该值作为下标访问 prog 数组并读取 prog[-1]，构成数组起始位置之前的越界读，相邻 slab 内存中的数据还可能被复制进通过前向跳转检查的分支目标；本地攻击者可通过 PERF_EVENT_IOC_SET_FILTER 或写入 tracefs 事件 filter 文件触达该解析路径。\n修复版本中通过在外层循环结束后增加已解析谓词计数 N 的非零检查，直接返回 -EINVAL 并记录 FILT_ERR_INVALID_FILTER 错误，使非空表达式只有在内部循环消解完全部运算符后才允许进入收尾阶段，从而阻断越界下标访问。", "effects": [{"comp_name": "linux_kernel", "ecosystem": "linux", "versions": [{"affected_version": "[4.17,7.4)", "min_fixed_version": "7.4", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.12,6.12.115)", "min_fixed_version": "6.12.115", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.18,6.18.60)", "min_fixed_version": "6.18.60", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[5.10,5.10.273)", "min_fixed_version": "5.10.273", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.1,6.1.191)", "min_fixed_version": "6.1.191", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[5.15,5.15.224)", "min_fixed_version": "5.15.224", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.6,6.6.161)", "min_fixed_version": "6.6.16 parse_administrative_record 内由 record_parser_read_byte 逐字节解析源端点标识。长度字段读完后按 record_bundle_source_str_length 加 1 分配缓冲区，并把 uint16_t 计数器 bytes_remaining 设为该长度；拷贝阶段先执行 bytes_remaining-- 再与 0 比较。声明长度为 0 时只分配 1 字节，计数器从 0 下溢为 65535，随后的输入写出分配区，远程未认证攻击者可造成堆内存破坏并使节点不可用。\n修复版本中通过在长度阶段把 bytes_remaining 为 0 判定为非法并设置 PARSER_STATUS_ERROR，使零长度源端点标识不再进入拷贝阶段，避免计数器下溢后的堆越界写。", "effects": [{"comp_name": "µD3TN", "ecosystem": "linux", "versions": [{"affected_version": "[0,0.15.2)", "min_fixed_version": "0.15.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-11-03", "level": "High", "mps_id": "MPS-mojb-aldg", "poc": false, "poc_url": [], "published_time": "2026-11-03", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-mojb-aldg", "name": "https://www.oscs1024.com/hd/MPS-mojb-aldg"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-121510", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-121510"}, {"url": "https://gitlab.com/d3tn/ud3tn/-/work_items/289", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "µD3TN管理记录越界写", "_translated": true, "_saved_at": "2026-11-03T15:42:57+00:00", "_first_saved_at": "2026-11-03T15:42:57+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-mojb-aldg"}, {"analysis_status": 0, "articles": [{"content": "跨界内存读是指应用程序在读取内存时，未正确验证或限制读取的内存范围。攻击者利用这种漏洞可以读取应用程序内存中的敏感数据，如密码、加密密钥、会话令牌等。常见的原因是由于缓冲区溢出、格式化字符串漏洞或其他内存错误导致的。", "title": "什么是越界读取"}, {"content": "攻击者可以通过不当构造的输入来触发跨界内存读漏洞。攻击者可能会通过向应用程序发送特定的输入，使其读取超过预期的内存区域。攻击者可以利用这个漏洞来获取敏感信息，如其他用户的数据、操作系统的敏感数据或应用程序的内部状态。", "title": "越界读取常见的攻击方式"}, {"content": "- 输入验证和限制：应用程序应对所有输入数据进行严格的验证和限制。确保输入数据的长度、格式和内容符合预期，避免超出缓冲区或访问非预期的内存区域。\n- 内存安全编程实践：开发人员应使用安全的编程实践，如避免使用不安全的函数、正确处理内存分配和释放操作，以及遵循最小特权原则。\n- 使用安全的编程语言和库：选择使用安全性较高的编程语言和库，这些语言和库在内存管理和安全性方面提供了更多的保护机制。\n- 定期进行代码审查和安全测试：定期审查应用程序的代码，并进行安全测试，以发现潜在的跨界内存读漏洞。使用静态代码分析工具和漏洞扫描工具来辅助检测和修复问题。\n- 实施防御性编程技术：应用程序应采用防御性编程技术，如使用随机化地址空间布局（ASLR）、堆栈保护机制（如堆栈溢出保护）和数据执行预防（DEP）等。\n- 及时更新和修补：及时应用程序和操作系统的安全更新和补丁，以确保已知的跨界内存读漏洞得到修复。及时更新相关软件和库，以避免使用已知存在漏洞的版本。", "title": "如何预防越界读取"}], "attack_vector_type": "Adjacent", "cnvd_id": "", "cve_id": "CVE-2026-120830", "cvss": {"cvssv31": [{"source": "secalert@redhat.com", "vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:C/C:H/I:N/A:N", "severity": "high", "base_score": 7.4}]}, "cvss_score": 7.4, "cvss_vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:C/C:H/I:N/A:N", "cwe": "CWE-125", "description": "libslirp 是 freedesktop.org 维护的开源用户态 TCP/IP 库，供 QEMU 和容器运行时为客户机或容器提供用户态网络。\n受影响版本中，icmp_forward_error() 组装 ICMP 差错响应时，引用原始 IPv4 报文的长度 s_ip_len 取自 IP 首部字段 ip_len，只在超过 ICMP_MAXDATALEN 时被截断，未与源 mbuf 的实际长度 msrc-\u003em_len 比较。截断或畸形报文可使随后的 memcpy 按该长度越过 msrc-\u003em_data 末尾读取宿主堆，并把读到的内容写入返回给客户机或容器的 ICMP 差错报文。\n修复版本中通过在拷贝前将 s_ip_len 限制为不超过 msrc-\u003em_len，使引用长度不再超出源缓冲区，从而阻止宿主堆数据进入 ICMP 差错响应。", "effects": [{"comp_name": "libslirp", "ecosystem": "linux", "versions": [{"affected_version": "[4.4.0,4.9.7)", "min_fixed_version": "4.9.7", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "极高", "fix_suggestion": "建议修复", "kind": "越界读取", "kind_en": "越界读取", "last_modified_time": "2026-11-03", "level": "High", "mps_id": "MPS-d7cn-6pqu", "poc": true, "poc_url": [], "published_time": "2026-11-03", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-d7cn-6pqu", "name": "https://www.oscs1024.com/hd/MPS-d7cn-6pqu"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-120830", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-120830"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-120830", "name": ""}, {"url": "https://bugzilla.redhat.com/show_bug.cgi?id=2565424", "name": "RHBZ#2565424"}, {"url": "https://gitlab.freedesktop.org/slirp/libslirp/-/commit/21b33a6c5588af9f58d15e528f f - len 计算首个报文段中紧随头部的 body 字节数并交给 http_body_update 执行 req-\u003econtent_length -= len 扣减；未认证攻击者声明较小的 Content-Length 并在同一报文段中发送超过声明值的字节数，该无符号扣减发生整数下溢回绕为极大值，绕过 http_body_max 限制，worker 反复重置接收缓冲并持续调用 kore_buf_append 将网络数据追加进内存缓冲 req-\u003ehttp_body，直至默认 60 秒 http_body_timeout 触发，造成 worker 内存耗尽与服务不可用。\n修复版本中通过在 http_header_recv 的超限校验中新增 (nb-\u003es_off - len) \u003e req-\u003econtent_length 判定条件，首个报文段实际携带的字节数超过声明值时置 HTTP_REQUEST_DELETE 并返回 HTTP_STATUS_REQUEST_ENTITY_TOO_LARGE，请求在进入 body 扣减逻辑前被拒绝，消除整数下溢并恢复 http_body_max 对内存缓冲增长的上限约束。", "effects": [{"comp_name": "kore", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,4.3.0)", "min_fixed_version": "4.3.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "超界折返", "kind_en": "整数下溢（环绕或环绕）", "last_modified_time": "2026-11-04", "level": "High", "mps_id": "MPS-fdx5-iklq", "poc": false, "poc_url": [], "published_time": "2026-11-04", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-fdx5-iklq", "name": "https://www.oscs1024.com/hd/MPS-fdx5-iklq"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-121727", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-121727"}, {"url": "https://github.com/jorisvink/kore/commit/1ff3c0f6f7973dc7fc8bf38369790ef2d8079b3b", "name": "Patch Commit"}, {"url": "https://github.com/jorisvink/kore", "name": ""}, {"url": "https://kore.io/releases/4.3.0", "name": "Kore 4.3.0 Release Notes"}, {"url": "https://github.com/jorisvink/kore/blob/4.3.0-rc5/src/http.c#L934", "name": ""}, {"url": "https://www.vulncheck.com/advisories/kore-before-4.3.0-integer-underflow-memory-exhaustion-via-http-header-recv", "name": "VulnCheck Advisory: Kore before 4.3.0 Integer Underflow Memory Exhaustion via http_header_recv()"}], "scope_influence": "", "tags": ["应用软件"], "title": "kore整数下溢内存耗尽漏洞", "_translated": true, "_saved_at": "2026-11-04T01:49:02+00:00", "_first_saved_at": "2026-11-04T01:49:02+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-fdx5-iklq"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-121731", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-89", "description": "RosarioSIS 是一款基于 PHP 与 PostgreSQL 的开源学校管理系统（Student Information System），以 composer 包 francoisjacquet/rosariosis 及源码归档方式分发，用于学校的考勤、成绩与课程管理。\n受影响版本中，考勤模块缺勤汇总报表的处理文件 modules/Attendance/includes/StudentSummary.php 将 GET 参数 period_id 未做整数转换直接赋值给 $period_ids_list，并拼接到出勤缺勤统计 SQL 的 PERIOD_ID IN(...) 子句中；请求数据在全局入口 Warehouse.php 仅经过单引号转义处理，使用不含单引号的数字与括号组合（如 0,(SELECT pg_sleep(3))）可绕过该转义，非学生角色的已登录用户（含家长）经 Modules.php?modname=Attendance/DailySummary.php\u0026report=absence 请求触发时间盲注，可提取管理员密码哈希与学生记录。\n修复版本中通过在赋值处增加整数强制转换（$period_ids_list = (int) $_REQUEST['period_id'];）消除注入路径，非数字输入被截断为整数，IN(...) 子句不再受请求数据控制。", "effects": [{"comp_name": "francoisjacquet/rosariosis", "ecosystem": "composer", "versions": [{"affected_version": "[0,12.9)", "min_fixed_version": "12.9", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-11-04", "level": "High", "mps_id": "MPS-fh0t-oxr2", "poc": false, "poc_url": [], "published_time": "2026-11-04", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-fh0t-oxr2", "name": "https://www.oscs1024.com/hd/MPS-fh0t-oxr2"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-121731", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-121731"}, {"url": "https://github.com/francoisjacquet/rosariosis/commit/1b809f9761b50c3f6faf9e1b2b5f5e74d63509c1", "name": "Patch Commit"}, {"url": "https://github.com/francoisjacquet/rosariosis", "name": ""}, {"url": "https://gitlab.com/francoisjacquet/rosariosis/-/issues/375", "name": ""}, {"url": "https://github.com/francoisjacquet/rosariosis/blob/v12.8.1/modules/Attendance/includes/StudentSummary.php#L119", "name": ""}, {"url": "https://github.com/francoisjacquet/rosariosis/releases/tag/v12.9", "name": "RosarioSIS v12.9 Release Notes"}, {"url": "https://www.vulncheck.com/advisories/rosariosis-before-12.9-sql-injection-via-period-id-in-attendance-absence-report", "name": "VulnCheck Advisory: RosarioSIS before 12.9 SQL Injection via period_id in Attendance Absence Report"}], "scope_influence": "", "tags": ["php", "开源"], "title": "RosarioSIS SQL注入漏洞", "_translated": true, "_saved_at": "2026-11-04T01:49:01+00:00", "_first_saved_a list": [{"url": "https://www.openwall.com/lists/oss-security/2026/11/03/17", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-108946", "name": ""}, {"url": "https://activemq.apache.org/", "name": ""}, {"url": "https://github.com/apache/activemq/pull/2682", "name": ""}, {"url": "https://github.com/apache/activemq/commit/afdbf624c92d60a5adef62d7fc584bb5d09fb33b", "name": ""}, {"url": "https://github.com/apache/activemq/commit/d7665d7497f7e48b676a62a0e294b512fa2dc9d3", "name": ""}, {"url": "https://github.com/apache/activemq/commit/ce5794bd44b7636b63ea4736eb5419472d3cb4c0", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "ActiveMQ连接标识校验缺失漏洞", "_translated": true, "_saved_at": "2026-11-03T21:25:34+00:00", "_first_saved_at": "2026-11-03T21:25:34+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-18ca-568c"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-87040", "cvss": {"cvssv31": [{"source": "vulnerabilities@zephyrproject.org", "vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:U/C:L/I:H/A:H", "severity": "high", "base_score": 8.3}]}, "cvss_score": 8.3, "cvss_vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:U/C:L/I:H/A:H", "cwe": "CWE-787", "description": "Zephyr 是 Linux 基金会旗下 Zephyr 项目开源维护的嵌入式实时操作系统，其蓝牙 LE 控制器为 Nordic nRF 系列射频提供链路层实现，广泛用于物联网、医疗与工业嵌入式设备的低功耗蓝牙通信。\n受影响版本中，nRF 链路层接收路径未校验空口 PDU 头部 LENGTH 字段是否超过无线收发器配置的最大接收长度。lll_conn.c 中 isr_rx_pdu() 在序列号与 MIC 校验通过后直接入队任意非空数据 PDU，而 nRF radio 硬件仅按 PCNF1.MAXLEN 截断 payload 并原样保存头部长度字节，攻击者在无线信号范围内发送长度字节最大为 255 的伪造 PDU（控制器默认编程的 lll-\u003edle.eff.max_rx_octets 为 27），形成 len 字段大于缓冲区实际容量的 node_rx；该缓冲区随后进入 hci.c 的 hci_acl_encode()，其 net_buf_add(buf, pdu_data-\u003elen) 与 memcpy 按未校验长度越界读取约 228 字节并越界写入 HCI ACL 缓冲池相邻内存，ISO 接收路径经 isoal_rx_append_to_sdu() 同样越界读取并把控制器内存作为 ISO 数据上送主机，导致远程内存破坏、控制器崩溃与内存信息泄露。\n修复版本中通过在接收路径统一增加长度边界校验解决该问题：isr_rx_pdu() 在解密后调用新增的 max_rx_octets_get() 比对 pdu_data_rx-\u003elen，超长 PDU 返回 -EINVAL 丢弃，lll_central_iso.c 与 lll_peripheral_iso.c 按 cis_lll-\u003erx.max_pdu、lll_sync_iso.c 按 lll-\u003emax_pdu、lll_scan_aux.c 按 LL_EXT_OCTETS_RX_MAX 同样丢弃超长 PDU，超长帧不再进入入队与 HCI 编码流程，越界读写与内存泄露链路被切断。", "effects": [{"comp_name": "zephyr", "ecosystem": "linux", "versions": [{"affected_version": "[4.4.0,4.5.0)", "min_fixed_version": "4.5.0", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[1.6.0,4.3.2)", "min_fixed_version": "4.3.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-11-04", "level": "High", "mps_id": "MPS-6faj-4ic7", "poc": false, "poc_url": [], "published_time": "2026-11-04", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-6faj-4ic7", "name": "https://www.oscs1024.com/hd/MPS-6faj-4ic7"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-87040", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-87040"}, {"url": "https://github.com/zephyrproject-rtos/zephyr/commit/8ca41216e8e47a018e52044992789b5011ac99aa", "name": "Fix commit"}, {"url": "https://github.com/zephyrproject-rtos/zephyr/security/advisories/GHSA-grqr-q9fh-8ff2", "name": "GHSA-grqr-q9fh-8ff2"}], "scope_influence": "", "tags": ["应用软件"], "title": "Zephyr蓝牙控制器越界读写漏洞", "_translated": true, "_saved_at": "2026-11-04T08:27:16+00:00", "_first_saved_at": "2026-11-04T08:27:16+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-6faj-4ic7"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "", "cvss": {}, "cvss_score": 8.1, "cvss_vector": "", "cwe": "CWE-917", "description": "Apache Struts2 Core（Maven 坐标 org.apache.struts:struts2-core）是开源 Java Web MVC 框架，使用 OGNL 对值栈表达式和部分文本求值，并由 SecurityMemberAccess 限制可访问的类与成员。\n受影响版本中，SecurityMemberAccess.isAccessible 以及 checkExclusionList、checkAllowlist 只检查 OGNL 引擎当场发起的成员访问，不跟踪被调用方法在 JDK 内部继续执行的反射。java.beans.Expression 与 java.beans.Statement 不在 7.4.0 的 struts.excludedClasses 和 struts.excludedPackageNames 中，也不属于默认必选允许类。这类调用一旦被策略放行，其内部反射可以构造或调用已被排除的类型，例如 java.lang.ProcessBuilder，并执行任意代码。公开说明指出，该路径仅在应用把不可信输入交给 OGNL 解析执行时成立；7.x 默认开启 struts.allowlist.enable，样例还要求上述包装类型已进入允许列表，6.x 默认不强制允许列表。\n在官方修复发布前，可通过停止把不可信输入送入 OGNL 求值，并避免将 java.beans.Expression、java.beans.Statement 以及其他会在方法内部发起反射的类型加入允许列表，缩小可被绕过的调用面。", "effects": [{"comp_name": "org.apache.struts:struts2-core", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,7.4.0]", "min_fixed_version": "", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "表达式语言注入", "kind_en": "表达式语言语句中使用的特殊元素的不正确中和（“表达式语言注入”）", "last_modified_time": "2026-11-04", "level": "High", "mps_id": "MPS-00a1-18e7", "poc": false, "poc_url": [], "published_time": "2026-11-04", "reference_url_list": [{"url": "https://seclists.org/fulldisclosure/2026/Nov/7", "name": ""}, {"url": "https://github.com/apache/struts", "name": ""}, {"url": "https://github.com/apache/struts/blob/STRUTS_7_4_0/core/src/main/java/org/apache/struts2/ognl/SecurityMemberAccess.java", "name": ""}, {"url": "https://github.com/apache/struts/blob/STRUTS_7_4_0/core/src/main/resources/struts-excluded-classes.xml", "name": ""}, {"url": "https://github.com/apache/struts/blob/STRUTS_7_4_0/core/src/main/resources/org/apache/struts2/default.properties", "name": ""}, {"url": "https://struts.apache.org/security/", "name": ""}, {"url": "https://central.sonatype.com/artifact/org.apache.struts/struts2-core/7.4.0", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "Struts2 OGNL沙箱绕过", "_translated": true, "_saved_at": "2026-11-04T08:27:12+00:00", "_first_saved_at": "2026-11-04T08:27:12+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-00a1-18e7"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-87041", "cvss": {"cvssv31": [{"source": "vulnerabilities@zephyrproject.org", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-822", "description": "Zephyr 是 Linux 基金会托管的开源嵌入式实时操作系统，面向资源受限的物联网与嵌入式设备，RTIO 子系统为其提供异步 I/O 提交队列机制，并支持在 CONFIG_USERSPACE 下由用户态线程提交 I/O 请求。\n受影响版本中，RTIO 用户态提交队列校验函数 rtio_vrfy_sqe()（v4.3.0 前位于 subsys/rtio/rtio_handlers.c，其后位于 subsys/rtio/rtio_syscalls.c）使用 \u0026= 将 K_SYSCALL_MEMORY() 的返回值累加进 valid_sqe 标志，而该宏基于 K_SYSCALL_VERIFY_MSG() 实现、校验失败时返回非零值，导致缓冲区权限检查结果被反向采用。用户态线程经 rtio_sqe_copy_in_get_handles() 系统调用提交 SQE 时，指向内核内存的 tx.buf、rx.buf 或 txrx.tx_buf/txrx.rx_buf 指针被判定为合法并原样转发给 I2C、I3C、SPI 等 RTIO 总线驱动以内核特权解引用：RTIO_OP_RX 提交使外设数据写入攻击者指定的内核地址，RTIO_OP_TX 提交使内核内存经总线外泄，指向未映射地址的提交触发内核崩溃，攻击者由此突破 CONFIG_USERSPACE 用户态隔离边界。\n修复版本中通过为 RTIO_OP_TX、RTIO_OP_RX 与 RTIO_OP_TXRX 分支中的每处 K_SYSCALL_MEMORY() 检查结果取反后再累加进 valid_sqe，恢复权限判定的正确极性，使调用线程不可访问的缓冲区提交被拒绝，同时将 TXRX 发送缓冲区改为只读校验以对齐 SPI、I2C 与 I3C 处理器的既有行为，阻断内核内存经发送通道外泄。", "effects": [{"comp_name": "zephyr", "ecosystem": "linux", "versions": [{"affected_version": "[3.3.0,4.3.2)", "min_fixed_version": "4.3.2", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[4.4.0,4.5.0)", "min_fixed_version": "4.5.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "非可信指针解引用", "kind_en": "Untrusted Pointer Dereference", "last_modified_time": "2026-11-04", "level": "High", "mps_id": "MPS-8kvr-5yqf", "poc": false, "poc_url": [], "published_time": "2026-11-04", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-8kvr-5yqf", "name": "https://www.oscs1024.com/hd/MPS-8kvr-5yqf"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-87041", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-87041"}, {"url": "https://github.com/zephyrproject-rtos/zephyr/commit/454a848006595ce2d77fc2c9e458b0c557f5e4af", "name": "Fix commit"}, {"url": "https://github.com/zephyrproject-rtos/zephyr/security/advisories/GHSA-mvxr-jx9h-jxh4", "name": "GHSA-mvxr-jx9h-jxh4"}], "scope_influence": "", "tags": ["应用软件"], "title": "Zephyr RTIO 内核内存越权读写漏洞", "_translated": true, "_saved_at": "2026-11-04T08:27:15+00:00", "_first_saved_at": "2026-11-04T08:27:15+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-8kvr-5yqf"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-112445", "cvss": {}, "cvss_score": 7.8, "cvss_vector": "", "cwe": "CWE-250", "description": "macOS 是 Apple 开发的闭源桌面操作系统，launchd 作为系统首进程负责系统域后台作业的调度，/System/Library/LaunchDaemons 目录中的作业配置默认以 root 权限运行。\n受影响版本中，系统自带作业 com.apple.xpc.uscwoap 以 BootShell 配置启动 /bin/bash（参数 bash -sh），并将标准输入、输出与错误全部连接到 /dev/console，该作业位于 launchd 系统域且未指定降权账户，bash 进程以 UID 0 运行并从 /dev/console 读取命令；登录活动图形控制台的非管理员账号可以通过 launchctl 作业控制接口 kickstart 该作业，此时 /dev/console 设备由当前控制台用户持有，攻击者通过 TIOCSTI 终端控制接口向其输入队列注入字符，root 权限的 bash 将注入字符当作命令解释并执行，攻击者借此让 root bash 对自身副本执行 chown 0:0 与 chmod 4755，再运行该 setuid 副本获得 root shell，完成本地权限提升。\n修复版本中通过移除 com.apple.xpc.uscwoap 的 LaunchDaemon 配置切断上述利用链，macOS 27.2 删除该作业配置后，系统中不再存在以 root 身份从 /dev/console 读取命令的 bash 作业，TIOCSTI 注入路径随之失效，普通用户无法继续借道该作业获得 root 权限。", "effects": [{"comp_name": "macos", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,27.2)", "min_fixed_version": "27.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "高", "fix_suggestion": "建议修复", "kind": "带着不必要的权限执行", "kind_en": "使用不必要的权限执行", "last_modified_time": "2026-11-04", "level": "High", "mps_id": "MPS-9174-0892", "poc": true, "poc_url": [], "published_time": "2026-11-04", "reference_url_list": [{"url": "https://securityonline.info/macos-privilege-escalation-poc-cve-2026-112445/", "name": ""}, {"url": "https://github.com/Mas0nShi/CVE-2026-112445", "name": ""}, {"url": "https://support.apple.com/en-us/149521", "name": ""}], "scope_influence": "", "tags": ["poc", "操作系统"], "title": "macOS 本地权限提升漏洞", "_translated": true, "_saved_at": "2026-11-04T08:27:10+00:00", "_first_saved_at": "2026-11-04T08:27:10+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-9174-0892"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-87039", "cvss": {"cvssv31": [{"source": "vulnerabilities@zephyrproject.org", "vector": "CVSS:3.1/AV:L/AC:H/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:H/PR:L/UI:N/S:C/C:H/I:H/A:H", "cwe": "CWE-787", "description": "Zephyr 是 Zephyr Project 开源的嵌入式实时操作系统，广泛用于物联网与资源受限设备，其 CONFIG_USERSPACE 机制为用户态线程提供内核隔离，I2S 音频驱动位于内核 drivers/i2s 目录并由系统调用校验层保护。\n受影响版本中，drivers/i2s/i2s_handlers.c 的系统调用校验函数 z_vrfy_i2s_configure() 从用户内存拷贝 struct i2s_config 后，当 cfg-\u003eframe_clk_freq 为 0（取消流配置请求）时跳过 K_SYSCALL_OBJ(config.mem_slab, K_OBJ_MEM_SLAB) 对象归属校验与 block_size 合法性检查，未经校验的用户可控 mem_slab 指针直接传入驱动；drivers/i2s/i2s_litex.c 的 i2s_litex_configure() 对该场景仅记录告警，随后 memcpy() 保存完整配置并将流状态置为 I2S_STATE_READY，之后的 i2s_trigger(I2S_TRIGGER_START) 使能 FIFO 中断，中断处理函数 i2s_litex_isr_rx() 与 i2s_litex_isr_tx() 在内核态对攻击者提供的指针执行 k_mem_slab_alloc() 与 k_mem_slab_free()，构成内核态任意指针读写原语，绕过 CONFIG_USERSPACE 隔离边界；持有 I2S 设备对象访问权限的用户态线程单次 i2s_configure() 调用可触发，未启用 CONFIG_USERSPACE 的构建不受影响。\n修复版本中通过在 frame_clk_freq 为 0 的取消配置分支内清零 config.mem_slab 与 config.block_size 后再调用实现函数，驱动在该路径不再收到未校验指针，切断未校验指针进入驱动的传递链，同时保留调用方不持有内存 slab 时的取消流配置能力。", "effects": [{"comp_name": "zephyr", "ecosystem": "linux", "versions": [{"affected_version": "[4.4.0,4.5.0)", "min_fixed_version": "4.5.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-11-04", "level": "High", "mps_id": "MPS-tg25-6r8j", "poc": false, "poc_url": [], "published_time": "2026-11-04", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-tg25-6r8j", "name": "https://www.oscs1024.com/hd/MPS-tg25-6r8j"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-87039", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-87039"}, {"url": "https://github.com/zephyrproject-rtos/zephyr/commit/e9898c4d22f69575d9b5f297b3df130ceaff1b8f", "name": "Fix commit"}, {"url": "https://github.com/zephyrproject-rtos/zephyr/security/advisories/GHSA-g43m-x6vj-5cg2", "name": "GHSA-g43m-x6vj-5c
