": "2026-11-14T15:27:40+00:00", "_first_saved_at": "2026-11-14T15:27:40+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-9hn2-guj7"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-129351", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:N/AC:L/Au:N/C:C/I:C/A:C", "severity": "high", "base_score": 10}], "cvssv3": [{"source": "VulDB", "vector": "CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H/E:P/RL:X/RC:R", "severity": "critical", "base_score": 10}], "cvssv31": [{"source": "cna@vuldb.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 10}], "cvssv4": [{"source": "cna@vuldb.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-787", "description": "TRENDnet TEW-657BRM 是 TRENDnet 推出的 150Mbps Wireless N ADSL2+ 调制解调路由器，属于闭源嵌入式固件产品，固件内嵌 mini_httpd 作为 Web 管理服务组件，产品已达到生命周期终点（EOL），官方仅发布过固件版本 1.00.1。\n受影响版本中，mini_httpd 在 HTTP Basic 认证校验之前处理请求目标，当请求路径包含 .htm 时会构造 /setup.cgi?next_file=\u003c请求路径\u003e 形式的重定向，该重定向通过无边界检查的 sprintf 拼接写入固定大小的全局缓冲区，目标缓冲区无法容纳固定前缀加上超长的攻击者可控路径，越界写入覆盖相邻全局数据及后续使用的全局指针；未认证攻击者向 Web 管理端口发送超长的 .htm 请求路径可触发该内存破坏，公开研究在 MIPS 模拟环境中观察到认证前子进程崩溃与程序计数器被控制（pc 与 t9 均为 0x23232323），受影响服务以 root 权限运行，远程攻击者可能进一步获得任意代码执行能力。\n修复版本中通过，可通过缓解措施降低风险，厂商说明该产品已停止维护超过 15 年、无法确认该漏洞是否存在且不会再提供固件更新，建议退役设备并更换为受支持的型号，在更换前禁用远程管理并将 Web 管理接口限制在可信网络内，避免管理端口暴露给不可信主机。", "effects": [{"comp_name": "TEW-657BRM", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.00.1]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-11-15", "level": "Critical", "mps_id": "MPS-0qld-m721", "poc": false, "poc_url": [], "published_time": "2026-11-15", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-0qld-m721", "name": "https://www.oscs1024.com/hd/MPS-0qld-m721"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-129351", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-129351"}, {"url": "https://vuldb.com/vuln/437397", "name": "VDB-437397 | TRENDnet TEW-657BRM mini_httpd setup.cgi sprintf out-of-bounds write"}, {"url": "https://vuldb.com/vuln/437397/cti", "name": "VDB-437397 | CTI Indicators (IOB, IOC, IOA)"}, {"url": "https://vuldb.com/cve/CVE-2026-129351", "name": "CVE-2026-129351 | CVE Analysis and Report"}, {"url": "https://vuldb.com/submit/1043518", "name": "Submit #1043518 | TRENDnet TEW-657BRM 1.00.1 Buffer Overflow"}, {"url": "https://github.com/ruanyi101/router-firmware-security-advisories/blob/main/router-firmware-GitHub-advisories/advisories/TRENDnet-TEW-657BRM-mini_httpd.md", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "TRENDnet TEW-657BRM mini_httpd 越界写入漏洞", "_translated": true, "_sav  "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "栈缓冲区溢出", "kind_en": "基于堆栈的缓冲区溢出", "last_modified_time": "2026-11-15", "level": "Critical", "mps_id": "MPS-cguy-n9v0", "poc": false, "poc_url": [], "published_time": "2026-11-15", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-cguy-n9v0", "name": "https://www.oscs1024.com/hd/MPS-cguy-n9v0"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-129353", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-129353"}, {"url": "https://vuldb.com/vuln/437416", "name": "VDB-437416 | D-Link DIR-600L authentication.cgi authenticationcgi_main stack-based overflow"}, {"url": "https://vuldb.com/vuln/437416/cti", "name": "VDB-437416 | CTI Indicators (IOB, IOC, IOA)"}, {"url": "https://vuldb.com/cve/CVE-2026-129353", "name": "CVE-2026-129353 | CVE Analysis and Report"}, {"url": "https://vuldb.com/submit/1043523", "name": "Submit #1043523 | D-Link DIR-600L 2.17b02 Stack-based Buffer Overflow"}, {"url": "https://github.com/ruanyi101/router-firmware-security-advisories/blob/main/router-firmware-GitHub-advisories/advisories/D-Link-DIR-600L-authentication-cgi.md", "name": ""}, {"url": "https://www.dlink.com/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "D-Link DIR-600L认证CGI栈溢出漏洞", "_translated": true, "_saved_at": "2026-11-15T00:37:21+00:00", "_first_saved_at": "2026-11-15T00:37:21+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-cguy-n9v0"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2026-129483", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N", "severity": "critical", "base_score": 9.1}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-287", "description": "Cyrus SASL（libsasl2）是 Cyrus IMAP 项目维护的开源 SASL 认证库，为 SMTP、IMAP、XMPP 等服务提供可插拔的认证机制，SRP 是其中一个默认不编译、仅在显式启用构建选项后才会生成的可选认证插件。\n受影响版本中，SRP 服务端第二步处理函数 srp_server_mech_step2 从客户端报文解析公钥 A 后，仅校验 A \u003c= 0（plugins/srp.c:2046-2050），未按 RFC 5054 第 2.5.3 节与 RFC 2945 要求拒绝 A % N == 0 或 A \u003e= N 的取值。未认证的网络客户端发送 A = N 时，ServerCalculateK 按 S = (A * v^u)^b mod N 推导共享密钥，结果恒为 0，会话密钥 K = H(S) 退化为攻击者可自行计算的常量 SHA1(\"\")；客户端证据 M1 仅由公开参数（H(N) xor H(g)、用户名哈希、salt、A、B、K 等）派生，攻击者无需密码即可伪造有效 M1，以任意已存在用户身份通过 SRP 认证并取得会话密钥。\n修复版本中通过移除整个 SRP 插件切断该攻击链：上游 commit fb3724f43dc50247ff2bf02135457d6d77031654 从源码树删除 plugins/srp.c，并同步移除 configure.ac 中 --enable-srp 与 --enable-srp-setpass 构建选项、静态插件注册与 SRP 文档；由于 SRP SASL 机制从未形成标准（仅存在过期草案 draft-burdis-cat-srp-sasl），移除插件后 srp_server_mech_step2 等缺陷代码不复存在。该修复已合入 master 分支，截至 2026-11-15 尚未进入任何发布版本，最新发布版本 2.1.28（2022-02-22）仍受影响。", "effects": [{"comp_name": "cyrus-sasl", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.1.28]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "身份验证不当", "kind_en": "认证不当", "last_modified_time": "2026-11-15", "level": "Critical", "mps_id": "MPS-g3uj-etyh", "poc": false, "poc_url": [], "published_time": "2026-11-15", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-g3uj-etyh", "name": "https://www.oscs1024.com/hd/MPS-g3uj-etyh"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-129483", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-129483"}, {"url": "https://github.com/cyrusimap/cyrus-sasl/issues/896", "name": ""}, {"url": "https://seclists.org/oss-sec/2026/q4/122", "name": ""}, {"url": "https://gist.github.com/afldl/18d15d3f5a1df99411e35000c7de80db", "name": ""}, {"url": "https://github.com/cyrusimap/cyrus-sasl/commit/fb3724f43dc50247ff2bf02135457d6d77031654", "name": ""}, {"url": "https://github.com/cyrusimap/cyrus-sasl/blob/cyrus-sasl-2.1.28/plugins/srp.c#L2046-L2050", "name": ""}, {"url": "https://www.vulncheck.com/advisories/cyrus-sasl-through-2.1.28-srp-authentication-bypass-via-plugins-srp-c", "name": "VulnCheck Advisory: Cyrus SASL through 2.1.28 SRP Authentication Bypass via plugins/srp.c"}], "scope_influence": "", "tags": ["应用软件"], "title": "Cyrus SASL SRP认证绕过漏洞", "_translated": true, "_saved_at": "2026-11-15T15:12:18+00:00", "_first_saved_at": "2026-11-15T15:12:18+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-g3uj-etyh"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-129261", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:L/AC:L/Au:M/C:C/I:C/A:C", "severity": "medium", "base_score": 6.5}], "cvssv3": [{"source": "VulDB", "vector": "CVSS:3.0/AV:L/AC:L/PR:H/UI:N/S:C/C:H/I:H  "name": "VDB-437302 | Kingston FURY CTRL RGB Control Software IOCTL NTIOLib_X64.sys exposed ioctl with insufficient access control"}, {"url": "https://vuldb.com/vuln/437302/cti", "name": "VDB-437302 | CTI Indicators (IOB, IOC, IOA)"}, {"url": "https://vuldb.com/cve/CVE-2026-129261", "name": "CVE-2026-129261 | CVE Analysis and Report"}, {"url": "https://vuldb.com/submit/1043190", "name": "Submit #1043190 | Kingston FURY CTRL 2.0.66.0 Exposed IOCTL with Insufficient Access Control"}], "scope_influence": "", "tags": ["应用软件"], "title": "Kingston FURY CTRL驱动IOCTL访问控制缺失漏洞", "_translated": true, "_saved_at": "2026-11-14T20:17:19+00:00", "_first_saved_at": "2026-11-14T20:17:19+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-nm6c-ux91"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-128138", "cvss": {}, "cvss_score": 9.8, "cvss_vector": "", "cwe": "CWE-88", "description": "NLTK（Natural Language Toolkit）是开源 Python 自然语言处理库，用于分词、词性标注和语料读取，并通过公开函数 java() 调用本机 Java 程序。\n受影响版本中，公开函数 java() 先校验单独传入的选项列表 options，再把调用方给出的命令列表 cmd 原样接到 Java 启动器命令末尾；3.10.3 会拒绝 options 中的启动器开关和参数文件标记 @argfile，但不要求 cmd 的第一项是 Java 主类名。应用把不可信字符串放进 cmd 的第一项，或放进分词器 StanfordSegmenter 的构造参数 java_class（分段函数 segment_file() 会把它作为 cmd 的第一项传给 java()）时，Java 启动器把 -jar 或 @argfile 当作启动参数而不是主类名，加载当前进程可读的外部 JAR，以 NLTK 进程的权限执行攻击者选定的 Java 字节码。\n修复版本中通过在组装启动命令前检查 cmd 切断这条路径。第一项去掉首尾空白后若为空、不是字符串，或以 -、@ 开头，java() 抛出 ValueError；列表中任一以 @ 开头的标记同样被拒绝，启动器标记不再进入 Java 进程。主类名之后的普通程序参数仍可以 - 开头。", "effects": [{"comp_name": "nltk", "ecosystem": "pip", "versions": [{"affected_version": "[3.10.3,3.10.4)", "min_fixed_version": "3.10.4", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "参数注入或修改", "kind_en": "命令中参数分隔符的不正确中和（“参数注入”）", "last_modified_time": "2026-11-16", "level": "Critical", "mps_id": "MPS-qtrb-kiyc", "poc": true, "poc_url": [], "published_time": "2026-11-16", "reference_url_list": [{"url": "https://github.com/nltk/nltk/security/advisories/GHSA-x8q7-6c7m-52gw", "name": ""}, {"url": "https://github.com/nltk/nltk/commit/b36212795a522d2b7b176cf0e0d9d8da489ba6e6", "name": ""}], "scope_influence": "", "tags": [], "title": "NLTK Java代码执行漏洞", "_translated": true, "_saved_at": "2026-11-16T07:32:22+00:00", "_first_saved_at": "2026-11-16T07:32:22+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-qtrb-kiyc"}, {"analysis_status": 3, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2026-129349", "cvss": {"cvssv4": [{"source": "security@apache.org", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:N/AU:Y/R:U/V:C/RE:L/U:Red", "severity": "critical", "base_score": 9.1}, {"source": "murphysec", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:N/AU:Y/R:U/V:C/RE:L/U:Red", "severity": "critical", "base_score": 9.1}]}, "cvss_score": 9.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:N/AU:Y/R:U/V:C/RE:L/U:Red", "cwe": "CWE-287", "description": "Apache Shiro 是 Apache 软件基金会开源的 Java 安全框架，提供认证、授权、会话管理与加密能力，其 shiro-core 模块（org.apache.shiro:shiro-core）包含对接 LDAP 目录的 DefaultLdapRealm 与 JndiLdapRealm。\n受影响版本中，DefaultLdapRealm 构造函数默认调用 setCredentialsMatcher(new AllowAllCredentialsMatcher())，为该 Realm 安装无条件接受任意凭据的 AllowAllCredentialsMatcher；当应用将 authenticationCachingEnabled 设为 true（非默认配置）后，AuthenticatingRealm.getAuthenticationInfo 以用户名作为缓存键命中认证缓存并跳过 doGetAuthenticationInfo 中的 LDAP bind 校验，凭据校验退化为 assertCredentialsMatch 中的匹配器判定，而 AllowAllCredentialsMatcher 对任意密码均返回通过，攻击者在获知有效用户名且该用户此前成功登录过一次形成缓存后，可用任意密码通过该用户的身份认证。\n修复版本中通过移除 DefaultLdapRealm 构造函数中的 setCredentialsMatcher(new AllowAllCredentialsMatcher()) 调用完成修复，Realm 恢复继承 AuthenticatingRealm 默认的 SimpleCredentialsMatcher，认证缓存命中时提交的凭据仍会与缓存中的 AuthenticationInfo 实际比对，任意密码不再通过认证，修复随 3.0.1 版本发布。", "effects": [{"comp_name": "org.apache.shiro:shiro-core", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,3.0.1)", "min_fixed_version": "3.0.1", "repository": "maven", "solutions": [], "upstream": true}]}, {"comp_name": "shiro", "ecosystem": "linux", "versions": [{"affected_version": "影响所有版本", "min_fixed_version": "", "repository": "debian:12", "solutions": [], "upstream": false}, {"affected_version": "影响所有版本", "min_fixed_version": "", "repository": "debian:13", "solutions": [], "upstream": false}, {"affected_version": "影响所有版本", "min_fixed_version": "", "repository": "debian:14", "solutions": [], "upstream": false}, {"affected_version": "影响所有版本", "min_fixed_version": "", "repository": "debian:unstable", "solutions": [], "upstream": false}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "低", "fix_suggestion": "建议修复", "kind": "身份验证不当", "kind_en": "认证不当", "last_modified_time": "2026-11-16", "level": "Critical", "mps_id": "MPS-adb1-b3b5", "poc": true, "poc_url": [], "published_time": "2026-11-16", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-adb1-b3b5", "name": "https://www.oscs1024.com/hd/MPS-adb1-b3b5"}, {"url": "https://www.openwall.com/lists/oss-security/2026/11/14/8", "name": ""}, {"url": "https://github.com/apache/shiro/commit/c3cfcf752d784444497aa60abd305aa135329c5b", "name": ""}, {"url": "https://github.com/apache/shiro/releases/tag/shiro-root-3.0.1", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-129349", "name": ""}], "scope_influence": "小", "tags": ["java", "poc", "开源"], "title": "Apache Shiro认证缓存密码绕过漏洞", "_translated": true, "_saved_at": "2026-11-16T07:32:29+00:00", "_first_saved_at": "2026-11-14T08:26:44+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-adb1-b3b5"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-82414", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-787", "description": "BACnet Stack is a BACnet open source protocol stack C library for embedded systems. From versions 1.4.0 to before 1.4.6, 1.5.0 to before 1.5.1, and 1.6.0 to before 1.6.1, the BACnet MS/TP receive path decodes COBS frames into an output pointer inside the same fixed input buffer, but passes the full input-buffer size as the decode capacity. A long valid COBS payload can therefore write past the end of the actual remaining buffer. This issue has been patched in versions 1.4.6, 1.5.1, 1.6.1, and 1.7.0.", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-11-14", "level": "High", "mps_id": "MPS-5adc-bj2i", "poc": false, "poc_url": [], "published_time": "2026-11-14", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-5adc-bj2i", "name": "https://www.oscs1024.com/hd/MPS-5adc-bj2i"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-82414", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-82414"}, {"url": "https://github.com/bacnet-stack/bacnet-stack/pull/1425", "name": ""}, {"url": "https://github.com/bacnet-stack/bacnet-stack/security/advisories/GHSA-8456-m9x4-j6mc", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-82414 漏洞", "_translated": true, "_saved_at": "2026-11-16T07:32:33+00:00", "_first_saved_at": "2026-11-13T20:13:46+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-5adc-bj2i"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-18053", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-639", "description": "MemberDash 是 LearnDash 团队推出的 WordPress 会员管理商业插件，以闭源许可分发，用于站点会员内容限制、付费订阅与会员账户资料管理。\n受影响版本中，user_account_manager() 函数的 edit_profile 分支遍历全部提交的 $_POST 字段，并经 MS_Model 的 __set() 魔术方法直接写入会员对象，字段缺少白名单约束，对提交的 id 参数也缺少归属与能力校验；拥有订阅者及以上权限的认证攻击者在请求中注入任意用户 ID 后，可改写任意 WordPress 用户（含站点管理员）的邮箱与密码，随后使用被改写的凭据登录并获得站点管理员权限。\n修复版本中通过收紧资料更新分支的赋值与归属校验消除该批量赋值风险，官方修复说明要求将插件升级至 1.8.8 或更高版本，升级后订阅者无法再借助 id 参数覆盖其他用户的凭据。", "effects": [{"comp_name": "memberdash", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.8.8)", "min_fixed_version": "1.8.8", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "通过用户控制密钥绕过授权机制", "kind_en": "通过用户控制的密钥绕过授权", "last_modified_time": "2026-11-14", "level": "High", "mps_id": "MPS-i1vf-jp0u", "poc": false, "poc_url": [], "published_time": "2026-11-14", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-i1vf-jp0u", "name": "https://www.oscs1024.com/hd/MPS-i1vf-jp0u"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-18053", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-18053"}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/70d0bc5e-8db6-4a42-af19-d41280ec1207?source=cve", "name": ""}, {"url": "https://docs.nexcess.com/software/changelogs/learndash/memberdash/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "MemberDash 权限提升漏洞", "_translated": true, "_saved_at": "2026-11-14T15:27:50+00:00", "_first_saved_at": "2026-11-14T15:27:50+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-i1vf-jp0u"}, {"analysis_status": 0, "articles": [{"content": "跨界内存读是指应用程序在读取内存时，未正确验证或限制读取的内存范围。攻击者利用这种漏洞可以读取应用程序内存中的敏感数据，如密码、加密密钥、会话令牌等。常见的原因是由于缓冲区溢出、格式化字符串漏洞或其他内存错误导致的。", "title": "什么是越界读取"}, {"content": "攻击者可以通过不当构造的输入来触发跨界内存读漏洞。攻击者可能会通过向应用程序发送特定的输入，使其读取超过预期的内存区域。攻击者可以利用这个漏洞来获取敏感信息，如其他用户的数据、操作系统的敏感数据或应用程序的内部状态。", "title": "越界读取常见的攻击方式"}, {"content": "- 输入验证和限制：应用程序应对所有输入数据进行严格的验证和限制。确保输入数据的长度、格式和内容符合预期，避免超出缓冲区或访问非预期的内存区域。\n- 内存安全编程实践：开发人员应使用安全的编程实践，如避免使用不安全的函数、正确处理内存分配和释放操作，以及遵循最小特权原则。\n- 使用安全的编程语言和库：选择使用安全性较高的编程语言和库，这些语言和库在内存管理和安全性方面提供了更多的保护机制。\n- 定期进行代码审查和安全测试：定期审查应用程序的代码，并进行安全测试，以发现潜在的跨界内存读漏洞。使用静态代码分析工具和漏洞扫描工具来辅助检测和修复问题。\n- 实施防御性编程技术：应用程序应采用防御性编程技术，如使用随机化地址空间布局（ASLR）、堆栈保护机制（如堆栈溢出保护）和数据执行预防（DEP）等。\n- 及时更新和修补：及时应用程序和操作系统的安全更新和补丁，以确保已知的跨界内存读漏洞得到修复。及时更新相关软件和库，以避免使用已知存在漏洞的版本。", "title": "如何预防越界读取"}], "cnvd_id": "", "cve_id": "CVE-2026-62976", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-125", "description": "BACnet Stack is a BACnet open source protocol stack C library for embedded systems. Prior to version 1.5.1, the RAMFS-backed FILE object implementation stores appended records as NUL-terminated strings, but its record-counting logic later walks the buffer as if an additional terminating empty record were present. As a result, two consecutive AtomicWriteFile(record-access) append requests can cause record_count() to call bacnet_strnlen() on a pointer that is already one byte past the end of the heap allocation. This issue has been patched in versions 1.5.1 and 1.6.0.", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界读取", "kind_en": "越界读取", "last_modified_time": "2026-11-14", "level": "High", "mps_id": "MPS-svx7-jtn4", "poc": false, "poc_url": [], "published_time": "2026-11-14", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-svx7-jtn4", "name": "https://www.oscs1024.com/hd/MPS-svx7-jtn4"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-62976", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-62976"}, {"url": "https://github.com/bacnet-stack/b 访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-71531", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N", "severity": "high", "base_score": 8.1}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-863", "description": "PrestaShop 是开源 PHP 电子商务平台，通过 composer 包 prestashop/prestashop 分发，用于搭建多店铺在线商店，其 Webservice API 是面向外部系统的 REST 风格数据接口，多店铺部署下请求可携带 id_shop 或 id_shop_group 参数选择数据范围。\n受影响版本中，classes/webservice/WebserviceRequest.php 的 shopExists() 在收到 id_shop=all 时把店铺上下文直接扩展为安装内全部店铺，groupShopExists() 在收到 id_shop_group=N 时扩展为组内全部店铺，两者均未校验密钥实际关联的店铺；随后 shopHasRight() 对扩展后的店铺列表逐一拼接 wsas.id_shop = X 的 OR 条件，密钥只要关联其中任意一个店铺便通过校验，持有关联单一店铺密钥的攻击者可读取、修改或删除其他店铺的数据，包括客户记录中的 email、secure_key 与密码哈希。\n修复版本中通过新增 getAllowedShopIdsForCurrentKey() 载入密钥关联店铺，shopExists() 与 groupShopExists() 要求所选店铺全部位于密钥关联范围内，shopHasRight() 改为统计 COUNT(DISTINCT wsas.id_shop) 并要求与所选店铺数量全等的合取判断，配合 normalizeShopIds() 与 setNarrowShopContextFromSelection() 收窄店铺上下文，超出关联范围的请求统一返回 403，密钥访问边界被限制在其关联店铺内。", "effects": [{"comp_name": "prestashop/prestashop", "ecosystem": "composer", "versions": [{"affected_version": "[8.0.0,8.2.9)", "min_fixed_version": "8.2.9", "repository": "composer :L/I:H/A:H", "severity": "high", "base_score": 7.7}]}, "cvss_score": 7.7, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:L/I:H/A:H", "cwe": "CWE-787", "description": "BACnet Stack is a BACnet open source protocol stack C library for embedded systems. Prior to versions 1.4.6, 1.5.2, and 1.6.1, the BACnet/SC message decoder walks the header-option list by following each option's MORE bit. Nothing rejects a list whose last option still has the MORE bit set, and the decode walk has no upper bound on how many options it processes. A single crafted BVLC-SC frame makes the walk advance one option past the end of the message and read message[message_len], one byte out of bounds. When the bytes after the message carry more MORE-set option markers, the walk keeps going: it runs past the fixed 4-entry option array and writes decoded option fields out of bounds. On the server that decode array is the static global bsc_dm, so the out-of-bounds write lands in adjacent BSS. Both faults are reachable before authentication, from the first frame a peer sends on a BACnet/SC connection, and the bytes that follow the message are the same peer's prior-frame data. This issue has been patched in versions 1.4.6, 1.5.2, 1.6.1, and 1.7.0.", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-11-14", "level": "High", "mps_id": "MPS-aro9-egwd", "poc": false, "poc_url": [], "published_time": "2026-11-14", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-aro9-egwd", "name": "https://www.oscs1024.com/hd/MPS-aro9-egwd"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-97692", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-97692"}, {"url": "https://github.com/bacnet-stack/bacnet-stack/pull/1435", "name": ""}, {"url": "https://github.com/bacnet-stack/bacnet-stack/security/advisories/GHSA-gr74-333w-7wg8", "name": ""}] ished_time": "2026-11-14", "reference_url_list": [{"url": "https://seclists.org/fulldisclosure/2026/Nov/14", "name": ""}, {"url": "https://olografix.org/acme/_poc/CVE-2026-9661.pdf", "name": ""}, {"url": "https://postecert.poste.it/firma/download.shtml", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "FIRMAOK本地权限提升漏洞", "_translated": true, "_saved_at": "2026-11-14T01:10:36+00:00", "_first_saved_at": "2026-11-14T01:10:36+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-4e44-035a"}, {"analysis_status": 0, "articles": [{"content": "跨界内存读是指应用程序在读取内存时，未正确验证或限制读取的内存范围。攻击者利用这种漏洞可以读取应用程序内存中的敏感数据，如密码、加密密钥、会话令牌等。常见的原因是由于缓冲区溢出、格式化字符串漏洞或其他内存错误导致的。", "title": "什么是越界读取"}, {"content": "攻击者可以通过不当构造的输入来触发跨界内存读漏洞。攻击者可能会通过向应用程序发送特定的输入，使其读取超过预期的内存区域。攻击者可以利用这个漏洞来获取敏感信息，如其他用户的数据、操作系统的敏感数据或应用程序的内部状态。", "title": "越界读取常见的攻击方式"}, {"content": "- 输入验证和限制：应用程序应对所有输入数据进行严格的验证和限制。确保输入数据的长度、格式和内容符合预期，避免超出缓冲区或访问非预期的内存区域。\n- 内存安全编程实践：开发人员应使用安全的编程实践，如避免使用不安全的函数、正确处理内存分配和释放操作，以及遵循最小特权原则。\n- 使用安全的编程语言和库：选择使用安全性较高的编程语言和库，这些语言和库在内存管理和安全性方面提供了更多的保护机制。\n- 定期进行代码审查和安全测试：定期审查应用程序的代码，并进行安全测试，以发现潜在的跨界内存读漏洞。使用静态代码分析工具和漏洞扫描工具来辅助检测和修复问题。\n- 实施防御性编程技术：应用程序应采用防御性编程技术，如使用随机化地址空间布局（ASLR）、堆栈保护机制（如堆栈溢出保护）和数据执行预防（DEP）等。\n- 及时更新和修补：及时应用程序和操作系统的安全更新和补丁，以确保已知的跨界内存读漏洞得到修复。及时更新相关软件和库，以避免使用已知存在漏洞的版本。", "title": "如何预防越界读取"}], "cnvd_id": "", "cve_id": "CVE-2026-129432", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "medium", "base_score": 6.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:A/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:A/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-125", "description": "Ettercap 是一款开源的综合性网络嗅探与中间人攻击工具，用于局域网流量拦截、协议解析与内容过滤，其协议解析器默认随主程序启用。\n受影响版本中，src/dissectors/ec_mountd.c 的 dissector_mountd 函数在解析 NFS mountd RPC 报文时通过 (void)end 丢弃了指向报文结束位置的指针，对 RPC 凭证长度 cred 仅检查其不超过 PACKET-\u003eDATA.len，对目录名长度 flen 仅检查其不超过 100，两项校验均未对照报文真实结束边界。攻击者在相邻网络中向被嗅探链路发送 TCP 承载的 MOUNT MNT CALL 报文，当载荷为 72 字节且 cred 为 24、flen 为 100 时两项校验全部通过，而 memcpy(pe-\u003erem_dir, ptr + 44 + cred, flen) 的读取起点已越过堆缓冲区末尾，最多可读取超出分配区域 100 字节的堆内存，泄漏内容随文件句柄信息输出到控制台与日志。\n修复版本中通过恢复 end 指针并在跳过 TCP 记录标记后计算剩余字节数 left，将固定偏移头部读取、cred 与 flen 的载入以及 REPLY 方向句柄十六进制转储的读取范围全部对照 left 校验，越界报文直接返回丢弃，消除了堆越界读取。", "effects": [{"comp_name": "ettercap", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,0.8.5.1]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界读取", "kind_en": "越界读取", "last_modified_time": "2026-11-14", "level": "High", "mps_id": "MPS-26om-ulab", "poc": false, "poc_url": [], "published_time": "2026-11-14", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-26om-ulab", "name": "https://www.oscs1024.com/hd/MPS-26om-ulab"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-129432", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-129432"}, {"url": "https://github.com/Ettercap/ettercap/pull/1341", "name": "Pull Request #1341"}, {"url": "https://github.com/Ettercap/ettercap/blob/v0.8.5.1/src/dissectors/ec_mountd.c#L88-L103", "name": "Unchecked mountd directory copy at v0.8.5.1"}, {"url": "https://github.com/Ettercap/ettercap", "name": ""}, {"url": "https://www.vulncheck.com/advisories/ettercap-through-0.8.5.1-heap-out-of-bounds-read-in-nfs-mountd-dissector", "name": "VulnCheck Advisory: Ettercap through 0.8.5.1 Heap Out-of-Bounds Read in NFS mountd Dissector"}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "Ettercap mountd堆越界读取漏洞", "_translated": true, "_saved_at": "2026-11-14T15:27:45+00:00", "_first_saved_at": "2026-11-14T15:27:45+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-26om-ulab"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-129429", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:L/A:N", "severity": "high", "base_score": 7.1}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:L/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:L/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-862", "description": "india_payroll 是 Frappe Technologies 开源的印度本地化薪资组件（frappe/india-payroll，GPL-3.0 许可），作为 Frappe/ERPNext HR 应用的扩展提供所得税制度选择器（Tax Regime Selector）页面，供员工查看薪资明细、比较新旧所得税制度并选择所得税模板。\n受影响版本中，india_payroll/india_payroll/page/tax_regime_selector/tax_regime_selector.py 中的 get_employee_details、compute_tax_comparison 与 set_tax_regime 方法均以 frappe.whitelist() 暴露为 HTTP 接口，方法体内缺少授权校验，任意登录的低权限用户传入其他员工的 employee 标识，经 get_employee_salary_data 读取该员工 Salary Structure Assignment 中的基本薪资与收入、扣除分项数据；set_tax_regime 在校验 docstatus 后通过 frappe.db.set_value 直接改写目标员工草稿 Salary Structure Assignment 的 income_tax_slab 字段，可影响其代扣所得税计算。\n修复版本中通过新增 validate_employee_access 校验修复，仅当会话用户为该员工本人时放行，其余调用方要求具备目标 Employee 的读取权限及对应 Salary Structure Assignment 的 read 或 write 权限；set_tax_regime 另经 validate_income_tax_slab 校验所得税模板存在、已提交、未停用且公司与币种匹配，get_latest_assignment 增加 docstatus 过滤以跳过已取消记录，阻断跨员工薪资数据读取与越权改写。", "effects": [{"comp_name": "india_payroll", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,16.0.4)", "min_fixed_version": "16.0.4", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-11-14", "level": "High", "mps_id": "MPS-35o9-mxyp", "poc": false, "poc_url": [], "published_time": "2026-11-14", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-35o9-mxyp", "name": "https://www.oscs1024.com/hd/MPS-35o9-mxyp"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-129429", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-129429"}, {"url": "https://github.com/frappe/india-payroll/security/advisories/GHSA-758f-34xj-xvcc", "name": "GitHub Security Advisory (GHSA-758f-34xj-xvcc)"}, {"url": "https://github.com/frappe/india-payroll/commit/78de736298a340ecb971826a5df10e7204773cef", "name": "Patch Commit (develop)"}, {"url": "https://github.com/frappe/india-payroll/commit/bdb988f172663db4054f9c3fc23833f10c3b60b0", "name": "Patch Commit (v16.0.4)"}, {"url": "https://github.com/frappe/india-payroll/blob/9c1fc91b34de8a55df58aa5f2dbabff95dedb4d1/india_payroll/india_payroll/page/tax_regime_selector/tax_regime_selector.py#L207-L215", "name": "set_tax_regime without permission check at v16.0.3"}, {"url": "https://github.com/frappe/india-payroll/releases/tag/v16.0.4", "name": "india-payroll v16.0.4 Release Notes"}, {"url": "https://github.com/frappe/india-payroll", "name": ""}, {"url": "https://www.vulncheck.com/advisories/frappe-india-payroll-before-16.0.4-missing-authorization-via-tax-regime-selector", "name": "VulnCheck Advisory: Frappe india-payroll before 16.0.4 Missing Authorization via Tax Regime Selector"}], "scope_influence": "", "tags": ["应用软件"], "title": "india-payroll 缺失授权漏洞", "_translated": true, "_saved_at": "2026-11-14T15:27:42+00:00", "_first_saved_at": "2026-11-14T15:27:42+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-35o9-mxyp"}, {"analysis_status": 0, "articles": [{"content": "跨界内存读是指应用程序在读取内存时，未正确验证或限制读取的内存范围。攻击者利用这种漏洞可以读取应用程序内存中的敏感数据，如密码、加密密钥、会话令牌等。常见的原因是由于缓冲区溢出、格式化字符串漏洞或其他内存错误导致的。", "title": "什么是越界读取"}, {"content": "攻击者可以通过不当构造的输入来触发跨界内存读漏洞。攻击者可能会通过向应用程序发送特定的输入，使其读取超过预期的内存区域。攻击者可以利用这个漏洞来获取敏感信息，如其他用户的数据、操作系统的敏感数据或应用程序的内部状态。", "title": "越界读取常见的攻击方式"}, {"content": "- 输入验证和限制：应用程序应对所有输入数据进行严格的验证和限制。确保输入数据的长度、格式和内容符合预期，避免超出缓冲区或访问非预期的内存区域。\n- 内存安全编程实践：开发人员应使用安全的编程实践，如避免使用不安全的函数、正确处理内存分配和释放操作，以及遵循最小特权原则。\n- 使用安全的编程语言和库：选择使用安全性较高的编程语言和库，这些语言和库在内存管理和安全性方面提供了更多的保护机制。\n- 定期进行代码审查和安全测试：定期审查应用程序的代码，并进行安全测试，以发现潜在的跨界内存读漏洞。使用静态代码分析工具和漏洞扫描工具来辅助检测和修复问题。\n- 实施防御性编程技术：应用程序应采用防御性编程技术，如使用随机化地址空间布局（ASLR）、堆栈保护机制（如堆栈溢出保护）和数据执行预防（DEP）等。\n- 及时更新和修补：及时应用程序和操作系统的安全更新和补丁，以确保已知的跨界内存读漏洞得到修复。及时更新相关软件和库，以避免使用已知存在漏洞的版本。", "title": "如何预防越界读取"}], "cnvd_id": "", "cve_id": "CVE-2026-129431", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "medium", "base_score": 6.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:A/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:A/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-125", "description": "Ettercap 是一款开源的中间人攻击与网络审计工具，可对局域网流量进行嗅探与拦截，并通过内置协议解析器还原经过的明文会话内容。\n受影响版本中，默认绑定 TCP 1080 端口的 SOCKS5 解析器 dissector_socks() 在处理客户端用户名/密码认证报文时，直接从报文读取用户名与密码长度字节并按该长度执行 memcpy，全程未与报文末尾指针 end 比较，函数入口处以 (void)end 显式丢弃了该指针；解析缓冲区由 packet_disp_data() 按 DATA.len + 1 字节分配，攻击者发送形如 05 FF 41 的 3 字节认证报文，可让解析器在 4 字节堆缓冲区上向后读取最多 255 字节，越界内容以 USER/PASS 字段经 DISSECT_MSG 打印并记录，造成堆内存信息泄露。\n修复版本中通过在 dissector_socks() 中引入对 end 指针的边界校验切断上述读取链：用户名与密码长度改为越界安全的表达式求值，仅当 ptr + user_len + pass_len + 3 不超出报文末尾时执行拷贝与输出，畸形或截断的认证报文不再产生任何凭据内容；该修复目前位于上游 PR 1340（提交 7910e9721220e4a646c05166c5ffbbc984d164d9），尚未随任何官方发布版本释出。", "effects": [{"comp_name": "ettercap", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,0.8.5.1]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界读取", "kind_en": "越界读取", "last_modified_time": "2026-11-14", "level": "High", "mps_id": "MPS-6qo3-ndk8", "poc": false, "poc_url": [], "published_time": "2026-11-14", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-6qo3-ndk8", "name": "https://www.oscs1024.com/hd/MPS-6qo3-ndk8"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-129431", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-129431"}, {"url": "https://github.com/Ettercap/ettercap/pull/1340", "name": "Pull Request #1340"}, {"url": "https://github.com/Ettercap/ettercap/blob/v0.8.5.1/src/dissectors/ec_socks.c#L108-L124", "name": "Unchecked SOCKS5 credential copy at v0.8.5.1"}, {"url": "https://github.com/Ettercap/ettercap", "name": ""}, {"url": "https://www.vulncheck.com/advisories/ettercap-through-0.8.5.1-heap-out-of-bounds-read-via-socks5-dissector", "name": "VulnCheck Advisory: Ettercap through 0.8.5.1 Heap Out-of-Bounds Read via SOCKS5 Dissector"}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "Ettercap SOCKS5 堆越界读取漏洞", "_translated": true, "_saved_at": "2026-11-14T15:27:47+00:00", "_first_saved_at": "2026-11-14T15:27:47+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-6qo3-ndk8"}, {"analysis_status": 0, "articles": [{"content": "- 程序未正确处理用户上传的文件，从而导致程序可以读取、处理或存储未经授权的文件\n", "title": "什么是任意文件上传"}, {"content": "- 欺骗攻击：攻击者可以通过发送伪造的文件来欺骗程序，从而导致程序读取、处理或存储未经授权的文件。\n- 文件格式攻击：攻击者可以通过选择特定的文件格式，例如压缩文件或 ZIP 文件，从而利用上传的文件来篡改程序的执行结果或窃取程序中的重要数据。\n", "title": "任意文件上传常见的攻击方式"}, {"content": "- 使用安全文件传输协议 (FTP):使用安全 FTP 协议可以确保上传的文件格式、大小、权限等符合预期，同时可以防止文件读取、篡改或存储漏洞。\n- 使用文件上传过滤器：使用文件上传过滤器可以过滤上传的文件，以确保文件的格式、大小、权限等符合预期，同时可以防止文件读取、篡改或存储漏洞。\n- 使用白名单机制：使用白名单机制可以只允许特定的文件格式、大小、权限等存在的文件上传，从而防止非法文件的上传和攻击。\n- 定期更新和升级程序：定期更新和升级程序可以修复已知的漏洞，并增强程序的安全性。", "title": "如何预防任意文件上传"}], "cnvd_id": "", "cve_id": "CVE-2026-67444", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-434", "description": "Hubleys is a dashboard for self-hosted services. Prior to version 0.5.2, any authenticated (non-admin) Hubleys user can upload a file with an arbitrary extension as their dashboard \"background image,\" and the server will later serve that file back with a Content-Type derived straight from the attacker's chosen extension - so uploading an .html file gets it served as text/html. Because the endpoint that serves it returns a manually-constructed response rather than going through SvelteKit's normal page-rendering pipeline, the app's configured Content-Security-Policy never gets attached to it either, so a script embedded in the upload runs unrestricted. This issue has been patched in version 0.5.2.", "effects": [{"comp_name": "hubleys-dashboard", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,0.5.2)", "min_fixed_version": "0.5.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "任意文件上传", "kind_en": "危险类型文件无限制上传", "last_modified_time": "2026-11-14", "level": "High", "mps_id": "MPS-w72y-olz8", "poc": false, "poc_url": [], "published_time": "2026-11-14", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-w72y-olz8", "name": "https://www.oscs1024.com/hd/MPS-w72y-olz8"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-67444", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-67444"}, {"url": "https://github.com/knrdl/hubleys-dashboard/security/advisories/GHSA-j2w9-hhqw-mrq8", "name": "https://github.com/knrdl/hubleys-dashboard/security/advisories/GHSA-j2w9-hhqw-mrq8"}, {"url": "https://github.com/knrdl/hubleys-dashboard/commit/5a7f04c153295d48319d35fdd53e30f50288cd37", "name": "https://github.com/knrdl/hubleys-dashboard/commit/5a7f04c153295d48319d35fdd53e30f50288cd37"}, {"url": "https://github.com/knrdl/hubleys-dashboard/releases/tag/v0.5.2", "name": "https://github.com/knrdl/hubleys-dashboard/releases/tag/v0.5.2"}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-67444漏洞", "_translated": true, "_saved_at": "2026-11-16T07:32:33+00:00", "_first_saved_at": "2026-11-13T20:13:48+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-w72y-olz8"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过向受信任的数据序列化过程中添加恶意数据，从而在序列化和反序列化过程中执行恶意代码的攻击漏洞。这种漏洞通常存在于使用序列化 (serialization) 机制存储和传输数据的程序中。\n", "title": "什么是反序列化"}, {"content": "- 注入攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码注入到程序中，从而实现代码执行的目的。\n- 反射攻击：攻击者使用反射机制，在序列化过程中动态生成恶意数据，并将恶意代码注入到程序中，从而实现代码执行的目的。\n- 缓冲区溢出攻击：攻击者通过在序列化过程中向缓冲区输入恶意数据，导致缓冲区溢出，从而破坏程序的内存管理，实现代码执行的目的。\n- 格式字符串攻击：攻击者通过在序列化过程中输入恶意数据，导致程序使用错误的格式字符串，从而实现代码执行的目的。\n- 数据流攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码作为一个数据流传递给程序，从而实现代码执行的目的。\n", "title": "反序列化常见的攻击方式"}, {"content": "- 不信任输入数据：程序应该严格检查输入数据的有效性，并避免使用不受信任的数据。\n- 使用安全的序列化机制：程序应该使用安全的序列化机制，如 JSON 或 XML 序列化，而不是第三方序列化库。\n- 最小特权原则：程序应该限制对受信任数据的处理权限，并避免在运行时修改数据。\n- 代码审查和漏洞扫描：程序应该进行代码审查和漏洞扫描，以发现和修复潜在的安全漏洞。\n", "title": "如何预防反序列化"}], "cnvd_id": "", "cve_id": "CVE-2026-124969", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:N/I:L/A:H", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:N/I:L/A:H", "cwe": "CWE-502", "description": "Optimole 是 WordPress 官方插件目录中的开源图片优化插件（插件标识 optimole-wp，源码托管于 GitHub），提供图片压缩、WebP 与 AVIF 格式转换、CDN 分发与懒加载等功能，并支持在媒体库中对附件文件执行重命名与替换操作。\n受影响版本中，管理员对任意附件执行 Rename 操作时，插件通过 Optml_Attachment_Db_Renamer 类扫描数据库各表并把文本列的行值交给 replace_urls_in_value 处理；该函数对判定为序列化数据的行值直接调用 unserialize，未限制可实例化的类，而扫描范围未排除 wp_comments 表。未认证攻击者可先发表评论，在 comment_content 或 comment_agent 字段植入包含目标附件 URL 的序列化 Archive_Tar 对象载荷，管理员随后重命名该附件时载荷被反序列化，Archive_Tar 对象销毁时 __destruct 调用 _close 将攻击者可控的 _temp_tarname 属性传入 unlink，删除服务器任意文件，删除 wp-config.php 等关键文件后可借助 WordPress 重装流程获得远程代码执行。利用还需主机存在并可加载 PEAR Archive_Tar 库。\n修复版本中通过新增 read_serialized 方法替换原有反序列化调用：以 allowed_classes 选项仅允许 stdClass 实例化，拒绝包含 r:/R: 引用标记的值，并在递归检查发现 stdClass 以外对象时保持原值不变，嵌套的序列化字符串复用同一防护并受 MAX_NESTED_DEPTH 上限约束，阻止 Archive_Tar 等任意类被实例化，切断对象注入到任意文件删除的利用链。", "effects": [{"comp_name": "optimole-wp", "ecosystem": "linux", "versions": [{"affected_version": "[4.0.0,4.2.20)", "min_fixed_version": "4.2.20", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", ob/eb9228a23014f6000c06cab2f10ae0d44ecbbd3a/ZR.Admin.WebApi/Controllers/System/SysProfileController.cs#L62-L75", "name": ""}, {"url": "https://github.com/izhaorui/Zr.Admin.NET/blob/eb9228a23014f6000c06cab2f10ae0d44ecbbd3a/ZR.ServiceCore/Services/SysUserService.cs#L220-L236", "name": ""}, {"url": "https://github.com/izhaorui/Zr.Admin.NET/blob/eb9228a23014f6000c06cab2f10ae0d44ecbbd3a/ZR.Admin.WebApi/Controllers/System/SysLoginController.cs#L516-L559", "name": ""}, {"url": "https://github.com/izhaorui/Zr.Admin.NET/commit/af07ffc5d18e7876d3780d1ff5ee776b80950399", "name": ""}, {"url": "https://www.vulncheck.com/advisories/zr-admin-net-commit-af07ffc-through-eb9228a-idor-via-system-user-profile", "name": "VulnCheck Advisory: Zr.Admin.NET commit af07ffc through eb9228a IDOR via /system/user/profile"}], "scope_influence": "", "tags": ["应用软件"], "title": "Zr.Admin.NET 越权致管理员账号接管", "_translated": true, "_saved_at": "2026-11-15T07:26:18+00:00", "_first_saved_at": "2026-11-15T07:26:18+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-enoz-ic02"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-129464", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-122", "description": "DrayTek Vigor2960 是 DrayTek 公司推出的企业级 VPN 路由器设备，固件为闭源嵌入式软件，通过 /cgi-bin/mainfunction.cgi 提供 Web 管理接口。\n受影响版本中，mainfunction.cgi 的 check_file_exist 处理例程读取 upload_config、upload_section、upload_option、upload_path 与 upload_name 参数后，将 upload_name 通过 strcat 直接拼接到承载 upload_path 的堆缓冲区，拼接前未获取目标缓冲区容量也未限制写入长度；已通过认证的攻击者提交超长 upload_name 可越界改写相邻堆数据，造成 CGI 进程内存破坏并在请求清理阶段于 free 函数触发 SIGSEGV 崩溃，公开验证显示 0x100 字节输入使接口响应由正常 JSON 变为空响应体。\n修复版本中通过升级 Vigor2960 固件至 1.5.1.7 修复，厂商确认所报告问题已在更新固件中修复，升级后可消除超长 upload_name 引发的堆越界写入与进程崩溃风险。", "effects": [{"comp_name": "vigor2960_firmware", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.5.1.7)", "min_fixed_version": "1.5.1.7", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "堆缓冲区溢出", "kind_en": "基于堆的缓冲区溢出", "last_modified_time": "2026-11-15", "level": "High", "mps_id": "MPS-c0wh-vj9e", "poc": false, "poc_url": [], "published_time": "2026-11-15", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-c0wh-vj9e", "name": "https://www.oscs1024.com/hd/MPS-c0wh-vj9e"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-129453", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-129453"}, {"url": "https://vuldb.com/vuln/437464", "name": "VDB-437464 | DrayTek Vigor2960 File Existence Check mainfunction.cgi check_file_exist heap-based overflow"}, {"url": "https://vuldb.com/vuln/437464/cti", "name": "VDB-437464 | CTI Indicators (IOB, IOC, IOA)"}, {"url": "https://vuldb.com/cve/CVE-2026-129453", "name": "CVE-2026-129453 | CVE Analysis and Report"}, {"url": "https://vuldb.com/submit/1044963", "name": "Submit #1044963 | DrayTek Vigor2960 Vigor2960 1.5.1.6 (revision 8218) Authenticated check_file_exist Heap Memory Corruption"}, {"url": "https://github.com/yikesoftware/DrayTek_Vigor2960_Security_Analysis/tree/main/cases/DRV2960-0020-authenticated-check-file-exist-direct-cgi-core", "name": ""}, {"url": "https://fw.draytek.com.tw/Vigor2960/Firmware/v1.5.1.7/Vigor2960_v1.5.1.7.zip", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Vigor2960 堆缓冲区溢出漏洞", "_translated": true, "_saved_at": "2026-11-15T15:12:24+00:00", "_first_saved_at": "2026-11-15T15:12:24+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-c0wh-vj9e"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-125832", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:N/A:L", "severity": "high", "base_score": 8.5}]}, "cvss_score": 8.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:N/A:L", "cwe": "CWE-89", "description": "WP Data Access（wp-data-access）是开源 WordPress 插件，用于在站点中发布数据表、表单、仪表盘和图表，并按条件查询数据库。\n受影响版本中，已登录用户请求已发布 Data Table 时，ajax 动作 wp_ajax_wpda_datatables 进入 WPDA_Data_Tables::get_data。该方法取得出版物 pub_default_where 后，继续拼接请求中的 search[value] 以及 filter_field_name、filter_field_value，再对整段 WHERE 调用 WPDA::substitute_environment_vars。该函数发现 $$USERID$$、$$USER$$ 或 $$EMAIL$$ 时，把标记替换为占位符并对整段子句执行 $wpdb-\u003eprepare。检索条件在拼接时已经写入 LIKE 百分号，请求也可以自行带入上述标记，于是用户输入进入格式字符串并被再次解释，查询结构可被改写，导致数据库敏感信息泄露并带来低程度的可用性影响。\n修复版本中通过仅对 pub_default_where 调用 substitute_environment_vars，在追加 search[value] 和字段过滤条件之前完成环境变量替换，使用户输入不再进入该函数的占位符替换和 $wpdb-\u003eprepare。", "effects": [{"comp_name": "wp-data-access", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,5.5.93)", "min_fixed_version": "5.5.93", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-11-15", "level": "High", "mps_id": "MPS-dgip-ac53", "poc": false, "poc_url": [], "published_time": "2026-11-15", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-dgip-ac53", "name": "https://www.oscs1024.com/hd/MPS-dgip-ac53"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-125832", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-125832"}, {"url": "https://patchstack.com/database/wordpress/plugin/wp-data-access/vulnerability/wordpress-wp-data-access-plugin-5-5-92-sql-injection-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "WP Data Access SQL注入", "_translated": true, "_saved_at": "2026-11-15T15:12:20+00:00", "_first_saved_at": "2026-11-15T15:12:20+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-dgip-ac53"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-129352", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:N/AC:L/Au:M/C:C/I:C/A:C", "severity": "high", "base_score": 8.3}], "cvssv3": [{"source": "VulDB", "vector": "CVSS:3.0/AV:N/AC:L/PR:H/UI:N/S:C/C:H/I:H/A:H/E:P/RL:X/RC:R", "severity": "critical", "base_score": 9.1}], "cvssv31": [{"source": "cna@vuldb.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.1}], "cvssv4": [{"source": "cna@vuldb.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H 015-10149", "name": "https://nvd.nist.gov/vuln/detail/CVE-2015-10149"}, {"url": "https://github.com/PerlDancer/Dancer/commit/5a68fddbaef903fd3bd58517ce585cde986716e4.patch", "name": ""}, {"url": "https://github.com/PerlDancer/Dancer/issues/1117", "name": ""}, {"url": "https://github.com/PerlDancer/Dancer/issues/1118", "name": ""}, {"url": "https://github.com/PerlDancer/Dancer/pull/1172", "name": ""}, {"url": "https://metacpan.org/release/BIGPRESH/Dancer-1.3400/changes", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Dancer会话ID校验缺失漏洞", "_translated": true, "_saved_at": "2026-11-15T00:37:26+00:00", "_first_saved_at": "2026-11-15T00:37:26+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ol9d-me8i"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "cnvd_id": "", "cve_id": "CVE-2026-129456", "cvss": {"cvssv4": [{"source": "57a55968-44ac-464c-a794-6ba3baad09c4", "vector": "CVSS:4.0/AV:N/AC:H/AT:P/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:L/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:N/R:A/V:X/RE:X/U:X", "severity": "high", "base_score": 7.7}]}, "cvss_score": 7.7, "cvss_vector": "CVSS:4.0/AV:N/AC:H/AT:P/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:L/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:N/R:A/V:X/RE:X/U:X", "cwe": "CWE-416", "description": "FRR（FRRouting）是开源的 IP 路由协议套件，其中的 bgpd 守护进程负责与对等体建立 BGP 会话并维护路由表，广泛部署于 Linux 路由器与网络设备。\n受影响版本中，bgpd 接受邻居发送的 RFC 9012 Tunnel Encapsulation 属性（类型 23），bgp_attr_encap() 对外层 TLV 长度与属性剩余长度不一致的情况仅记录日志并继续处理；已建立 BGP 会话的邻居通过 UPDATE 消息携带此类畸形属性，使 intern 化的子 TLV 链引用计数失衡，该链在 Adj-RIB-In 条目与 RIB 路径仍持有引用时被释放，后续路由替换、撤销或会话拆除触发 encap_unintern() 读取已释放内存并二次释放，bgpd 因内存记账断言失败退出，路由器上全部 BGP 会话中断，攻击者可在 bgpd 重启后重复触发。\n修复版本中通过在 bgp_attr_encap() 中将长度不一致判定为畸形属性，以 flog_err 记录错误日志并经 bgp_attr_malformed() 返回 BGP_NOTIFY_UPDATE_OPT_ATTR_ERR 通知，拒绝处理该属性，切断引用计数失衡与后续对已释放内存的访问路径，bgpd 不再因该属性崩溃。", "effects": [{"comp_name": "frrouting", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,10.2.6)", "min_fixed_version": "10.2.6", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[10.3,10.3.4)", "min_fixed_version": "10.3.4", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[10.6,10.6.0)", "min_fixed_version": "10.6.0", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[10.4,10.4.4)", "min_fixed_version": "10.4.4", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[10.5,10.5.4)", "min_fixed_version": "10.5.4", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "UAF", "kind_en": "免费后使用", "last_modified_time": "2026-11-15", "level": "High", "mps_id": "MPS-fvlj-wiq3", "poc": false, "poc_url": [], "published_time": "2026-11-15", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-fvlj-wiq3", "name": "https://www.oscs1024.com/hd/MPS-fvlj-wiq3"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-129456", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-129456"}, {"url": "https://github.com/FRRouting/frr/issues/20874", "name": ""}, {"url": "https://github.com/FRRouting/frr/pull/21176/changes/1238ac4a06e5c23595e8bf626856f297d0c302a2", "name": ""}, {"url": "https://github.com/FRRouting/frr/commit/bebf95f02bc0dccc6a1841f0c8cbcba1f617d655", "name": ""}, {"url": "https://github.com/FRRouting/frr/commit/abef07b500e19baa924d157ab03809b93730e619", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "FRR bgpd 隧道封装属性 UAF", "_translated": true, "_saved_at": "2026-11-15T00:37:25+00:00", "_first_saved_at": "2026-11-15T00:37:25+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-fvlj-wiq3"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-125780", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-22", "description": "Woocommerce Custom Product Addons Pro 是 Acowebs 开发的 WordPress 商业付费插件（插件目录 woo-custom-product-addons-pro），用于通过表单构建器为 WooCommerce 商品页面添加自定义选项字段，文件上传字段经由 admin-ajax.php 的 AJAX 上传与购物车提交流程处理。\n受影响版本中，未认证攻击者可以向 admin-ajax.php 的 wcpa_ajax_submit 入口提交购物车请求，插件在 WCPA_Form::submited_data() 中直接读取 $_REQUEST 内以字段名命名的 _ajax 参数并传入 move_file()；move_file() 将上传根目录、wcpa_uploads 与攻击者可控的相对路径直接拼接，复制完成后执行 @unlink 删除该路径，全程缺少目录边界校验，攻击者提交包含 ../ 序列的路径能够删除站点目录外的任意可读文件，例如 WordPress 配置文件 wp-config.php，造成站点核心文件丢失与服务中断。\n修复版本中通过发布 5.9.2 修复版本消除该路径穿越删除链，厂商未公开修复补丁细节，官方记录确认 5.9.2 及以上版本不再受影响，建议用户直接升级以切断攻击者对上传目录之外文件的删除能力。", "effects": [{"comp_name": "woo-custom-product-addons-pro", "ecosystem": "linux", "versions": [{"affected_version": "[0,5.9.2)", "min_fixed_version": "5.9.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-11-15", "level": "High", "mps_id": "MPS-fu31-yrzt", "poc": false, "poc_url": [], "published_time": "2026-11-15", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-fu31-yrzt", "name": "https://www.oscs1024.com/hd/MPS-fu31-yrzt"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-125780", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-125780"}, {"url": "https://patchstack.com/database/wordpress/plugin/woo-custom-product-addons-pro/vulnerability/wordpress-woocommerce-custom-product-addons-pro-plugin-5-9-0-arbitrary-file-deletion-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Acowebs WooCommerce产品插件任意文件删除漏洞", "_translated": true, "_saved_at": "2026-11-15T15:12:27+00:00", "_first_saved_at": "2026-11-15T15:12:27+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-fu31-yrzt"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-120687", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "cwe": "CWE-79", "description": "FooBox（Lightbox \u0026 Modal Popup WordPress Plugin – FooBox）是 FooPlugins 维护的 WordPress 开源灯箱插件，用于为站点图片和相册提供弹窗浏览与字幕展示，源码公开托管于 WordPress 官方插件目录，插件服务端生成配置、字幕逻辑由客户端脚本 foobox.free.min.js 完成。\n受影响版本中，客户端 Wordpress 附加组件的字幕生成处理器读取 .wp-caption 容器内 img 的 alt 属性作为字幕描述，先将该值写入独立 div 的 innerHTML 以还原字符实体并执行字幕去重比较，随后才调用净化函数处理字幕文本，未净化内容先于净化进入 innerHTML；bbPress 2.6.20 的 bbp_filter_kses 过滤链允许 img 与 pre 标签并在属性值中保留数字字符引用，攻击者借此保存形如 \u0026#60;img onerror=...\u0026#62; 的编码载荷，页面被访问时实体还原为真实标签并在该 innerHTML 写入点解析执行，在浏览用户浏览器上下文中运行任意 Web 脚本；安装 bbPress 且存在公开论坛时订阅者及以上权限可利用，默认 WordPress 环境需要撰稿人及以上权限，构成存储型 DOM XSS。\n修复版本中通过调整字幕处理顺序切断上述链路：2.8.8 版本在字符串化后先对字幕标题与描述调用净化函数，再进入 innerHTML 解码与去重比较，确保写入 innerHTML 的内容均为净化后文本，编码载荷失去在该写入点解析执行的入口。", "effects": [{"comp_name": "foobox-image-lightbox", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.8.8)", "min_fixed_version": "2.8.8", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-11-14", "level": "High", "mps_id": "MPS-a4ty-972b", "poc": false, "poc_url": [], "published_time": "2026-11-15", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-a4ty-972b", "name": "https://www.oscs1024.com/hd/MPS-a4ty-972b"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-120687", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-120687"}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/66b5a5a2-8f70-4a85-ad03-8bd159cafdf5?source=cve", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/foobox-image-lightbox/tags/2.8.7/free/js/foobox.free.min.js", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/foobox-image-lightbox/tags/2.8.7/free/includes/class-script-generator.php#L175", "name": ""}, {"url": "https://plugins.trac.wordpress.org/changeset/3789888/foobox-image-lightbox", "name": ""}, {"url": "https://plugins.trac.wordpress.org/changeset?reponame=\u0026new=3789888%40foobox-image-lightbox%2Ftags%2F2.8.8\u0026old=3741260%40foobox-image-lightbox%2Ftags%2F2.8.7", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "FooBox存储型XSS漏洞", "_translated": true, "_saved_at": "2026-11-14T20:17:20+00:00", "_first_saved_at": "2026-11-14T20:17:20+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-a4ty-972b"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击 tact Form 7 插件处于激活状态时，NjtCF7MLSValidation 类的 cf7mls_validation_callback 函数把整个 $_POST 数组赋给 $posted_data，并在后续循环中以数组键作为 name 写入 wp_cf7_data_entry 表，该键未做任何字符校验，叠加输出转义不足，含脚本的字段名被持久化并在用户访问相关页面时执行，形成存储型 XSS。\n修复版本中通过构建合法字段名白名单（表单 tag 名称与 submit_time、submit_ip、submit_user_id），并在写入数据库前跳过白名单之外的数组键，使攻击者控制的字段名不再进入 wp_cf7_data_entry 表，切断存储型 XSS 注入链。", "effects": [{"comp_name": "cf7-multi-step", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.9.2)", "min_fixed_version": "2.9.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-11-14", "level": "High", "mps_id": "MPS-t0u7-iwhg", "poc": false, "poc_url": [], "published_time": "2026-11-15", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-t0u7-iwhg", "name": "https://www.oscs1024.com/hd/MPS-t0u7-iwhg"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-116753", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-116753"}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/b9700627-97f2-4da1-a984-934062bd5014?source=cve", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/cf7-multi-step/tags/2.9.1/inc/frontend/validation.php#L330", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/cf7-multi-step/tags/2.9.1/inc/frontend/validation.php#L291", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/cf7-multi-step/tags/2.9.1/inc/frontend/validation.php#L20", "name": ""}, {"url": "https://wordpress.org/plugins/cf7-multi-step/", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/cf7-multi-step/tags/2.9.2/inc/frontend/validation.php", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Multi Step for Contact Form 7 存储型 XSS 漏洞", "_translated": true, "_saved_at": "2026-11-14T20:17:21+00:00", "_first_saved 026-11-15", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-6hwo-9d4f", "name": "https://www.oscs1024.com/hd/MPS-6hwo-9d4f"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-129454", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-129454"}, {"url": "https://vul.yulun.ac.cn/20261114/zr-admin-net/", "name": ""}, {"url": "https://github.com/izhaorui/Zr.Admin.NET/issues/27", "name": ""}, {"url": "https://github.com/izhaorui/Zr.Admin.NET/blob/eb9228a23014f6000c06cab2f10ae0d44ecbbd3a/ZR.Workflow/Controllers/WfFlowInstanceController.cs#L49-L57", "name": ""}, {"url": "https://github.com/izhaorui/Zr.Admin.NET/blob/eb9228a23014f6000c06cab2f10ae0d44ecbbd3a/ZR.Workflow/Service/WfFlowInstanceService.cs#L173-L176", "name": ""}, {"url": "https://github.com/izhaorui/Zr.Admin.NET/commit/85cff6ae22389c241d3a4efe178273966650f7ca", "name": ""}, {"url": "https://www.vulncheck.com/advisories/zr-admin-net-commit-85cff6a-through-eb9228a-idor-via-workflow-instance-endpoint", "name": "VulnCheck Advisory: Zr.Admin.NET commit 85cff6a through eb9228a IDOR via Workflow Instance Endpoint"}], "scope_influence": "", "tags": ["应用软件"], "title": "Zr.Admin.NET工作流实例越权读取", "_translated": true, "_saved_at": "2026-11-15T07:26:19+00:00", "_first_saved_at": "2026-11-15T07:26:19+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-6hwo-9d4f"}, {"analysis_status": 0, "articles": [{"content": "由于应用程序或系统中存在敏感信息未经适当保护而被泄露给攻击者或未经授权的用户，这些敏感信息可能包括用户凭据、个人身份信息、敏感业务数据、系统配置信息等。信息暴露漏洞通常是由于设计、实施或配置错误引起的，例如不正确的访问控制、弱密码策略、缺乏加密、错误的日志处理等。", "title": "什么是未授权敏感信息泄露"}, {"content": "- 直接访问敏感信息：攻击者可以通过直接访问不正确配置或不受保护的资源来获取敏感信息，如通过公开可访问的URL、未经授权的文件目录访问等。\n- 越权访问：攻击者可能利用访问控制错误或不正确的权限配置来获取他们没有权限访问的敏感信息。\n- 错误信息披露：应用程序在错误处理过程中可能泄露敏感信息，例如将错误消息中的敏感数据返回给客户端或显示在日志文件中。\n- 信息泄露通过响应：攻击者可能利用应用程序在响应中不正确地包含敏感信息，如通过网页源代码、响应头部或响应消息体中的敏感数据。", "title": "未授权敏感信息泄露常见的攻击方式"}, {"content": "- 访问控制：确保只有经过授权的用户能够访问敏感信息，使用强大的身份验证和授权机制。\n- 数据加密：对于敏感信息，使用适当的加密算法对数据进行加密，包括数据传输和存储过程中的加密。\n- 错误处理和日志安全：正确处理错误情况，避免在错误消息中暴露敏感信息。同时，确保日志记录功能的安全性，避免将敏感信息记录在日志文件中。\n- 安全配置和最佳实践：遵循安全最佳实践，对应用程序、服务器和系统进行适当的配置，包括访问控制、权限管理、密码策略等。\n- 审计和监控：实施日志审计和监控机制，及时检测和响应任何异常活动或潜在的信息暴露事件。\n- 安全开发实践：在应用程序开发过程中，进行安全代码审查、漏洞扫描和安全测试，以及敏感信息的正确处理和保护。", "title": "如何预防未授权敏感信息泄露"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-123006", "cvss": {}, "cvss_score": 8.8, "cvss_vector": "", "cwe": "CWE-200", "description": "Gitea 是开源自托管 Git 服务，Go 模块为 gitea.dev，用于代码托管、仓库检索以及提交状态展示。\n受影响版本中，已登录用户调用仪表盘使用的 GET /repo/search 时，routers/web/repo 包的 SearchRepo 把完整 git_model.CommitStatus 赋给 WebSearchRepository.LatestCommitStatus 并经 ctx.JSON 输出。FindReposLatestCommitStatuses 将仓库对象写入 CommitStatus.Repo，该仓库的 Owner 是完整 user_model.User，而 Passwd、PasswdHashAlgo、Salt、Rands、Email 未设置 json:\"-\"，响应因此带出当前用户可见且存在 commit status 的仓库所有者的密码哈希、哈希算法、盐、Rands 与主邮箱，并一并带出内部仓库对象。\n修复版本中通过 SearchRepo 只拷贝 State 与 TargetURL 到 WebSearchCommitStatus，并为 CommitStatus 的 Repo 与 Creator 增加 json:\"-\"，切断完整用户记录进入该接口响应的路径。", "effects": [{"comp_name": "gitea.dev", "ecosystem": "go", "versions": [{"affected_version": "[28.0.0,28.4.0)", "min_fixed_version": "28.4.0", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "未授权敏感信息泄露", "kind_en": "向未经授权的行为者泄露敏感信息", "last_modified_time": "2026-11-16", "level": "High", "mps_id": "MPS-58nd-eos0", "poc": false, "poc_url": [], "published_time": "2026-11-16", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-58nd-eos0", "name": "https://www.oscs1024.com/hd/MPS-58nd-eos0"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-123006", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-123006"}, {"url": "https://blog.gitea.com/release-of-28.4.0/", "name": ""}, {"url": "https://github.com/go-gitea/gitea/pull/40377", "name": ""}, {"url": "https://github.com/go-gitea/gitea/pull/40384", "name": ""}, {"url": "https://github.com/go-gitea/gitea/releases/tag/v28.4.0", "name": ""}, {"url": "https://github.com/go-gitea/gitea/security/advisories/GHSA-frjx-8pcw-8c9q", "name": ""}], "scope_influence": "", "tags": ["go"], "title": "Gitea仓库搜索信息泄露", "_translated": true, "_saved_at": "2026-11-16T00:37:16+00:00", "_first_saved_at": "2026-11-16T00:37:16+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-58nd-eos0"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-82156", "cvss": {"cvssv31": [{"source": "security_alert@emc.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-863", "description": "Dell PowerStore 是戴尔开发的闭源企业存储阵列，PowerStoreT OS 运行于 PowerStore T 系列设备，用于提供块存储、文件服务与设备管理。\n受影响版本中，PowerStoreT OS 5.1.x 存在授权绕过缺陷。已具备低权限的攻击者可通过网络绕过授权限制，将权限提升为管理员，进而对存储系统的机密性、完整性与可用性造成高影响。\n修复版本中通过将 PowerStoreT OS 升级到 5.1.0.0-2798105 及以上版本消除该授权绕过路径，低权限身份不能再由此提升为管理员。厂商未公开源码级修改。", "effects": [{"comp_name": "PowerStore 1000T", "ecosystem": "linux", "versions": [{"affected_version": "[5.1,5.1.0.0-2798105)", "min_fixed_version": "5.1.0.0-2798105", "repository": "unmanaged", "solu 00", "_source_page": "https://www.oscs1024.com/hd/MPS-nzl5-tpia"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-129540", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-89", "description": "VoAPI 是用于聚合和分发大模型 API 的网关系统。GitHub 公开仓库只包含部署文件和占位程序，服务端以闭源容器镜像 voapi/voapi 发布，提供多用户令牌、渠道转发、日志和站点配置管理。\n受影响版本中，列表查询把前端提交的 search 参数键名当作 SQL 列名拼接，只对参数值做预编译绑定。已登录的普通用户调用 GET /api/log 等列表接口时，可以改写查询条件并读取 option 表 ps_site 记录中的 HS256 JWT 签名密钥，再保留自身 userId 与 sign、将 role 改为 manager 后访问 /api/m/* 管理接口，读取用户与渠道数据并修改站点配置。默认部署允许自行注册。\n修复版本中通过限制可过滤列名并停止拼接外部键名来消除该注入的补丁并未发布。截至 2026-11-16，CVE.org 只确认 1.0.0 至 1.2.0 受影响，GitHub 在公告之后没有新提交，维护者说明公开社区版已长期无人维护。", "effects": [{"comp_name": "voapi", "ecosystem": "linux", "versions": [{"affected_version": "[1.0.0,1.2.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-11-16", "level": "High", "mps_id": "MPS-o431-dupg", "poc": false, "poc_url": [], "published_time": "2026-11-16", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-o431-dupg", "name": "https://www.oscs1024.com/hd/MPS-o431-dupg"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-129540", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-129540"}, {"url": "https://vul.yulun.ac.cn/20261115/voapi/", "name": ""}, {"url": "https://github.com/VoAPI/VoAPI/issues/78", "name": ""}, {"url": "https://www.vulncheck.com/advisories/voapi-1.0.0-through-1.2.0-sql-injection-via-search-filter-key", "name": "VulnCheck Advisory: VoAPI 1.0.0 through 1.2.0 SQL Injection via search Filter Key"}], "scope_influence": "", "tags": ["AI", "应用软件"], "title": "VoAPI SQL注入漏洞", "_translated": true, "_saved_at": "2026-11-16T07:32:33+00:00", "_first_saved_at": "2026-11-16T07:32:33+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-o431-dupg"}, {"analysis_status": 0, "articles": [{"content": "- 条件竞争漏洞是由于程序中存在多个代码块同时访问同一个条件判断语句而导致的错误。在程序中，条件判断语句通常用于决定是否执行某些代码块。当一个程序有多个代码块同时访问同一个条件判断语句时，这些代码块可能会同时执行，从而导致程序执行结果出现不可预测的错误。", "title": "什么是竞争条件"}, {"content": "- 线程切换攻击：线程切换攻击是指攻击者通过利用竞争条件漏洞，使程序在执行时频繁切换线程，从而导致系统资源耗尽，最终实现拒绝服务攻击。\n- 内存泄漏攻击：内存泄漏攻击是指攻击者通过利用竞争条件漏洞，使得程序不断申请内存，但最终无法释放内存，从而导致内存泄漏，最终程序崩溃。\n- 缓存穿透攻击：缓存穿透攻击是指攻击者通过利用竞争条件漏洞，使得程序在访问缓存时，被缓存的数据并非当前最新的数据，从而攻击者可以获取到未更新的数据。\n- 指令重放攻击：指令重放攻击是指攻击者通过利用竞争条件漏洞，在程序执行时，将先前保存的指令序列重新执行，从而实现绕过某些验证，获取系统权限等攻击目的。\n", "title": "竞争条件常见的攻击方式"}, {"content": "- 使用互斥锁：在条件判断语句中，使用互斥锁来确保只有一个代码块能够访问变量。使用互斥锁可以提高程序的安全性和可靠性。\n- 使用条件封印：在条件判断语句中，将可能会修改变量的代码块封印起来，以确保这些代码块无法被其他代码块访问。\n- 使用条件过滤：在条件判断语句中，使用条件过滤来过滤掉那些不可能发生的条件判断语句。例如，对于一个包含多个条件判断语句的循环，可以只保留其中一个条件的判断，而将其他条件的判断语句过滤掉。\n- 使用性能优化：对于一些条件判断语句，可以使用性能优化来避免条件竞争的情况。例如，可以使用数组或链表等数据结构来存储条件判断语句中的变量，从而避免条件竞争的情况。", "title": "如何预防竞争条件"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-125423", "cvss": {}, "cvss_score": 8.5, "cvss_vector": "", "cwe": "CWE-362", "description": "Gitea 是使用 Go 开发的开源自托管 Git 服务，模块路径为 gitea.dev，用于在自有环境中托管代码仓库并提供网页与 API 访问。\n受影响版本中，开启 auto_init 创建仓库时，CreateRepositoryDirectly 在 git 裸仓库、委托钩子和初始提交完成前已将数据库记录写成 RepositoryReady，Git Smart HTTP 的 ServiceReceivePack 可以在该窗口写入对象。prepareRepoCommit 通过 git.CloneRepoToLocal 把仓库检出到临时目录，再用 os.WriteFile 覆盖 README.md。检出结果中的 README.md 若是指向 hooks/post-receive.d/gitea 的符号链接，写入会跟随链接改写仍保持可执行位的委托钩子，内容来自默认 README 模板并插入未经 shell 转义的仓库描述。initRepoCommit 随后执行 git.PushFromLocal，服务端 post-receive 以运行 Gitea 的操作系统账户执行被改写的钩子。\n修复版本中通过 prepareRepoCommit 先写入模板文件，再删除临时目录中的 .git 并调用 git.InitRepositoryLocal，初始提交不再基于对已有仓库内容的检出。CreateRepositoryDirectly 在初始化完成前将状态固定为 RepositoryBeingMigrated，httpBase 对 IsBeingCreated 的仓库拒绝 Git HTTP 访问，初始化成功且 needsUpdateToReady 为真时才更新为 RepositoryReady。", "effects": [{"comp_name": "gitea.dev", "ecosystem": "go", "versions": [{"affected_version": "(-∞,28.4.0)", "min_fixed_version": "28.4.0", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "竞争条件", "kind_en": "使用共享资源并发执行且同步不正确（“竞争条件”）", "last_modified_time": "2026-11-16", "level": "High", "mps_id": "MPS-7mf1-nwkl", "poc": false, "poc_url": [], "published_time": "2026-11-16", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-7mf1-nwkl", "name": "https://www.oscs1024.com/hd/MPS-7mf1-nwkl"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-125423", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-125423"}, {"url": "https://blog.gitea.c
