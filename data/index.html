"severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-639", "description": "Dolibarr 是开源 ERP 与 CRM 系统，面向中小企业提供第三方管理、采购结算和供应商付款等功能。\n受影响版本中，REST 接口 Thirdparties::createCompanyBankAccount()、updateCompanyBankAccount() 和 deleteCompanyBankAccount() 只验证调用者是否拥有 societe.creer 权限，未调用 DolibarrApi::_checkAccessToResource('societe', $id) 检查对路径中指定公司的对象级访问权。持有第三方创建权限的认证用户在无法读取目标公司的情况下，仍可创建、替换或删除其银行账户并写入可控 IBAN；系统随后生成 SEPA 贷记转账文件时会将该 IBAN 作为债权人账户，把对外付款转入攻击者控制的账户。\n修复版本中通过在上述三个写路由中增加与读接口 getCompanyBankAccount() 相同的 DolibarrApi::_checkAccessToResource('societe', $id) 校验，未获对象访问权的写请求统一返回 403，阻断越权改写银行账户以及据此重定向供应商付款的路径。", "effects": [{"comp_name": "dolibarr", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,24.0.0)", "min_fixed_version": "24.0.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "通过用户控制密钥绕过授权机制", "kind_en": "通过用户控制的密钥绕过授权", "last_modified_time": "2026-08-25", "level": "High", "mps_id": "MPS-gsd7-qh3y", "poc": false, "poc_url": [], "published_time": "2026-08-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-gsd7-qh3y", "name": "https://www.oscs1024.com/hd/MPS-gsd7-qh3y"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-71507", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-71507"}, {"url": "https://codeant.ai/security-research/cve-2026-71507-dolibarr-bola-lets-attackers-redirect-supplier-payments", "name": ""}, {"url": "https://github.com/Dolibarr/dolibarr/commit/c100564d059e19c711317c734d302a90b11e2e8b", "name": ""}, {"url": "https://github.com/Dolibarr/dolibarr/releases/tag/24.0.0", "name": ""}, {"url": "https://www.vulncheck.com/advisories/dolibarr-rest-api-broken-object-level-authorization-via-bank-account-routes", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Dolibarr银行账户越权漏洞", "_translated": true, "_saved_at": "2026-08-24T20:22:30+00:00", "_first_saved_at": "2026-08-24T20:22:30+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-gsd7-qh3y"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-71505", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:L/I:H/A:N", "severity": "high", "base_score": 7.1}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:L/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:L/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-639", "description": "Dolibarr 是开源的企业资源计划与客户关系管理软件，用于管理第三方客户、发票、会计以及客户 WebPortal。\n受影响版本中，REST API 类 Thirdparties 的站点账户写接口 putSocieteAccount 只检查调用者是否具备 societe/creer 权限，未调用 DolibarrApi::_checkAccessToResource('societe', $id) 校验对该公司的对象级访问。已认证且仅有第三方创建权限的攻击者可对无权读取的公司调用 PUT /thirdparties/{id}/accounts/{site}，并在请求体中提交 pass 字段以覆盖其 WebPortal 密码，随后以该公司身份登录门户读取发票数据；该写接口响应还会返回更新前的口令校验值。同文件中的 postSocieteAccount 与 deleteSocieteAccount 同样缺少对象级检查。\n修复版本中通过在 postSocieteAccount、putSocieteAccount 和 deleteSocieteAccount 的角色校验之后补上 _checkAccessToResource('societe', $id)，对无权访问的第三方返回 403，阻止跨公司改写或删除门户账户。", "effects": [{"comp_name": "dolibarr", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,24.0.0)", "min_fixed_version": "24.0.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "通过用户控制密钥绕过授权机制", "kind_en": "通过用户控制的密钥绕过授权", "last_modified_time": "2026-08-25", "level": "High", "mps_id": "MPS-itos-547c", "poc": false, "poc_url": [], "published_time": "2026-08-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-itos-547c", "name": "https://www.oscs1024.com/hd/MPS-itos-547c"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-71505", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-71505"}, {"url": "https://codeant.ai/security-research/cve-2026-71505-dolibarr-bola-enables-portal-account-takeover", "name": ""}, {"url": "https://github.com/Dolibarr/dolibarr/commit/4cf305ebb958eeffa921aad7c94de179b764f7e7", "name": ""}, {"url": "https://github.com/Dolibarr/dolibarr/releases/tag/24.0.0", "name": ""}, {"url": "https://www.vulncheck.com/advisories/dolibarr-rest-api-broken-object-level-authorization-via-third-party-write-route", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Dolibarr对象级越权", "_translated": true, "_saved_at": "2026-08-24T20:22:31+00:00", "_first_saved_at": "2026-08-24T20:22:31+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-itos-547c"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-78263", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:L", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:L", "cwe": "CWE-79", "description": "Event Tickets 是 Nexcess / StellarWP 开源的 WordPress 插件，用于活动售票、RSVP 与参会者管理，并内置 Tickets Commerce 处理购票订单。\n受影响版本中，Tickets Commerce 订单详情模板将参会者 meta 先经 esc_html 转义，再把首个字段拼接 `%s` 后整体交给 sprintf，并把含原始 HTML 的 Edit 链接作为格式化参数。未认证攻击者可在购物车请求的 tribe_tickets_ar_data 中写入带 sprintf 格式说明符的参会者 meta，利用 `%1$.Ns` 从该 HTML 参数截取尖括号并拼出脚本标签；管理员打开对应订单页时，脚本会在后台页面上下文执行。\n修复版本中通过停止把参会者 meta 当作 sprintf 格式串处理，改为对每个字段单独 esc_html 输出，并将 Edit 链接作为独立标记渲染，切断格式化注入绕过转义的路径。", "effects": [{"comp_name": "event-tickets", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,5.29.3)", "min_fixed_version": "5.29.3", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-08-25", "level": "High", "mps_id": "MPS-jqkf-14ui", "poc": false, "poc_url": [], "published_time": "2026-08-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-jqkf-14ui", "name": "https://www.oscs1024.com/hd/MPS-jqkf-14ui"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-78263", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-78263"}, {"url": "https://patchstack.com/database/wordpress/plugin/event-tickets/vulnerability/wordpress-event-tickets-plugin-5-29-2-1-cross-site-scripting-xss-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Event Tickets跨站脚本漏洞", "_translated": true, "_saved_at": "2026-08-25T00:55:37+00:00", "_first_saved_at": "2026-08-24T23:17:18+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-jqkf-14ui"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-77914", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:N", "severity": "medium", "base_score": 6.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/A ": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-862", "description": "Dolibarr 是开源 ERP 与 CRM 软件，面向中小企业提供人事、薪资、财务和客户管理能力。\n受影响版本中，用户 REST API 更新接口 Users::put() 在通过用户写入权限检查后，将请求体字段逐一赋给 User 对象，拒绝列表仅包含 pass_crypted、pass_indatabase、pass_indatabase_crypted、pass_temp、api_key 等凭证字段，未覆盖 salary、salaryextra、thm、tjm、weeklyhours 等薪资列。持有 user.self.creer/write 或 user.user.creer/write、但不具备薪资权限的调用者可通过 PUT /api/index.php/users/{id} 改写任意用户的薪资、奖金、时薪、日薪和周工时；同文件 _cleanObjectDatas() 在缺少 salaries.read 时会剥离 salary、salaryextra、thm、tjm，使改写结果难以从 HTTP 响应直接察觉，被篡改数值会出现在薪资导出报表中。\n修复版本中通过在 Users::put() 与 Users::post() 的字段赋值循环中增加薪资读权限判定，当 salaries 模块启用且调用者没有 salaries.read 时拒绝写入 salary、salaryextra、thm、tjm，切断无薪资权限账号经用户 API 改写薪资列的路径。", "effects": [{"comp_name": "dolibarr", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,24.0.0)", "min_fixed_version": "24.0.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-08-25", "level": "High", "mps_id": "MPS-rstd-kqe7", "poc": false, "poc_url": [], "published_time": "2026-08-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-rstd-kqe7", "name": "https://www.oscs1024.com/hd/MPS-rstd-kqe7"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-71508", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-71508"}, {"url": "https://codeant.ai/security-research/cve-2026-71508-dolibarr-payroll-mass-assignment", "name": ""}, {"url": "https://github.com/Dolibarr/dolibarr/commit/c85d0e840725a3c1a2f49b3e97766469c3cb02b6", "name": ""}, {"url": "https://github.com/Dolibarr/dolibarr/releases/tag/24.0.0", "name": ""}, {"url": "https://www.vulncheck.com/advisories/dolibarr-rest-api-improper-autho et 日志流，读取包含文件路径、堆栈跟踪与内部 URL 的系统日志。\n修复版本中通过在 GET /api/system/logs 与 GET /api/system/logs/stream 上增加 RequireScopes(admin:settings) 中间件，将历史日志查询与 SSE 订阅限制为具备管理员设置权限的调用方。", "effects": [{"comp_name": "github.com/lin-snow/ech0", "ecosystem": "go", "versions": [{"affected_version": "(-∞,4.4.3)", "min_fixed_version": "4.4.3", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-08-25", "level": "High", "mps_id": "MPS-zd9f-wv7y", "poc": false, "poc_url": [], "published_time": "2026-08-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-zd9f-wv7y", "name": "https://www.oscs1024.com/hd/MPS-zd9f-wv7y"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-79666", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-79666"}, {"url": "https://github.com/lin-snow/Ech0/security/advisories/GHSA-cp79-9mwr-wr49", "name": ""}, {"url": "https://www.vulncheck.com/advisories/ech0-before-missing-authorization-via-dashboard-log-endpoints", "name": ""}], "scope_influence": "", "tags": [], "title": "Ech0日志接口越权漏洞", "_translated": true, "_saved_at": "2026-08-25T13:43:39+00:00", "_first_saved_at": "2026-08-25T12:35:52+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-zd9f-wv7y"}, {"analysis_status": 0, "articles": [{"content": "由于整数类型的有限范围，在进行算术运算或操作时，结果可能超出类型的表示范围，导致溢出或环绕。溢出指的是结果超过了类型的最大值或小于了最小值，而环绕指的是结果绕回到类型的最小值或最大值。", "title": "什么是整数溢出或环绕"}, {"content": "- 缓冲区溢出：整数溢出可能导致缓冲区溢出漏洞。当整数溢出导致分配的缓冲区大小不足以容纳结果时，攻击者可以利用这个漏洞覆盖相邻的内存区域，执行恶意代码或篡改程序的状态。\r\n- 身份验证绕过：在进行身份验证或访问控制时，整数溢出可能导致绕过验证的漏洞。攻击者可以构造特殊的输入，使溢出的整数值绕过了预期的验证逻辑，从而获得未经授权的访问权限。\r\n- 数据篡改：整数溢出可能导致数据篡改漏洞。攻击者可以通过使整数溢出，修改计数器、索引或其他控制数据的值，导致程序在处理数据时发生错误或执行意外的操作。", "title": "整数溢出或环绕常见的攻击方式"}, {"content": "- 输入验证与限制：对用户输入的整数进行合理的验证和限制，确保其在允许的范围内。\r\n- 使用安全的整数操作函数：使用安全的整数操作函数，如`add_with_overflow()`、`sub_with_overflow()`、`mul_with_overflow()`等，这些函数会检查并处理溢出情况，确保计算结果在安全范围内。\r\n- 类型检查和转换：在进行整数运算或操作之前，进行类型检查和转换，确保操作数的类型和范围是合适的。\r\n- 强制性编码标准和最佳实践：制定强制性的编码标准和最佳实践，包括对整数运算和操作的规范和限制，以帮助程序员编写更可靠、安全的代码。\r\n- 静态代码分析和测试：使用静态代码分析工具和测试技术来检测和识别潜在的整数溢出问题。这些工具可以帮助发现代码中可能存在的溢出漏洞，并及时修复。", "title": "如何预防整数溢出或环绕"}], "cnvd_id": "", "cve_id": "CVE-2026-78465", "cvss": {"cvssv31": [{"source": "secalert@redhat.com", "vector": "CVSS:3.1/AV:L/AC:H/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7}]}, "cvss_score": 7, "cvss_vector": "CVSS:3.1/AV:L/AC:H/PR:N/UI:R/S:U/C:H/I:H/A:H", "cwe": "CWE-190", "description": "GIMP（GNU Image Manipulation Program）是开源图像编辑软件，内置 file-pcx 插件用于加载和导出 PCX 图像。\n受影响版本中，仅 32 位构建会在处理 planes=4 的 PCX 时出现整数溢出：load_image 以 G_MAXSIZE / width / height \u003c 3 做溢出防护，却按 width * height * pcx_header.planes 分配缓冲；攻击者诱使用户打开宽高足够大的 4 平面 PCX 后，检查仍通过而 gsize 乘法回绕，load_24 向过小堆缓冲写入，造成堆溢出，可导致任意代码执行或拒绝服务。\n修复版本中通过在 load_image 使用 g_size_checked_mul 按实际 width、height 与 planes 计算分配大小，溢出时拒绝加载，切断错误防护与越界写入之间的因果链。该改动已合入 master 与 gimp-3-2，对应里程碑 3.2.6，截至 2026-08-25 尚无包含该提交的正式发行标签。", "effects": [{"comp_name": "gimp", "ecosystem": "linux", "versions": [{"affected_version": "[3.0.0,3.2.4]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "整数溢出或环绕", "kind_en": "整数溢出或环绕", "last_modified_time": "2026-08-25", "level": "High", "mps_id": "MPS-186m-2dpq", "poc": false, "poc_url": [], "published_time": "2026-08-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-186m-2dpq", "name": "https://www.oscs1024.com/hd/MPS-186m-2dpq"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-78465", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-78465"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-78465", "name": ""}, {"url": "https://bugzilla.redhat.com/show_bug.cgi?id=2522057", "name": ""}, {"url": "https://gitlab.gnome.org setupCommentRoutes 将九个 /api/panel/comments 管理接口直接注册到 AuthRouterGroup，未调用 RequireScopes。JWTAuthMiddleware 在令牌有效时注入 viewer 后，CommentService.requireAdmin 只检查用户是否为管理员或所有者。持有管理员签发且仅含 echo:read 等最小 scope 的访问令牌时，攻击者可以列出、批准、拒绝、删除评论，并读取或修改评论系统设置。\n修复版本中通过为上述九个接口统一添加 RequireScopes(ScopeCommentMod)，使访问令牌必须具备 comment:moderate 才能进入评论面板管理操作，切断最小权限令牌越权审核的路径。", "effects": [{"comp_name": "github.com/lin-snow/ech0", "ecosystem": "go", "versions": [{"affected_version": "(-∞,4.4.3)", "min_fixed_version": "4.4.3", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-08-25", "level": "High", "mps_id": "MPS-2uvt-zsqd", "poc": false, "poc_url": [], "published_time": "2026-08-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-2uvt-zsqd", "name": "https://www.oscs1024.com/hd/MPS-2uvt-zsqd"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-79672", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-79672"}, {"url": "https://github.com/lin-snow/Ech0/security/advisories/GHSA-fwg7-53p4-g33c", "name": ""}, {"url": "https://www.vulncheck.com/advisories/ech0-before-authentication-bypass-via-comment-panel", "name": ""}], "scope_influence": "", "tags": [], "title": "Ech0评论面板越权漏洞", "_translated": true, "_saved_at": "2026-08-25T13:43:32+00:00", "_first_saved_at": "2026-08-25T12:35:46+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-2uvt-zsqd"}, {"analysis_status": 0, "articles": [{"content": "- 编写代码时没有正确处理输入数据或没有正确验证用户输入而导致的。", "title": "什么是关键资源权限分配不当"}, {"content": "- 弱密码或未使用的密码：当管理员或系统管理员在创建帐户时，没有使用强密码或未对帐户进行密码更新时，可能会发生这种情况。弱密码可能会被黑客破解或通过其他方式轻松访问系统。\n- 未正确配置权限：在系统中，不同的资源通常需要不同的权限才能访问。如果管理员未正确配置权限，那么未经授权的用户可能会通过欺骗系统或利用其他漏洞来访问关键资源。\n- 权限重用：在某些情况下，管理员可能会将某些权限分配给某个用户，但这些权限并未被正确地限制或授权给该用户。如果其他用户尝试使用这些权限访问关键资源，那么他们可能会获得未经授权的访问权限。\n- 未正确验证用户输入：当开发人员没有正确验证用户输入时，可能会发生这种情况。例如，如果开发人员未正确过滤用户输入的用户名或密码，那么黑客可能会利用这些信息轻松地访问系统。\n", "title": "关键资源权限分配不当常见的攻击方式"}, {"content": "- 使用强密码：管理员应该使用强密码来保护系统，并定期更改密码。强密码应该包括数字、字母和符号，并且应该不同于其他帐户使用的密码。\n- 正确配置权限：管理员应该正确配置系统中不同资源所需的权限。用户可以被授予访问特定资源的权限，但不应该被授予访问其他资源的权限。\n- 权限限制：管理员应该使用权限限制来限制用户对特定资源的访问。例如，用户可以被授予访问特定文件夹的权限，但不能访问其他文件夹。\n- 输入验证：开发人员应该正确验证用户输入。例如，他们可以过滤用户输入的用户名和密码，以确保它们符合预期的格式。\n- 安全培训：管理员和用户应该接受安全培训，以便了解如何识别和避免常见的安全漏洞，例如不正确权限授予漏洞。\n- 定期更新和修补软件：系统软件和应用程序应该定期更新和修补，以确保它们不受最新安全漏洞的影响。", "title": "如何预防关键资源权限分配不当"}], "cnvd_id": "", "cve_id": "CVE-2026-78553", "cvss": {"cvssv4": [{"source": "5a6e4751-2f3f-4070-9419-94fb35b644e8", "vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:N/UI:N/VC:H/VI:L/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7}]}, "cvss_score": 7, "cvss_vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:N/UI:N/VC:H/VI:L/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-732", "description": "RansomLook 是开源勒索软件团伙与暗网市场监控平台，基于 Flask 提供 Web 管理界面、REST API 以及受害者情报采集能力。\n受影响版本中，website/web/helpers.py 的 get_secret_key() 在首次创建 Flask 会话签名密钥文件 secret_key 时调用 Path.open(\"wb\")，未显式限制文件权限，进程在常见 umask 022 下会生成 0644 权限文件。能够访问 RansomLook 主目录的其他本地用户可读取该密钥，伪造已认证会话 Cookie 并冒充包括管理员在内的用户；该密钥还参与遗留 API-key 的 PBKDF2 派生。启用 LDAP 时，user_loader 不要求用户名存在于本地用户表，伪造会话更加直接。\n修复版本中通过改用 os.open 以 0600 权限原子创建 secret_key，并在每次启动时将已有密钥文件权限收紧为仅属主可读写，切断其他本地用户读取会话签名密钥的路径。", "effects": [{"comp_name": "ransomlook", "ecosystem": "linux", "versions": [{"affected_version": "[0,2.0.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "关键资源权限分配不当", "kind_en": "关键资源的权限分配不正确", "last_modified_time": "2026-08-25", "level": "High", "mps_id": "MPS-6qpz-lkcu", "poc": false, "poc_ 类标识时不再无条件信任调用方 workspaceId，可切断该越权链。截至 2026-08-26，公开仓库最新正式版本仍为 2.0.0，main 分支 resolveWorkspace 仍优先信任 X-Airbyte-Workspace-Id，未找到已验证修复提交。", "effects": [{"comp_name": "airbyte-platform", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.0.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "通过用户控制密钥绕过授权机制", "kind_en": "通过用户控制的密钥绕过授权", "last_modified_time": "2026-08-26", "level": "High", "mps_id": "MPS-oi19-7qst", "poc": false, "poc_url": [], "published_time": "2026-08-26", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-oi19-7qst", "name": "https://www.oscs1024.com/hd/MPS-oi19-7qst"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-80049", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-80049"}, {"url": "https://github.com/airbytehq/airbyte-platform", "name": ""}, {"url": "https://github.com/airbytehq/airbyte-platform/blob/v2.0.0/airbyte-commons-server/src/main/kotlin/io/airbyte/commons/server/support/AuthenticationHeaderResolver.kt", "name": ""}, {"url": "https://github.com/geo-chen/oss/blob/main/airbyte-platform.md", "name": ""}, {"url": "https://www.vulncheck.com/advisories/airbyte-platform-through-2.0.0-cross-workspace-authorization-bypass-via-caller-supplied-workspaceid", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Airbyte工作区越权漏洞", "_translated": true, "_saved_at": "2026-08-25T20:21:26+00:00", "_first_saved_at": "2026-08-25T20:21:26+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-oi19-7qst"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-75498", "cvss": {"cvssv31": [{"source": "9119a7d8-5eab-497f-8521-727c672e3725", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.2}], "cvssv4": [{"source": "9119a7d8-5eab-497f-8521-727c672e3725", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-89", "description": "Webkul QloApps 在数据库查询之前不会验证请求参数。具有管理权限的经过身份验证的远程攻击者可以将精心设计的 SQL 查询发送到“Address.php”文件中的“bo_query”参数。已在 123c97c 中修复。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-08-26", "level": "High", "mps_id": "MPS-0wg3-bmyt", "poc": false, "poc_url": [], "published_time": "2026-08-26", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-0wg3-bmyt", "name": "https://www.oscs1024.com/hd/MPS-0wg3-bmyt"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-75498", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-75498"}, {"url": "https://github.com/Qloapps/QloApps/pull/1783/change /MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-470", "description": "Vocos 实例化由配置文件命名的类，而不限制可以命名哪个类。 vocos/pretrained.py 中的 instantiate_class 从配置中获取 class_path 值，将其拆分为模块和属性，使用 __import__ 导入模块，使用 getattr 解析属性，并将结果调用为 args_class(*args, **kwargs)，其中 kwargs 是配置自己的 init_args 映射。没有白名单限制点路径，因此配置可以命名任何可导入的可调用对象并提供调用它的参数。 Vocos.from_hparams 为每个 feature_extractor、backbone 和 head 条目实现此目的，而 Vocos.from_pretrained 通过远程文件实现此目的：它从调用者命名的 Hugging Face 存储库下载 config.yaml 并将其直接传递到 from_hparams。从用户无法控制的存储库加载模型，因此会在加载过程中执行存储库所有者选择的代码。下载权重的相邻 torch.load 是一个单独的问题，并且受到 PyTorch 版本的限制，默认weights_only为true，这使得该路径成为可到达的路径。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "使用外部可控制的输入来选择类或代码（不安全的反射）", "kind_en": "使用外部控制输入来选择类或代码（“不安全反射”）", "last_modified_time": "2026-08-26", "level": "High", "mps_id": "MPS-n71v-pogz", "poc": false, "poc_url": [], "published_time": "2026-08-26", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-n71v-pogz", "name": "https://www.oscs1024.com/hd/MPS-n71v-pogz"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-79784", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-79784"}, {"url": "https://github.com/gemelo-ai/vocos", "name": ""}, {"url": "https://github.com/gemelo-ai/vocos/blob/main/vocos/pretrained.py", "name": ""}, {"url": "https://github.com/gemelo-ai/vocos/issues/76", "name": ""}, {"url": "https://pypi.org/project/vocos/", "name": ""}, {"url": "https://www.vulncheck.com/advisories/vocos-through-arbitrary-code-execution-via-unrestricted-class-path-in-model-configuration", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-79784漏洞", "_translated": true, "_saved_at": "2026-08-25T17:25:47+00:00", "_first_saved_at": "2026-08-25T17:25:47+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-n71v-pogz"}, {"analysis_status": 0, "articles": [{"content": "- 程序未正确处理用户上传的文件，从而导致程序可以读取、处理或存储未经授权的文件\n", "title": "什么是任意文件上传"}, {"content": "- 欺骗攻击：攻击者可以通过发送伪造的文件来欺骗程序，从而导致程序读取、处理或存储未经授权的文件。\n- 文件格式攻击：攻击者可以通过选择特定的文件格式，例如压缩文件或 ZIP 文件，从而利用上传的文件来篡改程序的执行结果或窃取程序中的重要数据。\n", "title": "任意文件上传常见的攻击方式"}, {"content": "- 使用安全文件传输协议 (FTP):使用安全 FTP 协议可以确保上传的文件格式、大小、权限等符合预期，同时可以防止文件读取、篡改或存储漏洞。\n- 使用文件上传过滤器：使用文件上传过滤器可以过滤上传的文件，以确保文件的格式、大小、权限等符合预期，同时可以防止文件读取、篡改或存储漏洞。\n- 使用白名单机制：使用白名单机制可以只允许特定的文件格式、大小、权限等存在的文件上传，从而防止非法文件的上传和攻击。\n- 定期更新和升级程序：定期更新和升级程序可以修复已知的漏洞，并增强程序的安全性。", "title": "如何预防任意文件上传"}], "cnvd_id": "", "cve_id": "CVE-2026-75496", "cvss": {"cvssv31": [{"source": "9119a7d8-5eab-497f-8521-727c672e3725", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.2}], "cvssv4": [{"source": "9119a7d8-5eab-497f-8521-727c672e3725", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-434", "description": "在将文件移动到可公开访问的目录之前，Webkul QloApps 不会对上传的文件扩展名或 MIME 类型执行正确的验证。具有管理权限的经过身份验证的远程攻击者可以上传可执行文件并实现远程代码执行。已在 153ec1c 中修复。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "任意文件上传", "kind_en": "危险类型文件无限制上传", "last_modified_time": "2026-08-26", "level": "High", "mps_id": "MPS-ygor-kliz", "poc": false, "poc_url": [], "published_time": "2026-08-26", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ygor-kliz", "name": "https://www.oscs1024.com/hd/MPS-ygor-kliz"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-75496", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-75496"}, {"url": "https://github.com/Qloapps/QloApps/pull/1801/commits/153ec1c856779 : "- 输入验证和限制：应用程序应对所有输入数据进行严格的验证和限制。确保输入数据的长度、格式和内容符合预期，避免超出缓冲区或访问非预期的内存区域。\n- 内存安全编程实践：开发人员应使用安全的编程实践，如避免使用不安全的函数、正确处理内存分配和释放操作，以及遵循最小特权原则。\n- 使用安全的编程语言和库：选择使用安全性较高的编程语言和库，这些语言和库在内存管理和安全性方面提供了更多的保护机制。\n- 定期进行代码审查和安全测试：定期审查应用程序的代码，并进行安全测试，以发现潜在的跨界内存读漏洞。使用静态代码分析工具和漏洞扫描工具来辅助检测和修复问题。\n- 实施防御性编程技术：应用程序应采用防御性编程技术，如使用随机化地址空间布局（ASLR）、堆栈保护机制（如堆栈溢出保护）和数据执行预防（DEP）等。\n- 及时更新和修补：及时应用程序和操作系统的安全更新和补丁，以确保已知的跨界内存读漏洞得到修复。及时更新相关软件和库，以避免使用已知存在漏洞的版本。", "title": "如何预防越界读取"}], "cnvd_id": "", "cve_id": "CVE-2026-64202", "cvss": {"cvssv31": [{"source": "security@ni.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}], "cvssv4": [{"source": "security@ni.com", "vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.5}]}, "cvss_score": 8.5, "cvss_vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-125", "description": "NI LabVIEW 是 National Instruments（现 Emerson）提供的闭源图形化编程与测控开发环境，用于仪器控制、数据采集和自动化测试。\n受影响版本中，用户打开恶意 VI 文件时，LabVIEW 在 LVGetFileType 函数中发生越界读取，造成内存损坏，可导致信息泄露或任意代码执行。\n修复版本中通过各支持版本线的官方安全补丁修复 LVGetFileType 中的越界读取，阻止打开恶意 VI 时再触发内存损坏。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界读取", "kind_en": "越界读取", "last_modified_time": "2026-08-26", "level": "High", "mps_id": "MPS-oia6-9jbg", "poc": false, "poc_url": [], "published_time": "2026-08-26", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-oia6-9jbg", "name": "https://www.oscs1024.com/hd/MPS-oia6-9jbg"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-64202", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-64202"}, {"url": "https://www.ni.com/ 防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-79992", "cvss": {"cvssv31": [{"source": "secalert@redhat.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-78", "description": "Emacs TRAMP 中发现一个缺陷。本地攻击者可以通过处理恶意制作的文件名来利用此漏洞。发生这种情况是因为 TRAMP 在没有进行适当清理的情况下连接登录参数，然后将其传递到本地 shell。成功利用可能会导致任意代码执行。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-08-26", "level": "High", "mps_id": "MPS-73tw-cb0j", "poc": false, "poc_url": [], "published_time": "2026-08-26", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-73tw-cb0j", "name": "https://www.oscs1024.com/hd/MPS-73tw-cb0j"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-79992", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-79992"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-79992", "name": ""}, {"url": "https://bugzilla.redhat.com/show_bug.cgi?id=2523665", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-79992漏洞", "_translated": true, "_saved_at": "2026-08-25T19:26:14+00:00", "_first_saved_at": "2026-08-25T19:26:14+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-73tw-cb0j"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-75770", "cvss": {"cvssv31": [{"source": "psirt@adobe.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "cwe": "CWE-787", "description": "Substance3D - Painter 受到越界写入漏洞的影响，该漏洞可能导致在当前用户的上下文中执行任意代码。利用此问题需要用户交互，受害者必须打开恶意文件。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-08-26", "level": "High", "mps_id": "MPS-j87k-l1s4", "poc": false, "poc_url": [], "published_time": "2026-08-26", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-j87k-l1s4", "name": "https://www.oscs1024.com/hd/MPS-j87k-l1s4"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-75770", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-75770"}, {"url": "https://helpx.adobe.com/security/products/substance3d_painter/apsb26-129.html", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-75770漏洞", "_translated": true, "_saved_at": "2026-08-25T19:26:29+00:00", "_first_saved_at": "2026-08-25T19:26:29+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-j87k-l1s4"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-75768", "cvss": {"cvssv31": [{"source": "psirt@adobe.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "cwe": "CWE-426", "description": "Substance3D - Painter 受到不受信任的搜索路径漏洞的影响，该漏洞可能导致在当前用户的上下文中执行任意代码。攻击者可以利用此漏洞执行任意代码。利用此问题需要用户交互，受害者必须打开恶意文件。", "effects": [], "epss": -1, "exp": false, "ex 作区 Markdown、第三方 SSP 或 YAML 查找表中的不可信内容，交给非沙箱 jinja2.Environment 对应的 Parser 再次解析为模板源码。攻击者可在被 include 的 Markdown 中写入 Jinja 表达式，沿 Python 对象链访问 __globals__，在 Trestle 进程上下文中执行任意操作系统命令。\n修复版本中通过将二次解析改到 SandboxedEnvironment，并在 JinjaCmd._create_jinja_environment 中改用沙箱环境，阻断对 __class__、__globals__ 等危险属性的访问，切断模板注入到命令执行的路径。", "effects": [{"comp_name": "compliance-trestle", "ecosystem": "pip", "versions": [{"affected_version": "(-∞,3.12.4)", "min_fixed_version": "3.12.4", "repository": "pip", "solutions": [], "upstream": true}, {"affected_version": "[4.0.0,4.1.0)", "min_fixed_version": "4.1.0", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "代码注入", "kind_en": "代码生成控制不当（“代码注入”）", "last_modified_time": "2026-08-26", "level": "High", "mps_id": "MPS-q3ug-1en0", "poc": false, "poc_url": [], "published_time": "2026-08-26", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-q3ug-1en0", "name": "https://www.oscs1024.com/hd/MPS-q3ug-1en0"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-54757", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-54757"}, {"url": "https://github.com/oscal-compass/compliance-trestle/commit/0f82d19bd42f9cc0f1b3acd7fc3f6dafe3b6ae10", "name": ""}, {"url": "https://github.com/oscal-compass/compliance-trestle/commit/5335ff873a2a68eb7de43df029bea09cadff22fd", "name": ""}, {"url": "https://github.com/oscal-compass/compliance-trestle/security/advisories/GHSA-jw39-3688-r4rx", "name": ""}], "scope_influence": "", "tags": ["python", "开源"], "title": "Trestle模板注入漏洞", "_translated": true, "_saved_at": "2026-08-26T04:34:02+00:00", "_first_saved_at": "2026-08-26T00:56:16+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-q3ug-1en0"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-75769", "cvss": {"cvssv31": [{"source": "psirt@adobe.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "cwe": "CWE-122", "description": "Substance3D - Painter 受到基于堆的缓冲区溢出漏洞的影响，该漏洞可能导致在当前用户的上下文中执行任意代码。利用此问题需要用户交互，受害者必须打开恶意文件。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "堆缓冲区溢出", "kind_en": "基于堆的缓冲区溢出", "last_modified_time": "2026-08-26", "level": "High", "mps_id": "MPS-tm7h-3w5n", "poc": false, "poc_url": [], "published_time": "2026-08-26", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-tm7h-3w5n", "name": "https://www.oscs1024.com/hd/MPS-tm7h-3w5n"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-75769", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-75769"}, {"url": "https://helpx.adobe.com/security/products/substance3d_painter/apsb26-129.html", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-75769漏洞", "_translated": true, "_saved_at": "2026-08-25T19:26:21+00:00", "_first_saved_at": "2026-08-25T19:26:21+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-tm7h-3w5n"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过构造恶意的数据，将过多的数据输入到程序的缓冲区中，使得缓冲区的空间被填满，从而溢出到程序的栈 (stack) 或堆 (heap) 中，导致程序崩溃、拒绝服务、数据泄露等安全问题。\n", "title": "什么是经典缓冲区溢出"}, {"content": "| 类型        | 描述                                                         |\n| ----------- | ------------------------------------------------------------ |\n| 代码注入攻击      | 攻击者通过向程序的缓冲区输入恶意代码，从而控制程序执行流程，实现对程序操作的恶意操作。例如，攻击者可以通过向 Web 应用程序的输入框中输入恶意代码，从而执行任意的代码，破坏系统、窃取数据等。 |\n| 数据覆盖攻击      | 攻击者通过向程序的缓冲区输入过多的数据，从而覆盖程序中的重要数据或代码，实现对程序操作的恶意操作。例如，攻击者可以通过向聊天应用程序的输入框中输入过多的表情符号，从而覆盖程序中的重要数据，例如聊天消息、账号密码等。 |\n| 栈溢出攻击 | 攻击者通过向程序的栈中输入过多的数据，从而溢出到栈外部，实现对程序操作的恶意操作。例如，攻击者可以通过向游戏应用程序的输入框中输入过多的道具名称，从而覆盖程序中的重要数据，例如游戏数据、账号密码等。 |\n| 堆溢出攻击       | 攻击者通过向程序的堆中输入过多的数据，从而溢出到堆外部，实现对程序操作的恶意操作。例如，攻击者可以通过向操作系统工具的输入框中输入过多的命令，从而覆盖程序中的重要数据，例如系统文件、配置文件等。 |", "title": "经典缓冲区溢出常见的攻击方式"}, {"content": "- 输入验证：在程序输入处对输入数据进行严格的验证和过滤，确保输入数据符合预期的格式和类型，避免被攻击者注入恶意命令或数据。可以使用正则表达式、格式字符串等方式进行输入验证。\n- 输出过滤：在程序输出处对输出数据进行严格的过滤和检查，确保输出数据符合预期的格式和类型，避免被攻击者截获和篡改。可以使用安全的输出过滤库等方式进行输出过滤。\n- 使用安全的编程模型：使用安全的编程模型，例如避免使用原生的缓冲区管理函数，使用安全的框架和库来处理输入数据和执行命令，避免缓冲区溢出漏洞。\n- 数据库加密和访问控制：对于敏感数据和命令，使用加密和访问控制措施，确保只有授权用户可以访问和执行命令，避免被攻击者窃取和篡改。\n- 定期更新和升级：定期更新和升级应用程序和库的版本，确保应用程序和库的最新版本包含了最新的安全补丁和修复措施，避免安全漏洞的出现和利用。\n- 安全审计和监控：定期对系统和应用程序进行安全审计和监控，及时发现和阻止潜在的安全漏洞和攻击，确保系统和数据的安全和可靠性。", "title": "如何预防经典缓冲区溢出"}], "cnvd_id": "", "cve_id": "CVE-2026-80186", "cvss": {"cvssv31": [{"source": "secalert@redhat.com", "vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:U/C:L/I:L/A:H", "severity": "high", "base_score": 7.6}]}, "cvss_score": 7.6, "cvss_vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:U/C:L/I:L/A:H", "cwe": "CWE-120", "description": "BlueZ 是开源 Linux 蓝牙协议栈，提供 bluetoothd 守护进程及主机侧协议实现，用于设备发现、配对与配置文件通信。\n受影响版本中，蓝牙发现路径会把远程设备 Extended Inquiry Response 中的名称字段交给 eir_parse，再传入 name2utf8。name2utf8 在 250 字节栈缓冲 utf8_name 上调用 strncpy，且未将 len 限制为 HCI_MAX_NAME_LENGTH；当名称字段 field_len 为 254 时，拷贝长度可达 253 字节，造成 3 字节栈溢出，可导致 bluetoothd 崩溃，并可能进一步执行任意代码。\n修复版本中通过在 name2utf8 中执行 len = MIN(len, HCI_MAX_NAME_LENGTH)，将拷贝长度限制在 248 字节以内，使超长 EIR 设备名无法越过栈缓冲边界，从而阻断该溢出路径。", "effects": [{"comp_name": "bluez", "ecosystem": "linux", "versions": [{"affected_version": "[5.86,5.87]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "经典缓冲区溢出", "kind_en": "不检查输入大小的缓冲区复制（“经典缓冲区溢出”）", "last_modified_time": "2026-08-26", "level": "High", "mps_id": "MPS-elyz-f327", "poc": false, "poc_url": [], "published_time": "2026-08-26", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-elyz-f327", "name": "https://www.oscs1024.com/hd/MPS-elyz-f327"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-80186", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-80186"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-80186", "name": ""}, {"url": "https://bugzilla.redhat.com/show_bug.cgi?id=2524132", "name": ""}, {"url": "https://github.com/bluez/bluez/security/advisories/GHSA-68h6-5qgp-3975", "name": ""}], "scope_influence": "", "tags": [], "title": "BlueZ EIR栈溢出漏洞", "_translated": true, "_saved_at": "2026-08-26T02:23:09+00:00", "_first_saved_at": "2026-08-26T00:56:21+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-elyz-f327"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-80182", "cvss": {"cvssv4": [{"source": "cve@mitre.org", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:L/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.6}]}, "cvss_score": 7.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:L/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-863", "description": "In OpenStack Keystone before 29.0.3, tokens obtained via OAuth1 access token, application credential, or trust-scoped authentication could create new long-lived credentials or authorize new delegations that persist independently of, and outlive, the credential used to obtain them. The delegation restrictions that block these operations did not consistently apply to all delegated token types, allowing an OAuth1-scoped token, for example, to create application credentials or authorize OAuth1 request tokens despite those operations being restricted for other delegated token types. All Keystone deployments that permit delegated authentication through OAuth1 access tokens, application credentials, or trusts are affected.", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-08-26", "level": "High", "mps_id": "MPS-fta2-hk40", "poc": false, "poc_url": [], "published_time": "2026-08-26", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-fta2-hk40", "name": "https://www.oscs1024.com/hd/MPS-fta2-hk40"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-80182", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-80182"}, {"url": "https://launchpad.net/bugs/2153453", "name": ""}, {"url": "https://security.openstack.org/ossa/OSSA-2026-037.html", "name": ""}, {"url": "https://www.openwall.com/lists/oss-security/2026/08/25/5", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-80182漏洞", "_translated": true, "_saved_at": "2026-08-26T04:34:02+00:00", "_first_saved_at": "2026-08-26T00:56:20+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-fta2-hk40"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-80184", "cvss": {"cvssv4": [{"source": "cve@mitre.org", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:L/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.6}]}, "cvss_score": 7.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:L/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-863", "description": "OpenStack Keystone 是开源身份认证服务，用于签发令牌、绑定项目范围，并管理 application credential、OAuth1 访问令牌和 trust 等委托凭据。\n受影响版本中，攻击者可将已通过 application credential、OAuth1 访问令牌或 trust 获得的委托令牌提交到 POST /v3/auth/tokens 的 token 认证方法。AuthTokenResource.post 读取请求体中的 auth 数据后，token_authenticate() 对 trust 与 OAuth1 令牌会拒绝再签发，但对 application_credential 令牌只在请求显式 scope 时拦截；省略 scope 时会按凭据所有者的 default_project_id 签发新令牌，使原本绑定项目 A 的委托凭据获得项目 B 的访问能力。\n修复版本中通过在 token_authenticate() 调用 delegation.is_delegated_method(token)，将非主认证方法签发的委托令牌一律拒绝再认证，切断省略 scope 后回落到所有者默认项目的路径。该修复依赖配套补丁提供的委托分类逻辑和 [auth] additional_primary_auth_methods 配置，需成套应用。", "effects": [{"comp_name": "keystone", "ecosystem": "pip", "versions": [{"affected_version": "[13.0.0,27.0.3)", "min_fixed_version": "27.0.3", "repository": "pip", "solutions": [], "upstream": true}, {"affected_version": "[28.0.0,28.0.3)", "min_fixed_version": "28.0.3", "repository": "pip", "solutions": [], "upstream": true}, {"affected_version": "[29.0.0,29.0.3)", "min_fixed_version": "29.0.3", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-08-26", "level": "High", "mps_id": "MPS-y7zm-hsck", "poc": false, "poc_url": [], "published_time": "2026-08-26", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-y7zm-hsck", "name": "https://www.oscs1024.com/hd/MPS-y7zm-hsck"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-80184", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-80184"}, {"url": "https://launchpad.net/bugs/2158538", "name": ""}, {"url": "https://security.openstack.org/ossa/OSSA-2026-037.html", "name": ""}, {"url": "https://www.openwall.com/lists/oss-security/2026/08/25/5", "name": ""}], "scope_influence": "", "tags": ["python", "开源"], "title": "Keystone委托令牌越权", "_translated": true, "_saved_at": "2026-08-26T02:23:08+00:00", "_first_saved_at": "2026-08-26T02:23:08+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-y7zm-hsck"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能有效地控制资源的使用，导致攻击者可以利用这个漏洞耗尽应用程序所依赖的资源。这些资源可以是计算资源（CPU、内存）、网络带宽、数据库连接或其他系统资源。攻击者可以通过发送特制的请求、恶意输入或其他方式，使应用程序消耗大量资源，导致拒绝服务或系统崩溃。", "title": "什么是拒绝服务"}, {"content": "- 消耗计算资源：攻击者可以发送计算密集型的请求，例如复杂的计算、无限循环或递归操作，以耗尽应用程序的计算资源，导致应用程序无法响应其他请求。\r\n- 消耗内存资源：攻击者可以发送大量的数据或恶意输入，以导致应用程序消耗过多的内存资源，从而使系统的可用内存耗尽，并导致应用程序崩溃或变得不可用。\r\n- 消耗网络带宽：攻击者可以发送大量的请求或大型数据包，以消耗应用程序所依赖的网络带宽。这会导致其他合法用户无法正常访问应用程序或降低系统的整体网络性能。\r\n- 消耗存储资源：攻击者可以发送大量的请求或上传大文件，以耗尽应用程序的存储资源，导致系统无法处理其他请求或存储新的数据。", "title": "拒绝服务常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对输入数据进行合理的验证和过滤，防止恶意输入导致资源消耗过高。\r\n- 实施资源限制：应用程序应该实施适当的资源限制策略，例如限制计算操作的时间或次数，限制内存使用量，限制并发连接数等，以防止资源被耗尽。\r\n- 异常处理与错误恢复：应用程序应该具备健壮的异常处理和错误恢复机制，以防止因意外错误导致资源泄漏或无法释放的情况。\r\n- 资源监控与警报：应用程序应该实施适当的资源监控和警报机制，及时发现异常的资源消耗情况，并采取相应的措施来应对。\r\n- 压力测试与性能优化：应用程序应该进行压力测试，以评估其在高负载情况下的性能，并进行必要的性能优化，以确保能够有效地处理大量请求而不耗尽资源。", "title": "如何预防拒绝服务"}], "cnvd_id": "", "cve_id": "CVE-2026-68763", "cvss": {}, "cvss_score": 7.5, "cvss_vector": "", "cwe": "CWE-400", "description": "Apache Tomcat 是 Apache 软件基金会发布的开源 Java Servlet 容器与 Web 服务器，用于托管 Java Web 应用，并可通过 Http2Protocol 提供 HTTP/2。\n受影响版本中，HTTP/2 连接在连接级流量窗口不足时，会把尚未获得完整窗口分配的流放入 Http2UpgradeHandler 的 backlog，并用 backLogSize 累计待分配字节。客户端发送 RST_STREAM 重置仍处于 backlog 中的流时，replaceStream 未将该流移出 backlog，也未把已授予但未使用的 connectionAllocationMade 归还连接窗口；allocate 在完成部分分配后也未扣减 backLogSize。攻击者可在耗尽连接窗口后反复创建并重置流，使窗口与 backlog 记账持续泄漏，最终造成拒绝服务。\n修复版本中通过在 replaceStream 中移除已重置流及其未完成分配请求并归还剩余窗口、在 allocate 中同步减少 backLogSize，以及在 reserveWindowSize 中拒绝向已关闭流发放窗口、避免重复入队，切断该分配泄漏路径。", "effects": [{"comp_name": "org.apache.tomcat.embed:tomcat-embed-core", "ecosystem": "maven", "versions": [{"affected_version": "[11.0.0-M1,11.0.25)", "min_fixed_version": "11.0.25", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[9.0.39,9.0.121)", "min_fixed_version": "9.0.121", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[8.5.59,8.5.100]", "min_fixed_version": "", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[10.1.0-M1,10.1.58)", "min_fixed_version": "10.1.58", "repository": "maven", "solutions": [], "upstream": true}]}, {"comp_name": "tomcat", "ecosystem": "linux", "versions": [{"affected_version": "[11.0.0-M1,11.0.25)", "min_fixed_version": "11.0.25", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[10.1.0-M1,10.1.58)", "min_fixed_version": "10.1.58", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[9.0.39,9.0.121)", "min_fixed_version": "9.0.121", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[8.5.59,8.5.100]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "拒绝服务", "kind_en": "不受控制的资源消耗", "last_modified_time": "2026-08-26", "level": "High", "mps_id": "MPS-6d7a-972e", "poc": false, "poc_url": [], "published_time": "2026-08-26", "reference_url_list": [{"url": "http://www.mail-archive.com/announce@apache.org/msg11780.html", "name": ""}, {"url": "https://lists.apache.org/thread/tv51ty39ppv41v04hdtkp9dp7tg02nzl", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-68763", "name": ""}, {"url": "https://tomcat.apache.org/security-11.html", "name": ""}, {"url": "https://tomcat.apache.org/security-10.html", "name": ""}, {"url": "https://tomcat.apache.org/security-9.html", "name": ""}, {"url": "https://github.com/apache/tomcat/commit/2a5ec806971627943db18601203129d9c58d959f", "name": ""}, {"url": "https://github.com/apache/tomcat/commit/19d40615620fe145e88536e2bd63c5f01077c253", "name": ""}, {"url": "https://github.com/apache/tomcat/commit/0747dd58cc631f90e044df246bd2ede6e2b48250", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "Tomcat HTTP/2拒绝服务漏洞", "_translated": true, "_saved_at": "2026-08-25T23:19:36+00:00", "_first_saved_at": "2026-08-25T22:19:40+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-6d7a-972e"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-55099", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-407", "description": "icalendar 是开源 Python 库，用于按 RFC 5545 解析和生成 iCalendar 文件，供日历同步、邀请处理和日程导入等场景使用。\n受影响版本中，Component.from_ical 接受任意嵌套的 BEGIN:VEVENT 且不限制深度。Component.__eq__ 用两次成员资格循环比较 subcomponents，每次 in 检测都会对子组件再次调用 __eq__，相对嵌套深度呈 O(2^n)。攻击者提交含相同深层嵌套子树的短小 .ics 后，应用一旦执行相等、不等、成员资格、去重或往返比较，即可长时间占用 CPU 并造成拒绝服务。单独解析不会触发该问题。\n修复版本中通过将 Component.__eq__ 改为显式栈迭代比较，使每对嵌套组件只比较一次，把时间复杂度降为线性，并保持原有多重集等价与交换律语义。", "effects": [{"comp_name": "icalendar", "ecosystem": "pip", "versions": [{"affected_version": "[7.1.0,7.1.3)", "min_fixed_version": "7.1.3", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "低效算法复杂性", "kind_en": "低效的算法复杂性", "last_modified_time": "2026-08-26", "level": "High", "mps_id": "MPS-phtg-de6o", "poc": false, "poc_url": [], "published_time": "2026-08-26", "reference_url_list": [{"url": "https://github.com/collective/icalendar/security/advisories/GHSA-cv84-9p8j-fj68", "name": ""}, {"url": "https://github.com/collective/icalendar/commit/b6b2608ae3af6de40695b4e40f71847485aa0b49", "name": ""}, {"url": "https://github.com/collective/icalendar/commit/cad40cd112c93fd142ec12cc5b37445a849b8a79", "name": ""}, {"url": "https://github.com/collective/icalendar/releases/tag/v7.1.3", "name": ""}, {"url": "https://github.com/advisories/GHSA-cv84-9p8j-fj68", "name": ""}], "scope_influence": "", "tags": ["python", "开源"], "title": "icalendar相等比较拒绝服务", "_translated": true, "_saved_at": "2026-08-25T21:21:03+00:00", "_first_saved_at": "2026-08-25T21:21:03+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-phtg-de6o"}, {"analysis_status": 3, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "cnvd_id": "", "cve_id": "CVE-2026-56684", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.5}, {"source": "murphysec", "vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-416", "description": "Valkey 是 Redis 协议兼容的开源内存键值数据库。同源 TLS 连接层同样存在于 Redis。启用 TLS 时，服务端用 pending 列表跟踪仍有已解密但未消费数据的连接。\n受影响版本中，tlsProcessPendingData() 使用 listIter/listNext 遍历 pending_list，而 listNext 会预先缓存下一节点指针。当某连接的读处理路径执行 CLIENT KILL（或等价地关闭另一 pending 连接）时，freeClient → connTLSClose → listDelNode 可同步释放迭代器已缓存的下一节点，随后 listNext 解引用已释放内存，造成认证后远程拒绝服务，并在堆布局可控时可能发展为远程代码执行。\n修复版本中通过在调用 tlsHandleEvent 之前将连接从 pending_list 头部摘下（不再跨 handler 持有 listIter 缓存的 next），使 handler 同步释放其他节点时不会留下悬空迭代器，从而切断该释放后使用路径。", "effects": [{"comp_name": "redis", "ecosystem": "linux", "versions": [{"affected_version": "[8.4.0,8.4.6)", "min_fixed_version": "8.4.6", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[8.8.0,8.8.2)", "min_fixed_version": "8.8.2", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.2.0,6.2.24)", "min_fixed_version": "6.2.24", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[7.2.0,7.2.16)", "min_fixed_version": "7.2.16", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[8.6.0,8.6.6)", "min_fixed_version": "8.6.6", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[7.4.0,7.4.11)", "min_fixed_version": "7.4.11", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[8.10.0,8.10.1)", "min_fixed_ ": [], "title": "CVE-2026-74932漏洞", "_translated": true, "_saved_at": "2026-08-26T04:34:02+00:00", "_first_saved_at": "2026-08-25T21:20:56+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-y7mq-3jb1"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-41707", "cvss": {"cvssv31": [{"source": "security@vmware.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:N", "severity": "high", "base_score": 7.4}]}, "cvss_score": 7.4, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:N", "cwe": "CWE-294", "description": "Spring Security 是 Spring 生态中广泛使用的安全框架，oauth2-jose 模块提供 JWT 与 DPoP（Demonstrating Proof of Possession）相关能力。DPoPProofJwtDecoderFactory 是处理 DPoP 证明 JWT 的工厂实现，属于 spring-security-oauth2-jose 工件。\n受影响版本中，DPoPProofJwtDecoderFactory 内部使用 Collections.synchronizedMap(new JtiCache()) 缓存 DPoP 证明 JWT 的 jti 哈希以抵御重放，其中 JtiCache 继承 LinkedHashMap 并将 MAX_SIZE 固定为 1000，仅依赖 removeEldestEntry 在超出容量或条目过期（iat + 1 小时）时淘汰。攻击者只要截获一次合法用户的有效 DPoP 证明，即可向同一 jti 缓存所在服务持续发送大量伪造 jti 的请求以撑爆 LinkedHashMap，迫使目标合法 jti 被淘汰，之后再次提交截获的 DPoP 证明即可通过校验，伪装成受害者访问受保护资源。\n修复版本中通过新增独立的 DPoPProofReplayValidator 替换原 JtiClaimValidator：把缓存抽象为可注入的 Cache 接口，默认的 InMemoryCache 基于 ConcurrentHashMap，maxSize 默认提升到 100000，并新增按 JWK thumbprint 计数的 maxRequestsPerKey（默认 1000）和每 10 秒一次的过期清理循环，使攻击者无法仅靠并发填充就把目标合法 jti 挤出缓存。", "effects": [{"comp_name": "org.springframework.security:spring-security-oauth2-jose", "ecosystem": "maven", "versions": [{"affected_version": "[6.5.0,6.5.12)", "min_fixed_version": "6.5.12", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[7.0.0,7.0.7)", "min_fixed_version": "7.0.7", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[7.1.0,7.1.1)", "min_fixed_version": "7.1.1", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "使用捕获-重放进行的认证绕过", "kind_en": "通过捕获重放绕过身份验证", "last_modified_time": "2026-08-21", "level": "High", "mps_id": "MPS-4709-1dad", "poc": false, "poc_url": [], "published_time": "2026-08-26", "reference_url_list": [{"url": "https://spring.io/security/cve-2026-41707", "name": ""}, {"url": "https://github.com/spring-projects/spring-security/commit/6b2f892e66f69b1dd94abe5a78ac416043c6474e", "name": ""}], "scope_influence": "", "tags": [], "title": "Spring Security DPoPProofJwtDecoderFactory DPoP 证明重放漏洞", "_translated": true, "_saved_at": "2026-08-26T03:48:46+00:00", "_first_saved_at": "2026-08-26T00:56:18+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-4709-1dad"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-65927", "cvss": {}, "cvss_score": 7.4, "cvss_vector": "", "cwe": "CWE-193", "description": "Apache Tomcat 是 Apache 软件基金会维护的开源 Java Servlet 容器，RewriteValve 用于按 rewrite 规则对请求 URI 执行类似 Apache HTTP Server mod_rewrite 的重写处理。\n受影响版本中，RewriteValve.invoke 处理带 [N] 标志的重写规则时存在 off-by-one 错误：规则匹配后将循环下标设为 0 再 continue，for 循环随后自增，使重写处理从第二条规则而非第一条重新开始。攻击者发送可命中 [N] 规则的 HTTP 请求后，第一条用于访问控制的规则会被跳过，造成访问控制绕过。\n修复版本中通过将 [N] 匹配后的循环下标改为 -1，使 continue 之后从第一条规则重新执行，恢复从规则列表起始处重启重写的正确语义，避免访问控制规则被跳过。", "effects": [{"comp_name": "tomcat", "ecosystem": "linux", "versions": [{"affected_version": "[10.1.0-M1,10.1.58)", "min_fixed_version": "10.1.58", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[9.0.0.M1,9.0.121)", "min_fixed_version": "9.0.121", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[11.0.0-M1,11.0.25)", "min_fixed_version": "11.0.25", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "Off-by-one错误", "kind_en": "Off-by-one Error", "last_modified_time": "2026-08-26", "level": "High", "mps_id": "MPS-ab22-27af", "poc": false, "poc_url": [], "published_time": "2026-08-26", "reference_url_list": [{"url": "http://www.mail-archive.com/announce@apache.org/msg11776.html", "name": ""}, {"url": "https://tomcat.apache.org/security-11.html", "name": ""}, {"url": "https://tomcat.apache.org/security-10.html", "name": ""}, {"url": "https://tomcat.apache.org/security-9.html", "name": ""}, {"url": "https://github.com/apache/tomcat/commit/bce83410ffb1542752d52b536257e81a5c8dfcb8", "name": ""}, {"url": "https://github.com/apache/tomcat/commit/b80929d65be774dc90e378acdda2d16949d1e5f3", "name": ""}, {"url": "https://github.com/apache/tomcat/commit/3097902177a041a93476a036b9c8419b25d5cc0d", "name": ""}, {"url": "https://github.com/apache/tomcat/commit/ffa86dc683645f784e36ec87236d51ea866dcadf", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Tomcat重写访问绕过", "_translated": true, "_saved_at": "2026-08-25T23:19:39+00:00", "_first_saved_at": "2026-08-25T22:19:43+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ab22-27af"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-45019", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "cwe": "CWE-918", "description": "Chainlit 是开源 Python 框架，用于构建生产级对话式人工智能应用，提供聊天界面、会话通道，以及将 MCP 工具接入对话流程的能力。\n受影响版本中，部署在 .chainlit/config.toml 将 features.mcp.enabled 设为 true 后，未认证客户端即可调用 POST /mcp。ConnectSseMCPRequest 与 ConnectStreamableHttpMCPRequest 把 url 定义为无约束字符串，connect_mcp 再把该 url 与可选 headers 直接交给 sse_client() 或 streamablehttp_client()，缺少协议校验、私网过滤和白名单。服务端会对任意内网或外部地址发起盲 SSRF，并转发攻击者控制的 Authorization、Cookie 等请求头，可用于改写内部接口、发现服务、扫描端口和探测云元数据。SSE 目标自 2.4.0rc0 起即可被指定，2.6.4 起增加 streamable-http 与请求头转发。\n修复版本中通过将用户提供的 SSE/streamable-http 连接改为默认拒绝，仅在 features.mcp.user_servers.enabled 为 true 且 allowed_urls 非空时放行，并在 connect_mcp 中调用 validate_mcp_url() 与 validate_mcp_headers()，把出站目标限制为白名单内的 http/https URL，同时剥离 Cookie、Host、Forwarded 等受限头，切断任意 URL 进入 MCP 传输层。", "effects": [{"comp_name": "chainlit", "ecosystem": "pip", "versions": [{"affected_version": "[2.4.0rc0,2.12.0)", "min_fixed_version": "2.12.0", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SSRF", "kind_en": "服务器端请求伪造 (SSRF)", "last_modified_time": "2026-08-26", "level": "High", "mps_id": "MPS-s451-vj62", "poc": false, "poc_url": [], "published_time": "2026-08-26", "reference_url_list": [{"url": "https://github.com/Chainlit/chainlit/security/advisories/GHSA-hvfh-5mj3-5f3j", "name": ""}, {"url": "https://github.com/Chainlit/chainlit/commit/0565fd0eccb915fce159929598b053ed79f6e0c9", "name": ""}, {"url": "https://github.com/Chainlit/chainlit/blob/2.12.0/docs/security-advisory-2026-mcp.md#spl-2026-002--ssrf-via-mcp-streamable-http--sse", "name": ""}, {"url": "https://github.com/Chainlit/chainlit/releases/tag/2.12.0", "name": ""}, {"url": "https://github.com/advisories/GHSA-hvfh-5mj3-5f3j", "name": ""}], "scope_influence": "", "tags": ["AI", "python", "开源"], "title": "Chainlit MCP SSRF漏洞", "_translated": true, "_saved_at": "2026-08-25T21:21:06+00:00", "_first_saved_at": "2026-08-25T21:21:06+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-s451-vj62"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-68513", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:N/I:H/A:H", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:N/I:H/A:H", "cwe": "CWE-787", "description": "OpenEXR is the reference implementation and specification for the EXR image format, widely used in the motion picture industry. Versions 3.3.0 through 3.3.12 and 3.4.0 through 3.4.13 contain a heap buffer overflow in PyOpenEXR triggered by a channel-name key collision between literal and prefixed RGB channels. When separate_channels=false, PyOpenEXR maps each physical channel name through channelNameToRGBA() and coalesces the results into a shared RGB array. A crafted flat scanline EXR that contains both a literal channel such as left and prefixed channels such as left.R, left.G, and left.B causes these names to collide, so the wrapper reuses an undersized two-dimensional NumPy array for the coalesced RGB slices and writes out of bounds when OpenEXR.File(path) decodes the pixels. This issue is fixed in versions 3.3.13 and 3.4.14.", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-08-26", "level": "High", "mps_id": "MPS-2yj4-lexc", "poc": false, "poc_url": [], "published_time": "2026-08-26", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-2yj4-lexc", "name": "https://www.oscs1024.com/hd/MPS-2yj4-lexc"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-68513", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-68513"}, {"url": "https://github.com/AcademySoftwareFoundation/openexr/commit/c1f3ec0d91cfa5a8035ecd00920835ac76e01640", "name": ""}, {"url": "https://github.com/AcademySoftwareFoundation/openexr/commit/d134e3cd81a2e343f2919e86bf949f576b1ab16a", "name": ""}, {"url": "https://github.com/AcademySoftwareFoundation/openexr/security/advisories/GHSA-rw5h-3q4v-c3vc", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-68513漏洞", "_translated": true, "_saved_at": "2026-08-26T04:34:02+00:00", "_first_saved_at": "2026-08-25T21:21:00+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-2yj4-lexc"}, {"analysis_status": 0, "articles": [{"content": "跨界内存读是指应用程序在读取内存时，未正确验证或限制读取的内存范围。攻击者利用这种漏洞可以读取应用程序内存中的敏感数据，如密码、加密密钥、会话令牌等。常见的原因是由于缓冲区溢出、格式化字符串漏洞或其他内存错误导致的。", "title": "什么是越界读取"}, {"content": "攻击者可以通过不当构造的输入来触发跨界内存读漏洞。攻击者可能会通过向应用程序发送特定的输入，使其读取超过预期的内存区域。攻击者可以利用这个漏洞来获取敏感信息，如其他用户的数据、操作系统的敏感数据或应用程序的内部状态。", "title": "越界读取常见的攻击方式"}, {"content": "- 输入验证和限制：应用程序应对所有输入数据进行严格的验证和限制。确保输入数据的长度、格式和内容符合预期，避免超出缓冲区或访问非预期的内存区域。\n- 内存安全编程实践：开发人员应使用安全的编程实践，如避免使用不安全的函数、正确处理内存分配和释放操作，以及遵循最小特权原则。\n- 使用安全的编程语言和库：选择使用安全性较高的编程语言和库，这些语言和库在内存管理和安全性方面提供了更多的保护机制。\n- 定期进行代码审查和安全测试：定期审查应用程序的代码，并进行安全测试，以发现潜在的跨界内存读漏洞。使用静态代码分析工具和漏洞扫描工具来辅助检测和修复问题。\n- 实施防御性编程技术：应用程序应采用防御性编程技术，如使用随机化地址空间布局（ASLR）、堆栈保护机制（如堆栈溢出保护）和数据执行预防（DEP）等。\n- 及时更新和修补：及时应用程序和操作系统的安全更新和补丁，以确保已知的跨界内存读漏洞得到修复。及时更新相关软件和库，以避免使用已知存在漏洞的版本。", "title": "如何预防越界读取"}], "cnvd_id": "", "cve_id": "CVE-2026-59189", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:L/I:N/A:H", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:L/I:N/A:H", "cwe": "CWE-125", "description": "OpenEXR 是 EXR 图像格式的参考实现和规范，广泛应用于电影行业。在 OpenEXRUtil 版本 3.3.0 到 3.3.12 以及 3.4.0 到 3.4.12 中，当深度图像具有非零 dataWindow 原点时，已记录的 TypedDeepImageChannel\u003cT\u003e::row() API 可能会返回越界指针，从而导致堆越界读取和崩溃，并在受控堆布局下可能导致信息泄露。出现该缺陷的原因是 ImfDeepImageChannel 使用两个相互冲突的坐标模型：at(x, y) 使用绝对坐标（_base 偏移量为 dataWindow.min），而 row(r) 被记录为基于 0 的逻辑访问。因此，对于非零 dataWindow.min，row(0) 指向 _sampleListPointers 分配之外，而不是第一个逻辑行。此问题已在版本 3.3.13 和 3.4.13 中修复。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界读取", "kind_en": "越界读取", "last_modified_time": "2026-08-26", "level": "High", "mps_id": "MPS-9ipb-f73y", "poc": false, "poc_url": [], "published_time": "2026-08-26", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-9ipb-f73y", "name": "https://www.oscs1024.com/hd/MPS-9ipb-f73y"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-59189", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-59189"}, {"url": "https://github.com/AcademySoftwareFoundation/openexr/commit/37f03b6ed90f3dd9910f31de3a40f25f2bc2aca1", "name": ""}, {"url": "https://github.com/AcademySoftwareFoundation/openexr/commit/55b7958ecb5ac32c427ff39c1e063f6f7bbee77c", "name": ""}, {"url": "https://github.com/AcademySoftwareFoundation/openexr/commit/aef02224ba282a802de65d16c49c1cdb82089dec", "name": ""}, {"url": "https://github.com/AcademySoftwareFoundation/openexr/security/advisories/GHSA-hwmv-39v6-739m", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-59189漏洞", "_translated": true, "_saved_at": "2026-08-25T18:31:18+00:00", "_first_saved_at": "2026-08-25T18:31:18+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-9ipb-f73y"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-68515", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:N/I:H/A:H", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:N/I:H/A:H", "cwe": "CWE-787", "description": "OpenEXR is the reference implementation and specification for the EXR image format, widely used in the motion picture industry. In versions before 3.2.11, 3.3.0 through 3.3.12, and 3.4.0 through 3.4.13, exrmultiview can write past a heap allocation when it combines two attacker-supplied, individually valid scanline EXR files whose union dataWindow is not aligned to one view's channel subsampling. The utility allocates sampled channel storage using a truncated union_width / xSampling, then reads the sampled input through a Slice based on the misaligned union window, producing a heap out-of-bounds write. The trigger is normal public-tool processing, such as exrmultiview left A.exr right B.exr out.exr with crafted but valid inputs, so this is not solely an API or caller-precondition issue. This issue is fixed in versions 3.2.11, 3.3.13, and 3.4.14.", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-08-26", "level": "High", "mps_id": "MPS-gyt8-a3fk", "poc": false, "poc_url": [], "published_time": "2026-08-26", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-gyt8-a3fk", "name": "https://www.oscs1024.com/hd/MPS-gyt8-a3fk"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-68515", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-68515"}, {"url": "https://github.com/AcademySoftwareFoundation/openexr/commit/77ee19c021398b1c56f32c3af8347e365dbd4f33", "name": ""}, {"url": "https://github.com/AcademySoftwareFoundation/openexr/commit/c644ac2dfeac82939c81a8551d6f4b7859f63add", "name": ""}, {"url": "https://github.com/AcademySoftwareFoundation/openexr/commit/e2300a3d54a93d20a36a86b82f3a506c4c91476f", "name": ""}, {"url": "https://github.com/AcademySoftwareFoundation/openexr/security/advisories/GHSA-gjf7-wjjw-xq56", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-68515漏洞", "_translated": true, "_saved_at": "2026-08-26T04:34:02+00:00", "_first_saved_at": "2026-08-25T21:20:58+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-gyt8-a3fk"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-79775", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:N/A:H", "severity": "medium", "base_score": 6.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-129", "description": "rclone 是开源命令行与服务程序，用于在多种存储之间同步、挂载和对外提供文件访问，其中 archive 后端可将 SquashFS 等归档作为远程文件系统读取。\n受影响版本中，backend/archive/squashfs 的 New 将远程 .sqfs 镜像字节直接交给 github.com/diskfs/go-diskfs 的 squashfs.Read。该解析器未校验攻击者可控的 superblock 块大小与 inode 元数据偏移：零块大小会使 newLRU 执行整除零，越界 byteOffset 会在 readMetadata 中触发切片越界 panic，截断元数据流还可形成无进展 CPU 循环。解析为惰性触发，客户端寻址或进入该归档对象后即可造成 rclone 进程退出；经 rclone serve sftp 时前两种变体可终止整个 SFTP 服务。\n修复版本中通过在 New、目录列举、打开文件及惰性读路径上恢复解析 panic，将畸形 SquashFS 镜像转为错误返回，并在 serve sftp 与 vfs 后台 goroutine 中阻止未捕获 panic 打垮整个进程。", "effects": [{"comp_name": "github.com/rclone/rclone", "ecosystem": "go", "versions": [{"affected_version": "[1.72.0,1.
