开公告未说明具体错误配置项、对外入口或被绕过限制的实现细节。\n修复版本中通过在修正包 8.6.2.2 上安装 APAR PH73641 iFix 处理该配置问题。8.6.2.2 之前的受影响版本需先升级到 8.6.2.2 再安装该 iFix，已经位于 8.6.2.2 的部署直接安装 PH73641。厂商推荐修复列表将 PH73641 列为 8.6.2.2 的安全 iFix，公开资料未披露代码级差异。", "effects": [{"comp_name": "websphere_extreme_scale", "ecosystem": "linux", "versions": [{"affected_version": "[8.6.1.0,8.6.2.2]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "配置缺陷", "kind_en": "", "last_modified_time": "2026-11-09", "level": "Critical", "mps_id": "MPS-r5e0-m26c", "poc": false, "poc_url": [], "published_time": "2026-11-09", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-r5e0-m26c", "name": "https://www.oscs1024.com/hd/MPS-r5e0-m26c"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-101117", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-101117"}, {"url": "https://www.ibm.com/support/pages/node/7293764", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "eXtreme Scale CSP配置绕过", "_translated": true, "_saved_at": "2026-11-08T16:56:46+00:00", "_first_saved_at": "2026-11-08T16:56:46+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-r5e0-m26c"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-111244", "cvss": {}, "cvss_score": 9.1, "cvss_vector": "", "cwe": "CWE-863", "description": "Apache TomEE 是 Apache 软件基金会维护的开源 Jakarta EE 与 MicroProfile 应用服务器，其 mp-jwt 模块用于对 JAX-RS 资源执行 MicroProfile JWT 角色访问控制。\n受影响版本中，MPJWTSecurityAnnotationsInterceptorsFeature.processSecurityAnnotations 以 java.lang.reflect.Method 作为共享键合并不同资源类的角色集合，继承同一方法的子类会共用并叠加约束；安全注解不具备继承语义，仅声明在父类上的类级别约束不会作用到未重新标注的子类方法。MPJWTSecurityAnnotationsInterceptor.filter 在允许角色集合为空时跳过校验，空的 RolesAllowed 对任意调用方放行。远程调用方可以访问本应拒绝的 JAX-RS 资源，部分部署下无需通过身份认证。\n修复版本中通过为每个资源类单独构造约束拦截器，并由 findConstrainingClass 向上选择最近的类级别安全注解，同时在角色集合为空时拒绝请求，使 JAX-RS 资源按各自声明的角色约束执行访问控制。", "effects": [{"comp_name": "org.apache.tomee:mp-jwt", "ecosystem": "maven", "versions": [{"affected_version": "[7.1.0,10.0.0-M1)", "min_fixed_version": "10.0.0-M1", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[10.0.0-M1,10.3.0)", "min_fixed_version": "10.3.0", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[11.0.0-M1,11.0.0-M2)", "min_fixed_version": "11.0.0-M2", "repository": "maven", "solutions": [], "upstream": true}]}, {"comp_name": "tomee", "ecosystem": "linux", "versions": [{"affected_version": "[11.0.0-M1,11.0.0-M2)", "min_fixed_version": "11.0.0-M2", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[10.0.0-M1,10.3.0)", "min_fixed_version": "10.3.0", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[7.1.0,10.0.0-M1)", "min_fixed_version": "10.0.0-M1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-11-10", "level": "Critical", "mps_id": "MPS-f2ca-ec44", "poc": false, "poc_url": [], "published_time": "2026-11-10", "reference_url_list": [{"url": "http://www.mail-archive.com/announce@apache.org/msg12604.html", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-111244", "name": ""}, {"url": "https://lists.apache.org/thread/flpx4mgmzqx36fm6gy3thcoh74b5yz7o", "name": ""}, {"url": "https://tomee.apache.org/", "name": ""}, {"url": "https://github.com/apache/tomee/commit/c89dcc5da35132f732ded44898ae072ef4a3352c", "name": ""}, {"url": "https://github.com/apache/tomee/commit/59698bfe1fa93e57ff9d27209aa190811938af5c", "name": ""}, {"url": "https://github.com/apache/tomee/commit/dccb325d3b2b7e402a2da6884ae367653bc83841", "name": ""}, {"url": "https://github.com/apache/tomee/commit/6326c23f7d3de768b24a1744f517779580b584e8", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "TomEE JWT授权绕过", "_translated": true, "_saved_at": "2026-11-10T17:25:07+00:00", "_first_saved_at": "2026-11-10T17:25:07+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-f2ca-ec44"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "", "cvss": {}, "cvss_score": 8.8, "cvss_vector": "", "cwe": "CWE-416", "description": "FedCM（Federated Credential Management，联合凭证管理）为网页提供浏览器原生的联合身份认证能力。Android 平台上，IdentityDialogController 负责身份选择对话框的生命周期管理，当身份提供方（IdP）请求原生应用 UI 委托时，通过 Android 侧 AccountSelectionCoordinator 协作完成应用查找与界面移交。\n受影响版本中，活跃模式（active mode）的 FedCM 请求触发原生应用 UI 委托时，AccountSelectionCoordinator.showNativeAppUi() 调用 findVerifiedApp() 查找可处理 IdP 原生 intent 的应用；若无应用可用或数字资产链接校验可同步完成，回调会在 Java 方法返回前同步调用 onDismissed()，经原生侧 RequestService::CleanUpActiveRequest() 直接销毁 IdentityDialogController，而 showNativeAppUi() 仍返回 true，C++ 调用方 IdentityDialogController::ShowNativeAppUi() 随后进入 DidInvokeShowUi()，通过已释放的 this 指针向成员 did_invoke_show_ui_ 写入数据，造成浏览器进程释放后使用写入，可导致浏览器进程内存破坏与崩溃。\n修复版本中通过重构消除该缺陷：showNativeAppUi() 在包列表为空或 origin 无效时直接返回 false，其余校验结果统一经 PostTask 延迟到方法返回之后，在新增的 onNativeAppUiPackageVerified() 中再执行 dismiss 或应用启动，移除了返回前同步销毁原生调用方的执行路径。", "effects": [{"comp_name": "chrome", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,157.0.8094.0)", "min_fixed_version": "157.0.8094.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "chromium", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,157.0.8094.0)", "min_fixed_version": "157.0.8094.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "UAF", "kind_en": "免费后使用", "last_modified_time": "2026-11-08", "level": "High", "mps_id": "MPS-3ie0-con1", "poc": false, "poc_url": [], "published_time": "2026-11-08", "reference_url_list": [{"url": "https://issues.chromium.org/issues/568275220", "name": ""}, {"url": "https://github.com/chromium/chromium/commit/22e5c6b7592ff69950048bba906719217d71584e", "name": ""}, {"url": "https://chromium-review.googlesource.com/c/chromium/src/+/8503316", "name": ""}, {"url": "https://github.com/chromium/chromium/releases/tag/157.0.8094.0", "name": ""}, {"url": "https://chromium.googlesource.com/chromium/src/+/main/chrome/browser/ui/webid/identity_dialog_controller.cc", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "Google Chrome \u003c 157.0.8094.0 浏览器进程释放后使用写入漏洞", "_translated": true, "_saved_at": "2026-11-08T10:58:40+00:00", "_first_saved_at": "2026-11-08T10:58:40+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-3ie0-con1"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-123615", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-787", "description": "imgproxy 是开源（Apache-2.0 协议）的 Go 语言图像处理服务，用于通过 URL 即时完成图像缩放、裁剪与格式转换，其进程内置自研的 C 语言 ICO 图像加载器（vips/icoload.c）。\n受影响版本中，vips_foreign_load_ico_header 函数将 ICO 条目图像数据读入 data_size + BMP_FILE_HEADER_LEN 字节的堆缓冲后，以 actual_data+8、actual_data+14、actual_data+32 固定偏移读取 BITMAPINFOHEADER 的 height、bpp 与 num_colors 字段，并把 height/2 回写到 actual_data+8。当条目声明的 data_size 极小（如 1 字节）时堆缓冲仅 15 字节，上述读取与回写均越过分配边界，紧邻堆块的 size 字段被改写为原值右移一位，后续 free 走入 glibc munmap_chunk(): invalid pointer 中止路径；未认证攻击者通过一次图像处理请求可触发 imgproxy 进程崩溃退出（exit code 2），造成远程拒绝服务。\n修复版本中通过将缓冲区下界校验由 full_data_size \u003c BMP_BITMAP_INFO_HEADER_LEN 收紧为 data_size \u003c BMP_BITMAP_INFO_HEADER_LEN，要求条目自身数据不少于完整 40 字节 BITMAPINFOHEADER，不满足时释放缓冲并报错返回，固定偏移的读取与回写全部落在已分配数据范围内，并新增截断 ICO 回归样本 testdata/ico-bad4.ico 验证拒绝行为。", "effects": [{"comp_name": "github.com/imgproxy/imgproxy/v3", "ecosystem": "go", "versions": [{"affected_version": "[3.3.0,4.0.17)", "min_fixed_version": "4.0.17", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-11-08", "level": "High", "mps_id": "MPS-t178-ij6p", "poc": false, "poc_url": [], "published_time": "2026-11-08", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-t178-ij6p", "name": "https://www.oscs1024.com/hd/MPS-t178-ij6p"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-123615", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-123615"}, {"url": "https://github.com/imgproxy/imgproxy/security/advisories/GHSA-494m-4556-wf5p", "name": "GitHub Security Advisory (GHSA-494m-4556-wf5p)"}, {"url": "https://www.vulncheck.com/advisories/imgproxy-before-4.0.17-out-of-bounds-write-in-ico-loader", "name": "VulnCheck Advisory: imgproxy before 4.0.17 Out-of-Bounds Write in ICO Loader"}], "scope_influence": "", "tags": ["go"], "title": "imgproxy堆越界读写漏洞", "_translated": true, "_saved_at": "2026-11-08T03:53:31+00:00", "_first_saved_at": "2026-11-08T03:53:31+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-t178-ij6p"}, {"analysis_status": 0, "articles": []  "poc_url": [], "published_time": "2026-11-08", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-oqwt-f392", "name": "https://www.oscs1024.com/hd/MPS-oqwt-f392"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-124060", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-124060"}, {"url": "https://vuldb.com/vuln/432115", "name": "VDB-432115 | TOTOLINK CA300-PoE cstecgi.cgi UploadCustomModule buffer overflow"}, {"url": "https://vuldb.com/vuln/432115/cti", "name": "VDB-432115 | CTI Indicators (IOB, IOC, IOA)"}, {"url": "https://vuldb.com/cve/CVE-2026-124060", "name": "CVE-2026-124060 | CVE Analysis and Report"}, {"url": "https://vuldb.com/submit/1033757", "name": "Submit #1033757 | TOTOLINK CA300-PoE CA300-PoE_Firmware V6.2c.884 Buffer Overflow"}, {"url": "https://lavender-bicycle-a5a.notion.site/TOTOLINK-CA300-PoE-UploadCustomModule-3f953a41781f803fabf6e4b901fffb1f?source=copy_link", "name": ""}, {"url": "https://www.totolink.net/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "TOTOLINK CA300-PoE 缓冲区溢出漏洞", "_translated": true, "_saved_at": "2026-11-07T23:19:06+00:00", "_first_saved_at": "2026-11-07T23:19:06+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-oqwt-f392"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-120531", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "cwe": "CWE-79", "description": "Subscribe2（Subscribe2 – Form, Email Subscribers \u0026 Newsletters）是 weDevs 维护、托管于 WordPress.org 插件目录的开源 PHP 插件，主要提供订阅表单、订阅者管理与新文章邮件通知功能。\n受影响版本中，站点管理员在插件设置中启用弹出式订阅表单（subscribe2_options 的 ajax 选项为 1）后，未认证攻击者可携带页面下发的 s2_ajax_form_nonce 向 admin-ajax.php 的 subscribe2_submit 接口提交 data[ip]；classes/class-s2-ajax.php 的 s2_ajax_submit_handler() 对该值仅执行 sanitize_text_field，随后经 classes/class-s2-core.php 的 add() 写入订阅者表，而 sanitize_text_field 保留双引号；管理员打开后台订阅者列表时，classes/class-s2-list-table.php 的 column_email() 将存储的 ip 未转义拼入 abbr 元素 title 属性，攻击者借双引号闭合属性并注入事件属性，在管理员浏览器中执行任意脚本。\n修复版本中通过双重改动切断该链条：10.48 在 s2_ajax_submit_handler() 中以 rest_is_ip_address() 校验 data[ip]，非法值置空入库，并在订阅者列表 column_email() 等输出处对 email 与 ip 统一补充 esc_html()/esc_attr() 转义，存储与渲染两个环节均被阻断。", "effects": [{"comp_name": "subscribe2", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,10.48)", "min_fixed_version": "10.48", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-11-08", "level": "High", "mps_id": "MPS-2af1-xqi7", "poc": false, "poc_url": [], "published_time": "2026-11-08", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-2af1-xqi7", "name": "https://www.oscs1024.com/hd/MPS-2af1-xqi7"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-120531", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-120531"}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/9aa4bcc1-3c9e-451e-81ed-2059882b2ef1?source=cve", "name": ""}, {"url": "https://plugins.trac.wordpress.org/changeset/3709549/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Subscribe2 存储型 XSS 漏洞", "_translated": true, "_saved_at": "2026-11-07T23:19:04+00:00", "_first_saved_at": "2026-11-07T23:19:04+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-2af1-xqi7"}, {"analysis_status": 0, "articles": [{"content": "应用程序在处理用户输入时的不完善或缺乏验证机制，所以攻击者能够通过向应用程序发送恶意输入，利用应用程序对输入数据的错误处理方式来注入自己的恶意代码。这些恶意代码会被应用程序误认为是合法的指令或数据，并在执行过程中被执行。", "title": "什么是代码注入"}, {"content": "应用程序使用可执行动态代码的函数来执行用户可控的参数，当应用程序对于用户输入过滤不完全时，攻击者可以注入恶意代码并控制代码执行流程。", "title": "代码注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对所有用户输入进行验证和过滤，确保只接受预期的有效输入。这包括对输入数据进行输入长度验证、类型检查和格式验证等。\r\n- 使用参数化查询或预编译语句：对于数据库查询操作，应该使用参数化查询或预编译语句，确保输入数据不会被误认为是执行代码。\r\n- 最小特权原则：应用程序在执行操作系统命令或动态代码时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。\r\n- 安全编码实践：开发人员应该采用安全编码实践，包括避免使用eval函数、避免拼接用户输入的字符串作为代码执行等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止代码注入攻击。", "title": "如何预防代码注入"}], "cnvd_id": "", "cve_id": "CVE-2026-9764", "cvss": {"cvssv31": [{"source": "psirt@us.ibm.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "cwe": "CWE-94", "description": "IBM Bob Shell 是 IBM 发布的商业人工智能编程助手，用于在本地工作区提供代码辅助，并加载工作区中定义的 Model Context Protocol（MCP）服务器。\n受影响版本中，Bob Shell 对仓库提供的 MCP 服务器配置缺少充分校验。用户打开不可信仓库时，仓库内定义的 MCP 服务器会在未经用户明确同意的情况下自动初始化并执行，远程攻击者可由此在本机注入并执行任意代码。\n修复版本中通过引入 Workspace Folder Trust 机制，在用户明确信任仓库之前阻止初始化工作区定义的 MCP 服务器及其他工作区配置，使未信任仓库中的 MCP 服务器不再自动执行。", "effects": [{"comp_name": "bob", "ecosystem": "linux", "versions": [{"affected_version": "[1.0.4,2.0.2)", "min_fixed_version": "2.0.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "代码注入", "kind_en": "代码生成控制不当（“代码注入”）", "last_modified_time": "2026-11-09", "level": "High", "mps_id": "MPS-nkom-9gzj", "poc": false, "poc_url": [], "published_time": "2026-11-09", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-nkom-9gzj", "name": "https://www.oscs1024.com/hd/MPS-nkom-9gzj"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-9764", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-9764"}, {"url": "https://www.ibm.com/support/pages/node/7291535", "name": ""}], "scope_influence": "", "tags": ["AI", "应用软件"], "title": "IBM Bob代码注入漏洞", "_translated": true, "_saved_at": "2026-11-09T00:34:00+00:00", "_first_saved_at": "2026-11-08T20:57:05+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-nkom-9gzj"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-114189", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:N/A:L", "severity": "high", "base_score": 8.5}]}, "cvss_score": 8.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:N/A:L", "cwe": "CWE-89", "description": "Dynific Addons for Elementor（原名 AnyWhere Elementor，WordPress 插件标识 anywhere-elementor）是 WPVibes 维护的开源 WordPress 插件，用于在 Elementor 中创建全局模板，并作为文章或页面布局自动套用，或通过短代码嵌入。\n受影响版本中，订阅者及以上已登录用户可请求管理端 AJAX 动作 ae_prev_post，进入 Aepro\\Admin\\AdminHelper::ae_preview_post()。该方法读取请求参数 q，经 sanitize_text_field() 写入 WP_Query 的 search_post_title，再由 preview_post_filter() 调用 $wpdb-\u003eesc_like() 后把结果直接拼进 post_title 的单引号 LIKE 字面量。esc_like() 只转义百分号、下划线与反斜杠，不能转义单引号，并且会再次转义 WordPress 请求预处理加在引号前的反斜杠，使引号能够结束 SQL 字面量，从而构成盲注并读取数据库敏感信息。\n修复版本中通过将完整 LIKE 模式交给 $wpdb-\u003eprepare() 以 %s 占位绑定后写入 posts_where，使请求参数 q 不再以可拼接 SQL 片段进入查询，单引号无法结束字面量，盲注路径被切断。", "effects": [{"comp_name": "anywhere-elementor", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.3.1)", "min_fixed_version": "1.3.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-11-09", "level": "High", "mps_id": "MPS-9weu-ahv7", "poc": false, "poc_url": [], "published_time": "2026-11-09", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-9weu-ahv7", "name": "https://www.oscs1024.com/hd/MPS-9weu-ahv7"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-114189", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-114189"}, {"url": "https://patchstack.com/database/wordpress/plugin/anywhere-elementor/vulnerability/wordpress-anywhere-elementor-plugin-1-3-0-sql-injection-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "AnyWhere Elementor SQL 注入", "_translated": true, "_saved_at": "2026-11-08T16:56:45+00:00", "_first_saved_at": "2026-11-08T16:56:45+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-9weu-ahv7"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-97677", "cvss": {"cvssv31": [{"source": "psirt@us.ibm.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N", "severity": "high", "base_score": 8.1}]}, "cvss_score": 8.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N", "cwe": "CWE-22", "description": "Langflow 是开源的大语言模型应用构建平台，内置 Web 应用，用于以可视化流程编排智能体、组件和文件处理。\n受影响版本中，FileContentRetrieverComponent 将流程作者提供的 persistent_dir 直接作为磁盘目录，未执行本地文件访问隔离检查。已认证的流程作者调用 retrieve_content 或 retrieve_content_as_dataframe 时，_save_persistent_maps 会在该目录下创建 texts 与 dataframes 并写入文件内容，_load_persistent_maps 则按 text_index.json 与 dataframe_index.json 中的条目名拼接路径后读取文件，从而绕过 LANGFLOW_RESTRICT_LOCAL_FILE_ACCESS，可向服务账户可写目录写入内容，并读取服务进程可访问的配置、凭据或数据目录文件。\n修复版本中通过 _resolve_persistent_base 将 persistent_dir 交给 enforce_local_file_access 限制在调用者存储范围内，并由 _resolve_index_entry 拒绝包含路径分隔符、空字节或目录穿越的索引条目，使持久化读写停留在已授权目录内。", "effects": [{"comp_name": "langflow", "ecosystem": "pip", "versions": [{"affected_version": "[1.0.0,1.12.3)", "min_fixed_version": "1.12.3", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-11-09", "level": "High", "mps_id": "MPS-ly2e-vokn", "poc": false, "poc_url": [], "published_time": "2026-11-09", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ly2e-vokn", "name": "https://www.oscs1024.com/hd/MPS-ly2e-vokn"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-97677", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-97677"}, {"url": "https://www.ibm.com/support/pages/node/7290694", "name": ""}], "scope_influence": "", "tags": ["AI", "python", "开源"], "title": "Langflow路径穿越漏洞", "_translated": true, "_saved_at": "2026-11-09T00:34:01+00:00", "_first_saved_at": "2026-11-08T20:57:06+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ly2e-vokn"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2026-118904", "cvss": {"cvssv31": [{"source": "psirt@us.ibm.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N", "severity": "high", "base_score": 8.1}]}, "cvss_score": 8.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N", "cwe": "CWE-287", "description": "IBM webMethods Integration Server 是 IBM 提供的闭源企业集成服务器，用于在本地环境连接应用与服务，并提供包含双因素认证的访问控制。\n受影响版本中，12.1 的双因素认证备份码校验存在认证不当。远程已认证攻击者可绕过安全限制。IBM 给出的 CVSS 评分为机密性与完整性高影响、可用性无影响。公告未披露具体函数、参数或校验条件。\n修复版本中通过安装 IS_12.1_Core_Fix1 及后续核心修复，修正双因素认证备份码校验中的认证缺陷，阻断已认证攻击者绕过安全限制的路径。", "effects": [{"comp_name": "webmethods_integration_server", "ecosystem": "linux", "versions": [{"affected_version": "[12.1.0,IS_12.1_Core_Fix1)", "min_fixed_version": "IS_12.1_Core_Fix1", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[12.1,IS_12.1_Core_Fix1)", "min_fixed_version": "IS_12.1_Core_Fix1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "身份验证不当", "kind_en": "认证不当", "last_modified_time": "2026-11-09", "level": "High", "mps_id": "MPS-ncjd-zvu6", "poc": false, "poc_url": [], "published_time": "2026-11-09", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ncjd-zvu6", "name": "https://www.oscs1024.com/hd/MPS-ncjd-zvu6"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-118904", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-118904"}, {"url": "https://www.ibm.com/support/pages/node/7295306", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "webMethods认证绕过", "_translated": true, "_saved_at": "2026-11-09T00:33:59+00:00", "_first_saved_at": "2026-11-08T20:57:04+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ncjd-zvu6"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能有效地控制资源的使用，导致攻击者可以利用这个漏洞耗尽应用程序所依赖的资源。这些资源可以是计算资源（CPU、内存）、网络带宽、数据库连接或其他系统资源。攻击者可以通过发送特制的请求、恶意输入或其他方式，使应用程序消耗大量资源，导致拒绝服务或系统崩溃。", "title": "什么是拒绝服务"}, {"content": "- 消耗计算资源：攻击者可以发送计算密集型的请求，例如复杂的计算、无限循环或递归操作，以耗尽应用程序的计算资源，导致应用程序无法响应其他请求。\r\n- 消耗内存资源：攻击者可以发送大量的数据或恶意输入，以导致应用程序消耗过多的内存资源，从而使系统的可用内存耗尽，并导致应用程序崩溃或变得不可用。\r\n- 消耗网络带宽：攻击者可以发送大量的请求或大型数据包，以消耗应用程序所依赖的网络带宽。这会导致其他合法用户无法正常访问应用程序或降低系统的整体网络性能。\r\n- 消耗存储资源：攻击者可以发送大量的请求或上传大文件，以耗尽应用程序的存储资源，导致系统无法处理其他请求或存储新的数据。", "title": "拒绝服务常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对输入数据进行合理的验证和过滤，防止恶意输入导致资源消耗过高。\r\n- 实施资源限制：应用程序应该实施适当的资源限制策略，例如限制计算操作的时间或次数，限制内存使用量，限制并发连接数等，以防止资源被耗尽。\r\n- 异常处理与错误恢复：应用程序应该具备健壮的异常处理和错误恢复机制，以防止因意外错误导致资源泄漏或无法释放的情况。\r\n- 资源监控与警报：应用程序应该实施适当的资源监控和警报机制，及时发现异常的资源消耗情况，并采取相应的措施来应对。\r\n- 压力测试与性能优化：应用程序应该进行压力测试，以评估其在高负载情况下的性能，并进行必要的性能优化，以确保能够有效地处理大量请求而不耗尽资源。", "title": "如何预防拒绝服务"}], "cnvd_id": "", "cve_id": "CVE-2026-96146", "cvss": {"cvssv31": [{"source": "psirt@us.ibm.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-400", "description": "IBM SevOne Network Performance Management 是 IBM 的闭源商业网络性能管理产品，用于采集、分析并展示网络与基础设施性能数据。\n受影响版本中，远程攻击者可借助不受控的资源消耗造成拒绝服务。IBM 将该问题评定为 CWE-400，CVSS 向量为网络可达、无需权限、无需用户交互，且仅影响可用性。公开公告未披露具体接口、请求参数或资源消耗路径。\n修复版本中通过既有产品维护与版本更新消除该不受控资源消耗问题。厂商将 Data Insight 8.2.4、NMS 8.2.3 和 SD-WAN 8.2.3 列为修复目标，并说明没有额外临时规避措施。", "effects": [{"comp_name": "sevone_network_performance_management", "ecosystem": "linux", "versions": [{"affected_version": "[7.0.0,8.2.2]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "拒绝服务", "kind_en": "不受控制的资源消耗", "last_modified_time": "2026-11-09", "level": "High", "mps_id": "MPS-67i8-n3rh", "poc": fals rce_page": "https://www.oscs1024.com/hd/MPS-131c-1fa5"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-121576", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-266", "description": "AtlasAiDev MCP Server for WordPress（插件标识 ai-workflow-automation-ai-agent-hub，亦称 AtlasMCP）是发布在 WordPress.org 的开源插件，把站点暴露为模型上下文协议服务器，供已连接的 AI 应用按当前登录用户的权限读写内容、用户与设置。\n受影响版本中，内容模型工具 awfah-content-model/update-meta 经默认 MCP 路由 awfah_mcp/mcp 接收 object、id、key 与 value，并由 Content_Model_Abilities::update_meta 调用 update_metadata。Meta_Policy::refusal 只对用户 meta 键做精确字符串锁定，锁定表包含当前表前缀的 capabilities 与 user_level，但不覆盖大小写、重音或尾随空白形成的形近键，也不覆盖多站点上其他站点的角色键。Subscriber 修改自身用户时，can_write_meta 对不以 \"_\" 开头的键直接返回允许，形近或未锁定的角色键因此写入数据库，并在默认排序规则下命中真实角色行，调用者角色被抬升。\n修复版本中通过在 Meta_Policy::refusal 增加 fold 规范化比较，并按 base_prefix 正则锁定各站点的 capabilities 与 user_level，同时让 Content_Model_Abilities::can_write_meta 调用 Meta_Policy::user_key_allowed，使没有 edit_users 能力的用户只能写入自身资料字段，阻断低权限账号改写角色 meta。", "effects": [{"comp_name": "ai-workflow-automation-ai-agent-hub", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.0.2)", "min_fixed_version": "2.0.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "特权授予不正确", "kind_en": "权限分配不正确", "last_modified_time": "2026-11-10", "level": "High", "mps_id": "MPS-nozy-g2dl", "poc": false, "poc_url": [], "published_time": "2026-11-10", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-nozy-g2dl", "name": "https://www.oscs1024.com/hd/MPS-nozy-g2dl"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-121576", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-121576"}, {"url": "https://patchstack. rl": "https://www.oscs1024.com/hd/MPS-4x5a-rgjd", "name": "https://www.oscs1024.com/hd/MPS-4x5a-rgjd"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-124683", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-124683"}, {"url": "https://gitlab.eclipse.org/security/vulnerability-reports/-/work_items/1069", "name": ""}, {"url": "https://github.com/eclipse-langium/langium/security/advisories/GHSA-297v-g8mm-qj4h", "name": ""}, {"url": "https://gitlab.eclipse.org/security/cve-assignment/-/work_items/553", "name": ""}], "scope_influence": "", "tags": ["npm", "开源"], "title": "Langium缩进词法拒绝服务", "_translated": true, "_saved_at": "2026-11-09T18:08:15+00:00", "_first_saved_at": "2026-11-09T18:08:15+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-4x5a-rgjd"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "cnvd_id": "", "cve_id": "CVE-2026-125400", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:A/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8. via-pcre2-filter-substitution", "name": "VulnCheck Advisory: Ettercap through 0.8.4.1 Use-After-Free via PCRE2 Filter Substitution"}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "Ettercap过滤器UAF", "_translated": true, "_saved_at": "2026-11-10T01:50:27+00:00", "_first_saved_at": "2026-11-10T01:50:27+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-5sp4-ezub"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-125406", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:A/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:A/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-124", "description": "Ettercap 是开源的网络嗅探与中间人审计工具，使用 C 语言实现，可在流量经过本机时解析多种应用层协议。Telnet 解析器在初始化时注册到 TCP 23，同一函数也处理 TCP 992 上的 Telnets。\n受影响版本中，dissector_telnet 把已保存的客户端输入与当前报文拼入栈上变长数组 str，再对字节 0x08 和 0x7f 无下界地执行 p--。退格数量多于已有字符时，写指针落到 str 之前，后续赋值写入这块栈缓冲区的下方，破坏通常以 root 权限运行的 Ettercap 进程栈。服务端报文匹配登录提示并建立会话后，客户端的后续报文进入该循环；首字节 isprint 检查只覆盖采集开始时的第一个报文。\n修复版本中通过在 p-- 之前加入 p \u003e str 判断，将写指针限制在栈缓冲区起点之内，阻止退格把后续写入带到缓冲区下方。该修复位于 src/dissectors/ec_telnet.c，已合入上游 master 提交 1d8badb713579419a29a494bb463a1af59707e98，但尚未进入 v0.8.4.1 或任何已发布标签。", "effects": [{"comp_name": "ettercap", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,0.8.4.1]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "缓冲区下溢", "kind_en": "缓冲区下溢（“缓冲区下溢”）", "last_modified_time": "2026-11-10", "level": "High", "mps_id": "MPS-paoz-k53e", "poc": false, "poc_url": [], "published_time": "2026-11-10", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-paoz-k53e", "name": "https://www.oscs1024.com/hd/MPS-paoz-k53e"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-125406", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-125406"}, {"url": "https://github.com/Ettercap/ettercap/security/advisories/GHSA-w5ch-7c4x-crcc", "name": "GitHub Security Advisory (GHSA-w5ch-7c4x-crcc)"}, {"url": "https://github.com/Ettercap/ettercap/commit/1d8badb713579419a29a494bb463a1af59707e98", "name": ""}, {"url": "https://github.com/Ettercap/ettercap/pull/1330", "name": ""}, {"url": "https://github.com/Ettercap/ettercap/blob/v0.8.4.1/src/dissectors/ec_telnet.c#L150-L159", "name": ""}, {"url": "https://www.vulncheck.com/advisories/ettercap-through-0.8.4.1-stack-buffer-underwrite-via-telnet-dissector-backspace-handling", "name": "VulnCheck Advisory: Ettercap through 0.8.4.1 Stack Buffer Underwrite via Telnet Dissector Backspace Handling"}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "Ettercap栈下写漏洞", "_translated": true, "_saved_at": "2026-11-10T01:50:20+00:00", "_first_saved_at": "2026-11-10T01:50:20+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-paoz-k53e"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-125399", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:A/AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:A/AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-78", "description": "Fluxion 是 FluxionNetwork 维护的开源 Bash 无线审计工具，用于扫描接入点、捕获握手包并实施验证门户测试。\n受影响版本中，fluxion.sh 的 fluxion_get_target() 在解析 airodump-ng 扫描结果时，只把 ESSID 字段中的单引号替换为反斜杠转义，再放进 $'...' 后交给 eval 执行。无线覆盖范围内攻击者广播的接入点名称会在操作员扫描阶段、选定目标之前被当作 shell 代码运行，并以运行 Fluxion 的 root 权限执行命令。\n修复版本中通过去掉该 eval 解码，改为按扫描记录中的字节长度截取 ESSID，并只用 printf -v 的 %b 转换还原十六进制转义，使接入点名称保持为数据，不再进入 shell 求值。", "effects": [{"comp_name": "fluxion", "ecosystem": "linux", "versions": [{"affected_version": "[0,6.39)", "min_fixed_version": "6.39", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-11-10", "level": "High", "mps_id": "MPS-x4jm-qtgb", "poc": false, "poc_url": [], "published_time": "2026-11-10", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-x4jm-qtgb", "name": "https://www.oscs1024.com/hd/MPS-x4jm-qtgb" 取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-120513", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:H/A:L", "severity": "high", "base_score": 8.2}]}, "cvss_score": 8.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:H/A:L", "cwe": "CWE-22", "description": "Everest Forms 是 WPEverest 以 GPLv3 发布的开源 WordPress 插件，用于构建联系表单、付款表单、测验、调查和自定义表单。\n受影响版本中，未认证请求在 Save-and-Continue 附加组件已加载且目标表单开启 Disable storing entry information 时，可经 everest_forms_{form_id}_old_{field_id} 传入文件 URL。EVF_Form_Task 把该参数填入 file-upload 或 image-upload 字段的 old_files，EVF_Form_Fields_Upload::format 将其并入条目 value_raw。通知邮件发出后，remove_csv_file_after_email_send 在 disabled_entries 为 1 时不使用已解析的真实路径，而是用 ABSPATH 拼接 preg_replace('/.*wp-content/', 'wp-content', URL 路径) 的结果并 unlink。该清理可删除 wp-content/uploads 中已存在的文件，删除 uploads/.htaccess 后可在加固的 Apache 配置上恢复该目录的 PHP 执行；URL 路径中再出现 wp-content 片段时，删除位置在少数情况下可超出 uploads 并到达站点根目录。\n修复版本中通过只删除本次请求实际上传并记入 request_files 的文件，切断由 old_files URL 驱动的删除。remove_csv_file_after_email_send 改为对这些路径调用 wp_delete_file，不再根据条目中的文件 URL 重建本地路径。", "effects": [{"comp_name": "everest-forms", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,3.6.3)", "min_fixed_version": "3.6.3", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-11-10", "level": "High", "mps_id": "MPS-dg9o-lqr6", "poc": false, "poc_url": [], "published_time": "2026-11-10", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-dg9o-lqr6", "name": "https://www.oscs1024.com/hd/MPS-dg9o-lqr6"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-120513", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-120513"}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/0d61468b-8fda-4775-8099-a34ddf34566b?source=cve", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/everest-forms/tags/3.6.2/includes/abstracts/class-evf-form-fields-upload.php#L1680", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/everest-forms/tags/3.6.2/includes/class-evf-form-task.php#L594", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/everest-forms/tags/3.6.2/includes/abstracts/class-evf-form-fields-upload.php#L1396", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/everest-forms/tags/3.6.2/includes/class-evf-ajax.php#L681", "name": ""}, {"url": "https://plugins.trac.wordpress.org/changeset/3747723/everest-forms/trunk/includes/abstracts/class-evf-form-fields-upload.php", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Everest Forms任意文件删除", "_translated": true, "_saved_at": "2026-11-10T09:04:18+00:00", "_first_saved_at": "2026-11-10T09:04:18+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-dg9o-lqr6"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2026-76877", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.1}]}, "cvss_score": 8.1, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-287", "description": "WPML Multilingual CMS（WordPress 插件 slug 为 sitepress-multilingual-cms）是 OnTheGoSystems 的商业多语言插件，官方未提供公开 GitHub 开源仓库，用于管理多语言内容，并在每种语言使用不同域名时同步用户会话。\n受影响版本中，按语言分域名的 SSO 处理器 WPML_Language_Per_Domain_SSO::process_iframe_request 使用 wp_create_nonce('wpml_sso') 生成跨域登录令牌。登出落地页已经丢弃认证 Cookie，wp_get_session_token() 返回空字符串，令牌退化为当前 12 小时时间片的共享匿名 nonce，并写入 transient wpml_sso_user_\u003ctoken\u003e_\u003csha256('wpml_sso'.$domain)\u003e，仅映射 user_id，不绑定具体登出动作或请求客户端。未认证攻击者可在 wp-login.php?action=logout 的登出确认流程中独立得到同一令牌；is_iframe_request() 的门禁（已启动的 SSO transient，以及由公开常量 SSO_NONCE 推导的域名哈希）在 60 秒 SSO_TIMEOUT 内可以满足。攻击者在合法 wpml_user_signed_out iframe 发出之前，向次级语言域名提交同一 wpml_sso_token_domain 且状态为 wpml_user_signed_in，WordPress 会为目标用户签发认证 Cookie，其中包括管理员账户。\n修复版本中通过官方安全更新切断该竞争条件的公开记录尚不存在。CVE.org 仅将受影响上界标为 4.9.7（含），Wordfence 将该问题标为未修复，且未公布修复 commit。在确认修复发布前，应关闭按语言分域名的跨域自动登录与登出，避免登出页把匿名 nonce 写入用户 transient 并签发认证 Cookie。", "effects": [{"comp_name": "wpml", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,4.9.7]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploit +00:00", "_first_saved_at": "2026-11-09T18:08:22+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-h6ep-iq72"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-100386", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "cwe": "CWE-22", "description": "Ultra Addons for Contact Form 7（插件标识 ultimate-addons-for-contact-form-7）是 Themefic 发布在 WordPress.org 的开源插件，用于给 Contact Form 7 增加 PDF 生成等表单扩展能力。\n受影响版本中，管理员启用 PDF Generator 且为表单配置了 PDF Body Content 模板后，未认证访客提交的字段值进入 UACF7_PDF_GENERATOR::uacf7_wpcf7_mail_components。该函数通过 WPCF7_Submission::get_posted_data() 读取字段，未经编码替换进 customize_pdf，再交给 mPDF 的 WriteHTML 解析。字段中的本地文件流包装器或 mPDF 对象标记会被当作目录穿越处理，生成的 PDF 因而包含服务器任意文件内容，并写入 uploads/uacf7-uploads。\n修复版本中通过在替换模板前调用 sanitize_pdf_template_value，删除 mPDF 对象标记以及 file、php、phar、data、expect、ftp 流包装器，再对字段值执行 esc_html，使访客输入不能再驱动 mPDF 读取本地文件。", "effects": [{"comp_name": "ultimate-addons-for-contact-form-7", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,3.5.55)", "min_fixed_v sion。该函数在 default 分支用 sprintf 写入 \"unknown (0x%X)\"，并在 version 高位同时满足 0x40000000 与 0x04000000 时继续 strcat \" + has audio\" 与 \" + eraomnix\"，最长向 30 字节分配写入 44 字节，造成堆溢出，破坏通常以 root 运行的 Ettercap 进程堆内存。\n修复版本中通过将 gg_get_version 与 gg_get_status 改为先在私有缓冲区拼接字符串，再使用 snprintf 按调用方缓冲区长度拷贝，并把 tbuf3 扩大到 64 字节，使超长版本字符串不再写入原 30 字节堆块。截至 2026-11-10，最新发布版本仍为 0.8.4.1，GitHub Advisory 将 patched versions 标为 None。", "effects": [{"comp_name": "ettercap", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,0.8.4.1]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "堆缓冲区溢出", "kind_en": "基于堆的缓冲区溢出", "last_modified_time": "2026-11-10", "level": "High", "mps_id": "MPS-984u-2hbo", "poc": false, "poc_url": [], "published_time": "2026-11-10", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-984u-2hbo", "name": "https://www.oscs1024.com/hd/MPS-984u-2hbo"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-125401", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-125401"}, {"url": "https://github.com/Ettercap/ettercap/security/advisories/GHSA-vrjv-f8gv-2h35", "name": "GitHub Security Advisory (GHSA-vrjv-f8gv-2h35)"}, {"url": "https://github.com/Ettercap/ettercap/commit/1d8badb713579419a29a494bb463a1af59707e98", "name": ""}, {"url": "https://github.com/Ettercap/ettercap/pull/1330", "name": ""}, {"url": "https://github.com/Ettercap/ettercap/blob/v0.8.4.1/src/dissectors/ec_gg.c#L599", "name": ""}, {"url": "https://www.vulncheck.com/advisories/ettercap-through-0.8.4.1-heap-buffer-overflow-via-gadu-gadu-dissector", "name": "VulnCheck Advisory: Ettercap through 0.8.4.1 Heap Buffer Overflow via Gadu-Gadu Dissector"}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "Ettercap GG堆溢出", "_translated": true, "_saved_at": "2026-11-10T01:50:24+00:00", "_first_saved_at": "2026-11-10T01:50:24+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-984u-2hbo"}, {"analysis_status": 0, "articles": [{"content": "跨界内存读是指应用程序在读取内存时，未正确验证或限制读取的内存范围。攻击者利用这种漏洞可以读取应用程序内存中的敏感数据，如密码、加密密钥、会话令牌等。常见的原因是由于缓冲区溢出、格式化字符串漏洞或其他内存错误导致的。", "title": "什么是越界读取"}, {"content": "攻击者可以通过不当构造的输入来触发跨界内存读漏洞。攻击者可能会通过向应用程序发送特定的输入，使其读取超过预期的内存区域。攻击者可以利用这个漏洞来获取敏感信息，如其他用户的数据、操作系统的敏感数据或应用程序的内部状态。", "title": "越界读取常见的攻击方式"}, {"content": "- 输入验证和限制：应用程序应对所有输入数据进行严格的验证和限制。确保输入数据的长度、格式和内容符合预期，避免超出缓冲区或访问非预期的内存区域。\n- 内存安全编程实践：开发人员应使用安全的编程实践，如避免使用不安全的函数、正确处理内存分配和释放操作，以及遵循最小特权原则。\n- 使用安全的编程语言和库：选择使用安全性较高的编程语言和库，这些语言和库在内存管理和安全性方面提供了更多的保护机制。\n- 定期进行代码审查和安全测试：定期审查应用程序的代码，并进行安全测试，以发现潜在的跨界内存读漏洞。使用静态代码分析工具和漏洞扫描工具来辅助检测和修复问题。\n- 实施防御性编程技术：应用程序应采用防御性编程技术，如使用随机化地址空间布局（ASLR）、堆栈保护机制（如堆栈溢出保护）和数据执行预防（DEP）等。\n- 及时更新和修补：及时应用程序和操作系统的安全更新和补丁，以确保已知的跨界内存读漏洞得到修复。及时更新相关软件和库，以避免使用已知存在漏洞的版本。", "title": "如何预防越界读取"}], "cnvd_id": "", "cve_id": "CVE-2026-125405", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:H", "severity": "high", "base_score": 8.1}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:A/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:4.0/AV:A/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-125", "description": "Ettercap 是开源的网络中间人嗅探与协议解析工具，常用于局域网流量分析与凭据审计，其 HTTP 解析器负责从明文 HTTP 流量中提取各类认证信息。\n受影响版本中，src/dissectors/ec_http.c 的 Parse_NTLM_Auth() 把 base64 解码后 NTLM 消息中的 32 位 offset/len 字段直接当作指针位移使用，base64decode() 返回的解码长度被忽略且读取路径缺少边界校验；攻击者向 Ettercap 监听的链路发送携带 Authorization: NTLM 头的 HTTP 报文后，uUser、lmResponse、ntResponse 的偏移可指向解码缓冲区上方 4GB 窗口内的任意地址，读取的内存内容以十六进制写入凭据字段并经 Print_Pass() 输出到控制台与日志，造成进程堆内存泄露，偏移落在未映射页面时进程崩溃。\n修复版本中通过接收 base64decode() 返回的解码长度并新增 NTLM_FIELD_IN_BOUNDS 边界校验修复该问题，解码消息短于对应结构体固定部分时直接丢弃，uUser、lmResponse、ntResponse 的读取仅在 offset 与长度完全落在解码缓冲区内时执行，畸形 NTLM Type 3 消息被跳过并释放会话资源，越界读取路径被切断。", "effects": [{"comp_name": "ettercap", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,0.8.4.1]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界读取", "kind_en": "越界读取", "last_modified_time": "2026-11-10", "level": "High", "mps_id": "MPS-ifnj-97qk", "poc": false, "poc_url": [], "published_time": "2026-11-10", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ifnj-97qk", "name": "https://www.oscs1024.com/hd/MPS-ifnj-97qk"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-125405", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-125405"}, {"url": "https://github.com/Ettercap/ettercap/security/advisories/GHSA-jw9q-j2rm-94j2", "name": "GitHub Security Advisory (GHSA-jw9q-j2rm-94j2)"}, {"url": "https://github.com/Ettercap/ettercap/commit/1d8badb713579419a29a494bb463a1af59707e98", "name": ""}, {"url": "https://github.com/Ettercap/ettercap/pull/1330", "name": ""}, {"url": "https://github.com/Ettercap/ettercap/blob/v0.8.4.1/src/dissectors/ec_http.c#L505-L512", "name": ""}, {"url": "https://www.vulncheck.com/advisories/ettercap-through-0.8.4.1-out-of-bounds-read-via-http-ntlm-authentication-parsing", "name": "VulnCheck Advisory: Ettercap through 0.8.4.1 Out-of-Bounds Read via HTTP NTLM Authentication Parsing"}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "Ettercap NTLM越界读取漏洞", "_translated": true, "_saved_at": "2026-11-10T01:50:17+00:00", "_first_saved_at": "2026-11-10T01:50:17+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ifnj-97qk"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-84938", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "cwe": "CWE-79", "description": "Avada (Fusion) Builder 是 ThemeFusion 出品的商业 WordPress 页面构建插件（插件标识 fusion-builder），用于可视化搭建布局、表单和动态内容，不以公开源码仓库分发。\n受影响版本中，表单通知使用的 Dynamic Data action_hook 在媒体上传链处理 ID3 元数据与 html_attributes 时，输入清理和输出转义不足。未认证攻击者可向页面注入任意网页脚本。该路径要求管理员创作的页面已嵌入 Fusion Form，使回调处于 manage_options 上下文，并且公开页面存在配置为展示附件文章类型的 Post Cards 元素，被植入的短代码会在访问者打开该页面时执行。\n修复版本中通过已验证补丁切断该利用链的事实尚未公开。CNA 只声明 3.16.1 及更早版本受影响，时间线包含 2026-09-02 厂商通知和 2026-11-09 披露，没有修复版本号。在取得 ThemeFusion 确认的修复版本前，应移除管理员页面中的 Fusion Form，并避免在公开页面用 Post Cards 展示附件文章类型。", "effects": [{"comp_name": "fusion_builder", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,3.16.1]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-11-10", "level": "High", "mps_id": "MPS-rlt6-a0c1", "poc": false, "poc_url": [], "published_time": "2026-11-10", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-rlt6-a0c1", "name": "https://www.oscs1024.com/hd/MPS-rlt6-a0c1"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-84938", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-84938"}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/ec9636d5-80bc-418e-9348-a1d2777bf1fc?source=cve", "name": ""}, {"url": "https://avada.com/", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "Avada构建器存储XSS", "_translated": true, "_saved_at": "2026-11-10T09:04:14+00:00", "_first_saved_at": "2026-11-10T09:04:14+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-rlt6-a0c1"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-93427", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "cwe": "CWE-79", "description": "ARMember Premium 是 Repute InfoSystems 发布的商业 WordPress 会员插件，用于会员注册、内容限制、会员等级和用户资料管理，Premium 版本不提供公开源码仓库。\n受影响版本中，注册自定义字段 Profile Cover 对提交内容缺少充分的输入过滤和输出转义。未认证攻击者可在注册流程写入网页脚本并保存到站点，其他用户访问包含该字段的页面时脚本会执行，从而影响浏览器侧会话。\n修复版本中通过 7.8.2 安全更新收紧注册自定义字段 Profile Cover 的输入过滤和输出转义，阻止已保存的不受信任内容在页面访问时作为脚本执行。", "effects": [{"comp_name": "ARMember Premium", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,7.8.2)", "min_fixed_version": "7.8.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-11-10", "level": "High", "mps_id": "MPS-s48h-36mo", "poc": false, "poc_url": [], "published_time": "2026-11-10", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-s48h-36mo", "name": "https://www.oscs1024.com/hd/MPS-s48h-36mo"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-93427", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-93427"}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/e7f9dc8f-959f-4a6f-bcc2-e02f643573f2?source=cve", "name": ""}, {"url": "https://www.armemberplugin.com/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "ARMember存储型XSS", "_translated": true, "_saved_at": "2026-11-10T09:04:12+00:00", "_first_saved_at": "2026-11-10T09:04:12+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-s48h-36mo"}, {"analysis_status": 0, "articles": [{"content": "跨界内存读是指应用程序在读取内存时，未正确验证或限制读取的内存范围。攻击者利用这种漏洞可以读取应用程序内存中的敏感数据，如密码、加密密钥、会话令牌等。常见的原因是由于缓冲区溢出、格式化字符串漏洞或其他内存错误导致的。", "title": "什么是越界读取"}, {"content": "攻击者可以通过不当构造的输入来触发跨界内存读漏洞。攻击者可能会通过向应用程序发送特定的输入，使其读取超过预期的内存区域。攻击者可以利用这个漏洞来获取敏感信息，如其他用户的数据、操作系统的敏感数据或应用程序的内部状态。", "title": "越界读取常见的攻击方式"}, {"content": "- 输入验证和限制：应用程序应对所有输入数据进行严格的验证和限制。确保输入数据的长度、格式和内容符合预期，避免超出缓冲区或访问非预期的内存区域。\n- 内存安全编程实践：开发人员应使用安全的编程实践，如避免使用不安全的函数、正确处理内存分配和释放操作，以及遵循最小特权原则。\n- 使用安全的编程语言和库：选择使用安全性较高的编程语言和库，这些语言和库在内存管理和安全性方面提供了更多的保护机制。\n- 定期进行代码审查和安全测试：定期审查应用程序的代码，并进行安全测试，以发现潜在的跨界内存读漏洞。使用静态代码分析工具和漏洞扫描工具来辅助检测和修复问题。\n- 实施防御性编程技术：应用程序应采用防御性编程技术，如使用随机化地址空间布局（ASLR）、堆栈保护机制（如堆栈溢出保护）和数据执行预防（DEP）等。\n- 及时更新和修补：及时应用程序和操作系统的安全更新和补丁，以确保已知的跨界内存读漏洞得到修复。及时更新相关软件和库，以避免使用已知存在漏洞的版本。", "title": "如何预防越界读取"}], "cnvd_id": "", "cve_id": "CVE-2026-125403", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:U/C:N/I:H/A:H", "severity": "high", "base_score": 8.1}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:A/AC:L/AT:N/PR:N/UI:N/VC:N/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:4.0/AV:A/AC:L/AT:N/PR:N/UI:N/VC:N/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-125", "description": "Ettercap 是开源网络嗅探与中间人工具，用于拦截局域网流量，并可在 SSL 中间人模式下解密 HTTPS。\n受影响版本中，服务端 HTTPS 响应由 sslw_read_data 读入后，在 direction 为 SSL_SERVER 时进入 sslw_remove_sts，用于删除 Strict-Transport-Security 头。函数先把指针移过头部起始位置，第二次 memmem 仍使用整个包的长度，读取越过缓冲区末尾；返回值未检查。当响应包含该头部且本段没有后续 CRLF 时，h_end 被置为空指针加 2，header_length 异常增大，size_t 减法下溢，memcpy 以接近 SIZE_MAX 的长度读写堆内存，导致越界读和内存破坏。Ettercap 通常以 root 权限运行。\n修复版本中通过将第二次 memmem 的搜索长度改为指针到缓冲区末尾的剩余长度，并在 memmem 返回空时直接返回 -E_NOTFOUND，使未闭合的头部不再进入长度计算和 memcpy。", "effects": [{"comp_name": "ettercap", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,0.8.4.1]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界读取", "kind_en": "越界读取", "last_modified_time": "2026-11-10", "level": "High", "mps_id": "MPS-wbl5-389j", "poc": false, "poc_url": [], "published_time": "2026-11-10", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-wbl5-389j", "name": "https://www.oscs1024.com/hd/MPS-wbl5-389j"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-125403", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-125403"}, {"url": "https://github.com/Ettercap/ettercap/security/advisories/GHSA-hq2w-pg4m-6w63", "name": "GitHub Security Advisory (GHSA-hq2w-pg4m-6w63)"}, {"url": "https://github.com/Ettercap/ettercap/commit/1d8badb713579419a29a494bb463a1af59707e98", "name": ""}, {"url": "https://github.com/Ettercap/ettercap/pull/1330", "name": ""}, {"url": "https://github.com/Ettercap/ettercap/blob/v0.8.4.1/src/ec_sslwrap.c#L1294-L1322", "name": ""}, {"url": "https://www.vu 可在流量路径上对连接做实时嗅探、过滤和 SSL 拦截。\n受影响版本中，当 SSL 中间人拦截已启用且构建定义 HAVE_OPENSSL_1_1_1 时，OpenSSL 在校验扩展体之前调用 sslw_clienthello_cb，再进入 sslw_get_clienthello_sni。该函数把 ClientHello SNI 扩展中的 16 位 val_len 直接交给 strndup，没有与 SSL_client_hello_get0_ext 返回的扩展长度 len 比较。val_len 取最大值时 strndup 最多越过扩展缓冲区读取 65535 字节，结果存入 ae-\u003ehostname 并通过 SSL_set_tlsext_host_name 发往上游，可泄露相邻堆内存或在访问未映射页时使进程崩溃。\n修复版本中通过仅在 sni_type 为主机名且 val_len 小于或等于 len - 5 时调用 strndup，阻止越界长度进入拷贝；sslw_clienthello_cb 在再次保存主机名之前先释放已有的 ae-\u003ehostname。上述改动已合入 master 的 1d8badb713579419a29a494bb463a1af59707e98，截至 2026-11-10 没有包含该提交的正式发行版本。", "effects": [{"comp_name": "ettercap", "ecosystem": "linux", "versions": [{"affected_version": "[0.8.3.1,0.8.4.1]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界读取", "kind_en": "越界读取", "last_modified_time": "2026-11-10", "level": "High", "mps_id": "MPS-x213-y9k4", "poc": false, "poc_url": [], "published_time": "2026-11-10", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-x213-y9k4", "name": "https://www.oscs1024.com/hd/MPS-x213-y9k4"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-125402", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-125402"}, {"url": "https://github.com/Ettercap/ettercap/security/advisories/GHSA-v48w-7cvh-c7f4", "name": "GitHub Security Advisory (GHSA-v48w-7cvh-c7f4)"}, {"url": "https://github.com/Ettercap/ettercap/commit/1d8badb713579419a29a494bb463a1af59707e98", "name": ""}, {"url": "https://github.com/Ettercap/ettercap/pull/1330", "name": ""}, {"url": "https://github.com/Ettercap/ettercap/blob/v0.8.4.1/src/ec_sslwrap.c#L589-L604", "name": ""}, {"url": "https://www.vulncheck.com/advisories/ettercap-through-0.8.4.1-heap-out-of-bounds-read-via-tls-sni-parsing", "name": "VulnCheck Advisory: Ettercap through 0.8.4.1 Heap Out-of-Bounds Read via TLS SNI Parsing"}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "Ettercap SNI越界读", "_translated": true, "_saved_at": "2026-11-10T01:50:25+00:00", "_first_saved_at": "2026-11-10T01:50:25+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-x213-y9k4"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-115340", "cvss": {"cvssv31": [{"source": "security@progress.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N", "cwe": "CWE-522", "description": "Progress WS_FTP Server 是 Progress Software 的商业闭源 Windows 文件传输服务器，用于集中提供 FTP、FTPS 与 SSH 传输，并通过 Web Transfer Module 提供浏览器文件收发。\n受影响版本中，Web Transfer Module 在文件传输期间会把用户密码和会话标识写入临时文件。CNA 记录说明 2025.0.5 之前的 Windows 版本可能在传输过程中写入用户凭据和会话数据，2025.0.5 发行说明问题 29672 将已确认的行为落在下载流程。具备主机本地普通用户权限的攻击者可从该临时文件读取这些明文敏感数据。\n修复版本中通过停止在 Web Transfer Module 下载流程中写入用户密码和会话标识，使临时文件不再保存这些凭据和会话数据。", "effects": [{"comp_name": "ws_ftp_server", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2025.0.5)", "min_fixed_version": "2025.0.5", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "凭证保护不足", "kind_en": "凭证保护不足", "last_modified_time": "2026-11-10", "level": "High", "mps_id": "MPS-4gih-e81q", "poc": false, "poc_url": [], "published_time": "2026-11-10", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-4gih-e81q", "name": "https://www.oscs1024.com/hd/MPS-4gih-e81q"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-115340", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-115340"}, {"url": "https://community.progress.com/s/article/WS-FTP-Server-Service-Pack-November-2026", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "WS_FTP凭据明文存储", "_translated": true, "_saved_at": "2026-11-09T18:08:20+00:00", "_first_saved_at": "2026-11-09T18:08:20+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-4gih-e81q"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-122664", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:L", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:L", "cwe": "CWE-79", "description": "Broadcast Live Video（videowhisper-live-streaming-integration）是 VideoWhisper.com 发布的开源 WordPress 插件，用于在站点中提供 WebRTC、HLS、RTSP、RTMP 直播频道、播放器和公开频道列表。\n受影响版本中，未登录访问者可调用默认注册的公开 Ajax 处理函数 vwls_channels。该函数将请求参数 id 经过 sanitize_text_field 后直接拼入 JavaScript 标识符，并将包含该参数的列表 URL 经 esc_html 写入单引号 JavaScript 字符串。这些编码不能去掉语句分隔符和单引号，反射到频道列表响应中的参数会在站点源执行脚本。频道文章选项 postChannels 默认开启，默认安装即可到达该输出路径。\n修复版本中通过将 id 限制为字母、数字和下划线，并使用 wp_json_encode 与 listing_js_url_fragment 对写入脚本和事件属性的列表 URL 进行编码，切断请求参数打断 JavaScript 上下文的路径。", "effects": [{"comp_name": "videowhisper-live-streaming-integration", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,7.3.15)", "min_fixed_version": "7.3.15", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-11-10", "level": "High", "mps_id": "MPS-7uk8-dczi", "poc": false, "poc_url": [], "published_time": "2026-11-10", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-7uk8-dczi", "name": "https://www.oscs1024.com/hd/MPS-7uk8-dczi"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-122664", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-122664"}, {"url": "https://patchstack.com/database/wordpress/plugin/videowhisper-live-streaming-integration/vulnerability/wordpress-broadcast-live-video-plugin-7-3-14-cross-site-scripting-xss-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "直播插件反射型XSS", "_translated": true, "_saved_at": "2026-11-09T18:08:18+00:00", "_first_saved_at": "2026-11-09T18:08:18+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-7uk8-dczi"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-125397", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:L/I:H/A:N", "severity": "high", "base_score": 7.1}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:L/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:L/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-863", "description": "NocoBase 是开源的无代码与低代码开发平台，plugin-ai 是其官方 AI 插件，提供 AI 员工、AI 工具与子代理任务派发等大模型应用能力。\n受影响版本中，plugin-ai 子代理工具共用的 getAccessibleAIEmployee() 在查询 aiEmployees 时先展开 buildAccessibleEmployeeFilter() 生成的角色派生过滤条件，随后用调用方传入的 username 键覆盖其中的角色授权名单，使角色限制不再参与查询；认证用户可通过 dispatch-sub-agent-task 工具让未授权的业务 AI 员工执行任务并连带调用其配置的工具与权限，也可通过 get-ai-employee 读取未授权 AI 员工的提示词与工具配置。\n修复版本中通过将传入 username 限定为非空字符串、拒绝不在角色授权名单内的取值，并以 $and 合并角色过滤条件与 username 条件，使角色限制不再被覆盖，未授权 AI 员工无法被解析；该修复目前位于尚未合并的 PR #11009（commit 48f51a7d），尚未包含在任何已发布版本中。", "effects": [{"comp_name": "@nocobase/plugin-ai", "ecosystem": "npm", "versions": [{"affected_version": "[2.1.0,2.2.42]", "min_fixed_version": "", "repository": "npm", "so
