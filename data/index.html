based Buffer Overflow Remote Code Execution Vulnerability. This vulnerability allows network-adjacent attackers to execute arbitrary code on affected installations of NoMachine. Authentication is not required to exploit this vulnerability.\n\nThe specific flaw exists within the parsing of mDNS resource records. The issue results from the lack of proper validation of the length of user-supplied data prior to copying it to a heap-based buffer. An attacker can leverage this vulnerability to execute code in the context of the service account. Was ZDI-CAN-30982.", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "堆缓冲区溢出", "kind_en": "基于堆的缓冲区溢出", "last_modified_time": "2026-10-22", "level": "High", "mps_id": "MPS-4k2f-mnqa", "poc": false, "poc_url": [], "published_time": "2026-10-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-4k2f-mnqa", "name": "https://www.oscs1024.com/hd/MPS-4k2f-mnqa"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-92208", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-92208"}, {"url": "https://www.zerodayinitiative.com/advisories/ZDI-26-710/", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-92208 漏洞", "_translated": true, "_saved_at": "2026-10-22T12:50:02+00:00", "_first_saved_at": "2026-10-21T19:52:39+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-4k2f-mnqa"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-105937", "cvss": {}, "cvss_score": 8.8, "cvss_vector": "", "cwe": "CWE-862", "description": "Apache Pulsar 是开源的云原生分布式消息与流处理平台，broker 提供多租户主题管理以及 PIP-180 影子主题能力；影子主题通过预留属性 PULSAR.SHADOW_SOURCE 绑定源主题并读取其 managed ledger。\n受影响版本中，Admin REST 在创建非分区或分区主题以及更新主题属性时会接受 PULSAR.SHADOW_SOURCE，但只对目标主题做授权，不对属性中的源主题做校验，源侧 SHADOW_TOPIC 策略授权也不覆盖这些路径。默认授权提供者下，对本租户具备 tenant admin 角色的主体能够把本租户主题绑定到任意其他租户的持久化主题，随后仅凭本主题权限消费源主题仍保留且可读的消息，并可通过影子主题自身的保留、裁剪、卸载与删除路径永久删除源主题在 BookKeeper 与分层存储中的 ledger 数据。\n修复版本中通过新增 broker 配置 enableShadowTopics（默认 false）拒绝创建影子主题、设置 PULSAR.SHADOW_SOURCE 以及加载或复制既有影子主题，启用后跨租户绑定还要求 superuser 角色；同时让影子 managed ledger 不再裁剪或删除源主题 ledger 与卸载数据。", "effects": [{"comp_name": "org.apache.pulsar:pulsar-broker", "ecosystem": "maven", "versions": [{"affected_version": "[3.0.0,4.0.14)", "min_fixed_version": "4.0.14", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[4.1.0,4.2.5)", "min_fixed_version": "4.2.5", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-10-22", "level": "High", "mps_id": "MPS-59ba-f080", "poc": false, "poc_url": [], "published_time": "2026-10-22", "reference_url_list": [{"url": "http://www.mail-archive.com/announce@apache.org/msg12404.html", "name": ""}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-105937", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-105937", "name": ""}, {"url": "https:// 仅具备 lookup 权限的非租户管理员可将全部分区订阅游标移至主题末尾并删除非活跃 ledger，造成未确认积压被跳过以及历史消息永久丢失。默认授权提供者下，lookup 权限由 produce 或 consume 授予。\n修复版本中通过在读取分区元数据及截断任何分区之前，对调用者统一执行 validateAdminAccessForTenantAsync，使分区主题与非分区主题、单分区使用相同的租户管理员校验，切断普通 lookup 用户借助内部身份完成截断的路径。", "effects": [{"comp_name": "org.apache.pulsar:pulsar-broker", "ecosystem": "maven", "versions": [{"affected_version": "[2.8.0,4.0.14)", "min_fixed_version": "4.0.14", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[4.1.0,4.2.5)", "min_fixed_version": "4.2.5", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-10-22", "level": "High", "mps_id": "MPS-4f24-d042", "poc": false, "poc_url": [], "published_time": "2026-10-22", "reference_url_list": [{"url": "http://www.mail-archive.com/announce@apache.org/msg12405.html", "name": ""}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-105934", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-105934", "name": ""}, {"url": "https://lists.apache.org/thread.html/ox0vy41jlb41y2l04y7b6h2srlyqoj8o", "name": ""}, {"url": "https://pulsar.apache.org/security/CVE-2026-105934/", "name": ""}, {"url": "https://github.com/apache/pulsar/pull/26776", "name": ""}, {"url": "https://github.com/apache/pulsar/commit/b8b57698a33835c2394409e93bf7d704b779f914", "name": ""}, {"url": "https://pulsar.apache.org/release-notes/versioned/pulsar-4.0.14/", "name": ""}, {"url": "https://pulsar.apache.org/release-notes/versioned/pulsar-4.2.5/", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "Pulsar分区主题截断越权", "_translated": true, "_saved_at": "2026-10-21T22:58:20+00:00", "_first_saved_at": "2026-10-21T22:58:20+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-4f24-d042"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE com", "vector": "CVSS:3.0/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:N/A:N", "severity": "high", "base_score": 7.7}]}, "cvss_score": 7.7, "cvss_vector": "CVSS:3.0/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:N/A:N", "cwe": "CWE-918", "description": "Airbyte 是开源数据集成平台，Microsoft SharePoint 源连接器用于从 SharePoint 站点同步文件。\n受影响版本中，SharePoint 连接器 SourceMicrosoftSharePointStreamReader 的 _get_shared_drive_object 方法将 drive_id 与 object_id 直接拼入 Microsoft Graph 请求 URL，并以 requests.get 访问，未对 URI 做有效校验。已认证攻击者可触发任意服务端请求，并在连接器服务账户上下文中造成信息泄露。\n修复版本中通过官方补丁尚未发布；ZDI 以 0-day 形式披露该问题，公开源码在分析时仍保持上述请求路径，需限制与该产品的交互并等待厂商修复。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SSRF", "kind_en": "服务器端请求伪造 (SSRF)", "last_modified_time": "2026-10-22", "level": "High", "mps_id": "MPS-6emn-z04s", "poc": false, "poc_url": [], "published_time": "2026-10-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-6emn-z04s", "name": "https://www.oscs1024.com/hd/MPS-6emn-z04s"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-92203", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-92203"}, {"url": "https://www.zerodayinitiative.com/advisories/ZDI-26-703/", "name": ""}], "scope_influence": "", "tags": [], "title": "Airbyte SharePoint SSRF漏洞", "_translated": true, "_saved_at": "2026-10-21T19:52:41+00:00", "_first_saved_at": "2026-10-21T19:52:41+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-6emn-z04s"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-105942", "cvss": {}, "cvss_score": 7.7, "cvss_vector": "", "cwe": "CWE-863", "description": "Apache Pulsar 是 Apache 软件基金会开源的云原生消息与流处理平台，broker 支持通过官方 Proxy 以 proxy 角色转发客户端请求，并携带 original principal。\n受影响版本中，代理转发请求时 AuthorizationService 用代理自身的认证数据校验 original principal。启用 MultiRolesTokenAuthorizationProvider 后，getRolesAsync 会从该认证数据解析代理 token 的 roles 声明，使被代理的普通用户获得代理 token 中的超级用户或租户管理员权限。PulsarWebResource.validateAdminAccessForTenantAsync 在代理角色已是租户管理员时跳过对 original principal 的检查，经该代理转发的任意用户都能执行对应租户的管理 REST 操作。\n修复版本中通过 originalPrincipalAuthData 将 original principal 的授权改为 AuthenticationDataForwarded，并要求代理角色与 original principal 均通过 isSuperUserOrTenantAdmin；MultiRolesTokenAuthorizationProvider 仅在转发 token 认证身份等于 original principal 时才使用其中的角色。", "effects": [{"comp_name": "org.apache.pulsar:pulsar-broker", "ecosystem": "maven", "versions": [{"affected_version": "[2.8.1,4.0.14)", "min_fixed_version": "4.0.14", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[4.1.0,4.2.5)", "min_fixed_version": "4.2.5", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-10-22", "level": "High", "mps_id": "MPS-825a-7185", "poc": false, "poc_url": [], "published_time": "2026-10-22", "reference_url_list": [{"url": "http://www.mail-archive.com/announce@apache.org/msg12403.html", "name": ""}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-105942", "name": ""}, {"url": "ht e_influence": "", "tags": ["应用软件"], "title": "Rex rsync主机密钥绕过", "_translated": true, "_saved_at": "2026-10-22T01:20:18+00:00", "_first_saved_at": "2026-10-21T22:58:15+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-b2ba-e008"}, {"analysis_status": 0, "articles": [{"content": "- 编写代码时没有正确处理输入数据或没有正确验证用户输入而导致的。", "title": "什么是关键资源权限分配不当"}, {"content": "- 弱密码或未使用的密码：当管理员或系统管理员在创建帐户时，没有使用强密码或未对帐户进行密码更新时，可能会发生这种情况。弱密码可能会被黑客破解或通过其他方式轻松访问系统。\n- 未正确配置权限：在系统中，不同的资源通常需要不同的权限才能访问。如果管理员未正确配置权限，那么未经授权的用户可能会通过欺骗系统或利用其他漏洞来访问关键资源。\n- 权限重用：在某些情况下，管理员可能会将某些权限分配给某个用户，但这些权限并未被正确地限制或授权给该用户。如果其他用户尝试使用这些权限访问关键资源，那么他们可能会获得未经授权的访问权限。\n- 未正确验证用户输入：当开发人员没有正确验证用户输入时，可能会发生这种情况。例如，如果开发人员未正确过滤用户输入的用户名或密码，那么黑客可能会利用这些信息轻松地访问系统。\n", "title": "关键资源权限分配不当常见的攻击方式"}, {"content": "- 使用强密码：管理员应该使用强密码来保护系统，并定期更改密码。强密码应该包括数字、字母和符号，并且应该不同于其他帐户使用的密码。\n- 正确配置权限：管理员应该正确配置系统中不同资源所需的权限。用户可以被授予访问特定资源的权限，但不应该被授予访问其他资源的权限。\n- 权限限制：管理员应该使用权限限制来限制用户对特定资源的访问。例如，用户可以被授予访问特定文件夹的权限，但不能访问其他文件夹。\n- 输入验证：开发人员应该正确验证用户输入。例如，他们可以过滤用户输入的用户名和密码，以确保它们符合预期的格式。\n- 安全培训：管理员和用户应该接受安全培训，以便了解如何识别和避免常见的安全漏洞，例如不正确权限授予漏洞。\n- 定期更新和修补软件：系统软件和应用程序应该定期更新和修补，以确保它们不受最新安全漏洞的影响。", "title": "如何预防关键资源权限分配不当"}], "cnvd_id": "", "cve_id": "CVE-2026-115253", "cvss": {"cvssv4": [{"source": "5d1c2695-1a31-4499-88ae-e847036fd7e3", "vector": "CVSS:4.0/AV:L/AC:L/AT:P/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.3}]}, "cvss_score": 7.3, "cvss_vector": "CVSS:4.0/AV:L/AC:L/AT:P/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-732", "description": "WatchGuard Agent 是 WatchGuard 提供的商业端点代理软件，在 Windows 平台以特权服务形式运行，用于写入并维护代理安全日志。\n受影响版本中，代理日志目录权限分配不正确，本地已认证的非管理员用户可创建、修改、追加或删除该目录中的代理日志文件，并写入其他文件，从而篡改或销毁安全日志，以及向特权服务所属目录投放可执行内容以准备后续本地攻击。\n修复版本中通过官方发布 1.25.14.0000 及以上版本，纠正日志目录的权限配置，阻止非管理员本地用户继续对该目录执行写入、篡改或   <script>
    const payload = JSON.parse(document.getElementById("payload").textContent);
    const levelLabels = payload.level_labels || {};
    const items = payload.items || [];
    let filtered = items.slice();
    let activeId = null;

    const $ = (id) => document.getElementById(id);
    $("generatedAt").textContent = payload.generated_at || "-";
    $("retention").textContent = payload.retention_days ?? "-";
    $("cutoff").textContent = payload.cutoff_date || "-";
    $("count").textContent = String(payload.count ?? items.length);

    function levelClass(level) {
      const cn = levelLabels[level] || level || "";
      if (level === "Critical" || cn === "严重") return "crit";
      if (level === "High" || cn === "高危") return "high";
      return "other";
    }
    function levelText(level) {
      return levelLabels[level] || level || "-";
    }
    function esc(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }
    function scoreText(v) {
      if (v === null || v === undefined || v === "" || v === -1) return "-";
      return String(v);
    }

    function renderList() {
      const list = $("list");
      $("listCount").textContent = String(filtered.length);
      if (!filtered.length) {
        list.innerHTML = '<div class="empty">没有匹配项</div>';
        return;
      }
      list.innerHTML = filtered.map((it) => {
        const id = it.mps_id || it.cve_id;
        const active = id === activeId ? " active" : "";
        return `
          <button class="item${active}" data-id="${esc(id)}" type="button">
            <div class="item-top">
              <span class="cve">${esc(it.cve_id || it.mps_id || "-")}</span>
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
            </div>
            <div class="title">${esc(it.title || "-")}</div>
            <div class="item-foot">
              <span>CVSS ${esc(scoreText(it.cvss_score))}</span>
              <span>${esc(it.published_time || "-")}</span>
              ${it.poc ? "<span>POC</span>" : ""}
            </div>
          </button>`;
      }).join("");
      list.querySelectorAll(".item").forEach((btn) => {
        btn.addEventListener("click", () => selectById(btn.dataset.id));
      });
    }

    function refsHtml(it) {
      const refs = Array.isArray(it.reference_url_list) ? it.reference_url_list : [];
      const links = [];
      if (it._source_page) links.push({ url: it._source_page, name: "OSCS 详情" });
      if (it.cve_id) links.push({ url: `https://nvd.nist.gov/vuln/detail/${it.cve_id}`, name: "NVD" });
      refs.forEach((r) => {
        if (r && r.url) links.push({ url: r.url, name: r.name || r.url });
      });
      const seen = new Set();
      const uniq = [];
      for (const l of links) {
        if (seen.has(l.url)) continue;
        seen.add(l.url);
        uniq.push(l);
      }
      if (!uniq.length) return '<div class="box">无参考链接</div>';
      return `<div class="refs">${uniq.map((l) =>
        `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name || l.url)}</a>`
      ).join("")}</div>`;
    }

    function articlesHtml(it) {
      const arts = Array.isArray(it.articles) ? it.articles : [];
      if (!arts.length) return "";
      return `<div class="section"><h3>相关说明</h3>${arts.map((a) => `
        <div class="article">
          <h4>${esc(a.title || "说明")}</h4>
          <p>${esc(a.content || "")}</p>
        </div>`).join("")}</div>`;
    }

    function renderDetail(it) {
      const detail = $("detail");
      if (!it) {
        detail.innerHTML = '<div class="empty">暂无数据</div>';
        return;
      }
      const pocUrls = Array.isArray(it.poc_url) ? it.poc_url : [];
      detail.innerHTML = `
        <div class="d-head">
          <div>
            <h1 class="d-title">${esc(it.title || "-")}</h1>
            <div class="ids">
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
              <span class="chip">${esc(it.cve_id || "无 CVE")}</span>
              <span class="chip">${esc(it.mps_id || "-")}</span>
              ${it.poc ? '<span class="chip">有 POC</span>' : ""}
              ${it.exp ? '<span class="chip">有 EXP</span>' : ""}
            </div>
          </div>
          <div class="actions">
            ${it._source_page ? `<a class="btn" href="${esc(it._source_page)}" target="_blank" rel="noopener">OSCS</a>` : ""}
            ${it.cve_id ? `<a class="btn" href="https://nvd.nist.gov/vuln/detail/${esc(it.cve_id)}" target="_blank" rel="noopener">NVD</a>` : ""}
          </div>
        </div>
        <div class="grid">
          <div class="stat"><div class="k">CVSS</div><div class="v">${esc(scoreText(it.cvss_score))}</div></div>
          <div class="stat"><div class="k">向量</div><div class="v">${esc(it.cvss_vector || "-")}</div></div>
          <div class="stat"><div class="k">CWE</div><div class="v">${esc(it.cwe || "-")}</div></div>
          <div class="stat"><div class="k">类型</div><div class="v">${esc(it.kind || it.kind_en || "-")}</div></div>
          <div class="stat"><div class="k">公开</div><div class="v">${esc(it.published_time || "-")}</div></div>
          <div class="stat"><div class="k">利用成本</div><div class="v">${esc(it.exploit_requirement_cost || "-")}</div></div>
          <div class="stat"><div class="k">可利用性</div><div class="v">${esc(it.exploitability || "-")}</div></div>
          <div class="stat"><div class="k">修复建议</div><div class="v">${esc(it.fix_suggestion || "-")}</div></div>
        </div>
        <div class="section"><h3>描述</h3><div class="box">${esc(it.description || "无描述")}</div></div>
        ${it.scope_influence ? `<div class="section"><h3>影响范围</h3><div class="box">${esc(it.scope_influence)}</div></div>` : ""}
        ${pocUrls.length ? `<div class="section"><h3>POC 链接</h3><div class="refs">${pocUrls.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join("")}</div></div>` : ""}
        <div class="section"><h3>参考链接</h3>${refsHtml(it)}</div>
        ${articlesHtml(it)}
      `;
    }

    function selectById(id) {
      const it = filtered.find((x) => (x.mps_id || x.cve_id) === id) ||
                 items.find((x) => (x.mps_id || x.cve_id) === id);
      if (!it) return;
      activeId = it.mps_id || it.cve_id;
      renderList();
      renderDetail(it);
      const btn = document.querySelector(`.item[data-id="${CSS.escape(activeId)}"]`);
      if (btn) btn.scrollIntoView({ block: "nearest" });
      history.replaceState(null, "", "#" + encodeURIComponent(activeId));
    }

    function applyFilter(q) {
      const query = (q || "").trim().toLowerCase();
      filtered = !query ? items.slice() : items.filter((it) => {
        const blob = [
          it.cve_id, it.mps_id, it.title, it.kind, it.kind_en, it.cwe, it.description, it.level
        ].map((x) => String(x || "").toLowerCase()).join(" ");
        return blob.includes(query);
      });
      renderList();
      if (filtered.length) {
        const still = filtered.some((x) => (x.mps_id || x.cve_id) === activeId);
        selectById(still ? activeId : (filtered[0].mps_id || filtered[0].cve_id));
      } else {
        activeId = null;
        renderDetail(null);
      }
    }

    $("search").addEventListener("input", (e) => applyFilter(e.target.value));

    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement !== $("search")) {
        e.preventDefault();
        $("search").focus();
        return;
      }
      if (!filtered.length) return;
      const idx = filtered.findIndex((x) => (x.mps_id || x.cve_id) === activeId);
      if (e.key === "ArrowDown") {
        e.preventDefault();
        const next = filtered[Math.min(filtered.length - 1, Math.max(0, idx) + 1)];
        selectById(next.mps_id || next.cve_id);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        const prev = filtered[Math.max(0, idx - 1)];
        selectById(prev.mps_id || prev.cve_id);
      }
    });

    const hashId = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    if (hashId && items.some((x) => (x.mps_id || x.cve_id) === hashId)) {
      activeId = hashId;
      renderList();
      selectById(hashId);
    } else if (items.length) {
      selectById(items[0].mps_id || items[0].cve_id);
    } else {
      renderList();
      renderDetail(null);
    }
  </script>
</body>
</html>
