定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "cnvd_id": "", "cve_id": "CVE-2026-124040", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.1}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:H/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.2}]}, "cvss_score": 9.2, "cvss_vector": "CVSS:4.0/AV:N/AC:H/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-416", "description": "CivetWeb 是一个开源的 C 语言嵌入式 Web 服务器与 HTTP 库，可集成到应用程序中提供 HTTP/HTTPS 服务，并通过实验性模块支持 HTTP/2 协议。\n受影响版本中，当服务以 USE_HTTP2 宏编译且配置 enable_http2 开启时，handle_http2() 在处理 HEADERS 帧时将 HPACK 解码出的 :method 与 :path 伪头部值所在的堆缓冲指针同时保存到 conn-\u003erequest_info 的 request_method、local_uri、request_uri 与 local_uri_raw 字段；流处理结束后 free_buffered_request_header_list() 释放全部请求头部缓冲，但不清空上述别名字段。同一连接上后续收到省略这些伪头部的 HEADERS 帧时，handle_request() 继续读取已释放的指针，访问控制规则所见的方法与路径可能被攻击者影响，也可能因访问已释放内存导致服务崩溃。\n修复版本中通过，上游尚未提供包含修复的版本，issue #1379 仍处于跟踪状态；建议不以 USE_HTTP2 宏编译或在配置中关闭 enable_http2，避免进入存在缺陷的 HTTP/2 处理路径，官方发布修复版本后应及时升级。", "effects": [{"comp_name": "civetweb", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.16]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_sug "_saved_at": "2026-11-08T16:56:46+00:00", "_first_saved_at": "2026-11-08T16:56:46+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-r5e0-m26c"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-65960", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "cwe": "CWE-306", "description": "Tetragon 是 Cilium 社区开源的基于 eBPF 的安全观测与运行时强制执行组件，以 Kubernetes DaemonSet 形式部署，用于采集内核事件并通过加载 tracing policy 实现威胁检测与阻断。\n受影响版本中，Helm 默认值 tetragon.grpc.address 与 agent 二进制 --server-address 的默认值均为 localhost:54321，cmd/tetragon/main.go 的 Serve 函数以不带认证与 TLS 拦截器的 grpc.NewServer 注册特权 gRPC 服务 FineGuidanceSensors，并通过 net.Listen 在 TCP 上绑定该地址；能够在同节点运行或接管 hostNetwork Pod 的攻击者与 Tetragon 共享节点 loopback，可未认证调用 pkg/server/server.go 中 AddTracingPolicy、DeleteTracingPolicy、SetDebug 等特权方法，任意加载、删除或重配置 eBPF tracing policy 并修改调试配置，最终导致容器逃逸或权限提升。\n修复版本中通过 v1.7.0 将 Helm 默认 gRPC 端点改为 unix:///var/run/tetragon/tetragon.sock，默认部署不再在 TCP 上暴露未认证的特权接口，同节点 hostNetwork Pod 无法再经节点 loopback 直接访问该服务；配套改动把宿主机 /var/run/tetragon 挂载进 agent Pod 并同步 runtime hook 默认地址，保证修复后的 Unix-domain socket 访问路径保持可用，显式配置 TCP 监听的部署仍需自行启用 TLS 与认证防护。", "effects": [{"comp_name": "cilium/tetragon", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.7.0)", "min_fixed_version": "1.7.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "关键功能的认证机制缺失", "kind_en": "缺少关键功能的身份验证", "last_modified_time": "2026-11-07", "level": "High", "mps_id": "MPS-dhgo-e51i", "poc": false, "poc_url": [], "published_time": "2026-11-07", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-dhgo-e51i", "name": "https://www.oscs1024.com/hd/MPS-dhgo-e51i"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-65960", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-65960"}, {"url": "https://github.com/cilium/tetragon/security/advisories/GHSA-6qqg-3qf7-p3v5", "name": "https://github.com/cilium/tetragon/security/advisories/GHSA-6qqg-3qf7-p3v5"}, {"url": "https://github.com/cilium/tetragon/pull/4882", "name": "https://github.com/cilium/tetragon/pull/4882"}, {"url": "https://github.com/cilium/tetragon/commit/8e89933d3526f37c04f7523013ff32f8b1c6f62a", "name": "https://github.com/cilium/tetragon/commit/8e89933d3526f37c04f7523013ff32f8b1c6f62a"}, {"url": "https://github.com/cilium/tetragon/commit/fe46101770b960ebbf39fe9749bb20d49cf178b2", "name": "https://github.com/cilium/tetragon/commit/fe46101770b960ebbf39fe9749bb20d49cf178b2"}, {"url": "https://github.com/cilium/tetragon/releases/tag/v1.7.0", "name": "https://github.com/cilium/tetragon/releases/tag/v1.7.0"}], "scope_influence": "", "tags": ["应用软件"], "title": "Tetragon gRPC接口未授权访问", "_translated": true, "_saved_at": "2026-11-06T21:12:52+00:00", "_first_saved_at": "2026-11-06T21:12:52+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-dhgo-e51i"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-33050", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-78", "description": "GeoNode 是开源地理空间内容管理系统，用于管理与发布地理空间数据，支持通过上传接口导入矢量数据文件并写入空间数据库。\n受影响版本中，矢量文件上传后其图层名会进入 ogr2ogr 命令拼接流程，geonode/upload/handlers/common/vector.py 的 create_ogr2ogr_command 将图层名 alternate 以未转义形式拼入 -nln 参数，import_with_ogr2ogr 随后以 Popen(shell=True) 执行整条命令字符串，具备数据上传权限的低权限远程用户上传图层名携带 shell 语法的矢量文件后，可在 GeoNode 服务器上执行任意操作系统命令。\n修复版本中通过在 create_ogr2ogr_command 使用 shlex.quote 转义输入文件路径与图层名，import_with_ogr2ogr 改用 shlex.split 构造参数列表并以 shell=False 执行 ogr2ogr，OGR2OGR_COPY_WITH_DUMP 场景下的 psql 管道改为 Python 内进程对接且 PGPASSWORD 经环境变量传递，切断了图层名进入 shell 解析的路径。", "effects": [{"comp_name": "GeoNode", "ecosystem": "pip", "versions": [{"affected_version": "(-∞,5.1.0)", "min_fixed_version": "5.1.0", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-11-07", "level": "High", "mps_id": "MPS-iab8-pqey", "poc": false, "poc_url": [], "published_time": "2026-11-07", "reference_url_list": [{"url": "https://github.com/GeoNode/geonode/security/advisories/GHSA-9fpx-fr6j-2vh6", "name": ""}, {"url": "https://github.com/GeoNode/geonode/commit/1408290c0bb54872924a9b334a516db9758a2180", "name": ""}, {"url": "https://github.com/advisories/GHSA-9fpx-fr6j-2vh6", "name": ""}], "scope_influence": "", "tags": ["python", "开源"], "title": "GeoNode 命令注入漏洞", "_translated": true, "_saved_at": "2026-11-06T21:12:55+00:00", "_first_saved_at": "2026-11-06T21:12:55+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-iab8-pqey"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过向受信任的数据序列化过程中添加恶意数据，从而在序列化和反序列化过程中执行恶意代码的攻击漏洞。这种漏洞通常存在于使用序列化 (serialization) 机制存储和传输数据的程序中。\n", "title": "什么是反序列化"}, {"content": "- 注入攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码注入到程序中，从而实现代码执行的目的。\n- 反射攻击：攻击者使用反射机制，在序列化过程中动态生成恶意数据，并将恶意代码注入到程序中，从而实现代码执行的目的。\n- 缓冲区溢出攻击：攻击者通过在序列化过程中向缓冲区输入恶意数据，导致缓冲区溢出，从而破坏程序的内存管理，实现代码执行的目的。\n- 格式字符串攻击：攻击者通过在序列化过程中输入恶意数据，导致程序使用错误的格式字符串，从而实现代码执行的目的。\n- 数据流攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码作为一个数据流传递给程序，从而实现代码执行的目的。\n", "title": "反序列化常见的攻击方式"}, {"content": "- 不信任输入数据：程序应该严格检查输入数据的有效性，并避免使用不受信任的数据。\n- 使用安全的序列化机制：程序应该使用安全的序列化机制，如 JSON 或 XML 序列化，而不是第三方序列化库。\n- 最小特权原则：程序应该限制对受信任数据的处理权限，并避免在运行时修改数据。\n- 代码审查和漏洞扫描：程序应该进行代码审查和漏洞扫描，以发现和修复潜在的安全漏洞。\n", "title": "如何预防反序列化"}], "cnvd_id": "", "cve_id": "CVE-2026-87112", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-502", "description": "QA Assistants – Driven by data（插件目录标识 qa-heatmap-analytics）是 QuarkA 在 WordPress.org 开源发布的热图与行为分析插件，用于采集并展示访客点击、滚动等行为数据，发行包内捆绑 Composer 依赖 Guzzle HTTP 客户端。\n受影响版本中，插件测量端点 qahm-ajax.php 无需身份验证，record_behavioral_data 与 update_msec 分支将 POST 参数 raw_name、readers_name 经 serialize_escape() 处理后直接拼接文件路径，该函数只转义冒号与花括号、未过滤 ../ 路径穿越序列，dlevent_ver 等参数携带的内容又被未转义写入数据文件，攻击者可将可控文件植入 readers/temp 等目录；wp-cron.php 以 2 分钟周期自动触发的 qahm_cron_data_manage 计划任务扫描 readers/temp 并对其中文件调用 wrap_unserialize_static()，该函数调用 unserialize() 时未设置 allowed_classes，植入的序列化数据可实例化捆绑的 GuzzleHttp\\\\Cookie\\\\FileCookieJar，其析构过程向攻击者指定路径写入任意内容，形成任意文件写入并可导致远程代码执行。\n修复版本中通过 5.3.0.1 在 wrap_unserialize_static() 中限定 unserialize() 仅允许 stdClass 实例化，其余类反序列化为 __PHP_Incomplete_Class 且魔术方法不再触发，使 FileCookieJar 利用链失效；同时新增 raw_name、readers_name 格式校验并在入口与路径拼接处做校验和 realpath 目录约束，定时任务扫描跳过不符合测量端点命名格式的文件，切断路径穿越与对象注入两条利用链路。", "effects": [{"comp_name": "qa-heatmap-analytics", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,5.3.0.1)", "min_fixed_version": "5.3.0.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "反序列化", "kind_en": "不可信数据的反序列化", "last_modified_time": "2026-11-07", "level": "High", "mps_id": "MPS-qbxz-19ry", "poc": false, "poc_url": [], "published_time": "2026-11-07", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-qbxz-19ry", "name": "https://www.oscs1024.com/hd/MPS-qbxz-19ry"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-87112", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-87112"}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/76c5b5f1-a04b-4219-b8c0-ee53139fa787?source=cve", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/qa-heatmap-analytics/tags/5.2.0.1/class-qahm-base.php#L701", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/qa-heatmap-analytics/tags/5.2.0.1/class-qahm-admin-page-realtime.php#L183", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/qa-heatmap-analytics/tags/5.2.0.1/vendor/guzzlehttp/guzzle/src/Cookie/FileCookieJar.php#L38", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/qa-heatmap-analytics/tags/5.2.0.1/class-qahm-cron-proc.php#L698", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/qa-heatmap-analytics/tags/5.2.0.1/class-qahm-core-base.php#L780", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/qa-heatmap-analytics/tags/5.2.0.1/qahm-ajax.php#L319", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/qa-heatmap-analytics/tags/5.2.0.1/class-qahm-behavioral-data.php#L770", "name": ""}, {"url": "https://plugins.trac.wordpress.org/changeset?reponame=\u0026old=3728466%40qa-heatmap-analytics\u0026new=3728466%40qa-heatmap-analytics", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "QA Assistants插件PHP对象注入漏洞", "_translated": true, "_saved_at": "2026-11-07T08:08:53+00:00", "_first_saved_at": "2026-11-07T08:08:53+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-qbxz-19ry"}, {"analysis_status": 0, "articles": [{"content": "跨界内存读是指应用程序在读取内存时，未正确验证或限制读取的内存范围。攻击者利用这种漏洞可以读取应用程序内存中的敏感数据，如密码、加密密钥、会话令牌等。常见的原因是由于缓冲区溢出、格式化字符串漏洞或其他内存错误导致的。", "title": "什么是越界读取"}, {"content": "攻击者可以通过不当构造的输入来触发跨界内存读漏洞。攻击者可能会通过向应用程序发送特定的输入，使其读取超过预期的内存区域。攻击者可以利用这个漏洞来获取敏感信息，如其他用户的数据、操作系统的敏感数据或应用程序的内部状态。", "title": "越界读取常见的攻击方式"}, {"content": "- 输入验证和限制：应用程序应对所有输入数据进行严格的验证和限制。确保输入数据的长度、格式和内容符合预期，避免超出缓冲区或访问非预期的内存区域。\n- 内存安全编程实践：开发人员应使用安全的编程实践，如避免使用不安全的函数、正确处理内存分配和释放操作，以及遵循最小特权原则。\n- 使用安全的编程语言和库：选择使用安全性较高的编程语言和库，这些语言和库在内存管理和安全性方面提供了更多的保护机制。\n- 定期进行代码审查和安全测试：定期审查应用程序的代码，并进行安全测试，以发现潜在的跨界内存读漏洞。使用静态代码分析工具和漏洞扫描工具来辅助检测和修复问题。\n- 实施防御性编程技术：应用程序应采用防御性编程技术，如使用随机化地址空间布局（ASLR）、堆栈保护机制（如堆栈溢出保护）和数据执行预防（DEP）等。\n- 及时更新和修补：及时应用程序和操作系统的安全更新和补丁，以确保已知的跨界内存读漏洞得到修复。及时更新相关软件和库，以避免使用已知存在漏洞的版本。", "title": "如何预防越界读取"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-99272", "cvss": {}, "cvss_score": 8.2, "cvss_vector": "", "cwe": "CWE-125", "description": "Linux kernel 是开源操作系统内核，其 fs/smb/client 目录下的 CIFS/SMB 客户端（cifs 模块）负责在 Linux 主机上挂载和访问 SMB/CIFS 网络共享。\n受影响版本中，SMB2_read() 收到服务器返回的 READ 响应后，直接以 le32_to_cpu(rsp-\u003eDataLength) 作为复制长度、(char *)rsp + rsp-\u003eDataOffset 作为复制起点执行 memcpy，未校验该数据区是否落在实际收到的响应缓冲区内；当 DataOffset 为 0 时 smb2_get_data_area_len() 将数据区长度按 0 处理，smb2_check_message() 仅要求帧长不小于固定响应长度，短帧因此通过校验，而 SMB2_read() 仍使用服务器提供的 DataLength，仅受 CIFS_MAX_MSGSIZE 与调用方长度上限约束。恶意服务器可对 mfsymlinks（或 SFU）符号链接解析使用的同步读返回一个 81 字节、DataOffset 为 0 且 DataLength 为 1067 的 READ 响应，使客户端从 448 字节的接收对象中越界复制 1067 字节（KASAN 报告 slab-out-of-bounds，一般场景最多可达约 16 KiB），导致内核堆内存信息泄露并可触发内核异常。\n修复版本中通过在 SMB2_read() 内新增本地变量 data_offset，将小于 read_rsp_size 的 DataOffset（含 0 及与响应头重叠的情况）钳位为 read_rsp_size，与 handle_read_data() 对异步读路径的处理保持一致；同时新增校验，当 *nbytes 非零且 data_offset + *nbytes 超出 rsp_iov.iov_len 时返回 EIO 并将读取长度置零，memcpy 复制起点改用钳位后的 data_offset，越界数据区被直接拒绝，上述越界复制链路被切断。稳定分支 7.3.2 以回移 commit 1ba1937de005 修复，主线自 7.4-rc1 起包含修复 commit 2ec9cdf469dd。", "effects": [{"comp_name": "linux_kernel", "ecosystem": "linux", "versions": [{"affected_version": "[3.7,7.3.2)", "min_fixed_version": "7.3.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界读取", "kind_en": "越界读取", "last_modified_time": "2026-11-07", "level": "High", "mps_id": "MPS-tzio-qh83", "poc": false, "poc_url": [], "published_time": "2026-11-07", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-tzio-qh83", "name": "https://www.oscs1024.com/hd/MPS-tzio-qh83"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-99272", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-99272"}, {"url": "https://git.kernel.org/stable/c/1ba1937de005e261a8858f45bfef5da7458df94c", "name": ""}, {"url": "https://git.kernel.org/stable/c/2ec9cdf469dd32bcf33073aeb30c08e9356e0ca1", "name": ""}], "scope_influence": "", "tags": ["操作系统"], "title": "Linux内核SMB客户端越界读漏洞", "_translated": true, "_saved_at": "2026-11-07T15:20:00+00:00", "_first_saved_at": "2026-11-07T15:20:00+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-tzio-qh83"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-99277", "cvss": {}, "cvss_score": 7.7, "cvss_vector": "", "cwe": "CWE-416", "description": "ksmbd 是 Linux 内核内置的 SMB3 文件服务器实现（fs/smb/server），在内核态向客户端提供 SMB2/SMB3 文件共享服务，随主线内核发布，属于开源组件。\n受影响版本中，SMB2 SESSION SETUP 处理在协商 SMB3 及以上协议并执行会话绑定时调用 register_session_channel，struct channel 仅以裸指针 chann-\u003econn = conn 保存连接对象，未调用 ksmbd_conn_get 持有引用；ksmbd_session_unregister 会先把会话从全局会话表与每连接会话表摘除，连接断开时的 ksmbd_conn_sessions_cleanup 无法再定位该会话并执行 ksmbd_chann_del 删除通道，连接对象可在另一会话引用持有者（SMB3.1.1 会话绑定或 procfs 会话读取 show_proc_session/show_proc_sessions 遍历 chan-\u003econn）访问期间被并发释放，构成内核态 use-after-free。\n修复版本中通过在 register_session_channel 注册通道时改为 chann-\u003econn = ksmbd_conn_get(conn) 持有连接引用，并在 xa_store 失败、ksmbd_chann_del 删除通道、free_channel_list 随会话销毁清理通道三处调用 ksmbd_conn_put 归还引用，使连接生命周期覆盖全部通道引用持有者，切断连接被提前释放的因果链。", "effects": [{"comp_name": "linux_kernel", "ecosystem": "linux", "versions": [{"affected_version": "[7.3,7.3.2)", "min_fixed_version": "7.3.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "UAF", "kind_en": "免费后使用", "last_modified_time": "2026-11-07", "level": "High", "mps_id": "MPS-rt8a-9v1s", "poc": false, "poc_url": [], "published_time": "2026-11-07", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-rt8a-9v1s", "name": "https://www.oscs1024.com/hd/MPS-rt8a-9v1s"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-99277", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-99277"}, {"url": "https://git.kernel.org/stable/c/4b333aed69cfc2c8687b86b6a4364a0dffc16dd8", "name": ""}, {"url": "https://git.kernel.org/stable/c/add8d7fb04efe564193df73581889c62fc0016f1", "name": ""}], "scope_influence": "", "tags": ["操作系统"], "title": "ksmbd通道连接引用缺失漏洞", "_translated": true, "_saved_at": "2026-11-07T15:19:57+00:00", "_first_saved_at": "2026-11-07T15:19:57+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-rt8a-9v1s"}, {"analysis_status": 0, "articles": [{"content": "跨界内存读是指应用程序在读取内存时，未正确验证或限制读取的内存范围。攻击者利用这种漏洞可以读取应用程序内存中的敏感数据，如密码、加密密钥、会话令牌等。常见的原因是由于缓冲区溢出、格式化字符串漏洞或其他内存错误导致的。", "title": "什么是越界读取"}, {"content": "攻击者可以通过不当构造的输入来触发跨界内存读漏洞。攻击者可能会通过向应用程序发送特定的输入，使其读取超过预期的内存区域。攻击者可以利用这个漏洞来获取敏感信息，如其他用户的数据、操作系统的敏感数据或应用程序的内部状态。", "title": "越界读取常见的攻击方式"}, {"content": "- 输入验证和限制：应用程序应对所有输入数据进行严格的验证和限制。确保输入数据的长度、格式和内容符合预期，避免超出缓冲区或访问非预期的内存区域。\n- 内存安全编程实践：开发人员应使用安全的编程实践，如避免使用不安全的函数、正确处理内存分配和释放操作，以及遵循最小特权原则。\n- 使用安全的编程语言和库：选择使用安全性较高的编程语言和库，这些语言和库在内存管理和安全性方面提供了更多的保护机制。\n- 定期进行代码审查和安全测试：定期审查应用程序的代码，并进行安全测试，以发现潜在的跨界内存读漏洞。使用静态代码分析工具和漏洞扫描工具来辅助检测和修复问题。\n- 实施防御性编程技术：应用程序应采用防御性编程技术，如使用随机化地址空间布局（ASLR）、堆栈保护机制（如堆栈溢出保护）和数据执行预防（DEP）等。\n- 及时更新和修补：及时应用程序和操作系统的安全更新和补丁，以确保已知的跨界内存读漏洞得到修复。及时更新相关软件和库，以避免使用已知存在漏洞的版本。", "title": "如何预防越界读取"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-99275", "cvss": {}, "cvss_score": 7.6, "cvss_vector": "", "cwe": "CWE-125", "description": "Linux 内核 SMB 客户端（fs/smb/client，随内核以 GPL 开源发布的 CIFS 模块）是内核内置的 SMB2/3 协议客户端，用于挂载并访问远程 SMB 服务器的共享资源。\n受影响版本中，smb2_check_message() 在响应状态字段非零时提前判定帧有效，64 字节的 STATUS_MORE_PROCESSING_REQUIRED SESSION_SETUP 响应绕过最小 PDU 长度检查进入解析；SMB2_sess_auth_rawntlmssp_negotiate() 从复用接收缓冲区中残留的旧帧字节读取 SecurityBufferOffset 与 SecurityBufferLength，未与本次实际接收长度比对，decode_ntlmssp_challenge() 按伪造的 SecurityBufferLength 通过 kmemdup 最多向接收对象之外读取约 64 KB 内核堆内存并存入会话 target info，随 NTLMv2 AUTHENTICATE 消息回传给恶意服务器，造成内核内存信息泄露。\n修复版本中通过在 smb2_check_message() 的短错误路径之前拒绝长度不足的 SESSION_SETUP 响应，并在调用 decode_ntlmssp_challenge() 前校验 SecurityBufferOffset 与 SecurityBufferLength 之和不超过本次接收长度，非法帧被直接拒绝，越界读取回传链路被切断。", "effects": [{"comp_name": "linux_kernel", "ecosystem": "linux", "versions": [{"affected_version": "[7.3,7.3.3)", "min_fixed_version": "7.3.3", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,6.12.116]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,6.1.192]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,7.4-rc1)", "min_fixed_version": "7.4-rc1", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,6.18.62]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,6.6.162]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,5.15.225]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,7.2.15]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,5.10.274]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界读取", "kind_en": "越界读取", "last_modified_time": "2026-11-07", "level": "High", "mps_id": "MPS-cekv-n4tf", "poc": false, "poc_url": [], "published_time": "2026-11-07", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-cekv-n4tf", "name": "https://www.oscs1024.com/hd/MPS-cekv-n4tf"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-99275", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-99275"}, {"url": "https://git.kernel.org/stable/c/df63e01933886153e40706483b9635b2456ad91f", "name": ""}, {"url": "https://git.kernel.org/stable/c/4d8930afa3446041358a7db33e7b23a0bb9459b5", "name": ""}], "scope_influence": "", "tags": ["操作系统"], "title": "Linux内核SMB客户端内存泄露", "_translated": true, "_saved_at": "2026-11-07T15:19:58+00:00", "_first_saved_at": "2026-11-07T15:19:58+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-cekv-n4tf"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-120537", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "cwe": "CWE-79", "description": "TranslatePress（插件标识 translatepress-multilingual）是 Cozmoslabs 开发的 WordPress 开源多语言翻译插件，通过前台动态翻译把页面字符串采集进翻译词典表，并提供机器翻译与 AI 翻译能力。\n受影响版本中，未认证攻击者提交的评论属性等内容会被前台动态翻译流程采集为可翻译字符串并写入 trp_dictionary 词典表（includes/class-translation-render.php 约 1061 行，采集前仅经 includes/functions.php 中清洗不足的 trp_sanitize_string 处理）；includes/trp-ajax.php 是绕过 WordPress 加载、可被直接请求的独立端点，其构造函数在校验 $_POST['action'] 为 trp_get_translations_domchanges 且 originals、language、original_language 非空后查询词典表，output_translations 把查询结果以 echo json_encode($dictionary_by_original) 原样输出，未附加任何 HTML 转义标志，也未声明 Content-Type，词典中存储的脚本片段在该端点响应被浏览器当作文档打开时于站点源内执行。\n修复版本中通过在 3.3.9 的 includes/trp-ajax.php 输出前强制发送 Content-Type: application/json; charset=utf-8 与 X-Content-Type-Options: nosniff 响应头，并引入 SAFE_JSON_FLAGS（JSON_HEX_TAG、JSON_HEX_AMP、JSON_HEX_APOS、JSON_HEX_QUOT）常量供全部 json_encode 调用使用，把 \u003c、\u003e、\u0026、单引号与双引号转义为 \\uXXXX 序列，端点响应无法再被浏览器嗅探或解析为 HTML，词典中存储的恶意脚本失去执行条件，正常消费方经 JSON.parse 还原原始字符串不受影响。", "effects": [{"comp_name": "translatepress", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,3.3.9)", "min_fixed_version": "3.3.9", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-11-07", "level": "High", "mps_id": "MPS-4ds2-kj85", "poc": false, "poc_url": [], "published_time": "2026-11-07", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-4ds2-kj85", "name": "https://www.oscs1024.com/hd/MPS-4ds2-kj85"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-120537", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-120537"}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/e26d5534-dab1-4562-b770-aae2468505ac?source=cve", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/translatepress-multilingual/tags/3.3.8/includes/trp-ajax.php#L20", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/translatepress-multilingual/tags/3.3.8/includes/trp-ajax.php#L257", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/translatepress- "cvss_score": 7.1, "cvss_vector": "", "cwe": "CWE-862", "description": "Linux kernel 是开源操作系统内核，其 TUN/TAP 子系统在 drivers/net/tun.c 中实现用户态虚拟网络设备，供虚拟机、容器等场景收发流量。\n受影响版本中，tun_set_iff 通过 tun_not_capable 判断调用者能否挂接既有 TUN/TAP 设备，该函数仅在设备已设置 owner 或 group 且调用者不匹配、同时不具备 CAP_NET_ADMIN 时才返回 true，对未设置 owner 与 group 的持久化设备恒返回 false，任何能够打开 /dev/net/tun 的本地普通用户通过 TUNSETIFF ioctl 均可挂接到无主设备，进而读取或注入该虚拟网络接口上的流量。\n修复版本中通过新增 tun_permitted 重写权限判断：owner 与 group 全部未设置时要求调用者具备 CAP_NET_ADMIN，任一设置时要求调用者匹配全部已设置项，tun_set_iff 调用点改为校验失败返回 -EPERM，封堵了本地低权限用户挂接无主 TUN/TAP 设备的路径。", "effects": [{"comp_name": "linux", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,7.3.2)", "min_fixed_version": "7.3.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-11-07", "level": "High", "mps_id": "MPS-7c5o-r9bz", "poc": false, "poc_url": [], "published_time": "2026-11-07", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-7c5o-r9bz", "name": "https://www.oscs1024.com/hd/MPS-7c5o-r9bz"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-99281", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-99281"}, {"url": "https://git.kernel.org/stable/c/2f92c0286cfd58bff9d6d54c01a771073d5eb775", "name": ""}, {"url": "https://git.kernel.org/stable/c/e53d1cf05da8ea58a5743b7ce5894fb51b0b9700", "name": ""}, {"url": "https://git.kernel.org/stable/c/ffdf678dd16610e3f006dac904bd37c09684673c", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Linux 内核 TUN 权限校验缺失", "_translated": true, "_saved_at": "2026-11-07T15:19:54+00:00", "_first_saved_at": "2026-11-07T15:19:54+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-7c5o-r9bz"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "", "cvss": {}, "cvss_score": 8.8, "cvss_vector": "", "cwe": "CWE-416", "description": "FedCM（Federated Credential Management，联合凭证管理）为网页提供浏览器原生的联合身份认证能力。Android 平台上，IdentityDialogController 负责身份选择对话框的生命周期管理，当身份提供方（IdP）请求原生应用 UI 委托时，通过 Android 侧 AccountSelectionCoordinator 协作完成应用查找与界面移交。\n受影响版本中，活跃模式（active mode）的 FedCM 请求触发原生应用 UI 委托时，AccountSelectionCoordinator.showNativeAppUi() 调用 findVerifiedApp() 查找可处理 IdP 原生 intent 的应用；若无应用可用或数字资产链接校验可同步完成，回调会在 Java 方法返回前同步调用 onDismissed()，经原生侧 RequestService::CleanUpActiveRequest() 直接销毁 IdentityDialogController，而 showNativeAppUi() 仍返回 true，C++ 调用方 IdentityDialogController::ShowNativeAppUi() 随后进入 DidInvokeShowUi()，通过已释放的 this 指针向成员 did_invoke_show_ui_ 写入数据，造成浏览器进程释放后使用写入，可导致浏览器进程内存破坏与崩溃。\n修复版本中通过重构消除该缺陷：showNativeAppUi() 在包列表为空或 origin 无效时直接返回 false，其余校验结果统一经 PostTask 延迟到方法返回之后，在新增的 onNativeAppUiPackageVerified() 中再执行 dismiss 或应用启动，移除了返回前同步销毁原生调用方的执行路径。", "effects": [{"comp_name": "chrome", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,157.0.8094.0)", "min_fixed_version": "157.0.8094.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "chromium", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,157.0.8094.0)", "min_fixed_version": "157.0.8094.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "  结果增加判空、在源读取失败与缓冲区不足以容纳 BMP 头的路径释放已分配内存，切断了超大声明值进入内存分配的因果链，畸形 ICO 文件不再导致无界分配或进程崩溃。", "effects": [{"comp_name": "github.com/imgproxy/imgproxy/v3", "ecosystem": "go", "versions": [{"affected_version": "[3.3.0,4.0.16)", "min_fixed_version": "4.0.16", "repository": "go", "solutions": [], "upstream": true}]}, {"comp_name": "imgproxy", "ecosystem": "linux", "versions": [{"affected_version": "[3.3.0,4.0.16)", "min_fixed_version": "4.0.16", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "未经控制的内存分配", "kind_en": "大小值过大的内存分配", "last_modified_time": "2026-11-08", "level": "High", "mps_id": "MPS-y4ml-9bq3", "poc": false, "poc_url": [], "published_time": "2026-11-08", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-y4ml-9bq3", "name": "https://www.oscs1024.com/hd/MPS-y4ml-9bq3"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-123616", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-123616"}, {"url": "https://github.com/imgproxy/imgproxy/security/advisories/GHSA-mmq5-xm89-9pfg", "name": "GitHub Security Advisory (GHSA-mmq5-xm89-9pfg)"}, {"url": "https://www.vulncheck.com/advisories/imgproxy-3.3.0-before-4.0.16-memory-exhaustion-dos-via-ico-loader", "name": "VulnCheck Advisory: imgproxy 3.3.0 before 4.0.16 Memory Exhaustion DoS via ICO Loader"}], "scope_influence": "", "tags": ["go", "应用软件"], "title": "imgproxy ICO加载器内存耗尽漏洞", "_translated": true, "_saved_at": "2026-11-08T03:53:30+00:00", "_first_saved_at": "2026-11-08T03:53:30+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-y4ml-9bq3"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-114713", "cvss": {"cvssv31": [{"source": "cve@mitre.org", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:N/I:H/A:N", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:N/I:H/A:N", "cwe": "CWE-140", "description": "UnrealIRCd 是开源 IRC 服务器软件，采用 C 语言编写，用于搭建可互联的 IRC 网络，其 labeled-response 模块默认加载，用于实现 IRCv3 labeled-response 能力并把命令携带的 label 标签回显到回复报文中。\n受影响版本中，labeled_response_mtag_is_ok 函数仅检查 label 标签值长度不超过 64，未过滤任何字符；客户端标签值中的 \\n、\\r、\\s、\\: 等 IRCv3 转义序列会先被 message_tag_unescape 还原为真实 LF、CR、空格与分号，并经 lr_pre_command 存入 currentcmd.label，随后 gen_start_batch 与 lr_packet 通过 snprintf 以 @label=%s 形式把该值原样拼回回复报文，绕过了 message_tag_escape 的转义流程，攻击者以普通用户身份在链接两台及以上服务器的网络中构造含换行等危险字符的 label，从而向服务器间链路注入以服务器权限执行的服务器间命令。\n修复版本中通过在 labeled_response_mtag_is_ok 中新增 strpbrk 字符检查，拒绝包含空格、分号、反斜杠、回车或换行的 label 标签值，使危险字符无法进入标签回显与服务器间转发链路，切断了服务器间命令注入路径。", "effects": [{"comp_name": "unrealircd", "ecosystem": "linux", "versions": [{"affected_version": "[6.0.0,6.2.7.1)", "min_fixed_version": "6.2.7.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "分隔符转义处理不恰当", "kind_en": "分隔符中和不当", "last_modified_time": "2026-11-08", "level": "High", "mps_id": "MPS-e5mr-lkfb", "poc": false, "poc_url": [], "published_time": "2026-11-08", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-e5mr-lkfb", "name": "https://www.oscs1024.com/hd/MPS-e5mr-lkfb"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-114713", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-114713"}, {"url": "https://www.unrealircd.org/", "name": ""}, {"url": "https://www.unrealircd.org/index/news", "name": ""}, {"url": "https://forums.unrealircd.org/viewtopic.php?t=9487", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "UnrealIRCd命令注入漏洞", "_translated": true, "_saved_at": "2026-11-08T03:53:29+00:00", "_first_saved_at": "2026-11-08T03:53:29+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-e5mr-lkfb"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过构造恶意的数据，将过多的数据输入到程序的缓冲区中，使得缓冲区的空间被填满，从而溢出到程序的栈 (stack) 或堆 (heap) 中，导致程序崩溃、拒 "content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-120531", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "cwe": "CWE-79", "description": "Subscribe2（Subscribe2 – Form, Email Subscribers \u0026 Newsletters）是 weDevs 维护、托管于 WordPress.org 插件目录的开源 PHP 插件，主要提供订阅表单、订阅者管理与新文章邮件通知功能。\n受影响版本中，站点管理员在插件设置中启用弹出式订阅表单（subscribe2_options 的 ajax 选项为 1）后，未认证攻击者可携带页面下发的 s2_ajax_form_nonce 向 admin-ajax.php 的 subscribe2_submit 接口提交 data[ip]；classes/class-s2-ajax.php 的 s2_ajax_submit_handler() 对该值仅执行 sanitize_text_field，随后经 classes/class-s2-core.php 的 add() 写入订阅者表，而 sanitize_text_field 保留双引号；管理员打开后台订阅者列表时，classes/class-s2-list-table.php 的 column_email() 将存储的 ip 未转义拼入 abbr 元素 title 属性，攻击者借双引号闭合属性并注入事件属性，在管理员浏览器中执行任意脚本。\n修复版本中通过双重改动切断该链条：10.48 在 s2_ajax_submit_handler() 中以 rest_is_ip_address() 校验 data[ip]，非法值置空入库，并在订阅者列表 column_email() 等输出处对 email 与 ip 统一补充 esc_html()/esc_attr() 转义，存储与渲染两个环节均被阻断。", "effects": [{"comp_name": "subscribe2", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,10.48)", "min_fixed_version": "10.48", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-11-08", "level": "High", "mps_id": "MPS-2af1-xqi7", "poc": false, "poc_url": [], "published_time": "2026-11-08", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-2af1-xqi7", "name": "https://www.oscs1024.com/hd/MPS-2af1-xqi7"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-120531", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-120531"}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/9aa4bcc1-3c9e-451e-81ed-2059882b2ef1?source=cve", "name": ""}, {"url": "https://plugins.trac.wordpress.org/changeset/3709549/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Subscribe2 存储型 XSS 漏洞", "_translated": true, "_saved_at": "2026-11-07T23:19:04+00:00", "_first_saved_at": "2026-11-07T23:19:04+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-2af1-xqi7"}, {"analysis_status": 0, "articles": [{"content": "应用程序在处理用户输入时的不完善或缺乏验证机制，所以攻击者能够通过向应用程序发送恶意输入，利用应用程序对输入数据的错误处理方式来注入自己的恶意代码。这些恶意代码会被应用程序误认为是合法的指令或数据，并在执行过程中被执行。", "title": "什么是代码注入"}, {"content": "应用程序使用可执行动态代码的函数来执行用户可控的参数，当应用程序对于用户输入过滤不完全时，攻击者可以注入恶意代码并控制代码执行流程。", "title": "代码注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对所有用户输入进行验证和过滤，确保只接受预期的有效输入。这包括对输入数据进行输入长度验证、类型检查和格式验证等。\r\n- 使用参数化查询或预编译语句：对于数据库查询操作，应该使用参数化查询或预编译语句，确保输入数据不会被误认为是执行代码。\r\n- 最小特权原则：应用程序在执行操作系统命令或动态代码时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。\r\n- 安全编码实践：开发人员应该采用安全编码实践，包括避免使用eval函数、避免拼接用户输入的字符串作为代码执行等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止代码注入攻击。", "title": "如何预防代码注入"}], "cnvd_id": "", "cve_id": "CVE-2026-9764", "cvss": {"cvssv31": [{"source": "psirt@us.ibm.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "cwe": "CWE-94", "description": "IBM Bob Shell 是 IBM 发布的商业人工智能编程助手，用于在本地工作区提供代码辅助，并加载工作区中定义的 Model Context Protocol（MCP）服务器。\n受影响版本中，Bob Shell 对仓库提供的 MCP 服务器配置缺少充分校验。用户打开不可信仓库时，仓库内定义的 MCP 服务器会在未经用户明确同意的情况下自动初始化并执行，远程攻击者可由此在本机注入并执行任意代码。\n修复版本中通过引入 Workspace Folder Trust 机制，在用户明确信任仓库之前阻止初始化工作区定义的 MCP 服务器及其他工作区配置，使未信任仓库中的 MCP 服务器不再自动执行。", "effects": [{"comp_name": "bob", "ecosystem": "linux", "versions": [{"affected_version": "[1.0.4,2.0.2)", "min_fixed_version": "2.0.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "代码注入", "kind_en": "代码生成控制不当（“代码注入”）", "last_modified_time": "2026-11-09", "level": "High", "mps_id": "MPS-nkom-9gzj", "poc": false, "poc_url": [], "published_time": "2026-11-09", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-nkom-9gzj", "name": "https://www.oscs1024.com/hd/MPS-nkom-9gzj"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-9764", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-9764"}, {"url": "https://www.ibm.com/support/pages/node/7291535", "name": ""}], "scope_influence": "", "tags": ["AI", "应用软件"], "title": "IBM Bob代码注入漏洞", "_translated": true, "_saved_at": "2026-11-09T00:34:00+00:00", "_first_saved_at": "2026-11-08T20:57:05+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-nkom-9gzj"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-114189", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:N/A:L", "severity": "high", "base_score": 8.5}]}, "cvss_score": 8.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:N/A:L", "cwe": "CWE-89", "description": "Dynific Addons for Elementor（原名 AnyWhere Elementor，WordPress 插件标识 anywhere-elementor）是 WPVibes 维护的开源 WordPress 插件，用于在 Elementor 中创建全局模板，并作为文章或页面布局自动套用，或通过短代码嵌入。\n受影响版本中，订阅者及以上已登录用户可请求管理端 AJAX 动作 ae_prev_post，进入 Aepro\\Admin\\AdminHelper::ae_preview_post()。该方法读取请求参数 q，经 sanitize_text_field() 写入 WP_Query 的 search_post_title，再由 preview_post_filter() 调用 $wpdb-\u003eesc_like() 后把结果直接拼进 post_title 的单引号 LIKE 字面量。esc_like() 只转义百分号、下划线与反斜杠，不能转义单引号，并且会再次转义 WordPress 请求预处理加在引号前的反斜杠，使引号能够结束 SQL 字面量，从而构成盲注并读取数据库敏感信息。\n修复版本中通过将完整 LIKE 模式交给 $wpdb-\u003eprepare() 以 %s 占位绑定后写入 posts_where，使请求参数 q 不再以可拼接 SQL 片段进入查询，单引号无法结束字面量，盲注路径被切断。", "effects": [{"comp_name": "anywhere-elementor", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.3.1)", "min_fixed_version": "1.3.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-11-09", "level": "High", "mps_id": "MPS-9weu-ahv7", "poc": false, "poc_url": [], "published_time": "2026-11-09", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-9weu-ahv7", "name": "https://www.oscs1024.com/hd/MPS-9weu-ahv7"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-114189", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-114189"}, {"url": "https://patchstack.com/database/wordpress/plugin/anywhere-elementor/vulnerability/wordpress-anywhere-elementor-plugin-1-3-0-sql-injection-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "AnyWhere Elementor SQL 注入", "_translated": true, "_saved_at": "2026-11-08T16:56:45+00:00", "_first_saved_at": "2026-11-08T16:56:45+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-9weu-ahv7"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-97677", "cvss": {"cvssv31": [{"source": "psirt@us.ibm.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N", "severity": "high", "base_score": 8.1}]}, "cvss_score": 8.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N", "cwe": "CWE-22", "description": "Langflow 是开源的大语言模型应用构建平台，内置 Web 应用，用于以可视化流程编排智能体、组件和文件处理。\n受影响版本中，FileContentRetrieverComponent 将流程作者提供的 persistent_dir 直接作为磁盘目录，未执行本地文件访问隔离检查。已认证的流程作者调用 retrieve_content 或 retrieve_content_as_dataframe 时，_save_persistent_maps 会在该目录下创建 texts 与 dataframes 并写入文件内容，_load_persistent_maps 则按 text_index.json 与 dataframe_index.json 中的条目名拼接路径后读取文件，从而绕过 LANGFLOW_RESTRICT_LOCAL_FILE_ACCESS，可向服务账户可写目录写入内容，并读取服务进程可访问的配置、凭据或数据目录文件。\n修复版本中通过 _resolve_persistent_base 将 persistent_dir 交给 enforce_local_file_access 限制在调用者存储范围内，并由 _resolve_index_entry 拒绝包含路径分隔符、空字节或目录穿越的索引条目，使持久化读写停留在已授权目录内。", "effects": [{"comp_name": "langflow", "ecosystem": "pip", "versions": [{"affected_version": "[1.0.0,1.12.3)", "min_fixed_version": "1.12.3", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-11-09", "level": "High", "mps_id": "MPS-ly2e-vokn", "poc": false, "poc_url": [], "published_time": "2026-11-09", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ly2e-vokn", "name": "https://www.oscs1024.com/hd/MPS-ly2e-vokn"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-97677", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-97677"}, {"url": "https://www.ibm.com/support/pages/node/7290694", "name": ""}], "scope_influence": "", "tags": ["AI", "python", "开源"], "title": "Langflow路径穿越漏洞", "_translated": true, "_saved_at": "2026-11-09T00:34:01+00:00", "_first_saved_at": "2026-11-08T20:57:06+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ly2e-vokn"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2026-118904", "cvss": {"cvssv31": [{"source": "psirt@us.ibm.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N", "severity": "high", "base_score": 8.1}]}, "cvss_score": 8.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N", "cwe": "CWE-287", "description": "IBM webMethods Integration Server 是 IBM 提供的闭源企业集成服务器，用于在本地环境连接应用与服务，并提供包含双因素认证的访问控制。\n受影响版本中，12.1 的双因素认证备份码校验存在认证不当。远程已认证攻击者可绕过安全限制。IBM 给出的 CVSS 评分为机密性与完整性高影响、可用性无影响。公告未披露具体函数、参数或校验条件。\n修复版本中通过安装 IS_12.1_Core_Fix1 及后续核心修复，修正双因素认证备份码校验中的认证缺陷，阻断已认证攻击者绕过安全限制的路径。", "effects": [{"comp_name": "webmethods_integration_server", "ecosystem": "linux", "versions": [{"affected_version": "[12.1.0,IS_12.1_Core_Fix1)", "min_fixed_version": "IS_12.1_Core_Fix1", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[12.1,IS_12.1_Core_Fix1)", "min_fixed_version": "IS_12.1_Core_Fix1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "身份验证不当", "kind_en": "认证不当", "last_modified_time": "2026-11-09", "level": "High", "mps_id": "MPS-ncjd-zvu6", "poc": false, "poc_url": [], "published_time": "2026-11-09", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ncjd-zvu6", "name": "https://www.oscs1024.com/hd/MPS-ncjd-zvu6"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-118904", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-118904"}, {"url": "https://www.ibm.com/support/pages/node/7295306", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "webMethods认证绕过", "_translated": true, "_saved_at": "2026-11-09T00:33:59+00:00", "_first_saved_at": "2026-11-08T20:57:04+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ncjd-zvu6"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能有效地控制资源的使用，导致攻击者可以利用这个漏洞耗尽应用程序所依赖的资源。这些资源可以是计算资源（CPU、内存）、网络带宽、数据库连接或其他系统资源。攻击者可以通过发送特制的请求、恶意输入或其他方式，使应用程序消耗大量资源，导致拒绝服务或系统崩溃。", "title": "什么是拒绝服务"}, {"content": "- 消耗计算资源：攻击者可以发送计算密集型的请求，例如复杂的计算、无限循环或递归操作，以耗尽应用程序的计算资源，导致应用程序无法响应其他请求。\r\n- 消耗内存资源：攻击者可以发送大量的数据或恶意输入，以导致应用程序消耗过多的内存资源，从而使系统的可用内存耗尽，并导致应用程序崩溃或变得不可用。\r\n- 消耗网络带宽：攻击者可以发送大量的请求或大型数据包，以消耗应用程序所依赖的网络带宽。这会导致其他合法用户无法正常访问应用程序或降低系统的整体网络性能。\r\n- 消耗存储资源：攻击者可以发送大量的请求或上传大文件，以耗尽应用程序的存储资源，导致系统无法处理其他请求或存储新的数据。", "title": "拒绝服务常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对输入数据进行合理的验证和过滤，防止恶意输入导致资源消耗过高。\r\n- 实施资源限制：应用程序应该实施适当的资源限制策略，例如限制计算操作的时间或次数，限制内存使用量，限制并发连接数等，以防止资源被耗尽。\r\n- 异常处理与错误恢复：应用程序应该具备健壮的异常处理和错误恢复机制，以防止因意外错误导致资源泄漏或无法释放的情况。\r\n- 资源监控与警报：应用程序应该实施适当的资源监控和警报机制，及时发现异常的资源消耗情况，并采取相应的措施来应对。\r\n- 压力测试与性能优化：应用程序应该进行压力测试，以评估其在高负载情况下的性能，并进行必要的性能优化，以确保能够有效地处理大量请求而不耗尽资源。", "title": "如何预防拒绝服务"}], "cnvd_id": "", "cve_id": "CVE-2026-96146", "cvss": {"cvssv31": [{"source": "psirt@us.ibm.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-400", "description": "IBM SevOne Network Performance Management 是 IBM 的闭源商业网络性能管理产品，用于采集、分析并展示网络与基础设施性能数据。\n受影响版本中，远程攻击者可借助不受控的资源消耗造成拒绝服务。IBM 将该问题评定为 CWE-400，CVSS 向量为网络可达、无需权限、无需用户交互，且仅影响可用性。公开公告未披露具体接口、请求参数或资源消耗路径。\n修复版本中通过既有产品维护与版本更新消除该不受控资源消耗问题。厂商将 Data Insight 8.2.4、NMS 8.2.3 和 SD-WAN 8.2.3 列为修复目标，并说明没有额外临时规避措施。", "effects": [{"comp_name": "sevone_network_performance_management", "ecosystem": "linux", "versions": [{"affected_version": "[7.0.0,8.2.2]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "拒绝服务", "kind_en": "不受控制的资源消耗", "last_modified_time": "2026-11-09", "level": "High", "mps_id": "MPS-67i8-n3rh", "poc": false, "poc_url": [], "published_time": "2026-11-09", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-67i8-n3rh", "name": "https://www.oscs1024.com/hd/MPS-67i8-n3rh"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-96146", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-96146"}, {"url": "https://www.ibm.com/support/pages/node/7289655", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "SevOne资源耗尽漏洞", "_translated": true, "_saved_at": "2026-11-09T00:33:58+00:00", "_first_saved_at": "2026-11-08T20:57:02+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-67i8-n3rh"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-109899", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:L/A:N", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:L/A:N", "cwe": "CWE-862", "description": "Melapress Role Editor（插件标识 melapress-role-editor）是 Melapress 发布的开源 WordPress 插件，用于管理用户角色与能力，并按单篇文章授予或拒绝访问。\n受影响版本中，已登录低权限用户只要拥有任意一条单篇文章允许规则，Post_Caps::wp_admin_list_capabilities_override 会在每次能力检查中经 check_user_wp_post_type_rules 将 read_private_posts、edit_private_posts 和 edit_posts 置为 true，这些授权并不限定到被允许的文章。filter_admin_post_lists 在非 wp-admin 请求中直接返回，拒绝规则也未进入 map_meta_cap。Subscriber 等低权限用户因此可以读取未被授权的私密文章，并获得超出单篇文章范围的有限编辑能力。\n修复版本中通过将私密阅读和编辑授权限制在当前请求对应的文章以及后台主列表查询，并新增挂到 map_meta_cap 的 Post_Caps::enforce_deny_rules，对拒绝规则覆盖的阅读、编辑、删除和发布返回 do_not_allow，使单篇文章访问边界在 REST、前端和编辑器中同样生效。", "effects": [{"comp_name": "melapress-role-editor", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.4.0)", "min_fixed_version": "1.4.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-11-09", "level": "High", "mps_id": "MPS-w04k-dt7z", "poc": false, "poc_url": [], "published_time": "2026-11-09", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-w04k-dt7z", "name": "https://www.oscs1024.com/hd/MPS-w04k-dt7z"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-109899", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-109899"}, {"url": "https://patchstack.com/database/wordpress/plugin/melapress-role-editor/vulnerability/wordpress-melapress-role-editor-plugin-1-3-0-broken-access-control-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "角色编辑器授权缺失", "_translated": true, "_saved_at": "2026-11-08T16:56:48+00:00", "_first_saved_at": "2026-11-08T16:56:48+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-w04k-dt7z"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-121576", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-266", "description": "AtlasAiDev MCP Server for WordPress（插件标识 ai-workflow-automation-ai-agent-hub，亦称 AtlasMCP）是发布在 WordPress.org 的开源插件，把站点暴露为模型上下文协议服务器，供已连接的 AI 应用按当前登录用户的权限读写内容、用户与设置。\n受影响版本中，内容模型工具 awfah-content-model/update-meta 经默认 MCP 路由 awfah_mcp/mcp 接收 object、id、key 与 value，并由 Content_Model_Abilities::update_meta 调用 update_metadata。Meta_Policy::refusal 只对用户 meta 键做精确字符串锁定，锁定表包含当前表前缀的 capabilities 与 user_level，但不覆盖大小写、重音或尾随空白形成的形近键，也不覆盖多站点上其他站点的角色键。Subscriber 修改自身用户时，can_write_meta 对不以 \"_\" 开头的键直接返回允许，形近或未锁定的角色键因此写入数据库，并在默认排序规则下命中真实角色行，调用者角色被抬升。\n修复版本中通过在 Meta_Policy::refusal 增加 fold 规范化比较，并按 base_prefix 正则锁定各站点的 capabilities 与 user_level，同时让 Content_Model_Abilities::can_write_meta 调用 Meta_Policy::user_key_allowed，使没有 edit_users 能力的用户只能写入自身资料字段，阻断低权限账号改写角色 meta。", "effects": [{"comp_name": "ai-workflow-automation-ai-agent-hub", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.0.2)", "min_fixed_version": "2.0.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "特权授予不正确", "kind_en": "权限分配不正确", "last_modified_time": "2026-11-10", "level": "High", "mps_id": "MPS-nozy-g2dl", "poc": false, "poc_url": [], "p ih-e81q", "poc": false, "poc_url": [], "published_time": "2026-11-10", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-4gih-e81q", "name": "https://www.oscs1024.com/hd/MPS-4gih-e81q"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-115340", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-115340"}, {"url": "https://community.progress.com/s/article/WS-FTP-Server-Service-Pack-November-2026", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "WS_FTP凭据明文存储", "_translated": true, "_saved_at": "2026-11-09T18:08:20+00:00", "_first_saved_at": "2026-11-09T18:08:20+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-4gih-e81q"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-122664", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:L", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:L", "cwe": "CWE-79", "description": "Broadcast Live Video（videowhisper-live-streaming-integration）是 VideoWhisper.com 发布的开源 WordPress 插件，用于在站点中提供 WebRTC、HLS、RTSP、RTMP 直播频道、播放器和公开频道列表。\n受影响版本中，未登录访问者可调用默认注册的公开 Ajax 处理函数 vwls_channels。该函数将请求参数 id 经过 sanitize_text_field 后直接拼入 JavaScript 标识符，并将包含该参数的列表 URL 经 esc_html 写入单引号 JavaScript 字符串。这些编码不能去掉语句分隔符和单引号，反射到频道列表响应中的参数会在站点源执行脚本。频道文章选项 postChannels 默认开启，默认安装即可到达该输出路径。\n修复版本中通过将 id 限制为字母、数字和下划线，并使用 wp_json_encode 与 listing_js_url_fragment 对写入脚本和事件属性的列表 URL 进行编码，切断请求参数打断 JavaScript 上下文的路径。", "effects": [{"comp_name": "videowhisper-live-streaming-integration", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,7.3.15)", "min_fixed_version": "7.3.15", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-11-10", "level": "High", "mps_id": "MPS-7uk8-dczi", "poc": false, "poc_url": [], "published_time": "2026-11-10", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-7uk8-dczi", "name": "https://www.oscs1024.com/hd/MPS-7uk8-dczi"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-122664", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-122664"}, {"url": "https://patchstack.com/database/wordpress/plugin/videowhisper-live-streaming-integration/vulnerability/wordpress-broadcast-live-video-plugin-7-3-14-cross-site-sc score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:L", "cwe": "CWE-79", "description": "JetFormBuilder 是 Crocoblock 维护的开源 WordPress 插件，用于以区块方式创建动态表单，并在站点页面中渲染表单内容。\n受影响版本中，插件在网页生成阶段未正确中和输入，存在存储型跨站脚本缺陷。未认证的远程攻击者可将脚本内容写入站点，用户访问包含该内容的页面时，脚本在浏览器中执行，并在插件自身安全边界之外造成有限的机密性、完整性与可用性影响。\n修复版本中通过 3.6.8.1 安全更新收紧网页生成阶段对已存储输入的输出处理，阻止脚本内容在访问者浏览器中执行。", "effects": [{"comp_name": "jetformbuilder", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,3.6.8.1)", "min_fixed_version": "3.6.8.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-11-10", "level": "High", "mps_id": "MPS-au2g-vky4", "poc": false, "poc_url": [], "published_time": "2026-11-10", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-au2g-vky4", "name": "https://www.oscs1024.com/hd/MPS-au2g-vky4"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-123482", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-123482"}, {"url": "https://patchstack.com/database/wordpress/plugin/jetformbuilder/vulnerability/wordpress-jetformbuilder-plugin-3-6-8-cross-site-scripting-xss-vulnerability-2?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "JetFormBuilder存储型XSS漏洞", "_translated": true, "_saved_at": "2026-11-09T18:08:17+00:00", "_first_saved_at": "2026-11-09T18:08:17+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-au2g-vky4"}]}</script>
  <script>
    const payload = JSON.parse(document.getElementById("payload").textContent);
    const levelLabels = payload.level_labels || {};
    const items = payload.items || [];
    let filtered = items.slice();
    let activeId = null;

    const $ = (id) => document.getElementById(id);
    $("generatedAt").textContent = payload.generated_at || "-";
    $("retention").textContent = payload.retention_days ?? "-";
    $("cutoff").textContent = payload.cutoff_date || "-";
    $("count").textContent = String(payload.count ?? items.length);

    function levelClass(level) {
      const cn = levelLabels[level] || level || "";
      if (level === "Critical" || cn === "严重") return "crit";
      if (level === "High" || cn === "高危") return "high";
      return "other";
    }
    function levelText(level) {
      return levelLabels[level] || level || "-";
    }
    function esc(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }
    function scoreText(v) {
      if (v === null || v === undefined || v === "" || v === -1) return "-";
      return String(v);
    }

    function renderList() {
      const list = $("list");
      $("listCount").textContent = String(filtered.length);
      if (!filtered.length) {
        list.innerHTML = '<div class="empty">没有匹配项</div>';
        return;
      }
      list.innerHTML = filtered.map((it) => {
        const id = it.mps_id || it.cve_id;
        const active = id === activeId ? " active" : "";
        return `
          <button class="item${active}" data-id="${esc(id)}" type="button">
            <div class="item-top">
              <span class="cve">${esc(it.cve_id || it.mps_id || "-")}</span>
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
            </div>
            <div class="title">${esc(it.title || "-")}</div>
            <div class="item-foot">
              <span>CVSS ${esc(scoreText(it.cvss_score))}</span>
              <span>${esc(it.published_time || "-")}</span>
              ${it.poc ? "<span>POC</span>" : ""}
            </div>
          </button>`;
      }).join("");
      list.querySelectorAll(".item").forEach((btn) => {
        btn.addEventListener("click", () => selectById(btn.dataset.id));
      });
    }

    function refsHtml(it) {
      const refs = Array.isArray(it.reference_url_list) ? it.reference_url_list : [];
      const links = [];
      if (it._source_page) links.push({ url: it._source_page, name: "OSCS 详情" });
      if (it.cve_id) links.push({ url: `https://nvd.nist.gov/vuln/detail/${it.cve_id}`, name: "NVD" });
      refs.forEach((r) => {
        if (r && r.url) links.push({ url: r.url, name: r.name || r.url });
      });
      const seen = new Set();
      const uniq = [];
      for (const l of links) {
        if (seen.has(l.url)) continue;
        seen.add(l.url);
        uniq.push(l);
      }
      if (!uniq.length) return '<div class="box">无参考链接</div>';
      return `<div class="refs">${uniq.map((l) =>
        `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name || l.url)}</a>`
      ).join("")}</div>`;
    }

    function articlesHtml(it) {
      const arts = Array.isArray(it.articles) ? it.articles : [];
      if (!arts.length) return "";
      return `<div class="section"><h3>相关说明</h3>${arts.map((a) => `
        <div class="article">
          <h4>${esc(a.title || "说明")}</h4>
          <p>${esc(a.content || "")}</p>
        </div>`).join("")}</div>`;
    }

    function renderDetail(it) {
      const detail = $("detail");
      if (!it) {
        detail.innerHTML = '<div class="empty">暂无数据</div>';
        return;
      }
      const pocUrls = Array.isArray(it.poc_url) ? it.poc_url : [];
      detail.innerHTML = `
        <div class="d-head">
          <div>
            <h1 class="d-title">${esc(it.title || "-")}</h1>
            <div class="ids">
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
              <span class="chip">${esc(it.cve_id || "无 CVE")}</span>
              <span class="chip">${esc(it.mps_id || "-")}</span>
              ${it.poc ? '<span class="chip">有 POC</span>' : ""}
              ${it.exp ? '<span class="chip">有 EXP</span>' : ""}
            </div>
          </div>
          <div class="actions">
            ${it._source_page ? `<a class="btn" href="${esc(it._source_page)}" target="_blank" rel="noopener">OSCS</a>` : ""}
            ${it.cve_id ? `<a class="btn" href="https://nvd.nist.gov/vuln/detail/${esc(it.cve_id)}" target="_blank" rel="noopener">NVD</a>` : ""}
          </div>
        </div>
        <div class="grid">
          <div class="stat"><div class="k">CVSS</div><div class="v">${esc(scoreText(it.cvss_score))}</div></div>
          <div class="stat"><div class="k">向量</div><div class="v">${esc(it.cvss_vector || "-")}</div></div>
          <div class="stat"><div class="k">CWE</div><div class="v">${esc(it.cwe || "-")}</div></div>
          <div class="stat"><div class="k">类型</div><div class="v">${esc(it.kind || it.kind_en || "-")}</div></div>
          <div class="stat"><div class="k">公开</div><div class="v">${esc(it.published_time || "-")}</div></div>
          <div class="stat"><div class="k">利用成本</div><div class="v">${esc(it.exploit_requirement_cost || "-")}</div></div>
          <div class="stat"><div class="k">可利用性</div><div class="v">${esc(it.exploitability || "-")}</div></div>
          <div class="stat"><div class="k">修复建议</div><div class="v">${esc(it.fix_suggestion || "-")}</div></div>
        </div>
        <div class="section"><h3>描述</h3><div class="box">${esc(it.description || "无描述")}</div></div>
        ${it.scope_influence ? `<div class="section"><h3>影响范围</h3><div class="box">${esc(it.scope_influence)}</div></div>` : ""}
        ${pocUrls.length ? `<div class="section"><h3>POC 链接</h3><div class="refs">${pocUrls.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join("")}</div></div>` : ""}
        <div class="section"><h3>参考链接</h3>${refsHtml(it)}</div>
        ${articlesHtml(it)}
      `;
    }

    function selectById(id) {
      const it = filtered.find((x) => (x.mps_id || x.cve_id) === id) ||
                 items.find((x) => (x.mps_id || x.cve_id) === id);
      if (!it) return;
      activeId = it.mps_id || it.cve_id;
      renderList();
      renderDetail(it);
      const btn = document.querySelector(`.item[data-id="${CSS.escape(activeId)}"]`);
      if (btn) btn.scrollIntoView({ block: "nearest" });
      history.replaceState(null, "", "#" + encodeURIComponent(activeId));
    }

    function applyFilter(q) {
      const query = (q || "").trim().toLowerCase();
      filtered = !query ? items.slice() : items.filter((it) => {
        const blob = [
          it.cve_id, it.mps_id, it.title, it.kind, it.kind_en, it.cwe, it.description, it.level
        ].map((x) => String(x || "").toLowerCase()).join(" ");
        return blob.includes(query);
      });
      renderList();
      if (filtered.length) {
        const still = filtered.some((x) => (x.mps_id || x.cve_id) === activeId);
        selectById(still ? activeId : (filtered[0].mps_id || filtered[0].cve_id));
      } else {
        activeId = null;
        renderDetail(null);
      }
    }

    $("search").addEventListener("input", (e) => applyFilter(e.target.value));

    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement !== $("search")) {
        e.preventDefault();
        $("search").focus();
        return;
      }
      if (!filtered.length) return;
      const idx = filtered.findIndex((x) => (x.mps_id || x.cve_id) === activeId);
      if (e.key === "ArrowDown") {
        e.preventDefault();
        const next = filtered[Math.min(filtered.length - 1, Math.max(0, idx) + 1)];
        selectById(next.mps_id || next.cve_id);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        const prev = filtered[Math.max(0, idx - 1)];
        selectById(prev.mps_id || prev.cve_id);
      }
    });

    const hashId = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    if (hashId && items.some((x) => (x.mps_id || x.cve_id) === hashId)) {
      activeId = hashId;
      renderList();
      selectById(hashId);
    } else if (items.length) {
      selectById(items[0].mps_id || items[0].cve_id);
    } else {
      renderList();
      renderDetail(null);
    }
  </script>
</body>
</html>
