R:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-540", "description": "FortiMonitorOnSight web portal 是 Fortinet FortiMonitor 基础设施监控方案中 OnSight 采集设备（OnSight 100F）的 Web 管理控制台，用于配置采集任务并查看监控数据，属于 Fortinet 闭源商业产品。\n受影响版本中，该 Web 控制台认证所用的 JWT 使用写入源代码的静态密钥签名（CWE-540，源代码中包含敏感信息），远程未认证攻击者可自行签发伪造 JWT，或重放先前生成的持久化令牌，控制台将其视为有效认证会话，攻击者由此绕过登录并获得 OnSight 100F Web 控制台的完全管理员权限。\n修复版本中通过修复 JWT 认证机制切断伪造与重放令牌的登录路径，Fortinet 官方发行说明显示该问题以 Bug ID 1168978 在 OnSight 100F 7.2.8（2025-07-31 发布）中修复，建议用户升级至 7.2.8 或以上版本。", "effects": [{"comp_name": "fortimonitor_onsight", "ecosystem": "linux", "versions": [{"affected_version": "[7.2.0,7.2.8)", "min_fixed_version": "7.2.8", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "通过源代码导致的信息暴露", "kind_en": "在源代码中包含敏感信息", "last_modified_time": "2026-09-11", "level": "Critical", "mps_id": "MPS-272a-f186", "poc": false, "poc_url": [], "published_time": "2026-09-11", "reference_url_list": [{"url": "https://www.securityweek.com/fortinet-patches-critical-vulnerabilities-in-fortimonitoronsight-chrome-extension/", "name": ""}, {"url": "https://fortiguard.fortinet.com/psirt/FG-IR-26-170", "name": ""}, {"url": "https://docs.fortinet.com/document/fortimonitor/7.2.11/fortimonitor-onsight-100f-release-notes/598708/resolved-issues", "name": ""}, {"url": "https://securityonline.info/fortinet-vulnerabilities-patch/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "FortiMonitorOnSight JWT认证绕过漏洞", "_translated": true, "_saved_at": "2026-09-11T14:47:33+00:00", "_first_saved_at": "2026-09-11T14:47:33+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-272a-f186"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-85025", "cvss": {"cvssv31": [{"source": "psirt@us.ibm.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-863", "description": "Langflow 是 IBM 开源的 LLM 应用可视化构建框架，用于编排大模型工作流与智能体，并支持把项目内的流程以 MCP（Model Context Protocol）服务端点的形式对外发布。\n受影响版本中，以公开（无需凭证）方式分享的项目 MCP 端点在处理工具调用时，api/v1/mcp_utils.py 的 handle_call_tool 直接执行数据库中存储的流程图，未运行公共流程必需的代码执行校验 validate_public_flow_no_code_execution 与可信组件源替换 prepare_public_flow_build，敏感字段值未清洗，匿名调用以解析出的项目所有者身份运行；调用方提交的 session_id 未经隔离直接用于聊天消息存取，未认证攻击者可借公开 MCP 项目端点触发任意代码执行，并访问或修改该流程下其他用户的聊天会话。\n修复版本中通过在公开 MCP 调用路径引入统一的匿名流程防护：先以 validate_public_flow_no_code_execution 拒绝携带代码执行组件的流程，再以 prepare_public_flow_build 替换为服务端可信组件源并以 strip_secret_field_values 清洗敏感字段，匿名调用改由 _public_mcp_execution_user 返回的固定匿名主体执行，session_id 经 _public_mcp_session_namespace 与 scope_session_to_namespace 限定到 MCP 连接与流程命名空间，从而阻断任意代码执行与会话越权访问。", "effects": [{"comp_name": "langflow", "ecosystem": "pip", "versions": [{"affected_version": "[1.0.0,1.11.6)", "min_fixed_version": "1.11.6", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-09-11", "level": "Critical", "mps_id": "MPS-g4ac-b5ul", "poc": false, "poc_url": [], "published_time": "2026-09-11", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-g4ac-b5ul", "name": "https://www.oscs1024.com/hd/MPS-g4ac-b5ul"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-85025", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-85025"}, {"url": "https://www.ibm.com/support/pages/node/7286666", "name": ""}], "scope_influence": "", "tags": ["AI", "python", "开源"], "title": "Langflow 公开MCP端点未授权代码执行漏洞", "_translated": true, "_saved_at": "2026-09-10T22:11:13+00:00", "_first_saved_at": "2026-09-10T22:11:13+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-g4ac-b5ul"}, {"analysis_status": 0, "articles": [{"content": "- 程序未正确处理用户上传的文件，从而导致程序可以读取、处理或存储未经授权的文件\n", "title": "什么是任意文件上传"}, {"content": "- 欺骗攻击：攻击者可以通过发送伪造的文件来欺骗程序，从而导致程序读取、处理或存储未经授权的文件。\n- 文件格式攻击：攻击者可以通过选择特定的文件格式，例如压缩文件或 ZIP 文件，从而利用上传的文件来篡改程序的执行结果或窃取程序中的重要数据。\n", "title": "任意文件上传常见的攻击方式"}, {"content": "- 使用安全文件传输协议 (FTP):使用安全 FTP 协议可以确保上传的文件格式、大小、权限等符合预期，同时可以防止文件读取、篡改或存储漏洞。\n- 使用文件上传过滤器：使用文件上传过滤器可以过滤上传的文件，以确保文件的格式、大小、权限等符合预期，同时可以防止文件读取、篡改或存储漏洞。\n- 使用白名单机制：使用白名单机制可以只允许特定的文件格式、大小、权限等存在的文件上传，从而防止非法文件的上传和攻击。\n- 定期更新和升级程序：定期更新和升级程序可以修复已知的漏洞，并增强程序的安全性。", "title": "如何预防任意文件上传"}], "cnvd_id": "", "cve_id": "CVE-2026-8778", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-434", "description": "MIPL Grouped Checkout Fields for WooCommerce（插件标识 mipl-wc-checkout-fields）是一款在 WordPress.org 开源发布的 WooCommerce 结账字段定制插件，用于在结账页面创建、分组与整理自定义字段。\n受影响版本中，插件在 mipl-wc-checkout-fields.php 的 rest_api_init 回调中以 permission_callback 为 __return_true 注册 POST 路由 mipl-wc-cf/v1/upload_file_data，未认证攻击者可直接访问该端点；回调 include/class-mipl-wc-cf-checkout-block.php 中的 mipl_wc_upload_file 读取 $_FILES['mipl_wc_file'] 后仅执行 basename、sanitize_text_field、sanitize_title 处理，未校验文件类型与扩展名，move_uploaded_file 将任意内容写入 uploads/mipl-wc-checkout-fields/mipl_checkout_files/年/月 目录并在响应中返回 file_url，攻击者可上传 .php 等可执行文件，在 Web 服务器解析该目录 PHP 的环境下可导致远程代码执行。\n修复版本中通过在 mipl_wc_upload_file 中新增 $allowed_mimes 文件类型白名单并调用 wp_check_filetype_and_ext 校验上传文件的真实扩展名与 MIME 类型，校验失败时终止请求，同时将 upload_file_data 路由的 permission_callback 改为要求已登录用户且通过 wp_rest nonce 校验，自 1.2.3 起从入口阻断未认证任意文件上传。", "effects": [{"comp_name": "mipl-wc-checkout-fields", "ecosystem": "linux", "versions": [{"affected_version": "[1.2.0,1.2.3)", "min_fixed_version": "1.2.3", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "任意文件上传", "kind_en": "危险类型文件无限制上传", "last_modified_time": "2026-09-11", "level": "Critical", "mps_id": "MPS-pg8l-6z2w", "poc": false, "poc_url": [], "published_time": "2026-09-11", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-pg8l-6z2w", "name": "https://www.oscs1024.com/hd/MPS-pg8l-6z2w"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-8778", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-8778"}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/ac1257a9-7c8e-43aa-b21a-93a77b456aa4?source=cve", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/mipl-wc-checkout-fields/tags/1.2.1/mipl-wc-checkout-fields.php#L260", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/mipl-wc-checkout-fields/trunk/mipl-wc-checkout-fields.php#L260", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/mipl-wc-checkout-fields/tags/1.2.1/include/class-mipl-wc-cf-checkout-block.php#L415", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/mipl-wc-checkout-fields/trunk/include/class-mipl-wc-cf-checkout-block.php#L415", "name": ""}, {"url": "https://plugins.trac.wordpress.org/changeset?sfp_email=\u0026sfph_mail=\u0026reponame=\u0026new=3552029%40mipl-wc-checkout-fields%2Ftrunk%2Finclude%2Fclass-mipl-wc-cf-checkout-block.php\u0026old=3549283%40mipl-wc-checkout-fields%2Ftrunk%2Finclude%2Fclass-mipl-wc-cf-checkout-block.php\u0026sfp_email=\u0026sfph_mail=", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "MIPL WooCommerce插件任意文件上传漏洞", "_translated": true, "_saved_at": "2026-09-11T05:32:05+00:00", "_first_saved_at": "2026-09-11T05:32:05+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-pg8l-6z2w"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-88018", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-306", "description": "rclone 是一个命令行程序，用于在不同的云存储提供商之间同步文件和目录。在 1.75.1 之前，rclone 服务 s3 配置了 --auth-proxy 但没有 --auth-key，允许 authPairMiddleware 使用空的 ws.s3Secret 注册任何客户端选择的 accessKeyID。然后，gofakes3 根据相同的空密钥验证请求的 SigV4 签名，而 Server.auth 将访问密钥标识符作为用户和身份验证值传递给代理，而无需独立的每个身份密钥。因此，未经身份验证的网络攻击者可以选择任意访问密钥，使用空密钥进行签名，并到达身份验证代理脚本为该身份解析的任何后端。此问题已在版本 1.75.1 中修复。", "effects": [{"comp_name": "rclone", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.75.1)", "min_fixed_version": "1.75.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "关键功能的认证机制缺失", "kind_en": "缺少关键功能的身份验证", "last_modified_time": "2026-09-11", "level": "Critical", "mps_id": "MPS-uq1n-v84r", "poc": false, "poc_url": [], "published_time": "2026-09-11", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-uq1n-v84r", "name": "https://www.oscs1024.com/hd/MPS-uq1n-v84r"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-88018", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-88018"}, {"url": "https://github.com/rclone/rclone/security/advisories/GHSA-xwwr-4h3p-r22c", "name": "https://github.com/rclone/rclone/security/advisories/GHSA-xwwr-4h3p-r22c"}, {"url": "https://github.com/rclone/rclone/commit/90595f34f27f569be6b27c57fe5ab65057d323bd", "name": "https://github.com/rclone/rclone/commit/90595f34f27f569be6b27c57fe5ab65057d323bd"}, {"url": "https://github.com/rclone/rclone/releases/tag/v1.75.1", "name": "https://github.com/rclone/rclone/releases/tag/v1.75.1"}], "scope_influence": "", "tags": [], "title": "CVE-2026-88018漏洞", "_translated": true, "_saved_at": "2026-09-10T16:50:52+00:00", "_first_saved_at": "2026-09-10T16:50:52+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-uq1n-v84r"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2026-82107", "cvss": {"cvssv31": [{"source": "psirt@us.ibm.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:N", "severity": "critical", "base_score": 9.6}]}, "cvss_score": 9.6, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:N", "cwe": "CWE-287", "description": "IBM DataStage on Cloud Pak for Data 是 IBM 推出的商业数据集成组件，部署在 IBM Software Hub（Cloud Pak for Data）平台之上，用于企业级数据的抽取、转换与加载处理。\n受影响版本中，组件的身份认证机制处理不当，远程攻击者持有有效的认证账号即可绕过安全限制并获取敏感信息，导致敏感信息泄露与安全策略失效（CWE-287）。\n修复版本中通过修正身份认证校验处理消除该安全限制绕过风险，官方要求受影响用户升级至 5.4 patch 5 或更高版本。", "effects": [{"comp_name": "datastage_on_cloud_pak_for_data", "ecosystem": "linux", "versions": [{"affected_version": "[5.4.0.0,5.4 patch 5)", "min_fixed_version": "5.4 patch 5", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "身份验证不当", "kind_en": "认证不当", "last_modified_time": "2026-09-11", "level": "Critical", "mps_id": "MPS-v4mq-t0r1", "poc": false, "poc_url": [], "published_time": "2026-09-11", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-v4mq-t0r1", "name": "https://www.oscs1024.com/hd/MPS-v4mq-t0r1"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-82107", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-82107"}, {"url": "https://www.ibm.com/support/pages/node/7286562", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "IBM DataStage 身份认证绕过漏洞", "_translated": true, "_saved_at": "2026-09-11T00:46:07+00:00", "_first_saved_at": "2026-09-11T00:46:07+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-v4mq-t0r1"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-82100", "cvss": {"cvssv31": [{"source": "psirt@us.ibm.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:N/I:H/A:H", "severity": "critical", "base_score": 9.6}]}, "cvss_score": 9.6, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:N/I:H/A:H", "cwe": "CWE-22", "description": "IBM DataStage 是 IBM 提供的商业化数据集成（ETL）组件，随 Cloud Pak for Data 交付，用于企业级数据的抽取、转换与加载，属于闭源软件，未公开源代码。\n受影响版本中，产品对用户提供的路径缺少限制，远程认证用户可提交包含路径穿越序列的请求越过受控目录边界（CWE-22），导致服务不可用，形成拒绝服务。\n修复版本中通过修复路径穿越问题，阻断认证用户越过受限目录的访问路径，消除拒绝服务风险；官方公告要求升级至 5.4 patch 5 或更高版本。", "effects": [{"comp_name": "IBM DataStage on Cloud Pak for Data", "ecosystem": "linux", "versions": [{"affected_version": "[5.4.0.0,5.4.0.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-09-11", "level": "Critical", "mps_id": "MPS-vfdz-u10a", "poc": false, "poc_url": [], "published_time": "2026-09-11", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-vfdz-u10a", "name": "https://www.oscs1024.com/hd/MPS-vfdz-u10a"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-82100", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-82100"}, {"url": "https://www.ibm.com/support/pages/node/7286562", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "IBM DataStage 路径穿越漏洞", "_translated": true, "_saved_at": "2026-09-11T00:46:06+00:00", "_first_saved_at": "2026-09-11T00:46:06+00:00", "_source_page": "https://www.o ability": "中", "fix_suggestion": "建议修复", "kind": "密码学签名的验证不恰当", "kind_en": "密码签名验证不当", "last_modified_time": "2026-09-11", "level": "Critical", "mps_id": "MPS-bfzp-kc0x", "poc": false, "poc_url": [], "published_time": "2026-09-11", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-bfzp-kc0x", "name": "https://www.oscs1024.com/hd/MPS-bfzp-kc0x"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-89043", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-89043"}, {"url": "https://github.com/krakenjs/passport-saml-encrypted/issues/30", "name": "Reporter advisory: XML signature wrapping"}, {"url": "https://github.com/krakenjs/passport-saml-encrypted/blob/v0.1.13/lib/saml.js#L256", "name": "Signature located by an unconstrained XPath at v0.1.13"}, {"url": "https://github.com/krakenjs/passport-saml-encrypted/blob/v0.1.13/lib/saml.js#L328", "name": "Assertion selected by a separate first-match XPath at v0.1.13"}, {"url": "https://github.com/krakenjs/passport-saml-encrypted", "name": "krakenjs/passport-saml-encrypted"}, {"url": "https://www.vulncheck.com/advisories/passport-saml-encrypted-through-0.1.13-xml-signature-wrapping-via-assertion-prepending", "name": "VulnCheck Advisory: passport-saml-encrypted through 0.1.13 XML Signature Wrapping via Assertion Prepending"}], "scope_influence": "", "tags": ["npm", "开源"], "title": "passport-saml-encrypted XML签名包装认证绕过", "_translated": true, "_saved_at": "2026-09-10T19:25:29+00:00", "_first_saved_at": "2026-09-10T19:25:29+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-bfzp-kc0x"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过向受信任的数据序列化过程中添加恶意数据，从而在序列化和反序列化过程中执行恶意代码的攻击漏洞。这种漏洞通常存在于使用序列化 (serialization) 机制存储和传输数据的程序中。\n", "title": "什么是反序列化"}, {"content": "- 注入攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码注入到程序中，从而实现代码执行的目的。\n- 反射攻击：攻击者使用反射机制，在序列化过程中动态生成恶意数据，并将恶意代码注入到程序中，从而实现代码执行的目的。\n- 缓冲区溢出攻击：攻击者通过在序列化过程中向缓冲区输入恶意数据，导致缓冲区溢出，从而破坏程序的内存管理，实现代码执行的目的。\n- 格式字符串攻击：攻击者通过在序列化过程中输入恶意数据，导致程序使用错误的格式字符串，从而实现代码执行的目的。\n- 数据流攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码作为一个数据流传递给程序，从而实现代码执行的目的。\n", "title": "反序列化常见的攻击方式"}, {"content": "- 不信任输入数据：程序应该严格检查输入数据的有效性，并避免使用不受信任的数据。\n- 使用安全的序列化机制：程序应该使用安全的序列化机制，如 JSON 或 XML 序列化，而不是第三方序列化库。\n- 最小特权原则：程序应该限制对受信任数据的处理权限，并避免在运行时修改数据。\n- 代码审查和漏洞扫描：程序应该进行代码审查和漏洞扫描，以发现和修复潜在的安全漏洞。\n", "title": "如何预防反序列化"}], "cnvd_id": "", "cve_id": "CVE-2026-87719", "cvss": {"cvssv31": [{"source": "cve@gitlab.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.9}]}, "cvss_score": 9.9, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "cwe": "CWE-502", "description": "GitLab 已修复了 GitLab EE 中影响 19.1.8 之前的 18.3、19.2.6 之前的 19.2 和 19.3.2 之前的 19.3 的所有版本的问题，该问题在某些情况下可能允许具有 Duo Chat 访问权限的经过身份验证的用户使用特制的 GraphQL 订阅参数来绕过序列化并执行服务器对象查找，从而获取高级搜索实例配置和敏感凭据。", "effects": [{"comp_name": "GitLab", "ecosystem": "linux", "versions": [{"affected_version": "(18.3,19.1.8)", "min_fixed_version": "19.1.8", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(19.3,19.3.2)", "min_fixed_version": "19.3.2", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(19.2,19.2.6)", "min_fixed_version": "19.2.6", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "反序列化", "kind_en": "不可信数据的反序列化", "last_modified_time": "2026-09-12", "level": "Critical", "mps_id": "MPS-f7px-62qe", "poc": false, "poc_url": [], "published_time": "2026-09-12", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-f7px-62qe", "name": "https://www.oscs1024.com/hd/MPS-f7px-62qe"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-87719", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-87719"}, {"url": "https://gitlab.com/gitlab-org/gitlab/-/work_items/628160", "name": ""}, {"url": "https://hackerone.com/reports/4012289", "name": "HackerOne Bug Bounty Report #4012289"}], "scope_influence": "", "tags": ["应用软件"], "title": "GitLab 中不可信数据的反序列化", "_translated": true, "_saved_at": "2026-09-12T07:34:48+00:00", "_first_saved_at": "2026-09-12T07:34:48+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-f7px-62qe"}, {"analysis_status": 0, "articles": [{"content": "应用程序在处理用户输入时的不完善或缺乏验证机制，所以攻击者能够通过向应用程序发送恶意输入，利用应用程序对输入数据的错误处理方式来注入自己的恶意代码。这些恶意代码会被应用程序误认为是合法的指令或数据，并在执行过程中被执行。", "title": "什么是代码注入"}, {"content": "应用程序使用可执行动态代码的函数来执行用户可控的参数，当应用程序对于用户输入过滤不完全时，攻击者可以注入恶意代码并控制代码执行流程。", "title": "代码注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对所有用户输入进行验证和过滤，确保只接受预期的有效输入。这包括对输入数据进行输入长度验证、类型检查和格式验证等。\r\n- 使用参数化查询或预编译语句：对于数据库查询操作，应该使用参数化查询或预编译语句，确保输入数据不会被误认为是执行代码。\r\n- 最小特权原则：应用程序在执行操作系统命令或动态代码时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。\r\n- 安全编码实践：开发人员应该采用安全编码实践，包括避免使用eval函数、避免拼接用户输入的字符串作为代码执行等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止代码注入攻击。", "title": "如何预防代码注入"}], "cnvd_id": "", "cve_id": "CVE-2026-78159", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-94", "description": "WordPress 的事件日历插件在 6.17.3 及之前的所有版本中都容易通过 parse_array 函数受到远程代码执行的攻击。这是由于对小部件“类”映射的验证不足，允许普通数组有效负载绕过 is_safe_widget_instance() 对象检查并到达 Element_Classes::parse_array() 中的可调用调用接收器。这使得未经身份验证的攻击者可以在服务器上执行代码。利用该漏洞需要目标网站在tribe_events帖子上启用评论，并且至少提交一条包含精心设计的wp:legacy-widget块的评论，因为当do_blocks()处理包括评论区域的单事件HTML时，会触发攻击链。", "effects": [{"comp_name": "The Events Calendar", "ecosystem": "linux", "versions": [{"affected_version": "(0,6.17.3]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "代码注入", "kind_en": "代码生成控制不当（“代码注入”）", "last_modified_time": "2026-09-12", "level": "Critical", "mps_id": "MPS-7d85-i6u 执行的目的。\n- 数据流攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码作为一个数据流传递给程序，从而实现代码执行的目的。\n", "title": "反序列化常见的攻击方式"}, {"content": "- 不信任输入数据：程序应该严格检查输入数据的有效性，并避免使用不受信任的数据。\n- 使用安全的序列化机制：程序应该使用安全的序列化机制，如 JSON 或 XML 序列化，而不是第三方序列化库。\n- 最小特权原则：程序应该限制对受信任数据的处理权限，并避免在运行时修改数据。\n- 代码审查和漏洞扫描：程序应该进行代码审查和漏洞扫描，以发现和修复潜在的安全漏洞。\n", "title": "如何预防反序列化"}], "cnvd_id": "", "cve_id": "CVE-2026-78006", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-502", "description": "WordPress 的事件日历插件在 6.17.4 及之前的所有版本中都容易通过 is_safe_widget_instance 函数受到远程代码执行的攻击。这是由于 is_safe_widget_instance 中的保护不足造成的，可以绕过它，因为 PHP 在预解析期间会触发魔术方法，并在达到 unserialize() 之前结合 enable_rendering_widget_copied() 伪造有效的 wp_hash 完整性属性。这使得未经身份验证的攻击者可以在服务器上执行代码。无需身份验证或批准即可利用此漏洞，因为该插件的 V2 单事件模板在缓冲的评论 HTML 上运行 do_blocks()，并且 WordPress 返回一个审核哈希 URL，允许未经身份验证的评论者立即查看自己的待处理评论，从而在发生任何审核之前将注入的块标记传递到易受攻击的代码路径。这确实需要启用评论并在事件中可见。", "effects": [{"comp_name": "The Events Calendar", "ecosystem": "linux", "versions": [{"affected_version": "(0,6.17.4]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "反序列化", "kind_en": "不可信数据的反序列化", "last_modified_time": "2026-09-12", "level": "Critical", "mps_id": "MPS-e5ms-dotu", "poc": false, "poc_url": [], "published_time": "2026-09-12", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-e5ms-dotu", "name": "https://www.oscs1024.com/hd/MPS-e5ms-dotu"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-78006", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-78006"}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/a0c67346-534a-4b67-a904-fa148703707a?source=cve", "name": ""}, {"url": "https://plugins.trac.wordpress.o ire/action/editer_objet.php 的 objet_modifier() 在目标表未显式声明 champs_editables 时，把数据表全部字段（array_keys($desc['field'])）作为可写字段列表；arg 参数解析出对象类型与编号，攻击者携带有效 action nonce 以 arg=job/0 定位 spip_jobs 表，把请求参数写入 fonction、args、inclure 等列；定时任务队列调度时 inc/queue.php 的 queue_start_job() 对该行 args 执行 unserialize 并以 $fonction(...$args) 形式调用，形成任意 PHP 函数执行，最终导致远程代码执行。\n修复版本中通过将 objet_modifier() 的可写字段列表默认置空、仅接受显式声明的 champs_editables，并对 URL 直接调用补充 autoriser() 权限校验；同时为 spip_jobs 行引入基于 SpipCles::secret_des_actions() 的任务签名，queue_start_job() 在反序列化与调用前先经 queue_verify_signed_job() 校验，切断注入任务行被执行的路径。", "effects": [{"comp_name": "spip", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,4.4.18)", "min_fixed_version": "4.4.18", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "动态确定对象属性修改的控制不恰当", "kind_en": "动态确定的对象属性的受控修改不当", "last_modified_time": "2026-09-12", "level": "Critical", "mps_id": "MPS-69f5-pnsw", "poc": false, "poc_url": [], "published_time": "2026-09-12", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-69f5-pnsw", "name": "https://www.oscs1024.com/hd/MPS-69f5-pnsw"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-72710", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-72710"}, {"url": "https://blog.lexfo.fr/casse-spip-sqli-to-rce.html", "name": "Researcher Blog"}, {"url": "https://blog.spip.net/Mise-a-jour-critique-de-securite-sortie-de-SPIP-4-4-18.html", "name": "Release Notes"}, {"url": "https://www.vulncheck.com/advisories/spip-remote-code-execution-via-editer-objet-php-job-queue-injection", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "SPIP editer_objet远程代码执行漏洞", "_translated": true, "_saved_at": "2026-09-11T18:05:28+00:00", "_first_saved_at": "2026-09-11T18:05:28+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-69f5-pnsw"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-72709", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-862", "description": "SPIP 是一个采用 PHP 编写的开源内容管理系统（CMS），主要用于网站内容发布与管理，核心代码以 spip/spip、spip/ecrire 等 composer 包形式通过官方 Git 仓库 git.spip.net 发布维护。\n受影响版本中，ecrire/action/ 目录下的管理 action 端点仅依赖 securiser_action() 的 HMAC-SHA256 nonce 验证请求，action_editer_auteur_dist() 通过 nonce 校验后未调用 autoriser() 做任何权限检查，直接进入 auteur_modifier()/auteur_instituer() 处理流程；auteur_instituer() 对 login 与 pass 字段仅做非空判断便写入数据库。nonce 由 inc/securiser_action.php 用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-82098", "cvss": {"cvssv31": [{"source": "psirt@us.ibm.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-78", "description": "IBM DataStage on Cloud Pak for Data 是 IBM 商业闭源的数据集成组件，运行于 IBM Software Hub（原 Cloud Pak for Data）平台，用于企业级数据的抽取、转换与加载。\n受影响版本中，5.4.0.0 对进入操作系统命令执行路径的输入缺乏充分的中和处理（CWE-78），远程认证攻击者在可控制输入中拼接命令分隔符等特殊元素后，命令语义被改变并以服务进程权限执行任意命令，可导致机密性、完整性与可用性全面失陷。\n修复版本中通过对命令相关输入的中和与校验加固切断注入路径，IBM 于 2026-09-07 发布官方公告，修复载体为 5.4 Patch 5 及以上版本，升级后任意命令执行风险消除。", "effects": [{"comp_name": "IBM DataStage on Cloud Pak for Data", "ecosystem": "linux", "versions": [{"affected_version": "[5.4.0.0,5.4.0.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-09-11", "level": "High", "mps_id": "MPS-79ru-wpx2", "poc": false, "poc_url": [], "published_time": "2026-09-11", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-79ru-wpx2", "name": "https://www.oscs1024.com/hd/MPS-79ru-wpx2"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-82098", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-82098"}, {"url": "https://www.ibm.com/support/pages/node/7286562", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "DataStage命令注入漏洞", "_translated": true, "_saved_at": "2026-09-11T00:46:12+00:00", "_first_saved_at": "2026-09-11T00:46:12+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-79ru-wpx2"}, {"analysis_status": 0, "articles": [{"content": "跨界内存读是指应用程序在读取内存时，未正确验证或限制读取的内存范围。攻击者利用这种漏洞可以读取应用程序内存中的敏感数据，如密码、加密密钥、会话令牌等。常见的原因是由于缓冲区溢出、格式化字符串漏洞或其他内存错误导致的。", "title": "什么是越界读取"}, {"content": "攻击者可以通过不当构造的输入来触发跨界内存读漏洞。攻击者可能会通过向应用程序发送特定的输入，使其读取超过预期的内存区域。攻击者可以利用这个漏洞来获取敏感信息，如其他用户的数据、操作系统的敏感数据或应用程序的内部状态。", "title": "越界读取常见的攻击方式"}, {"content": "- 输入验证和限制：应用程序应对所有输入数据进行严格的验证和限制。确保输入数据的长度、格式和内容符合预期，避免超出缓冲区或访问非预期的内存区域。\n- 内存安全编程实践：开发人员应使用安全的编程实践，如避免使用不安全的函数、正确处理内存分配和释放操作，以及遵循最小特权原则。\n- 使用安全的编程语言和库：选择使用安全性较高的编程语言和库，这些语言和库在内存管理和安全性方面提供了更多的保护机制。\n- 定期进行代码审查和安全测试：定期审查应用程序的代码，并进行安全测试，以发现潜在的跨界内存读漏洞。使用静态代码分析工具和漏洞扫描工具来辅助检测和修复问题。\n- 实施防御性编程技术：应用程序应采用防御性编程技术，如使用随机化地址空间布局（ASLR）、堆栈保护机制（如堆栈溢出保护）和数据执行预防（DEP）等。\n- 及时更新和修补：及时应用程序和操作系统的安全更新和补丁，以确保已知的跨界内存读漏洞得到修复。及时更新相关软件和库，以避免使用已知存在漏洞的版本。", "title": "如何预防越界读取"}], "cnvd_id": "", "cve_id": "CVE-2026-89046", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:H", "severity": "high", "base_score": 8.2}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:L/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:L/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-125", "description": "zstd-jni 是开源的 Zstandard 压缩算法 Java 绑定库，通过 JNI 封装原生 zstd 实现，供 Java 应用进行高性能压缩、解压与帧信息解析。\n受影响版本中，com.github.luben.zstd.Zstd 的 getFrameContentSize 方法对 srcPosition 与 srcSize 仅做上界校验，未拒绝负值；负数 srcPosition 可绕过 srcPosition \u003e= src.length 与 srcPosition + srcSize \u003e src.length 两处检查进入原生层，jni_zstd.c 中的 getFrameContentSize0 在 GetPrimitiveArrayCritical 取得数组首址后以 (char*)src_buff + offset 计算帧头解析起始地址，负偏移使指针越过数组起点、负长度被转换为巨大 size_t，帧头解析器越界读取内存，导致信息泄露或 JVM 崩溃。\n修复版本中通过在 getFrameContentSize 入口补充 srcPosition \u003c 0 与 srcSize \u003c 0 前置校验，任一参数为负时立即抛出 ArrayIndexOutOfBoundsException，阻止非法偏移进入原生帧头解析，同批修复在 ZstdInputStreamNoFinalizer 的 read 与 readInternal 中补充 len \u003c 0 校验，消除越界读取路径。", "effects": [{"comp_name": "com.github.luben:zstd-jni", "ecosystem": "maven", "versions": [{"affected_version": "[1.5.5-6,1.5.7-14)", "min_fixed_version": "1.5.7-14", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界读取", "kind_en": "越界读取", "last_modified_time": "2026-09-11", "level": "High", "mps_id": "MPS-agmx-echj", "poc": false, "poc_url": [], "published_time": "2026-09-11", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-agmx-echj", "name": "https://www.oscs1024.com/hd/MPS-agmx-echj"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-89046", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-89046"}, {"url": "https://github.com/luben/zstd-jni/security/advisories/GHSA-rm53-6wf5-f34m", "name": "GitHub Security Advisory (GHSA-rm53-6wf5-f34m)"}, {"url": "https://github.com/luben/zstd-jni/commit/dd08685ef913a32e76fb27f43470035c06758646", "name": "Fix commit: reject a negative source position and size"}, {"url": "https://github.com/luben/zstd-jni/blob/v1.5.7-13/src/main/java/com/github/luben/zstd/Zstd.java#L730", "name": "Upper-bound-only bounds check at v1.5.7-13"}, {"url": "https://github.com/luben/zstd-jni/blob/v1.5.7-13/src/main/native/jni_zstd.c#L87", "name": "Native routine that offsets the critical array pointer without re-validating"}, {"url": "https://github.com/luben/zstd-jni/releases/tag/v1.5.7-14", "name": "zstd-jni v1.5.7-14 Release Notes"}, {"url": "https://github.com/luben/zstd-jni", "name": "luben/zstd-jni"}, {"url": "https://www.vulncheck.com/advisories/zstd-jni-1.5.5-6-through-1.5.7-13-out-of-bounds-read-via-negative-offset", "name": "VulnCheck Advisory: zstd-jni 1.5.5-6 through 1.5.7-13 Out-of-Bounds Read via Negative Offset"}], "scope_influence": "", "tags": ["java", "开源"], "title": "zstd-jni越界读取漏洞", "_translated": true, "_saved_at": "2026-09-10T19:25:30+00:00", "_first_saved_at": "2026-09-10T19:25:30+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-agmx-echj"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-84889", "cvss": {"cvssv31": [{"source": "psirt@us.ibm.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-22", "description": "Langflow 是 IBM 开源的 LLM 应用可视化编排框架，用于以拖拽工作流方式构建 Agent 与 RAG 等大模型应用，提供 REST API、文件上传以及本地、S3、Google Drive 等多种文件存储后端。\n受影响版本中，文件上传接口 upload_user_file 直接信任 multipart 请求 Content-Disposition 中的文件名并拼入存储路径，携带 ../ 序列的文件名可把上传内容写到用户存储边界之外；Write File 组件 SaveToFileComponent 的 save_to_file 方法在本地保存分支 _save_to_local 中对租户可控的 file_name 输入执行 Path(...).expanduser() 展开，未做路径包含校验即创建父目录并写入文件。持有有效 API key 的低权限认证用户可将任意内容写入服务器进程可访问的任意路径，覆盖敏感文件后实现任意代码执行。\n修复版本中通过双重收敛切断该攻击链：upload_user_file 在入口拒绝包含路径分隔符、.. 序列、空字节与控制字符的 P 组件处理发送至 EPDLP 进程端口的消息时对长度相关参数执行整数运算且缺少溢出校验，本地高权限攻击者向该端口发送构造消息可触发整数溢出，导致内核池溢出与内存破坏，可能造成本地拒绝服务、任意代码执行或权限提升；成功利用需要客户端配置中启用 EPDLP 模块，且目标系统关闭内存完整性（Memory Integrity）保护。\n修复版本中通过修复该整数运算缺陷切断内核池溢出路径，官方将 141.0 及以上版本列为不受影响版本，建议用户升级至 141.0 及以上版本，并保持内存完整性（Memory Integrity）保护开启以降低风险。", "effects": [{"comp_name": "netskope_endpoint_dlp", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,141.0)", "min_fixed_version": "141.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "整数溢出或环绕", "kind_en": "整数溢出或环绕", "last_modified_time": "2026-09-11", "level": "High", "mps_id": "MPS-tb1f-ismc", "poc": false, "poc_url": [], "published_time": "2026-09-11", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-tb1f-ismc", "name": "https://www.oscs1024.com/hd/MPS-tb1f-ismc"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-16174", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-16174"}, {"url": "https://support.netskope.com/s/article/Netskope-Security-Advisory-Netskope-Client-Endpoint-DLP-Security-Notice---NSKPSA-2026-010", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Netskope Endpoint DLP整数溢出漏洞", "_translated": true, "_saved_at": "2026-09-11T00:46:05+00:00", "_first_saved_at": "2026-09-11T00:46:05+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-tb1f-ismc"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-19486", "cvss": {"cvssv4": [{"source": "f45cbf4e-4146-4068-b7e1-655ffc2c548c", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:L/SI:L/SA:L/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:Amber", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:L/SI:L/SA:L/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X 1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "high", "base_score": 7.5}], "cvssv4": [{"source": "twcert@cert.org.tw", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-307", "description": "铠锋企业（Kingdom Communication Associated）智慧对讲系统是面向楼宇与社区场景的闭源 IP 可视对讲产品，涵盖 EH3040、EH4200、EH1000B、EH2070 等机型，提供门口机通话、门禁控制与 Web 管理功能。\n受影响版本中，设备登录认证流程缺失暴力破解防护机制，未对认证失败次数施加限制，未经身份鉴别的远程攻击者可对登录接口持续提交大量口令猜测尝试，命中合法账号口令后取得相应账号的访问权限，进而获取系统内的受保护信息。\n修复版本中通过在认证流程中补充暴力破解防护机制切断口令穷举链路，官方公告确认 EH3040、EH4200 需升级至 2.5.0A 及以上版本，EH1000B 需升级至 2.7.0A 及以上版本，EH2070 需升级至 2.8.0A 及以上版本。", "effects": [{"comp_name": "kingdom_communication_associated:eh1000b", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.7.0A)", "min_fixed_version": "2.7.0A", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "kingdom_communication_associated:eh2070", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.8.0A)", "min_fixed_version": "2.8.0A", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "kingdom_communication_associated:eh3040", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.5.0A)", "min_fixed_version": "2.5.0A", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "kingdom_communication_associated:eh4200", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.5.0A)", "min_fixed_version": "2.5.0A", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "过多认证尝试的限制不恰当", "kind_en": "对过多身份验证尝试的不当限制", "last_modified_time": "2026-09-11", "level": "High", "mps_id": "MPS-xwbk-ozcf", "poc": false, "poc_url": [], "published_time": "2026-09-11", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-xwbk-ozcf", "name": "https://www.oscs1024.com/hd/MPS-xwbk-ozcf"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-89174", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-89174"}, {"url": "https://www.twcert.org.tw/tw/cp-132-11198-b8bba-1.html", "name": ""}, {"url": "https://www.twcert.org.tw/en/cp-139-11199-38e1e-2.html", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "铠锋智慧对讲系统暴力破解漏洞", "_translated": true, "_saved_at": "2026-09-11T10:25:48+00:00", "_first_saved_at": "2026-09-11T10:25:48+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-xwbk-ozcf"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-88051", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-787", "description": "Tesseract 是 Google 开源 OCR 引擎，用于图像文字识别，被广泛嵌入各类文档处理与 OCR 服务。\n受影响版本中，回调形式的 GenericVector\u003cT\u003e::read（src/ccutil/genericvector.h）从 .traineddata 模型先后读入两个相互独立的 int32 字段 reserved 与 size_used_，前者经 reserve(reserved) 分配堆缓冲区，后者直接驱动 cb(f, data_ + i) 元素写入循环，两个字段既无上限校验也无 size_used_ \u003c= reserved 不变式检查；攻击者构造含 version_id \u003e= 4 的 TESSDATA_INTTEMP 组件并令 reserved 取小值、size_used_ 取大值，目标经 TessBaseAPI::Init 以 legacy 引擎加载该模型触发 fontinfo_table_.read(fp, read_info) 时，对 FontInfo 结构体的写入越过堆缓冲区边界，造成堆越界写、堆破坏、崩溃或可控内存破坏。\n修复版本中通过在写入循环前增加双重校验切断上述因果链：拒绝负数或超过 50000000 上限的 reserved，并拒绝 size_used_ \u003c 0 或 size_used_ \u003e reserved 的模型文件，使不一致的计数无法进入写入循环，不一致的模型在加载时直接报错中止。", "effects": [{"comp_name": "tesseract", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,5.5.3]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-09-11", "level": "High", "mps_id": "MPS-9t24-mp8l", "poc": false, "poc_url": [], "published_time": "2026-09-11", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-9t24-mp8l", "name": "https://www.oscs1024.com/hd/MPS-9t24-mp8l"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-88051", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-88051"}, {"url": "https://github.com/tesseract-ocr/tesseract/security/advisories/GHSA-88qp-4g94-3rf3", "name": "https://github.com/tesseract-ocr/tesseract/security/advisories/GHSA-88qp-4g94-3rf3"}, {"url": "https://github.com/tesseract-ocr/tesseract/commit/56e09ca12e751623fe796ce1554ce704bffd2ef0", "name": "https://github.com/tesseract-ocr/tesseract/commit/56e09ca12e751623fe796ce1554ce704bffd2ef0"}], 界指针写入，导致堆破坏、崩溃或潜在可控内存破坏。\n修复版本中通过在读取计数后立即校验 unicharset_size、NumClassPruners、NumClasses 以及每类 NumProtos、NumProtoSets、NumConfigs 是否超出对应数组容量，超限时释放对象并返回加载失败，同时以数组容量约束析构循环、沿 InitAdaptiveClassifier 与 program_editup 链路传播失败，使初始化优雅失败而非带病继续；该修复目前位于上游主分支提交 8b0574680f3b22f246ade6a4c8e3029104255c63，尚未随正式发布版本提供。", "effects": [{"comp_name": "tesseract", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,5.5.3]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-09-11", "level": "High", "mps_id": "MPS-riq0-ac5z", "poc": false, "poc_url": [], "published_time": "2026-09-11", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-riq0-ac5z", "name": "https://www.oscs1024.com/hd/MPS-riq0-ac5z"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-88053", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-88053"}, {"url": "https://github.com/tesseract-ocr/tesseract/security/advisories/GHSA-rphx-x795-5qjv", "name": "https://github.com/tesseract-ocr/tesseract/security/advisories/GHSA-rphx-x795-5qjv"}, {"url": "https://github.com/tesseract-ocr/tesseract/commit/8b0574680f3b22f246ade6a4c8e3029104255c63", "name": "https://github.com/tesseract-ocr/tesseract/commit/8b0574680f3b22f246ade6a4c8e3029104255c63"}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "Tesseract OCR 堆越界写入漏洞", "_translated": true, "_saved_at": "2026-09-10T19:25:34+00:00", "_first_saved_at": "2026-09-10T19:25:34+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-riq0-ac5z"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-88937", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:A/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:A/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-22", "description": "knowns 是一个使用 Go 编写、通过 npm 分发并托管于 GitHub 的开源 AI 原生项目管理 CLI（knowns-dev/knowns），内置代码生成模板引擎，用于按模板批量创建与修改项目文件。\n受影响版本中，internal/codegen/template_engine.go 的 resolveDest 对绝对路径目标原样返回，对相对路径仅做 filepath.Join 拼接而不校验结果是否落在项目根内，add、modify、append 动作经该函数解析目标后交给 writeFile 执行 os.MkdirAll 与 os.WriteFile 写盘，addMany 则把攻击者可控的 action.Destination 直接与 ProjectRoot 拼接；loadAndRenderTemplate 还允许 action.Template 携带绝对路径或 ../ 穿越段，经 os.ReadFile 读取项目外任意文件。攻击者发布内置恶意模板的仓库并诱导用户执行 knowns import add 导入后，用户运行 knowns template run 时恶意模板能够覆写 ~/.bashrc、crontab 或 ~/.ssh/authorized_keys 等宿主文件获得持久代码执行，也能把 ~/.ssh/id_rsa 等机密文件渲染写入项目内路径完成外带。\n修复版本中通过 safepath 强制项目根边界校验的修复方案已由上游在 GHSA-68cq-4rwm-f7jr 中给出，但截至 2026-09-11 尚无发布版本包含该修复，最新版本 0.33.0 仍受影响，用户需在官方修复发布前避免导入 8.3}]}, "cvss_score": 8.3, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:R/S:C/C:H/I:H/A:H", "cwe": "CWE-347", "description": "Device Manager 是 SICK AG 随工程工具 Sentio Creator 分发的闭源设备管理扩展，用于在 Sentio Creator 中导入和管理设备驱动包，其 1.4.1 之前的版本受此漏洞影响。\n受影响版本中，Device Manager 对设备驱动包的加密签名校验存在缺陷（CWE-347），攻击者可构造携带恶意代码的设备驱动包并诱导用户上传导入，恶意驱动包绕过驱动校验机制，其中携带的攻击者代码随后被执行，最终在目标系统上实现任意代码执行；该攻击可通过网络发起且无需目标权限，但依赖用户交互并需绕过驱动验证机制，利用复杂度较高。\n修复版本中通过将 Device Manager 更新至 1.4.1 修复驱动包签名校验缺陷，阻断恶意驱动包绕过验证并执行代码的路径；由于该扩展可独立于 Sentio Creator 更新，使用 2026.2 及更早版本 Sentio Creator 的用户需单独升级该扩展。", "effects": [{"comp_name": "sentio_creator", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2026.2]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "sentio_creator_device_manager", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.4.1)", "min_fixed_version": "1.4.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "密码学签名的验证不恰当", "kind_en": "密码签名验证不当", "last_modified_time": "2026-09-11", "level": "High", "mps_id": "MPS-dyz1-lt8n", "poc": false, "poc_url": [], "published_time": "2026-09-11", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-dyz1-lt8n", "name": "https://www.oscs1024.com/hd/MPS-dyz1-lt8n"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-80469", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-80469"}, {"url": "https://www.sick.com/psirt", "name": ""}, {"url": "https://www.sick.com/media/docs/9/19/719/special_information_sick_operating_guidelines_cybersecurity_by_sick_en_im0106719.pdf", "name": ""}, {"url": "https://www.cisa.gov/resources-tools/resources/ics-recommended-practices", "name": ""}, {"url": "https://www.first.org/cvss/calculator/3.1", "name": ""}, {"url": "https://www.sick.com/.well-known/csaf/white/2026/sca-2026-0012.json", "name": ""}, {"url": "https://www.sick.com/.well-known/csaf/white/2026/sca-2026-0012.pdf", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "SICK Device Manager 任意代码执行漏洞", "_translated": true, "_saved_at": "2026-09-11T10:25:47+00:00", "_first_saved_at": "2026-09-11T10:25:47+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-dyz1-lt8n"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "cnvd_id": "", "cve_id": "CVE-2026-87958", "cvss": {"cvssv31": [{"source": "psirt@us.ibm.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:H/A:H", "severity": "high", "base_score": 8.1}]}, "cvss_score": 8.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:H/A:H", "cwe": "CWE-269", "description": "IBM Db2 for Linux, UNIX and Windows 是 IBM 的商业闭源关系型数据库管理系统，广泛用于企业级事务处理与数据分析场景。\n受影响版本中，服务器存在权限管理缺陷（CWE-269），具备一定权限的用户在特定条件下可禁用 Db2 服务器上的特定功能，导致该功能失效并形成拒绝服务；厂商未披露具体受影响的功能与复现步骤，无法进一步确认代码级成因。\n修复版本中通过官方安全更新（APAR DT474170）修正相关权限管理逻辑，阻断用户禁用该功能的路径，消除拒绝服务风险；V11.5.9 需应用 Security Update #90467 或更高版本，V12.1.4 需应用 Security Update #91310 或更高版本，V12.1.5 需应用 Security Update #89304 或更高版本。", "effects": [{"comp_name": "db2", "ecosystem": "linux", "versions": [{"affected_version": "[11.5.0,11.5.9]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[12.1.0,12.1.5]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-09-11", "level": "High", "mps_id": "MPS-5wzx-td0j", "poc": false, "poc_url": [], "published_time": "2026-09-11", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-5wzx-td0j", "name": "https://www.oscs1024.com/hd/MPS-5wzx-td0j"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-87958", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-87958"}, {"url": "https://www.ibm.com/support/pages/node/7286987", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "IBM Db2拒绝服务漏洞", "_translated": true, "_saved_at": "2026-09-11T00:46:08+00:00", "_first_saved_at": "2026-09-11T00:46:08+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-5wzx-td0j"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-88052", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "cwe": "CWE-787", "description": "Tesseract 是 Google 维护的开源 OCR 文字识别引擎（C++ 实现，Apache-2.0 许可），通过加载 traineddata 语言包与 unicharset 字符集文件完成字符集初始化，广泛用于图像文字识别服务与本地工具。\n受影响版本中，src/ccutil/unicharset.cpp 的 UNICHARSET::load_via_fgets 通过 sscanf 读取文件首行声明的字符总数并直接将其作为循环上界，循环内 unichar_insert_backwards_compatible 对空表示、重复表示或已可编码的字符执行空操作，使 unichars 向量长度落后于循环索引 id；后续 set_isalpha、set_script、set_normed 等未校验边界的访问器与 unichars[id].properties.enabled 写入随即越过向量末尾写 UNICHAR_PROPERTIES，其中 set_normed 还包含 std::string 赋值，LSTM 与传统两种引擎的初始化路径均受影响，攻击者诱导用户或服务加载畸形 unicharset 文件可造成堆越界写，导致堆破坏、崩溃或潜在的受控内存破坏。\n修复版本中通过 main 分支 commit 2d04d640db2e8c7e3bab2369d599343b5a8b8443 修复：load_via_fgets 拒绝非正的字符总数，并在每次插入后校验 unichars 向量长度与 id 同步，不一致时报出错误行并拒绝加载整个文件，从而切断越界写路径；官方修复版本发布前，建议仅加载可信来源的 unicharset 与 traineddata 文件。", "effects": [{"comp_name": "tesseract", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,5.5.3]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-09-11", "level": "High", "mps_id": "MPS-vc7j-uisp", "poc": false, "poc_url": [], "published_time": "2026-09-11", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-vc7j-uisp", "name": "https://www.oscs1024.com/hd/MPS-vc7j-uisp"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-88052", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-88052"}, {"url": "https://github.com/tesseract-ocr/tesseract/security/advisories/GHSA-2hm8-q5c7-c373", "name": "https://github.com/tesseract-ocr/tesseract/security/advisories/GHSA-2hm8-q5c7-c373"}, {"url": "https://github.com/tesseract-ocr/tesseract/commit/2d04d640db2e8c7e3bab2369d599343b5a8b8443", "name": "https://github.com/tesseract-ocr/tesseract/commit/2d04d640db2e8  "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "配置文件中缺省空口令", "kind_en": "配置文件中的密码为空", "last_modified_time": "2026-09-11", "level": "High", "mps_id": "MPS-4hq9-ipe6", "poc": false, "poc_url": [], "published_time": "2026-09-11", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-4hq9-ipe6", "name": "https://www.oscs1024.com/hd/MPS-4hq9-ipe6"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2025-15679", "name": "https://nvd.nist.gov/vuln/detail/CVE-2025-15679"}, {"url": "https://myatos.my.site.com/psmcustomer/s/contentdocument/069ci00000eJrEVAA0", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "BullSequana BMC root空密码漏洞", "_translated": true, "_saved_at": "2026-09-11T10:25:43+00:00", "_first_saved_at": "2026-09-11T10:25:43+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-4hq9-ipe6"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "cnvd_id": "", "cve_id": "CVE-2026-57842", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:L/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:L/AC:H/AT:N/PR:L/UI:N/VC:H/V y/advisories/GHSA-c476-6w5q-jw77", "name": "https://github.com/rclone/rclone/security/advisories/GHSA-c476-6w5q-jw77"}, {"url": "https://github.com/rclone/rclone/commit/c6af0b57c2b4af848bc968c2b407354476184b99", "name": "https://github.com/rclone/rclone/commit/c6af0b57c2b4af848bc968c2b407354476184b99"}, {"url": "https://github.com/rclone/rclone/releases/tag/v1.75.1", "name": "https://github.com/rclone/rclone/releases/tag/v1.75.1"}], "scope_influence": "", "tags": [], "title": "rclone：FTP 跨会话身份验证代理后端混淆", "_translated": true, "_saved_at": "2026-09-10T16:50:55+00:00", "_first_saved_at": "2026-09-10T16:50:55+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-hjoe-xp81"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-81825", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "cwe": "CWE-79", "description": "Simple Ajax Chat（插件标识 simple-ajax-chat）是一款开源的 WordPress 聊天插件，作者 Jeff Starr，通过短代码或模板标签在站点任意页面嵌入 Ajax 聊天窗口，聊天消息持久存储于数据库并向所有访客展示。\n受影响版本中，聊天消息经公开端点 simple-ajax-chat-core.php 提交，存储前的 sac_special_chars() 仅执行 wp_strip_all_tags 与 sanitize_text_field，未对引号等特殊字符做实体编码；防护提交的 nonce 以明文打印在公开聊天页面中，未认证攻击者获取该 nonce 后可携带恶意聊天消息提交入库。simple_ajax_chat() 渲染消息时仅做 sanitize_text_field（保留引号），再用正则 /(http|https|ftp|ftps)\\:\\/\\/[a-zA-Z0-9\\-\\.]+\\.[a-zA-Z]{2,3}(\\/\\S*)?/ 将类 URL 文本拼入 \u003ca href=\"\\0\"\u003e 的 href 属性并未经转义直接回显，消息中的引号可闭合 href 属性注入任意脚本属性，形成对所有访客执行的存储型 XSS。\n修复版本中通过官方 changeset 3669278（随 20260827 版本发布）在存储侧 sac_special_chars() 中新增 htmlspecialchars($s, ENT_QUOTES, 'UTF-8')，对聊天消息的引号等特殊字符做 HTML 实体编码后再入库，并在 simple-ajax-chat-form.php 中将自动链接正则收紧为 (\\/[^\\s\\'\\\"\\%\\\u003c\\\u003e]*)?，禁止引号、百分号与尖括号进入自动生成的链接标记，切断属性闭合注入链路。", "effects": [{"comp_name": "simple-ajax-chat", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,20260827)", "min_fixed_version": "20260827", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-09-11", "level": "High", "mps_id": "MPS-asj8-fw3g", "poc": false, "poc_url": [], "published_time": "2026-09-11", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-asj8-fw3g", "name": "https://www.oscs1024.com/h 符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-81754", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "cwe": "CWE-79", "description": "Vigilant（插件标识 vigilante）是运行于 WordPress 的开源安全防护插件，提供防火墙、双因素认证、登录保护、安全响应头与活动日志审计等功能。\n受影响版本中，未认证攻击者向 WordPress 登录入口提交携带恶意 User-Agent 的失败登录后，Vigilante_Login_Security 的 handle_failed_login 方法触发 includes/class-database.php 的 record_login_attempt 与 insert_activity_log，将该请求头经 sanitize_text_field 清理后存入登录尝试与活动日志表，引号字符原样保留；管理员打开安全审计页面时，assets/js/admin.js 的 escapeHtml 只转义尖括号与 \u0026 符号、不编码单双引号，User-Agent 被拼入 data-details、data-value 等引号定界的 HTML 属性中，攻击者得以闭合属性并注入任意 Web 脚本，在管理员浏览器中执行。\n修复版本中通过重写 admin.js 的 escapeHtml 为显式替换 \u0026、\u003c、\u003e、双引号与单引号对应的 HTML 实体，并改用 attr 读取白名单与黑名单按钮取值，使属性位置无法被引号闭合，切断未认证攻击者经失败登录 User-Agent 注入、借管理员浏览日志页面执行的攻击链路；2.10.3 版本已包含该修复。", "effects": [{"comp_name": "vigilante atus": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-88016", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:R/S:C/C:L/I:H/A:L", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:R/S:C/C:L/I:H/A:L", "cwe": "CWE-281", "description": "rclone 是一个命令行程序，用于在不同的云存储提供商之间同步文件和目录。在 1.75.1 之前，当 backend/local 使用 --links 运行时，源 .rclonelink 对象可以在目标中植入符号链接，并通过该路径应用稍后的目录元数据。 MkdirMetadata、writeMetadataToFile 和 setTimes 在 Directory.translatedLink=false 时运行，因此 os.Chown、os.Chmod、os.Chtimes 和出生时间处理可以绕过 os.Root 限制并遵循符号链接。因此，控制源内容的攻击者可以将选定的所有权、权限、修改时间或出生时间应用到目标外部的文件或目录，其中 chmod 和 chown 需要 --metadata，而修改时间由正常目录工作流程应用。此问题已在版本 1.75.1 中修复。", "effects": [{"comp_name": "rclone", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.75.1)", "min_fixed_version": "1.75.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "权限预留不恰当", "kind_en": "权限保留不当", "last_modified_time": "2026-09-11", "level": "High", "mps_id": "MPS-3ati-49ne", "poc": false, "poc_url": [], "published_time": "2026-09-11", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-3ati-49ne", "name": "https://www.oscs1024.com/hd/MPS-3ati-49ne"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-88016", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-88016"}, {"url": "https://github.com/rclone/rclone/security/advisories/GHSA-f8g7-2xjc-7mfh", "name": "https://github.com/rclone/rclone/security/advisories/GHSA-f8g7-2xjc-7mfh"}, {"url": "https://github.com/rclone/rclone/commit/17b0c03338a857bcb0a68d2d4c82ddbdec3f7893", "name": "https://github.com/rclone/rclone/commit/17b0c03338a857bcb0a68d2d4c82ddbdec3f7893"}, {"url": "https://github.com/rclone/rclone/commit/a7ab39d3d1958afa1446982c1dc4e4a73a887e3e", "name": "https://github.com/rclone/rclone/commit/a7ab39d3d1958afa1446982c1dc4e4a73a887e3e"}, {"url": "https://github.com/rclone/rclone/releases/tag/v1.75.1", "name": "https://github.com/rclone/rclone/releases/tag/v1.75.1"}], "scope_influence": "", "tags": [], "title": "CVE-2026-88016漏洞", "_translated": true, "_saved_at": "2026-09-10T16:50:59+00:00", "_first_saved_at": "2026-09-10T16:50:59+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-3ati-49ne"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-88938", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:N", "severity": "medium", "base_score": 6.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-22", "description": "knowns 到 0.33. 序中，从而实现代码执行的目的。\n- 缓冲区溢出攻击：攻击者通过在序列化过程中向缓冲区输入恶意数据，导致缓冲区溢出，从而破坏程序的内存管理，实现代码执行的目的。\n- 格式字符串攻击：攻击者通过在序列化过程中输入恶意数据，导致程序使用错误的格式字符串，从而实现代码执行的目的。\n- 数据流攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码作为一个数据流传递给程序，从而实现代码执行的目的。\n", "title": "反序列化常见的攻击方式"}, {"content": "- 不信任输入数据：程序应该严格检查输入数据的有效性，并避免使用不受信任的数据。\n- 使用安全的序列化机制：程序应该使用安全的序列化机制，如 JSON 或 XML 序列化，而不是第三方序列化库。\n- 最小特权原则：程序应该限制对受信任数据的处理权限，并避免在运行时修改数据。\n- 代码审查和漏洞扫描：程序应该进行代码审查和漏洞扫描，以发现和修复潜在的安全漏洞。\n", "title": "如何预防反序列化"}], "cnvd_id": "", "cve_id": "CVE-2026-78175", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-502", "description": "Tutor LMS – WordPress 的电子学习和在线课程解决方案插件在 4.0.7 及之前的所有版本中都容易通过“tutor_save_withdraw_account” AJAX 处理程序的“withdraw_method_field”参数受到 PHP 对象注入攻击。这是因为处理程序缺乏任何功能或角色检查，仅依赖于随机数，同时还通过“esc_sql()”传递攻击者提供的值，在数据通过“update_user_meta()”序列化和存储之前，它会用 66 字节 HMAC 占位符令牌替换每个“%”字符；当稍后检索元时，占位符会折叠回单个“%”，使序列化字符串长度声明比实际内容大 65 个字节，并且由于数组键源自完全未转义的 POST 字段名称，“unserialize()”会过度读取攻击者控制的字节，从而允许注入任意序列化对象流。这使得具有订阅者级别及以上访问权限的经过身份验证的攻击者可以通过触发“GuzzleHttp\\Cookie\\FileCookieJar” POP 链在服务器上实现远程代码执行，该 POP 链可通过“TUTOR\\RestAPI”中的“spl_autoload_register”加载器访问，该加载器加载插件自己的捆绑 PayPal Composer 自动加载器，将攻击者控制的内容写入攻击者指定的文件名。当启用用户注册时，这有一个未经身份验证的途径，这对于学生和教师注册来说很常见，并且需要启用货币化功能。", "effects": [{"comp_name": "Tutor LMS – eLearning and online course solution", "ecosystem": "linux", "versions": [{"affected_version": "(0,4.0.7]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "反序列化", "kind_en": "不可信数据的反序列化", "last_modified_time": "2026-09-12", "level": "High", "mps_id": "MPS-rugs-a12c", "poc": false, "poc_url": [], "published_time": "2026-09-12", "reference_url_list": [{"url": "https://www.osc on via Request-Body Ownership Check"}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "MoguBlog评论删除越权漏洞", "_translated": true, "_saved_at": "2026-09-11T18:05:32+00:00", "_first_saved_at": "2026-09-11T18:05:32+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-lmtz-xwgd"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-72708", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "high", "base_score": 7.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-89", "description": "SPIP 是一个采用 GNU/GPL 许可的开源 PHP 内容管理系统，通过模板引擎渲染公开页面并访问 MySQL 等数据库，核心代码托管在 git.spip.net。\n受影响版本中，公开 sitemap 模板 squelettes-dist/sitemap.xml.html 将 URL 参数 annee 作为日期条件编译为对文章日期列的比较，取值经 sql_quote 传入 MySQL 引擎转义函数 ecrire/req/mysql.php 的 spip_mysql_cite()；该函数在目标列为日期类型且取值匹配 /^\\w+\\(/ 时原样返回而不转义，未认证攻击者通过 /sitemap.xml?annee= 提交 sleep(5) 之类的取值，可将任意 SQL 片段拼入查询，实施基于时间与布尔的盲注，读取任意数据库内容，包括用于签名 action nonce 的 alea_ephemere 密钥。\n修复版本中通过把日期类型字段的原样透传条件收紧为仅允许 NOW()（大小写不敏感）切断注入链，其余取值回落到 addslashes 转义，并在 req/sqlite_generique.php 的 _sqlite_calculer_cite() 中同步应用相同修复；SPIP 4.4.18（2026-08-10 发布）已包含该修复。", "effects": [{"comp_name": "spip", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,4.4.18)", "min_fixed_version": "4.4.18", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "spip/ecrire", "ecosystem": "composer", "versions": [{"affected_version": "(-∞,4.4.18)", "min_fixed_version": "4.4.18", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-09-12", "level": "High", "mps_id": "MPS-od94-5its", "poc": false, "poc_url": [], "published_time": "2026-09-12", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-od94-5its", "name": "https://www.oscs1024.com/hd/MPS-od94-5its"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-72708", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-72708"}, {"url": "https://blog.lexfo.fr/casse-spip-sqli-to-rce.html", "name": "Researcher Blog"}, {"url": "https://blog.spip.net/Mise-a-jour-critique-de-securite-sortie-de-SPIP-4-4-18.html", "name": "Release Notes"}, {"url": "https://www.vulncheck.com/advisories/spip-unauthenticated-sql-injection-via-sitemap-annee-parameter", "name": ""}], "scope_influence": "", "tags": ["php", "开源", "终端软件"], "title": "SPIP sitemap SQL注入漏洞", "_translated": true, "_saved_at": "2026-09-11T18:05:29+00:00", "_first_saved_at": "2026-09-11T18:05:29+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-od94-5its"}, {"analysis_status": 0, "articles": [{"content": "应用程序在处理用户输入时的不完善或缺乏验证机制，所以攻击者能够通过向应用程序发送恶意输入，利用应用程序对输入数据的错误处理方式来注入自己的恶意代码。这些恶意代码会被应用程序误认为是合法的指令或数据，并在执行过程中被执行。", "title": "什么是代码注入"}, {"content": "应用程序使用可执行动态代码的函数来执行用户可控的参数，当应用程序对于用户输入过滤不完全时，攻击者可以注入恶意代码并控制代码执行流程。", "title": "代码注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对所有用户输入进行验证和过滤，确保只接受预期的有效输入。这包括对输入数据进行输入长度验证、类型检查和格式验证等。\r\n- 使用参数化查询或预编译语句：对于数据库查询操作，应该使用参数化查询或预编译语句，确保输入数据不会被误认为是执行代码。\r\n- 最小特权原则：应用程序在执行操作系统命令或动态代码时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。\r\n- 安全编码实践：开发人员应该采用安全编码实践，包括避免使用eval函数、避免拼接用户输入的字符串作为代码执行等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止代码注入攻击。", "title": "如何预防代码注入"}], "cnvd_id": "", "cve_id": "CVE-2026-90553", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.5}]}, "cvss_score": 8.5, "cvss_vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-94", "description": "vLLM before 0.28.0 contains a remote code execution vulnerability in the LlavaOnevision2 processor loader that ignores the trust_remote_code parameter when loading remote processor classes. Attackers can craft a malicious model with arbitrary code in processing_llava_onevision2.py that executes with vLLM process authority even when trust_remote_code is set to False.", "effects": [{"comp_name": "vllm", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,0.28.0)", "min_fixed_version": "0.28.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cos S:4.0/AV:N/AC:L/AT:P/PR:L/UI:N/VC:H/VI:H/VA:L/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.6}]}, "cvss_score": 7.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:L/UI:N/VC:H/VI:H/VA:L/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-863", "description": "在 29.0.3 之前的 OpenStack Keystone 中发现了一个问题。通过委托身份验证方法（EC2 凭证、应用程序凭证、OAuth1 访问令牌和信任）获取的令牌不会被阻止通过 /v3/credentials API 创建、修改或删除凭证。 EC2 派生的令牌还可以读取凭证 blob，从而暴露 TOTP MFA 种子和其他秘密。此外，PATCH /v3/credentials 不会验证请求的更新后 project_id，从而允许任何委托令牌将凭证移动到未经授权的项目。所有使用委托身份验证的 Keystone 部署都会受到影响。", "effects": [{"comp_name": "keystone", "ecosystem": "linux", "versions": [{"affected_version": "[13.0.0,27.0.3)", "min_fixed_version": "27.0.3", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[28.0.0,28.0.3)", "min_fixed_version": "28.0.3", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[29.0.0,29.0.3)", "min_fixed_version": "29.0.3", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-09-12", "level": "High", "mps_id": "MPS-8do2-7pj5", "poc": false, "poc_url": [], "published_time": "2026-09-12", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-8do2-7pj5", "name": "https://www.oscs1024.com/hd/MPS-8do2-7pj5"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-90460", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-90460"}, {"url": "https://launchpad.net/bugs/2159643", "name": ""}, {"url": "https://launchpad.net/bugs/2158931", "name": ""}, {"url": "https://review.opendev.org/1002330", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-90460漏洞", "_translated": true, "_saved_at": "2026-09-12T07:34:51+00:00", "_first_saved_at": "2026-09-11T23:47:37+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-8do2-7pj5"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2026-90474", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:R/S:U/C:H/I:H/A:N", "severity": "medium", "base_score": 6.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:P/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.6}]}, "cvss_score": 7.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:P/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-287", "description": "1.0.32 之前的 MCPhub 在其嵌入式 OAuth 2.0 授权服务器中包含身份验证绕过漏洞，其中默认禁用客户端身份验证，并且 PKCE 强制执行是可选的。通过拦截获得授权代码的攻击者可以将其兑换为访问令牌，而无需提供客户端密钥或 PKCE 验证程序，从而获得对受害者帐户及其权限的访问权限。", "effects": [{"comp
