et/wiki/spaces/frevvo110/overview?homepageId=1069252609", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "身份验证绕过导致服务器端命令执行", "_translated": true, "_saved_at": "2026-10-23T05:39:44+00:00", "_first_saved_at": "2026-10-23T05:39:44+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-x7iw-q4bs"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过向受信任的数据序列化过程中添加恶意数据，从而在序列化和反序列化过程中执行恶意代码的攻击漏洞。这种漏洞通常存在于使用序列化 (serialization) 机制存储和传输数据的程序中。\n", "title": "什么是反序列化"}, {"content": "- 注入攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码注入到程序中，从而实现代码执行的目的。\n- 反射攻击：攻击者使用反射机制，在序列化过程中动态生成恶意数据，并将恶意代码注入到程序中，从而实现代码执行的目的。\n- 缓冲区溢出攻击：攻击者通过在序列化过程中向缓冲区输入恶意数据，导致缓冲区溢出，从而破坏程序的内存管理，实现代码执行的目的。\n- 格式字符串攻击：攻击者通过在序列化过程中输入恶意数据，导致程序使用错误的格式字符串，从而实现代码执行的目的。\n- 数据流攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码作为一个数据流传递给程序，从而实现代码执行的目的。\n", "title": "反序列化常见的攻击方式"}, {"content": "- 不信任输入数据：程序应该严格检查输入数据的有效性，并避免使用不受信任的数据。\n- 使用安全的序列化机制：程序应该使用安全的序列化机制，如 JSON 或 XML 序列化，而不是第三方序列化库。\n- 最小特权原则：程序应该限制对受信任数据的处理权限，并避免在运行时修改数据。\n- 代码审查和漏洞扫描：程序应该进行代码审查和漏洞扫描，以发现和修复潜在的安全漏洞。\n", "title": "如何预防反序列化"}], "cnvd_id": "", "cve_id": "CVE-2026-94075", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-502", "description": "Newsletters（插件标识 newsletters-lite）是 Tribulant Software 开发的 WordPress 开源邮件列表插件，采用 GPLv2 许可，用于邮件列表订阅、邮件群发与订阅者管理。\n受影响版本中，主文件 wp-mailinglist.php 的 wpMail::init() 方法挂载于 WordPress init 钩子，未认证的前台请求即可触达，其处理 newsletters_method=hidemessage 且 message=dbupdate 的 GET 请求时不做任何权限与 nonce 校验，直接执行 update_option('hidedbupdate', sanitize_text_field(wp_unslash($_GET['version'])))，攻击者可借此将序列化字符串持久写入 hidedbupdate 选项；随后 wpMailPlugin::get_option() 读取该选项时先经 WordPress 核心 maybe_unserialize，又对返回值再次调用 maybe_unserialize，攻击者提交的负载被双重反序列化并实例化任意 PHP 类对象，形成 PHP 对象注入，在站点存在可用 POP 链时可导致代码执行等高危后果。\n修复版本中通过为 hidemessage 操作增加 manage_options 权限检查与 newsletters_hidemessag itle": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-115995", "cvss": {"cvssv2": [{"source": "VulDB", "vector": "AV:N/AC:L/Au:N/C:C/I:C/A:C/E:ND/RL:OF/RC:C", "severity": "", "base_score": 10}], "cvssv3": [{"source": "VulDB", "vector": "CVSS:3.0/AV:N/AC:L/PR:N/UI:R/S:C/C:H/I:H/A:H/E:X/RL:O/RC:C", "severity": "critical", "base_score": 9.6}], "cvssv31": [{"source": "VulDB", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:H/I:H/A:H/E:X/RL:O/RC:C", "severity": "critical", "base_score": 9.6}], "cvssv4": [{"source": "VulDB", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X", "severity": "critical", "base_score": 9.4}]}, "cvss_score": 9.4, "cvss_vector": "", "cwe": "CWE-78", "description": "Unitree Go2 是宇树科技（Unitree Robotics）推出的四足机器人，其官方固件内置 chat_go 语音交互组件，负责基于大模型的语音对话能力，固件以闭源升级包形式发布，该组件源码未公开。\n受影响版本中，chat_go 组件 gpt_thread.py 文件内的 set_volume 函数未对参数 Value 进行充分校验，攻击者远程操纵该参数可将其注入操作系统命令执行流程，形成 OS 命令注入（CWE-78），进而获得设备命令执行能力并威胁机器人及其所在网络的安全。\n修复版本中通过对 set_volume 参数 Value 的输入处理进行修正，阻断攻击者输入进入操作系统命令执行的路径，官方确认升级至 1.1.11.5 固件版本可解决该问题。", "effects": [{"comp_name": "unitree_go2", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.1.11.5)", "min_fixed_version": "1.1.11.5", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, ": "整数溢出或环绕常见的攻击方式"}, {"content": "- 输入验证与限制：对用户输入的整数进行合理的验证和限制，确保其在允许的范围内。\r\n- 使用安全的整数操作函数：使用安全的整数操作函数，如`add_with_overflow()`、`sub_with_overflow()`、`mul_with_overflow()`等，这些函数会检查并处理溢出情况，确保计算结果在安全范围内。\r\n- 类型检查和转换：在进行整数运算或操作之前，进行类型检查和转换，确保操作数的类型和范围是合适的。\r\n- 强制性编码标准和最佳实践：制定强制性的编码标准和最佳实践，包括对整数运算和操作的规范和限制，以帮助程序员编写更可靠、安全的代码。\r\n- 静态代码分析和测试：使用静态代码分析工具和测试技术来检测和识别潜在的整数溢出问题。这些工具可以帮助发现代码中可能存在的溢出漏洞，并及时修复。", "title": "如何预防整数溢出或环绕"}], "cnvd_id": "", "cve_id": "CVE-2026-116014", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.1}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.2}]}, "cvss_score": 9.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-190", "description": "open62541 是开源的 OPC UA（IEC 62541）C 语言实现，提供客户端与服务端库，广泛用于工业自动化等场景的 OPC UA 通信。\n受影响版本中，UA_DataType_fromStructureDescription() 在为远程自定义结构化 DataType 计算内存布局时，把成员累计大小直接写入 16 位的 memSize 位域（src/ua_types_definition.c 中的 type-\u003ememSize += (UA_UInt16)(memSize + dtm-\u003epadding)），且未对累计大小与字段数做上限校验。恶意 OPC UA 服务器通过 UA_Client_getRemoteDataTypes() 下发累计成员大小超过 65535 字节的 DataType 定义时，memSize 静默回绕为远小于真实布局的值，客户端解码该类型的值时按真实成员偏移写入按回绕尺寸分配的堆缓冲区，导致堆缓冲区溢出，可造成客户端崩溃或代码执行。\n修复版本中通过以 size_t 宽度临时变量累计布局大小，累计值超过 UA_UINT16_MAX 时返回 BADENCODINGLIMITSEXCEEDED 拒绝该 DataType 定义，校验通过后才写入 memSize 位域，并在结构与枚举构造入口对字段数超过 255 的定义直接拒绝，切断了 memSize 回绕导致堆越界写的路径。", "effects": [{"comp_name": "open62541", "ecosystem": "linux", "versions": [{"affected_version": "[1.5.0,1.5.7)", "min_fixed_version": "1.5.7", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-354", "description": "gose 是 Eclipse Foundation 旗下 Eclipse KeyPont 项目孵化的 Go 开源 JOSE 库（模块路径由 github.com/ThalesGroup/gose 迁移为 github.com/eclipse-keypont/gose），提供 JWE 加解密、JWS 签名与 JWT 校验能力，用于服务间令牌与数据保护。\n受影响版本中，HmacShaCryptor.Hash 误用 Go hash.Hash 接口，未调用 Write 写入待哈希数据而直接调用 Sum(input) 并截取结果，任意输入均得到该密钥下空消息的认证标签 HMAC_K(\"\")，认证标签在同一密钥下恒定且与消息无关；攻击者向 JweDirectDecryptorBlock.Decrypt 提交构造的紧凑序列化 JWE 时，唯一完整性校验 JweHmacVerifierImpl.VerifyCompact 将该常量标签与 JWE 携带的标签比较，观察到任意一个合法 AES-CBC-HMAC JWE 的攻击者可把该标签拼接到自选密文上通过校验，进而实施 CBC 比特翻转与填充预言类篡改，密文完整性保障完全失效，AES-GCM/AEAD 路径不受影响。\n修复版本中通过重写 HmacShaCryptor.Hash，改为先以 Write(input) 写入完整输入再以 Sum(nil) 结算，使认证标签重新依赖 AAD、IV 与密文，并同步修正加密侧 OtherAad 的赋值时序以保证加解密双方 AAD 一致；修复自 v1.0.0-rc1 起随新模块路径 github.com/eclipse-keypont/gose 发布，使用旧模块路径 github.com/ThalesGroup/gose 的用户需迁移模块路径并升级。", "effects": [{"comp_name": "github.com/ThalesGroup/gose", "ecosystem": "go", "versions": [{"affected_version": "[0.9.0,0.13.0-rc1]", "min_fixed_version": "", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "完整性检查值验证不恰当", "kind_en": "完整性检查值验证不当", "last_modified_time": "2026-10-23", "level": "High", "mps_id": "MPS-78um-tso1", "poc": false, "poc_url": [], "published_time": "2026-10-23", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-78um-tso1", "name": "https://www.oscs1024.com/hd/MPS-78um-tso1"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-89320", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-89320"}, {"url": "https://github.com/eclipse-keypont/gose/security/advisories/GHSA-h6w5-722x-2h3m", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "gose JWE完整性校验失效漏洞", "_translated": true, "_saved_at": "2026-10-23T10:52:06+00:00", "_first_saved_at": "2026-10-23T10:52:06+00:00" v/vuln/detail/CVE-2026-19678"}, {"url": "https://frevvo-docs.atlassian.net/wiki/spaces/frevvo110/pages/1069273270/Detailed+Release+Notes", "name": ""}, {"url": "https://frevvo-docs.atlassian.net/wiki/spaces/frevvo110/overview?homepageId=1069252609", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "服务器端请求伪造 (SSRF) 导致 Solr 内部数据泄露", "_translated": true, "_saved_at": "2026-10-23T05:39:40+00:00", "_first_saved_at": "2026-10-23T05:39:40+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-hsqf-vymi"}, {"analysis_status": 0, "articles": [{"content": "跨站点请求伪造 (CSRF)通过利用网站对用户请求的信任进行攻击。当用户在网站A登录并在同一浏览器会话中访问网站B时，攻击者可以构造特制的请求并诱使用户执行，以使网站B误以为这些请求是用户合法发起的。\n攻击者通常通过欺骗用户点击恶意链接、在受信任的网站中植入恶意代码或通过钓鱼等手段来实施CSRF攻击，一旦用户执行了恶意请求，攻击者可以以用户的身份执行任意操作，包括更改用户密码、发起资金转账或删除重要数据等。", "title": "什么是CSRF"}, {"content": "- 链接欺骗：攻击者通过向用户发送包含恶意链接的电子邮件或社交媒体消息，诱使用户点击并执行恶意请求。\n- 图片引用攻击：攻击者通过在恶意网站上包含指向目标网站的图片引用，以触发用户浏览器自动发送目标网站的请求。\n- XSS利用：如果目标网站存在XSS漏洞，攻击者可以注入恶意脚本，以使用户在浏览器中执行恶意请求。", "title": "CSRF常见的攻击方式"}, {"content": "- 随机令牌：网站可以在每个请求中包含一个随机生成的令牌（CSRF Token），并验证该令牌的有效性，以确认请求的来源是合法的。\n- SameSite Cookie：使用SameSite属性来限制跨站点请求，将Cookie的发送限制在同一站点上，减少了跨站请求伪造的风险。\n- 双重验证：对于敏感操作，网站可以要求用户进行额外的验证，例如输入验证码、提供第二个因素的身份验证等。\n- 强化浏览器策略：网站可以设置Content-Security-Policy（CSP）头，限制浏览器执行恶意脚本的能力，减少CSRF攻击的风险。\n- 限制用户操作：网站可以要求用户在执行敏感操作之前进行明确的确认或授权，防止恶意请求被误触发。\n- 安全编码实践：开发人员应遵循安全编码实践，对用户输入进行适当的验证和过滤，防止恶意请求的注入。", "title": "如何预防CSRF"}], "cnvd_id": "", "cve_id": "CVE-2026-58497", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-352", "description": "Uni-CLI 为人员和代理提供了一个针对网站、浏览器、桌面应用程序、本地工具和 MCP 的命令界面。在版本 0.225.2 之前，Uni-CLI 在环回上公开旧版 JSON-RPC-over-HTTP MCP 传输，而无需在路由请求之前验证浏览器 Origin 标头。恶意网页可能会向本地 /mcp 端点发送 CORS 简单 POST 请求（例如 text/plain），并将 JSON-RPC 正文传递给调度程序。如果用户已启动本地 MCP HTTP 传输，则该页面可以针对用户的本地 Uni-CLI 服务器驱动工具/调用请求。 Streamable HTTP 传输已经强制执行了浏览器到本地主机的边界。传统的无状态 HTTP 路径没有，因此两种 HTTP 传输发生了漂移。这个问题是关于浏览器到本地主机的边界；它不会改变 Uni-CLI 的本地代码执行信任模型。该问题已在 0.225.2 版本中修复。", "effects": [{"comp_name": "Uni-CLI", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,0.225.2)", "min_fixed_version": "0.225.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "CSRF", "kind_en": "跨站请求伪造 (CSRF)", "last_modified_time": "2026-10-23", "level": "High", "mps_id": "MPS-5zyg-p349", "poc": false, "poc_url": [], "published_time": "2026-10-23", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-5zyg-p349", "name": "https://www.oscs1024.com/hd/MPS-5zyg-p349"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-58497", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-58497"}, {"url": "https://github.com/olo-dot-io/Uni-CLI/security/advisories/GHSA-v3f4-w7r7-v3hm", "name": "https://github.com/olo-dot-io/Uni-CLI/security/advisories/GHSA-v3f4-w7r7-v3hm"}, {"url": "https://github.com/olo-dot-io/Uni-CLI/releases/tag/v0.225.2", "name": "https://github.com/olo-dot-io/Uni-CLI/releases/tag/v0.225.2"}], "scope_influence": "", "tags": ["应用软件"], "title": "Uni-CLI：传统 HTTP MCP 传输接受浏览器发起的本地主机请求", "_translated": true, "_saved_at": "2026-10-23T15:35:57+00:00", "_first_saved_at": "2026-10-23T15:35:57+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-5zyg-p349"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-96616", "cvss": {"cvssv31": [{"source": "ics-cert@hq.dhs.gov", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:L/A:N", "severity": "medium", "base_score": 6.5}], "cv  "2026-10-22T17:48:54+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-uqk8-wi74"}, {"analysis_status": 0, "articles": [{"content": "跨界内存读是指应用程序在读取内存时，未正确验证或限制读取的内存范围。攻击者利用这种漏洞可以读取应用程序内存中的敏感数据，如密码、加密密钥、会话令牌等。常见的原因是由于缓冲区溢出、格式化字符串漏洞或其他内存错误导致的。", "title": "什么是越界读取"}, {"content": "攻击者可以通过不当构造的输入来触发跨界内存读漏洞。攻击者可能会通过向应用程序发送特定的输入，使其读取超过预期的内存区域。攻击者可以利用这个漏洞来获取敏感信息，如其他用户的数据、操作系统的敏感数据或应用程序的内部状态。", "title": "越界读取常见的攻击方式"}, {"content": "- 输入验证和限制：应用程序应对所有输入数据进行严格的验证和限制。确保输入数据的长度、格式和内容符合预期，避免超出缓冲区或访问非预期的内存区域。\n- 内存安全编程实践：开发人员应使用安全的编程实践，如避免使用不安全的函数、正确处理内存分配和释放操作，以及遵循最小特权原则。\n- 使用安全的编程语言和库：选择使用安全性较高的编程语言和库，这些语言和库在内存管理和安全性方面提供了更多的保护机制。\n- 定期进行代码审查和安全测试：定期审查应用程序的代码，并进行安全测试，以发现潜在的跨界内存读漏洞。使用静态代码分析工具和漏洞扫描工具来辅助检测和修复问题。\n- 实施防御性编程技术：应用程序应采用防御性编程技术，如使用随机化地址空间布局（ASLR）、堆栈保护机制（如堆栈溢出保护）和数据执行预防（DEP）等。\n- 及时更新和修补：及时应用程序和操作系统的安全更新和补丁，以确保已知的跨界内存读漏洞得到修复。及时更新相关软件和库，以避免使用已知存在漏洞的版本。", "title": "如何预防越界读取"}], "cnvd_id": "", "cve_id": "CVE-2026-115484", "cvss": {"cvssv31": [{"source": "secalert@redhat.com", "vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:U/C:L/I:L/A:H", "severity": "high", "base_score": 7.6}]}, "cvss_score": 7.6, "cvss_vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:U/C:L/I:L/A:H", "cwe": "CWE-125", "description": "open-iscsi 的 iscsiuio 组件中发现缺陷。 DHCPv4 选项解析器错误地计算选项数据的长度，导致其读取超出分配的缓冲区的内容到相邻的堆内存中。同一网段上的攻击者可以发送精心设计的 DHCP 响应来使守护程序崩溃或破坏其网络配置。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界读取", "kind_en": "越界读取", "last_modified_time": "2026-10-23", "level": "High", "mps_id": "MPS-as74-tx23", "poc": false, "poc_url": [], "published_time": "2026-10-23", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-as74-tx23", "name": "https://www.oscs1024.com/hd/MPS-as74-tx23"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-115484", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-115484"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-115484", "name": ""}, {"url": "ht :X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-639", "description": "MarcosCamara01 Ecommerce Template 是基于 Next.js 的开源电商模板，提供购物车、心愿单、订单与 Stripe 支付等店铺能力，数据层使用 PostgreSQL 与 Drizzle ORM。\n受影响版本中，cartRepository.delete()、cartRepository.updateQuantityInternal() 与 wishlistRepository.delete() 仅按主键匹配 cart_items 与 wishlist 行，未附加归属用户条件，而依赖的 PostgreSQL 行级安全策略因迁移只执行 ENABLE ROW LEVEL SECURITY、未执行 FORCE ROW LEVEL SECURITY，且应用以建表 owner 角色连接导致策略在运行时不生效。cart_items.id 与 wishlist.id 为连续 bigserial，已登录用户可枚举标识并删除或修改其他账户的购物车与心愿单，更新路径还会返回被改写行及其 user_id。\n修复版本中通过在上述三条查询中增加 userId 谓词，并新增迁移 0004_force_rls.sql 对相关表执行 FORCE ROW LEVEL SECURITY，使查询层与 RLS 层均可独立阻止跨用户删除与改写。", "effects": [{"comp_name": "ecommerce-template", "ecosystem": "linux", "versions": [{"affected_version": "[b139a11c7bfab82b9c54c738b9a5d6015b439972,adf7dedbb41894c0bad0b33a26999b0da7e967b7)", "min_fixed_version": "adf7dedbb41894c0bad0b33a26999b0da7e967b7", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "通过用户控制密钥绕过授权机制", "kind_en": "通过用户控制的密钥绕过授权", "last_modified_time": "2026-10-23", "level": "High", "mps_id": "MPS-zx0d-nyqh", "poc": false, "poc_url": [], "published_time": "2026-10-23", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-zx0d-nyqh", "name": "https://www.oscs1024.com/hd/MPS-zx0d-nyqh"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-115453", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-115453"}, {"url": "https://github.com/MarcosCamara01/ecommerce-template/commit/adf7dedbb41894c0bad0b33a26999b0da7e967b7", "name": ""}, {"url": "https://secur0.com/en/cna/cve-list/cve-2026-115453-cross-user-cart-wishlist-idor", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "电商模板跨用户越权", "_translated": true, "_saved_at": "2026-10-22T17:48:55+00:00", "_first_saved_at": "2026-10-22T17:48:55+00:00", "_source_page": "https 处理 iq set 注册报文，直接使用报文中攻击者可控的 username 元素解析目标账号并调用 AccountManagement.changePassword 修改口令，未校验该账号与当前会话认证实体 sessionContext.getInitiatingEntity() 是否一致，任何已认证用户可将任意已存在账号的口令改为指定值，实现其他账号的接管。\n修复版本中通过安全公告说明项目退役且不会发布修复版本；在官方修复发布前，可通过移除或禁用 InBandRegistrationModule（XEP-0077 In-Band Registration）模块、迁移至仍在维护的 XMPP 服务器切断该攻击路径。", "effects": [{"comp_name": "org.apache.vysper:vysper-core", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,0.7]", "min_fixed_version": "", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "未经验证的口令修改", "kind_en": "未经验证的密码更改", "last_modified_time": "2026-10-24", "level": "High", "mps_id": "MPS-2436-379a", "poc": false, "poc_url": [], "published_time": "2026-10-24", "reference_url_list": [{"url": "https://seclists.org/oss-sec/2026/q4/357", "name": ""}, {"url": "https://mina.apache.org/vysper-project/", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-115748", "name": ""}, {"url": "https://github.com/apache/mina-vysper", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "Apache Vysper授权绕过漏洞", "_translated": true, "_saved_at": "2026-10-24T06:46:48+00:00", "_first_saved_at": "2026-10-24T06:46:48+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-2436-379a"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-79982", "cvss": {"cvssv31": [{"source": "vulnerabilities@zephyrproject.org", "vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-787", "description": "Zephyr 是 Zephyr Project 开源的物联网实时操作系统，广泛用于嵌入式与低功耗设备，其新 USB 设备栈中的蓝牙 HCI 传输类使设备可作为 USB 蓝牙控制器与 USB 主机通信。\n受影响版本中，subsys/usb/device_next/class/bt_hci.c 的 bt_hci_tx_sync_in() 从 bt_hci_ep_pool 分配 USB 传输缓冲，该池每个槽位仅 USBD_MAX_BULK_MPS 字节（全速构建下为 64 字节），随后执行 net_buf_add_mem(buf, bt_buf-\u003edata, bt_buf-\u003elen) 复制完整的控制器到主机 HCI 包且不校验长度，而 HCI 事件与 ACL 缓冲按 CONFIG_BT_BUF_EVT_RX_SIZE、CONFIG_BT_BUF_ACL_RX_SIZE 配置可远大于槽位，复制越过槽位边界写入池内相邻槽位及池后静态内存；设备以 raw HCI 模式运行本地蓝牙控制器，超长数据源于空中接口，蓝牙范围内的未认证攻击者可通过与设备建立连接并协商数据长度扩展发送 ACL 分片，或仅广播扩展通告数据并经 LE Extended Advertising Report 事件进入该路径，库存全速配置下主机初始化阶段的 Read Supported Commands 命令完成事件（70 字节）同样触发越界；CONFIG_ASSERT=n 的生产构建中越界写静默发生，目标缺少子系统间内存保护时可被用于任意代码执行，开启断言的构建则因断言失败宕机形成远程拒绝服务。\n修复版本中通过为控制器到主机方向新增按最大完整 HCI 包定长的 bt_hci_tx_pool（容量为 MAX(BT_BUF_ACL_RX_SIZE, BT_BUF_EVT_RX_SIZE)），bt_hci_tx_sync_in() 改由该池分配 USB 传输缓冲，主机到设备方向维持按端点包大小分配并沿用重组阶段的边界检查，完整 HCI 包可在单次 USB 请求中提交且复制不再越过缓冲边界。", "effects": [{"comp_name": "zephyr", "ecosystem": "linux", "versions": [{"affected_version": "[3.3.0,4.5.0)", "min_fixed_version": "4.5.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-10-24", "level": "High", "mps_id": "MPS-lp5k-f3q9", "poc": false, "poc_url": [], "published_time": "2026-10-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-lp5k-f3q9", "name": "https://www.oscs1024.com/hd/MPS- S-ay6g-4tu3"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-116011", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-116011"}, {"url": "https://github.com/CrowCpp/Crow/security/advisories/GHSA-7x84-xhp8-6cqj", "name": "GitHub Security Advisory (GHSA-7x84-xhp8-6cqj)"}, {"url": "https://github.com/CrowCpp/Crow/commit/6956b7ca93c5df22f5aaccd670e5aa000c0d882b", "name": ""}, {"url": "https://github.com/CrowCpp/Crow/releases/tag/v1.3.4", "name": "Crow v1.3.4 Release Notes"}, {"url": "https://github.com/CrowCpp/Crow/blob/v1.3.3/include/crow/json.h#L878", "name": ""}, {"url": "https://www.vulncheck.com/advisories/crow-before-1.3.4-denial-of-service-via-deeply-nested-json-in-crow-json-load", "name": "VulnCheck Advisory: Crow before 1.3.4 Denial of Service via Deeply Nested JSON in crow::json::load()"}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "Crow栈溢出拒绝服务漏洞", "_translated": true, "_saved_at": "2026-10-24T21:22:52+00:00", "_first_saved_at": "2026-10-24T15:13:56+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ay6g-4tu3"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-87901", "cvss": {"cvssv3": [{"source": "support@hackerone.com", "vector": "CVSS:3.0/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:L", "severity": "high", "base_score": 8.3}]}, "cvss_score": 8.3, "cvss_vector": "CVSS:3.0/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:L", "cwe": "CWE-79", "description": "注册模块中的不当清理会导致反射性跨站点脚本攻击。", "effects": [{"comp_name": "phpBB", "ecosystem": "linux", "versions": [{"affected_version": "(3.3.0,3.3.18]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-10-24", "level": "High", "mps_id": "MPS-i8zb-1lj3", "poc": false, "poc_url": [], "published_time": "2026-10-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-i8zb-1lj3", "name": "https://www.oscs1024.com/hd/MPS-i8zb-1lj3"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-87901", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-87901"}, {"url": "https://www.phpbb.com/community/viewtopic.php?t=2675305", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-87901漏洞", "_translated": true, "_saved_at": "2026-10-23T19:43:03+00:00", "_first_saved_at": "2026-10-23T19:43:03+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-i8zb-1lj3"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-79977", "cvss": {"cvssv31": [{"source": "vulnerabilities@zephyrproject.org", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:H", "severity": "high", "base_score": 8.2}]}, "cvss_score": 8.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:H", "cwe": "CWE-346", "description": "Zephyr 是 Linux 基金会托管的开源物联网实时操作系统（RTOS），其网络子系统内置 WireGuard VPN 服务，用于在资源受限设备上建立加密隧道。\n受影响版本中，subsys/net/lib/wireguard/wg.c 的 handle_transport_data() 在传输数据报文携带的 32 位 receiver index 匹配不到任何会话、且该对端既无有效握手也无当前密钥时，会置位 send_handshake 并执行 memcpy(\u0026peer-\u003eendpoint, peer_addr, sizeof(peer-\u003eendpoint))，把该 UDP 报文的源地址直接写入对端端点；receiver index 未知意味着此类报文无法用任何密钥完成认证，而 WireGuard 监听端经 net_udp_register() 注册时不限制远端地址与端口、默认监听 UDP 51820，攻击者无需观测合法流量便可离线伪造 16 字节报文把 peer-\u003eendpoint 指向任意地址，此后握手发起、keepalive 与加密数据报文全部发往攻击者地址，合法对端因收不到握手发起而无法重新认证，隧道持续不可用，攻击者还可在中继握手报文后处于隧道路径上，观测密文与流量元数据并选择性丢包。\n修复版本中通过在 handle_transport_data() 的无会话分支移除端点学习完成修复：保留 stale-session 恢复逻辑，握手只发往已从认证消息学到的端点，尚无已知端点时回退为配置的 cfg_endpoint，两者均未知时丢弃报文并返回 -ENOENT，使对端端点无法再被未认证报文污染。", "effects": [{"comp_name": "zephyr", "ecosystem": "linux", "versions": [{"affected_version": "[4.4.0,4.4.2]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "源验证错误", "kind_en": "来源验证错误", "last_modified_time": "2026-10-24", "level": "High", "mps_id": "MPS-g3c9-spxt", "poc": false, "poc_url": [], "published_time": "2026-10-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-g3c9-spxt", "name": "https://www.oscs1024.com/hd/MPS-g3c9-spxt"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-79977", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-79977"}, {"url": "https://github.com/zephyrproject-rtos/zephyr/commit/cbaaf3e9dbe08be21f01bd23142e1ffe91fd4db6", "name": "Fix commit"}, {"url": "https://github.com/zephyrproject-rtos/zephyr/security/advisories/GHSA-w8h4-r8m3-rf5j", "name": "GHSA-w8h4-r8m3-rf5j"}], "scope_influence": "", "tags": ["应用软件"], "title": "Zephyr WireGuard 隧道端点劫持漏洞", "_translated": true, "_saved_at": "2026-10-24T01:19:21+00:00", "_first_saved_at": "2026-10-23T22:49:56+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-g3c9-spxt"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "cnvd_id": "", "cve_id": "CVE-2026-79979", "cvss": {"cvssv31": [{"source": "vulnerabilities@zephyrproject.org", "vector": "CVSS:3.1/AV:L/AC:H/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:H/PR:L/UI:N/S:C/C:H/I:H/A:H", "cwe": "CWE-416", "description": "Zephyr 是 Zephyr Project 基金会维护的开源物联网实时操作系统（RTOS），面向资源受限的嵌入式设备，其 arm64 架构后端通过 CONFIG_USERSPACE 与需求分页（demand paging）机制提供用户态内存隔离与按需换页能力。\n受影响版本中，arch/arm64/core/mmu.c 的 invalidate_tlb_page() 以 virt \u003e\u003e 12 为操作数执行 TLBI VAE1{IS}，该操作数的 ASID 字段（bits [63:48]）恒为 0，失效仅能匹配内核页表（ASID 0）与全局映射，而内存域自 1 起分配 ASID，域私有叶项由 private_map() 以 MT_NG 非全局属性建立，其缓存的翻译在该次失效中不被覆盖；运行在用户线程中的非特权代码可制造内存压力触发页面回收，回收路径 page_frame_prepare_locked() 调用 arch_mem_page_out() 置无效内核叶项并同步各内存域后仅完成上述 ASID 0 失效，do_page_fault() 随后将同一物理帧复用给新映射，已触碰过被换出页的用户线程在其自身 ASID 下仍持有指向该物理帧的有效 EL0 读写翻译，可继续读写内核后续放入该帧的内容（内核数据、其他内存域分区或其他线程的栈），破坏 CONFIG_USERSPACE 的隔离边界，导致信息泄露与内存破坏。\n修复版本中通过将 invalidate_tlb_page() 的失效指令切换为匹配全部 ASID 与全局、非全局映射的 TLBI VAAE1{IS}，使页出、脏位更新与访问位清理后不再残留任何域标记的翻译，切断对被复用物理帧的越权访问链；同一提交还让 globalize_table() 在换页状态同步时保留域私有叶项的 EL0 权限与非全局属性，消除用户线程在换页后丢失自身分区与栈访问的伴随缺陷。", "effects": [{"comp_name": "zephyr", "ecosystem": "linux", "versions": [{"affected_version": "[4.3.0,4.5.0)", "min_fixed_version": "4.5.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "UAF", "kind_en": "免费后使用", "last_modified_time": "2026-10-24", "level": "High", "mps_id": "MPS-agpz-tcr0", "poc": false, "poc_url": [], "published_time": "2026-10-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-agpz-tcr0", "name": "https://www.oscs1024.com/hd/MPS-agpz-tcr0"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-79979", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-79979"}, {"url": "https://github.com/zephyrproject-rtos/zephyr/commit/d732e9f808f16911d06769b3f756246f3528669f", "name": "Fix commit"}, {"url": "https://github.com/zephyrproject-rtos/zephyr/security/advisories/GHSA-6pqm-hfxf-48qv", "name": "GHSA-6pqm-hfxf-48qv"}], "scope_influence": "", "tags": ["应用软件"], "title": "Zephyr TLB隔离绕过漏洞", "_translated": true, "_saved_at": "2026-10-24T01:19:22+00:00", "_first_saved_at": "2026-10-23T22:49:58+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-agpz-tcr0"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-115863", "cvss": {"cvssv31": [{"source": "cve@mitre.org", "vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:U/C:L/I:L/A:H", "severity": "high", "base_score": 7.6}]}, "cvss_score": 7.6, "cvss_vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:U/C:L/I:L/A:H", "cwe": "CWE-121", "description": "ConnMan 到 2.0 通过 DHCPv6 回复消息存在基于堆栈的缓冲区溢出。这发生在 gdhcp/client.c 中的 get_domains 中。无论实际选项长度如何，它都会将固定的 NS_MAXDNAME (1025) 字节从 DHCPv6 DOMAIN_LIST（选项 24）值复制到 1026 字节堆栈缓冲区 dns_name 中，然后使用无限制的“c += Jump + 1”循环遍历 DNS 标签。精心设计的 DHCPv6 REPLY 的 DOMAIN_LIST 选项大于等于 1025 个非零字节，使标签离开缓冲区并读/写“.”。攻击者选择的大步跨越了终点。在线攻击者可以通过伪造的路由器通告 (O=1) 和伪造的 DHCPv6 REPLY（与长 DOMAIN_LIST 匹配 xid/CLIENTID）来触发此攻击，而无需进行身份验证。影响是未经身份验证的 connmand 链接崩溃（以 root 身份运行）。这是在 bb06c47 中介绍的。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "栈缓冲区溢出", "kind_en": "基于堆栈的缓冲区溢出", "last_modified_time": "2026-10-24", "level": "High", "mps_id": "MPS-3ks1-uzlh", "poc": false, "poc_url": [], "published_time": "2026-10-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-3ks1-uzlh", "name": "https://www.oscs1024.com/hd/MPS-3ks1-uzlh"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-115863", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-115863"}, {"url": "https://lore.kernel.org/connman/179274561161.81299.4579745057858200074@pm.me/", "name": ""}, {"url": "https://git.kernel.org/pub/scm/network/connman/connman.git/tree/gdhcp/client.c", "name": ""}, {"url": "https://git.kernel.org/pub/scm/network/connman/connman.git/commit/?id=bb06c47101ca243fa5c04fb4b03fe2a12420d280", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-115863漏洞", "_translated": true, "_saved_at": "2026-10-23T19:42:58+00:00", "_first_saved_at": "2026-10-23T19:42:58+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-3ks1-uzlh"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-115721", "cvss": {}, "cvss_score": 7.5, "cvss_vector": "", "cwe": "CWE-770", "description": "Apache Vysper 是 Apache Mina 旗下的开源 XMPP（Jabber）服务器库，以独立或嵌入式方式对外提供 XMPP 服务，其 nbxml 模块内置的非阻塞 XML 解析器负责解析客户端与服务器之间的 XML 流。\n受影响版本中，nbxml 模块 org.apache.vysper.xml.sax.impl.XMLTokenizer 类的 parse 方法使用 IoBuffer.allocate(16).setAutoExpand(true) 的自动扩容缓冲区累积输入字节，在文本、元素名与属性值等状态下对每个输入字节执行 buffer.put(c)，不存在任何 token、stanza 或请求长度上限，缓冲区仅在遇到终止分隔符时才被清空；上游 XMPPDecoder 在 doDecode 返回 false 后继续等待更多数据，攻击者在 TCP XMPP 端口 5222 上发送流头后跟无终止分隔符的持续字符数据，或在 BOSH/XMPP-over-HTTP 端口 8080 上提交超大 HTTP 请求体，可使 JVM 堆内存持续增长直至抛出 OutOfMemoryError。解析发生在身份认证之前，无需任何凭据，单个 JVM 承载全部会话，内存耗尽后整个服务器对所有用户不可用。\n修复版本中通过，Apache 已于 2026-10-23 公告说明该项目处于 dormant 状态、将以 unsupported when assigned 方式发布该 CVE 且不会发布修复版本，官方建议用户改用其他仍在维护的 XMPP 服务器实现；临时缓解可在网络边界限制对 XMPP 端口（TCP 5222）与 BOSH 端口（8080）的访问来源，为服务进程配置独立 JVM 堆上限与连接级流量限制，并尽快完成迁移。", "effects": [{"comp_name": "org.apache.vysper:nbxml", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,0.7]", "min_fixed_version": "", "repository": "maven", "solutions": [], "upstream": true}]}, {"comp_name": "org.apache.vysper:vysper-core", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,0.7]", "min_fixed_version": "", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "不加限制或调节的资源分配", "kind_en": "不受限制或节流地分配资源", "last_modified_time": "2026-10-24", "level": "High", "mps_id": "MPS-c9e7-10c5", "poc": false, "poc_url": [], "published_time": "2026-10-24", "reference_url_list": [{"url": "https://seclists.org/oss-sec/2026/q4/356", "name": ""}, {"url": "https://www.zeroscience.mk/advisories/ZSL-2026-6022.html", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-115721", "name": ""}, {"url": "https://packetstorm.news/files/id/236035", "name": ""}, {"url": "https://security.snyk.io/vuln/SNYK-JAVA-APACHE-20417204", "name": ""}, {"url": "https://github.com/apache/mina-vysper", "name": ""}, {"url": "https://mina.apache.org/vysper-project/", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "Apache Vysper XML解析内存耗尽漏洞", "_translated": true, "_saved_at": "2026-10-24T06:46:47+00:00", "_first_saved_at": "2026-10-24T06:46:47+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-c9e7-10c5"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-114191", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "cwe": "CWE-862", "description": "UPI QR Code Payment Gateway for WooCommerce 是 KnitPay 团队开发并开源的 WordPress 支付插件（GitHub 开源，GPL-3.0 许可），用于 WooCommerce 商店生成 UPI 收款二维码并接受印度 UPI 直接付款，客户可在付款确认页提交交易截图。\n受影响版本中，插件通过 woocommerce_api_upiwc-payment 公开入口（includes/class-payment.php 的 capture_payment 方法）接收客户上传的付款截图，仅比对浏览器提供的 MIME 类型后调用 media_handle_upload() 把截图作为普通媒体附件写入公开的 Media Library 与 uploads 目录，附件文件、REST 媒体接口（/wp/v2/media）与附件页面均无任何访问控制；付款截图包含客户姓名、UPI 账号、交易编号与金额，未认证攻击者可以直接读取其他客户的付款截图，造成敏感支付信息泄露。\n修复版本中通过新增 UPIWC_Private_Screenshots 类将截图改存到 uploads/upiwc-private/ 私有目录并使用服务器生成的随机文件名，不再进入 Media Library，文件只能由具有 edit_shop_orders 权限的用户经已认证端点打开，对历史版本上传的截图增加 REST 接口与附件页访问拦截，并改用 wp_check_filetype_and_ext() 在服务端校验上传文件的真实类型与大小。", "effects": [{"comp_name": "upi-qr-code-payment-for-woocommerce", "ecosystem": "linux", "versions": [{"affec joiner_start_handler() 调用 otThreadSetEnabled() 启用 Thread，攻击者可向设备下发受控的运营数据集，使设备加入攻击者控制的 Thread 网络，其全部 IPv6 流量可被查看、丢弃、注入与伪造，设备保持错误配置直至被重置。\n修复版本中通过移除 OPENTHREAD_JOINER_PSKD 的默认值，并在 modules/openthread/openthread.c 中新增仅作用于 OPENTHREAD_JOINER_AUTOSTART 的 BUILD_ASSERT，要求配置 6 至 32 个字符的 PSKd 否则构建失败，从编译期消除公开默认凭证并强制逐设备显式配置。", "effects": [{"comp_name": "zephyr", "ecosystem": "linux", "versions": [{"affected_version": "[1.14.0,4.5.0)", "min_fixed_version": "4.5.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "", "kind_en": "", "last_modified_time": "2026-10-24", "level": "High", "mps_id": "MPS-q13r-8sw7", "poc": false, "poc_url": [], "published_time": "2026-10-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-q13r-8sw7", "name": "https://www.oscs1024.com/hd/MPS-q13r-8sw7"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-19741", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-19741"}, {"url": "https://github.com/zephyrproject-rtos/zephyr/commit/acb3e514d7fab2bc9672acaba8019d2dc91b187c", "name": "Fix commit"}, {"url": "https://github.com/zephyrproject-rtos/zephyr/security/advisories/GHSA-6j2r-xrm4-3v7f", "name": "GHSA-6j2r-xrm4-3v7f"}], "scope_influence": "", "tags": ["应用软件"], "title": "Zephyr OpenThread默认凭证漏洞", "_translated": true, "_saved_at": "2026-10-24T01:19:23+00:00", "_first_saved_at": "2026-10-24T01:19:23+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-q13r-8sw7"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-110975", "cvss": {"cvssv31": [{"source": "secalert@redhat.com", "vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:C/C:H/I:N/A:N", "severity": "high", "base_score": 7.4}]}, "cvss_score": 7.4, "cvss_vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:C/C:H/I:N/A:N", "cwe": "CWE-256", "description": "Kruize Autotune 中发现了一个缺陷。它的 REST API 没有身份验证层，并且返回数据源配置的端点 - 列表数据源端点 (GET /datasources) 和数据源元数据端点 - 使用默认的 Gson 配置序列化数据源对象，没有字段排除策略。因此，为每个配置的监控数据源存储的身份验证机密（基本身份验证密码、不记名令牌、API 密钥和 OAuth2 客户端机密）以明文形式返回给任何能够访问该服务的客户端。具有 Autotune 网络访问权限的攻击者可以获取这些凭据并重新使用它们来对后备监控堆栈进行身份验证。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "明文存储口令", "kind_en": "密码的明文存储", "last_modified_time": "2026-10-24", "level": "High", "mps_id": "MPS-5f1j-078h", "poc": false, "poc_url": [], "published_time": "2026-10-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-5f1j-078h", "name": "https://www.oscs1024.com/hd/MPS-5f1j-078h"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-110975", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-110975"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-110975", "name": ""}, {"url": "https://bugzilla.redhat.com/show_bug.cgi?id=2512012", "name": "RHBZ#2512012"}, {"url": "https://github.com/kruize/autotune/pull/2038", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Autotune：kruize/autotune：kruis/autotune：数据源凭证泄露", "_translated": true, "_saved_at": "2026-10-23T19:43:01+00:00", "_first_saved_at": "2026-10-23T19:43:01+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-5f1j-078h"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过向受信任的数据序列化过程中添加恶意数据，从而在序列化和反序列化过程中执行恶意代码的攻击漏洞。这种漏洞通常存在于使用序列化 (serialization) 机制存储和传输数据的程序中。\n", "title": "什么是反序列化"}, {"content": "- 注入攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码注入到程序中，从而实现代码执行的目的。\n- 反射攻击：攻击者使用反射机制，在序列化过程中动态生成恶意数据，并将恶意代码注入到程序中，从而实现代码执行的目的。\n- 缓冲区溢出攻击：攻击者通过在序列化过程中向缓冲区输入恶意数据，导致缓冲区溢出，从而破坏程序的内存管理，实现代码执行的目的。\n- 格式字符串攻击：攻击者通过在序列化过程中输入恶意数据，导致程序使用错误的格式字符串，从而实现代码执行的目的。\n- 数据流攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码作为一个数据流传递给程序，从而实现代码执行的目的。\n", "title": "反序列化常见的攻击方式"}, {"content": "- 不信任输入数据：程序应该严格检查输入数据的有效性，并避免使用不受信任的数据。\n- 使用安全的序列化机制：程序应该使用安全的序列化机制，如 JSON 或 XML 序列化，而不是第三方序列化库。\n- 最小特权原则：程序应该限制对受信任数据的处理权限，并避免在运行时修改数据。\n- 代码审查和漏洞扫描：程序应该进行代码审查和漏洞扫描，以发现和修复潜在的安全漏洞。\n", "title": "如何预防反序列化"}], "cnvd_id": "", "cve_id": "CVE-2026-114704", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-502", "description": "Relevanssi 是一款开源的 WordPress 站内搜索增强插件，源码托管于 GitHub（msaari/relevanssi，GPL-3.0），用于替换 WordPress 默认搜索，提供更精确的检索结果与同义词、停用词等管理功能。\n受影响版本中，Polylang 兼容层 lib/compatibility/polylang.php 的 relevanssi_get_language_term_taxonomy_id() 函数通过 $wpdb-\u003eget_results() 读取 wp_term_taxonomy 表中 taxonomy 为 language 的术语描述字段，并对该字段直接调用 unserialize()；术语描述可被具备术语编辑权限的高权限用户写入任意序列化对象，当具备 Relevanssi 设置页访问权限（默认要求 manage_options）的用户在管理后台执行添加停用词操作时，停用词处理流程 relevanssi_add_single_stopword() 会调用该函数，攻击者写入的序列化对象被还原，形成 PHP 对象注入，若环境中存在可用的 POP gadget 链，可能导致敏感数据泄露、任意文件删除或远程代码执行。\n修复版本中通过移除 unserialize() 调用完成修复，改为使用 preg_match() 正则表达式从术语描述中直接提取 locale 字符串进行纯文本比对，不再还原任何 PHP 对象，切断了对象注入路径；该修复包含在 4.28.5 版本中。", "effects": [{"comp_name": "relevanssi", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,4.28.5)", "min_fixed_version": "4.28.5", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "反序列化", "kind_en": "不可信数据的反序列化", "last_modified_time": "2026-10-24", "level": "High", "mps_id": "MPS-hfxz-oret", "poc": false, "poc_url": [], "published_time": "2026-10-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-hfxz-oret", "name": "https://www.oscs1024.com/hd/MPS-hfxz-oret"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-114704", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-114704"}, {"url": "https://patchstack.com/database/wordpress/plugin/relevanssi/vulnerability/wordpress-relevanssi-plugin-4-28-4-php-object-injection-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Relevanssi PHP 对象注入漏洞", "_translated": true, "_saved_at": "2026-10-25T03:02:08+00:00", "_first_saved_at": "2026-10-24T15:13:48+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-hfxz-oret"}, {"analysis_status": 0, "articles": [{"content": "应用程序在处理用户输入时的不完善或缺乏验证机制，所以攻击者能够通过向应用程序发送恶意输入，利用应用程序对输入数据的错误处理方式来注入自己的恶意代码。这些恶意代码会被应用程序误认为是合法的指令或数据，并在执行过程中被执行。", "title": "什么是代码注入"}, {"content": "应用程序使用可执行动态代码的函数来执行用户可控的参数，当应用程序对于用户输入过滤不完全时，攻击者可以注入恶意代码并控制代码执行流程。", "title": "代码注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对所有用户输入进行验证和过滤，确保只接受预期的有效输入。这包括对输入数据进行输入长度验证、类型检查和格式验证等。\r\n- 使用参数化查询或预编译语句：对于数据库查询操作，应该使用参数化查询或预编译语句，确保输入数据不会被误认为是执行代码。\r\n- 最小特权原则：应用程序在执行操作系统命令或动态代码时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。\r\n- 安全编码实践：开发人员应该采用安全编码实践，包括避免使用eval函数、避免拼接用户输入的字符串作为代码执行等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止代码注入攻击。", "title": "如何预防代码注入"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-113673", "cvss": {}, "cvss_score": 7.2, "cvss_vector": "", "cwe": "CWE-94", "description": "GeoDirectory 是 AyeCode 团队开发的 WordPress 开源商业目录插件，通过 WordPress.org 插件目录分发，用于搭建本地商户目录、分类信息与企业名录站点。\n受影响版本中，后台 Tools 页面的 DB Text Export 功能在 load_db_language() 中把数据库内管理员自定义文本（自定义字段标题、内容类型标签、GD 选项值等）逐条拼接为插件目录下 db-language.php 中的 __() 单引号字符串字面量，仅用 str_replace 转义单引号而不处理反斜杠，包含反斜杠与引号的文本可以闭合该字面量并注入任意 PHP 代码；生成的文件无 ABSPATH 访问控制，多站点网络中具备 manage_options 权限但并非超级管理员的子站管理员可触发导出，任意未认证访客请求该文件便可触发注入代码执行，最终形成远程代码执行。\n修复版本中通过 load_db_language() 改用 var_export() 生成合法 PHP 字符串字面量使数据库文本无法逃逸，新增 can_export_db_texts() 将导出权限收紧为多站点超级管理员或单站点 manage_options 用户，新增 is_translatable_db_text() 过滤空值、数字与非法 UTF-8 文本，并在 db-language.php 头部写入 ABSPATH 检查阻止文件被直接请求执行。", "effects": [{"comp_name": "geodirectory", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.8.194)", "min_fixed_version": "2.8.194", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "代码注入", "kind_en": "代码生成控制不当（“代码注入”）", "last_modified_time": "2026-10-24", "level": "High", "mps_id": "MPS-w56d-tjma", "poc": false, "poc_url": [], "published_time": "2026-10-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-w56d-tjma", "name": "https://www.oscs1024.com/hd/MPS-w56d-tjma"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-113673", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-113673"}, {"url": "https://wpscan.com/vulnerability/7ef117ed-1fd6-48e6-b242-87a7b65d3477/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "GeoDirectory 代码注入漏洞", "_translated": true, "_saved_at": "2026-10-24T06:46:50+00:00", "_first_saved_at": "2026-10-24T06:46:50+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-w56d-tjma"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-114694", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:L", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:L", "cwe": "CWE-79", "description": "Events Manager 是 WordPress 平台的开源事件管理插件（插件目录标识 events-manager，由 Pixelite 开发），提供活动发布、地点管理、报名预订、前台搜索与日历展示等功能。\n受影响版本中，前台管理页面模板在输出请求相关数据时未做转义：templates/tables/locations.php 与 templates/tables/events.php 把以 $_SERVER['REQUEST_URI'] 为基础、经 add_query_arg() 与 em_add_get_params() 生成的链接直接拼入 href 属性，搜索表单与地图等模板也存在同类未转义输出；攻击者可构造含恶意脚本的链接诱导已登录的地点或事件管理用户访问，请求 URI 中的内容被反射进页面 HTML 并在受害者会话中执行，导致窃取会话凭据、冒充用户操作等后果。\n修复版本中通过补齐输出转义切断该链路：7.4.9 将上述模板中 add_query_arg() 与 em_add_get_params() 的输出统一改用 esc_url() 拼接，并对搜索表单视图、排序、分类、标签及地图尺寸等模板变量补齐 esc_attr()/esc_html() 转义，使反射输入无法脱离 HTML 属性上下文执行。", "effects": [{"comp_name": "events-manager", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,7.4.9)", "min_fixed_version": "7.4.9", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-10-24", "level": "High", "mps_id": "MPS-f4ad-o0jc", "poc": false, "poc_url": [], "published_time": "2026-10-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-f4ad-o0jc", "name": "https://www.oscs1024.com/hd/MPS-f4ad-o0jc"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-114694", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-114694"}, {"url": "https://patchs sv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:L", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:L", "cwe": "CWE-79", "description": "QA Assistants（前身为 QA Analytics，插件标识 qa-heatmap-analytics）是 QuarkA 开发的 WordPress 开源插件，通过官方插件目录分发，用于采集站点访客的点击、滚动等行为数据并提供热力图与会话回放分析。\n受影响版本中，行为数据接口 qahm-ajax.php（action=record_behavioral_data）无需认证即可提交 event_ary 事件数据，QAHM_Behavioral_Data::record_behavioral_data 方法对每条事件只校验类型标识、时间列与对应类型的数值列，p、a 类型行的字符串列原样保留，行内多余列也随数据合并写入回放数据文件；管理员打开会话回放页面 replay-view.php 时，存储数据经 wp_json_encode 输出后被直接拼进 JavaScript 单引号字符串，该编码不转义单引号、\u003c、\u003e、\u0026，攻击者可借此在存储数据中注入任意脚本，并在管理员浏览器中执行，窃取后台会话或以管理员身份操作站点。\n修复版本中通过在服务端按事件类型重建数据行，仅接受 c、s、m、r 类型并把所有列强制转为整数、丢弃多余列、拒绝 p、a 类型，封堵恶意字符串入库路径；输出侧将 wp_json_encode 携带 JSON_HEX_TAG、JSON_HEX_AMP、JSON_HEX_APOS、JSON_HEX_QUOT 标志并以 JavaScript 值而非单引号字符串形式输出，配合 replay-view.js 移除多余的 JSON.parse，切断从存储数据到脚本执行的利用链。", "effects": [{"comp_name": "qa-heatmap-analytics", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,5.3.0.2)", "min_fixed_version": "5.3.0.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-10-24", "level": "High", "mps_id": "MPS-fxgk-na91", "poc": false, "poc_url": [], "published_time": "2026-10-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-fxgk-na91", "name": "https://www.oscs1024.com/hd/MPS-fxgk-na91"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-114697", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-114697"}, {"url": "https://patchstack.com/database/wordpress/plugin/qa-heatmap-analytics/vulnerability/wordpress-qa-analytics-plugin-5-3-0-1-cross-site-scripting-xss-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "t 令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-115586", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:L/AC:H/AT:P/PR:N/UI:A/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:L/AC:H/AT:P/PR:N/UI:A/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-78", "description": "virtualenv 是 pypa 维护的开源命令行工具，用于创建隔离的 Python 虚拟环境，并在环境内生成 bin/activate 等 shell 激活脚本。\n受影响版本中，--prompt 参数值在生成脚本时以 VIRTUAL_ENV_PROMPT 形式原样写入 bin/activate，激活脚本 src/virtualenv/activation/bash/activate.sh 的提示符分支在激活时刻 promptvars 关闭且未启用 POSIX 模式时，把未经 $ 与反引号转义的提示值直接拼入 PS1。promptvars 与 POSIX 模式属于运行期 shell 状态，嵌入命令替换的提示值（如 x$(id)y）在激活后可通过 shopt -s promptvars、set -o posix 或启动继承导出 PS1 的交互式子 bash 进入提示符展开并被执行，攻击者以激活环境的用户身份获得命令执行；该值还持久化在 pyvenv.cfg 与生成的脚本中，可在后续会话首次提示符重绘时再次触发。\n修复版本中通过重写 bash 分支的 PS1 构造逻辑解决该问题：逐字符遍历提示值并对反斜杠、美元符与反引号统一添加反斜杠转义，不再依赖激活时刻的 shell 选项状态，使提示值在任意 promptvars 与 POSIX 模式组合下均保持字面量；zsh 分支改为将提示值存入 psvar[9] 并以 %9v 引用插入提示符，使该值始终作为数据处理，从而切断命令替换进入提示符展开的执行路径。", "effects": [{"comp_name": "virtualenv", "ecosystem": "pip", "versions": [{"affected_version": "[21.14.9,21.14.13)", "min_fixed_version": "21.14.13", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-10-24", "level": "High", "mps_id": "MPS-tyzg-v4h6", "poc": false, "poc_url": [], "published_time": "2026-10-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-tyzg-v4h6", "name": "https://www.oscs1024.com/hd/MPS-tyzg-v4h6"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-115586", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-115586"}, {"url": "https://github.com/pypa/virtualenv/security/advisories/GHSA-cx6f-vjhg-g3cc", "name": "https://github.com/pypa/virtualenv/security/advisories/GHSA-cx6f-vjhg-g3cc"}, {"url": "https://github.com/pypa/virtualenv/pull/3466", "name": "https://github.com/pypa/virtualenv/pull/3466"}, {"url": "https://github.com/pypa/virtualenv/commit/3598e201f6f044e389136b2347a8a919ac03c5f4", "name": "https://github.com/pypa/virtualenv/commit/3598e201f6f044e389136b2347a8a919ac03c5f4"}, {"url": "https://github.com/pypa/virtualenv/releases/tag/21.14.13", "name": "https://github.com/pypa/virtualenv/releases/tag/21.14.13"}], "scope_influence": "", "tags": ["python", "开源", "终端软件"], "title": "virtualenv命令执行漏洞", "_translated": true, "_saved_at": "2026-10-24T01:19:25+00:00", "_first_saved_at": "2026-10-23T22:50:05+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-tyzg-v4h6"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-112207", "cvss": {}, "cvss_score": 7.1, "cvss_vector": "", "cwe": "CWE-79", "description": "Download Monitor 是 WordPress 官方插件目录中的开源下载管理插件，用于管理和分发文件下载、统计下载次数，默认在前端通过 dlm-xhr.js 以 XMLHttpRequest 异步处理下载链接点击。\n受影响版本中，dlm-xhr.js 的点击处理逻辑使用 url.indexOf(dlmXHRGlobalLinks) 子串匹配判断链接是否属于站点下载端点，攻击者可构造包含端点字符串的跨站链接绕过该校验；用户在站点页面点击该链接后，脚本向攻击者服务器发起 XMLHttpRequest 请求，并在响应状态码为 404 或 403 时将响应 statusText 通过 innerHTML 写入页面，该状态短语完全由攻击者服务器控制，可携带任意 HTML 与 JavaScript，未认证攻击者诱导用户点击构造链接后能在受害者浏览器中以站点源执行任意代码。\n修复版本中通过新增 isDownloadLink 函数，使用 URL 解析校验链接协议为 http/https、主机与下载端点一致并匹配端点路径或查询参数，替代原子串匹配，使跨站链接不再进入 XHR 下载流程；同时将 404/403 响应的 statusText 渲染方式由 innerHTML 改为 textContent，并移除将 statusText 用作 401 跳转目标的逻辑，切断注入路径。", "effects": [{"comp_name": "download-monitor", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,5.3.4)", "min_fixed_version": "5.3.4", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-10-24", "level": "High", "mps_id": "MPS-uyem-ph8o", "poc": false, "poc_url": [], "published_time" 不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-114695", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:L", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:L", "cwe": "CWE-79", "description": "VOD Infomaniak 是 Infomaniak Network 开源的 WordPress 插件（GPL 协议），用于在 WordPress 站点内嵌入和管理 Infomaniak VOD 平台上的视频与播放列表。\n受影响版本中，插件在 vod_callback.php 回调端点使用松散比较 $aOptions['vod_api_callbackKey'] == $_REQUEST['key'] 校验回调密钥，当密钥尚未生成时比较恒为真，未认证攻击者可提交携带单引号的 sFileServerCode 等视频字段并经 insert_video() 写入本地数据库；EasyVod 的 searchVideo() 方法与 vod.template.php 模板随后将这些存储字段直接拼入 onclick=\"Vod_selectVideo(...)\" 的 JS 字符串和 \u003cimg src\u003e 属性，未经 esc_js、esc_url、esc_html 转义，管理员浏览视频管理页或执行视频搜索时恶意脚本在其浏览器中执行。\n修复版本中通过在 vod_callback.php 改用 hash_equals() 常量时间比较并在密钥为空时拒绝全部请求，在 searchVideo() 与模板中对全部存储字段补齐 esc_js、esc_url、esc_html、esc_attr 转义并将 openVodPopup 传参改为 data-* 属性，同时新增 ajaxGuard() 为 AJAX 端点强制 nonce 与能力校验，切断了从未认证回调注入到管理员页面执行的存储型 XSS 链路。", "effects": [{"comp_name": "vod-infomaniak", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.5.15)", "min_fixed_version": "1.5.15", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-10-24", "level": "High", "mps_id": "MPS-wjva-bqr9", "poc": false, "poc_url": [], "published_time": "2026-10-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-wjva-bqr9", "name": "https://www.oscs1024.com/hd/MPS-wjva-bqr9"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-114695", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-114695"}, {"url": "https://patchstack.com/database/wordpress/plugin/vod-infomaniak/vulnerability/wordpress-vod-infomaniak-plugin-1-5-14-cross-site-scripting-xss-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "VOD Infomaniak存储型XSS漏洞", "_translated": true, "_saved_at": "2026-10-24T11:47:31+00:00", "_first_saved_at": "2026-10-24T11:47:31+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-wjva-bqr9"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-116067", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:L/A:N", "severity": "high", "base_score": 8.2}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:L/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:L/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-22", "description": "Paisa 是一个使用 Go 编写的开源（AGPL-3.0）个人财务管理工具，通过 Web 界面管理 ledger 记账文件与表格，提供资产负债、现金流等报表展示。\n受影响版本中，/api/editor/file、/api/editor/file/delete_backups、/api/sheets/file、/api/sheets/file/delete_backups 接口对应的 GetFile、DeleteBackups、GetSheet、DeleteSheetBackups 处理函数直接使用 filepath.Join(dir, file.Name) 拼接客户端提交的文件名，缺少同文件 SaveFile 已有的 BuildSubPath 路径边界校验，name 参数携带 ../ 序列可越出期刊目录，经 readLedgerFile 执行 os.ReadFile 读取服务器进程可访问的任意文件；DeleteBackups 与 DeleteSheetBackups 还通过 filepath.Glob 匹配并以 os.Remove 删除期刊或表格目录之外的 *.backup.* 备份文件。默认部署未配置 user_accounts 时 TokenAuthMiddleware 不做认证，攻击者无需凭据可远程利用。\n修复版本中通过在四个处理函数中调用 utils.BuildSubPath 校验文件名未越出基准目录，非法名称直接返回 Invalid file name，并新增 utils.Glob 使用 regexp.QuoteMeta 固定字面文件名后基于 os.DirFS 在目录内匹配备份文件，切断了路径穿越读取与任意备份删除链路。", "effects": [{"comp_name": "paisa", "ecosystem": "linux", "versions": [{"affected_version": "[0,0.7.8)", "min_fixed_version": "0.7.8", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-10-25", "level": "High", "mps_id": "MPS-3ci5-8kbf", "poc": false, "poc_url": [], "published_time": "2026-10-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-3ci5-8kbf", "name": "https://www.oscs1024.com/hd/MPS-3ci5-8kbf"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-116067", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-116067"}, {"url": "https://github.com/ananthakumaran/paisa/issues/420", "name": "GitHub Issue #420"}, {"url": "https://github.com/ananthakumaran/paisa", "name": ""}, {"url": "https://github.com/ananthakumaran/paisa/blob/v0.7.7/internal/server/editor.go#L49-L70", "name": ""}, {"url": "https://github.com/ananthakumaran/paisa/commit/035949351f7c0d0f90ecf767aa1e28b4d5a0ae31", "name": ""}, {"url": "https://github.com/ananthakumaran/paisa/releases/tag/v0.7.8", "name": "v0.7.8 Release Notes"}, {"url": "https://www.vulncheck.com r 模块提供表单定义与数据条目的创建、管理能力，广泛用于知识库与社区协作站点。\n受影响版本中，Bazar 条目创建请求里的 date_maj_fiche 字段经 EntryManager::create() 原样传入 PageManager::save() 的第 5 个参数 $forcedDate，PageManager 在 includes/services/PageManager.php:381 以 $time = '\"' . $forcedDate . '\"' 将其裸拼接进 INSERT INTO ... SET 语句，而同语句的 tag、owner、user、body 等列均经 dbService-\u003eescape() 转义，该值是语句中唯一未转义的插值；攻击者用双引号闭合 time 字符串字面量后可注入子查询，把 wiki_users 表的账号与密码哈希写入新建页面的可控列并读取回显，默认配置下未认证用户可经 saisir_fiche 表单入口直达同一漏洞路径。\n修复版本中通过在 PageManager::save() 中为 $forcedDate 增加严格 datetime 正则校验（^\\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2}:\\d{2}$），不匹配的值回退为 now()，使外部请求值不再进入 SQL 语句，并以回归测试覆盖恶意 forcedDate 被忽略、合法日期仍生效的场景。", "effects": [{"comp_name": "yeswiki/yeswiki", "ecosystem": "composer", "versions": [{"affected_version": "[4.5.0,4.7.0)", "min_fixed_version": "4.7.0", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-10-25", "level": "High", "mps_id": "MPS-6die-ajpb", "poc": false, "poc_url": [], "published_time": "2026-10-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-6die-ajpb", "name": "https://www.oscs1024.com/hd/MPS-6die-ajpb"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-116211", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-116211"}, {"url": "https://github.com/YesWiki/yeswiki/security/advisories/GHSA-wjf7-hrf3-9gcx", "name": "GitHub Security Advisory (GHSA-wjf7-hrf3-9gcx)"}, {"url": "https://www.vulncheck.com/advisories/yeswiki-4.5.0-before-4.7.0-sql-injection-via-date-maj-fiche-in-bazar-entry-create", "name": "VulnCheck Advisory: YesWiki 4.5.0 before 4.7.0 SQL Injection via date_maj_fiche in Bazar entry create"}], "scope_influence": "", "tags": ["php", "开源"], "title": "YesWiki SQL注入漏洞", "_translated": true, "_saved_at": "2026-10-25T20:16:32+00:00", "_first_saved_at": "2026-10-25T17:21 R:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.2}]}, "cvss_score": 8.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-916", "description": "rotki 是一个采用 AGPL-3.0 协议开源的加密资产会计与投资组合追踪工具，其 premium 订阅提供用户数据库的云端备份与跨设备同步功能。\n受影响版本中，premium 备份加密位于 rotkehlchen/crypto.py 的 encrypt() 函数，该方法仅执行一次无盐 SHA-256 将用户登录口令直接变换为 AES-256-CBC 密钥，无盐值且无迭代拉伸；已登录用户通过 PUT /api/1/premium/sync（action=upload）触发上传时，rotkehlchen/data_handler.py 的 compress_and_encrypt_db() 以该弱密钥加密压缩后的 SQLite 用户数据库并存储到 premium 服务器，攻击者获取备份 blob 后可实施 GPU 并行的离线口令爆破，解密出 exchange API 密钥、钱包地址与交易历史等敏感数据。\n修复版本中通过以 encrypt_backup()/decrypt_backup() 重写备份加密：使用随机盐 Argon2id（默认 time_cost=8、256MiB 内存、8 lanes）派生主密钥并经 HKDF 拆分出 AES-256-GCM 加密密钥与 key commitment，密文按 64KiB 分块认证加密且含 last_modify_ts 的头部整体作为附加认证数据，同步流程同时拒绝降级回旧格式备份，显著提高离线爆破口令的计算成本。", "effects": [{"comp_name": "rotki", "ecosystem": "linux", "versions": [{"affected_version": "[0,1.44.2)", "min_fixed_version": "1.44.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "使用具有不充分计算复杂性的口令哈希", "kind_en": "使用密码哈希但计算量不足", "last_modified_time": "2026-10-25", "level": "High", "mps_id": "MPS-sh20-zqp1", "poc": false, "poc_url": [], "published_time": "2026-10-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-sh20-zqp1", "name": "https://www.oscs1024.com/hd/MPS-sh20-zqp1"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-116071", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-116071"}, {"url": "https://github.com/rotki/rotki/issues/13393", "name": "GitHub Issue #13393"}, {"url": "https://github.com/rotki/rotki", "name": ""}, {"url": "https://github.com/rotki/rotki/pull/13401", "name": ""}, {"url": "https://github.com/rotki/rotki/blob/v1.44.1/rotkehlchen/crypto.py#L17-L45", "name": ""}, {"url": "https://github.com/rotki/rotki/blob/v1.44.1/rotkehlchen/data_handler.py#L263-L294", "name": ""}, {"url": "https://github.com/rotki/rotki/releases/tag/v1.44.2", "name": "v1.44.2 Release Notes"}, {"url": "https://www.vulncheck.com/advisories/rotki-before-1.44.2-weak-key-derivation-for-premium-cloud-backup-encryption", "name": "VulnCheck Advisory: rotki before 1.44.2 Weak Key Derivation for Premium Cloud Backup Encryption"}], "scope_influence": "", "tags": ["应用软件"], "title": "rotki弱密钥派生漏洞", "_translated": true, "_saved_at": "2026-10-25T13:30:20+00:00", "_first_saved_at": "2026-10-25T13:30:20+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-sh20-zqp1"}, {"analysis_status": 0, "articles": [{"content": "跨站点请求伪造 (CSRF)通过利用网站对用户请求的信任进行攻击。当用户在网站A登录并在同一浏览器会话中访问网站B时，攻击者可以构造特制的请求并诱使用户执行，以使网站B误以为这些请求是用户合法发起的。\n攻击者通常通过欺骗用户点击恶意链接、在受信任的网站中植入恶意代码或通过钓鱼等手段来实施CSRF攻击，一旦用户执行了恶意请求，攻击者可以以用户的身份执行任意操作，包括更改用户密码、发起资金转账或删除重要数据等。", "title": "什么是CSRF"}, {"content": "- 链接欺骗：攻击者通过向用户发送包含恶意链接的电子邮件或社交媒体消息，诱使用户点击并执行恶意请求。\n- 图片引用攻击：攻击者通过在恶意网站上包含指向目标网站的图片引用，以触发用户浏览器自动发送目标网站的请求。\n- XSS利用：如果目标网站存在XSS漏洞，攻击者可以注入恶意脚本，以使用户在浏览器中执行恶意请求。", "title": "CSRF常见的攻击方式"}, {"content": "- 随机令牌：网站可以在每个请求中包含一个随机生成的令牌（CSRF Token），并验证该令牌的有效性，以确认请求的来源是合法的。\n- SameSite Cookie：使用SameSite属性来限制跨站点请求，将Cookie的发送限制在同一站点上，减少了跨站请求伪造的风险。\n- 双重验证：对于敏感操作，网站可以要求用户进行额外的验证，例如输入验证码、提供第二个因素的身份验证等。\n- 强化浏览器策略：网站可以设置Content-Security-Policy（CSP）头，限制浏览器执行恶意脚本的能力，减少CSRF攻击的风险。\n- 限制用户操作：网站可以要求用户在执行敏感操作之前进行明确的确认或授权，防止恶意请求被误触发。\n- 安全编码实践：开发人员应遵循安全编码实践，对用户输入进行适当的验证和过滤，防止恶意请求的注入。", "title": "如何预防CSRF"}], "cnvd_id": "", "cve_id": "CVE-2026-116204", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:N/I:H/A:H", "severity": "high", "base_score": 8.1}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:N/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:N/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-352", "description": "YesWiki 是一个采用 AGPL-3.0 协议开源的 PHP Wiki 协作系统，提供多用户页面编辑、权限控制、表单与插件扩展等能力。\n受影响版本中，tools/security/actions/despam.php 的 despam 管理动作在 isset($_POST['clean']) 分支内遍历 $_POST['suppr'] 数组并逐个调用 PageController::delete() 删除页面，同时按 $_POST['rev'] 数组将任意历史修订恢复为当前版本，整个流程仅依赖会话态的 UserIsAdmin() 判定，缺少 CSRF Token 与 Origin/Referer 校验；结合默认 default_write_acl='*' 与 allow_raw_html=true，未认证攻击者可在 Wiki 页面植入自动提交的 HTML 表单，管理员浏览该页面时浏览器携带管理员会话发出同站 POST，导致 PagePrincipale、GererConfig 等任意页面被删除或当前内容被旧版本覆盖。\n修复版本中通过在 despam 动作表单中输出 csrf-token 隐藏字段，并在进入 clean 处理分支前调用 CsrfTokenController::checkToken('main', 'POST', 'csrf-token', false) 强制校验请求，校验失败的跨站请求被拒绝，切断了上述利用链。", "effects": [{"comp_name": "yeswiki/yeswiki", "ecosystem": "composer", "versions": [{"affected_version": "(-∞,4.7.0)", "min_fixed_version": "4.7.0", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "CSRF", "kind_en": "跨站请求伪造 (CSRF)", "last_modified_time": "2026-10-25", "level": "High", "mps_id": "MPS-2co8-5sv0", "poc": false, "poc_url": [], "published_time": "2026-10-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-2co8-5sv0", "name": "https://www.oscs1024.com/hd/MPS-2co8-5sv0"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-116204", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-116204"}, {"url": "https://github.com/YesWiki/yeswiki/security/advisories/GHSA-cv88-hx5q-vq72", "name": "GitHub Security Advisory (GHSA-cv88-hx5q-vq72)"}, {"url": "https://www.vulncheck.com/advisories/yeswiki-be
