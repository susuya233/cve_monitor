 "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "栈缓冲区溢出", "kind_en": "基于堆栈的缓冲区溢出", "last_modified_time": "2026-08-22", "level": "Critical", "mps_id": "MPS-yci9-lbjo", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-yci9-lbjo", "name": "https://www.oscs1024.com/hd/MPS-yci9-lbjo"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-77946", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-77946"}, {"url": "https://github.com/dxz0069/WAVLINK-WN530H4-Command-Injection-in-set_add_routing/blob/main/TEW-821DAP_ssi_NTP_Timezone_Config_Stack_Overflow.md", "name": ""}, {"url": "https://vuldb.com/cve/CVE-2026-77946", "name": ""}, {"url": "https://vuldb.com/submit/881252", "name": ""}, {"url": "https://vuldb.com/vuln/394175", "name": ""}, {"url": "https://vuldb.com/vuln/394175/cti", "name": ""}], "scope_influence": "", "tags": [], "title": "TRENDnet TEW-821DAP 栈缓冲区溢出", "_translated": true, "_saved_at": "2026-08-22T12:25:58+00:00", "_first_saved_at": "2026-08-22T12:25:58+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-yci9-lbjo"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "cnvd_id": "", "cve_id": "CVE-2026-39909", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.1}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:H/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.2}]}, "cvss_score": 9.2, "cvss_vector": "CVSS:4.0/AV:N/AC:H/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-416", "description": "llama.cpp 是开源的 C/C++ 大模型推理引擎，ggml-org 在 GitHub 上以 MIT 协议发布，支持本地与分布式模型推理，属于大模型与机器学习基础设施组件。\n受影响版本中，ggml/src/ggml-rpc/ggml-rpc.cpp 的 RPC 服务器在 rpc_server::free_buffer 直接释放 backend buffer 时，没有同步使 stored_graphs 中缓存的 ggml_cgraph 失效。rpc_server::graph_recompute 从 stored_graphs 取出 graph 后调用 ggml_backend_graph_compute，图中节点仍持有已被 free_buffer 释放的 backend buffer 指针，触发释放后重用。RPC 协议不要求认证，远程攻击者只要能连接 RPC 服务器 TCP 端口，先通过 GRAPH_COMPUTE 写入带 buffer 引用的图，再以 FREE_BUFFER 释放对应 buffer 并用 ALLOC_BUFFER/SET_TENSOR 重塑同一块内存，最后通过 GRAPH_RECOMPUTE 让服务器沿悬空指针执行，可泄漏 libc 地址并劫持 buffer 接口的 vtable，最终实现远程代码执行。\n修复版本中通过在 rpc_server::free_buffer 中按设备遍历 stored_graphs 并将每个 sg.graph 置空，使 cached graph 随引用 buffer 一同失效；之后 graph_recompute 中原有的 nullptr 检查会拒绝该请求，客户端自动回退到 GRAPH_COMPUTE，悬空指针不再进入危险执行路径。", "effects": [{"comp_name": "llama.cpp", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,b8585)", "min_fixed_version": "b8585", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "UAF", "kind_en": "免费后使用", "last_modified_time": "2026-08-22", "level": "Critical", "mps_id": "MPS-ld2x-tp9b", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ld2x-tp9b", "name": "https://www.oscs1024.com/hd/MPS-ld2x-tp9b"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-39909", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-39909"}, {"url": "https://github.com/ggml-org/llama.cpp/commit/389c7d4955ba55c7418afaebf7c23d9ed64ef707", "name": ""}, {"url": "https://github.com/ggml-org/llama.cpp/pull/21175", "name": ""}, {"url": "https://github.com/ggml-org/llama.cpp/releases/tag/b8585", "name": ""}, {"url": "https://www.vulncheck.com/advisories/llama-cpp-use-after-free-in-rpc-graph-recompute-handler", "name": ""}], "scope_influence": "", "tags": ["AI", "应用软件"], "title": "llama.cpp RPC服务器GRAPH_RECOMPUTE处理器释放后重用漏洞", "_translated": true, "_saved_at": "2026-08-21T18:27:48+00:00", "_first_saved_at": "2026-08-21T18:27:48+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ld2x-tp9b"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-75932", "cvss": {"cvssv31": [{"source": "9119a7d8-5eab-497f-8521-727c672e3725", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:L/A:H", "severity": "high", "base_score": 8.6}], "cvssv4": [{"source": "9119a7d8-5eab-497f-8521-727c672e3725", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:L/VI:L/VA:H/SC:H/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.2}]}, "cvss_score": 9.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:L/VI:L/VA:H/SC:H/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-862", "description": "Jet Admin 是 Jet Admin Inc. 提供的无代码业务应用构建与托管 SaaS 平台，用户可在其工作区中创建应用并绑定自有自定义域名对外提供访问。NVD 漏洞标签为 exclusively-hosted-service，表明该缺陷仅存在于官方托管的多租户服务中。\n受影响版本中，Jet Admin 多租户服务在处理用户自定义域名接入请求时缺少对域名归属的授权校验，攻击者可在自己的工作区创建恶意应用并将该应用关联到目标用户的自定义域名，进而修改受害工作区的身份认证配置，将原本应路由到目标应用的流量改写到攻击者控制的应用；一旦恶意应用成功挂载到受害域名，受害工作区中配置的 OAuth Provider 的 Client ID 与 Client Secret 会泄露到攻击者工作区，造成凭据外泄与潜在的进一步账户接管。\n修复版本中通过官方托管服务侧的访问控制强化解决了该问题，对自定义域名与应用工作区之间的绑定操作追加域名所有权校验，并阻断非授权工作区对受害域名身份认证配置的改写与对 OAuth Provider 凭据的拉取；NVD/CVE.org 未披露具体修复版本号，建议所有 Jet Admin SaaS 租户及时关注官方安全通知并按厂商指引复核自定义域名与 OAuth Provider 凭据。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-08-22", "level": "Critical", "mps_id": "MPS-wilm-nr1o", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-wilm-nr1o", "name": "https://www.oscs1024.com/hd/MPS-wilm-nr1o"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-75932", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-75932"}, {"url": "https://raw.githubusercontent.com/cisagov/CSAF/develop/csaf_files/IT/white/2026/va-26-232-02.json", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-75932", "name": ""}, {"url": "https://www.jetadmin.io/", "name": ""}], "scope_influence": "", "tags": [], "title": "Jet Admin 自定义域名授权缺失漏洞", "_translated": true, "_saved_at": "2026-08-21T18:27:49+00:00", "_first_saved_at": "2026-08-21T17:22:33+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-wilm-nr1o"}, {"analysis_status": 0, "articles": [{"content": "- 程序未正确处理用户上传的文件，从而导致程序可以读取、处理或存储未经授权的文件\n", "title": "什么是任意文件上传"}, {"content": "- 欺骗攻击：攻击者可以通过发送伪造的文件来欺骗程序，从而导致程序读取、处理或存储未经授权的文件。\n- 文件格式攻击：攻击者可以通过选择特定的文件格式，例如压缩文件或 ZIP 文件，从而利用上传的文件来篡改程序的执行结果或窃取程序中的重要数据。\n", "title": "任意文件上传常见的攻击方式"}, {"content": "- 使用安全文件传输协议 (FTP):使用安全 FTP 协议可以确保上传的文件格式、大小、权限等符合预期，同时可以防止文件读取、篡改或存储漏洞。\n- 使用文件上传过滤器：使用文件上传过滤器可以过滤上传的文件，以确保文件的格式、大小、权限等符合预期，同时可以防止文件读取、篡改或存储漏洞。\n- 使用白名单机制：使用白名单机制可以只允许特定的文件格式、大小、权限等存在的文件上传，从而防止非法文件的上传和攻击。\n- 定期更新和升级程序：定期更新和升级程序可以修复已知的漏洞，并增强程序的安全性。", "title": "如何预防任意文件上传"}], "cnvd_id": "", "cve_id": "CVE-2026-49849", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.1}]}, "cvss_score": 9.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:C/C:H/I:H/A:H", "cwe": "CWE-434", "description": "xShop 是基于 Laravel 框架开发的一款开源在线商店系统，提供商品、订单、附件等内容管理能力。\n受影响版本中，AttachmentController::attaching 使用未做任何扩展名或 MIME 限制的通用 Request 接收上传文件，并在 save 与父类 XController::storeFile 中以 getClientOriginalName() 直接拼接存储路径，使管理员上传的 .php 等可执行脚本被原样写入 public 磁盘的 attachments 目录，由于该目录可直接被 Web 服务器解析，攻击者通过构造恶意 PHP 文件即可在服务器上获得任意代码执行能力。\n修复版本中通过新增 AttachingRequest 表单请求类并将其绑定到 attaching 方法，对 file 字段强制使用 mimes:png,jpg,svg,mp4,pdf,docx,zip,rar,mp3 等白名单 MIME 与大小上限，从入口处切断可执行脚本上传路径。", "effects": [{"comp_name": "4xmen/xshop", "ecosystem": "composer", "versions": [{"affected_version": "[3.0.3,3.0.4)", "min_fixed_version": "3.0.4", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "任意文件上传", "kind_en": "危险类型文件无限制上传", "last_modified_time": "2026-08-22", "level": "Critical", "mps_id": "MPS-3sh8-xqkz", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-3sh8-xqkz", "name": "https://www.oscs1024.com/hd/MPS-3sh8-xqkz"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-49849", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-49849"}, {"url": "https://github.com/4xmen/xshop/commit/dd4a3add9d6f5b5f9dde9685e97f51057903a1db", "name": ""}, {"url": "https://github.com/4xmen/xshop/pull/64", "name": ""}, {"url": "https://github.com/4xmen/xshop/releases/tag/v3.0.4", "name": ""}, {"url": "https://github.com/4xmen/xshop/security/advisories/GHSA-fc35-qjg3-f6g7", "name": ""}], "scope_influence": "", "tags": ["php", "开源"], "title": "xShop 附件上传未限制文件类型导致远程代码执行漏洞", "_translated": true, "_saved_at": "2026-08-21T23:17:38+00:00", "_first_saved_at": "2026-08-21T23:17:38+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-3sh8-xqkz"}, {"analysis_status": 0, "articles": [{"content": "应用程序在处理用户输入时的不完善或缺乏验证机制，所以攻击者能够通过向应用程序发送恶意输入，利用应用程序对输入数据的错误处理方式来注入自己的恶意代码。这些恶意代码会被应用程序误认为是合法的指令或数据，并在执行过程中被执行。", "title": "什么是代码注入"}, {"content": "应用程序使用可执行动态代码的函数来执行用户可控的参数，当应用程序对于用户输入过滤不完全时，攻击者可以注入恶意代码并控制代码执行流程。", "title": "代码注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对所有用户输入进行验证和过滤，确保只接受预期的有效输入。这包括对输入数据进行输入长度验证、类型检查和格式验证等。\r\n- 使用参数化查询或预编译语句：对于数据库查询操作，应该使用参数化查询或预编译语句，确保输入数据不会被误认为是执行代码。\r\n- 最小特权原则：应用程序在执行操作系统命令或动态代码时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。\r\n- 安全编码实践：开发人员应该采用安全编码实践，包括避免使用eval函数、避免拼接用户输入的字符串作为代码执行等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止代码注入攻击。", "title": "如何预防代码注入"}], "cnvd_id": "", "cve_id": "CVE-2026-62674", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:R/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9}]}, "cvss_score": 9, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:R/S:C/C:H/I:H/A:H", "cwe": "CWE-94", "description": "Omnigent 是开源 AI Agent 框架与元编排层，用于协调多个编码 Agent 协作完成任务，本身属于大模型与 AI Agent 基础设施组件。\n受影响版本中，PUT /sessions/{session_id}/agent 处理器 update_session_agent 仅校验调用者对目标会话具备 LEVEL_EDIT 权限，未拒绝绑定到 agent.session_id 为 None 的共享或模板 Agent。具备会话编辑权限的认证用户可向 omnigent/server/routes/sessions.py 中的 update_session_agent 上传新的 Agent 包（bundle）替换共享 Agent 存储内容，并在其中植入 stdio MCP 服务器配置；后续任何引用该共享 Agent 的会话在加载阶段都会通过 omnigent/tools/mcp.py 的 stdio_client 启动攻击者指定的命令，从而在 Omnigent runner 进程权限下执行任意系统命令，泄露文件、凭据、工作区数据并影响内部服务与 runner 可用性。\n修复版本中通过在 update_session_agent 中复用 session_mcp_servers._editable_agent 已有的守卫，新增 agent.session_id is None 判断并直接以 INVALID_INPUT 拒绝请求，切断认证用户通过 PUT 覆盖共享或模板 Agent 包的路径，使后续会话不再加载被污染的 stdio MCP 配置。", "effects": [{"comp_name": "omnigent", "ecosystem": "pip", "versions": [{"affected_version": "(-∞,0.3.0)", "min_fixed_version": "0.3.0", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "代码注入", "kind_en": "代码生成控制不当（“代码注入”）", "last_modified_time": "2026-08-22", "level": "Critical", "mps_id": "MPS-zrvt-8qye", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-zrvt-8qye", "name": "https://www.oscs1024.com/hd/MPS-zrvt-8qye"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-62674", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-62674"}, {"url": "https://github.com/omnigent-ai/omnigent/commit/25a22dc9e6da4648d23749f0a589e47e6aed991b", "name": ""}, {"url": "https://github.com/omnigent-ai/omnigent/pull/1418", "name": ""}, {"url": "https://github.com/omnigent-ai/omnigent/releases/tag/v0.3.0", "name": ""}, {"url": "https://github.com/omnigent-ai/omnigent/security/advisories/GHSA-jrrm-9hc7-2v3h", "name": ""}], "scope_influence": "", "tags": ["AI", "python", "开源"], "title": "Omnigent 共享 Agent 包覆盖导致远程代码执行漏洞", "_translated": true, "_saved_at": "2026-08-21T19:21:16+00:00", "_first_saved_at": "2026-08-21T19:21:16+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-zrvt-8qye"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-78155", "cvss": {"cvssv31": [{"source": "cve@gitlab.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.9}]}, "cvss_score": 9.9, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "cwe": "CWE-426", "description": "StackGres 是 OnGres 公司开源的 Kubernetes 上的全栈 PostgreSQL 操作员，通过自定义资源把 PostgreSQL、Patroni、pgBouncer、Envoy、监控导出器等组件以云原生方式部署到集群。\n受影响版本中，stackgres-k8s/src/operator/src/main/java/io/stackgres/operator/monitoring/pgexporter/PostgresExporter.java 构建 DATA_SOURCE_NAME 时直接采用 PatroniSecret.getSuperuserCredentials(...) 返回的 PostgreSQL 超级用户口令，连接 Postgres 时既没有 SET ROLE 降级也没有专用监控角色（disableMetricsExporter 默认关闭，导出器在每台主库实例的 sidecar 中默认启用）。同一组件目录下的 prometheus-postgres-exporter/queries.yaml 在 pg_table_bloat、pg_vaccuum_wraparound、pg_stat_progress_vacuum、pg_stat_progress_cluster 等 master 指标查询中以 dblink 跨会话拉起新的超级用户连接进入每一个非模板用户数据库，远程 SQL 体内引用了裸名的 version()、current_setting(...) 以及 pg_attribute、pg_class、pg_namespace、pg_stats 等目录对象，且 dblink 连接串与远程体中均没有 SET search_path = pg_catalog，也没有在 libpq options 中钉死 search_path。拥有目标数据库的非超级用户属主只需 ALTER DATABASE 把它自己的 schema 置于 search_path 首位并植入 shadow 函数，下一次 Prometheus 抓取触发 dblink 远程体解析未限定名字时就会以 PostgreSQL 超级用户身份执行该函数，借助 COPY ... TO PROGRAM 在主 PostgreSQL Pod 内以数据库 OS 用户身份执行任意系统命令，等价于任意低权租户直接接管 PostgreSQL Pod 与所在集群。\n修复版本中通过删除按数据库扇出的超级用户 dblink 会话、改用 SECURITY DEFINER 连接函数把远程体降级到新引入的低权 pg_monitor 角色、并把所有目录引用与函数调用 schema-qualify 为 pg_catalog 同时在每个 dblink 远程体首行固定 SET search_path = pg_catalog，从根本上切断租户 search_path 影响超级用户会话名字解析的链路，详见里程碑 StackGres 1.19.0-rc1 中合并的修复 MR。", "effects": [{"comp_name": "stackgres", "ecosystem": "linux", "versions": [{"affected_version": "[1.0,1.19.0)", "min_fixed_version": "1.19.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "不可信的搜索路径", "kind_en": "不受信任的搜索路径", "last_modified_time": "2026-08-23", "level": "Critical", "mps_id": "MPS-9dn6-vqy4", "poc": false, "poc_url": [], "published_time": "2026-08-23", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-9dn6-vqy4", "name": "https://www.oscs1024.com/hd/MPS-9dn6-vqy4"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-78155", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-78155"}, {"url": "https://gitlab.com/ongresinc/stackgres/-/work_items/3177", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "StackGres操作员指标导出器超级用户权限提升漏洞", "_translated": true, "_saved_at": "2026-08-23T14:16:56+00:00", "_first_saved_at": "2026-08-23T11:15:47+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-9dn6-vqy4"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-13598", "cvss": {}, "cvss_score": 9.8, "cvss_vector": "", "cwe": "CWE-269", "description": "RestrictMate is a WordPress plugin for content restriction and membership, distributed via the WordPress.org plugin directory under the slug `restrictmate`; the public source tree is mirrored at `https://plugins.svn.wordpress.org/restrictmate/`.\n受影响版本中，`RestrictMate\\Ajax::register` 通过 `wp_ajax_nopriv_restrictmate_registration` 暴露给未认证访问者，并将整个 `$_POST` 直接透传给 `restrictmate_register_user`。`restrictmate_register_user` 的 `$defaults` 中虽然将 `role` 默认设为 `subscriber`，但随后通过 `wp_parse_args( $args, $defaults )` 把调用者提供的 `$_POST['role']` 合并进来并原样写入 `$userdata['role']`，再调用 `wp_insert_user` 创建账号；同一处理流程随后调用 `restrictmate_user_logging_in`，对新创建的账号执行 `wp_signon` 并设置认证 cookie，从而实现未认证远程提权至管理员。\n修复版本中通过将 `role` 从 `$defaults` 中移除、在 `$userdata` 中硬编码 `'role' =\u003e 'subscriber'` 并对 `username`、`email`、`first_name`、`last_name` 调用 `sanitize_user` / `sanitize_email` / `sanitize_text_field` 进行规范化，断绝调用者控制注册角色以及附带字段污染的可能。", "effects": [{"comp_name": "restrictmate", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.3.0)", "min_fixed_version": "1.3.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-08-23", "level": "Critical", "mps_id": "MPS-iq7n-xs4b", "poc": false, "poc_url": [], "published_time": "2026-08-23", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-iq7n-xs4b", "name": "https://www.oscs1024.com/hd/MPS-iq7n-xs4b"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-13598", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-13598"}, {"url": "https://wpscan.com/vulnerability/05fd8e45-92fa-4ed4-ae59-9a7b7743ea34/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "RestrictMate WordPress 插件在注册过程中角色不受限制，导致未经身份验证的权限升级", "_translated": true, "_saved_at": "2026-08-23T15:15:58+00:00", "_first_saved_at": "2026-08-23T06:30:40+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-iq7n-xs4b"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-7808", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-20", "description": "justhtml 是开源 Python HTML 解析与净化库，以 SanitizationPolicy 驱动方式对外提供 JustHTML(...) 解析入口与 sanitize_dom() 编程式净化 API，配套 DEFAULT_POLICY / DEFAULT_DOCUMENT_POLICY 等导出策略，主要用于在服务端或 Web 框架中清洗不可信 HTML。\n受影响版本中，多条与净化策略与编程式 DOM 路径相关的处理逻辑存在绕过风险：DEFAULT_POLICY.url_policy.allow_rules[(\"a\",\"href\")].allowed_schemes 等已编译默认值在复用或嵌套状态被改写后，仍以陈旧编译结果生效；sanitize_dom(node, policy=...) 对 ScRiPt、StYlE 等混合大小写危险标签以及 {\"SCRIPT\"} 等大小写未归一化的 drop_content_tags 跳过子树丢弃；构造的编程式 doctype.name（如 html\u003e\u003cimg ...）在文档体前被直接序列化出可激活标签；保留 SVG/MathML 的自定义策略对 \u003cset\u003e/\u003canimate\u003e 后置属性突变、fill/clip-path/mask/marker-start/cursor 中的 url(...) 外部引用以及 namespace=\"html\" 却序列化为 \u003csvg\u003e/\u003cmath\u003e 的子树放行；混合大小写编程式 style/script 节点绕过 rawtext 硬化后保留 @import 等活动样式内容，最终使脚本或样式等活跃内容存活，触发跨站脚本。\n修复版本中通过强化 SanitizationPolicy 及其 url_policy 的状态不可变性、在属性与 URL 规则变更时强制重新编译、并对 sanitize() / sanitize_dom() / JustHTML(..., sanitize=True) 增加混合大小写标签归一化、SVG/MathML 动画与 url(...) 展示属性校验、rawtext 混合大小写节点检查以及 doctype 名称安全序列化等处理，切断策略复用、编程式 DOM、SVG/MathML 外语命名空间绕过与 rawtext 硬化绕过链路，建议升级至 1.16.0 及以上版本。", "effects": [{"comp_name": "justhtml", "ecosystem": "pip", "versions": [{"affected_version": "(-∞,1.15.0]", "min_fixed_version": "", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "输入验证不恰当", "kind_en": "输入验证不当", "last_modified_time": "2026-08-23", "level": "Critical", "mps_id": "MPS-1lr0-tfhq", "poc": false, "poc_url": [], "published_time": "2026-08-23", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-1lr0-tfhq", "name": "https://www.oscs1024.com/hd/MPS-1lr0-tfhq"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-7808", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-7808"}, {"url": "https://github.com/EmilStenstrom/justhtml/security/advisories/GHSA-4p64-v8f5-r2gx", "name": ""}, {"url": "https://www.vulncheck.com/advisories/justhtml-before-multiple-security-issues-via-sanitization", "name": ""}], "scope_influence": "", "tags": ["python", "开源"], "title": "justhtml HTML 净化绕过漏洞", "_translated": true, "_saved_at": "2026-08-23T15:15:55+00:00", "_first_saved_at": "2026-08-23T15:15:55+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-1lr0-tfhq"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-8445", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-79", "description": "justhtml 是一款用纯 Python 编写的 HTML 解析与序列化库，主页托管在 GitHub（EmilStenstrom/justhtml），通过 PyPI 以同名包分发，提供 DOM 解析、to_html / to_text / to_markdown 等序列化接口以及可定制的 SanitizationPolicy，常被用于把不可信 HTML 安全地转换为其他格式。\n受影响版本中，JustHTML.to_markdown() 在序列化文本节点时仅对少量 Markdown 元字符（如 \\、*、_、[、]）插入反斜杠，未对 \u0026 与 \u003c 等 HTML 关键字符进行转义；解析阶段已经实体解码或来自 \u003ctitle\u003e、\u003ctextarea\u003e、\u003cnoscript\u003e、\u003cplaintext\u003e 等原始文本元素的字符串，在序列化阶段会被原样写回 Markdown 输出，从而绕过 to_html() 同样输入下原本依赖的清理路径。当下游系统把这段 Markdown 渲染为 HTML 时，攻击者控制的 \u003cimg onerror=...\u003e 等载荷会作为真实 HTML 执行，构成跨站脚本漏洞。\n修复版本中通过扩展 _markdown_escape_text（位于 src/justhtml/serializer/markdown.py，旧布局下为 src/justhtml/node.py）的转义表，在循环里追加对 \u0026 写 \u0026amp;、对 \u003c 写 \u0026lt; 的分支，使任何来自文本节点的字符都先被实体化再进入 Markdown 渲染，从而切断“解析产物 → Markdown 输出 → HTML 渲染”这一绕过链路。", "effects": [{"comp_name": "justhtml", " 是由 EmilStenstrom 维护的开源纯 Python HTML5 解析库，提供 HTML 解析、清理、序列化、Markdown 输出（to_markdown）与程序化 DOM 构建等能力，常被作为通用 HTML 清洗与净化栈集成进 web 服务。\n受影响版本中，justhtml \u003c 1.15.0 在 URL 净化、HTML 序列化、Markdown 输出与自定义清理链路上存在多处绕过点：JustHTML.clean_url_value 与 JustHTML.clean_url_in_js_string 在进入 _sanitize_url_value_with_rule 前未先做 HTML 字符引用解码，javascript\u0026#58; 等带实体编码的前缀会被浏览器还原为 javascript: 协议并执行；同一路径未拒绝以反斜杠开头的相对 URL（\\evil.example/x、/\\evil.example/x），浏览器会将其解析为远程主机并发起请求；畸形中括号主机（如 https://[evil.example]/x）还会令 host 白名单抛出异常并中止整次清理。在 Markdown 输出 to_markdown(html_passthrough=True) 路径上，\u003ctextarea\u003e 残留内容可被再次暴露为活动 HTML；序列化端的程序化 element/attribute 名与 HTML 注释 -- \u003e 突破、同名 URL 列表（a[ping]）、此前未被识别为 URL 的 attributionsrc 与 link[imagesrcset]、被保留的 \u003cstyle\u003e / \u003cmeta http-equiv=refresh\u003e / \u003cbase href\u003e 以及大小写混合的属性名绕过（DropAttrs、DropUrlAttrs、AllowStyleAttrs、MergeAttrs 等变换）也会绕过默认或自定义策略。\n修复版本中通过收紧 _sanitize_url_value_with_rule 的输入预处理解决了该问题：对候选 URL 先做 HTML 字符引用解码再进入 scheme/host 校验，明确拒绝反斜杠前缀的相对 URL，对畸形主机解析失败按不安全 URL 处置；同步补全 clean_url_in_js_string、a[ping]、attributionsrc、imagesrcset、\u003cstyle\u003e、\u003cmeta http-equiv=refresh\u003e、\u003cbase href\u003e、序列化器、注释、构建器入口以及大小写属性变换等旁路点，建议升级至 1.15.0 及以上版本。", "effects": [{"comp_name": "justhtml", "ecosystem": "pip", "versions": [{"affected_version": "[0,1.15.0)", "min_fixed_version": "1.15.0", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "输入验证不恰当", "kind_en": "输入验证不当", "last_modified_time": "2026-08-23", "level": "Critical", "mps_id": "MPS-agwt-9buf", "poc": false, "poc_url": [], "published_time": "2026-08-23", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-agwt-9buf", "name": "https://www.oscs1024.com/hd/MPS-agwt-9buf"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-5388", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-5388"}, {"url": "https://github.com/EmilStenstrom/justhtml/security/advisories/GHSA-c9vm-hv86-f23r", "name": ""}, {"url": "https://www.vulncheck.com/advisories/justhtml-before-multiple-security-issues", "name": ""}], "scope_influence": "", "tags": ["python", "开源"], "title": "justhtml 多处 URL 净化与序列化绕过漏洞", "_translated": true, "_saved_at": "2026-08-23T15:15:57+00:00", "_first_saved_at": "2026-08-23T15:15:57+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-agwt-9buf"}, {"analysis_status": 0, "articles": [{"content": "- 条件竞争漏洞是由于程序中存在多个代码块同时访问同一个条件判断语句而导致的错误。在程序中，条件判断语句通常用于决定是否执行某些代码块。当一个程序有多个代码块同时访问同一个条件判断语句时，这些代码块可能会同时执行，从而导致程序执行结果出现不可预测的错误。", "title": "什么是竞争条件"}, {"content": "- 线程切换攻击：线程切换攻击是指攻击者通过利用竞争条件漏洞，使程序在执行时频繁切换线程，从而导致系统资源耗尽，最终实现拒绝服务攻击。\n- 内存泄漏攻击：内存泄漏攻击是指攻击者通过利用竞争条件漏洞，使得程序不断申请内存，但最终无法释放内存，从而导致内存泄漏，最终程序崩溃。\n- 缓存穿透攻击：缓存穿透攻击是指攻击者通过利用竞争条件漏洞，使得程序在访问缓存时，被缓存的数据并非当前最新的数据，从而攻击者可以获取到未更新的数据。\n- 指令重放攻击：指令重放攻击是指攻击者通过利用竞争条件漏洞，在程序执行时，将先前保存的指令序列重新执行，从而实现绕过某些验证，获取系统权限等攻击目的。\n", "title": "竞争条件常见的攻击方式"}, {"content": "- 使用互斥锁：在条件判断语句中，使用互斥锁来确保只有一个代码块能够访问变量。使用互斥锁可以提高程序的安全性和可靠性。\n- 使用条件封印：在条件判断语句中，将可能会修改变量的代码块封印起来，以确保这些代码块无法被其他代码块访问。\n- 使用条件过滤：在条件判断语句中，使用条件过滤来过滤掉那些不可能发生的条件判断语句。例如，对于一个包含多个条件判断语句的循环，可以只保留其中一个条件的判断，而将其他条件的判断语句过滤掉。\n- 使用性能优化：对于一些条件判断语句，可以使用性能优化来避免条件竞争的情况。例如，可以使用数组或链表等数据结构来存储条件判断语句中的变量，从而避免条件竞争的情况。", "title": "如何预防竞争条件"}], "cnvd_id": "", "cve_id": "CVE-2026-77638", "cvss": {"cvssv31": [{"source": "cve@mitre.org", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:C/C:H/I:H/A:L", "severity": "high", "base_score": 8.9}]}, "cvss_score": 8.9, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:C/C:H/I:H/A:L", "cwe": "CWE-362", "description": "0.4.9.11 之前的 Tor 很容易出现竞争状况，在适当的情况下，交汇点可能会成为中间人（冒充）客户端试图访问的洋葱服务。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "竞争条件", "kind_en": "使用共享资源并发执行且同步不正确（“竞争条件”）", "last_modified_time": "2026-08-21", "level": "High", "mps_id": "MPS-neih-lu31", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-neih-lu31", "name": "https://www.oscs1024.com/hd/MPS-neih-lu31"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-77638", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-77638"}, {"url": "https://gitlab.torproject.org/tpo/core/tor/-/raw/tor-0.4.9.11/ChangeLog", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-77638漏洞", "_translated": true, "_saved_at": "2026-08-20T22:20:08+00:00", "_first_saved_at": "2026-08-20T22:20:08+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-neih-lu31"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-77751", "cvss": {"cvssv4": [{"source": "5a6e4751-2f3f-4070-9419-94fb35b644e8", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:L/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:L/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-22", "description": "misp-stix 是开源 Python 库，提供 MISP 与 STIX 1/2 之间的双向转换能力，常被安全运营、威胁情报平台或分析工具嵌入以导入导出 MISP 事件。\n受影响版本中，STIX 2 导入与 MISP→STIX 2 导出两条路径都把外部 MISP object 名称直接传给 PyMISP 的对象模板解析机制；PyMISP 按 misp_objects_path/\u003cname\u003e/definition.json 拼接文件系统路径，而来自 STIX 2 自定义对象的 x_misp_name 与持久化在 MISP 事件中的 object.name 在进入该路径前没有任何分隔符或穿越校验。攻击者只需控制一份 STIX 2 bundle 或 MISP 事件，使其中 Custom Object 的 x_misp_name / Object.name 携带 ../ 等路径片段，模板解析就会逃出 MISP 模板目录，去读取进程可访问的任意 definition.json 并把其中的字段复制进转换后的对象，造成本地可访问文件内容的非预期泄露以及对象元数据/语义的篡改；导出侧还存在跨上下文放大风险，恶意名称会先随事件被持久化，再在更高权限进程导出时再次触发路径穿越。\n修复版本中通过新增 misp_stix_converter/tools/misp_object_templates.py 模块，引入 _TEMPLATE_NAME_REGEX（[A-Za-z0-9][A-Za-z0-9_-]*）对名称做严格白名单校验，任何不匹配的名称在到达 PyMISP 模板解析之前都被替换为通用的 unknown-template，原名称作为数据写入对象的 comment 并发出警告，从而切断了将不可信名称拼入模板路径的链路。", "effects": [{"comp_name": "misp-stix", "ecosystem": "pip", "versions": [{"affected_version": "(-∞,2026.7.8]", "min_fixed_version": "", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-08-21", "level": "High", "mps_id": "MPS-6kta-x2m7", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-6kta-x2m7", "name": "https://www.oscs1024.com/hd/MPS-6kta-x2m7"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-77751", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-77751"}, {"url": "https://github.com/MISP/misp-stix/commit/a0f54070", "name": ""}, {"url": "https://github.com/MISP/misp-stix/commit/a8b6808d", "name": ""}], "scope_influence": "", "tags": ["python", "开源"], "title": "misp-stix对象模板名称路径穿越漏洞", "_translated": true, "_saved_at": "2026-08-21T11:19:52+00:00", "_first_saved_at": "2026-08-21T11:19:52+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-6kta-x2m7"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-63038", "cvss": {}, "cvss_score": 8.8, "cvss_vector": "", "cwe": "CWE-89", "description": "Apache InLong 是开源的一站式海量数据集成框架，提供数据采集、汇聚与传输能力，其中 Manager 负责 Sink 配置并按需自动创建下游库表资源。\n受影响版本中，Manager 为 PostgreSQL、Greenplum 和 SQL Server Sink 构造 SQL 时，把攻击者可控的 dbName、tableName、schemaName 和 username 以字符串拼接写入语句。PostgreSQLSqlBuilder.buildCreateSchema 将 schemaName 与 user 直接拼进 CREATE SCHEMA ... AUTHORIZATION 语句且未做标识符校验，已登录用户通过 StreamSinkController.save 提交 Sink 请求后，恶意内容会随自动创建资源流程在下游数据库执行，造成 SQL 注入。\n修复版本中通过在 PostgreSQLSqlBuilder.buildCreateSchema、GreenplumSqlBuilder.buildCreateSchema 和 SQLServerSqlBuilder.buildCreateSchemaSql 拼接前，使用正则 ^[a-zA-Z0-9._]+$ 校验 schemaName 与 user，非法输入抛出 IllegalArgumentException，从而阻断恶意标识符进入 CREATE SCHEMA 语句。", "effects": [{"comp_name": "inlong", "ecosystem": "linux", "versions": [{"affected_version": "[2.0.0,2.4.0)", "min_fixed_version": "2.4.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "org.apache.inlong:manager-service", "ecosystem": "maven", "versions": [{"affected_version": "[2.0.0,2.4.0)", "min_fixed_version": "2.4.0", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": 00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ey35-0smt"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-77767", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "high", "base_score": 7.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-862", "description": "Reconmap 是一款开源渗透测试任务与报告管理平台，GitHub 仓库位于 reconmap/reconmap，由 C#/.NET 编写的 API (apps/api) 与前端组成，用于集中保存渗透测试项目、客户组织及最终报告内容。\n受影响版本中，apps/api/app/Program.cs 为所有 Controller 注册了回退授权策略，仅允许持有 administrator 角色的已认证用户访问，而 apps/api/app/Controllers/ReportsController.cs 中的 PreviewReport action 显式标注了 [AllowAnonymous] 注解，使该 action 完全绕过回退授权策略。PreviewReport 通过 URL 路径段中的 id 加载对应 Project 记录，再通过 Project.ClientId 关联加载 Organisation 记录，并将二者渲染进 default-report-template.html，输出项目名、项目描述以及客户组织的名称、地址和 URL，整个流程没有任何认证、项目成员或角色校验。由于 id 是 projects 表的自增主键，未经认证的远程攻击者只需遍历顺序 id 即可获取实例上每一个项目的渗透测试任务详情及对应客户组织信息，针对不存在 id 返回 404 还泄露了有效项目 id 的存在性。Reconmap 用于存储渗透测试任务，任务描述与客户组织资料天然敏感。\n修复版本中通过移除 ReportsController.PreviewReport 上的 [AllowAnonymous] 注解，使其恢复继承回退授权策略，仅持有 administrator 角色的已认证用户才能访问该 endpoint，切断了对项目与客户组织信息的未授权读取链路，配套修复 commit 为 2b2eb0cf0aa95726b4edd0045f86d2dcdb8de34d。", "effects": [{"comp_name": "reconmap", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,3.2.2]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-08-21", "level": "High", "mps_id": "MPS-ksba-hvz5", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ksba-hvz5", "name": "https://www.oscs1024.com/hd/MPS-ksba-hvz5"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-77767", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-77767"}, {"url": "https://github.com/reconmap/reconmap", "name": ""}, {"url": "https://github.com/reconmap/reconmap/blob/56ca3748343a50c98185d53827172d8f13a6ad0f/apps/api/app/Controllers/ReportsController.cs", "name": ""}, {"url": "https://github.com/reconmap/reconmap/blob/56ca3748343a50c98185d53827172d8f13a6ad0f/apps/api/app/Program.cs", "name": ""}, {"url": "https://github.com/reconmap/reconmap/commit/2b2eb0cf0aa95726b4edd0045f86d2dcdb8de34d", "name": ""}, {"url": "https://github.com/reconmap/reconmap/security/advisories/GHSA-mhrh-jfmr-8mmw", "name": ""}, {"url": "https://www.vulncheck.com/advisories/reconmap-report-preview-endpoint-is-marked-allowanonymous-exposing-every-project-and-cl ，如密码、加密密钥、会话令牌等。常见的原因是由于缓冲区溢出、格式化字符串漏洞或其他内存错误导致的。", "title": "什么是越界读取"}, {"content": "攻击者可以通过不当构造的输入来触发跨界内存读漏洞。攻击者可能会通过向应用程序发送特定的输入，使其读取超过预期的内存区域。攻击者可以利用这个漏洞来获取敏感信息，如其他用户的数据、操作系统的敏感数据或应用程序的内部状态。", "title": "越界读取常见的攻击方式"}, {"content": "- 输入验证和限制：应用程序应对所有输入数据进行严格的验证和限制。确保输入数据的长度、格式和内容符合预期，避免超出缓冲区或访问非预期的内存区域。\n- 内存安全编程实践：开发人员应使用安全的编程实践，如避免使用不安全的函数、正确处理内存分配和释放操作，以及遵循最小特权原则。\n- 使用安全的编程语言和库：选择使用安全性较高的编程语言和库，这些语言和库在内存管理和安全性方面提供了更多的保护机制。\n- 定期进行代码审查和安全测试：定期审查应用程序的代码，并进行安全测试，以发现潜在的跨界内存读漏洞。使用静态代码分析工具和漏洞扫描工具来辅助检测和修复问题。\n- 实施防御性编程技术：应用程序应采用防御性编程技术，如使用随机化地址空间布局（ASLR）、堆栈保护机制（如堆栈溢出保护）和数据执行预防（DEP）等。\n- 及时更新和修补：及时应用程序和操作系统的安全更新和补丁，以确保已知的跨界内存读漏洞得到修复。及时更新相关软件和库，以避免使用已知存在漏洞的版本。", "title": "如何预防越界读取"}], "cnvd_id": "", "cve_id": "CVE-2026-76641", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-125", "description": "Expat 到 2.8.3 包含一个越界读取漏洞，允许攻击者通过使用通过 XML_ExternalEntityParserCreate 创建的外部实体解析器处理 XML 来触发内存损坏。 ELEMENT_TYPE 成员之间的结构大小不匹配会导致 storeAtts 读取超过分配的内存边界的 attIndex 成员，从而导致无法规范化非 CDATA 属性中的空白或导致段错误的野指针取消引用。此漏洞是由 CVE-2026-66046 的修复程序引入的。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界读取", "kind_en": "越界读取", "last_modified_time": "2026-08-21", "level": "High", "mps_id": "MPS-n8uq-a7zh", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{" B_ACCESS_CONTROL=enable 时启用，=disable 时禁用，否则在宿主 Stable Diffusion WebUI 使用 share、ngrok、listen 或 server_name 启动时启用，其余情况回退为禁用。\n修复版本中通过将 to_abs_path 改为使用 os.path.realpath 解析符号链接，并在 is_path_trusted 中同样对 parent_path 调用 realpath，同时在 startswith(parent_path + os.sep) 上添加尾部分隔符以避免前缀匹配绕过，阻断符号链接逃逸路径。", "effects": [{"comp_name": "infinite-image-browsing", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.8.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "在文件访问前对链接解析不恰当（链接跟随）", "kind_en": "文件访问前的链接解析不正确（“链接跟踪”）", "last_modified_time": "2026-08-21", "level": "High", "mps_id": "MPS-pa25-97fq", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-pa25-97fq", "name": "https://www.oscs1024.com/hd/MPS-pa25-97fq"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-77815", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-77815"}, {"url": "https://github.com/zanllp/infinite-image-browsing", "name": ""}, {"url": "https://github.com/zanllp/infinite-image-browsing/blob/v1.8.0/scripts/iib/api.py#L329-L344", "name": ""}, {"url": "https://github.com/zanllp/infinite-image-browsing/blob/v1.8.0/scripts/iib/tool.py#L172-L175", "name": ""}, {"url": "https://github.com/zanllp/infinite-image-browsing/commit/4057a624c7a23a36f0b4dc6a545b40767d602450", "name": ""}, {"url": "https://github.com/zanllp/infinite-image-browsing/issues/968", "name": ""}, {"url": "https://github.com/zanllp/infinite-image-browsing/pull/969", "name": ""}, {"url": "https://www.vulncheck.com/advisories/infinite-image-browsing-resolves-paths-with-normpath-allowing-symlink-escape-from-scanned-directories", "name": ""}], "scope_influence": "", "tags": ["AI", "应用软件"], "title": "Infinite Image Browsing 路径校验符号链接逃逸导致任意文件读取漏洞", "_translated": true, "_saved_at": "2026 [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "通过用户控制密钥绕过授权机制", "kind_en": "通过用户控制的密钥绕过授权", "last_modified_time": "2026-08-21", "level": "High", "mps_id": "MPS-scj9-4gun", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-scj9-4gun", "name": "https://www.oscs1024.com/hd/MPS-scj9-4gun"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-77759", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-77759"}, {"url": "https://github.com/Roskus/prospero-flow-crm/commit/980c35ac00e419591a8adc2d1dbcc120ea62e273", "name": ""}, {"url": "https://github.com/Roskus/prospero-flow-crm/releases/tag/v5.5.3", "name": ""}, {"url": "https://secur0.com/en/cna/cve-list/cve-2026-77759-idor-missing-authz-prospero-transaction-api", "name": ""}], "scope_influence": "", "tags": ["php", "开源"], "title": "Prospero Flow CRM 交易API 越权读取漏洞", "_translated": true, "_saved_at": "2026-08-21T14:28:17+00:00", "_first_saved_at": "2026-08-21T13:40:31+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-scj9-4gun"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-77814", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "high", "base_score": 7.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-22", "description": "Infinite Image Browsing 是开源 Python 扩展，作为 Stable Diffusion WebUI 的脚本插件运行，用于浏览和管理生成的图像文件，并通过 FastAPI 暴露受访问控制保护的 HTTP 接口。\n受影响版本中，scripts/iib/api.py 中闭包函数 is_path_trusted 在遍历 mem[\"all_scanned_paths\"] 中的允许父目录时，对每个允许路径使用 path.startswith(parent_path) 判断请求路径是否被允许，但未在 parent_path 后追加路径分隔符。当配置的允许目录是 /data/images 时，请求 /data/images_private/secret.txt 会因前缀字符串匹配而通过校验，绕过既有的路径隔离并由同文件中的 get_file 路由通过 FileResponse 返回任意可读文件。是否真正进入这一危险分支由 scripts/iib/tool.py 的 get_enable_access_control 决定：环境变量 IIB_ACCESS_CONTROL 等于 enable 时强制启用、等于 disable 时强制关闭，否则只有宿主 Stable Diffusion WebUI 以 --share、--ngrok、--listen 或 --server_name 启动时才启用，因此影响集中在网络暴露的 WebUI 部署。\n修复版本中通过将判定改为 path.startswith(parent_path + os.sep) 并在循环内先用 os.path.realpath 解析父目录符号链接/真实路径，从而只把真正位于允许父目录之下的路径视为可信；同时将 scripts/iib/tool.py 中 to_abs_path 由 os.path.normpath 切换为 os.path.realpath，确保请求路径在比较前同样完成符号链接解析，彻底切断前缀字符串碰撞的越权读取链路。", "effects": [{"comp_name": "infinite-image-browsing", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.8.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-08-22", "level": "High", "mps_id": "MPS-u4wl-szky", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-u4wl-szky", "name": "https://www.oscs1024.com/hd/MPS-u4wl-szky"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-77814", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-77814"}, {"url": "https://github.com/zanllp/infinite-image-browsing", "name": ""}, {"url": "https://github.com/zanllp/infinite-image-browsing/blob/v1.8.0/scripts/iib/api.py#L329-L344", "name": ""}, {"url": "https://github.com/zanllp/infinite-image-browsing/commit/4057a624c7a23a36f0b4dc6a545b40767d602450", "name": ""}, {"url": "https://github.com/zanllp/infinite-image-browsing/issues/968", "name": ""}, {"url": "https://github.com/zanllp/infinite-image-browsing/pull/969", "name": ""}, {"url": "https://www.vulncheck.com/advisories/infinite-image-browsing-is-path-trusted-prefix-comparison-omits-the-trailing-path-separator", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Infinite Image Browsing 路径穿越漏洞", "_translated": true, "_saved_at": "2026-08-21T17:22:42+00:00", "_first_saved_at": "2026-08-21T16:25:14+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-u4wl-szky"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-76612", "cvss": {"cvssv4": [{"source": "security@joomla.org", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:A/VC:H/VI:H/VA:L/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:A/VC:H/VI:H/VA:L/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-79", "description": "YOOtheme Zoo 是面向 Joomla CMS 的商业 CCK（内容构建工具）扩展，提供自定义字段、评论与多种应用来构建和管理站点内容。\n受影响版本中，用户在评论与用户可控的自定义字段元素中提交的输入在渲染输出前未进行充分的 HTML 转义，未授权攻击者可向这些位置注入恶意脚本内容并被持久化保存，随后任何访问受影响页面的用户浏览器都会自动执行该脚本，构成存储型跨站脚本攻击（CWE-79）。\n修复版本中通过在 Zoo 4.1.66 对评论文本与用户自定义字段元素输出添加转义处理，切断了从用户输入到页面 HTML 之间的未转义路径，使攻击者注入的脚本无法再被渲染给后续访问者。", "effects": [{"comp_name": "zoo", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,4.1.66)", "min_fixed_version": "4.1.66", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "ex ", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "授权机制不恰当", "kind_en": "不当授权", "last_modified_time": "2026-08-21", "level": "High", "mps_id": "MPS-12u7-awhk", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-12u7-awhk", "name": "https://www.oscs1024.com/hd/MPS-12u7-awhk"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-66722", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-66722"}, {"url": "https://lists.apache.org/thread/g6cwddtjrwbh1d56wjz4cfp3fzfm4kbc", "name": ""}], "scope_influence": "", "tags": [], "title": "Apache CloudStack域管理员项目角色越权漏洞", "_translated": true, "_saved_at": "2026-08-21T10:23:02+00:00", "_first_saved_at": "2026-08-21T10:23:02+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-12u7-awhk"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-72852", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.5}]}, "cvss_score": 8.5, "cvss_vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-787", "description": "hank-ai/darknet 通过以未经检查的 32 位 int 算术乘以从 .cfg 文件中获取的配置字段来调整卷积层的权重和输出堆缓冲区的大小。在 src-lib/convolutional_layer.cpp 中，l.nweights 计算为 (c / groups) * n * size * size，l.outputs 计算为 l.out_h * l.out_w * l.out_c，并且两者都直接输入 xcalloc。真实维度积超过 INT_MAX 的 .cfg 会回绕到较小值或零值，因此分配大小不足；例如，宽度和高度为 256，过滤器为 65536 的结果为 2^32，它会换算为 0。forward_convolutional_layer 然后使用不同的操作数顺序重新导出 GEMM 维度，将 k 计算为 l.size*l.size*l.c / l.groups，其中分配在乘法之前进行划分，并通过尺寸不足的缓冲区进行读取和写入。加载精心设计的 .cfg 进行推理或训练就足够了，不需要有效的 .weights 文件。所报告的概念证明观察到在相同输入的发布版本中，AddressSanitizer 下的 gemm_nn_fast 中的堆缓冲区溢出读取和 glibc 分配器元数据损坏，表明存在越界写入。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-08-21", "level": "High", "mps_id": "MPS-lf32-dknx", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-lf32-dknx", "name": "https://www.oscs1024.com/hd/MPS-lf32-dknx"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-72852", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-72852"}, {"url": "https://github.com/hank-ai/darknet", "name": ""}, {"url": "https://github.com/hank-ai/darknet/blob/v6.0/src-lib/convolutional_layer.cpp#L1457", "name": ""}, {"url": "https://github.com/hank-ai/darknet/blob/v6.0/src-lib/convolutional_layer.cpp#L764", "name": ""}, {"url": "https://github.com/hank-ai/darknet/blob/v6.0/src-lib/convolutional_layer.cpp#L811", "name": ""}, {"url": "https://github.com/hank-ai/darknet/issues/148", "name": ""}, {"url": "https://www.vulncheck.com/advisories/darknet-integer-overflow-in-convolutional-layer-buffer-sizing-leads-to-heap-buffer-overflow", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-72852漏洞", "_translated": true, "_saved_at": "2026-08-20T21:22:00+00:00", "_first_saved_at": "2026-08-20T20:21:30+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-lf32-dknx"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-75946", "cvss": {"cvssv4": [{"source": "hp-security-alert@hp.com", "vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:H/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.2}]}, "cvss_score": 8.2, "cvss_vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:H/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-347", "description": "HP OMEN Gaming Hub 是惠普为 OMEN 系列游戏 PC 预装的闭源 Windows 客户端软件，用于控制设备灯光、性能模式、风扇曲线与温度监控等硬件功能。\n受影响版本中，OMEN Gaming Hub 对部分组件的访问控制与加密签名校验不充分（CWE-347：对加密签名的验证不当），具备本地账户的低权限攻击者可绕过预期安全检查，在目标机器上提升权限并以更高权限上下文执行任意代码。\n修复版本中通过 HP 安全公告 HPSBGN04144 加固了受影响组件的访问控制与签名验证逻辑，切断了本地权限提升路径；建议升级至 1101.2608.0.0 及以上版本。", "effects": [{"comp_name": "OMEN Gaming Hub", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1101.2608.0.0)", "min_fixed_version": "1101.2608.0.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "密码学签名的验证不恰当", "kind_en": "密码签名验证不当", "last_modified_time": "2026-08-21", "level": "High", "mps_id": "MPS-up8l-fo7q", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-up8l-fo7q", "name": "https://www.oscs1024.com/hd/MPS-up8l-fo7q"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-75946", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-75946"}, {"url": "https://support.hp.com/us-en/document/ish_15491615-15491654-16/hpsbgn04144", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "HP OMEN Gaming Hub本地权限提升漏洞", "_translated": true, "_saved_at": "2026-08-21T15:26:38+00:00", "_first_saved_at": "2026-08-21T15:26:38+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-up8l-fo7q"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-47884", "cvss": {}, "cvss_score": 8.1, "cvss_vector": "", "cwe": "CWE-22", "description": "Spring Framework 是开源 Java 应用开发框架，spring-webmvc 模块提供 XsltView，用于将模型数据经 XSLT 样式表转换为响应内容。\n受影响版本中，XsltView.getStylesheetSource() 将视图 URL 直接交给 ApplicationContext.getResource() 加载样式表，未限制路径穿越、URL 协议或 url: 前缀。当应用配置了会导致视图渲染且未显式指定视图名的 \"/**\" 映射时，请求路径可成为样式表位置，从而发起 SSRF，并在加载恶意 XSLT 后执行远程代码。\n修复版本中通过在 getStylesheetSource() 中调用 ResourceHandlerUtils.normalizeInputPath() 与 shouldIgnoreInputPath() 拒绝非法样式表位置，阻断不可信路径进入资源加载与 XSLT 变换流程。", "effects": [{"comp_name": "org.springframework:spring-webmvc", "ecosystem": "maven", "versions": [{"affected_version": "[6.2.0,6.2.20)", "min_fixed_version": "6.2.20", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[7.0.0,7.0.9)", "min_fixed_version": "7.0.9", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[6.0.0,6.0.31)", "min_fixed_version": "6.0.31", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "(-∞,5.2.26)", "min_fixed_version": "5.2.26", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[6.1.0,6.1.29)", "min_fixed_version": "6.1.29", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[5.3.0,5.3.50)", "min_fixed_version": "5.3.50", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-08-21", "level": "High", "mps_id": "MPS-93b3-a54b", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://spring.io/security/cve-2026-47884", "name": ""}, {"url": "https://spring.io/security/cve-2026-47884/", "name": ""}, {"url": "https://github.com/spring-projects/spring-framework/commit/692dbc9160de3b5de50ccedeee014716d0cedb7b", "name": ""}, {"url": "https://github.com/spring-projects/spring-framework/issues/37029", "name": ""}, {"url": "https://github.com/spring-projects/spring-framework/releases/tag/v7.0.9", "name": ""}, {"url": "https://cwe.mitre.org/data/definitions/22.html", "name": ""}, {"url": "https://cwe.mitre.org/data/definitions/918.html", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "Spring XsltView路径限制不当", "_translated": true, "_saved_at": "2026-08-20T18:29:33+00:00", "_first_saved_at": "2026-08-20T18:29:33+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-93b3-a54b"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-65644", "cvss": {}, "cvss_score": 8, "cvss_vector": "", "cwe": "CWE-79", "description": "Rocket.Chat 是开源团队聊天与客服平台，使用 TypeScript/React 与 Node.js 构建，提供 Livechat 实时客服等 Omnichannel 能力。\n受影响版本中，公开 REST 端点 POST /api/v1/livechat/visitor（即 apps/meteor/server/api/v1/omnichannel/visitor.ts 中 livechat/visitor 路由的 post 方法）以 Match.Maybe(String) 接收未经身份校验的 visitor.name 字段，并通过 saveRoomInfo 写入访客名称。随后前端 InquireSidePanelItem.tsx 在渲染 Omnichannel 侧栏消息预览时，将该名称以模板字符串 `${room.lastMessage.u.name || room.lastMessage.u.username}` 直接拼接到 message，并整体赋给 \u003cspan dangerouslySetInnerHTML={{ __html: message }}\u003e，导致客服在查看队列时被注入指向任意域名的可点击链接或社工文本。\n修复版本中通过在 InquireSidePanelItem.tsx 引入 escapeHTML 包住访客名称输出，确保写入的原始字符串在进入 dangerouslySetInnerHTML 之前被转义，切断存储型 XSS 的渲染路径。", "effects": [{"comp_name": "rocket.chat", "ecosystem": "npm", "versions": [{"affected_version": "(-∞,7.10.15)", "min_fixed_version": "7.10.15", "repository": "npm", "solutions": [], "upstream": true}, {"affected_version": "[8.1.0,8.1.8)", "min_fixed_version": "8.1.8", "repository": "npm", "solutions": [], "upstream": true}, {"affected_version": "[8.5.0,8.5.3)", "min_fixed_version": "8.5.3", "repository": "npm", "solutions": [], "upstream": true}, {"affected_version": "[8.7.0,8.7.1)", "min_fixed_version": "8.7.1", "repository": "npm", "solutions": [], "upstream": true}, {"affected_version": "[8.4.0,8.4.6)", "min_fixed_version": "8.4.6", "repository": "npm", "solutions": [], "upstream": true}, {"affected_version": "(-∞,8.8.0)", "min_fixed_version": "8.8.0", "repository": "npm", "solutions": [], "upstream": true}, {"affected_version": "[8.2.0,8.2.8)", "min_fixed_version": "8.2.8", "repository": "npm", "solutions": [], "upstream": true}, {"affected_version": "[8.6.0,8.6.2)", "min_fixed_version": "8.6.2", "repository": "npm", "solutions": [], "upstream": true}, {"affected_version": "[8.3.0,8.3.8)", "min_fixed_version": "8.3.8", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-08-21", "level": "High", "mps_id": "MPS-t4iv-hsmo", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-t4iv-hsmo", "name": "https://www.oscs1024.com/hd/MPS-t4iv-hsmo"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-65644", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-65644"}, {"url": "https://github.com/RocketChat/Rocket.Chat/pull/41595", "name": ""}, {"url": "https://hackerone.com/reports/3872858", "name": ""}], "scope_influence": "", "tags": [], "title": "Rocket.Chat Omnichannel 访客名存储型 XSS", "_translated": true, "_saved_at": "2026-08-21T05:26:54+00:00", "_first_saved_at": "2026-08-21T05:26:54+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-t4iv-hsmo"}, {"analysis_status": 0, "articles": [], "attack_vector_type": "Local", "cnvd_id": "", "cve_id": "CVE-2026-45202", "cvss": {}, "cvss_score": 7.8, "cvss_vector": "", "cwe": "CWE-415", "description": "Imagination Technologies Graphics DDK 是 Imagination Technologies 发布的闭源 GPU 驱动开发套件，作为 IP 内核交付给 SoC 与设备厂商，被广泛集成在移动、汽车、消费电子和桌面平台的 GPU 内核模块中。\n受影响版本中，DDK 内核模块在由 GPU 系统调用触发的释放路径上未维持由较低阶分配升级到较高阶分配所产生的状态数据，导致同一块 GPU 内核内存可能进入不一致状态，本地非特权用户通过构造的 GPU 系统调用触发后既会发生 GPU 内核内存泄漏，也会再次进入释放路径造成双重释放，从而破坏内核堆并可能被用于权限提升。\n修复版本中通过厂商安全更新在受影响的释放路径上正确维护与高阶分配状态相关的元数据，保证内存分配升级后释放路径仍然准确指向唯一一块内存，避免再次进入双重释放条件。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "双重释放", "kind_en": "双重免费", "last_modified_time": "2026-08-21", "level": "High", "mps_id": "MPS-8esp-oagh", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-8esp-oagh", "name": "https://www.oscs1024.com/hd/MPS-8esp-oagh"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-45202", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-45202"}, {"url": "https://www.imaginationtech.com/gpu-driver-vulnerabilities/", "name": ""}], "scope_influence": "", "tags": [], "title": "Imagination GPU DDK双重释放漏洞", "_translated": true, "_saved_at": "2026-08-21T05:26:57+00:00", "_first_saved_at": "2026-08-21T05:26:57+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-8esp-oagh"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-47852", "cvss": {}, "cvss_score": 7.8, "cvss_vector": "", "cwe": "CWE-377", "description": "Spring AI 是开源 Java AI 应用框架，其中的 spring-ai-transformers 模块基于 ONNX Runtime 提供 TransformersEmbeddingModel 等本地嵌入推理能力，会把 tokenizer、模型权重等远程资源下载到本地缓存目录后加载执行。\n受影响版本中，org.springframework.ai.transformers.ResourceCacheService 的无参构造函数将缓存根目录固定为 System.getProperty(\"java.io.tmpdir\") 与字面量子目录 spring-ai-onnx-generative 拼接后的可预测路径。在多用户主机上，任意本地账户都可以预先创建该目录并植入经过构造的恶意 ONNX 模型文件，当受害 Spring AI 应用随后加载嵌入模型时，TransformersEmbeddingModel 会从该缓存目录读取 attacker-controlled 的 ONNX 文件并交给 ONNX Runtime 解析执行，触发模型替换及通过构造模型实现的进一步危害。\n修复版本中通过将 ResourceCacheService 默认缓存目录改为 Files.createTempDirectory(\"spring-ai-model-cache\") 生成的、由系统保证唯一的临时目录，使不同用户、不同进程无法事先抢占该路径，切断本地 ONNX 模型替换链路。", "effects": [{"comp_name": "org.springframework.ai:spring-ai-transformers", "ecosystem": "maven", "versions": [{"affected_version": "[2.0.0,2.0.0.1)", "min_fixed_version": "2.0.0.1", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[1.1.0,1.1.9)", "min_fixed_version": "1.1.9", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[1.0.0,1.0.10)", "min_fixed_version": "1.0.10", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "不安全的临时文件", "kind_en": "不安全的临时文件", "last_modified_time": "2026-08-21", "level": "High", "mps_id": "MPS-d08b-8c33", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://spring.io/security/cve-2026-47852", "name": ""}, {"url": "https://spring.io/security/cve-2026-47852/", "name": ""}, {"url": "https://github.com/spring-projects/spring-ai/commit/369a92670e7de1074a6f35b7a68071a789697932", "name": ""}, {"url": "https://github.com/spring-projects/spring-ai/issues/6754", "name": ""}, {"url": "https://github.com/spring-projects/spring-ai/releases/tag/v2.0.1", "name": ""}, {"url": "https://github.com/spring-projects/spring-ai/blob/v2.0.1/models/spring-ai-transformers/src/main/java/org/springframework/ai/transformers/ResourceCacheService.java", "name": ""}], "scope_influence": "", "tags": ["AI", "java", "开源"], "title": "Spring AI 可预测缓存目录导致的本地 ONNX 模型替换漏洞", "_translated": true, "_saved_at": "2026-08-21T12:34:31+00:00", "_first_saved_at": "2026-08-21T12:34:31+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-d08b-8c33"}, {"analysis_status": 0, "articles": [], "attack_vector_type": "Local", "cnvd_id": "", "cve_id": "CVE-2026-45201", "cvss": {}, "cvss_score": 7.8, "cvss_vector": "", "cwe": "CWE-1284", "description": "Imagination Technologies Graphics DDK 是面向 PowerVR 系列 GPU 的闭源驱动开发包，包含内核态驱动模块、固件以及上层服务，供 Android、Linux 和车载平台集成使用以调度 GPU 资源。\n受影响版本中，内核态驱动模块在处理非特权用户发起的物理页分配 GPU 系统调用时，未对调用方传入的 log2 page size 字段进行有效性校验，攻击者可以将任意 log2 page size 值注入该参数；当该值被用于把 4K 页面映射为更高阶页面时，下游内存管理逻辑按放大后的阶数计算可访问范围，导致越过 4K 边界出现越界读和越界写。\n修复版本中通过 DDK 内核模块对物理页分配路径中的 log2 page size 参数执行显式边界与合法性校验，阻止被构造的非法值进入更高阶页面映射流程，从而消除由此引发的越界内存访问。", "effects": [{"comp_name": "imagination_graphics_ddk", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,26.1 RTM1]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "输入中指定数量的验证不当", "kind_en": "输入中指定数量的验证不正确", "last_modified_time": "2026-08-21", "level": "High", "mps_id": "MPS-pz4d-vgk7", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-pz4d-vgk7", "name": "https://www.oscs1024.com/hd/MPS-pz4d-vgk7"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-45201", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-45201"}, {"url": "https://www.imaginationtech.com/gpu-driver-vulnerabilities/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title"
