触发 phx_error 重连；广播进程与 PubSub worker 不再崩溃，其余订阅者正常收到消息，Phoenix.Socket.V1.JSONSerializer 同时为二进制载荷增加显式的 ArgumentError 子句。", "effects": [{"comp_name": "phoenix", "ecosystem": "linux", "versions": [{"affected_version": "[1.7.0-rc.0,1.7.25)", "min_fixed_version": "1.7.25", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[1.8.0-rc.0,1.8.17)", "min_fixed_version": "1.8.17", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[1.5.7,1.5.16)", "min_fixed_version": "1.5.16", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[1.6.0-rc.0,1.6.18)", "min_fixed_version": "1.6.18", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "未捕获的异常", "kind_en": "未捕获的异常", "last_modified_time": "2026-11-21", "level": "High", "mps_id": "MPS-9ubf-06p7", "poc": false, "poc_url": [], "published_time": "2026-11-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-9ubf-06p7", "name": "https://www.oscs1024.com/hd/MPS-9ubf-06p7"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-129344", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-129344"}, {"url": "https://github.com/phoenixframework/phoenix/security/advisories/GHSA-5vmc-qgf8-rw36", "name": "Client-selected V1 serializer crashes shared broadcast dispatch on binary payloads"}, {"url": "https://cna.erlef.org/cves/CVE-2026-129344.html", "name": "EEF CNA record for CVE-2026-129344"}, {"url": "https://osv.dev/vulnerability/EEF-CVE-2026-129344", "name": "OSV record EEF-CVE-2026-129344"}, {"url": "https://github.com/phoenixframework/phoenix/commit/07b401901fc1d649f126eee6315b5eb01fa5c85c", "name": "Introducing commit 07b4019 in phoenixframework/phoenix"}, {"url": "https://github.com/phoenixframework/phoenix/commit/cf098e9cf7a44ee6479d31d911a97d3c7430c6fe", "name": "Introducin e.handle_info/2 只匹配任务成功消息，任务失败触发 FunctionClauseError 使分片进程终止，该分片跟踪的全部频道与 LiveView 进程随之退出且存在状态被清空，重复加入可耗尽重启强度并导致应用整体不可用。\n修复版本中通过在 track/4、untrack/4、update/4 与 get_by_key/3 中对存在键统一调用 to_string/1，只有字符串键进入 Phoenix.Tracker，非字符串键无法再进入跟踪器并在 group/1 中触发异常，修复随 1.5.16、1.6.18、1.7.25 与 1.8.17 发布。", "effects": [{"comp_name": "phoenix", "ecosystem": "linux", "versions": [{"affected_version": "[1.2.0,1.5.16)", "min_fixed_version": "1.5.16", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[1.6.0-rc.0,1.6.18)", "min_fixed_version": "1.6.18", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[1.7.0-rc.0,1.7.25)", "min_fixed_version": "1.7.25", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[1.8.0-rc.0,1.8.17)", "min_fixed_version": "1.8.17", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "输入验证不恰当", "kind_en": "输入验证不当", "last_modified_time": "2026-11-21", "level": "High", "mps_id": "MPS-9wpo-jmfk", "poc": false, "poc_url": [], "published_time": "2026-11-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-9wpo-jmfk", "name": "https://www.oscs1024.com/hd/MPS-9wpo-jmfk"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-128361", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-128361"}, {"url": "https://cna.erlef.org/cves/CVE-2026-128361.html", "name": ""}, {"url": "https://github.com/phoenixframework/phoenix/commit/39c1c6bfd0c817f1223c121f61c60a25f66b76cb", "name": ""}, {"url": "https://github.com/phoenixframework/phoenix/commit/44e7618370629df93711cd6169789fd0d8f3678e", "name": ""}, {"url": "https://github.com/phoenixframework/phoenix/commit/6609595fb3e37f545c4ac636a369f14b0084bc3d", "name": ""}, {"url": "https://github.com/phoenixframework/phoenix/commit/81bc0278c7a4e6204f7e2e0a3b3200e9f1ee5a4b", "name": ""}, {"url": "https://github.com/phoenixframework/phoenix/commit/edb702804aeab3a29543668a8be8ea61291c4b75", "name": ""}, {"url": "https://github.com/phoenixframework/phoenix/security/advisories/GHSA-pvfx-rx4x-phrr", "name": ""}, {"url": "https://osv.dev/vulnerability/EEF-CVE-2026-128361", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Phoenix Presence 拒绝服务漏洞", "_translated": true, "_saved_at": "2026-11-21T11:58:32+00:00", "_first_saved_at": "2026-11-21T11:58:32+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-9wpo-jmfk"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "attack_vector_type": "Local", "cnvd_id": "", "cve_id": "CVE-2026-112603", "cvss": {}, "cvss_score": 7.8, "cvss_vector": "", "cwe": "CWE-269", "description": "Apple Xcode 是 Apple 官方发布的 macOS 集成开发环境（闭源软件），Instruments 是其中随附的性能分析与调试工具组件，用于应用剖析、跟踪与性能调优。\n受影响版本中，Xcode 的 Instruments 组件存在逻辑问题，对相关特权操作缺少充分校验，本地应用可借助该缺陷获得 root 权限；Apple 官方公告未披露具体函数与判定细节，受影响的代码位置不可确认。\n修复版本中通过增强校验（improved checks）修复该逻辑问题，修复随 Xcode 27.2 发布（2026 年 10 月 29 日发布），升级后本地应用无法再借助该缺陷获得 root 权限。", "effects": [{"comp_name": "xcode", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,27.2)", "min_fixed_version": "27.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-11-21", "level": "High", "mps_id": "MPS-y04x-726g", "poc": false, "poc_url": [], "published_time": "2026-11-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-y04x-726g", "name": "https://www.oscs1024.com/hd/MPS-y04x-726g"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-112603", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-112603"}, {"url": "https://support.apple.com/en-us/149589", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "Apple Xcode 本地提权漏洞", "_translated": true, "_saved_at": "2026-11-21T03:42:21+00:00", "_first_saved_at": "2026-11-21T03:42:21+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-y04x-726g"}, {"analysis_status": 0, "articles": [], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-114023", "cvss": {}, "cvss_score": 7.7, "cvss_vector": "", "cwe": "CWE-20", "description": "macOS App Store 是 Apple macOS 系统内置的应用商店，为闭源组件，负责应用的浏览、搜索、下载与更新，并处理商店页面中的网页内容。\n受影响版本中，App Store 处理网页内容时的路径处理逻辑存在校验缺陷，攻击者可控的网页内容进入该路径处理流程后未经充分验证，处理此类内容可能导致执行任意代码。\n修复版本中通过改进路径验证消除该缺陷，Apple 已在 macOS Golden Gate 27.2、macOS Sequoia 15.8.2 与 macOS Tahoe 26.7.2 中发布修复，升级后处理网页内容不再触发任意代码执行。", "effects": [{"comp_name": "macos", "ecosystem": "linux", "versions": [{"affected_version": "[15,15.8.2)", "min_fixed_version": "15.8.2", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[27,27.2)", "min_fixed_version": "27.2", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[26,26.7.2)", "min_fixed_version": "26.7.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "输入验证不恰当", "kind_en": "输入验证不当", "last_modified_time": "2026-11-21", "level": "High", "mps_id": "MPS-mutp-9jb3", "poc": false, "poc_url": [], "published_time": "2026-11-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-mutp-9jb3", "name": "https://www.oscs1024.com/hd/MPS-mutp-9jb3"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-114023", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-114023"}, {"url": "https://support.apple.com/en-us/149521", "name": ""}, {"url": "https://support.apple.com/en-us/149522", "name": ""}, {"url": "https://support.apple.com/en-us/149523", "name": ""}], "scope_influence": "", "tags": ["操作系统"], "title": "macOS App Store 任意代码执行漏洞", "_translated": true, "_saved_at": "2026-11-21T03:42:19+00:00", "_first_saved_at": "2026-11-21T03:42:19+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-mutp-9jb3"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-131609", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "cwe": "CWE-79", "description": "Germanized for WooCommerce 是 vendidero 开发的 WordPress 开源插件（GPLv3），用于让 WooCommerce 店铺符合德国及欧盟市场的合规要求，提供结账调整、税项处理与订单撤回（withdrawal）管理等功能，其中内置的 EU Order Withdrawal Button 子模块通过公开的撤回请求表单和后台撤回列表处理客户撤回请求。\n受影响版本中，后台撤回列表 WithdrawalTable::render_order_number_column() 将买家姓名 get_formatted_full_name() 的返回值仅经 wp_kses_post() 白名单过滤后直接输出，未使用 esc_html() 做整字段转义；攻击者先通过 WooCommerce Store API 游客结账把恶意脚本写入订单账单名（billing_address.first_name），再经 /withdraw-from-contract/ 页面公开 nonce 的未认证撤回请求接口（Ajax::order_withdrawal_request）以该订单为父单提交撤回请求，WithdrawalOrder::get_first_name() 在撤回单自身未填姓名且邮箱完成双重确认验证时回退读取父订单的 billing first name，注入内容随之进入后台撤回列表的买家姓名列，wp_kses_post() 的标签白名单可被拆分标签重组方式绕过，管理员打开后台撤回列表或订单详情时脚本在其会话中执行。\n修复版本中通过将 WithdrawalTable::render_order_number_column() 中买家姓名、render_order_address_column() 的地址字段以及 Admin.php 订单页撤回明细与邮件模板中的姓名、邮箱、验证码等客户可控字段统一改为 esc_html()/esc_attr() 转义输出，不再依赖 wp_kses_post() 白名单过滤；配套提交（withdrawal button 包 2.4.8 的第二项修复）还剥离客户可控邮件占位符中的尖括号、转义拒回原因并限制后台保存撤回 AJAX 的可编辑属性，从根源消除标签重组绕过，阻止任意脚本注入并在管理员会话中执行。", "effects": [{"comp_name": "woocommerce-germanized", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,4.1.9)", "min_fixed_version": "4.1.9", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": L/PR:N/UI:N/S:C/C:L/I:L/A:N", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "cwe": "CWE-79", "description": "WPC Frequently Bought Together for WooCommerce 是 wpclever 开发的 WordPress 开源插件（GPLv2 许可，通过 WordPress.org 官方插件目录以 SVN 分发），用于在商品页展示“经常一起购买”的商品组合，并支持把组合内商品一键全部加入购物车。\n受影响版本中，includes/class-woobt.php 的 ajax_add_all_to_cart 方法通过 wc_ajax_woobt_add_all_to_cart 提供 AJAX 入口，它以 $variation = (array)( wp_unslash( $_POST['variation'] ?? [] ) ) 直接读取攻击者提交的 variation 数组，不做任何清洗或属性白名单校验，便作为第 4 个参数传入 WC()-\u003ecart-\u003eadd_to_cart()。恶意属性值随购物车项持久化并进入后续订单数据，在其他用户访问渲染该数据的页面时因输出转义不足以 Web 脚本执行。该方法虽校验 woobt-security nonce，但 enqueue_scripts 方法通过 wp_localize_script 把同一 nonce 输出给所有未登录访问者，nonce 不构成认证屏障，未认证攻击者无需登录即可调用该入口。\n修复版本中通过 8.0.3 重写 ajax_add_all_to_cart 的 variation 处理：先确认 product_id 本身是变体商品，或 variation_id 对应一个已发布且父商品等于 product_id 的变体商品，再将原始 $_POST['variation'] 交给新增的 WPCleverWoobt_Helper::sanitize_variation() 清洗，该函数只保留 attribute_ 前缀的字符串键与标量值，去除标签后按变体商品的已注册属性（分类法 term slug 或父商品自定义属性选项）做白名单比对，不匹配的值全部丢弃；不存在合法变体商品时 variation_id 归零、variation 置空。同一清洗逻辑也应用到 woobt_ids 驱动的关联商品加购路径。", "effects": [{"comp_name": "woo-bought-together", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,8.0.3)", "min_fixed_version": "8.0.3", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-11-21", "level": "High", "mps_id": "MPS-pexl-zago", "poc": false, "poc_url": [], "published_time": "2026-11-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-pexl-zago", "name": "https://www.oscs1024.com/hd/MPS-pexl-zago"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-133367", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-133367"}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/08e4c3a3-040f-4d2b-805c-f512bd95812d?source=cve", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/woo-bought-together/tags/8.0.2/includes/class-woobt.php#L67", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/woo-bought-together/tags/8.0.2/includes/class-woobt.php#L219", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/woo-bought-together/tags/8.0.2/includes/class-woobt.php#L610", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/woo-bought-together/tags/8.0.2/includes/class-woobt.php#L624", "name": ""}, {"url": "https://wordpress.org/plugins/woo-bought-together/", "name": ""}, {"url": "https://plugins.trac.wordpress.org/changeset/3813247/woo-bought-together/trunk/includes/class-woobt.php", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "WPC Frequently Bought Together存储型XSS", "_translated": true, "_saved_at": "2026-11-21T11:58:34+00:00", "_first_saved_at": "2026-11-21T11:58:34+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-pexl-zago"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-134126", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:N", "severity": "medium", "base_score": 6.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-862", "description": "WPC Smart Messages for WooCommerce plugin before 4.3.6 contains a missing authorization vulnerability that allows authenticated attackers with Contributor or Author privileges to disclose arbitrary post meta and private product data by supplying attacker-controlled id and key attributes to the [wpcsm_product_field] and [wpcsm_product_data] shortcodes without any capability or protected-meta checks. Attackers can embed these shortcodes in a published post to exfiltrate sensitive order data such as billing email, phone, and address stored as post meta, as well as private or draft product descriptions and purchase notes, exposing confidential customer and business information to unauthenticated site visitors.", "effects": [{"comp_name": "WPC Smart Messages for WooCommerce", "ecosystem": "linux", "versions": [{"affected_version": "(0,4.3.6)", "min_fixed_version": "4.3.6", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-11-21", "level": "High", "mps_id": "MPS-uo0h-9v4d", "poc": false, "poc_url": [], "published_time": "2026-11-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-uo0h-9v4d", "name": "https://www.oscs1024.com/hd/MPS-uo0h-9v4d"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-134126", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-134126"}, {"url": "https://wordpress.org/plugins/wpc-smart-messages/#developers", "name": "Vendor Patch"}, {"url": "https://www.vulncheck.com/advisories/wpc-smart-messages-for-woocommerce-before-information-disclosure-via-shortcodes", "name": "VulnCheck Advisory: WPC Smart Messages for WooCommerce before 4.3.6 Information Disclosure via Shortcodes"}], "scope_influence": "", "tags": ["应用软件"], "title": "WPC Smart Messages for WooCommerce before 4.3.6 Information Disclosure via Shortcodes", "_translated": true, "_saved_at": "2026-11-23T01:19:46+00:00", "_first_saved_at": "2026-11-20T22:54:50+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-uo0h-9v4d"}, {"analysis_status": 0, "articles": [{"content": "跨界内存读是指应用程序在读取内存时，未正确验证或限制读取的内存范围。攻击者利用这种漏洞可以读取应用程序内存中的敏感数据，如密码、加密密钥、会话令牌等。常见的原因是由于缓冲区溢出、格式化字符串漏洞或其他内存错误导致的。", "title": "什么是越界读取"}, {"content": "攻击者可以通过不当构造的输入来触发跨界内存读漏洞。攻击者可能会通过向应用程序发送特定的输入，使其读取超过预期的内存区域。攻击者可以利用这个漏洞来获取敏感信息，如其他用户的数据、操作系统的敏感数据或应用程序的内部状态。", "title": "越界读取常见的攻击方式"}, {"content": "- 输入验证和限制：应用程序应对所有输入数据进行严格的验证和限制。确保输入数据的长度、格式和内容符合预期，避免超出缓冲区或访问非预期的内存区域。\n- 内存安全编程实践：开发人员应使用安全的编程实践，如避免使用不安全的函数、正确处理内存分配和释放操作，以及遵循最小特权原则。\n- 使用安全的编程语言和库：选择使用安全性较高的编程语言和库，这些语言和库在内存管理和安全性方面提供了更多的保护机制。\n- 定期进行代码审查和安全测试：定期审查应用程序的代码，并进行安全测试，以发现潜在的跨界内存读漏洞。使用静态代码分析工具和漏洞扫描工具来辅助检测和修复问题。\n- 实施防御性编程技术：应用程序应采用防御性编程技术，如使用随机化地址空间布局（ASLR）、堆栈保护机制（如堆栈溢出保护）和数据执行预防（DEP）等。\n- 及时更新和修补：及时应用程序和操作系统的安全更新和补丁，以确保已知的跨界内存读漏洞得到修复。及时更新相关软件和库，以避免使用已知存在漏洞的版本。", "title": "如何预防越界读取"}], "attack_vector_type": "Local", "cnvd_id": "", "cve_id": "CVE-2026-112465", "cvss": {}, "cvss_score": 7, "cvss_vector": "", "cwe": "CWE-125", "description": "AVEVideoEncoder 是 Apple iOS、iPadOS、macOS、tvOS 与 visionOS 内置的闭源内核级视频编码组件，随操作系统默认提供，负责为应用提供硬件视频编码能力。\n受影响版本中，该内核组件处理编码相关输入时缺少充分的边界校验，设备上的本地应用可通过视频编码调用路径触发越界读取，访问超出缓冲区范围的内核内存，可能导致非预期的系 ed": true, "_saved_at": "2026-11-21T03:42:23+00:00", "_first_saved_at": "2026-11-21T03:42:23+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-7s0c-okv3"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过向受信任的数据序列化过程中添加恶意数据，从而在序列化和反序列化过程中执行恶意代码的攻击漏洞。这种漏洞通常存在于使用序列化 (serialization) 机制存储和传输数据的程序中。\n", "title": "什么是反序列化"}, {"content": "- 注入攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码注入到程序中，从而实现代码执行的目的。\n- 反射攻击：攻击者使用反射机制，在序列化过程中动态生成恶意数据，并将恶意代码注入到程序中，从而实现代码执行的目的。\n- 缓冲区溢出攻击：攻击者通过在序列化过程中向缓冲区输入恶意数据，导致缓冲区溢出，从而破坏程序的内存管理，实现代码执行的目的。\n- 格式字符串攻击：攻击者通过在序列化过程中输入恶意数据，导致程序使用错误的格式字符串，从而实现代码执行的目的。\n- 数据流攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码作为一个数据流传递给程序，从而实现代码执行的目的。\n", "title": "反序列化常见的攻击方式"}, {"content": "- 不信任输入数据：程序应该严格检查输入数据的有效性，并避免使用不受信任的数据。\n- 使用安全的序列化机制：程序应该使用安全的序列化机制，如 JSON 或 XML 序列化，而不是第三方序列化库。\n- 最小特权原则：程序应该限制对受信任数据的处理权限，并避免在运行时修改数据。\n- 代码审查和漏洞扫描：程序应该进行代码审查和漏洞扫描，以发现和修复潜在的安全漏洞。\n", "title": "如何预防反序列化"}], "cnvd_id": "", "cve_id": "CVE-2026-131707", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-502", "description": "ProfileGrid（插件标识 profilegrid-user-profiles-groups-and-communities）是 Metagauss 开发的 WordPress 开源插件，用于构建会员资料页、用户群组与社区功能，通过 WordPress.org 插件目录分发，活跃安装量超过 5000 个站点。\n受影响版本中，群组配置以序列化字符串保存在 pm_groups 表的 group_options 字段，插件在读取该字段时使用 WordPress 的 maybe_unserialize() 直接反序列化，未限制 allowed_classes；前端群组页 public/partials/profile-magic-group.php 的 edit_group 分支允许群组管理员（订阅者级用户）提交群组配置，PM_request::sanitize_request() 对字符串形态的 group_options 仅执行 wp_kses_post()，序列化载荷原样通过并经 PM_DBhandler::update_row() 写入数据库；此后任意访问者打开群组页、群组列表或管理员打开群组设置页时，存储的载荷被反序列化并实例化攻击者指定的类，构成 PHP 对象注入，命中运行环境中可用的 POP 链时可导致任意代码执行、任意文件删除或数据库操作。\n修复版本中通过新增的 pg_safe_unserialize_group_options() 完成修复：该函数以 unserialize(…, array('allowed_classes' =\u003e false, 'max_depth' =\u003e 64)) 解码群组配置，并校验解码结果只能为标量与嵌套数组且节点数不超过 10000，否则返回空数组，插件内全部针对 group_opti //github.com/OpenShot/openshot-qt/blob/v4.1.1/src/classes/project_data.py", "name": ""}, {"url": "https://www.vulncheck.com/advisories/openshot-video-editor-through-4.1.1-deserialization-via-legacy-project-import", "name": "VulnCheck Advisory: OpenShot Video Editor through 4.1.1 Deserialization via Legacy Project Import"}], "scope_influence": "", "tags": ["应用软件"], "title": "OpenShot 反序列化漏洞", "_translated": true, "_saved_at": "2026-11-22T04:37:29+00:00", "_first_saved_at": "2026-11-22T04:37:29+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-dmz8-2fyj"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-131705", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:N/A:L", "severity": "high", "base_score": 8.5}]}, "cvss_score": 8.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:N/A:L", "cwe": "CWE-89", "description": "ProfileGrid 是 Metagauss 开发的 WordPress 用户资料、群组与社区管理插件，以开源形式通过 wordpress.org 分发，提供用户分组、资料字段、组长管理、付费群组与站内私信等功能。\n受影响版本中，群组前端模板 public/partials/profile-magic-group.php 处理组长提交的群组编辑表单时，把表单字段名未经列名白名单校验直接作为数据键写入 $data，并传入 PM_DBhandler::update_row()；update_row() 将该数组原样交给 WordPress 的 $wpdb-\u003eupdate()，wpdb 拼接 UPDATE 语句时仅用反引号包裹字段名且不转义字段名中的反引号，持有组长身份的低权限用户提交携带反引号的字段名可在 SET 子句中注入任意 SQL，进而篡改 wp_pm_groups 数据行或通过时间盲注读取站点数据库中的敏感数据。\n修复版本中通过在 PM_DBhandler::update_row() 入口对表名、唯一字段与数据数组键名统一执行标识符校验，要求键名匹配 ^[A-Za-z_][A-Za-z0-9_]*$ 且必须为目标表真实列名，任一校验失败返回 false 拒绝写入；群组前端模板同步将组长可更新字段收窄为 group_name 与 group_desc 白名单，切断了从表单字段名到 UPDATE 语句的注入路径。", "effects": [{"comp_name": "profilegrid-user-profiles-groups-and-communities", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,6.0.0.7)", "min_fixed_version": "6.0.0.7", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-11-22", "level": "High", "mps_id": "MPS-wflg-3s7h", "poc": false, "poc_url": [], "published_time": "2026-11-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-wflg-3s7h", "name": "https://www.oscs1024.com/hd/MPS-wflg-3s7h"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-131705", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-131705"}, {"url": "https://patchstack.com/database/wordpress/plugin/profilegrid-user-profiles-groups-and-communities/vulnerability/wordpress-profilegrid-plugin-6-0-0-6-sql-injection-vulnerability-2?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "ProfileGrid SQL注入漏洞", "_translated": true, "_saved_at": "2026-11-22T20:13:57+00:00", "_first_saved_at": "2026-11-22T12:59:30+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-wflg-3s7h"}, {"analysis_status": 3, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-125396", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X , "kind_en": "Missing Cryptographic Step", "last_modified_time": "2026-11-22", "level": "High", "mps_id": "MPS-4sj3-16m0", "poc": false, "poc_url": [], "published_time": "2026-11-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-4sj3-16m0", "name": "https://www.oscs1024.com/hd/MPS-4sj3-16m0"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-134458", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-134458"}, {"url": "https://github.com/web-token/jwt-framework/security/advisories/GHSA-5pj7-wx9m-cjh6", "name": ""}, {"url": "https://www.vulncheck.com/advisories/web-token-jwt-framework-before-3.4.12-ecdh-es-weak-key-derivation-via-concatkdf", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-134458漏洞", "_translated": true, "_saved_at": "2026-11-23T01:19:46+00:00", "_first_saved_at": "2026-11-21T18:51:42+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-4sj3-16m0"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-134459", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "medium", "base_score": 5.9}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.2}]}, "cvss_score": 8.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-208", "description": "web-token jwt-framework 与 jwt-library 是开源 PHP JWT 库（MIT 许可），提供 JWS 与 JWE 的构建、签名、加密和解密能力，广泛用于 PHP 应用的令牌签发与校验。\n受影响版本中，JWE 密钥加密算法 RSA1_5 的解密实现 RSACrypt::decryptWithRSA15() 在 RSADP 运算后直接校验 PKCS#1 v1.5 填充，填充非法或填充串不足 8 字节时立即抛出 InvalidArgumentException，未实现 RFC 8017 要求的隐式拒绝。攻击者构造的 JWE encrypted_key 经 JWEDecrypter 解密链路进入该函数后，填充被拒绝、填充合法但 CEK 长度不符、填充合法并完整执行 AEAD 内容解密三种情形的执行耗时存在可测差异，构成 Bleichenbacher/Marvin 填充预言机，远程攻击者可自适应提交大量构造的 JWE 并测量耗时差异，逐步恢复被 RSA1_5 包装的内容加密密钥，最终解密 JWE 明文。\n修复版本中通过为 RSA1_5 解密引入隐式拒绝机制切断该时序侧信道：RSA15::decryptKey() 依据 JWE 头部 enc 字段计算预期 CEK 长度并传入解密函数，RSACrypt::decryptWithRSA15() 在常数时间内完成填充校验，校验失败时以常数时间选择返回与预期长度一致的随机密钥，使后续 AEAD 内容解密始终执行且失败表现统一，消除填充合法与非法之间的可观测耗时差异。", "effects": [{"comp_name": "web-token/jwt-framework", "ecosystem": "composer", "versions": [{"affected_version": "[4.0.0,4.0.7)", "min_fixed_version": "4.0.7", "repository": "composer", "solutions": [], "upstream": true}, {"affected_version": "[4.1.0,4.1.7)", "min_fixed_version": "4.1.7", "repository": "composer", "solutions": [], "upstream": true}, {"affected_version": "(-∞,3.4.10)", "min_fixed_version": "3.4.10", "repository": "composer", "solutions": [], "upstream": true}]}, {"comp_name": "web-token/jwt-library", "ecosystem": "composer", "versions": [{"affected_version": "(-∞,3.4.10)", "min_fixed_version": "3.4.10", "repository": "composer", "solutions": [], "upstream": true}, {"affected_version": "[4.0.0,4.0.7)", "min_fixed_version": "4.0.7", "repository": "composer", "solutions": [], "upstream": true}, {"affected_version": "[4.1.0,4.1.7)", "min_fixed_version": "4.1.7", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "通过时间差异性导致的信息暴露", "kind_en": "可观察到的时间差异", "last_modified_time": "2026-11-22", "level": "High", "mps_id": "MPS-ez9k-dwn8", "poc": false, "poc_url": [], "published_time": "2026-11-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ez9k-dwn8", "name": "https://www.oscs1024.com/hd/MPS-ez9k-dwn8"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-134459", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-134459"}, {"url": "https://github.com/web-token/jwt-framework/security/advisories/GHSA-5739-39v2-5754", "name": ""}, {"url": "https://www.vulncheck.com/advisories/web-token-jwt-framework-before-3.4.10-rsa1-5-bleichenbacher-padding-oracle", "name": ""}], "scope_influence": "", "tags": ["php", "开源"], "title": "web-token JWT库RSA1_5填充预言机漏洞", "_translated": true, "_saved_at": "2026-11-21T18:51:43+00:00", "_first_saved_at": "2026-11-21T18:51:43+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ez9k-dwn8"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-131706", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:C/C:H/I:N/A:L", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:C/C:H/I:N/A:L", "cwe": "CWE-89", "description": "ProfileGrid（插件目录标识 profilegrid-user-profiles-groups-and-communities）是 Metagauss 发布的 WordPress 开源插件，用于构建用户资料页、用户分组、社群与付费会员功能，WordPress.org 活跃安装量约 5000+。\n受影响版本中，前端小组编辑功能在保存小组时仅排除 _wpnonce、_wp_http_referer、edit_group、group_id 四个固定字段，其余 POST 参数名经 sanitize_request() 处理后直接成为待更新数据数组的键并传入 PM_DBhandler::update_row()；该版本 update_row() 对数据数组键未做列名白名单校验，WordPress 数据库层将这些键原样拼接为 UPDATE 语句中的反引号列标识符，拥有目标小组管理权限的登录用户可通过构造含反引号的恶意参数名闭合标识符上下文并注入 SQL，实现盲注读取数据库内容。\n修复版本中通过在 update_row() 中校验表名格式、要求每条写入语句的列标识符同时满足 ^[A-Za-z_][A-Za-z0-9_]*$ 格式校验与实际表列白名单校验（pm_is_allowed_write_identifier），任一校验失败即拒绝写入，并在前端将小组可编辑字段限制为 group_name 与 group_desc，切断了参数名进入 SQL 语句的路径。", "effects": [{"comp_name": "profilegrid-user-profiles-groups-and-communities", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,6.0.0.7)", "min_fixed_version": "6.0.0.7", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-11-22", "level": "High", "mps_id": "MPS-7bas-rg6i", "poc": false, "poc_url": [], "published_time": "2026-11-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-7bas-rg6i", "name": "https://www.oscs1024.com/hd/MPS-7bas-rg6i"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-131706", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-131706"}, {"url": "https://patchstack.com/database/wordpress/plugin/profilegrid-user-profiles-groups-and-communities/vulnerability/wordpress-profilegrid-plugin-6-0-0-6-sql-injection-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "ProfileGrid SQL盲注漏洞", "_translated": true, "_saved_at": "2026-11-22T20:13:55+00:00", "_first_saved_at": "2026-11-22T12:59:27+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-7bas-rg6i"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-131720", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "cwe": "CWE-201", "description": "BookIt 是 Liquid Web / StellarWP 在 wordpress.org 以 GPLv2 或更高协议开源的 WordPress 预约日历插件（插件标识 bookit），用于在站点前台提供预约服务、时段选择与在线支付流程。\n受影响版本中，站点渲染 [bookit] 短代码时，includes/classes/BookitController.php 的 render_calendar() 将 SettingsController::get_settings() 返回的完整配置数组传入前台模板，templates/bookit-calendar.php 经 bookit_vue_prop() JSON 编码后把该数组输出到页面 \u003cbookit\u003e 元素的 :settings 属性；bookit_settings 选项同时保存支付网关的 Stripe secret_key 等服务端凭据与管理端配置，任何未认证访客查看预约页面源码即可读取这些内容。\n修复版本中通过在 BookitController 新增 get_frontend_settings() 白名单过滤，render_calendar() 仅向前台模板输出 booking_type、calendar_view、currency_symbol 等 13 个展示键，每个支付网关仅保留 custom_icon、custom_title、enabled、publish_key，secret_key 与其余管理端配置不再进入页面源码。", "effects": [{"comp_name": "bookit", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.6.0.9)", "min_fixed_version": "2.6.0.9", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "通过发送数据的信息暴露", "kind_en": "将敏感信息插入发送的数据中", "last_modified_time": "2026-11-22", "level": "High", "mps_id": "MPS-hvip-oqgk", "poc": false, "poc_url": [], "published_time": "2026-11-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-hvip-oqgk", "name": "https://www.oscs1024.com/hd/MPS-hvip-oqgk"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-131720", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-131720"}, {"url": "https://patchstack.com/database/wordpress/plugin/bookit/vulnerability/wordpress-bookit-plugin-2-6-0-8-sensitive-data-exposure-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "BookIt 敏感信息泄露", "_translated": true, "_saved_at": "2026-11-22T20:13:51+00:00", "_first_saved_at": "2026-11-22T12:59:22+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-hvip-oqgk"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-131708", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:L", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:L", "cwe": "CWE-79", "description": "ProfileGrid – User Profiles, Groups and Communities 是 Metagauss 发布在 WordPress 官方插件目录的开源插件（PHP 编写，GPLv2 授权），用于在站点前端构建用户资料、群组与社区功能，并通过 PM_Group 等短代码渲染群组页面。\n受影响版本中，前端群组模板 public/partials/profile-magic-group.php 将 URL 参数 gid（filter_input(INPUT_GET, 'gid')）未经类型校验传入 PM_request::profile_magic_get_join_group_button()；该函数用 add_query_arg('gid', $gid, ...) 把未做 URL 编码的 gid 拼进注册页地址，再以单引号 JS 字符串配合 esc_url() 输出到未登录访客可见的 Join Group 按钮 onclick 属性中。esc_url() 的字符白名单保留单引号、加号与括号，且只把单引号转写为 HT TTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-131741", "cvss": {"cvssv31": [{"source": "Patchstack", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:L", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "", "cwe": "CWE-79", "description": "CartFlows 是 Brainstorm Force 开发的 WordPress 销售漏斗插件，以开源形式发布于 wordpress.org 插件目录，用于为 WooCommerce 网站创建结算、选择加入与销售漏斗页面。\n受影响版本中，CartFlows 结算或选择加入步骤页面渲染时，Cartflows_Checkout_Ajax::get_ajax_endpoint 与 Cartflows_Optin_Markup::get_ajax_endpoint 把攻击者可控的 $_SERVER['REQUEST_URI'] 去掉查询串后直接用作 WooCommerce AJAX 端点基址；esc_url() 只做字符过滤，未把该值限制为同源相对路径，以 // 开头的协议相对目标可以原样通过，add_query_arg() 在该基址上拼接 wc-ajax 与 wcf_checkout_id 后生成的端点 URL 被反射进页面，页面脚本随后向攻击者可控来源发起请求并把返回内容写入页面，最终在受害者浏览器中执行攻击者控制的脚本。\n修复版本中通过新增的 Cartflows_Helper::get_ajax_endpoint_base_path() 使用 wp_parse_url 仅保留请求路径部分并强制单一前导斜杠，CartFlows 3.3.3 中两处 get_ajax_endpoint 均改用该同源路径作为端点基址，端点 URL 不再携带攻击者可控的来源与内容，反射型 XSS 被消除。", "effects": [{"comp_name": "cartflows", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,3.3.3)", "min_fixed_version": "3.3.3", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-11-23", "level": "High", "mps_id": "MPS-ariw-d7ph", "poc": false, "poc_url": [], "published_time": "2026-11-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ariw-d7ph", "name": "https://www.oscs1024.com/hd/MPS-ariw-d7ph"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-131741", "name": "https://nvd.nist.go 4u"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，从而导致未授权的用户或资源可以被访问或篡改。", "title": "什么是访问控制不当"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n", "title": "访问控制不当常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防访问控制不当"}], "cnvd_id": "", "cve_id": "CVE-2026-134453", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:N", "severity": "medium", "base_score": 6.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-284", "description": "Dockhand before 1.0.50 contains an improper access control vulnerability that allows authenticated unprivileged users to read restricted data by querying API endpoints lacking RBAC checks. Attackers can access /api/users, /api/license, and /api/hawser/connect to obtain user emails and roles, the full license key, and environment details, while an invalid license grants all users admin rights.", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "访问控制不当", "kind_en": "访问控制不当", "last_modified_time": "2026-11-22", "level": "High", "mps_id": "MPS-u isShard=true 时还会将委托处理器的完整响应写回 ping 响应；该接口在规则化授权下仅需低权限 health 权限，官方 bin/solr auth 命令生成的样例 security.json 更将 health 权限设为无需认证，使仅持有 health 权限或未认证的客户端能够触发 /select 等本应要求 read、update 等更高权限的功能。\n修复版本中通过新增 resolveConfiguredParams 方法，仅从处理器自身配置的 invariants、appends、defaults 与 useParams 参数集解析委托处理器及执行参数，不再读取任何请求参数，并以子请求承载配置参数、通过 shards.qt 将分布式 ping 直接指向各分片的委托处理器，使请求参数无法改变 ping 的实际执行内容，切断了低权限客户端借助 ping 端点触发高权限功能的路径。", "effects": [{"comp_name": "org.apache.solr:solr-core", "ecosystem": "maven", "versions": [{"affected_version": "[10.0.0,10.1.0)", "min_fixed_version": "10.1.0", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[9.0.0,9.11.0)", "min_fixed_version": "9.11.0", "repository": "maven", "solutions": [], "upstream": true}]}, {"comp_name": "solr", "ecosystem": "linux", "versions": [{"affected_version": "[9.0.0,9.11.0)", "min_fixed_version": "9.11.0", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[10.0.0,10.1.0)", "min_fixed_version": "10.1.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-11-23", "level": "High", "mps_id": "MPS-d060-7c40", "poc": false, "poc_url": [], "published_time": "2026-11-23", "reference_url_list": [{"url": "http://www.mail-archive.com/announce@apache.org/msg12763.html", "name": ""}, {"url": "https://solr.apache.org/security-news.html", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-86312", "name": ""}, {"url": "https://github.com/apache/solr/pull/4890", "name": ""}, {"url": "https://github.com/apache/solr/commit/f567b7b1a9415c8bfcf3f64ddb51aa78eb007a8f", "name": ""}, {"url": "https://github.com/apache/solr/commit/a918d1fe97981fac56cd8ded80daf382786683a1", "name": ""}, {"url": "https://issues.apache.org/jira/browse/SOLR-18419", "name": ""}, {"url": "https://solr.apache.org", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "Apache Solr Ping接口权限绕过漏洞", "_translated": true, "_saved_at": "2026-11-23T01:19:46+00:00", "_first_saved_at": "2026-11-23T01:19:46+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-d060-7c40"}]}</script>
  <script>
    const payload = JSON.parse(document.getElementById("payload").textContent);
    const levelLabels = payload.level_labels || {};
    const items = payload.items || [];
    let filtered = items.slice();
    let activeId = null;

    const $ = (id) => document.getElementById(id);
    $("generatedAt").textContent = payload.generated_at || "-";
    $("retention").textContent = payload.retention_days ?? "-";
    $("cutoff").textContent = payload.cutoff_date || "-";
    $("count").textContent = String(payload.count ?? items.length);

    function levelClass(level) {
      const cn = levelLabels[level] || level || "";
      if (level === "Critical" || cn === "严重") return "crit";
      if (level === "High" || cn === "高危") return "high";
      return "other";
    }
    function levelText(level) {
      return levelLabels[level] || level || "-";
    }
    function esc(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }
    function scoreText(v) {
      if (v === null || v === undefined || v === "" || v === -1) return "-";
      return String(v);
    }

    function renderList() {
      const list = $("list");
      $("listCount").textContent = String(filtered.length);
      if (!filtered.length) {
        list.innerHTML = '<div class="empty">没有匹配项</div>';
        return;
      }
      list.innerHTML = filtered.map((it) => {
        const id = it.mps_id || it.cve_id;
        const active = id === activeId ? " active" : "";
        return `
          <button class="item${active}" data-id="${esc(id)}" type="button">
            <div class="item-top">
              <span class="cve">${esc(it.cve_id || it.mps_id || "-")}</span>
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
            </div>
            <div class="title">${esc(it.title || "-")}</div>
            <div class="item-foot">
              <span>CVSS ${esc(scoreText(it.cvss_score))}</span>
              <span>${esc(it.published_time || "-")}</span>
              ${it.poc ? "<span>POC</span>" : ""}
            </div>
          </button>`;
      }).join("");
      list.querySelectorAll(".item").forEach((btn) => {
        btn.addEventListener("click", () => selectById(btn.dataset.id));
      });
    }

    function refsHtml(it) {
      const refs = Array.isArray(it.reference_url_list) ? it.reference_url_list : [];
      const links = [];
      if (it._source_page) links.push({ url: it._source_page, name: "OSCS 详情" });
      if (it.cve_id) links.push({ url: `https://nvd.nist.gov/vuln/detail/${it.cve_id}`, name: "NVD" });
      refs.forEach((r) => {
        if (r && r.url) links.push({ url: r.url, name: r.name || r.url });
      });
      const seen = new Set();
      const uniq = [];
      for (const l of links) {
        if (seen.has(l.url)) continue;
        seen.add(l.url);
        uniq.push(l);
      }
      if (!uniq.length) return '<div class="box">无参考链接</div>';
      return `<div class="refs">${uniq.map((l) =>
        `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name || l.url)}</a>`
      ).join("")}</div>`;
    }

    function articlesHtml(it) {
      const arts = Array.isArray(it.articles) ? it.articles : [];
      if (!arts.length) return "";
      return `<div class="section"><h3>相关说明</h3>${arts.map((a) => `
        <div class="article">
          <h4>${esc(a.title || "说明")}</h4>
          <p>${esc(a.content || "")}</p>
        </div>`).join("")}</div>`;
    }

    function renderDetail(it) {
      const detail = $("detail");
      if (!it) {
        detail.innerHTML = '<div class="empty">暂无数据</div>';
        return;
      }
      const pocUrls = Array.isArray(it.poc_url) ? it.poc_url : [];
      detail.innerHTML = `
        <div class="d-head">
          <div>
            <h1 class="d-title">${esc(it.title || "-")}</h1>
            <div class="ids">
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
              <span class="chip">${esc(it.cve_id || "无 CVE")}</span>
              <span class="chip">${esc(it.mps_id || "-")}</span>
              ${it.poc ? '<span class="chip">有 POC</span>' : ""}
              ${it.exp ? '<span class="chip">有 EXP</span>' : ""}
            </div>
          </div>
          <div class="actions">
            ${it._source_page ? `<a class="btn" href="${esc(it._source_page)}" target="_blank" rel="noopener">OSCS</a>` : ""}
            ${it.cve_id ? `<a class="btn" href="https://nvd.nist.gov/vuln/detail/${esc(it.cve_id)}" target="_blank" rel="noopener">NVD</a>` : ""}
          </div>
        </div>
        <div class="grid">
          <div class="stat"><div class="k">CVSS</div><div class="v">${esc(scoreText(it.cvss_score))}</div></div>
          <div class="stat"><div class="k">向量</div><div class="v">${esc(it.cvss_vector || "-")}</div></div>
          <div class="stat"><div class="k">CWE</div><div class="v">${esc(it.cwe || "-")}</div></div>
          <div class="stat"><div class="k">类型</div><div class="v">${esc(it.kind || it.kind_en || "-")}</div></div>
          <div class="stat"><div class="k">公开</div><div class="v">${esc(it.published_time || "-")}</div></div>
          <div class="stat"><div class="k">利用成本</div><div class="v">${esc(it.exploit_requirement_cost || "-")}</div></div>
          <div class="stat"><div class="k">可利用性</div><div class="v">${esc(it.exploitability || "-")}</div></div>
          <div class="stat"><div class="k">修复建议</div><div class="v">${esc(it.fix_suggestion || "-")}</div></div>
        </div>
        <div class="section"><h3>描述</h3><div class="box">${esc(it.description || "无描述")}</div></div>
        ${it.scope_influence ? `<div class="section"><h3>影响范围</h3><div class="box">${esc(it.scope_influence)}</div></div>` : ""}
        ${pocUrls.length ? `<div class="section"><h3>POC 链接</h3><div class="refs">${pocUrls.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join("")}</div></div>` : ""}
        <div class="section"><h3>参考链接</h3>${refsHtml(it)}</div>
        ${articlesHtml(it)}
      `;
    }

    function selectById(id) {
      const it = filtered.find((x) => (x.mps_id || x.cve_id) === id) ||
                 items.find((x) => (x.mps_id || x.cve_id) === id);
      if (!it) return;
      activeId = it.mps_id || it.cve_id;
      renderList();
      renderDetail(it);
      const btn = document.querySelector(`.item[data-id="${CSS.escape(activeId)}"]`);
      if (btn) btn.scrollIntoView({ block: "nearest" });
      history.replaceState(null, "", "#" + encodeURIComponent(activeId));
    }

    function applyFilter(q) {
      const query = (q || "").trim().toLowerCase();
      filtered = !query ? items.slice() : items.filter((it) => {
        const blob = [
          it.cve_id, it.mps_id, it.title, it.kind, it.kind_en, it.cwe, it.description, it.level
        ].map((x) => String(x || "").toLowerCase()).join(" ");
        return blob.includes(query);
      });
      renderList();
      if (filtered.length) {
        const still = filtered.some((x) => (x.mps_id || x.cve_id) === activeId);
        selectById(still ? activeId : (filtered[0].mps_id || filtered[0].cve_id));
      } else {
        activeId = null;
        renderDetail(null);
      }
    }

    $("search").addEventListener("input", (e) => applyFilter(e.target.value));

    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement !== $("search")) {
        e.preventDefault();
        $("search").focus();
        return;
      }
      if (!filtered.length) return;
      const idx = filtered.findIndex((x) => (x.mps_id || x.cve_id) === activeId);
      if (e.key === "ArrowDown") {
        e.preventDefault();
        const next = filtered[Math.min(filtered.length - 1, Math.max(0, idx) + 1)];
        selectById(next.mps_id || next.cve_id);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        const prev = filtered[Math.max(0, idx - 1)];
        selectById(prev.mps_id || prev.cve_id);
      }
    });

    const hashId = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    if (hashId && items.some((x) => (x.mps_id || x.cve_id) === hashId)) {
      activeId = hashId;
      renderList();
      selectById(hashId);
    } else if (items.length) {
      selectById(items[0].mps_id || items[0].cve_id);
    } else {
      renderList();
      renderDetail(null);
    }
  </script>
</body>
</html>
