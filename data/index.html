证不正确", "last_modified_time": "2026-10-03", "level": "High", "mps_id": "MPS-4mrw-c9ny", "poc": false, "poc_url": [], "published_time": "2026-10-03", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-4mrw-c9ny", "name": "https://www.oscs1024.com/hd/MPS-4mrw-c9ny"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-103065", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-103065"}, {"url": "https://patchstack.com/database/wordpress/plugin/kirki/vulnerability/wordpress-kirki-plugin-6-3-1-arbitrary-code-execution-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Kirki 未授权代码执行漏洞", "_translated": true, "_saved_at": "2026-10-03T22:36:17+00:00", "_first_saved_at": "2026-10-03T16:59:13+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-4mrw-c9ny"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-85515", "cvss": {"cvssv4": [{"source": "91579145-5d7b-4cc5-b925-a0262ff19630", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:Amber", "severity": "high", "base_score": 8.2}]}, "cvss_score": 8.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:Amber", "cwe": "CWE-354", "description": "Bouncy Castle for Java 是开源的 Java 密码学库，其 OpenPGP 模块 bcpg 用于实现 RFC 9580/OpenPGP 消息的加密、签名与验证。\n受影响版本中，当加密消息被截断而外层包长度字段保持原值时，BCPGInputStream.PartialInputStream 因缺少密文抛出 EOFException，BCPGInputStream.nextPacketTag() 将该异常当作正常的消息结束返回，上层包流提前终止。SEIPDv1 路径上，IntegrityProtectedInputStream 只在 close() 中校验修改检测码，而该方法此前仅在其 read() 返回 -1 时被触发，截断消息不会产生该条件，PGPEncryptedData.verify() 始终未执行，接收方拿到未经任何完整性校验的 CFB 解密明文，厂商实测 136 种单字节密文修改均被无异常接受；AEAD 路径上，字面数据包结束在 AEAD 块边界且消费方以小于一个块的增量读取时，BcAEADUtil 与 JceAEADUtil 无法读取 RFC 9580 sec. 5.13.2 中认证总明文长度的末尾消息标签，已认证块之后的包被静默丢弃，签名并加密的消息被读取为格式良好的未签名消息且不抛出任何异常。\n修复版本中通过三处改动切断上述链路：BcAEADUtil 与 JceAEADUtil 的 AEAD 解密流将底层 EOFException 重新抛出为普通 IOException，使其不再被 nextPacketTag() 当作消息结束处理；OpenPGPMessageInputStream.close() 主动关闭本层的完整性保护流，保证截断消息的 SEIPDv1 修改检测码仍被校验；IntegrityProtectedInputStream.close() 增加幂等保护，使该流在普通路径上被关闭两次时校验逻辑仅执行一次。", "effects": [{"comp_name": "BC-FJA", "ecosystem": "linux", "versions": [{"affected_version": "[1.0.7,1.0.14)", "min_fixed_version": "1.0.14", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[2.0.7,2.0.14.1)", "min_fixed_version": "2.0.14.1", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,2.1.14)", "min_fixed_version": "2.1.14", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "BC-LTS-JAVA", "ecosystem": "linux", "versions": [{"affected_version": "[2.73.0,2.73.13)", "min_fixed_version": "2.73.13", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "org.bouncycastle:bcpg-jdk18on", "ecosystem": "maven", "versions": [{"affected_version": "[1.74,1.86)", "min_fixed_version": "1.86", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "完整性检查值验证不恰当", "kind_en": "完整性检查值验证不当", "last_modified_time": "2026-10-03", "level": "High", "mps_id": "MPS-fykd-ic2n", "poc": false, "poc_url": [], "published_time": "2026-10-03", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-fykd-ic2n", "name": "https://www.oscs1024.com/hd/MPS-fykd-ic2n"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-85515", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-85515"}, {"url": "https://github.com/bcgit/bc-java/wiki/CVE%E2%80%902026%E2%80%9085515", "name": ""}, {"url": "https://github.com/bcgit/bc-java/commit/ab7a235d1c20e3da28ce77167a96b5c14025efa7", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "Bouncy Castle OpenPGP消息截断校验绕过漏洞", "_translated": true, "_saved_at": "2026-10-03T12:56:51+00:00", "_first_saved_at": "2026-10-03T12:56:51+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-fykd-ic2n"}, {"analysis_status": 0, "articles": [{"content": "由于应用程序或系统中存在敏感信息未经适当保护而被泄露给攻击者或未经授权的用户，这些敏感信息可能包括用户凭据、个人身份信息、敏感业务数据、系统配置信息等。信息暴露漏洞通常是由于设计、实施或配置错误引起的，例如不正确的访问控制、弱密码策略、缺乏加密、错误的日志处理等。", "title": "什么是未授权敏感信息泄露"}, {"content": "- 直接访问敏感信息：攻击者可以通过直接访问不正确配置或不受保护的资源来获取敏感信息，如通过公开可访问的URL、未经授权的文件目录访问等。\n- 越权访问：攻击者可能利用访问控制错误或不正确的权限配置来获取他们没有权限访问的敏感信息。\n- 错误信息披露：应用程序在错误处理过程中可能泄露敏感信息，例如将错误消息中的敏感数据返回给客户端或显示在日志文件中。\n- 信息泄露通过响应：攻击者可能利用应用程序在响应中不正确地包含敏感信息，如通过网页源代码、响应头部或响应消息体中的敏感数据。", "title": "未授权敏感信息泄露常见的攻击方式"}, {"content": "- 访问控制：确保只有经过授权的用户能够访问敏感信息，使用强大的身份验证和授权机制。\n- 数据加密：对于敏感信息，使用适当的加密算法对数据进行加密，包括数据传输和存储过程中的加密。\n- 错误处理和日志安全：正确处理错误情况，避免在错误消息中暴露敏感信息。同时，确保日志记录功能的安全性，避免将敏感信息记录在日志文件中。\n- 安全配置和最佳实践：遵循安全最佳实践，对应用程序、服务器和系统进行适当的配置，包括访问控制、权限管理、密码策略等。\n- 审计和监控：实施日志审计和监控机制，及时检测和响应任何异常活动或潜在的信息暴露事件。\n- 安全开发实践：在应用程序开发过程中，进行安全代码审查、漏洞扫描和安全测试，以及敏感信息的正确处理和保护。", "title": "如何预防未授权敏感信息泄露"}], "cnvd_id": "", "cve_id": "CVE-2026-104476", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "medium", "base_score": 5.9}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:H/AT:P/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.2}]}, "cvss_score": 8.2, "cvss_vector": "CVSS:4.0/AV:N/AC:H/AT:P/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-200", "description": "Backdrop CMS 是基于 PHP 的开源内容管理系统，由 Drupal 分支而来，其核心配置模块支持将站点全部配置导出为压缩归档供管理员下载。\n受影响版本中，具备配置导出权限的用户执行全量导出时，config_download_full_export() 在 file_transfer() 之后才调用 file_unmanaged_delete() 删除临时归档，而 file_transfer() 发送文件后会终止请求，删除逻辑不会执行，config.tar.gz 归档遗留在服务器临时目录；同时 config_file_download() 钩子对 temporary://config.tar.gz 返回下载头时未校验用户权限，未认证攻击者可通过 /system/temporary/config.tar.gz 直接下载该归档，获取包含敏感设置的完整站点配置。\n修复版本中通过在 file_transfer() 之前调用 backdrop_register_shutdown_function() 注册关机删除函数，确保导出归档在传输结束后从临时目录删除，并为 config_file_download() 增加 synchronize configuration 权限校验，未授权用户请求该归档时不再返回下载内容。", "effects": [{"comp_name": "backdrop:backdrop", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.34.5)", "min_fixed_version": "1.34.5", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[1.35.0,1.35.1)", "min_fixed_version": "1.35.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "未授权敏感信息泄露", "kind_en": "向未经授权的行为者泄露敏感信息", "last_modified_time": "2026-10-03", "level": "High", "mps_id": "MPS-kmia-1re7", "poc": false, "poc_url": [], "published_time": "2026-10-03", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-kmia-1re7", "name": "https://www.oscs1024.com/hd/MPS-kmia-1re7"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-104476", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-104476"}, {"url": "https://github.com/backdrop/backdrop/commit/1ae67061d9d487bb6cb3b8611191354052f34749", "name": "Patch Commit"}, {"url": "https://backdropcms.org/security/backdrop-sa-core-2026-006", "name": "BACKDROP-SA-CORE-2026-006"}, {"url": "https://github.com/backdrop/backdrop", "name": ""}, {"url": "https://www.vulncheck.com/advisories/backdrop-cms-before-1.35.1-information-disclosure-via-configuration-export-archive", "name": "VulnCheck Advisory: Backdrop CMS before 1.35.1 Information Disclosure via Configuration Export Archive"}], "scope_influence": "", "tags": ["应用软件"], "title": "Backdrop CMS 配置导出信息泄露漏洞", "_translated": true, "_saved_at": "2026-10-03T01:38:24+00:00", "_first_saved_at": "2026-10-03T01:38:24+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-kmia-1re7"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-105119", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:R/S:U/C:H/I:H/A:N", "severity": "medium", "base_score": 6.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:H/AT:P/PR:N/UI:P/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.6}]}, "cvss_score": 7.6, "cvss_vector": "CVSS:4.0/AV:N/AC:H/AT:P/PR:N/UI:P/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-285", "description": "OpenAM 是 OpenIdentityPlatform 开源的访问管理与单点登录平台，提供 OAuth 2.0 授权服务器与 OpenID Connect Provider 能力，其 openam-oauth2 模块负责授权端点与令牌端点的请求处理。\n受影响版本中，OAuth2 Provider 的 PKCE 强制（Code Verifier Parameter Required 属性，自 16.1.1 起默认开启）仅在授权请求的 response_type 精确等于 code 时生效，CodeVerifierValidator 用字符串精确比较判断是否为授权码请求，code token、code id_token、code token id_token 等 OpenID Connect 混合流因此绕过 code_challenge 强制要求，签发的授权码未绑定任何挑战；令牌端点对未绑定挑战的授权码只拒绝缺失 code_verifier 的请求而不校验其取值，攻击者截获混合流签发的授权码后可使用任意非空 code_verifier 兑换公共客户端的令牌。\n修复版本中通过两项改动切断该利用链：CodeVerifierValidator 改为将 response_type 按空白拆分为集合并判断是否包含 code，混合流同样被强制要求携带 code_challenge，含 token 或 id_token 的请求错误返回在重定向 fragment 中；AuthorizationCodeGrantTypeHandler 在强制开启时对未绑定挑战的授权码直接拒绝兑换（fail closed），对已绑定挑战的授权码要求非空 code_verifier，缺失的 code_challenge_method 按 RFC 7636 默认视为 plain。", "effects": [{"comp_name": "OpenAM", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,16.1.3)", "min_fixed_version": "16.1.3", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "org.openidentityplatform.openam:openam-oauth2", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,16.1.3)", "min_fixed_version": "16.1.3", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权机制不恰当", "kind_en": "不当授权", "last_modified_time": "2026-10-03", "level": "High", "mps_id": "MPS-btmj-cphi", "poc": false, "poc_url": [], "published_time": "2026-10-03", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-btmj-cphi", "name": "https://www.oscs1024.com/hd/MPS-btmj-cphi"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-105119", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-105119"}, {"url": "https://github.com/OpenIdentityPlatform/OpenAM/security/advisories/GHSA-5p2f-7vcr-6vfh", "name": "GitHub Security Advisory (GHSA-5p2f-7vcr-6vfh)"}, {"url": "https://www.vulncheck.com/advisories/openam-before-16.1.3-pkce-enforcement-bypass-via-oauth-2.0-hybrid-flows", "name": "VulnCheck Advisory: OpenAM before 16.1.3 PKCE Enforcement Bypass via OAuth 2.0 Hybrid Flows"}], "scope_influence": "", "tags": ["java", "开源"], "title": "OpenAM PKCE 强制校验绕过", "_translated": true, "_saved_at": "2026-10-03T22:36:18+00:00", "_first_saved_at": "2026-10-03T16:59:14+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-btmj-cphi"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-104861", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-1333", "description": "probe-image-size 是开源 npm 组件（MIT 协议），用于在不完整下载文件的前提下获取 JPG、PNG、GIF、WebP、SVG 等图片的尺寸，常用于上传校验、图片代理与链接预览等场景。\n受影响版本中，lib/parse_sync/svg.js 与 lib/parse_stream/svg.js 使用未锚定的搜索型正则 /\u003c[-_.:a-zA-Z0-9][^\u003e]*\u003e/ 提取 SVG 头部，当输入包含大量缺少闭合 \"\u003e\" 的 \"\u003c\" 字符时，正则引擎在每个 \"\u003c\" 位置重启 [^\u003e]* 扫描直至输入末尾，耗时随输入长度呈平方级增长；同步路径将整个 Buffer 无上限地转换为字符串后执行匹配，流式路径虽在 64KB 处封顶，却在每个数据块到达时对全部已累积数据重复执行 parseSvg()，攻击者可通过控制发送节奏放大重复扫描次数。攻击者向 probe.sync()、probe(stream) 或 probe(url) 提交此类数据能够占满 CPU 并阻塞 Node.js 事件循环，造成拒绝服务。\n修复版本中通过将 SVG 头部解析重构为共享模块 lib/common/svg_header.js 解决该问题，新实现的 PROLOG_RE、ROOT_RE 等正则全部以 ^ 锚定并在已知偏移处应用，消除了从每个位置重启扫描的回溯路径；同步与流式路径统一引入 10KB（MAX_DATA_LENGTH）输入上限，流式解析改为仅在数据块出现 \"\u003e\" 时对封顶后的累积数据解析一次，切断了平方级放大的因果链，恶意输入无法再长时间占用事件循环。", "effects": [{"comp_name": "probe-image-size", "ecosystem": "npm", "versions": [{"affected_version": "(-∞,7.4.0)", "min_fixed_version": "7.4.0", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "ReDoS", "kind_en": "正则表达式复杂性低效", "last_modified_time": "2026-10-03", "level": "High", "mps_id": "MPS-9cth-edka", "poc": false, "poc_url": [], "published_time": "2026-10-03", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-9cth-edka", "name": "https://www.oscs1024.com/hd/MPS-9cth-edka"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-104861", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-104861"}, {"url": "https://github.com/nodeca/probe-image-size/security/advisories/GHSA-gjj5-9665-rwrc", "name": "https://github.com/nodeca/probe-image-size/security/advisories/GHSA-gjj5-9665-rwrc"}, {"url": "https://github.com/nodeca/probe-image-size/commit/60cc96ac0b671e79e328213d0a8e831312b09e84", "name": "https://github.com/nodeca/probe-image-size/commit/60cc96ac0b671e79e328213d0a8e831312b09e84"}, {"url": "https://github.com/nodeca/probe-image-size/commit/9b74656d6f973cc59ea2ab1375c0d88390a402ad", "name": "https://github.com/nodeca/probe-image-size/commit/9b74656d6f973cc59ea2ab1375c0d88390a402ad"}, {"url": "https://github.com/nodeca/probe-image-size/commit/c032aefabdecf5cb50548ab9ba175db56353078f", "name": "https://github.com/nodeca/probe-image-size/commit/c032aefabdecf5cb50548ab9ba175db56353078f"}, {"url": "https://github.com/nodeca/probe-image-size/releases/tag/7.4.0", "name": "https://github.com/nodeca/probe-image-size/releases/tag/7.4.0"}], "scope_influence": "", "tags": ["npm", "开源"], "title": "probe-image-size拒绝服务漏洞", "_translated": true, "_saved_at": "2026-10-02T18:53:12+00:00", "_first_saved_at": "2026-10-02T18:53:12+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-9cth-edka"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-97337", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "cwe": "CWE-862", "description": "Simple Membership 是 wp.insider 开发的 WordPress 会员管理插件（GPLv2 开源），用于会员注册、付费内容保护与订阅管理，通过 wordpress.org 官方插件库分发。\n受影响版本中，前台 init 阶段 SwpmInitTimeTasks::check_and_do_email_activation() 将 swpm_email_activation 与 swpm_resend_activation_email 请求分发给 SwpmFrontRegistration::handle_email_activation() 与 resend_activation_email()，两个端点仅按 $_GET['swpm_member_id'] 定位会员并检查 account_state，缺少认证、nonce、能力与归属校验；SwpmRegistration::send_reg_email() 第 75 行优先以 $_POST['email'] 作为收件人并覆盖会员注册地址，激活数据 swpm_email_activation_data_usr_{member_id} 还以可逆加密保存注册明文密码。未认证攻击者可指定待激活会员 ID，将对方的激活邮件及包含用户名与明文密码的注册完成邮件重定向到任意地址，并利用邮件中的激活链接在未经会员同意的情况下激活该账户。\n修复版本中通过删除 send_reg_email() 内的 $_POST['email'] 覆盖逻辑、收件人固定为经 is_email() 校验的会员注册地址，并新增 SwpmEmailActivation 类统一处理激活令牌：wp_generate_password 生成 32 位随机令牌、24 小时有效期校验、hash_equals 恒时比较与按原始值条件删除的原子化消费防并发重放，同时以 allow_public_resend() 对公开重发请求限频并对缺失、已激活、限频返回一致提示以防会员枚举，注册与激活邮件不再包含明文密码。", "effects": [{"comp_name": "simple-membership", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,4.8.4)", "min_fixed_version": "4.8.4", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-10-03", "level": "High", "mps_id": "MPS-dqnh-oxv8", "poc": false, "poc_url": [], "published_time": "2026-10-03", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-dqnh-oxv8", "name": "https://www.oscs1024.com/hd/MPS-dqnh-oxv8"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-97337", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-97337"}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/ae2b6c4c-7dd6-41e7-8b8d-c09aa7fa660b?source=cve", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/simple-membership/tags/4.8.3/classes/class.swpm-registration.php#L75", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/simple-membership/tags/4.8.3/classes/class.swpm-front-registration.php#L850", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/simple-membership/tags/4.8.3/classes/class.swpm-front-registration.php#L774", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/simple-membership/tags/4.8.3/classes/class.swpm-init-time-tasks.php#L167", "name": ""}, {"url": "https://plugins.trac.wordpress.org/changeset?reponame=\u0026old=3716437%40simple-membership\u0026new=3716437%40simple-membership", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Simple Membership激活邮件劫持漏洞", "_translated": true, "_saved_at": "2026-10-03T07:27:08+00:00", "_first_saved_at": "2026-10-03T07:27:08+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-dqnh-oxv8"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-104859", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:L/AC:L/AT:P/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.3}]}, "cvss_score": 7.3, "cvss_vector": "CVSS:4.0/AV:L/AC:L/AT:P/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-78", "description": "Nx 是 Nrwl 开源的 monorepo 构建与发布管理工具，@nx/docker 为其官方 Docker 插件，用于容器项目的镜像构建、版本管理与发布。\n受影响版本中，@nx/docker 发布管道把 docker tag、docker images 镜像检查与 docker push 拼接成 shell 命令字符串，release.docker.repositoryName、registryUrl、--dockerVersion 与 NX_DOCKER_IMAGE_REF 等取值未经转义直接内插后交给 /bin/sh -c 执行，攻击者通过 Pull Request 或仓库配置变更植入 shell 语法，维护者或 CI 运行 nx release version、nx release publish 时会以发布任务权限执行任意命令，导致镜像仓库凭据与云令牌泄露，--dry-run 也无法阻止发布前置检查中的注入命令执行。\n修复版本中通过把上述命令改为 execFile、execFileSync 的参数数组调用并移除 shell 层，镜像引用中的元字符保留在单一参数内，无法再拼接出第二条命令，升级 22.7.8、23.1.1 及以上版本可获得修复。", "effects": [{"comp_name": "@nx/docker", "ecosystem": "npm", "versions": [{"affected_version": "[23.0.0,23.1.1)", "min_fixed_version": "23.1.1", "repository": "npm", "solutions": [], "upstream": true}, {"affected_version": "[21.4.0,22.7.8)", "min_fixed_version": "22.7.8", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-10-03", "level": "High", "mps_id": "MPS-miyz-kptu", "poc": false, "poc_url": [], "published_time": "2026-10-03", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-miyz-kptu", "name": "https://www.oscs1024.com/hd/MPS-miyz-kptu"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-104859", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-104859"}, {"url": "https://github.com/nrwl/nx/security/advisories/GHSA-6vc5-vf29-ffr2", "name": "https://github.com/nrwl/nx/security/advisories/GHSA-6vc5-vf29-ffr2"}, {"url": "https://github.com/nrwl/nx/pull/36505", "name": "https://github.com/nrwl/nx/pull/36505"}, {"url": "https://github.com/nrwl/nx/commit/6d60eed061f050e0d5af509a1f5a07c707f09865", "name": "https://github.com/nrwl/nx/commit/6d60eed061f050e0d5af509a1f5a07c707f09865"}, {"url": "https://github.com/nrwl/nx/commit/b587441fd8da28c5db37edb0826554e0060dc81b", "name": "https://github.com/nrwl/nx/commit/b587441fd8da28c5db37edb0826554e0060dc81b"}], "scope_influence": "", "tags": ["npm", "开源"], "title": "@nx/docker 命令注入漏洞", "_translated": true, "_saved_at": "2026-10-02T18:53:10+00:00", "_first_saved_at": "2026-10-02T18:53:10+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-miyz-kptu"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-96564", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "cwe": "CWE-79", "description": "SEOPress（插件标识 wp-seopress）是运行于 WordPress 的开源 SEO 插件，提供站点元数据优化、XML 站点地图以及 Google Analytics 4 与 Matomo 统计跟踪等功能，经 WordPress 官方插件目录分发。\n受影响版本中，插件的 GA4 与 Matomo 跟踪脚本构建逻辑在启用 Track Authors 自定义维度后，将 get_the_author() 返回的作者显示名称以字符串拼接方式写入页面头部的内联 JavaScript（inc/functions/options-google-analytics.php 与 inc/functions/options-matomo.php），该显示名称由用户自行设置且未经任何转义；攻击者在允许发布公开 singular 内容的站点（如 bbPress 论坛）将含 JavaScript 代码的字符串设为显示名称后，恶意代码随跟踪脚本输出到对应页面，任何访问该页面的用户浏览器均会执行，形成存储型 XSS。\n修复版本中通过新增 seopress_js_string() 辅助函数对动态值执行 wp_json_encode 编码（启用 JSON_HEX_TAG、JSON_HEX_AMP、JSON_HEX_APOS、JSON_HEX_QUOT 标志），10.3 中 GA4 与 Matomo 两处作者显示名称拼接均改为经该函数编码后输出，使显示名称无法逃逸 JS 字符串字面量或闭合 script 标签，从而切断注入路径。", "effects": [{"comp_name": "wp-seopress", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,10.3)", "min_fixed_version": "10.3", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-10-03", "level": "High", "mps_id": "MPS-0zcq-52dx", "poc": false, "poc_url": [], "published_time": "2026-10-03", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-0zcq-52dx", "name": "https://www.oscs1024.com/hd/MPS-0zcq-52dx"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-96564", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-96564"}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/8f5f5b75-abaf-4e4b-8509-f8b569519166?source=cve", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/wp-seopress/tags/10.2/inc/functions/options-google-analytics.php#L635", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/wp-seopress/tags/10.2/inc/functions/options-matomo.php#L118", "name": ""}, {"url": "https://plugins.trac.wordpress.org/changeset?reponame=\u0026old=3722789%40wp-seopress\u0026new=3722789%40wp-seopress", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "SEOPres 的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-97341", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "cwe": "CWE-79", "description": "Visitor Traffic Real Time Statistics 是 wp-buy 开发的 WordPress 开源流量统计插件，用于在后台仪表盘实时展示访客 IP、国家、城市、浏览器与访问次数。\n受影响版本中，无需登录的 wp_ajax_nopriv_ahcfree_track_visitor 接口经 ahcfree_get_client_ip_address() 读取攻击者伪造的 X-Real-IP 等转发头，取值仅做 sanitize_text_field 清洗、未校验 IP 格式，载荷中的尖括号被实体编码后经 WPHitsCounter 写入 ahc_hits 与 ahc_recent_visitors 表；仪表盘输出时 esc_attr()、esc_html() 以 double_encode=false 处理，已编码实体原样进入页面，jQuery .data() 读取 data-hitipaddress 等属性时还原出标签字符串，ahcfree_js_scripts.js 将其拼入 headerHtml 后经 .html() 与 tempDiv.innerHTML 写入 DOM，管理员打开统计页面时存储型 DOM XSS 随之执行。\n修复版本中通过在 8.17 新增 ahcfree_esc_html_strict()、ahcfree_esc_attr_strict()，以 double_encode=true 对既有实体再次编码，新增 ahcfree_safe_stored_ip() 仅放行合法 IP，升级时自动清理库中遗留的非法 IP 记录，前端 HTML 转文本改用基于 DOMParser 的 ahcfreeStripHtml() 替换全部 tempDiv.innerHTML 写入，使实体编码载荷无法再被还原为可执行标记。", "effects": [{"comp_name": "visitors-traffic-real-time-statistics", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,8.17)", "min_fixed_version": "8.17", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-10-03", "level": "High", "mps_id": "MPS-bc25-vdie", "poc": false, "poc_url": [], "published_time": "2026-10-03", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-bc25-vdie", "name": "https://www.oscs1024.com/hd/MPS-bc25-vdie"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-97341", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-97341"}, {"url": "https://www.wordfence.com/ 识为 unlimited-elements-for-elementor，提供上百个小部件、动态列表模板引擎与页面构建能力，通过 WordPress.org 官方目录分发。\n受影响版本中，模板引擎把 Twig 导出函数 putPostGetVar 接收的 GET/POST 参数经 sanitize_text_field 处理后，通过 uelm_echo（原生 echo）直接写回页面；sanitize_text_field 只剔除 HTML 标签、保留引号，该输出通常位于小部件模板的 HTML 属性或 JS 字符串上下文中，未登录攻击者构造携带恶意参数的链接，诱使具备管理权限的登录用户访问，便能在其浏览器会话中注入并执行脚本。\n修复版本中通过在输出前调用 esc_attr 对参数值执行 HTML 属性上下文转义，并将默认值回退条件由 empty($value) 收紧为与空字符串、null 的严格比较；同时该版本把框架调试输出 dmp() 统一改为经 esc_html 与 wp_kses 转义输出，模板引擎注册 js 模板时自动把字符串内的 |raw 过滤器替换为 |e('js')，切断了请求参数未转义进入页面的反射路径。", "effects": [{"comp_name": "unlimited-elements-for-elementor", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.0.21)", "min_fixed_version": "2.0.21", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-10-03", "level": "High", "mps_id": "MPS-3pgk-bqmt", "poc": false, "poc_url": [], "published_time": "2026-10-03", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-3pgk-bqmt", "name": "https://www.oscs1024.com/hd/MPS-3pgk-bqmt"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-103342", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-103342"}, {"url": "https://patchstack.com/database/wordpress/plugin/unlimited-elements-for-elementor/vulnerability/wordpress-unlimited-elements-for-elementor-free-widgets-addons-templates-plugin-2-0-20-cross-site-scripting-xss-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Unlimited Elements 反射型XSS", "_translated": true, "_saved_at": "2026-10-03T22:36:16+00:00", "_first_saved_at": "2026-10-03T16:59:12+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-3pgk-bqmt"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-104478", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:L", "severity": "high", "base_score": 7.1}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:L/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:L/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-22", "description": "Formwork 是 getformwork 团队开源的 PHP 轻量级 flat-file CMS，以 composer 包 getformwork/formwork 发布，用于搭建小型网站并提供后台管理面板。\n受影响版本中，后台面板的备份下载与删除路由 /backup/download/{backup:base64}/ 和 /backup/delete/{backup:base64}/ 将 base64 解码后的用户输入交给 BackupController::download() 与 delete()，二者依赖 PHP 内置 basename() 过滤文件名，而 Linux 下 basename() 只按 / 分隔、不识别反斜杠，携带 ..\\..\\..\\..\\etc\\passwd 形式的反斜杠穿越串可原样通过过滤；随后 FileSystem::joinPaths() 调用的 Path::normalize() 把反斜杠同样视为路径分隔符并消除 .. 段，最终解析出备份目录之外的文件路径，经 FileResponse 读取任意文件或经 FileSystem::delete() 删除任意文件。\n修复版本中通过收紧备份文件的边界校验解决该问题：download() 与 delete() 先对 system.backup.path 做 Path::normalize，再校验拼接结果的 Path::dirname() 与备份目录一致，只有仍位于备份目录内的文件才被下载或删除；make() 改用新增的 Path::basename()（先把反斜杠归一为 /）生成文件名，并在 formwork/src/Utils/Path.php 中补充 dirname() 与 basename() 辅助方法，切断反斜杠穿越绕过。", "effects": [{"comp_name": "getformwork/formwork", "ecosystem": "composer", "versions": [{"affected_version": "[2.0.0,2.3.13)", "min_fixed_version": "2.3.13", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-10-03", "level": "High", "mps_id": "MPS-5nd4-3ilx", "poc": false, "poc_url": [], "published_time": "2026-10-03", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-5nd4-3ilx", "name": "https://www.oscs1024.com/hd/MPS-5nd4-3ilx"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-104478", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-104478"}, {"url": "https://github.com/getformwork/formwork/commit/89e7821a6fcee89474cd401b3dde0c1dccb0687f", "name": "Patch Commit"}, {"url": "https://github.com/getformwork/formwork", "name": ""}, {"url": "https://www.vulncheck.com/advisories/formwork-before-2.3.13-path-traversal-via-backupcontroller-download-and-delete", "name": "VulnCheck Advisory: Formwork before 2.3.13 Path Traversal via BackupController Download and Delete"}], "scope_influence": "", "tags": ["php", "开源"], "title": "Formwork 备份模块路径穿越漏洞", "_translated": true, "_saved_at": "2026-10-03T01:38:22+00:00", "_first_saved_at": "2026-10-03T01:38:22+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-5nd4-3ilx"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-105050", "cvss": {"cvssv4": [{"source": "cve@mitre.org", "vector": "CVSS:4.0/AV:L/AC:L/AT:P/PR:N/UI:A/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "hi estion": "建议修复", "kind": "通过用户控制密钥绕过授权机制", "kind_en": "通过用户控制的密钥绕过授权", "last_modified_time": "2026-10-04", "level": "High", "mps_id": "MPS-j7ew-6pxs", "poc": false, "poc_url": [], "published_time": "2026-10-04", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-j7ew-6pxs", "name": "https://www.oscs1024.com/hd/MPS-j7ew-6pxs"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-96451", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-96451"}, {"url": "https://patchstack.com/database/wordpress/plugin/ultimate-member/vulnerability/wordpress-ultimate-member-plugin-2-13-1-privilege-escalation-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Ultimate Member权限提升漏洞", "_translated": true, "_saved_at": "2026-10-03T22:36:15+00:00", "_first_saved_at": "2026-10-03T16:59:11+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-j7ew-6pxs"}, {"analysis_status": 0, "articles": [{"content": "- 程序未正确处理用户上传的文件，从而导致程序可以读取、处理或存储未经授权的文件\n", "title": "什么是任意文件上传"}, {"content": "- 欺骗攻击：攻击者可以通过发送伪造的文件来欺骗程序，从而导致程序读取、处理或存储未经授权的文件。\n- 文件格式攻击：攻击者可以通过选择特定的文件格式，例如压缩文件或 ZIP 文件，从而利用上传的文件来篡改程序的执行结果或窃取程序中的重要数据。\n", "title": "任意文件上传常见的攻击方式"}, {"content": "- 使用安全文件传输协议 (FTP):使用安全 FTP 协议可以确保上传的文件格式、大小、权限等符合预期，同时可以防止文件读取、篡改或存储漏洞。\n- 使用文件上传过滤器：使用文件上传过滤器可以过滤上传的文件，以确保文件的格式、大小、权限等符合预期，同时可以防止文件读取、篡改或存储漏洞。\n- 使用白名单机制：使用白名单机制可以只允许特定的文件格式、大小、权限等存在的文件上传，从而防止非法文件的上传和攻击。\n- 定期更新和升级程序：定期更新和升级程序可以修复已知的漏洞，并增强程序的安全性。", "title": "如何预防任意文件上传"}], "cnvd_id": "", "cve_id": "CVE-2026-105123", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-434", "description": "W（vincent-peugnet/wcms）是一款采用 AGPL-3.0 协议的开源 PHP 轻量级 CMS，用于搭建 wiki、文档与静态站点，内置媒体管理接口用于上传和维护图片、附件等资源。\n受影响版本中，POST /api/v0/media/upload/[*:path] 路由对应的 Controllerapimedia::upload() 将路径参数 rawurldecode 后直接拼接 MEDIA_DIR，交给 Fs::dircheck()（仅创建或确认目录存在，无边界校验）与 Fs::writefile() 把请求体内容写入磁盘，全程无扩展名与 MIME 校验（Media::MEDIA_EXT 将 php 扩展名归类为 CODE 且无拒绝逻辑），也未验证解析后的路径仍位于媒体目录内；持有编辑者账号的攻击者可上传 .php 文件由 Web 服务器直接执行，或使用编码的 ../ 序列把任意内容写入媒体目录之外的路径，配合 DELETE /api/v0/media/[*:path] 还可删除任意文件，最终造成远程代码执行。\n修复版本中通过，建议对上传扩展名实施白名单并拒绝 php、phtml、phar、.htaccess 等危险类型，使用 realpath 前缀校验将媒体读写限制在媒体目录内，并在 Web 服务器层面禁止执行媒体目录中的脚本，以降低被利用风险。", "effects": [{"comp_name": "wcms", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,3.18.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "任意文件上传", "kind_en": "危险类型文件无限制上传", "last_modified_time": "2026-10-04", "level": "High", "mps_id": "MPS-evcj-0bh9", "poc": false, "poc_url": [], "published_time": "2026-10-04", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-evcj-0bh9", "name": "https://www.oscs1024.com/hd/MPS-evcj-0bh9"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-105123", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-105123"}, {"url": "https://github.com/vincent-peugnet/wcms/issues/662", "name": "GitHub Issue #662"}, {"url": "https://github.com/vincent-peugnet/wcms", "name": ""}, {"url": "https://github.com/vincent-peugnet/wcms/blob/cda5bcdb95dbdb1e804fdfe0e5fd2e2b2f8a90e2/app/class/Controllerapimedia.php#L24-L44", "name": ""}, {"url": "https://github.com/vincent-peugnet/wcms/blob/cda5bcdb95dbdb1e804fdfe0e5fd2e2b2f8a90e2/app/class/Media.php#L98", "name": ""}, {"url": "https://www.vulncheck.com/advisories/w-wcms-through-3.18.0-rce-and-arbitrary-file-write-via-media-upload-api", "name": "VulnCheck Advisory: W (wcms) through 3.18.0 RCE and Arbitrary File Write via Media Upload API"}], "scope_influence": "", "tags": ["应用软件"], "title": "wcms 任意文件写入漏洞", "_translated": true, "_saved_at": "2026-10-04T02:19:32+00:00", "_first_saved_at": "2026-10-04T02:19:32+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-evcj-0bh9"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "cnvd_id": "", "cve_id": "CVE-2026-105126", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.2}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-269", "description": "LaraDashboard 是一个基于 Laravel 的开源内容管理与后台管理面板（PHP），提供角色权限、用户管理、模块安装与核心升级等站点管理能力。\n受影响版本中，RoleController 的 update() 与 destroy() 仅在 config('app.demo_mode') 为真时拦截名为 Superadmin 的角色，而默认部署 DEMO_MODE 为 false，该保护不生效；RolePolicy::update 与 delete 只校验 role.edit、role.delete 权限，未排除 Superadmin 角色，请求随后进入 RolesService::updateRole，直接修改角色名并同步任意权限。具备 role.edit 的管理员可通过 PUT /admin/roles/{id} 将自身角色改名为 Superadmin 或附加 user.login_as、user.delete 权限；系统在 BasePolicy::before 与核心升级 UploadRequest::authorize 中以 hasRole('Superadmin') 按名称识别超级管理员，改名后的角色由此获得核心升级包上传、模块安装等超管功能并可达代码执行，攻击者还可借助 user.login_as 登录接管任意账户。\n修复版本中通过在 1.4.8 引入持久的 roles.is_super_admin 标志并以迁移回填 Superadmin 角色，新增 Role::isSuperAdminRole() 与 User::isSuperAdmin() 替代按角色名的判定，RolePolicy::update 与 delete 对超管角色直接拒绝，新增 RolePermissionGuard::filterGrantablePermissions 过滤非超管编辑者提交的 user.login_as、user.delete 权限，UserPolicy::loginAs 限制为超管用户，切断了角色改名与特权铸造链路。", "effects": [{"comp_name": "laradashboard", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.4.8)", "min_fixed_version": "1.4.8", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-10-04", "level": "High", "mps_id": "MPS-h7q9-s5ef", "poc": false, "poc_url": [], "published_time": "2026-10-04", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-h7q9-s5ef", "name": "https://www.oscs1024.com/hd/MPS-h7q9-s5ef"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-105126", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-105126"}, {"url": "https://github.com/laradashboard/laradashboard/security/advisories/GHSA-555v-6rfr-r969", "name": "GitHub Security Advisory (GHSA-555v-6rfr-r969)"}, {"url": "https://github.com/laradashboard/laradashboard/blob/v1.4.2/app/Http/Controllers/Backend/RoleController.php#L144", "name": ""}, {"url": "https://github.com/laradashboard/laradashboard/blob/v1.4.2/app/Http/Controllers/Backend/RoleController.php#L180", "name": ""}, {"url": "https://github.com/laradashboard/laradashboard/blob/v1.4.2/app/Policies/RolePolicy.php#L39-L50", "name": ""}, {"url": "https://github.com/laradashboard/laradashboard/blob/v1.4.2/app/Http/Requests/CoreUpgrade/UploadRequest.php#L23", "name": ""}, {"url": "https://github.com/laradashboard/laradashboard/pull/344", "name": ""}, {"url": "https://github.com/laradashboard/laradashboard/commit/286f150e4d0c924ec1ce7eb256b2326e871e9517", "name": ""}, {"url": "https://github.com/laradashboard/laradashboard/releases/tag/v1.4.8", "name": "laradashboard v1.4.8 Release Notes"}, {"url": "https://github.com/laradashboard/laradashboard", "name": ""}, {"url": "https://www.vulncheck.com/advisories/laradashboard-before-1.4.8-privilege-escalation-via-superadmin-role-tampering", "name": "VulnCheck Advisory: LaraDashboard before 1.4.8 Privilege Escalation via Superadmin Role Tampering"}], "scope_influence": "", "tags": ["应用软件"], "title": "LaraDashboard角色篡改提权漏洞", "_translated": true, "_saved_at": "2026-10-04T02:19:31+00:00", "_first_saved_at": "2026-10-04T02:19:31+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-h7q9-s5ef"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当 High", "mps_id": "MPS-uvo9-tgcm", "poc": false, "poc_url": [], "published_time": "2026-10-04", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-uvo9-tgcm", "name": "https://www.oscs1024.com/hd/MPS-uvo9-tgcm"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-105129", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-105129"}, {"url": "https://github.com/laradashboard/laradashboard/security/advisories/GHSA-xgmw-7ppx-v7hq", "name": "GitHub Security Advisory (GHSA-xgmw-7ppx-v7hq)"}, {"url": "https://github.com/laradashboard/laradashboard/blob/v1.4.2/app/Http/Controllers/Api/SettingController.php#L23-L50", "name": ""}, {"url": "https://github.com/laradashboard/laradashboard/blob/v1.4.2/app/Http/Resources/SettingResource.php#L17-L26", "name": ""}, {"url": "https://github.com/laradashboard/laradashboard/blob/v1.4.2/app/Policies/SettingPolicy.php#L15-L34", "name": ""}, {"url": "https://github.com/laradashboard/laradashboard/pull/340", "name": ""}, {"url": "https://github.com/laradashboard/laradashboard/commit/532a10efd2cc1338ef3f59236f195df859b2dbe3", "name": ""}, {"url": "https://github.com/laradashboard/laradashboard/releases/tag/v1.4.8", "name": "laradashboard v1.4.8 Release Notes"}, {"url": "https://github.com/laradashboard/laradashboard", "name": ""}, {"url": "https://www.vulncheck.com/advisories/laradashboard-before-1.4.8-incorrect-authorization-exposes-secrets-via-settings-api", "name": "VulnCheck Advisory: LaraDashboard before 1.4.8 Incorrect Authorization Exposes Secrets via Settings API"}], "scope_influence": "", "tags": ["php", "开源"], "title": "LaraDashboard 设置接口凭据泄露", "_translated": true, "_saved_at": "2026-10-04T02:19:30+00:00", "_first_saved_at": "2026-10-04T02:19:30+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-uvo9-tgcm"}]}</script>
  <script>
    const payload = JSON.parse(document.getElementById("payload").textContent);
    const levelLabels = payload.level_labels || {};
    const items = payload.items || [];
    let filtered = items.slice();
    let activeId = null;

    const $ = (id) => document.getElementById(id);
    $("generatedAt").textContent = payload.generated_at || "-";
    $("retention").textContent = payload.retention_days ?? "-";
    $("cutoff").textContent = payload.cutoff_date || "-";
    $("count").textContent = String(payload.count ?? items.length);

    function levelClass(level) {
      const cn = levelLabels[level] || level || "";
      if (level === "Critical" || cn === "严重") return "crit";
      if (level === "High" || cn === "高危") return "high";
      return "other";
    }
    function levelText(level) {
      return levelLabels[level] || level || "-";
    }
    function esc(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }
    function scoreText(v) {
      if (v === null || v === undefined || v === "" || v === -1) return "-";
      return String(v);
    }

    function renderList() {
      const list = $("list");
      $("listCount").textContent = String(filtered.length);
      if (!filtered.length) {
        list.innerHTML = '<div class="empty">没有匹配项</div>';
        return;
      }
      list.innerHTML = filtered.map((it) => {
        const id = it.mps_id || it.cve_id;
        const active = id === activeId ? " active" : "";
        return `
          <button class="item${active}" data-id="${esc(id)}" type="button">
            <div class="item-top">
              <span class="cve">${esc(it.cve_id || it.mps_id || "-")}</span>
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
            </div>
            <div class="title">${esc(it.title || "-")}</div>
            <div class="item-foot">
              <span>CVSS ${esc(scoreText(it.cvss_score))}</span>
              <span>${esc(it.published_time || "-")}</span>
              ${it.poc ? "<span>POC</span>" : ""}
            </div>
          </button>`;
      }).join("");
      list.querySelectorAll(".item").forEach((btn) => {
        btn.addEventListener("click", () => selectById(btn.dataset.id));
      });
    }

    function refsHtml(it) {
      const refs = Array.isArray(it.reference_url_list) ? it.reference_url_list : [];
      const links = [];
      if (it._source_page) links.push({ url: it._source_page, name: "OSCS 详情" });
      if (it.cve_id) links.push({ url: `https://nvd.nist.gov/vuln/detail/${it.cve_id}`, name: "NVD" });
      refs.forEach((r) => {
        if (r && r.url) links.push({ url: r.url, name: r.name || r.url });
      });
      const seen = new Set();
      const uniq = [];
      for (const l of links) {
        if (seen.has(l.url)) continue;
        seen.add(l.url);
        uniq.push(l);
      }
      if (!uniq.length) return '<div class="box">无参考链接</div>';
      return `<div class="refs">${uniq.map((l) =>
        `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name || l.url)}</a>`
      ).join("")}</div>`;
    }

    function articlesHtml(it) {
      const arts = Array.isArray(it.articles) ? it.articles : [];
      if (!arts.length) return "";
      return `<div class="section"><h3>相关说明</h3>${arts.map((a) => `
        <div class="article">
          <h4>${esc(a.title || "说明")}</h4>
          <p>${esc(a.content || "")}</p>
        </div>`).join("")}</div>`;
    }

    function renderDetail(it) {
      const detail = $("detail");
      if (!it) {
        detail.innerHTML = '<div class="empty">暂无数据</div>';
        return;
      }
      const pocUrls = Array.isArray(it.poc_url) ? it.poc_url : [];
      detail.innerHTML = `
        <div class="d-head">
          <div>
            <h1 class="d-title">${esc(it.title || "-")}</h1>
            <div class="ids">
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
              <span class="chip">${esc(it.cve_id || "无 CVE")}</span>
              <span class="chip">${esc(it.mps_id || "-")}</span>
              ${it.poc ? '<span class="chip">有 POC</span>' : ""}
              ${it.exp ? '<span class="chip">有 EXP</span>' : ""}
            </div>
          </div>
          <div class="actions">
            ${it._source_page ? `<a class="btn" href="${esc(it._source_page)}" target="_blank" rel="noopener">OSCS</a>` : ""}
            ${it.cve_id ? `<a class="btn" href="https://nvd.nist.gov/vuln/detail/${esc(it.cve_id)}" target="_blank" rel="noopener">NVD</a>` : ""}
          </div>
        </div>
        <div class="grid">
          <div class="stat"><div class="k">CVSS</div><div class="v">${esc(scoreText(it.cvss_score))}</div></div>
          <div class="stat"><div class="k">向量</div><div class="v">${esc(it.cvss_vector || "-")}</div></div>
          <div class="stat"><div class="k">CWE</div><div class="v">${esc(it.cwe || "-")}</div></div>
          <div class="stat"><div class="k">类型</div><div class="v">${esc(it.kind || it.kind_en || "-")}</div></div>
          <div class="stat"><div class="k">公开</div><div class="v">${esc(it.published_time || "-")}</div></div>
          <div class="stat"><div class="k">利用成本</div><div class="v">${esc(it.exploit_requirement_cost || "-")}</div></div>
          <div class="stat"><div class="k">可利用性</div><div class="v">${esc(it.exploitability || "-")}</div></div>
          <div class="stat"><div class="k">修复建议</div><div class="v">${esc(it.fix_suggestion || "-")}</div></div>
        </div>
        <div class="section"><h3>描述</h3><div class="box">${esc(it.description || "无描述")}</div></div>
        ${it.scope_influence ? `<div class="section"><h3>影响范围</h3><div class="box">${esc(it.scope_influence)}</div></div>` : ""}
        ${pocUrls.length ? `<div class="section"><h3>POC 链接</h3><div class="refs">${pocUrls.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join("")}</div></div>` : ""}
        <div class="section"><h3>参考链接</h3>${refsHtml(it)}</div>
        ${articlesHtml(it)}
      `;
    }

    function selectById(id) {
      const it = filtered.find((x) => (x.mps_id || x.cve_id) === id) ||
                 items.find((x) => (x.mps_id || x.cve_id) === id);
      if (!it) return;
      activeId = it.mps_id || it.cve_id;
      renderList();
      renderDetail(it);
      const btn = document.querySelector(`.item[data-id="${CSS.escape(activeId)}"]`);
      if (btn) btn.scrollIntoView({ block: "nearest" });
      history.replaceState(null, "", "#" + encodeURIComponent(activeId));
    }

    function applyFilter(q) {
      const query = (q || "").trim().toLowerCase();
      filtered = !query ? items.slice() : items.filter((it) => {
        const blob = [
          it.cve_id, it.mps_id, it.title, it.kind, it.kind_en, it.cwe, it.description, it.level
        ].map((x) => String(x || "").toLowerCase()).join(" ");
        return blob.includes(query);
      });
      renderList();
      if (filtered.length) {
        const still = filtered.some((x) => (x.mps_id || x.cve_id) === activeId);
        selectById(still ? activeId : (filtered[0].mps_id || filtered[0].cve_id));
      } else {
        activeId = null;
        renderDetail(null);
      }
    }

    $("search").addEventListener("input", (e) => applyFilter(e.target.value));

    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement !== $("search")) {
        e.preventDefault();
        $("search").focus();
        return;
      }
      if (!filtered.length) return;
      const idx = filtered.findIndex((x) => (x.mps_id || x.cve_id) === activeId);
      if (e.key === "ArrowDown") {
        e.preventDefault();
        const next = filtered[Math.min(filtered.length - 1, Math.max(0, idx) + 1)];
        selectById(next.mps_id || next.cve_id);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        const prev = filtered[Math.max(0, idx - 1)];
        selectById(prev.mps_id || prev.cve_id);
      }
    });

    const hashId = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    if (hashId && items.some((x) => (x.mps_id || x.cve_id) === hashId)) {
      activeId = hashId;
      renderList();
      selectById(hashId);
    } else if (items.length) {
      selectById(items[0].mps_id || items[0].cve_id);
    } else {
      renderList();
      renderDetail(null);
    }
  </script>
</body>
</html>
