tags": ["应用软件", "终端软件"], "title": "Velociraptor存储型XSS", "_translated": true, "_saved_at": "2026-08-18T11:19:26+00:00", "_first_saved_at": "2026-08-18T08:28:31+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-vwg2-564x"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "cnvd_id": "", "cve_id": "CVE-2026-45790", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8}]}, "cvss_score": 8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:R/S:U/C:H/I:H/A:H", "cwe": "CWE-269", "description": "Dokploy 是一个免费、可自托管的平台即服务 (PaaS)。在0.29.6之前，apps/dokploy/server/api/routers/organization.ts中的Dokploy的organization.inviteMember tRPC过程允许具有member:create权限的用户邀请具有所有者角色的帐户，而packages/server/src/services/user.ts允许特权自托管用户创建具有任意角色的帐户，从而实现永久组织接管，因为所有者角色无法降级。此问题已在 0.29.6 版本中修复。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-08-18", "level": "High", "mps_id": "MPS-qs54-nfp3", "poc": false, "poc_url": [], "published_time": "2026-08-18", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-qs54-nfp3", "name": "https://www.oscs1024.com/hd/MPS-qs54-nfp3"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-45790", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-45790"}, {"url": "https://github.com/Dokploy/dokploy/commit/a07106d649991ea09892220873ea3243766c3e08", "name": ""}, {"url": "https://github.com/Dokploy/dokploy/pull/4475", "name": ""}, {"url": "https://github.com/Dokploy/dokploy/releases/tag/v0.29.6", "name": ""}, {"url": "https://github.com/Dokploy/dokploy/security/advisories/GHSA-fm9p-wmpw-gxjh", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-45790漏洞", "_translated": true, "_saved_at": "2026-08-17T23:17:19+00:00", "_first_saved_at": "2026-08-17T23:17:19+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-qs54-nfp3"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-75056", "cvss": {"cvssv31": [{"source": "cve@jetbrains.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "cwe": "CWE-78", "descriptio 0575漏洞", "_translated": true, "_saved_at": "2026-08-18T15:25:34+00:00", "_first_saved_at": "2026-08-18T15:25:34+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-hu0i-dk3g"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-45698", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-191", "description": "Netatalk 是一个用于类 Unix 操作系统的免费开源文件服务器套件。在版本 3.1.19 到 4.4.2 中，Netatalk 的 afpd 守护程序的deletedir() 函数中存在基于堆栈的缓冲区溢出，这是由于在计算用于路径构建的剩余缓冲区大小时出现整数下溢。 deletedir() 是一个实用程序函数，当文件操作跨越 AFP 共享卷内的设备边界时调用，标准库的 renameat() 无法处理。该函数尝试通过跟踪 size_t 保留变量中的可用空间来防止缓冲区溢出。但是，用于计算剩余结果的算术会导致无符号整数下溢，从而导致变量变为 SIZE_MAX。因此，后续边界检查始终评估为安全，允许无界 strcpy() 操作将攻击者控制的文件名复制到几乎已满的堆栈缓冲区中。 4.4.3 版本修复了该问题。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "超界折返", "kind_en": "整数下溢（环绕或环绕）", "last_modified_time": "2026-08-18", "level": "High", "mps_id": "MPS-hqvr-djiy", "poc": false, "poc_url": [], "published_time": "2026-08-18", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-hqvr-djiy", "name": "https://www.oscs1024.com/hd/MPS-hqvr-djiy"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-45698", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-45698"}, {"url": "https://github.com/Netatalk/netatalk/releases/tag/netatalk-4-4-3", "name": ""}, {"url": "https://github.com/Netatalk/netatalk/security/advisories/GHSA-5443-v9xg-mqgv", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-45698漏洞", "_translated": true, "_saved_at": "2026-08-17T20:19:23+00:00", "_first_saved_at": "2026-08-17T20:19:23+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-hqvr-djiy"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-11801", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "cwe": "CWE-862", "description": "WordPress 的 WPAdverts – Classifieds Plugin 插件在 2.3.2 及之前的所有版本中都容易受到授权绕过。这是由于插件未正确验证用户是否有权执行操作。这使得未经身份验证的攻击者可以检索分类类型 REST 端点公开的内部站点配置数据，包括注册的帖子类型、标签、关联的分类法、表单方案元数据、联系人选项和自定义字段元键。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-08-18", "level": "High", "mps_id": "MPS-niw3-b5zk", "poc": false, "poc_url": [], "published_time": "2026-08-18", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-niw3-b5zk", "name": "https://www.oscs1024.com/hd/MPS-niw3-b5zk"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-11801", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-11801"}, {"url": "https://plugins.trac.wordpress.org/browser/wpadverts/tags/2.3.2/includes/class-rest-blocks.php#L13", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/wpadverts/tags/2.3.2/includes/class-rest-blocks.php#L50", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/wpadverts/tags/2.3.3/includes/class-rest-blocks.php#L49", "name": ""}, {"url": "https://plugins.trac.wordpress.org/changeset?reponame=\u0026new=3635095%40wpadverts%2Ftrunk\u0026old=3557928%40wpadverts%2Ftrunk", "name": ""}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/37bb8d68-dd87-437a-80e5-e99e93dc55b6?source=cve", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-11801漏洞", "_translated": true, "_saved_at": "2026-08-18T11:19:30+00:00", "_first_saved_at": "2026-08-18T04:29:18+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-niw3-b5zk"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-32468", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "cwe": "CWE-497", "description": "Duitku 支付网关 \u003c= 2.11.14 版本中未经身份验证的敏感数据泄露。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "将系统数据暴露到未授权控制的范围", "kind_en": "将敏感系统信息暴露给未经授权的控制领域", "last_modified_time": "2026-08-18", "level": "High", "mps_id": "MPS-qkyt-px0d", "poc": false, "poc_url": [], "published_time": "2026-08-18", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-qkyt-px0d", "name": "https://www.oscs1024.com/hd/MPS-qkyt-px0d"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-32468", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-32468"}, {"url": "https://patchstack.com/database/wordpress/plugin/duitku-social-payment-gateway/vulnerability/wordpress-duitku-payment-gateway-plugin-2-11-14-sensitive-data-exposure-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-32468漏洞", "_translated": true, "_saved_at": "2026-08-18T15:25:38+00:00", "_first_saved_at": "2026-08-18T15:25:38+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-qkyt-px0d"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-75091", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "cwe": "CWE-79", "description": "Quill Forms 是开源 WordPress 插件，用于构建对话式多步骤表单、问卷与测验。\n受影响版本中，插件对输入过滤和输出转义不足，未认证攻击者可将脚本注入页面，用户访问含注入内容的页面时脚本执行。\n修复版本中通过补强输入净化与输出转义阻断脚本注入；截至 2026-08-18 官方尚未发布含该修复的版本，WordPress.org 插件目录最新版本仍为受影响的 5.7.1，Patchstack 亦标注尚无官方补丁。", "effects": [{"comp_name": "quillforms", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,5.7.1]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-08-18", "level": "High", "mps_id": "MPS-r6kn-obhz", "poc": false, "poc_url": [], "published_time": "2026-08-18", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-r6kn-obhz", "name": "https://www.oscs1024.com/hd/MPS-r6kn-obhz"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-75091", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-75091"}, {"url": "https://patchstack.com/database/wordpress/plugin/quillforms/vulnerability/wordpress-quill-forms-plugin-5-7-1-cross-site-scripting-xss-vulnerability", "name": ""}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/7ae927b1-401f-4227-9d50-4adde8e95f24?source=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Quill Forms存储型XSS漏洞", "_translated": true, "_saved_at": "2026-08-18T11:19:27+00:00", "_first_saved_at": "2026-08-18T07:33:03+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-r6kn-obhz"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-75480", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:N", "severity": "medium", "base_score": 6.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-863", "description": "OpenViking 调试向量滚动和计数端点仅应用帐户级范围，无需用户级访问控制，从而允许经过身份验证的用户读取所有共同租户记录。攻击者可以查询这些端点来检索属于同一帐户中其他用户的私人记忆、资源、技能和秘密材料，而无需管理权限。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-08-18", "level": "High", "mps_id": "MPS-0fkq-p2v5", "poc": false, "poc_url": [], "published_time": "2026-08-18", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-0fkq-p2v5", "name": "https://www.oscs1024.com/hd/MPS-0fkq-p2v5"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-75480", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-75480"}, {"url": "https://github.com/volcengine/OpenViking", "name": ""}, {"url s_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:L", "cwe": "CWE-79", "description": "Mayosis Core \u003c= 5.4.7 版本中存在未经身份验证的跨站脚本 (XSS)。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-08-18", "level": "High", "mps_id": "MPS-kmvg-5wa9", "poc": false, "poc_url": [], "published_time": "2026-08-18", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-kmvg-5wa9", "name": "https://www.oscs1024.com/hd/MPS-kmvg-5wa9"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-32333", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-32333"}, {"url": "https://patchstack.com/database/wordpress/plugin/mayosis-core/vulnerability/wordpress-mayosis-core-plugin-5-4-7-reflected-cross-site-scripting-xss-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-32333漏洞", "_translated": true, "_saved_at": "2026-08-18T15:25:47+00:00", "_first_saved_at": "2026-08-18T15:25:47+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-kmvg-5wa9"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-69148", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:L/A:N", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:L/A:N", "cwe": "CWE-862", "description": "MLflow 是一个用于代理、大型语言模型和机器学习模型的开源人工智能工程平台。在 3.15.0 之前，CreateModelVersion 在 mlflow/server/handlers.py 中的 _validate_source_run() 或 _validate_source_model() 之后接受 run_id 或 model_id 仅验证路径包含，允许经过身份验证的用户创建引用另一个用户的工件目录的模型版本，并通过 GET /model-versions/get-artifact 读取文件，而无需所需的 READ 权限。此问题已在 3.15.0 版本中修复。", "effects": [{"comp_name": "mlflow", "ecosystem": "npm", "versions": [{"affected_version": "(-∞,3.15.0)", "min_fixed_version": "3.15.0", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-08-18", "level": "High", "mps_id": "MPS-kn4s-a8z3", "poc": false, "poc_url": [], "published_time": "2026-08-18", "reference_url_list": [{"url": "https://github.com/mlflow/mlflow/security/advisories/GHSA-gqch-g4w5-7qcw", "name": ""}, {"url": "https://github.com/mlflow/mlflow/pull/24293", "name": ""}, {"url": "https://github.com/mlflow/mlflow/commit/4bb7474771c3be808cd9e129defef9305f2869be", "name": ""}, {"url": "https://github.com/mlflow/mlflow/releases/tag/v3.15.0", "name": ""}, {"url": "https://github.com/advisories/GHSA-gqch-g4w5-7qcw", "name": ""}], "scope_influence": "", "tags": ["npm", "开源", "终端软件"], "title": "CVE-2026-69148漏洞", "_translated": true, "_saved_at": "2026-08-18T00:52:41+00:00", "_first_saved_at": "2026-08-17T23:17:13+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-kn4s-a8z3"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-75050", "cvss": {"c  和 apos.util.get()，允许经过身份验证的编辑器覆盖共享 Object.prototype.toString 函数的 call 属性，并导致持续的进程范围拒绝服务，直到重新启动。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "原型污染", "kind_en": "对象原型属性的控制不当的修改（“原型污染”）", "last_modified_time": "2026-08-18", "level": "High", "mps_id": "MPS-qn4u-5rdj", "poc": false, "poc_url": [], "published_time": "2026-08-18", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-qn4u-5rdj", "name": "https://www.oscs1024.com/hd/MPS-qn4u-5rdj"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-71553", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-71553"}, {"url": "https://github.com/apostrophecms/apostrophe/commit/5a3746aaed49761e171c2cbfe793267c959829fd", "name": ""}, {"url": "https://github.com/apostrophecms/apostrophe/security/advisories/GHSA-vmg4-6gfg-83qx", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-71553漏洞", "_translated": true, "_saved_at": "2026-08-17T21:20:05+00:00", "_first_saved_at": "2026-08-17T21:20:05+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-qn4u-5rdj"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-68519", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:L/AC:L/AT:P/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:L/AC:L/AT:P/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-78", "description": "Glances是一款开源系统跨平台监控工具。在 4.5.6 之前，glances/actions.py 中的 GlancesActions.run() 会忽略警报操作命令的 --disable-config-exec 并在启用 shell 操作符的情况下调用 secure_popen() ，从而允许在警报触发时执行配置的重定向、命令链或管道。此问题已在 4.5.6 中修复。", "effects": [{"comp_name": "glances", "ecosystem": "pip", "versions": [{"affected_version": "(-∞,4.5.6)", "min_fixed_version": "4.5.6", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-08-18", "level": "High", "mps_id": "MPS-vyx3-rckf", "poc": false, "poc_url": [], "published_time": "2026-08-18", "reference_url_list": [{"url": "https://github.com/nicolargo/glances/security/advisories/GHSA-59fj-m2j6-hcxh", "name": ""}, {"url": "https://github.com/nicolargo/glances/commit/5c07c0d96423e9d5b9de71dd92e3717c66f504bd", "name": ""}, {"url": "https://github.com/nicolargo/glances/releases/tag/v4.5.6", "name": ""}, {"url": "https://github.com/advisories/GHSA-59fj-m2j6-hcxh", "name": ""}], "scope_influence": "", "tags": ["python", "开源"], "title": "CVE-2026-68519漏洞", "_translated": true, "_saved_at": "2026-08-17T19:22:50+00:00", "_first_saved_at": "2026-08-17T19:22:50+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-vyx3-rckf"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-75109", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:L/A:H", "severity": "high", "base_score": 7.1}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:N/VI:L/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:N/VI:L/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-862", "description": "已确定无法授权对 API 处理程序中的通用任务终止、暂停和取消暂停端点的请求。经过身份验证的攻击者可以通过终止、暂停或取消暂停不属于他们的任务来破坏其他用户的工作负载。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-08-18", "level": "High", "mps_id": "MPS-zjkb-9l68", "poc": false, "poc_url": [], "published_time": "2026-08-18", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-zjkb-9l68", "name": "https://www.oscs1024.com/hd/MPS-zjkb-9l68"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-75109", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-75109"}, {"url": "https://github.com/determined-ai/determined", "name": ""}, {"url": "https://github.com/determined-ai/determined/blob/main/master/internal/api_generic_tasks.go", "name": ""}, {"url": "https://github.com/determined-ai/determined/issues/10270", "name": ""}, {"url": "https://www.vulncheck.com/advisories/determined-missing-authorization-check-on-generic-task-endpoints", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-75109漏洞", "_translated": true, "_saved_at": "2026-08-17T22:18:06+00:00", "_first_saved_at": "2026-08-17T22:18:06+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-zjkb-9l68"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-75531", "cvss": {"cvssv4": [{"source": "5a6e4751-2f3f-4070-9419-94fb35b644e8", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:A/VC:L/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7}]}, "cvss_score": 7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:A/VC:L/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-79", "description": "Pandora 在 URL 可观察量的呈现中包含存储的跨站点脚本 (XSS) 漏洞。从分析的文件中提取或与分析的文件关联的 URL 被直接插入到“提交到 Lookyloo”操作所使用的内联 JavaScript onclick 处理程序中。\n\n\n尽管该值会受到模板引擎 HTML 转义的影响，但它被嵌入到 HTML 属性内的 JavaScript 字符串中。因此，攻击者控制的包含特制字符的 URL 可能会突破 JavaScript 字符串并注入任意 JavaScript 代码。\n\n\n当受害者与受影响的 Submit to Lookyloo 控件交互时，恶意脚本将在 Pandora Web 应用程序的上下文中执行。成功利用该漏洞可能允许攻击者访问受害者浏览器可用的信息或使用受害者经过身份验证的 Pandora 会话执行操作。\n\n\n该补丁从内联 JavaScript 处理程序中删除了可观察值。 URL 而是存储在 HTML data-url 属性中，并在需要时通过 DOM 数据集 API 进行检索。作为防御强化，innerHTML 的其他用途也被替换为 textContent。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-08-18", "level": "High", "mps_id": "MPS-p9zg-13qe", "poc": false, "poc_url": [], "published_time": "2026-08-18", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-p9zg-13qe", "name": "https://www.oscs1024.com/hd/MPS-p9zg-13qe"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-75531", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-75531"}, {"url": "https://github.com/pandora-analysis/pandora/commit/77a84a039e2079dba7ea0342816c9813099d75d0", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-75531漏洞", "_translated": true, "_saved_at": "2026-08-17T22:17:47+00:00", "_first_saved_at": "2026-08-17T22:17:47+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-p9zg-13qe"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-52876", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "cwe": "CWE-78", "description": "Streambert 是一款跨平台 Electron 桌面应用程序，用于流式传输和下载视频内容。在版本 2.6.0 之前，src/ipc/player.js 中的 open-path-at-time IPC 处理程序接受渲染器控制的 filePath，而不验证其类型或位置。如果 mpv 或 VLC 启动尝试被跳过或失败，处理程序会将 filePath 传递给 Electron 的 shell.openPath。受损的渲染器可以通过执行默认处理程序提供本地可执行文件、脚本、快捷方式或其他文件的路径，从而导致操作系统以 StreamBERT 进程的权限启动它，并能够逃离渲染器沙箱。此问题已在 2.6.0 版本中修复。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-08-19", "level": "High", "mps_id": "MPS-ika3-09nz", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ika3-09nz", "name": "https://www.oscs1024.com/hd/MPS-ika3-09nz"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-52876", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-52876"}, {"url": "https://github.com/truelockmc/streambert/commit/43566ed031183b046675761c9813c5379b619269", "name": ""}, {"url": "https://github.com/truelockmc/streambert/pull/149", "name": ""}, {"url": "https://github.com/truelockmc/streambert/releases/tag/2.6.0", "name": ""}, {"url": "https://github.com/truelockmc/streambert/security/advisories/GHSA-85vf-2qwc-qpm4", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-52876漏洞", "_translated": true, "_saved_at": "2026-08-18T23:16:30+00:00", "_first_saved_at": "2026-08-18T23:16:30+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ika3-09nz"}, {"analysis_status": 0, "articles": [{"content": "跨站点请求伪造 (CSRF)通过利用网站对用户请求的信任进行攻击。当用户在网站A登录并在同一浏览器会话中访问网站B时，攻击者可以构造特制的请求并诱使用户执行，以使网站B误以为这些请求是用户合法发起的。\n攻击者通常通过欺骗用户点击恶意链接、在受信任的网站中植入恶意代码或通过钓鱼等手段来实施CSRF攻击，一旦用户执行了恶意请求，攻击者可以以用户的身份执行任意操作，包括更改用户密码、发起资金转账或删除重要数据等。", "title": "什么是CSRF"}, {"content": "- 链接欺骗：攻击者通过向用户发送包含恶意链接的电子邮件或社交媒体消息，诱使用户点击并执行恶意请求。\n- 图片引用攻击：攻击者通过在恶意网站上包含指向目标网站的图片引用，以触发用户浏览器自动发送目标网站的请求。\n- XSS利用：如果目标网站存在XSS漏洞，攻击者可以注入恶意脚本，以使用户在浏览器中执行恶意请求。", "title": "CSRF常见的攻击方式"}, {"content": "- 随机令牌：网站可以在每个请求中包含一个随机生成的令牌（CSRF Token），并验证该令牌的有效性，以确认请求的来源是合法的。\n- SameSite Cookie：使用SameSite属性来限制跨站点请求，将Cookie的发送限制在同一站点上，减少了跨站请求伪造的风险。\n- 双重验证：对于敏感操作，网站可以要求用户进行额外的验证，例如输入验证码、提供第二个因素的身份验证等。\n- 强化浏览器策略：网站可以设置Content-Security-Policy（CSP）头，限制浏览器执行恶意脚本的能力，减少CSRF攻击的风险。\n- 限制用户操作：网站可以要求用户在执行敏感操作之前进行明确的确认或授权，防止恶意请求被误触发。\n- 安全编码实践：开发人员应遵循安全编码实践，对用户输入进行适当的验证和过滤，防止恶意请求的注入。", "title": "如何预防CSRF"}], "cnvd_id": "", "cve_id": "CVE-2026-66602", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "cwe": "CWE-352", "description": "HashBar – WordPress Notification Bar 是 DevItems 发布的开源 WordPress 插件，用于创建公告栏、通知栏和弹窗营销活动。\n受影响版本中，公告分析、弹窗分析和 A/B 测试跟踪模块在 rest_authentication_errors 过滤器里使用 strpos() 判断 $_SERVER['REQUEST_URI'] 是否包含 /hashbar/v1/announcement-analytics/batch 等公开跟踪路径。攻击者可在任意 WordPress REST 请求的查询串中植入该子串，使过滤器返回 true 并跳过 cookie 认证 REST 调用所需的 nonce 校验。未认证攻击者诱导已登录的高权限用户访问恶意页面后，可冒用其身份向站点 REST API 提交状态变更请求。\n修复版本中通过改为读取 WordPress 解析后的 $GLOBALS['wp']-\u003equery_vars['rest_route'] 并与跟踪路由做精确相等比较，阻止查询串走私触发认证绕过，切断跨站请求对其他 REST 接口的伪造路径。", "effects": [{"comp_name": "hashbar-wp-notification-bar", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.0.1)", "min_fixed_version": "2.0.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "CSRF", "kind_en": "跨站请求伪造 (CSRF)", "last_modified_time": "2026-08-19", "level": "High", "mps_id": "MPS-ozyn-p8w9", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ozyn-p8w9", "name": "https://www.oscs1024.com/hd/MPS-ozyn-p8w9"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-66602", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-66602"}, {"url": "https://patchstack.com/database/wordpress/plugin/hashbar-wp-notification-bar/vulnerability/wordpress-hashbar-wordpress-notification-bar-plugin-2-0-0-cross-site-request-forgery-csrf-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": [], "title": "HashBar CSRF漏洞", "_translated": true, E-2026-75897漏洞", "_translated": true, "_saved_at": "2026-08-18T18:28:33+00:00", "_first_saved_at": "2026-08-18T18:28:33+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-5qad-73kw"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-70408", "cvss": {"cvssv3": [{"source": "vultures@jpcert.or.jp", "vector": "CVSS:3.0/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}], "cvssv4": [{"source": "vultures@jpcert.or.jp", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-863", "description": "acmailer 是 Extra Innovation Inc. 提供的邮件投递软件，并非 GitHub 开源项目，分为 acmailer CGI 与 acmailer DB，以 Perl CGI 形式部署在服务器上，用于邮件列表与邮件营销。\n受影响版本中，子账号用户的授权校验存在缺陷，已登录的子账号可创建另一个具备管理员权限的子账号，从而获得管理权限。\n修复版本中通过限制子账号对子账号管理功能的使用，阻止低权限子账号再创建具备管 免将敏感信息记录在日志文件中。\n- 安全配置和最佳实践：遵循安全最佳实践，对应用程序、服务器和系统进行适当的配置，包括访问控制、权限管理、密码策略等。\n- 审计和监控：实施日志审计和监控机制，及时检测和响应任何异常活动或潜在的信息暴露事件。\n- 安全开发实践：在应用程序开发过程中，进行安全代码审查、漏洞扫描和安全测试，以及敏感信息的正确处理和保护。", "title": "如何预防未授权敏感信息泄露"}], "cnvd_id": "", "cve_id": "CVE-2026-75915", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "high", "base_score": 7.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-200", "description": "CodeWhale 0.8.64 之前的版本在 js_execution 工具中包含一个环境变量暴露漏洞，该漏洞无法在生成 Node.js 之前清理父进程环境变量。攻击者可以编写由该工具执行的恶意 JavaScript 代码来读取 process.env 并将 API 密钥、云凭据和身份验证令牌泄漏回模型上下文。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "未授权敏感信息泄露", "kind_en": "向未经授权的行为者泄露敏感信息", "last_modified_time": "2026-08-19", "level": "High", "mps_id": "MPS-ca01-wzsx", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ca01-wzsx", "name": "https://www.oscs1024.com/hd/MPS-ca01-wzsx"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-75915", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-75915"}, {"url": "https://github.com/Hmbown/CodeWhale/commit/26de44a8bd5051f8f944ea60b2c37ae1d2b7d25e", "name": ""}, {"url": "https://github.com/Hmbown/CodeWhale/security/advisories/GHSA-h539-c7r8-3xq4", "name": ""}, {"url": "https://www.vulncheck.com/advisories/codewhale-before-environment-variable-leak-via-js-execution", "name": ""}, {"url": "https://github.com/Hmbown/CodeWhale/security/advisories/GHSA-h539-c7r8-3xq4", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-75915漏洞", "_translated": true, "_saved_at": "2026-08-18T17:21:28+00:00", "_first_saved_at": "2026-08-18T17:21:28+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ca01-wzsx"}, {"analysis_status": 0, "articles": [{"content": "跨界内存读是指应用程序在读取内存时，未正确验证或限制读取的内存范围。攻击者利用这种漏洞可以读取应用程序内存中的敏感数据，如密码、加密密钥、会话令牌等。常见的原因是由于缓冲区溢出、格式化字符串漏洞或其他内存错误导致的。", "title": "什么是越界读取"}, {"content": "攻击者可以通过不当构造的输入来触发跨界内存读漏洞。攻击者可能会通过向应用程序发送特定的输入，使其读取超过预期的内存区域。攻击者可以利用这个漏洞来获取敏感信息，如其他用户的数据、操作系统的敏感数据或应用程序的内部状态。", "title": "越界读取常见的攻击方式"}, {"content": "- 输入验证和限制：应用程序应对所有输入数据进行严格的验证和限制。确保输入数据的长度、格式和内容符合预期，避免超出缓冲区或访问非预期的内存区域。\n- 内存安全编程实践：开发人员应使用安全的编程实践，如避免使用不安全的函数、正确处理内存分配和释放操作，以及遵循最小特权原则。\n- 使用安全的编程语言和库：选择使用安全性较高的编程语言和库，这些语言和库在内存管理和安全性方面提供了更多的保护机制。\n- 定期进行代码审查和安全测试：定期审查应用程序的代码，并进行安全测试，以发现潜在的跨界内存读漏洞。使用静态代码分析工具和漏洞扫描工具来辅助检测和修复问题。\n- 实施防御性编程技术：应用程序应采用防御性编程技术，如使用随机化地址空间布局（ASLR）、堆栈保护机制（如堆栈溢出保护）和数据执行预防（DEP）等。\n- 及时更新和修补：及时应用程序和操作系统的安全更新和补丁，以确保已知的跨界内存读漏洞得到修复。及时更新相关软件和库，以避免使用已知存在漏洞的版本。", "title": "如何预防越界读取"}], "cnvd_id": "", "cve_id": "CVE-2026-62292", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-125", "description": "libheif 是 HEIF 和 AVIF 文件格式解码器和编码器。从 1.19.0 到 1.23.1，使用通用 zlib unci 全项目压缩精心制作的未压缩 HEIF 图像可能会导致使用 heif_image_handle_decode_image_tile() 解码广告图块的应用程序崩溃。在 libheif/codecs/uncompressed/unc_decoder.cc 中，unc_decoder::fetch_tile_data() 计算大的切片偏移量，而 unc_decoder::get_compressed_image_data_uncompressed() 使用 range_start_offset 加 range_size 对其进行验证。对于最后通告的图块 (4095, 4095)，加法可以回绕到零，绕过边界检查，并将无效的源指针和 1 TB 长度传递给 memcpy。观察到的结果是越界读取和进程崩溃；单独打开文件不会触发问题，因为需要进行图块解码。此问题已在版本 1.23.1 中修复。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界读取", "kind_en": "越界读取", "last_modified_time": "2026-08-19", "level": "High", "mps_id": "MPS-dj7z-my51", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-dj7z-my51", "name": "https://www.oscs1024.com/hd/MPS-dj7z-my51"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-62292", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-62292"}, {"url": "https://github.com/strukturag/libheif/commit/089a809bf6bed1abae102d5e97b6bb8c4f53b515", "name": ""}, {"url": "https://github.com/strukturag/libheif/releases/tag/v1.23.1", "name": ""}, {"url": "https://github.com/strukturag/libheif/security/advisories/GHSA-73p7-m7gg-w2jv", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-62292漏洞", "_translated": true, "_saved_at": "2026-08-19T00:53:20+00:00", "_first_saved_at": "2026-08-18T23:16:27+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-dj7z-my51"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-75914", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "high", "base_score": 7.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-22", "description": "CodeWhale 0.8.64 之前的版本在 image_analyze 工具中包含路径遍历漏洞，该漏洞无法在读取文件之前规范化符号链接。攻击者可以创建指向具有图像扩展名的外部文件的工作区符号链接，从而在未经用户批准的情况下将文件字节泄漏到视觉端点。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-08-19", "level": "High", "mps_id": "MPS-pkxh-dv3e", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-pkxh-dv3e", "name": "https://www.oscs1024.com/hd/MPS-pkxh-dv3e"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-75914", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-75914"}, {"url": "https://github.com/Hmbown/CodeWhale/commit/26de44a8bd5051f8f944ea60b2c37ae1d2b7d25e", "name": ""}, {"url": "https://github.com/Hmbown/CodeWhale/security/advisories/GHSA-w7wx-5q49-r59w", "name": ""}, {"url": "https://www.vulncheck.com/advisories/codewhale-before-path-traversal-via-image-analyze-symlink", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-75914漏洞", "_translated": true, "_saved_at": "2026-08-18T17:21:24+00:00", "_first_saved_at": "2026-08-18T17:21:24+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-pkxh-dv3e"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "cnvd_id": "", "cve_id": "CVE-2026-75924", "cvss": {"cvssv31": [{"source": "secalert@redhat.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:C/C:H/I:H/A:N", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:C/C:H/I:H/A:N", "cwe": "CWE-269", "description": "托管服务帐户中发现缺陷。受损的 addon-manager pod 由于其 ClusterRole 授予过多权限，可以读取所有命名空间中的任何机密。此外，它还可以批准任意证书签名请求 (CSR)，这可能会导致集群内的信息泄露和权限升级。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-08-19", "level": "High", "mps_id": "MPS-rtnw-xosz", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-rtnw-xosz", "name": "https://www.oscs1024.com/hd/MPS-rtnw-xosz"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-75924", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-75924"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-75924", "name": ""}, {"url": "https://bugzilla.redhat.com/show_bug.cgi?id=2515720", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-75924漏洞", "_translated": true, "_saved_at": "2026-08-18T18:28:35+00:00", "_first_saved_at": "2026-08-18T18:28:35+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-rtnw-xosz"}, {"analysis_status": 0, "articles": [], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-69220", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-674", "description": "RabbitMQ Java Client 是开源 Java 客户端库，供 Java 与 JVM 应用连接并与 RabbitMQ 节点交互，Maven 坐标为 com.rabbitmq:amqp-client，由 rabbitmq/rabbitmq-java-client 维护。\n受影响版本中，src/main/java/com/rabbitmq/client/impl/ValueReader.java 的 readTable 与 readArray 在解析 AMQP 表类型 F 与数组类型 A 时递归调用 readFieldValue，但未限制嵌套深度。攻击者控制的 AMQP 服务器或网络中间人在预认证的 connection.start 帧中发送约 580 层嵌套表，每层约 7 字节、合计约 4060 字节，远在默认 131072 字节帧上限之内；在默认 JVM 栈（约 512KB、约 864 字节/帧）下即可触发 StackOverflowError，终止客户端输入处理线程，造成拒绝服务。\n修复版本中通过在 ValueReader 中新增 MAX_FIELD_VALUE_NESTING_DEPTH = 32 常量，给 readTable、readArray、readFieldValue 增加 depth 参数并在 depth 超过阈值时抛出 MalformedFrameException，从而切断恶意深嵌套帧触发栈溢出的递归路径。", "effects": [{"comp_name": "com.rabbitmq:amqp-client", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,5.33.1)", "min_fixed_version": "5.33.1", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "e 开源软件，不属于大模型或机器学习基础设施。\n受影响版本中，src/main/java/com/rabbitmq/client/impl/ValueReader.java 的私有静态方法 readBytes 在解析 AMQP 帧字段时，会先读取 32 位无符号 contentLength，并在 contentLength 小于 Integer.MAX_VALUE 时立即 new byte[(int)contentLength] 分配对应大小的字节数组，再调用 readFully 填充数据。该分配尺寸完全由对端声明值决定，未与帧内剩余可读字节数或协商的 max-frame-size（默认 131072）做任何校验。攻击者只需充当恶意 AMQP 对端，在 pre-authentication 阶段的 connection.start server-properties 表中发送类型 tag 为 S 的 LongString，并将声明长度置为 0x7FFFFFFE，即可触发约 2 GB 的 byte[] 分配并抛出 OutOfMemoryError，最终使整个 JVM 因内存耗尽而终止，造成拒绝服务。\n修复版本中通过将 readBytes 的判定改为先获取 in.available() 并在 contentLength 大于 available 时抛出 MalformedFrameException，把对端声明长度与帧内实际可读数据量绑定后再决定是否分配缓冲；该改动同时反向移植到 5.x 维护分支并随 5.33.1 发布，攻击者声明超过帧剩余字节的长度将不再触发任何大块堆分配，pre-authentication 路径上的 OOM 链路被切断。", "effects": [{"comp_name": "com.rabbitmq:amqp-client", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,5.33.1)", "min_fixed_version": "5.33.1", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "未经控制的内存分配", "kind_en": "大小值过大的内存分配", "last_modified_time": "2026-08-19", "level": "High", "mps_id": "MPS-wbry-vzeh", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://github.com/rabbitmq/rabbitmq-java-client/security/advisories/GHSA-68mj-5wr7-6fgg", "name": ""}, {"url": "https://github.com/rabbitmq/rabbitmq-java-client/pull/2007", "name": ""}, {"url": "https://github.com/rabbitmq/rabbitmq-java-client/pull/2008", "name": ""}, {"url": "https://github.com/rabbitmq/rabbitmq-java-client/commit/388209356c6478088efce4d8a07b68e73837a7a0", "name": ""}, {"url": "https://github.com/rabbitmq/rabbitmq-java-client/commit/6a87a8dcdc8b4cc4b961a7cdd388276446e5dfb2", "name": ""}, {"url": "https://github.com/rabbitmq/rabbitmq-java-client/releases/tag/v5.33.1", "name": ""}, {"url": "https://github.com/advisories/GHSA-68mj-5wr7-6fgg", "name": ""}], "scope_influ ://nvd.nist.gov/vuln/detail/CVE-2026-75858"}, {"url": "https://github.com/Hmbown/CodeWhale/commit/57f3c89471e27ac4032d9791f6885e5d4408c381", "name": ""}, {"url": "https://github.com/Hmbown/CodeWhale/security/advisories/GHSA-wrj3-vj8c-784f", "name": ""}, {"url": "https://www.vulncheck.com/advisories/codewhale-rlm-eval-before-remote-code-execution", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-75858漏洞", "_translated": true, "_saved_at": "2026-08-18T17:21:35+00:00", "_first_saved_at": "2026-08-18T17:21:35+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-uyda-rb21"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-63338", "cvss": {}, "cvss_score": 8.3, "cvss_vector": "", "cwe": "CWE-863", "description": "IXP Manager 是由 INEX 维护的开源 PHP/Laravel 应用，为全球两百多家互联网交换中心（IXP）提供对等互联管理、路由服务器、客户服务与 API 密钥等核心能力。\n受影响版本中，IXP\\Http\\Controllers\\ApiKeyController 的 doUpdate 方法直接以 ApiKey::findOrFail($id) 取得目标记录，没有按 user_id 做归属校验；随后调用 $this-\u003eobject-\u003eupdate($r-\u003eall())，配合 IXP\\Models\\ApiKey 中 $fillable = ['apiKey', 'expires', 'allowedIPs', 'created', 'lastseenAt', 'lastseenFrom', 'description']，使请求中可控的 apiKey 字段被批量赋值覆盖。任意拥有 AUTH_CUSTUSER 权限的已登录客户用户都可向 PUT /api-key/update/{id} 提交带 apiKey 的表单，把任意其他用户（含超级管理员）的 API Key 明文改写为攻击者控制值，再以新 Key 走 API 完成身份冒用并获得对应权限。\n修复版本中通过在 doUpdate 内显式比对 $this-\u003eobject-\u003euser_id !== $r-\u003euser()-\u003eid 时直接 abort(403)，阻断跨用户更新路径，并将批量赋值替换为仅对受校验的 description 字段赋值（$this-\u003eobject-\u003edescription = $r-\u003edescription），同时去除 apiKey 在 $fillable 中的可批量赋值能力，从而切断越权读取/编辑其他用户资源以及 API Key 明文覆写的攻击链路。", "effects": [{"comp_name": "inex/ixp-manager", "ecosystem": "composer", "versions": [{"affected_version": "[v7.0.0,v7.3.0)", "min_fixed_version": "v7.3.0", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-08-19", "level": "High", "mps_id": "MPS-5f5e-00b0", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.openwall.com/lists/oss-security/2026/08/14/2", "name": ""}, {"url": "https://github.com/inex/IXP-Manager/security/advisories/GHSA-m7g4-g69h-vj5w", "name": ""}, {"url": "https://github.com/inex/IXP-Manager/releases/tag/v7.3.1", "name": ""}, {"url": "https://github.com/inex/IXP-Manager/releases/tag/v7.3.0", "name": ""}, {"url": "https://github.com/inex/IXP-Manager/commit/3856e936", "name": ""}, {"url": "https://github.com/inex/IXP-Manager/blob/v7.2.0/app/Http/Controllers/ApiKeyController.php", "name": ""}, {"url": "https://github.com/inex/IXP-Manager/blob/v7.2.0/app/Models/ApiKey.php", "name": ""}], "scope_influence": "", "tags": ["php", "开源"], "title": "IXP Manager API Key 更新路径 IDOR/BOLA 与 Mass Assignment 漏洞", "_translated": true, "_saved_at": "2026-08-19T06:33:33+00:00", "_first_saved_at": "2026-08-19T05:23:23+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-5f5e-00b0"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-73931", "cvss": {"cvssv31": [{"source": "secalert_us@oracle.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L", "severity": "high", "base_score": 8.3}]}, "cvss_score": 8.3, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L", "cwe": "", "description": "Oracle Fusion Middleware 的 Helidon 产品（组件：Imperative Web Server）中存在漏洞。   受影响的支持版本是 4.5.3。易于利用的漏洞允许未经身份验证的攻击者通过 HTTP 进行网络访问来危害 Helidon。  虽然该漏洞存在于 Helidon 中，但攻击可能会严重影响其他产品（范围变更）。  成功攻击此漏洞可能会导致对某些 Helidon 可访问数据进行未经授权的更新、插入或删除访问，以及对 Helidon 可访问数据的子集进行未经授权的读取访问，并导致 Helidon 的部分拒绝服务（部分 DOS）。 CVSS 3.1 基本分数 8.3（机密性、完整性和可用性影响）。  CVSS 矢量：（CVSS：3.1/AV：N/AC：L/PR：N/UI：N/S：C/C：L/I：L/A：L）。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "", "kind_en": "", "last_modified_time": "2026-08-19", "level": "High", "mps_id": "MPS-6qt7-eylc", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-6qt7-eylc", "name": "https://www.oscs1024.com/hd/MPS-6qt7-eylc"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73931", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73931"}, {"url": "https://www.oracle.com/security-alerts/cspuaug2026.html", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-73931漏洞", "_translated": true, "_saved_at": "2026-08-18T22:16:50+00:00", "_first_saved_at": "2026-08-18T22:16:50+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-6qt7-eylc"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "", "cvss": {}, "cvss_score": 8.3, "cvss_vector": "", "cwe": "CWE-79", "description": "MeshCentral 是开源的远程计算机管理服务器，提供基于 Web 的远程控制台与设备管理面板；MeshAgent 是部署在被管理主机上的轻量代理，定期通过 WebSocket 向服务器上报 coreinfo、硬件、卷信息等核心状态。\n受影响版本中，MeshCentral 服务器处理 MeshAgent 上报的核心信息时仅对字段类型做 typeof == 'string' 校验，未对内容进行 HTML 实体转义。攻击者只要控制任意一台被入侵或恶意注册的 MeshAgent，就能让 coreinfo 消息中的 osdesc、node.name、mesh.name、cpuinfo.thermals[].InstanceName、volumes[].name 等字段携带 HTML/脚本片段；这些值随后被 views/default3.handlebars 等模板的 addDeviceAttribute()、addHtmlValue() 等辅助函数拼入 HTML 字符串，再由 QH() 直接写入 innerHTML 等价位置，最终在管理员查看设备详情、文件浏览器、共享/权限对话框时被浏览器解析执行。叠加 MeshCentral 主管理界面 CSP 设置为 'unsafe-inline'（webserver.js:7072），内联事件处理器与脚本执行不受限制，攻击者借此即可在管理员会话中执行任意脚本。\n修复版本中通过 MeshCentral 1.1.60 提交 aee83b7780（PR #7823）将 addDeviceAttribute(\"Operating System\", node.osdesc)、addHtmlValue(\"Device\", node.name)、mesh.name、volumes[].name、thermals[].InstanceName 等多个渲染调用点统一用 EscapeHtml() 包裹，与同文件其它已转义位置保持一致，从 /A:H", "cwe": "CWE-98", "description": "Resido 是 SmartDataSoft 出品的商业 WordPress 房地产主题，常用于房产中介、楼盘展示与查询门户，源码通过 ThemeForest 渠道分发，并未在 GitHub 等公开仓库提供可下载源代码。\n受影响版本中，主题暴露的 Web 接口在加载模板或子页面的过程中直接把用户可控的请求参数拼入 PHP 文件包含流程，未对该参数做路径白名单、扩展名限定或 realpath 校验，攻击者只需向主题任意可访问端点提交一个指向本地文件的相对或绝对路径，未认证即可让服务器在 include/require 阶段加载并渲染该文件内容，从而读取 wp-config.php 等包含数据库凭证的敏感文件，或借助日志、PECL 等中间文件实现进一步利用。\n修复版本中通过上游官方补丁目前尚未发布，建议在官方修复发布前通过 Web 应用防火墙或 Patchstack 虚拟补丁规则拦截异常的目录穿越与 PHP 包装器 payload，并在主机与 WordPress 权限层收紧 PHP 文件可读范围直至升级至官方修复版本。", "effects": [{"comp_name": "resido", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.5]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "php远程文件包含", "kind_en": "PHP 程序中 Include/Require 语句的文件名控制不当（“PHP 远程文件包含”）", "last_modified_time": "2026-08-19", "level": "High", "mps_id": "MPS-84n7-w1fq", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-84n7-w1fq", "name": "https://www.oscs1024.com/hd/MPS-84n7-w1fq"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73387", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73387"}, {"url": "https://patchstack.com/database/wordpress/theme/resido/vulnerability/wordpress-resido-theme-1-5-local-file-inclusion-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Resido WordPress 主题本地文件包含漏洞", "_translated": true, "_saved_at": "2026-08-19T14:26:41+00:00", "_first_saved_at": "2026-08-19T13:39:23+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-84n7-w1fq"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-19942", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:H/A:H", "severity": "high", "base_score": 8.1}]}, "cvss_score": 8.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:H/A:H", "cwe": "CWE-22", "description": "Atarim（WordPress.org 插件标识 atarim-visual-collaboration）是开源 WordPress 插件，通过 MCP / DoIt 能力层向已连接的 AI 客户端提供站点编辑、媒体替换和字段写入等操作。\n受影响版本中，具备 Author 及以上权限的已认证用户可先调用 atarim/update-post-field，将自己拥有附件的 _wp_attached_file 元数据改写为目录穿越或绝对路径；随后调用 atarim/replace-media-file 时，AVCF_Abilities_Media::register 注册的 execute_callback 直接把 get_attached_file() 返回的路径交给 unlink，未校验该路径是否位于 uploads 目录内，导致可删除 wp-config.php 等任意服务器文件并进一步造成远程代码执行。该调用链可通过 MCP Adapter 默认 HTTP 接口以已登录用户身份进入。\n修复版本中通过新增 avcf_resolve_within_uploads() 在删除或覆盖前将附件路径约束在 uploads 目录内，同时禁止经通用字段能力写入穿越或绝对的 _wp_attached_file，并停止注册未设置传输门禁的 MCP Adapter 默认服务器，切断任意文件删除链路。", "effects": [{"comp_name": "atarim-visual-collaboration", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,5.1.2)", "min_fixed_version": "5.1.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-08-19", "level": "High", "mps_id": "MPS-cnlv-3wq6", "poc": false, : "什么是经典缓冲区溢出"}, {"content": "| 类型        | 描述                                                         |\n| ----------- | ------------------------------------------------------------ |\n| 代码注入攻击      | 攻击者通过向程序的缓冲区输入恶意代码，从而控制程序执行流程，实现对程序操作的恶意操作。例如，攻击者可以通过向 Web 应用程序的输入框中输入恶意代码，从而执行任意的代码，破坏系统、窃取数据等。 |\n| 数据覆盖攻击      | 攻击者通过向程序的缓冲区输入过多的数据，从而覆盖程序中的重要数据或代码，实现对程序操作的恶意操作。例如，攻击者可以通过向聊天应用程序的输入框中输入过多的表情符号，从而覆盖程序中的重要数据，例如聊天消息、账号密码等。 |\n| 栈溢出攻击 | 攻击者通过向程序的栈中输入过多的数据，从而溢出到栈外部，实现对程序操作的恶意操作。例如，攻击者可以通过向游戏应用程序的输入框中输入过多的道具名称，从而覆盖程序中的重要数据，例如游戏数据、账号密码等。 |\n| 堆溢出攻击       | 攻击者通过向程序的堆中输入过多的数据，从而溢出到堆外部，实现对程序操作的恶意操作。例如，攻击者可以通过向操作系统工具的输入框中输入过多的命令，从而覆盖程序中的重要数据，例如系统文件、配置文件等。 |", "title": "经典缓冲区溢出常见的攻击方式"}, {"content": "- 输入验证：在程序输入处对输入数据进行严格的验证和过滤，确保输入数据符合预期的格式和类型，避免被攻击者注入恶意命令或数据。可以使用正则表达式、格式字符串等方式进行输入验证。\n- 输出过滤：在程序输出处对输出数据进行严格的过滤和检查，确保输出数据符合预期的格式和类型，避免被攻击者截获和篡改。可以使用安全的输出过滤库等方式进行输出过滤。\n- 使用安全的编程模型：使用安全的编程模型，例如避免使用原生的缓冲区管理函数，使用安全的框架和库来处理输入数据和执行命令，避免缓冲区溢出漏洞。\n- 数据库加密和访问控制：对于敏感数据和命令，使用加密和访问控制措施，确保只有授权用户可以访问和执行命令，避免被攻击者窃取和篡改。\n- 定期更新和升级：定期更新和升级应用程序和库的版本，确保应用程序和库的最新版本包含了最新的安全补丁和修复措施，避免安全漏洞的出现和利用。\n- 安全审计和监控：定期对系统和应用程序进行安全审计和监控，及时发现和阻止潜在的安全漏洞和攻击，确保系统和数据的安全和可靠性。", "title": "如何预防经典缓冲区溢出"}], "cnvd_id": "", "cve_id": "CVE-2026-70415", "cvss": {"cvssv31": [{"source": "security_alert@emc.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.1}]}, "cvss_score": 8.1, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-120", "description": "Dell PowerStore 是 Dell 的企业级存储阵列产品，其内置的 PowerStore OS 通过 SDNAS（Software Defined NAS）组件对外提供 NFS/RPC 等 NAS 协议服务；SDNAS 与底层 NFS/RPC 实现为 Dell 专有闭源组件，不作为独立开源项目分发。\n受影响版本中，SDNAS 在处理远程 NFS/RPC 请求时存在未校验输入长度的缓冲区拷贝（CWE-120 经典缓冲区溢出），未经认证的远程攻击者可向受影响 PowerStore 的 NFS/RPC 服务发送包含恶意负载的网络请求触发缓冲区写入越界，进而导致命令执行或拒绝服务。\n修复版本中通过厂商安全更新 DSA-2026-330 将 PowerStore OS 中 SDNAS 的 NFS/RPC 处理路径修正为对输入数据进行长度校验，阻断未授权远程请求进入危险缓冲区写入路径，从而消除命令执行与拒绝服务风险，建议升级至 PowerStore OS 5.0.0.2-2761110 或更高版本。", "effects": [{"comp_name": "dell_powerstore", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,5.0.0.2-2761110)", "min_fixed_version": "5.0.0.2-2761110", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "经典缓冲区溢出", "kind_en": "不检查输入大小的缓冲区复制（“经典缓冲区溢出”）", "last_modified_time": "2026-08-19", "level": "High", "mps_id": "MPS-x51a-tugf", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-x51a-tugf", "name": "https://www.oscs1024.com/hd/MPS-x51a-tugf"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-70415", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-70415"}, {"url": "https://www.dell.com/support/kbdoc/en-us/000497829/dsa-2026-330-dell-powerstore-t-security-update-for-multiple-vulnerabilities", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Dell PowerStore SDNAS缓冲区溢出漏洞", "_translated": true, "_saved_at": "2026-08-18T18:28:40+00:00", "_first_saved_at": "2026-08-18T18:28:40+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-x51a-tugf"}, {"analysis_status": 0, "articles": [], "attack_vector_type": "Local", "cnvd_id": "", "cve_id": "CVE-2026-49430", "cvss": {}, "cvss_score": 7.8, "cvss_vector": "", "cwe": "CWE-122", "description": "FreeBSD 集成的 OpenZFS 是开源 ZFS 文件系统实现，用于提供快照、委托管理和 zfs receive 数据恢复等能力。\n受影响版本中，ZFS_IOC_RECV_NEW 在 heal 接收路径处理攻击者提交的 receive 流时，receive_read_record() 将 64 位载荷长度 DRR_WRITE_PAYLOAD_SIZE 截断为 32 位 int 后分配缓冲区，随后 receive_process_write_record() 在 heal 分支按原始 64 位长度对同一缓冲区执行 byteswap，导致内核堆内存损坏。\n修复版本中通过将 receive_read_record() 中的 size 改为 uint64_t，并在超过 SPA_MAXBLOCKSIZE 时返回 ERANGE，使分配长度与后续 byteswap 使用同一经过上限校验的 64 位大小，阻断内核内存越界。", "effects": [{"comp_name": "FreeBSD", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,14.3-RELEASE-p16)", "min_fixed_version": "14.3-RELEASE-p16", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,15.0-RELEASE-p11)", "min_fixed_version": "15.0-RELEASE-p11", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,14.4-RELEASE-p7)", "min_fixed_version": "14.4-RELEASE-p7", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,15.1-RELEASE-p1)", "min_fixed_version": "15.1-RELEASE-p1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "堆缓冲区溢出", "kind_en": "基于堆的缓冲区溢出", "last_modified_time": "2026-08-19", "level": "High", "mps_id": "MPS-1096-grv2", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-1096-grv2", "name": "https://www.oscs1024.com/hd/MPS-1096-grv2"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-49430", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-49430"}, {"url": "https://security.freebsd.org/advisories/FreeBSD-SA-26:40.zfs.asc", "name": ""}], "scope_influence": "", "tags": ["操作系统"], "title": "ZFS接收路径堆溢出", "_translated": true, "_saved_at": "2026-08-19T08:29:19+00:00", "_first_saved_at": "2026-08-19T08:29:19+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-1096-grv2"}, {"analysis_status": 0, "articles": [], "attack_vector_type": "Local", "cnvd_id": "", "cve_id": "CVE-2026-49419", "cvss": {}, "cvss_score": 7.8, "cvss_vector": "", "cwe": "CWE-911", "description": "FreeBSD 是开源 UNIX 类操作系统，其 Jail 子系统提供操作系统级进程隔离；自 15.0 起，jail_set(2) 与 jail_get(2) 支持 JAIL_AT_DESC，使调用可在 jail 描述符所指 prison 的上下文中创建或查询 jail。\n受影响版本中，指定 JAIL_AT_DESC 时，kern_jail_set() 与 kern_jail_get() 在调用 jaildesc_find() 查找描述符对应 prison 之前，先对调用者当前 prison 指针 mypr 执行 prison_free()。若描述符无效或指向已销毁 jail，查找失败后的 done_errmsg/done 路径会再次 prison_free(mypr)，造成引用计数下溢，prison 结构体可能在仍被使用时被释放。无特权本地用户可经 jail_set(2)/jail_get(2) 触发该路径：在宿主上通常立即导致内核 panic，在 jail 内则可能被用于提升权限。\n修复版本中通过先将 jaildesc_find() 结果写入临时指针 jdpr，仅在查找成功后再 prison_free(mypr) 并切换 mypr，使查找失败时错误路径不再二次释放当前 prison，从而消除引用计数下溢。", "effects": [{"comp_name": "freebsd", "ecosystem": "linux", "versions": [{"affected_version": "[15.0-RELEASE,15.0-RELEASE-p11)", "min_fixed_version": "15.0-RELEASE-p11", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[15.1-RELEASE,15.1-RELEASE-p1)", "min_fixed_version": "15.1-RELEASE-p1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "引用计数的更新不恰当", "kind_en": "引用计数更新不当", "last_modified_time": "2026-08-19", "level": "High", "mps_id": "MPS-3efy-v6qk", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-3efy-v6qk", "name": "https://www.oscs1024.com/hd/MPS-3efy-v6qk"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-49419", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-49419"}, {"url": "https://security.freebsd.org/advisories/FreeBSD-SA-26:38.jail.asc", "name": ""}], "scope_influence": "", "tags": ["操作系统"], "title": "FreeBSD Jail引用计数下溢", "_translated": true, "_saved_at": "2026-08-19T06:33:26+00:00", "_first_saved_at": "2026-08-19T06:33:26+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-3efy-v6qk"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-58088", "cvss": {}, "cvss_score": 7.8, "cvss_vector": "", "cwe": "CWE-787", "description": "FreeBSD 是开源类 Unix 操作系统，sys/kern/imgact_elf.c 中的 ELF 核心转储代码负责在进程崩溃或被请求时将进程虚拟内存布局以 ELF 格式写入 core 文件。\n受影响版本中，imgact_elf.c 的 __elfN(corehdr) 流程先统计 vmspace 中可转储 VM map 项数并按该数量分配程序头缓冲区，再以 each_dumpable_segment 回调 cb_put_phdr 第二次遍历 map 填充程序头。通过 rfork(2) 共享地址空间的进程可以在两次遍历之间修改自身 map 项，使第二遍写入超出按初值分配缓冲区边界，造成内核堆越界写入，可能被进一步利用以提升本地权限。\n修复版本中通过为 struct phdr_closure 增加 numsegs 与 nextseg 字段，在 cb_put_phdr 回调里判断 nextseg \u003e= numsegs 时直接返回，并在分配程序头缓冲区时使用 M_ZERO 标志将其清零，确保未被填充的项保持初始化状态，从而切断共享地址空间竞态触发的越界写入路径。", "effects": [{"comp_name": "freebsd", "ecosystem": "linux", "versions": [{"affected_version": "[15.0-RELEASE,15.0-RELEASE-p12)", "min_fixed_version": "15.0-RELEASE-p12", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,14.4-RELEASE-p8)", "min_fixed_version": "14.4-RELEASE-p8", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[15.1-RELEASE,15.1-RELEASE-p2)", "min_fixed_version": "15.1-RELEASE-p2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-08-19", "level": "High", "mps_id": "MPS-5tj6-prgb", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-5tj6-prgb", "name": "https://www.oscs1024.com/hd/MPS-5tj6-prgb"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-58088", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-58088"}, {"url": "https://security.freebsd.org/advisories/FreeBSD-SA-26:55.elf.asc", "name": ""}], "scope_influence": "", "tags": [], "title": "FreeBSD ELF核心转储竞争漏洞", "_translated": true, "_saved_at": "2026-08-19T09:26:50+00:00", "_first_saved_at": "2026-08-19T09:26:50+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-5tj6-prgb"}, {"analysis_status": 0, "articles": [], "attack_vector_type": "Local", "cnvd_id": "", "cve_id": "CVE-2026-49427", "cvss": {}, "cvss_score": 7.8, "cvss_vector": "", "cwe": "CWE-826", "description": "FreeBSD 是开源 UNIX 类操作系统，内核 posixshm 模块提供 POSIX 共享内存，并支持通过 shm_create_largepage(3) 创建由物理连续大页支撑的 largepage 对象。\n受影响版本中，largepage 共享内存对象的物理页未被显式 wired。本地无特权用户可对仍存在映射的该对象调用 sendfile(2) 并传入 SF_NOCACHE，传输完成后 vm_page_release() 会释放底层页，用户空间 unmanaged 映射仍指向已释放内核内存，可被用于提权。\n修复版本中通过在 shm_dotruncate_largepage 分配页时加入 VM_ALLOC_WIRED，在 shm_largepage_phys_ctor 设置 OBJ_PG_DTOR，改由对象析构路径 unwire 并释放，同时让 vm_page_release 对 unmanaged 页只做 unwire，切断 SF_NOCACHE 提前释放仍被映射引用之页的路径。", "effects": [{"comp_name": "freebsd", "ecosystem": "linux", "versions": [{"affected_version": "[15.1-RELEASE,15.1-RELEASE-p1)", "min_fixed_version": "15.1-RELEASE-p1", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[14.3-RELEASE,14.3-RELEASE-p16)", "min_fixed_version": "14.3-RELEASE-p16", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[15.0-RELEASE,15.0-RELEASE-p11)", "min_fixed_version": "15.0-RELEASE-p11", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[14.4-RELEASE,14.4-RELEASE-p7)", "min_fixed_version": "14.4-RELEASE-p7", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "在预期生命周期中对资源的过早释放", "kind_en": "在预期生命周期内过早释放资源", "last_modified_time": "2026-08-19", "level": "High", "mps_id": "MPS-7ud4-vxq0", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-7ud4-vxq0", "name": "https://www.oscs1024.com/hd/MPS-7ud4-vxq0"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-49427", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-49427"}, {"url": "https://security.freebsd.org/advisories/FreeBSD-SA-26:44.posixshm.asc", "name": ""}], "scope_influence": "", "tags": ["操作系统"], "title": "FreeBSD内核页提前释放漏洞", "_translated": true, "_saved_at": "2026-08-19T08:29:25+00:00", "_first_saved_at": "2026-08-19T08:29:25+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-7ud4-vxq0"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "attack_vector_type": "Local", "cnvd_id": "", "cve_id": "CVE-2026-49418", "cvss": {}, "cvss_score": 7.8, "cvss_vector": "", "cwe": "CWE-416", "description": "FreeBSD 是开源操作系统，其虚拟内存子系统通过 device pager 管理可内存映射设备页，非托管设备对象维护内部页链表以便在映射销毁时释放这些页。\n受影响版本中，对非托管设备对象映射调用 msync(MS_INVALIDATE) 时，范围内物理页会被标为无效但仍留在 pager 的 devp_pglist 中；随后缺页由 dev_pager_getpages() 再次把同一页插入该链表，链表损坏，对象销毁时页面被释放两次，可导致内核释放后使用。\n修复版本中通过取消 devp_pglist 链表维护切断重复插入路径，对 OBJT_DEVICE 设置 OBJ_PG_DTOR，改由 dev_pager_dealloc() 按对象页集合释放虚构页，避免双重释放。", "effects": [{"comp_name": "freebsd", "ecosystem": "linux", "versions": [{"affected_version": "[15.1-RELEASE,15.1-RELEASE-p1)", "min_fixed_version": "15.1-RELEASE-p1", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_ver
