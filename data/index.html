_i3c_transfer() 直接在调用方传入的 struct i3c_device_desc 上执行检查，仅以 K_SYSCALL_MEMORY_READ() 确认该内存可读，读取 target-\u003ebus 一次并经 K_SYSCALL_OBJ() 校验后继续把调用方的原始指针传递给实现函数；z_impl_i3c_transfer() 会再次从用户内存读取 target-\u003ebus，并经 DEVICE_API_GET(i3c, target-\u003ebus)-\u003ei3c_xfers(...) 完成间接调用，DEVICE_API_GET() 在未启用 CONFIG_DEVICE_API_ASSERT 的构建中仅做指针强转，没有运行时类型校验。已获得 I3C 设备对象授权的用户线程可与同一内存域内的另一线程配合，在线程调用 i3c_transfer() 期间反复改写描述符中的 bus 字段，检查与使用之间的窗口覆盖 num_msgs 校验、消息数组访问检查、栈上 VLA 分配以及最多 32 个 struct i3c_msg 的内存拷贝，竞态可反复重试直至命中；命中后内核以 struct device 解引用攻击者选定指针，从攻击者控制的 api 表加载函数指针并在监管模式下调用，使非特权用户线程获得内核态代码执行，完全逃逸用户空间内存保护沙箱，次级后果为两级内核任意读或内核崩溃。\n修复版本中通过在 z_vrfy_i3c_transfer() 内改用 k_usermode_from_copy() 将调用方描述符整体快照到内核栈本地副本 target_copy，对副本中的 bus 字段执行 K_SYSCALL_OBJ() 校验，并以该副本继续完成消息拷贝与派发，使被校验的总线对象与实际参与派发的总线对象保持一致，切断了检查与使用之间可被竞态改写的二次读取窗口。", "effects": [{"comp_name": "zephyr", "ecosystem": "linux", "versions": [{"affected_version": "[3.2.0,4.3.2)", "min_fixed_version": "4.3.2", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[4.4.0,4.5.0)", "min_fixed_version": "4.5.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "检查时间与使用时间(TOCTOU)的竞争条件", "kind_en": "检查时间使用时间 (TOCTOU) 竞争条件", "last_modified_time": "2026-11-04", "level": "High", "mps_id": "MPS-xne2-rdjf", "poc": false, "poc_url": [], "published_time": "2026-11-04", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-xne2-rdjf", "name": "https://www.oscs1024.com/hd/MPS-xne2-rdjf"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-87038", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-87038"}, {"url": "https://github.com/zephyrproject-rtos/zephyr/commit/550437bc9efd7b733f13b9be73e77fd98858c8a2", "name": "Fix commit"}, {"url": "https://github.com/zephyrproject-rtos/zephyr/security/advisories/GHSA-86xj-2q6x-h82w", "name": "GHSA-86xj-2q6x-h82w"}], "scope_influence": "", "tags": ["应用软件"], "title": "Zephyr I3C竞态条件漏洞", "_translated": true, "_saved_at": "2026-11-04T08:27:12+00:00", "_first_saved_at": "2026-11-04T08:27:12+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-xne2-rdjf"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-13292", "cvss": {"cvssv31": [{"source": "psirt@us.ibm.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-15", "description": "IBM MQ 是 IBM 商业消息中间件，用于企业级消息传递与应用集成，未公开源码；Managed File Transfer 是其可选安装组件，用于在企业网络内托管和自动化文件传输。\n受影响版本中，Managed File Transfer 的传输请求元数据可携带环境变量并进入文件传输代理的执行环境，持有传输请求提交权限的认证攻击者可通过传输请求元数据注入恶意环境变量，在代理运行的主机上执行任意代码。\n修复版本中通过官方安全累计更新与版本升级收紧了传输请求元数据中环境变量的处理，阻止不可信环境变量进入传输代理执行环境；厂商公告未披露更细粒度的源码修改。", "effects": [{"comp_name": "ibm_mq", "ecosystem": "linux", "versions": [{"affected_version": "[9.4.0.0,9.4.0.30)", "min_fixed_version": "9.4.0.30", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[9.2.0.0,9.2.0.46)", "min_fixed_version": "9.2.0.46", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[9.3.0.0,9.3.0.43)", "min_fixed_version": "9.3.0.43", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[9.4.0.0,10.0.1.0)", "min_fixed_version": "10.0.1.0", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[10.0.0.0,10.0.0.6)", "min_fixed_version": "10.0.0.6", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "系统设置或配置在外部可控制", "kind_en": "系统或配置设置的外部控制", "last_modified_time": "2026-11-05", "level": "High", "mps_id": "MPS-16cd-7i5a", "poc": false, "poc_url": [], "published_time": "2026-11-05", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-16cd-7i5a", "name": "https://www.oscs1024.com/hd/MPS-16cd-7i5a"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-13292", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-13292"}, {"url": "https://www.ibm.com/support/pages/node/7294641", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "IBM MQ环境变量注入漏洞", "_translated": true, "_saved_at": "2026-11-04T22:20:05+00:00", "_first_saved_at": "2026-11-04T22:20:05+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-16cd-7i5a"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-118869", "cvss": {"cvssv3": [{"source": "vultures@jpcert.or.jp", "vector": "CVSS:3.0/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}], "cvssv4": [{"source": "vultures@jpcert.or.jp", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-78", "description": "SHIRASAGI是SHIRASAGI Project开发的开源Ruby on Rails内容管理系统（CMS），面向日本政府与公共机构网站，提供多站点内容管理和开放数据（Open Data）发布等能力，源码托管于GitHub。\n受影响版本中，开放数据采集导入（Harvest Importer）的source_url仅做存在性校验，validate_host只调用Addressable::URI.parse解析并回填source_host、未校验URL格式，形如|touch /tmp/hacked的命令串可通过校验保存；具备采集管理权限的认证用户在后台导入表单URL字段填入该命令串并保存后，点击导入按钮触发Opendata::Harvest::ImportJob，任务调用import_from_ckan_api把source_url传入Opendata::Harvest::CkanPackage#package_list，该方法以::URI.open读取拼接后的地址，URI.open对以竖线开头的字符串回退到Kernel#open并经IO.popen执行，最终在运行产品的系统上以服务进程权限执行任意OS命令。\n修复版本中通过校验与调用两层措施切断上述链条：为source_url/url增加url:true格式校验并强制source_host/host存在，使以竖线开头的命令串在保存阶段被拒绝；同时把ckan_package、shirasagi_package、shirasagi_scraper、facility/assoc_job、voice/downloadable与sparql中的::URI.open全部替换为不执行命令的::OpenURI.open_uri，并以新增回归测试断言恶意URL不再产生命令副作用。", "effects": [{"comp_name": "shirasagi", "ecosystem": "linux", "versions": [{"affected_version": "[1.19.0,1.21.1)", "min_fixed_version": "1.21.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-11-05", "level": "High", "mps_id": "MPS-1nm0-fwaq", "poc": false, "poc_url": [], "published_time": "2026-11-05", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-1nm0-fwaq", "name": "https://www.oscs1024.com/hd/MPS-1nm0-fwaq"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-118869", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-118869"}, {"url": "https://www.ss-proj.org/support/1743.html", "name": ""}, {"url": "https://jvn.jp/en/jp/JVN55454512/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "SHIRASAGI命令注入漏洞", "_translated": true, "_saved_at": "2026-11-05T11:46:01+00:00", "_first_saved_at": "2026-11-05T11:46:01+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-1nm0-fwaq"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-76892", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-248", "description": "tsParticles是一个用于创建高度可定制粒子动画效果的开源TypeScript库，@tsparticles/mcp-server是该项目的官方MCP服务器集成包，可通过stdio或HTTP模式向大模型客户端提供粒子选项生成、插件推荐等工具与资源。\n受影响版本中，HTTP模式在integrations/mcp-server/src/index.ts的startHttp函数内通过createServer注册异步请求回调，其POST /mcp分支读取请求体后直接调用JSON.parse进行解析，该调用未包裹任何try/catch错误边界，未经认证的远程攻击者发送一个格式非法的JSON请求体，触发未捕获的SyntaxError，异步回调返回的Promise被拒绝且无人处理，Node.js进程随之异常终止，MCP服务在外部监管进程重启前持续不可用。\n修复版本中通过在POST /mcp分支为请求体读取与JSON.parse分别添加try/catch错误边界完成修复，请求体读取异常时返回HTTP 413，JSON解析失败时返回HTTP 400与Invalid JSON错误响应，单个恶意请求的影响被限制在该请求生命周期内，服务进程保持存活。", "effects": [{"comp_name": "@tsparticles/mcp-server", "ecosystem": "npm", "versions": [{"affected_version": "(-∞,4.3.1)", "min_fixed_version": "4.3.1", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "未捕获的异常", "kind_en": "未捕获的异常", "last_modified_time": "2026-11-05", "level": "High", "mps_id": "MPS-kify-taw4", "poc": false, "poc_url": [], "published_time": "2026-11-05", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-kify-taw4", "name": "https://www.oscs1024.com/hd/MPS-kify-taw4"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-76892", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-76892"}, {"url": "https://github.com/tsparticles/tsparticles/security/advisories/GHSA-4p8p-pjpq-2w7h", "name": "https://github.com/tsparticles/tsparticles/security/advisories/GHSA-4p8p-pjpq-2w7h"}, {"url": "https://github.com/tsparticles/tsparticles/pull/5875", "name": "https://github.com/tsparticles/tsparticles/pull/5875"}, {"url": "https://github.com/tsparticles/tsparticles/commit/25fb70e7f527a91568adaef576570289083f243b", "name": "https://github.com/tsparticles/tsparticles/commit/25fb70e7f527a91568adaef576570289083f243b"}], "scope_influence": "", "tags": ["AI", "npm", "开源"], "title": "tsParticles MCP服务器拒绝服务漏洞", "_translated": true, "_saved_at": "2026-11-05T03:01:13+00:00", "_first_saved_at": "2026-11-05T03:01:13+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-kify-taw4"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-123033", "cvss": {"cvssv31": [{"source": "cve@mitre.org", "vector": "CVSS:3.1/AV:A/AC:H/PR:N/UI:N/S:C/C:H/I:H/A:H", "severity": "high", "base_score": 8.3}]}, "cvss_score": 8.3, "cvss_vector": "CVSS:3.1/AV:A/AC:H/PR:N/UI:N/S:C/C:H/I:H/A:H", "cwe": "CWE-290", "description": "TrueNAS SCALE 是 iXsystems 开发的开源网络存储操作系统，middlewared 是其核心中间件服务，通过 WebSocket API 对外提供系统管理能力。\n受影响版本中，middlewared 在 setup 阶段无条件注册 core.on_connect 钩子 ha_permission，不检查 failover 许可与心跳接口；该钩子在 app.origin.is_ha_connection 为真时调用 AuthService.session_manager.login，授予 TruenasNodeSessionManagerCredentials 节点凭据，而该凭据对所有 API 方法具备完整管理员权限。ConnectionOrigin.is_ha_connection 仅校验对端地址属于硬编码心跳地址 169.254.10.1/169.254.10.2 且对端端口不超过 1024，两者均为攻击者自身套接字的属性，同一二层网段内的攻击者把本机地址设为上述链路本地心跳地址并绑定特权源端口后连接管理接口，未认证的 WebSocket 连接便能通过节点凭据校验获得完整管理员 API 权限，进而以 root 身份执行命令。\n修复版本中通过在 is_ha_connection 中追加本地端点校验切断该链路，要求连接终止于本机 HA 心跳监听器，本地地址属于 169.254.10.1/169.254.10.2、本地端口为 6000 且本地地址与对端地址不同；该监听器仅绑定在 HA 心跳接口上，nginx 不会向其转发流量，攻击者无法控制本地端点，管理接口上的普通流量不再满足节点凭据授予条件。", "effects": [{"comp_name": "truenas_scale", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,25.10.8)", "min_fixed_version": "25.10.8", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "使用欺骗进行的认证绕过", "kind_en": "通过欺骗绕过身份验证", "last_modified_time": "2026-11-05", "level": "High", "mps_id": "MPS-4hou-cxvt", "poc": false, "poc_url": [], "published_time": "2026-11-05", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-4hou-cxvt", "name": "https://www.oscs1024.com/hd/MPS-4hou-cxvt"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-123033", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-123033"}, {"url": "https://security.truenas.com/scale/impact-statements/ha-node-auth-bypass/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "TrueNAS SCALE认证绕过漏洞", "_translated": true, "_saved_at": "2026-11-05T11:46:11+00:00", "_first_saved_at": "2026-11-05T11:46:11+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-4hou-cxvt"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-121489", "cvss": {}, "cvss_score": 8.1, "cvss_vector": "", "cwe": "CWE-22", "description": "Apache Juneau 是 Apache 软件基金会开源的 Java 序列化与 REST 微服务框架，juneau-microservice-core 模块内置的 DirectoryResource 资源用于通过 REST 接口浏览、查看、上传与删除指定根目录下的文件。\n受影响版本中，DirectoryResource 的 getFile 方法直接将请求路径与根目录绝对路径拼接构造 File 对象，仅检查目标文件是否存在，未校验解析结果是否仍位于配置的根目录之内，攻击者在 URL 路径中使用 ../ 段、绝对路径或指向根目录外的符号链接可访问服务器进程权限内的任意文件；当应用启用 allowViews、allowDeletes 或 allowUploads 时，攻击者可分别实现任意文件读取、删除或写入，这些开关默认关闭，仅显式启用相关功能的应用受影响。\n修复版本中通过 FileUtils.resolveSafely 方法先规范化根目录，再将请求路径解析并规范化后校验其是否以根目录为前缀，并复核符号链接的真实指向，任何逃逸根目录的请求返回 403 Forbidden，根目录内不存在的路径仍返回 404，从而切断路径穿越链路。", "effects": [{"comp_name": "org.apache.juneau:juneau-commons", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,9.2.1)", "min_fixed_version": "9.2.1", "repository": "maven", "solutions": [], "upstream": true}]}, {"comp_name": "org.apache.juneau:juneau-microservice-core", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,9.2.1)", "min_fixed_version": "9.2.1", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-11-05", "level": "High", "mps_id": "MPS-d16d-c4c8", "poc": false, "poc_url": [], "published_time": "2026-11-05", "reference_url_list": [{"url": "https://www.openwall.com/lists/oss-security/2026/11/04/7", "name": ""}, {"url": "https://juneau.apache.org/docs/release-notes/9.2.1", "name": ""}, {"url": "https://github.com/apache/juneau/commit/b91bce161713998fc9953b713263cd894af2931d", "name": ""}, {"url": "https://github.com/apache/juneau/releases/tag/juneau-9.2.1", "name": ""}, {"url": "https://downloads.apache.org/juneau/9.2.1/", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "Juneau路径穿越漏洞", "_translated": true, "_saved_at": "2026-11-04T16:44:55+00:00", "_first_saved_at": "2026-11-04T16:44:55+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-d16d-c4c8"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-73116", "cvss": {}, "cvss_score": 7.5, "cvss_vector": "", "cwe": "CWE-522", "description": "Apache Juneau 是 Apache 软件基金会开源的 Java REST 服务与序列化框架，其中 juneau-rest-client 模块提供基于 RestClient 构建器的 REST 客户端，用于应用与远程服务之间的 HTTP 调用。\n受影响版本中，RestClient.Builder 的 createHttpClient() 方法直接以默认重定向策略构建底层 Apache HttpClient，未注册任何凭据防护拦截器，HttpClient 默认重定向执行器在跟随 3xx 重定向时会把原请求的全部请求头复制到跳转请求，Authorization、Cookie、Proxy-Authorization、X-API-Key 等凭据头随请求被发往 Location 指向的不同主机或不同端口目标，重定向由 HTTPS 降级为 HTTP 时凭据以明文发出，控制该服务端或能诱导其返回跨源重定向的攻击者由此获得这些凭据。\n修复版本中通过在 createHttpClient() 中注册 RedirectCredentialGuard 拦截器修复该问题，拦截器记录一次请求交换中首个请求的源站，后续请求经 RedirectSecurity.shouldStripCredentials() 判定源站变化或 HTTPS 降级 HTTP 后，按 RedactedHeaders 定义的凭据头集合移除 Authorization、Cookie、Set-Cookie、Proxy-Authorization、X-API-Key，阻止凭据转发到其他源站；该保护仅覆盖由 RestClient 构建器创建的 HTTP 客户端。", "effects": [{"comp_name": "org.apache.juneau:juneau-rest-client", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,9.2.1)", "min_fixed_version": "9.2.1", "repository": "maven", "solutions": [], "upstream": true}]}, {"comp_name": "org.apache.juneau:juneau-rest-common", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,9.2.1)", "min_fixed_version": "9.2.1", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "凭证保护不足", "kind_en": "凭证保护不足", "last_modified_time": "2026-11-05", "level": "High", "mps_id": "MPS-5a1c-a752", "poc": false, "poc_url": [], "published_time": "2026-11-05", "reference_url_list": [{"url": "https://www.openwall.com/lists/oss-security/2026/11/04/7", "name": ""}, {"url": "https://juneau.apache.org/security", "name": ""}, {"url": "https://downloads.apache.org/juneau/9.2.1/", "name": ""}, {"url": "https://github.com/apache/juneau/releases/tag/juneau-9.2.1", "name": ""}, {"url": "https://github.com/apache/juneau/commit/81677c11fb4b35157ea176a97af0ace82126d25e", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "Juneau REST客户端重定向凭据泄露漏洞", "_translated": true, "_saved_at": "2026-11-04T16:44:56+00:00", "_first_saved_at": "2026-11-04T16:44:56+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-5a1c-a752"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-73100", "cvss": {}, "cvss_score": 7.5, "cvss_vector": "", "cwe": "CWE-532", "description": "Apache Juneau 是 Apache 软件基金会的开源 Java 工具包，提供 POJO 序列化框架与基于 Servlet 的 REST 服务端组件，通过 Maven org.apache.juneau 坐标分发。\n受影响版本中，REST 服务端默认调用日志器 BasicCallLogger 针对状态码 500 以上的请求按 HEADER 级别记录请求头，CallLogger 的 log(HttpServletRequest, HttpServletResponse) 方法将 req.getHeader(h) 返回的头部值原样拼入日志文本且未做任何脱敏，任意能触发服务端 5xx 响应的客户端会使该请求中的 Authorization、Cookie、Proxy-Authorization、X-API-Key 等凭据请求头以明文形式写入应用日志，可读取日志的人由此获得这些凭据。\n修复版本中通过在 CallLogger 写入日志前将请求头与响应头值统一交由新增的 RedactedHeaders.redact 方法处理实现脱敏，默认命中 Authorization、Cookie、Set-Cookie、Proxy-Authorization、X-API-Key 五类凭据头时以 [REDACTED] 占位符替代真实值，并支持经 redactedHeaders(String...) 与 redactHeader(String) 调整脱敏名单，切断凭据写入日志的路径。", "effects": [{"comp_name": "org.apache.juneau:juneau-rest-common", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,9.2.1)", "min_fixed_version": "9.2.1", "repository": "maven", "solutions": [], "upstream": true}]}, {"comp_name": "org.apache.juneau:juneau-rest-server", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,9.2.1)", "min_fixed_version": "9.2.1", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "日志敏感信息泄露", "kind_en": "将敏感信息插入日志文件", "last_modified_time": "2026-11-05", "level": "High", "mps_id": "MPS-9147-2d90", "poc": false, "poc_url": [], "published_time": "2026-11-05", "reference_url_list": [{"url": "https://www.openwall.com/lists/oss-security/2026/11/04/7", "name": ""}, {"url": "https://juneau.apache.org/security", "name": ""}, {"url": "https://github.com/apache/juneau/releases/tag/juneau-9.2.1", "name": ""}, {"url": "https://downloads.apache.org/juneau/9.2.1/", "name": ""}, {"url": "https://github.com/apache/juneau/commit/81677c11fb4b35157ea176a97af0ace82126d25e", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "Apache Juneau敏感请求头明文日志漏洞", "_translated": true, "_saved_at": "2026-11-04T16:44:57+00:00", "_first_saved_at": "2026-11-04T16:44:57+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-9147-2d90"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-76826", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:A/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:A/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-78", "description": "tsParticles 是一个开源的 TypeScript 粒子动画库，经 npm 发布，用于在网页中创建可高度定制的粒子动画效果。\n受影响版本中，仓库的稳定版发布工作流在 Prettify changelog 步骤把生成的发布说明正文 steps.release.outputs.body 直接内插进 echo 命令的 shell 源码（echo \"${{ steps.release.outputs.body }}\" \u003e RAW_RELEASE.md），发布说明中的贡献者可控文本（例如被合并 PR 的标题）携带 shell 元字符时，维护者发布稳定版本会触发任意命令执行；发布作业持有 id-token: write 与 contents: write 权限，后续步骤还携带 GITHUB_TOKEN 并 source 工作区脚本，攻击者可篡改发布产物或覆盖后续步骤引用的脚本，影响持有写权限的发布环节。\n修复版本中通过新增环境变量 RELEASE_BODY 承载发布说明正文，并以 printf '%s\\n' \"$RELEASE_BODY\" \u003e RAW_RELEASE.md 写入文件，发布说明文本不再进入 shell 源码，元字符失去求值机会，切断了发布说明到命令执行的注入链路。", "effects": [{"comp_name": "tsparticles", "ecosystem": "linux", "versions": [{"affected_version": "[4.0.0,4.3.2)", "min_fixed_version": "4.3.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-11-05", "level": "High", "mps_id": "MPS-94j1-cftm", "poc": false, "poc_url": [], "published_time": "2026-11-05", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-94j1-cftm", "name": "https://www.oscs1024.com/hd/MPS-94j1-cftm"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-76826", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-76826"}, {"url": "https://github.com/tsparticles/tsparticles/security/advisories/GHSA-gw8q-3x59-mjjx", "name": "https://github.com/tsparticles/tsparticles/security/advisories/GHSA-gw8q-3x59-mjjx"}, {"url": "https://github.com/tsparticles/tsparticles/pull/5888", "name": "https://github.com/tsparticles/tsparticles/pull/5888"}, {"url": "https://github.com/tsparticles/tsparticles/commit/d3b5672bd61bb847abfa21193c34eabf7aba6896", "name": "https://github.com/tsparticles/tsparticles/commit/d3b5672bd61bb847abfa21193c34eabf7aba6896"}], "scope_influence": "", "tags": ["应用软件"], "title": "tsParticles发布流程命令注入漏洞", "_translated": true, "_saved_at": "2026-11-05T03:01:12+00:00", "_first_saved_at": "2026-11-05T03:01:12+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-94j1-cftm"}, {"analysis_status": 0, "articles": [{"content": "跨界内存读是指应用程序在读取内存时，未正确验证或限制读取的内存范围。攻击者利用这种漏洞可以读取应用程序内存中的敏感数据，如密码、加密密钥、会话令牌等。常见的原因是由于缓冲区溢出、格式化字符串漏洞或其他内存错误导致的。", "title": "什么是越界读取"}, {"content": "攻击者可以通过不当构造的输入来触发跨界内存读漏洞。攻击者可能会通过向应用程序发送特定的输入，使其读取超过预期的内存区域。攻击者可以利用这个漏洞来获取敏感信息，如其他用户的数据、操作系统的敏感数据或应用程序的内部状态。", "title": "越界读取常见的攻击方式"}, {"content": "- 输入验证和限制：应用程序应对所有输入数据进行严格的验证和限制。确保输入数据的长度、格式和内容符合预期，避免超出缓冲区或访问非预期的内存区域。\n- 内存安全编程实践：开发人员应使用安全的编程实践，如避免使用不安全的函数、正确处理内存分配和释放操作，以及遵循最小特权原则。\n- 使用安全的编程语言和库：选择使用安全性较高的编程语言和库，这些语言和库在内存管理和安全性方面提供了更多的保护机制。\n- 定期进行代码审查和安全测试：定期审查应用程序的代码，并进行安全测试，以发现潜在的跨界内存读漏洞。使用静态代码分析工具和漏洞扫描工具来辅助检测和修复问题。\n- 实施防御性编程技术：应用程序应采用防御性编程技术，如使用随机化地址空间布局（ASLR）、堆栈保护机制（如堆栈溢出保护）和数据执行预防（DEP）等。\n- 及时更新和修补：及时应用程序和操作系统的安全更新和补丁，以确保已知的跨界内存读漏洞得到修复。及时更新相关软件和库，以避免使用已知存在漏洞的版本。", "title": "如何预防越界读取"}], "cnvd_id": "", "cve_id": "CVE-2026-17493", "cvss": {"cvssv31": [{"source": "psirt@us.ibm.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-125", "description": "IBM Watson Speech Services Cartridge 是 IBM 商业闭源软件，作为 Cloud Pak for Data 上的语音服务组件运行，提供语音识别与语音合成等 Speech 运行时能力。\n受影响版本中，Speech 运行时使用的 Unpacker 在处理外部不可信输入时存在越界读取（CWE-125）。IBM 官方公告说明，Unpacker 在发生错误后仍被重复使用时，越界读取可触发段错误（SEGV），导致 Speech 运行时进程崩溃，攻击者可从外部输入远程发起并造成拒绝服务。\n修复版本中通过安装 IBM 官方 5.4.0 Patch 8 修复该问题，补丁适用于 4.0.0 至 5.4.0 全部受影响版本，修复后消除了错误状态下重复使用 Unpacker 引发的越界读取崩溃；官方未披露源码级修复细节，也未提供变通方案。", "effects": [{"comp_name": "watson_speech_services_cartridge", "ecosystem": "linux", "versions": [{"affected_version": "[4.0.0,5.4.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界读取", "kind_en": "越界读取", "last_modified_tim  "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "未能安全地进行程序失效（Failing Open）", "kind_en": "未安全失败（“打开失败”）", "last_modified_time": "2026-11-05", "level": "High", "mps_id": "MPS-zowp-gcrf", "poc": false, "poc_url": [], "published_time": "2026-11-05", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-zowp-gcrf", "name": "https://www.oscs1024.com/hd/MPS-zowp-gcrf"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-109408", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-109408"}, {"url": "https://github.com/jopenlibs/vault-java-driver/pull/78", "name": ""}, {"url": "https://repo.maven.apache.org/maven2/io/github/jopenlibs/vault-java-driver/7.0.0/", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "vault-java-driver TLS证书校验失效漏洞", "_translated": true, "_saved_at": "2026-11-05T11:46:03+00:00", "_first_saved_at": "2026-11-05T11:46:03+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-zowp-gcrf"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-100168", "cvss": {}, "cvss_score": 7.1, "cvss_vector": "", "cwe": "CWE-862", "description": "Apache OFBiz 是 Apache 软件基金会开源的企业级 ERP 与电子商务应用框架，其内容管理组件提供基于 JSON 请求的内容维护接口，用于管理内容关联与站点路径别名。\n受影响版本中，ContentJsonEvents 类的 moveContent 与 deleteContent 方法分别响应 /content/control/moveContentJson 与 /content/control/deleteContentJson 请求，在变更 ContentAssoc 内容关联以及级联删除 WebSitePathAlias 路径别名前未调用 genericContentPermission 服务进行 UPDATE、DELETE 权限校验，任何已登录用户（包括仅具备只读权限的用户）均可直接请求上述接口，移动或删除其无权管理的内容关联，破坏站点内容结构并导致线上路径别名被级联清除。\n修复版本中通过在执行变更前调用 genericContentPermission 服务分别校验新旧父内容与目标内容的 UPDATE、DELETE 权限，校验未通过时抛出异常终止操作，阻断低权限用户对内容关联与路径别名的未授权变更。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-11-05", "level": "High", "mps_id": "MPS-7b69-dbe7", "poc": false, "poc_url": [], "published_time": "2026-11-05", "reference_url_list": [{"url": "https://seclists.org/oss-sec/2026/q4/516", "name": ""}, {"url": "https://ofbiz.apache.org/security.html", "name": ""}, {"url": "https://github.com/apache/ofbiz-framework/pull/2065", "name": ""}, {"url": "https://github.com/apache/ofbiz-framework/pull/2100", "name": ""}], "scope_influence": "", "tags": [], "title": "Apache OFBiz内容管理接口缺失授权漏洞", "_translated": true, "_saved_at": "2026-11-05T03:01:10+00:00", "_first_saved_at": "2026-11-05T03:01:10+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-7b69-dbe7"}, {"analysis_status": 0, "articles": [{"content": "跨站点请求伪造 (CSRF)通过利用网站对用户请求的信任进行攻击。当用户在网站A登录并在同一浏览器会话中访问网站B时，攻击者可以构造特制的请求并诱使用户执行，以使网站B误以为这些请求是用户合法发起的。\n攻击者通常通过欺骗用户点击恶意链接、在受信任的网站中植入恶意代码或通过钓鱼等手段来实施CSRF攻击，一旦用户执行了恶意请求，攻击者可以以用户的身份执行任意操作，包括更改用户密码、发起资金转账或删除重要数据等。", "title": "什么是CSRF"}, {"content": "- 链接欺骗：攻击者通过向用户发送包含恶意链接的电子邮件或社交媒体消息，诱使用户点击并执行恶意请求。\n- 图片引用攻击：攻击者通过在恶意网站上包含指向目标网站的图片引用，以触发用户浏览器自动发送目标网站的请求。\n- XSS利用：如果目标网站存在XSS漏洞，攻击者可以注入恶意脚本，以使用户在浏览器中执行恶意请求。", "title": "CSRF常见的攻击方式"}, {"content": "- 随机令牌：网站可以在每个请求中包含一个随机生成的令牌（CSRF Token），并验证该令牌的有效性，以确认请求的来源是合法的。\n- SameSite Cookie：使用SameSite属性来限制跨站点请求，将Cookie的发送限制在同一站点上，减少了跨站请求伪造的风险。\n- 双重验证：对于敏感操作，网站可以要求用户进行额外的验证，例如输入验证码、提供第二个因素的身份验证等。\n- 强化浏览器策略：网站可以设置Content-Security-Policy（CSP）头，限制浏览器执行恶意脚本的能力，减少CSRF攻击的风险。\n- 限制用户操作：网站可以要求用户在执行敏感操作之前进行明确的确认或授权，防止恶意请求被误触发。\n- 安全编码实践：开发人员应遵循安全编码实践，对用户输入进行适当的验证和过滤，防止恶意请求的注入。", "title": "如何预防CSRF"}], "cnvd_id": "", "cve_id": "CVE-2026-73099", "cvss": {}, "cvss_score": 7.1, "cvss_vector": "", "cwe": "CWE-352", "description": "Apache Juneau 是 Apache 软件基金会开源的 Java 序列化与 REST 服务框架，juneau-rest-server 模块用于通过注解将 POJO 快速发布为 REST 接口。\n受影响版本中，juneau-rest-server 默认启用 content 查询参数对请求体的覆盖（disableContentParam 默认为 false），RestRequest 构造函数在 isAllowContentParam 为真时直接读取查询参数 content 并将其设置为请求体、强制按 UON 格式解析，且不校验 HTTP 方法，攻击者可通过跨站链接、表单或嵌入资源以 GET 等任意方法向端点投递攻击者可控的请求体，全程无 CORS 预检且不受端点预期 Content-Type 限制，绕过依赖请求方法或内容类型而非 anti-CSRF token 的防护，以受害者会话执行状态变更操作。\n修复版本中通过新增 isContentParamMethod 方法并调整 RestRequest 构造函数的启用条件，使 content 查询参数仅在 PUT 与 POST 请求上生效，跨站 GET 无法再注入攻击者请求体，切断该 CSRF 攻击链。", "effects": [{"comp_name": "org.apache.juneau:juneau-rest-server", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,9.2.1)", "min_fixed_version": "9.2.1", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "CSRF", "kind_en": "跨站请求伪造 (CSRF)", "last_modified_time": "2026-11-05", "level": "High", "mps_id": "MPS-cef4-bd21", "poc": false, "poc_url": [], "published_time": "2026-11-05", "reference_url_list": [{"url": "https://www.openwall.com/lists/oss-security/2026/11/04/7", "name": ""}, {"url": "https://github.com/apache/juneau/commit/81677c11fb4b35157ea176a97af0ace82126d25e", "name": ""}, {"url": "https://github.com/apache/juneau/releases/tag/juneau-9.2.1", "name": ""}, {"url": "https://downloads.apache.org/juneau/9.2.1/", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "Juneau请求体覆盖CSRF漏洞", "_translated": true, "_saved_at": "2026-11-04T16:44:54+00:00", "_first_saved_at": "2026-11-04T16:44:54+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-cef4-bd21"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-13289", "cvss": {"cvssv31": [{"source": "psirt@us.ibm.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:L", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:L", "cwe": "CWE-611", "description": "IBM MQ 是 IBM 开发的商业消息中间件，属于闭源软件，用于在企业应用与系统之间提供可靠的消息传递，其 Managed File Transfer 组件提供基于队列架构的托管文件传输能力，运行于 AIX、Linux、Windows 与 IBM i 平台。\n受影响版本中，Managed File Transfer 组件在处理 XML 数据时未充分限制 XML 外部实体的解析与引用，持有普通用户权限的远程攻击者可提交包含恶意实体声明的 XML 数据，解析器在解析过程中加载攻击者指定的外部实体，导致敏感信息泄露或内存资源被消耗。\n修复版本中通过厂商安全更新收紧了 XML 解析器对外部实体引用的处理，阻止不可信实体声明进入解析流程，消除敏感信息泄露与内存资源消耗风险；公开渠道未披露该闭源产品的具体修复代码，需按 IBM 官方公告升级至对应修复版本。", "effects": [{"comp_name": "ibm:mq", "ecosystem": "linux", "versions": [{"affected_version": "[9.2.0.0,9.2.0.46)", "min_fixed_version": "9.2.0.46", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[9.4.0.0,9.4.0.30)", "min_fixed_version": "9.4.0.30", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[9.3.0.0,9.3.0.43)", "min_fixed_version": "9.3.0.43", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[9.4.0.0,9.4.5.1]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[10.0.0.0,10.0.1.0)", "min_fixed_version": "10.0.1.0", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[10.0.0.0,10.0.0.6)", "min_fixed_version": "10.0.0.6", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XXE", "kind_en": "XML外部实体引用限制不当", "last_modified_time": "2026-11-05", "level": "High", "mps_id": "MPS-gxu3-jzsv", "poc": false, "poc_url": [], "published_time": "2026-11-05", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-gxu3-jzsv", "name": "https://www.oscs1024.com/hd/MPS-gxu3-jzsv"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-13289", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-13289"}, {"url": "https://www.ibm.com/support/pages/node/7294499", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "IBM MQ XML外部实体注入漏洞", "_translated": true, "_saved_at": "2026-11-04T22:20:06+00:00", "_first_saved_at": "2026-11-04T22:20:06+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-gxu3-jzsv"}, {"analysis_status": 0, "articles": [{"content": "由于整数类型的有限范围，在进行算术运算或操作时，结果可能超出类型的表示范围，导致溢出或环绕。溢出指的是结果超过了类型的最大值或小于了最小值，而环绕指的是结果绕回到类型的最小值或最大值。", "title": "什么是整数溢出或环绕"}, {"content": "- 缓冲区溢出：整数溢出可能导致缓冲区溢出漏洞。当整数溢出导致分配的缓冲区大小不足以容纳结果时，攻击者可以利用这个漏洞覆盖相邻的内存区域，执行恶意代码或篡改程序的状态。\r\n- 身份验证绕过：在进行身份验证或访问控制时，整数溢出可能导致绕过验证的漏洞。攻击者可以构造特殊的输入，使溢出的整数值绕过了预期的验证逻辑，从而获得未经授权的访问权限。\r\n- 数据篡改：整数溢出可能导致数据篡改漏洞。攻击者可以通过使整数溢出，修改计数器、索引或其他控制数据的值，导致程序在处理数据时发生错误或执行意外的操作。", "title": "整数溢出或环绕常见的攻击方式"}, {"content": "- 输入验证与限制：对用户输入的整数进行合理的验证和限制，确保其在允许的范围内。\r\n- 使用安全的整数操作函数：使用安全的整数操作函数，如`add_with_overflow()`、`sub_with_overflow()`、`mul_with_overflow()`等，这些函数会检查并处理溢出情况，确保计算结果在安全范围内。\r\n- 类型检查和转换：在进行整数运算或操作之前，进行类型检查和转换，确保操作数的类型和范围是合适的。\r\n- 强制性编码标准和最佳实践：制定强制性的编码标准和最佳实践，包括对整数运算和操作的规范和限制，以帮助程序员编写更可靠、安全的代码。\r\n- 静态代码分析和测试：使用静态代码分析工具和测试技术来检测和识别潜在的整数溢出问题。这些工具可以帮助发现代码中可能存在的溢出漏洞，并及时修复。", "title": "如何预防整数溢出或环绕"}], "cnvd_id": "", "cve_id": "CVE-2026-18142", "cvss": {"cvssv31": [{"source": "psirt@us.ibm.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:L/A:H", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:L/A:H", "cwe": "CWE-190", "description": "IBM MQ 是 IBM 推出的商业消息队列中间件（闭源），用于企业应用之间的异步消息传递与队列管理，支持在 AIX、Linux、Windows、IBM i 等平台部署，受影响组件为 MQ 服务器（Server）。\n受影响版本中，MQ 服务器队列管理器在处理畸形的 MQINQ 请求时存在整数溢出缺陷，远程认证攻击者获得普通用户权限后可发送构造的 MQINQ 请求，使整数运算超出边界并破坏内存布局，最终导致拒绝服务与有限的内存破坏。\n修复版本中通过修正 MQINQ 请求处理中的整数溢出计算切断了该触发链路，IBM 已在 Known Issue DT500561 下完成修复，对应安全更新为 9.2.0.46、9.3.0.43、9.4.0.30、10.0.0.6（LTS）以及 10.0.1.0（CD）。", "effects": [{"comp_name": "mq", "ecosystem": "linux", "versions": [{"affected_version": "[9.4.0.0,9.4.0.30)", "min_fixed_version": "9.4.0.30", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[9.2.0.0,9.2.0.46)", "min_fixed_version": "9.2.0.46", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[9.4.0.0,10.0.1.0)", "min_fixed_version": "10.0.1.0", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[9.3.0.0,9.3.0.43)", "min_fixed_version": "9.3.0.43", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[10.0.0.0,10.0.0.6)", "min_fixed_version": "10.0.0.6", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "整数溢出或环绕", "kind_en": "整数溢出或环绕", "last_modified_time": "2026-11-05", "level": "High", "mps_id": "MPS-ufaw-92qm", "poc": false, "poc_url": [], "published_time": "2026-11-05", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ufaw-92qm", "name": "https://www.oscs1024.com/hd/MPS-ufaw-92qm"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-18142", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-18142"}, {"url": "https://www.ibm.com/support/pages/node/7294663", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "IBM MQ整数溢出拒绝服务漏洞", "_translated": true, "_saved_at": "2026-11-04T22:20:04+00:00", "_first_saved_at": "2026-11-04T22:20:04+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ufaw-92qm"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-13284", "cvss": {"cvssv31": [{"source": "psirt@us.ibm.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:L", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:L", "cwe": "CWE-611", "description": "IBM MQ 是 IBM 开发的企业级消息中间件，闭源商业软件，用于分布式系统之间的可靠消息传递与异步集成；Managed File Transfer 是其可选安装组件，用于在网络内外的系统之间执行受控文件传输。\n受影响版本中，Managed File Transfer 组件在处理 XML 数据时未正确限制 XML 外部实体引用（CWE-611），远程攻击者以低权限用户身份提交包含外部实体声明的 XML 数据，解析过程会读取实体指向的本地资源或加载超量数据，导致敏感信息泄露或内存资源消耗。\n修复版本中通过升级官方累积安全更新完成修复，IBM 在 9.2.0.46、9.3.0.43、9.4.0.30、10.0.0.6 与 10.0.1.0 中修复该问题，对 Managed File Transfer 的 XML 数据处理进行加固，消除外部实体注入带来的信息泄露与资源消耗风险。", "effects": [{"comp_name": "ibm_mq", "ecosystem": "linux", "versions": [{"affected_version": "[9.3.0.0,9.3.0.43)", "min_fixed_version": "9.3.0.43", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[9.4.0.0,10.0.1.0)", "min_fixed_version": "10.0.1.0", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[9.2.0.0,9.2.0.46)", "min_fixed_version": "9.2.0.46", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[9.4.0.0,9.4.0.30)", "min_fixed_version": "9.4.0.30", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[10.0.0.0,10.0.0.6)", "min_fixed_version": "10.0.0.6", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XXE", "kind_en": "XML外部实体引用限制不当", "last_modified_time": "2026-11-05", "level": "High", "mps_id": "MPS-xfb6-7sn5", "poc": false, "poc_url": [], "published_time": "2026-11-05", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-xfb6-7sn5", "name": "https://www.oscs1024.com/hd/MPS-xfb6-7sn5"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-13284", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-13284"}, {"url": "https://www.ibm.com/support/pages/node/7294500", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "IBM MQ XXE注入漏洞", "_translated": true, "_saved_at": "2026-11-04T22:20:08+00:00", "_first_saved_at": "2026-11-04T22:20:08+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-xfb6-7sn5"}]}</script>
  <script>
    const payload = JSON.parse(document.getElementById("payload").textContent);
    const levelLabels = payload.level_labels || {};
    const items = payload.items || [];
    let filtered = items.slice();
    let activeId = null;

    const $ = (id) => document.getElementById(id);
    $("generatedAt").textContent = payload.generated_at || "-";
    $("retention").textContent = payload.retention_days ?? "-";
    $("cutoff").textContent = payload.cutoff_date || "-";
    $("count").textContent = String(payload.count ?? items.length);

    function levelClass(level) {
      const cn = levelLabels[level] || level || "";
      if (level === "Critical" || cn === "严重") return "crit";
      if (level === "High" || cn === "高危") return "high";
      return "other";
    }
    function levelText(level) {
      return levelLabels[level] || level || "-";
    }
    function esc(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }
    function scoreText(v) {
      if (v === null || v === undefined || v === "" || v === -1) return "-";
      return String(v);
    }

    function renderList() {
      const list = $("list");
      $("listCount").textContent = String(filtered.length);
      if (!filtered.length) {
        list.innerHTML = '<div class="empty">没有匹配项</div>';
        return;
      }
      list.innerHTML = filtered.map((it) => {
        const id = it.mps_id || it.cve_id;
        const active = id === activeId ? " active" : "";
        return `
          <button class="item${active}" data-id="${esc(id)}" type="button">
            <div class="item-top">
              <span class="cve">${esc(it.cve_id || it.mps_id || "-")}</span>
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
            </div>
            <div class="title">${esc(it.title || "-")}</div>
            <div class="item-foot">
              <span>CVSS ${esc(scoreText(it.cvss_score))}</span>
              <span>${esc(it.published_time || "-")}</span>
              ${it.poc ? "<span>POC</span>" : ""}
            </div>
          </button>`;
      }).join("");
      list.querySelectorAll(".item").forEach((btn) => {
        btn.addEventListener("click", () => selectById(btn.dataset.id));
      });
    }

    function refsHtml(it) {
      const refs = Array.isArray(it.reference_url_list) ? it.reference_url_list : [];
      const links = [];
      if (it._source_page) links.push({ url: it._source_page, name: "OSCS 详情" });
      if (it.cve_id) links.push({ url: `https://nvd.nist.gov/vuln/detail/${it.cve_id}`, name: "NVD" });
      refs.forEach((r) => {
        if (r && r.url) links.push({ url: r.url, name: r.name || r.url });
      });
      const seen = new Set();
      const uniq = [];
      for (const l of links) {
        if (seen.has(l.url)) continue;
        seen.add(l.url);
        uniq.push(l);
      }
      if (!uniq.length) return '<div class="box">无参考链接</div>';
      return `<div class="refs">${uniq.map((l) =>
        `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name || l.url)}</a>`
      ).join("")}</div>`;
    }

    function articlesHtml(it) {
      const arts = Array.isArray(it.articles) ? it.articles : [];
      if (!arts.length) return "";
      return `<div class="section"><h3>相关说明</h3>${arts.map((a) => `
        <div class="article">
          <h4>${esc(a.title || "说明")}</h4>
          <p>${esc(a.content || "")}</p>
        </div>`).join("")}</div>`;
    }

    function renderDetail(it) {
      const detail = $("detail");
      if (!it) {
        detail.innerHTML = '<div class="empty">暂无数据</div>';
        return;
      }
      const pocUrls = Array.isArray(it.poc_url) ? it.poc_url : [];
      detail.innerHTML = `
        <div class="d-head">
          <div>
            <h1 class="d-title">${esc(it.title || "-")}</h1>
            <div class="ids">
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
              <span class="chip">${esc(it.cve_id || "无 CVE")}</span>
              <span class="chip">${esc(it.mps_id || "-")}</span>
              ${it.poc ? '<span class="chip">有 POC</span>' : ""}
              ${it.exp ? '<span class="chip">有 EXP</span>' : ""}
            </div>
          </div>
          <div class="actions">
            ${it._source_page ? `<a class="btn" href="${esc(it._source_page)}" target="_blank" rel="noopener">OSCS</a>` : ""}
            ${it.cve_id ? `<a class="btn" href="https://nvd.nist.gov/vuln/detail/${esc(it.cve_id)}" target="_blank" rel="noopener">NVD</a>` : ""}
          </div>
        </div>
        <div class="grid">
          <div class="stat"><div class="k">CVSS</div><div class="v">${esc(scoreText(it.cvss_score))}</div></div>
          <div class="stat"><div class="k">向量</div><div class="v">${esc(it.cvss_vector || "-")}</div></div>
          <div class="stat"><div class="k">CWE</div><div class="v">${esc(it.cwe || "-")}</div></div>
          <div class="stat"><div class="k">类型</div><div class="v">${esc(it.kind || it.kind_en || "-")}</div></div>
          <div class="stat"><div class="k">公开</div><div class="v">${esc(it.published_time || "-")}</div></div>
          <div class="stat"><div class="k">利用成本</div><div class="v">${esc(it.exploit_requirement_cost || "-")}</div></div>
          <div class="stat"><div class="k">可利用性</div><div class="v">${esc(it.exploitability || "-")}</div></div>
          <div class="stat"><div class="k">修复建议</div><div class="v">${esc(it.fix_suggestion || "-")}</div></div>
        </div>
        <div class="section"><h3>描述</h3><div class="box">${esc(it.description || "无描述")}</div></div>
        ${it.scope_influence ? `<div class="section"><h3>影响范围</h3><div class="box">${esc(it.scope_influence)}</div></div>` : ""}
        ${pocUrls.length ? `<div class="section"><h3>POC 链接</h3><div class="refs">${pocUrls.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join("")}</div></div>` : ""}
        <div class="section"><h3>参考链接</h3>${refsHtml(it)}</div>
        ${articlesHtml(it)}
      `;
    }

    function selectById(id) {
      const it = filtered.find((x) => (x.mps_id || x.cve_id) === id) ||
                 items.find((x) => (x.mps_id || x.cve_id) === id);
      if (!it) return;
      activeId = it.mps_id || it.cve_id;
      renderList();
      renderDetail(it);
      const btn = document.querySelector(`.item[data-id="${CSS.escape(activeId)}"]`);
      if (btn) btn.scrollIntoView({ block: "nearest" });
      history.replaceState(null, "", "#" + encodeURIComponent(activeId));
    }

    function applyFilter(q) {
      const query = (q || "").trim().toLowerCase();
      filtered = !query ? items.slice() : items.filter((it) => {
        const blob = [
          it.cve_id, it.mps_id, it.title, it.kind, it.kind_en, it.cwe, it.description, it.level
        ].map((x) => String(x || "").toLowerCase()).join(" ");
        return blob.includes(query);
      });
      renderList();
      if (filtered.length) {
        const still = filtered.some((x) => (x.mps_id || x.cve_id) === activeId);
        selectById(still ? activeId : (filtered[0].mps_id || filtered[0].cve_id));
      } else {
        activeId = null;
        renderDetail(null);
      }
    }

    $("search").addEventListener("input", (e) => applyFilter(e.target.value));

    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement !== $("search")) {
        e.preventDefault();
        $("search").focus();
        return;
      }
      if (!filtered.length) return;
      const idx = filtered.findIndex((x) => (x.mps_id || x.cve_id) === activeId);
      if (e.key === "ArrowDown") {
        e.preventDefault();
        const next = filtered[Math.min(filtered.length - 1, Math.max(0, idx) + 1)];
        selectById(next.mps_id || next.cve_id);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        const prev = filtered[Math.max(0, idx - 1)];
        selectById(prev.mps_id || prev.cve_id);
      }
    });

    const hashId = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    if (hashId && items.some((x) => (x.mps_id || x.cve_id) === hashId)) {
      activeId = hashId;
      renderList();
      selectById(hashId);
    } else if (items.length) {
      selectById(items[0].mps_id || items[0].cve_id);
    } else {
      renderList();
      renderDetail(null);
    }
  </script>
</body>
