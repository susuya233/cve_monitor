72/", "name": ""}, {"url": "https://www.dell.com/support/kbdoc/en-in/000503426/dsa-2026-382-security-update-for-dell-secure-connect-gateway-virtual-edition-multiple-vulnerabilities", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "Dell SCG令牌重放漏洞", "_translated": true, "_saved_at": "2026-09-08T02:35:05+00:00", "_first_saved_at": "2026-09-08T02:35:05+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-94e2-bdf3"}, {"analysis_status": 0, "articles": [{"content": "应用程序在处理用户输入时的不完善或缺乏验证机制，所以攻击者能够通过向应用程序发送恶意输入，利用应用程序对输入数据的错误处理方式来注入自己的恶意代码。这些恶意代码会被应用程序误认为是合法的指令或数据，并在执行过程中被执行。", "title": "什么是代码注入"}, {"content": "应用程序使用可执行动态代码的函数来执行用户可控的参数，当应用程序对于用户输入过滤不完全时，攻击者可以注入恶意代码并控制代码执行流程。", "title": "代码注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对所有用户输入进行验证和过滤，确保只接受预期的有效输入。这包括对输入数据进行输入长度验证、类型检查和格式验证等。\r\n- 使用参数化查询或预编译语句：对于数据库查询操作，应该使用参数化查询或预编译语句，确保输入数据不会被误认为是执行代码。\r\n- 最小特权原则：应用程序在执行操作系统命令或动态代码时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。\r\n- 安全编码实践：开发人员应该采用安全编码实践，包括避免使用eval函数、避免拼接用户输入的字符串作为代码执行等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止代码注入攻击。", "title": "如何预防代码注入"}], "cnvd_id": "", "cve_id": "CVE-2026-41870", "cvss": {}, "cvss_score": 9.8, "cvss_vector": "", "cwe": "CWE-94", "description": "Apache Nutch 是开源、可扩展的 Web 爬虫，用于大规模网页采集、解析和索引，并在 1.11 至 1.22 版本中打包基于 JAX-RS 的 Nutch Server REST API。\n受影响版本中，Nutch Server REST API 未实施认证授权，远程攻击者可向 /job/create 或 /db/crawldb 提交包含恶意 JEXL 表达式的请求。JexlUtil.parseExpression 使用未启用沙箱的 Commons JEXL 引擎解析该表达式，允许通过 new 运算符实例化任意 Java 类并在服务进程中执行代码。\n修复版本中通过删除整个 Nutch Server 及 REST API 切断该未授权远程入口，并在 JexlUtil.parseExpression 中启用 JexlSandbox、禁止 new 实例化，阻止不可信 JEXL 表达式再进入任意代码执行路径。", "effects": [{"comp_name": "org.apache.nutch:nutch", "ecosystem": "maven", "versions": [{"affected_version": "[1.11,1.23)", "min_fixed_version": "1.23", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "代码注入", "kind_en": "代码生成控制不当（“代码注入”）", "last_modified_time": "2026-09-08", "level": "Critical", "mps_id": "MPS-ba43-1803", "poc": false, "poc_url": [], "published_time": "2026-09-08", "reference_url_list": [{"url": "http://www.mail-archive.com/announce@apache.org/msg11848.html", "name": ""}, {"url": "https://nutch.apache.org/documentation/security/", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-41870", "name": ""}, {"url": "https://issues.apache.org/jira/browse/NUTCH-3165", "name": ""}, {"url": "https://issues.apache.org/jira/browse/NUTCH-3168", "name": ""}, {"url": "https://github.com/apache/nutch/commit/3b663de2e4c829267297814db8d231d037c586f7", "name": ""}, {"url": "https://github.com/apache/nutch/commit/df62fa10fbe2135e8f51dee9d08c22414c9cc750", "name": ""}, {"url": "https://github.com/apache/nutch", "name": ""}, {"url": "https://nutch.apache.org/", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "Nutch JEXL注入RCE", "_translated": true, "_saved_at": "2026-09-08T12:30:58+00:00", "_first_saved_at": "2026-09-08T12:30:58+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ba43-1803"}, {"analysis_status": 0, "articles": [], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-86287", "cvss": {}, "cvss_score": 9.8, "cvss_vector": "", "cwe": "CWE-1287", "description": "Net::IP::LPM 是开源 Perl 模块，实现最长前缀匹配算法，用于按 CIDR 前缀查找地址，并常被用于构建放行列表或拒绝列表。\n受影响版本中，公开方法 add 在按斜杠拆分 $prefix 后，未校验前缀长度是否为十进制整数，也未确认 inet_pton 转换是否成功。非数字及非 ASCII 前缀长度会被数值化为 0；超过 31 位的整数在 XS 函数 lpm_add_raw 中以 C int 接收并静默截断，2**32 等值会变为 0。长度为 0 的前缀作为默认路由写入 Trie 后，lookup 会对任意地址匹配成功，放行列表将放行全部地址，拒绝列表将拦截全部地址。\n修复版本中通过在 add 中拒绝转换失败的前缀地址，并以 /^[0-9]+$/ 限定前缀长度只能是十进制整数，同时将 lpm_add_raw 的 prefix_len 类型由 int 改为 Perl IV，使超范围长度进入既有越界检查并被拒绝，避免畸形掩码污染查找表。", "effects": [{"comp_name": "Net-IP-LPM", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.12)", "min_fixed_version": "1.12", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, " ": "npm", "solutions": [], "upstream": true}, {"affected_version": "(-∞,3.9.6]", "min_fixed_version": "", "repository": "npm", "solutions": [], "upstream": true}, {"affected_version": "(-∞,4.0.2]", "min_fixed_version": "", "repository": "npm", "solutions": [], "upstream": true}]}, {"comp_name": "SAP Cloud Application Programming Model (CAP)", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.18.3]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,4.0.2]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,2.7.6]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,3.9.6]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "凭证保护不足", "kind_en": "凭证保护不足", "last_modified_time": "2026-09-08", "level": "Critical", "mps_id": "MPS-cxiu-oeap", "poc": false, "poc_url": [], "published_time": "2026-09-08", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-cxiu-oeap", "name": "https://www.oscs1024.com/hd/MPS-cxiu-oeap"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-76969", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-76969"}, {"url": "https://me.sap.com/notes/3798315", "name": ""}, {"url": "https://url.sap/sapsecuritypatchday", "name": ""}], "scope_influence": "", "tags": ["npm", "开源"], "title": "SAP CAP多租户凭证泄露漏洞", "_translated": true, "_saved_at": "2026-09-08T02:35:07+00:00", "_first_saved_at": "2026-09-08T02:35:07+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-cxiu-oeap"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2026-75156", "cvss": {}, "cvss_score": 9.8, "cvss_vector": "", "cwe": "CWE-287", "description": "Apache Airflow FAB provider（apache-airflow-providers-fab）是开源工作流平台 Apache Airflow 的 Flask App Builder 认证管理组件，用于提供 Web UI 登录、角色权限控制以及 Azure AD 等 OAuth 单点登录。\n受影响版本中，FAB 认证管理器在 Azure AD OAuth 登录路径上由 get_oauth_user_info 读取 resp 中的 id_token，再交由 _decode_and_validate_azure_jwt 处理。该方法使用 Microsoft 多租户 JWKS 校验签名，但调用 authlib_jwt.decode 时未传入 claims_options，claims.validate() 不检查 issuer 与 audience。攻击者可在自建 Azure 租户中签发通过签名校验的 id_token，使系统按令牌内 oid、email、roles 完成登录与角色分配，从而在无该部署既有访问权限的情况下进入 Airflow UI。\n修复版本中通过在 _decode_and_validate_azure_jwt 中解析部署所配置的 Azure 租户，并向 decode 传入 claims_options，要求 iss 属于该租户、aud 等于应用 client_id；当配置无法确定单一租户时拒绝接受令牌，切断跨租户令牌进入身份与角色映射的路径。", "effects": [{"comp_name": "apache-airflow-providers-fab", "ecosystem": "pip", "versions": [{"affected_version": "[3.7.3,3.8.1)", "min_fixed_version": "3.8.1", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "身份验证不当", "kind_en": "认证不当", "last_modified_time": "2026-09-09", "level": "Critical", "mps_id": "MPS-ae73-84ff", "poc": false, "poc_url": [], "published_time": "2026-09-09", "reference_url_list": [{"url": "https://www.openwall.com/lists/oss-security/2026/09/08/13", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-75156", "name": ""}, {"url": "https://github.com/apache/airflow/pull/71735", "name": ""}, {"url": "https://github.com/apache/airflow/commit/75ecbdd36d89db8ae41b891bc0d41acf9b655723", "name": ""}, {"url": "https://github.com/apache/airflow/blob/providers-fab/3.8.1/providers/fab/docs/changelog.rst", "name": ""}, {"url": "https://pypi.org/project/apache-airflow-providers-fab/3.8.1/", "name": ""}, {"url": "https://airflow.apache.org/", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-59243", "name": ""}], "scope_influence": "", "tags": ["python", "开源", "终端软件"], "title": "Airflow FAB认证绕过", "_translated": true, "_saved_at": "2026-09-08T16:59:16+00:00", "_first_saved_at": "2026-09-08T16:59:16+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ae73-84ff"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-86738", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:C/C:H/I:H/A:N", "severity": "high", "base_score": 8.7}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:N/SC:H/SI:H/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:N/SC:H/SI:H/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-79", "description": "Snipe-IT 是开源 IT 资产管理系统，基于 Laravel 构建，用于资产盘点、库存与设备全生命周期管理。\n受影响版本中，超级管理员通过 SettingsController::postBranding 写入的 custom_css 会在 Setting::show_custom_css() 中先经 e() HTML 编码，再把 \u0026gt; 与 \u0026quot; 解码回 \u003e 和 \"，使 @import 与外部 url() 原样进入全局 style。其他超级管理员加载任意页面时，攻击者可用 input[name=\"_token\"] 属性选择器逐字符带出 CSRF token，进而伪造状态变更请求接管账户。\n修复版本中通过重写 show_custom_css()，改为 strip_tags()、剥离 @import 规则并拒绝外部及 data/javascript/vbscript 协议的 url() 引用，切断恶意样式外带与 CSRF token 泄露路径。", "effects": [{"comp_name": "grokability/snipe-it", "ecosystem": "composer", "versions": [{"affected_version": "[3.0,8.7.0)", "min_fixed_version": "8.7.0", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-09-08", "level": "Critical", "mps_id": "MPS-87fg-q2kl", "poc": false, "poc_url": [], "published_time": "2026-09-09", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-87fg-q2kl", "name": "https://www.oscs1024.com/hd/MPS-87fg-q2kl"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-86738", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-86738"}, {"url": "https://github.com/grokability/snipe-it/security/advisories/GHSA-pvcw-mp8q-mj39", "name": "GitHub Security Advisory (GHSA-pvcw-mp8q-mj39)"}, {"url": "https://github.com/grokability/snipe-it/commit/d26d71688359707f3b257fc04fe6c3e5a17405f9", "name": "Patch Commit"}, {"url": "https://www.vulncheck.com/advisories/snipe-it-before-8.7.0-css-injection-via-custom-css", "name": "VulnCheck Advisory: Snipe-IT before 8.7.0 CSS Injection via Custom CSS"}], "scope_influence": "", "tags": ["php", "开源"], "title": "Snipe-IT CSS注入漏洞", "_translated": true, "_saved_at": "2026-09-08T16:59:18+00:00", "_first_saved_at": "2026-09-08T16:59:18+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-87fg-q2kl"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-19633", "cvss": {"cvssv31": [{"source": "f86ef6dc-4d3a-42ad-8f28-e6d5547a5007", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-89", "description": "PostgreSQL Anonymizer contains a vulnerability that allows unprivileged masked users to execute arbitrary code by abusing operators, domain casts, or view subqueries that carry untrusted expressions. When these objects are evaluated in the context of the extension’s masking mechanisms, the malicious code can run with elevated privileges. The issue is fixed in PostgreSQL Anonymizer 3.1.4 and later versions", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-09-07", "level": "High", "mps_id": "MPS-ycxn-i6mv", "poc": false, "poc_url": [], "published_time": "2026-09-07", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ycxn-i6mv", "name": "https://www.oscs1024.com/hd/MPS-ycxn-i6mv"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-19633", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-19633"}, {"url": "https://gitlab.com/dalibo/postgresql_anonymizer/-/issues/665", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-19633漏洞", "_translated": true, "_saved_at": "2026-09-09T00:58:19+00:00", "_first_saved_at": "2026-09-06T16:39:06+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ycxn-i6mv"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-84173", "cvss": {"cvssv4": [{"source": "emo@eclipse.org", "vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.3}]}, "cvss_score": 8.3, "cvss_vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-863", "description": "Eclipse Ankaios 是 Eclipse 基金会旗下的开源工作负载编排组件，采用 Apache-2.0 许可，面向车载高性能计算等场景管理容器化工作负载，并通过 Control Interface 向已认证工作负载提供集群状态读写能力。\n受影响版本中，agent 侧 Control Interface 授权器错误评估首段为通配符的多段 allow 规则。已认证工作负载在仅被 *.workloads.some_workload 这类作用域规则限制时，可提交 field_mask 或 update_mask 为空的 CompleteStateRequest 或 UpdateStateRequest。空 mask 会被转换成空 Path；AllowPathPattern::matches 在规则首段为 Wildcard 时跳过“规则长于请求路径则不匹配”的检查，随后 match_rule_with_path 对空路径 zip 后空循环并返回匹配成功，使该工作负载读取完整集群状态或在授权子树之外替换状态。\n修复版本中通过将跳过长度检查的条件收窄为规则仅由单独的 PathPatternSection::Wildcard 构成，使带作用域的前导通配符规则不再匹配空路径，从而阻断空 mask 请求越权读写完整集群状态。", "effects": [{"comp_name": "ankaios", "ecosystem": "linux", "versions": [{"affected_version": "[0.5.1,1.0.2)", "min_fixed_version": "1.0.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复 once} 与 $self-\u003e{nonce} 一致，拒绝不匹配的响应，把认证绑定到本次挑战签发的 nonce，阻断跨会话重放。", "effects": [{"comp_name": "Authen-SASL", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.2100)", "min_fixed_version": "2.2100", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "使用捕获-重放进行的认证绕过", "kind_en": "通过捕获重放绕过身份验证", "last_modified_time": "2026-09-07", "level": "High", "mps_id": "MPS-ky2c-r7lx", "poc": false, "poc_url": [], "published_time": "2026-09-07", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ky2c-r7lx", "name": "https://www.oscs1024.com/hd/MPS-ky2c-r7lx"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-86219", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-86219"}, {"url": "https://datatracker.ietf.org/doc/html/rfc2831#section-2.1.2", "name": ""}, {"url": "https://github.com/perl-authen-sasl/perl-authen-sasl/commit/94337367030612842924f697cead29964a96448d.patch", "name": ""}, {"url": "https://metacpan.org/release/EHUELS/Authen-SASL-2.2000/source/lib/Authen/SASL/Perl/DIGEST_MD5.pm#L203-222", "name": ""}, {"url": "https://metacpan.org/release/EHUELS/Authen-SASL-2.2000/source/lib/Authen/SASL/Perl/DIGEST_MD5.pm#L410-414", "name": ""}, {"url": "https://metacpan.org/release/EHUELS/Authen-SASL-2.2100/changes", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2025-40918", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Authen-SASL认证重放漏洞", "_translated": true, "_saved_at": "2026-09-06T22:50:43+00:00", "_first_saved_at": "2026-09-06T18:48:15+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ky2c-r7lx"}, {"analysis_status": 0, "articles": [], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-80230", "cvss": {}, "cvss_score": 7.3, "cvss_vector": "", "cwe": "CWE-295", "description": "curl 是由 Daniel Stenberg 主导开发的开源命令行工具与 libcurl 跨平台数据传输库，广泛用于各类应用的 HTTP/HTTPS 等协议数据传输，可选用 OpenSSL 及其分支（BoringSSL、AWS-LC、LibreSSL、QuicTLS 等）作为 TLS 后端。\n受影响版本中，当应用配置 CURLOPT_PINNEDPUBLICKEY 并同时将 CURLOPT_SSL_VERIFYPEER 与 CURLOPT_SSL_VERIFYHOST 置 0 时，若服务器在 TLS 握手中不提供证书（如启用 AECDH-AES128-SHA 等匿名密码套件），lib/vtls/openssl.c 的 Curl_ossl_check_peer_cert 在获取到的服务器证书为空且两个校验开关均关闭时提前 goto out 并返回 CURLE_OK，跳过函数末尾的 ossl_check_pinned_key 公钥绑定比对，本应被拒绝的未认证连接被放行，中间人可冒充服务器完成传输。\n修复版本中通过在 Curl_ossl_check_peer_cert 中新增 pinned() 辅助函数读取当前连接的公钥绑定配置，并将无证书场景的提前放行条件收紧为对端校验全部关闭且未配置公钥绑定，配置 CURLOPT_PINNEDPUBLICKEY 而服务器未提供证书时返回 CURLE_PEER_FAILED_VERIFICATION 拒绝连接，公钥绑定在无证书握手中恢复强制执行。", "effects": [{"comp_name": "curl", "ecosystem": "linux", "versions": [{"affected_version": "[7.45.0,8.22.0)", "min_fixed_version": "8.22.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "证书验证不恰当", "kind_en": "证书验证不当", "last_modified_time": "2026-09-07", "level": "High", "mps_id": "MPS-snoa-287c", "poc": false, "poc_url": [], "published_time": "2026-09-07", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-snoa-287c", "name": "https://www.oscs1024.com/hd/MPS-snoa-287c"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-80230", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-80230"}, {"url": "https://curl.se/docs/CVE-2026-80230.html", "name": ""}, {"url": "https://curl.se/docs/CVE-2026-80230.json", "name": ""}, {"url": "https://hackerone.com/reports/3969300", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "curl 公钥绑定校验绕过漏洞", "_translated": true, "_saved_at": "2026-09-06T21:00:00+00:00", "_first_saved_at": "2026-09-06T18:48:16+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-snoa-287c"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-86347", "cvss": {"cvssv4": [{"source": "5a6e4751-2f3f-4070-9419-94fb35b644e8", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-862", "description": "MISP（Malware Information Sharing Platform）是开源威胁情报共享平台，用于收集、存储并在组织间共享安全事件与威胁指标。\n受影响版本中，ACL 列表将 templates/uploadFile 配置为通配符 *，ACLComponent::checkAccess() 会对任意已认证用户直接返回 true，绕过相邻模板管理操作所需的 perm_add 或 perm_template。低权限或只读用户可调用 TemplatesController::uploadFile()，该接口仅检查上传 size 大于 0 且 error 等于 0，随后把内容写入 app/tmp/files/，并无配额限制，重复上传会耗尽服务器磁盘空间。官方同时确认上传文件使用随机文件名、不存在路径穿越或可预测覆盖、临时目录位于 web 根目录之外且不会经 HTTP 按文件名直接回传，该问题不构成任意文件覆盖、存储型 XSS 或远程代码执行。\n修复版本中通过将 templates/uploadFile 的 ACL 从 * 改为 perm_add，使该上传入口与 populateEventFromTemplate 等消耗临时文件的操作权限一致，无 perm_add 的用户无法再写入该临时目录。", "effects": [{"comp_name": "MISP", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.5.46)", "min_fixed_version": "2.5.46", "  使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-86437", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.2}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-863", "description": "Lara Dashboard 是开源 Laravel CMS，提供角色权限、模块、翻译与内容管理，并内置 Core Upgrades 用于在后台应用升级包。\n受影响版本中，POST /admin/settings/core-upgrades/upload 仅以 settings.edit 作为授权条件。UploadRequest::authorize() 调用 SettingPolicy::manageCoreUpgrades，该方法只检查 settings.edit，默认 Admin 角色已持有该权限。非 Superadmin 管理员上传 ZIP 后，CoreUpgradeService::copyUpgradeFiles 会将档案中的 app、routes、bootstrap、config 等目录覆盖到运行中的应用源码。攻击者可在 routes/web.php 中植入 system() 调用，optimize:clear 后以 Web 进程身份执行，并读取环境密钥与数据库凭据。\n修复版本中通过将 UploadRequest::authorize() 改为检查 $user-\u003ehasRole(Role::SUPERADMIN)，切断仅持有 settings.edit 的管理员进入手动升级上传路径，使非 Superadmin 无法再覆盖应用源码。", "effects": [{"comp_name": "laradashboard/laradashboard", "ecosystem": "composer", "versions": [{"affected_version": "(-∞,1.3.2)", "min_fixed_version": "1.3.2", "repository": "composer", "solutions": [], "upstream" m", "vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.6}], "cvssv4": [{"source": "cna@vuldb.com", "vector": "CVSS:4.0/AV:A/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:A/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-121", "description": "D-Link DIR-895L 是友讯面向家庭与小型办公场景的商业无线路由器，固件以闭源产品形态发布，部分组件通过 GPL 源码包提供；内置 udhcpcd 负责向局域网客户端分配 DHCP 地址。\n受影响版本中，udhcpcd 在 serverpacket.c 的 sendOffer 与 sendACK 路径调用 valid_tr111_cpe_parse() 解析 DHCP 厂商自定义选项 125（TR-111）。该函数对长度前缀的子选项数据直接执行 strcpy()，写入 sendOffer/sendACK 内 256 字节栈缓冲 devOUI、devSN 与 devPC。DHCP 子选项并非保证以 NUL 结尾的 C 字符串，strcpy() 会越过声明长度继续复制，造成栈缓冲区溢出。接入局域网的未认证攻击者发送包含恶意选项 125 的 DHCPDISCOVER 或 DHCPREQUEST 可以触发内存破坏，导致 DHCP 服务崩溃或潜在代码执行。\n修复版本中通过按子选项声明长度执行有界拷贝并显式写入 NUL 终止符，替代对 DHCP 选项内容调用 strcpy()，阻止超长或未终止数据覆盖栈缓冲。公开资料未给出已发布的官方修复固件，DIR-895L 已结束厂商支持周期。", "effects": [{"comp_name": "dir-895l", "ecosystem": "linux", "versions": [{"affected_version": "[A1_102b07,A1_102b07]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "栈缓冲区溢出", "kind_en": "基于堆栈的缓冲区溢出", "last_modified_time": "2026-09-08", "level": "High", "mps_id": "MPS-xy0d-76ht", "poc": false, "poc_url": [], "published_time": "2026-09-08", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-xy0d-76ht", "name": "https://www.oscs1024.com/hd/MPS-xy0d-76ht"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-86509", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-86509"}, {"url": "https://tzh00203.notion.site/D-Link-DI t.gov/vuln/detail/CVE-2026-86502", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-86502"}, {"url": "https://www.jetbrains.com/privacy-security/issues-fixed/", "name": ""}], "scope_influence": "", "tags": [], "title": "IntelliJ IJent认证缺失漏洞", "_translated": true, "_saved_at": "2026-09-07T23:23:31+00:00", "_first_saved_at": "2026-09-07T20:59:55+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-mhn1-quba"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过向受信任的数据序列化过程中添加恶意数据，从而在序列化和反序列化过程中执行恶意代码的攻击漏洞。这种漏洞通常存在于使用序列化 (serialization) 机制存储和传输数据的程序中。\n", "title": "什么是反序列化"}, {"content": "- 注入攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码注入到程序中，从而实现代码执行的目的。\n- 反射攻击：攻击者使用反射机制，在序列化过程中动态生成恶意数据，并将恶意代码注入到程序中，从而实现代码执行的目的。\n- 缓冲区溢出攻击：攻击者通过在序列化过程中向缓冲区输入恶意数据，导致缓冲区溢出，从而破坏程序的内存管理，实现代码执行的目的。\n- 格式字符串攻击：攻击者通过在序列化过程中输入恶意数据，导致程序使用错误的格式字符串，从而实现代码执行的目的。\n- 数据流攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码作为一个数据流传递给程序，从而实现代码执行的目的。\n", "title": "反序列化常见的攻击方式"}, {"content": "- 不信任输入数据：程序应该严格检查输入数据的有效性，并避免使用不受信任的数据。\n- 使用安全的序列化机制：程序应该使用安全的序列化机制，如 JSON 或 XML 序列化，而不是第三方序列化库。\n- 最小特权原则：程序应该限制对受信任数据的处理权限，并避免在运行时修改数据。\n- 代码审查和漏洞扫描：程序应该进行代码审查和漏洞扫描，以发现和修复潜在的安全漏洞。\n", "title": "如何预防反序列化"}], "cnvd_id": "", "cve_id": "CVE-2026-76967", "cvss": {"cvssv31": [{"source": "cna@sap.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-502", "description": "SAP NetWeaver Business Client（NWBC）是 SAP 提供的商业桌面客户端，用于统一访问 SAP 业务应用，并非开源软件。\n受影响版本中，客户端启动时对本地存储数据缺少充分校验。本地低权限攻击者可将该数据替换为构造后的恶意内容，应用程序再次启动时会处理这些内容并进入不安全反序列化路径，从而在当前用户上下文中执行任意代码，对应用机密性、完整性和可用性造成高影响。\n修复版本中通过 SAP Security Note 3784138 提供的安全更新加强对启动阶段本地存储数据的校验，阻止不可信内容进入反序列化执行路径。公开资料未披露更细粒度的源码修改。", "effects": [{"comp_name": "netweaver_business_client", "ecosystem": "linux", "versions": [{"affected_version": "[8.10,8.10]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[8.00,8.00]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "反序列化", "kind_en": "不可信数据的反序列化", "last_modified_time": "2026-09-08", "level": "High", "mps_id": "MPS-43jz-bwno", "poc": false, "poc_url": [], "published_time": "2026-09-08", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-43jz-bwno", "name": "https://www.oscs1024.com/hd/MPS-43jz-bwno"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-76967", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-76967"}, {"url": "https://me.sap.com/notes/3784138", "name": ""}, {"url": "https://url.sap/sapsecuritypatchday", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "SAP NWBC反序列化漏洞", "_translated": true, "_saved_at": "2026-09-08T02:35:06+00:00", "_first_saved_at": "2026-09-08T02:35:06+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-43jz-bwno"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-86504", "cvss": {"cvssv31": [{"source": "cve@jetbrains.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "cwe": "CWE-829", "description": "IntelliJ IDEA 是 JetBrains 推出的商业 Java/Kotlin 集成开发环境（社区版开源、旗舰版闭源），内置 Dev Container 支持，用于依据 devcontainer.json 在容器中构建和打开开发环境。\n受影响版本中，IDE 在执行 Dev Container 构建前缺少项目信任（project-trust）确认环节，用户打开包含攻击者可控 devcontainer.json 的项目并触发 Dev Container 构建时，devcontainer.json 定义的构建与生命周期命令未经信任确认即在宿主机上执行，导致宿主机层面的代码执行。\n修复版本中通过在构建 Dev Container 前强制执行项目信任确认，未受信项目需先经用户确认信任才启动构建，切断了未经确认执行构建命令的路径。", "effects": [{"comp_name": "intellij_idea", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2026.2.2)", "min_fixed_version": "2026.2.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "从非可信控制范围包含功能例程", "kind_en": "包含来自不可信控制领域的功能", "last_modified_time": "2026-09-08", "level": "High", "mps_id": "MPS-o9le-746w", "poc": false, "poc_url": [], "published_time": "2026-09-08", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-o9le-746w", "name": "https://www.oscs1024.com/hd/MPS-o9le-746w"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-86504", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-86504"}, {"url": "https://www.jetbrains.com/privacy-security/issues-fixed/", "name": ""}], "scope_influence": "", "tags": [], "title": "IntelliJ IDEA Dev Container 代码执行漏洞", "_translated": true, "_saved_at": "2026-09-07T23:23:30+00:00", "_first_saved_at": "2026-09-07T20:59:53+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-o9le-746w"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-86498", "cvss": {"cvssv31": [{"source": "cve@jetbrains.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:N/I:H/A:N", "severity": "high", "base_score": 7.7}]}, "cvss_score": 7.7, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:N/I:H/A:N", "cwe": "CWE-863", "description": "JetBrains YouTrack 是商业问题跟踪与项目管理软件，提供缺陷跟踪、知识库、敏捷协作和 REST API，源码不公开。\n受影响版本中，链接子资源的 PUT 请求未校验目标实体的更新权限，已认证用户在缺少更新权限时仍可修改被链接实体，造成跨权限边界的数据被改写。\n修复版本中通过补齐链接子资源 PUT 请求的更新权限检查，阻止无更新权限的用户修改被链接实体。", "effects": [{"comp_name": "youtrack", "ecosystem": "linux", "versions": [{"affected_version": "[2026.1,2026.1.14047)", "min_fixed_version": "2026.1.14047", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,2025.3.160480)", "min_fixed_version": "2025.3.160480", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-09-08", "level": "High", "mps_id": "MPS-drxs-4zli", "poc": false, "poc_url": [], "published_time": "2026-09-08", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-drxs-4zli", "name": "https://www.oscs1024.com/hd/MPS-drxs-4zli"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-86498", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-86498"}, {"url": "https://www.jetbrains.com/privacy-security/issues-fixed/", "name": ""}], "scope_influence": "", "tags": [], "title": "YouTrack链接越权漏洞", "_translated": true, "_saved_at": "2026-09-07T20:59:52+00:00", "_first_saved_at": "2026-09-07T20:59:52+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-drxs-4zli"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-41869", "cvss": {}, "cvss_score": 7.5, "cvss_vector": "", "cwe": "CWE-862", "description": "Apache Nutch 是开源的网页爬虫与搜索引擎框架，用于抓取、解析和索引网页，1.10 至 1.22 版本随发行包提供基于 JAX-RS 的 Nutch Server（REST API）。\n受影响版本中，Nutch Server 未实现认证或授权。攻击者只要能够访问该 REST 服务，即可直接调用 AdminResource 的 GET /admin/stop 接口，经 stopServer 在约 1 秒后执行 NutchServer.stop() 中的 System.exit(0)，强制关闭整个服务进程；同时可通过 JobResource 的 GET /job/{id}/stop 与 GET /job/{id}/abort 无鉴权停止或终止正在运行的抓取任务。当 force 为 true 时，即使仍有任务运行也会立即关停。\n修复版本中通过彻底移除 Nutch Server 及其 REST 资源类、startserver 启动入口和相关依赖，使未授权关停与任务中断接口不再随发行包提供，切断该攻击面。", "effects": [{"comp_name": "org.apache.nutch:nutch", "ecosystem": "maven", "versions": [{"affected_version": "[1.10,1.23)", "min_fixed_version": "1.23", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-09-08", "level": "High", "mps_id": "MPS-6975-15d0", "poc": false, "poc_url": [], "published_time": "2026-09-08", "reference_url_list": [{"url": "http://www.mail-archive.com/announce@apache.org/msg11847.html", "name": ""}, {"url": "https://nutch.apache.org/documentation/security/", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-41869", "name": ""}, {"url": "https://issues.apache.org/jira/browse/NUTCH-3165", "name": ""}, {"url": "https://github.com/apache/nutch/commit/3b663de2e4c829267297814db8d231d037c586f7", "name": ""}, {"url": "https://github.com/apache/nutch/pull/  等 CLI 命令，用于读写和删除 system/settings.php 中的系统配置。\n受影响版本中，上述三个命令类未标注 #[AsNonSchedulableCommand]，CommandRegistry 默认将其视为可调度命令。不具备 system maintainer 权限的后台管理员可在调度器模块中安排这些命令，从而读取、修改或删除任意系统配置，并可提升为 system maintainer 或造成拒绝服务。\n修复版本中通过为 ConfigurationSetCommand、ConfigurationShowCommand 与 ConfigurationRemoveCommand 添加 #[AsNonSchedulableCommand] 属性，使调度器不再列出或执行这些命令，切断普通管理员经调度器改写系统配置的路径。", "effects": [{"comp_name": "typo3", "ecosystem": "linux", "versions": [{"affected_version": "[14.2.0,14.3.7)", "min_fixed_version": "14.3.7", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "typo3/cms-lowlevel", "ecosystem": "composer", "versions": [{"affected_version": "[14.2.0,14.3.7)", "min_fixed_version": "14.3.7", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-09-08", "level": "High", "mps_id": "MPS-jmy9-b8a4", "poc": false, "poc_url": [], "published_time": "2026-09-08", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-jmy9-b8a4", "name": "https://www.oscs1024.com/hd/MPS-jmy9-b8a4"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-85400", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-85400"}, {"url": "https://github.com/TYPO3/typo3/commit/b8abe36978c63a0625aee70df078895216e7ee27", "name": ""}, {"url": "https://github.com/TYPO3/typo3/commit/e15da7ba0218532240578b471152f76c13cb4154", "name": ""}, {"url": "https://news.typo3.com/security/advisory/typo3-core-sa-2026-023", "name": ""}], "scope_influence": "", "tags": ["php", "开源"], "title": "TYPO3配置命令越权漏洞", "_translated": true, "_saved_at": "2026-09-08T12:31:01+00:00", "_first_saved_at": "2026-09-08T12:31:01+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-jmy9-b8a4"}, {"analysis_status": 0, "articles": [], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-16028", "cvss": {}, "cvss_score": 7.5, "cvss_vector": "", "cwe": "CWE-401", "description": "Protocol::HTTP2 是开源 Perl HTTP/2 协议实现（RFC 7540），提供 Client 与 Server 的有状态帧编解码，用于在自选事件循环上实现 HTTP/2 客户端或服务端。\n受影响版本中，stream_state 在流进入 CLOSED 时会归还并发槽位并清理流对象上的大部分键，但不会从连接流表 $self-\u003e{streams} 删除该条目。流标识单调递增，对端可在同一连接上反复打开并关闭流，每条已关闭流都会留下约 920 字节残留；SETTINGS_MAX_CONCURRENT_STREAMS 只限制同时存活的流，无法约束已释放条目的累计增长，10 万次顺序请求约增加 88 MiB 常驻内存，导致内存耗尽拒绝服务。客户端使用同一流表，在面对敌对服务端时同样会增长。\n修复版本中通过在 stream_state 进入 CLOSED 时把 stream_id 记入 closed_streams，并在数量超过 max_closed_streams（默认 65535）时删除最旧的已关闭流表项，切断流表无限增长。", "effects": [{"comp_name": "Protocol-HTTP2", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.14)", "min_fixed_version": "1.14", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "内存泄漏", "kind_en": "有效生命周期后内存丢失释放", "last_modified_time": "2026-09-08", "level": "High", "mps_id": "MPS-zm6k-47ln", "poc": false, "poc_url": [], "published_time": "2026-09-08", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-zm6k-47ln", "name": "https://www.oscs1024.com/hd/MPS-zm6k-47ln"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-16028", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-16028"}, {"url": "https://github.com/vlet/p5-Protocol-HTTP2/commit/27a488a34d74fd16f123e5e6186d4f677faa246f.patch", "name": ""}, {"url": "https://metacpan.org/release/CRUX/Protocol-HTTP2-1.13/source/lib/Protocol/HTTP2/Stream.pm#L113-126", "name": ""}, {"url": "https://metacpan.org/release/CRUX/Protocol-HTTP2-1.14/changes", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Protocol::HTTP2内存耗尽漏洞", "_translated": true, "_saved_at": "2026-09-07T23:23:29+00:00", "_first_saved_at": "2026-09-07T20:59:51+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-zm6k-47ln"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CV 4ref-0a96"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-79643", "cvss": {"cvssv31": [{"source": "security_alert@emc.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:L/A:L", "severity": "high", "base_score": 7.3}]}, "cvss_score": 7.3, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:L/A:L", "cwe": "CWE-480", "description": "Dell Secure Connect Gateway（SCG）是戴尔提供的商业远程支持网关，用于在客户环境与戴尔支持服务之间建立安全连接，提供 Application 与 Appliance 两种形态，源码不公开。\n受影响版本中，产品存在错误运算符使用问题。未认证的远程攻击者可利用该逻辑缺陷获得未授权访问。厂商与 NVD 均未披露具体出错的运算符、代码位置或对外接口。\n修复版本中通过官方安全更新修正该运算符使用问题，阻断未认证远程访问通向未授权访问的路径。Application 形态修复版本为 5.36.00.00，Appliance 形态修复版本为 5.36.00.16。", "effects": [{"comp_name": "Secure Connect Gateway 5.0 - Appliance", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,5.36.00.16)", "min_fixed_version": "5.36.00.16", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "Secure Connect Gateway 5.0 - Application", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,5.36.00.00)", "min_fixed_version": "5.36.00.00", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "使用操作符不正确", "kind_en": "使用不正确的操作符", "last_modified_time": "2026-09-08", "level": "High", "mps_id": "MPS-x126-jobp", "poc": false, "poc_url": [], "published_time": "2026-09-08", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-x126-jobp", "name": "https://www.oscs1024.com/hd/MPS-x126-jobp"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-79643", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-79643"}, {"url": "https://www.dell.com/support/kbdoc/en-in/000503426/dsa-2026-382-security-update-for-dell-secure-connect-gateway-virtual-edition-multiple-vulnerabilities?msockid=3021cac2195069ed3194ddad186a68f9", "name": ""}], "scope_influence": "", "tags": [], "title": "Dell SCG错误运算符漏洞", "_translated": true, "_saved_at": "2026-09-07T17:02:51+00:00", "_first_saved_at": "2026-09-07T17:02:51+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-x126-jobp"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-80127", "cvss": {"cvssv31": [{"source": "security_alert@emc.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-78", "description": "Dell Secure Connect Gateway 是戴尔提供的企业监控与支持网关产品，以 Application 应用版和 Appliance 虚拟设备两种形态交付，用于监测戴尔服务器、存储和网络设备并采集故障遥测，源码未公开。\n受影响版本中，产品对操作系统命令所用特殊元素过滤不完整，已具备高权限且可远程访问的攻击者可将恶意内容注入操作系统命令并提升权限。\n修复版本中通过官方安全更新收紧命令参数处理，切断该命令注入路径；Application 升级至 5.36.00.00 及以上，Appliance 升级至 5.36.00.16 及以上。", "effects": [{"comp_name": "secure_connect_gateway", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,5.36.00.00)", "min_fixed_version": "5.36.00.00", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,5.36.00.16)", "min_fixed_version": "5.36.00.16", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-09-08", "level": "High", "mps_id": "MPS-xlnp-d0zk", "poc": false, "poc_url": [], "published_time": "2026-09-08", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-xlnp-d0zk", "name": "https://www.oscs1024.com/hd/MPS-xlnp-d0zk"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-80127", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-80127"}, {"url": "https://www.dell.com/support/kbdoc/en-in/000503426/dsa-2026-382-security-update-for-dell-secure-connect-gateway-virtual-edition-multiple-vulnerabilities?msockid=3021cac2195069ed3194ddad186a68f9", "name": ""}], "scope_influence": "", "tags": [], "title": "Dell SCG命令注入漏洞", "_translated": true, "_saved_at": "2026-09-07T17:02:48+00:00", "_first_saved_at": "2026-09-07T17:02:48+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-xlnp-d0zk"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-9331", "cvss": { ed_at": "2026-09-08T19:47:18+00:00", "_first_saved_at": "2026-09-08T19:47:18+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ub52-v610"}, {"analysis_status": 0, "articles": [{"content": "应用程序在处理用户输入时的不完善或缺乏验证机制，所以攻击者能够通过向应用程序发送恶意输入，利用应用程序对输入数据的错误处理方式来注入自己的恶意代码。这些恶意代码会被应用程序误认为是合法的指令或数据，并在执行过程中被执行。", "title": "什么是代码注入"}, {"content": "应用程序使用可执行动态代码的函数来执行用户可控的参数，当应用程序对于用户输入过滤不完全时，攻击者可以注入恶意代码并控制代码执行流程。", "title": "代码注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对所有用户输入进行验证和过滤，确保只接受预期的有效输入。这包括对输入数据进行输入长度验证、类型检查和格式验证等。\r\n- 使用参数化查询或预编译语句：对于数据库查询操作，应该使用参数化查询或预编译语句，确保输入数据不会被误认为是执行代码。\r\n- 最小特权原则：应用程序在执行操作系统命令或动态代码时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。\r\n- 安全编码实践：开发人员应该采用安全编码实践，包括避免使用eval函数、避免拼接用户输入的字符串作为代码执行等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止代码注入攻击。", "title": "如何预防代码注入"}], "cnvd_id": "", "cve_id": "CVE-2026-86732", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-94", "description": "Craft CMS 是开源 PHP 内容管理系统，通过 Composer 包 craftcms/cms 发布，用于构建后台可控的网站与内容体验。\n受影响版本中，控制面板 element-index 接口会把请求体中的 criteria 应用到元素查询。ElementHelper::cleanseQueryCriteria() 保留 withTransforms，Component::cleanseConfig() 保留 class，使 criteria[withTransforms][0][class] 进入查询。当资源库查询返回至少一条资产时，eager loader 将其传入 ImageTransforms::normalizeTransform()，PHP 数组展开使后出现的 class 覆盖 Craft::createObject() 的目标类型，攻击者可实例化任意类，并利用 yii\\rbac\\PhpManager 将 itemFile 指向含 User-Agent PHP 载荷的请求日志，在 Web 进程中执行代码。\n修复版本中通过在 "published_time": "2026-09-09", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-vyc7-21z6", "name": "https://www.oscs1024.com/hd/MPS-vyc7-21z6"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-76190", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-76190"}, {"url": "https://helpx.adobe.com/security/products/coldfusion/apsb26-119.html", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-76190漏洞", "_translated": true, "_saved_at": "2026-09-09T00:58:11+00:00", "_first_saved_at": "2026-09-08T22:16:54+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-vyc7-21z6"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-75993", "cvss": {"cvssv31": [{"source": "psirt@adobe.com", "vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:R/S:C/C:H/I:H/A:N", "severity": "high", "base_score": 8.5}]}, "cvss_score": 8.5, "cvss_vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:R/S:C/C:H/I:H/A:N", "cwe": "CWE-79", "description": "ColdFusion 受到反映的跨站点脚本 (XSS) 漏洞的影响。攻击者可以利用此漏洞将恶意脚本注入网页，从而可能获得对受害者帐户或会话的更高访问权限或控制权。利用此问题需要用户交互，受害者必须打开恶意文件。范围已更改。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-09-09", "level": "High", "mps_id": "MPS-mxtd-al97", "poc": false, "poc_url": [], "published_time": "2026-09-09", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-mxtd-al97", "name": "https://www.oscs1024.com/hd/MPS-mxtd-al97"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-75993", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-75993"}, {"url": "https://helpx.adobe.com/security/products/coldfusion/apsb26-119.html", "name": ""}], "scope_influence": "", "tags": [], "title": "冷聚变 |跨站脚本（反射型 XSS）(CWE-79)", "_translated": true, "_saved_at": "2026-09-09T00:58:18+00:00", "_first_saved_at": "2026-09-08T22:17:03+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-mxtd-al97"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-75999", "cvss": {"cvssv31": [{"source": "psirt@adobe.com", "vector": "CVSS:3.1/AV:A/AC:L/PR:L/UI:R/S:C/C:H/I:H/A:H", "severity": "high", "base_score": 8.4}]}, "cvss_score": 8.4, "cvss_vector": "CVSS:3.1/AV:A/AC:L/PR:L/UI:R/S:C/C:H/I:H/A:H", "cwe": "CWE-20", "description": "ColdFusion 受到不正确输入验证漏洞的影响，该漏洞可能导致在当前用户的上下文中执行任意代码。低权限攻击者可以利用此漏洞执行任意代码。默认情况下，易受攻击的组件仅限于管理网络区域。利用此问题需要用户交互，受害者必须打开恶意文件。范围已更改。", "effects": [], "epss": -1, "ex ent": "跨界内存读是指应用程序在读取内存时，未正确验证或限制读取的内存范围。攻击者利用这种漏洞可以读取应用程序内存中的敏感数据，如密码、加密密钥、会话令牌等。常见的原因是由于缓冲区溢出、格式化字符串漏洞或其他内存错误导致的。", "title": "什么是越界读取"}, {"content": "攻击者可以通过不当构造的输入来触发跨界内存读漏洞。攻击者可能会通过向应用程序发送特定的输入，使其读取超过预期的内存区域。攻击者可以利用这个漏洞来获取敏感信息，如其他用户的数据、操作系统的敏感数据或应用程序的内部状态。", "title": "越界读取常见的攻击方式"}, {"content": "- 输入验证和限制：应用程序应对所有输入数据进行严格的验证和限制。确保输入数据的长度、格式和内容符合预期，避免超出缓冲区或访问非预期的内存区域。\n- 内存安全编程实践：开发人员应使用安全的编程实践，如避免使用不安全的函数、正确处理内存分配和释放操作，以及遵循最小特权原则。\n- 使用安全的编程语言和库：选择使用安全性较高的编程语言和库，这些语言和库在内存管理和安全性方面提供了更多的保护机制。\n- 定期进行代码审查和安全测试：定期审查应用程序的代码，并进行安全测试，以发现潜在的跨界内存读漏洞。使用静态代码分析工具和漏洞扫描工具来辅助检测和修复问题。\n- 实施防御性编程技术：应用程序应采用防御性编程技术，如使用随机化地址空间布局（ASLR）、堆栈保护机制（如堆栈溢出保护）和数据执行预防（DEP）等。\n- 及时更新和修补：及时应用程序和操作系统的安全更新和补丁，以确保已知的跨界内存读漏洞得到修复。及时更新相关软件和库，以避免使用已知存在漏洞的版本。", "title": "如何预防越界读取"}], "cnvd_id": "", "cve_id": "CVE-2026-84001", "cvss": {"cvssv31": [{"source": "secure@microsoft.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-125", "description": "Windows 密钥分发中心中的越界读取允许未经授权的攻击者通过网络拒绝服务。", "effects": [{"comp_name": "windows_10_1607", "ecosystem": "linux", "versions": [{"affected_version": "[10.0.14393.0,10.0.14393.9512)", "min_fixed_version": "10.0.14393.9512", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "windows_10_1809", "ecosystem": "linux", "versions": [{"affected_version": "[10.0.17763.0,10.0.17763.9245)", "min_fixed_version": "10.0.17763.9245", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "windows_10_21H2", "ecosystem": "linux", "versions": [{"affected_version": "[10.0.19044.0,10.0.19044.7725)", "min_fixed_version": "10.0.19044.7725", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "windows_10_22H2", "ecosystem": "linux", "versions": [{"affected_version": "[10.0.19045.0,10.0.19045.7725)", "min_fixed_version": "10.0.19045.7725", "repository": "unmanaged",  "description": "Craft CMS 是开源内容管理系统，源码托管于 GitHub，用于构建网站并管理内容与用户账户。\n受影响版本中，UsersController::actionActivateUser 处理控制面板 POST 请求 users/activate-user 时只调用 requirePermission('administrateUsers')，未在目标用户为管理员时执行 requireAdmin()。持有 administrateUsers 权限的非管理员已认证用户可以把请求体 userId 指向 pending 或被停用的管理员账户，随后 Craft::$app-\u003egetUsers()-\u003eactivateUser($user) 会激活该账户，再结合重置该账户密码可造成权限提升。\n修复版本中通过在 actionActivateUser 解析目标用户后增加 if ($user-\u003eadmin) { $this-\u003erequireAdmin(false); } 检查，与 actionDeactivateUser 对齐，阻止非管理员激活管理员账户。", "effects": [{"comp_name": "craftcms/cms", "ecosystem": "composer", "versions": [{"affected_version": "[5.0.0-RC1,5.10.12)", "min_fixed_version": "5.10.12", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-09-08", "level": "High", "mps_id": "MPS-gtac-9bku", "poc": false, "poc_url": [], "published_time": "2026-09-09", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-gtac-9bku", "name": "https://www.oscs1024.com/hd/MPS-gtac-9bku"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-86731", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-86731"}, {"url": "https://github.com/craftcms/cms/security/advisories/GHSA-jqf5-vfg6-8cx5", "name": "GitHub Security Advisory (GHSA-jqf5-vfg6-8cx5)"}, {"url": "https://www.vulncheck.com/advisories/craft-cms-5.0.0-rc1-before-5.10.12-permission-escalation-via-userscontroller", "name": "VulnCheck Advisory: Craft CMS 5.0.0-RC1 before 5.10.12 Permission Escalation via UsersController"}], "scope_influence": "", "tags": ["php", "开源"], "title": "Craft CMS权限提升漏洞", "_translated": true, "_saved_at": "2026-09-08T16:59:22+00:00", "_first_saved_at": "2026-09-08T16:59:22+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-gtac-9bku"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "cnvd_id": "", "cve_id": "CVE-2026-85360", "cvss": {"cvssv31": [{"source": "secure@microsoft.com", "vector": "CVSS:3.1/AV:L/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7}]}, "cvss_score": 7, "cvss_vector": "CVSS:3.1/AV:L/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-416", "description": "Windows 内核中的释放后使用允许授权攻击者在本地提升权限。", "effects": [{"comp_name": "windows_10_1607", "ecosystem": "linux", "versions": [{"affected_version": "[10.0.14393.0,10.0.14393.9512)", "min_fixed_version": "10.0.14393.9512", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "windows_10_1809", "ecosystem": "linux", "versions": [{"affected_version": "[10.0.17763.0,10.0.17763.9245)", "min_fixed_version": "10.0.17763.9245", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "windows_10_21H2", "ecosystem": "linux", "versions": [{"affected_version": "[10.0.19044.0,10.0.19044.7725)", "min_fixed_version": "10.0.19044.7725", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "windows_10_22H2", "ecosystem": "linux", "versions": [{"affected_version": "[10.0.19045.0,10.0.19045.7725)", "min_fixed_version": "10.0.19045.7725", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "windows_11_23H2", "ecosystem": "linux",       const cn = levelLabels[level] || level || "";
      if (level === "Critical" || cn === "严重") return "crit";
      if (level === "High" || cn === "高危") return "high";
      return "other";
    }
    function levelText(level) {
      return levelLabels[level] || level || "-";
    }
    function esc(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }
    function scoreText(v) {
      if (v === null || v === undefined || v === "" || v === -1) return "-";
      return String(v);
    }

    function renderList() {
      const list = $("list");
      $("listCount").textContent = String(filtered.length);
      if (!filtered.length) {
        list.innerHTML = '<div class="empty">没有匹配项</div>';
        return;
      }
      list.innerHTML = filtered.map((it) => {
        const id = it.mps_id || it.cve_id;
        const active = id === activeId ? " active" : "";
        return `
          <button class="item${active}" data-id="${esc(id)}" type="button">
            <div class="item-top">
              <span class="cve">${esc(it.cve_id || it.mps_id || "-")}</span>
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
            </div>
            <div class="title">${esc(it.title || "-")}</div>
            <div class="item-foot">
              <span>CVSS ${esc(scoreText(it.cvss_score))}</span>
              <span>${esc(it.published_time || "-")}</span>
              ${it.poc ? "<span>POC</span>" : ""}
            </div>
          </button>`;
      }).join("");
      list.querySelectorAll(".item").forEach((btn) => {
        btn.addEventListener("click", () => selectById(btn.dataset.id));
      });
    }

    function refsHtml(it) {
      const refs = Array.isArray(it.reference_url_list) ? it.reference_url_list : [];
      const links = [];
      if (it._source_page) links.push({ url: it._source_page, name: "OSCS 详情" });
      if (it.cve_id) links.push({ url: `https://nvd.nist.gov/vuln/detail/${it.cve_id}`, name: "NVD" });
      refs.forEach((r) => {
        if (r && r.url) links.push({ url: r.url, name: r.name || r.url });
      });
      const seen = new Set();
      const uniq = [];
      for (const l of links) {
        if (seen.has(l.url)) continue;
        seen.add(l.url);
        uniq.push(l);
      }
      if (!uniq.length) return '<div class="box">无参考链接</div>';
      return `<div class="refs">${uniq.map((l) =>
        `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name || l.url)}</a>`
      ).join("")}</div>`;
    }

    function articlesHtml(it) {
      const arts = Array.isArray(it.articles) ? it.articles : [];
      if (!arts.length) return "";
      return `<div class="section"><h3>相关说明</h3>${arts.map((a) => `
        <div class="article">
          <h4>${esc(a.title || "说明")}</h4>
          <p>${esc(a.content || "")}</p>
        </div>`).join("")}</div>`;
    }

    function renderDetail(it) {
      const detail = $("detail");
      if (!it) {
        detail.innerHTML = '<div class="empty">暂无数据</div>';
        return;
      }
      const pocUrls = Array.isArray(it.poc_url) ? it.poc_url : [];
      detail.innerHTML = `
        <div class="d-head">
          <div>
            <h1 class="d-title">${esc(it.title || "-")}</h1>
            <div class="ids">
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
              <span class="chip">${esc(it.cve_id || "无 CVE")}</span>
              <span class="chip">${esc(it.mps_id || "-")}</span>
              ${it.poc ? '<span class="chip">有 POC</span>' : ""}
              ${it.exp ? '<span class="chip">有 EXP</span>' : ""}
            </div>
          </div>
          <div class="actions">
            ${it._source_page ? `<a class="btn" href="${esc(it._source_page)}" target="_blank" rel="noopener">OSCS</a>` : ""}
            ${it.cve_id ? `<a class="btn" href="https://nvd.nist.gov/vuln/detail/${esc(it.cve_id)}" target="_blank" rel="noopener">NVD</a>` : ""}
          </div>
        </div>
        <div class="grid">
          <div class="stat"><div class="k">CVSS</div><div class="v">${esc(scoreText(it.cvss_score))}</div></div>
          <div class="stat"><div class="k">向量</div><div class="v">${esc(it.cvss_vector || "-")}</div></div>
          <div class="stat"><div class="k">CWE</div><div class="v">${esc(it.cwe || "-")}</div></div>
          <div class="stat"><div class="k">类型</div><div class="v">${esc(it.kind || it.kind_en || "-")}</div></div>
          <div class="stat"><div class="k">公开</div><div class="v">${esc(it.published_time || "-")}</div></div>
          <div class="stat"><div class="k">利用成本</div><div class="v">${esc(it.exploit_requirement_cost || "-")}</div></div>
          <div class="stat"><div class="k">可利用性</div><div class="v">${esc(it.exploitability || "-")}</div></div>
          <div class="stat"><div class="k">修复建议</div><div class="v">${esc(it.fix_suggestion || "-")}</div></div>
        </div>
        <div class="section"><h3>描述</h3><div class="box">${esc(it.description || "无描述")}</div></div>
        ${it.scope_influence ? `<div class="section"><h3>影响范围</h3><div class="box">${esc(it.scope_influence)}</div></div>` : ""}
        ${pocUrls.length ? `<div class="section"><h3>POC 链接</h3><div class="refs">${pocUrls.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join("")}</div></div>` : ""}
        <div class="section"><h3>参考链接</h3>${refsHtml(it)}</div>
        ${articlesHtml(it)}
      `;
    }

    function selectById(id) {
      const it = filtered.find((x) => (x.mps_id || x.cve_id) === id) ||
                 items.find((x) => (x.mps_id || x.cve_id) === id);
      if (!it) return;
      activeId = it.mps_id || it.cve_id;
      renderList();
      renderDetail(it);
      const btn = document.querySelector(`.item[data-id="${CSS.escape(activeId)}"]`);
      if (btn) btn.scrollIntoView({ block: "nearest" });
      history.replaceState(null, "", "#" + encodeURIComponent(activeId));
    }

    function applyFilter(q) {
      const query = (q || "").trim().toLowerCase();
      filtered = !query ? items.slice() : items.filter((it) => {
        const blob = [
          it.cve_id, it.mps_id, it.title, it.kind, it.kind_en, it.cwe, it.description, it.level
        ].map((x) => String(x || "").toLowerCase()).join(" ");
        return blob.includes(query);
      });
      renderList();
      if (filtered.length) {
        const still = filtered.some((x) => (x.mps_id || x.cve_id) === activeId);
        selectById(still ? activeId : (filtered[0].mps_id || filtered[0].cve_id));
      } else {
        activeId = null;
        renderDetail(null);
      }
    }

    $("search").addEventListener("input", (e) => applyFilter(e.target.value));

    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement !== $("search")) {
        e.preventDefault();
        $("search").focus();
        return;
      }
      if (!filtered.length) return;
      const idx = filtered.findIndex((x) => (x.mps_id || x.cve_id) === activeId);
      if (e.key === "ArrowDown") {
        e.preventDefault();
        const next = filtered[Math.min(filtered.length - 1, Math.max(0, idx) + 1)];
        selectById(next.mps_id || next.cve_id);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        const prev = filtered[Math.max(0, idx - 1)];
        selectById(prev.mps_id || prev.cve_id);
      }
    });

    const hashId = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    if (hashId && items.some((x) => (x.mps_id || x.cve_id) === hashId)) {
      activeId = hashId;
      renderList();
      selectById(hashId);
    } else if (items.length) {
      selectById(items[0].mps_id || items[0].cve_id);
    } else {
      renderList();
      renderDetail(null);
    }
  </script>
</body>
</html>
