复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-78183", "cvss": {}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-787", "description": "DBD::Pg version 3.21.0 for Perl has a heap out-of-bounds write in quote_float.\n\nquote_float() allocates the length of the string + 1, which is the size of the bare numeric symbol plus NULL.  But for special literals NaN, Inf, +Inf, -Inf, Infinity, +Infinity, -Infinity it emits the literal surrounded by quotes plus NULL, which is length + 3 bytes. Every recognised literal (case-insensitive) overflows by 2 bytes, a single quote and a NULL.\n\nThis can be reached by the $dbh-\u003equote method, for example\n\n    $dbh-\u003equote( \"Infinity\", DBI::SQL_NUMERIC ).\n\nThis regression was introduced in 3.21.0 by the quote.c rewrite.", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-08-24", "level": "Critical", "mps_id": "MPS-gncf-koz0", "poc": false, "poc_url": [], "published_time": "2026-08-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-gncf-koz0", "name": "https://www.oscs1024.com/hd/MPS-gncf-koz0"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-78183", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-78183"}, {"url": "https://github.com/bucardo/dbdpg/commit/6d6f47ed2403cda55c82b1bad56e388ba7390065.patch", "name": ""}, {"url": "https://github.com/bucardo/dbdpg/commit/adacf1de872326a465e13f9e4281a674ebcd227e", "name": ""}, {"url": "https://github.com/bucardo/dbdpg/security/advisories/GHSA-785p-fw3v-r822", "name": ""}, {"url": "https://metacpan.org/release/TURNSTEP/DBD-Pg-3.21.1/source/Changes", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-78183漏洞", "_translated": true, "_saved_at": "2026-08-26T04:34:02+00:00", "_first_saved_at": "2026-08-23T21:15:38+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-gncf-koz0"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-78387", "cvss": {"cvssv4": [{"source": "5a6e4751-2f3f-4070-9419-94fb35b644e8", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.4}]}, "cvss_score": 9.4, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-862", "description": "RansomLook 是开源 Python 勒索软件情报追踪平台，用于监控勒索团伙站点、泄露信息和通知集成，并提供 Web 管理界面。\n受影响版本中，Flask 路由 /admin/config 对应的 admin_config 仅使用 flask_login.login_required 校验登录会话，没有额外的管理员或特权授权检查。已认证的低权限用户可通过 GET 或 POST 访问该接口，把表单中的配置字段直接写入 config/generic.json，从而改动 notification、LDAP、SMTP 及通用应用设置，并可能改写认证相关配置、重定向通知或集成、干扰外部服务，或造成实例不可用。受影响版本含有避免把已识别口令、令牌和 API 密钥回显到浏览器的逻辑，但配置管理入口本身授权不足。\n修复版本中通过删除 website/web/__init__.py 中的 /admin/config 路由与 admin_config 处理函数，并移除 templates/admin/config.html、static/js/config.js 以及管理页中的配置编辑入口，使应用配置无法再经 Web UI 被修改。", "effects": [{"comp_name": "RansomLook", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.0.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-08-24", "level": "Critical", "mps_id": "MPS-aj1b-qos7", "poc": false, "poc_url": [], "published_time": "2026-08-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-aj1b-qos7", "name": "https://www.oscs1024.com/hd/MPS-aj1b-qos7"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-78387", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-78387"}, {"url": "https://github.com/RansomLook/RansomLook/commit/d411ff51446e9e8b04e15567b46d53e86a3116dd", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "RansomLook配置越权漏洞", "_translated": true, "_saved_at": "2026-08-24T16:29:36+00:00", "_first_saved_at": "2026-08-24T15:33:23+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-aj1b-qos7"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-77994", "cvss": {"cvssv4": [{"source": "security@joomla.org", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-89", "description": "Page Builder CK 是 joomlack.fr 提供的开源 Joomla 页面构建扩展，基于 GPLv2 授权，用于在文章、模块和独立页面中通过拖拽生成版面与样式。\n受影响版本中，前台页面模型 PagebuilderckModelPage 的 parseHtml 会读取页面 HTML 里 pagebuilderckparams 节点的 data-styles 属性，并交给 loadStyles。loadStyles 把该样式 ID 列表直接拼进 #__pagebuilderck_styles 表的 IN 查询。攻击者把恶意 data-styles 写入页面或文章内容后，前台渲染该内容时会执行二次 SQL 注入，读取或改写数据库。\n修复版本中通过在 loadStyles 内将 data-styles 按逗号拆分并逐项转为整数后再写入 IN 条件，阻止非数字片段进入 SQL，切断二次注入链路。", "effects": [{"comp_name": "page_builder_ck", "ecosystem": "linux", "versions": [{"affected_version": "[1.0.0,3.6.5)", "min_fixed_version": "3.6.5", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-08-24", "level": "Critical", "mps_id": "MPS-9pv0-ucow", "poc": false, "poc_url": [], "published_time": "2026-08-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-9pv0-ucow", "name": "https://www.oscs1024.com/hd/MPS-9pv0-ucow"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-77994", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-77994"}, {"url": "https://www.joomlack.fr/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Page Builder CK二次SQL注入", "_translated": true, "_saved_at": "2026-08-24T09:40:14+00:00", ""}, {"url": "https://github.com/mateocallec/exceljs-hardened/security/advisories/GHSA-qwr4-7h29-chpf", "name": ""}, {"url": "https://www.vulncheck.com/advisories/exceljs-through-prototype-pollution-via-deepmerge-reached-from-note-serialization", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-78207漏洞", "_translated": true, "_saved_at": "2026-08-26T04:34:02+00:00", "_first_saved_at": "2026-08-24T02:20:37+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ae5u-h0st"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-78211", "cvss": {"cvssv31": [{"source": "twcert@cert.org.tw", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}], "cvssv4": [{"source": "twcert@cert.org.tw", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-78", "description": "4MOSAn GCB Doctor 是美丽岛安全科技（4MOSAn Security Technology）开发的商业软件，用于政府组态基准合规检查与管理，源码未公开。\n受影响版本中，产品残留未移除的 ADOdb 测试页面，会将页面参数带入操作系统命令执行路径。未经身份鉴别的远程攻击者可向该测试页面注入恶意指令，在服务器上执行任意系统命令。\n修复版本中通过升级至 20260621 并执行 FreeBSD-GCB 管理中心安全升级，消除该测试页面对外部参数的危险命令处理，阻断未授权远程命令执行。", "effects": [{"comp_name": "gcb_doctor", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,20260621)", "min_fixed_version": "20260621", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-08-24", "level": "Critical", "mps_id": "MPS-odz2-xs5g", "poc": false, "poc_url": [], "published_time": "2026-08-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-odz2-xs5g", "name": "https://www.oscs1024.com/hd/MPS-odz2-xs5g"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-78211", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-78211"}, {"url": "https://www.twcert.org.tw/en/cp-139-11122-3d95a-2.html", "name": ""}, {"url": "https://www.twcert.org.tw/tw/cp-132-11118-dfee4-1.html", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "GCB Doctor命令注入漏洞", "_translated": true, "_saved_at": "2026-08-24T05:33:06+00:00", "_first_saved_at": "2026-08-24T04:38:36+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-odz2-xs5g"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-78365", "cvss": {"cvssv4": [{"source": "4daa8cea-433a-44bd-9456-53b127fc289a", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-862", "description": "Authorization Bypass Through User-Controlled Key in the supplier API in Roskus Prospero Flow CRM 4.0.0 through 5.3.1 allows any authenticated user to read and modify another company's supplier record, and to reassign it to their own company, via a PUT request to /api/supplier/{id} setting company_id in the body.", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-08-24", "level": "Critical", "mps_id": "MPS-q6jy-pbi2", "poc": false, "poc_url": [], "published_time": "2026-08-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-q6jy-pbi2", "name": "https://www.oscs1024.com/hd/MPS-q6jy-pbi2"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-78365", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-78365"}, {"url": "https://github.com/Roskus/prospero-flow-crm/commit/4a52477e6ed66afa436814c80e7bcd68670dd596", "name": ""}, {"url": "https://github.com/Roskus/prospero-flow-crm/releases/tag/v5.5.3", "name": ""}, {"url": "https://secur0.com/en/cna/cve-list/cve-2026-78365-idor-supplier-api-cross-tenant-update", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-78365漏洞", "_translated": true, "_saved_at": "2026-08-26T04:34:02+00:00", "_first_saved_at": "2026-08-24T13:45:20+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-q6jy-pbi2"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2026-78167", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:N/AC:L/Au:N/C:C/I:C/A:C", "severity": "high", "base_score": 10}], "cvssv31": [{"source": "cna@vuldb.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 10}], "cvssv4": [{"source": "cna@vuldb.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, sistently applying the application's private-entity access restrictions. As a result, information associated with groups, markets, posts, or other records marked as private may be included in an export accessible to an unauthenticated requester.\n\nAn attacker able to reach the RansomLook web application can request the affected export endpoint and retrieve data that should only be available to authorized users. Depending on the contents of the instance, this may disclose private ransomware intelligence, victim information, internal tracking data, or other information deliberately excluded from public views.\n\nThe patch removes the legacy unauthenticated export route and introduces centralized authorization handling that distinguishes ordinary authenticated API access from authorization to view private entries. API keys must now be explicitly granted private-data access, while existing keys do not automatically receive this privilege. The same private-data filtering is also applied consistently across API responses and database exports.", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-08-24", "level": "Critical", "mps_id": "MPS-24g1-xfop", "poc": false, "poc_url": [], "published_time": "2026-08-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-24g1-xfop", "name": "https://www.oscs1024.com/hd/MPS-24g1-xfop"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-78370", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-78370"}, {"url": "https://github.com/RansomLook/RansomLook/commit/ff97a3489d70ffc3c1d09ea2c7d25137edfffb2a", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-78370漏洞", "_translated": true, "_saved_at": "2026-08-26T04:34:02+00:00", "_first_saved_at": "2026-08-24T14:35:32+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-24g1-xfop"}, {"analysis_s he name of a private \nentity, allowing an unauthorized user to retrieve information such as \npost counts, mirror totals, and uptime even when the entity is excluded \nfrom the normal user interface. The patch explicitly adds a privacy \ncheck before returning this information. \n\n\nRansom-note views, search results, \nand API endpoints were similarly missing consistent filtering. The fix \nintroduces normalized private-group identifiers and alias handling, then\n rejects or filters notes associated with private groups before \nreturning them to unauthorized callers.  \n\n\nAn attacker can exploit the issue \nremotely without authentication or user interaction, resulting in \ndisclosure of information that was explicitly intended to be restricted \nto authorized users.", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-08-24", "level": "Critical", "mps_id": "MPS-3u0l-tamj", "poc": false, "poc_url": [], "published_time": "2026-08-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-3u0l-tamj", "name": "https://www.oscs1024.com/hd/MPS-3u0l-tamj"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-78372", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-78372"}, {"url": "https://github.com/RansomLook/RansomLook/commit/dc92d6d5c076bcdbf3476aca42daf0260e8d99d7", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-78372漏洞", "_translated": true, "_saved_at": "2026-08-26T04:34:02+00:00", "_first_saved_at": "2026-08-24T14:35:57+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-3u0l-tamj"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-77998", "cvss": {"cvssv4": [{"source": "security@joomla.org", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 10}]}, "cvss_score": 10, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-639", "description": "miniOrange SAML SSO for Joomla、SAML SP Single Sign On – Login with ADFS 与 SAML SSO login with Google Apps 是开源 Joomla 扩展，用于将 Joomla 站点作为 SAML 2.0 服务提供方，接入 Azure AD、ADFS、Google Apps 等身份提供方完成单点登录。\n受影响版本中，断言消费接口在处理 SAMLResponse 时，SAML_Utilities::validateSignature 对 XMLSecurityDSig::verify() 的返回值做松散布尔判断。该返回值来自 PHP openssl_verify() 的三态整数，错误返回值 -1 会被当成验签成功。未认证攻击者可向 ?morequest=acs 提交包含可控 NameID 与格式错误签名的 SAMLResponse，绕过验签后由 loginCurrentUser 将会话绑定为任意已存在的 Joomla 用户，包括管理员。\n修复版本中通过在 XMLSecurityKey::verifyOpenSSL 将 openssl_verify() 的结果与 1 做严格比较后再返回，使验签错误不再被当作成功，切断伪造 SAMLResponse 接管账号的路径。", "effects": [{"comp_name": "SAML SP Single Sign On – Login with ADFS", "ecosystem": "linux", "versions": [{"affected_version": "[1.0.0,6.4)", "min_fixed_version": "6.4", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "SAML SSO for Joomla", "ecosystem": "linux", "versions": [{"affected_version": "[1.0.0,11.0.2)", "min_fixed_version": "11.0.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "SAML SSO login with Google Apps", "ecosystem": "linux", "versions": [{"affected_version": "[1.0.0,6.4)", "min_fixed_version": "6.4", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "通过用户控制密钥绕过授权机制", "kind_en": "通过用户控制的密钥绕过授权", "last_modified_time": "2026-08-25", "level": "Critical", "mps_id": "MPS-kls1-iu3j", "poc": false, "poc_url": [], "published_time": "2026-08-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-kls1-iu3j", "name": "https://www MPS-lso3-5ua8", "name": "https://www.oscs1024.com/hd/MPS-lso3-5ua8"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2025-36939", "name": "https://nvd.nist.gov/vuln/detail/CVE-2025-36939"}, {"url": "https://support.google.com/product-documentation/answer/17072818?hl=en\u0026ref_topic=12974021\u0026sjid=16276349370796658455-NC", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "OpenThread拒绝服务漏洞", "_translated": true, "_saved_at": "2026-08-24T18:30:50+00:00", "_first_saved_at": "2026-08-24T18:30:50+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-lso3-5ua8"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-78477", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-266", "description": "Jawn 是 MVPThemes 发布的商业 WordPress 新闻与杂志主题，用于构建新闻、杂志类站点，不以公开 GitHub 仓库分发。\n受影响版本中，主题存在错误的权限分配，未认证攻击者可将权限提升为管理员，从而接管 WordPress 站点。\n修复版本中通过官方安全更新修复该错误权限分配问题尚未得到确认，当前公开来源未给出已验证修复版本，并标明无官方补丁，应立即停用或替换受影响主题，并排查未授权管理员账户。", "effects": [{"comp_name": "jawn", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.4.2]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "特权授予不正确", "kind_en": "权限分配不正确", "last_modified_time": "2026-08-25", "level": "Critical", "mps_id": "MPS-1h6u-zqyf", "poc": false, "poc_url": [], "published_time": "2026-08-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-1h6u-zqyf", "name": "https://www.oscs1024.com/hd/MPS-1h6u-zqyf"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-78477", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-78477"}, {"url": "https://patchstack.com/database/wordpress/theme/jawn/vulnerability/wordpress-jawn-theme-1-4-2-privilege-escalation-vulnerability", "name": ""}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/e0642c85-ee01-497c-8dc3-42e3ffc02995?source=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Jawn主题权限提升漏洞", "_translated": true, "_saved_at": "2026-08-25T08:34:41+00:00", "_first_saved_at": "2026-08-25T07:39:15+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-1h6u-zqyf"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-13214", "cvss": {"cvssv31": [{"source": "vulnerabilities@zephyrproject.org", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-787", "description": "Zephyr 是开源实时操作系统，其 OCPP 1.6 客户端子系统用于充电桩经 WebSocket 与中央系统通信。\n受影响版本中，WebSocket 读线程 ocpp_wsreader() 将中央系统下发的报文写入 ui-\u003erecv_buf，再经 PDU 表调用 parse_getconfig_msg()。该函数使用无界 strcpy() 把攻击者可控的 JSON key 拷贝到 ocpp_process_server_msg() 中固定 50 字节的栈缓冲 skey[CISTR50]，源串长度仅受 CONFIG_OCPP_RECV_BUFFER_SIZE（默认 2048）限制。控制中央系统端点或在未加密连接上实施中间人攻击的攻击者可发送超过 50 字节的 key，造成读线程栈破坏，至少导致拒绝服务，在缺少栈金丝雀或 MPU 加固时还可能远程执行代码。\n修复版本中通过将 strcpy() 替换为 strncpy(key, payload.key[0], CISTR50 - 1) 并显式写入 NUL 终止符，把拷贝长度限制在目标缓冲以内，阻断超长 key 覆盖栈的路径。", "effects": [{"comp_name": "zephyr", "ecosystem": "linux", "versions": [{"affected_version": "[4.3.0,4.4.2)", "min_fixed_version": "4.4.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-08-25", "level": "Critical", "mps_id": "MPS-2zf4-njr0", "poc": false, "poc_url": [], "published_time": "2026-08-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-2zf4-njr0", "name": "https://www.oscs1024.com/hd/MPS-2zf4-njr0"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-13214", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-13214"}, {"url": "https://github.com/zephyrproject-rtos/zephyr/commit/afbf880b04188ae53451a0ade4ac62b654fdff34", "name": ""}, {"url": "https://github.com/zephyrproject-rtos/zephyr/security/advisories/GHSA-fqhf-6v24-4px2", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Zephyr OCPP栈溢出", "_translated": true, "_saved_at": "2026-08-25T06:36:14+00:00", "_first_saved_at": "2026-08-25T06:36:14+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-2zf4-njr0"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-78267", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-266", "description": "TranslatePress 是 Cozmoslabs 发布的开源 WordPress 多语言翻译插件，插件目录名为 translatepress-multilingual，用于在前端可视化编辑器中翻译站点内容，并支持自动翻译。\n受影响版本中，Translation Editor 预览模式在 TRP_Translation_Manager::conditions_met() 里只判断请求参数 trp-edit-translation 是否为 preview，不调用 current_user_can 校验 trp_translating_capability，未认证访问者可直接进入本应受限的编辑器预览路径。TRP_Translation_Render::translate_page() 在该预览分支把未校验的 data-trpgettextoriginal 写回页面属性，搜索查询等反射输入可借此注入标记并取得站点控制权。\n修复版本中通过新增 sanitize_gettext_original_id() 将 data-trpgettextoriginal 限制为纯数字，并在 setAttribute 与字符串拼接输出时使用 esc_attr()，阻止未校验标识进入预览写回路径。", "effects": [{"comp_name": "translatepress-multilingual", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,3.3.3)", "min_fixed_version": "3.3.3", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "特权授予不正确", "kind_en": "权限分配不正确", "last_modified_time": "2026-08-25", "level": "Critical", "mps_id": "MPS-70qc-3rjm", "poc": false, "poc_url": [], "published_time": "2026-08-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-70qc-3rjm", "name": "https://www.oscs1024.com/hd/MPS-70qc-3rjm"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-78267", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-78267"}, {"url": "https://patchstack.com/database/wordpress/plugin/translatepress-multilingual/vulnerability/wordpress-translatepress-plugin-3-3-2-privilege-escalation-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "TranslatePress未授权提权漏洞", "_translated": true, "_saved_at": "2026-08-25T00:55:34+00:00", "_first_saved_at": "2026-08-24T23:17:19+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-70qc-3rjm"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-78568", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-89", "description": "Total Donations 是 KlbTheme 面向 WordPress 的捐赠管理插件，用于在站点中接收与管理捐赠。\n受影响版本中，插件对用户提供的参数未做充分转义，也未对既有 SQL 查询使用充分预处理，未认证攻击者可将额外 SQL 语句拼接到已有查询中，从数据库提取敏感信息。\n修复版本中通过公开渠道尚未提供可验证的补丁与源码改动，官方仅确认包含 2.0.5 在内的版本受影响。在厂商发布经确认的修复版本前，应停用该插件或部署可阻断未认证 SQL 注入的防护规则。", "effects": [{"comp_name": "totaldonations", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.0.5]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-08-25", "level": "Critical", "mps_id": "MPS-ate1-uwgz", "poc": false, "poc_url": [], "published_time": "2026-08-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ate1-uwgz", "name": "https://www.oscs1024.com/hd/MPS-ate1-uwgz"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-78568", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-78568"}, {"url": "https://patchstack.com/database/wordpress/plugin/totaldonations/vulnerability/wordpress-total-donations-plugin-2-0-5-sql-injection-vulnerability", "name": ""}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/0c3ecf70-544f-49c1-a943-86df89685b58?source=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Total Donations SQL注入漏洞", "_translated": true, "_saved_at": "2026-08-25T10:24:59+00:00", "_first_saved_at": "2026-08-25T10:24:59+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ate1-uwgz"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过向受信任的数据序列化过程中添加恶意数据，从而在序列化和反序列化过程中执行恶意代码的攻击漏洞。这种漏洞通常存在于使用序列化 (serialization) 机制存储和传输数据的程序中。\n", "title": "什么是反序列化"}, {"content": "- 注入攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码注入到程序中，从而实现代码执行的目的。\n- 反射攻击：攻击者使用反射机制，在序列化过程中动态生成恶意数据，并将恶意代码注入到程序中，从而实现代码执行的目的。\n- 缓冲区溢出攻击：攻击者通过在序列化过程中向缓冲区输入恶意数据，导致缓冲区溢出，从而破坏程序的内存管理，实现代码执行的目的。\n- 格式字符串攻击：攻击者通过在序列化过程中输入恶意数据，导致程序使用错误的格式字符串，从而实现代码执行的目的。\n- 数据流攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码作为一个数据流传递给程序，从而实现代码执行的目的。\n", "title": "反序列化常见的攻击方式"}, {"content": "- 不信任输入数据：程序应该严格检查输入数据的有效性，并避免使用不受信任的数据。\n- 使用安全的序列化机制：程序应该使用安全的序列化机制，如 JSON 或 XML 序列化，而不是第三方序列化库。\n- 最小特权原则：程序应该限制对受信任数据的处理权限，并避免在运行时修改数据。\n- 代码审查和漏洞扫描：程序应该进行代码审查和漏洞扫描，以发现和修复潜在的安全漏洞。\n", "title": "如何预防反序列化"}], "cnvd_id": "", "cve_id": "CVE-2026-78265", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-502", "description": "The Events Calendar 是开源 WordPress 插件，用于在站点上创建、展示和管理活动日历。\n受影响版本中，Tribe\\Events\\Views\\V2\\Widgets\\Service_Provider 在处理遗留小组件复制粘贴时，将请求或区块中的 instance.encoded 做 Base64 解码后直接调用 wp_hash() 覆盖原哈希，绕过 WordPress 对小组件实例的完整性校验，使未认证攻击者可将任意 PHP 序列化对象送入后续 unserialize 流程。在存在 POP 链时，可导致远程代码执行、任意文件操作或拒绝服务。\n修复版本中通过在重写哈希前增加 is_safe_widget_instance() 校验，使用 allowed_classes =\u003e false 解析实例并拒绝包含对象的数据，切断恶意对象进入反序列化利用链。", "effects": [{"comp_name": "the-events-calendar", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,6.17.3)", "min_fixed_version": "6.17.3", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "反序列化", "kind_en": "不可信数据的反序列化", "last_modified_time": "2026-08-25", "level": "Critical", "mps_id": "MPS-bxlr-md18", "poc": false, "poc_url": [], "published_time": "2026-08-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-bxlr-md18", "name": "https://www.oscs1024.com/hd/MPS-bxlr-md18"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-78265", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-78265"}, {"url": "https://patchstack.com/database/wordpress/plugin/the-events-calendar/vulnerability/wordpress-the-events-calendar-plugin-6-17-2-php-object-injection-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "The Events Calendar对象注入", "_translated": true, "_saved_at": "2026-08-25T00:55:38+00:00", "_first_saved_at": "2026-08-24T23:17:20+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-bxlr-md18"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "cnvd_id": "", "cve_id": "CVE-2026-78570", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-269", "description": "Total Donations 是 KlbTheme 出品的 WordPress 捐赠插件，并非已确认的 GitHub 开源项目，用于在站点上接收捐赠并管理筹款活动。\n受影响版本中，插件权限管理存在缺陷，未认证攻击者可远程将自身权限提升为管理员，进而完全控制 WordPress 站点。\n修复版本中通过收紧权限分配与校验切断未认证提权路径；公开资料显示官方尚未发布可用修复版本，当前需停用该插件作为缓解措施。", "effects": [{"comp_name": "total_donations", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.0.5]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-08-25", "level": "Critical", "mps_id": "MPS-or37-9y85", "poc": false, "poc_url": [], "published_time": "2026-08-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-or37-9y85", "name": "https://www.oscs1024.com/hd/MPS-or37-9y85"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-78570", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-78570"}, {"url": "https://patchstack.com/database/wordpress/plugin/totaldonations/vulnerability/wordpress-total-donations-plugin-2-0-5-privilege-escalation-vulnerability", "name": ""}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/fa910b80-a496-449c-8227-de7defa1f2ae?source=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "Total Donations权限提升漏洞", "_translated": true, "_saved_at": "2026-08-25T11:21:28+00:00", "_first_saved_at": "2026-08-25T11:21:28+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-or37-9y85"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-19685", "cvss": {"cvssv31": [{"source": "134c704f-9b21-4f2e-91b3-4a467353bcc0", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-863", "description": "NetworkManager 是开源 Linux 网络配置守护进程，用于管理有线、无线与 VPN 等连接，并通过 D-Bus 与 nmcli 对外提供配置接口。\n受影响版本中，CVE-2025-9615 的修复只对私有连接里的文件型证书、密钥和 pac-file 施加了 private_user 限制，没有覆盖 802-1x.ca-path 与 phase2-ca-path 这两个目录型属性。无特权本地用户可在持有 settings.modify.own 的活动会话中，将私有 WPA-Enterprise（802.1X）连接配置的 CA 目录指向其控制的路径。nm_supplicant_config_add_setting_8021x 会把该目录原样交给 wpa_supplicant，在未同时设置 ca-cert 时由该目录单独完成服务端校验，从而绕过证书验证并可通过伪造接入点窃取凭证。\n修复版本中通过在 nm_supplicant_config_add_setting_8021x 对 private_user 连接拒绝用户提供的 ca-path 与 phase2-ca-path（802-1x.system-ca-certs 覆盖为系统 CA 目录时除外），使连接激活失败，阻止用户自选 CA 信任库进入 supplicant。该改动已写入上游 NetworkManager-1.60 开发说明，截至分析时尚未进入已发布的稳定版本。", "effects": [{"comp_name": "NetworkManager", "ecosystem": "linux", "versions": [{"affected_version": "[1.58.0,1.58.1]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-08-25", "level": "Critical", "mps_id": "MPS-qgjn-ozi8", "poc": false, "poc_url": [], "published_time": "2026-08-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-qgjn-ozi8", "name": "https://www.oscs1024.com/hd/MPS-q 3", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,3.0.0.3327]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "极高", "fix_suggestion": "建议修复", "kind": "栈缓冲区溢出", "kind_en": "基于堆栈的缓冲区溢出", "last_modified_time": "2026-08-25", "level": "Critical", "mps_id": "MPS-tohi-mxb9", "poc": true, "poc_url": [], "published_time": "2026-08-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-tohi-mxb9", "name": "https://www.oscs1024.com/hd/MPS-tohi-mxb9"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-76071", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-76071"}, {"url": "https://github.com/ozcanpng/CVE-2026-76071", "name": ""}, {"url": "https://ozcanpng.dev/blog/cve-2026-76071-netis-nc63-ipfilter-stack-buffer-overflow/", "name": ""}, {"url": "https://www.netis-systems.com/products/NC63.html", "name": ""}, {"url": "https://www.vulncheck.com/advisories/netis-nc63-stack-buffer-overflow-via-desthost-parameter", "name": ""}], "scope_influence": "", "tags": ["poc", "应用软件"], "title": "Netis NC63栈溢出漏洞", "_translated": true, "_saved_at": "2026-08-24T17:25:32+00:00", "_first_saved_at": "2026-08-24T17:25:32+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-tohi-mxb9"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-77635", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:H/VA:L/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.2}]}, "cvss_score": 9.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:H/VA:L/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-89", "description": "CakePHP 是开源 PHP 快速开发框架，通过 Composer 以 cakephp/cakephp 与 cakephp/database 分发，用于构建 Web 应用并提供 ORM 与 SQL 表达式生成能力。\n受影响版本中，FunctionsBuilder::jsonValue() 会把调用方提供的 jsonPath 编入 JSON_VALUE 表达式；Postgres 驱动在 _transformFunctionExpression() 中将其改写为 JSONB_PATH_QUERY，并用 quoteIdentifier() 把 jsonPath 直接拼进形如 '%s'::jsonpath 的 SQL 片段。quoteIdentifier() 只按标识符规则加引号，无法按 SQL 字符串规则转义单引号，攻击者可向 jsonPath 传入 x')) \u003e '0' OR (SELECT 1) -- 这类载荷打断 SQL 结构并执行额外语句。\n修复版本中通过停止将 jsonPath 内联拼接进 SQL，仅对 JSON 字段参数追加 ::jsonb 转换，并将 jsonPath 作为绑定参数交给 JSONB_PATH_QUERY，使恶意路径无法再脱离参数绑定进入 SQL 语句。", "effects": [{"comp_name": "cakephp/cakephp", "ecosystem": "composer", "versions": [{"affected_version": "[5.2.0,5.2.15)", "min_fixed_version": "5.2.15", "repository": "composer", "solutions": [], "upstream": true}, {"affected_version": "[5.1.0,5.1.10)", "min_fixed_version": "5.1.10", "repository": "composer", "solutions": [], "upstream": true}, {"affected_version": "[5.3.0,5.3.7)", "min_fixed_version": "5.3.7", "repository": "composer", "solutions": [], "upstream": true}]}, {"comp_name": "cakephp/database", "ecosystem": "composer", "versions": [{"affected_version": "[5.2.0,5.2.15)", "min_fixed_version": "5.2.15", "repository": "composer", "solutions": [], "upstream": true}, {"affected_ver "content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-76197", "cvss": {"cvssv31": [{"source": "psirt@adobe.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 10}]}, "cvss_score": 10, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H", "cwe": "CWE-78", "description": "Adobe Campaign Classic (ACC) 受到操作系统命令中使用的特殊元素不当中和（“操作系统命令注入”）漏洞的影响，该漏洞可能导致在当前用户的上下文中执行任意代码。攻击者可以利用此漏洞执行任意代码。利用此问题不需要用户交互。范围已更改。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-08-26", "level": "Critical", "mps_id": "MPS-1g8r-bjtm", "poc": false, "poc_url": [], "published_time": "2026-08-26", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-1g8r-bjtm", "name": "https://www.oscs1024.com/hd/MPS-1g8r-bjtm"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-76197", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-76197"}, {"url": "https://helpx-internal.corp.adobe.com/content/help/en/security/products/campaign/apsb26-134.html", "name": "" CVE-2026-19632", "cvss": {}, "cvss_score": 9.8, "cvss_vector": "", "cwe": "CWE-640", "description": "TranslatePress 是 Cozmoslabs 发布的开源 WordPress 多语言翻译插件，插件目录标识为 translatepress-multilingual，用于在站点前端可视化翻译页面内容。\n受影响版本中，插件通过 TRP_Translation_Render::wp_mail_filter() 将发出的邮件纳入翻译流程；在自动保存字符串默认开启、且管理员资料语言为已发布次要语言时，密码重置邮件中的完整重置 URL（含明文 reset key）会被写入次要语言词典表。同时 wp_ajax_nopriv_trp_get_translations_regular 将 TRP_Editor_Api_Regular_Strings::get_translations() 暴露给未认证访问者，攻击者可提交 string_ids 枚举词典行并读出该重置链接，从而重置管理员密码并接管站点。\n修复版本中通过取消未认证挂钩 wp_ajax_nopriv_trp_get_translations_regular，使 get_translations() 仅对具备翻译权限的已登录用户开放，并为前端动态翻译新增仅按原文查找、不按 id 回表且不返回词典行 id 的 get_translations_domchanges() 接口，切断未认证用户读取密码重置链接的路径。", "effects": [{"comp_name": "translatepress-multilingual", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,3.3.2)", "min_fixed_version": "3.3.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "忘记口令恢复机制弱", "kind_en": "忘记密码的弱密码恢复机制", "last_modified_time": "2026-08-26", "level": "Critical", "mps_id": "MPS-451a-13f6", "poc": false, "poc_url": [], "published_time": "2026-08-26", "reference_url_list": [{"url": "https://securityonline.info/translatepress-account-takeover-vulnerability/", "name": ""}, {"url": "https://www.wordfence.com/blog/2026/08/400000-wordpress-sites-affected-by-account-takeover-vulnerability-in-translatepress-wordpress-plugin/", "name": ""}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/wordpress-plugins/translatepress-multilingual/translatepress-multilingual-331-unauthenticated-account-takeover-via-password-reset-link-disclosure", "name": ""}, {"url": "https://wordpress.org/plugins/translatepress-multilingual/", "name": ""}, {"url": "https://plugins.svn.wordpress.org/translatepress-multilingual/tags/3.3.2/readme.txt", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "TranslatePress账户接管漏洞", "_translated": true, "_saved_at": "2026-08-26T04:33:58+00:00", "_first_saved_at": "2026-08-26T03:48:42+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-451a-13f6"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-45018", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-78", "description": "Chainlit 是开源 Python 框架，用于构建生产级对话式 AI 应用，并支持通过 MCP 将外部工具接入对话流程。\n受影响版本中，当 features.mcp.enabled 为 true 时，未认证客户端可向 POST /mcp 提交 stdio 类型请求。connect_mcp 将请求体中的 fullCommand 交给 validate_mcp_command()，该函数仅按 config.features.mcp.stdio.allowed_executables 校验可执行文件名，未限制后续参数，再把未检查的参数传入 StdioServerParameters 并拉起子进程。攻击者可使用 npx -y -c 在允许名单校验通过后执行任意系统命令；allowed_executables 为 None 时还会放行任意可执行文件。\n修复版本中通过从客户端请求移除 fullCommand，改为由开发者在 .chainlit/config.toml 的 [[features.mcp.servers]] 中声明 stdio 命令，客户端只能按名称连接，使命令字符串不再跨越客户端到服务端的信任边界。", "effects": [{"comp_name": "chainlit", "ecosystem": "pip", "versions": [{"affected_version": "[2.4.0rc0,2.12.0)", "min_fixed_version": "2.12.0", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-08-26", "level": "Critical", "mps_id": "MPS-6y71-izfk", "poc": false, "poc_url": [], "published_time": "2026-08-26", "reference_url_list": [{"url": "https://github.com/Chainlit/chainlit/security/advisories/GHSA-w3fx-mc44-mf6j", "name": ""}, {"url": "https://github.com/Chainlit/chainlit/commit/0565fd0eccb915fce159929598b053ed79f6e0c9", "name": ""}, {"url": "https://github.com/Chainlit/chainlit/releases/tag/2.12.0", "name": ""}, {"url": "https://github.com/advisories/GHSA-w3fx-mc44-mf6j", "name": ""}], "scope_influence": "", "tags": ["AI", "python", "开源"], "title": "Chainlit命令注入漏洞", "_translated": true, "_saved_at": "2026-08-25T21:21:05+00:00", "_first_saved_at": "2026-08-25T21:21:05+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-6y71-izfk"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-79911", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:N/AC:L/Au:N/C:C/I:C/A:C", "severity": "high", "base_score": 10}], "cvssv31": [{"source": "cna@vuldb.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 10}], "cvssv4": [{"source": "cna@vuldb.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-121", "description": "TOTOLINK N600R 是商业无线路由器产品 d_time": "2026-08-26", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-fn57-etpz", "name": "https://www.oscs1024.com/hd/MPS-fn57-etpz"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-79782", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-79782"}, {"url": "https://github.com/rclone/rclone/security/advisories/GHSA-gx4c-2hqx-cw2r", "name": ""}, {"url": "https://www.vulncheck.com/advisories/rclone-before-security-token-disclosure-via-https-to-http-redirect", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-79782漏洞", "_translated": true, "_saved_at": "2026-08-25T17:25:43+00:00", "_first_saved_at": "2026-08-25T17:25:43+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-fn57-etpz"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2026-79787", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-287", "description": "Alluxio 是开源数据编排平台与分布式虚拟文件系统，提供 S3 兼容 REST 代理，供对象存储客户端访问集群中的文件数据。\n受影响版本中，S3 REST 代理默认将 alluxio.s3.rest.authentication.enabled 设为 false，S3RestUtils.getUser 因此调用 getUserFromAuthorization，仅从 Authorization 头的 Credential 字段解析用户名，不对 AWS Signature Version 4 做密码学校验。未认证攻击者向默认端口 39999 的 /api/v1/s3/ 提交伪造 Credential 后，S3RequestServlet.service 与 S3Handler.doAuthentication（JAX-RS 路径则为 S3AuthenticationFilter.filter）会接受该身份，createFileSystemForUser 以被冒充用户（含 alluxio 服务账号）创建文件系统客户端，从而读取、写入和删除其数据。默认 alluxio.security.authentication.type 为 SIMPLE，Master 信任客户端自称身份。\n修复版本中通过在身份解析路径强制校验 AWS Signature Version 4 并拒绝未验证的 Credential 声明来切断冒充链路；公开仓库截至分析时尚未合入该修复，v2.9.5、v2.9.6 与 main 的 S3RestUtils.getUser 实现一致。", "effects": [{"comp_name": "alluxio", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.9.6]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "org.alluxio:alluxio-core-server-proxy", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,2.9.6]", "min_fixed_version": "", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "身份验证不当", "kind_en": "认证不当", "last_modified_time": "2026-08-26", "level": "Critical", "mps_id": "MPS-i9lm-gh0u", "poc": false, "poc_url": [], "published_time": "2026-08-26", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-i9lm-gh0u", "name": "https://www.oscs1024.com/hd/MPS-i9lm-gh0u"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-79787", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-79787"}, {"url": "https://github.com/Alluxio/alluxio", "name": ""}, {"url": "https://github.com/Alluxio/alluxio/blob/v2.9.5/core/server/proxy/src/main/java/alluxio/proxy/s3/S3RestUtils.java", "name": ""}, {"url": "https://github.com/Alluxio/alluxio/issues/18755", "name": ""}, {"url": "https://www.vulncheck.com/advisories/alluxio-through-2.9.5-s3-rest-proxy-authentication-bypass-via-unverified-request-signature", "name": ""}, {"url": "https://github.com/Alluxio/alluxio/issues/18755", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "Alluxio S3认证绕过", "_translated": true, "_saved_at": "2026-08-25T20:21:31+00:00", "_first_saved_at": "2026-08-25T20:21:31+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-i9lm-gh0u"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-80138", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV: -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "", "kind_en": "", "last_modified_time": "2026-08-26", "level": "Critical", "mps_id": "MPS-uc5f-96gp", "poc": false, "poc_url": [], "published_time": "2026-08-26", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-uc5f-96gp", "name": "https://www.oscs1024.com/hd/MPS-uc5f-96gp"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-78379", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-78379"}, {"url": "https://aws.amazon.com/security/security-bulletins/2026-089-aws/", "name": ""}, {"url": "https://pypi.org/project/strands-agents-tools/0.8.5/", "name": ""}], "scope_influence": "", "tags": ["AI", "python", "开源"], "title": "Strands Tools同意绕过", "_translated": true, "_saved_at": "2026-08-25T20:21:28+00:00", "_first_saved_at": "2026-08-25T20:21:28+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-uc5f-96gp"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-59682", "cvss": {}, "cvss_score": 9.1, "cvss_vector": "", "cwe": "CWE-22", "description": "OpenRGB 是开源跨平台 RGB 灯效控制套件，提供图形界面、客户端以及默认监听 0.0.0.0:6742 且无认证的 SDK 网络服务。\n受影响版本中，NetworkServer::ListenThreadFunction 处理 NET_PACKET_ID_REQUEST_SAVE_PROFILE 时使用 profile_name.assign(data, header.pkt_size) 保留嵌入空字节，ProfileManager::SaveProfile 未校验路径中的斜杠、上级目录与空字节，只追加 .orp 或 .ors 扩展名并以 trunc 方式写入，未认证客户端可覆盖任意文件。\n修复版本中通过 StringUtils::make_filename 剔除斜杠、特殊字符和控制字符，将 SAVE_PROFILE 路径限制在配置目录内，阻断任意文件覆盖。", "effects": [{"comp_name": "openrgb", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.0rc3.1)", "min_fixed_version": "1.0rc3.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-08-26", "level": "Critical", "mps_id": "MPS-666c-0bfd", "poc": false, "poc_url": [], "published_time": "2026-08-26", "reference_url_list": [{"url": "https://www.openwall.com/lists/oss-security/2026/08/25/4", "name": ""}, {"url": "https://security.opensuse.org/2026/08/25/openrgb-remote-vulnerabilities.html", "name": ""}, {"url": "https://github.com/CalcProgrammer1/OpenRGB/commit/d2dd9dcc7369e78f47d01ace19af3750cd89ae66", "name": ""}, {"url": "https://gitlab.com/CalcProgrammer1/OpenRGB/-/commit/d2dd9dcc7369e78f47d01ace19af3750cd89ae66", "name": ""}, {"url": "https://gitlab.com/CalcProgrammer1/OpenRGB/-/releases/release_candidate_1.0rc3.1", "name": ""}, {"url": "https://bugzilla.suse.com/show_bug.cgi?id=1269523", "name": ""}, {"url": "https://github.com/CalcProgrammer1/OpenRGB/commit/d7ed55b264dee40f68e7a17c11eaa8f1b56d8dc6", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "OpenRGB任意文件覆盖漏洞", "_translated": true, "_saved_at": "2026-08-25T17:25:41+00:00", "_first_saved_at": "2026-08-25T17:25:41+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-666c-0bfd"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2026-68569", "cvss": {}, "cvss_score": 9.1, "cvss_vector": "", "cwe": "CWE-287", "description": "Apache Tomcat 是 Apache 软件基金会的开源 Java Servlet 容器与 Web 服务器，通过 Realm 将外部身份映射为容器内 Principal 与角色；DataSourceRealm 从 JDBC 数据源读取用户，Tomcat 9 仍保留功能相近的 JDBCRealm。\n受影响版本中，DataSourceRealm.getPrincipal() 在数据库连接失败时仍返回仅含用户名的 GenericPrincipal；连接成功时也不校验用户是否存在于用户表，而是直接按 CLIENT-CERT 或 SPNEGO 给出的用户名创建 Principal。攻击者只要出示服务端信任的客户端证书或有效 SPNEGO 票据，即使该用户未在数据库登记，也会被标记为已认证。角色查询异常时仍可能返回部分填充的 Principal。Tomcat 9 的 JDBCRealm.getPrincipal() 同样在未确认用户存在时创建 Principal。\n修复版本中通过新增 validateUser() 并改写 getPrincipal()，在无法连接数据库、用户不存在或角色查询失败时返回 null 使认证失败；密码认证路径在角色查询失败时同样拒绝登录，切断失败开放链路。", "effects": [{"comp_name": "tomcat", "ecosystem": "linux", "versions": [{"affected_version": "[11.0.0-M1,11.0.25)", "min_fixed_version": "11.0.25", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[7.0.0,7.0.109]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[8.5.0,8.5.100]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[10.1.0-M1,10.1.58)", "min_fixed_version": "10.1.58", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[9.0.0.M1,9.0.121)", "min_fixed_version": "9.0.121", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "身份验证不当", "kind_en": "认证不当", "last_modified_time": "2026-08-26", "level": "Critical", "mps_id": "MPS-6bfa-b28f", "poc": false, "poc_url": [], "published_time": "2026-08-26", "reference_url_list": [{"url": "http://www.mail-archive.com/announce@apache.org/msg11782.html", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-68569", "name": ""}, {"url": "https://lists.apache.org/thread/8robqo76q0osxgw0b5lcwgz0hcf9h4zc", "name": ""}, {"url": "https://tomcat.apache.org/security-11.html", "name": ""}, {"url": "https://tomcat.apache.org/security-10.html", "name": ""}, {"url": "https://tomcat.apache.org/security-9.html", "name": ""}, {"url": "https://github.com/apache/tomcat/commit/790d6e2c3b4cd201a1fa556a23d5b7504dee18ad", "name": ""}, {"url": "https://github.com/apache/tomcat/commit/3ff06ceb984edc2a3c9e0161b01e833c5e50ed4f", "name": ""}, {"url": "https://github.com/apache/tomcat/commit/8efd51f061c026f6339bfa4fe4ef919a04ef130a", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Tomcat认证失败开放漏洞", "_translated": true, "_saved_at": "2026-08-25T23:19:37+00:00", "_first_saved_at": "2026-08-25T22:19:41+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-6bfa-b28f"}, {"analysis_status": 3, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-75604", "cvss": {"cvssv31": [{"source": "murphysec", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9}]}, "cvss_score": 9, "cvss_vector": "", "cwe": "CWE-22", "description": "Next.js 是 Vercel 维护的开源 React 全栈 Web 框架，npm 包名为 next，用于同时提供 Pages Router 与 App Router 的服务端渲染和增量静态再生。\n受影响版本中，Windows 文件系统上的 ISR 增量缓存把请求路径段直接拼进缓存文件路径。decodePathParams 先 decodeURIComponent 再调用 escapePathDelimiters(..., true)，而 escapePathDelimiters 只转义 /、#、? 以及仍保持百分号形式的 %5c，不会转义已经解码出来的反斜杠；FileSystemCache.getFilePath 随后对缓存键做 path.join，且不检查结果是否仍落在 pages 或 app 缓存根目录内。在同时存在 Pages Router 与 App Router、且未启用 Cache Components 的应用中，攻击者可通过含编码反斜杠的 catch-all 段访问 /_next/data/{buildId}/...json，使 get() 越界读取构建产物中的 server-reference-manifest.json（含 Server Actions encryptionKey）。官方将该问题认定为未授权远程代码执行；Linux 与 macOS 不受影响。\n修复版本中通过把反斜杠写入 escapePathDelimiters 的分隔符字符集，并在 getFilePath 中要求 path.join 结果必须以缓存根目录加 path.sep 为前缀，越界路径抛出 Invalid file path，切断该穿越读取。", "effects": [{"comp_name": "next", "ecosystem": "npm", "versions": [{"affected_version": "[13.4,15.5.24)", "min_fixed_version": "15.5.24", "repository": "npm", "solutions": [], "upstream": true}, {"affected_version": "[16.0,16.3.3)", "min_fixed_version": "16.3.3", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "低", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-08-26", "level": "Critical", "mps_id": "MPS-i3xe-wpbr", "poc": true, "poc_url": [], "published_time": "202 rl": "https://nvd.nist.gov/vuln/detail/CVE-2026-78168", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-78168"}, {"url": "https://github.com/AdminSafe/CVE/issues/10", "name": ""}, {"url": "https://vuldb.com/cve/CVE-2026-78168", "name": ""}, {"url": "https://vuldb.com/submit/883766", "name": ""}, {"url": "https://vuldb.com/vuln/394557", "name": ""}, {"url": "https://vuldb.com/vuln/394557/cti", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "ipTIME认证绕过漏洞", "_translated": true, "_saved_at": "2026-08-24T03:49:32+00:00", "_first_saved_at": "2026-08-24T03:49:32+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-t0nw-xq9j"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-78316", "cvss": {"cvssv31": [{"source": "759f5e80-c8e1-4224-bead-956d7b33c98b", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-89", "description": "Delta Electronics DIAEnergie 是台达电子推出的商业工业能源管理系统，用于工厂能耗监控、分析与能效优化，并非开源软件。\n受影响版本中，产品存在 SQL 注入漏洞，具备普通权限的远程攻击者可注入恶意 SQL 语句并导致远程代码执行。\n修复版本中通过官方安全更新切断 SQL 注入利用链，厂商要求联系技术支持获取并升级至 DIAEnergie v1.11.00.022 及以上版本。", "effects" cve_id": "CVE-2026-78317", "cvss": {"cvssv31": [{"source": "759f5e80-c8e1-4224-bead-956d7b33c98b", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-89", "description": "Delta Electronics DIAEnergie 是台达电子的工业能源管理系统，属于商业闭源软件，用于工厂能源监控、数据采集与能耗分析。\n受影响版本中，产品存在 SQL 注入漏洞。已通过身份验证的远程攻击者可将恶意 SQL 语句注入后端查询，读取或篡改数据库内容，并导致远程代码执行。\n修复版本中通过厂商安全更新消除该 SQL 注入路径，阻止不可信输入进入 SQL 命令执行流程；公开资料未披露更细粒度的源码修改。", "effects": [{"comp_name": "DIAEnergie", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.11.00.002]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-08-24", "level": "High", "mps_id": "MPS-83gp-h49q", "poc": false, "poc_url": [], "published_time": "2026-08-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-83gp-h49q", "name": "https://www.oscs1024.com/hd/MPS-83gp-h49q"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-78317", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-78317"}, {"url": "https://filecenter.deltaww.com/news/download/doc/Delta-PCSA-2026-00015_DIAEnergie%20SQL%20Injection%20Vulberabilities_v1.0.pdf", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "DIAEnergie SQL注入漏洞", "_translated": true, "_saved_at": "2026-08-24T11:21:22+00:00", "_first_saved_at": "2026-08-24T10:31:36+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-83gp-h49q"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-78391", "cvss": {"cvssv4": [{"source": "5a6e4751-2f3f-4070-9419-94fb35b644e8", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:L/VI:L/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:L/VI:L/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-79", "description": "RansomLook 是开源的勒索软件团伙与市场追踪工具，基于 Flask 提供 Web 界面，用于监控勒索团伙、受害者信息和加密货币钱包。\n受影响版本中，来自外部源（含公开众包 ransomwhe.re）的加密货币地址和区块链名称未经充分校验即被写入存储，并在钱包详情模板 cryptodetail.html 中直接嵌入 button 的 inline onclick 字符串。Jinja HTML 自动转义无法覆盖该 JavaScript 字符串上下文，浏览器会先将 \u0026#39; 等实体解码再作为脚本解析。含引号和 JavaScript 语法的钱包地址可逃逸原定字符串字面量，用户点击对应钱包的 CSV 导出按钮后将在 RansomLook 页面安全上下文中执行攻击者脚本。\n修复版本中通过 is_valid_crypto_address 与 is_valid_chain 在入库前将地址和链名限制为安全字符集，并把 inline onclick 替换为 data-chain、data-address 属性及 crypto.js 中的外部事件监听器，使钱包字段仅作为数据处理，阻断脚本注入。", "effects": [{"comp_name": "ransomlook", "ecosystem": "linux", "versions": [{"affected_version": "[0,2.0.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-08-24", "level": "High", "mps_id": "MPS-9768-iel2", "poc": false, "poc_url": [], "published_time": "2026-08-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-9768-iel2", "name": "https://www.oscs1024.com/hd/MPS-9768-iel2"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-78391", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-78391"}, {"url": "https://github.com/RansomLook/RansomLook/commit/7efb59253f23552538f9a11c9bf21e7bcfcc1319", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "RansomLook存储型XSS", "_translated": true, "_saved_at": "2026-08-24T16:29:35+00:00", "_first_saved_at": "2026-08-24T15:33:21+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-9768-iel2"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "cnvd_id": "", "cve_id": "CVE-2026-78376", "cvss": {"cvssv31": [{"source": "secalert@redhat.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "cwe": "CWE-416", "description": "A flaw was found in WebKitGTK. Processing malicious web content can cause a use-after-free issue due to improper memory handling and result in memory corruption.", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "UAF", "kind_en": "免费后使用", "last_modified_time": "2026-08-24", "level": "High", "mps_id": "MPS-krmv-g07z", "poc": false, "poc_url": [], "published_time": "2026-08-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-krmv-g07z", "name": "https://www.oscs1024.com/hd/MPS-krmv-g07z"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-78376", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-78376"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-78376", "name": ""}, {"url": "https://bugzilla.redhat.com/show_bug.cgi?id=2521858", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-78376漏洞", "_translated": true, "_saved_at": "2026-08-26T04:34:02+00:00", "_first_saved_at": "2026-08-24T14:36:02+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-krmv-g07z"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-78315", "cvss": {"cvssv31": [{"source": "759f5e80-c8e1-4224-bead-956d7b33c98b", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-89", "description": "台达电子 DIAEnergie 是面向工厂能源监控与能效管理的商业工业能源管理系统，用于采集、展示和分析用电与设备运行数据，不属于开源软件。\n受影响版本中，DIAEnergie 存在 SQL 注入漏洞。已通过身份验证的攻击者可向系统提交恶意 SQL 语句，并借此在目标主机上实现远程代码执行。\n修复版本中通过官方安全更新将产品升级至 DIAEnergie v1.11.00.022 及后续版本，切断恶意 SQL 进入数据库执行路径，消除由此导致的远程代码执行风险；公开资料未披露更细粒度的源码修改。", "effects": [{"comp_name": "diaenergie", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.11.00.022)", "min_fixed_version": "1.11.00.022", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-08-24", "level": "High", "mps_id": "MPS-qil9-4jbo", "poc": false, "poc_url": [], "published_time": "2026-08-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-qil9-4jbo", "name": "https://www.oscs1024.com/hd/MPS-qil9-4jbo"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-78315", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-78315"}, {"url": "https://filecenter.deltaww.com/news/download/doc/Delta-PCSA-2026-00015_DIAEnergie%20SQL%20Injection%20Vulberabilities_v1.0.p
