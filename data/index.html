静态代码分析工具和漏洞扫描工具来辅助检测和修复问题。\n- 实施防御性编程技术：应用程序应采用防御性编程技术，如使用随机化地址空间布局（ASLR）、堆栈保护机制（如堆栈溢出保护）和数据执行预防（DEP）等。\n- 及时更新和修补：及时应用程序和操作系统的安全更新和补丁，以确保已知的跨界内存读漏洞得到修复。及时更新相关软件和库，以避免使用已知存在漏洞的版本。", "title": "如何预防越界读取"}], "cnvd_id": "", "cve_id": "CVE-2026-90560", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:H", "severity": "high", "base_score": 8.2}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:L/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:L/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-125", "description": "zstd-jni 版本 1.2.0 到 1.5.7-13 在 ZstdDictDecompress 构造函数中包含越界读取漏洞，因为偏移量和长度参数从未针对字典数组边界进行验证。攻击者可以提供任意偏移量或长度值来读取超出所提供数组末尾的内存，从而可能导致 JVM 终止。", "effects": [{"comp_name": "zstd-jni", "ecosystem": "linux", "versions": [{"affected_version": "(1.2.0,1.5.7)", "min_fixed_version": "1.5.7", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界读取", "kind_en": "越界读取", "last_modified_time": "2026-09-13", "level": "High", "mps_id": "MPS-apio-98zj", "poc": false, "poc_url": [], "published_time": "2026-09-13", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-apio-98zj", "name": "https://www.oscs1024.com/hd/MPS-apio-98zj"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-90560", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-90560"}, {"url": "https://github.com/luben/zstd-jni/issues/405", "name": "GitHub Issue #405"}, {"url": "https://github.com/luben/zstd-jni", "name": ""}, {"url": "https://g requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "UNIX符号链接跟随", "kind_en": "UNIX 符号链接 (Symlink) 以下", "last_modified_time": "2026-09-13", "level": "High", "mps_id": "MPS-hj86-izu0", "poc": false, "poc_url": [], "published_time": "2026-09-13", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-hj86-izu0", "name": "https://www.oscs1024.com/hd/MPS-hj86-izu0"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-90616", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-90616"}, {"url": "https://github.com/flatpak/flatpak/security/advisories/GHSA-8688-9x26-hhxj", "name": ""}, {"url": "https://www.openwall.com/lists/oss-security/2026/08/11/9", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-90616 漏洞", "_translated": true, "_saved_at": "2026-09-13T00:32:36+00:00", "_first_saved_at": "2026-09-12T22:45:39+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-hj86-izu0"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-90648", "cvss": {"cvssv4": [{"source": "cve@mitre.org", "vector": "CVSS:4.0/AV:L/AC:L/AT:P/PR:N/UI:N/VC:N/VI:H/VA:H/SC:N/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:L/AC:L/AT:P/PR:N/UI:N/VC:N/VI:H/VA:H/SC:N/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-252", "description": "WebAssembly wabt 至 1.0.41 中的 wasm2c 允许在某些主要涉及 32 位平台的情况下进行沙箱逃逸，即“翻桌”攻击。它不会检查 wasm_rt_allocate_funcref_table() (wasm2c/wasm-rt-impl-tableops.inc) 中 calloc() 的返回值。当 funcref 表分配失败时，table-\u003edata 保留为 NULL，而 table-\u003esize 保留 guest 声明的元素计数；因此，边界检查仍然通过，并且表元素访问解析为绝对内存地址 (i * sizeof(wasm_rt_funcref_t))。这使得主机进程内存可以任意读写，并且通过 table.get、table.set 和 call_indirect 可以执行任意代码，从而破坏了 wasm2c 提供的隔离（完整的沙箱逃逸）。 wasm2c 被 RLBox 和 WasmBoxC 用作进程内沙箱边界，包括在 Firefox 中，它通过 wasm2c 编译 Graphite、Hunspell、Ogg、Expat 和 Woff2 库以包含不受信任的字体、媒体和 XML 输入。因此，这些应用程序中的沙箱可能会受到影响。利用该漏洞需要 funcref 表分配失败，例如在地址空间限制 (RLIMIT_AS) 下、在 32 位主机上、vm.overcommit_memory=2 或内存压力下。在默认过量使用的 64 位 Linux 上，分配成功并且不会触发缺陷。 wasm2c 内存分配器在同一运行时的 calloc 失败时中止；表分配器缺乏这种中止行为。这是在提交 ab9e0b55 (PR #813) 中引入的。", "effects": [{"comp_name": "wabt", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.0.41]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "未加检查的返回值", "kind_en": "Unchecked Return Value", "last_modified_time": "2026-09-13", "level": "High", "mps_id": "MPS-igw2-0oex", "poc": false, "poc_url": [], "published_time": "2026-09-13", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-igw2-0oex", "name": "https://www.oscs1024.com/hd/MPS-igw2-0oex"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-90648", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-90648"}, {"url": "https://github.com/trustsig-eu/wasm2c-tableflip", "name": ""}, {"url": "https://github.com/WebAssembly/wabt", "name": ""}, {"url": "https://bugzilla.mozilla.org/show_bug.cgi?id=1827704", "name": ""}, {"url": "https://https://blog.mozilla.org/attack-and-defense/2021/12/06/webassembly-and-back-again-fine-grained-sandboxing-in-firefox-95", "name": ""}, {"url": "https://rlbox.dev", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "CVE-2026-90648漏洞", "_translated": true, "_saved_at": "2026-09-13T00:32:33+00:00", "_first_saved_at": "2026-09-13T00:32:33+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-igw2-0oex"}]}</script>
  <script>
    const payload = JSON.parse(document.getElementById("payload").textContent);
    const levelLabels = payload.level_labels || {};
    const items = payload.items || [];
    let filtered = items.slice();
    let activeId = null;

    const $ = (id) => document.getElementById(id);
    $("generatedAt").textContent = payload.generated_at || "-";
    $("retention").textContent = payload.retention_days ?? "-";
    $("cutoff").textContent = payload.cutoff_date || "-";
    $("count").textContent = String(payload.count ?? items.length);

    function levelClass(level) {
      const cn = levelLabels[level] || level || "";
      if (level === "Critical" || cn === "严重") return "crit";
      if (level === "High" || cn === "高危") return "high";
      return "other";
    }
    function levelText(level) {
      return levelLabels[level] || level || "-";
    }
    function esc(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }
    function scoreText(v) {
      if (v === null || v === undefined || v === "" || v === -1) return "-";
      return String(v);
    }

    function renderList() {
      const list = $("list");
      $("listCount").textContent = String(filtered.length);
      if (!filtered.length) {
        list.innerHTML = '<div class="empty">没有匹配项</div>';
        return;
      }
      list.innerHTML = filtered.map((it) => {
        const id = it.mps_id || it.cve_id;
        const active = id === activeId ? " active" : "";
        return `
          <button class="item${active}" data-id="${esc(id)}" type="button">
            <div class="item-top">
              <span class="cve">${esc(it.cve_id || it.mps_id || "-")}</span>
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
            </div>
            <div class="title">${esc(it.title || "-")}</div>
            <div class="item-foot">
              <span>CVSS ${esc(scoreText(it.cvss_score))}</span>
              <span>${esc(it.published_time || "-")}</span>
              ${it.poc ? "<span>POC</span>" : ""}
            </div>
          </button>`;
      }).join("");
      list.querySelectorAll(".item").forEach((btn) => {
        btn.addEventListener("click", () => selectById(btn.dataset.id));
      });
    }

    function refsHtml(it) {
      const refs = Array.isArray(it.reference_url_list) ? it.reference_url_list : [];
      const links = [];
      if (it._source_page) links.push({ url: it._source_page, name: "OSCS 详情" });
      if (it.cve_id) links.push({ url: `https://nvd.nist.gov/vuln/detail/${it.cve_id}`, name: "NVD" });
      refs.forEach((r) => {
        if (r && r.url) links.push({ url: r.url, name: r.name || r.url });
      });
      const seen = new Set();
      const uniq = [];
      for (const l of links) {
        if (seen.has(l.url)) continue;
        seen.add(l.url);
        uniq.push(l);
      }
      if (!uniq.length) return '<div class="box">无参考链接</div>';
      return `<div class="refs">${uniq.map((l) =>
        `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name || l.url)}</a>`
      ).join("")}</div>`;
    }

    function articlesHtml(it) {
      const arts = Array.isArray(it.articles) ? it.articles : [];
      if (!arts.length) return "";
      return `<div class="section"><h3>相关说明</h3>${arts.map((a) => `
        <div class="article">
          <h4>${esc(a.title || "说明")}</h4>
          <p>${esc(a.content || "")}</p>
        </div>`).join("")}</div>`;
    }

    function renderDetail(it) {
      const detail = $("detail");
      if (!it) {
        detail.innerHTML = '<div class="empty">暂无数据</div>';
        return;
      }
      const pocUrls = Array.isArray(it.poc_url) ? it.poc_url : [];
      detail.innerHTML = `
        <div class="d-head">
          <div>
            <h1 class="d-title">${esc(it.title || "-")}</h1>
            <div class="ids">
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
              <span class="chip">${esc(it.cve_id || "无 CVE")}</span>
              <span class="chip">${esc(it.mps_id || "-")}</span>
              ${it.poc ? '<span class="chip">有 POC</span>' : ""}
              ${it.exp ? '<span class="chip">有 EXP</span>' : ""}
            </div>
          </div>
          <div class="actions">
            ${it._source_page ? `<a class="btn" href="${esc(it._source_page)}" target="_blank" rel="noopener">OSCS</a>` : ""}
            ${it.cve_id ? `<a class="btn" href="https://nvd.nist.gov/vuln/detail/${esc(it.cve_id)}" target="_blank" rel="noopener">NVD</a>` : ""}
          </div>
        </div>
        <div class="grid">
          <div class="stat"><div class="k">CVSS</div><div class="v">${esc(scoreText(it.cvss_score))}</div></div>
          <div class="stat"><div class="k">向量</div><div class="v">${esc(it.cvss_vector || "-")}</div></div>
          <div class="stat"><div class="k">CWE</div><div class="v">${esc(it.cwe || "-")}</div></div>
          <div class="stat"><div class="k">类型</div><div class="v">${esc(it.kind || it.kind_en || "-")}</div></div>
          <div class="stat"><div class="k">公开</div><div class="v">${esc(it.published_time || "-")}</div></div>
          <div class="stat"><div class="k">利用成本</div><div class="v">${esc(it.exploit_requirement_cost || "-")}</div></div>
          <div class="stat"><div class="k">可利用性</div><div class="v">${esc(it.exploitability || "-")}</div></div>
          <div class="stat"><div class="k">修复建议</div><div class="v">${esc(it.fix_suggestion || "-")}</div></div>
        </div>
        <div class="section"><h3>描述</h3><div class="box">${esc(it.description || "无描述")}</div></div>
        ${it.scope_influence ? `<div class="section"><h3>影响范围</h3><div class="box">${esc(it.scope_influence)}</div></div>` : ""}
        ${pocUrls.length ? `<div class="section"><h3>POC 链接</h3><div class="refs">${pocUrls.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join("")}</div></div>` : ""}
        <div class="section"><h3>参考链接</h3>${refsHtml(it)}</div>
        ${articlesHtml(it)}
      `;
    }

    function selectById(id) {
      const it = filtered.find((x) => (x.mps_id || x.cve_id) === id) ||
                 items.find((x) => (x.mps_id || x.cve_id) === id);
      if (!it) return;
      activeId = it.mps_id || it.cve_id;
      renderList();
      renderDetail(it);
      const btn = document.querySelector(`.item[data-id="${CSS.escape(activeId)}"]`);
      if (btn) btn.scrollIntoView({ block: "nearest" });
      history.replaceState(null, "", "#" + encodeURIComponent(activeId));
    }

    function applyFilter(q) {
      const query = (q || "").trim().toLowerCase();
      filtered = !query ? items.slice() : items.filter((it) => {
        const blob = [
          it.cve_id, it.mps_id, it.title, it.kind, it.kind_en, it.cwe, it.description, it.level
        ].map((x) => String(x || "").toLowerCase()).join(" ");
        return blob.includes(query);
      });
      renderList();
      if (filtered.length) {
        const still = filtered.some((x) => (x.mps_id || x.cve_id) === activeId);
        selectById(still ? activeId : (filtered[0].mps_id || filtered[0].cve_id));
      } else {
        activeId = null;
        renderDetail(null);
      }
    }

    $("search").addEventListener("input", (e) => applyFilter(e.target.value));

    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement !== $("search")) {
        e.preventDefault();
        $("search").focus();
        return;
      }
      if (!filtered.length) return;
      const idx = filtered.findIndex((x) => (x.mps_id || x.cve_id) === activeId);
      if (e.key === "ArrowDown") {
        e.preventDefault();
        const next = filtered[Math.min(filtered.length - 1, Math.max(0, idx) + 1)];
        selectById(next.mps_id || next.cve_id);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        const prev = filtered[Math.max(0, idx - 1)];
        selectById(prev.mps_id || prev.cve_id);
      }
    });

    const hashId = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    if (hashId && items.some((x) => (x.mps_id || x.cve_id) === hashId)) {
      activeId = hashId;
      renderList();
      selectById(hashId);
    } else if (items.length) {
      selectById(items[0].mps_id || items[0].cve_id);
    } else {
      renderList();
      renderDetail(null);
    }
  </script>
</body>
</html>
