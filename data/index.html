    header.hero {

      font-size: 0.78rem;
      color: var(--muted);

      gap: 16px;
      min-height: 70vh;
    }

    .panel {

      border-radius: var(--radius);

      min-height: 520px;

      color: var(--text);
      font: inherit;
      outline: none;

      display: flex;
      flex-direction: column;
      gap: 6px;

      border-radius: 12px;
      padding: 12px;
      background: transparent;
      color: inherit;

      margin-bottom: 14px;

      border: 1px solid var(--line);

部，实现对程序操作的恶意操作。例如，攻击者可以通过向游戏应用程序的输入框中输入过多的道具名称，从而覆盖程序中的重要数据，例如游戏数据、账号密码等。 |\n| 堆溢出攻击       | 攻击者通过向程序的堆中输入过多的数据，从而溢出到堆外部，实现对程序操作的恶意操作。例如，攻击者可以通过向操作系统工具的输入框中输入过多的命令，从而覆盖程序中的重要数据，例如系统文件、配置文件等。 |", "title": "经典缓冲区溢出常见的攻击方式"}, {"content": "- 输入验证：在程序输入处对输入数据进行严格的验证和过滤，确保输入数据符合预期的格式和类型，避免被攻击者注入恶意命令或数据。可以使用正则表达式、格式字符串等方式进行输入验证。\n- 输出过滤：在程序输出处对输出数据进行严格的过滤和检查，确保输出数据符合预期的格式和类型，避免被攻击者截获和篡改。可以使用安全的输出过滤库等方式进行输出过滤。\n- 使用安全的编程模型：使用安全的编程模型，例如避免使用原生的缓冲区管理函数，使用安全的框架和库来处理输入数据和执行命令，避免缓冲区溢出漏洞。\n- 数据库加密和访问控制：对于敏感数据和命令，使用加密和访问控制措施，确保只有授权用户可以访问和执行命令，避免被攻击者窃取和篡改。\n- 定期更新和升级：定期更新和升级应用程序和库的版本，确保应用程序和库的最新版本包含了最新的安全补丁和修复措施，避免安全漏洞的出现和利用。\n- 安全审计和监控：定期对系统和应用程序进行安全审计和监控，及时发现和阻止潜在的安全漏洞和攻击，确保系统和数据的安全和可靠性。", "title": "如何预防经典缓冲区溢出"}], "cnvd_id": "", "cve_id": "CVE-2026-6730", "cvss": {"cvssv31": [{"source": "psirt@us.ibm.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-120", "description": "IBM Concert 1.0.0 到 3.0.0 容易受到由不正确的边界检查引起的缓冲区溢出的影响。本地用户可以溢出缓冲区并在系统上执行任意代码。", "effects": [{"comp_name": "Concert", "ecosystem": "linux", "versions": [{"affected_version": "(1.0.0,3.0.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "经典缓冲区溢出", "kind_en": "不检查输入大小的缓冲区复制（“经典缓冲区溢出”）", "last_modified_time": "2026-09-24", "level": "Critical", "mps_id": "MPS-oulk-fryv", "poc": false, "poc_url": [], "published_time": "2026-09-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-oulk-fryv", "name": "https://www.oscs1024.com/hd/MPS-oulk-fryv"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-6730", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-6730"}, {"url": "https://www.ibm.com/support/pages/node/7288830", "name": ""}], "scope_influence": "", "tags": ["应用软件", " 2026-12227"}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/486c1c7c-5a66-42d3-85b0-13ce52a16ed1?source=cve", "name": ""}, {"url": "https://plugins.trac.wordpress.org/changeset/3619572/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Visual Composer 本地文件包含漏洞", "_translated": true, "_saved_at": "2026-09-24T10:56:51+00:00", "_first_saved_at": "2026-09-24T10:56:51+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-v921-80gu"}, {"analysis_status": 0, "articles": [{"content": "应用程序在处理用户输入时的不完善或缺乏验证机制，所以攻击者能够通过向应用程序发送恶意输入，利用应用程序对输入数据的错误处理方式来注入自己的恶意代码。这些恶意代码会被应用程序误认为是合法的指令或数据，并在执行过程中被执行。", "title": "什么是代码注入"}, {"content": "应用程序使用可执行动态代码的函数来执行用户可控的参数，当应用程序对于用户输入过滤不完全时，攻击者可以注入恶意代码并控制代码执行流程。", "title": "代码注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对所有用户输入进行验证和过滤，确保只接受预期的有效输入。这包括对输入数据进行输入长度验证、类型检查和格式验证等。\r\n- 使用参数化查询或预编译语句：对于数据库查询操作，应该使用参数化查询或预编译语句，确保输入数据不会被误认为是执行代码。\r\n- 最小特权原则：应用程序在执行操作系统命令或动态代码时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。\r\n- 安全编码实践：开发人员应该采用安全编码实践，包括避免使用eval函数、避免拼接用户输入的字符串作为代码执行等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止代码注入攻击。", "title": "如何预防代码注入"}], "cnvd_id": "", "cve_id": "CVE-2026-96757", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-94", "description": "orval 是开源的 OpenAPI/Swagger 客户端代码生成器（npm 包），可从 OpenAPI 规格生成 fetch、axios、react-query、angular 等 TypeScript 客户端代码与 MSW mock 数据。\n受影响版本中，生成器把 requestBody default 值时，先用 stringify 生成按单引号转义的字符串字面量，再通过 replaceAll(\"'\", '`') 将定界符替换为反引号且未对内容重新转义，字符串字面量被升级为模板字面量，${...} 插值重新生效；攻击者在可控制的 OpenAPI 文档 default 值中植入 ${...} 表达式后，表达式被原样拼接到生成模块顶层的 export const 中，生成的代码在被构建或 import 时立即于模块作用域执行，导致开发者或 CI 环境任意代码执行。\n修复版本中通过保留 stringify 实际转义所用的单引号定界符、移除引号替换逻辑，使 default 值无法再升级为模板字面量；新增 assertSafeNumericConstraint 校验 minimum、maximum、multipleOf 等数值约束必须为有限数字，否则终止生成，并规范 OpenAPI 3.0 布尔型 exclusiveMinimum/exclusiveMaximum 的归一化处理，切断了注入链路。", "effects": [{"comp_name": "@orval/effect", "ecosystem": "npm", "versions": [{"affected_version": "[8.14.0,8.29.0)", "min_fixed_version": "8.29.0", "repository": "npm", "solutions": [], "upstream": true}]}, {"comp_name": "orval", "ecosystem": "npm", "versions": [{"affected_version": "[8.14.0,8.29.0)", "min_fixed_version": "8.29.0", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "代码注入", "kind_en": "代码生成控制不当（“代码注入”）", "last_modified_time": "2026-09-24", "level": "Critical", "mps_id": "MPS-nkur-iqmd", "poc": false, "poc_url": [], "published_time": "2026-09-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-nkur-iqmd", "name": "https://www.oscs1024.com/hd/MPS-nkur-iqmd"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-96755", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-96755"}, {"url": "https://github.com/orval-labs/orval/security/advisories/GHSA-q7f2-jg6j-r867", "name": "GitHub Security Advisory (GHSA-q7f2-jg6j-r867)"}, {"url": "https://github.com/orval-labs/orval/pull/3995", "name": ""}, {"url": "https://github.com/orval-labs/orval/commit/d346d94a660e50a2f8d0f7c17fee2c4c69d8dc23", "name": ""}, {"url": "https://github.com/orval-labs/orval/blob/v8.28.1/packages/effect/src/index.ts#L298-L302", "name": ""}, {"url": "https://github.com/orval-labs/orval", "name": ""}, {"url": "https://www.vulncheck.com/advisories/orval-orval-effect-8.14.0-through-8.28.1-code-injection", "name": "VulnCheck Advisory: orval @orval/effect 8.14.0 through 8.28.1 Code Injection"}], "scope_influence": "", "tags": ["npm", "开源"], "title": "orval 代码注入漏洞", "_translated": true, "_saved_at": "2026-09-23T18:09:20+00:00", "_first_saved_at": "2026-09-23T18:09:20+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-nkur-iqmd"}, {"analysis_status": 0, "articles": [{"content": "- 程序未正确处理用户上传的文件，从而导致程序可以读取、处理或存储未经授权的文件\n", "title": "什么是任意文件上传"}, {"content": "- 欺骗攻击：攻击者可以通过发送伪造的文件来欺骗程序，从而导致程序读取、处理或存储未经授权的文件。\n- 文件格式攻击：攻击者可以通过选择特定的文件格式，例如压缩文件或 ZIP 文件，从而利用上传的文件来篡改程序的执行结果或窃取程序中的重要数据。\n", "title": "任意文件上传常见的攻击方式"}, {"content": "- 使用安全文件传输协议 (FTP):使用安全 FTP 协议可以确保上传的文件格式、大小、权限等符合预期，同时可以防止文件读取、篡改或存储漏洞。\n- 使用文件上传过滤器：使用文件上传过滤器可以过滤上传的文件，以确保文件的格式、大小、权限等符合预期，同时可以防止文件读取、篡改或存储漏洞。\n- 使用白名单机制：使用白名单机制可以只允许特定的文件格式、大小、权限等存在的文件上传，从而防止非法文件的上传和攻击。\n- 定期更新和升级程序：定期更新和升级程序可以修复已知的漏洞，并增强程序的安全性。", "title": "如何预防任意文件上传"}], "cnvd_id": "", "cve_id": "CVE-2026-93352", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-434", "description": "Laravel-Mediable 是 Plank 开源的 Laravel 媒体管理组件（composer 包 plank/laravel-mediable），用于将上传文件附加到 Eloquent 模型并管理存储目录。\n受影响版本中，为修复 CVE-2026-49972 引入的 config/mediable.php forbidden_extensions 扩展名黑名单包含 phpt 但缺少 pht，MediaUploader::verifyExtension() 在默认 allowed_extensions 为空时仅拒绝黑名单内扩展名，File::sanitizeFileName() 依据同一黑名单改写嵌套扩展名，攻击者上传的 .p ime": "2026-09-24", "level": "Critical", "mps_id": "MPS-wuq2-fjat", "poc": false, "poc_url": [], "published_time": "2026-09-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-wuq2-fjat", "name": "https://www.oscs1024.com/hd/MPS-wuq2-fjat"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-90481", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-90481"}, {"url": "https://portswigger.net/burp/releases/dast-2026-8", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Burp Suite DAST 身份认证绕过漏洞", "_translated": true, "_saved_at": "2026-09-24T15:42:06+00:00", "_first_saved_at": "2026-09-24T15:42:06+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-wuq2-fjat"}, {"analysis_status": 0, "articles": [{"content": "应用程序在处理用户输入时的不完善或缺乏验证机制，所以攻击者能够通过向应用程序发送恶意输入，利用应用程序对输入数据的错误处理方式来注入自己的恶意代码。这些恶意代码会被应用程序误认为是合法的指令或数据，并在执行过程中被执行。", "title": "什么是代码注入"}, {"content": "应用程序使用可执行动态代码的函数来执行用户可控的参数，当应用程序对于用户输入过滤不完全时，攻击者可以注入恶意代码并控制代码执行流程。", "title": "代码注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对所有用户输入进行验证和过滤，确保只接受预期的有效输入。这包括对输入数据进行输入长度验证、类型检查和格式验证等。\r\n- 使用参数化查询或预编译语句：对于数据库查询操作，应该使用参数化查询或预编译语句，确保输入数据不会被误认为是执行代码。\r\n- 最小特权原则：应用程序在执行操作系统命令或动态代码时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。\r\n- 安全编码实践：开发人员应该采用安全编码实践，包括避免使用eval函数、避免拼接用户输入的字符串作为代码执行等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止代码注入攻击。", "title": "如何预防代码注入"}], "cnvd_id": "", "cve_id": "CVE-2026-96756", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.1}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.2}]}, "cvss_score": 9.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-94", "description": "orval 是一个开源的 OpenAPI 代码生成工具，其 @orval/core 核心库负责解析 OpenAPI 规范并生成 TypeScript 客户端代码与测试数据工厂函数。\n受影响版本中，packages/core/src/generators/factory.ts 的 buildDefaultPayload 在 useDates 开启且 schema.default 为 date 或 date-time 格式的字符串时，直接将 OpenAPI 文档中的默认值拼接为 new Date('${schema.default}')，未做任何转义。攻击者影响项目使用的 OpenAPI 文档后，可在 default 中插入单引号闭合字面量并追加任意表达式，生成出的工厂函数在每次被调用时以消费进程权限执行注入代码。\n修复版本中通过在拼接前调用 jsStringLiteralEscape 转义默认值中的单引号与反斜杠，使字面量无法被闭合、表达式无法被注入，恶意默认值退化为无效日期参数，合法规格的生成输出保持不变。", "effects": [{"comp_name": "@orval/core", "ecosystem": "npm", "versions": [{"affected_version": "(-∞,8.30.0)", "min_fixed_version": "8.30.0", "repository": "npm", "solutions": [], "upstream": true}]}, {"comp_name": "orval", "ecosystem": "npm", "versions": [{"affected_version": "(-∞,8.30.0)", "min_fixed_version": "8.30.0", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "代码注入", "kind_en": "代码生成控制不当（“代码注入”）", "last_modified_time": "2026-09-24", "level": "Critical", "mps_id": "MPS-ybga-si52", "poc": false, "poc_url": [], "published_time": "2026-09-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ybga-si52", "name": "https://www.oscs1024.com/hd/MPS-ybga-si52"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-96756", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-96756"}, {"url": "https://github.com/orval-labs/orval/security/advisories/GHSA-wx66-36r6-v5g7", "name": "GitHub Security Advisory (GHSA-wx66-36r6-v5g7)"}, {"url": "https://github.com/orval-labs/orval/pull/4038", "name": ""}, {"url": "https://github.com/orval-labs/orval/commit/b9b083576943c683540200eb957feced57dddc1a", "name": ""}, {"url": "https://github.com/orval-labs/orval/blob/v8.29.0/packages/core/src/generators/factory.ts#L493", "name": ""}, {"url": "https://github.com/orval-labs/orval", "name": ""}, {"url": "https://www.vulncheck.com/advisories/orval-before-8.30.0-code-injection-via-factory-generation", "name": "VulnCheck Advisory: orval before 8.30.0 Code Injection via Factory Generation"}], "scope_influence": "", "tags": ["npm", "开源"], "title": "orval 工厂代码注入漏洞", "_translated": true, "_saved_at": "2026-09-23T18:09:23+00:00", "_first_saved_at": "2026-09-23T18:09:23+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ybga-si52"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-78312", "cvss": {"cvssv31": [{"source": "759f5e80-c8e1-4224-bead-956d7b33c98b", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:H/A:H", "severity": "critical", "base_score": 9.1}]}, "cvss_score": 9.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:H/A:H", "cwe": "CWE-22", "description": "DIAEnergie 中的路径遍历。\n\n此问题影响 DIAEnergie：1.11.00.022 之前的版本。", "effects": [{"comp_name": "diaenergie", "ecosystem": "linux", "versions": [{"affected_version": "[0,1.11.00.022)", "min_fixed_version": "1.11.00.022", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": 况下中断，重复发送可无限期压制设备上的 BGP 平面。\n修复版本中通过 7.25beta4 的 BGP 稳定性修复加强 labelled-VPN NLRI 前缀长度的下限校验，低于最小有效值的前缀长度不再通过校验进入负长度地址解析，畸形 UPDATE 报文不再导致 BGP 服务崩溃。", "effects": [{"comp_name": "routeros", "ecosystem": "linux", "versions": [{"affected_version": "[7.21.5,7.25beta4)", "min_fixed_version": "7.25beta4", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "输入中指定数量的验证不当", "kind_en": "输入中指定数量的验证不正确", "last_modified_time": "2026-09-23", "level": "High", "mps_id": "MPS-eamo-71jh", "poc": false, "poc_url": [], "published_time": "2026-09-23", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-eamo-71jh", "name": "https://www.oscs1024.com/hd/MPS-eamo-71jh"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-93345", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-93345"}, {"url": "https://forum.mikrotik.com/t/7-25beta-development-is-released/272788", "name": "7.25beta Release Notes"}, {"url": "https://www.vulncheck.com/advisories/mikrotik-routeros-improper-input-validation-dos-via-bgp-labelled-vpn-nlri", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "MikroTik RouterOS BGP拒绝服务漏洞", "_translated": true, "_saved_at": "2026-09-22T19:29:09+00:00", "_first_saved_at": "2026-09-22T19:29:09+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-eamo-71jh"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-91018", "cvss": {"cvssv31": [{"source": "ics-cert@hq.dhs.gov", "vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}], "cvssv4": [{"source": "ics-cert@hq.dhs.gov", "vector": "CVSS:4.0/AV:A/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:A/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-415", "description": "lwIP 是开源轻量级 TCP/IP 协议栈，面向资源受限的嵌入式系统，提供 IPv4/IPv6 以及可选的 6LoWPAN 报文处理。\n受影响版本中，在启用 IPv6 且网络接口由 lowpan6_input 接收 IEEE 802.15.4 帧时，FRAG1 分片的 IPHC 解压失败会把同一输入 pbuf 释放两次。lowpan6_decompress 在失败路径已经对参数 p 调用 pbuf_free 并返回空指针，lowpan6_input 仍先 mem_free 重组辅助结构 lrh，再跳转到 lowpan6_input_discard 对 p 再次执行 pbuf_free，形成双重释放，可导致进程崩溃、拒绝服务、内存破坏或代码执行。\n修复版本中通过在解压失败时只释放 lrh、递增 ifindiscards 并直接返回 ERR_OK，不再进入会再次释放 p 的丢弃路径，消除对同一 pbuf 的第二次释放。", "effects": [{"comp_name": "lwip", "ecosystem": "linux", "versions": [{"affected_version": "[2.0.1,2.2.1]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "双重释放", "kind_en": "双重免费", "last_modified_time": "2026-09-23", "level": "High", "mps_id": "MPS-tbih-0zqm", "poc": false, "poc_url": [], "published_time": "2026-09-23", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-tbih-0zqm", "name": "https://www.oscs1024.com/hd/MPS-tbih-0zqm"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-91018", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-91018"}, {"url": "https://cgit.git.savannah.gnu.org/cgit/lwip.git", "name": ""}, {"url": "https://www.cisa.gov/news-events/ics-advisories/icsa-26-265-02", "name": ""}, {"url": "https://github.com/cisagov/CSAF/blob/develop/csaf_files/OT/white/2026/icsa-26-265-02.json", "name": ""}], "scope_influence": "", "tags": [], "title": "lwIP双重释放漏洞", "_translated": true, "_saved_at": "2026-09-22T22:37:57+00:00", "_first_saved_at": "2026-09-22T22:37:57+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-tbih-0zqm"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-94450", "cvss": {"cvssv31": [{"source": "ff89ba41-3aa1-4d27-914a-91399e9639e5", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}], "cvssv4": [{"source": "ff89ba41-3aa1-4d27-914a-91399e9639e5", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-1284", "description": "s2n-quic 是 AWS 维护的开源 Rust 库，实现 IETF QUIC 协议，用于在 UDP 上建立加密传输连接。\n受影响版本中，服务端被配置为发送 Retry 时，对客户端首个不含 token 的 Initial 报文未校验 Destination Connection ID 是否达到 InitialId 的 8 字节下限。长度处于 4 至 7 字节的连接 ID 仍可通过 LocalId 路由并进入 retry::Dispatch::queue，随后 Retry::encode_packet 对 InitialId::try_from_bytes(packet.destination_connection_id()).unwrap() 失败直接 panic，未认证远程攻击者发送单个 UDP 数据报即可使服务端 endpoint 退出。\n修复版本中通过在 receive_datagram 中丢弃无法转换为 InitialId 的首个 Initial 报文，使其不再进入 Retry 发送，并将 Retry::encode_packet 的失败转换从 unwrap 改为返回 None，从而避免短 Destination Connection ID 触发 panic。", "effects": [{"comp_name": "s2n-quic", "ecosystem": "cargo", "versions": [{"affected_version": "(-∞,1.89.0)", "min_fixed_version": "1.89.0", "repository": "cargo", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "输入中指定数量的验证不当", "kind_en": "输入中指定数量的验证不正确", "last_modified_time": "2026-09-23", "level": "High", "mps_id": "MPS-xvkz-53g8", "poc": false, "poc_url": [], "published_time": "2026-09-23", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-xvkz-53g8", "name": "https://www.oscs1024.com/hd/MPS-xvkz-53g8"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-94450", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-94450"}, {"url": "https://github.com/aws/s2n-quic/releases/tag/v1.89.0", "name": ""}, {"url": "https://aws.amazon.com/security/security-bulletins/2026-116-aws/", "name": ""}, {"url": "https://github.com/aws/s2n-quic/security/advisories/GHSA-5rw2-6x5m-v22x", "name": ""}], "scope_influence": "", "tags": [], "title": "s2n-quic拒绝服务漏洞", "_translated": true, "_saved_at": "2026-09-22T22:37:55+00:00", "_first_saved_at": "2026-09-22T22:37:55+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-xvkz-53g8"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-95814", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N", "severity": "high", "base_score": 8.1}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X )", "min_fixed_version": "12.9.135", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "带着不必要的权限执行", "kind_en": "使用不必要的权限执行", "last_modified_time": "2026-09-23", "level": "High", "mps_id": "MPS-m061-u47w", "poc": false, "poc_url": [], "published_time": "2026-09-23", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-m061-u47w", "name": "https://www.oscs1024.com/hd/MPS-m061-u47w"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-84787", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-84787"}, {"url": "https://www.manageengine.com/itom/advisory/cve-2026-84787.html", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "OpManager权限提升漏洞", "_translated": true, "_saved_at": "2026-09-23T13:14:18+00:00", "_first_saved_at": "2026-09-23T13:14:18+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-m061-u47w"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-88997", "cvss": {}, "cvss_score": 8, "cvss_vector": "", "cwe": "CWE-79", "description": "JSM Show Post Metadata（插件标识 jsm-show-post-meta）是 JS Morisset 维护的开源 WordPress 插件，在文章、页面和自定义文章类型的编辑页中用元数据框展示 post meta 键名及反序列化后的值，安装启用后无额外设置。\n受影响版本中，贡献者及以上用户写入文章的 meta key 会在具备 manage_options 能力的用户打开编辑页时进入 SucomUtilMetabox::get_table_metadata()。该方法先调用 SucomUtil::sanitize_meta_key()，再把 meta key 拼入删除图标 onclick 属性中的单引号 JavaScript 字符串；sanitize_meta_key() 只做 HTML 解码和标签剥离，不删除引号，引号可打断该事件处理属性并在审阅者浏览器会话中执行脚本。同一 key 在表格单元格中经过 esc_html()，但进入事件处理属性时没有做属性或脚本转义。\n修复版本中通过在 SucomUtil::sanitize_meta_key() 内删除单引号和双引号，切断 meta key 打断 onclick 事件处理属性的路径，避免审阅文章时执行注入脚本。", "effects": [{"comp_name": "jsm-show-post-meta", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,4.9.1)", "min_fixed_version": "4.9.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-09-23", "level": "High", "mps_id": "MPS-a6c8-e0j9", "poc": false, "poc_url": [], "published_time": "2026-09-23", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-a6c8-e0j9", "name": "https://www.oscs1024.com/hd/MPS-a6c8-e0j9"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-88997", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-88997"}, {"url": "https://wpscan.com/vulnerability/1699d3aa-29ca-4197-8e3b-0b03ecce751a/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "JSM元数据存储型XSS", "_translated": true, "_saved_at": "2026-09-23T07:09:34+00:00", "_first_saved_at": "2026-09-23T07:09:34+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-a6c8-e0j9"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "cnvd_id": "", "cve_id": "CVE-2026-8849", "cvss": {"cvssv4": [{"source": "3f572a00-62e2-4423-959a-7ea25eff1638", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.7}]}, "cvss_score": 7.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-416", "description": "RTI Connext Professional 是闭源商业数据分发中间件，Security Plugins 模块为 DDS 应用提供身份认证、访问控制与数据保护，源码未公开。\n受影响版本中，启用 Security Plugins 后，应用在同时解析多份 Permissions Document 时存在释放后使用缺陷。厂商公告说明该缺陷会造成堆缓冲区越界读写；持有可通过身份认证的身份凭据的网络攻击者，或能够改写文件系统上 Permissions Document 的攻击者，只有在竞争条件成立时才能触发，可能破坏应用机密性与完整性，或导致进程崩溃。未启用该安全扩展时不受影响。\n修复版本中通过发布 7.7.0.1 修复 Security Plugins 同时解析多份 Permissions Document 时的释放后使用问题，公开资料未披露具体函数级改动。", "effects": [{"comp_name": "connext_professional", "ecosystem": "linux", "versions": [{"affected_version": "[7.6.0,7.7.0.1)", "min_fixed_version": "7.7.0.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "UAF", "kind_en": "免费后使用", "last_modified_time": "2026-09-23", "level": "High", "mps_id": "MPS-edp8-96kc", "poc": false, "poc_url": [], "published_time": "2026-09-23", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-edp8-96kc", "name": "https://www.oscs1024.com/hd/MPS-edp8-96kc"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-8849", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-8849"}, {"url": "https://www.rti.com/vulnerabilities/#cve-2026-8849", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Connext安全插件UAF", "_translated": true, "_saved_at": "2026-09-22T19:29:13+00:00", "_first_saved_at": "2026-09-22T19:29:13+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-edp8-96kc"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-86243", "cvss": {}, "cvss_score": 7.5, "cvss_vector": "", "cwe": "CWE-126", "description": "Apache Tomcat Native 是 Apache Software Foundation 维护的开源 JNI 库，为 Tomcat 等 Java 应用提供基于 APR 与 OpenSSL 的本地 TLS 连接加速能力。\n受影响版本中，SSLContext.setAlpnProtos 调用的 native/src/sslcontext.c 的 initProtocols 函数将 ALPN 协议名序列化为 1 字节长度前缀加协议名的线格式，缓冲区从 128 字节起步且扩容时仅做单次翻倍，同时 MAX_ALPN_PROTO_SIZE 允许单个协议名最长 65535 字节；配置超过 255 字节的协议名时序列化写入越过重新分配后的堆缓冲区边界，且长度前缀被截断为 8 位，生成与实际分配不一致的 alpn_proto_data/alpn_proto_len，TLS 握手期间恶意客户端发送 ALPN 扩展会让 select_next_proto 回调按截断后的长度字节遍历该缓冲区并越界读取堆内存，原生层崩溃导致 JVM 崩溃，形成远程拒绝服务。\n修复版本中通过将 MAX_ALPN_PROTO_SIZE 从 65535 收紧为 255，并把单次翻倍改为按需循环翻倍直至缓冲区容纳完整序列化数据，切断超长协议名引发的越界写入与线格式不一致，使握手期遍历不再越界读取堆内存。", "effects": [{"comp_name": "apache:t /AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-829", "description": "GNU Emacs 是开源文本编辑器，源码位于 GNU Savannah 的 emacs.git，使用 C 与 Emacs Lisp 实现文件访问、文件局部变量处理和符号驻留。\n受影响版本中，打开文件时 hack-local-variables 会应用文件局部变量 read-symbol-shorthands。该变量列入 permanently-enabled-local-variables，并在 lisp/progmodes/elisp-mode.el 中以 consp 作为 safe-local-variable 谓词，因此默认配置无需额外确认即可生效，且关闭 enable-local-variables 仍会应用它。src/lread.c 的 Fintern、Fintern_soft 与 Funintern 通过 oblookup_considering_shorthand 按当前缓冲区的该变量改写传入符号名。bug#80574 说明，访问带有该局部变量的文件可在展示内容前执行文件中的 Emacs Lisp。\n修复版本中通过提交 7c7616e3 让 Fintern、Fintern_soft 与 Funintern 改为调用 oblookup，按原始字符串驻留符号，不再读取 read-symbol-shorthands，需要简写展开的调用改用 shorthands-intern、shorthands-intern-soft 或 shorthands-unintern。该提交已进入 master，但 emacs-31.1 标签中的 Fintern 仍调用 oblookup_considering_shorthand，且未见包含该提交的已发布版本标签。", "effects": [{"comp_name": "emacs", "ecosystem": "linux", "versions": [{"affected_version": "[28.1,31.1]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "从非可信控制范围包含功能例程", "kind_en": "包含来自不可信控制领域的功能", "last_modified_time": "2026-09-23", "level": "High", "mps_id": "MPS-zx5y-lm67", "poc": false, "poc_url": [], "published_time": "2026-09-23", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-zx5y-lm67", "name": "https://www.oscs1024.com/hd/MPS-zx5y-lm67"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-96269", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-96269"}, {"url": "https://yhetil.org/emacs/jwvtsph1aoj.fsf-monnier+emacs@gnu.org/T/#m319545e835fb71d764bf868166632d4633167a75", "name": ""}, {"url": "https://debbugs.gnu.org/cgi/bugreport.cgi?bug=80574#227", "name": ""}], "scope_influence": "", "tags": [], "title": "Emacs简写符号代码执行", "_translated": true, "_saved_at": "2026-09-22T22:37:52+00:00", "_first_saved_at": "2026-09-22T22:37:52+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-zx5y-lm67"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-86247", "cvss": {}, "cvss_score": 7.4, "cvss_vector": "", "cwe": "CWE-366", "description": "Apache Tomcat Native（tcnative）是 Apache 软件基金会维护的开源本地组件，以 JNI 方式为 Tomcat 提供基于 APR/OpenSSL 的 TLS 加速与客户端证书认证能力，Tomcat 通过 OpenSSLImplementation 调用其公开 Java 接口完成连接级配置。\n受影响版本中，SSL.setVerify 的本地实现将连接级证书校验级别与深度写入同一 SSLContext 下所有连接共享的 tcn_ssl_ctxt_t 结构，而非连接私有数据；握手校验回调 SSL_callback_SSL_verify 同样读取共享上下文中的 verify_mode。攻击者在启用客户端证书认证的服务上并发建立连接，利用连接间校验设置相互覆盖的竞争窗口，可使其他连接的客户端证书校验要求被降级，在无有效证书的情况下通过客户端认证。\n修复版本中通过在连接私有结构 tcn_ssl_conn_t 中引入独立的 verify_mode 与 verify_depth 字段隔离上下文级与连接级校验设置，SSL.setVerify 改为写入连接私有状态并对单个 SSL 对象调用 SSL_set_verify，校验回调在连接级配置存在时优先采用连接级设置，切断了跨连接覆盖证书校验要求的因果链。", "effects": [{"comp_name": "tomcat_native", "ecosystem": "linux", "versions": [{"affected_version": "[1.3.0,1.3.9)", "min_fixed_version": "1.3.9", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[2.0.0,2.0.16)", "min_fixed_version": "2.0.16", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "单线程内的竞争条件", "kind_en": "线程内的竞争条件", "last_modified_time": "2026-09-23", "level": "High", "mps_id": "MPS-e7d4-367c", "poc": false, "poc_url": [], "published_time": "2026-09-23", "reference_url_list": [{"url": "http://www.mail-archive.com/announce@apache.org/msg11987.html", "name": ""}, {"url": "https://tomcat.apache.org/security-native.html", "name": ""}, {"url": "https://lists.apache.org/thread/obsson6zhvfg0wsp2bx602l61ltj87r1", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-86247", "name": ""}, {"url": "https://github.com/apache/tomcat-native/commit/fb688de41e837d98e76961e44584b37989e4f7d0", "name": ""}, {"url": "https://github.com/apache/tomcat-native/commit/3dc73c118d2202c8dfc6053787cc6d61416ddce6", "name": ""}], "scope : "https://www.oscs1024.com/hd/MPS-b0oz-g593"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-95815", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-95815"}, {"url": "https://github.com/openclaw/openclaw/security/advisories/GHSA-5j57-84cx-r295", "name": "GitHub Security Advisory (GHSA-5j57-84cx-r295)"}, {"url": "https://github.com/openclaw/openclaw/commit/8361f3704dd5e151ff1325e62ff5de658b6c62e6", "name": "Patch Commit"}, {"url": "https://github.com/openclaw/openclaw/blob/935c16b5e22fae3c7ff5fdee0b834d5e0077d1f6/apps/ios/Sources/Model/NodeAppModel.swift#L10037-L10038", "name": "handleAgentDeepLink log line before the fix"}, {"url": "https://github.com/openclaw/openclaw", "name": ""}, {"url": "https://www.vulncheck.com/advisories/openclaw-ios-before-2026.8.11-credential-exposure-via-deep-link-url-logging", "name": "VulnCheck Advisory: OpenClaw iOS before 2026.8.11 Credential Exposure via Deep-Link URL Logging"}], "scope_influence": "", "tags": ["AI"], "title": "OpenClaw iOS深链日志泄密", "_translated": true, "_saved_at": "2026-09-22T22:37:54+00:00", "_first_saved_at": "2026-09-22T22:37:54+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-b0oz-g593"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-94367", "cvss": {"cvssv31": [{"source": "contact@securifera.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-78", "description": "OpenEye Apex Network Video Recorder 是闭源网络视频录像机产品，其 Apex Server Software 固件用于视频录像、备份与远程管理。\n受影响版本中，recbackup 将已认证管理员提交的备份区域配置输入传入 shell 命令，命令以 nvr 用户权限执行。CNA 确认固件 3.2.9.376 受影响，并说明该设计至少自固件 2.2.3.4 起存在。\n修复版本中通过升级 Apex Server Software 修复 recbackup 的操作系统命令注入，备份区域配置输入不再导致以 nvr 用户权限执行命令。厂商公告确认该问题自 3.4.3 起解决。", "effects": [{"comp_name": "apex_network_video_recorder", "ecosystem": "linux", "versions": [{"affected_version": "[2.2.3.4,3.4.3)", "min_fixed_version": "3.4.3", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-09-23", "level": "High", "mps_id": "MPS-i2le-gq4w", "poc": false, "poc_url": [], "published_time": "2026-09-23", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-i2le-gq4w", "name": "https://www.oscs1024.com/hd/MPS-i2le-gq4w"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-94367", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-94367"}, {"url": "https://portal.openeye.net/updates/issue-alerts/1061", "name": ""}, {"url": "https://www.securifera.com/advisories/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Apex NVR命令注入漏洞", "_translated": true, "_saved_at": "2026-09-23T01:09:15+00:00", "_first_saved_at": "2026-09-23T01:09:15+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-i2le-gq4w"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-84791", "cvss": {"cvssv31": [{"source": "0fc0942c-577d-4 防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-81552", "cvss": {"cvssv31": [{"source": "psirt@us.ibm.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-78", "description": "IBM DataStage on Cloud Pak for Data 是 IBM 商业数据集成组件，以 IBM Software Hub（原 Cloud Pak for Data）服务形式交付企业级 ETL 数据抽取、转换与加载能力，源码未公开。\n受影响版本中，5.4.0.0 在环境变量处理上未对其进行正确中和，远程认证攻击者可将恶意内容注入受影响的环境变量并进入操作系统命令执行流程，最终以服务权限执行任意命令。\n修复版本中通过厂商安全更新收紧了环境变量的中和处理，阻断不可信内容进入命令执行链路；官方公告未披露更细粒度的源码修改，建议升级至 5.4 patch 7 及以上版本。", "effects": [{"comp_name": "datastage_on_cloud_pak_for_data", "ecosystem": "linux", "versions": [{"affected_version": "[5.4.0.0,5.4 patch 7)", "min_fixed_version": "5.4 patch 7", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-09-24", "level": "High", "mps_id": "MPS-boyq-uer2", "poc": false, "poc_url": [], "published_time": "2026-09-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-boyq-uer2", "name": "https://www.oscs1024.com/hd/MPS-boyq-uer2"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-81552", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-81552"}, {"url": "https://www.ibm.com/support/pages/node/7288649", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "DataStage环境变量命令注入漏洞", "_translated": true, "_saved_at": "2026-09-24T15:42:08+00:00", "_first_saved_at": "2026-09-24T15:42:08+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-boyq-uer2"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-70125", "cvss": {"cvssv31": [{"source": "secure@microsoft.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H ta（IBM Software Hub）平台，用于构建、调度和管理企业级 ETL 数据管道。\n受影响版本中，5.4.0.0 对操作系统命令中的特殊元素中和不当（CWE-78），远程认证攻击者可将恶意输入注入操作系统命令执行路径，从而在该平台上执行任意代码；产品闭源，官方未披露具体注入入口的文件与函数。\n修复版本中通过官方安全更新消除该命令注入缺陷，IBM 要求用户按照 Cloud Pak for Data / Software Hub 5.4.x 补丁说明升级到 5.4 patch 7 或更高版本，官方未提供临时缓解措施。", "effects": [{"comp_name": "datastage_on_cloud_pak_for_data", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,5.4 patch 7)", "min_fixed_version": "5.4 patch 7", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-09-24", "level": "High", "mps_id": "MPS-eca1-7tx5", "poc": false, "poc_url": [], "published_time": "2026-09-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-eca1-7tx5", "name": "https://www.oscs1024.com/hd/MPS-eca1-7tx5"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-81539", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-81539"}, {"url": "https://www.ibm.com/support/pages/node/7288649", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "IBM DataStage命令注入漏洞", "_translated": true, "_saved_at": "2026-09-24T15:42:15+00:00", "_first_saved_at": "2026-09-24T15:42:15+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-eca1-7tx5"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过向受信任的数据序列化过程中添加恶意数据，从而在序列化和反序列化过程中执行恶意代码的攻击漏洞。这种漏洞通常存在于使用序列化 (serialization) 机制存储和传输数据的程序中。\n", "title": "什么是反序列化"}, {"content": "- 注入攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码注入到程序中，从而实现代码执行的目的。\n- 反射攻击：攻击者使用反射机制，在序列化过程中动态生成恶意数据，并将恶意代码注入到程序中，从而实现代码执行的目的。\n- 缓冲区溢出攻击：攻击者通过在序列化过程中向缓冲区输入恶意数据，导致缓冲区溢出，从而破坏程序的内存管理，实现代码执行的目的。\n- 格式字符串攻击：攻击者通过在序列化过程中输入恶意数据，导致程序使用错误的格式字符串，从而实现代码执行的目的。\n- 数据流攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码作为一个数据流传递给程序，从而实现代码执行的目的。\n", "title": "反序列化常见的攻击方式"}, {"content": "- 不信任输入数据：程序应该严格检查输入数据的有效性，并避免使用不受信任的数据。\n- 使用安全的序列化机制：程序应该使用安全的序列化机制，如 JSON 或 XML 序列化，而不是第三方序列化库。\n- 最小特权原则：程序应该限制对受信任数据的处理权限，并避免在运行时修改数据。\n- 代码审查和漏洞扫描：程序应该进行代码审查和漏洞扫描，以发现和修复潜在的安全漏洞。\n", "title": "如何预防反序列化"}], "cnvd_id": "", "cve_id": "CVE-2026-82093", "cvss": {"cvssv31": [{"source": "psirt@us.ibm.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-502", "description": "DataStage on Cloud Pak for Data 是 IBM 推出的商业数据集成 ETL 服务，作为 IBM Cloud Pak for Data（IBM Software Hub）平台的组件提供，用于企业级数据的抽取、转换与加载，源码不公开。\n受影响版本中，组件在处理不可信数据时执行不安全的反序列化（CWE-502），持有普通用户权限的远程攻击者通过提交恶意序列化数据可触发该反序列化流程，在服务器端执行任意代码，获取系统控制权限，导致机密性、完整性与可用性全部受损。\n修复版本中通过官方补丁完成修复，IBM 安全公告要求将 DataStage on Cloud Pak for Data 5.4.0.0 升级至 5.4 patch 7 及以上版本，同时公告说明无临时缓解措施，升级后远程认证攻击者无法再利用该漏洞执行任意代码。", "effects": [{"comp_name": "DataStage on Cloud Pak for Data", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,5.4.0.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "datastage_on_cloud_pak_for_data", "ecosystem": "linux", "versions": [{"affected_version": "[5.4.0.0,5.4 patch 7)", "min_fixed_version": "5.4 patch 7", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "反序列化", "kind_en": "不可信数据的反序列化", "last_modified_time": "2026-09-24", "level": "High", "mps_id": "MPS-sa79-tgmn", "poc": false, "poc_url": [], "published_time": "2026-09-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-sa79-tgmn", "name": "https://www.oscs1024.com/hd/MPS-sa79-tgmn"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-82093", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-82093"}, {"url": "https://www.ibm.com/support/pages/node/7288649", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "DataStage 反序列化代码执行漏洞", "_translated": true, "_saved_at": "2026-09-24T15:42:11+00:00", "_first_saved_at": "2026-09-24T15:42:11+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-sa79-tgmn"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-80412", "cvss": {"cvssv31": [{"source": "psirt@us.ibm.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-78", "description": "由于 OSH 脚本生成期间连接器属性值的不正确转义，IBM DataStage on Cloud Pak for Data 5.4.0.0 可能允许经过身份验证的远程攻击者执行任意代码。", "effects": [{"comp_name": "DataStage on Cloud Pak for Data", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,5.4.0.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-09-24", "level": "High", "mps_id": "MPS-srxa-qv9k", "poc": false, "poc_url": [], "published_time cwe": "CWE-502", "description": "MLflow 是开源的机器学习生命周期管理平台，用于实验跟踪、模型打包、注册表管理与部署，其 statsmodels flavor 负责以 statsmodels 框架保存和加载模型。\n受影响版本中，mlflow/statsmodels/__init__.py 的 _load_model() 完全未实现 MLFLOW_ALLOW_PICKLE_DESERIALIZATION=False 安全控制，直接调用 statsmodels.iolib.api.load_pickle() 反序列化模型文件；攻击者向受害者获取模型的工件存储、模型注册表等位置写入夹带恶意 pickle 载荷的模型工件后，受害者环境即使显式设置 MLFLOW_ALLOW_PICKLE_DESERIALIZATION=False，经 mlflow.statsmodels.load_model 或 mlflow.pyfunc.load_model 加载该模型时仍会执行任意代码。\n修复版本中通过在 _load_model() 入口补充与 sklearn 等 flavor 一致的防护，当 MLFLOW_ALLOW_PICKLE_DESERIALIZATION 未放行且未处于 Databricks runtime、Databricks model serving 环境时抛出 MlflowException 拒绝加载，阻断恶意 pickle 反序列化。", "effects": [{"comp_name": "mlflow", "ecosystem": "pip", "versions": [{"affected_version": "[2.1.0,3.15.0)", "min_fixed_version": "3.15.0", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "反序列化", "kind_en": "不可信数据的反序列化", "last_modified_time": "2026-09-24", "level": "High", "mps_id": "MPS-uswe-81p2", "poc": false, "poc_url": [], "published_time": "2026-09-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-uswe-81p2", "name": "https://www.oscs1024.com/hd/MPS-uswe-81p2"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-96804", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-96804"}, {"url": "https://kb.cert.org/vuls/id/369093", "name": ""}], "scope_influence": "", "tags": ["AI", "python", "开源", "终端软件"], "title": "MLflow statsmodels 反序列化控制绕过漏洞", "_translated": true, "_saved_at": "2026-09-23T18:09:17+00:00", "_first_saved_at": "2026-09-23T18:09:17+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-uswe-81p2"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-80425", "cvss": {"cvssv31": [{"source": "psirt@us.ibm.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-78", "description": "由于操作系统命令中使用的特殊元素的不正确中和，IBM DataStage on Cloud Pak for Data 5.4.0.0 可能允许经过身份验证的远程攻击者执行任意命令。", "effects": [{"comp_name": "DataStage on Cloud Pak for Data", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,5.4.0.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-09-24", "level": "High", "mps_id": "MPS-wv4q-pd7o", "poc": false, "poc_url": [], "published_time": "2026-09-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-wv4q-pd7o", "name": "https://www.oscs1024.com/hd/MPS-wv4q-pd7o"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-80425", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-80425"}, {"url": "https://www.ibm.com/support/pages/node/7288649", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Cloud Pak for Data 上的 DataStage 存在多个漏 vector": "CVSS:4.0/AV:A/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-78", "description": "Brocade SANav CLI 脚本组件中 shell 元字符的输入清理不充分，导致经过身份验证的用户能够突破托管交换机上的受限执行上下文。具有命令执行权限的攻击者可以利用此缺陷在目标结构交换机上运行未经授权的 shell 命令，绕过命令允许列表并获得完全的管理交换机访问权限。该漏洞影响3.0.1a之前的所有Brocade SANnav版本。", "effects": [{"comp_name": "SANnav", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,before3.0.1a]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-09-24", "level": "High", "mps_id": "MPS-3uvb-n9z7", "poc": false, "poc_url": [], "published_time": "2026-09-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-3uvb-n9z7", "name": "https://www.oscs1024.com/hd/MPS-3uvb-n9z7"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-82369", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-82369"}, {"url": "https://support.broadcom.com/web/ecx/support-content-notification/-/external/content/SecurityAdvisories/0/38994", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "3.0.1a 之前的 Brocade SANavav 中 shell 元字符的输入清理不充分", "_translated": true, "_saved_at": "2026-09-23T21:57:15+00:00", "_first_saved_at": "2026-09-23T21:57:15+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-3uvb-n9z7"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-90959", "cvss": {"cvssv31": [{"source": "secalert@redhat.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N", "severity": "high", "base_score": 8.1}]}, "cvss_score": 8.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N", "cwe": "CWE-22", "description": "pulpcore 是 Pulp 平台的开源核心框架，用于管理、同步和分发软件仓库内容，通过 REST API 提供内容上传、远程同步与发布能力，被 Red Hat Satellite、Ansible Automation Platform 和 Red Hat Update Infrastructure 等产品采用。\n受影响版本中，内容上传 API 的 file_url 参数允许具有仓库内容上传权限的用户提交一个由服务器自行下载的地址；RemoteSerializer.validate_url 仅以字符串前缀 startswith(\"file://\") 判定是否为本地文件地址，未命中该前缀的输入被直接放行，而下载链路按 urlparse 解析出的协议分发下载器，urlparse 将不带双斜杠的 file: 前缀同样识别为文件协议，两者判定标准不一致，攻击者可提交 file:../ 形式的相对穿越地址绕过 ALLOWED_IMPORT_PATHS 白名单，FileDownloader 按解析结果拼接绝对路径读取文件，最终以 Pulp 进程权限读取服务器上任意文件；在部署 Pulp Container 的环境中，攻击者可进一步读取容器注册表令牌签名私钥并伪造 bearer token，访问注册表中全部私有容器仓库。\n修复版本中通过将校验基准从字符串前缀比较改为 urlparse 解析后的协议字段，协议为 file 的输入一律要求绝对路径、拒绝未归一化路径并强制 realpath 落在 ALLOWED_IMPORT_PATHS 内，同时在 FileDownloader 入口增加协议必须为 file 的防御性校验，切断了绕过白名单校验进入本地文件下载器的路径。", "effects": [{"comp_name": "pulpcore", "ecosystem": "pip", "versions": [{"affected_version": "[3.57.0,3.119.1)", "min_fixed_version": "3.119.1", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-09-24", "level": "High", "mps_id": "MPS-5m7p-ivnz", "poc": false, "poc_ur 288830", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "IBM Concert 软件中的多个漏洞", "_translated": true, "_saved_at": "2026-09-23T21:57:25+00:00", "_first_saved_at": "2026-09-23T21:57:25+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-80rm-q5vo"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "attack_vector_type": "Local", "cnvd_id": "", "cve_id": "CVE-2026-97185", "cvss": {"cvssv31": [{"source": "secalert@redhat.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "cwe": "CWE-787", "description": "GIMP 是开源跨平台位图图像编辑软件，GIMPressionist 是其内置的绘画风格化插件，支持从预设文件加载笔触方向与尺寸参数。\n受影响版本中，plug-ins/gimpressionist/presets.c 的 set_orient_vector() 与 set_size_vector() 使用 atoi() 从预设文件的 orientvector/sizevector 行解析向量索引 n，未做任何边界检查即写入 pcvals.orient_vectors[n] 与 pcvals.size_vectors[n] 定长数组（各 50 个元素）。用户在 GIMPressionist 对话框预设列表中选中并应用攻击者提供的预设文件时，超出 0 至 49 范围的索引（含负数）会越界写入并破坏进程内存，可能导致崩溃或在运行 GIMP 的用户上下文中执行任意代码。\n修复版本中通过在 set_orient_vector() 与 set_size_vector() 解析索引后增加 n \u003c 0 || n \u003e= MAXORIENTVECT/MAXSIZEVECT 判断并提前返回，拒绝非法索引进入数组写入，消除越界写风险。", "effects": [{"comp_name": "gimp", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,3.2.6]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-09-24", "level": "High", "mps_id": "MPS-v5mb-n3ip", "poc": false, "poc_url": [], "published_time": "2026-09-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-v5mb-n3ip", "name": "https://www.oscs1024.com/hd/MPS-v5mb-n3ip"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-97185", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-97185"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-97185", "name": ""}, {"url": "https://bugzilla.redhat.com/show_bug.cgi?id=2539980", "name": "RHBZ#2539980"}, {"url": "https://gitlab.gnome.org/GNOME/gimp/-/work_items/16788", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "GIMP GIMPressionist越界写漏洞", "_translated": true, "_saved_at": "2026-09-24T10:56:57+00:00", "_first_saved_at": "2026-09-24T10:56:57+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-v5mb-n3ip"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-6794", "cvss": {"cvssv31": [{"source": "psirt@us.ibm.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-415", "description": "IBM Concert 1.0.0 到 3.0.0 存在由于内存管理不正确而存在的双重释放漏洞。本地攻击者可以利用此缺陷来破坏堆内存并在受影响进程的上下文中执行任意代码。", "effects": [{"comp_name": "Concert", "ecosystem": "linux", "versions": [{"affected_version": "(1.0.0,3.0.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "双重释放", "kind_en": "双重免费", "last_modified_time": "2026-09 ByResetPasswordToken 在密码写入事务成功后调用 tokenizer.DeleteTokensByUserID，撤销该用户全部会话；DeleteUser 在软删除前的同一事务内依次调用 DeleteTokensByUserID 与 DeleteIdentity，被删除用户持有的令牌在下一次请求时返回 401，其中密码重置路径的撤销随 v0.137.1 发布，v0.143.0 同时将 opaque tokenizer 设为默认值。", "effects": [{"comp_name": "github.com/SigNoz/signoz", "ecosystem": "go", "versions": [{"affected_version": "[v0.98.0,v0.143.0)", "min_fixed_version": "v0.143.0", "repository": "go", "solutions": [], "upstream": true}]}, {"comp_name": "signoz", "ecosystem": "linux", "versions": [{"affected_version": "[v0.98.0,v0.143.0)", "min_fixed_version": "v0.143.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "不充分的会话过期机制", "kind_en": "会话过期时间不足", "last_modified_time": "2026-09-24", "level": "High", "mps_id": "MPS-k5yw-pc78", "poc": false, "poc_url": [], "published_time": "2026-09-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-k5yw-pc78", "name": "https://www.oscs1024.com/hd/MPS-k5yw-pc78"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-97056", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-97056"}, {"url": "https://github.com/SigNoz/signoz/security/advisories/GHSA-xrgp-3fq4-xg83", "name": "GitHub Security Advisory (GHSA-xrgp-3fq4-xg83)"}, {"url": "https://github.com/SigNoz/signoz/commit/faaed20dbd", "name": "Patch Commit"}, {"url": "https://github.com/SigNoz/signoz/commit/e2e9173986", "name": "Patch Commit"}, {"url": "https://github.com/SigNoz/signoz/commit/b02aae2db3", "name": "Patch Commit"}, {"url": "https://github.com/SigNoz/signoz/commit/c122bc09b4", "name": "Patch Commit"}, {"url": "https://www.vulncheck.com/advisories/signoz-before-0.143.0-insufficient-session-expiration-authentication-bypass", "name": "VulnCheck Advisory: SigNoz before 0.143.0 Insufficient Session Expiration Authentication Bypass"}], "scope_influence": "", "tags": ["go", "应用软件"], "title": " /MPS-pgqs-0utl", "name": "https://www.oscs1024.com/hd/MPS-pgqs-0utl"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-96808", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-96808"}, {"url": "https://github.com/flatpak/flatpak/security/advisories/GHSA-qrwq-7qwx-q9rp", "name": ""}], "scope_influence": "", "tags": [], "title": "Flatpak 本地提权漏洞", "_translated": true, "_saved_at": "2026-09-23T18:09:14+00:00", "_first_saved_at": "2026-09-23T18:09:14+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-pgqs-0utl"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-75886", "cvss": {"cvssv31": [{"source": "secalert@redhat.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "cwe": "CWE-441", "description": "openshift/console 中发现了一个缺陷。未经身份验证的远程攻击者可以利用 CatalogdHandler 中的错误配置，该配置缺乏正确的身份验证以及“openshift-session-token”cookie 的转发。这允许攻击者向集群内目录服务发送请求，从而导致内部操作员目录索引泄露并提供到 openshift-catalogd 命名空间的中继。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "混淆代理", "kind_en": "非预期的代理或中介（“困惑的代理”）", "last_modified_time": "2026-09-24", "level": "High", "mps_id": "MPS-ybpa-tjk0", "poc": false, "poc_url": [], "published_time": "2026-09-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ybpa-tjk0", "name": "https://www.oscs1024.com/hd/MPS-ybpa-tjk0"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-75886", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-75886"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-75886", "name": ""}, {"url": "https://bugzilla.redhat.com/show_bug.cgi?id=2517886", "name": "RHBZ#2517886"}], "scope_influence": "", "tags": [], "title": "CVE-2026-75886漏洞", "_translated": true, "_saved_at": "2026-09-23T21:57:22+00:00", "_first_saved_at": "2026-09-23T21:57:22+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ybpa-tjk0"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-82094", "cvss": {"cvssv31": [{"source": "psirt@us.ibm.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:C/C:N/I:H/A:L", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:C/C:N/I:H/A:L", "cwe": "CWE-22", "description": "由于受限目录的路径名限制不当，IBM DataStage on Cloud Pak for Data 5.4.0.0 可能允许经过身份验证的远程攻击者遍历系统上的目录。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-09-24", "level": "High", "mps_id": "MPS-uqv7-rakl", "poc": false, "poc_url": [], "published_time": "2026-09-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-uqv7-rakl", "name": "https://www.oscs1024.com/hd/MPS-uqv7-rakl"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-82094", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-82094"}, {"url": "https://www.ibm.com/support/pages/node/7288649", "name": ""}], "scope_influence": "", "tags": [], "title  "_translated": true, "_saved_at": "2026-09-25T01:06:20+00:00", "_first_saved_at": "2026-09-24T22:55:30+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-g79i-xwma"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，从而导致未授权的用户或资源可以被访问或篡改。", "title": "什么是访问控制不当"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n", "title": "访问控制不当常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防访问控制不当"}], "cnvd_id": "", "cve_id": "CVE-2026-85057", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:C/C:H/I:H/A:N", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:C/C:H/I:H/A:N", "cwe": "CWE-284", "description": "ZITADEL 是一个开源身份管理平台。从 3.0.0 到 3.4.13 和 4.16.1，ZITADEL Actions V1 启用 goja Node 兼容的 require() 注册表，而不限制其文件系统源加载器。具有 ORG_OWNER、org.action.write 和 org.flow.write 权限的组织操作作者可以在 OIDC、SAML 和登录流触发点运行 JavaScript，并加载 ZITADEL 服务器进程可读的文件。这可能会泄露已安装的配置和机密，包括通过 ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH 或 ZITADEL_FIRSTINSTANCE_MACHINEKEYPATH 存储的凭据，并且恢复的引导凭据可以实现从组织管理员升级到实例管理员。该问题影响 Actions V1，并且无法建立主机命令执行。此问题已在版本 3.4.13 和 4.16.1 中修复。", "effects": [{"comp_name": "github.com/zitadel/zitadel", "ecosystem": "go", "versions": [{"affected_version": "(-∞,v1.80.0-v2.20.0.20260717062331-baf6ed501b68)", "min_fixed_version": "v1.80.0-v2.20.0.20260717062331-baf6ed501b68", "repository": "go", "solutions": [], "upstream": true}]}, {"comp_name": "zitadel", "ecosystem": "linux", "versions": [{"affected_version": "[3.0.0,3.4.13)", "min_fixed_version": "3.4.13", "repository": "unmanaged", "solutions": [], "upstream": t
