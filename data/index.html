72-nc9v"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过向受信任的数据序列化过程中添加恶意数据，从而在序列化和反序列化过程中执行恶意代码的攻击漏洞。这种漏洞通常存在于使用序列化 (serialization) 机制存储和传输数据的程序中。\n", "title": "什么是反序列化"}, {"content": "- 注入攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码注入到程序中，从而实现代码执行的目的。\n- 反射攻击：攻击者使用反射机制，在序列化过程中动态生成恶意数据，并将恶意代码注入到程序中，从而实现代码执行的目的。\n- 缓冲区溢出攻击：攻击者通过在序列化过程中向缓冲区输入恶意数据，导致缓冲区溢出，从而破坏程序的内存管理，实现代码执行的目的。\n- 格式字符串攻击：攻击者通过在序列化过程中输入恶意数据，导致程序使用错误的格式字符串，从而实现代码执行的目的。\n- 数据流攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码作为一个数据流传递给程序，从而实现代码执行的目的。\n", "title": "反序列化常见的攻击方式"}, {"content": "- 不信任输入数据：程序应该严格检查输入数据的有效性，并避免使用不受信任的数据。\n- 使用安全的序列化机制：程序应该使用安全的序列化机制，如 JSON 或 XML 序列化，而不是第三方序列化库。\n- 最小特权原则：程序应该限制对受信任数据的处理权限，并避免在运行时修改数据。\n- 代码审查和漏洞扫描：程序应该进行代码审查和漏洞扫描，以发现和修复潜在的安全漏洞。\n", "title": "如何预防反序列化"}], "cnvd_id": "", "cve_id": "CVE-2026-84236", "cvss": {"cvssv31": [{"source": "psirt@us.ibm.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-502", "description": "IBM Guardium Data Protection 12.2 容易受到 SharePoint Tap MulticastTransceiver 组件中不安全反序列化的影响。未经身份验证的远程攻击者可以利用此漏洞在受影响的系统上执行任意代码。", "effects": [{"comp_name": "Guardium Data Protection", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,12.2]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "反序列化", "kind_en": "不可信数据的反序列化", "last_modified_time": "2026-11-20", "level": "Critical", "mps_id": "MPS-vcea-y8mf", "poc": false, "poc_url": [], "published_time": "2026-11-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-vcea-y8mf", "name": "https://www.oscs1024.com/hd/MPS-vcea-y8mf"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-84236", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-84236"}, {"url": "https://www.ibm.com/sup }, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-269", "description": "Nexter Blocks Pro 是 POSIMYTH 公司推出的商业 WordPress 插件（付费版插件标识 the-plus-addons-for-block-editor-pro），在 Gutenberg 块编辑器中提供登录注册、表单、弹窗、页眉页脚构建等扩展块，需与同厂商的 Nexter Blocks 免费版配合运行。\n受影响版本中，登录注册块（tp-login-register）的注册处理函数 tpgb_register_user 通过 wp_ajax_nopriv_tpgb_register_user 挂载到 admin-ajax.php，未认证请求可直接触达；参数 tpgb_acf_key[] 与 tpgb_acf[] 经 array_combine 组装为元数据数组并传入 tpgb_ajax_register_user，在其中逐项写入 update_user_meta()；该参数仅经过字节级黑名单检查，U+1E87、U+00E7 等形近字符构成的键名 ẇp_çapabilities 不匹配任何 ASCII 特征，而数据库默认排序规则 utf8mb4_unicode_ci 或 utf8mb4_0900_ai_ci 对重音不敏感，会将该键名匹配到新用户的 wp_capabilities 元数据行并覆写为 administrator；所需 nonce 公开输出在任意包含 tp-login-register 块的页面，配合插件自身的 autologin 流程，未认证攻击者可注册携带完整管理员角色的新账号，获得安装插件、修改文件与执行任意代码的站点控制权。\n修复版本中通过发布 5.0.11 修复版切断该利用链，Wordfence 公告将 5.0.11 列为修复版本，tpgb_acf_key[] 键名的字节级黑名单绕过在该版本得到修复，未认证注册请求无法再以形近 Unicode 键名覆写 wp_capabilities 元数据，新注册账号不再获得 administrator 角色。", "effects": [{"comp_name": "the-plus-addons-for-block-editor-pro", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,5.0.11)", "min_fixed_version": "5.0.11", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-11-22", "level": "Critical", "mps_id": "MPS-69ps-1ej4", "poc": false, "poc_url": [], "published_time": "2026-11-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-69ps-1ej4", "name": "https://www.oscs1024.com/hd/MPS-69ps-1ej4"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-125294", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-125294"}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/8670d9ac-e2b0-4c19-a9d7-00be23a139c4?source=cve", "name": ""}, {"url": "https://nexterwp.com", "name": ""}], "scope_influence": "", "tags": ["应用软件 X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-1284", "description": "HTSlib is a library for reading and writing bioinformatics file formats. Prior to 1.21.2, 1.22.3, 1.23.2, and 1.24, the BCF reader can experience an integer overflow in a record-length check that verifies whether a record contains enough bytes for the expected number and size of stored items. A crafted BCF record can bypass this check, causing reads beyond the stored data and, in some cases, writes beyond the heap buffer when the reader sets the least significant bit of accessed bytes. Opening such a file can crash the process, corrupt data or heap structures, and may permit arbitrary code execution. This issue is fixed in versions 1.21.2, 1.22.3, 1.23.2, and 1.24.", "effects": [{"comp_name": "htslib", "ecosystem": "linux", "versions": [{"affected_version": "[1.22.0,1.22.3)", "min_fixed_version": "1.22.3", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[1.23.0,1.23.2)", "min_fixed_version": "1.23.2", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,1.21.2)", "min_fixed_version": "1.21.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "输入中指定数量的验证不当", "kind_en": "输入中指定数量的验证不正确", "last_modified_time": "2026-11-20", "level": "High", "mps_id": "MPS-3h6p-x5wu", "poc": false, "poc_url": [], "published_time": "2026-11-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-3h6p-x5wu", "name": "https://www.oscs1024.com/hd/MPS-3h6p-x5wu"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-63390", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-63390"}, {"url": "https://github.com/samtools/htslib/commit/00a30cdb8db1f5832eb58a799383a462c6b58cb3", "name": ""}, {"url": "https://github.com/samtools/htslib/commit/2713f39242f4afff /MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:H/VA:L/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-787", "description": "HTSlib is a library for reading and writing bioinformatics file formats. Prior to 1.21.2, 1.22.3, 1.23.2, and 1.24, the CRAM decoder validates the 254-character query-name limit only after decoding the name into a 1024-byte stack array. An attacker-controlled CRAM record can provide an overlong query name and overflow the local stack buffer before the later validation runs; all CRAM format versions are affected. Opening such a file can crash the process, corrupt stack data, and may permit arbitrary code execution. This issue is fixed in versions 1.21.2, 1.22.3, 1.23.2, and 1.24.", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-11-20", "level": "High", "mps_id": "MPS-s1zb-dhye", "poc": false, "poc_url": [], "published_time": "2026-11-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-s1zb-dhye", "name": "https://www.oscs1024.com/hd/MPS-s1zb-dhye"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-62258", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-62258"}, {"url": "https://github.com/samtools/htslib/commit/25278797c251a9af789382ecf5aa0c86f417bdf5", "name": ""}, {"url": "https://github.com/samtools/htslib/commit/df93e245f1b517aec86c69684fcb2faf5942c5c2", "name": ""}, {"url": "https://github.com/samtools/htslib/commit/f1d1bf835aaafa1e511996dcd49760c36f683b17", "name": ""}, {"url": "https://github.com/samtools/htslib/pull/2046", "name": ""}, {"url": "https://github.com/samtools/htslib/releases/tag/1.21.2", "name": ""}, {"url": "https://github.com/samtools/htslib/releases/tag/1.22.3", "name": ""}, {"url": "https://github.com/samtools/htslib/releases/tag/1.23.2", "name": ""}, {"url": "https://github.com/samtools/htslib/releases/tag/1.24", "name": ""}, {"url": "https://github.com/samtools/htslib/security/advisories/GHSA-2jx2-wm7f-rv9m", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-62258 漏洞", "_translated": true, "_saved_at": "2026-11-22T04:37:29+00:00", "_first_saved_at": "2026-11-19T17:54:17+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-s1zb-dhye"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-113347", "cvss": {"cvssv3": [{"source": "vultures@jpcert.or.jp", "vector": "CVSS:3.0/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.2}], "cvssv4": [{"source": "vultures@jpcert.or.jp", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI: 输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-133874", "cvss": {"cvssv31": [{"source": "VulnCheck", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N", "severity": "high", "base_score": 8.1}], "cvssv4": [{"source": "VulnCheck", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "", "cwe": "CWE-863", "description": "Iceburg CRM 到 5.0.0 的 Module::saveRecord() 中包含一个不正确的授权漏洞，该漏洞允许经过身份验证的用户通过在请求主体密钥前添加另一个模块 ID 来写入未经授权的模块。对一个模块具有写入权限的攻击者可以向 POST /data/save 或 PUT /api/crm/{id} 提交精心设计的请求，以将其 role_id 设置为 Admin 并访问管理数据。", "effects": [{"comp_name": "iceburgcrm", "ecosystem": "linux", "versions": [{"affected_version": "(0,5.0.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-11-21", "level": "High", "mps_id": "MPS-o0d6-z3c1", "poc": false, "poc_url": [], "published_time": "2026-11-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-o0d6-z3c1", "name": "https://www.oscs1024.com/hd/MPS-o0d6-z3c1"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-133874", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-133874"}, {"url": "https://github.com/iceburgcrm/iceburgcrm/issues/28", "name": "GitHub Issue #28"}, {"url": "https://github.com/iceburgcrm/iceburgcrm", "name": ""}, {"url": "https://github.com/iceburgcrm/iceburgcrm/blob/v5.0.0/app/Models/Module.php#L283-L335", "name": ""}, {"url": "https://github.com/iceburgcrm/iceburgcrm/blob/v5.0.0/app/Http/Controllers/Api/CRMController.php#L43-L54", "name": ""}, {"url": "https://www.vulncheck.com/advisories/iceburg-crm-through-5.0.0-authorization-bypass-via-record-save", 区中注入超过其容量的数据，导致数据溢出到相邻的内存区域，可能覆盖关键数据、修改变量值或执行恶意代码。\n- 缓冲区下溢攻击：攻击者向输入缓冲区中注入少于其容量的数据，导致数据被读取时越过缓冲区边界，可能泄露敏感信息或破坏程序的正常执行流程。\n- 字符串格式化攻击：攻击者通过控制格式化字符串的输入，可以读取或写入任意内存位置，从而执行恶意操作。", "title": "缓冲区溢出常见的攻击方式"}, {"content": "- 输入验证和边界检查：对于所有接受用户输入的缓冲区操作，确保验证输入数据的长度和内容，以避免缓冲区溢出或下溢。\n- 使用安全的字符串操作函数：使用安全的字符串操作函数（如strncpy、strncat）替代不安全的函数（如strcpy、strcat），这些函数会在操作时自动限制操作的边界。\n- 使用内存安全工具：使用内存安全工具（如内存分析器、静态分析工具）来检测和修复潜在的缓冲区溢出问题。\n- 采用安全编码实践：遵循安全编码实践，如最小特权原则、避免使用不受信任的输入等。\n- 定期更新和修补程序：及时应用程序厂商提供的安全更新和补丁，以修复已知的缓冲区溢出漏洞。\n- 使用编程语言和框架提供的安全功能：利用编程语言和框架提供的安全特性，如内存安全函数、边界检查等。", "title": "如何预防缓冲区溢出"}], "cnvd_id": "", "cve_id": "CVE-2026-82342", "cvss": {"cvssv31": [{"source": "psirt@us.ibm.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.1}]}, "cvss_score": 8.1, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-119", "description": "在处理特制的 PROXY 协议 v1 标头时，IBM Guardium Data Protection 12.2 容易受到基于堆栈的缓冲区溢出的影响。远程攻击者可以利用此漏洞导致拒绝服务或可能执行任意代码。", "effects": [{"comp_name": "Guardium Data Protection", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,12.2]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "缓冲区溢出", "kind_en": "内存缓冲区范围内的操作限制不当", "last_modified_time": "2026-11-20", "level": "High", "mps_id": "MPS-uej1-wnzc", "poc": false, "poc_url": [], "published_time": "2026-11-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-uej1-wnzc", "name": "https://www.oscs1024.com/hd/MPS-uej1-wnzc"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-82342", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-82342"}, {"url": "https://www.ibm.com/support/pages/node/7297484", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-82342 漏洞", "_translated": true, "_saved_at": "2026-11-20T00:09:46+00:00", "_first_saved_at": "2026-11-20T00:09:46+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-uej1-wnzc"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-84273", "cvss": {"cvssv31": [{"source": "psirt@us.ibm.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:H/A:H", "severity": "high", "base_score": 8.1}]}, "cvss_score": 8.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:H/A:H", "cwe": "CWE-22", "description": "IBM Guardium Data Protection 12.2 在数据源功能中容易受到路径遍历的攻击。经过身份验证的攻击者可以利用此漏洞删除设备上的任意文件。", "effects": [{"comp_name": "Guardium Data Protection", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,12.2]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-11-20", "level": "High", "mps_id": "MPS-urph-qydx", "poc": false, "poc_url": [], "published_time": "2026-11-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-urph-qydx", "name": "https://www.oscs1024.com/hd/MPS-urph-qydx"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-84273", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-84273"}, {"url": "https://www.ibm.com/support/pages/node/7297484", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-84273 漏洞", "_translated": true, "_saved_at": "2026-11-20T00:09:29+00:00", "_first_saved_at": "2026-11-20T00:09:29+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-urph-qydx"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-133553", "cvss": {"cvssv31": [{"source": "secalert@redhat.com", "vector": "CVSS:3.1/AV:L/AC:H/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:H/PR:L/UI:N/S:C/C:H/I:H/A:H", "cwe": "CWE-367", "description": "A flaw was found in crun. When copying files onto a tmpfs mounted with tmpcopyup, crun opens the destination a second time by name. A container that shares a writable volume with the container being created can change that path between the two lookups, so crun copies image files onto host files, including files under /proc/sys.", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "检查时间与使用时间(TOCTOU)的竞争条件", "kind_en": "检查时间使用时间 (TOCTOU) 竞争条件", "last_modified_time": "2026-11-20", "level": "High", "mps_id": "MPS-5hmq-6yjf", "poc": false, "poc_url": [], "published_time": "2026-11-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-5hmq-6yjf", "name": "https://www.oscs1024.com/hd/MPS-5hmq-6yjf"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-133553", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-133553"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-133553", "name": ""}, {"url": "https://bugzilla.redhat.com/show_bug.cgi?id=2577547", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-133553 漏洞", "_translated": true, "_saved_at": "2026-11-22T04:37:29+00:00", "_first_saved_at": "2026-11-20T07:58:07+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-5hmq-6yjf"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "cnvd_id": "", "cve_id": "CVE-2026-84087", "cvss": {"cvssv31": [{"source": "psirt@us.ibm.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-269", "description": "IBM Guardium Data Protection 12.2 容易受到通过 Collector 设备上的 SUID-root podman_wrapper 二进制文件进行本地权限升级的攻击。对 Collector 具有低权限访问权限的本地攻击者可以利用 SUID 二进制文件中参数验证不足的问题，以 root 身份执行任意命令，从而导致 Collector 设备完全受损。", "effects": [{"comp_name": "Guardium Data Protection", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,12.2]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-11-20", "level": "High", "mps_id": "MPS-rs57-a8ux", "poc": false, "poc_url": [], "published_time": "2026-11 he growth calculation can wrap, read beyond a heap buffer, and use the resulting value as a pointer for an unchecked memory write. Any region query can trigger the flaw, causing denial of service or memory corruption. This issue is fixed in versions 1.21.2, 1.22.3, 1.23.2, and 1.24.", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "未经控制的内存分配", "kind_en": "大小值过大的内存分配", "last_modified_time": "2026-11-20", "level": "High", "mps_id": "MPS-pfol-maz2", "poc": false, "poc_url": [], "published_time": "2026-11-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-pfol-maz2", "name": "https://www.oscs1024.com/hd/MPS-pfol-maz2"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-62255", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-62255"}, {"url": "https://github.com/samtools/htslib/commit/08fbbceefdfac073e768c1fce593181ca7379222", "name": ""}, {"url": "https://github.com/samtools/htslib/commit/57e1a0763c9a5f34a1d1ab9deb3a3ad2bd8fe11d", "name": ""}, {"url": "https://github.com/samtools/htslib/commit/8a2394e63c9bdd758cc6a7de04c5e2ee7acc8e65", "name": ""}, {"url": "https://github.com/samtools/htslib/commit/924e21755d0b5db7a33f1920d20c0e441667d22f", "name": ""}, {"url": "https://github.com/samtools/htslib/pull/2029", "name": ""}, {"url": "https://github.com/samtools/htslib/releases/tag/1.21.2", "name": ""}, {"url": "https://github.com/samtools/htslib/releases/tag/1.22.3", "name": ""}, {"url": "https://github.com/samtools/htslib/releases/tag/1.23.2", "name": ""}, {"url": "https://github.com/samtools/htslib/releases/tag/1.24", "name": ""}, {"url": "https://github.com/samtools/htslib/security/advisories/GHSA-28r7-prwc-hf5c", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-62255 漏洞", "_translated": true, "_saved_at": "2026-11-22T04:37:29+00:00", "_first_saved_at": "2026-11-19T17:54:21+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-pfol-maz2"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-62256", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:N/VI:H/VA:L/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:N/VI:H/VA:L/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-787", "description": "HTSlib is a library for reading and writing bioinformatics file formats. Prior to 1.21.2, 1.22.3, 1.23.2, and 1.24, fai_retrieve does not verify that the line width recorded in a FASTA .fai index is greater than or equal to the number of bases per line. When the line width is exactly one less than the base count, retrieval allocates an undersized heap buffer and writes one byte beyond its end; larger discrepancies instead cause an allocation failure that is handled. This issue can corrupt heap memory and crash the process. This issue is fixed in versions 1.21.2, 1.22.3, 1.23.2, and 1.24.", "effects": [], "epss": -1, "exp": false, "explo nix.Channel.Server 在 PubSub 分发循环内使用每个订阅者各自的序列化器编码消息，调用 fastlane!/1 且无任何 rescue 保护，V1 JSON 序列化器对二进制元组抛出 Protocol.UndefinedError，广播进程随之崩溃，同一主题上排在攻击者之后的所有订阅者错过该消息；跨节点广播场景下该循环运行在 PubSub 适配器 worker 中，反复崩溃会超过重启强度并重启 PubSub 监督树，节点订阅注册表被清空而客户端 socket 连接仍然保持。\n修复版本中通过将 fastlane!/1 调用移入新增的带 catch 保护的私有函数 fastlane/2 切断上述因果链：编码失败时记录日志并把该序列化器标记为 :fastlane_error，仅向使用该序列化器的频道进程发送 {Phoenix.Channel.Server, :fastlane_error} 消息，由新增的 handle_info 回调以 {:shutdown, :fastlane_error} 停止对应频道并触发 phx_error 重连；广播进程与 PubSub worker 不再崩溃，其余订阅者正常收到消息，Phoenix.Socket.V1.JSONSerializer 同时为二进制载荷增加显式的 ArgumentError 子句。", "effects": [{"comp_name": "phoenix", "ecosystem": "linux", "versions": [{"affected_version": "[1.7.0-rc.0,1.7.25)", "min_fixed_version": "1.7.25", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[1.8.0-rc.0,1.8.17)", "min_fixed_version": "1.8.17", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[1.5.7,1.5.16)", "min_fixed_version": "1.5.16", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[1.6.0-rc.0,1.6.18)", "min_fixed_version": "1.6.18", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "未捕获的异常", "kind_en": "未捕获的异常", "last_modified_time": "2026-11-21", "level": "High", "mps_id": "MPS-9ubf-06p7", "poc": false, "poc_url": [], "published_time": "2026-11-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-9ubf-06p7", "name": "https://www.oscs1024.com/hd/MPS-9ubf-06p7"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-129344", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-129344"}, {"url": "https://github.com/phoenixframework/phoenix/security/advisories/GHSA-5vmc-qgf8-rw36", "name": "Client-selected V1 serializer crashes shared broadcast dispatch on binary payloads"}, {"url": "https://cna.erlef.org/c U:X", "cwe": "CWE-20", "description": "Phoenix 是 Elixir 语言的开源 Web 开发框架（GitHub 项目 phoenixframework/phoenix，MIT 许可），其 Phoenix.Presence 模块用于在频道中跟踪用户在线状态并向客户端广播存在变更。\n受影响版本中，use Phoenix.Presence 注入的 track/3,4 将任意类型的键原样传给 Phoenix.Tracker，客户端可通过频道 join 负载提供 map 等非字符串存在键；Phoenix.Presence.group/1 在列出存在信息和广播 presence_diff 时对每个键调用 to_string/1，map 键会抛出 Protocol.UndefinedError，应用定义的 fetch/2 回调同样可能因异常键抛出异常；1.7.0 及以上版本中存在 diff 在链接到跟踪分片的 Task.Supervisor.async 任务中计算，Phoenix.Presence.handle_info/2 只匹配任务成功消息，任务失败触发 FunctionClauseError 使分片进程终止，该分片跟踪的全部频道与 LiveView 进程随之退出且存在状态被清空，重复加入可耗尽重启强度并导致应用整体不可用。\n修复版本中通过在 track/4、untrack/4、update/4 与 get_by_key/3 中对存在键统一调用 to_string/1，只有字符串键进入 Phoenix.Tracker，非字符串键无法再进入跟踪器并在 group/1 中触发异常，修复随 1.5.16、1.6.18、1.7.25 与 1.8.17 发布。", "effects": [{"comp_name": "phoenix", "ecosystem": "linux", "versions": [{"affected_version": "[1.2.0,1.5.16)", "min_fixed_version": "1.5.16", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[1.6.0-rc.0,1.6.18)", "min_fixed_version": "1.6.18", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[1.7.0-rc.0,1.7.25)", "min_fixed_version": "1.7.25", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[1.8.0-rc.0,1.8.17)", "min_fixed_version": "1.8.17", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "输入验证不恰当", "kind_en": "输入验证不当", "last_modified_time": "2026-11-21", "level": "High", "mps_id": "MPS-9wpo-jmfk", "poc": false, "poc_url": [], "published_time": "2026-11-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-9wpo-jmfk", "name": "https://www.oscs1024.com/hd/MPS-9wpo-jmfk"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-128361", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-128361"}, {"url": "https://cna.erlef.org/cves/CVE-2026-128361.html", "name": ""}, {"url": "https://github.com/phoenixframework/phoenix/commit/39c1c6bfd0c817f1223c121f61c60a25f66b76cb", "name": ""}, {"url": "https://github.com/phoenixframework/phoenix/commit/44e7618370629df93711cd6169789fd0d8f3678e", "name": ""}, {"url": "https://github.com/phoenixframework/phoenix/commit/6609595fb3e37f545c4ac636a369f14b0084bc3d", "name": ""}, {"url": "https://github.com/phoenixframework/phoenix/commit/81bc0278c7a4e6204f7e2e0a3b3200e9f1ee5a4b", "name": ""}, {"url": "https://github.com/phoenixframework/phoenix/commit/edb702804aeab3a29543668a8be8ea61291c4b75", "name": ""}, {"url": "https://github.com/phoenixframework/phoenix/security/advisories/GHSA-pvfx-rx4x-phrr", "name": ""}, {"url": "https://osv.dev/vulnerability/EEF-CVE-2026-128361", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Phoenix Presence 拒绝服务漏洞", "_translated": true, "_saved_at": "2026-11-21T11:58:32+00:00", "_first_saved_at": "2026-11-21T11:58:32+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-9wpo-jmfk"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "attack_vector_type": "Local", "cnvd_id": "", "cve_id": "CVE-2026-112603", "cvss": {}, "cvss_score": 7.8, "cvss_vector": "", "cwe": "CWE-269", "description": "Apple Xcode 是 Apple 官方发布的 macOS 集成开发环境（闭源软件），Instruments 是其中随附的性能分析与调试工具组件，用于应用剖析、跟踪与性能调优。\n受影响版本中，Xcode 的 Instruments 组件存在逻辑问题，对相关特权操作缺少充分校验，本地应用可借助该缺陷获得 root 权限；Apple 官方公告未披露具体函数与判定细节，受影响的代码位置不可确认。\n修复版本中通过增强校验（improved checks）修复该逻辑问题，修复随 Xcode 27.2 发布（2026 年 10 月 29 日发布），升级后本地应用无法再借助该缺陷获得 root 权限。", "effects": [{"comp_name": "xcode", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,27.2)", "min_fixed_version": "27.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-11-21", "level": "High", "mps_id": "MPS-y04x-726g", "poc": false, "poc_url": [], "published_time": "2026-11-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-y04x-726g", "name": "https://www.oscs1024.com/hd/MPS-y04x-726g"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-112603", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-112603"}, {"url": "https://support.apple.com/en-us/149589", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "Apple Xcode 本地提权漏洞", "_translated": true, "_saved_at": "2026-11-21T03:42:21+00:00", "_first_saved_at": "2026-11-21T03:42:21+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-y04x-726g"}, {"analysis_status": 0, "articles": [], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-114023", "cvss": {}, "cvss_score": 7.7, "cvss_vector": "", "cwe": "CWE-20", "description": "macOS App Store 是 Apple macOS 系统内置的应用商店，为闭源组件，负责应用的浏览、搜索、下载与更新，并处理商店页面中的网页内容。\n受影响版本中，App Store 处理网页内容时的路径处理逻辑存在校验缺陷，攻击者可控的网页内容进入该路径处理流程后未经充分验证，处理此类内容可能导致执行任意代码。\n修复版本中通过改进路径验证消除该缺陷，Apple 已在 macOS Golden Gate 27.2、macOS Sequoia 15.8.2 与 macOS Tahoe 26.7.2 中发布修复，升级后处理网页内容不再触发任意代码执行。", "effects": [{"comp_name": "macos", "ecosystem": "linux", "versions": [{"affected_version": "[15,15.8.2)", "min_fixed_version": "15.8.2", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[27,27.2)", "min_fixed_version": "27.2", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[26,26.7.2)", "min_fixed_version": "26.7.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "输入验证不恰当", "kind_en": "输入验证不当", "last_modified_time": "2026-11-21", "level": "High", "mps_id": "MPS-mutp-9jb3", "poc": false, "poc_url": [], "published_time": "2026-11-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-mutp-9jb3", "name": "https://www.oscs1024.com/hd/MPS-mutp-9jb3"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-114023", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-114023"}, {"url": "https://support.apple.com/en-us/149521", "name": ""}, {"url": "https://support.apple.com/en-us/149522", "name": ""}, {"url": "https://support.apple.com/en-us/149523", "name": ""}], "scope_influence": "", "tags": ["操作系统"], "title": "macOS App Store 任意代码执行漏洞", "_translated": true, "_saved_at": "2026-11-21T03:42:19+00:00", "_first_saved_at": "2026-11-21T03:42:19+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-mutp-9jb3"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-131609", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "cwe": "CWE-79", "description": "Germanized for WooCommerce 是 vendidero 开发的 WordPress 开源插件（GPLv3），用于让 WooCommerce 店铺符合德国及欧盟市场的合规要求，提供结账调整、税项处理与订单撤回（withdrawal）管理等功能，其中内置的 EU Order Withdrawal Button 子模块通过公开的撤回请求表单和后台撤回列表处理客户撤回请求。\n受影响版本中，后台撤回列表 WithdrawalTable::render_order_number_column() 将买家姓名 get_formatted_full_name() 的返回值仅经 wp_kses_post() 白名单过滤后直接输出，未使用 esc_html() 做整字段转义；攻击者先通过 WooCommerce Store API 游客结账把恶意脚本写入订单账单名（billing_address.first_name），再经 /withdraw-from-contract/ 页面公开 nonce 的未认证撤回请求接口（Ajax::order_withdrawal_request）以该订单为父单提交撤回请求，WithdrawalOrder::get_first_name() 在撤回单自身未填姓名且邮箱完成双重确认验证时回退读取父订单的 billing first name，注入内容随之进入后台撤回列表的买家姓名列，wp_kses_post() 的标签白名单可被拆分标签重组方式绕过，管理员打开后台撤回列表或订单详情时脚本在其会话中执行。\n修复版本中通过将 WithdrawalTable::render_order_number_column() 中买家姓名、render_order_address_column() 的地址字段以及 Admin.php 订单页撤回明细与邮件模板中的姓名、邮箱、验证码等客户可控字段统一改为 esc_html()/esc_attr() 转义输出，不再依赖 wp_kses_post() 白名单过滤；配套提交（withdrawal button 包 2.4.8 的第二项修复）还剥离客户可控邮件占位符中的尖括号、转义拒回原因并限制后台保存撤回 AJAX 的可编辑属性，从根源消除标签重组绕过，阻止任意脚本注入并在管理员会话中执行。", "effects": [{"comp_name": "woocommerce-germanized", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,4.1.9)", "min_fixed_version": "4.1.9", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-11-21", "level": "High", "mps_id": "MPS-hf9j-36a4", "poc": false, "poc_url": [], "published_time": "2026-11-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-hf9j-36a4", "name": "https://www.oscs1024.com/hd/MPS-hf9j-36a4"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-131609", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-131609"}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/fb4ee173-8ac8-4a66-b305-2a119fdcdb6c?source=cve", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/woocommerce-germanized/tags/4.1.8/packages/eu-order-withdrawal-button-for-woocommerce/src/Admin/WithdrawalTable.php#L809", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/woocommerce-germanized/tags/4.1.8/packages/eu-order-withdrawal-button-for-woocommerce/src/Admin/WithdrawalTable.php#L807", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/woocommerce-germanized/tags/4.1.8/packages/eu-order-withdrawal-button-for-woocommerce/src/Admin/WithdrawalTable.php#L1036", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/woocommerce-germanized/tags/4.1.8/packages/eu-order-withdrawal-button-for-woocommerce/src/WithdrawalOrder.php#L249", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/woocommerce-germanized/tags/4.1.8/packages/eu-order-withdrawal-button- : "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-133367", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "cwe": "CWE-79", "description": "WPC Frequently Bought Together for WooCommerce 是 wpclever 开发的 WordPress 开源插件（GPLv2 许可，通过 WordPress.org 官方插件目录以 SVN 分发），用于在商品页展示“经常一起购买”的商品组合，并支持把组合内商品一键全部加入购物车。\n受影响版本中，includes/class-woobt.php 的 ajax_add_all_to_cart 方法通过 wc_ajax_woobt_add_all_to_cart 提供 AJAX 入口，它以 $variation = (array)( wp_unslash( $_POST['variation'] ?? [] ) ) 直接读取攻击者提交的 variation 数组，不做任何清洗或属性白名单校验，便作为第 4 个参数传入 WC()-\u003ecart-\u003eadd_to_cart()。恶意属性值随购物车项持久化并进入后续订单数据，在其他用户访问渲染该数据的页面时因输出转义不足以 Web 脚本执行。该方法虽校验 woobt-security nonce，但 enqueue_scripts 方法通过 wp_localize_script 把同一 nonce 输出给所有未登录访问者，nonce 不构成认证屏障，未认证攻击者无需登录即可调用该入口。\n修复版本中通过 8.0.3 重写 ajax_add_all_to_cart 的 variation 处理：先确认 product_id 本身是变体商品，或 variation_id 对应一个已发布且父商品等于 product_id 的变体商品，再将原始 $_POST['variation'] 交给新增的 WPCleverWoobt_Helper::sanitize_variation() 清洗，该函数只保留 attribute_ 前缀的字符串键与标量值，去除标签后按变体商品的已注册属性（分类法 term slug 或父商品自定义属性选项）做白名单比对，不匹配的值全部丢弃；不存在合法变体商品时 variation_id 归零、variation 置空。同一清洗逻辑也应用到 woobt_ids 驱动的关联商品加购路径。", "effects": [{"comp_name": "woo-bought-together", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,8.0.3)", "min_fixed_version": "8.0.3", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": " DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-134126", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:N", "severity": "medium", "base_score": 6.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-862", "description": "WPC Smart Messages for WooCommerce plugin before 4.3.6 contains a missing authorization vulnerability that allows authenticated attackers with Contributor or Author privileges to disclose arbitrary post meta and private product data by supplying attacker-controlled id and key attributes to the [wpcsm_product_field] and [wpcsm_product_data] shortcodes without any capability or protected-meta checks. Attackers can embed these shortcodes in a published post to exfiltrate sensitive order data such as billing email, phone, and address stored as post meta, as well as private or draft product descriptions and purchase notes, exposing confidential customer and business information to unauthenticated site visitors.", "effects": [{"comp_name": "WPC Smart Messages for WooCommerce", "ecosystem": "linux", "versions": [{"affected_version 、堆栈保护机制（如堆栈溢出保护）和数据执行预防（DEP）等。\n- 及时更新和修补：及时应用程序和操作系统的安全更新和补丁，以确保已知的跨界内存读漏洞得到修复。及时更新相关软件和库，以避免使用已知存在漏洞的版本。", "title": "如何预防越界读取"}], "attack_vector_type": "Local", "cnvd_id": "", "cve_id": "CVE-2026-112465", "cvss": {}, "cvss_score": 7, "cvss_vector": "", "cwe": "CWE-125", "description": "AVEVideoEncoder 是 Apple iOS、iPadOS、macOS、tvOS 与 visionOS 内置的闭源内核级视频编码组件，随操作系统默认提供，负责为应用提供硬件视频编码能力。\n受影响版本中，该内核组件处理编码相关输入时缺少充分的边界校验，设备上的本地应用可通过视频编码调用路径触发越界读取，访问超出缓冲区范围的内核内存，可能导致非预期的系统终止或内核内存信息泄露。\n修复版本中通过改进边界检查消除该越界读取，在访问编码缓冲区前补充边界校验，阻止本地应用触发越界访问；修复包含于 iOS 27.2 与 iPadOS 27.2、macOS Golden Gate 27.2、tvOS 27.2 以及 visionOS 27.2。", "effects": [{"comp_name": "ios", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,27.2)", "min_fixed_version": "27.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "ipados", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,27.2)", "min_fixed_version": "27.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "macos", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,27.2)", "min_fixed_version": "27.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "tvos", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,27.2)", "min_fixed_version": "27.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "visionos", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,27.2)", "min_fixed_version": "27.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界读取", "kind_en": "越界读取", "last_modified_time": "2026-11-21", "level": "High", "mps_id": "MPS-7s0c-okv3", "poc": false, "poc_url": [], "published_time": "2026-11-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-7s0c-okv3", "name": "https://www.oscs1024.com/hd/MPS-7s0c-okv3"}   <script>
    const payload = JSON.parse(document.getElementById("payload").textContent);
    const levelLabels = payload.level_labels || {};
    const items = payload.items || [];
    let filtered = items.slice();
    let activeId = null;

    const $ = (id) => document.getElementById(id);
    $("generatedAt").textContent = payload.generated_at || "-";
    $("retention").textContent = payload.retention_days ?? "-";
    $("cutoff").textContent = payload.cutoff_date || "-";
    $("count").textContent = String(payload.count ?? items.length);

    function levelClass(level) {
      const cn = levelLabels[level] || level || "";
      if (level === "Critical" || cn === "严重") return "crit";
      if (level === "High" || cn === "高危") return "high";
      return "other";
    }
    function levelText(level) {
      return levelLabels[level] || level || "-";
    }
    function esc(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }
    function scoreText(v) {
      if (v === null || v === undefined || v === "" || v === -1) return "-";
      return String(v);
    }

    function renderList() {
      const list = $("list");
      $("listCount").textContent = String(filtered.length);
      if (!filtered.length) {
        list.innerHTML = '<div class="empty">没有匹配项</div>';
        return;
      }
      list.innerHTML = filtered.map((it) => {
        const id = it.mps_id || it.cve_id;
        const active = id === activeId ? " active" : "";
        return `
          <button class="item${active}" data-id="${esc(id)}" type="button">
            <div class="item-top">
              <span class="cve">${esc(it.cve_id || it.mps_id || "-")}</span>
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
            </div>
            <div class="title">${esc(it.title || "-")}</div>
            <div class="item-foot">
              <span>CVSS ${esc(scoreText(it.cvss_score))}</span>
              <span>${esc(it.published_time || "-")}</span>
              ${it.poc ? "<span>POC</span>" : ""}
            </div>
          </button>`;
      }).join("");
      list.querySelectorAll(".item").forEach((btn) => {
        btn.addEventListener("click", () => selectById(btn.dataset.id));
      });
    }

    function refsHtml(it) {
      const refs = Array.isArray(it.reference_url_list) ? it.reference_url_list : [];
      const links = [];
      if (it._source_page) links.push({ url: it._source_page, name: "OSCS 详情" });
      if (it.cve_id) links.push({ url: `https://nvd.nist.gov/vuln/detail/${it.cve_id}`, name: "NVD" });
      refs.forEach((r) => {
        if (r && r.url) links.push({ url: r.url, name: r.name || r.url });
      });
      const seen = new Set();
      const uniq = [];
      for (const l of links) {
        if (seen.has(l.url)) continue;
        seen.add(l.url);
        uniq.push(l);
      }
      if (!uniq.length) return '<div class="box">无参考链接</div>';
      return `<div class="refs">${uniq.map((l) =>
        `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name || l.url)}</a>`
      ).join("")}</div>`;
    }

    function articlesHtml(it) {
      const arts = Array.isArray(it.articles) ? it.articles : [];
      if (!arts.length) return "";
      return `<div class="section"><h3>相关说明</h3>${arts.map((a) => `
        <div class="article">
          <h4>${esc(a.title || "说明")}</h4>
          <p>${esc(a.content || "")}</p>
        </div>`).join("")}</div>`;
    }

    function renderDetail(it) {
      const detail = $("detail");
      if (!it) {
        detail.innerHTML = '<div class="empty">暂无数据</div>';
        return;
      }
      const pocUrls = Array.isArray(it.poc_url) ? it.poc_url : [];
      detail.innerHTML = `
        <div class="d-head">
          <div>
            <h1 class="d-title">${esc(it.title || "-")}</h1>
            <div class="ids">
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
              <span class="chip">${esc(it.cve_id || "无 CVE")}</span>
              <span class="chip">${esc(it.mps_id || "-")}</span>
              ${it.poc ? '<span class="chip">有 POC</span>' : ""}
              ${it.exp ? '<span class="chip">有 EXP</span>' : ""}
            </div>
          </div>
          <div class="actions">
            ${it._source_page ? `<a class="btn" href="${esc(it._source_page)}" target="_blank" rel="noopener">OSCS</a>` : ""}
            ${it.cve_id ? `<a class="btn" href="https://nvd.nist.gov/vuln/detail/${esc(it.cve_id)}" target="_blank" rel="noopener">NVD</a>` : ""}
          </div>
        </div>
        <div class="grid">
          <div class="stat"><div class="k">CVSS</div><div class="v">${esc(scoreText(it.cvss_score))}</div></div>
          <div class="stat"><div class="k">向量</div><div class="v">${esc(it.cvss_vector || "-")}</div></div>
          <div class="stat"><div class="k">CWE</div><div class="v">${esc(it.cwe || "-")}</div></div>
          <div class="stat"><div class="k">类型</div><div class="v">${esc(it.kind || it.kind_en || "-")}</div></div>
          <div class="stat"><div class="k">公开</div><div class="v">${esc(it.published_time || "-")}</div></div>
          <div class="stat"><div class="k">利用成本</div><div class="v">${esc(it.exploit_requirement_cost || "-")}</div></div>
          <div class="stat"><div class="k">可利用性</div><div class="v">${esc(it.exploitability || "-")}</div></div>
          <div class="stat"><div class="k">修复建议</div><div class="v">${esc(it.fix_suggestion || "-")}</div></div>
        </div>
        <div class="section"><h3>描述</h3><div class="box">${esc(it.description || "无描述")}</div></div>
        ${it.scope_influence ? `<div class="section"><h3>影响范围</h3><div class="box">${esc(it.scope_influence)}</div></div>` : ""}
        ${pocUrls.length ? `<div class="section"><h3>POC 链接</h3><div class="refs">${pocUrls.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join("")}</div></div>` : ""}
        <div class="section"><h3>参考链接</h3>${refsHtml(it)}</div>
        ${articlesHtml(it)}
      `;
    }

    function selectById(id) {
      const it = filtered.find((x) => (x.mps_id || x.cve_id) === id) ||
                 items.find((x) => (x.mps_id || x.cve_id) === id);
      if (!it) return;
      activeId = it.mps_id || it.cve_id;
      renderList();
      renderDetail(it);
      const btn = document.querySelector(`.item[data-id="${CSS.escape(activeId)}"]`);
      if (btn) btn.scrollIntoView({ block: "nearest" });
      history.replaceState(null, "", "#" + encodeURIComponent(activeId));
    }

    function applyFilter(q) {
      const query = (q || "").trim().toLowerCase();
      filtered = !query ? items.slice() : items.filter((it) => {
        const blob = [
          it.cve_id, it.mps_id, it.title, it.kind, it.kind_en, it.cwe, it.description, it.level
        ].map((x) => String(x || "").toLowerCase()).join(" ");
        return blob.includes(query);
      });
      renderList();
      if (filtered.length) {
        const still = filtered.some((x) => (x.mps_id || x.cve_id) === activeId);
        selectById(still ? activeId : (filtered[0].mps_id || filtered[0].cve_id));
      } else {
        activeId = null;
        renderDetail(null);
      }
    }

    $("search").addEventListener("input", (e) => applyFilter(e.target.value));

    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement !== $("search")) {
        e.preventDefault();
        $("search").focus();
        return;
      }
      if (!filtered.length) return;
      const idx = filtered.findIndex((x) => (x.mps_id || x.cve_id) === activeId);
      if (e.key === "ArrowDown") {
        e.preventDefault();
        const next = filtered[Math.min(filtered.length - 1, Math.max(0, idx) + 1)];
        selectById(next.mps_id || next.cve_id);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        const prev = filtered[Math.max(0, idx - 1)];
        selectById(prev.mps_id || prev.cve_id);
      }
    });

    const hashId = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    if (hashId && items.some((x) => (x.mps_id || x.cve_id) === hashId)) {
      activeId = hashId;
      renderList();
      selectById(hashId);
    } else if (items.length) {
      selectById(items[0].mps_id || items[0].cve_id);
    } else {
      renderList();
      renderDetail(null);
    }
  </script>
</body>
</html>
