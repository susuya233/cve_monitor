", "_translated": true, "_saved_at": "2026-09-20T20:08:53+00:00", "_first_saved_at": "2026-09-20T20:08:53+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-e8d3-tzua"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-88854", "cvss": {"cvssv4": [{"source": "security@joomla.org", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-89", "description": "OrdaSoft Joomla Gallery（亦称 OS Gallery）是 OrdaSoft 发布的开源 Joomla 相册扩展，用于在站点前台创建响应式图片与视频相册，并随安装包提供前台搜索模块 mod_osgallery_search；官方同时维护免费组件 com_osgallery_light 与完整组件 com_osgallery。\n受影响版本中，前台组件入口在 task 为 searhResult 或 loadMore*Search 时调用 osGalleryHelperSite 的 showSearchResult() 与 showSearchResultAjax()。这两处使用 $input-\u003egetVar() 读取 textsearch 或 searchText 请求参数；getVar() 并非 Joomla 输入过滤 API，回落后只剥离 HTML 标签，不处理引号与 SQL 语法。该值随后被直接拼入 LIKE 子句且未经转义。未登录访问者可通过已发布的搜索框或等价请求注入 UNION SELECT，读取任意数据库内容。\n修复版本中通过在 showSearchResult() 与 showSearchResultAjax() 将搜索关键字改为 protectInjection() 读取，并在拼入 LIKE 条件前执行数据库 quote，切断未转义搜索词进入 SQL 的路径。", "effects": [{"comp_name": "com_osgallery", "ecosystem": "linux", "versions": [{"affected_version": "[1.0.0,6.2.7)", "min_fixed_version": "6.2.7", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "com_osgallery_light", "ecosystem": "linux", "versions": [{"affected_version": "[1.0.0,6.2.7)", "min_fixed_version": "6.2.7", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-09-21", "level": "Critical", "mps_id": "MPS-0y29-esqz", "poc": false, "poc_url": [], "published_time": "2026-09-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-0y29-esqz", "name": "https://www.oscs1024.com/hd/MPS-0y29-esqz"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-88854", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-88854"}, {"url": "https://www.OrdaSoft.com/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "OS Gallery未认证SQL注入", "_translated": true, "_saved_at": "2026-09-20T20:08:54+00:00", "_first_saved_at": "2026-09-20T20:08:54+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-0y29-esqz"}, {"analysis_status": 0, "articles": [{"content": "- 命令注入是一种攻击，其目标是通过易受攻击的应用程序在主机操作系统上执行任意命令。 当应用程序将不安全的用户提供的数据（表单、cookie、HTTP 标头等）传递到系统 shell 时，就会产生缺陷。攻击者通过构造恶意的命令或数据，将其注入到程序执行的上下文中，从而绕过程序的输入验证和安全措施，实现对程序操作的恶意操作。", "title": "什么是命令注入"}, {"content": "- 文件上传：攻击者通过构造恶意的文件上传请求，将包含恶意命令的文件上传到服务器，从而利用命令注入漏洞执行恶意命令。\n- SQL 注入：攻击者通过构造恶意的 SQL 查询语句，将包含恶意命令的 SQL 语句注入到数据库中，从而执行恶意命令，窃取数据或者破坏系统。\n- 命令执行：攻击者通过在 Web 应用程序的表单提交数据中注入恶意命令，从而执行恶意命令，例如删除文件、格式化硬盘等。\n- 命令注入漏洞的旁路攻击：攻击者可以利用命令注入漏洞旁路控制程序的执行流程，从而窃取数据、破坏系统、控制程序等。\n", "title": "命令注入常见的攻击方式"}, {"content": "- 输入验证：在程序输入处对输入数据进行严格的验证和过滤，确保输入数据符合预期的格式和类型，避免被攻击者注入恶意命令。\n- 输出过滤：在程序输出处对输出数据进行严格的过滤和检查，确保输出数据符合预期的格式和类型，避免被攻击者截获和篡改。\n- 使用安全的编程模型：使用安全的编程模型，例如避免使用原生的命令执行方式，使用安全的框架和库来处理输入数据和执行命令，避免命令注入漏洞。\n- 数据库加密和访问控制：对于敏感数据和命令，使用加密和访问控制措施，确保只有授权用户可以访问和执行命令，避免被攻击者窃取和篡改。\n- 定期更新和升级：定期更新和升级应用程序和库的版本，确保应用程序和库的最新版本包含了最新的安全补丁和修复措施，避免安全漏洞的出现和利用。\n- 安全审计和监控：定期对系统和应用程序进行安全审计和监控，及时发现和阻止潜在的安全漏洞和攻击，确保系统和数据的安全和可靠性。", "title": "如何预防命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-94097", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:N/AC:L/Au:N/C:C/I:C/A:C", "severity": "high", "base_score": 10}], "cvssv3": [{"source": "VulDB", "vector": "CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H/E:P/RL:X/RC:R", "severity": "critical", "base_score": 10}], "cvssv31": [{"source": "cna@vuldb.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 10}], "cvssv4": [{"source": "cna@vuldb.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-77", "description": "Netcore NBR200V2 是磊科（Netcore）闭源商用宽带路由器，用于网络接入、NAT 与设备管理，固件 Web 管理面提供 CGI 诊断接口。\n受影响版本中，CGI 诊断脚本 /www/cgi-bin/network_tools 在校验 sid 之前解析 QUERY_STRING，将片段拆成 param、key、val 后执行 eval \"${key}='${val}'\"。参数名未限制为安全白名单，远程攻击者可在 HTTP 查询串的 key 中嵌入 shell 元字符，使请求在进入后续 ping/traceroute 处理及会话校验前即被当作命令执行，造成设备重启、拒绝服务或任意代码执行。\n修复版本中通过取消或约束 QUERY_STRING 解析阶段对 key 的 eval 动态赋值，并让会话校验先于参数解释，切断未授权命令注入。截至本报告分析时厂商未回应且未发布公开修复版本，在官方固件更新前应限制对该诊断端点的访问。", "effects": [{"comp_name": "NBR200V2", "ecosystem": "linux", "versions": [{"affected_version": "[1.3.241127.071246,1.3.241127.071246]", "min_fixed_version": llPlugin 或 UpgradeAll，plugins/plugins/tasks.py 中的对应 run 方法没有插件管理权限检查。InstallPlugin 与 UnInstallPlugin 把调用方传入的 name、version 直接拼成 pip 包规格，任务进程在 root 身份下执行 pip，低权限账户可借此安装、卸载或升级插件，并在主机上以 root 执行代码。\n修复版本中通过在 InstallPlugin.run、UpgradeAll.run 与 UnInstallPlugin.run 上分别强制 plugins:install、plugins:upgrade、plugins:uninstall 权限，并在拼接包规格前拒绝不符合允许字符集的 name 与 version，同时将 pip install 限定到官方索引且不拉取依赖，使未获授权的账户无法再通过该任务接口以 root 安装软件包。", "effects": [{"comp_name": "ajenti", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.2.16)", "min_fixed_version": "2.2.16", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "ajenti.plugin.plugins", "ecosystem": "pip", "versions": [{"affected_version": "(-∞,0.55)", "min_fixed_version": "0.55", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-09-22", "level": "Critical", "mps_id": "MPS-xd2m-wefg", "poc": false, "poc_url": [], "published_time": "2026-09-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-xd2m-wefg", "name": "https://www.oscs1024.com/hd/MPS-xd2m-wefg"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-79920", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-79920"}, {"url": "https://github.com/ajenti/ajenti/security/advisories/GHSA-j8xf-5fw2-f99q", "name": "https://github.com/ajenti/ajenti/security/advisories/GHSA-j8xf-5fw2-f99q"}, {"url": "https://github.com/ajenti/ajenti/commit/3a8cbee32df4c5033796f19af4210011163a6f6e", "name": "https://github.com/ajenti/ajenti/commit/3a8cbee32df4c5033796f19af4210011163a6f6e"}, {"url": "https://github.com/ajenti/ajenti/commit/f07f02e0cdeeb3e528c1d5af28e27fd11623c49c", "name": "https://github.com/ajenti/ajenti/commit/f07f02e0cdeeb3e528c1d5af28e27fd11623c49c"}, {"url": "https://github.com/ajenti/ajenti/releases/tag/v2.2.16", "name": "https:/ 26-25254"}, {"url": "https://docs.qualcomm.com/product/publicresources/securitybulletin/may-2026-bulletin.html", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "高通软件中心远程代码执行", "_translated": true, "_saved_at": "2026-09-22T10:46:52+00:00", "_first_saved_at": "2026-09-22T10:46:52+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-hv4g-2bwz"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-95675", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-78", "description": "D-Link DAP-1360 是闭源无线范围扩展器产品的固件，通过内置 Web 管理接口完成无线接入与设备配置。\n受影响版本中，bin/httpd 的 formSystemCheck 在不校验凭据的情况下读取 ipv4_ping，并把该参数未经过滤拼入 ping 命令后交给 system 执行，远程攻击者无需登录便能在设备上以 root 执行系统命令，进而修改配置并将设备作为进入本地网络的跳板。\n修复版本中通过停止固件维护来结束支持，并未改写 formSystemCheck 对 ipv4_ping 的命令拼接。厂商公告 SAP10451 确认全部硬件版本已于 2020-08-20 进入 EOL/EOS，建议退役并更换设备，以撤除仍对未认证请求执行系统命令的 Web 管理接口。", "effects": [{"comp_name": "dap-1360_firmware", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,6.14]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-09-22", "level": "Critical", "mps_id": "MPS-brfh-3uwa", "poc": false, "poc_url": [], "published_time": "2026-09-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-brfh-3uwa", "name": "https://www.oscs1024.com/hd/MPS-brfh-3uwa"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-95675", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-95675"}, {"url": "https://supportannouncement.us.dlink.com/security/publication.aspx?name=SAP10451", "name": "Vendor EOL Acknowledgement"}, {"url": "https://www.d6fault.dev/blog/dlink-dap1360-os-command-injection", "name": "Reporter Blog"}, {"url": "https://www.vulncheck.com/advisories/d-link-dap-1360-unauthenticated-rce-via-web-management-interface", "name": "VulnCheck Advisory"}], "scope_influence": "", "tags": ["应用软件"], "title": "DAP-1360命令注入漏洞", "_translated": true, "_saved_at": "2026-09-22T15:20:38+00:00", "_first_saved_at": "2026-09-22T15:20:38+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-brfh-3uwa"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "cnvd_id": "", "cve_id": "CVE-2026-94425", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:L/AC:L/Au:S/C:C/I:C/A:C", "severity": "medium", "base_score": 6.8}], "cvssv3": [{"source": "VulDB", "vector": "CVSS:3.0/AV:L/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H/E:X/RL:X/RC:R", "severity": "high", "base_score": 8.8}], "cvssv31": [{"source": "cna@vuldb.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}], "cvssv4": [{"source": "cna@vuldb.com", "vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-269", "description": "Moore Threads MTT S80 Driver Package 是摩尔线程发布的闭源 Windows 图形驱动软件包，用于在 Windows 上为 MTT S80 显卡提供显示与图形驱动能力，其中 mtdispkm64.sys 是其内核态显示驱动库。\n受影响版本中，IOCTL Handler 组件内库 mtdispkm64.sys 的函数 sub_140006F0C 存在不当权限管理。利用必须在本地进行，低权限主体对该处理路径的操纵会导致特权约束失效，并影响超出该驱动组件边界的机密性、完整性与可用性。\n修复版本中通过何种代码变更切断该权限管理缺陷尚未公布。公开记录仅确认厂商在披露前已收到通知且未回应，没有可核验的修复版本或修复提交。", "effects": [{"comp_name": "mtt_s80_driver_package", "ecosystem": "linux", "versions": [{"affected_version": "[340.150,340.1 建 Pod 权限的用户可以借助恶意 checkpoint 镜像获得更高权限执行。\n修复版本中通过将 DefaultConfig 里 container_level_enabled 的默认值改为 checkpoint_only，并让 CreateContainer 仅在 RestoreContainerEnabled() 为真时进入恢复路径，从而在默认配置下阻断从恶意 checkpoint 镜像恢复的利用链。", "effects": [{"comp_name": "github.com/cri-o/cri-o", "ecosystem": "go", "versions": [{"affected_version": "[1.35.0,1.35.9)", "min_fixed_version": "1.35.9", "repository": "go", "solutions": [], "upstream": true}, {"affected_version": "[1.34.0,1.34.14)", "min_fixed_version": "1.34.14", "repository": "go", "solutions": [], "upstream": true}, {"affected_version": "[1.36.0,1.36.6)", "min_fixed_version": "1.36.6", "repository": "go", "solutions": [], "upstream": true}]}, {"comp_name": "openshift_container_platform", "ecosystem": "linux", "versions": [{"affected_version": "[4.17,+∞)", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "带着不必要的权限执行", "kind_en": "使用不必要的权限执行", "last_modified_time": "2026-09-21", "level": "High", "mps_id": "MPS-6w2m-tg49", "poc": false, "poc_url": [], "published_time": "2026-09-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-6w2m-tg49", "name": "https://www.oscs1024.com/hd/MPS-6w2m-tg49"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-92574", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-92574"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-92574", "name": ""}, {"url": "https://bugzilla.redhat.com/show_bug.cgi?id=2535436", "name": "RHBZ#2535436"}], "scope_influence": "", "tags": ["go", "应用软件"], "title": "CRI-O安全上下文绕过", "_translated": true, "_saved_at": "2026-09-21T11:43:36+00:00", "_first_saved_at": "2026-09-21T11:43:36+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-6w2m-tg49"}, {"analysis_status": 0, "articles": [{"content": "- 命令注入是一种攻击，其目标是通过易受攻击的应用程序在主机操作系统上执行任意命令。 当应用程序将不安全的用户提供的数据（表单、cookie、HTTP 标头等）传递到系统 shell 时，就会产生缺陷。攻击者通过构造恶意的命令或数据，将其注入到程序执行的上下文中，从而绕过程序的输入验证和安全措施，实现对程序操作的恶意操作。", "title": "什么是命令注入"}, {"content": "- 文件上传：攻击者通过构造恶意的文件上传请求，将包含恶意命令的文件上传到服务器，从而利用命令注入漏洞执行恶意命令。\n- SQL 注入：攻击者通过构造恶意的 SQL 查询语句，将包含恶意命令的 SQL 语句注入到数据库中，从而执行恶意命令，窃取数据或者破坏系统。\n- 命令执行：攻击者通过在 Web 应用程序的表单提交数据中注入恶意命令，从而执行恶意命令，例如删除文件、格式化硬盘等。\n- 命令注入漏洞的旁路攻击：攻击者可以利用命令注入漏洞旁路控制程序的执行流程，从而窃取数据、破坏系统、控制程序等。\n", "title": "命令注入常见的攻击方式"}, {"content": "- 输入验证：在程序输入处对输入数据进行严格的验证和过滤，确保输入数据符合预期的格式和类型，避免被攻击者注入恶意命令。\n- 输出过滤：在程序输出处对输出数据进行严格的过滤和检查，确保输出数据符合预期的格式和类型，避免被攻击者截获和篡改。\n- 使用安全的编程模型：使用安全的编程模型，例如避免使用原生的命令执行方式，使用安全的框架和库来处理输入数据和执行命令，避免命令注入漏洞。\n- 数据库加密和访问控制：对于敏感数据和命令，使用加密和访问控制措施，确保只有授权用户可以访问和执行命令，避免被攻击者窃取和篡改。\n- 定期更新和升级：定期更新和升级应用程序和库的版本，确保应用程序和库的最新版本包含了最新的安全补丁和修复措施，避免安全漏洞的出现和利用。\n- 安全审计和监控：定期对系统和应用程序进行安全审计和监控，及时发现和阻止潜在的安全漏洞和攻击，确保系统和数据的安全和可靠性。", "title": "如何预防命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-94096", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:N/AC:L/Au:S/C:C/I:C/A:C", "severity": "high", "base_score": 9}], "cvssv3": [{"source": "VulDB", "vector": "CVSS:3.0/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H/E:P/RL:X/RC:R", "severity": "critical", "base_score": 9.9}], "cvssv31": [{"source": "cna@vuldb.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.9}], "cvssv4": [{"source": "cna@vuldb.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-77", "description": "Netcore NBR200V2 是网是科技（Netcore）推出的商用路由器产品，固件闭源，用于企业路由与局域网管理，并对外提供 ubus JSON-RPC 接口。\n受影响版本中，LAN IP 临时配置方法 network_tools.tools_tmpset 在 /usr/bin/network_tools 的 sub_4017C0 内处理请求：仅当 iface 为 lan 时，将攻击者完全可控且未经 IP 字面量校验的 ipv4 拼入 ifconfig 命令，再调用 system() 执行。远程攻击者在持有 ubus 会话后，可向 POST /ubus 发送 JSON-RPC 调用并执行任意 shell 命令。\n修复版本中通过尚未发布的官方补丁才能切断 ipv4 进入 system() 的命令拼接路径；厂商未回应披露，公开资料未给出修复代码。在官方修复发布前，应限制 /ubus 管理接口的远程访问，并将 ipv4 限制为合法 IP 字面量。", "effects": [{"comp_name": "nbr200v2", "ecosystem": "linux", "versions": [{"affected_version": "[1.3.241127.071246,1.3.241127.071246]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "命令注入", "kind_en": "命令中使用的特殊元素的不正确中和（“命令注入”）", "last_modified_time": "2026-09-21", "level": "High", "mps_id": "MPS-fcju-lwd8", "poc": false, "poc_url": [], "published_time": "2026-09-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-fcju-lwd8", "name": "https://www.oscs1024.com/hd/MPS-fcju-lwd8"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-94096", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-94096"}, {"url": "https://vuldb.com/vuln/408025", "name": "VDB-408025 | Netcore NBR200V2 LAN IP Configuration network_tools command injection"}, {"url": "https://vuldb.com/vuln/408025/cti", "name": "VDB-408025 | CTI Indicators (IOB, IOC, TTP, IOA)"}, {"url": "https://vuldb.com/cve/CVE-2026-94096", "name": "CVE-2026-94096 | CVE Analysis and Report"}, {"url": "https://vuldb.com/submit/892988", "name": "Submit #892988 | netcore NBR200V2 V1.3.241127.071246 Command Injection"}, {"url": "https://app.notion.com/p/Netcore-NBR200V2-Vul-4-39f797159f158004b8baf1bbf3b956ca", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "NBR200V2命令注入漏洞", "_translated": true, "_saved_at": "2026-09-21T00:45:42+00:00", "_first_saved_at": "2026-09-21T00:45:42+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-fcju-lwd8"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-88855", "cvss": {"cvssv4": [{"source": "security@joomla.org", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-89", "description": "OrdaSoft Joomla Gallery 是 OrdaSoft 提供的 Joomla 图库扩展，包含免费版 com_osgallery_light 与付费版 com_osgallery，用于在站点后台创建和管理相册、分类与图片。该扩展以厂商发行包形式分发，源码仓库未作为 GitHub 公开项目提供。\n受影响版本中，saveGallery() 将表单数据经自写解析器写入 Joomla Input 对象，再以 ARRAY/STRING 过滤器读回，这两类过滤器不会净化 SQL 内容。category_names[]、catOrderIds 以及图片排序字段被直接拼入 SQL，缺少引号包裹与整数转换。具备 core.manage 权限的图库组件管理用户（该权限仅覆盖单个图库组件，不等于全站管理员）可对数据库进行读写，包括通过 UNION 提取 #__users 密码哈希。\n修复版本中通过官方安全更新收紧 saveGallery() 对上述表单字段进入 SQL 的处理，阻断未净化输入再被拼接执行。公开资料未披露更细粒度的源码修改，建议升级至 6.2.7 及以上版本。", "effects": [{"comp_name": "com_osgallery", "ecosystem": "linux", "versions": [{"affected_version": "[1.0.0,6.2.7)", "min_fixed_version": "6.2.7", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "com_osgallery_light", "ecosystem": "linux", 限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "attack_vector_type": "Local", "cnvd_id": "", "cve_id": "CVE-2026-95511", "cvss": {"cvssv31": [{"source": "secalert@redhat.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:H/UI:N/S:C/C:H/I:H/A:H", "severity": "high", "base_score": 8.2}]}, "cvss_score": 8.2, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:H/UI:N/S:C/C:H/I:H/A:H", "cwe": "CWE-269", "description": "CUPS 是 OpenPrinting 维护的开源打印系统，负责接收打印作业并调度后端；cups-filters 是配套开源组件，提供过滤器以及 serial 等设备后端。\n受影响版本中，cupsdProcessIPPRequest 接收 CUPS-Add-Modify-Printer 请求后，add_printer 仅对 file 方案的 device-uri 应用 FileDevice 路径限制，其他方案只确认 ServerBin/backend 下对应后端存在且可执行。lpadmin 组成员可指定 serial 设备 URI 的路径分量。cupsdContinueJob 在后端文件权限不包含组写、其他写和其他执行时以 root 启动该后端，serial backend 的 main 按 URI 资源路径打开设备并写入作业数据，从而把提交的打印内容写入任意文件，并可进一步改写受保护的 CUPS 安全配置，最终以 root 执行代码。\n修复版本中通过补上非 file 设备 URI 的路径限制，切断 root 权限后端把作业数据写入任意路径的链路。截至 2026-09-22，Red Hat Bugzilla 2537749 记载上游尚未提供该修复，已核对的 OpenPrinting cups 与 cups-filters master 分支也没有对应提交；在官方修复发布前，可移除 serial backend 或调整其权限使 cupsd 不再以 root 运行，限制 lpadmin 与 SystemGroup 成员，并保持 FileDevice 关闭以及 SELinux enforcing。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-09-22", "level": "High", "mps_id": "MPS-3bin-pq0x", "poc": false, "poc_url": [], "published_time": "2026-09-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-3bin-pq0x", "name": "https://www.oscs1024.com/hd/MPS-3bin-pq0x"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-95511", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-95511"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-95511", "name": ""}, {"url": "https://bugzilla.redhat.com/show_bug.cgi?id=2537749", "name": "RHBZ#2537749"}, {"url": "https://github.com/v12-security/pocs/tree/main/cups/cups2root", "name": ""}], "scope_influence": "", "tags": [], "title": "CUPS串口后端提权", "_translated": true, "_saved_at": "2026-09-22T10:46:53+00:00", "_first_saved_at": "2026-09-22T10:46:53+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-3bin-pq0x"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-77560", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N", "severity": "high", "base_score": 8.1}]}, "cvss_score": 8.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N", "cwe": "CWE-863", "description": "Tinyauth 是开源认证与授权服务器，部署在反向代理之前，为多个应用提供统一登录和按应用访问控制。\n受影响版本中，proxyHandler 使用未经大小写规范化的转发主机名查找按应用访问控制。5.1.2 之前，lookupStaticACLs 或 Docker GetLabels、Kubernetes 域名索引至少有一条路径仍以大小写敏感的字符串相等比较主机名；比较未命中时得不到该应用的用户、用户组、OAuth、LDAP 和 IP 限制。v5.0.7 的 GetLabels 在未命中时返回空 App 且 error 为 nil，proxyHandler 把空限制当作允许，已登录但未被该应用允许的用户改变主机名大小写即可获得已认证结果。未认证请求仍进入登录，全局登录白名单不被绕过。\n修复版本中通过 getACLs 将静态配置、Docker 与 Kubernetes 标签交给 DomainValidator.Validate，由 formatHostname 把主机名转为小写并去掉末尾点号后再比较，大小写不同的等价主机名会命中原有访问控制，被排除的已登录用户不再因查找落空获得放行。", "effects": [{"comp_name": "github.com/steveiliop56/tinyauth", "ecosystem": "go", "versions": [{"affected_version": "(-∞,5.1.0)", "min_fixed_version": "5.1.0", "repository": "go", "solutions": [], "upstream": true}]}, {"comp_name": "github.com/tinyauthapp/tinyauth", "ecosystem": "go", "versions": [{"affected_version": "[5.1.0,5.1.2)", "min_fixed_version": "5.1.2", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-09-22", "level": "High", "mps_id": "MPS-4lwt-so1b", "poc": false, "poc_url": [], "published_time": "2026-09-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-4lwt-so1b", "name": "https://www.oscs1024.com/hd/MPS-4lwt-so1b"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-77560", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-77560"}, {"url": "https://github.com/tinyauthapp/tinyauth/security/advisories/GHSA-328g-jx67-v94g", "name": "https://github.com/tinyauthapp/tinyauth/security/advisories/GHSA-328g-jx67-v94g"}, {"url": "https://github.com/tinyauthapp/tinyauth/pull/1000", "name": "https://github.com/tinyauthapp/tinyauth/pull/1000"}, {"url": "https://github.com/tinyauthapp/tinyauth/pull/1028", "name": "https://github.com/tinyauthapp/tinyauth/pull/1028"}, {"url https://nvd.nist.gov/vuln/detail/CVE-2026-76898", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-76898"}, {"url": "https://github.com/jgraph/drawio/security/advisories/GHSA-m3q9-cwfq-hcjc", "name": "https://github.com/jgraph/drawio/security/advisories/GHSA-m3q9-cwfq-hcjc"}, {"url": "https://github.com/jgraph/drawio/commit/73c4a91196246bbdb60f52b15871e82006b7972d", "name": "https://github.com/jgraph/drawio/commit/73c4a91196246bbdb60f52b15871e82006b7972d"}, {"url": "https://github.com/jgraph/drawio/releases/tag/v30.3.8", "name": "https://github.com/jgraph/drawio/releases/tag/v30.3.8"}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "draw.io SSRF漏洞", "_translated": true, "_saved_at": "2026-09-21T17:39:51+00:00", "_first_saved_at": "2026-09-21T17:39:51+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-zjyn-0ghw"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-94117", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:C/C:H/I:N/A:L", "severity": "high", "base_score": 7.6}]}, "cvss_score": 7.6, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:C/C:H/I:N/A:L", "cwe": "CWE-89", "description": "HashBar（插件标识 hashbar-wp-notification-bar）是 DevItems 发布的开源 WordPress 插件，用于在站点中创建通知栏、公告栏和弹窗活动。\n受影响版本中，具备 manage_options 权限的调用方可通过 REST 路由 hashbar/v1/notifications/\u003cid\u003e 进入 hashbar_update_notification，将 notification_enable_options 的数组键直接写入文章元数据键名。随后对 hashbar/v1/duplicate-post 的 hashbar_duplicate_post 会读取该文章的全部 postmeta，把未转义的 meta_key 与仅经 addslashes 处理的 meta_value 拼入 INSERT ... SELECT 语句，元数据中的引号可突破 SQL 字符串并形成盲注，进而读取数据库内容。\n修复版本中通过将 postmeta 查询改为 $wpdb-\u003eprepare 占位符，并改用 add_post_meta 逐条复制元数据，不再拼接 UNION ALL 原始 SQL，切断元数据键值进入查询语句的路径。", "effects": [{"comp_name": "hashbar-wp-notification-bar", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.0.4)", "min_fixed_version": "2.0.4", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-09-22", "level": "High", "mps_id": "MPS-bx76-d0qw", "poc": false, "poc_url": [], "published_time": "2026-09-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-bx76-d0qw", "name": "https://www.oscs1024.com/hd/MPS-bx76-d0qw"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-94117", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-94117"}, {"url": "https://patchstack.com/database/wordpress/plugin/hashbar-wp-notification-bar/vulnerability/wordpress-hashbar-wordpress-notification-bar-plugin-2-0-3-sql-injection-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "HashBar盲SQL注入", "_translated": true, "_saved_at": "2026-09-22T10:46:44+00:00", "_first_saved_at": "2026-09-22T10:46:44+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-bx76-d0qw"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "cnvd_id": "", "cve_id": "CVE-2026-73513", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-416", "description": "Envoy 是开源边缘与服务代理，用于云原生应用的流量接入与上游转发。\n受影响版本中，可选 oghttp2 上游 HTTP/2 编解码会接受未设置 END_STREAM 的响应 trailer HEADERS。ConnectionImpl::onHeaders 在 Headers 状态下仍调用 decodeTrailers，请求完成路径延迟删除 ActiveRequest，而 oghttp2 不关闭该流，ClientStreamImpl 中的 response_decoder_ 成为悬空引用，后续帧通过已释放对象派发并造成进程崩溃。默认 nghttp2 会在库内拒绝这类 trailer；1.37 及以上受影响版本需显式打开运行时特性 envoy.reloadable_features.http2_use_oghttp2，1.36 及更早版本该特性默认启用。\n修复版本中通过在 OgHttp2Session::PassthroughHeadersHandler::OnHeaderBlockEnd 校验 trailer 必须带有 END_STREAM，缺失时返回 HEADER_HTTP_MESSAGING 并重置流，使不合规 trailer 无法进入请求完成与对象释放路径。", "effects": [{"comp_name": "envoy", "ecosystem": "linux", "versions": [{"affected_version": "[1.37.0,1.37.6)", "min_fixed_version": "1.37.6", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,1.36.10)", "min_fixed_version": "1.36.10", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[1.38.0,1.38.4)", "min_fixed_version": "1.38.4", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[1.39.0,1.39.1)", "min_fixed_version": "1.39.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "UAF", "kind_en": "免费后使用", "last_modified_time": "2026-09-22", "level": "High", "mps_id": "MPS-3xkc-e4yi", "poc": false, "poc_url": [], "published_time": "2026-09-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-3xkc-e4yi", "name": "https://www.oscs1024.com/hd/MPS-3xkc-e4yi"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73513", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73513"}, {"url": "https://github.com/envoyproxy/envoy/security/advisories/GHSA-jjmm-fw8p-crpw", "name": "https://github.com/envoyproxy/envoy/security/advisories/GHSA-jjmm-fw8p-crpw"}, {"url": "https://github.com/envoyproxy/envoy/commit/0d33268d7d8cdc5c8ffef462e0cceefa56156b72", "name": "https://github.com/envoyproxy/envoy/commit/0d33268d7d8cdc5c8ffef462e0cceefa56156b72"}, {"url": "https://github.com/envoyproxy/envoy/commit/3df69eeee220d6a4088cfdd3be79b55e2e6d3514", "name": "https://github.com/envoyproxy/envoy/commit/3df69eeee220d6a4088cfdd3be79b55e2e6d3514"}, {"url": "https://github.com/envoyproxy/envoy/commit/c4610b6c85d72ed01e014c2a1aba2934a2b774e9", "name": "https://github.com/envoyproxy/envoy/commit/c4610b6c85d72ed01e014c2a1aba2934a2b774e9"}, {"url": "https://github.com/envoyproxy/envoy/commit/e6963c6b64cd62aa8e078ef17c76052b6e33e82b", "name": "https://github.com/envoyproxy/envoy/commit/e6963c6b64cd62aa8e078ef17c76052b6e33e82b"}, {"url": "https://github.com/envoyproxy/envoy/releases/tag/v1.37.6", "name": "https://github.com/envoyproxy/envoy/releases/tag/v1.37.6"}, {"url": "https://github.com/envoyproxy/envoy/releases/tag/v1.38.4", "name": "https://github.com/envoyproxy/envoy/releases/tag/v1.38.4"}, {"url": "https://github.com/envoyproxy/envoy/releases/tag/v1.39.1", "name": "https://github.com/envoyproxy/envoy/releases/tag/v1.39.1"}], "scope_influence": "", "tags": ["应用软件"], "title": "Envoy oghttp2崩溃", "_translated": true, "_saved_at": "2026-09-21T21:34:02+00:00", "_first_saved_at": "2026-09-21T21:34:02+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-3xkc-e4yi"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能有效地控制资源的使用，导致攻击者可以利用这个漏洞耗尽应用程序所依赖的资源。这些资源可以是计算资源（CPU、内存）、网络带宽、数据库连接或其他系统资源。攻击者可以通过发送特制的请求、恶意输入或其他方式，使应用程序消耗大量资源，导致拒绝服务或系统崩溃。", "title": "什么是拒绝服务"}, {"content": "- 消耗计算资源：攻击者可以发送计算密集型的请求，例如复杂的计算、无限循环或递归操作，以耗尽应用程序的计算资源，导致应用程序无法响应其他请求。\r\n- 消耗内存资源：攻击者可以发送大量的数据或恶意输入，以导致应用程序消耗过多的内存资源，从而使系统的可用内存耗尽，并导致应用程序崩溃或变得不可用。\r\n- 消耗网络带宽：攻击者可以发送大量的请求或大型数据包，以消耗应用程序所依赖的网络带宽。这会导致其他合法用户无法正常访问应用程序或降低系统的整体网络性能。\r\n- 消耗存储资源：攻击者可以发送大量的请求或上传大文件，以耗尽应用程序的存储资源，导致系统无法处理其他请求或存储新的数据。", "title": "拒绝服务常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对输入数据进行合理的验证和过滤，防止恶意输入导致资源消耗过高。\r\n- 实施资源限制：应用程序应该实施适当的资源限制策略，例如限制计算操作的时间或次数，限制内存使用量，限制并发连接数等，以防止资源被耗尽。\r\n- 异常处理与错误恢复：应用程序应该具备健壮的异常处理和错误恢复机制，以防止因意外错误导致资源泄漏或无法释放的情况。\r\n- 资源监控与警报：应用程序应该实施适当的资源监控和警报机制，及时发现异常的资源消耗情况，并采取相应的措施来应对。\r\n- 压力测试与性能优化：应用程序应该进行压力测试，以评估其在高负载情况下的性能，并进行必要的性能优化，以确保能够有效地处理大量请求而不耗尽资源。", "title": "如何预防拒绝服务"}], "cnvd_id": "", "cve_id": "CVE-2026-94449", "cvss": {"cvssv31": [{"source": "secalert@redhat.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-400", "description": "SmallRye Fault Tolerance 是采用 Apache-2.0 许可的开源 Java 容错库，实现 Eclipse MicroProfile Fault Tolerance，被 Quarkus 用于为微服务提供重试、熔断与超时等策略。\n受影响版本中，编程式 Guard、TypedGuard 或 FaultTolerance 经 @ApplyGuard 或已弃用的 @ApplyFaultTolerance 声明式作用于业务方法时，每次请求进入 FaultToleranceInterceptor.intercept 并写入新的 MeteredOperationName。DelegatingMetricsCollector.apply 以未实现 equals 与 hashCode 的 MeteredOperation 实例作为 ConcurrentHashMap 键，使每次调用都新增 DelegatingMeteredOperation 与 MetricsCollector 且长期保留，堆内存随调用次数线性增长，远程持续请求可导致进程因 OutOfMemoryError 不可用。\n修复版本中通过将 DelegatingMetricsCollector 的缓存键从 MeteredOperation 实例改为 MeteredOperation.cacheKey()，使同一容错操作复用已有 MetricsCollector，切断按调用次数持续保留 eader_size_ 与 discarded_host_header_count_ 计数，丢弃重复 host 头时累计其字节与个数并调用新增的 checkHeaderLimits 纳入请求头限额检查，超限即重置流，切断了被丢弃副本的免计费复制链路，修复版本为 1.36.10、1.37.6、1.38.4 与 1.39.1。", "effects": [{"comp_name": "envoy", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.36.10)", "min_fixed_version": "1.36.10", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[1.36.10,1.37.6)", "min_fixed_version": "1.37.6", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[1.37.6,1.38.4)", "min_fixed_version": "1.38.4", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[1.38.4,1.39.1)", "min_fixed_version": "1.39.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "内存泄漏", "kind_en": "有效生命周期后内存丢失释放", "last_modified_time": "2026-09-22", "level": "High", "mps_id": "MPS-lcjs-iv1k", "poc": false, "poc_url": [], "published_time": "2026-09-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-lcjs-iv1k", "name": "https://www.oscs1024.com/hd/MPS-lcjs-iv1k"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73550", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73550"}, {"url": "https://github.com/envoyproxy/envoy/security/advisories/GHSA-qgf6-qvhw-4hvh", "name": "https://github.com/envoyproxy/envoy/security/advisories/GHSA-qgf6-qvhw-4hvh"}, {"url": "https://github.com/envoyproxy/envoy/commit/0910997f70e91d2d20c329bb507bfce44ce01f80", "name": "https://github.com/envoyproxy/envoy/commit/0910997f70e91d2d20c329bb507bfce44ce01f80"}, {"url": "https://github.com/envoyproxy/envoy/commit/1fec994c868df008cdd4ae285aab58a196fd31f2", "name": "https://github.com/envoyproxy/envoy/commit/1fec994c868df008cdd4ae285aab58a196fd31f2"}, {"url": "https://github.com/envoyproxy/envoy/commit/3fd0ffee7ac87adf3bc6e421656bb96310512300", "name" proxy/envoy/releases/tag/v1.36.10", "name": "https://github.com/envoyproxy/envoy/releases/tag/v1.36.10"}, {"url": "https://github.com/envoyproxy/envoy/releases/tag/v1.37.6", "name": "https://github.com/envoyproxy/envoy/releases/tag/v1.37.6"}, {"url": "https://github.com/envoyproxy/envoy/releases/tag/v1.38.4", "name": "https://github.com/envoyproxy/envoy/releases/tag/v1.38.4"}, {"url": "https://github.com/envoyproxy/envoy/releases/tag/v1.39.1", "name": "https://github.com/envoyproxy/envoy/releases/tag/v1.39.1"}], "scope_influence": "", "tags": ["应用软件"], "title": "Envoy RBAC正则绕过", "_translated": true, "_saved_at": "2026-09-21T21:33:59+00:00", "_first_saved_at": "2026-09-21T21:33:59+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-p74r-xk8g"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用了空指针，并在不进行有效检查的情况下对其进行取消引用操作。当程序试图取消引用空指针时，由于空指针不指向任何有效的内存地址，会导致程序崩溃或产生未定义的行为。这种错误通常发生在开发者未对指针进行正确的初始化或验证时。", "title": "什么是空指针取消引用"}, {"content": "- 拒绝服务：攻击者可以通过构造恶意输入或请求，触发程序中的空指针取消引用错误，导致程序崩溃或无法正常运行。这可能导致拒绝服务攻击，使系统无法提供正常的服务。\r\n- 内存信息泄露：攻击者可以通过利用空指针取消引用错误，访问程序中的敏感内存信息。这可能包括栈上的变量、函数指针或其他敏感数据，从而暴露系统的机密信息。\r\n- 代码执行：在某些情况下，空指针取消引用错误可能导致执行恶意代码或注入恶意代码的机会。攻击者可以通过精心构造的输入，利用空指针取消引用错误来执行任意的代码，进而获取系统控制权或执行未经授权的操作。", "title": "空指针取消引用常见的攻击方式"}, {"content": "- 指针初始化和验证：开发者应该正确地初始化指针，并在使用指针之前进行有效的验证，确保指针不为空。在取消引用指针之前，应始终检查其是否为空。\r\n- 异常处理和错误恢复：程序应该具备健壮的异常处理和错误恢复机制，以便在发生空指针取消引用错误时能够适当地处理异常，而不是导致程序崩溃或暴露敏感信息。\r\n- 防御性编程：采用防御性编程的原则，如避免在未经验证的指针上进行操作，避免使用未初始化的指针等，以防止空指针取消引用错误的发生。\r\n- 静态代码分析和测试：使用静态代码分析工具和测试技术来检测和识别潜在的空指针取消引用错误。这些工具可以帮助发现代码中可能存在的空指针问题，并及时修复。\r\n- 强制性编码标准和最佳实践：制定强制性的编码标准和最佳实践，包括良好的指针使用和管理规范，以帮助开发者编写更可靠、安全的代码。", "title": "如何预防空指针取消引用"}], "cnvd_id": "", "cve_id": "CVE-2026-73547", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-476", "description": "Envoy 是面向云原生应用的开源边缘与服务代理，HTTP ext_authz 过滤器负责调用外部授权服务，并按授权结果改写下游请求。\n受影响版本中，Filter::onComplete 在应用授权响应中的 query_parameters_to_set 或 query_parameters_to_remove 时，未检查 request_headers_-\u003ePath() 是否为空便调用 value() 解析查询串。不含 :path 伪头的 CONNECT 请求会使 Path() 返回空指针，解引用后导致 Envoy 进程崩溃。未认证的下游客户端在部署接受无路径 CONNECT 且授权响应启用查询参数变更时可以触发该拒绝服务。\n修复版本中通过 modifyQueryParameters 在解析查询串前判断 request_headers.Path() 是否为空，切断该空指针解引用。路径为空且开启变更校验时拒绝本次变更，未开启校验时忽略查询参数变更并继续处理请求，避免进程异常退出。", "effects": [{"comp_name": "envoy", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.36.10)", "min_fixed_version": "1.36.10", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[1.37.0,1.37.6)", "min_fixed_version": "1.37.6", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[1.38.0,1.38.4)", "min_fixed_version": "1.38.4", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[1.39.0,1.39.1)", "min_fixed_version": "1.39.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "空指针取消引用", "kind_en": "空指针取消引用", "last_modified_time": "2026-09-22", "level": "High", "mps_id": "MPS-u9il-qnyo", "poc": false, "poc_url": [], "published_time": "2026-09-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-u9il-qnyo", "name": "https://www.oscs1024.com/hd/MPS-u9il-qnyo"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73547", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73547"}, {"url": "https://github.com/envoyproxy/envoy/security/advisories/GHSA-87ph-jqwm-pg6r", "name": "https://github.com/envoyproxy/envoy/security/advisories/GHSA-87ph-jqwm-pg6r"}, {"url": "https://github.com/envoyproxy/envoy/commit/064af2e61d0d1c421490d9e3e6e643c5d117ffe4", "name": "https://github.com/envoyproxy/envoy/commit/064af2e61d0d1c421490d9e3e6e643c5d117ffe4"}, {"url": "https://github.com/envoyproxy/envoy/commit/5f3b8e9b2b8a787a63202d35bb38820f3e9271fe", "name": "https://github.com/envoyproxy/envoy/commit/5f3b8e9b2b8a787a63202d35bb38820f3e9271fe"}, {"url": "https://github.com/envoyproxy/envoy/commit/838f8ffd9d7b5217682a22ee33470d4c7afb7e98", "name": "https://github.com/envoyproxy/envoy/commit/838f8ffd9d7b5217682a22ee33470d4c7afb7e98"}, {"url": "https://github.com/envoyproxy/envoy/commit/c3170d7c747e51bb8254378ea89afc03d3e71929", "name": "https://github.com/envoyproxy/envoy/commit/c3170d7c747e51bb8254378ea89afc03d3e71929"}, {"url": "https://github.com/envoyproxy/envoy/releases/tag/v1.36.10", "name": "https://github.com/envoyproxy/envoy/releases/tag/v1.36.10"}, {"url": "https://github.com/envoyproxy/envoy/releases/tag/v1.37.6", "name": "https://github.com/envoyproxy/envoy/releases/tag/v1.37.6"}, {"url": "https://github.com/envoyproxy/envoy/releases/tag/v1.38.4", "name": "https://github.com/envoyproxy/envoy/releases/tag/v1.38.4"}, {"url": "https://github.com/envoyproxy/envoy/releases/tag/v1.39.1", "name": "https://github.com/envoyproxy/envoy/releases/tag/v1.39.1"}], "scope_influence": "", "tags": ["应用软件"], "title": "Envoy授权过滤器空指针", "_translated": true, "_saved_at": "2026-09-21T21:33:57+00:00", "_first_saved_at": "2026-09-21T21:33:57+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-u9il-qnyo"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "cnvd_id": "", "cve_id": "CVE-2026-73512", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-416", "description": "Envoy 是开源云原生边缘与服务代理，负责在云原生环境中转发 HTTP 与 HTTP/3/QUIC 流量。\n受影响版本中，启用 Capsule Protocol 后 HttpDatagramHandler 在 useCapsuleProtocol() 中把当前 RequestDecoder 缓存为裸指针。内部重定向等流重建路径会替换 ActiveStream 并更新 EnvoyQuicServerStream，但不会刷新该缓存。后续 HTTP/3 datagram 从 OnHttp3Datagram 进入 decodeCapsule，对已释放解码器调用 decodeData，造成非法虚调用并使进程崩溃。\n修复版本中通过把解码器引用改为 StreamDecoderProvider，在 decodeCapsule 使用前重新解析当前 RequestDecoder，切断流重建后继续访问已释放对象的路径。", "effects": [{"comp_name": "envoy", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.36.10)", "min_fixed_version": "1.36.10", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[1.39.0,1.39.1)", "min_fixed_version": "1.39.1", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[1.38.0,1.38.4)", "min_fixed_version": "1.38.4", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[1.37.0,1.37.6)", "min_fixed_version": "1.37.6", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "UAF", "kind_en": "免费后使用", "last_modified_time": "2026-09-22", "level": "High", "mps_id": "MPS-uoxg-t8r5", "poc": false, "poc_url": [], "published_time": "2026-09-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-uoxg-t8r5", "name": "https://www.oscs1024.com/hd/MPS-uoxg-t8r5"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73512", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73512"}, {"url": "https://github.com/envoyproxy/envoy/security/advisories/GHSA-r6j2-mrm5-72mg", "name": "https://github.com/envoyproxy/envoy/security/advisories/GHSA-r6j2-mrm5-72mg"}, {"url": "https://github.com/envoyproxy/envoy/commit/29dbaae4a9971011e2f1948acfaf383296e901ea", "name": "https://github.com/envoyproxy/envoy/commit/29dbaae4a9971011e2f1948acfaf383296e901ea"}, {"url": "https://github.com/envoyproxy/envoy/commit/85495163fdc67364a5258bfe478c34a44f6428b4", "name": "https://github.com/envoyproxy/envoy/commit/85495163fdc67364a5258bfe478c34a44f6428b4"}, {"url": "https://github.com/envoyproxy/envoy/commit/c0e46dabc3ac286bbe608e9274776555911aadb9", "name": "https://github.com/envoyproxy/envoy/commit/c0e46dabc3ac286bbe608e9274776555911aadb9"}, {"url": "https://github.com/envoyproxy/envoy/commit/f2417eec2ff49abe243d484ded916fbc2faca38d", "name": "https://github.com/envoyproxy/envoy/commit/f2417eec2ff49abe243d484ded916fbc2faca38d"}, {"url": "https://github.com/envoyproxy/envoy/releases/tag/v1.36.10", "name": "https://github.com/envoyproxy/envoy/releases/tag/v1.36.10"}, {"url": "https://github.com/envoyproxy/envoy/releases/tag/v1.37.6", "name": "https://github.com/envoyproxy/envoy/releases/tag/v1.37.6"}, {"url": "https://github.com/envoyproxy/envoy/releases/tag/v1.38.4", "name": "https://github.com/envoyproxy/envoy/releases/tag/v1.38.4"}, {"url": "https://github.com/envoyproxy/envoy/releases/tag/v1.39.1", "name": "https://github.com/envoyproxy/envoy/releases/tag/v1.39.1"}], "scope_influence": "", "tags": ["应用软件"], "title": "Envoy数据报释放后使用", "_translated": true, "_saved_at": "2026-09-21T21:34:03+00:00", "_first_saved_at": "2026-09-21T21:34:03+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-uoxg-t8r5"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-73546", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:N", "severity": "high", "base_score": 7.4}]}, "cvss_score": 7.4, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:N", "cwe": "CWE-79", "description": "Envoy 是开源的云原生边缘与服务代理，用于转发流量并提供管理接口查看运行统计。\n受影响版本中，管理接口 /stats?format=html 使用 StatsHtmlRender 输出统计项，字符串统计值会经 Html::Utility::sanitize 处理，统计项名称却被原样写入 HTML。当 grpc_stats 将 stats_for_all_methods 设为 true 时，GrpcStatsFilter::decodeHeaders 把请求的 headers.Path() 交给 resolveDynamicServiceAndMethod，攻击者可控的路径片段进入缓存的动态统计名称；浏览器或自动化工具打开该 HTML 统计页时，未编码名称在管理接口源站下执行脚本，并可发起同源特权请求。\n修复版本中通过在 StatsHtmlRender::generate 写出统计项名称前调用 Html::Utility::sanitize，并默认启用运行时开关 envoy.reloadable_features.sanitize_html_stats_names，对包含 HTML 特殊字符的名称进行编码，阻止名称中的标记在统计页执行。", "effects": [{"comp_name": "envoy", "ecosystem": "linux", "versions": [{"affected_version": "[1.38.0,1.38.4)", "min_fixed_version": "1.38.4", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[1.39.0,1.39.1)", "min_fixed_version": "1.39.1", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,1.36.10)", "min_fixed_version": "1.36.10", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[1.37.0,1.37.6)", "min_fixed_version": "1.37.6", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-09-22", "level": "High", "mps_id": "MPS-41so-pjyt", "poc": false, "poc_url": [], "published_time": "2026-09-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-41so-pjyt", "name": "https://www.oscs1024.com/hd/MPS-41so-pjyt"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73546", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73546"}, {"url": "https://github.com/envoyproxy/envoy/security/advisories/GHSA-pv9h-4fxf-7vrg", "name": "https://github.com/envoyproxy/envoy/security/advisories/GHSA-pv9h-4fxf-7vrg"}, {"url": "https://github.com/envoyproxy/envoy/commit/11d34660ca0322eb125d045a564d9d87f016397f", "name": "https://github.com/envoyproxy/envoy/commit/11d34660ca0322eb125d045a564d9d87f016397f"}, {"url": "https://github.com/envoyproxy/envoy/commit/884d30c56b835d5801733ae1dc38c94a08de23e8", "name": "https://github.com/envoyproxy/envoy/commit/884d30c56b835d5801733ae1dc38c94a08de23e8"}, {"url": "https://github.com/envoyproxy/envoy/commit/9484e17c34353662f9bfd30c74f61fa8c9ee7b83", "name": "https://github.com/envoyproxy/envoy/commit/9484e17c34353662f9bfd30c74f61fa8c9ee7b83"}, {"url": "https://github.com/envoyproxy/envoy/commit/ab63a0e52b5a28472f2ff865b6464ae4004f7593", "name": "https://github.com/envoyproxy/envoy/commit/ab63a0e52b5a28472f2ff865b6464ae4004f7593"}, {"url": "https://github.com/envoyproxy/envoy/releases/tag/v1.36.10", "name": "https://github.com/envoyproxy/envoy/releases/tag/v1.36.10"}, {"url": "https://github.com/envoyproxy/envoy/releases/tag/v1.37.6", "name": "https://github.com/envoyproxy/envoy/releases/tag/v1.37.6"}, {"url": "https://github.com/envoyproxy/envoy/releases/tag/v1.38.4", "name": "https://github.com/envoyproxy/envoy/releases/tag/v1.38.4"}, {"url": "https://github.com/envoyproxy/envoy/releases/tag/v1.39.1", "name": "https://github.com/envoyproxy/envoy/releases/tag/v1.39.1"}], "scope_influence": "", "tags": ["应用软件"], "title": "Envoy管理统计页XSS", "_translated": true, "_saved_at": "2026-09-21T21:33:58+00:00", "_first_saved_at": "2026-09-21T21:33:58+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-41so-pjyt"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-95508", "cvss": {"cvssv31": [{"source": "secalert@redhat.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:N/I:H/A:H", "severity": "high", "base_score": 7.4}]}, "cvss_score": 7.4, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:N/I:H/A:H", "cwe": "CWE-787", "description": "libslirp 是开源的用户态 TCP/IP 模拟库，供 QEMU 等虚拟机监控器向客户机提供虚拟网络服务。上游仓库位于 GitLab，GitHub 上的 qemu/libslirp 是其公开镜像。\n受影响版本中，宿主若把 SlirpConfig.if_mtu 设为低于 IPv6 最小链路 MTU 1280（库接受下限为 68），DHCPv6 与 TFTP 应答构造函数会向按该 MTU 分配的 mbuf 写入客户机可控的变长数据。dhcpv6_info_request() 把最长 256 字节的 CLIENTID 直接 memcpy 进应答，不与 mbuf 实际大小比较；同一函数计算 boot file URL 的有符号 smaxlen，当前置选项用尽 MTU 窗口后该值变为负数，作为 size_t 传入 slirp_fmt() 后长度截断失效。tftp_send_next_block() 另按客户机 blksize（上限 TFTP_BLOCKSIZE_MAX 即 1428）把文件内容读入同类 mbuf。默认 MTU 1500 不进入该路径。溢出可导致宿主进程拒绝服务，并可能造成任意代码执行。\n修复版本中通过在 dhcpv6_info_request() 写入 CLIENTID、DNS 选项和 boot file URL 之前比较剩余空间与 if_mtu，空间不足时释放 mbuf 并返回，切断 DHCPv6 应答的越界写。v4.9.5 的变更未覆盖 tftp_send_next_block() 的 blksize 写入，因此不能单独消除该 CVE 的全部触发路径；在完整修复发布前应保持 if_mtu 不低于 1280。", "effects": [{"comp_name": "libslirp", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,4.9.5]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-09-22", "level": "High", "mps_id": "MPS-v6l4-puat", "poc": false, "poc_url": [], "published_time": "2026-09-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-v6l4-puat", "name": "https://www.oscs1024.com/hd/MPS-v6l4-puat"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-95508", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-95508"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-95508", "name": ""}, {"url": "https://bugzilla.redhat.com/show_bug.cgi?id=2537748", "name": "RHBZ#2537748"}], "scope_influence": "", "tags": ["开源"], "title": "libslirp堆溢出漏洞", "_translated": true, "_saved_at": "2026-09-22T10:46:55+00:00", "_first_saved_at": "2026-09-22T10:46:55+00:00", "_source_page": "https://www.oscs1024.com/hd/M 过 LocalId 路由并进入 retry::Dispatch::queue，随后 Retry::encode_packet 对 InitialId::try_from_bytes(packet.destination_connection_id()).unwrap() 失败直接 panic，未认证远程攻击者发送单个 UDP 数据报即可使服务端 endpoint 退出。\n修复版本中通过在 receive_datagram 中丢弃无法转换为 InitialId 的首个 Initial 报文，使其不再进入 Retry 发送，并将 Retry::encode_packet 的失败转换从 unwrap 改为返回 None，从而避免短 Destination Connection ID 触发 panic。", "effects": [{"comp_name": "s2n-quic", "ecosystem": "cargo", "versions": [{"affected_version": "(-∞,1.89.0)", "min_fixed_version": "1.89.0", "repository": "cargo", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "输入中指定数量的验证不当", "kind_en": "输入中指定数量的验证不正确", "last_modified_time": "2026-09-23", "level": "High", "mps_id": "MPS-xvkz-53g8", "poc": false, "poc_url": [], "published_time": "2026-09-23", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-xvkz-53g8", "name": "https://www.oscs1024.com/hd/MPS-xvkz-53g8"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-94450", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-94450"}, {"url": "https://github.com/aws/s2n-quic/releases/tag/v1.89.0", "name": ""}, {"url": "https://aws.amazon.com/security/security-bulletins/2026-116-aws/", "name": ""}, {"url": "https://github.com/aws/s2n-quic/security/advisories/GHSA-5rw2-6x5m-v22x", "name": ""}], "scope_influence": "", "tags": [], "title": "s2n-quic拒绝服务漏洞", "_translated": true, "_saved_at": "2026-09-22T22:37:55+00:00", "_first_saved_at": "2026-09-22T22:37:55+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-xvkz-53g8"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-95814", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N", "severity": "high", "base_score": 8.1}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-863", "description": "Vaultwarden 是用 Rust 编写的开源 Bitwarden 兼容服务器，用于自托管保存和同步密码、组织保险库及附件。\n受影响版本中，按密码项 UUID 直接访问时，Cipher::get_access_restrictions 所调用的 get_user_collections_access_flags、get_group_collections_access_flags 与 Group::is_in_full_access_group 均未检查 users_organizations.status 是否为 MembershipStatus::Confirmed。Membership::revoke 只下调成员状态，并不删除 users_collections 或 groups_users 记录，而同步查询 find_by_user 已要求已确认成员。已撤销或尚未确认的成员仍可经残留的集合或组成员关系读取、修改、删除组织密码项并访问附件。\n修复版本中通过在上述三条查询中要求 users_organizations.status 等于 MembershipStatus::Confirmed，使未确认成员关系不再授予组织密码项权限；截至 2026-09-23，该改动仅存在于尚未合并的拉取请求，官方没有发布包含该修复的版本。", "effects": [{"comp_name": "vaultwarden", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.37.3]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-09-23", "level": "High", "mps_id": "MPS-uieb-fk6v", "poc": false, "poc_url": [], "published_time": "2026-09-23", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-uieb-fk6v", "name": "https://www.oscs1024.com/hd/MPS-uieb-fk6v"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-95814", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-95814"}, {"url": "https://github.com/dani-garcia/vaultwarden/pull/7554", "name": "Pull Request #7554 (open, unmerged)"}, {"url": "https://github.com/dani-garcia/vaultwarden/blob/1.37.3/src/db/models/cipher.rs", "name": "Cipher::get_access_restrictions at 1.37.3"}, {"url": "https://github.com/dani-garcia/vaultwarden/blob/1.37.3/src/db/models/group.rs", "name": "Group::is_in_full_access_group at 1.37.3"}, {"url": "https://github.com/dani-garcia/vaultwarden", "name": ""}, {"url": "https://www.vulncheck.com/advisories/vaultwarden-through-1.37.3-authorization-bypass-via-missing-status-check", "name": "VulnCheck Advisory: Vaultwarden through 1.37.3 Authorization Bypass via Missing Status Check"}], "scope_influence": "", "tags": [], "title": "Vaultwarden授权绕过", "_translated": true, "_saved_at": "2026-09-22T22:37:53+00:00", "_first_saved_at": "2026-09-22T22:37:53+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-uieb-fk6v"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-88997", "cvss": {}, "cvss_score": 8, "cvss_vector": "", "cwe": "CWE-79", "description": "JSM Show Post Metadata（插件标识 jsm-show-post-meta）是 JS Morisset 维护的开源 WordPress 插件，在文章、页面和自定义文章类型的编辑页中用元数据框展示 post meta 键名及反序列化后的值，安装启用后无额外设置。\n受影响版本中，贡献者及以上用户写入文章的 meta key 会在具备 manage_options 能力的用户打开编辑页时进入 SucomUtilMetabox::get_table_metadata()。该方法先调用 SucomUtil::sanitize_meta_key()，再把 meta key 拼入删除图标 onclick 属性中的单引号 JavaScript 字符串；sanitize_meta_key() 只做 HTML 解码和标签剥离，不删除引号，引号可打断该事件处理属性并在审阅者浏览器会话中执行脚本。同一 key 在表格单元格中经过 esc_html()，但进入事件处理属性时没有做属性或脚本转义。\n修复版本中通过在 SucomUtil::sanitize_meta_key() 内删除单引号和双引号，切断 meta key 打断 onclick 事件处理属性的路径，避免审阅文章时执行注入脚本。", "effects": [{"comp_name": "jsm-show-post-meta", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,4.9.1)", "min_fixed_version": "4.9.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-09-23", "level": "High", "mps_id": "MPS-a6c8-e0j9", "poc": false, "poc_url": [], "published_time": "2026-09-23", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-a6c8-e0j9", "name": "https://www.oscs1024.com/hd/MPS-a6c8-e0j9"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-88997", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-88997"}, {"url": "https://wpscan.com/vulnerability/1699d3aa-29ca-4197-8e3b-0b03ecce751a/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "JSM元数据存储型XSS", "_translated": true, "_saved_at": "2026-09-23T07:09:34+00:00", "_first_saved_at": "2026-09-23T07:09:34+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-a6c8-e0j9"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "cnvd_id": "", "cve_id": "CVE-2026-8849", "cvss": {"cvssv4": [{"source": "3f572a00-62e2-4423-959a-7ea25eff1638", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.7}]}, "cvss_score": 7.7, "cvss_vector": "CVS   <script>
    const payload = JSON.parse(document.getElementById("payload").textContent);
    const levelLabels = payload.level_labels || {};
    const items = payload.items || [];
    let filtered = items.slice();
    let activeId = null;

    const $ = (id) => document.getElementById(id);
    $("generatedAt").textContent = payload.generated_at || "-";
    $("retention").textContent = payload.retention_days ?? "-";
    $("cutoff").textContent = payload.cutoff_date || "-";
    $("count").textContent = String(payload.count ?? items.length);

    function levelClass(level) {
      const cn = levelLabels[level] || level || "";
      if (level === "Critical" || cn === "严重") return "crit";
      if (level === "High" || cn === "高危") return "high";
      return "other";
    }
    function levelText(level) {
      return levelLabels[level] || level || "-";
    }
    function esc(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }
    function scoreText(v) {
      if (v === null || v === undefined || v === "" || v === -1) return "-";
      return String(v);
    }

    function renderList() {
      const list = $("list");
      $("listCount").textContent = String(filtered.length);
      if (!filtered.length) {
        list.innerHTML = '<div class="empty">没有匹配项</div>';
        return;
      }
      list.innerHTML = filtered.map((it) => {
        const id = it.mps_id || it.cve_id;
        const active = id === activeId ? " active" : "";
        return `
          <button class="item${active}" data-id="${esc(id)}" type="button">
            <div class="item-top">
              <span class="cve">${esc(it.cve_id || it.mps_id || "-")}</span>
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
            </div>
            <div class="title">${esc(it.title || "-")}</div>
            <div class="item-foot">
              <span>CVSS ${esc(scoreText(it.cvss_score))}</span>
              <span>${esc(it.published_time || "-")}</span>
              ${it.poc ? "<span>POC</span>" : ""}
            </div>
          </button>`;
      }).join("");
      list.querySelectorAll(".item").forEach((btn) => {
        btn.addEventListener("click", () => selectById(btn.dataset.id));
      });
    }

    function refsHtml(it) {
      const refs = Array.isArray(it.reference_url_list) ? it.reference_url_list : [];
      const links = [];
      if (it._source_page) links.push({ url: it._source_page, name: "OSCS 详情" });
      if (it.cve_id) links.push({ url: `https://nvd.nist.gov/vuln/detail/${it.cve_id}`, name: "NVD" });
      refs.forEach((r) => {
        if (r && r.url) links.push({ url: r.url, name: r.name || r.url });
      });
      const seen = new Set();
      const uniq = [];
      for (const l of links) {
        if (seen.has(l.url)) continue;
        seen.add(l.url);
        uniq.push(l);
      }
      if (!uniq.length) return '<div class="box">无参考链接</div>';
      return `<div class="refs">${uniq.map((l) =>
        `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name || l.url)}</a>`
      ).join("")}</div>`;
    }

    function articlesHtml(it) {
      const arts = Array.isArray(it.articles) ? it.articles : [];
      if (!arts.length) return "";
      return `<div class="section"><h3>相关说明</h3>${arts.map((a) => `
        <div class="article">
          <h4>${esc(a.title || "说明")}</h4>
          <p>${esc(a.content || "")}</p>
        </div>`).join("")}</div>`;
    }

    function renderDetail(it) {
      const detail = $("detail");
      if (!it) {
        detail.innerHTML = '<div class="empty">暂无数据</div>';
        return;
      }
      const pocUrls = Array.isArray(it.poc_url) ? it.poc_url : [];
      detail.innerHTML = `
        <div class="d-head">
          <div>
            <h1 class="d-title">${esc(it.title || "-")}</h1>
            <div class="ids">
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
              <span class="chip">${esc(it.cve_id || "无 CVE")}</span>
              <span class="chip">${esc(it.mps_id || "-")}</span>
              ${it.poc ? '<span class="chip">有 POC</span>' : ""}
              ${it.exp ? '<span class="chip">有 EXP</span>' : ""}
            </div>
          </div>
          <div class="actions">
            ${it._source_page ? `<a class="btn" href="${esc(it._source_page)}" target="_blank" rel="noopener">OSCS</a>` : ""}
            ${it.cve_id ? `<a class="btn" href="https://nvd.nist.gov/vuln/detail/${esc(it.cve_id)}" target="_blank" rel="noopener">NVD</a>` : ""}
          </div>
        </div>
        <div class="grid">
          <div class="stat"><div class="k">CVSS</div><div class="v">${esc(scoreText(it.cvss_score))}</div></div>
          <div class="stat"><div class="k">向量</div><div class="v">${esc(it.cvss_vector || "-")}</div></div>
          <div class="stat"><div class="k">CWE</div><div class="v">${esc(it.cwe || "-")}</div></div>
          <div class="stat"><div class="k">类型</div><div class="v">${esc(it.kind || it.kind_en || "-")}</div></div>
          <div class="stat"><div class="k">公开</div><div class="v">${esc(it.published_time || "-")}</div></div>
          <div class="stat"><div class="k">利用成本</div><div class="v">${esc(it.exploit_requirement_cost || "-")}</div></div>
          <div class="stat"><div class="k">可利用性</div><div class="v">${esc(it.exploitability || "-")}</div></div>
          <div class="stat"><div class="k">修复建议</div><div class="v">${esc(it.fix_suggestion || "-")}</div></div>
        </div>
        <div class="section"><h3>描述</h3><div class="box">${esc(it.description || "无描述")}</div></div>
        ${it.scope_influence ? `<div class="section"><h3>影响范围</h3><div class="box">${esc(it.scope_influence)}</div></div>` : ""}
        ${pocUrls.length ? `<div class="section"><h3>POC 链接</h3><div class="refs">${pocUrls.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join("")}</div></div>` : ""}
        <div class="section"><h3>参考链接</h3>${refsHtml(it)}</div>
        ${articlesHtml(it)}
      `;
    }

    function selectById(id) {
      const it = filtered.find((x) => (x.mps_id || x.cve_id) === id) ||
                 items.find((x) => (x.mps_id || x.cve_id) === id);
      if (!it) return;
      activeId = it.mps_id || it.cve_id;
      renderList();
      renderDetail(it);
      const btn = document.querySelector(`.item[data-id="${CSS.escape(activeId)}"]`);
      if (btn) btn.scrollIntoView({ block: "nearest" });
      history.replaceState(null, "", "#" + encodeURIComponent(activeId));
    }

    function applyFilter(q) {
      const query = (q || "").trim().toLowerCase();
      filtered = !query ? items.slice() : items.filter((it) => {
        const blob = [
          it.cve_id, it.mps_id, it.title, it.kind, it.kind_en, it.cwe, it.description, it.level
        ].map((x) => String(x || "").toLowerCase()).join(" ");
        return blob.includes(query);
      });
      renderList();
      if (filtered.length) {
        const still = filtered.some((x) => (x.mps_id || x.cve_id) === activeId);
        selectById(still ? activeId : (filtered[0].mps_id || filtered[0].cve_id));
      } else {
        activeId = null;
        renderDetail(null);
      }
    }

    $("search").addEventListener("input", (e) => applyFilter(e.target.value));

    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement !== $("search")) {
        e.preventDefault();
        $("search").focus();
        return;
      }
      if (!filtered.length) return;
      const idx = filtered.findIndex((x) => (x.mps_id || x.cve_id) === activeId);
      if (e.key === "ArrowDown") {
        e.preventDefault();
        const next = filtered[Math.min(filtered.length - 1, Math.max(0, idx) + 1)];
        selectById(next.mps_id || next.cve_id);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        const prev = filtered[Math.max(0, idx - 1)];
        selectById(prev.mps_id || prev.cve_id);
      }
    });

    const hashId = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    if (hashId && items.some((x) => (x.mps_id || x.cve_id) === hashId)) {
      activeId = hashId;
      renderList();
      selectById(hashId);
    } else if (items.length) {
      selectById(items[0].mps_id || items[0].cve_id);
    } else {
      renderList();
      renderDetail(null);
    }
  </script>
</body>
