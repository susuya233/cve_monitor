p_name": "Photoshop 2026", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,27.7)", "min_fixed_version": "27.7", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "对搜索路径元素未加控制", "kind_en": "Uncontrolled Search Path Element", "last_modified_time": "2026-09-09", "level": "High", "mps_id": "MPS-gsuv-6j2a", "poc": false, "poc_url": [], "published_time": "2026-09-09", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-gsuv-6j2a", "name": "https://www.oscs1024.com/hd/MPS-gsuv-6j2a"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-76199", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-76199"}, {"url": "https://helpx.adobe.com/security/products/photoshop/apsb26-130.html", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Photoshop搜索路径漏洞", "_translated": true, "_saved_at": "2026-09-09T05:46:55+00:00", "_first_saved_at": "2026-09-08T22:16:57+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-gsuv-6j2a"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-86733", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.2}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-78", "description": "Snipe-IT 是开源 IT 资产管理系统，基于 PHP Laravel 构建，用于资产盘点、借还、配件与许可证管理。\n受影响版本中，已认证超级管理员可向 POST /admin/backups/upload 上传含恶意 SQL 条目的 ZIP 备份，再向 POST /admin/backups/restore/{filename} 发起恢复且不提交可选的 clean 参数。SettingsController::postRestore 调用 Artisan 命令 snipeit:restore 后，RestoreFromBackup::handle 通过 proc_open 将备份 SQL 以标准输入管道传入 mysql 客户端，调用时未加 --binary-mode。MySQL/MariaDB 客户端会把以 \\! 开头的行解释为本机 shell 命令，从而以 Web 应用操作系统用户执行任意命令，读取数据库凭据、APP_KEY 等应用密钥并改写应用可写文件与数据。默认 APP_LOCKED 为 false、DB_SANITIZE_BY_DEFAULT 为 false，该恢复路径默认不会启用 SQL 清理。\n修复版本中通过在 RestoreFromBackup::handle 调用 mysql 客户端时增加 --binary-mode 标志，禁止客户端在非交互输入中解释 \\!、system、source 等本地命令，切断备份 SQL 进入本机命令执行的路径。", "effects": [{"comp_name": "snipe/snipe-it", "ecosystem": "composer", "versions": [{"affected_version": "(-∞,8.7.0)", "min_fixed_version": "8.7.0", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-09-08", "level": "High", "mps_id": "MPS-ienf-z0r3", "poc": false, "poc_url": [], "published_time": "2026-09-09", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ienf-z0r3", "name": "https://www.oscs1024.com/hd/MPS-ienf-z0r3"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-86733", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-86733"}, {"url": "https://github.com/grokability/snipe-it/security/advisories/GHSA-x53f-48vj-c5fc", "name": "GitHub Security Advisory (GHSA-x53f-48vj-c5fc)"}, {"url": "https://www.vulncheck.com/advisories/snipe-it-before-8.7.0-remote-code-execution-via-backup-restore", "name": "VulnCheck Advisory: Snipe-IT before 8.7.0 Remote Code Execution via Backup Restore"}], "scope_influence": "", "tags": ["php", "开源"], "title": "Snipe-IT备份恢复命令注入", "_translated": true, "_saved_at": "2026-09-08T16:59:24+00:00", "_first_saved_at": "2026-09-08T16:59:24+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ienf-z0r3"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-76190", "cvss": {"cvssv31": [{"source": "psirt@adobe.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:N/I:H/A:N", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:N/I:H/A:N", "cwe": "CWE-95", "description": "Adobe ColdFusion 是商业闭源应用服务器，用于构建和运行基于 CFML 的 Web 应用与后端服务。\n受影响版本中，动态求值代码里的指令未得到正确中和，存在 Eval Injection 缺陷。未授权远程攻击者可在无需用户交互的情况下利用该缺陷，在当前用户上下文中执行任意代码，且影响范围会扩展到当前组件之外。\n修复版本中通过 Adobe APSB26-119 安全更新收紧动态求值路径对不可信输入的处理，阻止恶意指令再进入被求值代码，切断任意代码执行链路。", "effects": [{"comp_name": "coldfusion", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2025.0.13)", "min_fixed_version": "2025.0.13", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,2023.0.24)", "min_fixed_version": "2023.0.24", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "eval注入", "kind_en": "动态评估代码中指令的不当中和（“评估注入”）", "last_modified_time": "2026-09-09", "level": "High", "mps_id": "MPS-vyc7-21z6", "poc": false, "poc_url": [], "published_time": "2026-09-09", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-vyc7-21z6", "name": "https://www.oscs1024.com/hd/MPS-vyc7-21z6"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-76190", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-76190"}, {"url": "https://helpx.adobe.com/security/products/coldfusion/apsb26-119.html", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "ColdFusion Eval注入漏洞", "_translated": true, "_saved_at": "2026-09-09T05:46:53+00:00", "_first_saved_at": "2026-09-08T22:16:54+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-vyc7-21z6"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-75993", "cvss": {"cvssv31": [{"source": "psirt@adobe.com", "vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:R/S:C/C:H/I:H/A:N", "severity": "high", "base_score": 8.5}]}, "cvss_score": 8.5, "cvss_vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:R/S:C/C:H/I:H/A:N", "cwe": "CWE-79", "description": "Adobe ColdFusion 是商业 Web 应用服务器，用于开发和部署基于 CFML 的动态网站与后台服务，源码未公开。\n受影响版本中，产品存在反射型跨站脚本问题。相邻网络中的攻击者可将恶意脚本注入网页响应，受害者打开恶意文件后，脚本在其浏览器中执行，可能获取提升后的访问权限或控制其账户与会话，且影响会越出存在漏洞的组件。\n修复版本中通过 Adobe 安全更新 APSB26-119 切断该反射型脚本注入路径，阻止恶意内容再进入受害者浏览器执行；公开资料未披露更细粒度的源码修改。", "effects": [{"comp_name": "ColdFusion 2023", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2023.0.24)", "min_fixed_version": "2023.0.24", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "ColdFusion 2025", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2025.0.13)", "min_fixed_version": "2025.0.13", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-09-09", "level": "High", "mps_id": "MPS-mxtd-al97", "poc": false, "poc_url": [], "published_time": "2026-09-09", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-mxtd-al97", "name": "https://www.oscs1024.com/hd/MPS-mxtd-al97"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-75993", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-75993"}, {"url": "https://helpx.adobe.com/security/products/coldfusion/apsb26-119.html", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "ColdFusion反射型XSS漏洞", "_translated": true, "_saved_at": "2026-09-09T05:46:59+00:00", "_first_saved_at": "2026-09-08T22:17:03+00:00", "_so 7.0-server-side-request-forgery-via-employee-num", "name": "VulnCheck Advisory: Snipe-IT before 8.7.0 Server-Side Request Forgery via employee_num"}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "8.7.0 之前的 Snipe-IT 通过 employee_num 进行服务器端请求伪造", "_translated": true, "_saved_at": "2026-09-09T14:58:44+00:00", "_first_saved_at": "2026-09-09T14:58:44+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-emdn-vhu5"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "cnvd_id": "", "cve_id": "CVE-2026-83997", "cvss": {"cvssv31": [{"source": "secure@microsoft.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.1}]}, "cvss_score": 8.1, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-416", "description": "在 Windows 消息队列中使用 after free 允许未经授权的攻击者通过网络执行代码。", "effects": [{"comp_name": "windows_10_21H2", "ecosystem": "linux", "versions": [{"affected_version": "[10.0.19044.0,10.0.19044.7725)", "min_fixed_version": "10.0.19044.7725", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "windows_10_22H2", "ecosystem": "linux", "versions": [{"affected_version": "[10.0.19045.0,10.0.19045.7725)", "min_fixed_version": "10.0.19045.7725", "repository": "unmanaged", "solutions": [], "upst 之前，进行类型检查和转换，确保操作数的类型和范围是合适的。\r\n- 强制性编码标准和最佳实践：制定强制性的编码标准和最佳实践，包括对整数运算和操作的规范和限制，以帮助程序员编写更可靠、安全的代码。\r\n- 静态代码分析和测试：使用静态代码分析工具和测试技术来检测和识别潜在的整数溢出问题。这些工具可以帮助发现代码中可能存在的溢出漏洞，并及时修复。", "title": "如何预防整数溢出或环绕"}], "cnvd_id": "", "cve_id": "CVE-2026-84000", "cvss": {"cvssv31": [{"source": "secure@microsoft.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-190", "description": "Microsoft 图形组件中基于堆的缓冲区溢出允许授权攻击者在本地执行代码。", "effects": [{"comp_name": "windows_10_1607", "ecosystem": "linux", "versions": [{"affected_version": "[10.0.14393.0,10.0.14393.9512)", "min_fixed_version": "10.0.14393.9512", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "windows_10_1809", "ecosystem": "linux", "versions": [{"affected_version": "[10.0.17763.0,10.0.17763.9245)", "min_fixed_version": "10.0.17763.9245", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "windows_10_21H2", "ecosystem": "linux", "versions": [{"affected_version": "[10.0.19044.0,10.0.19044.7725)", "min_fixed_version": "10.0.19044.7725", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "windows_10_22H2", "ecosystem": "linux", "versions": [{"affected_version": "[10.0.19045.0,10.0.19045.7725)", "min_fixed_version": "10.0.19045.7725", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "windows_11_23H2", "ecosystem": "linux", "versions": [{"affected_version": "[10.0.22631.0,10.0.22631.7582)", "min_fixed_version": "10.0.22631.7582", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "windows_11_24H2", "ecosystem": "linux", "versions": [{"affected_version": "[10.0.26100.0,10.0.26100.9445)", "min_fixed_version": "10.0.26100.9445", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "windows_11_25H2", "ecosystem": "linux", "ver 丁，以确保已知的跨界内存读漏洞得到修复。及时更新相关软件和库，以避免使用已知存在漏洞的版本。", "title": "如何预防越界读取"}], "cnvd_id": "", "cve_id": "CVE-2026-84001", "cvss": {"cvssv31": [{"source": "secure@microsoft.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-125", "description": "Windows 密钥分发中心中的越界读取允许未经授权的攻击者通过网络拒绝服务。", "effects": [{"comp_name": "windows_10_1607", "ecosystem": "linux", "versions": [{"affected_version": "[10.0.14393.0,10.0.14393.9512)", "min_fixed_version": "10.0.14393.9512", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "windows_10_1809", "ecosystem": "linux", "versions": [{"affected_version": "[10.0.17763.0,10.0.17763.9245)", "min_fixed_version": "10.0.17763.9245", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "windows_10_21H2", "ecosystem": "linux", "versions": [{"affected_version": "[10.0.19044.0,10.0.19044.7725)", "min_fixed_version": "10.0.19044.7725", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "windows_10_22H2", "ecosystem": "linux", "versions": [{"affected_version": "[10.0.19045.0,10.0.19045.7725)", "min_fixed_version": "10.0.19045.7725", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "windows_11_23H2", "ecosystem": "linux", "versions": [{"affected_version": "[10.0.22631.0,10.0.22631.7582)", "min_fixed_version": "10.0.22631.7582", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "windows_11_24H2", "ecosystem": "linux", "versions": [{"affected_version": "[10.0.26100.0,10.0.26100.9445)", "min_fixed_version": "10.0.26100.9445", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "windows_11_25H2", "ecosystem": "linux", "versions": [{"affected_version": "[10.0.26200.0,10.0.26200.9445)", "min_fixed_version": "10.0.26200.9445", "repository": "unmanaged", "  "https://www.oscs1024.com/hd/MPS-rhit-f07d"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能有效地控制资源的使用，导致攻击者可以利用这个漏洞耗尽应用程序所依赖的资源。这些资源可以是计算资源（CPU、内存）、网络带宽、数据库连接或其他系统资源。攻击者可以通过发送特制的请求、恶意输入或其他方式，使应用程序消耗大量资源，导致拒绝服务或系统崩溃。", "title": "什么是拒绝服务"}, {"content": "- 消耗计算资源：攻击者可以发送计算密集型的请求，例如复杂的计算、无限循环或递归操作，以耗尽应用程序的计算资源，导致应用程序无法响应其他请求。\r\n- 消耗内存资源：攻击者可以发送大量的数据或恶意输入，以导致应用程序消耗过多的内存资源，从而使系统的可用内存耗尽，并导致应用程序崩溃或变得不可用。\r\n- 消耗网络带宽：攻击者可以发送大量的请求或大型数据包，以消耗应用程序所依赖的网络带宽。这会导致其他合法用户无法正常访问应用程序或降低系统的整体网络性能。\r\n- 消耗存储资源：攻击者可以发送大量的请求或上传大文件，以耗尽应用程序的存储资源，导致系统无法处理其他请求或存储新的数据。", "title": "拒绝服务常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对输入数据进行合理的验证和过滤，防止恶意输入导致资源消耗过高。\r\n- 实施资源限制：应用程序应该实施适当的资源限制策略，例如限制计算操作的时间或次数，限制内存使用量，限制并发连接数等，以防止资源被耗尽。\r\n- 异常处理与错误恢复：应用程序应该具备健壮的异常处理和错误恢复机制，以防止因意外错误导致资源泄漏或无法释放的情况。\r\n- 资源监控与警报：应用程序应该实施适当的资源监控和警报机制，及时发现异常的资源消耗情况，并采取相应的措施来应对。\r\n- 压力测试与性能优化：应用程序应该进行压力测试，以评估其在高负载情况下的性能，并进行必要的性能优化，以确保能够有效地处理大量请求而不耗尽资源。", "title": "如何预防拒绝服务"}], "cnvd_id": "", "cve_id": "CVE-2026-86734", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:N/A:H", "severity": "medium", "base_score": 6.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-400", "description": "Snipe-IT 是基于 Laravel 的开源 IT 资产与许可证管理系统，用于资产签收、签出、库存与许可证管理。\n受影响版本中，已认证用户向 POST /account/accept/{acceptance} 提交未限制长度的 note 后，AcceptanceController::store() 会把该值写入通知数据，并在默认 sync 队列下同步进入 AcceptanceItemDeclinedNotification::toMail() 的 markdown() 渲染；该路径使用存在资源消耗问题的 league/commonmark 2.8.2，超长备注会占用 PHP worker CPU 并导致拒绝服务。\n修复版本中通过在 store() 对 note 增加 nullable|string|max:1000 服务端校验，并在 composer.json 中直接要求 league/commonmark ^2.9.0（composer.lock 钉选 2.10.0），阻止超长备注进入同步 Markdown 解析，消除该拒绝服务路径。", "effects": [{"comp_name": "snipe/snipe-it", "ecosystem": "composer", "versions": [{"affected_version": "(-∞,8.7.1)", "min_fixed_version": "8.7.1", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "拒绝服务", "kind_en": "不受控制的资源消耗", "last_modified_time": "2026-09-08", "level": "High", "mps_id": "MPS-6o4a-tsr7", "poc": false, "poc_url": [], "published_time": "2026-09-09", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-6o4a-tsr7", "name": "https://www.oscs1024.com/hd/MPS-6o4a-tsr7"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-86734", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-86734"}, {"url": "https://github.com/grokability/snipe-it/security/advisories/GHSA-4vcv-fc5x-jjwv", "name": "GitHub Security Advisory (GHSA-4vcv-fc5x-jjwv)"}, {"url": "https://github.com/grokability/snipe-it/commit/66770cfe20cb135e2b7022c7a83d01e6783c914a", "name": "Patch Commit"}, {"url": "https://www.vulncheck.com/advisories/snipe-it-before-8.7.1-denial-of-service-via-unbounded-note-field", "name": "VulnCheck Advisory: Snipe-IT before 8.7.1 Denial of Service via Unbounded Note Field"}], "scope_influence": "", "tags": ["php", "开源"], "title": "Snipe-IT备注拒绝服务", "_translated": true, "_saved_at": "2026-09-08T16:59:19+00:00", "_first_saved_at": "2026-09-08T16:59:19+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-6o4a-tsr7"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-86765", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:H/A:N", "severity": "medium", "base_score": 6.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-862", "description": "当分配字段提交到资产更新端点时，8.7.0 之前的 Snipe-IT 版本无法强制执行结帐授权。具有编辑权限但明确拒绝签出权限的经过身份验证的用户可以通过向 PATCH /api/v1/hardware/{id} 提交分配的_用户、分配的_资产或分配的_位置参数来重新分配资产、绕过签入程序以及更改保管记录。", "effects": [{"comp_name": "snipe-it", "ecosystem": "linux", "versions": [{"affected_version": "[8.6.3,8.7.0)", "min_fixed_version": "8.7.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-09-09", "level": "High", "mps_id": "MPS-8p3t-649n", "poc": false, "poc_url": [], "published_time": "2026-09-09", "reference_url_list": visory (GHSA-jqf5-vfg6-8cx5)"}, {"url": "https://www.vulncheck.com/advisories/craft-cms-5.0.0-rc1-before-5.10.12-permission-escalation-via-userscontroller", "name": "VulnCheck Advisory: Craft CMS 5.0.0-RC1 before 5.10.12 Permission Escalation via UsersController"}], "scope_influence": "", "tags": ["php", "开源"], "title": "Craft CMS权限提升漏洞", "_translated": true, "_saved_at": "2026-09-08T16:59:22+00:00", "_first_saved_at": "2026-09-08T16:59:22+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-gtac-9bku"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "cnvd_id": "", "cve_id": "CVE-2026-85360", "cvss": {"cvssv31": [{"source": "secure@microsoft.com", "vector": "CVSS:3.1/AV:L/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7}]}, "cvss_score": 7, "cvss_vector": "CVSS:3.1/AV:L/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-416", "description": "Windows 内核中的释放后使用允许授权攻击者在本地提升权限。", "effects": [{"comp_name": "windows_10_1607", "ecosystem": "linux", "versions": [{"affected_version": "[10.0.14393.0,10.0.14393.9512)", "min_fixed_version": "10.0.14393.9512", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "windows_10_1809", "ecosystem": "linux", "versions": [{"affected_version": "[10.0.17763.0,10.0.17763.9245)", "min_fixed_version": "10.0 nning:t-digest", "ecosystem": "maven", "versions": [{"affected_version": "[3.1,3.3]", "min_fixed_version": "", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "输入中指定数量的验证不当", "kind_en": "输入中指定数量的验证不正确", "last_modified_time": "2026-09-10", "level": "High", "mps_id": "MPS-t0zj-k8ay", "poc": false, "poc_url": [], "published_time": "2026-09-10", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-t0zj-k8ay", "name": "https://www.oscs1024.com/hd/MPS-t0zj-k8ay"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-87962", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-87962"}, {"url": "https://github.com/tdunning/t-digest/issues/227", "name": "GitHub Issue #227"}, {"url": "https://github.com/tdunning/t-digest/blob/7905f3d2ad18e7d7176811147d1316a3e23d7061/core/src/main/java/com/tdunning/math/stats/MergingDigest.java", "name": "MergingDigest.java"}, {"url": "https://github.com/tdunning/t-digest", "name": ""}, {"url": "https://www.vulncheck.com/advisories/t-digest-3.1-through-3.3-denial-of-service-via-unvalidated-length-fields-in-mergingdigest-frombytes", "name": "VulnCheck Advisory: t-digest 3.1 through 3.3 Denial of Service via Unvalidated Length Fields in MergingDigest.fromBytes"}], "scope_influence": "", "tags": [], "title": "t-digest 反序列化拒绝服务漏洞", "_translated": true, "_saved_at": "2026-09-10T12:37:05+00:00", "_first_saved_at": "2026-09-10T12:37:05+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-t0zj-k8ay"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过构造恶意的数据，将过多的数据输入到程序的缓冲区中，使得缓冲区的空间被填满，从而溢出到程序的栈 (stack) 或堆 (heap) 中，导致程序崩溃、拒绝服务、数据泄露等安全问题。\n", "title": "什么是经典缓冲区溢出"}, {"content": "| 类型        | 描述                                                         |\n| ----------- | ------------------------------------------------------------ |\n| 代码注入攻击      | 攻击者通过向程序的缓冲区输入恶意代码，从而控制程序执行流程，实现对程序操作的恶意操作。例如，攻击者可以通过向 Web 应用程序的输入框中输入恶意代码，从而执行任意的代码，破坏系统、窃取数据等。 |\n| 数据覆盖攻击      | 攻击者通过向程序的缓冲区输入过多的数据，从而覆盖程序中的重要数据或代码，实现对程序操作的恶意操作。例如，攻击者可以通过向聊天应用程序的输入框中输入过多的表情符号，从而覆盖程序中的重要数据，例如聊天消息、账号密码等。 |\n| 栈溢出攻击 | 攻击者通过向程序的栈中输入过多的数据，从而溢出到栈外部，实现对程序操作的恶意操作。例如，攻击者可以通过向游戏应用程序的输入框中输入过多的道具名称，从而覆盖程序中的重要数据，例如游戏数据、账号密码等。 |\n| 堆溢出攻击       | 攻击者通过向程序的堆中输入过多的数据，从而溢出到堆外部，实现对程序操作的恶意操作。例如，攻击者可以通过向操作系统工具的输入框中输入过多的命令，从而覆盖程序中的重要数据，例如系统文件、配置文件等。 |", "title": "经典缓冲区溢出常见的攻击方式"}, {"content": "- 输入验证：在程序输入处对输入数据进行严格的验证和过滤，确保输入数据符合预期的格式和类型，避免被攻击者注入恶意命令或数据。可以使用正则表达式、格式字符串等方式进行输入验证。\n- 输出过滤：在程序输出处对输出数据进行严格的过滤和检查，确保输出数据符合预期的格式和类型，避免被攻击者截获和篡改。可以使用安全的输出过滤库等方式进行输出过滤。\n- 使用安全的编程模型：使用安全的编程模型，例如避免使用原生的缓冲区管理函数，使用安全的框架和库来处理输入数据和执行命令，避免缓冲区溢出漏洞。\n- 数据库加密和访问控制：对于敏感数据和命令，使用加密和访问控制措施，确保只有授权用户可以访问和执行命令，避免被攻击者窃取和篡改。\n- 定期更新和升级：定期更新和升级应用程序和库的版本，确保应用程序和库的最新版本包含了最新的安全补丁和修复措施，避免安全漏洞的出现和利用。\n- 安全审计和监控：定期对系统和应用程序进行安全审计和监控，及时发现和阻止潜在的安全漏洞和攻击，确保系统和数据的安全和可靠性。", "title": "如何预防经典缓冲区溢出"}], "cnvd_id": "", "cve_id": "CVE-2026-87931", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:A/AC:L/Au:N/C:C/I:C/A:C", "severity": "high", "base_score": 8.3}], "cvssv3": [{"source": "VulDB", "vector": "CVSS:3.0/AV:A/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H/E:P/RL:X/RC:R", "severity": "critical", "base_score": 9.6}], "cvssv31": [{"source": "cna@vuldb.com", "vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.6}], "cvssv4": [{"source": "cna@vuldb.com", "vector": "CVSS:4.0/AV:A/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:A/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-120", "description": "Pavlok Behavioral Conditioning Wearable 是 Behavioral Technology Group 推出的行为条件训练智能手环，固件闭源，通过低功耗蓝牙（BLE）与移动应用配对，提供振动、声音与电击等习惯纠正提示。\n受影响版本中，固件的 Apple Notification Center Service（ANCS）事件处理组件在处理通知事件数据时未正确校验数据长度，向缓冲区写入超出边界的内容引发缓冲区溢出；攻击者需处于设备邻近网络（蓝牙通信范围）内，无需用户交互与权限，通过构造的通知事件数据触发溢出，官方 CVSS 评分预期可导致设备机密性、完整性与可用性受损，且影响范围可能超出易受攻击组件本身。\n修复版本中通过，建议限制受影响手环在不可信蓝牙环境中的使用，避免与来源不明的设备配对，并关注厂商后续固件更新；厂商在漏洞披露前已获通报但未回应，截至分析时未提供修复版本与修复方案。", "effects": [{"comp_name": "Pavlok Behavioral Conditioning Wearable", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,20260707]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "经典缓冲区溢出", "kind_en": "不检查输入大小的缓冲区复制（“经典缓冲区溢出”）", "last_modified_time": "2026-09-10", "level": "High", "mps_id": "MPS-4v8f-r2nz", "poc": false, "poc_url": [], "published_time": "2026-09-10", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-4v8f-r2nz", "name": "https://www.oscs1024.com/hd/MPS-4v8f-r2nz"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-87931", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-87931"}, {"url": "https://vuldb.com/vuln/401814", "name": "VDB-401814 | Behavioral Technology Group Pavlok Behavioral Conditioning Wearable Apple Notification Center Service Event buffer overflow"}, {"url": "https://vuldb.com/vuln/401814/cti", "name": "VDB-401814 | CTI Indicators (IOB, IOC)"}, {"url": "https://vuldb.com/cve/CVE-2026-87931", "name": "CVE-2026-87931 | CVE Analysis and Report"}, {"url": "https://vuldb.com/submit/881885", "name": "Submit #881885 | Behavioral Technology Group Pavlok Firmware Code Injection"}, {"url": "https://ab3j.radio/Pavlok.pdf", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Pavlok 手环缓冲区溢出漏洞", "_translated": true, "_saved_at": "2026-09-10T02:37:54+00:00", "_first_saved_at": "2026-09-10T02:37:54+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-4v8f-r2nz"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-78302", "cvss": {"cvssv4": [{"source": "security@joomla.org", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:A/VC:H/VI:H/VA:L/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:A/VC:H/VI:H/VA:L/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-79", "description": "SP Property（组件名 com_spproperty）是 JoomShaper 开发的 Joomla 房地产列表扩展，用于管理房源、经纪人与预约等房地产内容，按 Pro 授权分发，属于闭源商业组件，无公开源码仓库。\n受影响版本中，前端视图与后台管理列表的多处模板文件将属性和文本值直接渲染进 HTML，未做上下文转义；未经身份验证的攻击者可将恶意脚本写入房源等存储数据，管理员或前台用户浏览相关列表与页面时载荷在浏览器中执行，形成未认证存储型 XSS。\n修复版本中通过对视图与管理列表模板的输出补充上下文转义，切断存储数据中恶意脚本进入 HTML 文档的路径，消除未认证存储型 XSS 风险。", "effects": [{"comp_name": "com_spproperty", "ecosystem": "linux", "versions": [{"affected_version": "[1.0.0,4.1.4)", "min_fixed_version": "4.1.4", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-09-10", "level": "High", "mps_id": "MPS-edun-g59c", "poc": false, "poc_url": [], "published_time": "2026-09-10", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-edun-g59c", "name": "https://www.oscs1024.com/hd/MPS-edun-g59c"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-78302", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-78302"}, {"url": "https://www.joomshaper.com/joomla-extensions/sp-property", "name": ""}], "scope_influence": "", "tags": [], "title": "SP Property 存储型 XSS", "_translated": true, "_saved_at": "2026-09-10T12:37:08+00:00", "_first_saved_at": "2026-09-10T12:37:08+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-edun-g59c"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-8044", "cvss": {"cvssv4": [{"source": "cybersecurity@se.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/M 免使用不受信任的数据。\n- 使用安全的序列化机制：程序应该使用安全的序列化机制，如 JSON 或 XML 序列化，而不是第三方序列化库。\n- 最小特权原则：程序应该限制对受信任数据的处理权限，并避免在运行时修改数据。\n- 代码审查和漏洞扫描：程序应该进行代码审查和漏洞扫描，以发现和修复潜在的安全漏洞。\n", "title": "如何预防反序列化"}], "cnvd_id": "", "cve_id": "CVE-2026-87874", "cvss": {"cvssv31": [{"source": "secalert@redhat.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.1}]}, "cvss_score": 8.1, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-502", "description": "Ansible 社区的 memcached 缓存插件发现缺陷\n收藏。尽管它的文档声明记录存储在 JSON 中\n格式，该插件不执行显式序列化并依赖于\npython-memcached，它在写入时腌制值并在读取时取消腌制它们。\n由于 memcached 未经身份验证并且缓存密钥是可预测的，因此攻击者\n能够访问网络公开或共享的 memcached 实例可以编写精心设计的\npickle 有效负载在 Ansible 控制器上反序列化并执行\n接下来读取中毒的事实缓存，从而导致远程代码执行。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "反序列化", "kind_en": "不可信数据的反序列化", "last_modified_time": "2026-09-10", "level": "High", "mps_id": "MPS-38y4-d1xa", "poc": false, "poc_url": [], "published_time": "2026-09-10", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-38y4-d1xa", "name": "https://www.oscs1024.com/hd/MPS-38y4-d1xa"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-87874", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-87874"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-87874", "name": ""}, {"url": "https://bugzilla.redhat.com/show_bug.cgi?id=2530995", "name": "RHBZ#2530995"}], "scope_influence": "", "tags": [], "title": "CVE-2026-87874漏洞", "_translated": true, "_saved_at": "2026-09-09T18:22:23+00:00", "_first_saved_at": "2026-09-09T18:22:23+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-38y4-d1xa"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-87996", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:N/A:N", "severity": "high", "base_score": 7.7}]}, "cvss_score": 7.7, "c tent": "- 输入验证和限制：应用程序应对所有输入数据进行严格的验证和限制。确保输入数据的长度、格式和内容符合预期，避免超出缓冲区或访问非预期的内存区域。\n- 内存安全编程实践：开发人员应使用安全的编程实践，如避免使用不安全的函数、正确处理内存分配和释放操作，以及遵循最小特权原则。\n- 使用安全的编程语言和库：选择使用安全性较高的编程语言和库，这些语言和库在内存管理和安全性方面提供了更多的保护机制。\n- 定期进行代码审查和安全测试：定期审查应用程序的代码，并进行安全测试，以发现潜在的跨界内存读漏洞。使用静态代码分析工具和漏洞扫描工具来辅助检测和修复问题。\n- 实施防御性编程技术：应用程序应采用防御性编程技术，如使用随机化地址空间布局（ASLR）、堆栈保护机制（如堆栈溢出保护）和数据执行预防（DEP）等。\n- 及时更新和修补：及时应用程序和操作系统的安全更新和补丁，以确保已知的跨界内存读漏洞得到修复。及时更新相关软件和库，以避免使用已知存在漏洞的版本。", "title": "如何预防越界读取"}], "cnvd_id": "", "cve_id": "CVE-2026-87961", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:L/I:N/A:H", "severity": "high", "base_score": 7.1}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:L/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:L/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-125", "description": "ESP32-audioI2S 是 schreibfaul1 在 GitHub 开源的 ESP32 音频解码库（GPL-3.0 许可证），用于在 ESP32 上播放网络音频流与本地音频文件，支持 MP3 等格式解码及 ID3 元数据解析，被广泛用于网络收音机等物联网音频项目。\n受影响版本中，Audio::read_ID3_Header 函数在处理 ID3v2 同步歌词帧 SYLT 与旧版 ID3v2.2 SLT 帧时，块内各自声明的局部变量 size_t len = 0 遮蔽了函数形参 len（表示本次调用实际缓冲的字节数）；由于 size_t 为无符号类型，边界检查 if (m_ID3Hdr.SYLT.size \u003c len) return 0 恒为假并失效，随后 syltBuff.copy_from(data, m_ID3Hdr.SYLT.size) 直接按标签声明的帧大小从 data 缓冲区复制数据，攻击者在恶意 MP3 文件或 HTTP 音频流中声明超出实际缓冲数据量的帧大小，可读取分配边界之外的堆内存，导致设备崩溃或泄露相邻堆数据。\n修复版本中通过移除 SYLT 与 SLT 两处遮蔽形参的局部 len 声明，将边界检查修正为 if (m_ID3Hdr.SYLT.size \u003e len) return 0，使超出实际缓冲数据量的帧大小声明返回 0 并等待更多数据，同时将 SLT 块中复用的 len 重命名为 descLen，从而切断堆越界读取路径。", "effects": [{"comp_name": "ESP32-audioI2S", "ecosystem": "linux", "versions": [{"affected_version": "[3.4.4,4.0.0]", "min_fixed_version": "", "repository": " 7:06+00:00", "_first_saved_at": "2026-09-10T12:37:06+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-gsyl-xa1i"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-87998", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:H/A:L", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:H/A:L", "cwe": "CWE-863", "description": "Open WebUI 是一个可扩展、功能丰富且用户友好的自托管人工智能平台。从 0.10.0 到 0.11.1，backend/open_webui/routers/knowledge.py 中的 DELETE /api/v1/knowledge/{id}/delete 授权删除知识库，但随后删除了其管理员拥有的外部连接，而无需单独的管理员检查或其他依赖知识库的检查。对一个外部知识库具有写入权限的非管理员可以删除共享实例配置，并使使用该连接的所有其他知识库不可用。此问题已在 0.11.1 版本中修复。", "effects": [{"comp_name": "open-webui", "ecosystem": "linux", "versions": [{"affected_version": "[0.10.0,0.11.1)", "min_fixed_version": "0.11.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-09-10", "level": "High", "mps_id": "MPS-obci-vw1s", "poc": false, "poc_url": [], "published_time": "2026-09-10", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-obci-vw1s", "name": "https://www.oscs1024.com/hd/MPS-obci-vw1s"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-87998", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-87998"}, {"url": "https://github.com/open-webui/open-webui/security/advisories/GHSA-2724-6cpj-gf3v", "name": "https://github.com/open-webui/open-webui/security/advisories/GHSA-2724-6cpj-gf3v"}, {"url": "https://github.com/open-webui/open-webui/pull/28113", "name": "https://github.com/open-webui/open-webui/pull/28113"}, {"url": "https://github.com/open-webui/open-webui/commit/dc03e7e595d61be97b25a1dd7bb99ad264f73199", "name": "https://github.com/open-webui/open-webui/commit/dc03e7e595d61be97b25a1dd7bb99ad264f73199"}, {"url": "https://github.com/open-webui/open-webui/releases/tag/v0.11.1", "name": "https://github.com/open-webui/open-webui/releases/tag/v0.11.1"}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-87998漏洞", "_translated": true, "_saved_at": "2026-09-09T23:45:49+00:00", "_first_saved_at": "2026-09-09T23:45:49+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-obci-vw1s"}, {"analysis_status": 0, "articles": [{"content": "跨站点请求伪造 (CSRF)通过利用网站对用户请求的信任进行攻击。当用户在网站A登录并在同一浏览器会话中访问网站B时，攻击者可以构造特制的请求并诱使用户执行，以使网站B误以为这些请求是用户合法发起的。\n攻击者通常通过欺骗用户点击恶意链接、在受信任的网站中植入恶意代码或通过钓鱼等手段来实施CSRF攻击，一旦用户执行了恶意请求，攻击者可以以用户的身份执行任意操作，包括更改用户密码、发起资金转账或删除重要数据等。", "title": "什么是CSRF"}, {"content": "- 链接欺骗：攻击者通过向用户发送包含恶意链接的电子邮件或社交媒体消息，诱使用户点击并执行恶意请求。\n- 图片引用攻击：攻击者通过在恶意网站上包含指向目标网站的图片引用，以触发用户浏览器自动发送目标网站的请求。\n- XSS利用：如果目标网站存在XSS漏洞，攻击者可以注入恶意脚本，以使用户在浏览器中执行恶意请求。", "title": "CSRF常见的攻击方式"}, {"content": "- 随机令牌：网站可以在每个请求中包含一个随机生成的令牌（CSRF Token），并验证该令牌的有效性，以确认请求的来源是合法的。\n- SameSite Cookie：使用SameSite属性来限制跨站点请求，将Cookie的发送限制在同一站点上，减少了跨站请求伪造的风险。\n- 双重验证：对于敏感操作，网站可以要求用户进行额外的验证，例如输入验证码、提供第二个因素的身份验证等。\n- 强化浏览器策略：网站可以设置Content-Security-Policy（CSP）头，限制浏览器执行恶意脚本的能力，减少CSRF攻击的风险。\n- 限制用户操作：网站可以要求用户在执行敏感操作之前进行明确的确认或授权，防止恶意请求被误触发。\n- 安全编码实践：开发人员应遵循安全编码实践，对用户输入进行适当的验证和过滤，防止恶意请求的注入。", "title": "如何预防CSRF"}], "cnvd_id": "", "cve_id": "CVE-2026-78083", "cvss": {"cvssv4": [{"source": "security@joomla.org", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-352", "description": "SP Property 是 JoomShaper 公司开发的商业 Joomla! 房地产组件（闭源付费扩展），用于管理房源、房源特色、经纪人与预约看房活动，并提供 Ajax 表单提交房源预约与经纪人联系请求。\n受影响版本中，房源预约（properties.booking）与经纪人联系表单提交（agents.sendmail）两个对外端点在处理 POST 请求时未校验 Joomla! 会话反 CSRF 令牌，攻击者可构造诱导页面，使访问该页面的用户浏览器在目标站点上下文中提交伪造请求，以受害者会话创建房源预约或向经纪人发送邮件，导致预约数据被污染、站点邮件功能被滥用。\n修复版本中通过在房源预约与经纪人联系表单处理流程中补充 Joomla! 会话反 CSRF 令牌校验，拒绝缺少有效令牌的跨站 POST 请求，切断伪造请求进入预约与发信业务逻辑的路径。", "effects": [{"comp_name": "sp_property", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,4.1.4)", "min_fixed_version": "4.1.4", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "CSRF", "kind_en": "跨站请求伪造 (CSRF)", "last_modified_time": "2026-09-10", "level": "High", "mps_id": "MPS-rkf8-bev0", "poc": false, "poc_url": [], "published_time": "2026-09-10", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-rkf8-bev0", "name": "https://www.oscs1024.com/hd/MPS-rkf8-bev0"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-78083", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-78083"}, {"url": "https://www.joomshaper.com/joomla-extensions/sp-property", "name": ""}], "scope_influence": "", "tags": [], "title": "SP P mit/e3e4bd87df6fc629e7e22081d980d55a7632b8b7", "name": "https://github.com/open-webui/open-webui/commit/e3e4bd87df6fc629e7e22081d980d55a7632b8b7"}, {"url": "https://github.com/open-webui/open-webui/releases/tag/v0.11.1", "name": "https://github.com/open-webui/open-webui/releases/tag/v0.11.1"}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-87999漏洞", "_translated": true, "_saved_at": "2026-09-09T23:45:52+00:00", "_first_saved_at": "2026-09-09T23:45:52+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-tzle-umrh"}, {"analysis_status": 0, "articles": [{"content": "跨界内存读是指应用程序在读取内存时，未正确验证或限制读取的内存范围。攻击者利用这种漏洞可以读取应用程序内存中的敏感数据，如密码、加密密钥、会话令牌等。常见的原因是由于缓冲区溢出、格式化字符串漏洞或其他内存错误导致的。", "title": "什么是越界读取"}, {"content": "攻击者可以通过不当构造的输入来触发跨界内存读漏洞。攻击者可能会通过向应用程序发送特定的输入，使其读取超过预期的内存区域。攻击者可以利用这个漏洞来获取敏感信息，如其他用户的数据、操作系统的敏感数据或应用程序的内部状态。", "title": "越界读取常见的攻击方式"}, {"content": "- 输入验证和限制：应用程序应对所有输入数据进行严格的验证和限制。确保输入数据的长度、格式和内容符合预期，避免超出缓冲区或访问非预期的内存区域。\n- 内存安全编程实践：开发人员应使用安全的编程实践，如避免使用不安全的函数、正确处理内存分配和释放操作，以及遵循最小特权原则。\n- 使用安全的编程语言和库：选择使用安全性较高的编程语言和库，这些语言和库在内存管理和安全性方面提供了更多的保护机制。\n- 定期进行代码审查和安全测试：定期审查应用程序的代码，并进行安全测试，以发现潜在的跨界内存读漏洞。使用静态代码分析工具和漏洞扫描工具来辅助检测和修复问题。\n- 实施防御性编程技术：应用程序应采用防御性编程技术，如使用随机化地址空间布局（ASLR）、堆栈保护机制（如堆栈溢出保护）和数据执行预防（DEP）等。\n- 及时更新和修补：及时应用程序和操作系统的安全更新和补丁，以确保已知的跨界内存读漏洞得到修复。及时更新相关软件和库，以避免使用已知存在漏洞的版本。", "title": "如何预防越界读取"}], "cnvd_id": "", "cve_id": "CVE-2026-89046", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:H", "severity": "high", "base_score": 8.2}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:L/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:L/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-125", "description": "zstd-jni 是开源的 Zstandard 压缩算法 Java 绑定库，通过 JNI 封装原生 zstd 实现，供 Java 应用进行高性能压缩、解压与帧信息解析。\n受影响版本中，com.github.luben.zstd.Zstd 的 getFrameContentSize 方法对 srcPosition 与 srcSize 仅做上界校验，未拒绝负值；负数 srcPosition 可绕过 srcPosition \u003e= src.length 与 srcPosition + srcSize \u003e src.length 两处检查进入原生层，jni_zstd.c 中的 getFrameContentSize0 在 GetPrimitiveArrayCritical 取得数组首址后以 (char*)src_buff + offset 计算帧头解析起始地址，负偏移使指针越过数组起点、负长度被转换为巨大 size_t，帧头解析器越界读取内存，导致信息泄露或 JVM 崩溃。\n修复版本中通过在 getFrameContentSize 入口补充 srcPosition \u003c 0 与 srcSize \u003c 0 前置校验，任一参数为负时立即抛出 ArrayIndexOutOfBoundsException，阻止非法偏移进入原生帧头解析，同批修复在 ZstdInputStreamNoFinalizer 的 read 与 readInternal 中补充 len \u003c 0 校验，消除越界读取路径。", "effects": [{"comp_name": "com.github.luben:zstd-jni", "ecosystem": "maven", "versions": [{"affected_version": "[1.5.5-6,1.5.7-14)", "min_fixed_version": "1.5.7-14", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界读取", "kind_en": "越界读取", "last_modified_time": "2026-09-11", "level": "High", "mps_id": "MPS-agmx-echj", "poc": false, "poc_url": [], "published_time": "2026-09-11", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-agmx-echj", "name": "https://www.oscs1024.com/hd/MPS-agmx-echj"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-89046", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-89046"}, {"url": "https://github.com/luben/zstd-jni/security/advisories/GHSA-rm53-6wf5-f34m", "name": "GitHub Security Advisory (GHSA-rm53-6wf5-f34m)"}, {"url": "https://github.com/luben/zstd-jni/commit/dd08685ef913a32e76fb27f43470035c06758646", "name": "Fix commit: reject a negative source position and size"}, {"url": "https://github.com/luben/zstd-jni/blob/v1.5.7-13/src/main/java/com/github/luben/zstd/Zstd.java#L730", "name": "Upper-bound-only bounds check at v1.5.7-13"}, {"url": "https://github.com/luben/zstd-jni/blob/v1.5.7-13/src/main/native/jni_zstd.c#L87", "name": "Native routine that offsets the critical array pointer without re-validating"}, {"url": "https://github.com/luben/zstd-jni/releases/tag/v1.5.7-14", "name": "zstd-jni v1.5.7-14 Release Notes"}, {"url": "https://github.com/luben/zstd-jni", "name": "luben/zstd-jni"}, {"url": "https://www.vulncheck.com/advisories/zstd-jni-1.5.5-6-through-1.5.7-13-out-of-bounds-read-via-negative-offset", "name": "VulnCheck Advisory: zstd-jni 1.5.5-6 through 1.5.7-13 Out-of-Bounds Read via Negative Offset"}], "scope_influence": "", "tags": ["java", "开源"], "title": "zstd-jni越界读取漏洞", "_translated": true, "_saved_at": "2026-09-10T19:25:30+00:00", "_first_saved_at": "2026-09-10T19:25:30+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-agmx-echj"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-88939", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:L", "severity": "high", "base_score": 8.3}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/ nts"}], "scope_influence": "", "tags": [], "title": "CVE-2026-88959漏洞", "_translated": true, "_saved_at": "2026-09-10T16:50:45+00:00", "_first_saved_at": "2026-09-10T16:50:45+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-kjn3-zxar"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-88051", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-787", "description": "Tesseract 是 Google 开源 OCR 引擎，用于图像文字识别，被广泛嵌入各类文档处理与 OCR 服务。\n受影响版本中，回调形式的 GenericVector\u003cT\u003e::read（src/ccutil/genericvector.h）从 .traineddata 模型先后读入两个相互独立的 int32 字段 reserved 与 size_used_，前者经 reserve(reserved) 分配堆缓冲区，后者直接驱动 cb(f, data_ + i) 元素写入循环，两个字段既无上限校验也无 size_used_ \u003c= reserved 不变式检查；攻击者构造含 version_id \u003e= 4 的 TESSDATA_INTTEMP 组件并令 reserved 取小值、size_used_ 取大值，目标经 TessBaseAPI::Init 以 legacy 引擎加载该模型触发 1024.com/hd/MPS-t6su-f0ex", "name": "https://www.oscs1024.com/hd/MPS-t6su-f0ex"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-88937", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-88937"}, {"url": "https://github.com/knowns-dev/knowns/security/advisories/GHSA-68cq-4rwm-f7jr", "name": "GitHub Security Advisory (GHSA-68cq-4rwm-f7jr)"}, {"url": "https://github.com/knowns-dev/knowns/security/advisories/GHSA-xjcg-5j3r-m6f9", "name": "GitHub Security Advisory (GHSA-xjcg-5j3r-m6f9)"}, {"url": "https://github.com/knowns-dev/knowns/blob/v0.33.0/internal/codegen/template_engine.go#L625-L636", "name": ""}, {"url": "https://github.com/knowns-dev/knowns/blob/v0.33.0/internal/codegen/template_engine.go#L318-L344", "name": ""}, {"url": "https://www.vulncheck.com/advisories/knowns-through-0.33.0-path-traversal-via-template-engine", "name": "VulnCheck Advisory: knowns through 0.33.0 Path Traversal via Template Engine"}], "scope_influence": "", "tags": ["AI"], "title": "knowns 模板引擎路径穿越漏洞", "_translated": true, "_saved_at": "2026-09-10T16:50:48+00:00", "_first_saved_at": "2026-09-10T16:50:48+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-t6su-f0ex"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-88052", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "cwe": "CWE-787", "description": "Tesseract 是 Google 维护的开源 OCR 文字识别引擎（C++ 实现，Apache-2.0 许可），通过加载 traineddata 语言包与 unicharset 字符集文件完成字符集初始化，广泛用于图像文字识别服务与本地工具。\n受影响版本中，src/ccutil/unicharset.cpp 的 UNICHARSET::load_via_fgets 通过 sscanf 读取文件首行声明的字符总数并直接将其作为循环上界，循环内 unichar_insert_backwards_compatible 对空表示、重复表示或已可编码的字符执行空操作，使 unichars 向量长度落后于循环索引 id；后续 set_isalpha、set_script、set_normed 等未校验边界的访问器与 unichars[id].properties.enabled 写入随即越过向量末尾写 UNICHAR_PROPERTIES，其中 set_normed 还包含 std::string 赋值，LSTM 与传统两种引擎的初始化路径均受影响，攻击者诱导用户或服务加载畸形 unicharset 文件可造成堆越界写，导致堆破坏、崩溃或潜在的受控内存破坏。\n修复版本中通过 main 分支 commit 2d04d640db2e8c7e3bab2369d599343b5a8b8443 修复：load_via_fgets 拒绝非正的字符总数，并在每次插入后校验 unichars 向量长度与 id 同步，不一致时报出错误行并拒绝加载整个文件，从而切断越界写路径；官方修复版本发布前，建议仅加载可信来源的 unicharset 与 traineddata 文件。", "effects": [{"comp_name": "tesseract", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,5.5.3]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-09-11", "level": "High", "mps_id": "MPS-vc7j-uisp", "poc": false, "poc_url": [], "published_time": "2026-09-11", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-vc7j-uisp", "name": "https://www.oscs1024.com/hd/MPS-vc7j-uisp"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-88052", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-88052"}, {"url": "https://github.com/tesseract-ocr/tesseract/security/advisories/GHSA-2hm8-q5c7-c373", "name": "https://github.com/tesseract-ocr/tesseract/security/advisories/GHSA-2hm8-q5c7-c373"}, {"url": "https://github.com/tesseract-ocr/tesseract/commit/2d04 -via-code-find-mcp-tool", "name": "VulnCheck Advisory: knowns through 0.33.0 Path Traversal via code.find MCP tool"}], "scope_influence": "", "tags": [], "title": "通过 code.find MCP 工具通过 0.33.0 进行路径遍历", "_translated": true, "_saved_at": "2026-09-10T16:50:47+00:00", "_first_saved_at": "2026-09-10T16:50:47+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-w9qm-o4cf"}]}</script>
  <script>
    const payload = JSON.parse(document.getElementById("payload").textContent);
    const levelLabels = payload.level_labels || {};
    const items = payload.items || [];
    let filtered = items.slice();
    let activeId = null;

    const $ = (id) => document.getElementById(id);
    $("generatedAt").textContent = payload.generated_at || "-";
    $("retention").textContent = payload.retention_days ?? "-";
    $("cutoff").textContent = payload.cutoff_date || "-";
    $("count").textContent = String(payload.count ?? items.length);

    function levelClass(level) {
      const cn = levelLabels[level] || level || "";
      if (level === "Critical" || cn === "严重") return "crit";
      if (level === "High" || cn === "高危") return "high";
      return "other";
    }
    function levelText(level) {
      return levelLabels[level] || level || "-";
    }
    function esc(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }
    function scoreText(v) {
      if (v === null || v === undefined || v === "" || v === -1) return "-";
      return String(v);
    }

    function renderList() {
      const list = $("list");
      $("listCount").textContent = String(filtered.length);
      if (!filtered.length) {
        list.innerHTML = '<div class="empty">没有匹配项</div>';
        return;
      }
      list.innerHTML = filtered.map((it) => {
        const id = it.mps_id || it.cve_id;
        const active = id === activeId ? " active" : "";
        return `
          <button class="item${active}" data-id="${esc(id)}" type="button">
            <div class="item-top">
              <span class="cve">${esc(it.cve_id || it.mps_id || "-")}</span>
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
            </div>
            <div class="title">${esc(it.title || "-")}</div>
            <div class="item-foot">
              <span>CVSS ${esc(scoreText(it.cvss_score))}</span>
              <span>${esc(it.published_time || "-")}</span>
              ${it.poc ? "<span>POC</span>" : ""}
            </div>
          </button>`;
      }).join("");
      list.querySelectorAll(".item").forEach((btn) => {
        btn.addEventListener("click", () => selectById(btn.dataset.id));
      });
    }

    function refsHtml(it) {
      const refs = Array.isArray(it.reference_url_list) ? it.reference_url_list : [];
      const links = [];
      if (it._source_page) links.push({ url: it._source_page, name: "OSCS 详情" });
      if (it.cve_id) links.push({ url: `https://nvd.nist.gov/vuln/detail/${it.cve_id}`, name: "NVD" });
      refs.forEach((r) => {
        if (r && r.url) links.push({ url: r.url, name: r.name || r.url });
      });
      const seen = new Set();
      const uniq = [];
      for (const l of links) {
        if (seen.has(l.url)) continue;
        seen.add(l.url);
        uniq.push(l);
      }
      if (!uniq.length) return '<div class="box">无参考链接</div>';
      return `<div class="refs">${uniq.map((l) =>
        `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name || l.url)}</a>`
      ).join("")}</div>`;
    }

    function articlesHtml(it) {
      const arts = Array.isArray(it.articles) ? it.articles : [];
      if (!arts.length) return "";
      return `<div class="section"><h3>相关说明</h3>${arts.map((a) => `
        <div class="article">
          <h4>${esc(a.title || "说明")}</h4>
          <p>${esc(a.content || "")}</p>
        </div>`).join("")}</div>`;
    }

    function renderDetail(it) {
      const detail = $("detail");
      if (!it) {
        detail.innerHTML = '<div class="empty">暂无数据</div>';
        return;
      }
      const pocUrls = Array.isArray(it.poc_url) ? it.poc_url : [];
      detail.innerHTML = `
        <div class="d-head">
          <div>
            <h1 class="d-title">${esc(it.title || "-")}</h1>
            <div class="ids">
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
              <span class="chip">${esc(it.cve_id || "无 CVE")}</span>
              <span class="chip">${esc(it.mps_id || "-")}</span>
              ${it.poc ? '<span class="chip">有 POC</span>' : ""}
              ${it.exp ? '<span class="chip">有 EXP</span>' : ""}
            </div>
          </div>
          <div class="actions">
            ${it._source_page ? `<a class="btn" href="${esc(it._source_page)}" target="_blank" rel="noopener">OSCS</a>` : ""}
            ${it.cve_id ? `<a class="btn" href="https://nvd.nist.gov/vuln/detail/${esc(it.cve_id)}" target="_blank" rel="noopener">NVD</a>` : ""}
          </div>
        </div>
        <div class="grid">
          <div class="stat"><div class="k">CVSS</div><div class="v">${esc(scoreText(it.cvss_score))}</div></div>
          <div class="stat"><div class="k">向量</div><div class="v">${esc(it.cvss_vector || "-")}</div></div>
          <div class="stat"><div class="k">CWE</div><div class="v">${esc(it.cwe || "-")}</div></div>
          <div class="stat"><div class="k">类型</div><div class="v">${esc(it.kind || it.kind_en || "-")}</div></div>
          <div class="stat"><div class="k">公开</div><div class="v">${esc(it.published_time || "-")}</div></div>
          <div class="stat"><div class="k">利用成本</div><div class="v">${esc(it.exploit_requirement_cost || "-")}</div></div>
          <div class="stat"><div class="k">可利用性</div><div class="v">${esc(it.exploitability || "-")}</div></div>
          <div class="stat"><div class="k">修复建议</div><div class="v">${esc(it.fix_suggestion || "-")}</div></div>
        </div>
        <div class="section"><h3>描述</h3><div class="box">${esc(it.description || "无描述")}</div></div>
        ${it.scope_influence ? `<div class="section"><h3>影响范围</h3><div class="box">${esc(it.scope_influence)}</div></div>` : ""}
        ${pocUrls.length ? `<div class="section"><h3>POC 链接</h3><div class="refs">${pocUrls.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join("")}</div></div>` : ""}
        <div class="section"><h3>参考链接</h3>${refsHtml(it)}</div>
        ${articlesHtml(it)}
      `;
    }

    function selectById(id) {
      const it = filtered.find((x) => (x.mps_id || x.cve_id) === id) ||
                 items.find((x) => (x.mps_id || x.cve_id) === id);
      if (!it) return;
      activeId = it.mps_id || it.cve_id;
      renderList();
      renderDetail(it);
      const btn = document.querySelector(`.item[data-id="${CSS.escape(activeId)}"]`);
      if (btn) btn.scrollIntoView({ block: "nearest" });
      history.replaceState(null, "", "#" + encodeURIComponent(activeId));
    }

    function applyFilter(q) {
      const query = (q || "").trim().toLowerCase();
      filtered = !query ? items.slice() : items.filter((it) => {
        const blob = [
          it.cve_id, it.mps_id, it.title, it.kind, it.kind_en, it.cwe, it.description, it.level
        ].map((x) => String(x || "").toLowerCase()).join(" ");
        return blob.includes(query);
      });
      renderList();
      if (filtered.length) {
        const still = filtered.some((x) => (x.mps_id || x.cve_id) === activeId);
        selectById(still ? activeId : (filtered[0].mps_id || filtered[0].cve_id));
      } else {
        activeId = null;
        renderDetail(null);
      }
    }

    $("search").addEventListener("input", (e) => applyFilter(e.target.value));

    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement !== $("search")) {
        e.preventDefault();
        $("search").focus();
        return;
      }
      if (!filtered.length) return;
      const idx = filtered.findIndex((x) => (x.mps_id || x.cve_id) === activeId);
      if (e.key === "ArrowDown") {
        e.preventDefault();
        const next = filtered[Math.min(filtered.length - 1, Math.max(0, idx) + 1)];
        selectById(next.mps_id || next.cve_id);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        const prev = filtered[Math.max(0, idx - 1)];
        selectById(prev.mps_id || prev.cve_id);
      }
    });

    const hashId = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    if (hashId && items.some((x) => (x.mps_id || x.cve_id) === hashId)) {
      activeId = hashId;
      renderList();
      selectById(hashId);
    } else if (items.length) {
      selectById(items[0].mps_id || items[0].cve_id);
    } else {
      renderList();
      renderDetail(null);
    }
  </script>
</body>
