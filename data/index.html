score": 9.1}]}, "cvss_score": 9.1, "cvss_vector": "CVSS:4.0/AV:N/AC:H/AT:P/PR:N/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-15", "description": "Legcord 是开源 Electron Discord 自定义客户端，在加载 discord.com 的窗口预加载脚本中通过 contextBridge 暴露 window.legcord 设置桥，供页面脚本读写客户端配置。\n受影响版本中，window.legcord.settings.setConfig 接受任意配置键和值，src/discord/preload/bridge.ts 以 ipcRenderer.sendSync 调用 IPC 通道 setConfig，src/discord/ipc.ts 的处理函数不校验键名即写入本地配置文件。已在 Discord 页面获得脚本执行能力的攻击者可将 additionalArguments 写为包含 --proxy-server 与 --ignore-certificate-errors 的字符串，客户端下次启动时由 src/main.ts 按空格拆分该字符串并调用 app.commandLine.appendSwitch，从而把客户端流量导向拦截代理。\n修复版本中通过阻止页面脚本写入任意配置键的官方版本尚未发布。截至 2026-10-05，最新发行标签仍为 v1.3.0，dev 分支的 setConfig 处理仍直接持久化调用方传入的键值，用户应在上游发布修复前避免执行不可信 Discord 页面脚本，并核对本地配置中的 additionalArguments。", "effects": [{"comp_name": "legcord", "ecosystem": "linux", "versions": [{"affected_version": "[1.1.0,1.3.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "系统设置或配置在外部可控制", "kind_en": "系统或配置设置的外部控制", "last_modified_time": "2026-10-05", "level": "Critical", "mps_id": "MPS-bjt3-56ea", "poc": false, "poc_url": [], "published_time": "2026-10-05", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-bjt3-56ea", "name": "https://www.oscs1024.com/hd/MPS-bjt3-56ea"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-105294", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-105294"}, {"url": "https://github.com/Legcord/Legcord/issues/1163", "name": "GitHub Issue #1163"}, {"url": "https://github.com/Legcord/Legcord", "name": ""}, {"url": "https://github.com/Legcord/Legcord/blob/v1.3.0/src/discord/ipc.ts#L296-L299", "name": ""}, {"url": "https://github.com/Legcord/Legcord/blob/v1.3.0/src/main.ts#L277-L307", "name": ""}, {"url": "https://www.vulncheck.com/advisories/legcord-1.1.0-through-1.3.0-chromium-switch-injection-via-settings-setconfig", "name": "VulnCheck Advisory: Legcord 1.1.0 through 1.3.0 Chromium Switch Injection via settings.setConfig"}], "scope_influence": "", "tags": ["应用软件"], "title": "Legcord配置注入漏洞", "_translated": true, "_saved_at": "2026-10-05T01:29:05+00:00", "_first_saved_at": "2026-10-05T01:29:05+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-bjt3-56ea"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-105484", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:N/AC:L/Au:N/C:C/I:C/A:C", "severity": "high", "base_score": 10}], "cvssv3": [{"source": "VulDB", "vector": "CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H/E:X/RL:X/RC:R", "severity": "critical", "base_score": 10}], "cvssv31": [{"source": "cna@vuldb.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 10}], "cvssv4": [{"source": "cna@vuldb.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/ nce_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-4n9x-mt0j", "name": "https://www.oscs1024.com/hd/MPS-4n9x-mt0j"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-91107", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-91107"}, {"url": "https://fluidattacks.com/advisories/hearts", "name": ""}, {"url": "https://github.com/OS4ED/openSIS-Classic", "name": ""}, {"url": "https://github.com/OS4ED/openSIS-Classic/commit/24bb530391a67c114cd4fe3dff65da7e070f5ed1", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "openSIS越权改密漏洞", "_translated": true, "_saved_at": "2026-10-05T23:35:29+00:00", "_first_saved_at": "2026-10-05T23:35:29+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-4n9x-mt0j"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-21589", "cvss": {"cvssv4": [{"source": "security@atlassian.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-22", "description": "Atlassian Bamboo、Bitbucket、Confluence、Crowd、Crucible、Fisheye、Jira Software 和 Jira Service Management 的 Data Center 以及部分 Server 版本是闭源企业协作与研发软件，用于持续集成、代码托管、知识库、身份管理、代码评审和问题跟踪。Bitbucket Cloud 不受此问题影响，受影响的 Atlassian Cloud 产品已由厂商完成修复。\n受影响版本中，未认证远程攻击者可以访问 Web 应用根目录内名称和路径均已知的特定文件。厂商将该问题归类为路径穿越引起的任意文件访问；利用时必须预先知道目标文件的准确名称和路径，且该漏洞不能枚举或列出目录。部分部署在 Web 应用根目录存放敏感文件时，机密性影响会升高。公开材料没有给出具体类、方法或源码路径。\n修复版本中通过各产品发行线上的安全更新阻止对 Web 应用根目录内文件的未授权访问。厂商同时提供 WAF、反向代理或 Tomcat RewriteValve 临时规则，用于拒绝路径分隔符与上级目录序列相邻的请求。公开渠道没有可核对的修复 commit。", "effects": [{"comp_name": "bamboo_data_center", "ecosystem": "linux", "versions": [{"affected_version": "[10.3.0,12.1.12)", "min_fixed_version": "12.1.12", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[7.0.1,10.2.24)", "min_fixed_version": "10.2.24", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "bitbucket_data_center", "ecosystem": "linux", "versions": [{"affected_version": "[4.6.0,9.4.26)", "min_fixed_version": "9.4.26", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[9.5.0,10.2.8)", "min_fixed_version": "10.2.8", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[10.3.0,10.5.1)", "min_fixed_version": "10.5.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "confluence_data_center", "ecosystem": "linux", "versions": [{"affected_version": "[5.10.0,9.2.26)", "min_fixed_version": "9.2.26", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[9.3.0,10.2.19)", "min_fixed_version": "10.2.19", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "crowd_data_center", "ecosystem": "linux", "versions": [{"affected_version": "[2.11.0,6.3.7)", "min_fixed_version": "6.3.7", "repository": "unman https://www.oscs1024.com/hd/MPS-yjzq-7r9x"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-67273", "cvss": {"cvssv31": [{"source": "security_alert@emc.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:N", "severity": "critical", "base_score": 9.6}]}, "cvss_score": 9.6, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:N", "cwe": "CWE-1336", "description": "Dell Container Storage Modules（CSM）是 Dell 面向 Kubernetes 的容器存储管理套件，用于为 PowerStore、PowerScale、PowerFlex、PowerMax 等存储平台提供 CSI 驱动与功能模块，其中 csm-operator 为 Apache-2.0 开源组件，负责按 ContainerStorageModule 自定义资源部署并管理各存储模块。\n受影响版本中，operator 渲染 observability 模块清单时，将来自自定义资源的 cr.Name、cr.Namespace、组件 env 取值与镜像地址等字符串，通过 strings.ReplaceAll 直接填入 operatorconfig/moduleconfig 下的 YAML 清单模板占位符（如 \u003cNAME\u003e、\u003cCSM_NAMESPACE\u003e、\u003cTOPOLOGY_LOG_LEVEL\u003e、\u003cOTEL_COLLECTOR_IMAGE\u003e），替换前缺少中和处理；具备创建或修改该自定义资源权限的低权限用户可在字段值中注入换行与 --- 文档分隔符，注入内容经 SplitYaml 拆分为独立 Kubernetes 对象，并由 operator 以自身高权限服务账号创建，攻击者由此获得集群级 Kubernetes Secrets 读取能力并能创建 cluster-scoped RBAC 资源，绕过预期的 Kubernetes 访问控制。\n修复版本中通过新增 ValidateYAMLSubstitutionValue 等校验函数，在模板替换前校验 CR 名称、命名空间、日志级别与镜像字符串，拒绝包含换行、回车、YAML 文档分隔符及控制字符的取值，阻断注入的清单文档进入对象创建流程。", "effects": [{"comp_name": "container_storage_modules", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.17.0)", "min_fixed_version": "1.17.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "csm-operator", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.13.0)", "min_fixed_version": "1.13.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "模板注入", "kind_en": "模板引擎中使用的特殊元素的不正确中和", "last_modified_time": "2026-10-03", "level": "Critical", "mps_id": "MPS-d0ed-b230", "poc": false, "poc_url": [], "published_time": "2026-10-07", "reference_url_list": [{"url": "https://cybersecuritynews.com/critical-dell-container-storage-flaws/", "name": ""}, {"url": "https://www.dell.com/support/kbdoc/en-us/000515771/dsa-2026-448-security-update-for-dell-container-storage-modules-multiple-vulnerabilities", "name": ""}, {"url": "https://github.com/dell/csm-operator/commit/3a16c396d2d2eee6be1365afb36a14eb2ae5", "name": ""}, {"url": "https://github.com/dell/csm-operator/releases/tag/v1.13.0", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Dell CSM模板注入漏洞", "_translated": true, "_saved_at": "2026-10-06T17:45:14+00:00", "_first_saved_at": "2026-10-06T17:45:14+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-d0ed-b230"}, {"analysis_status": 0, "articles": [{"content": "由于整数类型的有限范围，在进行算术运算或操作时，结果可能超出类型的表示范围，导致溢出或环绕。溢出指的是结果超过了类型的最大值或小于了最小值，而环绕指的是结果绕回到类型的最小值或最大值。", "title": "什么是整数溢出或环绕"}, {"content": "- 缓冲区溢出：整数溢出可能导致缓冲区溢出漏洞。当整数溢出导致分配的缓冲区大小不足以容纳结果时，攻击者可以利用这个漏洞覆盖相邻的内存区域，执行恶意代码或篡改程序的状态。\r\n- 身份验证绕过：在进行身份验证或访问控制时，整数溢出可能导致绕过验证的漏洞。攻击者可以构造特殊的输入，使溢出的整数值绕过了预期的验证逻辑，从而获得未经授权的访问权限。\r\n- 数据篡改：整数溢出可能导致数据篡改漏洞。攻击者可以通过使整数溢出，修改计数器、索引或其他控制数据的值，导致程序在处理数据时发生错误或执行意外的操作。", "title": "整数溢出或环绕常见的攻击方式"}, {"content": "- 输入验证与限制：对用户输入的整数进行合理的验证和限制，确保其在允许的范围内。\r\n- 使用安全的整数操作函数：使用安全的整数操作函数，如`add_with_overflow()`、`sub_with_overflow()`、`mul_with_overflow()`等，这些函数会检查并处理溢出情况，确保计算结果在安全范围内。\r\n- 类型检查和转换：在进行整数运算或操作之前，进行类型检查和转换，确保操作数的类型和范围是合适的。\r\n- 强制性编码标准和最佳实践：制定强制性的编码标准和最佳实践，包括对整数运算和操作的规范和限制，以帮助程序员编写更可靠、安全的代码。\r\n- 静态代码分析和测试：使用静态代码分析工具和测试技术来检测和识别潜在的整数溢出问题。这些工具可以帮助发现代码中可能存在的溢出漏洞，并及时修复。", "title": "如何预防整数溢出或环绕"}], "cnvd_id": "", "cve_id": "CVE-2026-59346", "cvss": {"cvssv31": [{"source": "security@vmware.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H", "cwe": "CWE-190", "description": "VMware Workstation 与 VMware Fusion 是 Broadcom 旗下的闭源商业桌面虚拟化产品，分别运行于 Windows/Linux 与 macOS 主机，用于在桌面环境中创建和管理虚拟机，其 VMXNET3 虚拟网卡由宿主机侧的 VMX 进程模拟。\n受影响版本中，VMXNET3 虚拟网络适配器的设备模型实现存在整数溢出缺陷，在客户机内拥有本地管理员权限的攻击者可经由该虚拟网卡向宿主机侧的设备模拟逻辑提交触发溢出的输入，破坏宿主机进程的内存状态，最终实现虚拟机逃逸并在宿主机上执行代码。VMXNET3 是两类产品支持的常用高性能半虚拟化网卡，攻击由客户机本地发起，无需网络可达性与宿主机侧用户交互。\n修复版本中通过发布 26H1u1 更新修复 VMXNET3 设备模型中的整数溢出缺陷，Workstation Pro 26H1u1 与 Fusion 26H1u1 的官方发布说明均确认解决该问题；Broadcom 同时声明无可用变通措施，需通过升级完成修复。", "effects": [{"comp_name": "vmware_fusion", "ecosystem": "linux", "versions": [{"affected_version": "[25H2,26H1u1)", "min_fixed_version": "26H1u1", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "vmware_workstation", "ecosystem": "linux", "versions": [{"affected_version": "[25H2,26H1u1)", "min_fixed_version": "26H1u1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "低", "fix_suggestion": "建议修复", "kind": "整数溢出或环绕", "kind_en": "整数溢出或环绕", "last_modified_time": "2026-09-15", "level": "Critical", "mps_id": "MPS-14a5-f407", "poc": true, "poc_url": [], "published_time": "2026-10-07", "reference_url_list": [{"url": "https://cybersecuritynews.com/vmware-workstation-and-fusion-vulnerabilities/", "name": ""}, {"url": "https://support.broadcom.com/web/ecx/support-content-notification/-/external/content/SecurityAdvisories/0/38288", "name": ""}, {"url": "https://techdocs.broadcom.com/us/en/vmware-cis/desktop-hypervisors/workstation-pro/26H1/release-notes/vmware-workstation-pro-26h1u1-release-notes.html", "name": ""}, {"url": "https://securityonline.info/vmware-cve-2026-59346-code-execution-host/", "name": ""}], "scope_influence": "", "tags": ["poc", "应用软件"], "title": "VMware VMXNET3 整数溢出漏洞", "_translated": true, "_saved_at": "2026-10-07T08:16:39+00:00", "_first_saved_at": "2026-10-07T08:16:39+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-14a5-f407"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-105844", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4. scs1024.com/hd/MPS-3f7f-8c69"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-104712", "cvss": {}, "cvss_score": 7.5, "cvss_vector": "", "cwe": "CWE-405", "description": "Apache Struts 是开源 Java MVC 框架，用于构建企业级 Web 应用，类型转换与标签渲染位于可分发模块 struts2-core。\n受影响版本中，StringConverter.convertToString 在格式化 BigDecimal、Double 或 Float 时把 NumberFormat 的 maximumFractionDigits 设为 Integer.MAX_VALUE。请求参数绑定为 java.math.BigDecimal 并经 Struts 标签库渲染时，DecimalFormat 按该值的 scale 输出全部小数位，响应体积可相对请求放大多个数量级，未认证的远程调用方能够以低流量持续消耗服务器 CPU 与出站带宽。未绑定 BigDecimal 请求参数，或未通过标签库渲染该属性的应用不受影响。\n修复版本中通过将 maximumFractionDigits 上限改为常量 340，使输出长度不再跟随任意大的 BigDecimal scale。不超过该上限的数值仍按原精度格式化，超出上限的值被舍入，从而切断响应随请求参数 scale 放大的路径。", "effects": [{"comp_name": "org.apache.struts:struts2-core", "ecosystem": "maven", "versions": [{"affected_version": "[2.5.14,2.5.33]", "min_fixed_version": "", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[6.0.0,6.12.0)", "min_fixed_version": "6.12.0", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[7.0.0,7.4.0)", "min_fixed_version": "7.4.0", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "不对称的资源消耗（放大攻击）", "kind_en": "不对称资源消耗（放大）", "last_modified_time": "2026-10-05", "level": "High", "mps_id": "MPS-622c-62bf", "poc": false, "poc_url": [], "published_time": "2026-10-05", "reference_url_list": [{"url": "http://www.mail-archive.com/announce@apache.org/msg12199.html", "name": ""}, {"url": "https://cwiki.apache.org/confluence/display/WW/S2-076", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-104712", "name": ""}, {"url": "https://struts.apache.org/", "name": ""}, {"url": "https://struts.apache.org/announce-2026", "name": ""}, {"url": "https://issues.apache.org/jira/browse/WW-5711", "name": ""}, {"url": "https://github.com/apache/struts/c U:X", "cwe": "CWE-862", "description": "Plane 是开源项目与任务管理平台，用于管理工作区、项目、工作项与成员协作。\n受影响版本中，GET /api/workspaces/{slug}/entity-search/ 由 SearchEndpoint.get 处理。该视图位于 apps/api/plane/app/views/search/base.py，只继承 BaseAPIView 的 IsAuthenticated，没有校验调用者是否属于 URL 中的工作区。任意已认证用户在知道工作区 slug 时，将 query_type 设为 user_mention 后可读取该工作区成员的显示名、UUID 与头像 URL；请求同时携带 project_id 时，接口按同样条件返回 ProjectMember 记录。\n修复版本中通过为 SearchEndpoint 设置 permission_classes 为 WorkspaceUserPermission，在执行成员查询前要求调用者是目标工作区的活跃成员，非成员请求被拒绝，不再返回其他工作区的成员信息。", "effects": [{"comp_name": "plane", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.4.0)", "min_fixed_version": "1.4.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-10-06", "level": "High", "mps_id": "MPS-3560-zuoy", "poc": false, "poc_url": [], "published_time": "2026-10-06", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-3560-zuoy", "name": "https://www.oscs1024.com/hd/MPS-3560-zuoy"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-104968", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-104968"}, {"url": "https://github.com/makeplane/plane/security/advisories/GHSA-32q3-mqpc-3mhv", "name": "https://github.com/makeplane/plane/security/advisories/GHSA-32q3-mqpc-3mhv"}, {"url": "https://github.com/makeplane/plane/pull/9296", "name": "https://github.com/makeplane/plane/pull/9296"}, {"url": "https://github.com/makeplane/plane/commit/28ae25b564351abaf8b36d4a3ba6d32f80fbf075", "name": "https://github.com/makeplane/plane/commit/28ae25b564351abaf8b36d4a3ba6d32f80fbf075"}, {"url": "https://github.com/makeplane/plane/releases/tag/v1.4.0", "name": "https://github.com/makeplane/plane/releases/tag/v1.4.0"}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "Plane跨工作区成员枚举", "_translated": true, "_saved_at": "2026-10-0 的 uiLabelFormat，然后渲染解析相同请求缓存条目类型的 Entry，攻击者可以导致 renderObjectTemplate() 评估请求中提供的任意 Twig。\n\n\n\n此渲染路径未沙箱化。因此，可调用的 Twig 字符串可以访问 PHP 函数，例如 system()，从而以 PHP/Web 服务器进程的权限执行操作系统命令。\n\n\n\n未启用可选权限的活跃非管理员 Craft Team 用户重现了该问题。无需访问条目编辑、设置、实用程序、用户管理、项目配置、文件系统、Kubernetes 或环境变量。", "effects": [{"comp_name": "cms", "ecosystem": "linux", "versions": [{"affected_version": "[5.0.0,5.11.0)", "min_fixed_version": "5.11.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "模板注入", "kind_en": "模板引擎中使用的特殊元素的不正确中和", "last_modified_time": "2026-10-06", "level": "High", "mps_id": "MPS-wgkh-s6tb", "poc": false, "poc_url": [], "published_time": "2026-10-06", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-wgkh-s6tb", "name": "https://www.oscs1024.com/hd/MPS-wgkh-s6tb"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-105985", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-105985"}, {"url": "https://www.hckrt.com/hacktivity/HCKRT-PVWH7W", "name": ""}, {"url": "https://github.com/craftcms/cms/releases/tag/5.11.0", "name": ""}, {"url": "https://github.com/craftcms/cms", "name": ""}, {"url": "https://github.com/craftcms/cms/security/advisories/GHSA-g48f-wc2q-4rrv", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "通过渲染组件条目类型覆盖进行身份验证的 RCE", "_translated": true, "_saved_at": "2026-10-06T11:40:34+00:00", "_first_saved_at": "2026-10-06T11:40:34+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-wgkh-s6tb"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-12171", "cvss": {"cvssv31": [{"source": "7ffcee3d-2c14-4c3e-b844-86c6a321a158", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}], "cvssv4": [{"source": "7ffcee3d-2c14-4c3e-b844-86c6a321a158", "vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:N/UI:A/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.4}]}, "cvss_score": 8.4, "cvss_vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:N/UI:A/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-918", "description": "auto-changelog 是 cookpete 维护的开源 Node.js 命令行工具，用于根据 git 标签与提交历史生成变更日志。\n受影响版本中，src/run.js 的 getOptions 将目标仓库内 .auto-changelog 文件和 package.json 的 auto-changelog 字段合并进运行选项。handlebarsSetup 随后进入 src/template.js 的 compileTemplate，并被传给 require()，因此在不可信仓库或检出不可信拉取请求的 CI 中执行该命令时，会加载攻击者提交的脚本并以当前用户或 CI 任务权限执行，且无需安装该仓库依赖。plugins 会经 importCwd 加载仓库内模块。\n修复版本中通过在 getOptions 采纳仓库配置前调用 assertRepoConfigSafe，拒绝仓库配置中的 handlebarsSetup、plugins、URL 形式的 template，以及会注入 git 参数或写出仓库目录之外的 remote、output、appendGitLog 和 appendGitTag；只有命令行显式传入 --unsafe-config 时才继续沿用这些选项。", "effects": [{"comp_name": "auto-changelog", "ecosystem": "npm", "versions": [{"affected_version": "(-∞,2.6.1)", "min_fixed_version": "2.6.1", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SSRF", "kind_en": "服务器端请求伪造 (SSRF)", "last_modified_time": "2026-10-06", "level": "High", "mps_id": "MPS-qzp9-i4ek", "poc": false, "poc_url": [], "published_time": "2026-10-06", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-qzp9-i4ek", "name": "https://www.oscs1024.com/hd/MPS-qzp9-i4ek"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-12171", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-12171"}, {"url": "https://github.com/cookpete/auto-changelog/security/advisories/GHSA-xpvr-2hvx-m8q4", "name": ""}, {"url": "https://github.com/cookpete/auto-changelog/commit/1d02a48a0a57c69a3cd268aca375d64d50877c1a", "name": ""}], "scope_influence": "", "tags": ["npm", "开源"], "title": "auto-changelog代码执行漏洞", "_translated": true, "_saved_at": "2026-10-05T17:42:51+00:00", "_first_saved_at": "2026-10-05T17:42:51+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-qzp9-i4ek"}, {"analysis_status": 0, "articles": [{"content": "- 条件竞争漏洞是由于程序中存在多个代码块同时访问同一个条件判断语句而导致的错误。在程序中，条件判断语句通常用于决定是否执行某些代码块。当一个程序有多个代码块同时访问同一个条件判断语句时，这些代码块可能会同时执行，从而导致程序执行结果出现不可预测的错误。", "title": "什么是竞争条件"}, {"content": "- 线程切换攻击：线程切换攻击是指攻击者通过利用竞争条件漏洞，使程序在执行时频繁切换线程，从而导致系统资源耗尽，最终实现拒绝服务攻击。\n- 内存泄漏攻击：内存泄漏攻击是指攻击者通过利用竞争条件漏洞，使得程序不断申请内存，但最终无法释放内存，从而导致内存泄漏，最终程序崩溃。\n- 缓存穿透攻击：缓存穿透攻击是指攻击者通过利用竞争条件漏洞，使得程序在访问缓存时，被缓存的数据并非当前最新的数据，从而攻击者可以获取到未更新的数据。\n- 指令重放攻击：指令重放攻击是指攻击者通过利用竞争条件漏洞，在程序执行时，将先前保存的指令序列重新执行，从而实现绕过某些验证，获取系统权限等攻击目的。\n", "title": "竞争条件常见的攻击方式"}, {"content": "- 使用互斥锁：在条件判断语句中，使用互斥锁来确保只有一个代码块能够访问变量。使用互斥锁可以提高程序的安全性和可靠性。\n- 使用条件封印：在条件判断语句中，将可能会修改变量的代码块封印起来，以确保这些代码块无法被其他代码块访问。\n- 使用条件过滤：在条件判断语句中，使用条件过滤来过滤掉那些不可能发生的条件判断语句。例如，对于一个包含多个条件判断语句的循环，可以只保留其中一个条件的判断，而将其他条件的判断语句过滤掉。\n- 使用性能优化：对于一些条件判断语句，可以使用性能优化来避免条件竞争的情况。例如，可以使用数组或链表等数据结构来存储条件判断语句中的变量，从而避免条件竞争的情况。", "title": "如何预防竞争条件"}], "cnvd_id": "", "cve_id": "CVE-2026-104970", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.1}]}, "cvss_score": 8.1, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-362", "description": "Plane 是开源项目管理工具，用于团队工作项跟踪、迭代规划与自托管实例管理。\n受影响版本中，未认证的 POST /api/instances/admins/sign-up/ 进入 InstanceAdminSignUpEndpoint.post。该方法用 InstanceAdmin.objects.first() 判断实例管理员是否已存在，并在没有原子事务、行锁、唯一约束或 advisory lock 的情况下创建 User 与 InstanceAdmin。两个使用不同邮箱的并发请求可同时观察到管理员不存在，分别完成注册并经 user_login 获得实例管理员会话，与合法操作者共享实例管理权限。\n修复版本中通过把检查与创建放入 transaction.atomic()，对 Instance 单例行执行 select_for_update()，并在锁内用 is_setup_done 与 InstanceAdmin.objects.exists() 复查后才创建账户，使并发注册不能同时成为实例管理员。", "effects": [{"comp_name": "plane", "ecosystem": "linux", "versions": [{"affected_version": "[0.13,1.3.1]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "竞争条件", "kind_en": "使用共享资源并发执行且同步不正确（“竞争条件”）", "last_modified_time": "2026-10-06", "level": "High", "mps_id": "MPS-1v5t-kdn2", "poc": false, "poc_url": [], "published_time": "2026-10-06", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-1v5t-kdn2", "name": "https://www.oscs1024.com/hd/MPS-1v5t-kdn2"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-104970", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-104970"}, {"url": "https://github.com/makeplane/plane/security/advisories/GHSA-p548-28jp-wr4p", "name": "https://github.com/makeplane/plane/security/advisories/GHSA-p548-28jp-wr4p"}, {"url": "https://github.com/makeplane/plane/pull/9332", "name": "https://github.com/makeplane/plane/pull/9332"}, {"url": "https://github.com/makeplane/plane/commit/7fbf14a6cb494bbf5866e2b293b28a6d8a7e52c3", "name": "https://github.com/makeplane/plane/commit/7fbf14a6cb494bbf5866e2b293b28a6d8a7e52c3"}, {"url": "https://github.com/makeplane/plane/releases/tag/v1.4.0", "name": "https://github.com/makeplane/plane/releases/tag/v1.4.0"}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "Plane管理员竞态漏洞", "_translated": true, "_saved_at": "2026-10-05T17:42:52+00:00", "_first_saved_at": "2026-10-05T17:42:52+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-1v5t-kdn2"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "attack_vector_type": "Local", "cnvd_id": "", "cve_id": "CVE-2026-98368", "cvss": {}, "cvss_score": 7.8, "cvss_vector": "", "cwe": "CWE-416", "description": "Linux 内核是开源操作系统内核，其 IPv4 与 IPv6 ESP 模块位于 net/ipv4/esp4.c 和 net/ipv6/esp6.c，用于 IPsec 封装安全载荷的出站加密。\n受影响版本中，当 esp-\u003einplace 为 false 时，esp_output_head() 向 skb frag 数组追加 trailer frag，esp_output_tail() 再用 get_page() 取得的目的页替换原有 frag。skb 若带有 SKBFL_MANAGED_FRAG_REFS，payload frag 归 ubuf 所有，不能按页单独引用或解引用，但该路径在改写 frag 数组前没有调用 skb_zcopy_downgrade_managed()。esp_ssg_unref() 随后遍历源 scatterlist 并对每个 frag 调用 skb_page_unref()，使仍处于 GUP pin 状态的 zerocopy 页引用计数降到 pin bias 之下，造成释放后使用；esp_output_tail() 将目的页装入 frag 0 后仍保留 SKBFL_MANAGED_FRAG_REFS，skb_release_data() 走 skip_unref 分支，按包速率泄漏 x-\u003exfrag 页。\n修复版本中通过在 esp_output_head() 与 esp6_output_head() 将 esp-\u003einplace 置为 false 之后、改写 frag 数组之前调用 skb_zcopy_downgrade_managed()，为已有 frag 取得真实页引用并清除 SKBFL_MANAGED_FRAG_REFS，使 esp_ssg_unref() 的逐 frag 解引用与 skb_release_data() 的页释放重新平衡，不再留下混合所有权的 frag 数组。", "effects": [{"comp_name": "linux_kernel", "ecosystem": "linux", "versions": [{"affected_version": "[6.2,6.6.158)", "min_fixed_version": "6.6.158", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.0,6.1.189)", "min_fixed_version": "6.1.189", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.19,7.2.8)", "min_fixed_version": "7.2.8", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.7,6.12.112)", "min_fixed_version": "6.12.112", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[7.3-rc1,7.3-rc4)", "min_fixed_version": "7.3-rc4", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.13,6.1 ptions(tikz_engine=\"tectonic\") 且主机存在 Tectonic 可执行文件时，DocumentConverter.convert 接收的 LaTeX 会由 LatexDocumentBackend 解析，EnvironmentHandlerMixin._process_tikzpicture 再把 tikzpicture 正文与文档导言区传入 TectonicEngine.render。render 将不可信内容写入临时 diagram.tex 后直接执行 tectonic，未限制 \\openin 与 \\openout 等 TeX 文件原语，转换进程可读其权限范围内的文件，并可创建或覆盖可写文件。仅当 tikz_engine_allow_shell_escape 为真时，命令行才会附加 -Z shell-escape，从而允许 TeX 执行 shell 命令。未启用 Tectonic 渲染的默认配置不受影响。\n修复版本中通过将 TectonicEngine 的 allow_shell_escape 默认值改为 False，在未开启 shell escape 时由 _build_command 追加 --untrusted 与 --only-cached，并在编译前用 _precheck_staged_files 扫描导言区、TikZ 正文和已暂存文件，发现 \\openin、\\openout、\\XeTeXpicfile、\\XeTeXpdffile 或绝对路径、家目录、盘符、父目录文件引用时跳过渲染并保留原始 TikZ，从而阻断这类文件原语和越界路径进入 Tectonic 编译。", "effects": [{"comp_name": "docling", "ecosystem": "pip", "versions": [{"affected_version": "[2.94.0,2.132.0)", "min_fixed_version": "2.132.0", "repository": "pip", "solutions": [], "upstream": true}]}, {"comp_name": "docling-slim", "ecosystem": "pip", "versions": [{"affected_version": "[2.94.0,2.132.0)", "min_fixed_version": "2.132.0", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "资源默认不安全", "kind_en": "使用不安全默认值初始化资源", "last_modified_time": "2026-10-06", "level": "High", "mps_id": "MPS-15ys-269f", "poc": false, "poc_url": [], "published_time": "2026-10-06", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-15ys-269f", "name": "https://www.oscs1024.com/hd/MPS-15ys-269f"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-105744", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-105744"}, {"url": "https://github.com/docling-project/docling/security/advisories/GHSA-x3q2-h9hx-4r4j", "name": "https://github.com/docling-project/docling/security/advisories/GHSA-x3q2-h9hx-4r4j"}, {"url": "https://github.com/docling-project/docling/pull/4419", "name": "https://github.com/docling-project/docling/pull/4419"}, {"url": "https://github.com/docling-project/docling/commit/38b6fa0a465d46fdacbbec333f50fa19c4f6b342", "name": "https://github.com/docling-project/docling/commit/38b6fa0a465d46fdacbbec333f50fa19c4f6b342"}, {"url": "https://github.com/docling-project/docling/releases/tag/v2.132.0", "name": "https://github.com/docling-project/docling/releases/tag/v2.132.0"}], "scope_influence": "", "tags": ["AI", "python", "开源"], "title": "Docling任意文件读写", "_translated": true, "_saved_at": "2026-10-05T23:35:31+00:00", "_first_saved_at": "2026-10-05T23:35:31+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-15ys-269f"}, {"analysis_status": 0, "articles": [{"content": "跨界内存读是指应用程序在读取内存时，未正确验证或限制读取的内存范围。攻击者利用这种漏洞可以读取应用程序内存中的敏感数据，如密码、加密密钥、会话令牌等。常见的原因是由于缓冲区溢出、格式化字符串漏洞或其他内存错误导致的。", "title": "什么是越界读取"}, {"content": "攻击者可以通过不当构造的输入来触发跨界内存读漏洞。攻击者可能会通过向应用程序发送特定的输入，使其读取超过预期的内存区域。攻击者可以利用这个漏洞来获取敏感信息，如其他用户的数据、操作系统的敏感数据或应用程序的内部状态。", "title": "越界读取常见的攻击方式"}, {"content": "- 输入验证和限制：应用程序应对所有输入数据进行严格的验证和限制。确保输入数据的长度、格式和内容符合预期，避免超出缓冲区或访问非预期的内存区域。\n- 内存安全编程实践：开发人员应使用安全的编程实践，如避免使用不安全的函数、正确处理内存分配和释放操作，以及遵循最小特权原则。\n- 使用安全的编程语言和库：选择使用安全性较高的编程语言和库，这些语言和库在内存管理和安全性方面提供了更多的保护机制。\n- 定期进行代码审查和安全测试：定期审查应用程序的代码，并进行安全测试，以发现潜在的跨界内存读漏洞。使用静态代码分析工具和漏洞扫描工具来辅助检测和修复问题。\n- 实施防御性编程技术：应用程序应采用防御性编程技术，如使用随机化地址空间布局（ASLR）、堆栈保护机制（如堆栈溢出保护）和数据执行预防（DEP）等。\n- 及时更新和修补：及时应用程序和操作系统的安全更新和补丁，以确保已知的跨界内存读漏洞得到修复。及时更新相关软件和库，以避免使用已知存在漏洞的版本。", "title": "如何预防越界读取"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-98372", "cvss": {}, "cvss_score": 7.5, "cvss_vector": "", "cwe": "CWE-125", "description": "Linux 内核是开源操作系统内核。其 XFRM IPTFS 子系统实现 IPsec IP-TFS（AGGFRAG）隧道模式，在安全关联上接收外层报文并重组内层数据包。\n受影响版本中，iptfs_skb_reset_frag_walk() 在 offset 不小于 walk-\u003epast + walk-\u003efrags[walk-\u003efragi].len 时无上界执行 walk-\u003efragi++，并解引用栈上固定数组 walk-\u003efrags[]，全程不与 walk-\u003enr_frags 比较。iptfs_skb_can_add_frags() 没有 iptfs_skb_add_frags() 已有的长度守卫，仍会无条件调用前者。送入 IPTFS 安全关联接收路径的 IP-TFS 载荷从 iptfs_input() 进入 iptfs_reassem_cont() 后，可在 offset 达到或超过片段总长度时越界读取栈内存。\n修复版本中通过在 iptfs_skb_can_add_frags() 调用 iptfs_skb_reset_frag_walk() 之前加入与 iptfs_skb_add_frags() 相同的前置判断，在 walk-\u003enr_frags 为 0 或 offset 大于等于 walk-\u003etotal + walk-\u003einitial_offset 时直接返回 false，使越界遍历不再发生，并回退到原有线性化拷贝路径。", "effects": [{"comp_name": "linux_kernel", "ecosystem": "linux", "versions": [{"affected_version": "[6.19-rc1,7.2.8)", "min_fixed_version": "7.2.8", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.14,6.18.54)", "min_fixed_version": "6.18.54", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[7.3-rc1,7.3-rc4)", "min_fixed_version": "7.3-rc4", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界读取", "kind_en": "越界读取", "last_modified_time": "2026-10-06", "level": "High", "mps_id": "MPS-b2ka-q743", "poc": false, "poc_url": [], "published_time": "2026-10-06", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-b2ka-q743", "name": "https://www.oscs1024.com/hd/MPS-b2ka-q743"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-98372", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-98372"}, {"url": "https://git.kernel.org/stable/c/7e1c6884a0b494b7e3f204877f94c1e07a117bf7", "name": ""}, {"url": "https://git.kernel.org/stable/c/da56d0ee93d1bad779b0486f2fab92d1bc1f0cf3", "name": ""}, {"url": "https://git.kernel.org/stable/c/d042487dc118e494db2e2c1382310255c90ff544", "name": ""}], "scope_influence": "", "tags": ["操作系统"], "title": "内核IPTFS栈越界读取", "_translated": true, "_saved_at": "2026-10-06T11:40:41+00:00", "_first_saved_at": "2026-10-06T11:40:41+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-b2ka-q743"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过向受信任的数据序列化过程中添加恶意数据，从而在序列化和反序列化过程中执行恶意代码的攻击漏洞。这种漏洞通常存在于使用序列化 (serialization) 机制存储和传输数据的程序中。\n", "title": "什么是反序列化"}, {"content": "- 注入攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码注入到程序中，从而实现代码执行的目的。\n- 反射攻击：攻击者使用反射机制，在序列化过程中动态生成恶意数据，并将恶意代码注入到程序中，从而实现代码执行的目的。\n- 缓冲区溢出攻击：攻击者通过在序列化过程中向缓冲区输入恶意数据，导致缓冲区溢出，从而破坏程序的内存管理，实现代码执行的目的。\n- 格式字符串攻击：攻击者通过在序列化过程中输入恶意数据，导致程序使用错误的格式字符串，从而实现代码执行的目的。\n- 数据流攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码作为一个数据流传递给程序，从而实现代码执行的目的。\n", "title": "反序列化常见的攻击方式"}, {"content": "- 不信任输入数据：程序应该严格检查输入数据的有效性，并避免使用不受信任的数据。\n- 使用安全的序列化机制：程序应该使用安全的序列化机制，如 JSON 或 XML 序列化，而不是第三方序列化库。\n- 最小特权原则：程序应该限制对受信任数据的处理权限，并避免在运行时修改数据。\n- 代码审查和漏洞扫描：程序应该进行代码审查和漏洞扫描，以发现和修复潜在的安全漏洞。\n", "title": "如何预防反序列化"}], "cnvd_id": "", "cve_id": "CVE-2026-103831", "cvss": {"cvssv4": [{"source": "cve-coordination@incibe.es", "vector": "CVSS:4.0/AV:L/AC:H/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:4.0/AV:L/AC:H/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-502", "description": "CVE-2026-103831：TrueLayer Magento 2 插件的 Psr16CacheAdapter 组件中存在不安全反序列化漏洞，原因是使用 PHP 的本机 unserialize() 函数，在检索缓存中存储的数据时没有限制允许的类。已经能够将受操纵的数据写入 Magento 使用的缓存后端（例如 Redis 或 Memcached）的攻击者可以注入特制的 PHP 对象并触发其反序列化，从而可能导致通过应用程序环境中可用的小工具字符串执行任意代码。因此，利用需要一个先决条件，允许通过访问本地文件系统或可从 Magento 环境访问的缓存基础设施来写入缓存基础设施。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "反序列化", "kind_en": "不可信数据的反序列化", "last_modified_time": "2026-10-06", "level": "High", "mps_id": "MPS-kxrb-ado4", "poc": false, "poc_url": [], "published_time": "2026-10-06", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-kxrb-ado4", "name": "https://www.oscs1024.com/hd/MPS-kxrb-ado4"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-103831", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-103831"}, {"url": "https://www.incibe.es/en/incibe-cert/notices/aviso/insecure-deserialization-truelayer-magento-2-plugin", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "TrueLayer Magento 2 插件中的不安全反序列化", "_translated": true, "_saved_at": "2026-10-06T11:40:37+00:00", "_first_saved_at": "2026-10-06T11:40:37+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-kxrb-ado4"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-84854", "cvss": {"cvssv31": [{"source": "2fc02b1f-71e7-4514-a878-169626f68903", "vector": "CVSS:3.1/AV:L/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7}]}, "cvss_score": 7, "cvss_vector": "CVSS:3.1/AV:L/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-787", "description": "在版本 6.72 以下的 Windows WibuKey 驱动程序中，计算内核缓冲区大小时对用户输入的验证不足可能会导致少量数据写入预期内核缓冲区之外。这可能会导致系统崩溃。在不利的情况下，相邻的内核内存可能会被修改。", "effects": [{"comp_name": "wibukey", "ecosystem": "linux", "versions": [{"affected_version": "[0,6.72)", "min_fixed_version": "6.72", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-10-06", "level": "High", "mps_id": "MPS-ge1c-o9in", "poc": false, "poc_url": [], "published_time": "2026-10-06", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ge1c-o9in", "name": "https://www.oscs1024.com/hd/MPS-ge1c-o9in"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-84854", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-84854"}, {"url": "https://cdn.wibu.com/fileadmin/wibu_downloads/security_advisories/AdvisoryWIBU-100065.pdf", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Windows 版 WibuKey 上的越界写入", "_translated": true, "_saved_at": "2026-10-06T11:40:39+00:00", "_first_saved_at": "2026-10-06T11:40:39+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ge1c-o9in"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，从而导致未授权的用户或资源可以被访问或篡改。", "title": "什么是访问控制不当"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n", "title": "访问控制不当常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防访问控制不当"}], "cnvd_id": "", "cve_id": "CVE-2026-104335", "cvss": {"cvssv31": [{"source": "psirt@us.ibm.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-284", "description": "IBM Langflow OSS 1.0.0 到 1.12.2 可能允许经过身份验证的远程攻击者由于访问控制不当而执行任意代码。", "effects": [{"comp_name": "Langflow OSS", "ecosystem": "linux", "versions": [{"affected_version": "(1.0.0,1.12.2]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost tion/-/external/content/SecurityAdvisories/0/38288", "name": ""}, {"url": "https://techdocs.broadcom.com/us/en/vmware-cis/desktop-hypervisors/workstation-pro/26H1/release-notes/vmware-workstation-pro-26h1u1-release-notes.html", "name": ""}, {"url": "https://techdocs.broadcom.com/us/en/vmware-cis/desktop-hypervisors/fusion-pro/26H1/release-notes/vmware-fusion-26h1u1-release-notes.html", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "VMware HGFS 栈溢出逃逸漏洞", "_translated": true, "_saved_at": "2026-10-07T08:16:38+00:00", "_first_saved_at": "2026-10-07T08:16:38+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-01ab-afad"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过向受信任的数据序列化过程中添加恶意数据，从而在序列化和反序列化过程中执行恶意代码的攻击漏洞。这种漏洞通常存在于使用序列化 (serialization) 机制存储和传输数据的程序中。\n", "title": "什么是反序列化"}, {"content": "- 注入攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码注入到程序中，从而实现代码执行的目的。\n- 反射攻击：攻击者使用反射机制，在序列化过程中动态生成恶意数据，并将恶意代码注入到程序中，从而实现代码执行的目的。\n- 缓冲区溢出攻击：攻击者通过在序列化过程中向缓冲区输入恶意数据，导致缓冲区溢出，从而破坏程序的内存管理，实现代码执行的目的。\n- 格式字符串攻击：攻击者通过在序列化过程中输入恶意数据，导致程序使用错误的格式字符串，从而实现代码执行的目的。\n- 数据流攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码作为一个数据流传递给程序，从而实现代码执行的目的。\n", "title": "反序列化常见的攻击方式"}, {"content": "- 不信任输入数据：程序应该严格检查输入数据的有效性，并避免使用不受信任的数据。\n- 使用安全的序列化机制：程序应该使用安全的序列化机制，如 JSON 或 XML 序列化，而不是第三方序列化库。\n- 最小特权原则：程序应该限制对受信任数据的处理权限，并避免在运行时修改数据。\n- 代码审查和漏洞扫描：程序应该进行代码审查和漏洞扫描，以发现和修复潜在的安全漏洞。\n", "title": "如何预防反序列化"}], "cnvd_id": "", "cve_id": "CVE-2026-65142", "cvss": {"cvssv31": [{"source": "psirt@nvidia.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "cwe": "CWE-502", "description": "NVIDIA Model-Optimizer 包含一个漏洞，攻击者可能会导致不受信任的数据反序列化。成功利用此漏洞可能会导致代码执行、数据篡改、拒绝服务和信息泄露。", "effects": [{"comp_name": "Model-Optimizer", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,0-0.43.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "e 披露可核验的修复代码。", "effects": [{"comp_name": "container_storage_modules", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.18.0)", "min_fixed_version": "1.18.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "使用不充分的随机数", "kind_en": "使用不充分的随机值", "last_modified_time": "2026-10-06", "level": "High", "mps_id": "MPS-squ5-brxe", "poc": false, "poc_url": [], "published_time": "2026-10-07", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-squ5-brxe", "name": "https://www.oscs1024.com/hd/MPS-squ5-brxe"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-76105", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-76105"}, {"url": "https://www.dell.com/support/kbdoc/en-us/000515771/dsa-2026-448-security-update-for-dell-container-storage-modules-multiple-vulnerabilities?msockid=3021cac2195069ed3194ddad186a68f9", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "CSM随机数不足漏洞", "_translated": true, "_saved_at": "2026-10-06T17:45:13+00:00", "_first_saved_at": "2026-10-06T17:45:13+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-squ5-brxe"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-106492", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:L/I:H/A:L", "severity": "high", "base_score": 7.6}]}, "cvss_score": 7.6, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:L/I:H/A:L", "cwe": "CWE-863", "description": "Backstage 是一个用于构建开发人员门户的开放框架。在 0.16.1 和 0.17.8 之前，@backstage/backend-defaults 包受到服务凭证委派期间访问限制保留不当的影响。配置有访问限制（例如只读）的外部服务凭证可以通过插件委托路径路由请求来绕过这些限制。这可能允许受限服务执行超出其预期范围的操作，包括对其仅限于只读访问的插件的写入操作。此问题已在版本 0.16.1 和 0.17.8 中修复。", "effects": [{"comp_name": "backend-defaults", "ecosystem": "linux", "versions": [{"affected_version": "[0.17.0,0.17.8)", "min_fixed_version": "0.17.8", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,0.16.1)", "min_fixed_version": "0.16.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "backstage", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.49.6)", "min_fixed_version": "1.49.6", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[1.50.0-next.0,1.54.6)", "min_fixed_version": "1.54.6", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-10-07", "level": "High", "mps_id": "MPS-vw6h-k5fd", "poc": false, "poc_url": [], "published_time": "2026-10-07", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-vw6h-k5fd", "name": "https://www.oscs1024.com/hd/MPS-vw6h-k5fd"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-106492", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-106492"}, {"url": "https://github.com/backstage/backstage/security/advisories/GHSA-cq7v-rfgc-5c7v", " nce_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-jrsa-vek8", "name": "https://www.oscs1024.com/hd/MPS-jrsa-vek8"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-82212", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-82212"}, {"url": "https://wpscan.com/vulnerability/66df6adb-336c-4660-9a63-5e6e550a2edb/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Nexi XPay Build \u003c= 7.6.2 - 通过 NPG 通知处理程序绕过未经身份验证的付款", "_translated": true, "_saved_at": "2026-10-07T08:16:35+00:00", "_first_saved_at": "2026-10-07T08:16:35+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-jrsa-vek8"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-102173", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "cwe": "CWE-79", "description": "用于 WordPress 的 Kirki – 自由格式页面构建器、网站构建器和定制器插件在 6.3.1 及之前的所有版本中都容易通过注册元数据受到存储跨站点脚本攻击，这是由于“ExceptionalElements::image_element()”中的转义不足，它将用户元值直接连接到“\u003cimg src=\"…\"\u003e”属性中。这使得未经身份验证的攻击者可以注入任意 Web 脚本，每当用户访问渲染 Kirki 用户集合的页面时，这些脚本就会执行，该集合的图像元素绑定到九个注册元字段之一。需要启用公共用户注册，并且发布的页面包含“kirki-register”元素，该元素将所需的元素随机数打印到公共标记中。", "effects": [{"comp_name": "Kirki – Freeform Page Builder, Website Builder \u0026 Customizer", "ecosystem": "linux", "versions": [{"affected_version": "(0,6.3.1]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-10-07", "level": "High", "mps_id": "MPS-0257-kdub", "poc": false, "poc_url": [], "published_time": "2026-10-07", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-0257-kdub", "name": "https://www.oscs1024.com/hd/MPS-0257-kdub"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-102173", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-102173"}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/368001e9-3806-41d5-902e-0facf7fb31ff?source=cve", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/kirki/tags/6.3.1/includes/Frontend/Preview/ExceptionalElements.php#L1184", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/kirki/tags/6.3.1/includes/Frontend/Preview/ExceptionalElements.php#L1079", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/kirki/tags/6.3.1/includes/HelperFunctions.php#L1151", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/kirki/tags/6.3.1/ComponentLibrary/controller/CompLibFormHandler.php#L361", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/kirki/tags/6.3.1/ComponentLibrary/controller/CompLibFormHandler.php#L389", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/kirki/tags/6.3.1/ComponentLibrary/controller/CompLibFormHandler.php#L76", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/kirki/tags/6.3.1/ComponentLibrary/controller/ElementGenerator.php#L259", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/kirki/tags/6.3.1/includes/Frontend/Preview/Utils.php#L308", "name": ""}, {"url": "https://plugins.trac.wordpress.org/changeset?reponame=\u0026new=3718900%40kirki%2Ftags%2F6.3.2\u0026old=3697265%40kirki%2Ftags%2F6.3.1", "name": ""}, {"url": "https://plugins.trac.wordpress.org/changeset/3718900/kirki/trunk/includes/Frontend/Preview/ExceptionalElements.php", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-102173漏洞", "_translated": true, "_saved_at": "2026-10-07T08:16:42+00:00", "_first_saved_at": "2026-10-07T08:16:42+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-0257-kdub"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-70411", "cvss": {"cvssv31": [{"source": "security_alert@emc.com", "vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:U/C:L/I:H/A:N", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:U/C:L/I:H/A:N", "cwe": "CWE-306", "description": "Dell Container Storage Modules（CSM）Authorization 是 Dell 面向 Kubernetes 的存储授权组件，以代理方式部署在 Dell CSI 驱动与后端存储系统之间，为多租户环境提供基于角色的访问控制与配额管理，其中的 csm-authorization-tenant gRPC 服务（TenantService）负责租户实体与租户级角色、存储访问控制配置的管理，该组件为 Dell 闭源组件。\n受影响版本中，csm-authorization-tenant gRPC 服务（TenantService）的关键管理接口缺少认证校验（CWE-306），相邻网络中的攻击者无需任何凭证即可直接调用该 gRPC 服务，创建未授权的租户实体、向其他租户注入角色并修改存储访问控制标志，造成跨租户越权与存储访问策略被篡改。\n修复版本中通过在 TenantService 关键接口上补充认证校验并拒绝未认证请求，切断了未认证调用与租户管理操作之间的因果链，Dell 已在 CSM 1.18.0 中发布该修复，受影响用户需升级至 1.18.0 及以上版本。", "effects": [{"comp_name": "container_storage_modules", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.18.0)", "min_fixed_version": "1.18.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "csm-authorization", "ecosystem": "linux", "versions": [{"affected_version": "[2.4.0,+∞)", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "关键功能的认证机制缺失", "kind_en": "缺少关键功能的身份验证", "last_modified_time": "2026-10-06", "level": "High", "mps_id": "MPS-f6n5-i3hx", "poc": false, "poc_url": [], "published_time": "2026-10-07", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-f6n5-i3hx", "name": "https://www.oscs1024.com/hd/MPS-f6n5-i3hx"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-70411", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-70411"}, {"url": "https://www.dell.com/support/kbdoc/en-us/000515771/dsa-2026-448-security-update-for-dell-container-storage-modules-multiple-vulnerabilities?msockid=3021cac2195069ed3194ddad186a68f9", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Dell CSM Authorization 认证缺失漏洞", "_translated": true, "_saved_at": "2026-10-06T17:45:15+00:00", "_first_saved_at": "2026-10-06T17:45:15+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-f6n5-i3hx"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-26287", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:L/A:N", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:L/A:N", "cwe": "CWE-696", "description": "External Secrets Operator 是 CNCF 生态中开源的 Kubernetes 操作器，采用 Go 语言编写，用于从 Vault、AWS Secrets Manager 等第三方密钥服务读取信息并自动注入为 Kubernetes Secrets，其内置的 Webhook 生成器（generators.external-secrets.io/v1alpha1 Webhook）支持通过外部 HTTP 服务动态生成 Secret。\n受影响版本中，Webhook 生成器 generators/v1/webhook/webhook.go 的 Generate 方法初始化顺序错误，w.wh.EnforceLabels = true 设置之后才执行 w.wh = webhook.Webhook{} 零值重建，标签强制标志被清除，导致后续读取生成器 spec 引用的 Kubernetes Secret 时跳过 external-secrets.io/type=webhook 标签校验；具备创建 Webhook 生成器权限的攻击者可将生成器 spec 指向同命名空间内任意受害 Secret，受害 Secret 数据经模板渲染注入请求 URL 与 Body 发往攻击者控制的 URL，造成密钥泄露。\n修复版本中通过调整 Generate 方法的初始化顺序解决该问题，w.wh = webhook.Webhook{} 零值重建移至方法开头并先于 EnforceLabels = true 执行，标签强制标志不再被清除，getStoreSecret 恢复对引用 Secret 的 external-secrets.io/type=webhook 标签校验，未携带该标签的 Secret 读取直接返回错误，1.3.2 版本包含该修复。", "effects": [{"comp_name": "github.com/external-secrets/external-secrets", "ecosystem": "go", "versions": [{"affected_version": "[0.10.0,1.3.2)", "min_fixed_version": "1.3.2", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "不正确的行为次序", "kind_en": "不正确的行为秩序", "last_modified_time": "2026-10-07", "level": "High", "mps_id": "MPS-kb58-hnlu", "poc": false, "poc_url": [], "published_time": "2026-10-07", "reference_url_list": [{"url": "https://github.com/external-secrets/external-secrets/security/advisories/GHSA-q7hv-xx6h-q2x8", "name": ""}, {"url": "https://github.com/external-secrets/external-secrets/pull/5901", "name": ""}, {"url": "https://github.com/external-secrets/external-secrets/commit/25aa09275861e3ed6fc5d2a1a60b9ac3df4a93ba", "name": ""}, {"url": "https://github.com/external-secrets/external-secrets/releases/tag/v1.3.2", "name": ""}, {"url": "https://github.com/advisories/GHSA-q7hv-xx6h-q2x8", "name": ""}], "scope_influence": "", "tags": ["go"], "title": "External Secrets Operator标签校验绕过漏洞", "_translated": true, "_saved_at": "2026-10-06T17:45:21+00:00", "_first_saved_at": "2026-10-06T17:45:21+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-kb58-hnlu"}]}</script>
  <script>
    const payload = JSON.parse(document.getElementById("payload").textContent);
    const levelLabels = payload.level_labels || {};
    const items = payload.items || [];
    let filtered = items.slice();
    let activeId = null;

    const $ = (id) => document.getElementById(id);
    $("generatedAt").textContent = payload.generated_at || "-";
    $("retention").textContent = payload.retention_days ?? "-";
    $("cutoff").textContent = payload.cutoff_date || "-";
    $("count").textContent = String(payload.count ?? items.length);

    function levelClass(level) {
      const cn = levelLabels[level] || level || "";
      if (level === "Critical" || cn === "严重") return "crit";
      if (level === "High" || cn === "高危") return "high";
      return "other";
    }
    function levelText(level) {
      return levelLabels[level] || level || "-";
    }
    function esc(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }
    function scoreText(v) {
      if (v === null || v === undefined || v === "" || v === -1) return "-";
      return String(v);
    }

    function renderList() {
      const list = $("list");
      $("listCount").textContent = String(filtered.length);
      if (!filtered.length) {
        list.innerHTML = '<div class="empty">没有匹配项</div>';
        return;
      }
      list.innerHTML = filtered.map((it) => {
        const id = it.mps_id || it.cve_id;
        const active = id === activeId ? " active" : "";
        return `
          <button class="item${active}" data-id="${esc(id)}" type="button">
            <div class="item-top">
              <span class="cve">${esc(it.cve_id || it.mps_id || "-")}</span>
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
            </div>
            <div class="title">${esc(it.title || "-")}</div>
            <div class="item-foot">
              <span>CVSS ${esc(scoreText(it.cvss_score))}</span>
              <span>${esc(it.published_time || "-")}</span>
              ${it.poc ? "<span>POC</span>" : ""}
            </div>
          </button>`;
      }).join("");
      list.querySelectorAll(".item").forEach((btn) => {
        btn.addEventListener("click", () => selectById(btn.dataset.id));
      });
    }

    function refsHtml(it) {
      const refs = Array.isArray(it.reference_url_list) ? it.reference_url_list : [];
      const links = [];
      if (it._source_page) links.push({ url: it._source_page, name: "OSCS 详情" });
      if (it.cve_id) links.push({ url: `https://nvd.nist.gov/vuln/detail/${it.cve_id}`, name: "NVD" });
      refs.forEach((r) => {
        if (r && r.url) links.push({ url: r.url, name: r.name || r.url });
      });
      const seen = new Set();
      const uniq = [];
      for (const l of links) {
        if (seen.has(l.url)) continue;
        seen.add(l.url);
        uniq.push(l);
      }
      if (!uniq.length) return '<div class="box">无参考链接</div>';
      return `<div class="refs">${uniq.map((l) =>
        `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name || l.url)}</a>`
      ).join("")}</div>`;
    }

    function articlesHtml(it) {
      const arts = Array.isArray(it.articles) ? it.articles : [];
      if (!arts.length) return "";
      return `<div class="section"><h3>相关说明</h3>${arts.map((a) => `
        <div class="article">
          <h4>${esc(a.title || "说明")}</h4>
          <p>${esc(a.content || "")}</p>
        </div>`).join("")}</div>`;
    }

    function renderDetail(it) {
      const detail = $("detail");
      if (!it) {
        detail.innerHTML = '<div class="empty">暂无数据</div>';
        return;
      }
      const pocUrls = Array.isArray(it.poc_url) ? it.poc_url : [];
      detail.innerHTML = `
        <div class="d-head">
          <div>
            <h1 class="d-title">${esc(it.title || "-")}</h1>
            <div class="ids">
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
              <span class="chip">${esc(it.cve_id || "无 CVE")}</span>
              <span class="chip">${esc(it.mps_id || "-")}</span>
              ${it.poc ? '<span class="chip">有 POC</span>' : ""}
              ${it.exp ? '<span class="chip">有 EXP</span>' : ""}
            </div>
          </div>
          <div class="actions">
            ${it._source_page ? `<a class="btn" href="${esc(it._source_page)}" target="_blank" rel="noopener">OSCS</a>` : ""}
            ${it.cve_id ? `<a class="btn" href="https://nvd.nist.gov/vuln/detail/${esc(it.cve_id)}" target="_blank" rel="noopener">NVD</a>` : ""}
          </div>
        </div>
        <div class="grid">
          <div class="stat"><div class="k">CVSS</div><div class="v">${esc(scoreText(it.cvss_score))}</div></div>
          <div class="stat"><div class="k">向量</div><div class="v">${esc(it.cvss_vector || "-")}</div></div>
          <div class="stat"><div class="k">CWE</div><div class="v">${esc(it.cwe || "-")}</div></div>
          <div class="stat"><div class="k">类型</div><div class="v">${esc(it.kind || it.kind_en || "-")}</div></div>
          <div class="stat"><div class="k">公开</div><div class="v">${esc(it.published_time || "-")}</div></div>
          <div class="stat"><div class="k">利用成本</div><div class="v">${esc(it.exploit_requirement_cost || "-")}</div></div>
          <div class="stat"><div class="k">可利用性</div><div class="v">${esc(it.exploitability || "-")}</div></div>
          <div class="stat"><div class="k">修复建议</div><div class="v">${esc(it.fix_suggestion || "-")}</div></div>
        </div>
        <div class="section"><h3>描述</h3><div class="box">${esc(it.description || "无描述")}</div></div>
        ${it.scope_influence ? `<div class="section"><h3>影响范围</h3><div class="box">${esc(it.scope_influence)}</div></div>` : ""}
        ${pocUrls.length ? `<div class="section"><h3>POC 链接</h3><div class="refs">${pocUrls.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join("")}</div></div>` : ""}
        <div class="section"><h3>参考链接</h3>${refsHtml(it)}</div>
        ${articlesHtml(it)}
      `;
    }

    function selectById(id) {
      const it = filtered.find((x) => (x.mps_id || x.cve_id) === id) ||
                 items.find((x) => (x.mps_id || x.cve_id) === id);
      if (!it) return;
      activeId = it.mps_id || it.cve_id;
      renderList();
      renderDetail(it);
      const btn = document.querySelector(`.item[data-id="${CSS.escape(activeId)}"]`);
      if (btn) btn.scrollIntoView({ block: "nearest" });
      history.replaceState(null, "", "#" + encodeURIComponent(activeId));
    }

    function applyFilter(q) {
      const query = (q || "").trim().toLowerCase();
      filtered = !query ? items.slice() : items.filter((it) => {
        const blob = [
          it.cve_id, it.mps_id, it.title, it.kind, it.kind_en, it.cwe, it.description, it.level
        ].map((x) => String(x || "").toLowerCase()).join(" ");
        return blob.includes(query);
      });
      renderList();
      if (filtered.length) {
        const still = filtered.some((x) => (x.mps_id || x.cve_id) === activeId);
        selectById(still ? activeId : (filtered[0].mps_id || filtered[0].cve_id));
      } else {
        activeId = null;
        renderDetail(null);
      }
    }

    $("search").addEventListener("input", (e) => applyFilter(e.target.value));

    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement !== $("search")) {
        e.preventDefault();
        $("search").focus();
        return;
      }
      if (!filtered.length) return;
      const idx = filtered.findIndex((x) => (x.mps_id || x.cve_id) === activeId);
      if (e.key === "ArrowDown") {
        e.preventDefault();
        const next = filtered[Math.min(filtered.length - 1, Math.max(0, idx) + 1)];
        selectById(next.mps_id || next.cve_id);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        const prev = filtered[Math.max(0, idx - 1)];
        selectById(prev.mps_id || prev.cve_id);
      }
    });

    const hashId = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    if (hashId && items.some((x) => (x.mps_id || x.cve_id) === hashId)) {
      activeId = hashId;
      renderList();
      selectById(hashId);
    } else if (items.length) {
      selectById(items[0].mps_id || items[0].cve_id);
    } else {
      renderList();
      renderDetail(null);
    }
  </script>
</body>
</html>
