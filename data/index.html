 "cnvd_id": "", "cve_id": "CVE-2026-135743", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.1}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:H/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.2}]}, "cvss_score": 9.2, "cvss_vector": "CVSS:4.0/AV:N/AC:H/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-787", "description": "FFmpeg 是开源跨平台音视频处理框架，libavfilter 滤镜库提供滤镜图处理能力，dynaudnorm 滤镜用于音频动态响度归一化，支持在滤镜运行期间通过滤镜命令调整 gausssize 高斯滤波窗口大小。\n受影响版本中，gausssize 命令运行时改变滤波窗口后 dynaudnorm 滤镜调用 cqueue_resize() 调整增益历史队列，其扩容分支以 new_size - q-\u003enb_elements 计算搬移偏移 side，并将队列元素数直接赋值为 new_size - 1 - side，元素计数与队列实际容量 q-\u003esize 脱节；攻击者可通过 asendcmd 命令脚本或未认证的 azmq 滤镜端点发送 gausssize 命令，连续变更序列会使元素计数变为负值，memmove 以负长度执行并造成堆缓冲区越界读写，导致进程崩溃或潜在任意代码执行。\n修复版本中通过重写 cqueue_resize() 的扩容与缩容分支解决了该问题，扩容分支仅在队列非空且 new_size 大于当前容量 q-\u003esize 时执行，side 改为按 new_size - q-\u003esize 计算，队列元素数改为 += side 增量更新，缩容分支跳过空队列，保证元素搬移范围始终落在容量上限 301 的队列缓冲区内，消除堆越界读与越界写。", "effects": [{"comp_name": "ffmpeg", "ecosystem": "linux", "versions": [{"affected_version": "[4.3,9.1)", "min_fixed_version": "9.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-11-24", "level": "Critical", "mps_id": "MPS-4c8v-ugsj", "poc": false, "poc_url": [], "published_time": "2026-11-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-4c8v-ugsj", "name": "https://www.oscs1024.com/hd/MPS-4c8v-ugsj"}, {"url": "https://nvd.n TP、SFTP、HTTP(S)文件传输服务以及域、用户、组等管理功能，广泛用于企业内外的安全文件交换场景。\n受影响版本中，Serv-U对域组管理员（domain group administrator）可访问对象的访问控制校验不完整，域组管理员通过直接引用自身权限范围之外的对象即可绕过限制，将权限提升到服务器管理员（server administrator）级别，进而获得对受管服务器的管理控制；官方公告同时说明该漏洞在Windows安装环境下的风险较低。\n修复版本中通过修正域组管理员相关操作的权限校验，拒绝其引用超出授权范围的对象，阻断该越权提升路径；官方已在Serv-U 2026.4（2026年11月24日发布）中完成对该漏洞的修复，受影响用户应升级至Serv-U 2026.4及以上版本。", "effects": [{"comp_name": "serv-u", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2026.4)", "min_fixed_version": "2026.4", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "访问控制不当", "kind_en": "访问控制不当", "last_modified_time": "2026-11-25", "level": "Critical", "mps_id": "MPS-czra-6boh", "poc": false, "poc_url": [], "published_time": "2026-11-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-czra-6boh", "name": "https://www.oscs1024.com/hd/MPS-czra-6boh"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-82322", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-82322"}, {"url": "https://documentation.solarwinds.com/en/success_center/servu/content/release_notes/servu_2026-4_release_notes.htm", "name": ""}, {"url": "https://www.solarwinds.com/trust-center/security-advisories/CVE-2026-82322", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "SolarWinds Serv-U权限提升漏洞", "_translated": true, "_saved_at": "2026-11-24T18:33:38+00:00", "_first_saved_at": "2026-11-24T18:33:38+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-czra-6boh"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-82319", "cvss": {"cvssv31": [{"source": "psirt@solarwinds.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.1}]}, "cvss_score": 9.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:C/C:H/I:H/A:H", "cwe": "CWE-367", "description": "SolarWinds Serv-U 是 SolarWi 三方序列化库。\n- 最小特权原则：程序应该限制对受信任数据的处理权限，并避免在运行时修改数据。\n- 代码审查和漏洞扫描：程序应该进行代码审查和漏洞扫描，以发现和修复潜在的安全漏洞。\n", "title": "如何预防反序列化"}], "cnvd_id": "", "cve_id": "CVE-2026-131707", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-502", "description": "ProfileGrid（插件标识 profilegrid-user-profiles-groups-and-communities）是 Metagauss 开发的 WordPress 开源插件，用于构建会员资料页、用户群组与社区功能，通过 WordPress.org 插件目录分发，活跃安装量超过 5000 个站点。\n受影响版本中，群组配置以序列化字符串保存在 pm_groups 表的 group_options 字段，插件在读取该字段时使用 WordPress 的 maybe_unserialize() 直接反序列化，未限制 allowed_classes；前端群组页 public/partials/profile-magic-group.php 的 edit_group 分支允许群组管理员（订阅者级用户）提交群组配置，PM_request::sanitize_request() 对字符串形态的 group_options 仅执行 wp_kses_post()，序列化载荷原样通过并经 PM_DBhandler::update_row() 写入数据库；此后任意访问者打开群组页、群组列表或管理员打开群组设置页时，存储的载荷被反序列化并实例化攻击者指定的类，构成 PHP 对象注入，命中运行环境中可用的 POP 链时可导致任意代码执行、任意文件删除或数据库操作。\n修复版本中通过新增的 pg_safe_unserialize_group_options() 完成修复：该函数以 unserialize(…, array('allowed_classes' =\u003e false, 'max_depth' =\u003e 64)) 解码群组配置，并校验解码结果只能为标量与嵌套数组且节点数不超过 10000，否则返回空数组，插件内全部针对 group_options 的 maybe_unserialize() 调用均替换为该函数，对象实例化路径被切断，升级至 6.0.0.7 及以上版本可修复该漏洞。", "effects": [{"comp_name": "profilegrid-user-profiles-groups-and-communities", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,6.0.0.7)", "min_fixed_version": "6.0.0.7", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "反序列化", "kind_en": "不可信数据的反序列化", "last_modified_time": "2026-11-22", "level": "High", "mps_id": "MPS-gyil-45nx", "poc": false, "poc_url": [], "published_time": "2026-11-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-gyil-45nx", "name": "https://www.oscs1024.com/hd/MPS-gyil-45nx"}, {"url" lated": true, "_saved_at": "2026-11-24T18:33:45+00:00", "_first_saved_at": "2026-11-21T18:51:48+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-x83t-mpvs"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过向受信任的数据序列化过程中添加恶意数据，从而在序列化和反序列化过程中执行恶意代码的攻击漏洞。这种漏洞通常存在于使用序列化 (serialization) 机制存储和传输数据的程序中。\n", "title": "什么是反序列化"}, {"content": "- 注入攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码注入到程序中，从而实现代码执行的目的。\n- 反射攻击：攻击者使用反射机制，在序列化过程中动态生成恶意数据，并将恶意代码注入到程序中，从而实现代码执行的目的。\n- 缓冲区溢出攻击：攻击者通过在序列化过程中向缓冲区输入恶意数据，导致缓冲区溢出，从而破坏程序的内存管理，实现代码执行的目的。\n- 格式字符串攻击：攻击者通过在序列化过程中输入恶意数据，导致程序使用错误的格式字符串，从而实现代码执行的目的。\n- 数据流攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码作为一个数据流传递给程序，从而实现代码执行的目的。\n", "title": "反序列化常见的攻击方式"}, {"content": "- 不信任输入数据：程序应该严格检查输入数据的有效性，并避免使用不受信任的数据。\n- 使用安全的序列化机制：程序应该使用安全的序列化机制，如 JSON 或 XML 序列化，而不是第三方序列化库。\n- 最小特权原则：程序应该限制对受信任数据的处理权限，并避免在运行时修改数据。\n- 代码审查和漏洞扫描：程序应该进行代码审查和漏洞扫描，以发现和修复潜在的安全漏洞。\n", "title": "如何预防反序列化"}], "cnvd_id": "", "cve_id": "CVE-2026-134704", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.5}]}, "cvss_score": 8.5, "cvss_vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-502", "description": "OpenShot Video Editor（openshot-qt）是 OpenShot 团队开源的跨平台非线性视频编辑器，基于 Python 与 PyQt 构建，使用 .osp 项目文件保存与交换工程数据。\n受影响版本中，ProjectDataStore.load() 读取项目文件时先按 JSON 解析，解析失败后回退调用 read_legacy_project_file()，该函数把非 JSON 的项目文件直接交给 pickle.load() 反序列化，未使用受限 Unpickler，也未限制可解析的全局对象；攻击者在 .osp 文件中植入 pickle __reduce__ 载荷并诱导用户打开，文件前 64 字节的前缀检查无法拦截以 0x80 开头的 pickle 流，GLOBAL 指令在加载阶段解析出 posix.system 等任意可调用对象并执行命令，代码以运行 OpenShot 的用户权限生效。\n修复版本中通过新增 classes/legacy_project.py 引入受限反序列化器 LegacyProjectUnpickler，find_class 仅放行预登记的惰性数据记录类，并拒绝 EXT 与 PERSID 类操作码及尾部多余数据，反序列化结果再经图与字段类型校验；load() 与 read_legacy_project_file() 改为经由该受限导入器读取旧版项目，切断了任意类解析与代码执行链。", "effects": [{"comp_name": "openshot-qt", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,4.1.1]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "反序列化", "kind_en": "不可信数据的反序列化", "last_modified_time": "2026-11-22", "level": "High", "mps_id": "MPS-dmz8-2fyj", "poc": false, "poc_url": [], "published_time": "2026-11-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-dmz8-2fyj", "name": "https://www.oscs1024.com/hd/MPS-dmz8-2fyj"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-134704", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-134704"}, {"url": "https://github.com/OpenShot/openshot-qt/issues/6249", "name": ""}, {"url": "https://github.com/OpenShot/openshot-qt/commit/18da38899ee04bd023171f0c4958a4cfafb2b38c", "name": ""}, {"url": "https://github.com/OpenShot/openshot-qt/blob/v4.1.1/src/classes/project_data.py", "name": ""}, {"url": "https://www.vulncheck.com/advisories/openshot-video-editor-through-4.1.1-deserialization-via-legacy-project-import", "name": "VulnCheck Advisory: OpenShot Video Editor through 4.1.1 Deserialization via Legacy Project Import"}], "scope_influence": "", "tags": ["应用软件"], "title": "OpenShot 反序列化漏洞", "_translated": true, "_saved_at": "2026-11-22T04:37:29+00:00", "_first_saved_at": "2026-11-22T04:37:29+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-dmz8-2fyj"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-131705", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:N/A:L", "severity": "high", "base_score": 8.5}]}, "cvss_score": 8.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:N/A:L", "cwe": "CWE-89", "description": "ProfileGrid 是 Metagauss 开发的 WordPress 用户资料、群组与社区管理插件，以开源形式通过 wordpress.org 分发，提供用户分组、资料字段、组长管理、付费群组与站内私信等功能。\n受影响版本中，群组前端模板 public/partials/profile-magic-group.php 处理组长提交的群组编辑表单时，把表单字段名未经列名白名单校验直接作为数据键写入 $data，并传入 PM_DBhandler::update_row()；update_row() 将该数组原样交给 WordPress 的 $wpdb-\u003eupdate()，wpdb 拼接 UPDATE 语句时仅用反引号包裹字段名且不转义字段名中的反引号，持有组长身份的低权限用户提交携带反引号的字段名可在 SET 子句中注入任意 SQL，进而篡改 wp_pm_groups 数据行或通过时间盲注读取站点数据库中的敏感数据。\n修复版本中通过在 PM_DBhandler::update_row() 入口对表名、唯一字段与数据数组键名统一执行标识符校验，要求键名匹配 ^[A-Za-z_][A-Za-z0-9_]*$ 且必须为目标表真实列名，任一校验失败返回 false 拒绝写入；群组前端模板同步将组长可更新字段收窄为 group_name 与 group_desc 白名单，切断了从表单字段名到 UPDATE 语句的注入路径。", "effects": [{"comp_name": "profilegrid-user-profiles-groups-and-communities", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,6.0.0.7)", "min_fixed_version": "6.0.0.7", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_tim  .putgstringcopy 被绑定为 executeonly，并调用特权操作符 .forceput 写入受保护字体字典；字符串所在虚拟内存空间与当前空间不一致时，该过程执行 dup length string copy 后调用 .forceput setglobal，事先不检查操作数类型。攻击者提供的 PostScript 或 PDF 文档使 copy 的源不是字符串时，copy 抛出 typecheck，文档安装的错误处理程序可在已经绑定的 .forceput 之前替换操作数。官方记录说明这次被收回的特权写入会跨 save 与 restore 留下释放后使用，并在 -dSAFER 仍然启用时执行任意代码。\n修复版本中通过在进入 copy 与 .forceput 之前核对栈顶三项分别为字符串、名称和字典，类型不符时由 .putgstringcopy 自行发出 typecheck，使错误不再停在即将执行的 .forceput 上，切断收回特权写入并跨 save/restore 造成释放后使用的路径。", "effects": [{"comp_name": "ghostscript", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,10.08.0)", "min_fixed_version": "10.08.0", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,10.05.1~dfsg-1+deb13u2)", "min_fixed_version": "10.05.1~dfsg-1+deb13u2", "repository": "debian:13", "solutions": [], "upstream": false}, {"affected_version": "(-∞,10.08.0~dfsg-1)", "min_fixed_version": "10.08.0~dfsg-1", "repository": "debian:14", "solutions": [], "upstream": false}, {"affected_version": "(-∞,10.08.0~dfsg-1)", "min_fixed_version": "10.08.0~dfsg-1", "repository": "debian:unstable", "solutions": [], "upstream": false}, {"affected_version": "(-∞,10.08.0-5.1)", "min_fixed_version": "10.08.0-5.1", "repository": "opensuse:tumbleweed", "solutions": [], "upstream": false}, {"affected_version": "(-∞,10.0.0~dfsg-11+deb12u9)", "min_fixed_version": "10.0.0~dfsg-11+deb12u9", "repository": "debian:12", "solutions": [], "upstream": false}]}, {"comp_name": "ghostscript-devel", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,10.08.0-5.1)", "min_fixed_version": "10.08.0-5.1", "repository": "opensuse:tumbleweed", "solutions": [], "upstream": false}]}, {"comp_name": "ghostscript-doc", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,10.05.1~dfsg-1+deb13u2)", "min_fixed_version": "10.05.1~dfsg-1+deb13u2", "repository": "debian:13", "solutions": [], "upstream": false}, {"affected_version": "(-∞,10.08.0~dfsg-1)", "min_fixed_version": "10.08.0~dfsg-1", "repository": ed_at": "2026-11-24T18:33:45+00:00", "_first_saved_at": "2026-11-21T18:51:42+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-4sj3-16m0"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-134459", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "medium", "base_score": 5.9}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.2}]}, "cvss_score": 8.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-208", "description": "web-token jwt-framework 与 jwt-library 是开源 PHP JWT 库（MIT 许可），提供 JWS 与 JWE 的构建、签名、加密和解密能力，广泛用于 PHP 应用的令牌签发与校验。\n受影响版本中，JWE 密钥加密算法 RSA1_5 的解密实现 RSACrypt::decryptWithRSA15() 在 RSADP 运算后直接校验 PKCS#1 v1.5 填充，填充非法或填充串不足 8 字节时立即抛出 InvalidArgumentException，未实现 RFC 8017 要求的隐式拒绝。攻击者构造的 JWE encrypted_key 经 JWEDecrypter 解密链路进入该函数后，填充被拒绝、填充合法但 CEK 长度不符、填充合法并完整执行 AEAD 内容解密三种情形的执行耗时存在可测差异，构成 Bleichenbacher/Marvin 填充预言机，远程攻击者可自适应提交大量构造的 JWE 并测量耗时差异，逐步恢复被 RSA1_5 包装的内容加密密钥，最终解密 JWE 明文。\n修复版本中通过为 RSA1_5 解密引入隐式拒绝机制切断该时序侧信道：RSA15::decryptKey() 依据 JWE 头部 enc 字段计算预期 CEK 长度并传入解密函数，RSACrypt::decryptWithRSA15() 在常数时间内完成填充校验，校验失败时以常数时间选择返回与预期长度一致的随机密钥，使后续 AEAD 内容解密始终执行且失败表现统一，消除填充合法与非法之间的可观测耗时差异。", "effects": [{"comp_name": "web-token/jwt-framework", "ecosystem": "composer", "versions": [{"affected_version": "[4.0.0,4.0.7)", "min_fixed_version": "4.0.7", "repository": "composer", "solutions": [], "upstream": true}, {"affected_version": "[4.1.0,4.1.7)", "min_fixed_version": "4.1.7", "repository": "composer", "solutions": [], "upstream": true}, {"affected_version": "(-∞,3.4.10)", "min_fixed_version": "3.4.10", "repository": "composer", "solutions": [], "upstream": true}]}, {"comp_name": "web-token/jwt-library", "ecosystem": "composer", "versions": [{"affected_version": "(-∞,3.4.10)", "min_fixed_version": "3.4.10", "repository": "composer", "solutions": [], "upstream": true}, {"affected_version": "[4.0.0,4.0.7)", "min_fixed_version": "4.0.7", "repository": "composer", "solutions": [], "upstream": true}, {"affected_version": "[4.1.0,4.1.7)", "min_fixed_version": "4.1.7", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "通过时间差异性导致的信息暴露", "kind_en": "可观察到的时间差异", "last_modified_time": "2026-11-22", "level": "High", "mps_id": "MPS-ez9k-dwn8", "poc": false, "poc_url": [], "published_time": "2026-11-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ez9k-dwn8", "name": "https://www.oscs1024.com/hd/MPS-ez9k-dwn8"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-134459", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-134459"}, {"url": "https://github.com/web-token/jwt-framework/security/advisories/GHSA-5739-39v2-5754", "name": ""}, {"url": "https://www.vulncheck.com/advisories/web-token-jwt-framework-before-3.4.10-rsa1-5-bleichenbacher-padding-oracle", "name": ""}], "scope_influence": "", "tags": ["php", "开源"], "title": "web-token JWT库RSA1_5填充预言机漏洞", "_translated": true, "_saved_at": "2026-11-21T18:51:43+00:00", "_first_saved_at": "2026-11-21T18:51:43+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ez9k-dwn8"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-131706", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:C/C:H/I:N/A:L", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:C/C:H/I:N/A:L", "cwe": "CWE-89", "description": "ProfileGrid（插件目录标识 profilegrid-user-profiles-groups-and-communities）是 Metagauss 发布的 WordPress 开源插件，用于构建用户资料页、用户分组、社群与付费会员功能，WordPress.org 活跃安装量约 5000+。\n受影响版本中，前端小组编辑功能在保存小组时仅排除 _wpnonce、_wp_http_referer、edit_group、group_id 四个固定字段，其余 POST 参数名经 sanitize_request() 处理后直接成为待更新数据数组的键并传入 PM_DBhandler::update_row()；该版本 update_row() 对数据数组键未做列名白名单校验，WordPress 数据库层将这些键原样拼接为 UPDATE 语句中的反引号列标识符，拥有目标小组管理权限的登录用户可通过构造含反引号的恶意参数名闭合标识符上下文并注入 SQL，实现盲注读取数据库内容。\n修复版本中通过在 update_row() 中校验表名格式、要求每条写入语句的列标识符同时满足 ^[A-Za-z_][A-Za-z0-9_]*$ 格式校验与实际表列白名单校验（pm_is_allowed_write_identifier），任一校验失败即拒绝写入，并在前端将小组可编辑字段限制为 group_name 与 group_desc，切断了参数名进入 SQL 语句的路径。", "effects": [{"comp_name": "profilegrid-user-profiles-groups-and-communities", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,6.0.0.7)", "min_fixed_version": "6.0.0.7", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-11-22", "level": "High", "mps_id": "MPS-7bas-rg6i", "poc": false, "poc_url": [], "published_time": "2026-11-22", "reference_url_list": [{"url": "exploitability": "中", "fix_suggestion": "建议修复", "kind": "通过发送数据的信息暴露", "kind_en": "将敏感信息插入发送的数据中", "last_modified_time": "2026-11-22", "level": "High", "mps_id": "MPS-hvip-oqgk", "poc": false, "poc_url": [], "published_time": "2026-11-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-hvip-oqgk", "name": "https://www.oscs1024.com/hd/MPS-hvip-oqgk"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-131720", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-131720"}, {"url": "https://patchstack.com/database/wordpress/plugin/bookit/vulnerability/wordpress-bookit-plugin-2-6-0-8-sensitive-data-exposure-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "BookIt 敏感信息泄露", "_translated": true, "_saved_at": "2026-11-22T20:13:51+00:00", "_first_saved_at": "2026-11-22T12:59:22+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-hvip-oqgk"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-131708", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:L", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:L", "cwe": "CWE-79", "description": "ProfileGrid – User Profiles, Groups and Communities 是 Metagauss 发布在 WordPress 官方插件目录的开源插件（PHP 编写，GPLv2 授权），用于在站点前端构建用户资料、群组与社区功能，并通过 PM_Group 等短代码渲染群组页面。\n受影响版本中，前端群组模板 public/partials/profile-magic-group.php 将 URL 参数 gid（filter_input(INPUT_GET, 'gid')）未经类型校验传入 PM_request::profile_magic_get_join_group_button()；该函数用 add_query_arg('gid', $gid, ...) 把未做 URL 编码的 gid 拼进注册页地址，再以单引号 JS 字符串配合 esc_url() 输出到未登录访客可见的 Join Group 按钮 onclick 属性中。esc_url() 的字符白名单保留单引号、加号与括号，且只把单引号转写为 HTML 实体 \u0026#039;，浏览器解析 onclick 属性时该实体被还原为单引号，攻击者构造形如 ?gid='+alert(1)+' 的链接可闭合 JS 字符串注入任意脚本；外层 wp_kses 白名单放行 button 的 onclick 属性，受害者点击该按钮时脚本执行，形成反射型 XSS。\n修复版本中通过输入校验与正确编码切断上述链路：6.0.0.7 在 profile_magic_get_join_group_button() 入口调用 pg_positive_group_id() 校验 gid 为正整数，非法值提前返回，同时在群组模板入口统一校验 gid；onclick 内容改由 'window.location.href=' . wp_json_encode($registration_url) 生成并经 esc_attr() 编码后嵌入属性（includes/class-profile-magic-request.php 第 5227、5321、5336 行），消除 JS 字符串逃逸，反射型 XSS 不再可触发。", "effects": [{"comp_name": "profilegrid", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,6.0.0.7)", "min_fixed_version": "6.0.0.7", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", 检查，切断恶意请求参数进入页面输出的路径。", "effects": [{"comp_name": "menubar", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,6.0)", "min_fixed_version": "6.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-11-22", "level": "High", "mps_id": "MPS-j98s-yi4u", "poc": false, "poc_url": [], "published_time": "2026-11-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-j98s-yi4u", "name": "https://www.oscs1024.com/hd/MPS-j98s-yi4u"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-129016", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-129016"}, {"url": "https://patchstack.com/database/wordpress/plugin/menubar/vulnerability/wordpress-menubar-plugin-5-9-4-cross-site-scripting-xss-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "Menubar 插件反射型 XSS", "_translated": true, "_saved_at": "2026-11-22T20:13:58+00:00", "_first_saved_at": "2026-11-22T12:59:31+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-j98s-yi4u"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，从而导致未授权的用户或资源可以被访问或篡改。", "title": "什么是访问控制不当"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n", "title": "访问控制不当常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防访问控制不当"}], "cnvd_id": "", "cve_id": "CVE-2026-134453", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:N", "severity": "medium", "base_score": 6.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-284", "description": "Dockhand before 1.0.50 contains an improper access control vulnerability that allows authenticated unprivileged users to read restricted data by querying API endpoints lacking RBAC checks. Attackers can access /api/users, /api/license, and /api/hawser/connect to obtain user emails and roles, the full license key, and environment details, while an invalid license grants all users admin rights.", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "访问控制不当", "kind_en": "访问控制不当", "last_modified_time": "2026-11-22", "level": "High", "mps_id": "MPS-uftj-awi7", "poc": false, "poc_url": [], "published_time": "2026-11-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-uftj-awi7", "name": "https://www.oscs1024.com/hd/MPS-uftj-awi7"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-134453", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-134453"}, {"url": "https://github.com/Finsys/dockhand/security/advisories/GHSA-jv86-6qpr-739g", "name": ""}, {"url": "https://www.vulncheck.com/advisories/dockhand-before-1.0.50-improper-rbac-enforcement-via-api-endpoints", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-134453漏洞", "_translated": true, "_saved_at": "2026-11-24T18:33:45+00:00", "_first_saved_at": "2026-11-21T18:51:45+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-uftj-awi7"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-123886", "cvss": {}, "cvss_score": 8.8, "cvss_vector": "", "cwe": "CWE-917", "description": "Spring Data Elasticsearch 是 Spring 官方维护的开源 Elasticsearch 数据访问模块，提供基于仓库接口与字符串型 @Query 注解的 Elasticsearch 查询构建能力，属于 Spring Data 家族的 Java 组件。\n受影响版本中，字符串型 @Query 查询的处理顺序为先由 QueryStringPlaceholderReplacer 将方法实参原样替换进 ?0 等位置占位符，再把拼接后的完整字符串交给 QueryStringSpELEvaluator 按 SpEL 模板解析执行，参数值在该阶段未做任何 SpEL 转义；应用将不可信输入作为此类仓库方法的参数传递时，攻击者提交形如 #{T(java.lang.Runtime).getRuntime().exec(...)} 的取值可在应用进程中执行任意代码，同时解析表达式缓存使用无界 ConcurrentHashMap，不同请求构造的不同查询串可持续占用内存直至耗尽。\n修复版本中通过调整 QueryStringProcessor.createQuery 的处理顺序切断该链路，SpEL 表达式先在声明的查询字符串上求值，位置占位符仅在求值结果的字面部分内替换，字符串参数值对引号与反斜杠进行转义，解析表达式缓存改为容量 256 的 ConcurrentLruCache，参数携带的 SpEL 表达式不再执行，缓存内存占用也受到上限约束。", "effects": [{"comp_name": "org.springframework.data:spring-data-elasticsearch", "ecosystem": "maven", "versions": [{"affected_version": "[6.1.0,6.1.3)", "min_fixed_version": "6.1.3", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[6.0.0,6.0.9)", "min_fixed_version": "6.0.9", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "表达式语言注入", "kind_en": "表达式语言语句中使用的特殊元素的不正确中和（“表达式语言注入”）", "last_modified_time": "2026-11-23", "level": "High", "mps_id": "MPS-b7c3-0f38", "poc": false, "poc_url": [], "published_time": "2026-11-23", "reference_url_list": [{"url": "https://securityonline.info/spring-security-vulnerabilities-november-2026/", "name": ""}, {"url": "https://spring.io/security/cve-2026-123886", "name": ""}, {"url": "https://github.com/spring-projects/spring-data-elasticsearch/commit/311bc4127136af531c3a3c9197170827251a8594", "name": ""}, {"url": "https://github.com/spring-projects/spring-data-elasticsearch/commit/1acdc7e1b0445a15104c4d7ab95e79201cb646d5", "name": ""}, {"url": "https://github.com/spring-projects/spring-data-elasticsearch/issues/3390", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "Spring Data Elasticsearch SpEL表达式注入漏洞", "_translated": true, "_saved_at": "2026-11-23T10:08:12+00:00", "_first_saved_at": "2026-11-23T10:08:12+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-b7c3-0f38"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-86312", "cvss": {}, "cvss_score": 8.8, "cvss_vector": "", "cwe": "CWE-863", "description": "Apache Solr 是 Apache 软件基金会开源的 Java 企业级搜索平台，提供全文检索、分布式检索、集合管理与规则化授权能力，被广泛用于企业检索和数据平台场景。\n受影响版本中，PingRequestHandler 的 handlePing 方法从请求参数读取 qt 并通过 core.getRequestHandler(qt) 选取该核任意已注册请求处理器作为委托，再以请求原始参数执行 core.execute，isShard=true 时还会将委托处理器的完整响应写回 ping 响应；该接口在规则化授权下仅需低权限 health 权限，官方 bin/solr auth 命令生成的样例 security.json 更将 health 权限设为无需认证，使仅持有 health 权限或未认证的客户端能够触发 /select 等本应要求 read、update 等更高权限的功能。\n修复版本中通过新增 resolveConfiguredParams 方法，仅从处理器自身配置的 invariants、appends、defaults 与 useParams 参数集解析委托处理器及执行参数，不再读取任何请求参数，并以子请求承载配置参数、通过 shards.qt 将分布式 ping 直接指向各分片的委托处理器，使请求参数无法改变 ping 的实际执行内容，切断了低权限客户端借助 ping 端点触发高权限功能的路径。", "effects": [{"comp_name": "org.  "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-197", "description": "FFmpeg 是开源多媒体处理框架。编译启用 libzmq 后，zmq 与 azmq 滤镜通过 ZeroMQ 接收命令，并转发给滤镜图中的其他滤镜。\n受影响版本中，这两个滤镜共用的 recv_msg() 把 zmq_msg_size() 返回的 size_t 长度加 1 后写入 int 型 buf_size，再按该值分配缓冲区并计算 memcpy() 长度。未认证攻击者向默认绑定地址 tcp://*:5555 发送约 4 GiB 的命令消息时，buf_size 被截断为 0，av_malloc(0) 仍返回 1 字节堆块，memcpy() 得到负的 int 长度并转换为超大 size_t，写入越过堆分配，破坏内存并导致进程崩溃。\n修复版本中通过把 recv_msg() 改为使用 av_strndup()，按 size_t 长度复制消息，并在分配失败时返回错误，不再把长度截断为 int 后交给 memcpy()，避免写入越过堆分配。", "effects": [{"comp_name": "ffmpeg", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,9.1)", "min_fixed_version": "9.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "数值截断错误", "kind_en": "数字截断错误", "last_modified_time": "2026-11-24", "level": "High", "mps_id": "MPS-jsch-8nu9", "poc": false, "poc_url": [], "published_time": "2026-11-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-jsch-8nu9", "name": "https://www.oscs1024.com/hd/MPS-jsch-8nu9"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-135742", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-135742"}, {"url": "https://code.ffmpeg.org/FFmpeg/FFmpeg/pulls/26081", "name": ""}, {"url": "https://github.com/FFmpeg/FFmpeg/commit/78afb1d6e99ba2d3264f053ae4c0e4487a9c824c", "name": "Patch Commit"}, {"url": "https://github.com/FFmpeg/FFmpeg/blob/n9.0.2/libavfilter/f_zmq.c#L138", "name": ""}, {"url": "https://github.com/FFmpeg/FFmpeg", "name": ""}, {"url": "https://www.vulncheck.com/advisories/ffmpeg-before-9.1-integer-truncation-via-zmq-filter-recv-msg", "name": "VulnCheck Advisory: FFmpeg before 9.1 Integer Truncation via zmq Filter recv_msg()"}], "scope_influence": "", "tags": ["应用软件"], "title": "FFmpeg整数截断漏洞", "_translated": true, "_saved_at": "2026-11-24T06:40:30+00:00", "_first_saved_at": "2026-11-24T06:40:30+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-jsch-8nu9"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-135740", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.5}]}, "cvss_score": 8.5, "cvss_vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-787", "description": "FFmpeg 是开源多媒体框架，采用 LGPL 或 GPL 许可，用于音视频编解码、滤镜处理和格式转换。其中 readeia608 滤镜从输入视频扫描 EIA-608 闭路字幕并写入帧元数据。\n受影响版本中，libavfilter/vf_readeia608.c 的 build_histogram() 按像素位深名义上限 s-\u003emax 分配直方图，但直接使用未钳制的 line[i].input 作为下标递增。config_input() 将 s-\u003emax 设为 (1 \u003c\u003c depth) - 1；位深大于 8 时 read_word() 以 uint16_t 读取亮度采样。攻击者提交 9、10、12 或 14 位灰度或 YUV 视频且采样值超过该名义上限时，直方图写入越过堆缓冲区，可造成进程崩溃，并可能进一步执行代码。\n修复版本中通过在 build_histogram() 内使用 FFMIN(line[i].input, s-\u003emax) 将下标限制到直方图上界后再递增计数，超过名义位深上限的亮度采样不再越过已分配堆内存。", "effects": [{"comp_name": "ffmpeg", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,9.1)", "min_fixed_version": "9.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-11-24", "level": "High", "mps_id": "MPS-bksp-6c0j", "poc": false, "poc_url": [], "published_time": "2026-11-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-bksp-6c0j", "name": "https://www.oscs1024.com/hd/MPS-bksp-6c0j"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-135740", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-135740"}, {"url": "https://code.ffmpeg.org/FFmpeg/FFmpeg/pulls/26121", "name": ""}, {"url": "https://github.com/FFmpeg/FFmpeg/commit/df1ddf75db9a1ff36a35019511e17f795cf20c55", "name": "Patch Commit"}, {"url": "https://github.com/FFmpeg/FFmpeg/blob/n9.0.2/libavfilter/vf_readeia608.c#L176", "name": ""}, {"url": "https://github.com/FFmpeg/FFmpeg", "name": ""}, {"url": "https://www.vulncheck.com/advisories/ffmpeg-before-9.1-heap-out-of-bounds-write-via-readeia608-filter-histogram", "name": "VulnCheck Advisory: FFmpeg before 9.1 Heap Out-of-Bounds Write via readeia608 Filter Histogram"}], "scope_influence": "", "tags": ["应用软件"], "title": "FFmpeg堆越界写漏洞", "_translated":   <script>
    const payload = JSON.parse(document.getElementById("payload").textContent);
    const levelLabels = payload.level_labels || {};
    const items = payload.items || [];
    let filtered = items.slice();
    let activeId = null;

    const $ = (id) => document.getElementById(id);
    $("generatedAt").textContent = payload.generated_at || "-";
    $("retention").textContent = payload.retention_days ?? "-";
    $("cutoff").textContent = payload.cutoff_date || "-";
    $("count").textContent = String(payload.count ?? items.length);

    function levelClass(level) {
      const cn = levelLabels[level] || level || "";
      if (level === "Critical" || cn === "严重") return "crit";
      if (level === "High" || cn === "高危") return "high";
      return "other";
    }
    function levelText(level) {
      return levelLabels[level] || level || "-";
    }
    function esc(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }
    function scoreText(v) {
      if (v === null || v === undefined || v === "" || v === -1) return "-";
      return String(v);
    }

    function renderList() {
      const list = $("list");
      $("listCount").textContent = String(filtered.length);
      if (!filtered.length) {
        list.innerHTML = '<div class="empty">没有匹配项</div>';
        return;
      }
      list.innerHTML = filtered.map((it) => {
        const id = it.mps_id || it.cve_id;
        const active = id === activeId ? " active" : "";
        return `
          <button class="item${active}" data-id="${esc(id)}" type="button">
            <div class="item-top">
              <span class="cve">${esc(it.cve_id || it.mps_id || "-")}</span>
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
            </div>
            <div class="title">${esc(it.title || "-")}</div>
            <div class="item-foot">
              <span>CVSS ${esc(scoreText(it.cvss_score))}</span>
              <span>${esc(it.published_time || "-")}</span>
              ${it.poc ? "<span>POC</span>" : ""}
            </div>
          </button>`;
      }).join("");
      list.querySelectorAll(".item").forEach((btn) => {
        btn.addEventListener("click", () => selectById(btn.dataset.id));
      });
    }

    function refsHtml(it) {
      const refs = Array.isArray(it.reference_url_list) ? it.reference_url_list : [];
      const links = [];
      if (it._source_page) links.push({ url: it._source_page, name: "OSCS 详情" });
      if (it.cve_id) links.push({ url: `https://nvd.nist.gov/vuln/detail/${it.cve_id}`, name: "NVD" });
      refs.forEach((r) => {
        if (r && r.url) links.push({ url: r.url, name: r.name || r.url });
      });
      const seen = new Set();
      const uniq = [];
      for (const l of links) {
        if (seen.has(l.url)) continue;
        seen.add(l.url);
        uniq.push(l);
      }
      if (!uniq.length) return '<div class="box">无参考链接</div>';
      return `<div class="refs">${uniq.map((l) =>
        `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name || l.url)}</a>`
      ).join("")}</div>`;
    }

    function articlesHtml(it) {
      const arts = Array.isArray(it.articles) ? it.articles : [];
      if (!arts.length) return "";
      return `<div class="section"><h3>相关说明</h3>${arts.map((a) => `
        <div class="article">
          <h4>${esc(a.title || "说明")}</h4>
          <p>${esc(a.content || "")}</p>
        </div>`).join("")}</div>`;
    }

    function renderDetail(it) {
      const detail = $("detail");
      if (!it) {
        detail.innerHTML = '<div class="empty">暂无数据</div>';
        return;
      }
      const pocUrls = Array.isArray(it.poc_url) ? it.poc_url : [];
      detail.innerHTML = `
        <div class="d-head">
          <div>
            <h1 class="d-title">${esc(it.title || "-")}</h1>
            <div class="ids">
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
              <span class="chip">${esc(it.cve_id || "无 CVE")}</span>
              <span class="chip">${esc(it.mps_id || "-")}</span>
              ${it.poc ? '<span class="chip">有 POC</span>' : ""}
              ${it.exp ? '<span class="chip">有 EXP</span>' : ""}
            </div>
          </div>
          <div class="actions">
            ${it._source_page ? `<a class="btn" href="${esc(it._source_page)}" target="_blank" rel="noopener">OSCS</a>` : ""}
            ${it.cve_id ? `<a class="btn" href="https://nvd.nist.gov/vuln/detail/${esc(it.cve_id)}" target="_blank" rel="noopener">NVD</a>` : ""}
          </div>
        </div>
        <div class="grid">
          <div class="stat"><div class="k">CVSS</div><div class="v">${esc(scoreText(it.cvss_score))}</div></div>
          <div class="stat"><div class="k">向量</div><div class="v">${esc(it.cvss_vector || "-")}</div></div>
          <div class="stat"><div class="k">CWE</div><div class="v">${esc(it.cwe || "-")}</div></div>
          <div class="stat"><div class="k">类型</div><div class="v">${esc(it.kind || it.kind_en || "-")}</div></div>
          <div class="stat"><div class="k">公开</div><div class="v">${esc(it.published_time || "-")}</div></div>
          <div class="stat"><div class="k">利用成本</div><div class="v">${esc(it.exploit_requirement_cost || "-")}</div></div>
          <div class="stat"><div class="k">可利用性</div><div class="v">${esc(it.exploitability || "-")}</div></div>
          <div class="stat"><div class="k">修复建议</div><div class="v">${esc(it.fix_suggestion || "-")}</div></div>
        </div>
        <div class="section"><h3>描述</h3><div class="box">${esc(it.description || "无描述")}</div></div>
        ${it.scope_influence ? `<div class="section"><h3>影响范围</h3><div class="box">${esc(it.scope_influence)}</div></div>` : ""}
        ${pocUrls.length ? `<div class="section"><h3>POC 链接</h3><div class="refs">${pocUrls.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join("")}</div></div>` : ""}
        <div class="section"><h3>参考链接</h3>${refsHtml(it)}</div>
        ${articlesHtml(it)}
      `;
    }

    function selectById(id) {
      const it = filtered.find((x) => (x.mps_id || x.cve_id) === id) ||
                 items.find((x) => (x.mps_id || x.cve_id) === id);
      if (!it) return;
      activeId = it.mps_id || it.cve_id;
      renderList();
      renderDetail(it);
      const btn = document.querySelector(`.item[data-id="${CSS.escape(activeId)}"]`);
      if (btn) btn.scrollIntoView({ block: "nearest" });
      history.replaceState(null, "", "#" + encodeURIComponent(activeId));
    }

    function applyFilter(q) {
      const query = (q || "").trim().toLowerCase();
      filtered = !query ? items.slice() : items.filter((it) => {
        const blob = [
          it.cve_id, it.mps_id, it.title, it.kind, it.kind_en, it.cwe, it.description, it.level
        ].map((x) => String(x || "").toLowerCase()).join(" ");
        return blob.includes(query);
      });
      renderList();
      if (filtered.length) {
        const still = filtered.some((x) => (x.mps_id || x.cve_id) === activeId);
        selectById(still ? activeId : (filtered[0].mps_id || filtered[0].cve_id));
      } else {
        activeId = null;
        renderDetail(null);
      }
    }

    $("search").addEventListener("input", (e) => applyFilter(e.target.value));

    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement !== $("search")) {
        e.preventDefault();
        $("search").focus();
        return;
      }
      if (!filtered.length) return;
      const idx = filtered.findIndex((x) => (x.mps_id || x.cve_id) === activeId);
      if (e.key === "ArrowDown") {
        e.preventDefault();
        const next = filtered[Math.min(filtered.length - 1, Math.max(0, idx) + 1)];
        selectById(next.mps_id || next.cve_id);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        const prev = filtered[Math.max(0, idx - 1)];
        selectById(prev.mps_id || prev.cve_id);
      }
    });

    const hashId = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    if (hashId && items.some((x) => (x.mps_id || x.cve_id) === hashId)) {
      activeId = hashId;
      renderList();
      selectById(hashId);
    } else if (items.length) {
      selectById(items[0].mps_id || items[0].cve_id);
    } else {
      renderList();
      renderDetail(null);
    }
  </script>
</body>
</html>
