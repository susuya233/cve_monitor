ttps://www.oscs1024.com/hd/MPS-kizr-u5gc"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-70496", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-70496"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-70496", "name": ""}, {"url": "https://bugzilla.redhat.com/show_bug.cgi?id=2511032", "name": ""}], "scope_influence": "", "tags": ["go"], "title": "search-v2-operator 集群权限过度授权", "_translated": true, "_saved_at": "2026-08-19T21:19:54+00:00", "_first_saved_at": "2026-08-19T20:20:05+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-kizr-u5gc"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-75860", "cvss": {}, "cvss_score": 9.8, "cvss_vector": "", "cwe": "CWE-269", "description": "JSON Options 是开源 WordPress 插件，用于以 JSON 导入和导出 WordPress 选项，便于站点迁移、备份以及按过滤器处理 wp_options。\n受影响版本中，插件把 json_options_init 挂到 WordPress init 钩子，在每次请求时实例化 jsonOptions。构造函数在 count($_POST) \u003e 0 时直接调用 on_post()，该函数未执行 current_user_can 能力检查，也未校验表单 nonce。未认证攻击者可向任意站点 URL 发送包含 json_options_upload 文件的 POST 请求，使 json_import() 对 JSON 中的任意键调用 update_option()，从而改写 users_can_register 与 default_role 等选项，开启注册并把默认角色设为 administrator，造成权限提升与站点接管。\n修复版本中通过增加能力检查与 nonce 校验切断未认证请求进入 on_post 和 json_import 的路径。截至 2026-08-20，WPScan 标明 No known fix，WordPress.org 插件目录 trunk 与标签最高版本均为 0.0.4，GitHub 仓库自 2013 年起无安全修复提交，公开资料未发布已修复版本。", "effects": [{"comp_name": "json-options", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,0.0.4]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-08-20", "level": "Critical", "mps_id": "MPS-4cf5-wzag", "poc": false, "poc_url": [], "published_time": "2026-08-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-4cf5-wzag", "name": "https://www.oscs1024.com/hd/MPS-4cf5-wzag"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-75860", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-75860"}, {"url": "https://wpscan.com/vulnerability/6c9bbd44-cd10-40e2-af6f-440e7ccabf9a/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "JSON Options任意选项更新", "_translated": true, "_saved_at": "2026-08-20T09:27:29+00:00", "_first_saved_at": "2026-08-20T07:35:49+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-4cf5-wzag"}, {"analysis_status": 0, "articles": [{"content": "跨站点请求伪造 (CSRF)通过利用网站对用户请求的信任进行攻击。当用户在网站A登录并在同一浏览器会话中访问网站B时，攻击者可以构造特制的请求并诱使用户执行，以使网站B误以为这些请求是用户合法发起的。\n攻击者通常通过欺骗用户点击恶意链接、在受信任的网站中植入恶意代码或通过钓鱼等手段来实施CSRF攻击，一旦用户执行了恶意请求，攻击者可以以用户的身份执行任意操作，包括更改用户密码、发起资金转账或删除重要数据等。", "title": "什么是CSRF"}, {"content": "- 链接欺骗：攻击者通过向用户发送包含恶意链接的电子邮件或社交媒体消息，诱使用户点击并执行恶意请求。\n- 图片引用攻击：攻击者通过在恶意网站上包含指向目标网站的图片引用，以触发用户浏览器自动发送目标网站的请求。\n- XSS利用：如果目标网站存在XSS漏洞，攻击者可以注入恶意脚本，以使用户在浏览器中执行恶意请求。", "title": "CSRF常见的攻击方式"}, {"content": "- 随机令牌：网站可以在每个请求中包含一个随机生成的令牌（CSRF Token），并验证该令牌的有效性，以确认请求的来源是合法的。\n- SameSite Cookie：使用SameSite属性来限制跨站点请求，将Cookie的发送限制在同一站点上，减少了跨站请求伪造的风险。\n- 双重验证：对于敏感操作，网站可以要求用户进行额外的验证，例如输入验证码、提供第二个因素的身份验证等。\n- 强化浏览器策略：网站可以设置Content-Security-Policy（CSP）头，限制浏览器执行恶意脚本的能力，减少CSRF攻击的风险。\n- 限制用户操作：网站可以要求用户在执行敏感操作之前进行明确的确认或授权，防止恶意请求被误触发。\n- 安全编码实践：开发人员应遵循安全编码实践，对用户输入进行适当的验证和过滤，防止恶意请求的注入。", "title": "如何预防CSRF"}], "cnvd_id": "", "cve_id": "CVE-2026-28164", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.6}]}, "cvss_score": 9.6, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:H/I:H/A:H", "cwe": "CWE-352", "description": "Easy Elementor Addons 是 HashThemes 发布的开源 WordPress 插件，基于 GPLv2 授权，用于为 Elementor 页面构建器提供附加组件、模板库与编辑器扩展。\n受影响版本中，模板库 Ajax 处理函数 EEAD_Templates_Manager::get_templates 与 insert_inner_template 仅通过 current_user_can('edit_posts') 判断能力，未调用 check_ajax_referer。未认证攻击者可诱导已登录且具备编辑权限的用户访问恶意页面，浏览器会携带受害者会话向 wp-admin/admin-ajax.php 发送 action 为 eead_get_templates 或 eead_inner_template 的请求。insert_inner_template 随后从请求中的 template 参数取出内容并调用 wp_insert_post，以受害者身份发布文章或模板。\n修复版本中通过在 get_templates 与 insert_inner_template 入口调用 check_ajax_referer('eead_editor_nonce', 'nonce')，并在编辑器前端脚本中随 Ajax 请求提交该 nonce，拒绝缺少合法来源校验的跨站请求。", "effects": [{"comp_name": "easy-elementor-addons", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.3.8)", "min_fixed_version": "2.3.8", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "CSRF", "kind_en": "跨站请求伪造 (CSRF)", "last_modified_time": "2026-08-20", "level": "Critical", "mps_id": "MPS-xczg-8t4s", "poc": false, "poc_url": [], "published_time": "2026-08-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-xczg-8t4s", "name": "https://www.oscs1024.com/hd/MPS-xczg-8t4s"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-28164", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-28164"}, {"url": "https://patchstack.com/database/wordpress/plugin/easy-elementor-addons/vulnerability/wordpress-easy-elementor-addons-plugin-2-3-7-cross-site-request-forgery-csrf-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Easy Elementor Addons CSRF漏洞", "_translated": true, "_saved_at": "2026-08-20T14:29:25+00:00", "_first_saved_at": "2026-08-20T14:29:25+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-xczg-8t4s"}, {"analysis_status": 0, "articles": [{"content": "应用程序在处理用户输入时的不完善或缺乏验证机制，所以攻击者能够通过向应用程序发送恶意输入，利用应用程序对输入数据的错误处理方式来注入自己的恶意代码。这些恶意代码会被应用程序误认为是合法的指令或数据，并在执行过程中被执行。", "title": "什么是代码注入"}, {"content": "应用程序使用可执行动态代码的函数来执行用户可控的参数，当应用程序对于用户输入过滤不完全时，攻击者可以注入恶意代码并控制代码执行流程。", "title": "代码注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对所有用户输入进行验证和过滤，确保只接受预期的有效输入。这包括对输入数据进行输入长度验证、类型检查和格式验证等。\r\n- 使用参数化查询或预编译语句：对于数据库查询操作，应该使用参数化查询或预编译语句，确保输入数据不会被误认为是执行代码。\r\n- 最小特权原则：应用程序在执行操作系统命令或动态代码时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。\r\n- 安全编码实践：开发人员应该采用安全编码实践，包括避免使用eval函数、避免拼接用户输入的字符串作为代码执行等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止代码注入攻击。", "title": "如何预防代码注入"}], "cnvd_id": "", "cve_id": "CVE-2026-72530", "cvss": {"cvssv31": [{"source": "vulnerability@kaspersky.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9}], "cvssv4": [{"source": "vulnerability@kaspersky.com", "vector": "CVSS:4.0/AV:N/AC:H/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.5}]}, "cvss_score": 9.5, "cvss_vector": "CVSS:4.0/AV:N/AC:H/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-94", "description": "TrueConf Server 是 TrueConf 提供的商业视频会议服务器软件，支持 Windows 与 Linux 部署，用于企业内部音视频会议与协作，并非开源组件。\n受影响版本中，未授权远程攻击者只要能够访问默认开放的 4307/TCP 端口，即可向服务器投递构造后的脚本。该脚本会在隔离环境中运行，io、os 等危险库在该环境中不可用，但攻击者可利用此代码注入缺陷突破隔离边界，并在宿主机上执行任意代码；Kaspersky 在公开攻击链中确认 Windows 场景可达 NT AUTHORITY\\SYSTEM，且攻击复杂度较高，可能需要多次尝试才能成功。\n修复版本中通过官方发布的 5.3.9、5.4.9 和 5.5.5 安全更新切断隔离环境逃逸与宿主机任意代码执行路径。公开资料未披露更细粒度的源码修改。", "effects": [{"comp_name": "TrueConf Server", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,5.3)", "min_fixed_version": "5.3", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[5.4,5.4.9)", "min_fixed_version": "5.4.9", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[5.3,5.3.9)", "min_fixed_version": "5.3.9", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[5.5,5.5.5)", "min_fixed_version": "5.5.5", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "代码注入", "kind_en": "代码生成控制不当（“代码注入”）", "last_modified_time": "2026-08-20", "level": "Critical", "mps_id": "MPS-stb6-n1l8", "poc": false, "poc_url": [], "published_time": "2026-08-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-stb6-n1l8", "name": "https://www.oscs1024.com/hd/MPS-stb6-n1l8"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-72530", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-72530"}, {"url": "https://ics-cert.kaspersky.com/advisories/2026/08/11/trueconf-server-breakout-from-isolated-environment/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "TrueConf隔离环境逃逸", "_translated": true, "_saved_at": "2026-08-19T19:19:52+00:00", "_first_saved_at": "2026-08-19T18:24:49+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-stb6-n1l8"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，从而导致未授权的用户或资源可以被访问或篡改。", "title": "什么是访问控制不当"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n", "title": "访问控制不当常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防访问控制不当"}], "cnvd_id": "", "cve_id": "CVE-2026-76310", "cvss": {}, "cvss_score": 9.4, "cvss_vector": "", "cwe": "CWE-284", "description": "Splunk Enterprise 是商业安全信息与事件管理平台，用于日志采集、索引、搜索与告警，产品闭源。\n受影响版本中，嵌入式报告访问未拦截 REST API 对搜索作业 dispatch archive 的下载请求。未认证攻击者在持有嵌入报告令牌的情况下，可下载对应搜索作业的调度归档并从中恢复会话材料，进而访问报告所有者权限范围内的全部相关数据并影响系统完整性；当报告所有者具备 admin 角色时，还可执行管理操作。\n修复版本中通过收紧嵌入式报告的授权边界，阻止嵌入令牌用于 REST API dispatch archive 下载，切断未认证用户从归档恢复会话材料并提升权限的路径。", "effects": [{"comp_name": "splunk", "ecosystem": "linux", "versions": [{"affected_version": "[9.4.0,9.4.14)", "min_fixed_version": "9.4.14", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[10.0.0,10.0.9)", "min_fixed_version": "10.0.9", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[10.4.0,10.4.2)", "min_fixed_version": "10.4.2", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[10.2.0,10.2.6)", "min_fixed_version": "10.2.6", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "访问控制不当", "kind_en": "访问控制不当", "last_modified_time": "2026-08-20", "level": "Critical", "mps_id": "MPS-b6fd-d6a8", "poc": false, "poc_url": [], "published_time": "2026-08-20", "reference_url_list": [{"url": "https://advisory.splunk.com/advisories/SVD-2026-0801", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-76310", "name": ""}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-76310", "name": ""}, {"url": "https://help.splunk.com/en/splunk-enterprise/create-dashboards-and-reports/reporting-manual/9.1/report-management/additional-configuration-for-embedded-reports", "name": ""}, {"url": "https://help.splunk.com/en/splunk-enterprise/administer/manage-users-and-security/10.4/manage-splunk-platform-users-and-roles/about-configuring-role-based-user-access", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Splunk嵌入报告越权漏洞", "_translated": true, "_saved_at": "2026-08-19T23:17:27+00:00", "_first_saved_at": "2026-08-19T22:18:19+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-b6fd-d6a8"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-62668", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.4}]}, "cvss_score": 9.4, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-918", "description": "Grav API Plugin 是为 Grav CMS 提供 RESTful API 的开源 PHP 插件，可暴露无头访问、用户管理、Webhook 等接口。\n受影响版本中，WebhookController.php 的 create 与 update 方法在接收前端提交的 URL 时仅使用 filter_var($url, FILTER_VALIDATE_URL) 做语法校验，不限定协议也不检测目标主机；随后 WebhookDispatcher.php 的 httpPost 方法以 curl_init 初始化请求，但未设置 CURLOPT_PROTOCOLS 与 CURLOPT_REDIR_PROTOCOLS。拥有 api.webhooks.write 权限的账户可在 JSON body 中提交 file://、dict://、gopher://、或指向 127.0.0.0/8、RFC1918 私有网段、169.254.169.254 等保留地址的目标，cURL 会按提交的协议发起请求并把响应内容写入 deliveries 接口，攻击者可借此读取本地文件、利用 gopher 等协议探测内网服务，或窃取云实例元数据凭证。\n修复版本中通过在 WebhookController 中新增 validateWebhookUrl()，要求 URL 必须为 http/https 并调用 WebhookDispatcher::hostIsPublic() 拒绝解析至 loopback、RFC1918 私有网段、link-local 与其他保留段的主机；dispatch 时再次对解析后的目标主机做公网校验，curl_init 增加 CURLOPT_PROTOCOLS 与 CURLOPT_REDIR_PROTOCOLS 限制为 CURLPROTO_HTTP | CURLPROTO_HTTPS，从根因上切断非 HTTP(S) 协议及内网地址触发的 SSRF 路径。", "effects": [{"comp_name": "getgrav/grav-plugin-api", "ecosystem": "composer", "versions": [{"affected_version": "(-∞,1.0.6)", "min_fixed_version": "1.0.6", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SSRF", "kind_en": "服务器端请求伪造 (SSRF)", "last_modified_time": "2026-08-20", "level": "Critical", "mps_id": "MPS-xg7k-w06j", "poc": false, "poc_url": [], "published_time": "2026-08-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-xg7k-w06j", "name": "https://www.oscs1024.com/hd/MPS-xg7k-w06j"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-62668", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-62668"}, {"url": "https://github.com/getgrav/grav-plugin-api/commit/dfcc947f0d6758772caac290c68fe8d4c4a4874e", "name": ""}, {"url": "https://github.com/getgrav/grav-plugin-api/releases/tag/1.0.6", "name": ""}, {"url": "https://github.com/getgrav/grav/security/advisories/GHSA-58q8-f7v4-w2vf", "name": ""}], "scope_influence": "", "tags": ["php", "开源"], "title": "Grav API插件Webhook SSRF漏洞", "_translated": true, "_saved_at": "2026-08-19T17:21:20+00:00", "_first_saved_at": "2026-08-19T17:21:20+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-xg7k-w06j"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-75143", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-122", "description": "FFmpeg 是开源多媒体处理框架，用于音视频编解码、转封装与网络流协议处理；RIST 协议由可选模块 libavformat/librist.c 对接外部 librist 库实现。\n受影响版本中，librist_read() 忽略调用方传入的 size，将拷贝长度直接设为 data_block-\u003epayload_len，再把完整载荷 memcpy 到目标缓冲区。该路径可通过 async:rist:// 触发，async 包装器按剩余 FIFO 空间传入更小缓冲区，远程 RIST 发送端发送超过该长度的数据包会造成堆缓冲区溢出。\n修复版本中通过将拷贝长度改为 FFMIN(data_block-\u003epayload_len, size)，使 librist_read() 遵守调用方缓冲区上限，阻止超长载荷写越界。", "effects": [{"comp_name": "ffmpeg", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1c10bcc2e17255dacb717a25ab3db142ce390602)", "min_fixed_version": "1c10bcc2e17255dacb717a25ab3db142ce390602", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "堆缓冲区溢出", "kind_en": "基于堆的缓冲区溢出", "last_modified_time": "2026-08-20", "level": "Critical", "mps_id": "MPS-01ga-olmc", "poc": false, "poc_url": [], "published_time": "2026-08-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-01ga-olmc", "name": "https://www.oscs1024.com/hd/MPS-01ga-olmc"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-75143", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-75143"}, {"url": "https://code.ffmpeg.org/FFmpeg/FFmpeg/commit/1c10bcc2e17255dacb717a25ab3db142ce390602", "name": ""}, {"url": "https://code.ffmpeg.org/FFmpeg/FFmpeg/pulls/24089", "name": ""}, {"url": "https://www.vulncheck.com/advisories/ffmpeg-heap-buffer-overflow-via-rist-protocol-reader", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "FFmpeg RIST堆溢出", "_translated": true, "_saved_at": "2026-08-19T19:19:48+00:00", "_first_saved_at": "2026-08-19T18:24:45+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-01ga-olmc"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-72529", "cvss": {"cvssv31": [{"source": "vulnerability@kaspersky.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/ RD_HEADER_LENGTH + 1) 会越过可用缓冲区下标而抛 IndexOutOfBoundsException，异常路径进入 select(ctx, null) 分支，使处理器跳到默认 SslContext 而不是按 server_name 匹配的 SslContext。在仅以 per-SNI clientAuth=REQUIRE 作为唯一互信 TLS 校验手段、且默认 SslContext 配置为 clientAuth=NONE 或 clientAuth=OPTIONAL、又未在应用层额外校验客户端证书的部署中，未认证的远端攻击者可通过发送分片 ClientHello 绕过受保护路由的 mTLS 客户端证书校验要求。\n修复版本中通过重写 SslClientHelloHandler#decode 解决了该问题，新增 aggregatedBytes 与 handshakeLength 实例字段跟踪已聚合字节，在跨记录读取时先把 SSL_RECORD_HEADER 之后的负载字节累积到 handshakeBuffer，等 four-byte handshake header 与完整 handshakeLength 都在聚合缓冲中后再统一解析 handshakeType、handshakeLength 与 ClientHello 主体，并在 readerIndex + SSL_RECORD_HEADER_LENGTH + 4 仍超出 endOffset 时提前 return 等待更多数据、避免越界；索引不再越过合法下标，异常路径不再被触发，per-SNI SslContext 可被稳定选中。", "effects": [{"comp_name": "io.netty:netty", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,4.1.137.Final)", "min_fixed_version": "4.1.137.Final", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "(-∞,4.2.17.Final)", "min_fixed_version": "4.2.17.Final", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "对因果或异常条件的不恰当检查", "kind_en": "对异常或特殊情况的不当检查", "last_modified_time": "2026-08-20", "level": "Critical", "mps_id": "MPS-6jhz-mn3r", "poc": false, "poc_url": [], "published_time": "2026-08-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-6jhz-mn3r", "name": "https://www.oscs1024.com/hd/MPS-6jhz-mn3r"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-75595", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-75595"}, {"url": "https://github.com/netty/netty/commit/1b5abc6443b63726c72cdd285af2feb7ddbb8ff7", "name": ""}, {"url": "https://github.com/netty/netty/commit/9e0519239108a69b7e9bbc5e9182ee139a0d7961", "name": ""}, {"url": "https://github.com/netty/netty/pull/17213", "name": ""}, {"url": "https://github.com/netty/netty/pull/17217", "name": ""}, {"url": "https://github.com/netty/netty/releases/tag/netty-4.1.137.Final", "name": ""}, {"url": "https://github.com/netty/netty/releases/tag/netty-4.2.17.Final", "name": ""}, {"url": "https://github.com/netty/netty/security/advisories/GHSA-c4c3-7fpv-j4q5", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "Netty SslClientHelloHandler 互信 TLS 校验绕过漏洞", "_translated": true, "_saved_at": "2026-08-19T23:17:33+00:00", "_first_saved_at": "2026-08-19T23:17:33+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-6jhz-mn3r"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-62941", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.9}]}, "cvss_score": 9.9, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "cwe": "CWE-863", "description": "Incus 是开源的系统容器与虚拟机管理器（Apache-2.0，Go 语言实现，仓库 github.com/lxc/incus），用于在 Linux 主机上运行 LXC 容器与 QEMU 虚拟机，并通过项目（project）划分多租户资源与权限边界。\n受影响版本中，HTTP API 处理器 cmd/incusd/instances_post.go 中的 instancesPost 在处理跨项目实例复制（source.type=copy）请求时，先在 1440 行调用 project.AllowInstanceCreation 对 req 进行限制检查（此时 req.Config 尚未包含源实例配置），随后调用 createFromCopy（600 行）把源实例通过 InstanceIncludeWhenCopying 选出的所有非易失配置键合并进 req.Config，其中包含 security.privileged、raw.lxc、raw.apparmor 等本应由目标项目限制键拒绝的危险键；限制检查通过与危险配置合并之间存在时序差，导致攻击者可把受限项目当作目标复制一个带有 privileged/raw 配置的实例并启动，实现从受限项目逃逸到宿主机。\n修复版本中通过在 cmd/incusd/instances_post.go 的 createFromCopy 内完成源配置与设备合并之后再调用一次 project.AllowInstanceCreation 对合并后的完整 req 重新校验，切断利用链路；建议升级至 v7.3.0 及以上版本。", "effects": [{"comp_name": "github.com/lxc/incus", "ecosystem": "go", "versions": [{"affected_version": "(-∞,7.3.0)", "min_fixed_version": "7.3.0", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-08-21", "level": "Critical", "mps_id": "MPS-39kx-hf7a", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-39kx-hf7a", "name": "https://www.oscs1024.com/hd/MPS-39kx-hf7a"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-62941", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-62941"}, {"url": "https://github.com/lxc/incus/security/advisories/GHSA-mq9x-prm8-3vpw", "name": ""}], "scope_influence": "", "tags": ["go"], "title": "Incus 跨项目实例复制绕过项目限制漏洞", "_translated": true, "_saved_at": "2026-08-21T16:25:21+00:00", "_first_saved_at": "2026-08-21T16:25:21+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-39kx-hf7a"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-66785", "cvss": {"cvssv31": [{"source": "secalert@redhat.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.9}]}, "cvss_score": 9.9, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "cwe": "CWE-20", "description": "Submariner 中发现了一个缺陷。此漏洞允许恶意集群（分支）通过发布特制网络端点来重定向来自其他连接集群（对等集群）的网络流量。系统无法正确验证恶意集群提供的网络子网，使其能够声明任意网络范围。因此，来自 v31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.9}]}, "cvss_score": 9.9, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "cwe": "CWE-862", "description": "Incus 是开源的系统容器与虚拟机管理器（Apache-2.0 许可，GitHub: lxc/incus），基于 Go 语言开发，提供集群化的容器与虚拟机生命周期管理 API。\n受影响版本中，跨集群节点迁移实例时，POST /1.0/instances/{name}?target=\u003cnode\u003e 接口对应的 cmd/incusd/instance_post.go 中 instancePost 处理器在调用 migrateInstance 路径上，通过 maps.Copy(targetInstInfo.Config, req.Config) 与 maps.Copy(targetInstInfo.Devices, req.Devices) 把用户提交的配置、设备、profile 覆盖直接合并到目标实例配置，整个文件未调用 project.AllowInstanceUpdate、project.AllowInstanceCreation 等项目限制校验，并且目标节点经 instances_post.go 的集群通知重建实例时 AllowInstanceCreation 检查被显式跳过。受限项目内的攻击者可借此把 security.privileged=true 与 raw.lxc 等键注入目标实例，启动后获得特权容器并逃逸至宿主机 root。\n修复版本中通过在 migrateInstance 内 maps.Copy 合并用户覆盖之后、存储池覆盖处理之前，新增 project.AllowInstanceUpdate(tx, inst.Project().Name, inst.Name(), targetInstInfo.Writable(), inst.LocalConfig()) 项目限制校验，对最终生效的 Writable 配置强制走项目规则，从而切断受限键在迁移路径上落地的因果链。", "effects": [{"comp_name": "github.com/lxc/incus/v7/cmd/incusd", "ecosystem": "go", "versions": [{"affected_version": "(-∞,7.3.0)", "min_fixed_version": "7.3.0", "repository": "go", "solutions": [], "upstream": true}]}, {"comp_name": "incus", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,7.3.0)", "min_fixed_version": "7.3.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-08-21", "level": "Critical", "mps_id": "MPS-7604-vo5r", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-7604-vo5r", "name": "https://www.oscs1024.com/hd/MPS-7604-vo5r"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-62940", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-62940"}, {"url": "https://github.com/lxc/incus/security/advisories/GHSA-qw5c-v953-38gw", "name": ""}], "scope_influence": "", "tags": ["go", "应用软件"], "title": "Incus 迁移实例配置覆盖权限绕过漏洞", "_translated": true, "_saved_at": "2026-08-21T16:25:19+00:00", "_first_saved_at": "2026-08-21T16:25:19+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-7604-vo5r"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-63343", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.9}]}, "cvss_score": 9.9, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "cwe": "CWE-73", "description": "Incus 是开源的系统容器与虚拟机管理器，由 Linux Containers 社区维护并以 Apache-2.0 协议在 GitHub（lxc/incus）发布，核心守护进程 incusd 通过 REST API 提供实例生命周期、镜像、存储、网络与实例元数据等能力。\n受影响版本中，攻击者可在上传的容器镜像根目录中放置名为 metadata.yaml 的符号链接，使其指向宿主上的任意路径。已认证的 Incus 用户启动基于该镜像的实例后，incusd 在处理实例元数据接口 PUT /1.0/instances/{name}/metadata 与 GET /1.0/instances/{name}/metadata 时，会通过 filepath.Join(inst.Path(), \"metadata.yaml\") 计算路径并使用 os.Open / os.WriteFile 直接操作该文件，没有先用 Lstat 拒绝符号链接，也没有用 os.OpenRoot 将其限定在实例根目录之内，导致符号链接被跟随，incusd 以 root 身份对宿主任意路径完成任意文件读或写。\n修复版本中通过将 cmd/incusd/instance_metadata.go 中 instanceMetadataGet、instanceMetadataPatch 与 doInstanceMetadataUpdate 对 metadata.yaml 的访问全部替换为基于 os.OpenRoot(inst.Path()) 的 root.Open(\"metadata.yaml\") 与 root.WriteFile(...) 调用，把符号链接解析限制在实例根目录之内，从而切断了从恶意镜像元数据到宿主任意文件的路径穿越链。", "effects": [{"comp_name": "github.com/lxc/incus", "ecosystem": "go", "versions": [{"affected_version": "[0,7.3.0)", "min_fixed_version": "7.3.0", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "文件名或路径的外部可控制", "kind_en": "文件名或路径的外部控制", "last_modified_time": "2026-08-21", "level": "Critical", "mps_id": "MPS-dqhx-lc8u", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-dqhx-lc8u", "name": "https://www.oscs1024.com/hd/MPS-dqhx-lc8u"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-63343", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-63343"}, {"url": "https://github.com/lxc/incus/security/advisories/GHSA-fmjx-5j3g-997p", "name": ""}], "scope_influence": "", "tags": ["go"], "title": "Incus 镜像元数据符号链接路径穿越漏洞", "_translated": true, "_saved_at": "2026-08-21T16:25:27+00:00", "_first_saved_at": "2026-08-21T16:25:27+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-dqhx-lc8u"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-62867", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.9}]}, "cvss_score": 9.9, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "cwe": "CWE-88", "description": "Incus 是开源的系统容器与虚拟机管理器，其存储卷配置允许通过 block.create_options 等控制项把额外参数透传到底层 mkfs 等文件系统创建工具。\n受影响版本中，cmd/incusd/storage_volumes.go 的 storagePoolVolumesPost HTTP handler 仅依赖 auth.EntitlementCanCreateStorageProjects（项目级权限而非服务端管理员权限）作为访问控制；请求中携带的 block.create_options 在 driver_lvm_volumes.go 等驱动内以 validate.IsAny（无任何校验）方式登记，并经 vol.ExpandedConfig(\"block.create_options\") 取出后传入 internal/server/storage/drivers/utils.go 中 makeFSType 的 mkfsOptions.ExtraArgs。makeFSType 通过 strings.Fields(fsOptions.ExtraArgs) 拆分后追加到 cmd 切片，再由 subprocess.TryRunCommand(cmd[0], cmd[1:]...) 以 root 身份执行 mkfs 等工具，使得仅具备项目级 can_create_storage_volumes 权限的用户即可向 mkfs 等命令注入任意参数（例如 XFS 的 `-p /etc/shadow`），从而读取敏感文件、破坏文件系统，或在所调用工具支持的前提下进一步升级为命令执行。\n修复版本中通过提交 041269ff2670e235faa49e3c973de657ace3f28d 在 internal/server/project/permissions.go 的 AllowVolumeCreation 中加入判断：当项目设置 restricted=true 时，若请求体 Config[\"block.create_options\"] 非空且与池配置 volume.block.create_options 默认值不一致即返回错误，切断受限项目用户覆写 mkfs 命令行的路径，从而限制项目级权限对 mkfs 等特权进程的参数影响面。", "effects": [{"comp_name": "github.com/lxc/incus", "ecosystem": "go", "versions": [{"affected_version": "(-∞,7.3.0)", "min_fixed_version": "7.3.0", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "参数注入或修改", "kind_en": "命令中参数分隔符的不正确中和（“参数注入”）", "last_modified_time": "2026-08-21", "level": "Critical", "mps_id": "MPS-exus-jvky", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-exus-jvky", "name": "https://www.oscs1024.com/hd/MPS-exus-jvky"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-62867", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-62867"}, {"url": "https://github.com/lxc/incus/security/advisories/GHSA-q7xw-r4w2-2wcm", "name": ""}], "scope_influence": "", "tags": ["go"], "title": "Incus 存储卷 block.create_options 参数注入漏洞", "_translated": true, "_saved_at": "2026-08-21T16:25:29+00:00", "_first_saved_at": "2026-08-21T16:25:29+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-exus-jvky"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-63125", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.9}]}, "cvss_score": 9.9, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "cwe": "CWE-61", "description": "Incus 是开源的系统容器与虚拟机管理器，使用 Go 语言实现，主仓库位于 https://github.com/lxc/incus，并默认对外提供 /1.0/instances 等 HTTP API。\n受影响版本中，internal/server/storage/backend.go 的 UpdateInstanceBackupFile 方法在 vol.MountTask 回调中通过 os.Create(filepath.Join(inst.Path(), \"backup.yaml\")) 写入实例的 backup.yaml，未限制对符号链接的跟随。攻击者只需使用被构造的镜像通过公开 HTTP 接口（POST /1.0/instances，调用链 createFromImage → instanceCreateFromImage → UpdateBackupFile → UpdateInstanceBackupFile）创建实例，镜像根目录内预置的 backup.yaml 若为指向主机任意路径的符号链接，os.Create 即会跟随该链接，使以 root 身份运行的特权守护进程在主机任意位置覆写文件，最终实现主机 root 任意代码执行。\n修复版本中通过将 os.Create(path) 替换为 os.OpenRoot(inst.Path()) 加 root.OpenFile(\"backup.yaml\", os.O_WRONLY|os.O_CREATE|os.O_TRUNC, 0o400) 的组合，把写入路径严格限制在实例根目录之内并禁止跟随其中的符号链接，从而切断由镜像符号链接触发的主机任意文件写入与代码执行链路。", "effects": [{"comp_name": "incus", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,7.3.0)", "min_fixed_version": "7.3.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "UNIX符号链接跟随", "kind_en": "UNIX 符号链接 (Symlink) 以下", "last_modified_time": "2026-08-21", "level": "Critical", "mps_id": "MPS-n0yt-48lh", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-n0yt-48lh", "name": "https://www.oscs1024.com/hd/MPS-n0yt-48lh"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-63125", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-63125"}, {"url": "https://github.com/lxc/incus/security/advisories/GHSA-6rqx-22hc-qm36", "name": ""}, {"url": "https://github.com/lxc/incus/security/advisories/GHSA-6rqx-22hc-qm36", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Incus backup.yaml 符号链接主机任意写漏洞", "_translated": true, "_saved_at": "2026-08-21T16:25:25+00:00", "_first_saved_at": "2026-08-21T16:25:25+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-n0yt-48lh"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，从而导致未授权的用户或资源可以被访问或篡改。", "title": "什么是访问控制不当"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n", "title": "访问控制不当常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防访问控制不当"}], "cnvd_id": "", "cve_id": "CVE-2026-66788", "cvss": {"cvssv31": [{"source": "secalert@redhat.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.9}]}, "cvss_score": 9.9, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "cwe": "CWE-284", "description": "Lighthouse 中发现了一个缺陷。远程攻击者通过破坏分支集群，可以利用其中资源注入的目标命名空间源自代理对象上由攻击者控制的标签或注释的漏洞。这使得攻击者可以将未经授权的 EndpointSlices 和 ServiceImports 注入对等集群上的任何命名空间，包括 kube-system 和 openshift-* 等关键系统命名空间。这可能会导致集群内的权限升级或其他形式的系统危害。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "访问控制不当", "kind_en": "访问控制不当", "last_modified_time": "2026-08-21", "level": "Critical", "mps_id": "MPS-tecw-s9in", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-tecw-s9in", "name": "https://www.oscs1024.com/hd/MPS-tecw-s9in"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-66788", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-66788"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-66788", "name": ""}, {"url": "https://bugzilla.redhat.com/show_bug.cgi?id=2507533", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-66788漏洞", "_translated": true, "_saved_at": "2026-08-20T20:21:37+00:00", "_first_saved_at": "2026-08-20T20:21:37+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-tecw-s9in"}, {"analysis_status": 0, "articles": [{"content": "应用程序在处理用户输入时的不完善或缺乏验证机制，所以攻击者能够通过向应用程序发送恶意输入，利用应用程序对输入数据的错误处理方式来注入自己的恶意代码。这些恶意代码会被应用程序误认为是合法的指令或数据，并在执行过程中被执行。", "title": "什么是代码注入"}, {"content": "应用程序使用可执行动态代码的函数来执行用户可控的参数，当应用程序对于用户输入过滤不完全时，攻击者可以注入恶意代码并控制代码执行流程。", "title": "代码注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对所有用户输入进行验证和过滤，确保只接受预期的有效输入。这包括对输入数据进行输入长度验证、类型检查和格式验证等。\r\n- 使用参数化查询或预编译语句： 理用户输入时的不完善或缺乏验证机制，所以攻击者能够通过向应用程序发送恶意输入，利用应用程序对输入数据的错误处理方式来注入自己的恶意代码。这些恶意代码会被应用程序误认为是合法的指令或数据，并在执行过程中被执行。", "title": "什么是代码注入"}, {"content": "应用程序使用可执行动态代码的函数来执行用户可控的参数，当应用程序对于用户输入过滤不完全时，攻击者可以注入恶意代码并控制代码执行流程。", "title": "代码注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对所有用户输入进行验证和过滤，确保只接受预期的有效输入。这包括对输入数据进行输入长度验证、类型检查和格式验证等。\r\n- 使用参数化查询或预编译语句：对于数据库查询操作，应该使用参数化查询或预编译语句，确保输入数据不会被误认为是执行代码。\r\n- 最小特权原则：应用程序在执行操作系统命令或动态代码时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。\r\n- 安全编码实践：开发人员应该采用安全编码实践，包括避免使用eval函数、避免拼接用户输入的字符串作为代码执行等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止代码注入攻击。", "title": "如何预防代码注入"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-18781", "cvss": {}, "cvss_score": 9.8, "cvss_vector": "", "cwe": "CWE-94", "description": "Drag and Drop Multiple File Upload for Contact Form 7 是 WordPress 上用于为 Contact Form 7 表单提供拖拽 / 多文件上传能力的开源插件，通过 wp_ajax_nopriv_dnd_codedropz_upload 等 AJAX 动作供前端调用。\n受影响版本中，dnd_upload_cf7_upload() 在获取上传文件名后先调用 dnd_cf7_remove_icons() 去除图标字符再用 wpcf7_antiscript_file_name() 做二次净化，但黑名单扩展名的合法性校验是针对“净化前”的文件名执行，而危险扩展名与完整基名检查又只在第一次出现后即决定后续走向；未认证攻击者可借助字符剥离把受限扩展名隐藏在合法扩展名尾部、或通过 .htaccess / web.config / .user.ini 等可改写服务行为的基名绕过最终持久化检查，从而上传被服务器解析为可执行代码的文件，最终在 Web 服务器进程权限下执行任意代码。\n修复版本中通过将 wpcf7_antiscript_file_name() 移到扩展名校验之前、把黑名单字符串匹配改为精确 in_array 反向比对、新增 .htaccess / web.config / .user.ini 完整基名比对、对每次净化后的最终文件名再做一次复核，并在 dnd_cf7_not_allowed_ext() 中加入 web.config，从源头阻止任何最终名包含可执行扩展或可改写服务器配置的关键基名的上传落到磁盘。", "effects": [{"comp_name": "drag-and-drop-multiple-file-upload-contact-form-7", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.3.9.9)", "min_fixed_version": "1.3.9.9", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "代码注入", "kind_en": "代码生成控制不当（“代码注入”）", "last_modified_time": "2026-08-21", "level": "Critical", "mps_id": "MPS-u05j-alro", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-u05j-alro", "name": "https://www.oscs1024.com/hd/MPS-u05j-alro"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-18781", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-18781"}, {"url": "https://wpscan.com/vulnerability/fb59519b-80ae-48e4-a31a-71d24ded205b/", "name": ""}], "scope_influence": "", "tags": [], "title": "Contact Form 7 拖放上传插件文件名绕过导致 RCE", "_translated": true, "_saved_at": "2026-08-21T09:30:12+00:00", "_first_saved_at": "2026-08-21T08:32:39+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-u05j-alro"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-77086", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.1}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.4}]}, "cvss_score": 9.4, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-22", "description": "SiYuan 是开源的个人知识管理与笔记系统，使用 Go 编写的 kernel 服务提供 HTTP API，并通过 Bazaar 集市管理插件、主题、图标、模板与挂件等扩展。\n受影响版本中，kernel/model/bazaar.go 的 getPackageInstallPath 函数将请求参数 packageName 与基础目录通过 filepath.Join 直接拼接，未校验是否包含 ../ 等路径遍历序列，导致全部 10 个 Bazaar 安装/卸载接口（POST /api/bazaar/installBazaarPlugin、uninstallBazaarPlugin、installBazaarWidget、uninstallBazaarWidget、installBazaarIcon、uninstallBazaarIcon、installBazaarTemplate、uninstallBazaarTemplate、installBazaarTheme、uninstallBazaarTheme）在收到形如 ../../../../target 的 packageName 时，安装流程会将下载的压缩包写入任意目录，卸载流程会调用 os.RemoveAll 递归删除任意目录。\n修复版本中通过在 getPackageInstallPath 入口新增 bazaar.IsValidPackageName 包名合法性校验，并结合 gulu.File.IsSubPath 对最终路径进行容器归属校验，使 ../ 等序列在路径构造阶段即被拒绝，从而切断任意位置文件写入与任意目录递归删除链路。", "effects": [{"comp_name": "github.com/siyuan-note/siyuan/kernel", "ecosystem": "go", "versions": [{"affected_version": "(-∞,3.7.4)", "min_fixed_version": "3.7.4", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-08-21", "level": "Critical", "mps_id": "MPS-1onp-j35b", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-1onp-j35b", "name": "https://www.oscs1024.com/hd/MPS-1onp-j35b"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-77086", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-77086"}, {"url": "https://github.com/siyuan-note/siyuan/security/advisories/GHSA-wr4w-7vjm-mmx3", "name": ""}, {"url": "https://www.vulncheck.com/advisories/siyuan-before-path-traversal-via-packagename", "name": ""}], "scope_influence": "", "tags": ["go"], "title": "SiYuan Bazaar install/uninstall packageName 路径遍历漏洞", "_translated": true, "_saved_at": "2026-08-21T12:34:41+00:00", "_first_saved_at": "2026-08-21T12:34:41+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-1onp-j35b"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-76156", "cvss": {"cvssv4": [{"source": "ART@zuso.ai", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.4}]}, "cvss_score": 9.4, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-78", "description": "从 v8.3.0 到 v8.5.1，Datiphy 数据管理中心的 api 端点中的操作系统命令注入允许经过身份验证的管理员以 root 身份执行任意操作系统命令。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-08-21", "level": "Critical", "mps_id": "MPS-2gtp {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-77087", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.6}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.4}]}, "cvss_score": 9.4, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-862", "description": "Paperclip是开源的AI智能体管理与编排平台，使用TypeScript/Node.js构建，提供本地与多租户部署模式，用于调度本地编码代理与远程托管代理。\n受影响版本中，Paperclip在默认的local_trusted部署模式下，server/src/middleware/auth.ts的第24-27行对所有请求自动赋予isInstanceAdmin为true的本地板级actor，且server/src/middleware/private-hostname-guard.ts仅在authenticated与private模式下启用，导致服务器完全不校验请求的Host头部。攻击者只需诱导本地运行Paperclip的开发者访问包含恶意JavaScript的网页即可触发DNS重新绑定：浏览器先连接攻击者服务器获取页面，攻击者服务器关闭后JS脚本对rebind.attacker.com:3100发起fetch请求，浏览器回退到该域名A记录中的第二个IP即127.0.0.1，到达本地Paperclip服务端；同源策略下可调用POST /api/companies/import与POST /api/agents/:id/wakeup，通过server/src/adapters/process/execute.ts中无沙箱的spawn()执行任意系统命令，实现零点击、零凭证的远程代码执行。\n修复版本中通过将privateHostnameGuard中间件对local_trusted部署模式一并启用，以仅放行Host头部匹配localhost、127.0.0.1与[::1]的请求，阻断攻击者域名的DNS重新绑定回环到本地端口，同时保持local_trusted模式下的本机开发体验。", "effects": [{"comp_name": "paperclipai", "ecosystem": "npm", "versions": [{"affected_version": "(-∞,0.3.1)", "min_fixed_version": "0.3.1", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "e -bpv1-yjim", "name": "https://www.oscs1024.com/hd/MPS-bpv1-yjim"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-77776", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-77776"}, {"url": "https://github.com/headroomlabs-ai/headroom", "name": ""}, {"url": "https://github.com/headroomlabs-ai/headroom/blob/v0.29.0/headroom/proxy/handlers/openai.py", "name": ""}, {"url": "https://github.com/headroomlabs-ai/headroom/blob/v0.36.1/headroom/proxy/identity.py", "name": ""}, {"url": "https://github.com/headroomlabs-ai/headroom/pull/2207", "name": ""}, {"url": "https://www.vulncheck.com/advisories/headroom-proxy-treats-the-client-supplied-x-headroom-user-id-header-as-an-authenticated-identity", "name": ""}], "scope_influence": "", "tags": ["AI", "python", "开源"], "title": "Headroom代理授权绕过漏洞", "_translated": true, "_saved_at": "2026-08-21T14:28:19+00:00", "_first_saved_at": "2026-08-21T13:40:30+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-bpv1-yjim"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过向受信任的数据序列化过程中添加恶意数据，从而在序列化和反序列化过程中执行恶意代码的攻击漏洞。这种漏洞通常存在于使用序列化 (serialization) 机制存储和传输数据的程序中。\n", "title": "什么是反序列化"}, {"content": "- 注入攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码注入到程序中，从而实现代码执行的目的。\n- 反射攻击：攻击者使用反射机制，在序列化过程中动态生成恶意数据，并将恶意代码注入到程序中，从而实现代码执行的目的。\n- 缓冲区溢出攻击：攻击者通过在序列化过程中向缓冲区输入恶意数据，导致缓冲区溢出，从而破坏程序的内存管理，实现代码执行的目的。\n- 格式字符串攻击：攻击者通过在序列化过程中输入恶意数据，导致程序使用错误的格式字符串，从而实现代码执行的目的。\n- 数据流攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码作为一个数据流传递给程序，从而实现代码执行的目的。\n", "title": "反序列化常见的攻击方式"}, {"content": "- 不信任输入数据：程序应该严格检查输入数据的有效性，并避免使用不受信任的数据。\n- 使用安全的序列化机制：程序应该使用安全的序列化机制，如 JSON 或 XML 序列化，而不是第三方序列化库。\n- 最小特权原则：程序应该限制对受信任数据的处理权限，并避免在运行时修改数据。\n- 代码审查和漏洞扫描：程序应该进行代码审查和漏洞扫描，以发现和修复潜在的安全漏洞。\n", "title": "如何预防反序列化"}], "cnvd_id": "", "cve_id": "CVE-2026-77645", "cvss": {"cvssv4": [{"source": "0b655efc-079c-4cb9-9e8d-164871239f4e", "vector": "CVSS:4.0/AV:N/AC:H/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:L/SI:L/SA:L/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:Y/R:U/V:C/RE:M/U:Red", "severity": "critical", "base_score": 9.2}]}, "cvss_score": 9.2, "cvss_vector": "CVSS:4.0/AV:N/AC:H/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:L/SI:L/SA:L/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:Y/R:U/V:C/RE:M/U:Red", "cwe": "CWE-502", "description": "PTC Windchill 和 PTC FlexPLM 中报告了严重的远程代码执行 (RCE) 漏洞。该漏洞可能通过不可信数据的反序列化被利用。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "反序列化", "kind_en": "不可信数据的反序列化", "last_modified_time": "2026-08-21", "level": "Critical", "mps_id": "MPS-usyg-net5", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-usyg-net5", "name": "https://www.oscs1024.com/hd/MPS-usyg-net5"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-77645", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-77645"}, {"url": "https://www.ptc.com/en/support/article/CS474826", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-77645漏洞", "_translated": true, "_saved_at": "2026-08-21T00:56:58+00:00", "_first_saved_at": "2026-08-20T23:19:55+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-usyg-net5"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-76613", "cvss": {"cvssv4": [{"source": "security@joomla.org", "vector": "CVSS:4.0/AV:N/AC:H/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.2}]}, "cvss_score": 9.2, "cvss_vector": "CVSS:4.0/AV:N/AC:H/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-89", "description": "YOOtheme Pro 是商业 Joomla 扩展，提供可视化页面构建与内容模板能力，属于闭源商业软件。\n受影响版本中，扩展在处理 contributor 级别用户可控的字段时未对 SQL 查询进行充分过滤或参数化，导致具备 contributor 权限的认证用户可在提交内容中注入 SQL 片段并被带入查询执行，造成数据库层信息泄露或篡改。\n修复版本中通过收紧对用户可控字段的 SQL 处理，使用占位符参数化或类型校验切断注入路径，使 contributor 级别的输入无法再进入危险查询上下文。", "effects": [{"comp_name": "yootheme_pro", "ecosystem": "linux", "versions": [{"affected_version": "[1.0.0,5.0.40]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-08-21", "level": "Critical", "mps_id": "MPS-yuqk-1570", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-yuqk-1570", "name": "https://www.oscs1024.com/hd/MPS-yuqk-1570"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-76613", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-76613"}, {"url": "https://www.yootheme.com/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "YOOtheme Pro SQL注入漏洞", "_translated": true, "_saved_at": "2026-08-21T15:26:40+00:00", "_first_saved_at": "2026-08-21T13:40:21+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-yuqk-1570"}, 务基于 MiniUPnPd 2.3.7 实现，用于 LAN 侧的自动端口映射。\n受影响版本中，EXOS 6.6.47 固件把 MiniUPnPd 的 UPnP IGD WANIPConnection SOAP 控制端点绑定到 WAN 侧接口的 TCP 5000，并且没有对该服务施加访问控制。MiniUPnPd 中处理 AddPortMapping、DeletePortMapping、GetGenericPortMappingEntry 与 GetExternalIPAddress 这几个 WANIPConnection 动作的 SOAP 请求处理器在收到 WAN 上到达的 SOAP 报文时会无条件信任请求来源，攻击者只要知道设备的公网 IP，就可以远程伪造 SOAP 调用来新增、删除或枚举 NAT 端口映射并查询设备的外网地址，效果等同于直接在防火墙上打洞，将 LAN 内部服务直接暴露到公网。\n修复版本中通过将 MiniUPnPd 的控制端点绑定仅限定到 LAN 接口、并在防火墙策略上禁止外部对 TCP 5000 的访问解决了该问题；CERT/CC 公告同时指出 Calix 暂未发布固件更新，受影响用户应在管理界面禁用 UPnP，或在网关和上游同时阻断对 TCP 5000 的入站流量。", "effects": [{"comp_name": "Calix GS7 XGS (GS5239XG) running EXOS firmware", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,6.6.47]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "关键功能的认证机制缺失", "kind_en": "缺少关键功能的身份验证", "last_modified_time": "2026-08-21", "level": "Critical", "mps_id": "MPS-m728-9a1w", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-m728-9a1w", "name": "https://www.oscs1024.com/hd/MPS-m728-9a1w"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-75501", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-75501"}, {"url": "https://drkq.github.io/security-research/calix-vu756733/", "name": ""}, {"url": "https://kb.cert.org/vuls/id/756733", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Calix GS7 XGS 住宅路由器 UPnP WANIPConnection 未认证远程访问漏洞", "_translated": true, "_saved_at": "2026-08-21T16:25:18+00:00", "_first_saved_at": "2026-08-21T16:25:18+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-m728-9a1w"}, {"analysis_status": 0, "articles": [], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-63046", "cvss": {}, "cvss_score": 9, "cvss_vector": "", "cwe": "CWE-88", "description": "Apache InLong 是 Apache 软件基金会旗下的一站式海量数据集成服务，提供数据采集、传输、聚合与排序能力，相关代码以 Java 实现并在 GitHub 上以 Apache-2.0 协议开源。\n受影响版本中，Manager 端的 ModuleController 公开 REST 接口允许具备 INLONG_ADMIN 角色的调用方在 ModuleRequest 中写入任意 startCommand / stopCommand / checkCommand / installCommand / uninstallCommand 字符串；该请求经 ModuleServiceImpl.save / update 持久化至 Manager 数据库后，Agent 端的 ModuleManager 在 installModule / startModule / stopModule / uninstallModule / isProcessAllStarted 等方法中，将这些字符串原样传入 org.apache.inlong.agent.utils.ExcuteLinux.exeCmd(String)，而后者内部使用 /bin/sh -c 派生子进程，整个调用链既无 shell 元字符过滤也无 argv[0] 白名单校验。攻击者只需在命令字符串中拼接 ; | \u0026 $( ) 等 shell 元字符或附加任意可执行文件名，即可在所有部署了该模块的 Agent 主机上以运行 Agent 进程的系统权限执行任意 shell 命令，构成由 Manager 管理员凭证通向 Agent 节点完整控制权的提权 / 远程代码执行路径。\n修复版本中通过PR #12151 将 ExcuteLinux 改造为基于 ProcessBuilder 的 argv 数组入口 exeCmd(String[]) / exeCmd(List,File,long) 与链式 exePipedCmd，彻底移除 /bin/sh -c 调用，并新增 ModuleCommandValidator 与 AllowedRootsResolver 在 Agent 端执行前对 argv[0]、元字符与工作目录根路径做白名单与路径根校验；同时 PR #12155 在 ModuleServiceImpl.save / update 中调用 ModuleCommandValidator.validateOnSave / validateOnUpdate 进行保存前白名单校验，发现违规时通过 ErrorCodeEnum.MODULE_COMMAND_NOT_IN_WHITELIST 抛出 BusinessException，从源头阻断非法命令进入持久化与执行链。", "effects": [{"comp_name": "org.apache.inlong:inlong-agent", "ecosystem": "maven", "versions": [{"affected_version": "[2.0.0,2.4.0)", "min_fixed_version": "2.4.0", "repository": "maven", "solutions": [], "upstream": true}]}, {"comp_name": "org.apache.inlong:inlong-manager", "ecosystem": "maven", "versions": [{"affected_version": "[2.0.0,2.4.0)", "min_fixed_version": "2.4.0", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "参数注入或修改", "kind_en": "命令中参数分隔符的不正确中和（“参数注入”）", "last_modified_time": "2026-08-21", "level": "Critical", "mps_id": "MPS-pabr-7ntd", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/h ": "Azure SQL Database SSRF权限提升漏洞", "_translated": true, "_saved_at": "2026-08-21T18:27:52+00:00", "_first_saved_at": "2026-08-21T17:22:37+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ngky-fdth"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-76904", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-89", "description": "GeoTools 是开源 Java 地理空间数据处理库，其 modules/plugin/jdbc/jdbc-postgis 子模块提供 org.geotools.jdbc:gt-jdbc-postgis 组件，用于通过 PostGIS 数据存储执行 OGC Filter 表达式并翻译为 PostgreSQL SQL。\n受影响版本中，FilterToSqlHelper 的 encodeJsonArrayContains 在将 jsonArrayContains(\u003ccolumn\u003e, \u003cpointer\u003e, \u003cvalue\u003e) 过滤函数翻译为 SQL 时，调用私有方法 constructEquality 把 user-controlled 的 \u003cvalue\u003e 参数直接拼入 \"(@.%s == \\\"%s\\\")\" 模板，生成形如 jsonb_path_exists(col, '($.path == \\\"evil\\\")') 的查询字符串而未对 \u003cvalue\u003e 做 SQL 转义。攻击者在远程 OGC Filter 接口传入含 \" 或反斜杠的 \u003cvalue\u003e 即可中断 SQL 字面量并注入任意 SQL 表达式，导致在 PostGIS 后端执行非预期读写。\n修复版本中通过在 constructEquality 的 String 分支统一调用 escapeJsonLiteral（包装 EscapeSql.escapeLiteral(literal, true, true)）对 \u003cvalue\u003e 进行 SQL 字面量转义后再写入模板，同时新增 FilterToSqlHelper 测试用例验证 PostGIS 12+ 行为，切断利用者在 jsonArrayContains 过滤器上注入 SQL 表达式的链路。", "effects": [{"comp_name": "org.geotools.jdbc:gt-jdbc-postgis", "ecosystem": "maven", "versions": [{"affected_version": "[34.0,34.5)", "min_fixed_version": "34.5", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[30.5,33.6)", "min_fixed_version": "33.6", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[35.0,35.1)", "min_fixed_version": "35.1", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-08-22", "level": "Critical", "mps_id": "MPS-ce7i-fsl5", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://github.com/geotools/geotools/security/advisories/GHSA-mqjf-5f49-2fjh", "name": ""}, {"url": "https://github.com/geotools/geotools/pull/5829", "name": ""}, {"url": "https://github.com/geotools/geotools/commit/d821c4d321dd91c22e31fcd5b1ce676645da5176", "name": ""}, {"url": "https://github.com/geotools/geotools/releases/tag/33.6", "name": ""}, {"url": "https://github.com/geotools/geotools/releases/tag/34.5", "name": ""}, {"url": "https://github.com/geotools/geotools/releases/tag/35.1", "name": ""}, {"url": "https://osgeo-org.atlassian.net/browse/GEOT-7589", "name": ""}, {"url": "https://osgeo-org.atlassian.net/browse/GEOT-7958", "name": ""}, {"url": "https://osgeo-org.atlassian.net/browse/GEOT-7959", "name": ""}, {"url": "https://github.com/advisories/GHSA-mqjf-5f49-2fjh", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "GeoTools PostGIS DataStore jsonArrayContains SQL 注入漏洞", "_translated": true, "_saved_at": "2026-08-21T22:17:20+00:0 ", "kind": "eval注入", "kind_en": "动态评估代码中指令的不当中和（“评估注入”）", "last_modified_time": "2026-08-22", "level": "Critical", "mps_id": "MPS-c1lq-h5ke", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-c1lq-h5ke", "name": "https://www.oscs1024.com/hd/MPS-c1lq-h5ke"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-77810", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-77810"}, {"url": "https://aws.amazon.com/security/security-bulletins/2026-087-aws/", "name": ""}, {"url": "https://github.com/awslabs/aws-athena-query-federation/releases/tag/v2026.30.1", "name": ""}, {"url": "https://github.com/awslabs/aws-athena-query-federation/security/advisories/GHSA-v7c2-5wfg-qg44", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Athena Neptune连接器Gremlin QPT代码注入漏洞", "_translated": true, "_saved_at": "2026-08-21T21:17:53+00:00", "_first_saved_at": "2026-08-21T21:17:53+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-c1lq-h5ke"}, {"analysis_status": 0, "articles": [{"content": "应用程序在处理用户输入时的不完善或缺乏验证机制，所以攻击者能够通过向应用程序发送恶意输入，利用应用程序对输入数据的错误处理方式来注入自己的恶意代码。这些恶意代码会被应用程序误认为是合法的指令或数据，并在执行过程中被执行。", "title": "什么是代码注入"}, {"content": "应用程序使用可执行动态代码的函数来执行用户可控的参数，当应用程序对于用户输入过滤不完全时，攻击者可以注入恶意代码并控制代码执行流程。", "title": "代码注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对所有用户输入进行验证和过滤，确保只接受预期的有效输入。这包括对输入数据进行输入长度验证、类型检查和格式验证等。\r\n- 使用参数化查询或预编译语句：对于数据库查询操作，应该使用参数化查询或预编译语句，确保输入数据不会被误认为是执行代码。\r\n- 最小特权原则：应用程序在执行操作系统命令或动态代码时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。\r\n- 安全编码实践：开发人员应该采用安全编码实践，包括避免使用eval函数、避免拼接用户输入的字符串作为代码执行等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止代码注入攻击。", "title": "如何预防代码注入"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-77413", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "se
