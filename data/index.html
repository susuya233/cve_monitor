定指针，从攻击者控制的 api 表加载函数指针并在监管模式下调用，使非特权用户线程获得内核态代码执行，完全逃逸用户空间内存保护沙箱，次级后果为两级内核任意读或内核崩溃。\n修复版本中通过在 z_vrfy_i3c_transfer() 内改用 k_usermode_from_copy() 将调用方描述符整体快照到内核栈本地副本 target_copy，对副本中的 bus 字段执行 K_SYSCALL_OBJ() 校验，并以该副本继续完成消息拷贝与派发，使被校验的总线对象与实际参与派发的总线对象保持一致，切断了检查与使用之间可被竞态改写的二次读取窗口。", "effects": [{"comp_name": "zephyr", "ecosystem": "linux", "versions": [{"affected_version": "[3.2.0,4.3.2)", "min_fixed_version": "4.3.2", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[4.4.0,4.5.0)", "min_fixed_version": "4.5.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "检查时间与使用时间(TOCTOU)的竞争条件", "kind_en": "检查时间使用时间 (TOCTOU) 竞争条件", "last_modified_time": "2026-11-04", "level": "High", "mps_id": "MPS-xne2-rdjf", "poc": false, "poc_url": [], "published_time": "2026-11-04", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-xne2-rdjf", "name": "https://www.oscs1024.com/hd/MPS-xne2-rdjf"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-87038", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-87038"}, {"url": "https://github.com/zephyrproject-rtos/zephyr/commit/550437bc9efd7b733f13b9be73e77fd98858c8a2", "name": "Fix commit"}, {"url": "https://github.com/zephyrproject-rtos/zephyr/security/advisories/GHSA-86xj-2q6x-h82w", "name": "GHSA-86xj-2q6x-h82w"}], "scope_influence": "", "tags": ["应用软件"], "title": "Zephyr I3C竞态条件漏洞", "_translated": true, "_saved_at": "2026-11-04T08:27:12+00:00", "_first_saved_at": "2026-11-04T08:27:12+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-xne2-rdjf"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-121489", "cvss": {}, "cvss_score": 8.1, "cvss_vector": "", "cwe": "CWE-22", "description": "Apache Juneau 是 Apache 软件基金会开源的 Java 序列化与 REST 微服务框架，juneau-microservice-core 模块内置的 DirectoryResource 资源用于通过 REST 接口浏览、查看、上传与删除指定根目录下的文件。\n受影响版本中，DirectoryResource 的 getFile 方法直接将请求路径与根目录绝对路径拼接构造 File 对象，仅检查目标文件是否存在，未校验解析结果是否仍位于配置的根目录之内，攻击者在 URL 路径中使用 ../ 段、绝对路径或指向根目录外的符号链接可访问服务器进程权限内的任意文件；当应用启用 allowViews、allowDeletes 或 allowUploads 时，攻击者可分别实现任意文件读取、删除或写入，这些开关默认关闭，仅显式启用相关功能的应用受影响。\n修复版本中通过 FileUtils.resolveSafely 方法先规范化根目录，再将请求路径解析并规范化后校验其是否以根目录为前缀，并复核符号链接的真实指向，任何逃逸根目录的请求返回 403 Forbidden，根目录内不存在的路径仍返回 404，从而切断路径穿越链路。", "effects": [{"comp_name": "org.apache.juneau:juneau-commons", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,9.2.1)", "min_fixed_version": "9.2.1", "repository": "maven", "solutions": [], "upstream": true}]}, {"comp_name": "org.apache.juneau:juneau-microservice-core", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,9.2.1)", "min_fixed_version": "9.2.1", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-11-05", "level": "High", "mps_id": "MPS-d16d-c4c8", "poc": false, "poc_url": [], "published_time": "2026-11-05", "reference_url_list": [{"url": "https://www.openwall.com/lists/oss-security/2026/11/04/7", "name": ""}, {"url": "https://juneau.apache.org/docs/release-notes/9.2.1", "name": ""}, {"url": "https://github.com/apache/juneau/commit/b91bce161713998fc9953b713263cd894af2931d", "name": ""}, {"url": "https://github.com/apache/juneau/releases/tag/juneau-9.2.1", "name": ""}, {"url": "https://downloads.apache.org/juneau/9.2.1/", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "Juneau路径穿越漏洞", "_translated": true, "_saved_at": "2026-11-04T16:44:55+00:00", "_first_saved_at": "2026-11-04T16:44:55+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-d16d-c4c8"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-73116", "cvss": {}, "cvss_score": 7.5, "cvss_vector": "", "cwe": "CWE-522", "description": "Apache Juneau 是 Apache 软件基金会开源的 Java REST 服务与序列化框架，其中 juneau-rest-client 模块提供基于 RestClient 构建器的 REST 客户端，用于应用与远程服务之间的 HTTP 调用。\n受影响版本中，RestClient.Builder 的 createHttpClient() 方法直接以默认重定向策略构建底层 Apache HttpClient，未注册任何凭据防护拦截器，HttpClient 默认重定向执行器在跟随 3xx 重定向时会把原请求的全部请求头复制到跳转请求，Authorization、Cookie、Proxy-Authorization、X-API-Key 等凭据头随请求被发往 Location 指向的不同主机或不同端口目标，重定向由 HTTPS 降级为 HTTP 时凭据以明文发出，控制该服务端或能诱导其返回跨源重定向的攻击者由此获得这些凭据。\n修复版本中通过在 createHttpClient() 中注册 RedirectCredentialGuard 拦截器修复该问题，拦截器记录一次请求交换中首个请求的源站，后续请求经 RedirectSecurity.shouldStripCredentials() 判定源站变化或 HTTPS 降级 HTTP 后，按 RedactedHeaders 定义的凭据头集合移除 Authorization、Cookie、Set-Cookie、Proxy-Authorization、X-API-Key，阻止凭据转发到其他源站；该保护仅覆盖由 RestClient 构建器创建的 HTTP 客户端。", "effects": [{"comp_name": "org.apache.juneau:juneau-rest-client", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,9.2.1)", "min_fixed_version": "9.2.1", "repository": "maven", "solutions": [], "upstream": true}]}, {"comp_name": "org.apache.juneau:juneau-rest-common", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,9.2.1)", "min_fixed_version": "9.2.1", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "凭证保护不足", "kind_en": "凭证保护不足", "last_modified_time": "2026-11-05", "level": "High", "mps_id": "MPS-5a1c-a752", "poc": false, "poc_url": [], "published_time": "2026-11-05", "reference_url_list": [{"url": "https://www.openwall.com/lists/oss-security/2026/11/04/7", "name": ""}, {"url": "https://juneau.apache.org/security", "name": ""}, {"url": "https://downloads.apache.org/juneau/9.2.1/", "name": ""}, {"url": "https://github.com/apache/juneau/releases/tag/juneau-9.2.1", "name": ""}, {"url": "https://github.com/apache/juneau/commit/81677c11fb4b35157ea176a97af0ace82126d25e", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "Juneau REST客户端重定向凭据泄露漏洞", "_translated": true, "_saved_at": "2026-11-04T16:44:56+00:00", "_first_saved_at": "2026-11-04T16:44:56+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-5a1c-a752"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-73100", "cvss": {}, "cvss_score": 7.5, "cvss_vector": "", "cwe": "CWE-532", "description": "Apache Juneau 是 Apache 软件基金会的开源 Java 工具包，提供 POJO 序列化框架与基于 Servlet 的 REST 服务端组件，通过 Maven org.apache.juneau 坐标分发。\n受影响版本中，REST 服务端默认调用日志器 BasicCallLogger 针对状态码 500 以上的请求按 HEADER 级别记录请求头，CallLogger 的 log(HttpServletRequest, HttpServletResponse) 方法将 req.getHeader(h) 返回的头部值原样拼入日志文本且未做任何脱敏，任意能触发服务端 5xx 响应的客户端会使该请求中的 Authorization、Cookie、Proxy-Authorization、X-API-Key 等凭据请求头以明文形式写入应用日志，可读取日志的人由此获得这些凭据。\n修复版本中通过在 CallLogger 写入日志前将请求头与响应头值统一交由新增的 RedactedHeaders.redact 方法处理实现脱敏，默认命中 Authorization、Cookie、Set-Cookie、Proxy-Authorization、X-API-Key 五类凭据头时以 [REDACTED] 占位符替代真实值，并支持经 redactedHeaders(String...) 与 redactHeader(String) 调整脱敏名单，切断凭据写入日志的路径。", "effects": [{"comp_name": "org.apache.juneau:juneau-rest-common", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,9.2.1)", "min_fixed_version": "9.2.1", "repository": "maven", "solutions": [], "upstream": true}]}, {"comp_name": "org.apache.juneau:juneau-rest-server", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,9.2.1)", "min_fixed_version": "9.2.1", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "日志敏感信息泄露", "kind_en": "将敏感信息插入日志文件", "last_modified_time": "2026-11-05", "level": "High", "mps_id": "MPS-9147-2d90", "poc": false, "poc_url": [], "published_time": "2026-11-05", "reference_url_list": [{"url": "https://www.openwall.com/lists/oss-security/2026/11/04/7", "name": ""}, {"url": "https://juneau.apache.org/security", "name": ""}, {"url": "https://github.com/apache/juneau/releases/tag/juneau-9.2.1", "name": ""}, {"url": "https://downloads.apache.org/juneau/9.2.1/", "name": ""}, {"url": "https://github.com/apache/juneau/commit/81677c11fb4b35157ea176a97af0ace82126d25e", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "Apache Juneau敏感请求头明文日志漏洞", "_translated": true, "_saved_at": "2026-11-04T16:44:57+00:00", "_first_saved_at": "2026-11-04T16:44:57+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-9147-2d90"}, {"analysis_status": 0, "articles": [{"content": "跨站点请求伪造 (CSRF)通过利用网站对用户请求的信任进行攻击。当用户在网站A登录并在同一浏览器会话中访问网站B时，攻击者可以构造特制的请求并诱使用户执行，以使网站B误以为这些请求是用户合法发起的。\n攻击者通常通过欺骗用户点击恶意链接、在受信任的网站中植入恶意代码或通过钓鱼等手段来实施CSRF攻击，一旦用户执行了恶意请求，攻击者可以以用户的身份执行任意操作，包括更改用户密码、发起资金转账或删除重要数据等。", "title": "什么是CSRF"}, {"content": "- 链接欺骗：攻击者通过向用户发送包含恶意链接的电子邮件或社交媒体消息，诱使用户点击并执行恶意请求。\n- 图片引用攻击：攻击者通过在恶意网站上包含指向目标网站的图片引用，以触发用户浏览器自动发送目标网站的请求。\n- XSS利用：如果目标网站存在XSS漏洞，攻击者可以注入恶意脚本，以使用户在浏览器中执行恶意请求。", "title": "CSRF常见的攻击方式"}, {"content": "- 随机令牌：网站可以在每个请求中包含一个随机生成的令牌（CSRF Token），并验证该令牌的有效性，以确认请求的来源是合法的。\n- SameSite Cookie：使用SameSite属性来限制跨站点请求，将Cookie的发送限制在同一站点上，减少了跨站请求伪造的风险。\n- 双重验证：对于敏感操作，网站可以要求用户进行额外的验证，例如输入验证码、提供第二个因素的身份验证等。\n- 强化浏览器策略：网站可以设置Content-Security-Policy（CSP）头，限制浏览器执行恶意脚本的能力，减少CSRF攻击的风险。\n- 限制用户操作：网站可以要求用户在执行敏感操作之前进行明确的确认或授权，防止恶意请求被误触发。\n- 安全编码实践：开发人员应遵循安全编码实践，对用户输入进行适当的验证和过滤，防止恶意请求的注入。", "title": "如何预防CSRF"}], "cnvd_id": "", "cve_id": "CVE-2026-73099", "cvss": {}, "cvss_score": 7.1, "cvss_vector": "", "cwe": "CWE-352", "description": "Apache Juneau 是 Apache 软件基金会开源的 Java 序列化与 REST 服务框架，juneau-rest-server 模块用于通过注解将 POJO 快速发布为 REST 接口。\n受影响版本中，juneau-rest-server 默认启用 content 查询参数对请求体的覆盖（disableContentParam 默认为 false），RestRequest 构造函数在 isAllowContentParam 为真时直接读取查询参数 content 并将其设置为请求体、强制按 UON 格式解析，且不校验 HTTP 方法，攻击者可通过跨站链接、表单或嵌入资源以 GET 等任意方法向端点投递攻击者可控的请求体，全程无 CORS 预检且不受端点预期 Content-Type 限制，绕过依赖请求方法或内容类型而非 anti-CSRF token 的防护，以受害者会话执行状态变更操作。\n修复版本中通过新增 isContentParamMethod 方法并调整 RestRequest 构造函数的启用条件，使 content 查询参数仅在 PUT 与 POST 请求上生效，跨站 GET 无法再注入攻击者请求体，切断该 CSRF 攻击链。", "effects": [{"comp_name": "org.apache.juneau:juneau-rest-server", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,9.2.1)", "min_fixed_version": "9.2.1", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "CSRF", "kind_en": "跨站请求伪造 (CSRF)", "last_modified_time": "2026-11-05", "level": "High", "mps_id": "MPS-cef4-bd21", "poc": false, "poc_url": [], "published_time": "2026-11-05", "reference_url_list": [{"url": "https://www.openwall.com/lists/oss-security/2026/11/04/7", "name": ""}, {"url": "https://github.com/apache/juneau/commit/81677c11fb4b35157ea176a97af0ace82126d25e", "name": ""}, {"url": "https://github.com/apache/juneau/releases/tag/juneau-9.2.1", "name": ""}, {"url": "https://downloads.apache.org/juneau/9.2.1/", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "Juneau请求体覆盖CSRF漏洞", "_translated": true, "_saved_at": "2026-11-04T16:44:54+00:00", "_first_saved_at": "2026-11-04T16:44:54+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-cef4-bd21"}]}</script>
  <script>
    const payload = JSON.parse(document.getElementById("payload").textContent);
    const levelLabels = payload.level_labels || {};
    const items = payload.items || [];
    let filtered = items.slice();
    let activeId = null;

    const $ = (id) => document.getElementById(id);
    $("generatedAt").textContent = payload.generated_at || "-";
    $("retention").textContent = payload.retention_days ?? "-";
    $("cutoff").textContent = payload.cutoff_date || "-";
    $("count").textContent = String(payload.count ?? items.length);

    function levelClass(level) {
      const cn = levelLabels[level] || level || "";
      if (level === "Critical" || cn === "严重") return "crit";
      if (level === "High" || cn === "高危") return "high";
      return "other";
    }
    function levelText(level) {
      return levelLabels[level] || level || "-";
    }
    function esc(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }
    function scoreText(v) {
      if (v === null || v === undefined || v === "" || v === -1) return "-";
      return String(v);
    }

    function renderList() {
      const list = $("list");
      $("listCount").textContent = String(filtered.length);
      if (!filtered.length) {
        list.innerHTML = '<div class="empty">没有匹配项</div>';
        return;
      }
      list.innerHTML = filtered.map((it) => {
        const id = it.mps_id || it.cve_id;
        const active = id === activeId ? " active" : "";
        return `
          <button class="item${active}" data-id="${esc(id)}" type="button">
            <div class="item-top">
              <span class="cve">${esc(it.cve_id || it.mps_id || "-")}</span>
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
            </div>
            <div class="title">${esc(it.title || "-")}</div>
            <div class="item-foot">
              <span>CVSS ${esc(scoreText(it.cvss_score))}</span>
              <span>${esc(it.published_time || "-")}</span>
              ${it.poc ? "<span>POC</span>" : ""}
            </div>
          </button>`;
      }).join("");
      list.querySelectorAll(".item").forEach((btn) => {
        btn.addEventListener("click", () => selectById(btn.dataset.id));
      });
    }

    function refsHtml(it) {
      const refs = Array.isArray(it.reference_url_list) ? it.reference_url_list : [];
      const links = [];
      if (it._source_page) links.push({ url: it._source_page, name: "OSCS 详情" });
      if (it.cve_id) links.push({ url: `https://nvd.nist.gov/vuln/detail/${it.cve_id}`, name: "NVD" });
      refs.forEach((r) => {
        if (r && r.url) links.push({ url: r.url, name: r.name || r.url });
      });
      const seen = new Set();
      const uniq = [];
      for (const l of links) {
        if (seen.has(l.url)) continue;
        seen.add(l.url);
        uniq.push(l);
      }
      if (!uniq.length) return '<div class="box">无参考链接</div>';
      return `<div class="refs">${uniq.map((l) =>
        `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name || l.url)}</a>`
      ).join("")}</div>`;
    }

    function articlesHtml(it) {
      const arts = Array.isArray(it.articles) ? it.articles : [];
      if (!arts.length) return "";
      return `<div class="section"><h3>相关说明</h3>${arts.map((a) => `
        <div class="article">
          <h4>${esc(a.title || "说明")}</h4>
          <p>${esc(a.content || "")}</p>
        </div>`).join("")}</div>`;
    }

    function renderDetail(it) {
      const detail = $("detail");
      if (!it) {
        detail.innerHTML = '<div class="empty">暂无数据</div>';
        return;
      }
      const pocUrls = Array.isArray(it.poc_url) ? it.poc_url : [];
      detail.innerHTML = `
        <div class="d-head">
          <div>
            <h1 class="d-title">${esc(it.title || "-")}</h1>
            <div class="ids">
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
              <span class="chip">${esc(it.cve_id || "无 CVE")}</span>
              <span class="chip">${esc(it.mps_id || "-")}</span>
              ${it.poc ? '<span class="chip">有 POC</span>' : ""}
              ${it.exp ? '<span class="chip">有 EXP</span>' : ""}
            </div>
          </div>
          <div class="actions">
            ${it._source_page ? `<a class="btn" href="${esc(it._source_page)}" target="_blank" rel="noopener">OSCS</a>` : ""}
            ${it.cve_id ? `<a class="btn" href="https://nvd.nist.gov/vuln/detail/${esc(it.cve_id)}" target="_blank" rel="noopener">NVD</a>` : ""}
          </div>
        </div>
        <div class="grid">
          <div class="stat"><div class="k">CVSS</div><div class="v">${esc(scoreText(it.cvss_score))}</div></div>
          <div class="stat"><div class="k">向量</div><div class="v">${esc(it.cvss_vector || "-")}</div></div>
          <div class="stat"><div class="k">CWE</div><div class="v">${esc(it.cwe || "-")}</div></div>
          <div class="stat"><div class="k">类型</div><div class="v">${esc(it.kind || it.kind_en || "-")}</div></div>
          <div class="stat"><div class="k">公开</div><div class="v">${esc(it.published_time || "-")}</div></div>
          <div class="stat"><div class="k">利用成本</div><div class="v">${esc(it.exploit_requirement_cost || "-")}</div></div>
          <div class="stat"><div class="k">可利用性</div><div class="v">${esc(it.exploitability || "-")}</div></div>
          <div class="stat"><div class="k">修复建议</div><div class="v">${esc(it.fix_suggestion || "-")}</div></div>
        </div>
        <div class="section"><h3>描述</h3><div class="box">${esc(it.description || "无描述")}</div></div>
        ${it.scope_influence ? `<div class="section"><h3>影响范围</h3><div class="box">${esc(it.scope_influence)}</div></div>` : ""}
        ${pocUrls.length ? `<div class="section"><h3>POC 链接</h3><div class="refs">${pocUrls.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join("")}</div></div>` : ""}
        <div class="section"><h3>参考链接</h3>${refsHtml(it)}</div>
        ${articlesHtml(it)}
      `;
    }

    function selectById(id) {
      const it = filtered.find((x) => (x.mps_id || x.cve_id) === id) ||
                 items.find((x) => (x.mps_id || x.cve_id) === id);
      if (!it) return;
      activeId = it.mps_id || it.cve_id;
      renderList();
      renderDetail(it);
      const btn = document.querySelector(`.item[data-id="${CSS.escape(activeId)}"]`);
      if (btn) btn.scrollIntoView({ block: "nearest" });
      history.replaceState(null, "", "#" + encodeURIComponent(activeId));
    }

    function applyFilter(q) {
      const query = (q || "").trim().toLowerCase();
      filtered = !query ? items.slice() : items.filter((it) => {
        const blob = [
          it.cve_id, it.mps_id, it.title, it.kind, it.kind_en, it.cwe, it.description, it.level
        ].map((x) => String(x || "").toLowerCase()).join(" ");
        return blob.includes(query);
      });
      renderList();
      if (filtered.length) {
        const still = filtered.some((x) => (x.mps_id || x.cve_id) === activeId);
        selectById(still ? activeId : (filtered[0].mps_id || filtered[0].cve_id));
      } else {
        activeId = null;
        renderDetail(null);
      }
    }

    $("search").addEventListener("input", (e) => applyFilter(e.target.value));

    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement !== $("search")) {
        e.preventDefault();
        $("search").focus();
        return;
      }
      if (!filtered.length) return;
      const idx = filtered.findIndex((x) => (x.mps_id || x.cve_id) === activeId);
      if (e.key === "ArrowDown") {
        e.preventDefault();
        const next = filtered[Math.min(filtered.length - 1, Math.max(0, idx) + 1)];
        selectById(next.mps_id || next.cve_id);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        const prev = filtered[Math.max(0, idx - 1)];
        selectById(prev.mps_id || prev.cve_id);
      }
    });

    const hashId = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    if (hashId && items.some((x) => (x.mps_id || x.cve_id) === hashId)) {
      activeId = hashId;
      renderList();
      selectById(hashId);
    } else if (items.length) {
      selectById(items[0].mps_id || items[0].cve_id);
    } else {
      renderList();
      renderDetail(null);
    }
  </script>
</body>
</html>
