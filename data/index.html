spacectl 入口对 largepage 对象直接返回 ENOTSUP，切断错误释放路径。", "effects": [{"comp_name": "freebsd", "ecosystem": "linux", "versions": [{"affected_version": "[15.1-RELEASE,15.1-RELEASE-p1)", "min_fixed_version": "15.1-RELEASE-p1", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[15.0-RELEASE,15.0-RELEASE-p11)", "min_fixed_version": "15.0-RELEASE-p11", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[14.4-RELEASE,14.4-RELEASE-p7)", "min_fixed_version": "14.4-RELEASE-p7", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[14.3-RELEASE,14.3-RELEASE-p16)", "min_fixed_version": "14.3-RELEASE-p16", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "动态确定对象属性修改的控制不恰当", "kind_en": "动态确定的对象属性的受控修改不当", "last_modified_time": "2026-08-19", "level": "High", "mps_id": "MPS-dgae-98fo", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-dgae-98fo", "name": "https://www.oscs1024.com/hd/MPS-dgae-98fo"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-49428", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-49428"}, {"url": "https://security.freebsd.org/advisories/FreeBSD-SA-26:44.posixshm.asc", "name": ""}], "scope_influence": "", "tags": ["操作系统"], "title": "FreeBSD共享内存释放漏洞", "_translated": true, "_saved_at": "2026-08-19T08:29:21+00:00", "_first_saved_at": "2026-08-19T08:29:21+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-dgae-98fo"}, {"analysis_status": 0, "articles": [], "attack_vector_type": "Local", "cnvd_id": "", "cve_id": "CVE-2026-49429", "cvss": {}, "cvss_score": 7.8, "cvss_vector": "", "cwe": "CWE-122", "description": "FreeBSD 是开源操作系统，基础系统从 7.0 起集成 OpenZFS，并提供 zfs-userspace(8) 查询数据集按用户统计的空间占用。\n受影响版本中，ZFS_IOC_USERSPACE_MANY ioctl 对应的 zfs_ioc_userspace_many 将调用方提供的 64 位 zc_nvlist_dst_size 截断为 32 位 int 后调用 vmem_alloc 分配内核缓冲区，却仍把原始 64 位大小作为 zfs_userspace_many 写回记录的上限。拥有 userused 委托权限的本地用户可触发内核堆溢出并可能提升权限。\n修复版本中通过把 bufsize 改为 uint64_t，并以 1000 条 zfs_useracct_t 为上限截取分配长度，在调用 zfs_userspace_many 前将 zc_nvlist_dst_size 同步为实际分配大小，避免写回超过已分配缓冲区。", "effects": [{"comp_name": "freebsd", "ecosystem": "linux", "versions": [{"affected_version": "[15.1-RELEASE,15.1-RELEASE-p1)", "min_fixed_version": "15.1-RELEASE-p1", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[14.3-RELEASE,14.3-RELEASE-p16)", "min_fixed_version": "14.3-RELEASE-p16", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[15.0-RELEASE,15.0-RELEASE-p11)", "min_fixed_version": "15.0-RELEASE-p11", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[14.4-RELEASE,14.4-RELEASE-p7)", "min_fixed_version": "14.4-RELEASE-p7", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "堆缓冲区溢出", "kind_en": "基于堆的缓冲区溢出", "last_modified_time": "2026-08-19", "level": "High", "mps_id": "MPS-pqjh-nwyo", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-pqjh-nwyo", "name": "https://www.oscs1024.com/hd/MPS-pqjh-nwyo"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-49429", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-49429"}, {"url": "https://security.freebsd.org/advisories/FreeBSD-SA-26:40.zfs.asc", "name": ""}], "scope_influence": "", "tags": ["操作系统"], "title": "FreeBSD ZFS堆溢出漏洞", "_translated": true, "_saved_at": "2026-08-19T08:29:23+00:00", "_first_saved_at": "2026-08-19T08:29:23+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-pqjh-nwyo"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-71551", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "cwe": "CWE-78", "description": "Super Productivity 是一款开源的进阶任务管理与时间跟踪桌面应用，基于 Electron 构建并通过 GitHub Releases 在 Windows、macOS 与 Linux 上分发。\n受影响版本中，electron/ipc-handlers/exec.ts 中由 initExecIpc 通过 ipcMain.on('EXEC') 注册的 listener 接收渲染进程经 IPC.EXEC 通道传入的命令字符串后直接调用 child_process.exec() 执行，未与插件 nodeExecution 同意门控解耦；electron/preload.ts 通过 contextBridge 暴露的 window.ea.exec() 桥可被同源 iframe 插件以及由 new Function() 在宿主 renderer realm 内运行的社区 JS 插件调用，确认弹窗仅保护首次执行且“记住我的回答”默认勾选，已批准的命令随后会被持久化到 simpleSettings 的 ALLOWED_COMMANDS 中以便静默复用，攻击者借助恶意插件、含恶意 JS 的渲染页面或渲染层 XSS 即可在桌面账号权限下获得任意 shell 命令执行能力。\n修复版本中通过从根源移除该 EXEC IPC 原语解决了该问题：删除 electron/ipc-handlers/exec.ts 全部内容并清理 initExecIpc 装配，同时移除 preload.exec 桥、电子端 ElectronAPI.exec() 方法签名与 IPC.EXEC 通道常量与执行链路，仅保留受 nodeExecution 同意门控的 executeNodeScript 作为唯一受认可的进程路径，遗留 COMMAND 任务附件不再执行。", "effects": [{"comp_name": "super-productivity", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,18.13 ublished_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-1fm5-avdx", "name": "https://www.oscs1024.com/hd/MPS-1fm5-avdx"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-76235", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-76235"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-76235", "name": ""}, {"url": "https://bugzilla.redhat.com/show_bug.cgi?id=2519497", "name": ""}], "scope_influence": "", "tags": [], "title": "cockpit-ws登录页处理器内存泄漏漏洞", "_translated": true, "_saved_at": "2026-08-19T14:26:37+00:00", "_first_saved_at": "2026-08-19T13:39:03+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-1fm5-avdx"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-47629", "cvss": {"cvssv31": [{"source": "psirt@nvidia.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-20", "description": "适用于 Linux 的 NVIDIA Triton 推理服务器包含一个漏洞，攻击者可能会导致不正确的输入验证。成功利用可能会导致拒绝服务。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "输入验证不恰当", "kind_en": "输入验证不当", "last_modified_time": "2026-08-19", "level": "High", "mps_id": "MPS-8wjk-3ycl", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-8wjk-3ycl", "name": "https://www.oscs1024.com/hd/MPS-8wjk-3ycl"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-47629", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-47629"}, {"url": "https://github.com/NVIDIA/product-security/tree/main/2026/5865", "name": ""}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-47629", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-47629", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-47629漏洞", "_translated": true, "_saved_at": "2026-08-18T20:16:30+00:00", "_first_saved_at": "2026-08-18T20:16:30+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-8wjk-3ycl"}, {"analysis_status": 3, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "cnvd_id": "", "cve_id": "", "cvss": {"cvssv31": [{"source": "murphysec", "vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "", "cwe": "CWE-416", "description": "Redis 是开源内存数据库，通过 redis-server 对外提供命令接口，广泛用于缓存、消息队列和实时数据处理。\n受影响版本中，多个客户端同时在同一键上等待 BLPOP 等阻塞命令时，服务端会在 handleClientsBlockedOnKey() 中沿等待队列依次唤醒这些连接。唤醒并重新执行其中一个命令时，可能因客户端内存限制把队列里下一个仍在等待的连接连同链表节点一起释放，遍历却继续把这块已释放内存当作有效客户端使用。已认证攻击者可借此接管 redis-server 进程，在主机上执行任意系统命令。该问题独立于 CVE-2026-23479，后者只覆盖“当前正在执行命令的那个客户端”被释放的情况。\n修复版本中通过调整等待队列的遍历方式，每处理完一个等待客户端后重新定位队列头部，不再跨命令缓存下一个节点，避免已驱逐连接被再次访问，从而切断远程代码执行路径。", "effects": [{"comp_name": "redis", "ecosystem": "linux", "versions": [{"affected_version": "[8.4.0,8.4.6)", "min_fixed_version": "8.4.6", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[8.8.0,8.8.2)", "min_fixed_version": "8.8.2", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[7.4.0,7.4.11)", "min_fixed_version": "7.4.11", "repository": "unmanaged", "solutions": [], "upstream": true} \n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "attack_vector_type": "Local", "cnvd_id": "", "cve_id": "CVE-2026-58083", "cvss": {}, "cvss_score": 7.5, "cvss_vector": "", "cwe": "CWE-416", "description": "FreeBSD 是开源操作系统，其内核 kqueue(2) 事件通知机制支持 KQUEUE_CPONFORK 模式，在 fork(2) 时把已注册 knote 复制到子进程。\n受影响版本中，内核在 fork 复制 knote 期间，带定时器过滤器的 knote 可能先触发并进入 kqueue 活动链表。kqueue_fork_copy_knote() 未持有 kqueue 与 knlist 锁即复制 knote 状态，并在 knote 已入队后仍按 KN_QUEUED 再次调用 knote_enqueue()，造成活动链表损坏。本地无特权用户可触发内核释放后使用，并可能导致权限提升。\n修复版本中通过在复制时持有 knlist 与 kqueue 锁、仅继承 KN_ACTIVE 与 KN_DISABLED，并在入队前以 f_event() 判定且拒绝重复 knote_enqueue()，避免活动链表被二次入队损坏，切断释放后使用路径。", "effects": [{"comp_name": "freebsd", "ecosystem": "linux", "versions": [{"affected_version": "[15.1-RELEASE,15.1-RELEASE-p2)", "min_fixed_version": "15.1-RELEASE-p2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "UAF", "kind_en": "免费后使用", "last_modified_time": "2026-08-19", "level": "High", "mps_id": "MPS-mvwo-bqgt", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-mvwo-bqgt", "name": "https://www.oscs1024.com/hd/MPS-mvwo-bqgt"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-58083", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-58083"}, {"url": "https://security.freebsd.org/advisories/FreeBSD-SA-26:50.kqueue.asc", "name": ""}], "scope_influence": "", "tags": ["操作系统"], "title": "FreeBSD kqueue释放后使用", "_translated": true, "_saved_at": "2026-08-19T09:26:48+00:00", "_first_saved_at": "2026-08-19T09:26:48+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-mvwo-bqgt"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-73384", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severit 造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-73385", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:H/A:N", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:H/A:N", "cwe": "CWE-862", "description": "Outranking 插件选项 \u003c= 1.1.3 版本中未经身份验证的损坏访问控制。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-08-19", "level": "High", "mps_id": "MPS-qg9m-sej3", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-qg9m-sej3", "name": "https://www.oscs1024.com/hd/MPS-qg9m-sej3"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73385", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73385"}, {"url": "https://patchstack.com/database/wordpress/plugin/outranking/vulnerability/wordpress-outranking-plugin-options-plugin-1-1-3-broken-access-control-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-73385漏洞", "_translated": true, "_saved_at": "2026-08-19T13:39:30+00:00", "_first_save ps://www.oscs1024.com/hd/MPS-umrd-iwnk"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73938", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73938"}, {"url": "https://www.oracle.com/security-alerts/cspuaug2026.html", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-73938漏洞", "_translated": true, "_saved_at": "2026-08-18T22:16:36+00:00", "_first_saved_at": "2026-08-18T22:16:36+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-umrd-iwnk"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-76240", "cvss": {"cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-89", "description": "stigmem-node 是开源 Python 组件，作为 Stigmem 参考节点提供智能体事实存储、召回与联邦能力，并支持 SQLite、libSQL 与 PostgreSQL 后端。\n受影响版本中，PostgresBackend 在建立连接和执行迁移时，将 schema 标识符直接拼入 search_path 连接选项以及 CREATE SCHEMA 语句，未做标识符引用或合法性校验。当前审查路径中该值来自运维配置 Settings.pg_schema（环境变量 STIGMEM_PG_SCHEMA）；若 schema 名称来自租户、请求或用户输入，攻击者可注入 SQL 并破坏数据库机密性、完整性与可用性。\n修复版本中通过 _validate_schema_name 将 schema 限制为安全标识符，并使用 psycopg2.sql.Identifier 构造 CREATE SCHEMA 与 SET search_path，切断标识符拼接注入路径。", "effects": [{"comp_name": "stigmem-node", "ecosystem": "pip", "versions": [{"affected_version": "[0.9.0a1,0.9.0a2)", "min_fixed_version": "0.9.0a2", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-08-19", "level": "High", "mps_id": "MPS-w2i9-8mnk", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-w2i9-8mnk", "name": "https://www.oscs1024.com/hd/MPS-w2i9-8mnk"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-76240", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-76240"}, {"url": "https://github.com/eidetic-labs/stigmem/security/advisories/GHSA-9pc9-4crj-mhpj", "name": ""}, {"url": "https://www.vulncheck.com/advisories/stigmem-postgres-sql-injection-via-schema-identifier", "name": ""}], "scope_influence": "", "tags": ["AI", "python", "开源"], "title": "stigmem-node SQL注入", "_translated": true, "_saved_at": "2026-08-19T15:24:37+00:00", "_first_saved_at": "2026-08-19T15:24:37+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-w2i9-8mnk"}, {"analysis_status": 0, "articles": [], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-58085", "cvss": {}, "cvss_score": 7.4, "cvss_vector": "", "cwe": "CWE-347", "description": "FreeBSD 是开源类 Unix 操作系统内核与用户态系统，wg(4) 是其内核中实现 WireGuard VPN 协议的驱动，使用 ChaCha20-Poly1305 认证加密保护隧道内流量。\n受影响版本中，sys/dev/wg/wg_crypto.c 中的 chacha20poly1305_decrypt_mbuf 等加解密分发辅助函数在调用 OCF 的 crypto_dispatch 之后没有检查返回的 crp_etype，Poly1305 MAC 校验失败被静默忽略，使携带错误认证标签的密文仍被当作合法明文进入隧道。远程攻击者只需能向 WireGuard 端点发送 UDP 数据报并猜中接收方重放窗口的边界，便可向隧道注入伪造或被篡改的传输数据包；位于转发路径上的攻击者更能直接修改通往 FreeBSD 主机的密文与认证数据而绕过完整性校验。\n修复版本中通过在 chacha20poly1305_encrypt_mbuf 与 chacha20poly1305_decrypt_mbuf 中，当 crypto_dispatch 返回 0 时进一步读取并返回 crp_etype，使 MAC 校验失败能够沿调用链传播；同时在 crypto_init 中显式拒绝非同步 OCF 会话，从源头保证解密路径始终处理同步结果，最终拦截一切 Poly1305 校验未通过的报文。", "effects": [{"comp_name": "freebsd:freebsd", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,14.4-RELEASE-p8)", "min_fixed_version": "14.4-RELEASE-p8", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,15.0-RELEASE-p12)", "min_fixed_version": "15.0-RELEASE-p12", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,15.1-RELEASE-p2)", "min_fixed_version": "15.1-RELEASE-p2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "密码学签名的验证不恰当", "kind_en": "密码签名验证不当", "last_modified_time": "2026-08-19", "level": "High", "mps_id": "MPS-br9w-xt0l", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-br9w-xt0l", "name": "https://www.oscs1024.com/hd/MPS-br9w-xt0l"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-58085", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-58085"}, {"url": "https://security.freebsd.org/advisories/FreeBSD-SA-26:52.if_wg.asc", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "FreeBSD wg(4) WireGuard 驱动 MAC 校验缺失漏洞", "_translated": true, "_saved_at": "2026-08-19T11:19:53+00:00", "_first_saved_at": "2026-08-19T11:19:53+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-br9w-xt0l"}, {"analysis_status": 0, "articles": [], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-75589", "cvss": {}, "cvss_score": 7.4, "cvss_vector": "", "cwe": "CWE-208", "description": "Net::OAuth 是开源 Perl 库，用于构造、签名和校验 OAuth 1.0 协议消息，供 Perl 应用在消费者端或服务端处理 OAuth 请求与响应。\n受影响版本中，对外入口 Net::OAuth::Message::verify 将报文交给 HMAC_SHA1、HMAC_SHA256 或 PLAINTEXT 签名插件，插件使用 Perl 的 eq 运算符比较报文携带的 signature 与本地计算结果，字符串出现差异即返回，拒绝耗时随匹配前缀长度变化。能够提交报文并测量应答时延的客户端可按字节恢复有效签名；PLAINTEXT 模式下比较对象为签名密钥本身，搜索会得到 consumer_secret 与 token_secret。RSA-SHA1 通过 RSA 密钥对象验签，不受影响。\n修复版本中通过新增基类方法 Net::OAuth::SignatureMethod::secure_compare，并将上述三种插件的 verify 改为恒定时间比较，使拒绝时延不再依赖匹配前缀，阻断基于时序的签名或密钥恢复。", "effects": [{"comp_name": "Net::OAuth", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,0.33)", "min_fixed_version": "0.33", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "通过时间差异性导致的信息暴露", "kind_en": "可观察到的时间差异", "last_modified_time": "2026-08-19", "level": "High", "mps_id": "MPS-lsfn-6py0", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-lsfn-6py0", "name": "https://www.oscs1024.com/hd/MPS-lsfn-6py0"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-75589", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-75589"}, {"url": "https://github.com/vurtdev/Net-OAuth/commit/a1a16b58add85668ef4fcda642a486ceed098eba.patch", "name": ""}, {"url": "https://github.com/vurtdev/Net-OAuth/security/advisories/GHSA-g8xr-69p3-gw56", "name": ""}, {"url": "https://metacpan.org/release/RRWO/Net-OAuth-0.33/changes", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Net::OAuth签名时序比较漏洞", "_translated": true, "_saved_at": "2026-08-19T12:33:59+00:00", "_first_saved_at": "2026-08-19T09:26:42+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-lsfn-6py0"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-70666", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:L/I:L/A:L", "severity": "high", "base_score": 7.4}]}, "cvss_score": 7.4, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:L/I:L/A:L", "cwe": "CWE-918", "description": "Lemur 管理 TLS 证书创建。在 1.9.3 之前，权限角色成员可以通过 PUT /api/1/authorities/ 更新 acme_url，无需重新验证，并将 setup_acme_client_no_retry 定向到攻击者控制的 ACME 服务器。 ACME 目录和订单响应包含该服务器选择的 newNonce、newOrder、授权和最终 URL。 Lemur ClientV2 遵循这些 URL，无需其主机与配置的目录主机匹配，从而允许向内部服务或云元数据端点发出 JWS 签名请求。该问题需要 ACME 权限和获得该权限的用户，但不需要全局管理员权限。该修复重新验证更新并引入 _PinnedClientNetwork 来强制执行完整 ACME 流程的单个允许主机。此问题已在 1.9.3 版本中修复。", "effects": [{"comp_name": "lemur", "ecosystem": "pip", "versions": [{"affected_version": "(-∞,1.9.3)", "min_fixed_version": "1.9.3", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SSRF", "kind_en": "服务器端请求伪造 (SSRF)", "last_modified_time": "2026-08-19", "level": "High", "mps_id": "MPS-vgf2-phsw", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-vgf2-phsw", "name": "https://www.oscs1024.com/hd/MPS-vgf2-phsw"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-70666", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-70666"}, {"url": "https://github.com/Netflix/lemur/commit/6dcb19b6d6004e97796d6a0344b130b2ba57f050", "name": ""}, {"url": "https://github.com/Netflix/lemur/releases/tag/v1.9.3", "name": ""}, {"url": "https://github.com/Netflix/lemur/security/advisories/GHSA-xpmj-wjcp-6pww", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-70666漏洞", "_translated": true, "_saved_at": "2026-08-18T21:17:36+00:00", "_first_saved_at": "2026-08-18T21:17:36+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-vgf2-phsw"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-71417", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:C/C:N/I:L/A:H", "severity": "high", "base_score": 7.3}]}, "cvss_score": 7.3, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:C/C:N/I:L/A:H", "cwe": "CWE-639", "description": "Lemur 是 Netflix 开源的 TLS 证书管理服务，基于 Python（Flask）实现，以 pip 包 lemur 形式分发，仓库为 github.com/Netflix/lemur（Apache-2.0 协议），用于在 ACME、DigiCert、Entrust、Google CA、CFSSL 等多个 CA 之上统一签发、跟踪和吊销证书。\n受影响版本中，POST /api/1/certificates/upload 仅以 StrictRolePermission 拦截可读用户，并未对请求体中由调用者指定的 authority 校验 AuthorityPermission；CertificateUploadInputSchema 与 AssociatedAuthoritySchema 直接按 id/名称解析 authority 且不做权限检查；lemur/certificates/models.py 中 Certificate 仅对 name 强制唯一，body、serial、external_id 缺乏唯一约束，因而调用者可针对目标证书的 (authority_id, serial) 与 body 再次插入一条由自己拥有的重复记录。攻击者随后对重复记录调用 PUT /api/1/certificates/\u003cdup_id\u003e/revoke，CertificateRevoke.put 仅在 g.current_user != cert.user 时执行 CertificatePermission 检查（重复记录的 user 即为攻击者，直接绕过），且 cert.endpoints 为空时绕过“已部署端点禁止吊销”防线；最终 service.revoke 调用 issuer 插件按 certificate.body（ACME）或 certificate.external_id（DigiCert/Entrust/Google CA/CFSSL）使用 authority 的存储 CA 凭据在真实 CA 侧吊销目标证书，可在不持有 AuthorityPermission 或 CertificatePermission 的情况下造成集群级 TLS 拒绝服务。\n修复版本中通过在 CertificatesUpload.post 中校验 authority 的 AuthorityPermission，并在 (authority_id, serial) 已存在时返回 409 拒绝重复上传；在 CertificateRevoke.put 中按 (authority_id, serial) 查找全部相关 Certificate 行，对每一行均执行 CertificatePermission 与已部署端点检查，使重复记录或行内授权都不能再绕过吊销授权与端点保护。", "effects": [{"comp_name": "lemur", "ecosystem": "pip", "versions": [{"affected_version": "(-∞,1.9.3)", "min_fixed_version": "1.9.3", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "通过用户控制密钥绕过授权机制", "kind_en": "通过用户控制的密钥绕过授权", "last_modified_time": "2026-08-19", "level": "High", "mps_id": "MPS-0k8u-cthy", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-0k8u-cthy", "name": "https://www.oscs1024.com/hd/MPS-0k8u-cthy"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-71417", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-71417"}, {"url": "https://github.com/Netflix/lemur/commit/851389ae737a6d6bf16c1f9ca64a2ce56c1cc5c6", "name": ""}, {"url": "https://github.com/Netflix/lemur/releases/tag/v1.9.3", "name": ""}, {"url": "https://github.com/Netflix/lemur/security/advisories/GHSA-pxmc-2ffp-8j67", "name": ""}, {"url": "https://github.com/Netflix/lemur/security/advisories/GHSA-pxmc-2ffp-8j67", "name": ""}], "scope_influence": "", "tags": ["python", "开源", "终端软件"], "title": "Lemur 任意证书吊销漏洞", "_translated": true, "_saved_at": "2026-08-18T21:17:34+00:00", "_first_saved_at": "2026-08-18T21:17:34+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-0k8u-cthy"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-76241", "cvss": {"cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:L/AC:L/AT:P/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.3}]}, "cvss_score": 7.3, "cvss_vector": "CVSS:4.0/AV:L/AC:L/AT:P/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-494", "description": "stigmem 是 eidetic-labs 维护、采用 Apache-2.0 协议发布的开源记忆与插件治理框架；其下 stigmem-node（PyPI 包 stigmem-node）是基于 FastAPI 的节点服务，负责已安装插件的发现、签名校验与注册。\n受影响版本中，stigmem-node 仅通过单一环境变量 STIGMEM_PLUGIN_SIGNING_REQUIRED=false 即可关闭插件签名强制校验；节点启动时由 node/src/stigmem_node/main.py 的 lifespan 调用 node/src/stigmem_node/plugins/lifecycle.py 中的 register_discovered_plugins，当签名强制关闭时该函数直接调用 node/src/stigmem_node/plugins/signing.py 的 allow_unsigned_development_override，对未签名插件仅返回 trust_decision='development_unsigned_override' 的元数据，不再做完整性核验或二次确认。若该配置被带入插件目录对低信任用户可写的部署，未签名（可能为恶意）的插件代码会被加载并以节点进程权限执行，造成任意代码执行。\n修复版本中通过在 allow_unsigned_development_override 起始处读取 settings.plugin_unsigned_ack 并要求其等于字面量 'i-understand-plugins-are-unsigned'（node/src/stigmem_node/settings.py 同步新增 plugin_unsigned_ack 字段），STIGMEM_PLUGIN_SIGNING_REQUIRED 与 STIGMEM_PLUGIN_UNSIGNED_ACK 双确认不齐备时抛出 RuntimeError 拒绝启动，从而阻断未签名插件的静默加载。", "effects": [{"comp_name": "stigmem-node", "ecosystem": "pip", "versions": [{"affected_version": "[0.9.0a1,0.9.0a2)", "min_fixed_version": "0.9.0a2", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "下载代码缺少完整性检查", "kind_en": "不进行完整性检查的代码下载", "last_modified_time": "2026-08-19", "level": "High", "mps_id": "MPS-acoz-x0jf", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-acoz-x0jf", "name": "https://www.oscs1024.com/hd/MPS-acoz-x0jf"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-76241", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-76241"}, {"url": "https://github.com/eidetic-labs/stigmem/security/advisories/GHSA-w7pm-9g55-mxfm", "name": ""}, {"url": "https://www.vulncheck.com/advisories/stigmem-plugin-signature-enforcement-bypass-via-configuration", "name": ""}], "scope_influence": "", "tags": ["python", "开源"], "title": "stigmem 插件签名强制绕过", "_translated": true, "_saved_at": "2026-08-19T15:24:39+00:00", "_first_saved_at": "2026-08-19T15:24:39+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-acoz-x0jf"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "cnvd_id": "", "cve_id": "CVE-2026-75857", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:L/AC:H/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:L/AC:H/AT:P/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.3}]}, "cvss_score": 7.3, "cvss_vector": "CVSS:4.0/AV:L/AC:H/AT:P/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-269", "description": "CodeWhale 版本 \u003e= 0.8.41 和 \u003c 0.8.64 包含 exec_shell_interact（别名 exec_interact）工具中的漏洞，该工具的approval_requirement 返回 ApprovalRequirement::Auto。这会覆盖代码执行工具的默认所需批准，因此 LLM 控制的标准输入会写入已批准的长时间运行的交互式 shell（例如 python3 -i REPL、mysql、ssh 或 sudo -i 会话）中，而无需任何批准提示。攻击者可以通过代理摄取的不受信任的内容（获取的页面、MCP 结果或存储库文件）注入指令，从而导致命令在该已批准进程的权限级别运行。已于 0.8.64 中修复。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-08-19", "level": "High", "mps_id": "MPS-bt5w-2yfd", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-bt5w-2yfd", "name": "https://www.oscs1024.com/hd/MPS-bt5w-2yfd"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-75857", "name": "https://nvd.nist.gov/v nslated": true, "_saved_at": "2026-08-18T22:16:47+00:00", "_first_saved_at": "2026-08-18T22:16:47+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-htso-zjnw"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-76238", "cvss": {"cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:L/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:L/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-863", "description": "stigmem 是 eidetic-labs 维护的开源 Python 持久记忆图谱组件，其中 stigmem-node 提供 HTTP API、内置 federation 与可选的多租户扩展 stigmem-plugin-multi-tenant。\n受影响版本中，POST /v1/decay/sweep 路由在处理衰减扫描请求时未把调用者的 tenant_id 透传到 SQL 候选查询与异步任务执行链路，lifecycle.decay 中 _select_ttl_candidates 与 _select_confidence_candidates 的 SELECT 语句均缺少 tenant_id 谓词，导致持有单租户 write 凭据的攻击者提交的 POST 请求会以 ttl_seconds=0 把所有租户的事实记录批量过期（跨租户数据销毁），或通过 dry_run 拿到跨租户的事实计数与存在性信息（跨租户信息泄露 oracle）。\n修复版本中通过在 _select_ttl_candidates、_select_confidence_candidates 与 run_decay_sweep 中新增 AND f.tenant_id = ? 谓词，并把 identity.tenant_id 显式透传到 HTTP 路由 decay_sweep、_decay_job_worker 与 create_job 调用中，使单租户 sweep 不再跨租户生效，dry_run 仅返回调用者自己租户的候选计数。", "effects": [{"comp_name": "stigmem-node", "ecosystem": "pip", "versions": [{"affected_version": "(-∞,0.9.0a12)", "min_fixed_version": "0.9.0a12", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-08-19", "level": "High", "mps_id": "MPS-05r7-hufc", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-05r7-hufc", "name": "https://www.oscs1024.com/hd/MPS-05r7-hufc"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-76238", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-76238"}, {"url": "https://github.com/eidetic-labs/stigmem/security/advisories/GHSA-6gqw-jqv7-v88m", "name": ""}, {"url": "https://www.vulncheck.com/advisories/stigmem-before-0a12-cross-tenant-bola-via-decay-sweep", "name": ""}], "scope_influence": "", "tags": ["python", "开源"], "title": "stigmem跨租户衰减扫描BOLA漏洞", "_translated": true, "_saved_at": "2026-08-19T15:24:40+00:00", "_first_saved_at": "2026-08-19T15:24:40+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-05r7-hufc"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-15780", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "cwe": "CWE-79", "description": "由于输入清理和输出转义不足，WP Statistics – 简单、隐私友好的 WordPress Google Analytics 替代插件很容易通过 'utm_campaign' 参数在 14.16.8 及之前的所有版本中受到存储跨站脚本攻击。这使得未经身份验证的攻击者可以在页面中注入任意 Web 脚本，每当用户访问注入的页面时就会执行这些脚本。可以通过公共 /wp-statistics/v2/hit REST 端点在无需身份验证的情况下植入有效负载，因为所需的签名在公共主页上公开，并且 Base64 编码的 page_uri POST 参数会覆盖之前清理的 REQUEST_URI，从而允许恶意 utm_campaign 值绕过清理并存储在数据库中。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-08-19", "level": "High", "mps_id": "MPS-1bjc-tgfe", "poc": false, "poc_u _modified_time": "2026-08-19", "level": "High", "mps_id": "MPS-4ndg-78uz", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-4ndg-78uz", "name": "https://www.oscs1024.com/hd/MPS-4ndg-78uz"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-17565", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-17565"}, {"url": "https://wpscan.com/vulnerability/e88e0b71-145c-4edd-9b62-783215b64c67/", "name": ""}], "scope_influence": "", "tags": [], "title": "Animation Addons SSRF漏洞", "_translated": true, "_saved_at": "2026-08-19T07:32:47+00:00", "_first_saved_at": "2026-08-19T07:32:47+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-4ndg-78uz"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-75981", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "cwe": "CWE-79", "description": "TranslatePress – 使用适用于 WordPress 的 AI 翻译插件翻译多语言网站在 3.2.5 及以下版本中容易受到未经身份验证的存储跨站点脚本的攻击。特殊的 gettext 标记 '#!trpst#' 和 '#!trpen#​​' 由includes/class-translation-render.php 中的translate_page() 无条件重写为'\u003c' 和'\u003e'（第538-539 行）。由于这些标记是纯文本，没有 HTML 特殊字符，因此未经身份验证的攻击者可以将它们嵌入评论中；这些标记在 wp_kses 中仍然存在，并且当以第二语言查看该帖子时，替换会将攻击者的“#!trpst#img ... #!trpen#​​”变成真正的 \u003cimg\u003e 标记。 remove_tags_from_output() 仅删除 \u003cscript\u003e/\u003cstyle\u003e，因此 \u003cimg onerror=...\u003e 在访问者的浏览器中执行。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-08-19", "level": "High", "mps_id": "MPS-n3cq-4mhw", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-n3cq-4mhw", "name": "https://www.oscs1024.com/hd/MPS-n3cq-4mhw"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-75981", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-75981"}, {"url": "https://plugins.trac.wordpress.org/browser/translatepress-multilingual/tags/3.2.5/includes/class-translation-render.php#L538", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/translatepress-multilingual/tags/3.2.5/includes/class-translation-render.php#L539", "name": ""}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities 改为 max(exp, now_ms + window_ms) 等校验，使联邦对等令牌回到规范要求的 canonical millisecond-based 验证路径并覆盖回归测试。", "effects": [{"comp_name": "stigmem-node", "ecosystem": "pip", "versions": [{"affected_version": "[0.9.0a1,0.9.0a2)", "min_fixed_version": "0.9.0a2", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "对数据真实性的验证不充分", "kind_en": "数据真实性验证不足", "last_modified_time": "2026-08-19", "level": "High", "mps_id": "MPS-t8bg-au52", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-t8bg-au52", "name": "https://www.oscs1024.com/hd/MPS-t8bg-au52"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-76245", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-76245"}, {"url": "https://github.com/eidetic-labs/stigmem/security/advisories/GHSA-xh5j-xjfq-qvvx", "name": ""}, {"url": "https://www.vulncheck.com/advisories/stigmem-federation-peer-token-timestamp-validation-bypass", "name": ""}], "scope_influence": "", "tags": ["python", "开源"], "title": "stigmem-node联邦对等令牌时间戳校验绕过漏洞", "_translated": true, "_saved_at": "2026-08-19T15:24:45+00:00", "_first_saved_at": "2026-08-19T15:24:45+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-t8bg-au52"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-74038", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:N/I:L/A:H", "severity": "high", "base_score": 7.1}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:A/VC:N/VI:L/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7}]}, "cvss_score": 7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:A/VC:N/VI:L/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-22", "description": "Wazuh 是一款开源的主机入侵检测与日志监控平台，wazuh-manager 是其服务端守护进程，提供 Agent 注册、密钥管理与远程通信等能力。\n受影响版本中，wazuh-manager 的 Agent 注册监听端口在收到客户端发来的 OSSEC A:'\u003cname\u003e' 注册请求后，会先调用 src/addagent/validate.c 中的 OS_IsValidName 对 \u003cname\u003e 进行合法性校验。原始实现仅校验长度和字符集，未拒绝以点开头的名字，因此攻击者只需以 .. 等点序列作为 Agent 名称在注册端口发起一次注册请求，即可绕过校验通过。注册成功后，Manager 在执行队列差异清理时通过 delete_diff 等路径拼接把 Agent 名称作为目录名拼接到队列根目录之后；由于 .. 会解析到上级目录，原本应限定在 queue/\u003cagent\u003e/ 下的递归删除跨越到上级 queue 目录，将其下的全部子目录一并删除，导致所有依赖该队列的 Wazuh 服务停止，需要手工恢复。\n修复版本中通过在 src/addagent/validate.c 的 OS_IsValidName 中新增 u_name[0] == '.' 的前缀判断，从源头拒绝以点开头的 Agent 名称，恶意注册请求在第一阶段校验即被拒绝；并新增 src/unit_tests/addagent/test_validate.c 单元测试覆盖 .、..、.hidden 等点序列用例，确保后续不会再回退。", "effects": [{"comp_name": "wazuh-manager", "ecosystem": "linux", "versions": [{"affected_version": "[4.0.0,4.14.6)", "min_fixed_version": "4.14.6", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正   <script>
    const payload = JSON.parse(document.getElementById("payload").textContent);
    const levelLabels = payload.level_labels || {};
    const items = payload.items || [];
    let filtered = items.slice();
    let activeId = null;

    const $ = (id) => document.getElementById(id);
    $("generatedAt").textContent = payload.generated_at || "-";
    $("retention").textContent = payload.retention_days ?? "-";
    $("cutoff").textContent = payload.cutoff_date || "-";
    $("count").textContent = String(payload.count ?? items.length);

    function levelClass(level) {
      const cn = levelLabels[level] || level || "";
      if (level === "Critical" || cn === "严重") return "crit";
      if (level === "High" || cn === "高危") return "high";
      return "other";
    }
    function levelText(level) {
      return levelLabels[level] || level || "-";
    }
    function esc(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }
    function scoreText(v) {
      if (v === null || v === undefined || v === "" || v === -1) return "-";
      return String(v);
    }

    function renderList() {
      const list = $("list");
      $("listCount").textContent = String(filtered.length);
      if (!filtered.length) {
        list.innerHTML = '<div class="empty">没有匹配项</div>';
        return;
      }
      list.innerHTML = filtered.map((it) => {
        const id = it.mps_id || it.cve_id;
        const active = id === activeId ? " active" : "";
        return `
          <button class="item${active}" data-id="${esc(id)}" type="button">
            <div class="item-top">
              <span class="cve">${esc(it.cve_id || it.mps_id || "-")}</span>
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
            </div>
            <div class="title">${esc(it.title || "-")}</div>
            <div class="item-foot">
              <span>CVSS ${esc(scoreText(it.cvss_score))}</span>
              <span>${esc(it.published_time || "-")}</span>
              ${it.poc ? "<span>POC</span>" : ""}
            </div>
          </button>`;
      }).join("");
      list.querySelectorAll(".item").forEach((btn) => {
        btn.addEventListener("click", () => selectById(btn.dataset.id));
      });
    }

    function refsHtml(it) {
      const refs = Array.isArray(it.reference_url_list) ? it.reference_url_list : [];
      const links = [];
      if (it._source_page) links.push({ url: it._source_page, name: "OSCS 详情" });
      if (it.cve_id) links.push({ url: `https://nvd.nist.gov/vuln/detail/${it.cve_id}`, name: "NVD" });
      refs.forEach((r) => {
        if (r && r.url) links.push({ url: r.url, name: r.name || r.url });
      });
      const seen = new Set();
      const uniq = [];
      for (const l of links) {
        if (seen.has(l.url)) continue;
        seen.add(l.url);
        uniq.push(l);
      }
      if (!uniq.length) return '<div class="box">无参考链接</div>';
      return `<div class="refs">${uniq.map((l) =>
        `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name || l.url)}</a>`
      ).join("")}</div>`;
    }

    function articlesHtml(it) {
      const arts = Array.isArray(it.articles) ? it.articles : [];
      if (!arts.length) return "";
      return `<div class="section"><h3>相关说明</h3>${arts.map((a) => `
        <div class="article">
          <h4>${esc(a.title || "说明")}</h4>
          <p>${esc(a.content || "")}</p>
        </div>`).join("")}</div>`;
    }

    function renderDetail(it) {
      const detail = $("detail");
      if (!it) {
        detail.innerHTML = '<div class="empty">暂无数据</div>';
        return;
      }
      const pocUrls = Array.isArray(it.poc_url) ? it.poc_url : [];
      detail.innerHTML = `
        <div class="d-head">
          <div>
            <h1 class="d-title">${esc(it.title || "-")}</h1>
            <div class="ids">
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
              <span class="chip">${esc(it.cve_id || "无 CVE")}</span>
              <span class="chip">${esc(it.mps_id || "-")}</span>
              ${it.poc ? '<span class="chip">有 POC</span>' : ""}
              ${it.exp ? '<span class="chip">有 EXP</span>' : ""}
            </div>
          </div>
          <div class="actions">
            ${it._source_page ? `<a class="btn" href="${esc(it._source_page)}" target="_blank" rel="noopener">OSCS</a>` : ""}
            ${it.cve_id ? `<a class="btn" href="https://nvd.nist.gov/vuln/detail/${esc(it.cve_id)}" target="_blank" rel="noopener">NVD</a>` : ""}
          </div>
        </div>
        <div class="grid">
          <div class="stat"><div class="k">CVSS</div><div class="v">${esc(scoreText(it.cvss_score))}</div></div>
          <div class="stat"><div class="k">向量</div><div class="v">${esc(it.cvss_vector || "-")}</div></div>
          <div class="stat"><div class="k">CWE</div><div class="v">${esc(it.cwe || "-")}</div></div>
          <div class="stat"><div class="k">类型</div><div class="v">${esc(it.kind || it.kind_en || "-")}</div></div>
          <div class="stat"><div class="k">公开</div><div class="v">${esc(it.published_time || "-")}</div></div>
          <div class="stat"><div class="k">利用成本</div><div class="v">${esc(it.exploit_requirement_cost || "-")}</div></div>
          <div class="stat"><div class="k">可利用性</div><div class="v">${esc(it.exploitability || "-")}</div></div>
          <div class="stat"><div class="k">修复建议</div><div class="v">${esc(it.fix_suggestion || "-")}</div></div>
        </div>
        <div class="section"><h3>描述</h3><div class="box">${esc(it.description || "无描述")}</div></div>
        ${it.scope_influence ? `<div class="section"><h3>影响范围</h3><div class="box">${esc(it.scope_influence)}</div></div>` : ""}
        ${pocUrls.length ? `<div class="section"><h3>POC 链接</h3><div class="refs">${pocUrls.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join("")}</div></div>` : ""}
        <div class="section"><h3>参考链接</h3>${refsHtml(it)}</div>
        ${articlesHtml(it)}
      `;
    }

    function selectById(id) {
      const it = filtered.find((x) => (x.mps_id || x.cve_id) === id) ||
                 items.find((x) => (x.mps_id || x.cve_id) === id);
      if (!it) return;
      activeId = it.mps_id || it.cve_id;
      renderList();
      renderDetail(it);
      const btn = document.querySelector(`.item[data-id="${CSS.escape(activeId)}"]`);
      if (btn) btn.scrollIntoView({ block: "nearest" });
      history.replaceState(null, "", "#" + encodeURIComponent(activeId));
    }

    function applyFilter(q) {
      const query = (q || "").trim().toLowerCase();
      filtered = !query ? items.slice() : items.filter((it) => {
        const blob = [
          it.cve_id, it.mps_id, it.title, it.kind, it.kind_en, it.cwe, it.description, it.level
        ].map((x) => String(x || "").toLowerCase()).join(" ");
        return blob.includes(query);
      });
      renderList();
      if (filtered.length) {
        const still = filtered.some((x) => (x.mps_id || x.cve_id) === activeId);
        selectById(still ? activeId : (filtered[0].mps_id || filtered[0].cve_id));
      } else {
        activeId = null;
        renderDetail(null);
      }
    }

    $("search").addEventListener("input", (e) => applyFilter(e.target.value));

    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement !== $("search")) {
        e.preventDefault();
        $("search").focus();
        return;
      }
      if (!filtered.length) return;
      const idx = filtered.findIndex((x) => (x.mps_id || x.cve_id) === activeId);
      if (e.key === "ArrowDown") {
        e.preventDefault();
        const next = filtered[Math.min(filtered.length - 1, Math.max(0, idx) + 1)];
        selectById(next.mps_id || next.cve_id);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        const prev = filtered[Math.max(0, idx - 1)];
        selectById(prev.mps_id || prev.cve_id);
      }
    });

    const hashId = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    if (hashId && items.some((x) => (x.mps_id || x.cve_id) === hashId)) {
      activeId = hashId;
      renderList();
      selectById(hashId);
    } else if (items.length) {
      selectById(items[0].mps_id || items[0].cve_id);
    } else {
      renderList();
      renderDetail(null);
    }
  </script>
</body>
</html>
