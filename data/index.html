  <style>
    :root {
      --bg0: #071015;
      --bg1: #0d1a20;
      --bg2: #12242c;

      --line: rgba(140, 190, 170, 0.16);
      --text: #e7f2ec;
      --muted: #8aa39a;
      --accent: #2fd3a2;
      --accent-dim: rgba(47, 211, 162, 0.14);
      --crit: #ff5a4e;
      --crit-bg: rgba(255, 90, 78, 0.14);
      --high: #ff9a3c;
      --high-bg: rgba(255, 154, 60, 0.14);
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    html, body {

      color: var(--text);
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      background:

        linear-gradient(160deg, var(--bg0), var(--bg1) 45%, #0a151b);
    }
    body::before {
      content: "";
      position: fixed; inset: 0; pointer-events: none; opacity: 0.35;
      background-image:
        linear-gradient(rgba(140, 190, 170, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(140, 190, 170, 0.05) 1px, transparent 1px);
      background-size: 28px 28px;
      mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
    }
    .shell {
      position: relative;
      max-width: 1280px;
      margin: 0 auto;
      padding: 28px 20px 40px;
      display: grid;
      gap: 18px;
      min-height: 100vh;
    }
    header.hero {
      display: grid;
      gap: 10px;
      padding: 22px 24px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(135deg, rgba(18, 36, 44, 0.95), rgba(10, 22, 28, 0.9));
      box-shadow: var(--shadow);
    }
    .brand {
      font-family: Syne, sans-serif;
      font-weight: 800;
      font-size: clamp(1.6rem, 3vw, 2.2rem);
      letter-spacing: -0.03em;
      line-height: 1.1;
    }
    .brand span { color: var(--accent); }
    .sub {
      color: var(--muted);
      font-size: 0.95rem;
      max-width: 62ch;
    }
    .meta {
      display: flex; flex-wrap: wrap; gap: 8px 14px;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.78rem;
      color: var(--muted);
    }
    .meta b { color: var(--text); font-weight: 500; }
    .layout {
      display: grid;
      grid-template-columns: minmax(280px, 360px) 1fr;
      gap: 16px;
      min-height: 70vh;
    }
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
    }
    .panel {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 520px;
    }
    .panel-hd {

      margin: 0; font-size: 0.92rem; font-weight: 600; letter-spacing: 0.02em;
    }
    .search {

      padding: 10px 12px;
      border-radius: 10px;

      background: rgba(0,0,0,0.25);
      color: var(--text);
      font: inherit;
      outline: none;

      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .item {
      text-align: left;
      width: 100%;
      border: 1px solid transparent;
      border-radius: 12px;
      padding: 12px;
      background: transparent;
      color: inherit;
      cursor: pointer;
      transition: background .15s, border-color .15s, transform .15s;

      font-family: "JetBrains Mono", monospace;
      font-size: 0.82rem;
      font-weight: 600;

      border-radius: 999px;

      font-weight: 600;

      padding: 18px 20px 28px;

    }

      display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .d-title {
      font-family: Syne, sans-serif;
      font-size: clamp(1.25rem, 2.2vw, 1.7rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0 0 8px;
      line-height: 1.2;
    }
    .ids {
      display: flex; flex-wrap: wrap; gap: 8px;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.82rem;
    }
    .chip {
      padding: 4px 10px;
      border-radius: 8px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--line);
      color: #cfe4da;
    }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.03);
      color: var(--text);
      text-decoration: none;

      transition: border-color .15s, background .15s;

      border: 1px solid var(--line);

      font-family: "JetBrains Mono", monospace;
      font-size: 0.95rem;

      word-break: break-all;

      border: 1px solid var(--line);
      background: rgba(0,0,0,0.2);
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.92rem;
      color: #d7e8e0;

      color: var(--accent);
      text-decoration: none;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.8rem;
      word-break: break-all;
    }

    .article {
      margin-top: 10px;
      padding: 12px 14px;
      border-left: 3px solid rgba(47,211,162,.45);
      background: rgba(47,211,162,.05);
      border-radius: 0 10px 10px 0;

      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(255,255,255,0.06);
      color: var(--muted);

id": "CVE-2026-94052", "cvss": {}, "cvss_score": 9.1, "cvss_vector": "", "cwe": "CWE-287", "description": "Apache MINA SSHD 是开源 Java 库，用于实现 SSH 客户端与服务端。可选模块 sshd-ldap（Maven 坐标 org.apache.sshd:sshd-ldap）为服务端提供基于 LDAP 的口令与公钥认证。\n受影响版本中，LdapPasswordAuthenticator.authenticate 在调用 resolveAttributes 完成 LDAP 查询后，把结果交给同名受保护方法，该方法不判断属性映射是否为空并直接返回 true。查询未抛出异常时，任意用户名与口令都会被接受，从而绕过口令认证。此缺陷仅在服务端启用 sshd-ldap 并将 LdapPasswordAuthenticator 配置为口令认证器时生效，sshd-core 内置口令认证不受影响。\n修复版本中通过要求 LDAP 查询返回的属性映射非空才判定认证成功，未命中目录条目的请求不再通过，并在拼接 LDAP 过滤器与专有名称时分别按 RFC 4515 与 RFC 4514 编码用户名和口令。", "effects": [{"comp_name": "org.apache.sshd:sshd-ldap", "ecosystem": "maven", "versions": [{"affected_version": "[1.2.0,2.20.0)", "min_fixed_version": "2.20.0", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[3.0.0-M1,3.0.0-M6)", "min_fixed_version": "3.0.0-M6", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "身份验证不当", "kind_en": "认证不当", "last_modified_time": "2026-09-30", "level": "Critical", "mps_id": "MPS-00d0-a229", "poc": false, "poc_url": [], "published_time": "2026-09-30", "reference_url_list": [{"url": "https://www.openwall.com/lists/oss-security/2026/09/29/38", "name": ""}, {"url": "https://mina.apache.org/", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-94052", "name": ""}, {"url": "https://github.com/apache/mina-sshd/commit/acc0f1ed436529c24f6677da83e7ec4e3537c4c9", "name": ""}, {"url": "https://github.com/apache/mina-sshd/releases/tag/sshd-2.20.0", "name": ""}, {"url": "https://github.com/apache/mina-sshd/releases/tag/sshd-3.0.0-M6", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "MINA SSHD口令认证绕过", "_translated": true, "_saved_at": "2026-09-29T19:44:05+00:00", "_first_saved_at": "2026-09-29T19:44:05+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-00d0-a229"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-94053", "cvss": {}, "cvss_score": 9.1, "cvss_vector": "", "cwe": "CWE-90", "description": "Apache MINA SSHD 是开源 Java 库，用于实现 SSH 客户端与服务端；可选组件 sshd-ldap 用于把服务端密码认证和公钥认证对接 LDAP 目录。\n受影响版本中，LdapNetworkConnector 的 resolveSearchFilter 方法把 SSH 用户名和密码直接填入 LDAP 搜索过滤器，未按 RFC 4515 转义过滤器元字符。默认密码认证过滤器为 (\u0026(uid={0})(userPassword={1}))，攻击者使用用户名 * 与密码 * 即可把查询改写成通配匹配；LdapPasswordAuthenticator 在 LDAP 查询成功后默认直接判定认证通过，造成认证绕过。\n修复版本中通过在 resolveSearchFilter 中按 RFC 4515 编码过滤器参数、在绑定 DN 中按 RFC 4514 编码，并将密码认证改为要求 LDAP 返回非空属性，阻止通配符注入再导致认证绕过。", "effects": [{"comp_name": "org.apache.sshd:sshd-ldap", "ecosystem": "maven", "versions": [{"affected_version": "[1.2.0,2.20.0)", "min_fixed_version": "2.20.0", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[3.0.0-M1,3.0.0-M6)", "min_fixed_version": "3.0.0-M6", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "LDAP注入", "kind_en": "LDAP 查询中使用的特殊元素的不正确中和（“LDAP 注入”）", "last_modified_time": "2026-09-30", "level": "Critical", "mps_id": "MPS-2912-2916", "poc": false, "poc_url": [], "published_time": "2026-09-30", "reference_url_list": [{"url": "https://www.openwall.com/lists/oss-security/2026/09/29/39", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-94053", "name": ""}, {"url": "https://mina.apache.org/", "name": ""}, {"url": "https://github.com/apache/mina-sshd/commit/acc0f1ed436529c24f6677da83e7ec4e3537c4c9", "name": ""}, {"url": "https://github.com/apache/mina-sshd/releases/tag/sshd-2.20.0", "name": ""}, {"url": "https://github.com/apache/mina-sshd/releases/tag/sshd-3.0.0-M6", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "MINA SSHD LDAP 注入", "_translated": true, "_saved_at": "2026-09-29T19:44:11+00:00", "_first_saved_at": "2026-09-29T19:44:11+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-2912-2916"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2026-77185", "cvss": {}, "cvss_score": 9.1, "cvss_vector": "", "cwe": "CWE-287", "description": "Apache MINA SSHD（Maven 坐标 org.apache.sshd:sshd-core）是 Apache 基金会维护的开源 Java 库，用于实现 SSH 客户端与服务端。\n受影响版本中，服务端 asynchronous authentication 由认证器抛出 AsyncAuthException 触发。ServerUserAuthService 在 process 与 handleUserAuthRequestMessage 中直接登记完成回调，回调进入 asyncAuth 后在结果为真时调用 handleAuthenticationSuccess，且不核对结果是否仍属于当前认证方法。UserAuthPublicKey.doAuth 与 UserAuthHostBased.doAuth 均先调用认证器再校验签名；认证器抛出 AsyncAuthException 时签名校验尚未执行，过期成功结果可按已被替换的 currentAuth 与 authMethod 完成公钥或 hostbased 登录，过期失败结果也会作用到后续请求。该机制需应用显式编写代码启用，默认认证器不会抛出 AsyncAuthException。\n修复版本中通过在 process 收到新的认证消息时清空 pendingAuth，并仅当回调仍是当前 pendingAuth、currentAuth 未切换、会话未关闭且尚未认证时才调用 asyncAuth，切断过期异步结果被当成当前认证成功的路径；公钥与 hostbased 若再抛出 AsyncAuthException，则抛出 IllegalStateException，厂商说明此时会话会被关闭并记录仅允许 password 或 keyboard-interactive 使用异步认证。", "effects": [{"comp_name": "org.apache.sshd:sshd-core", "ecosystem": "maven", "versions": [{"affected_version": "[3.0.0-M1,3.0.0-M6)", "min_fixed_version": "3.0.0-M6", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[2.0.0,2.20.0)", "min_fixed_version": "2.20.0", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "身份验证不当", "kind_en": "认证不当", "last_modified_time": "2026-09-30", "level": "Critical", "mps_id": "MPS-bf09-144d", "poc": false, "poc_url": [], "published_time": "2026-09-30", "reference_url_list": [{"url": "https://www.openwall.com/lists/oss-security/2026/09/29/32", "name": ""}, {"url": "https://mina.apache.org/", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-77185", "name": ""}, {"url": "https://github.com/apache/mina-sshd", "name": ""}, {"url": "https://github.com/apache/mina-sshd/releases/tag/sshd-2.20.0", "name": ""}, {"url": "https://github.com/apache/mina-sshd/releases/tag/sshd-3.0.0-M6", "name": ""}, {"url": "https://github.com/apache/mina-sshd/commit/4136358deceb7e830791e0329d0999703734147b", "name": ""}, {"url": "https://github.com/apache/mina-sshd/commit/758b100d74e7f6ee5055edc3058bbf9edba1de24", "name": ""}, {"url": "https://github.com/apache/mina-sshd/commit/602896f3e418ed1ec025feabadb1eecb2cb5f397", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "MINA SSHD认证绕过", "_translated": true, "_saved_at": "2026-09-29T19:44:06+00:00", "_first_saved_at": "2026-09-29T19:44:06+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-bf09-144d"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-103547", "cvss": {"cvssv4": [{"source": "cve@mitre.org", "vector": "CVSS:4.0/AV:N/AC:H/AT:P/PR:N/UI:N/VC:H/VI:H/VA:L/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.2}]}, "cvss_score": 9.2, "cvss_vector": "CVSS:4.0/AV:N/AC:H/AT:P/PR:N/UI:N/VC:H/VI:H/VA:L/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-863", "description": "在勘误表 057 之前的 OpenBSD 7.8 和勘误表 021 之前的 7.9 中的 ldapd 中，委派的 BSD 身份验证结果仅通过 LDAP 子进程客户端文件描述符和 LDAP 消息 ID 进行关联。连接关闭后，重用相同文件描述符和消息 ID 的后续连接可以接收较早的身份验证结果。能够访问 ldapd 的远程攻击者可以以另一个身份完成绑定。丢失连接也可能导致 NULL 指针取消引用。 （默认情况下不启用 ldapd。）", "effects": [{"comp_name": "openbsd", "ecosystem": "linux", "versions": [{"affected_version": "[7.8,+∞)", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[7.9,+∞)", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-10-01", "level": "Critical", "mps_id": "MPS-5nkq-ct7l", "poc": false, "poc_url": [], "published_time": "2026-10-01", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-5nkq-ct7l", "name": "https://www.oscs1024.com/hd/MPS-5nkq-ct7l"}, {"url": /tag/v6.0.0-rc.5", "name": "https://github.com/piscinajs/piscina/releases/tag/v6.0.0-rc.5"}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-102992漏洞", "_translated": true, "_saved_at": "2026-09-30T21:09:53+00:00", "_first_saved_at": "2026-09-30T21:09:53+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-y0pz-i8v1"}, {"analysis_status": 0, "articles": [{"content": "应用程序在处理用户输入时的不完善或缺乏验证机制，所以攻击者能够通过向应用程序发送恶意输入，利用应用程序对输入数据的错误处理方式来注入自己的恶意代码。这些恶意代码会被应用程序误认为是合法的指令或数据，并在执行过程中被执行。", "title": "什么是代码注入"}, {"content": "应用程序使用可执行动态代码的函数来执行用户可控的参数，当应用程序对于用户输入过滤不完全时，攻击者可以注入恶意代码并控制代码执行流程。", "title": "代码注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对所有用户输入进行验证和过滤，确保只接受预期的有效输入。这包括对输入数据进行输入长度验证、类型检查和格式验证等。\r\n- 使用参数化查询或预编译语句：对于数据库查询操作，应该使用参数化查询或预编译语句，确保输入数据不会被误认为是执行代码。\r\n- 最小特权原则：应用程序在执行操作系统命令或动态代码时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。\r\n- 安全编码实践：开发人员应该采用安全编码实践，包括避免使用eval函数、避免拼接用户输入的字符串作为代码执行等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止代码注入攻击。", "title": "如何预防代码注入"}], "cnvd_id": "", "cve_id": "CVE-2026-92966", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N", "severity": "critical", "base_score": 9.1}]}, "cvss_score": 9.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N", "cwe": "CWE-94", "description": "LatePoint（Appointment Booking Plugin – LatePoint | Calendar \u0026 Scheduling for WordPress）是一款在 WordPress.org 官方目录发布、遵循 GPLv3 授权的开源预约排期插件，面向服务型企业提供在线预约、日历排期、客户自助中心与在线支付能力，官方数据显示安装量超过 10 万个站点。\n受影响版本中，未授权访客可通过插件的 latepoint_route_call 路由进入预约流程，提交的 customer[first_name]、customer[last_name] 仅经 sanitize_text_field() 清洗后写入客户记录，该函数不移除方括号，短代码载荷得以存入数据库；当站点页面渲染 Customer Cabinet 区块时，OsBlockHelper::render_customer_dashboard() 调用 do_shortcode() 执行 [latepoint_customer_dashboard]，看板视图以 esc_html($customer-\u003efull_name) 输出客户姓名，esc_html 不会编码方括号，WordPress 核心 the_content 过滤器在优先级 11 上再次运行 do_shortcode，把姓名中的方括号语法重新解析为短代码并执行，未授权攻击者可借此执行站点内任意已注册短代码。\n修复版本中通过在 OsShortcodesHelper::shortcode_latepoint_customer_dashboard() 返回看板输出前调用新增的 encode_shortcode_delimiters()，将输出中的 [、] 统一编码为 \u0026#091;、\u0026#093; 实体，优先级 11 的 do_shortcode 扫描无法再匹配到短代码语法，存储在客户姓名中的载荷不再被执行。", "effects": [{"comp_name": "latepoint", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,5.7.1)", "min_fixed_version": "5.7.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "代码注入", "kind_en": "代码生成控制不当（“代码注入”）", "last_modified_time": "2026-10-01", "level": "Critical", "mps_id": "MPS-kbto-m2z7", "poc": false, "poc_url": [], "published_time": "2026-10-01", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-kbto-m2z7", "name": "https://www.oscs1024.com/hd/MPS-kbto-m2z7"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-92966", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-92966"}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/c9a030c0-6129-40b0-81da-4c420929d198?source=cve", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/latepoint/tags/5.7.0/lib/helpers/blocks_helper.php#L234", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/latepoint/tags/5.7.0/lib/views/customer_cabinet/dashboard.php#L19", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/latepoint/tags/5.7.0/lib/models/customer_model.php#L386", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/latepoint/tags/5.7.1/lib/helpers/blocks_helper.php", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "LatePoint 任意短代码执行漏洞", "_translated": true, "_saved_at": "2026-10-01T08:09:08+00:00", "_first_saved_at": "2026-10-01T08:09:08+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-kbto-m2z7"}, {"analysis_status": 0, "articles": [{"content": "跨站点请求伪造 (CSRF)通过利用网站对用户请求的信任进行攻击。当用户在网站A登录并在同一浏览器会话中访问网站B时，攻击者可以构造特制的请求并诱使用户执行，以使网站B误以为这些请求是用户合法发起的。\n攻击者通常通过欺骗用户点击恶意链接、在受信任的网站中植入恶意代码或通过钓鱼等手段来实施CSRF攻击，一旦用户执行了恶意请求，攻击者可以以用户的身份执行任意操作，包括更改用户密码、发起资金转账或删除重要数据等。", "title": "什么是CSRF"}, {"content": "- 链接欺骗：攻击者通过向用户发送包含恶意链接的电子邮件或社交媒体消息，诱使用户点击并执行恶意请求。\n- 图片引用攻击：攻击者通过在恶意网站上包含指向目标网站的图片引用，以触发用户浏览器自动发送目标网站的请求。\n- XSS利用：如果目标网站存在XSS漏洞，攻击者可以注入恶意脚本，以使用户在浏览器中执行恶意请求。", "title": "CSRF常见的攻击方式"}, {"content": "- 随机令牌：网站可以在每个请求中包含一个随机生成的令牌（CSRF Token），并验证该令牌的有效性，以确认请求的来源是合法的。\n- SameSite Cookie：使用SameSite属性来限制跨站点请求，将Cookie的发送限制在同一站点上，减少了跨站请求伪造的风险。\n- 双重验证：对于敏感操作，网站可以要求用户进行额外的验证，例如输入验证码、提供第二个因素的身份验证等。\n- 强化浏览器策略：网站可以设置Content-Security-Policy（CSP）头，限制浏览器执行恶意脚本的能力，减少CSRF攻击的风险。\n- 限制用户操作：网站可以要求用户在执行敏感操作之前进行明确的确认或授权，防止恶意请求被误触发。\n- 安全编码实践：开发人员应遵循安全编码实践，对用户输入进行适当的验证和过滤，防止恶意请求的注入。", "title": "如何预防CSRF"}], "cnvd_id": "", "cve_id": "CVE-2026-56662", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.6}]}, "cvss_score": 9.6, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:H/I:H/A:H", "cwe": "CWE-352", "description": "GetSimple CMS 是一个基于 PHP 的开源内容管理系统，GetSimple CMS CE 为其社区版；UpdateCE 是系统后台自带的更新插件，用于检查新版本并从官方源下载部署升级包。\n受影响版本中，该插件的更新表单未包含防 CSRF 令牌，后台插件页处理 POST 请求时也未校验请求来源；跨站页面可在已登录管理员访问时自动向 admin/load.php?id=UpdateCE 提交伪造 POST，请求携带攻击者指定的 url 参数，服务器在其会话内完成远程 ZIP 下载、解压与文件部署，叠加升级包解压缺陷（CVE-2026-56660）形成远程代码执行；表单还会将 url 字段未转义写回页面，恶意 upgrade.json 可经此注入 HTML。\n修复版本中通过引入基于会话的 HMAC 令牌修复：表单写入 updatece_nonce，下载处理入口先以 hash_equals 常量时间比较校验令牌，校验失败直接终止请求，切断跨站伪造链，同时 url 字段改为经 htmlspecialchars 转义输出，消除 HTML 注入点。", "effects": [{"comp_name": "UpdateCE", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.5)", "min_fixed_version": "1.5", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "CSRF", "kind_en": "跨站请求伪造 (CSRF)", "last_modified_time": "2026-10-02", "level": "Critical", "mps_id": "MPS-inbf-9zu0", "poc": false, "poc_url": [], "published_time": "2026-10-02", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-inbf-9zu0", "name": "https://www.oscs1024.com/hd/MPS-inbf-9zu0"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-56662", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-56662"}, {"url": "https://github.com/GetSimpleCMS-CE/GetSimpleCMS-CE/security/advisories/GHSA-2rxv-4g4m-573w", "name": "https://github.com/GetSimpleCMS-CE/GetSimpleCMS-CE/security/advisories/GHSA-2rxv-4g4m-573w"}], "scope_influence": "", "tags": ["应用软件"], "title": "GetSimple CMS CE UpdateCE插件CSRF漏洞", "_translated": true, "_saved_at": "2026-10-01T20:44:03+00:00", "_first_saved_at": "2026-10-01T20:44:03+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-inbf-9zu0"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-56660", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.1}]}, "cvss_score": 9.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:C/C:H/I:H/A:H", "cwe": "CWE-918", "description": "GetSimple CMS CE 是开源 PHP 内容管理系统 GetSimple CMS 的社区版本，内置的 UpdateCE 插件用于在线检查并安装官方升级包。\n受影响版本中，plugins/UpdateCE.php 的 update_ce() 在收到 $_POST['download'] 提交后，仅以 FILTER_VALIDATE_URL 校验 $_POST['url']，将下载内容直接保存为 Tmpfile.zip 并用 ZipArchive::extractTo 解压到 install_TMP/，再把顶层子目录中的全部文件复制到 Web 根目录；过程未校验 ZIP 魔数、条目名称与文件扩展名，攻击者构造的 payload/shell.php 被原样写入可公开访问的 Web 根目录，条目名称中的 ../ 路径还可写出解压目录之外，最终以 Web 服务进程身份实现任意文件写入与远程代码执行。\n修复版本中通过在解压前校验 PK\\x03\\x04 ZIP 魔数、逐条目执行 realpath 前缀检查拒绝穿越路径，并在复制阶段引入扩展名白名单、将目标父目录限定在 Web 根目录之内，同时把下载来源限定为 github.com/GetSimpleCMS-CE/ 路径，阻断恶意压缩包写入 PHP 文件的利用链路。", "effects": [{"comp_name": "UpdateCE", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.5)", "min_fixed_version": "1.5", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "getsimple_cms_ce", "ecosystem": "linux", "versions": [{"affected_version": "[3.3.20,3.3.22]", "m 表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "cnvd_id": "", "cve_id": "CVE-2026-74222", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:L/A:H", "severity": "high", "base_score": 8.2}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:L/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:L/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-416", "description": "U-Boot 是开源引导加载程序，用于嵌入式设备启动、网络引导和固件加载，其 lwIP wget 实现可通过 HTTP/HTTPS 将远程文件下载到指定内存地址。\n受影响版本中，lwIP wget 接收回调 httpc_recv_cb() 在 store_block() 写入 HTTP 数据失败时调用 altcp_abort() 释放连接 PCB，但返回 ERR_BUF 而非 ERR_ABRT，TCP 输入路径随后访问已释放内存并使引导加载程序崩溃。\n修复版本中通过将存储失败路径的返回值改为 ERR_ABRT，使 TCP 输入路径在连接中止后不再继续使用已释放的 PCB，消除该释放后使用崩溃。", "effects": [{"comp_name": "u-boot", "ecosystem": "linux", "versions": [{"affected_version": "[2025.07,2026.10-rc5)", "min_fixed_version": "2026.10-rc5", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "UAF", "kind_en": "免费后使用", "last_modified_time": "2026-09-30", "level": "High", "mps_id": "MPS-0br9-kc27", "poc": false, "poc_url": [], "published_time" 对路径分支中 pathlen 与 rlen 相加同样无法拦住负值，从而向 nfs_path_buff 越界拷贝并破坏相邻内存，导致引导程序崩溃。恶意 NFS 服务器可先对 READ 返回 ISDIR 将客户端切入 READLINK 状态，再下发负长度或超出报文范围的符号链接应答。\n修复版本中通过把 rlen 改为无符号 u32，从符号链接数据起点计算 data_offset 并拒绝超出已接收报文的长度，同时用无符号减法检查 nfs_path_buff 剩余空间，阻止负长度与超长长度进入 memcpy()，消除该缓冲溢出。", "effects": [{"comp_name": "u-boot", "ecosystem": "linux", "versions": [{"affected_version": "[0,2026.10-rc5)", "min_fixed_version": "2026.10-rc5", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "有符号至无符号转换错误", "kind_en": "有符号到无符号转换错误", "last_modified_time": "2026-09-30", "level": "High", "mps_id": "MPS-8hfn-pam9", "poc": false, "poc_url": [], "published_time": "2026-09-30", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-8hfn-pam9", "name": "https://www.oscs1024.com/hd/MPS-8hfn-pam9"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-74221", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-74221"}, {"url": "https://github.com/u-boot/u-boot/commit/1c0aff3a5fbfeee7a8948f624e0b8554e6e0d8fd", "name": ""}, {"url": "https://github.com/u-boot/u-boot/blob/v2026.07/net/nfs-common.c#L643", "name": ""}, {"url": "https://github.com/u-boot/u-boot", "name": ""}, {"url": "https://www.vulncheck.com/advisories/u-boot-before-2026.10-rc5-buffer-overflow-via-nfs-readlink", "name": "VulnCheck Advisory: U-Boot before 2026.10-rc5 Buffer Overflow via NFS READLINK"}], "scope_influence": "", "tags": ["应用软件"], "title": "U-Boot NFS缓冲溢出", "_translated": true, "_saved_at": "2026-09-29T23:21:24+00:00", "_first_saved_at": "2026-09-29T23:21:24+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-8hfn-pam9"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-74220", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:L/A:H", "severity": "high", "base_score": 8.2}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:L/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:L/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-195", "description": "U-Boot 是开源引导加载程序，广泛用于嵌入式设备启动，并支持通过 NFS 从网络加载内核或镜像。\n受影响版本中，nfs_read_reply() 把 NFS READ 应答里的数据长度读入有符号整数 rlen，再用应答头相对 rpc_pkt 的指针差加上 rlen 与报文长度比较。在 LP64 目标上指针减法得到 64 位 ptrdiff_t，长度最高位置位会使 rlen 为负并让校验通过；随后 store_block() 将该值按无符号整数交给 memcpy，可从约 1152 字节的 rpc_pkt 栈缓冲向 image_load_addr 复制约 2GB 数据，造成引导程序崩溃或内存损坏。\n修复版本中通过将 rlen 改为无符号 u32、拒绝超过 NFS_READ_SIZE 的长度，并从数据起始位置相对已收报文做边界检查，切断恶意长度进入 memcpy 的路径。", "effects": [{"comp_name": "u-boot", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2026.10-rc5)", "min_fixed_version": "2026.10-rc5", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "有符号至无符号转换错误", "kind_en": "有符号到无符号转换错误", "last_modified_time": "2026-09-30", "level": "High", "mps_id": "MPS-gdqm-zxe0", "poc": false, "poc_url": [], "published_time": "2026-09-30", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-gdqm-zxe0", "name": "https://www.oscs1024.com/hd/MPS-gdqm-zxe0"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-74220", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-74220"}, {"url": "https://github.com/u-boot/u-boot/commit/0bbf09859658b8cc9ac13be41af23b516b8ef69a", "name": ""}, {"url": "https://github.com/u-boot/u-boot/blob/v2026.07/net/nfs-common.c#L695", "name": ""}, {"url": "https://github.com/u-boot/u-boot", "name": ""}, {"url": "https://www.vulncheck.com/advisories/u-boot-before-2026.10-rc5-buffer-overflow-via-nfs-read-reply", "name": "VulnCheck Advisory: U-Boot before 2026.10-rc5 Buffer Overflow via NFS READ Reply"}], "scope_influence": "", "tags": ["应用软件"], "title": "U-Boot NFS缓冲溢出", "_translated": true, "_saved_at": "2026-09-29T23:21:23+00:00", "_first_saved_at": "2026-09-29T23:21:23+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-gdqm-zxe0"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-72507", "cvss": {"cvssv31": [{"source": "ics-cert@hq.dhs.gov", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:C/C:H/I:L/A:H", "severity": "critical", "base_score": 9}], "cvssv4": [{"source": "ics-cert@hq.dhs.gov", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:L/VA:H/SC:H/SI:L/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.5}]}, "cvss_score": 8.5, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:L/VA:H/SC:H/SI:L/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-89", "description": "Toptech Systems TMS7 与 TopHAT 是闭源商业终端管理软件。TMS7 提供基于 Web 的库存核算、配额管理以及装卸与门禁控制，TopHAT 用于集中管理多个 TMS7 站点的主数据与报表。\n受影响版本中，平衡报表分区的产品汇总报表功能对 reportType 参数存在基于时间的盲注 SQL 注入。具备高权限的远程攻击者无需额外用户交互即可通过该参数读取关键数据，并造成低完整性影响与高可用性影响。\n修复版本中通过发布 7.8 消除该时间盲注 SQL 注入；公开资料未披露具体代码修改。", "effects": [{"comp_name": "tms7", "ecosystem": "linux", "versions": [{"affected_version": "[7.6.3,7.6.3]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "tophat", "ecosystem": "linux", "versions": [{"affected_version": "[7.6.3,7.6.3]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-09-30", "level": "High", "mps_id": "MPS-b09v-qig3", "poc": false, "poc_url": [], "published_time": "2026-09-30", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-b09v-qig3", "name": "https://www.oscs1024.com/hd/MPS-b09v-qig3"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-72507", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-72507"}, {"url": "https://www.toptech.com/blog/tms7-version-7-8-strengthens-security", "name": ""}, {"url": "https://www.cisa.gov/news-events/ics-advisories/icsa-26-272-02", "name": ""}, {"url": "https://github.com/cisagov/CSAF/blob/develop/csaf_files/OT/white/2026/icsa-26-272-02.json", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Toptech报表SQL注入", "_translated": true, "_saved_at": "2026-09-29T23:21:26+00:00", "_first_saved_at": "2026-09-29T23:21:26+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-b09v-qig3"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假 ": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-09-30", "level": "High", "mps_id": "MPS-f0gy-vp4k", "poc": false, "poc_url": [], "published_time": "2026-09-30", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-f0gy-vp4k", "name": "https://www.oscs1024.com/hd/MPS-f0gy-vp4k"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-72510", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-72510"}, {"url": "https://www.toptech.com/blog/tms7-version-7-8-strengthens-security", "name": ""}, {"url": "https://www.cisa.gov/news-events/ics-advisories/icsa-26-272-02", "name": ""}, {"url": "https://github.com/cisagov/CSAF/blob/develop/csaf_files/OT/white/2026/icsa-26-272-02.json", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "TMS7 SQL注入漏洞", "_translated": true, "_saved_at": "2026-09-29T23:21:25+00:00", "_first_saved_at": "2026-09-29T23:21:25+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-f0gy-vp4k"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2026-93994", "cvss": {}, "cvss_score": 8.1, "cvss_vector": "", "cwe": "CWE-287", "description": "Apache MINA SSHD 是开源 Java 库，用于实现 SSH 客户端与服务端协议，sshd-core 模块提供服务端用户认证能力。\n受影响版本中，服务端可将 AUTH_METHODS 配置为 publickey,publickey 以要求两次不同公钥认证，但 UserAuthPublicKey.doAuth 未保存已成功验证的公钥，也未拒绝重复提交。已持有一对授权密钥的用户把同一公钥连续提交两次即可通过该策略并完成登录，造成部分认证绕过。\n修复版本中通过在 ServerSession 上记录 AUTHENTICATED_KEYS，并在 doAuth 中以 KeyUtils.compareKeys 拒绝已验证过的公钥（证书比较 certPubKey），使单密钥无法再满足多公钥策略。", "effects": [{"comp_name": "org.apache.sshd:sshd-core", "ecosystem": "maven", "versions": [{"affected_version": "[3.0.0-M1,3.0.0-M6)", "min_fixed_version": "3.0.0-M6", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "(-∞,2.20.0)", "min_fixed_version": "2.20.0", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "身份验证不当", "kind_en": "认证不当", "last_modified_time": "2026-09-30", "level": "High", "mps_id": "MPS-e008-8a85", "poc": false, "poc_url": [], "published_time": "2026-09-30", "reference_url_list": [{"url": "https://www.openwall.com/lists/oss-security/2026/09/29/33", "name": ""}, {"url": "https://mina.apache.org/", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-93994", "name": ""}, {"url": "https://github.com/apache/mina-sshd/commit/990e057e26dc602e9887e2df53bc87c7b316a571", "name": ""}, {"url": "https://github.com/apache/mina-sshd/releases/tag/sshd-2.20.0", "name": ""}, {"url": "https://github.com/apache/mina-sshd/releases/tag/sshd-3.0.0-M6", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "MINA SSHD多公钥认证绕过", "_translated": true, "_saved_at": "2026-09-29T19:44:07+00:00", "_first_saved_at": "2026-09-29T19:44:07+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-e008-8a85"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-84409", "cvss": {"cvssv31": [{"source": "ics-cert@hq.dhs.gov", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.5}], "cvssv4": [{"source": "ics-cert@hq.dhs.gov", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.7}]}, "cvss_score": 7.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-79", "description": "Lantronix G520 Series 是闭源物联网蜂窝网关产品，提供工业、交通和安全场景下的远程连接与 Web 管理界面。\n受影响版本中，设备更新机制通过未加密 HTTP 获取软件更新元数据，并保存其中部分内容供后续使用。管理接口在 JSON 响应中返回该存储值，负责展示更新信息的 Web 界面将此值直接作为 HTML 插入页面，使攻击者能够影响的元数据被解释为脚本。同一已认证来源还提供可执行 root 权限系统命令的接口，脚本可在设备管理上下文中执行任意代码。\n修复版本中通过发布 2.6.0.7R6 固件修复该跨站脚本问题，阻断更新元数据在管理上下文中触发 root 级任意代码执行的路径；公开资料未披露具体源码改动。", "effects": [{"comp_name": "G520 Series", "ecosystem": "linux", "versions": [{"affected_version": "[2.6.0.4R6_stable,2.6.0.4R6_stable]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-09-30", "level": "High", "mps_id": "MPS-fbdk-nam2", "poc": false, "poc_url": [], "published_time": "2026-09-30", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-fbdk-nam2", "name": "https://www.oscs1024.com/hd/MPS-fbdk-nam2"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-84409", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-84409"}, {"url": "https://ltrxdev.atlassian.net/wiki/spaces/LTRXTS/pages/1889828865/Latest+firmware+for+the+G520+Series+G526+G526RP+G527+G528", "name": ""}, {"url": "https://www.lantronix.com/technical-support/security-updates/vulnerability-disclosure-policy/vulnerability-library/", "name": ""}, {"url": "https://www.cisa.gov/news-events/ics-advisories/icsa-26-272-01", "name": ""}, {"url": "https://github.com/cisagov/CSAF/blob/develop/csaf_files/OT/white/2026/icsa-26-272-01.json", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "G520系列跨站脚本漏洞", "_translated": true, "_saved_at": "2026-09-29T23:21:19+00:00", "_first_saved_at": "2026-09-29T23:21:19+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-fbdk-nam2"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-91191", "cvss": {"cvssv3 updates/vulnerability-disclosure-policy/vulnerability-library/", "name": ""}, {"url": "https://www.cisa.gov/news-events/ics-advisories/icsa-26-272-01", "name": ""}, {"url": "https://github.com/cisagov/CSAF/blob/develop/csaf_files/OT/white/2026/icsa-26-272-01.json", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "G520固件签名校验绕过", "_translated": true, "_saved_at": "2026-09-29T23:21:18+00:00", "_first_saved_at": "2026-09-29T23:21:18+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-uos0-q6yr"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-103088", "cvss": {"cvssv31": [{"source": "cve@mitre.org", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "cwe": "CWE-24", "description": "Handlebars.java 是开源 Java 模板引擎，handlebars-springmvc 模块向 Spring MVC 提供 HandlebarsViewResolver 与 SpringTemplateLoader，用于按配置前缀加载并渲染服务端模板。\n受影响版本中，handlebars-springmvc 4.5.3 针对 CVE-2026-63490 加入的路径约束在未经百分号解码的 location 字符串上调用 Paths.get().normalize() 与前缀 startsWith，而打开模板时 JDK 的 file: URL 处理器会先解码路径。当应用将模板前缀设为 file: URL、且视图名来自请求参数时，攻击者可提交 %2e%2e/ 绕过 HandlebarsViewResolver.configure 对字面量“..”的拦截以及 SpringTemplateLoader.getResource 的目录包含检查，读取模板根目录之外、进程可读的文件。\n修复版本中通过先由 Spring ResourceLoader 解析目标资源，再对磁盘文件执行 getCanonicalFile() 并与规范化后的模板基目录做前缀包含校验，使约束作用于实际打开路径，阻断百分号编码目录穿越。", "effects": [{"comp_name": "com.github.jknack:handlebars-springmvc", "ecosystem": "maven", "versions": [{"affected_version": "[4.5.3,4.5.5)", "min_fixed_version": "4.5.5", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "路径遍历：'../filedir'", "last_modified_time": "2026-09-30", "level": "High", "mps_id": "MPS-9s5x-fhzu", "poc": false, "poc_url": [], "published_time": "2026-09-30", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-9s5x-fhzu", "name": "https://www.oscs1024.com/hd/MPS-9s5x-fhzu"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-103088", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-103088"}, {"url": "https://github.com/jknack/handlebars.java/security/advisories/GHSA-pvrx-3g7m-fpgv", "name": ""}, {"url": "https://github.com/jknack/handlebars.java/commit/f6ae3979917d05bef07f00befb4013ef00503660", "name": ""}, {"url": "https://github.com/jknack/handlebars.java/releases/tag/v4.5.5", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "Handlebars路径穿越漏洞", "_translated": true, "_saved_at": "2026-09-30T03:32:07+00:00", "_first_saved_at": "2026-09-30T03:32:07+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-9s5x-fhzu"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能有效地控制资源的使用，导致攻击者可以利用这个漏洞耗尽应用程序所依赖的资源。这些资源可以是计算资源（CPU、内存）、网络带宽、数据库连接或其他系统资源。攻击者可以通过发送特制的请求、恶意输入或其他方式，使应用程序消耗大量资源，导致拒绝服务或系统崩溃。", "title": "什么是拒绝服务"}, {"content": "- 消耗计算资源：攻击者可以发送计算密集型的请求，例如复杂的计算、无限循环或递归操作，以耗尽应用程序的计算资源，导致应用程序无法响应其他请求。\r\n- 消耗内存资源：攻击者可以发送大量的数据或恶意输入，以导致应用程序消耗过多的内存资源，从而使系统的可用内存耗尽，并导致应用程序崩溃或变得不可用。\r\n- 消耗网络带宽：攻击者可以发送大量的请求或大型数据包，以消耗应用程序所依赖的网络带宽。这会导致其他合法用户无法正常访问应用程序或降低系统的整体网络性能。\r\n- 消耗存储资源：攻击者可以发送大量的请求或上传大文件，以耗尽应用程序的存储资源，导致系统无法处理其他请求或存储新的数据。", "title": "拒绝服务常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对输入数据进行合理的验证和过滤，防止恶意输入导致资源消耗过高。\r\n- 实施资源限制：应用程序应该实施适当的资源限制策略，例如限制计算操作的时间或次数，限制内存使用量，限制并发连接数等，以防止资源被耗尽。\r\n- 异常处理与错误恢复：应用程序应该具备健壮的异常处理和错误恢复机制，以防止因意外错误导致资源泄漏或无法释放的情况。\r\n- 资源监控与警报：应用程序应该实施适当的资源监控和警报机制，及时发现异常的资源消耗情况，并采取相应的措施来应对。\r\n- 压力测试与性能优化：应用程序应该进行压力测试，以评估其在高负载情况下的性能，并进行必要的性能优化，以确保能够有效地处理大量请求而不耗尽资源。", "title": "如何预防拒绝服务"}], "cnvd_id": "", "cve_id": "CVE-2026-94002", "cvss": {}, "cvss_score": 7.5, "cvss_vector": "", "cwe": "CWE-400", "description": "Apache MINA SSHD 是开源 Java SSH 协议库，同时提供客户端与服务端实现；sshd-sftp 组件中的 DefaultSftpClient 是默认 SFTP 客户端，用于与远程 SFTP 服务器交互。\n受影响版本中，DefaultSftpClient.process 收到服务端 SFTP 应答后未校验该应答是否对应此前发出的请求，直接按 ID 写入 messages 映射。恶意服务器可持续发送无对应请求的应答，这些缓冲对象不会被消费，最终耗尽客户端可用内存。\n修复版本中通过将 messages 改为按请求 ID 注册 CompletableFuture，并在 process 中对无对应未完成请求或重复应答抛出异常拒绝入库，切断无主应答堆积导致的内存耗尽。", "effects": [{"comp_name": "org.apache.sshd:sshd-sftp", "ecosystem": "maven", "versions": [{"affected_version": "[3.0.0-M1,3.0.0-M6)", "min_fixed_version": "3.0.0-M6", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[0.9.0,2.20.0)", "min_fixed_version": "2.20.0", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "拒绝服务", "kind_en": "不受控制的资源消耗", "last_modified_time": "2026-09-30", "level": "High", "mps_id": "MPS-a108-29d4", "poc": false, "poc_url": [], "published_time": "2026-09-30", "reference_url_list": [{"url": "https://www.openwall.com/lists/oss-security/2026/09/29/36", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-94002", "name": ""}, {"url": "https://mina.apache.org/", "name": ""}, {"url": "https://github.com/apache/mina-sshd/commit/53bce94f4b27d1dd7b4d8d730af8b96b9616446f", "name": ""}, {"url": "https://github.com/apache/mina-sshd/releases/tag/sshd-2.20.0", "name": ""}, {"url": "https://github.com/apache/mina-sshd/releases/tag/sshd-3.0.0-M6", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "SSHD SFTP内存耗尽", "_translated": true, "_saved_at": "2026-09-29T19:44:08+00:00", "_first_saved_at": "2026-09-29T19:44:08+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-a108-29d4"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-75098", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "cwe": "CWE-22", "description": "Product Designer App 是发布于 WordPress.org 的开源 WooCommerce 产品在线设计插件，用于前台个性化设计、模板套用与印刷文件导出。\n受影响版本中，前台 AJAX 动作 pdapp-render-design 只通过 pdapp_check_token 校验 nonce 与 token，而 pdappNonce、pdappToken 会作为 JavaScript 全局变量写入任意渲染 [pdapp-studio-page] 短代码的页面，匿名访问者可以直接取得。攻击者将含 xlink:href 的 svg 字段（可使用 data:image/svg+xml;base64 避开文本清洗）随 design.json 上传后，pdapp_replace_image_svg 仅把 PDAPP_UPLOAD_URL 替换为 PDAPP_UPLOAD_DIR 并调用 pdapp_read_file，缺少目录规范化与前缀校验，响应中会带回任意本地文件内容。\n修复版本中通过把 xlink:href 解析限制在插件上传目录、拒绝目录穿越并校验规范化路径，切断任意文件读取。公开 1.1.4 与 1.1.3 在 pdapp_replace_image_svg 上无差异，截至 2026-09-30 未见可复核的路径校验补丁。", "effects": [{"comp_name": "product-designer-app", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.1.3]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-09-30", "level": "High", "mps_id": "MPS-slp1-63gi", "poc": false, "poc_url": [], "published_time": "2026-09-30", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-slp1-63gi", "name": "https://www.oscs1024.com/hd/MPS-slp1-63gi"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-75098", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-75098"}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/e94db231-e5d4-4b49-ad36-74c0284abfd2?source=cve", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/product-designer-app/trunk/includes/productdesignerapp-helpers.php#L2867", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/product-designer-app/trunk/includes/productdesignerapp-front-ajax.php#L625", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/product-designer-app/trunk/includes/productdesignerapp-helpers.php#L261", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/product-designer-app/trunk/templates/default/script/variants.php#L22", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "PDA插件任意文件读取", "_translated": true, "_saved_at": "2026-09-30T10:12:20+00:00", "_first_saved_at": "2026-09-30T10:12:20+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-slp1-63gi"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-97347", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "cwe": "CWE-79", "description": "Post Views Stats Counter 是面向 WordPress 的开源浏览统计插件，用于记录文章与页面访问次数，并在后台展示按日、周、月的统计，同时支持按 User-Agent 忽略爬虫。\n受影响版本中，未认证访问者请求任意前台页面时，pvs_counter_filter_footer 从 HTTP_USER_AGENT 读取 User-Agent 并写入 wp_pvs_counter.useragent，过滤仅依赖 bot、spider、crawler 等子串黑名单。攻击者省略这些子串即可把脚本入库；管理员打开设置页时，manage/admin.php 以 echo $useragent_bot 输出下拉选项文本且未做 HTML 转义，导致存储型跨站脚本执行。\n修复版本中通过尚未发布的官方更新处理该问题。公开最高版本 1.1.7 仍将 User-Agent 无转义输出到设置页，WordPress.org 已关闭该插件下载，部署方应停用并移除插件。", "effects": [{"comp_name": "post-views-stats-counter", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.1.7]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-09-30", "level": "High", "mps_id": "MPS-ut4l-y9i3", "poc": false, "poc_url": [], "published_time": "2026-09-30", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ut4l-y9i3", "name": "https://www.oscs1024.com/hd/MPS-ut4l- ion": "(-∞,0.1.0]", "min_fixed_version": "", "repository": "cargo", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "未经控制的递归", "kind_en": "Uncontrolled Recursion", "last_modified_time": "2026-09-30", "level": "High", "mps_id": "MPS-qztw-pjcf", "poc": false, "poc_url": [], "published_time": "2026-09-30", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-qztw-pjcf", "name": "https://www.oscs1024.com/hd/MPS-qztw-pjcf"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-103087", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-103087"}, {"url": "https://github.com/gosub-io/gosub-engine/security/advisories/GHSA-c762-mxfh-vwvp", "name": ""}, {"url": "https://github.com/gosub-io/gosub-engine/pull/1229", "name": ""}], "scope_influence": "", "tags": [], "title": "Gosub SVG嵌套拒绝服务", "_translated": true, "_saved_at": "2026-09-30T03:32:08+00:00", "_first_saved_at": "2026-09-30T03:32:08+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-qztw-pjcf"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-74225", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:U/C:N/I:L/A:H", "severity": "high", "base_score": 7.1}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:A/AC:L/AT:N/PR:N/UI:N/VC:N/VI:L/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:A/AC:L/AT:N/PR:N/UI:N/VC:N/VI:L/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-787", "description": "U-Boot 是开源引导加载程序，广泛用于嵌入式设备启动与网络引导，并提供基于 RFC 8415 的 DHCPv6 IPv6 netboot。\n受影响版本中，dhcp6_parse_options() 解析 DHCPv6 ADVERTISE 或 REPLY 时未校验 SERVERID 与 CLIENTID 选项长度。局域网攻击者在 netboot 期间发送超长 SERVERID，该长度被写入 server_uid_size 后由 dhcp6_send_request_packet() 无容量检查地复制进固定缓冲区 net_tx_packet，造成越界写入并使引导加载程序崩溃；超长 CLIENTID 则以该长度对固定数组 sm_params.duid 执行 memcmp，造成越界读取。\n修复版本中通过在解析阶段将 SERVERID 长度限制为 RFC 8415 规定的 DUID 上限 130 字节，并仅在 CLIENTID 长度与客户端 DUID 完全一致时进行比较，阻止超长选项进入越界读写路径。", "effects": [{"comp_name": "u-boot", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2026.10-rc5)", "min_fixed_version": "2026.10-rc5", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-09-30", "level": "High", "mps_id": "MPS-z6rw-nmck", "poc": false, "poc_url": [], "published_time": "2026-09-30", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-z6rw-nmck", "name": "https://www.oscs1024.com/hd/MPS-z6rw-nmck"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-74225", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-74225"}, {"url": "https://github.com/u-boot/u-boot/commit/20209a62bc8565fc1e040882bc03c71ff0d73076", "name": ""}, {"url": "https://github.com/u-boot/u-boot/blob/v2026.07/net/dhcpv6.c#L304", vss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "cwe": "CWE-306", "description": "Comelit 1456B Multi-User Gateway 是意大利 Comelit 面向 VIP 可视对讲系统的多用户网关，用于在 IP(ViP) 网络中转发可视对讲呼叫并与私有网络互通，设备固件闭源，不公开源码。\n受影响版本中，固件 2.9.1 与 2.10.0 的管理接口在网络上暴露且不要求任何身份认证，远程攻击者无需凭据即可直接访问该接口，设备以明文返回配置数据，其中包含远程配置口令（Remote Configuration Password），攻击者可读取设备配置与该口令，导致凭据泄露并为后续篡改远程配置提供条件。\n修复版本中通过，CNA 时间线显示厂商 2026 年 3 月确认收到报告（跟踪号 VMP-41）后未提供修复时间表；在官方修复发布前，可通过将管理接口限定于可信管理网段、更换远程配置口令并关注厂商固件更新缓解该风险。", "effects": [{"comp_name": "1456B Multi-User Gateway", "ecosystem": "linux", "versions": [{"affected_version": "[2.9.1,2.9.1]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[2.10.0,2.10.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "关键功能的认证机制缺失", "kind_en": "缺少关键功能的身份验证", "last_modified_time": "2026-10-01", "level": "High", "mps_id": "MPS-tw2v-4eoc", "poc": false, "poc_url": [], "published_time": "2026-10-01", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-tw2v-4eoc", "name": "https://www.oscs1024.com/hd/MPS-tw2v-4eoc"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-80276", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-80276"}, {"url": "https://pro.comelitgroup.com/en-us/product/1456B", "name": "Comelit 1456B product page"}], "scope_influence": "", "tags": ["应用软件"], "title": "Comelit 1456B 网关配置泄露", "_translated": true, "_saved_at": "2026-10-01T08:09:05+00:00", "_first_saved_at": "2026-10-01T08:09:05+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-tw2v-4eoc"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-85679", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "cwe": "CWE-79", "description": "Extendify 是一款 GPLv2 开源的 WordPress 模板与版式库插件，为 Gutenberg 区块编辑器提供模板、图案与布局资源，并负责把设计流程中的区块样式变体注册进 WordPress 全局样式体系。\n受影响版本中，插件将 registerIncoming() 挂载到 rest_request_before_callbacks 过滤器，该回调先于路由 permission_callback 执行，未认证攻击者向 /wp/v2/global-styles 路由发送 POST、PUT 或 PATCH 请求便能进入该代码路径；registerIncoming() 从请求 styles 参数的 blocks 数组键中提取区块类型名，在缺少权限校验与格式校验的情况下经 registerNames() 把攻击者控制的键注册进 WP_Block_Styles_Registry，并持久化到 extendify_block_style_variations 选项；该区块类型键随后被 WordPress 核心以未转义方式内插到前台 registerBlockStyle() 内联脚本中，攻击者由此注入任意 Web 脚本，形成存储型 XSS，用户访问被注入页面时脚本执行。\n修复版本中通过在 registerIncoming() 中增加 current_user_can('edit_theme_options') 权限检查拦截未授权写入，并新增 isValidBlockType() 以正则 ^[a-z0-9-]+/[a-z0-9-]+$ 只放行合法的 namespace/block 形式键，读取存量选项时同步清理历史非法键，切断了未授权写入与脚本注入链。", "effects": [{"comp_name": "extendify", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,3.2.0)", "min_fixed_version": "3.2.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-10-01", "level": "High", "mps_id": "MPS-tvsq-8lk0", "poc": false, "poc_url": [], "published_time": "2026-10-01", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-tvsq-8lk0", "name": "https://www.oscs1024.com/hd/MPS-tvsq-8lk0"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-85679", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-85679"}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/38024680-2d99-4af0-b805-6fd718a1d338?source=cve", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/extendify/tags/3.1.6/app/Shared/Services/BlockStyleVariations.php#L62", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/extendify/tags/3.1.6/app/Shared/Services/BlockStyleVariations.php#L75", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/extendify/tags/3.1.6/app/Shared/Services/BlockStyleVariations.php#L29", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/extendify/tags/3.1.6/app/Shared/Services/BlockStyleVariations.php#L37", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/extendify/tags/3.1.6/bootstrap.php#L112", "name": ""}, {"url": "https://plugins.trac.wordpress.org/changeset?reponame=\u0026new=3688833%40extendify%2Ftags%2F3. ess.org 官方目录分发的开源 WordPress 插件，为 WooCommerce 商店提供商品愿望清单功能，支持访客创建、重命名清单并通过公开 REST 接口添加或移除商品。\n受影响版本中，插件注册的 wp-json/premmerce/wishlist/add/popup 路由将 permission_callback 设为 __return_true，未认证请求可直达 wishlistAddPopupRest 回调；其调用的 wishlistAddPopup 方法直接读取 $_GET['wishlist_key'] 而未做任何净化，并渲染 views/frontend/wishlist-popup.php 模板，模板在请求带有 wishlist_move_from 参数时以 value=\"\u003c?php echo $wishlist_key; ?\u003e\" 的形式将该值输出到隐藏表单域属性中，攻击者在链接中携带双引号闭合属性并拼接脚本的 wishlist_key，诱导用户点击后脚本在受害者浏览器会话中执行，可窃取登录凭据或以受害者身份执行站点操作；wc-ajax=premmerce_wishlist_popup 入口走同一渲染逻辑，同样受影响。\n修复版本中通过在 wishlistAddPopup 中对 wishlist_key 先执行 sanitize_key(wp_unslash()) 并以 /^[a-z0-9]{13}$/ 白名单校验（合法 key 由 uniqid() 生成，固定为 13 位字母数字），不匹配取值直接置为 false，同时在模板中对 wishlist_key 等输出统一补充 esc_attr、esc_html、esc_url 转义，使注入串无法进入 HTML 属性，官方 1.1.15 版本更新日志将该修复记录为 Reflected XSS in the wishlist popup。", "effects": [{"comp_name": "premmerce-woocommerce-wishlist", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.1.15)", "min_fixed_version": "1.1.15", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-10-01", "level": "High", "mps_id": "MPS-y4m1-pba8", "poc": false, "poc_url": [], "published_time": "2026-10-01", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-y4m1-pba8", "name": "https://www.oscs1024.com/hd/MPS-y4m1-pba8"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-97273", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-97273"}, {"url": "https://patchstack.com/database/wordpress/plugin/premmerce-woocommerce-wishlist/vulnerability/wordpress-premmerce-wishlist-for-woocommerce-plugin-1-1-13-cross-site-scripting-xss-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Premmerce Wishlist反射型XSS漏洞", "_translated": true, "_saved_at": "2026-10-01T15:54:1 .8, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:L/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-79", "description": "GetSimple CMS 是一个基于 PHP 的开源内容管理系统，GetSimple CMS CE 是其社区维护版本，页面数据以 XML 文件形式存储，用于搭建和维护小型网站。\n受影响版本中，页面在保存时已由 admin/changedata.php 通过 safe_slash_html() 与 var_out() 对 Keywords、Description、Menu text 和 Content 做 HTML 实体编码，而备份查看器 admin/backup-edit.php 展示页面备份时用 htmldecode() 与 strip_decode() 把这些字段还原为原文，并在第 121、122、123、128 行未重新转义直接输出，保存阶段建立的编码防护被解码输出抵消；能够编辑页面的已登录用户把 JavaScript 存入页面字段并再次保存生成备份（backups/pages/\u003cslug\u003e.bak.xml）后，管理员打开 backup-edit.php?p=view\u0026id=\u003cslug\u003e 查看该备份时，脚本在其后台会话中执行。\n修复版本中通过在 admin/backup-edit.php 的四处输出位置补上 htmlspecialchars($value, ENT_QUOTES, 'UTF-8') 转义，其中 Content 字段在 strip_decode() 解码后再次转义以防止 \u003c/textarea\u003e 闭合逃逸，使备份查看器恢复为编码输出，切断存储脚本进入 HTML 上下文的路径；该修复以 commit 9a4802d（消息 v3.3.23）合入 main 分支，截至 2026-10-02 官方尚未发布包含此修复的版本。", "effects": [{"comp_name": "GetSimpleCMS-CE", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,3.3.22]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-10-02", "level": "High", "mps_id": "MPS-9hjm-yek2", "poc": false, "poc_url": [], "published_time": "2026-10-02", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-9hjm-yek2", "name": "https://www.oscs1024.com/hd/MPS-9hjm-yek2"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-70650", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-70650"}, {"url": "https://github.com/GetSimpleCMS-CE/GetSimpleCMS-CE/security/advisories/GHSA-p6vf-2xr7-mcf4", "name": "https://github.com/GetSimpleCMS-CE/GetSimpleCMS-CE/security/advisories/GHSA-p6vf-2xr7-mcf4"}], "scope_influence": "", "tags": ["应用软件"], "title": "GetSimple CMS CE存储型XSS漏洞", "_translated": true, "_saved_at": "2026-10-01T20:44:01+00:00", "_first_saved_at": "2026-10-01T20:44:01+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-9hjm-yek2"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "cnvd_id": "", "cve_id": "CVE-2026-15897", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-269", "description": "Super Forms – Drag \u0026 Drop Form Builder 是一款 WordPress 拖拽式表单构建商业插件，源码在 GitHub 公开，其随主插件集成的 Register \u0026 Login 附加组件提供前端注册、登录与账户资料更新能力。\n受影响版本中，super_save_form AJAX 动作缺少能力检查，订阅者级别及以上的已认证用户可创建 register_login_action='update' 且 register_login_user_id_update='true' 的表单；提交表单时 SUPER_Register_Login::before_sending_email() 把表单数据中攻击者提供的 user_id 指定为目标账户并写入客户端数据，before_email_success_msg() 随后读取该 ID 并连同攻击者提交的 user_pass、user_email 直接传入 wp_update_user()，全程缺少属主与能力校验，攻击者可覆盖包括管理员在内任意现有账户的凭据，导致账户接管与站点完全失陷。\n修复版本中通过新增 SUPER_Register_Login::can_update_user() 将目标账户更新限制为本人或具备 edit_user 目标能力检查的用户，把待执行的用户更新动作绑定请求指纹并经 user_action_context_is_authorized() 授权后方允许调用 wp_update_user()，同时为 super_save_form 等表单管理 AJAX 动作补充 manage_options 能力检查，切断越权更新账户凭据的利用链。", "effects": [{"comp_name": "super_forms", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,6.3.317)", "min_fixed_version": "6.3.317", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-10-02", "level": "High", "mps_id": "MPS-wdit-axes", "poc": false, "poc_url": [], "published_time": "2026-10-02", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-wdit-axes", "name": "https://www.oscs1024.com/hd/MPS-wdit-axes"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-15897", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-15897"}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/94297481-9ebb-42cb-9362-be8bc52b126f?source=cve", "name": ""}, {"url": "https://github.com/RensTillmann/super-forms/pull/205", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "Super Forms 权限提升漏洞", "_translated": true, "_saved_at": "2026-10-02T06:33:51+00:00", "_first_saved_at": "2026-10-02T06:33:51+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-wdit-axes"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-96294", "cvss": {"cvssv4": [{"source": "security@apache.org", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-755", "description": "Apache Thrift 是开源的跨语言 RPC 框架，其 NodeJS 绑定以 npm 包 thrift 发布，内建的 web server 可把 HTTP 服务升级为 WebSocket 通道来承载 Thrift 消息。\n受影响版本中，web_server.js 的 createWebServer 在处理 HTTP upgrade 事件完成 WebSocket 握手后，未为升级后的 socket 注册 error 监听器，仅用内层 try/catch 处理帧解码异常；当该 socket 触发 error 事件（如远端异常断开连接）时，异常按 Node.js 事件约定以未捕获异常抛出，Node 进程随之退出，远程攻击者无需认证即可令整个 Thrift NodeJS 服务崩溃。\n修复版本中通过在 upgrade 处理器入口为升级后的 socket 注册 error 监听器解决该问题，错误被记录为 TWebSocketTransport Exception 日志并调用 socket.destroy() 关闭当前连接，单个 WebSocket 连接上的错误不再终结服务器进程。", "effects": [{"comp_name": "thrift", "ecosystem": "npm", "versions": [{"affected_version": "(-∞,0.25.0)", "min_fixed_version": "0.25.0", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "对异常条件的处理不恰当", "kind_en": "Improper Handling of Exceptional Conditions", "last_modified_time": "2026-10-02", "level": "High", "mps_id": "MPS-12ed-b2d3", "poc": false, "poc_url": [], "published_time": "2026-10-02", "reference_url_list": [{"url": "http://www.mail-archive.com/announce@apache.org/msg12129.html", "name": ""}, {"url": "https://github.com/apache/thrift/commit/40486d71c40464f3c69bd7eed7187f13c33ad1ee", "name": ""}, {"url": "https://github.com/apache/thrift/releases/tag/v0.25.0", "name": ""}, {"url": "https://www.npmjs.com/package/thrift", "name": ""}, {"url": "https://thrift.apache.org/", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-96294", "name": ""}], "scope_influence": "", "tags": ["npm", "开源"], "title": "Thrift NodeJS WebSocket 拒绝服务漏洞", "_translated": true, "_saved_at": "2026-10-02T13:27:45+00:00", "_first_saved_at": "2026-10-02T00:25:47+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-12ed-b2d3"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-94642", "cvss": {}, "cvss_score": 8.7, "cvss_vector": "", "cwe": "CWE-248", "description": "Apache Thrift 是 Apache 软件基金会的开源跨语言 RPC 框架，其 PHP 绑定以 composer 包 apache/thrift 发布，提供传输层、协议层与 TSimpleServer、TForkingServer 等服务端实现，用于在 PHP 进程中承载 Thrift RPC 服务。\n受影响版本中，TSimpleServer 的 serve() 主循环把 accept()、传输与协议工厂调用以及 processor 处理循环放在同一个 try 块内，且只捕获 TTransportException；协议层解析畸形报文时抛出的 TProtocolException 继承自 TException，并非传输异常，畸形 JSON 报文引发的 TypeError 等 \\Error 类型异常同样不受该 catch 约束，未捕获异常逸出 serve() 后整个 PHP 服务进程以致命错误退出。远程攻击者无需认证，向服务端口发送畸形请求数据（如二进制协议下 4 字节的 0xFFFFFFFF 版本头）即可触发该流程，造成拒绝服务。\n修复版本中通过重构 serve() 循环，将 accept() 的传输异常处理与单个连接的服务逻辑分离，后者移入内层 try 并在 finally 中关闭连接、以 catch (\\Throwable) 兜底，任何异常只结束当前连接，服务端继续接受后续客户端；TForkingServer 子进程的 handleChild 捕获范围同步扩大到 \\Throwable，处理结束后退出而不返回主循环。该修复包含在 0.25.0 版本中。", "effects": [{"comp_name": "apache/thrift", "ecosystem": "composer", "versions": [{"affected_version": "(-∞,0.25.0)", "min_fixed_version": "0.25.0", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "未捕获的异常", "kind_en": "未捕获的异常", "last_modified_time": "2026-10-02", "level": "High", "mps_id": "MPS-56eb-6be2", "poc": false, "poc_url": [], "published_time": "2026-10-02", "reference_url_list": [{"url": "http://www.mail-archive.com/announce@apache.org/msg12127.html", "name": ""}, {"url": "https://thrift.apache.org/", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-94642", "name": ""}, {"url": "https://github.com/apache/thrift/commit/24a0d02577612214dd607c4128e2864c5fe555ff", "name": ""}, {"url": "https://github.com/apache/thrift/releases/tag/v0.25.0", "name": ""}], "scope_influence": "", "tags": ["php", "开源"], "title": "Apache Thrift PHP未捕获异常漏洞", "_translated": true, "_saved_at": "2026-10-02T00:25:48+00:00", "_first_saved_at": "2026-10-02T00:25:48+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-56eb-6be2"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-71542", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-79", "description": "GetSimple CMS 是基于 PHP 的开源内容管理系统，GetSimple CMS CE 为其社区版，用于搭建和维护小型网站。\n受影响版本中，后台主题组件管理功能 admin/components.php 把表单提交的 title 参数经 safe_slash_html() 的 htmlspecialchars(ENT_QUOTES) 编码后写入 components.xml，存储阶段双引号已编码为 \u0026quot;；渲染阶段同文件把 cl($component-\u003etitle) 直接拼入删除链接的 title=\"...\" 双引号属性，而 cl()（admin/inc/basic.php）内部调用 html_entity_decode() 把 \u0026quot; 还原为字面双引号，strip_tags() 只能过滤标签字符、无法阻止不需要尖括号的属性与事件注入，攻击者可在 title 中保存形如 poc\"onmouseover=\"alert(1)\"style=\"position:absolute;width:100%;height:100%;top:0;left:0;\" 的载荷，使任何查看组件管理页面的认证用户浏览器持续执行任意 JavaScript。\n修复版本中通过，安全公告给出的修复方向是在输出环节按属性上下文重新编码标题，以属性上下文编码输出替代先解码再输出的 cl() 路径，使存储值在 title=\"...\" 属性中不再还原出字面双引号；在此之前可通过限制后台组件管理功能的账号使用范围、核查 components.xml 中已存储的 title 内容降低风险，待官方发布修复版本后及时升级。", "effects": [{"comp_name": "GetSimpleCMS-CE", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,3.3.22]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-10-02", "level": "High", "mps_id": "MPS-6gwo-91he", "poc": false, "poc_url": [], "published_time": "2026-10-02", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-6gwo-91he", "name": "https://www.oscs1024.com/hd/MPS-6gwo-91he"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-71542", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-71542"}, {"url": "https://github.com/GetSimpleCMS-CE/GetSimpleCMS-CE/security/advisories/GHSA-vqfh-838q-xfqh", "name": "https://github.com/GetSimpleCMS-CE/GetSimpleCMS-CE/security/advisories/GHSA-vqfh-838q-xfqh"}], "scope_influence": "", "tags": ["应用软件"], "title": "GetSimpleCMS-CE后台存储型XSS漏洞", "_translated": true, "_saved_at": "2026-10-01T20:43:58+00:00", "_first_saved_at": "2026-10-01T20:43:58+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-6gwo-91he"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-
