用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2026-19977", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:N/AC:L/Au:N/C:C/I:C/A:C", "severity": "high", "base_score": 10}], "cvssv31": [{"source": "cna@vuldb.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 10}], "cvssv4": [{"source": "cna@vuldb.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-287", "description": "EFM ipTIME A3004T 14.19.0 中检测到漏洞。受影响的元素是组件Session Validation 的函数httpcon_check_session_url。执行操作会导致身份验证不当。远程利用攻击是可能的。该漏洞现已公开并可能被使用。我们很早就就此事联系了供应商，但没有以任何方式做出回应。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "身份验证不当", "kind_en": "认证不当", "last_modified_time": "2026-08-17", "level": "Critical", "mps_id": "MPS-seuk-8wh2", "poc": false, "poc_url": [], "published_time": "2026-08-17", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-seuk-8wh2", "name": "https://www.oscs1024.com/hd/MPS-seuk-8wh2"}, {"url": "https://nvd.nist.gov/vuln/ saved_at": "2026-08-17T16:20:13+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-wr3d-g06c"}, {"analysis_status": 0, "articles": [{"content": "应用程序在处理用户输入时的不完善或缺乏验证机制，所以攻击者能够通过向应用程序发送恶意输入，利用应用程序对输入数据的错误处理方式来注入自己的恶意代码。这些恶意代码会被应用程序误认为是合法的指令或数据，并在执行过程中被执行。", "title": "什么是代码注入"}, {"content": "应用程序使用可执行动态代码的函数来执行用户可控的参数，当应用程序对于用户输入过滤不完全时，攻击者可以注入恶意代码并控制代码执行流程。", "title": "代码注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对所有用户输入进行验证和过滤，确保只接受预期的有效输入。这包括对输入数据进行输入长度验证、类型检查和格式验证等。\r\n- 使用参数化查询或预编译语句：对于数据库查询操作，应该使用参数化查询或预编译语句，确保输入数据不会被误认为是执行代码。\r\n- 最小特权原则：应用程序在执行操作系统命令或动态代码时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。\r\n- 安全编码实践：开发人员应该采用安全编码实践，包括避免使用eval函数、避免拼接用户输入的字符串作为代码执行等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止代码注入攻击。", "title": "如何预防代码注入"}], "cnvd_id": "", "cve_id": "CVE-2026-74253", "cvss": {"cvssv4": [{"source": "security@joomla.org", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 10}]}, "cvss_score": 10, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-94", "description": "Regular Labs Sourcerer 是面向 Joomla 的商业扩展，用于在文章、模块与页面渲染结果中嵌入并执行 PHP、JavaScript、CSS 与 HTML 代码块。\n受影响版本中，Sourcerer 会处理 Joomla 最终渲染 HTML 中出现的 {source} 代码块，但未能可靠判定这些代码块的真实来源。未认证攻击者可通过可反射到最终页面输出的用户输入注入 {source} 块，使扩展将其当作可执行代码处理，从而在服务器上实现任意代码执行。\n修复版本中通过默认阻止反射或其它未经验证的渲染结果中的 Sourcerer 代码执行，同时保留已验证的文章与 Custom 模块代码路径，切断未认证反射输入到代码执行的利用链。", "effects": [{"comp_name": "Sourcerer extension for Joomla", "ecosystem": "linux", "versions": [{"affected_version": "[1.0.0,14.0.0)", "min_fixed_version": "14.0.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "代码注入", "kind_en": "代码生成控制不当（“代码注入”）", "last_modified_time": "2026-08-18", "level": "Critical", "mps_id": "MPS-2tuc-zewj", "poc": false, "poc_url": [], "published_time": "2026-08-18", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-2tuc-zewj", "name": "https://www.oscs1024.com/hd/MPS-2tuc-zewj"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-74253", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-74253"}, {"url": "https://regularlabs.com/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Regular Labs Sourcerer 未校验反射代码块远程代码执行漏洞", "_translated": true, "_saved_at": "2026-08-17T20:19:27+00:00", "_first_saved_at": "2026-08-17T19:22:40+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-2tuc-zewj"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-66792", "cvss": {"cvssv31": [{"source": "secalert@redhat.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.9}]}, "cvss_score": 9.9, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "cwe": "CWE-863", "description": "multicloud-operators-subscription 组件中发现了 les": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-71424", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:N", "severity": "critical", "base_score": 9.6}]}, "cvss_score": 9.6, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:N", "cwe": "CWE-863", "description": "Onyx 是一个开源人工智能平台。在 3.1.10、3.2.14 和 4.0.0 之前，Onyx 的 GET /api/mcp/servers 和 GET /api/mcp/servers/persona/{persona_id} 端点会公开另一个用户的 OAuth 授权标头，因为 OnyxTokenStorage.set_tokens 和 OnyxTokenStorage.set_client_info backend/onyx/server/features/mcp/api.py 将每个用户令牌复制到共享管理 MCPConnectionConfig 行中，并且 _db_mcp_server_to_api_mcp_server 通过 auth_template.headers 返回该行给任何 BASIC_ACCESS 用户。此问题已在版本 3.1.10、3.2.14 和 4.0.0 中修复。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-08-18", "level": "Critical", "mps_id": "MPS-0hdn-ickm", "poc": false, "poc_url": [], "published_time": "2026-08-18", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-0hdn-ickm", "name": "https:// -08-18", "level": "Critical", "mps_id": "MPS-hxt8-qc5e", "poc": false, "poc_url": [], "published_time": "2026-08-18", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-hxt8-qc5e", "name": "https://www.oscs1024.com/hd/MPS-hxt8-qc5e"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-75784", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-75784"}, {"url": "https://github.com/meishigana/CVE/blob/main/team15_20260702/02_wlc100-nginx/poc/poc-nginx-overflow.py", "name": ""}, {"url": "https://github.com/meishigana/CVE/tree/main/team15_20260702/02_wlc100-nginx", "name": ""}, {"url": "https://vuldb.com/cve/CVE-2026-75784", "name": ""}, {"url": "https://vuldb.com/submit/877773", "name": ""}, {"url": "https://vuldb.com/vuln/391525", "name": ""}, {"url": "https://vuldb.com/vuln/391525/cti", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-75784漏洞", "_translated": true, "_saved_at": "2026-08-18T16:23:38+00:00", "_first_saved_at": "2026-08-18T16:23:38+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-hxt8-qc5e"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-74254", "cvss": {"cvssv4": [{"source": "security@joomla.org", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/U ope_influence": "", "tags": [], "title": "CVE-2026-75627漏洞", "_translated": true, "_saved_at": "2026-08-18T12:33:15+00:00", "_first_saved_at": "2026-08-18T12:33:15+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-pblk-az0h"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-75626", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:H/I:H/A:N", "severity": "critical", "base_score": 9.3}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:N/SC:H/SI:H/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:N/SC:H/SI:H/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-79", "description": "SpiderFoot 无法对从外部扫描数据源（包括服务器横幅和元数据）构建的相关标题进行 H​​TML 转义。攻击者可以将带有事件处理程序的恶意 HTML 元素注入关联结果中，这些结果在打开关联视图时在操作员的浏览器中执行脚本，从而可能窃取 API 密钥。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-08-18", "level": "Critical", "mps_id": "MPS-s071-rimf", "poc": false, "poc_url": [], "published_time": "2026-08-18", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-s071-rimf", "name": "https://www.oscs1024.com/hd/MPS-s071-rimf"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-75626", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-75626"}, {"url": "https://github.com/smicallef/spiderfoot", "name": ""}, {"url": "https://github.com/smicallef/spiderfoot/blob/master/spiderfoot/correlation.py", "name": ""}, {"url": "https://github.com/smicallef/spiderfoot/issues/2012", "name": ""}, {"url": "https://www.vulncheck.com/advisories/spiderfoot-stored-cross-site-scripting-via-correlation-titles", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-75626漏洞", "_translated": true, "_saved_at": "2026-08-18T12:33:17+00:00", "_first_saved_at": "2026-08-18T12:33:17+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-s071-rimf"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-74015", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:N/A:L", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:N/A:L", "cwe": "CWE-89", "description": "Readabler \u003c 2.0.18 版本中未经身份验证的 SQL 注入。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-08-18", "level": "Critical", "mps_id": "MPS-uvnx-ehd5", "poc": false, "poc_url": [], "published_time": "2026-08-18", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-uvnx-ehd5", "name": "https://www.oscs1024.com/hd/MPS-uvnx-ehd5"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-74015", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-74015"}, {"url": "https://patchstack.com/database/wordpress/plugin/readabler/vulnerability/wordpress-readabler-plugin-2-0-18-sql-injection-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-74015漏洞", "_translated": true, "_saved_at": "2026-08-18T16:23:41+00:00", "_first_saved_at": "2026-08-18T16:23:41+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-uvnx-ehd5"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-71472", "cvss": {"cvssv31": [{"source": "secalert@redhat.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.1}]}, "cvss_score": 9.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:C/C:H/I:H/A:H", "cwe": "CWE-78", "description": "acm-search-v2-rhel9 中发现了一个缺陷。此漏洞允许经过身份验证的攻击者（例如中心管理员或搜索自定义资源 (CR) 编辑器）注入恶意 shell 命令或 SQL 语句。出现这种情况是因为搜索 CR 中提供的 WORK_MEM 字符串在用于 bash 脚本和 SQL 查询之前未经过正确验证。成功利用该漏洞可能会导致在特权 postgres pod 中执行任意代码，从而可能危及系统。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-08-18", "level": "Critical", "mps_id": "MPS-9rpv-58uh", "poc": false, "poc_url": [], "published_time": "2026-08-18", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-9rpv-58uh", "name": "https://www.oscs1024.com/hd/MPS-9rpv-58uh"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-71472", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-71472"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-71472", "name": ""}, {"url": "https://bugzilla.redhat.com/show_bug.cgi?id=2512151", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-71472漏洞", "_translated": true, "_saved_at": "2026-08-17T21:20:07+00:00", "_first_saved_at": "2026-08-17T21:20:07+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-9rpv-58uh"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-18051", "cvss": {}, "cvss_score": 10, "cvss_vector": "", "cwe": "CWE-22", "description": "W3 Total Cache 是开源 WordPress 性能优化插件，提供页面缓存、压缩与 CDN 集成等能力，源码公开托管于 GitHub。\n受影响版本中，页面缓存 Disk Enhanced 模式会把请求路径直接拼进缓存文件名。PgCache_ContentGrabber::_get_page_key_urlpart() 会对路径执行 urldecode，并把反斜杠折叠为正斜杠，未拦截父目录段；Cache_File_Generic::set() 再将该键与缓存目录拼接后写入文件，目标目录已存在时跳过安全创建约束，Apache 环境还会在同一目录覆盖 .htaccess。未认证攻击者发送含路径穿越的请求，即可向 Web 根目录内外已存在目录写入或覆盖同名文件，覆盖站点 .htaccess 会中断站点并拆除既有加固规则。\n修复版本中通过停止对 Disk Enhanced URL 段做 urldecode、拒绝含父目录段与反斜杠的缓存键，并新增 Cache_File_Generic::_resolve_path() 将缓存文件操作限制在缓存根目录内，切断路径穿越写文件链路。", "effects": [{"comp_name": "w3-total-cache", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.10.5)", "min_fixed_version": "2.10.5 69.254获取工作负载凭证，同时证书私钥的权限校验仅基于创建者身份而非当前所有者，使得攻击者在证书所有权转移后仍能持续获取私钥。\n受影响版本中，lemur/plugins/lemur_acme/acme_handlers.py的setup_acme_client_no_retry函数从用户传入的options字典读取acme_url后直接传给ClientV2.get_directory进行服务端HTTP请求，没有任何主机名或URL方案校验，允许指向169.254.169.254等内网地址。lemur/lemur/certificates/views.py的get函数在处理证书私钥请求时使用if g.current_user != cert.user条件分支，仅当调用者不是创建者时才校验RBAC权限，创建者获取私钥时始终返回200，导致所有权转移后原创建者仍能获取私钥。\n修复版本中通过在acme_handlers.py添加ACME_DIRECTORY_HOST_ALLOWLIST配置验证，仅允许letsencrypt.org等白名单域名，拒绝内网地址和IMDS端点，切断了SSRF利用路径。同时在views.py增强审计日志，记录access_via、creator_id和current_owner，使创建者绕过权限的行为在审计记录中可见。", "effects": [{"comp_name": "lemur", "ecosystem": "pip", "versions": [{"affected_version": "(-∞,1.9.2)", "min_fixed_version": "1.9.2", "repository": "pip", "solutions": [], "upstream": true}]}, {"comp_name": "netflix/lemur", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.9.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SSRF", "kind_en": "服务器端请求伪造 (SSRF)", "last_modified_time": "2026-08-19", "level": "Critical", "mps_id": "MPS-d4bc-i9fk", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://github.com/Netflix/lemur/security/advisories/GHSA-v2wp-frmc-5q3v", "name": ""}, {"url": "https://github.com/Netflix/lemur/releases/tag/v1.9.2", "name": ""}, {"url": "https://github.com/advisories/GHSA-v2wp-frmc-5q3v", "name": ""}], "scope_influence": "", "tags": ["python", "开源", "终端软件"], "title": "Lemur ACME SSRF与证书创建者权限绕过漏洞", "_translated": true, "_saved_at": "2026-08-18T20:16:28+00:00", "_first_saved_at": "2026-08-18T20:16:28+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-d4bc-i9fk"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-73930", "cvss": {"cvssv31": [{"source": "secalert_us@oracle.com", "vector": "CVSS:3.1/AV:N/ 插件存在未授权权限提升风险，NVD 与 Patchstack 将其归类为 CWE-266（Incorrect Privilege Assignment）。插件在面向前端的 REST/AJAX 入口或表单提交处理中，未对调用者身份与当前权限做充分校验，使未登录或低权限请求可被用于给目标账户赋予更高角色（例如把订阅者提权为管理员），获得提升权限后即可在站点后台接管站点、注入内容或植入持久化后门。\n修复版本中通过，截至 2026-08-19 官方仍未发布修复版本，Patchstack 仅为该 CVE 发布了一条应急 mitigation 规则用于临时拦截利用。建议在官方修复发布前禁用并移除该插件，或使用 WAF/虚拟补丁规则阻断对插件公开入口的可疑提权请求，并将受影响账户恢复至原始角色。", "effects": [{"comp_name": "klbtheme/total-donations", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.0.5]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "特权授予不正确", "kind_en": "权限分配不正确", "last_modified_time": "2026-08-19", "level": "Critical", "mps_id": "MPS-3v6u-r2df", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-3v6u-r2df", "name": "https://www.oscs1024.com/hd/MPS-3v6u-r2df"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73390", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73390"}, {"url": "https://patchstack.com/database/wordpress/plugin/totaldonations/vulnerability/wordpress-total-donations-plugin-2-0-5-privilege-escalation-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Total Donations插件未授权权限提升漏洞", "_translated": true, "_saved_at": "2026-08-19T14:26:39+00:00", "_first_saved_at": "2026-08-19T13:39:15+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-3v6u-r2df"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过向受信任的数据序列化过程中添加恶意数据，从而在序列化和反序列化过程中执行恶意代码的攻击漏洞。这种漏洞通常存在于使用序列化 (serialization) 机制存储和传输数据的程序中。\n", "title": "什么是反序列化"}, {"content": "- 注入攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码注入到程序中，从而实现代码执行的目的。\n- 反射攻击：攻击者使用反射机制，在序列化过程中动态生成恶意数据，并将恶意代码注入到程序中，从而实现代码执行的目的。\n- 缓冲区溢出攻击：攻击者通过在序列化过程中向缓冲区输入恶意数据，导致缓冲区溢出，从而破坏程序的内存管理，实现代码执行的目的。\n- 格式字符串攻击：攻击者通过在序列化过程中输入恶意数据，导致程序使用错误的格式字符串，从而实现代码执行的目的。\n- 数据流攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码作为一个数据流传递给程序，从而实现代码执行的目的。\n", "title": "反序列化常见的攻击方式"}, {"content": "- 不信任输入数据：程序应该严格检查输入数据的有效性，并避免使用不受信任的数据。\n- 使用安全的序列化机制：程序应该使用安全的序列化机制，如 JSON 或 XML 序列化，而不是第三方序列化库。\n- 最小特权原则：程序应该限制对受信任数据的处理权限，并避免在运行时修改数据。\n- 代码审查和漏洞扫描：程序应该进行代码审查和漏洞扫描，以发现和修复潜在的安全漏洞。\n", "title": "如何预防反序列化"}], "cnvd_id": "", "cve_id": "CVE-2026-73364", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-502", "description": "Flexible Subscriptions 是 WP Desk 提供的开源 WordPress 插件，用于在 WooCommerce 中创建订阅商品并处理定期付款。\n受影响版本中，客户完成含订阅商品的结账后，SubscriptionCheckout 会基于父订单创建订阅，并由 OrderDataTransfer.copy_data 复制订单元数据；该函数对每个元数据值调用 maybe_unserialize，使客户写入且仍呈序列化形态的字符串进入 PHP 反序列化。存在可用 POP 链时，可导致代码执行、SQL 注入、路径穿越或拒绝服务。\n修复版本中通过移除 copy_data 对 maybe_unserialize 的调用，改为直接写入原始元数据值，切断不可信序列化字符串进入对象注入路径。", "effects": [{"comp_name": "flexible-subscriptions", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.8.2)", "min_fixed_version": "1.8.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "反序列化", "kind_en": "不可信数据的反序列化", "last_modified_time": "2026-08-19", "level": "Critical", "mps_id": "MPS-5zyf-o8lt", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-5zyf-o8lt", "name": "https://www.oscs1024.com/hd/MPS-5zyf-o8lt"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73364", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73364"}, {"url": "https://patchstack.com/database/wordpress/plugin/flexible-subscriptions/vulnerability/wordpress-flexible-subscriptions-plugin-1-8-1-php-object-injection-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Flexible Subscriptions对象注入", "_translated": true, "_saved_at": "2026-08-19T14:26:51+00:00", "_first_saved_at": "2026-08-19T13:39:32+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-5zyf-o8lt"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "", "cvss": {}, "cvss_score": 9.8, "cvss_vector": "", "cwe": "CWE-306", "description": "Confluent Platform 是 Confluent, Inc. 提供的商业数据流处理平台，社区版以 KRaft 单节点模式默认捆绑 ksqlDB、Apache Kafka broker、Kafka Connect、Schema Registry 与 REST Proxy 等组件，向数据工程师提供流处理与连接器能力。\n受影响版本中，Confluent Platform 7.9.1-ce 默认配置下 ksqlDB HTTP 8089、Kafka broker 9092（PLAINTEXT，无 SASL）与 Kafka Connect 8083 全部对外暴露未认证服务。攻击者向 ksqlDB 的 POST /ksql 提交 CREATE SINK CONNECTOR 语句，创建 FileStreamSinkConnector 并通过 StringConverter 将任意 file 路径写入配置（例如 /etc/cron.d/evil），随后通过未认证的 broker 向对应 topic 写入字节。FileStreamSinkConnector 内部以 PrintStream(new FileOutputStream(file, true)) 把每条消息直接追加写入该路径，未对路径做任何白名单或目录校验；写入符合 cron 语法的一行后，crond 在下次触发时即以 root 身份执行任意命令，研究人员已动态验证 uid=0(root)。该路径同时绕过了 ksqlDB 自带的 KSQL 语句权限边界，并通过 Kafka broker 与 Kafka Connect 的默认未认证 POST 形成整链未认证利用。\n在官方修复发布前，可通过以下方式切断风险：启用 ksqlDB 认证（配置 ksql.authentication 并接入 Confluent RBAC / Basic / LDAP）、为 Kafka broker 启用 SASL 并停用未认证 PLAINTEXT listener、收紧 Kafka Connect 的 connector.class 白名单或禁用 FileStreamSinkConnector，并对 FileStreamSinkConnector 的 file 参数强制路径白名单以禁止写入系统目录；当前公开材料未披露 Confluent 是否已就默认部署发布对应安全补丁。", "effects": [{"comp_name": "confluent_platform", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,7.9.1]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "关键功能的认证机制缺失", "kind_en": "缺少关键功能的身份验证", "last_modified_time": "2026-08-19", "level": "Critical", "mps_id": "MPS-94e0-c764", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://seclists.org/fulldisclosure/2026/Aug/55", "name": ""}, {"url": "https://0day-rubbish.com/blog/ksqldb-unauth-sink-connector-cron-rce", "name": ""}, {"url": "https://github.com/Exploit-Garbage/0day-Rubbish/tree/main/product/confluent/platform-7.9.1/ksqldb-unauth-sink-connector-cron-rce", "name": ""}, {"url": "https://github.com/confluentinc/ksql", "name": ""}, {"url": "https://docs.confluent.io/platform/current/security/advisories.html", "name": ""}, {"url": "https://ksqldb.io/security/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "ksqlDB预认证远程代码执行", "_translated": true, "_saved_at": "2026-08-19T12:33:54+00:00", "_first_saved_at": "2026-08-19T10:22:08+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-94e0-c764"}, {"analysis_status": 0, "articles": [], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-58081", "cvss": {}, "cvss_score": 9.8, "cvss_vector": "", "cwe": "CWE-122", "description": "FreeBSD 是开源操作系统，iconv(3) 是其 C 库提供的字符编码转换接口，供大量应用程序和库处理国际化文本。\n受影响版本中，HZ、UTF-7、VIQR 和 ZW 等编码模块在写出转换结果前未正确检查调用方提供的输出缓冲区剩余长度。应用程序一旦通过 iconv(3) 将不可信输入转换到或从上述编码，即可把转换后的字符写出到缓冲区之外，触发堆缓冲区溢出并导致进程内存损坏。\n修复版本中通过在 UTF-7、VIQR、ZW 的写出路径补上输出长度检查并在空间不足时返回 E2BIG，同时将 HZ 状态缓冲区从 ROWCOL_MAX 扩大为 4+ROWCOL_MAX 以容纳最多两段转义序列，阻止越界写入。", "effects": [{"comp_name": "freebsd", "ecosystem": "linux", "versions": [{"affected_version": "[15.1-RELEASE,15.1-RELEASE-p1)", "min_fixed_version": "15.1-RELEASE-p1", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[15.0-RELEASE,15.0-RELEASE-p11)", "min_fixed_version": "15.0-RELEASE-p11", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[14.4-RELEASE,14.4-RELEASE-p7)", "min_fixed_version": "14.4-RELEASE-p7", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[14.3-RELEASE,14.3-RELEASE-p16)", "min_fixed_version": "14.3-RELEASE-p16", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "堆缓冲区溢出", "kind_en": "基于堆的缓冲区溢出", "last_modified_time": "2026-08-19", "level": "Critical", "mps_id": "MPS-aq7w-hl1y", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-aq7w-hl1y", "name": "https://www.oscs1024.com/hd/MPS-aq7w-hl1y"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-58081", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-58081"}, {"url": "https://security.freebsd.org/advisories/FreeBSD-SA-26:49.iconv.asc", "name": ""}], "scope_influence": "", "tags": ["操作系统"], "title": "FreeBSD iconv堆溢出", "_translated": true, "_saved_at": "2026-08-19T10:22:16+00:00", "_first_saved_at": "2026-08-19T10:22:16+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-aq7w-hl1y"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过向受信任的数据序列化过程中添加恶意数据，从而在序列化和反序列化过程中执行恶意代码的攻击漏洞。这种漏洞通常存在于使用序列化 (serialization) 机制存储和传输数据的程序中。\n", "title": "什么是反序列化"}, {"content": "- 注入攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码注入到程序中，从而实现代码执行的目的。\n- 反射攻击：攻击者使用反射机制，在序列化过程中动态生成恶意数据，并将恶意代码注入到程序中，从而实现代码执行的目的。\n- 缓冲区溢出攻击：攻击者通过在序列化过程中向缓冲区输入恶意数据，导致缓冲区溢出，从而破坏程序的内存管理，实现代码执行的目的。\n- 格式字符串攻击：攻击者通过在序列化过程中输入恶意数据，导致程序使用错误的格式字符串，从而实现代码执行的目的。\n- 数据流攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码作为一个数据流传递给程序，从而实现代码执行的目的。\n", "title": "反序列化常见的攻击方式"}, {"content": "- 不信任输入数据：程序应该严格检查输入数据的有效性，并避免使用不受信任的数据。\n- 使用安全的序列化机制：程序应该使用安全的序列化机制，如 JSON 或 XML 序列化，而不是第三方序列化库。\n- 最小特权原则：程序应该限制对受信任数据的处理权限，并避免在运行时修改数据。\n- 代码审查和漏洞扫描：程序应该进行代码审查和漏洞扫描，以发现和修复潜在的安全漏洞。\n", "title": "如何预防反序列化"}], "cnvd_id": "", "cve_id": "CVE-2026-73389", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-502", "description": "Kalles Addons 是由 The4 发布的商业 WordPress 插件，作为 Kalles WooCommerce 主题的配套扩展用于扩展主题电商相关功能。该插件为闭源商业分发，未在 WordPress.org 公共插件目录上架，也未公开 GitHub 源码仓库。\n受影响版本中，插件在面向未认证请求的入口对 PHP 序列化数据直接进行反序列化处理，输入未经过白名单、强签名或类型校验即进入对象反序列化流程，构成 CWE-502 描述的不安全反序列化。攻击者无需任何凭据即可向暴露入口投递恶意序列化数据，借助目标 WordPress 环境中可用的 POP 链在服务端触发任意对象注入，进一步导致代码执行、SQL 注入、路径穿越或拒绝服务等后果；Patchstack 在其公告中将其风险描述为高度危险并预期被大规模利用，CVSS 基础评分 9.8。\n修复版本中通过停止在未认证请求路径直接反序列化不可信输入或对该路径上的序列化数据做强签名与白名单校验，阻断攻击者控制的字符串进入对象反序列化流程；截至本文档生成日期官方尚未发布修复版本，建议在官方修复版可用前通过 Patchstack 缓解规则（RapidMitigate）拦截攻击向量，或暂时停用 Kalles Addons 插件直至官方修复版发布。", "effects": [{"comp_name": "the4/kalles-addons", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.0.6]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "反序列化", "kind_en": "不可信数据的反序列化", "last_modified_time": "2026-08-19", "level": "Critical", "mps_id": "MPS-cwup-lj9x", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-cwup-lj9x", "name": "https://www.oscs1024.com/hd/MPS-cwup-lj9x"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73389", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73389"}, {"url": "https://patchstack.com/database/wordpress/plugin/kalles-addons/vulnerability/wordpress-kalles-addons-plugin-1-0-6-php-object-injection-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Kalles Addons WordPress 插件 PHP 对象注入漏洞", "_translated": true, "_saved_at": "2026-08-19T14:26:44+00:00", "_first_saved_at": "2026-08-19T13:39:18+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-cwup-lj9x"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-18031", "cvss": {}, "cvss_score": 9.8, "cvss_vector": "", "cwe": "CWE-287", "description": "TabaPay Gateway（插件标识 tabapay-gateway）是开源 WordPress/WooCommerce 支付网关插件，用于将商店结账接入 TabaPay（tabapay.ir）支付通道。\n受影响版本中，对外 WooCommerce API 回调 Tabapay_Gateway::handle_tabapay_callback 在校验支付结果前，当请求携带非空 token 与 wc_order 时，会读取该订单关联账号并调用 wp_set_current_user、wp_set_auth_cookie 建立登录会话。未认证攻击者可指定任意已关联注册用户（含管理员）的订单编号，直接登录对应账号。\n修复版本中通过在建立会话前完成支付回调真实性校验切断未授权登录链路；截至 2026-08-19，WPScan 标明尚无已知修复，GitHub 与 WordPress.org 最高版本仍为 1.4.0，官方插件目录已关闭下载。", "effects": [{"comp_name": "tabapay-gateway", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.4.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "身份验证不当", "kind_en": "认证不当", "last_modified_time": "2026-08-19", "level": "Critical", "mps_id": "MPS-fp4h-nl86", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-fp4h-nl86", "name": "https://www.oscs1024.com/hd/MPS-fp4h-nl86"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-18031", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-18031"}, {"url": "https://wpscan.com/vulnerability/6576dcd1-aea6-47c0-9157-4ca56f426612/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "TabaPay支付回调认证绕过", "_translated": true, "_saved_at": "2026-08-19T07:32:49+00:00", "_first_saved_at": "2026-08-19T07:32:49+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-fp4h-nl86"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "cnvd_id": "", "cve_id": "CVE-2026-18776", "cvss": {}, "cvss_score": 9.8, "cvss_vector": "", "cwe": "CWE-269", "description": "TrueBooker 是开源 WordPress 预约与日程管理插件，用于在站点前台接受预约并管理客户、服务与时间。\n受影响版本中，add_front_user_booking 与 admin_user_create 等 AJAX 动作通过 wp_ajax_nopriv_ 对未登录用户开放，处理函数未校验调用者身份与目标账户所有权，直接把请求中的 truebooker_wp_user_id 与邮箱交给 wp_update_user()，攻击者可改写任意用户包括管理员的邮箱，再走 WordPress 密码重置流程接管账户。\n修复版本中通过删除上述未授权 AJAX 处理函数，并对其余相关接口补充登录、能力与所有权校验，切断未认证请求改写用户邮箱的路径。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-08-19", "level": "Critical", "mps_id": "MPS-qnp8-ieub", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-qnp8-ieub", "name": "https://www.oscs1024.com/hd/MPS-qnp8-ieub"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-18776", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-18776"}, {"url": "https://wpscan.com/vulnerability/4b6abb2d-941b-429f-a480-33d1aafad450/", "name": ""}], "scope_influence": "", "tags": [], "title": "TrueBooker账号接管漏洞", "_translated": true, "_saved_at": "2026-08-19T07:32:43+00:00", "_first_saved_at": "2026-08-19T07:32:43+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-qnp8-ieub"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-47627", "cvss": {"cvssv31": [{"source": "psirt@nvidia.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-22", "description": "适用于 Linux 的 NVIDIA Triton 推理服务器包含一个漏洞，攻击者可能会导致路径遍历。成功利用可能会导致拒绝服务。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-08-19", "level": "Critical", "mps_id": "MPS-zcmr-0u2v", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-zcmr-0u2v", "name": "https://www.oscs1024.com/hd/MPS-zcmr-0u2v"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-47627", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-47627"}, {"url": "https://github.com/NVIDIA/product-security/tree/main/2026/5865", "name": ""}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-47627", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-47627", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-47627漏洞", "_translated": true, "_saved_at": "2026-08-18T20:16:33+00:00", "_first_saved_at": "2026-08-18T20:16:33+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-zcmr-0u2v"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-73388", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:N/A:L", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:N/A:L", "cwe": "CWE-89", "description": "Nikstore Core 是由 TeconceTheme 为其 Nikstore 商业 WordPress 主题配套提供的闭源电商扩展插件，常用于 WooCommerce 商品、订单与查询扩展，属于未在 WordPress.org 上架、不公开源码的商业组件。\n受影响版本中，未认证的攻击者可直接向插件暴露的 Web 接口发送含 SQL 元字符的请求，未对外部输入进行参数化或转义即拼入数据库查询，造成 WordPress 站点数据库的未授权读取，并因昂贵的注入载荷影响数据库与站点可用性。\n修复版本中通过上游尚未发布官方补丁，建议在 WAF 与主机层启用 Patchstack 提供的虚拟补丁规则拦截异常 SQL 元字符与 UNION/SELECT 等关键字，及时停用或卸载该插件，并持续关注上游修复版本发布直至升级至修复版本。", "effects": [{"comp_name": "nikstore-core", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.5]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-08-19", "level": "Critical", "mps_id": "MPS-0zoy-376t", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-0zoy-376t", "name": "https://www.oscs1024.com/hd/MPS-0zoy-376t"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73388", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73388"}, {"url": "https://patchstack.com/database/wordpress/plugin/nikstore-core/vulnerability/wordpress-nikstore-core-plugin-1-5-sql-injection-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Nikstore Core 插件SQL注入漏洞", "_translated": true, "_saved_at": "2026-08-19T14:26:38+00:00", "_first_saved_at": "2026-08-19T13:39:20+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-0zoy-376t"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是 应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-74997", "cvss": {"cvssv31": [{"source": "cve@mitre.org", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-78", "description": "在 1.6.18 之前的 Roundcube Webmail 和 1.7.3 之前的 1.7.x 中，markasjunk 插件的 cmd_learn 驱动程序会通过精心设计的占位符替换值进行远程代码执行。此问题仅影响使用 markasjunk 插件及其 cmd_learn 驱动程序的 Roundcube 实例。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-08-17", "level": "High", "mps_id": "MPS-vs21-l8a9", "poc": false, "poc_url": [], "published_time": "2026-08-17", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-vs21-l8a9", "name": "https://www.oscs1024.com/hd/MPS-vs21-l8a9"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-74997", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-74997"}, {"url": "https://github.com/roundcube/roundcubemail/commit/14044f843cfacbe78b042f659e379d6b4497aa7c", "name": ""}, {"url": "https://github.com/roundcube/roundcubemail/commit/495d211638f222336b20f4744545c53712426c2a", "name": ""}, {"url": "https://git uggestion": "建议修复", "kind": "栈缓冲区溢出", "kind_en": "基于堆栈的缓冲区溢出", "last_modified_time": "2026-08-17", "level": "High", "mps_id": "MPS-cmzb-8oqs", "poc": false, "poc_url": [], "published_time": "2026-08-17", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-cmzb-8oqs", "name": "https://www.oscs1024.com/hd/MPS-cmzb-8oqs"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-19959", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-19959"}, {"url": "https://lavender-bicycle-a5a.notion.site/EDIMAX-EW-7478APC-formWanTcpipSetup-34b53a41781f8047b36bd11dbcaa84dc?source=copy_link", "name": ""}, {"url": "https://vuldb.com/cve/CVE-2026-19959", "name": ""}, {"url": "https://vuldb.com/submit/872873", "name": ""}, {"url": "https://vuldb.com/vuln/391136", "name": ""}, {"url": "https://vuldb.com/vuln/391136/cti", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-19959漏洞", "_translated": true, "_saved_at": "2026-08-17T00:54:18+00:00", "_first_saved_at": "2026-08-17T00:54:18+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-cmzb-8oqs"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过构造恶意的数据，将过多的数据输入到程序的缓冲区中，使得缓冲区的空间被填满，从而溢出到程序的栈 (stack) 或堆 (heap) 中，导致程序崩溃、拒绝服务、数据泄露等安全问题。\n", "title": "什么是经典缓冲区溢出"}, {"content": "| 类型        | 描述                                                         |\n| ----------- | ------------------------------------------------------------ |\n| 代码注入攻击      | 攻击者通过向程序的缓冲区输入恶意代码，从而控制程序执行流程，实现对程序操作的恶意操作。例如，攻击者可以通过向 Web 应用程序的输入框中输入恶意代码，从而执行任意的代码，破坏系统、窃取数据等。 |\n| 数据覆盖攻击      | 攻击者通过向程序的缓冲区输入过多的数据，从而覆盖程序中的重要数据或代码，实现对程序操作的恶意操作。例如，攻击者可以通过向聊天应用程序的输入框中输入过多的表情符号，从而覆盖程序中的重要数据，例如聊天消息、账号密码等。 |\n| 栈溢出攻击 | 攻击者通过向程序的栈中输入过多的数据，从而溢出到栈外部，实现对程序操作的恶意操作。例如，攻击者可以通过向游戏应用程序的输入框中输入过多的道具名称，从而覆盖程序中的重要数据，例如游戏数据、账号密码等。 |\n| 堆溢出攻击       | 攻击者通过向程序的堆中输入过多的数据，从而溢出到堆外部，实现对程序操作的恶意操作。例如，攻击者可以通过向操作系统工具的输入框中输入过多的命令，从而覆盖程序中的重要数据，例如系统文件、配置文件等。 |", "title": "经典缓冲区溢出常见的攻击方式"}, {"content": "- 输入验证：在程序输入处对输入数据进行严格的验证和过滤，确保输入数据符合预期的格式和类型，避免被攻击者注入恶意命令或数据。可以使用正则表达式、格式字符串等方式进行输入验证。\n- 输出过滤：在程序输出处对输出数据进行严格的过滤和检查，确保输出数据符合预期的格式和类型，避免被攻击者截获和篡改。可以使用安全的输出过滤库等方式进行输出过滤。\n- 使用安全的编程模型：使用安全的编程模型，例如避免使用原生的缓冲区管理函数，使用安全的框架和库来处理输入数据和执行命令，避免缓冲区溢出漏洞。\n- 数据库加密和访问控制：对于敏感数据和命令，使用加密和访问控制措施，确保只有授权用户可以访问和执行命令，避免被攻击者窃取和篡改。\n- 定期更新和升级：定期更新和升级应用程序和库的版本，确保应用程序和库的最新版本包含了最新的安全补丁和修复措施，避免安全漏洞的出现和利用。\n- 安全审计和监控：定期对系统和应用程序进行安全审计和监控，及时发现和阻止潜在的安全漏洞和攻击，确保系统和数据的安全和可靠性。", "title": "如何预防经典缓冲区溢出"}], "cnvd_id": "", "cve_id": "CVE-2026-19961", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:N/AC:L/Au:S/C:C/I:C/A:C", "severity": "high", "base_score": 9}], "cvssv31": [{"source": "cna@vuldb.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.9}], "cvssv4": [{"source": "cna@vuldb.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-120", "description": "Edimax EW-7478APC 1.04 中检测到漏洞。受影响的是文件 /goform/formWlSiteSurvey 的函数 formWlSiteSurvey。对参数 selSSID 进行操作会导致缓冲区溢出。攻击可以远程进行。该漏洞现已公开并可能被使用。我们很早就就此事联系了供应商，但没有以任何方式做出回应。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "经典缓冲区溢出", "kind_en": "不检查输入大小的缓冲区复制（“经典缓冲区溢出”）", "last_modified_time": "2026-08-17", "level": "High", "mps_id": "MPS-gsy7-uivf", "poc": false, "poc_url": [], "published_time": "2026-08-17", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-gsy7-uivf", "name": "https://www.oscs1024.com/hd/MPS-gsy7-uivf"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-19961", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-19961"}, {"url": "https://lavender-bicycle-a5a.notion.site/EDIMAX-EW-7478APC-formWlSiteSurvey-34b53a41781f804fb328d87416095401?source=copy_link", "name": ""}, {"url": "https://vuldb.com/cve/CVE-2026-19961", "name": ""}, {"url": "https://vuldb.com/submit/872875", "name": ""}, {"url": "https://vuldb.com/vuln/391138", "name": ""}, {"url": "https://vuldb.com/vuln/391138/cti", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-19961漏洞", "_translated": true, "_saved_at": "2026-08-17T02:17:15+00:00", "_first_saved_at": "2026-08-17T00:54:16+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-gsy7-uivf"}, {"analysis_status": 0, "articles": [{"content": "- 编写代码时没有正确处理输入数据或没有正确验证用户输入而导致的。", "title": "什么是关键资源权限分配不当"}, {"content": "- 弱密码或未使用的密码：当管理员或系统管理员在创建帐户时，没有使用强密码或未对帐户进行密码更新时，可能会发生这种情况。弱密码可能会被黑客破解或通过其他方式轻松访问系统。\n- 未正确配置权限：在系统中，不同的资源通常需要不同的权限才能访问。如果管理员未正确配置权限，那么未经授权的用户可能会通过欺骗系统或利用其他漏洞来访问关键资源。\n- 权限重用：在某些情况下，管理员可能会将某些权限分配给某个用户，但这些权限并未被正确地限制或授权给该用户。如果其他用户尝试使用这些权限访问关键资源，那么他们可能会获得未经授权的访问权限。\n- 未正确验证用户输入：当开发人员没有正确验证用户输入时，可能会发生这种情况。例如，如果开发人员未正确过滤用户输入的用户名或密码，那么黑客可能会利用这些信息轻松地访问系统。\n", "title": "关键资源权限分配不当常见的攻击方式"}, {"content": "- 使用强密码：管理员应该使用强密码来保护系统，并定期更改密码。强密码应该包括数字、字母和符号，并且应该不同于其他帐户使用的密码。\n- 正确配置权限：管理员应该正确配置系统中不同资源所需的权限。用户可以被授予访问特定资源的权限，但不应该被授予访问其他资源的权限。\n- 权限限制：管理员应该使用权限限制来限制用户对特定资源的访问。例如，用户可以被授予访问特定文件夹的权限，但不能访问其他文件夹。\n- 输入验证：开发人员应该正确验证用户输入。例如，他们可以过滤用户输入的用户名和密码，以确保它们符合预期的格式。\n- 安全培训：管理员和用户应该接受安全培训，以便了解如何识别和避免常见的安全漏洞，例如不正确权限授予漏洞。\n- 定期更新和修补软件：系统软件和应用程序应该定期更新和修补，以确保它们不受最新安全漏洞的影响。", "title": "如何预防关键资源权限分配不当"}], "cnvd_id": "", "cve_id": "CVE-2026-50602", "cvss": {"cvssv4": [{"source": "8fc372e3-d9c5-46e4-9410-38469745c639", "vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.5}]}, "cvss_score": 8.5, "cvss_vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-732", "description": "由于分配给 Planet9 后台服务使用的应用程序可执行文件的文件权限不正确，Planet9 中已发现安全漏洞。该服务以系统权限运行，而受影响的可执行文件向非管理用户授予过多权限。因此，经过身份验证的本地用户可能会修改或替换可执行文件，并在服务启动或系统重新启动时以 SYSTEM 权限执行任意代码。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "关键资源权限分配不当", "kind_en": "关键资源的权限分配不正确", "last_modified_time": "2026-08-17", "level": "High", "mps_id": "MPS-e4op-s86t", "poc": false, "poc_url": [], "published_time": "2026-08-17", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-e4op-s86t", "name": "https://www.oscs1024.com/hd/MPS-e4op-s86t"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-50602", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-50602"}, {"url": "https://community.acer.com/en/kb/articles/19870", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-50602漏洞", "_translated": true, "_saved_at": "2026-08-17T05:29:30+00:00", "_first_saved_at": "2026-08-17T03:44:05+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-e4op-s86t"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-22072", "cvss": {"cvssv4": [{"source": "security@oppo.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:A/VC:H/VI:N/VA:N/SC:H/SI:L/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.3}]}, "cvss_score": 8.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:A/VC:H/VI:N/VA:N/SC:H/SI:L/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-20", "description": "通过 WebView 组件加载任意外部 URL 会引入恶意 JS 代码，这些代码可以窃取任意用户令牌。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "输入验证不恰当", "kind_en": "输入验证不当", "last_modified_time": "2026-08-17", "level": "High", "mps_id": "MPS-kga3-w4o5", "poc": false, "poc_url": [], "published_time": "2026-08-17", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-kga3-w4o5", "name": "https://www.oscs1024.com/hd/MPS-kga3-w4o5"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-22072", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-22072"}, {"url": "https://security.oppo.com/en/noticeDetail?notice_only_key=NOTICE-2088198578949595136", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-22072漏洞", "_translated": true, "_saved_at": "2026-08-17T09:35:02+00:00", "_first_saved_at": "2026-08-17T08:35:41+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-kga3-w4o5"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-71567", "cvss": {"cvssv31": [{"source": "74b3a70d-cca6-4d34-9789-e83b222ae3be", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:N/I:H/A:N", "severity": "high", "base_score": 7.7}]}, "cvss_score": 7.7, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:N/I:H/A:N", "cwe": "CWE-78", "description": "在 openshift-metal3/fakefish 中，某些脚本中存在重复模式，其中 shell 变量\n 被注入而不将它们引用到命令行或 \n体现出来。这主要适用于图像 URL 和 BMC 凭证 \n（未经 FakeFish 验证）。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-08-17", "level": "High", "mps_id": "MPS-kx4p-c0hz", "poc": false, "poc_url": [], "published_time": "2026-08-17", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-kx4p-c0hz", "name": "https://www.oscs1024.com/hd/MPS-kx4p-c0hz"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-71567", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-71567"}, {"url": "https://github.com/openshift-metal3/fakefish/security/advisories/GHSA-xfhv-fp7q-v2cc", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-71567漏洞", "_translated": true, "_saved_at": "2026-08-17T16:20:10+00:00", "_first_saved_at": "2026-08-17T16:20:10+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-kx4p-c0hz"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-74998", "cvss": {"cvssv31": [{"source": "cve@mitre.org", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "cwe": "CWE-79", "description": "在 1.6.18 之前的 Roundcube Webmail 和 1.7.3 之前的 1.7.x 中，来自 CSS（层叠样式表）代理的响应未经过验证，这可能会导致信息泄露或通过 MIME 嗅探的 XSS（跨站脚本）。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-08-17", "level": "High", "mps_id": "MPS-d0kr-z7a9", "poc": false, "poc_url": [], "published_time": "2026-08-17", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-d0kr-z7a9", "name": "https://www.oscs1024.com/hd/MPS-d0kr-z7a9"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-74998", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-74998"}, {"url": "https://github.com/roundcube/roundcubemail/commit/62d33c8a0dc3fd0dd03984220dc9709e8e0de43b", "name": ""}, {"url": "https://github.com/roundcube/roundcubemail/commit/a2334990c02f7cb77b1a8d6fa97fcd9e1b5cd1fb", "name": ""}, {"url": "https://github.com/roundcube/roundcubemail/releases/tag/1.6.18", "name": ""}, {"url": "https://github.com/roundcube/roundcubemail/releases/tag/1.7.3", "name": ""}, {"url": "https://roundcube.net/news/2026/08/09/security-updates-1.6.18-and-1.7.3", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-74998漏洞", "_translated": true, "_saved_at": "2026-08-17T15:19:34+00:00", "_first_saved_at": "2026-08-17T14:21:03+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-d0kr-z7a9"}, {"analysis_status": 0, "articles": [{"content": "- 命令注入是一种攻击，其目标是通过易受攻击的应用程序在主机操作系统上执行任意命令。 当应用程序将不安全的用户提供的数据（表单、cookie、HTTP 标头等）传递到系统 shell 时，就会产生缺陷。攻击者通过构造恶意的命令或数据，将其注入到程序执行的上下文中，从而绕过程序的输入验证和安全措施，实现对程序操作的恶意操作。", "title": "什么是命令注入"}, {"content": "- 文件上传：攻击者通过构造恶意的文件上传请求，将包含恶意命令的文件上传到服务器，从而利用命令注入漏洞执行恶意命令。\n- SQL 注入：攻击者通过构造恶意的 SQL 查询语句，将包含恶意命令的 SQL 语句注入到数据库中，从而执行恶意命令，窃取数据或者破坏系统。\n- 命令执行：攻击者通过在 Web 应用程序的表单提交数据中注入恶意命令，从而执行恶意命令，例如删除文件、格式化硬盘等。\n- 命令注入漏洞的旁路攻击：攻击者可以利用命令注入漏洞旁路控制程序的执行流程，从而窃取数据、破坏系统、控制程序等。\n", "title": "命令注入常见的攻击方式"}, {"content": "- 输入验证：在程序输入处对输入数据进行严格的验证和过滤，确保输入数据符合预期的格式和类型，避免被攻击者注入恶意命令。\n- 输出过滤：在程序输出处对输出数据进行严格的过滤和检查，确保输出数据符合预期的格式和类型，避免被攻击者截获和篡改。\n- 使用安全的编程模型：使用安全的编程模型，例如避免使用原生的命令执行方式，使用安全的框架和库来处理输入数据和执行命令，避免命令注入漏洞。\n- 数据库加密和访问控制：对于敏感数据和命令，使用加密和访问控制措施，确保只有授权用户可以访问和执行命令，避免被攻击者窃取和篡改。\n- 定期更新和升级：定期更新和升级应用程序和库的版本，确保应用程序和库的最新版本包含了最新的安全补丁和修复措施，避免安全漏洞的出现和利用。\n- 安全审计和监控：定期对系统和应用程序进行安全审计和监控，及时发现和阻止潜在的安全漏洞和攻击，确保系统和数据的安全和可靠性。", "title": "如何预防命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-75002", "cvss": {"cvssv31": [{"source": "cve@mitre.org", "vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:L", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:L", "cwe": "CWE-77", "description": "在 1.6.18 之前的 Roundcube Webmail 和 1.7.3 之前的 1.7.x 中，邮件搜索和 LITERAL+ 字节计数不同步可能会通过 IMAP 命令注入导致信息泄露或权限升级。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "命令注入", "kind_en": "命令中使用的特殊元素的不正确中和（“命令注入”）", "last_modified_time": "2026-08-17", "level": "High", "mps_id": "MPS-jyqp-mve8", "poc": false, "poc_url": [], "publ driver-ruby 是 Ruby 生态中用于实现 WebSocket 客户端与服务端的开源组件，当服务端通过 WebSocket::Driver.server() 在 TCP 上承载 WebSocket 时，攻击者发送畸形 Host 头会触发 URI.parse 抛出未被捕获的 URI::InvalidURIError，导致服务端进程崩溃。\n受影响版本中，websocket-driver（rubygems 包名 websocket-driver）所有 0.8.2 之前的发布版本（含 0.x 主分支）受影响，漏洞位于 lib/websocket/http/request.rb 的 Request#complete 方法：构造器完成 HTTP 头解析后，代码直接将 @env['HTTP_HOST'] 拼接到 \"http://#{ host }\" 后调用 URI.parse 提取 SERVER_NAME/SERVER_PORT，未捕获 URI::InvalidURIError；任何未在外层 try/rescue 中显式包裹 driver.parse() 调用的应用都会被该异常击穿，进程随即终止。\n修复版本中通过将 host 解析独立封装为 Request#set_server_vars 方法并在其后追加 rescue URI::InvalidURIError 分支调用 error，使畸形 Host 头进入错误状态并将整条 HTTP 请求判定为非法，WebSocket 握手不再建立；该修复随提交 7d6fd87759a2fdc83590d3b49ffa661dc53fa128 进入 0.8.2 版本。", "effects": [{"comp_name": "websocket-driver", "ecosystem": "linux", "versions": [{"affected_version": "[0,0.8.2)", "min_fixed_version": "0.8.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "未捕获的异常", "kind_en": "未捕获的异常", "last_modified_time": "2026-07-22", "level": "High", "mps_id": "MPS-y3ui-hdob", "poc": false, "poc_url": [], "published_time": "2026-08-18", "reference_url_list": [{"url": "https://github.com/faye/websocket-driver-ruby/security/advisories/GHSA-2x63-gw47-w4mm", "name": ""}, {"url": "https://github.com/faye/websocket-driver-ruby/commit/7d6fd87759a2fdc83590d3b49ffa661dc53fa128", "name": ""}, {"url": "https://github.com/advisories/GHSA-2x63-gw47-w4mm", "name": ""}], "scope_influence": "", "tags": [], "title": "websocket-driver-ruby 拒绝服务漏洞", "_translated": true, "_saved_at": "2026-08-17T18:29:54+00:00", "_first_saved_at": "2026-08-17T18:29:54+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-y3ui-hdob"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过向受信任的数据序列化过程中添加恶意数据，从而在序列化和反序列化过程中执行恶意代码的攻击漏洞。这种漏洞通常存在于使用序列化 (serialization) 机制存储和传输数据的程序中。\n", "title": "什么是反序列化"}, {"content": "- 注入攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码注入到程序中，从而实现代码执行的目的。\n- 反射攻击：攻击者使用反射机制，在序列化过程中动态生成恶意数据，并将恶意代码注入到程序中，从而实现代码执行的目的。\n- 缓冲区溢出攻击：攻击者通过在序列化过程中向缓冲区输入恶意数据，导致缓冲区溢出，从而破坏程序的内存管理，实现代码执行的目的。\n- 格式字符串攻击：攻击者通过在序列化过程中输入恶意数据，导致程序使用错误的格式字符串，从而实现代码执行的目的。\n- 数据流攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码作为一个数据流传递给程序，从而实现代码执行的目的。\n", "title": "反序列化常见的攻击方式"}, {"content": "- 不信任输入数据：程序应该严格检查输入数据的有效性，并避免使用不受信任的数据。\n- 使用安全的序列化机制：程序应该使用安全的序列化机制，如 JSON 或 XML 序列化，而不是第三方序列化库。\n- 最小特权原则：程序应该限制对受信任数据的处理权限，并避免在运行时修改数据。\n- 代码审查和漏洞扫描：程序应该进行代码审查和漏洞扫描，以发现和修复潜在的安全漏洞。\n", "title": "如何预防反序列化"}], "cnvd_id": "", "cve_id": "CVE-2026-74012", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-502", "description": "TaxoPress \u003c= 3.51.0 版本中的编辑器 PHP 对象注入。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "反序列化", "kind_en": "不可信数据的反序列化", "last_modified_time": "2026-08-18", "level": "High", "mps_id": "MPS-fu5m-a8i3", "poc": false, "poc_url": [], "published_time": "2026-08-18", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-fu5m-a8i3", "name": "https://www.oscs1024.com/hd/MPS-fu5m-a8i3"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-74012", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-74012"}, {"url": "https://patchstack.com/database/wordpress/plugin/simple-tags/vulnerability/wordpress-taxopress-plugin-3-51-0-php-object-injection-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-74012漏洞", "_translated": true, "_saved_at": "2026-08-18T16:23:43+00:00", "_first_saved_at": "2026-08-18T16:23:43+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-fu5m-a8i3"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "cnvd_id": "", "cve_id": "CVE-2026-70495", "cvss": {"cvssv31": [{"source": "secalert@redhat.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "cwe": "CWE-269", "description": "search-v2-operator 中发现了一个缺陷。该组件的“search-serviceaccount”权限过于广泛，使其能够模拟整个集群中的用户和组。如果攻击者获得对此服务帐户下运行的任何 Pod 的访问权限，他们就可以利用此漏洞来实现“system:masters”访问，从而授予他们对集群的完全控制权。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-08-18", "level": "High", "mps_id": "MPS-h4ma-f92o", "poc": false, "poc_url": [], "published_time": "2026-08-18", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-h4ma-f92o", "name": "https://www.oscs1024.com/hd/MPS-h4ma-f92o"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-70495", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-70495"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-70495", "name": ""}, {"url": "https://bugzilla.redhat.com/show_bug.cgi?id=2511031", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-70495漏洞", "_translated": true, "_saved_at": "2026-08-17T21:20:09+00:00", "_first_saved_at": "2026-08-17T21:20:09+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-h4ma-f92o"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-9771", "cvss": {"cvssv31": [{"source": "vulnerabilities@zephyrproject.org", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "cwe": "CWE-862", "description": "flash_copy() 系统调用由 drivers/flash/flash_util.c 中的 z_vrfy_flash_copy() 进行验证。在启用 CONFIG_USERSPACE 的构建上，此处理程序是用户模式调用者的内核端信任边界。在修复之前，它仅验证输出缓冲区 (K_SYSCALL_MEMORY_WRITE) 并将两个 struct device * 参数 src_dev 和 dst_dev 直接传递到实现中，无需任何对象验证 - 与每个同级 flash 系统调用不同，它使用 K_SYSCALL_DRIVER_FLASH 保护其设备指针。\n\n用户模式线程完全控制 src_dev/dst_dev 的值及其自身地址空间的内容。实现 z_impl_flash_copy() 取消引用这些指针并通过其驱动程序 API 函数表进行调用（例如 api-\u003eget_parameters(dst_dev)、flash_read(src_dev, ...)、flash_write(dst_dev, ...)）。通过提供一个指向伪造的结构设备的指针，该设备的 api 表包含攻击者选择的函数指针，非特权线程可以导致内核在管理模式下调用任意代码；传递任何任意或无效地址，否则会导致内核崩溃或越界读取。\n\n结果是用户空间沙箱的本地权限升级（内核拒绝服务和信息泄露作为较小的结果）。该修复将 K_SYSCALL_DRIVER_FLASH(src_dev, read) 和 K_SYSCALL_DRIVER_FLASH(dst_dev, write) 添加到 z_vrfy_flash_copy()，这将验证每个设备是否是已注册的闪存驱动程序内核对象，调用线程在任何取消引用之前都可以使用，从而完全关闭路径。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-08-18", "level": "High", "mps_id": "MPS-p5b4-mger", "poc": false, "poc_url": [], "published_time": "2026-08-18", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-p5b4-mger", "name": "https://www.oscs1024.com/hd/MPS-p5b4-mger"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-9771", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-9771"}, {"url": "https://github.com/zephyrproject-rtos/zephyr/commit/1b1ecdc438092cdd469319a0d51cba6cf82e06f4", "name": ""}, {"url": "https://github.com/zephyrproject-rtos/zephyr/security/advisories/GHSA-68cj-3hg4-5vpm", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-9771漏洞", "_translated": true, "_saved_at": "2026-08-17T18:29:49+00:00", "_first_saved_at": "2026-08-17T18:29:49+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-p5b4-mger"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-68518", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:L/AC:L/AT:P/PR:L/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:4.0/AV:L/AC:L/AT:P/PR:L/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-78", "description": "Glances是一款开源系统跨平台监控工具。在 4.5.6 之前，glances/actions.py 中的 _sanitize_mustache_dict() 在 chevron.render() 之前清理各个 Mustache 值，允许相邻的未转义 Mustache 变量重建 secure_popen() 在由管理员配置的操作模板呈现攻击者控制的进程或容器字段时执行的 shell 操作符。此问题已在 4.5.6 中修复。", "effects": [{"comp_name": "glances", "ecosystem": "pip", "versions": [{"affected_version": "(-∞,4.5.6)", "min_fixed_version": "4.5.6", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-08-18", "level": "High", "mps_id": "MPS-qae5-j4zk", "poc": false, "poc_url": [], "published_time": "2026-08-18", "reference_url_list": [{"url": "https://github.com/nicolargo/glances/security/advisories/GHSA-qcpp-8x79-hhp3", "name": ""}, {"url": "https://github.com/nicolargo/glances/commit/9c280eae5419da680827024b60f6265956e31994", "name": ""}, {"url": "https://github.com/nicolargo/glances/releases/tag/v4.5.6", "name": ""}, {"url": "https://github.com/advisories/GHSA-qcpp-8x79-hhp3", "name": ""}], "scope_influence": "", "tags": ["python", "开源"], "title": "CVE-2026-68518漏洞", "_translated": true, "_saved_at": "2026-08-17T18:29:53+00:00", "_first_saved_at": "2026-08-17T18:29:53+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-qae5-j4zk"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过向受信任的数据序列化过程中添加恶意数据，从而在序列化和反序列化过程中执行恶意代码的攻击漏洞。这种漏洞通常存在于使用序列化 (serialization) 机制存储和传输数据的程序中。\n", "title": "什么是反序列化"}, {"content": "- 注入攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码注入到程序中，从而实现代码执行的目的。\n- 反射攻击：攻击者使用反射机制，在序列化过程中动态生成恶意数据，并将恶意代码注入到程序中，从而实现代码执行的目的。\n- 缓冲区溢出攻击：攻击者通过在序列化过程中向缓冲区输入恶意数据，导致缓冲区溢出，从而破坏程序的内存管理，实现代码执行的目的。\n- 格式字符串攻击：攻击者通过在序列化过程中输入恶意数据，导致程序使用错误的格式字符串，从而实现代码执行的目的。\n- 数据流攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码作为一个数据流传递给程序，从而实现代码执行的目的。\n", "title": "反序列化常见的攻击方式"}, {"content": "- 不信任输入数据：程序应该严格检查输入数据的有效性，并避免使用不受信任的数据。\n- 使用安全的序列化机制：程序应该使用安全的序列化机制，如 JSON 或 XML 序列化，而不是第三方序列化库。\n- 最小特权原则：程序应该限制对受信任数据的处理权限，并避免在运行时修改数据。\n- 代码审查和漏洞扫描：程序应该进行代码审查和漏洞扫描，以发现和修复潜在的安全漏洞。\n", "title": "如何预防反序列化"}], "cnvd_id": "", "cve_id": "CVE-2026-32465", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-502", "description": "Essential Real Estate \u003c= 5.3.3 版本中的客户 PHP 对象注入。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "反序列化", "kind_en": "不可信数据的反序列化", "last_modified_time": "2026-08-18", "level": "High", "mps_id": "MPS-t8mb-e574", "poc": false, "poc_url": [], "published_time": "2026-08-18", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-t8mb-e574", "name": "https://www.oscs1024.com/hd/MPS-t8mb-e574"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-32465", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-32465"}, {"url": "https://patchstack.com/database/wordpress/plugin/essential-real-estate/vulnerability/wordpress-essential-real-estate-plugin-5-3-3-php-object-injection-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-32465漏洞", "_translated": true, "_saved_at": "2026-08-18T15:25:44+00:00", "_first_saved_at": "2026-08-18T15:25:44+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-t8mb-e574"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-75482", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "high", "base_score": 7.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-22", "description": "SWE-agent 的轨迹检查器（sweagent 检查器）在 v1.1.0 中得到确认，是一个 HTTP 服务器，它将请求路径连接到其 /trajectory/ 处理程序中的轨迹目录，而不拒绝父目录（'..'）引用，绕过内置路径清理。服务器绑定所有接口（0.0.0.0），应用通配符 CORS，并且不需要身份验证。未经身份验证的网络客户端（或通过 CORS 的恶意网页）可以使用路径遍历序列读取预期目录之外的文件。由于读取接收器将目标解析为轨迹 JSON，因此披露仅限于形状像轨迹的 JSON 23929漏洞", "_translated": true, "_saved_at": "2026-08-18T14:26:50+00:00", "_first_saved_at": "2026-08-18T14:26:50+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-8957-1azv"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-32466", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:N/A:L", "severity": "high", "base_score": 8.5}]}, "cvss_score": 8.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:N/A:L", "cwe": "CWE-89", "description": "Gravity Forms Bookings 高级 \u003c= 2.1 版本中的订户 SQL 注入。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-08-18", "level": "High", "mps_id": "MPS-hqz0-g7ts", "poc": false, "poc_url": [], "published_time": "2026-08-18", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-hqz0-g7ts", "name": "https://www.oscs1024.com/hd/MPS-hqz0-g7ts"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-32466", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-32466"}, {"url": "https://patchstack.com/database/wor
