ability": "中", "fix_suggestion": "建议修复", "kind": "通过用户控制密钥绕过授权机制", "kind_en": "通过用户控制的密钥绕过授权", "last_modified_time": "2026-08-22", "level": "High", "mps_id": "MPS-4f7s-yow2", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-4f7s-yow2", "name": "https://www.oscs1024.com/hd/MPS-4f7s-yow2"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-67359", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-67359"}, {"url": "https://www.j2commerce.com/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "J2Store订单内容泄露漏洞", "_translated": true, "_saved_at": "2026-08-21T21:17:56+00:00", "_first_saved_at": "2026-08-21T21:17:56+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-4f7s-yow2"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过向受信任的数据序列化过程中添加恶意数据，从而在序列化和反序列化过程中执行恶意代码的攻击漏洞。这种漏洞通常存在于使用序列化 (serialization) 机制存储和传输数据的程序中。\n", "title": "什么是反序列化"}, {"content": "- 注入攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码注入到程序中，从而实现代码执行的目的。\n- 反射攻击：攻击者使用反射机制，在序列化过程中动态生成恶意数据，并将恶意代码注入到程序中，从而实现代码执行的目的。\n- 缓冲区溢出攻击：攻击者通过在序列化过程中向缓冲区输入恶意数据，导致缓冲区溢出，从而破坏程序的内存管理，实现代码执行的目的。\n- 格式字符串攻击：攻击者通过在序列化过程中输入恶意数据，导致程序使用错误的格式字符串，从而实现代码执行的目的。\n- 数据流攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码作为一个数据流传递给程序，从而实现代码执行的目的。\n", "title": "反序列化常见的攻击方式"}, {"content": "- 不信任输入数据：程序应该严格检查输入数据的有效性，并避免使用不受信任的数据。\n- 使用安全的序列化机制：程序应该使用安全的序列化机制，如 JSON 或 XML 序列化，而不是第三方序列化库。\n- 最小特权原则：程序应该限制对受信任数据的处理权限，并避免在运行时修改数据。\n- 代码审查和漏洞扫描：程序应该进行代码审查和漏洞扫描，以发现和修复潜在的安全漏洞。\n", "title": "如何预防反序列化"}], "cnvd_id": "", "cve_id": "CVE-2026-71513", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-502", "description": "NLTK 是开源 Python 自然语言处理工具包，提供语料库、词性标注、句法分析、文本分类等功能。\n受影响版本中，nltk/picklesec.py 中的 AllowlistUnpickler.find_class 仅按前缀校验 pickle 全局对象的 module 是否命中 allowed_modules，从未校验 name，导致 TransitionParser.parse 通过 allowlisted_pickle_load 加载的合法命名空间（如 sklearn）允许通过 getattr 链解析命名空间之外的任意可调用对象。攻击者构造恶意的 transition-parser 模型文件，在 pickle 协议 ≥ 4 下请求 sklearn.os.system、numpy.f2py.crackfortran.myeval 等 dotted name，即可在 unpickle 阶段执行任意系统命令。\n修复版本中通过在 AllowlistUnpickler.find_class 中加入拒绝 dotted name、拒绝 dunder name、拒绝 os/subprocess/sys/builtins/numpy.f2py/nltk.tokenize.repp 等 denylist、解析后拒绝裸模块对象与真实 __module__ 属于被拒模块的对象等守卫，将 punkt 切换为精确 (module, qualname) allowlist，并由 transitionparser.py 显式传入 allowed_globals，配合新守卫确保 numpy/scipy/sklearn 仅能解析到 array 反序列化所需的子模块，切断命名空间穿透与子模块 gadget 利用链。", "effects": [{"comp_name": "nltk", "ecosystem": "pip", "versions": [{"affected_version": "[3.10.0,3.10.3)", "min_fixed_version": "3.10.3", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "反序列化", "kind_en": "不可信数据的反序列化", "last_modified_time": "2026-08-22", "level": "High", "mps_id": "MPS-84wv-10no", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-84wv-10no", "name": "https://www.oscs1024.com/hd/MPS-84wv-10no"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-71513", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-71513"}, {"url": "https://github.com/nltk/nltk", "name": ""}, {"url": "https://github.com/nltk/nltk/blob/v3.10.2/nltk/picklesec.py#L119-L124", "name": ""}, {"url": "https://github.com/nltk/nltk/commit/c3e37113742a1ebeeb4f2ca58941f320f98805ea", "name": ""}, {"url": "https://www.vulncheck.com/advisories/nltk-through-remote-code-execution-via-allowlistunpickler-dotted-name-bypass", "name": ""}], "scope_influence": "", "tags": ["python", "开源"], "title": "NLTK AllowlistUnpickler反序列化RCE漏洞", "_translated": true, "_saved_at": "2026-08-22T15:14:24+00:00", "_first_saved_at": "2026-08-22T15:14:24+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-84wv-10no"}, {"analysis_status": 0, "articles": [{"content": "由于应用程序或系统中存在敏感信息未经适当保护而被泄露给攻击者或未经授权的用户，这些敏感信息可能包括用户凭据、个人身份信息、敏感业务数据、系统配置信息等。信息暴露漏洞通常是由于设计、实施或配置错误引起的，例如不正确的访问控制、弱密码策略、缺乏加密、错误的日志处理等。", "title": "什么是未授权敏感信息泄露"}, {"content": "- 直接访问敏感信息：攻击者可以通过直接访问不正确配置或不受保护的资源来获取敏感信息，如通过公开可访问的URL、未经授权的文件目录访问等。\n- 越权访问：攻击者可能利用访问控制错误或不正确的权限配置来获取他们没有权限访问的敏感信息。\n- 错误信息披露：应用程序在错误处理过程中可能泄露敏感信息，例如将错误消息中的敏感数据返回给客户端或显示在日志文件中。\n- 信息泄露通过响应：攻击者可能利用应用程序在响应中不正确地包含敏感信息，如通过网页源代码、响应头部或响应消息体中的敏感数据。", "title": "未授权敏感信息泄露常见的攻击方式"}, {"content": "- 访问控制：确保只有经过授权的用户能够访问敏感信息，使用强大的身份验证和授权机制。\n- 数据加密：对于敏感信息，使用适当的加密算法对数据进行加密，包括数据传输和存储过程中的加密。\n- 错误处理和日志安全：正确处理错误情况，避免在错误消息中暴露敏感信息。同时，确保日志记录功能的安全性，避免将敏感信息记录在日志文件中。\n- 安全配置和最佳实践：遵循安全最佳实践，对应用程序、服务器和系统进行适当的配置，包括访问控制、权限管理、密码策略等。\n- 审计和监控：实施日志审计和监控机制，及时检测和响应任何异常活动或潜在的信息暴露事件。\n- 安全开发实践：在应用程序开发过程中，进行安全代码审查、漏洞扫描和安全测试，以及敏感信息的正确处理和保护。", "title": "如何预防未授权敏感信息泄露"}], "cnvd_id": "", "cve_id": "CVE-2026-59256", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "high", "base_score": 7.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-200", "des description": "io.netty:netty-handler 是 Netty 开源 Java 网络框架的 TLS/SSL 处理模块，被广泛用于构建高性能网络客户端与服务端。\n受影响版本中，4.2.0.Final 至 4.2.16.Final 及 4.1.136.Final 及以下版本在使用 SslProvider.OPENSSL 时，io.netty.handler.ssl.OpenSslX509TrustManagerWrapper 的静态初始化块仅在通过 sun.misc.Unsafe 反射读取 JDK 内部 trustManager 字段成功时才会把普通 X509TrustManager 包装成 X509ExtendedTrustManager；在 Java 25 及以上默认禁用 Unsafe 的环境下，WRAPPER 退回到直接返回原 TrustManager 的 DEFAULT 实现，导致 OpenSSL 客户端路径完全跳过主机名校验。攻击者可作为中间人出示针对任意其他主机名的有效证书，使客户端在未校验主机名一致性的前提下完成 TLS 握手并读取后续应用数据。\n修复版本中通过在 io.netty.handler.ssl.ReferenceCountedOpenSslClientContext 中新增前置校验：当 endpointIdentificationAlgorithm 已配置而当前 TrustManager 不是 X509ExtendedTrustManager 时直接抛出 UnsupportedOperationException，强制要求调用方改用 X509ExtendedTrustManager 或切换到 SslProvider.JDK，从而在 OpenSSL 客户端路径下确保主机名校验始终被启用。", "effects": [{"comp_name": "io.netty:netty-handler", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,4.1.137.Final)", "min_fixed_version": "4.1.137.Final", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[4.2.0.Final,4.2.17.Final)", "min_fixed_version": "4.2.17.Final", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "对宿主不匹配的证书验证不恰当", "kind_en": "主机不匹配导致证书验证不当", "last_modified_time": "2026-08-22", "level": "High", "mps_id": "MPS-yocd-30fh", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-yocd-30fh", "name": "https://www.oscs1024.com/hd/MPS-yocd-30fh"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-62243", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-62243"}, {"url": "https://github.com/netty/netty/security/advisories/GHSA-p85m-gvr3-788c", "name": ""}, {"url": "https://www.vulncheck.com/advisories/netty-through-tls-hostname-verification-bypass", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "Netty OpenSSL 客户端 TLS 主机名验证绕过漏洞", "_translated": true, "_saved_at": "2026-08-22T14:15:02+00:00", "_first_saved_at": "2026-08-22T14:15:02+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-yocd-30fh"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-66917", "cvss": {"cvssv4": [{"source": "security@joomla.org", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU: 。\n受影响版本中，jsactions 功能在接收并存储用户提交的内容时未对脚本片段进行充分的输出转义或清洗，攻击者在无需登录的情况下就可将任意 JavaScript 载荷持久化到该功能关联的数据中；后续管理员或普通用户在浏览触发该数据的页面时，浏览器会自动执行载荷，从而造成存储型跨站脚本攻击并具备劫持会话、窃取令牌等风险。\n修复版本中通过 4.7.2 版本对 jsactions 处理流程的输入校验与输出转义逻辑进行修正，不再将未净化的用户内容直接落地为可执行脚本，断开存储型 XSS 的载荷持久化与执行链路，建议升级至 4.7.2 及以上版本。", "effects": [{"comp_name": "Fabrik", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,4.7.2)", "min_fixed_version": "4.7.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-08-22", "level": "High", "mps_id": "MPS-9ufa-s781", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-9ufa-s781", "name": "https://www.oscs1024.com/hd/MPS-9ufa-s781"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-77027", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-77027"}, {"url": "https://www.fabrikar.com/", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "Fabrik Joomla扩展存储型XSS漏洞", "_translated": true, "_saved_at": "2026-08-22T16:16:24+00:00", "_first_saved_at": "2026-08-22T16:16:24+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-9ufa-s781"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持 确中和（“跨站点脚本”）", "last_modified_time": "2026-08-22", "level": "High", "mps_id": "MPS-3x2r-gk1b", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-3x2r-gk1b", "name": "https://www.oscs1024.com/hd/MPS-3x2r-gk1b"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-75933", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-75933"}, {"url": "https://raw.githubusercontent.com/cisagov/CSAF/develop/csaf_files/IT/white/2026/va-26-232-02.json", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-75933", "name": ""}, {"url": "https://www.jetadmin.io/", "name": ""}], "scope_influence": "", "tags": [], "title": "Jet Admin 登录页存储型 XSS", "_translated": true, "_saved_at": "2026-08-21T18:27:51+00:00", "_first_saved_at": "2026-08-21T17:22:34+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-3x2r-gk1b"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-57998", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.5}]}, "cvss_score": 8.5, "cvss_vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-78", "description": "better-npm-audit 是一款基于 Node.js 的 npm CLI 工具，源代码以 MIT 协议在 GitHub 上开源，用于在项目目录中执行 npm audit 并以表格形式呈现依赖漏洞结果。\n受影响版本中，handleInput 函数通过模板字面量把用户提供的 --registry 参数直接拼接到 auditCommand 字符串，未做任何转义或白名单校验；callback 随后在 index.ts 中调用 child_process.exec(${auditCommand} --json) 把整段字符串交给 /bin/sh -c 解释，攻击者在 --registry 中塞入 ;、|、反引号、$() 等 shell 元字符即可在执行 better-npm-audit 的进程中运行任意操作系统命令，等同于本地命令执行。\n修复版本中通过在 handleInput 中新增 validateRegistryUrl() 对 options.registry 做前置过滤：拒绝包含 ;、\u0026、|、`、$、()、{}、[]、\u003c\u003e、换行、回车等 shell 元字符以及非 http(s):// 协议的输入，不合法时打印错误并 process.exit(1)，从源头切断未过滤字符串注入 exec 命令的链路。", "effects": [{"comp_name": "better-npm-audit", "ecosystem": "npm", "versions": [{"affected_version": "(-∞,4.0.0-rc.2]", "min_fixed_version": "", "repository": "npm", "solutions": [], "upstream": true}, {"affected_version": "(-∞,3.11.0]", "min_fixed_version": "", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-08-22", "level": "High", "mps_id": "MPS-pdk3-1w87", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-pdk3-1w87", "name": "https://www.oscs1024.com/hd/MPS-pdk3-1w87"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-57998", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-57998"}, {"url": "https://github.com/jeemok/better-npm-audit", "name": ""}, {"url": "https://github.com/jeemok/better-npm-audit/blob/fd99a0f41ff4342b8a0a6fdbe5a17261de3d0544/index.ts#L34", "name": ""}, {"url": "https://github.com/jeemok/better-npm-audit/blob/fd99a0f41ff4342b8a0a6fdbe5a17261de3d0544/src/handlers/handleInput.ts#L30-L37", "name": ""}, {"url": "https://github.com/jeemok/better-npm-audit/issues/119", "name": ""}, {"url": "https://github.com/jeemok/better-npm-audit/pull/120", "name": ""}, {"url": "https://www.vulncheck.com/advisories/better-npm-audit-os-command-injection-via-registry-flag", "name": ""}], "scope_influence": "", "tags": ["npm", "开源"], "title": "better-npm-audit --registry 命令注入漏洞", "_translated": true, "_saved_at": "2026-08-22T14:15:06+00:00", "_first_saved_at": "2026-08-22T13:26:33+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-pdk3-1w87"}, {"analysis_status": 0, "articles": [{"content": "应用程序在处理用户输入时的不完善或缺乏验证机制，所以攻击者能够通过向应用程序发送恶意输入，利用应用程序对输入数据的错误处理方式来注入自己的恶意代码。这些恶意代码会被应用程序误认为是合法的指令或数据，并在执行过程中被执行。", "title": "什么是代码注入"}, {"content": "应用程序使用可执行动态代码的函数来执行用户可控的参数，当应用程序对于用户输入过滤不完全时，攻击者可以注入恶意代码并控制代码执行流程。", "title": "代码注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对所有用户输入进行验证和过滤，确保只接受预期的有效输入。这包括对输入数据进行输入长度验证、类型检查和格式验证等。\r\n- 使用参数化查询或预编译语句：对于数据库查询操作，应该使用参数化查询或预编译语句，确保输入数据不会被误认为是执行代码。\r\n- 最小特权原则：应用程序在执行操作系统命令或动态代码时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。\r\n- 安全编码实践：开发人员应该采用安全编码实践，包括避免使用eval函数、避免拼接用户输入的字符串作为代码执行等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止代码注入攻击。", "title": "如何预防代码注入"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-19221", "cvss": {}, "cvss_score": 8.5, "cvss_vector": "", "cwe": "CWE-94", "description": "Forminator Forms 是 WPMU DEV 发布的开源 WordPress 表单插件，提供联系表单、付款表单、调查问卷与 Hub Connector 等扩展能力，可通过 WordPress 插件仓库部署到单站点或多站点网络中。\n受影响版本中，插件未把网络级 Hub Connector API Key 这一网络范围设置的修改权限限制为网络管理员，多站点网络中任意单站点的管理员即可通过相关设置接口写入或修改该网络范围配置，进而触发代码注入路径，最终在整个 WordPress Multisite 网络上执行任意代码。\n修复版本中通过在 1.57.0.5 增加对网络级 Hub Connector API Key 设置的权限校验，仅允许网络管理员操作该配置，切断单站点管理员触发的网络范围代码执行路径。", "effects": [{"comp_name": "forminator", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.57.0.5)", "min_fixed_version": "1.57.0.5", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "代码注入", "kind_en": "代码生成控制不当（“代码注入”）", "last_modified_time": "2026-08-22", "level": "High", "mps_id": "MPS-to38-rxmh", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-to38-rxmh", "name": "https://www.oscs1024.com/hd/MPS-to38-rxmh"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-19221", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-19221"}, {"url": "https://wpscan.com/vulnerability/5aa85c72-2a60-4243-b370-ef0b46e98cfe/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Forminator Forms多站点网络范围任意代码执行漏洞", "_translated": true, "_saved_at": "2026-08-22T11:15:25+00:00", "_first_saved_at": "2026-08-22T07:26:08+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-to38-rxmh"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-60084", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:C/C:N/I:H/A:H", "severity": "high", "base_score": 8.7}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:N/VI:H/VA:H/SC:N/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.4}]}, "cvss_score": 8.4, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:N/VI:H/VA:H/SC:N/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-22", "description": "SiYuan 是开源的本地优先笔记与知识管理应用，Go 语言实现的服务端提供基于 Web 的 API 来管理文档、模板、附件与配置等用户数据。\n受影响版本中，POST /api/search/removeTemplate 接口的 removeTemplate 处理器从 JSON 请求体取出 path 字段后，未对其做任何路径校验或基目录约束，直接调用 model.RemoveTemplate(path)；该函数再把 path 透传给 filelock.Remove，最终由 Go 标准库的 os.RemoveAll 按客户端传入的字符串递归删除目标。已认证的管理员因此可以传入任意绝对路径，使服务端进程按其文件系统权限删除宿主机上的任意文件或目录，绕过工作区与模板目录的隔离边界。\n修复版本中通过 RemoveTemplate 在调用 filelock.Remove 之前先用 filepath.Join 与模板基目录拼接，再用 gulu.File.IsSubPath 校验解析后路径仍位于模板目录之下，拦截跨越基目录的删除请求，从而切断任意文件删除链路。", "effects": [{"comp_name": "github.com/siyuan-note/siyuan/kernel", "ecosystem": "go", "versions": [{"affected_version": "(-∞,3.7.4)", "min_fixed_version": "3.7.4", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-08-22", "level": "High", "mps_id": "MPS-jcw7-xamy", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-jcw7-xamy", "name": "https://www.oscs1024.com/hd/MPS-jcw7-xamy"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-60084", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-60084"}, {"url": "https://github.com/siyuan-note/siyuan/security/advisories/GHSA-w938-w7m4-qrj8", "name": ""}, {"url": "https://www.vulncheck.com/advisories/siyuan-before-arbitrary-file-deletion-via-removetemplate", "name": ""}], "scope_influence": "", "tags": ["go"], "title": "SiYuan任意文件删除漏洞", "_translated": true, "_saved_at": "2026-08-22T14:15:03+00:00", "_first_saved_at": "2026-08-22T14:15:03+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-jcw7-xamy"}, {"analysis_status": 0, "articles": [{"content": "跨界内存读是指应用程序在读取内存时，未正确验证或限制读取的内存范围。攻击者利用这种漏洞可以读取应用程序内存中的敏感数据，如密码、加密密钥、会话令牌等。常见的原因是由于缓冲区溢出、格式化字符串漏洞或其他内存错误导致的。", "title": "什么是越界读取"}, {"content": "攻击者可以通过不当构造的输入来触发跨界内存读漏洞。攻击者可能会通过向应用程序发送特定的输入，使其读取超过预期的内存区域。攻击者可以利用这个漏洞来获取敏感信息，如其他用户的数据、操作系统的敏感数据或应用程序的内部状态。", "title": "越界读取常见的攻击方式"}, {"content": "- 输入验证和限制：应用程序应对所有输入数据进行严格的验证和限制。确保输入数据的长度、格式和内容符合预期，避免超出缓冲区或访问非预期的内存区域。\n- 内存安全编程实践：开发人员应使用安全的编程实践，如避免使用不安全的函数、正确处理内存分配和释放操作，以及遵循最小特权原则。\n- 使用安全的编程语言和库：选择使用安全性较高的编程语言和库，这些语言和库在内存管理和安全性方面提供了更多的保护机制。\n- 定期进行代码审查和安全测试：定期审查应用程序的代码，并进行安全测试，以发现潜在的跨界内存读漏洞。使用静态代码分析工具和漏洞扫描工具来辅助检测和修复问题。\n- 实施防御性编程技术：应用程序应采用防御性编程技术，如使用随机化地址空间布局（ASLR）、堆栈保护机制（如堆栈溢出保护）和数据执行预防（DEP）等。\n- 及时更新和修补：及时应用程序和操作系统的安全更新和补丁，以确保已知的跨界内存读漏洞得到修复。及时更新相关软件和库，以避免使用已知存在漏洞的版本。", "title": "如何预防越界读取"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "", "cvss": {}, "cvss_score": 8.3, "cvss_vector": "", "cwe": "CWE-125", "description": "Viz 进程负责在 Chromium 多进程架构中执行合成与动画 tick。renderer 进程通过 Mojo IPC（viz.mojom.LayerContext::UpdateDisplayTree）向 Viz/GPU 进程提交 LayerTreeUpdate，其中包含动画时间函数（TimingFunction）。\n受影响版本中，Viz 进程的 DeserializeTimingFunction() 在反序列化 linear 类型时间函数时，仅处理空 points 情形，对 1 个 easing point 的线性时间函数不做任何校验即送入 gfx::LinearTimingFunction::Create()，而后者仅靠 DCHECK 防御（release 构建无效）。当 Viz 合成器按 tick 调用 gfx::LinearTimingFunction::GetValue() 时，函数假设 points_ 至少包含 2 个元素，对仅 1 个点的向量在 cbegin() 位置调用 std::prev() 触发越界读取，造成 GPU 进程内存破坏。被攻击者控制的 renderer 因此可在 GPU 进程触发越界读取，形成从 renderer 沙箱逃逸到 GPU 进程的能力。\n修复版本中通过在 DeserializeTimingFunction() 的 linear 分支中，紧接空 points 校验之后追加 points.size() \u003c 2 检查，对不合法情形返回 base::unexpected(\"Invalid number of points: must be at least 2 for LinearTiming\") 阻断该 Mojo 输入进入 Viz 动画管线，从根本上消除沙箱逃逸路径。", "effects": [{"comp_name": "chrome", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,149.0.7819.0)", "min_fixed_version": "149.0.7819.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "chromium", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,149.0.7819.0)", "min_fixed_version": "149.0.7819.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "高", "fix_suggestion": "建议修复", "kind": "越界读取", "kind_en": "越界读取", "last_modified_time": "2026-08-22", "level": "High", "mps_id": "MPS-174n-vu9f", "poc": true, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://issues.chromium.org/issues/488089244", "name": ""}, {"url": "https://chromium-review.googlesource.com/c/chromium/src/+/7807569", "name": ""}, {"url": "https://chromium-review.git.corp.google.com/c/chromium/src/+/7807569", "name": ""}, {"url": "https://chromium.googlesource.com/chromium/src/+/006569f40dacbc962a9610f426fd31bf6efec3bc", "name": ""}, {"url": "https://github.com/chromium/chromium/commit/006569f40dacbc962a9610f426fd31bf6efec3bc", "name": ""}], "scope_influence": "", "tags": [], "title": "Google Chrome \u003c 149.0.7819.0 LinearTimingFunction 校验缺失沙箱绕过漏洞", "_translated": true, "_saved_at": "2026-08-22T12:26:03+00:00", "_first_saved_at": "2026-08-22T10:16:37+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-174n-vu9f"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-48105", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:N/VI:H/VA:N/SC:N/SI:H/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.3}]}, "cvss_score": 8.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:N/VI:H/VA:N/SC:N/SI:H/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-913", "description": "Arc 是 Basekick Labs 开源（AGPL-3.0）的 SQL 原生时序数据库，面向遥测场景，Enterprise 版本通过 Raft 协议在集群节点间同步文件清单（manifest）。\n受影响版本中，internal/cluster/raft/fsm.go 的 applyRegisterFile 仅校验提议负载中的路径字段非空，对 .. 父目录穿越、绝对路径、URL 方案（s3://、file:// 等）以及超长路径没有任何限制；任何拥有合法集群凭证或已控制一个集群节点的攻击者都能通过 Raft 提议注册任意路径，使其他节点在查询时拉取 /etc/passwd 等宿主机敏感文件，或加载 s3://attacker-bucket/poisoned.parquet 等攻击者控制的远端对象，形成集群范围的蠕虫式传播。\n修复版本中通过新增 internal/cluster/raft/path_validation.go 中的 ValidateManifestPath 实现基于形状的路径校验，applyRegisterFile、applyUpdateFile、applyBatchFileOps、Snapshot Restore 等所有改动 manifest 的入口在执行前均拒绝空路径、超过 4096 字节的路径、NUL 字节、父目录穿越段（..）、POSIX 与 Windows 绝对路径，以及任何含冒号的 URI 形式（包括 s3://、file:/、mailto:、data: 等），并将拒绝计数通过 arc_cluster_manifest_rejected_paths_total 暴露给 /metrics 供运维告警。", "effects": [{"comp_name": "github.com/Basekick-Labs/arc", "ecosystem": "go", "versions": [{"affected_version": "(-∞,26.06.1)", "min_fixed_version": "26.06.1", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "动态管理代码资源的控制不恰当", "kind_en": "动态管理代码资源控制不当", "last_modified_time": "2026-08-22", "level": "High", "mps_id": "MPS-1rai-7v30", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-1rai-7v30", "name": "https://www.oscs1024.com/hd/MPS-1rai-7v30"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-48105", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-48105"}, {"url": "https://github.com/Basekick-Labs/arc/security/advisories/GHSA-f85q-mvg8-qf37", "name": ""}], "scope_influence": "", "tags": ["go"], "title": "Arc Enterprise Raft FSM 路径校验缺失漏洞", "_translated": true, "_saved_at": "2026-08-22T06:29:06+00:00", "_first_saved_at": "2026-08-22T00:53:23+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-1rai-7v30"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "cnvd_id": "", "cve_id": "CVE-2026-77235", "cvss": {"cvssv31": [{"source": "ff89ba41-3aa1-4d27-914a-91399e9639e5", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:C/C:N/I:L/A:H", "severity": "high", "base_score": 7.3}], "cvssv4": [{"source": "ff89ba41-3aa1-4d27-914a-91399e9639e5", "vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:N/VC:N/VI:L/VA:H/SC:N/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.3}]}, "cvss_score": 8.3, "cvss_vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:N/VC:N/VI:L/VA:H/SC:N/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-416", "description": "FreeRTOS-Kernel is an open-source C real-time kernel maintained by Amazon for embedded and IoT devices, with TrustZone-aware ARMv8-M ports that split execution between non-secure and secure worlds.\n受影响版本中，portable/ARMv8M/non_secure/port.c 的 vPortSVCHandler_C 在处理 portSVC_FREE_SECURE_CONTEXT 情形时未对调用方的特权状态进行校验，普通权限的非安全世界代码触发的 SVC 仍会被路由到 secure_context.c 中的 SecureContext_FreeContext；该清理函数又仅以 pvTaskHandle 字段做归属比对，未结合 PSPLIM 拒绝释放当前仍在运行的 secure context，本地普通权限用户可借此释放仍被活跃任务引用的 secure-world 栈内存，形成 use-after-free。\n修复版本中通过 vPortSVCHandler_C 在 portSVC_FREE_SECURE_CONTEXT（以及顺带加固的 portSVC_START_SCHEDULER）分支上加入对 ulPC 是否落入 __privileged_functions_start__ / __privileged_functions_end__ 区间内的校验，仅当 SVC 来自特权代码时才允许执行 SecureContext_FreeContext 与调度器启动流程；与此同时 SecureContext_FreeContext 读取 PSPLIM 并拒绝释放当前仍在 PSPLIM 中的 secure context，pvTaskHandle 仅作为额外的归属比对。", "effects": [{"comp_name": "FreeRTOS-Kernel", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,11.3.1)", "min_fixed_version": "11.3.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "UAF", "kind_en": "免费后使用", "last_modified_time": "2026-08-22", "level": "High", "mps_id": "MPS-6rsq-gfv3", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-6rsq-gfv3", "name": "https://www.oscs1024.com/hd/MPS-6rsq-gfv3"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-77235", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-77235"}, {"url": "https://aws.amazon.com/security/security-bulletins/2026-086-aws/", "name": ""}, {"url": "https://github.com/FreeRTOS/FreeRTOS-Kernel/releases/tag/V11.3.1", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "FreeRTOS-内核 ARMv8-M 安全上下文清理 SVC 处理程序缺少权限验证", "_translated": true, "_saved_at": "2026-08-21T19:21:09+00:00", "_first_saved_at": "2026-08-21T19:21:09+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-6rsq-gfv3"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-77236", "cvss": {"cvssv31": [{"source": "ff89ba41-3aa1-4d27-914a-91399e9639e5", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:C/C:N/I:L/A:H", "severity": "high", "base_score": 7.3}], "cvssv4": [{"source": "ff89ba41-3aa1-4d27-914a-91399e9639e5", "vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:N/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.3}]}, "cvss_score": 8.3, "cvss_vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:N/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-787", "description": "FreeRTOS-Kernel 是由 Amazon 维护并以 MIT 协议开源的实时操作系统内核，其 ARMv8-M 端口基于 TrustZone-M 在安全世界（Secure World）和非安全世界（Normal World）之间提供隔离与上下文切换能力，安全世界使用 secure_context 数组分配任务私有栈。\n受影响版本中，secure_context.c 中的 SecureContext_AllocateContext 在收到来自非安全世界传入的 ulSecureStackSize 后，未对该参数执行任何最小值或上溢检查便直接调用 pvPortMalloc( ulSecureStackSize + securecontextSTACK_SEAL_SIZE )，随后在堆内存外的 pucStackMemory + ulSecureStackSize 处写入两段 32 位栈封印值，并在 CONTROL 寄存器字写入阶段越过分配边界。非安全任务通过 portALLOCATE_SECURE_CONTEXT 宏展开的 vPortAllocateSecureContext 触发 SVC，把任意小尺寸的 ulSecureStackSize 传入安全世界即可触发安全世界堆元数据的越界写入，影响 TrustZone-M 隔离。\n修复版本中通过在 pvPortMalloc 之前新增 ulSecureStackSize \u003c securecontextSTACK_SEAL_SIZE 与 ulSecureStackSize \u003e UINT32_MAX - securecontextSTACK_SEAL_SIZE 两项边界校验，拒绝过小或会与封印尺寸相加产生整数溢出的请求，使 pucStackMemory 保持为 NULL 并由调用路径 configASSERT 失败，终止了越界写入路径，同时 FreeContext 路径补充了 pucStackLimit 校验以修复相关使用后释放问题。", "effects": [{"comp_name": "amazon:freertos-kernel", "ecosystem": "linux", "versions": [{"affected_version": "[10.2.0,11.3.1)", "min_fixed_version": "11.3.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-08-22", "level": "High", "mps_id": "MPS-cxhq-3lue", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-cxhq-3lue", "name": "https://www.oscs1024.com/hd/MPS-cxhq-3lue"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-77236", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-77236"}, {"url": "https://aws.amazon.com/security/security-bulletins/2026-086-aws/", "name": ""}, {"url": "https://github.com/FreeRTOS/FreeRTOS-Kernel/releases/tag/V11.3.1", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "FreeRTOS-Kernel 安全上下文分配最小尺寸校验缺失", "_translated": true, "_saved_at": "2026-08-21T19:21:13+00:00", "_first_saved_at": "2026-08-21T19:21:13+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-cxhq-3lue"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-48106", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:N/VI:H/VA:N/SC:N/SI:H/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.3}]}, "cvss_score": 8.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:N/VI:H/VA:N/SC:N/SI:H/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-924", "description": "A VE-2026-22681", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-22681"}, {"url": "https://github.com/volcengine/OpenViking/commit/41e345896d247e43ab78bbcb38b4a5b1b38ef62c", "name": ""}, {"url": "https://github.com/volcengine/OpenViking/pull/1133", "name": ""}, {"url": "https://github.com/volcengine/OpenViking/releases/tag/v0.3.4", "name": ""}, {"url": "https://www.vulncheck.com/advisories/openviking-ssrf-via-api-v1-resources", "name": ""}], "scope_influence": "", "tags": ["AI", "python", "开源"], "title": "OpenViking /api/v1/resources 端点 SSRF 漏洞", "_translated": true, "_saved_at": "2026-08-21T17:22:40+00:00", "_first_saved_at": "2026-08-21T17:22:40+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-v9rq-hpg3"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-76876", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "medium", "base_score": 5.9}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:H/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.2}]}, "cvss_score": 8.2, "cvss_vector": "CVSS:4.0/AV:N/AC:H/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-862", "description": "Craftplan 是基于 Phoenix 框架与 Ash 资源构建、业务流程覆盖精酿啤酒及小型作坊生产订单库存 CRM 的开源 Web 应用，采用 AGPL-3.0 协议，通过 AshJsonApi 把设置、目录、订单等资源暴露为 JSON:API。\n受影响版本中，Ash 资源 Craftplan.Settings.Settings 在 policies 块为 action_type(:read) 配置了无条件的 authorize_if always() 授权分支，并把 settings JSON:API 资源 routes 下的 read :get 动作绑定为对外的 GET /api/json/settings/:id 端点；同一资源又把 smtp_password、email_api_key、email_api_secret 三个 EncryptedBinary 属性的 public? 声明为 true，使其随序列化结果写入响应体，导致任意未认证攻击者使用一个有效的设置记录 ID 通过该 GET 端点即可越过身份校验读取 SMTP 密码、邮件 API 密钥与邮件 API 密钥明文，构成 CWE-862 缺失授权并造成敏感凭据泄露。\n修复版本中通过把对外 JSON:API 读取动作由 :get 重命名为 :api_get，并追加 policy action(:api_get) do authorize_if expr(^actor(:role) in [:admin, :staff]) end 的角色限权策略，同时把原 :get 降级为 public? false 的内部读取动作 bypass、并把 smtp_password、email_api_key、email_api_secret 三个属性的 public? 全部改为 false，使 GET /api/json/settings/:id 仅在认证 actor 角色为 admin 或 staff 时返回对应记录且凭据字段不再序列化输出。", "effects": [{"comp_name": "puemos/craftplan", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,0.5.1)", "min_fixed_version": "0.5.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-08-22", "level": "High", "mps_id": "MPS-enru-ci0q", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-enru-ci0q", "name": "https://www.oscs1024.com/hd/MPS-enru-ci0q"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-76876", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-76876"}, {"url": "https://github.com/puemos/craftplan/commit/317acd584b68887f592dc3b97f47703dd63b1bf", "name": ""}, {"url": "https://github.com/puemos/craftplan/releases/tag/v0.5.1", "name": ""}, {"url": "https://www.vulncheck.com/advisories/craftplan-broken-access-control-information-disclosure-via-settings-api", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Craftplan 设置资源授权绕过漏洞", "_translated": true, "_saved_at": "2026-08-21T21:17:54+00:00", "_first_saved_at": "2026-08-21T21:17:54+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-enru-ci0q"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-77237", "cvss": {"cvssv31": [{"source": "ff89ba41-3aa1-4d27-914a-91399e9639e5", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:C/C:H/I:N/A:N", "severity": "medium", "base_score": 6.5}], "cvssv4": [{"source": "ff89ba41-3aa1-4d27-914a-91399e9639e5", "vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:H/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.2}]}, "cvss_score": 8.2, "cvss_vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:H/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-843", "description": "FreeRTOS-Kernel 是开源的 C 语言实时操作系统内核，为 FreeRTOS 提供任务调度、队列与信号量原语；其中 queue set 机制（xQueueAddToSet / xQueueRemoveFromSet）允许任务将多个队列与信号量聚合为一个集合统一等待。\n受影响版本中，在启用 MPU 的移植端口上，xQueueAddToSet() 在将 QueueHandle_t 加入 QueueSetHandle_t 时缺少对入队对象 ucQueueType 与既有集合成员 ucQueueType 的一致性校验。当 configUSE_QUEUE_SETS 被设置为 1 时，未特权任务可向 queue set 投递与现有成员类型不一致的对象，借助类型不匹配绕过 MPU 边界，将不可读的特权内核内存以跨边界方式暴露给未特权上下文读取。\n修复版本中通过在 xQueueAddToSet() 中加入 ucQueueType 与已存在集合成员 ucQueueType 的严格一致性比对，仅允许类型完全匹配的队列对象加入 queue set，从而切断未特权任务借由类型错配越权读取特权内核内存的路径。", "effects": [{"comp_name": "freertos-kernel", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,11.3.1)", "min_fixed_version": "11.3.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "使用不兼容类型访问资源（类型混淆）", "kind_en": "使用不兼容类型访问资源（“类型混淆”）", "last_modified_time": "2026-08-22", "level": "High", "mps_id": "MPS-jsgh-wn46", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-jsgh-wn46", "name": "https://www.oscs1024.com/hd/MPS-jsgh-wn46"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-77237", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-77237"}, {"url": "https://aws.amazon.com/security/security-bulletins/2026-086-aws/", "name": ""}, {"url": "https://github.com/FreeRTOS/FreeRTOS-Kernel/tree/11.3.1", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "FreeRTOS-Kernel xQueueAddToSet 类型校验缺失导致特权内核内存越权读取漏洞", "_translated": true, "_saved_at": "2026-08-21T19:21:12+00:00", "_first_saved_at": "2026-08-21T19:21:12+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-jsgh-wn46"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-54682", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:C/C:H/I:H/A:N", "severity": "high", "base_score": 8.2}]}, "cvss_score": 8.2, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:C/C:H/I:H/A:N", "cwe": "CWE-79", "description": "DiscordChatExporter 是 Tyrrrz 开源的 .NET 命令行工具，用于将 Discord 频道聊天记录导出为本地 HTML、TXT 或 JSON 文件。\n受影响版本中，DiscordChatExporter.Core/Exporting/MessageGroupTemplate.cshtml 内的 FormatMarkdownAsync 与 FormatEmbedMarkdownAsync 在 ShouldFormatMarkdown 为 false 的导出路径下，直接返回原始字符串并经 Html.Raw 输出，未对 message.Content、message.ForwardedMessage.Content、message.ReferencedMessage.Content、embed.Title、embed.Description、field.Name、field.Value 等 Discord 字段做 HTML 实体编码。攻击者借助 Discord Webhook 或 Bot 在这些字段中植入脚本载荷，受害用户以关闭 Markdown 格式化的方式导出频道后，本地生成的 HTML 文件即包含未转义脚本，在浏览器中打开时执行读取导出文件或篡改显示内容。\n修复版本中通过将上述两个辅助方法的返回类型改为 RazorBlade.IEncodedContent，并在 ShouldFormatMarkdown 为 false 的分支显式调用 Html.Encode(markdown) 后再用 Html.Raw 包裹输出，确保攻击者可控字段在写入 HTML 前完成实体编码；PreambleTemplate.cshtml 中的 FormatMarkdownAsync 与 Context.Request.Channel.Topic 渲染路径同时按相同方式修正，切断未转义脚本进入导出产物的链路。", "effects": [{"comp_name": "DiscordChatExporter", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.47.2)", "min_fixed_version": "2.47.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-08-22", "level": "High", "mps_id": "MPS-q8dk-25ap", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-q8dk-25ap", "name": "https://www.oscs1024.com/hd/MPS-q8dk-25ap"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-54682", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-54682"}, {"url": "https://github.com/Tyrrrz/DiscordChatExporter/commit/5632d6c3867d2f79cba9578056c98caee4377c1b", "name": ""}, {"url": "https://github.com/Tyrrrz/DiscordChatExporter/pull/1545", "name": ""}, {"url": "https://github.com/Tyrrrz/DiscordChatExporter/releases/tag/2.47.2", "name": ""}, {"url": "https://github.com/Tyrrrz/DiscordChatExporter/security/advisories/GHSA-8qrv-mmch-fr9c", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "DiscordChatExporter导出HTML脚本注入漏洞", "_translated": true, "_saved_at": "2026-08-21T20:18:49+00:00", "_first_saved_at": "2026-08-21T20:18:49+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-q8dk-25ap"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-76793", "cvss": {}, "cvss_score": 8.1, "cvss_vector": "", "cwe": "CWE-287", "description": "Firebase Authentication 是由 miniOrange 提供的 WordPress 插件，用于使用 Firebase 用户凭证或社交登录接入 WordPress 站点登录流程；该插件以闭源形式分发，源码未公开。\n受影响版本中，插件在用 Firebase 身份令牌完成 WordPress 登录时，未要求令牌中携带的 email 字段经过验证，便直接按该 email 匹配本地 WordPress 账户并签发登录会话，使未认证攻击者可以提交携带任意 email 的自签 Firebase 令牌接管站点任意账户，包括管理员。\n修复版本中通过收紧对 Firebase 令牌 email 字段的校验，强制要求 email 已验证后再建立 WordPress 会话，从而切断未认证攻击者凭任意 email 接管账户的链路，官方修复版本为 1.7.1。", "effects": [{"comp_name": "firebase-authentication", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.7.1)", "min_fixed_version": "1.7.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "身份验证不当", "kind_en": "认证不当", "last_modified_time": "2026-08-22", "level": "High", "mps_id": "MPS-3m8f-ar92", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-3m8f-ar92", "name": "https://www.oscs1024.com/hd/MPS-3m8f-ar92"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-76793", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-76793"}, {"url": "https://wpscan.com/vulnerability/0414ef2b-0d97-41c7-9146-f31ace8b66b2/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Firebase Authentication 插件账户接管漏洞", "_translated": true, "_saved_at": "2026-08-22T11:15:29+00:00", "_first_saved_at": "2026-08-22T07:26:07+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-3m8f-ar92"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-19222", "cvss": {}, "cvss_score": 8, "cvss_vector": "", "cwe": "CWE-269", "description": "Forminator Forms 是开源 WordPress 表单插件，提供联系、调查、支付与注册等表单的构建能力。\n受影响版本中，插件对注册表单所声明的角色限制未能一致强制执行，具备表单构建权限的认证用户（如 Subscriber 及以上角色）可配置一个将 administrator 角色赋予注册者的注册表单，任何访问者通过该表单注册后都会被授予 WordPress 管理员权限。\n修复版本中通过收紧注册表单角色限制的校验逻辑，确保所配置的角色在用户提交时不会被绕过并把未授权访问者静默提权为管理员。", "effects": [{"comp_name": "forminator", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.57.0.7)", "min_fixed_version": "1.57.0.7", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-08-22", "level": "High", "mps_id": "MPS-kego-4fv8", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-kego-4fv8", "name": "https://www.oscs1024.com/hd/MPS-kego-4fv8"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-19222", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-19222"}, {"url": "https://wpscan.com/vulnerability/bb3997c6-4d9a-46f6-85d7-d472dfc00829/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Forminator Forms权限提升漏洞", "_translated": true, "_saved_at": "2026-08-22T11:15:26+00:00", "_first_saved_at": "2026-08-22T07:26:03+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-kego-4fv8"}, {"analysis_status": 0, "articles": [], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-49360", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:L/VI:L/VA:L/SC:L/SI:H/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:L/VI:L/VA:L/SC:L/SI:H/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-73", "description": "Recce 是开源的 dbt 项目评审与影响分析平台，其内嵌 HTTP 服务在 DuckDB 适配器下未对 query run API 强制认证，远程未授权攻击者可借此向 DuckDB 连接提交任意 SQL 并借助 read_csv、read_parquet、COPY TO 等文件系统原语对 Recce 进程可访问的本地文件执行读写，造成本地文件泄露、Recce/dbt 工件与浏览器静态文件被改写（可引发存储型 XSS），若以 root 权限运行则进一步扩大危害。\n受影响版本中，Recce 服务以默认配置（OSS 服务器不强制认证）将 /runs 系列查询接口直接暴露给网络，submit_run/create_task 触发 QueryTask.execute_dbt()，在 recce/tasks/query.py QueryMixin.execute_sql_with_limit 中通过 default_context().adapter.execute() 把用户 SQL 模板透传到 dbt-duckdb 连接；DbtAdapter.load() 仅执行 load_artifacts() 而未对 DuckDB 启用外部访问沙箱，使 attack vector 中的 read_csv('/etc/passwd')、COPY (SELECT '') TO '/srv/static/app.js' 等语句能够在 Recce 进程身份下落地执行，实现任意文件读、文件写、以及对前端的存储型 XSS 植入。\n修复版本中通过在 DbtAdapter 的 load() 流程中 load_artifacts() 之后新增对新增私有方法 _apply_duckdb_sandbox() 的调用，并在该方法内对 target_type 为 duckdb 的连接执行 SET enable_external_access = false，从而拦截 read_csv、read_parquet、COPY TO、httpfs 与 INSTALL/LOAD 等社区扩展操作；与此同时在 DbtAdapter 中新增默认值为 False 的 unsafe_sql 属性作为显式退出开关，并由新增 CLI 参数 --unsafe-sql 在服务器端向下游传递该标记，测试辅助类 DbtTestHelper 则以 unsafe_sql=True 加载以规避对 python_scan_all_frames 的回归影响。", "effects": [{"comp_name": "recce", "ecosystem": "pip", "versions": [{"affected_version": "(-∞,1.50.0)", "min_fixed_version": "1.50.0", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "文件名或路径的外部可控制", "kind_en": "文件名或路径的外部控制", "last_modified_time": "2026-08-22", "level": "High", "mps_id": "MPS-3jx1-6kmy", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://github.com/DataRecce/recce/security/advisories/GHSA-rh62-j648-g5qc", "name": ""}, {"url": "https://github.com/DataRecce/recce/releases/tag/v1.50.0", "name": ""}, {"url": "https://github.com/advisories/GHSA-rh62-j648-g5qc", "name": ""}], "scope_influence": "", "tags": ["python", "开源"], "title": "Recce query run API 未授权 DuckDB SQL 执行导致本地文件读写漏洞", "_translated": true, "_saved_at": "2026-08-22T04:27:06+00:00", "_first_saved_at": "2026-08-22T00:53:27+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-3jx1-6kmy"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "attack_vector_type": "Local", "cnvd_id": "", "cve_id": "CVE-2026-74580", "cvss": {}, "cvss_score": 7.8, "cvss_vector": "", "cwe": "CWE-787", "description": "Linux kernel 是开源操作系统内核，其 vhost 子系统为用户态进程（如 QEMU）管理 virtqueue 并执行 device IOTLB 翻译，是 KVM 半虚拟化 I/O 路径的核心组件。\n受影响版本中，drivers/vhost/vhost.c 的 vhost_vring_set_num_addr 在响应 VHOST_SET_VRING_ADDR 与 VHOST_SET_VRING_NUM 两个 ioctl 时未把 vq-\u003emeta_iotlb[] 缓存清空。当目标 virtqueue 已挂载 device IOTLB、处于 live 状态时，用户态后续重新下发新的 desc/avail/used 基地址或新的 vring 尺寸后，iotlb_access_ok() 仍以旧缓存命中直接返回 true，跳过对新地址的 iotlb_access_ok 慢路径校验；vhost_vq_meta_fetch() 用陈旧 vhost_iotlb_map 执行 map-\u003eaddr + addr - map-\u003estart，得到的目标地址已不再落在当前 IOTLB 实际映射范围。后续 used ring 更新或 desc 取指路径上的 vhost_copy_to_user() 与 vhost_copy_from_user() 会进一步将该地址交给 __copy_to_user() / __copy_from_user()，访问映射外的主机内核内存。\n修复版本中通过在 vhost_vring_set_num_addr 解锁 vq-\u003emutex 之前增加 __vhost_vq_meta_reset(vq)，使得 vq-\u003emeta_iotlb[] 中缓存的 vhost_iotlb_map 全部失效；后续 iotlb_access_ok() 必须重新走慢路径，针对当前真实 IOTLB 映射重新校验，禁止使用 vring 重新配置前残留的陈旧映射，从而切断越界复制链路。", "effects": [{"comp_name": "linux_kernel", "ecosystem": "linux", "versions": [{"affected_version": "[4.11,5.10.265)", "min_fixed_version": "5.10.265", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.7-rc1,6.12.104)", "min_fixed_version": "6.12.104", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.2-rc1,6.6.152)", "min_fixed_version": "6.6.152", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[7.2-rc1,7.2)", "min_fixed_version": "7.2", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[5.16-rc1,6.1.183)", "min_fixed_version": "6.1.183", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.19-rc1,7.1.9)", "min_fixed_version": "7.1.9", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[5.11-rc1,5.15.216)", "min_fixed_version": "5.15.216", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.13-rc1,6.18.45)", "min_fixed_version": "6.18.45", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_require 序列化过程中注入恶意数据，将恶意代码作为一个数据流传递给程序，从而实现代码执行的目的。\n", "title": "反序列化常见的攻击方式"}, {"content": "- 不信任输入数据：程序应该严格检查输入数据的有效性，并避免使用不受信任的数据。\n- 使用安全的序列化机制：程序应该使用安全的序列化机制，如 JSON 或 XML 序列化，而不是第三方序列化库。\n- 最小特权原则：程序应该限制对受信任数据的处理权限，并避免在运行时修改数据。\n- 代码审查和漏洞扫描：程序应该进行代码审查和漏洞扫描，以发现和修复潜在的安全漏洞。\n", "title": "如何预防反序列化"}], "cnvd_id": "", "cve_id": "CVE-2026-54071", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "cwe": "CWE-502", "description": "BabelDOC 是 funstory-ai 开发的开源 Python PDF 翻译库，它内嵌的 pdfminer CMap 加载模块对 PDF 字体字典中的 /Encoding 或 /CMapName 名称仅做 NUL 字节剥离就拼成文件路径并直接调用 pickle.loads 反序列化其内容，攻击者只需在构造的 PDF 中使用 #xx 十六进制把 /Encoding 编码为以 '/' 开头的绝对路径即可让 BabelDOC 加载并反序列化任意攻击者可控的 .pickle.gz 文件，从而以 BabelDOC 进程权限执行任意 Python 代码。\n受影响版本中，BabelDOC ≤ 0.6.2（artifact: BabelDOC，repository: pip，language: python）的 babeldoc/pdfminer/cmapdb.py 文件 CMapDB._load_data() 方法先对 PDF 控制的 name 字符串执行 name.replace(\"\\0\", \"\") 仅去除 NUL 字节，然后以 \"%s.pickle.gz\" % name 拼接出 filename，再依次在 cmap_paths = (os.environ.get(\"CMAP_PATH\", \"/usr/share/pdfminer/\"), os.path.join(os.path.dirname(__file__), \"cmap\")) 两个目录下用 os.path.join(directory, filename) 构造路径，当 PDF 字体字典的 /Encoding 使用 #2F 等十六进制解码出以 '/' 开头的绝对路径时 os.path.join 直接丢弃前者返回绝对路径本身并执行 gzip.open(path) + pickle.loads(gzfile.read())，从而触发 CWE-502 不受信任数据反序列化漏洞，以 BabelDOC 进程权限实现任意代码执行。\n修复版本中通过 BabelDOC 0.6.3（fix commit: 28f784ca6b437dbba040bfd9c67110373cd0924b）的 babeldoc/pdfminer/cmapdb.py 文件 CMapDB._load_data() 与新增的 babeldoc/format/pdf/new_parser/runtime/cmap_secure_loader.py 文件 load_verified_cmap_data() 切断上述反序列化路径：CMapDB._load_data 不再基于 PDF 控制字符串拼接并访问外部 cmap 目录，而是把清理 NUL 后的 name 传入 load_verified_cmap_data，该函数先以 _cmap_manifest_data.CMAP_MANIFEST 对文件名进行精确白名单校验，再通过 (BUNDLED_CMAP_DIR / filename).resolve() 与 path.parent == BUNDLED_CMAP_DIR 做目录包含检查，最后对压缩后的 .gz 字节计算 hashlib.sha256 并与白名单中固定的 SHA-256 与 size 逐项比对，CMAP_PATH 环境变量与外部 cmap 搜索目录被完全移除，任何一项校验失败即抛出 CMapIntegrityError 并被上层映射为 CMapNotFound，pickle.loads 永远不会触达未通过完整性校验的字节流，从根本上切断 PDF 控制的 pickle 反序列化利用路径。", "effects": [{"comp_name": "BabelDOC", "ecosystem": "pip", "versions": [{"affected_version": "[0,0.6.3)", "min_fixed_version": "0.6.3", "repository": "pip", "solutions": [], "upstream": true}]}, {"comp_name": "babeldoc", "ecosystem": "pip", "versions": [{"affected_version": "(-∞,0.6.3)", "min_fixed_version": "0.6.3", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "反序列化", "kind_en": "不可信数据的反序列化", "last_modified_time": "2026-07-14", "level": "High", "mps_id": "MPS-v670-p3ko", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://github.com/funstory-ai/BabelDOC/security/advisories/GHSA-m8gf-v64p-gfmg", "name": ""}, {"url": "https://github.com/advisories/GHSA-m8gf-v64p-gfmg", "name": ""}], "scope_influence": "", "tags": ["python", "开源"], "title": "BabelDOC CMap Pickle 反序列化任意代码执行漏洞", "_translated": true, "_saved_at": "2026-08-21T20:18:51+00:00", "_first_saved_at": "2026-08-21T20:18:51+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-v670-p3ko"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "attack_vector_type": "Local", "cnvd_id": "", "cve_id": "CVE-2026-74583", "cvss": {}, "cvss_score": 7.8, "cvss_vector": "", "cwe": "CWE-416", "description": "Linux 内核是开源操作系统核心，net/sched 子系统提供基于路由的流量分类能力，其中 cls_route (route4) 分类器通过 16 槽 fastmap 缓存按 (id, iif) 索引已命中的 struct route4_filter 指针以加速后续分类。\n受影响版本中，route4_classify 在 RCU 读侧查找 filter 后通过 route4_set_fastmap 将其写入 fastmap，而 route4_delete、route4_change 与 route4_destroy 仅在调用 route4_reset_fastmap 清空 fastmap 之后再通过 tcf_queue_work / kfree_rcu 释放 filter。由于清空与写回之间没有同步，读者在 reset 之后、kfree 之前把即将释放的 filter 重新写回 fastmap，后续命中同一 (id, iif) 的数据包会从 fastmap 读取已被释放的 route4_filter 并解引用 f-\u003eres，触发 KASAN 报告的 slab use-after-free。\n修复版本中通过在 struct route4_filter 增加 dying 布尔字段，并在 route4_destroy、route4_delete、route4_change 调用 route4_reset_fastmap 前于 fastmap_lock 内将该 filter 标记为 dying，同时让 route4_set_fastmap 在写回 fastmap 前跳过 dying 的 filter，从而切断释放后引用路径。", "effects": [{"comp_name": "linux_kernel", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,47d7f7051253bdc02b1d245d87e38f16d31a74df)", "min_fixed_version": "47d7f7051253bdc02b1d245d87e38f16d31a74df", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "UAF", "kind_en": "免费后使用", "last_modified_time": "2026-08-22", "level": "High", "mps_id": "MPS-wn5d-mz1h", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-wn5d-mz1h", "name": "https://www.oscs1024.com/hd/MPS-wn5d-mz1h"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-74583", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-74583"}, {"url": "https://git.kernel.org/stable/c/0e7a8cf8895b06d07c7311f028eba16ad742b9bc", "name": ""}, {"url": "https://git.kernel.org/stable/c/47d7f7051253bdc02b1d245d87e38f16d31a74df", "name AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-476", "description": "kin-openapi 是开源的 Go 语言 OpenAPI 解析与校验库，提供 routers、openapi3filter 等用于 HTTP 请求的 schema 校验与错误渲染能力。\n受影响版本中，openapi3filter.convertParseError 函数（位于 openapi3filter/validation_error_encoder.go）在处理 multipart/form-data 请求体解析错误时，访问 e.Parameter.In 前未判空。当某个标量表单字段（如声明为 integer 的 age）提交了无法解析的值时，multipart 解码器会在 req_resp_decoder.go 中将一个 *ParseError 嵌套进外层 *ParseError，最终形成的 *RequestError 同时满足 e.Parameter 为 nil 与 innerErr.Cause 为 *ParseError 两个条件，ConvertErrors 与 ValidationErrorEncoder 路径因此触发对 nil 指针的字段解引用，请求处理 goroutine 发生 panic。\n修复版本中通过在 convertParseError 的 query 分支补上 e.Parameter != nil 判空守卫修复该问题，确保 e.Parameter 为 nil 时直接走回退分支返回 Status 400 的 ValidationError，并补充对 Title 为空场景的回退处理，避免再因同一根因发生空指针解引用。", "effects": [{"comp_name": "github.com/getkin/kin-openapi", "ecosystem": "go", "versions": [{"affected_version": "[0.10.0,0.141.0)", "min_fixed_version": "0.141.0", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "空指针取消引用", "kind_en": "空指针取消引用", "last_modified_time": "2026-08-22", "level": "High", "mps_id": "MPS-62tu-w4n1", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://github.com/getkin/kin-openapi/security/advisories/GHSA-mmfr-pmjx-hw9w", "name": ""}, {"url": "https://github.com/getkin/kin-openapi/commit/1d0a337c9b1570fab283be8a04c8af6e43b9a22c", "name": ""}, {"url": "https://github.com/getkin/kin-openapi/releases/tag/v0.141.0", "name": ""}, {"url": "https://github.com/advisories/GHSA-mmfr-pmjx-hw9w", "name": ""}], "scope_influence": "", "tags": ["go"], "title": "kin-openapi openapi3filter ConvertErrors 空指针解引用拒绝服务漏洞", "_translated": true, "_saved_at": "2026-08-21T22:17:19+00:00", "_first_saved_at": "2026-08-21T22:17:19+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-62tu-w4n1"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-74581", "cvss": {}, "cvss_score": 7.5, "cvss_vector": "", "cwe": "CWE-416", "description": "Linux kernel 是开源操作系统内核，其 IPv6 子系统 net/ipv6 负责处理 IPv6 路由与转发逻辑。\n受影响版本中，net/ipv6/fib6_rules.c 的 fib6_rule_suppress 函数通过 ip6_rt_put_flags 释放被抑制路由后，未清空结构体 fib6_rule_result 中的 res-\u003ert6 指针，导致其继续指向已释放的 rt6_info。若后续 fib6_rule_lookup 没有遇到可替换的规则，返回的 res.rt6 仍是已释放的 dst，下游 rt6_lookup 再次 dst_release 时将触发 rcuref_put_slowpath 的释放后重用，可能造成内核崩溃或进一步内存破坏。该问题由 cdef485217d3（ipv6: fix memory leak in fib6_rule_suppress，2021-11 引入）造成，常见触发条件是 IPv6 nftables fib 规则与 suppress_prefix 路由规则同时存在（wg-quick 等 VPN 工具会自动建立这种组合）。\n修复版本中通过在 net/ipv6/fib6_rules.c 的 suppress_route 分支中 ip6_rt_put_flags 之后追加 res-\u003ert6 = NULL，使被抑制的 fib6_rule_lookup 直接落回 null dst，避免后续 dst 引用悬空 rt6_info。", "effects": [{"comp_name": "linux_kernel", "ecosystem": "linux", "versions": [{"affected_version": "[5.10.84,5.10.265)", "min_fixed_version": "5.10.265", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[5.4.164,+∞)", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.2-rc1,6.6.151)", "min_fixed_version": "6.6.151", "repository": "unmanaged", "solutions": [ s": [], "upstream": true}, {"affected_version": "[8.0.0,8.0.2)", "min_fixed_version": "8.0.2", "repository": "npm", "solutions": [], "upstream": true}, {"affected_version": "(-∞,7.5.2)", "min_fixed_version": "7.5.2", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "未经控制的递归", "kind_en": "Uncontrolled Recursion", "last_modified_time": "2026-08-22", "level": "High", "mps_id": "MPS-alnv-i6f7", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://github.com/Unleash/unleash/security/advisories/GHSA-r5pq-6chh-j3xp", "name": ""}, {"url": "https://github.com/Unleash/unleash/commit/b0e4da63249a9403bc209e0581db223326cb8dcf", "name": ""}, {"url": "https://github.com/Unleash/unleash/commit/d45f99df924c0d24747b3e45e46fcda7dcd3c1c1", "name": ""}, {"url": "https://github.com/Unleash/unleash/commit/d862562a5ab8f2d1e40f6519c64cf0b4fdaf806d", "name": ""}, {"url": "https://github.com/Unleash/unleash/releases/tag/v7.5.2", "name": ""}, {"url": "https://github.com/Unleash/unleash/releases/tag/v7.6.5", "name": ""}, {"url": "https://github.com/Unleash/unleash/releases/tag/v8.0.2", "name": ""}, {"url": "https://github.com/advisories/GHSA-r5pq-6chh-j3xp", "name": ""}], "scope_influence": "", "tags": ["npm", "开源"], "title": "Unleash 未授权 OpenAPI 校验错误栈耗尽拒绝服务", "_translated": true, "_saved_at": "2026-08-21T20:18:47+00:00", "_first_saved_at": "2026-08-21T20:18:47+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-alnv-i6f7"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，从而导致未授权的用户或资源可以被访问或篡改。", "title": "什么是访问控制不当"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n", "title": "访问控制不当常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防访问控制不当"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-16738", "cvss": {}, "cvss_score": 7.5, "cvss_vector": "", "cwe": "CWE-284", "description": "Conekta Payment Gateway 是面向 WooCommerce 商城的开源支付网关插件，提供墨西哥市场的信用卡、现金、银行转账、BNPL 以及 Apple Pay / Google Pay 钱包等支付方式，其官方源码以 GPLv2 协议通过 WordPress.org 公共 SVN 分发。\n受影响版本中，对外公开的 WooCommerce API 处理器 WC_Conekta_Gateway::check_for_webhook 通过 add_action('woocommerce_api_wc_conekta', ...) 监听 /?wc-api=wc_conekta 端点，接收任意来源的 POST 请求并将 $event = json_decode(file_get_contents('php://input'), true) 直接交给 WC_Conekta_Plugin::handleOrderPaid；该方法从 $event['data']['object'] 取出所谓 Conekta 订单字段并作为支付事实，既未调用 Conekta OrdersApi 重新校验订单与支付状态，也未校验金额/币种、未做幂等去重、未与特定 WooCommerce 订单建立绑定，任意未认证攻击者仅需向该端点发送伪造的 order.paid 事件载荷，即可让插件把任意 WooCommerce 订单标记为已支付。\n修复版本中通过将 handleOrderPaid 改为先调用 fetch_conekta_order 经 OrdersApi::getOrderById 重新拉取订单与支付状态，仅以 API 返回的 verified_order 作为唯一可信事实来源，并新增金额/币种一致性比对、基于 Conekta order id 的 find_paid_order_for_conekta_id 幂等去重以及与目标 WooCommerce 订单的严格绑定，切断伪造 webhook 标记任意订单为已支付的链路。", "effects": [{"comp_name": "conekta-payment-gateway", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,6.2.2)", "min_fixed_version": "6.2.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "访问控制不当", "kind_en": "访问控制不当", "last_modified_time": "2026-08-22", "level": "High", "mps_id": "MPS-avs3-m2o7", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-avs3-m2o7", "name": "https://www.oscs1024.com/hd/MPS-avs3-m2o7"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-16738", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-16738"}, {"url": "https://wpscan.com/vulnerability/89a2917e-032c-4f0f-be44-1a50b9d6fddf/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Conekta 支付网关伪造漏洞", "_translated": true, "_saved_at": "2026-08-22T09:21:21+00:00", "_first_saved_at": "2026-08-22T07:26:10+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-avs3-m2o7"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-54789", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-787", "description": "mod_auth_openidc 是 Apache 2.x HTTP 服务器的 OpenID Certified 身份认证与授权模块，实现 OpenID Connect Relying Party 功能；该项目以 C 语言实现并以 Apache 模块形式加载，开源维护。\n受影响版本中，公开导出的 oidc_state_cookies_clean_expired 函数在请求处理路径上从 r-\u003eheaders_in 读取客户端 Cookie 头、按分号切分为多个 token 后交给内部 oidc_state_cookies_parse_token 解析。该函数使用 while (cookie != NULL \u0026\u0026 *cookie != OIDC_CHAR_EQUAL) 扫描 token 中的等号以分离 cookie 名与值，但 cookie 指针仅被自增、永不重新赋值为 NULL，因此 cookie != NULL 判断恒为真，循环只能靠遇到 '=' 退出。当未认证客户端发送以默认前缀 mod_auth_openidc_state_ 开头但不包含 '=' 的 Cookie token 时，循环会越过 token 缓冲区末端继续在相邻内存中扫描直到偶然命中 '='（越界读，命中未映射页时可导致进程崩溃/拒绝服务），随后在该偏移处写入 '\\0'（攻击者可控位置的一字节越界写）。\n修复版本中通过将扫描条件改为 (*cookie != '\\0' \u0026\u0026 *cookie != OIDC_CHAR_EQUAL)，在到达字符串结束符时即停止扫描；既有的 if (*cookie != OIDC_CHAR_EQUAL) return 0 检查随后可正常拒绝无值 token，从而切断越界读写路径，并补充 test_state_cookies_clean_no_value 回归测试覆盖该输入形态。", "effects": [{"comp_name": "mod_auth_openidc", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.4.19.4)", "min_fixed_version": "2.4.19.4", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-08-22", "level": "High", "mps_id": "MPS-fcvo-x25t", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-fcvo-x25t", "name": "https://www.oscs1024.com/hd/MPS-fcvo-x25t"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-54789", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-54789"}, {"url": "https://github.com/OpenIDC/mod_auth_openidc/commit/8017478471cc071c49aa073c5c9be652a73a8630", "name": ""}, {"url": "https://github.com/OpenIDC/mod_auth_openidc/security/advisories/GHSA-vgr5-qcpp-x2pr", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "mod_auth_openidc 状态 Cookie 解析越界读写漏洞", "_translated": true, "_saved_at": "2026-08-21T18:27:53+00:00", "_first_saved_at": "2026-08-21T17:22:38+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-fcvo-x25t"}, {"analysis_status": 0, "articles": [], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-77781", "cvss": {}, "cvss_score": 7.5, "cvss_vector": "", "cwe": "CWE-248", "description": "Tie::Hash::Regex 是 Perl 语言的开源 CPAN 模块，通过 Perl 内建的 tie 机制提供以正则表达式匹配哈希键的字典实现。\n受影响版本中，FETCH、EXISTS、DELETE 三个 tie 接口方法在将调用方传入的字符串键编译为正则时直接使用 qr/$key/ 而没有 eval 包裹，传入类似单个未闭合方括号等无法被正则引擎解析的键时进程会抛出未捕获异常并 die，调用该 tied 哈希的应用会因不可恢复的异常而中断。\n修复版本中通过新增 _co VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-825", "description": "PDFio 是采用 Apache-2.0 许可的开源 C 语言 PDF 读写库，用于在应用程序中创建、解析和修改 PDF 文档。\n受影响版本中，pdfio-dict.c 的 pdfioDictSetStringf 把 vsnprintf 的格式化结果写入函数栈上的 char buffer[8192]，并将该缓冲区指针直接传给 pdfioDictSetString，而后者仅以 temp.value.string = value 保存指针、不复制字符串内容，字典因此持有指向已退出栈帧的悬垂指针。函数返回后这段栈内存被同线程后续调用或其他线程复用，字典中的字符串值被无声改写，在多线程或请求池部署下导致跨请求、跨租户的文档内容污染。\n修复版本中通过在 pdfioDictSetStringf 内改用 pdfioStringCreate(dict-\u003epdf, buffer)，先把格式化结果复制到 PDF 文件级字符串池再写入字典，使字典持有的字符串生命周期与 pdfio_file_t 保持一致，消除对栈内存的悬垂引用和跨请求内容污染。", "effects": [{"comp_name": "pdfio", "ecosystem": "linux", "versions": [{"affected_version": "[1.0.0,1.6.5)", "min_fixed_version": "1.6.5", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "无效指针解引用", "kind_en": "过期指针取消引用", "last_modified_time": "2026-08-22", "level": "High", "mps_id": "MPS-5wd2-j9bp", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-5wd2-j9bp", "name": "https://www.oscs1024.com/hd/MPS-5wd2-j9bp"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-77220", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-77220"}, {"url": "https://github.com/michaelrsweet/pdfio/commit/22b9afc800c5833f9e851e35938972bd4c76a357", "name": ""}, {"url": "https://github.com/michaelrsweet/pdfio/releases/tag/v1.6.5", "name": ""}, {"url": "https://www.vulncheck.com/advisories/pdfio-dangling-pointer-via-dictionary-string-formatting", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "PDFio字典字符串悬垂指针漏洞", "_translated": true, "_saved_at": "2026-08-21T22:17:22+00:00", "_first_saved_at": "2026-08-21T22:17:22+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-5wd2-j9bp"}, {"analysis_status": 0, "articles": [{"content": "跨站点请求伪造 (CSRF)通过利用网站对用户请求的信任进行攻击。当用户在网站A登录并在同一浏览器会话中访问网站B时，攻击者可以构造特制的请求并诱使用户执行，以使网站B误以为这些请求是用户合法发起的。\n攻击者通常通过欺骗用户点击恶意链接、在受信任的网站中植入恶意代码或通过钓鱼等手段来实施CSRF攻击，一旦用户执行了恶意请求，攻击者可以以用户的身份执行任意操作，包括更改用户密码、发起资金转账或删除重要数据等。", "title": "什么是CSRF"}, {"content": "- 链接欺骗：攻击者通过向用户发送包含恶意链接的电子邮件或社交媒体消息，诱使用户点击并执行恶意请求。\n- 图片引用攻击：攻击者通过在恶意网站上包含指向目标网站的图片引用，以触发用户浏览器自动发送目标网站的请求。\n- XSS利用：如果目标网站存在XSS漏洞，攻击者可以注入恶意脚本，以使用户在浏览器中执行恶意请求。", "title": "CSRF常见的攻击方式"}, {"content": "- 随机令牌：网站可以在每个请求中包含一个随机生成的令牌（CSRF Token），并验证该令牌的有效性，以确认请求的来源是合法的。\n- SameSite Cookie：使用SameSite属性来限制跨站点请求，将Cookie的发送限制在同一站点上，减少了跨站请求伪造的风险。\n- 双重验证：对于敏感操作，网站可以要求用户进行额外的验证，例如输入验证码、提供第二个因素的身份验证等。\n- 强化浏览器策略：网站可以设置Content-Security-Policy（CSP）头，限制浏览器执行恶意脚本的能力，减少CSRF攻击的风险。\n- 限制用户操作：网站可以要求用户在执行敏感操作之前进行明确的确认或授权，防止恶意请求被误触发。\n- 安全编码实践：开发人员应遵循安全编码实践，对用户输入进行适当的验证和过滤，防止恶意请求的注入。", "title": "如何预防CSRF"}], "cnvd_id": "", "cve_id": "CVE-2026-58003", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:L/A:N", "severity": "high", "base_score": 7.1}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:H/VI:L/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:H/VI:L/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-352", "description": "通过提交 9c39d8c8 的 WWBN AVideo 在 releaseVideoNow.json.php 端点中包含跨站点请求伪造漏洞，该端点缺乏真实性检查并接受 GET 请求。攻击者可以制作一个携带管理员会话 cookie 的恶意跨站点 GET 请求，通过操纵 videos_id 参数来永久发布任何禁运视频。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "CSRF", "kind_en": "跨站请求伪造 (CSRF)", "last_modified_time": "2026-08-22", "level"
