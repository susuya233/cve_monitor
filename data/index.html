orEach 触发 applyProcedure 路径绕过并伪造 lambda 状态。这些原语组合后可访问原型 getter、原型链与构造函数，最终经 process.getBuiltinModule('child_process') 启动系统命令，并以宿主进程权限运行。\n修复版本中通过将 applyProcedure 中 proc.arguments.forEach 改为 Array.prototype.forEach.call，将多处 = {} 替换为 Object.create(null)，将 hasOwnProperty 与 for…in 替换为 Object.prototype.hasOwnProperty.call 与 Object.keys，并在 1.8.8 与 2.2.1 中补充回归测试，从而切断原型链污染与 applyProcedure 路径绕过，阻止任意代码执行。", "effects": [{"comp_name": "jsonata", "ecosystem": "npm", "versions": [{"affected_version": "[2.0.0,2.2.1)", "min_fixed_version": "2.2.1", "repository": "npm", "solutions": [], "upstream": true}, {"affected_version": "(-∞,1.8.8)", "min_fixed_version": "1.8.8", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "代码注入", "kind_en": "代码生成控制不当（“代码注入”）", "last_modified_time": "2026-08-22", "level": "Critical", "mps_id": "MPS-8yg9-d57b", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://github.com/jsonata-js/jsonata/security/advisories/GHSA-66mm-25pp-rfff", "name": ""}, {"url": "https://github.com/jsonata-js/jsonata/pull/799", "name": ""}, {"url": "https://github.com/jsonata-js/jsonata/pull/800", "name": ""}, {"url": "https://github.com/jsonata-js/jsonata/pull/802", "name": ""}, {"url": "https://github.com/jsonata-js/jsonata/commit/47c0e58542202c705726663166dbee5fcae47d06", "name": ""}, {"url": "https://github.com/jsonata-js/jsonata/commit/4b217d514376e30cba278941298d7ba97c4a6c6e", "name": ""}, {"url": "https://github.com/jsonata-js/jsonata/commit/59e25144fc3b7125f6befd71b8a6e14e1fa610d2", "name": ""}, {"url": "https://github.com/jsonata-js/jsonata/commit/f09df8416eab8ff44926fc6527c80fb8701de159", "name": ""}, {"url": "https://github.com/jsonata-js/jsonata/commit/f174348c7fa30f271b63ddedf0767e814004bc4d", "name": ""}, {"url": "https://github.com/jsonata-js/jsonata/releases/tag/v1.8.8", "name": ""}, {"url": "https://github.com/jsonata-js/jsonata/releases/tag/v2.2.1", "name": ""}, {"url": "https://github.com/advisories/GHSA-66mm-25pp-rfff", "name": ""}], "scope_influence": "", "tags": ["npm", "开源"], "title": "JSONata表达式任意代码执行漏洞", "_translated": true, "_saved_at": "2026-08-21T22:17:15+00:00", "_first_saved_at": "2026-08-21T22:17:15+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-8yg9-d57b"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-77234", "cvss": {"cvssv31": [{"source": "ff89ba41-3aa1-4d27-914a-91399e9639e5", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}], "cvssv4": [{"source": "ff89ba41-3aa1-4d27-914a-91399e9639e5", "vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-863", "description": "FreeRTOS-Kernel 是开源实时操作系统内核组件，由 AWS 维护并采用 MIT 协议，支持 ARM Cortex-M、RISC-V 等多种架构，提供任务调度、队列、信号量、软件定时器与基于 MPU 的内存隔离能力，常用于嵌入式与 IoT 设备。\n受影响版本中，在启用 MPU wrappers v2 的 ARMv8-M 等非安全端口上，软件定时器 API xTimerDelete 被实现为直接展开为 xTimerGenericCommand 的宏，绕过了本应执行权限校验的 MPU_xTimerDelete 包装函数；MPU wrappers v2 通过内核对象池索引将非特权任务与定时器对象隔离，缺失包装使非特权任务可以直接进入特权上下文完成任意软件定时器命令（包括 tmrCOMMAND_DELETE 之外的命令码），最终在特权内核上下文中获得任意代码执行能力，破坏 MPU 强制任务隔离。\n修复版本中通过 include/mpu_wrappers.h 增加 #define xTimerDelete MPU_xTimerDelete 映射，include/mpu_prototypes.h 增加 MPU_xTimerDelete 原型，include/timers.h 在 MPU wrappers v2 条件下将 xTimerDelete 改为函数原型，并在 portable/Common/mpu_wrappers_v2.c 新增 MPU_xTimerDelete 实现（先校验外部索引并经 MPU_GetTimerHandleAtIndex 取得内部句柄，再以 PRIVILEGED_FUNCTION 方式调用 xTimerGenericCommandFromTask 发送 tmrCOMMAND_DELETE，成功后调用 MPU_SetIndexFreeInKernelObjectPool 释放对象池索引），使非特权任务必须经特权包装函数进入定时器命令路径，从而切断绕过 MPU 隔离的利用链。", "effects": [{"comp_name": "FreeRTOS-Kernel", "ecosystem": "linux", "versions": [{"affected_version": "[7.0.0,11.3.1)", "min_fixed_version": "11.3.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-08-22", "level": "Critical", "mps_id": "MPS-lj24-9q0t", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-lj24-9q0t", "name": "https://www.oscs1024.com/hd/MPS-lj24-9q0t"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-77234", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-77234"}, {"url": "https://aws.amazon.com/security/security-bulletins/2026-086-aws/", "name": ""}, {"url": "https://github.com/FreeRTOS/FreeRTOS-Kernel/releases/tag/V11.3.1", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "FreeRTOS-Kernel MPU授权绕过漏洞", "_translated": true, "_saved_at": "2026-08-21T19:21:10+00:00", "_first_saved_at": "2026-08-21T19:21:10+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-lj24-9q0t"}, {"analysis_status": 0, "articles": [{"content": "应用程序在处理用户输入时的不完善或缺乏验证机制，所以攻击者能够通过向应用程序发送恶意输入，利用应用程序对输入数据的错误处理方式来注入自己的恶意代码。这些恶意代码会被应用程序误认为是合法的指令或数据，并在执行过程中被执行。", "title": "什么是代码注入"}, {"content": "应用程序使用可执行动态代码的函数来执行用户可控的参数，当应用程序对于用户输入过滤不完全时，攻击者可以注入恶意代码并控制代码执行流程。", "title": "代码注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对所有用户输入进行验证和过滤，确保只接受预期的有效输入。这包括对输入数据进行输入长度验证、类型检查和格式验证等。\r\n- 使用参数化查询或预编译语句：对于数据库查询操作，应该使用参数化查询或预编译语句，确保输入数据不会被误认为是执行代码。\r\n- 最小特权原则：应用程序在执行操作系统命令或动态代码时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。\r\n- 安全编码实践：开发人员应该采用安全编码实践，包括避免使用eval函数、避免拼接用户输入的字符串作为代码执行等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止代码注入攻击。", "title": "如何预防代码注入"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-77414", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-94", "description": "JSONata 是一个用 JavaScript 实现的开源 JSON 查询与转换语言，以 `jsonata` 包形式发布在 npm 注册库，常被集成在数据转换、规则引擎以及 LLM 代理工具调用流水线中。\n受影响版本中，`src/jsonata.js` 中由 `createFrame` 创建的环境帧使用普通对象 `var bindings = {}` 存放变量绑定，并通过 `bindings.hasOwnProperty(name)` 判定属性归属。由于该方法本身可被赋值覆盖，且 `bindings` 继承自 `Object.prototype`，攻击者可在 JSONata 表达式内通过 `$hasOwnProperty := $spread($string)`、`$__proto__ := $constructor` 等手法污染 `Object.prototype`，进而沿着原型链触达 `process.getBuiltinModule('child_process').execSync`，以宿主进程权限执行任意系统命令。\n修复版本中通过将 `bindings` 替换为 `Object.create(null)` 创建的无原型对象，并把属性检查改为 `Object.prototype.hasOwnProperty.call(bindings, name)`，从源头切断原型链访问路径，使 `$hasOwnProperty`、原型链遍历和 `$constructor` 等污染手法无法绕过环境帧查找逻辑。", "effects": [{"comp_name": "jsonata", "ecosystem": "npm", "versions": [{"affected_version": "(-∞,1.8.8)", "min_fixed_version": "1.8.8", "repository": "npm", "solutions": [], "upstream": true}, {"affected_version": "[2.0.0,2.2.1)", "min_fixed_version": "2.2.1", "repository": "npm", "solutions": [], "upstream": true}, {"affected_version": "[0,1.8.8)", "min_fixed_version": "1.8.8", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "代码注入", "kind_en": "代码生成控制不当（“代码注入”）", "last_modified_time": "2026-08-22", "level": "Critical", "mps_id": "MPS-ybsg-16z4", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://github.com/jsonata-js/jsonata/security/advisories/GHSA-2943-5xfg-gq5f", "name": ""}, {"url": "https://github.com/jsonata-js/jsonata/pull/799", "name": ""}, {"url": "https://github.com/jsonata-js/jsonata/commit/59e25144fc3b7125f6befd71b8a6e14e1fa610d2", "name": ""}, {"url": "https://github.com/jsonata-js/jsonata/commit/c41ef185136a7b96ca1049c7745a7503b82193de", "name": ""}, {"url": "https://github.com/jsonata-js/jsonata/commit/f09df8416eab8ff44926fc6527c80fb8701de159", "name": ""}, {"url": "https://github.com/jsonata-js/jsonata/releases/tag/v1.8.8", "name": ""}, {"url": "https://github.com/jsonata-js/jsonata/releases/tag/v2.2.1", "name": ""}, {"url": "https://github.com/advisories/GHSA-2943-5xfg-gq5f", "name": ""}], "scope_influence": "", "tags": ["npm", "开源"], "title": "JSONata 表达式原型污染导致任意代码执行", "_translated": true, "_saved_at": "2026-08-21T22:17:13+00:00", "_first_saved_at": "2026-08-21T22:17:13+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ybsg-16z4"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "cnvd_id": "", "cve_id": "CVE-2026-39909", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.1}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:H/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.2}]}, "cvss_score": 9.2, "cvss_vector": "CVSS:4.0/AV:N/AC:H/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-416", "description": "llama.cpp 是开源的 C/C++ 大模型推理引擎，ggml-org 在 GitHub 上以 MIT 协议发布，支持本地与分布式模型推理，属于大模型与机器学习基础设施组件。\n受影响版本中，ggml/src/ggml-rpc/ggml-rpc.cpp 的 RPC 服务器在 rpc_server::free_buffer 直接释放 backend buffer 时，没有同步使 stored_graphs 中缓存的 ggml_cgraph 失效。rpc_server::graph_recompute 从 stored_graphs 取出 graph 后调用 ggml_backend_graph_compute，图中节点仍持有已被 free_buffer 释放的 backend buffer 指针，触发释放后重用。RPC 协议不要求认证，远程攻击者只要能连接 RPC 服务器 TCP 端口，先通过 GRAPH_COMPUTE 写入带 buffer 引用的图，再以 FREE_BUFFER 释放对应 buffer 并用 ALLOC_BUFFER/SET_TENSOR 重塑同一块内存，最后通过 GRAPH_RECOMPUTE 让服务器沿悬空指针执行，可泄漏 libc 地址并劫持 buffer 接口的 vtable，最终实现远程代码执行。\n修复版本中通过在 rpc_server::free_buffer 中按设备遍历 stored_graphs 并将每个 sg.graph 置空，使 cached graph 随引用 buffer 一同失效；之后 graph_recompute 中原有的 nullptr 检查会拒绝该请求，客户端自动回退到 GRAPH_COMPUTE，悬空指针不再进入危险执行路径。", "effects": [{"comp_name": "llama.cpp", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,b8585)", "min_fixed_version": "b8585", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "UAF", "kind_en": "免费后使用", "last_modified_time": "2026-08-22", "level": "Critical", "mps_id": "MPS-ld2x-tp9b", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ld2x-tp9b", "name": "https://www.oscs1024.com/hd/MPS-ld2x-tp9b"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-39909", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-39909"}, {"url": "https://github.com/ggml-org/llama.cpp/commit/389c7d4955ba55c7418afaebf7c23d9ed64ef707", "name": ""}, {"url": "https://github.com/ggml-org/llama.cpp/pull/21175", "name": ""}, {"url": "https://github.com/ggml-org/llama.cpp/releases/tag/b8585", "name": ""}, {"url": "https://www.vulncheck.com/advisories/llama-cpp-use-after-free-in-rpc-graph-recompute-handler", "name": ""}], "scope_influence": "", "tags": ["AI", "应用软件"], "title": "llama.cpp RPC服务器GRAPH_RECOMPUTE处理器释放后重用漏洞", "_translated": true, "_saved_at": "2026-08-21T18:27:48+00:00", "_first_saved_at": "2026-08-21T18:27:48+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ld2x-tp9b"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-75932", "cvss": {"cvssv31": [{"source": "9119a7d8-5eab-497f-8521-727c672e3725", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:L/A:H", "severity": "high", "base_score": 8.6}], "cvssv4": [{"source": "9119a7d8-5eab-497f-8521-727c672e3725", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:L/VI:L/VA:H/SC:H/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.2}]}, "cvss_score": 9.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:L/VI:L/VA:H/SC:H/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-862", "description": "Jet Admin 是 Jet Admin Inc. 提供的无代码业务应用构建与托管 SaaS 平台，用户可在其工作区中创建应用并绑定自有自定义域名对外提供访问。NVD 漏洞标签为 exclusively-hosted-service，表明该缺陷仅存在于官方托管的多租户服务中。\n受影响版本中，Jet Admin 多租户服务在处理用户自定义域名接入请求时缺少对域名归属的授权校验，攻击者可在自己的工作区创建恶意应用并将该应用关联到目标用户的自定义域名，进而修改受害工作区的身份认证配置，将原本应路由到目标应用的流量改写到攻击者控制的应用；一旦恶意应用成功挂载到受害域名，受害工作区中配置的 OAuth Provider 的 Client ID 与 Client Secret 会泄露到攻击者工作区，造成凭据外泄与潜在的进一步账户接管。\n修复版本中通过官方托管服务侧的访问控制强化解决了该问题，对自定义域名与应用工作区之间的绑定操作追加域名所有权校验，并阻断非授权工作区对受害域名身份认证配置的改写与对 OAuth Provider 凭据的拉取；NVD/CVE.org 未披露具体修复版本号，建议所有 Jet Admin SaaS 租户及时关注官方安全通知并按厂商指引复核自定义域名与 OAuth Provider 凭据。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-08-22", "level": "Critical", "mps_id": "MPS-wilm-nr1o", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-wilm-nr1o", "name": "https://www.oscs1024.com/hd/MPS-wilm-nr1o"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-75932", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-75932"}, {"url": "https://raw.githubusercontent.com/cisagov/CSAF/develop/csaf_files/IT/white/2026/va-26-232-02.json", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-75932", "name": ""}, {"url": "https://www.jetadmin.io/", "name": ""}], "scope_influence": "", "tags": [], "title": "Jet Admin 自定义域名授权缺失漏洞", "_translated": true, "_saved_at": "2026-08-21T18:27:49+00:00", "_first_saved_at": "2026-08-21T17:22:33+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-wilm-nr1o"}, {"analysis_status": 0, "articles": [{"content": "- 程序未正确处理用户上传的文件，从而导致程序可以读取、处理或存储未经授权的文件\n", "title": "什么是任意文件上传"}, {"content": "- 欺骗攻击：攻击者可以通过发送伪造的文件来欺骗程序，从而导致程序读取、处理或存储未经授权的文件。\n- 文件格式攻击：攻击者可以通过选择特定的文件格式，例如压缩文件或 ZIP 文件，从而利用上传的文件来篡改程序的执行结果或窃取程序中的重要数据。\n", "title": "任意文件上传常见的攻击方式"}, {"content": "- 使用安全文件传输协议 (FTP):使用安全 FTP 协议可以确保上传的文件格式、大小、权限等符合预期，同时可以防止文件读取、篡改或存储漏洞。\n- 使用文件上传过滤器：使用文件上传过滤器可以过滤上传的文件，以确保文件的格式、大小、权限等符合预期，同时可以防止文件读取、篡改或存储漏洞。\n- 使用白名单机制：使用白名单机制可以只允许特定的文件格式、大小、权限等存在的文件上传，从而防止非法文件的上传和攻击。\n- 定期更新和升级程序：定期更新和升级程序可以修复已知的漏洞，并增强程序的安全性。", "title": "如何预防任意文件上传"}], "cnvd_id": "", "cve_id": "CVE-2026-49849", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.1}]}, "cvss_score": 9.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:C/C:H/I:H/A:H", "cwe": "CWE-434", "description": "xShop 是基于 Laravel 框架开发的一款开源在线商店系统，提供商品、订单、附件等内容管理能力。\n受影响版本中，AttachmentController::attaching 使用未做任何扩展名或 MIME 限制的通用 Request 接收上传文件，并在 save 与父类 XController::storeFile 中以 getClientOriginalName() 直接拼接存储路径，使管理员上传的 .php 等可执行脚本被原样写入 public 磁盘的 attachments 目录，由于该目录可直接被 Web 服务器解析，攻击者通过构造恶意 PHP 文件即可在服务器上获得任意代码执行能力。\n修复版本中通过新增 AttachingRequest 表单请求类并将其绑定到 attaching 方法，对 file 字段强制使用 mimes:png,jpg,svg,mp4,pdf,docx,zip,rar,mp3 等白名单 MIME 与大小上限，从入口处切断可执行脚本上传路径。", "effects": [{"comp_name": "4xmen/xshop", "ecosystem": "composer", "versions": [{"affected_version": "[3.0.3,3.0.4)", "min_fixed_version": "3.0.4", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "任意文件上传", "kind_en": "危险类型文件无限制上传", "last_modified_time": "2026-08-22", "level": "Critical", "mps_id": "MPS-3sh8-xqkz", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-3sh8-xqkz", "name": "https://www.oscs1024.com/hd/MPS-3sh8-xqkz"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-49849", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-49849"}, {"url": "https://github.com/4xmen/xshop/commit/dd4a3add9d6f5b5f9dde9685e97f51057903a1db", "name": ""}, {"url": "https://github.com/4xmen/xshop/pull/64", "name": ""}, {"url": "https://github.com/4xmen/xshop/releases/tag/v3.0.4", "name": ""}, {"url": "https://github.com/4xmen/xshop/security/advisories/GHSA-fc35-qjg3-f6g7", "name": ""}], "scope_influence": "", "tags": ["php", "开源"], "title": "xShop 附件上传未限制文件类型导致远程代码执行漏洞", "_translated": true, "_saved_at": "2026-08-21T23:17:38+00:00", "_first_saved_at": "2026-08-21T23:17:38+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-3sh8-xqkz"}, {"analysis_status": 0, "articles": [{"content": "应用程序在处理用户输入时的不完善或缺乏验证机制，所以攻击者能够通过向应用程序发送恶意输入，利用应用程序对输入数据的错误处理方式来注入自己的恶意代码。这些恶意代码会被应用程序误认为是合法的指令或数据，并在执行过程中被执行。", "title": "什么是代码注入"}, {"content": "应用程序使用可执行动态代码的函数来执行用户可控的参数，当应用程序对于用户输入过滤不完全时，攻击者可以注入恶意代码并控制代码执行流程。", "title": "代码注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对所有用户输入进行验证和过滤，确保只接受预期的有效输入。这包括对输入数据进行输入长度验证、类型检查和格式验证等。\r\n- 使用参数化查询或预编译语句：对于数据库查询操作，应该使用参数化查询或预编译语句，确保输入数据不会被误认为是执行代码。\r\n- 最小特权原则：应用程序在执行操作系统命令或动态代码时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。\r\n- 安全编码实践：开发人员应该采用安全编码实践，包括避免使用eval函数、避免拼接用户输入的字符串作为代码执行等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止代码注入攻击。", "title": "如何预防代码注入"}], "cnvd_id": "", "cve_id": "CVE-2026-62674", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:R/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9}]}, "cvss_score": 9, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:R/S:C/C:H/I:H/A:H", "cwe": "CWE-94", "description": "Omnigent 是开源 AI Agent 框架与元编排层，用于协调多个编码 Agent 协作完成任务，本身属于大模型与 AI Agent 基础设施组件。\n受影响版本中，PUT /sessions/{session_id}/agent 处理器 update_session_agent 仅校验调用者对目标会话具备 LEVEL_EDIT 权限，未拒绝绑定到 agent.session_id 为 None 的共享或模板 Agent。具备会话编辑权限的认证用户可向 omnigent/server/routes/sessions.py 中的 update_session_agent 上传新的 Agent 包（bundle）替换共享 Agent 存储内容，并在其中植入 stdio MCP 服务器配置；后续任何引用该共享 Agent 的会话在加载阶段都会通过 omnigent/tools/mcp.py 的 stdio_client 启动攻击者指定的命令，从而在 Omnigent runner 进程权限下执行任意系统命令，泄露文件、凭据、工作区数据并影响内部服务与 runner 可用性。\n修复版本中通过在 update_session_agent 中复用 session_mcp_servers._editable_agent 已有的守卫，新增 agent.session_id is None 判断并直接以 INVALID_INPUT 拒绝请求，切断认证用户通过 PUT 覆盖共享或模板 Agent 包的路径，使后续会话不再加载被污染的 stdio MCP 配置。", "effects": [{"comp_name": "omnigent", "ecosystem": "pip", "versions": [{"affected_version": "(-∞,0.3.0)", "min_fixed_version": "0.3.0", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "代码注入", "kind_en": "代码生成控制不当（“代码注入”）", "last_modified_time": "2026-08-22", "level": "Critical", "mps_id": "MPS-zrvt-8qye", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-zrvt-8qye", "name": "https://www.oscs1024.com/hd/MPS-zrvt-8qye"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-62674", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-62674"}, {"url": "https://github.com/omnigent-ai/omnigent/commit/25a22dc9e6da4648d23749f0a589e47e6aed991b", "name": ""}, {"url": "https://github.com/omnigent-ai/omnigent/pull/1418", "name": ""}, {"url": "https://github.com/omnigent-ai/omnigent/releases/tag/v0.3.0", "name": ""}, {"url": "https://github.com/omnigent-ai/omnigent/security/advisories/GHSA-jrrm-9hc7-2v3h", "name": ""}], "scope_influence": "", "tags": ["AI", "python", "开源"], "title": "Omnigent 共享 Agent 包覆盖导致远程代码执行漏洞", "_translated": true, "_saved_at": "2026-08-21T19:21:16+00:00", "_first_saved_at": "2026-08-21T19:21:16+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-zrvt-8qye"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2025-30156", "cvss": {}, "cvss_score": 8.9, "cvss_vector": "", "cwe": "CWE-327", "description": "Ceph 是开源分布式存储系统，CephX 是其默认认证协议，用于在 Monitor、OSD、MDS 与 MGR 之间签发并校验服务票据。\n受影响版本中，CephX 用 AES-128-CBC 加密票据却不附加 HMAC，并且固定使用硬编码初始化向量 CEPH_AES_IV（值为 cephsageyudagreg）。相同明文会得到相同密文。持有低权限 CephX 凭据的攻击者可向 Monitor 申请服务票据，对密文做比特翻转以将 AuthCapsInfo.allow_all 改为真，或利用 Monitor 把指定实体名加密成密文块后拼接高权限票据，从而冒充 OSD、MDS、MGR 并扩大集群权限。\n修复版本中通过新增 AES256-CTS-HMAC-SHA384-192（aes256k）密钥类型替换默认 aes 算法，每次加密加入随机 confounder 并用 HMAC-SHA384 校验完整性，密文被篡改后无法通过校验，票据伪造路径被切断。", "effects": [{"comp_name": "ceph", "ecosystem": "linux", "versions": [{"affected_version": "[20.0.0,20.2.4)", "min_fixed_version": "20.2.4", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,19.2.6)", "min_fixed_version": "19.2.6", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "密码算法不安全", "kind_en": "使用损坏或有风险的加密算法", "last_modified_time": "2026-08-20", "level": "High", "mps_id": "MPS-f3ae-72a8", "poc": false, "poc_url": [], "published_time": "2026-08-20", "reference_url_list": [{"url": "https://www.openwall.com/lists/oss-security/2026/08/19/4", "name": ""}, {"url": "https://github.com/ceph/ceph/security/advisories/GHSA-7q3q-3975-qw3q", "name": ""}, {"url": "https://docs.ceph.com/en/latest/security/CVE-2025-30156/", "name": ""}, {"url": "https://github.com/ceph/ceph/releases/tag/v20.2.4", "name": ""}, {"url": "https://github.com/ceph/ceph/releases/tag/v19.2.6", "name": ""}, {"url": "https://github.com/ceph/ceph/commit/3078188a7bdd89e2975280f2a906c71c2f6effd6", "name": ""}, {"url": "https://github.com/ceph/ceph/commit/4f130132f5c5e99099b4d61cb9316eabcbbeb044", "name": ""}, {"url": "https://docs.ceph.com/en/latest/rados/configuration/auth-config-ref/#cephx-upgrade", "name": ""}, {"url": "https://web.mit.edu/tlyu/papers/krb4peril-ndss04.pdf", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "CephX认证绕过漏洞", "_translated": true, "_saved_at": "2026-08-19T19:19:46+00:00", "_first_saved_at": "2026-08-19T19:19:46+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-f3ae-72a8"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-62666", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-862", "description": "Grav API 插件是开源 PHP 组件，以 Composer 包 getgrav/grav-plugin-api 分发，为 Grav CMS 提供 RESTful 接口，允许以无头方式访问站点全部内容。\n受影响版本中，UsersController 的 createApiKey、generate2fa 与 disable2fa 三个面向用户变更的兄弟接口缺少 accessGrantsSuper() 目标校验，调用方仅需通过 requireApiKeyPermission() 或 requirePermission('api.users.write') 校验自身权限即可对持有 access.api.super 的目标账户执行 API key 颁发或 2FA 轮换/禁用。持有 api.users.write 的非超级管理员账户因此可借 createApiKey 把 API key 绑定到超级管理员目标，由于 key 的 scopes 未被强制，最新颁发的 key 实际携带目标账户完整权限，攻击者可借此获得持久化的超级管理员访问；同一缺失的检查还允许其轮换或禁用目标账户的两步验证。\n修复版本中通过在 UsersController 中新增 requireNotSuperTarget() 私有方法，并在 createApiKey、deleteApiKey、generate2fa、disable2fa 入口前置调用，恢复与 create/update/delete 主入口一致的超级管理员目标访问控制：当调用方不是超级管理员而目标账户持有超级权限时抛出 ForbiddenException，自助操作始终放行，从根本上切断非超级账户通过兄弟接口对超级管理员账户提权的路径。", "effects": [{"comp_name": "getgrav/grav-plugin-api", "ecosystem": "composer", "versions": [{"affected_version": "(-∞,1.0.6)", "min_fixed_version": "1.0.6", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-08-20", "level": "High", "mps_id": "MPS-vuo3-kbzi", "poc": false, "poc_url": [], "published_time": "2026-08-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-vuo3-kbzi", "name": "https://www.oscs1024.com/hd/MPS-vuo3-kbzi"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-62666", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-62666"}, {"url": "https://github.com/getgrav/grav-plugin-api/commit/dfcc947f0d6758772caac290c68fe8d4c4a4874e", "name": ""}, {"url": "https://github.com/getgrav/grav-plugin-api/releases/tag/1.0.6", "name": ""}, {"url": "https://github.com/getgrav/grav/security/advisories/GHSA-8gg4-rvvv-cq96", "name": ""}], "scope_ ": [{"url": "https://www.oscs1024.com/hd/MPS-e6cq-i5dp", "name": "https://www.oscs1024.com/hd/MPS-e6cq-i5dp"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-14948", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-14948"}, {"url": "https://www.certvde.com/en/advisories/VDE-2026-078/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "FDS102日志会话劫持", "_translated": true, "_saved_at": "2026-08-20T11:20:31+00:00", "_first_saved_at": "2026-08-20T10:23:03+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-e6cq-i5dp"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-77080", "cvss": {"cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-78", "description": "n8n 是开源的工作流自动化平台，使用 TypeScript 实现，提供可视化节点编辑器与 Snowflake 等大量内置节点；Snowflake 节点直接调用 snowflake-sdk 执行用户填写的 SQL。\n受影响版本中，Snowflake 节点的 Execute Query 操作将用户在节点参数里填写的完整 SQL 文本直接透传给 snowflake-sdk 的 connection.execute 方法，未对 SQL 类型做任何过滤；由于 snowflake-sdk 接受 PUT/GET 文件传输语句并由其内置客户端读取或写入 n8n 进程所在主机上的任意路径，绕过 n8n 自身的文件访问限制，导致已认证用户只要配置了可用的 Snowflake 凭据，就能利用 GET 读取 n8n 主机的本地文件，或利用 PUT 把本地已 staged 的文件覆盖到 n8n 主机上的任意路径。\n修复版本中通过在 GenericFunctions.ts 中新增 stripLeadingComments 与 isFileTransferQuery 工具，并在 execute 函数入口判断 sqlText 是否以 GET 或 PUT 开头；若命中文件传输语句，立即抛出 NodeOperationError 中断执行，从而阻止客户端 PUT/GET 命令进入 snowflake-sdk 的 connection.execute 调用。", "effects": [{"comp_name": "n8n", "ecosystem": "npm", "versions": [{"affected_version": "[0,1.123.69)", "min_fixed_version": "1.123.69", "repository": "npm", "solutions": [], "upstream": true}, {"affected_version": "[2.0.0,2.33.4)", "min_fixed_version": "2.33.4", "repository": "npm", "solutions": [], "upstream": true}, {"affected_version": "[2.34.0,2.34.1)", "min_fixed_version": "2.34.1", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-08-20", "level": "High", "mps_id": "MPS-l2o8-qyn6", "poc": false, "poc_url": [], "published_time": "2026-08-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-l2o8-qyn6", "name": "https://www.oscs1024.com/hd/MPS-l2o8-qyn6"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-77080", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-77080"}, {"url": "https://github.com/n8n-io/n8n/security/advisories/GHSA-r4j2-j3wm-q689", "name": ""}, {"url": "https://www.vulncheck.com/advisories/n8n-before-arbitrary-file-read-and-write-via-snowflake", "name": ""}], "scope_influence": "", "tags": ["npm", "开源"], "title": "n8n Snowflake 节点任意文件读写漏洞", "_translated": true, "_saved_at": "2026-08-20T1 "url": "https://github.com/netty/netty/pull/17213", "name": ""}, {"url": "https://github.com/netty/netty/pull/17217", "name": ""}, {"url": "https://github.com/netty/netty/releases/tag/netty-4.1.137.Final", "name": ""}, {"url": "https://github.com/netty/netty/releases/tag/netty-4.2.17.Final", "name": ""}, {"url": "https://github.com/netty/netty/security/advisories/GHSA-fccg-mwvh-qqg4", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-75596漏洞", "_translated": true, "_saved_at": "2026-08-19T22:18:26+00:00", "_first_saved_at": "2026-08-19T22:18:26+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-pzcu-1tyq"}, {"analysis_status": 0, "articles": [{"content": "应用程序在处理用户输入时的不完善或缺乏验证机制，所以攻击者能够通过向应用程序发送恶意输入，利用应用程序对输入数据的错误处理方式来注入自己的恶意代码。这些恶意代码会被应用程序误认为是合法的指令或数据，并在执行过程中被执行。", "title": "什么是代码注入"}, {"content": "应用程序使用可执行动态代码的函数来执行用户可控的参数，当应用程序对于用户输入过滤不完全时，攻击者可以注入恶意代码并控制代码执行流程。", "title": "代码注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对所有用户输入进行验证和过滤，确保只接受预期的有效输入。这包括对输入数据进行输入长度验证、类型检查和格式验证等。\r\n- 使用参数化查询或预编译语句：对于数据库查询操作，应该使用参数化查询或预编译语句，确保输入数据不会被误认为是执行代码。\r\n- 最小特权原则：应用程序在执行操作系统命令或动态代码时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。\r\n- 安全编码实践：开发人员应该采用安全编码实践，包括避免使用eval函数、避免拼接用户输入的字符串作为代码执行等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止代码注入攻击。", "title": "如何预防代码注入"}], "cnvd_id": "", "cve_id": "CVE-2026-64850", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-94", "description": "Grav 是基于文件的开源 Web 平台，使用 PHP、Markdown、Twig 与 Symfony 构建页面与表单。\n受影响版本中，system/src/Grav/Common/Data/Blueprint.php 中的 Blueprint::dynamicData() 在处理表单字段元数据时，把读取到的 Class::method 提供器连同参数一并送入 call_user_func_array()，未对回调与参数做任何危险函数过滤。持有 admin.pages 或 api.pages.write 权限的账户可以在页面 frontmatter 的 data-*@ 指令里写入形式上像正常 helper 的提供器，例如将 Grav\\Common\\Utils::arrayFilterRecursive 的第一个参数固定为字符串 'system'，再让页面在被访问时由 dynamicData() 经 call_user_func_array 触发 system() 执行任意命令，从而以 Web 服务器用户身份实现远程代码执行。\n修复版本中通过 Blueprint::dynamicData() 在调用 call_user_func_array 之前先执行 isSafeDynamicCall() 与 paramsContainDangerousCallable() 两层校验，既拒绝作为顶层提供器传入的 system、exec、passthru 等危险函数，也递归扫描所有参数，杜绝以 arrayFilterRecursive 一类安全 helper 作为 trampoline 把 'system' 字符串走私进回调的风险，从而切断由此触发的远程命令执行路径。", "effects": [{"comp_name": "getgrav/grav", "ecosystem": "composer", "versions": [{"affected_version": "(-∞,2.0.7)", "min_fixed_version": "2.0.7", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "代码注入", "kind_en": "代码生成控制不当（“代码注入”）", "last_modified_time": "2026-08-20", "level": "High", "mps_id": "MPS-wkfe-dr6u", "poc": false, "poc_url": [], "published_time": "2026-08-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-wkfe-dr6u", "name": "https://www.oscs1024.com/hd/MPS-wkfe-dr6u"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-64850", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-64850"}, {"url": "https://github.com/getgrav/grav/commit/acffa34cbb0787fee87c609e0d6289e904fee33c", "name": ""}, {"url": "https://github.com/getgrav/grav/releases/tag/2.0.7", "name": ""}, {"url": "https://github.com/getgrav/grav/security/advisories/GHSA-fj2p-qj2f-74v5", "name": ""}], "scope_influence": "", "tags": ["php", "开源"], "title": "Grav CMS Blueprint dynamicData 代码注入漏洞", "_translated": true, "_saved_at": "2026-08-19T17:21:13+00:00", "_first_saved_at": "2026-08-19T17:21:13+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-wkfe-dr6u"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-64852", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-862", "description": "Grav API 插件（getgrav/grav-plugin-api）是 Grav CMS 的开源 PHP 插件，以 Composer 包形式分发，为站点内容提供完整的 headless RESTful API 接入能力。\n受影响版本中，插件在用户/plugins/api/api.php 拦截 admin 任务 apiKeyGenerate 与 apiKeyRevoke，仅以 admin.login 这一所有面板用户都具备的基线权限校验调用方，却直接读取路由中的目标账户名，调用 handleApiKeyGenerate 或 handleApiKeyRevoke 生成绑定到目标账户的持久 ApiKeyManager 凭证，因此继承目标账户的全部 API 权限（包括 api.super 等）。具备 admin.login 的基础面板用户即可为任意账户签发或撤销持久 API 密钥，从而触发账户接管与权限提升。\n修复版本中通过在 handleAdminApiKeyTask 中调用新增的 authorizeApiKeyTarget($current) 完成目标账户授权：管理自身账户密钥始终允许，操作其他账户则需 admin.users 或 admin.super，且只有超级管理员才能针对超级管理员账户执行；handleApiKeyGenerate 与 handleApiKeyRevoke 保持原签名，仅依赖前序授权结果切断越权签发路径。", "effects": [{"comp_name": "getgrav/grav-plugin-api", "ecosystem": "composer", "versions": [{"affected_version": "(-∞,1.0.8)", "min_fixed_version": "1.0.8", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-08-20", "level": "High", "mps_id": "MPS-zf3k-j0ng", "poc": false, "poc_url": [], "published_time": "2026-08-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-zf3k-j0ng", "name": "https://www.oscs1024.com/hd/MPS-zf3k-j0ng"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-64852", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-64852"}, {"url": "https://github.com/getgrav/grav-plugin-api/commit/ed16f0aaa9b398c6f179fb8f51e0fa53e4ed8a30", "name": ""}, {"url": "https://github.com/getgrav/grav-plugin-api/releases/tag/1.0.8", "name": ""}, {"url": "https://github.com/getgrav/grav/security/advisories/GHSA-7v74-m76q-8wf3", "name": ""}], "scope_influence": "", "tags": ["php", "开源"], "title": "Grav API插件API密钥授权绕过漏洞", "_translated": true, "_saved_at": "2026-08-19T17:21:11+00:00", "_first_saved_at": "2026-08-19T17:21:11+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-zf3k-j0ng"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-63037", "cvss": {}, "cvss_score": 8.6, "cvss_vector": "", "cwe": "CWE-89", "description": "Apache InLong 是 Apache 软件基金会的开源一站式海量数据集成框架，用于提供自动、安全、可靠的数据传输能力，其中 Manager 负责集群与审计告警等配置管理。\n受影响版本中，Manager OpenAPI 审计告警规则列表接口 OpenAuditAlertRuleController.selectByCondition 接收 AuditAlertRulePageRequest 后，未对 orderField、orderType 做枚举校验便进入查询链路。AuditAlertRuleEntityMapper.xml 的 selectByCondition 将这两个字段以 MyBatis `${request.orderField} ${request.orderType}` 直接拼入 ORDER BY，且默认配置 openapi.auth.enabled 为 false，未认证攻击者能够向 Manager 后端数据库注入 SQL。\n修复版本中通过在 AuditAlertRuleServiceImpl.selectByCondition 访问数据库前调用 OrderFieldEnum.checkOrderField 与 OrderTypeEnum.checkOrderType，仅允许 create_time、modify_time 与 asc、desc，非法输入回退为默认排序，从而切断 ORDER BY 注入。", "effects": [{"comp_name": "inlong", "ecosystem": "linux", "versions": [{"affected_version": "[2.0.0,2.4.0)", "min_fixed_version": "2.4.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "org.apache.inlong:manager-web", "ecosystem": "maven", "versions": [{"affected_version": "[2.0.0,2.4.0)", "min_fixed_version": "2.4.0", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-08-20", "level": "High", "mps_id": "MPS-2fb7-e4b7", "poc": false, "poc_url": [], "published_time": "2026-08-20", "reference_url_list": [{"url": "http://www.mail-archive.com/announce@apache.org/msg11738.html", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-63037", "name": ""}, {"url": "https://inlong.apache.org", "name": ""}, {"url": "https://inlong.apache.org/download/", "name": ""}, {"url": , "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "", "cvss": {"cvssv31": [{"source": "murphysec", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:N/A:N", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "", "cwe": "CWE-89", "description": "JeecgBoot 是开源 Java 低代码开发平台，基于 Spring Boot 与 Apache Shiro，提供代码生成、在线表单、数据字典和企业权限等能力。\n受影响版本中，ShiroConfig 将任意以 .js 结尾的 URL 配为 anon，而 Spring MVC 按路径变量匹配 /sys/dict/getDictItems/{dictCode}。未认证请求在该路径末尾附加 .js 后，JwtFilter 被跳过，请求仍进入 SysDictController.getDictItems。四段式 dictCode 的第四段作为 filterSql 传入 SysDictMapper.queryTableDictWithFilter，由 MyBatis ${filterSql} 直接拼入 WHERE。字典过滤器 specialFilterContentForDictSql 使用 Pattern.matches 且关键字带尾随空格，换行可绕过关键字与正则检测，形成未授权布尔盲注，可读取用户账号、口令哈希、手机号等数据。\n在官方修复发布前，可通过收窄 Shiro 静态资源匿名规则、拦截 /sys/dict/getDictItems 匿名访问，并对 filterSql 做空白归一化与参数化查询，切断认证绕过与 SQL 拼接链路。", "effects": [{"comp_name": "jeecgboot", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,3.9.3]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [{"description": "官方尚未发布修复版本。可在网关或 WAF 拦截 /sys/dict/getDictItems/* 的匿名访问；将 ShiroConfig 中 /**/*.js 等静态后缀匿名规则收窄为根路径 /*.js；对 filterSql 做空白归一化并改为参数化查询；同时更换出厂默认 jeecg.signatureSecret。", "type": "缓解措施"}], "upstream": true}]}, {"comp_name": "org.jeecgframework.boot3:jeecg-boot-base-core", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,3.9.3]", "min_fixed_version": "", "repository": "maven", "solutions": [], "upstream": true}]}, {"comp_name": "org.jeecgframework.boot3:jeecg-system-biz", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,3.9.3]", "min_fixed_version": "", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "极高", "fix_suggestion": "强烈建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-08-20", "level": "High", "mps_id": "MPS-5fth-jq8w", "poc": true, "poc_url": [], "published_ti HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-75948", "cvss": {"cvssv4": [{"source": "security@joomla.org", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:P/VC:H/VI:H/VA:L/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:P/VC:H/VI:H/VA:L/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-79", "description": "iCagenda 是 JoomliC 开发的开源 Joomla 活动管理扩展（GNU GPL v3），用于在站点上创建、管理和展示活动日历。\n受影响版本中，前台 SubmitController::submit 接收 jform 的 image、file 字段后，SubmitModel::submit 将这些值作为原始字符串写入事件记录；主题模板与 Render::fileTag 在 img src、a href 等 HTML 属性中直接拼接且未转义，访问活动页面的用户浏览器会执行攻击者脚本。该缺陷是 4.0.8 安全修复引入的回归。\n修复版本中通过仅持久化实际上传得到的 $imageLink、$fileLink，并在活动图片、附件链接及 RSS 等输出点使用 htmlspecialchars 转义属性值，阻止恶意字符串进入 HTML 属性执行。", "effects": [{"comp_name": "iCagenda", "ecosystem": "linux", "versions": [{"affected_version": "[4.0.8,4.0.13)", "min_fixed_version": "4.0.13", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-08-20", "level": "High", "mps_id": "MPS-av74-6ytn", "poc": false, "poc_url": [], "published_time": "2026-08-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-av74-6ytn", "name": "https://www.oscs1024.com/hd/MPS-av74-6ytn"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-75948", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-75948"}, {"url": "https://www.icagenda.com/", "name": ""}], "scope_influence": "", "tags": [], "title": "iCagenda存储型XSS漏洞", "_translated": true, "_saved_at": "2026-08-20T09:27:23+00:00", "_first_saved_at": "2026-08-20T09:27:23+00:00", "_  false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-08-20", "level": "High", "mps_id": "MPS-f1a8-7948", "poc": false, "poc_url": [], "published_time": "2026-08-20", "reference_url_list": [{"url": "http://www.mail-archive.com/announce@apache.org/msg11739.html", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-63039", "name": ""}, {"url": "https://inlong.apache.org", "name": ""}, {"url": "https://github.com/apache/inlong/pull/12080", "name": ""}, {"url": "https://github.com/apache/inlong/commit/e204cb1c1dd4f3f41817a89ab226c306be8ad145", "name": ""}, {"url": "https://github.com/apache/inlong/issues/12079", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "InLong告警规则SQL注入", "_translated": true, "_saved_at": "2026-08-20T15:27:21+00:00", "_first_saved_at": "2026-08-20T15:27:21+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-f1a8-7948"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-14947", "cvss": {"cvssv31": [{"source": "info@cert.vde.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.2}], "cvssv4": [{"source": "info@cert.vde.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-24", "description": "Frauscher FDS102 是 Frauscher Sensortechnik 面向 FAdC/FAdCi R2 计轴系统的商业诊断软件，用于铁路现场设备的诊断与运维，并非开源软件。\n受影响版本中，高权限远程攻击者可上传包含 ../ 等目录穿越序列的 ZIP 压缩包。因解压前未正确校验归档条目路径，压缩包可逃出预定解压目录并向服务器任意位置写入文件，进而导致任意代码执行和系统被完全控制。\n修复版本 -------------------------------- |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-76564", "cvss": {"cvssv4": [{"source": "security@joomla.org", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:A/VC:H/VI:H/VA:L/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:A/VC:H/VI:H/VA:L/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-79", "description": "Phoca Cart 是面向 Joomla CMS 的开源电子商务扩展，用于商品展示、购物车与订单管理。\n受影响版本中，当前端结账调用 PhocaCartControllerCheckout::order() 创建订单，且组件配置 store_user_agent 为启用时，PhocacartUtils::getUserAgent() 会读取 HTTP User-Agent 并写入订单记录；后台订单详情页通过 Phoca\\Render\\Adminview::itemText() 将 user_agent 直接拼入 HTML 而未编码，管理员打开订单即可触发存储型跨站脚本。\n修复版本中通过在 itemText() 对输出执行 htmlspecialchars() 编码，阻止订单中保存的 User-Agent 作为 HTML 执行。", "effects": [{"comp_name": "com_phocacart", "ecosystem": "linux", "versions": [{"affected_version": "[5.0.0,6.1.8)", "min_fixed_version": "6.1.8", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-08-20", "level": "High", "mps_id": "MPS-vec2-9rz5", "poc": false, "poc_url": [], "published_time": "2026-08-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-vec2-9rz5", "name": "https://www.oscs1024.com/hd/MPS-vec2-9rz5"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-76564", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-76564"}, {"url": "https://www.phoca.cz/phocacart", "name": ""}], "scope_influence": "", "tags": [], "title": "Phoca Cart存储型XSS", "_translated": true, "_saved_at": "2026-08-20T09:27:22+00:00", "_first_saved_at": "2026-08-20T09:27:22+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-vec2-9rz5"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2025-14601", "cvss": {"cvssv4": [{"source": "vulnerability@kaspersky.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-676", "description": "vsDesk 是面向企业内部 IT 支持与客户服务的商业 on-premise Help Desk / Service Desk 软件，用于工单管理、服务流程自动化与资产台账，源码不对外公开。\n受影响版本中，任务调度器在处理具备管理权限的已认证用户输入时过滤不足，攻击者可将输入带入操作系统命令执行路径，从而干扰 Web 服务运行、暴露敏感数据或完全控制服务器。\n修复版本中通过厂商安全补丁修复任务调度器对管理员输入的处理，阻止不可信输入进入操作系统命令执行路径；公开资料未披露更细粒度的源码修改。", "effects": [{"comp_name": "vsDesk", "ecosystem": "linux", "versions": [{"affected_version": "[11.06.02,14.0101)", "min_fixed_version": "14.0101", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "潜在危险函数的使用", "kind_en": "使用潜在危险功能", "last_modified_time": "2026-08-20", "level": "High", "mps_id": "MPS-y7bz-p2gx", "poc": false, "poc_url": [], "published_time": "2026-08-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-y7bz-p2gx", "name": "https://www.oscs1024.com/hd/MPS-y7bz-p2gx"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2025-14601", "name": "https://nvd.nist.gov/vuln/detail/CVE-2025-14601"}, {"url": "https://github.com/klsecservices/Advisories/blob/master/KLSA-00343-vsDesk-Task-Scheduler-OS-Command-Injection.md", "name": ""}], "scope_influence": "", "tags": [], "title": "vsDesk任务调度命令注入", "_translated": true, "_saved_at": "2026-08-20T09:27:26+00:00", "_first_saved_at": "2026-08-20T09:27:26+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-y7bz-p2gx"}, {"analysis_status": 0, "articles": [{"content": "跨站点请求伪造 (CSRF)通过利用网站对用户请求的信任进行攻击。当用户在网站A登录并在同一浏览器会话中访问网站B时，攻击者可以构造特制的请求并诱使用户执行，以使网站B误以为这些请求是用户合法发起的。\n攻击者通常通过欺骗用户点击恶意链接、在受信任的网站中植入恶意代码或通过钓鱼等手段来实施CSRF攻击，一旦用户执行了恶意请求，攻击者可以以用户的身份执行任意操作，包括更改用户密码、发起资金转账或删除重要数据等。", "title": "什么是CSRF"}, {"content": "- 链接欺骗：攻击者通过向用户发送包含恶意链接的电子邮件或社交媒体消息，诱使用户点击并执行恶意请求。\n- 图片引用攻击：攻击者通过在恶意网站上包含指向目标网站的图片引用，以触发用户浏览器自动发送目标网站的请求。\n- XSS利用：如果目标网站存在XSS漏洞，攻击者可以注入恶意脚本，以使用户在浏览器中执行恶意请求。", "title": "CSRF常见的攻击方式"}, {"content": "- 随机令牌：网站可以在每个请求中包含一个随机生成的令牌（CSRF Token），并验证该令牌的有效性，以确认请求的来源是合法的。\n- SameSite Cookie：使用SameSite属性来限制跨站点请求，将Cookie的发送限制在同一站点上，减少了跨站请求伪造的风险。\n- 双重验证：对于敏感操作，网站可以要求用户进行额外的验证，例如输入验证码、提供第二个因素的身份验证等。\n- 强化浏览器策略：网站可以设置Content-Security-Policy（CSP）头，限制浏览器执行恶意脚本的能力，减少CSRF攻击的风险。\n- 限制用户操作：网站可以要求用户在执行敏感操作之前进行明确的确认或授权，防止恶意请求被误触发。\n- 安全编码实践：开发人员应遵循安全编码实践，对用户输入进行适当的验证和过滤，防止恶意请求的注入。", "title": "如何预防CSRF"}], "cnvd_id": "", "cve_id": "CVE-2026-14951", "cvss": {"cvssv31": [{"source": "info@cert.vde.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8}], "cvssv4": [{"source": "info@cert.vde.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-352", "description": "Frauscher Diagnostic System FDS102 是 Frauscher Sensortechnik 的商业铁路诊断系统，为 FAdC/FAdCi R2 计轴设备提供 Web 界面监测与管理能力。\n受影响版本中，FDS Web 界面缺少 CSRF 防护头，低权限远程攻击者可借助恶意网页促使已认证用户在其会话上下文中执行非预期操作，从而在受害者权限下完成未授权动作。\n修复版本中通过为 FDS Web 界面补齐 CSRF 防护头，阻止跨站请求借助已认证会话自动生效，切断恶意网页驱动非预期操作的利用链。", "effects": [{"comp_name": "fds102", "ecosystem": "linux", "versions": [{"affected_version": "[2.0.0,2.14.0)", "min_fixed_version": "2.14.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "CSRF", "kind_en": "跨站请求伪造 (CSRF)", "last_modified_time": "2026-08-20", "level": "High", "mps_id": "MPS-yr0k-ucfi", "poc": false, "poc_url": [], "published_time": "2026-08-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-yr0k-ucfi", "name": "https://www.oscs1024.com/hd/MPS-yr0k-ucfi"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-14951", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-14951"}, {"url": "https://www.certvde.com/en/advisories/VDE-2026-078/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "FDS102 CSRF漏洞", "_translated": true, "_saved_at": "2026-08-20T11:20:29+00:00", "_first_saved_at": "2026-08-20T10:23:01+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-yr0k-ucfi"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-63044", "cvss": {}, "cvss_score": 8.5, "cvss_vector": "", "cwe": "CWE-918", "description": "Apache InLong 是开源海量数据集成框架，用于采集、汇聚、存储和消费大规模数据流，其中 InLong Manager 提供数据节点管理与连接测试能力。\n受影响版本中，DataNodeController.testConnection 对 P -2026-73220", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73220"}, {"url": "https://github.com/cvat-ai/cvat/commit/33aaa1987ea89a4d229bf4c19fcbe6b04ed55b42", "name": ""}, {"url": "https://github.com/cvat-ai/cvat/pull/10893", "name": ""}, {"url": "https://github.com/cvat-ai/cvat/releases/tag/v2.70.0", "name": ""}, {"url": "https://github.com/cvat-ai/cvat/security/advisories/GHSA-chxx-45vm-qhc9", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "CVAT 音频任务标注指南存储型 XSS 漏洞", "_translated": true, "_saved_at": "2026-08-20T16:27:24+00:00", "_first_saved_at": "2026-08-20T16:27:24+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-4pox-gtv8"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-64851", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:P/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.5}]}, "cvss_score": 8.5, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:P/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-79", "description": "Grav Shortcode Core 是 Grav CMS 的开源短代码插件（PHP，MIT 许可），用于按 WordPress / BBCode 风格扩展页面内容。\n受影响版本中，shortcode 语法因不含字面量 `\u003c` 而能直接通过 Grav 的 Security::detectXss() 保存时 XSS 扫描；ColorShortcode、ColumnsShortcode、DetailsShortcode、DivShortcode、FigureShortcode、FontAwesomeShortcode、HShortcode、MarkShortcode、SafeEmailShortcode、SizeShortcode 与 SpanShortcode 等处理器在 init() 中注册的回调，会把 getParameter('color' / 'class' / 'id' / 'style' 等) 取得的参数直接拼到 HTML 属性中而不做转义。具有 admin.pages 权限的账户可以提交形如 [color color='x\" onmouseover=alert(1)']…[/color] 的内容，闭合生成属性并注入事件处理器，从而在访问者或登录管理员预览/打开该页面时执行脚本，可读取后台 nonce 并以其会话身份执行操作。\n修复版本中通过在 Grav\\Plugin\\Shortcodes\\Shortcode 基类新增 escAttr() 静态方法（对入参调用 htmlspecialchars(..., ENT_QUOTES, 'UTF-8')），并对所有参与 HTML 属性拼接的 shortcode 参数统一调用该方法进行编码，切断恶意参数闭合属性并注入事件处理器的路径。", "effects": [{"comp_name": "getgrav/grav-plugin-shortcode-core", "ecosystem": "composer", "versions": [{"affected_version": "(-∞,6.2.2)", "min_fixed_version": "6.2.2", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-08-2 003e= UINT16_MAX 的写入请求，阻止计数回绕和越界写，从而切断该溢出路径。", "effects": [{"comp_name": "ffmpeg", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,9.0.1)", "min_fixed_version": "9.0.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "堆缓冲区溢出", "kind_en": "基于堆的缓冲区溢出", "last_modified_time": "2026-08-20", "level": "High", "mps_id": "MPS-dbiw-zy6e", "poc": false, "poc_url": [], "published_time": "2026-08-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-dbiw-zy6e", "name": "https://www.oscs1024.com/hd/MPS-dbiw-zy6e"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-75141", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-75141"}, {"url": "https://code.ffmpeg.org/FFmpeg/FFmpeg/commit/acf5d7cdc1f9ae8752c23e1ea8d7f355ed780781", "name": ""}, {"url": "https://code.ffmpeg.org/FFmpeg/FFmpeg/pulls/24088", "name": ""}, {"url": "https://www.vulncheck.com/advisories/ffmpeg-heap-buffer-overflow-in-hvcc-box-writer-via-hevc-muxing", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "FFmpeg hvcC堆溢出", "_translated": true, "_saved_at": "2026-08-19T19:19:51+00:00", "_first_saved_at": "2026-08-19T18:24:48+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-dbiw-zy6e"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-14949", "cvss": {"cvssv31": [{"source": "info@cert.vde.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:H/A:N", "severity": "medium", "base_score": 6.5}], "cvssv4": [{"source": "info@cert.vde.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:N/VI:H/VA:N/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.5}]}, "cvss_score": 8.5, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:N/VI:H/VA:N/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-863", "description": "Frauscher FDS102 是 Frauscher Sensortechnik GmbH 面向 FAdC/FAdCi R2 的商业诊断系统软件，用于铁路轮轴计数设备的诊断、监测与运维。\n受影响版本中，Web 接口 /api/user/add.php 暴露的用户创建功能未正确执行基于角色的访问控制。已持有低权限有效会话的远程攻击者可向该接口提交创建用户请求，并指定任意角色值，从而新建包含应用最高权限在内的账户。\n修复版本中通过厂商安全更新收紧用户创建接口的授权校验，阻止低权限会话再创建高权限账户；公开资料未披露更细粒度的源码修改。", "effects": [{"comp_name": "fds_102", "ecosystem": "linux", "versions": [{"affected_version": "[2.11.0,2.14.0)", "min_fixed_version": "2.14.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-08-20", "level": "High", "mps_id": "MPS-ds7u-f2vq", "poc": false, "poc_url": [], "published_time": "2026-08-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ds7u-f2vq", "name": "https://www.oscs1024.com/hd/MPS-ds7u-f2vq"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-14949", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-14949"}, {"url": "https://www.certvde.com/en/advisories/VDE-2026-078/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "FDS102越权创建账户", "_translated": true, "_saved_at": "2026-08-20T11:20:32+00:00", "_first_saved_at": "2026-08-20T10:23:04+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ds7u-f2vq"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-75142", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.5}]}, "cvss_score": 8.5, "cvss_vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-121", "description": "FFmpeg 是开源多媒体处理套件，提供命令行工具与 libavformat 等库，用于音视频解码、转码与封装。\n受影响版本中，MPEG-PS 复用器 libavformat/mpegenc.c 的 flush_packet() 使用固定 128 字节栈缓冲依次写入 pack header 与 system header。put_system_header() 按 12+3*N 字节为每路流写入系统头，但 PutBitContext 被设置成超过该栈缓冲剩余空间的长度，自身边界检查无法拦截。将含约 35 路及以上流的输入封装为 MPEG-PS 时，会触发栈缓冲区溢出。\n修复版本中通过在 mpeg_mux_init() 初始化阶段调用 get_system_header_size()，当系统头长度超过 128-14 字节时返回 EINVAL 并拒绝封装，阻断过量流配置进入固定栈缓冲写入路径。", "effects": [{"comp_name": "FFmpeg", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,9.0.1)", "min_fixed_version": "9.0.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "栈缓冲区溢出", "kind_en": "基于堆栈的缓冲区溢出", "last_modified_time": "2026-08-20", "level": "High", "mps_id": "MPS-lwd1-qf96", "poc": false, "poc_url": [], "published_time": "2026-0 组合进所有 load 调用，没有任何安全模式或可关闭开关。受影响版本下，任何解析不可信 YAML 输入的调用方都会在解析阶段无条件执行 JavaScript 字符串，攻击者可借此读取环境变量、访问文件系统、发起网络请求或派生子进程，拿到 Node.js 运行时下的全部权限。\n修复版本中通过在调用方侧避免直接解析不可信 YAML 输入，或在 jsType 中替换 eval 改为 Function 受控白名单 + 禁用 dynamic code execution 来切断恶意标签到任意代码执行的因果链；当前上游 0.27.0 仍未发布带修复的版本，建议临时改用支持安全 schema 的 js-yaml 替代并禁用 !js 标签。", "effects": [{"comp_name": "@cgauge/yaml", "ecosystem": "npm", "versions": [{"affected_version": "(-∞,0.27.0]", "min_fixed_version": "", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "eval注入", "kind_en": "动态评估代码中指令的不当中和（“评估注入”）", "last_modified_time": "2026-08-20", "level": "High", "mps_id": "MPS-7mcw-nlqi", "poc": false, "poc_url": [], "published_time": "2026-08-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-7mcw-nlqi", "name": "https://www.oscs1024.com/hd/MPS-7mcw-nlqi"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-76833", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-76833"}, {"url": "https://gist.github.com/arjunjaincs/35da3a80b4b16f324f194acec18489ba", "name": ""}, {"url": "https://github.com/cgauge/packages", "name": ""}, {"url": "https://www.vulncheck.com/advisories/cgauge-yaml-npm-package-arbitrary-code-execution-via-eval-yaml-tag", "name": ""}], "scope_influence": "", "tags": ["npm", "开源"], "title": "@cgauge/yaml eval注入漏洞", "_translated": true, "_saved_at": "2026-08-20T15:27:27+00:00", "_first_saved_at": "2026-08-20T15:27:27+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-7mcw-nlqi"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-77118", "cvss": {"cvssv4": [{"source": "22e2d327-25fe-45d7-9f0c-dcd23b7108df", "vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:N/UI:A/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.4}]}, "cvss_score": 8.4, "cvss_vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:N/UI:A/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-787", "description": "GraphicsMagick 是开源图像处理软件与库，提供 gm convert、gm identify 命令以及 libGraphicsMagick，用于读写和转换多种图像格式，其中包含 Kodak Photo CD（PCD/PCDS）解码器。\n受影响版本中，PCD 解码器在 ReadPCDImage 处理较高分辨率子图时调用 DecodeImage。Huffman 增量循环在每次解码后以 q++ 推进亮度与色度平面输出指针，且只在同步标记引入新平面或行时重置指针，同步标记之间的游程长度仅由输入决定。恶意 PCD 文件可将指针置于平面末尾附近并提供无同步标记的长增量序列，使指针越过按 number_pixels+1 精确分配的堆缓冲区并写入，造成堆内存破坏。\n修复版本中通过为各通道 Huffman 解码缓冲区超额分配，并在 DecodeImage 每次写入前用 plane_end 检查输出指针是否越界，一旦溢出即判定图像损坏并中止解码，切断无界 q++ 写越界链路。", "effects": [{"comp_name": "GraphicsMagick", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.3.48)", "min_fixed_version": "1.3.48", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "graphicsmagick", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.4+really1.3.48-1)", "min_fixed_version": "1.4+really1.3.48-1", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[1.0.0,1.3.48)", "min_fixed_version": "1.3.48", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-08-20", "level": "High", "mps_id": "MPS-bqrj-5zgo", "poc": false, "poc_url": [], "published_time": "2026-08-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-bqrj-5zgo", "name": "https://www.oscs1024.com/hd/MPS-bqrj-5zgo"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-77118", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-77118"}, {"url": "https://foss.heptapod.net/graphicsmagick/graphicsmagick/-/commit/937cdd9920bd96", "name": ""}, {"url": "https://foss.heptapod.net/graphicsmagick/graphicsmagick/-/raw/GraphicsMagick-1_3_48/ChangeLog", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "GraphicsMagick PCD越界写", "_translated": true, "_saved_at": "2026-08-20T14:29:21+00:00", "_first_saved_at": "2026-08-20T14:29:21+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-bqrj-5zgo"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-77072", "cvss": {"cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:A/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.4}]}, "cvss_score": 8.4, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:A/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-79", "description": "1.123.69、2.33.4 和 2.34.1 之前的 n8n 在表单节点的完成页面中包含存储型跨站点脚本漏洞。仅当respondWith未设置为“重定向”时，完成页面才应用其沙箱Content-Security-Policy，但responseText始终呈现为原始HTML。经过身份验证的成员可以通过表达式将respondWith 设置为“重定向”，同时保持responseText 填充，从而导致完成页面提供来自n8n 源的未经净化的HTML 和脚本。任何提交生成的公共表单的访问者都会让该脚本与他们的会话同源执行。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-08-20", "level": "High", "mps_id": "MPS-gdpr-31xy", "poc": false, "poc_url": [], "published_time": "2026-08-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-gdpr-31xy", "name": "https://www.oscs1024.com/hd/MPS-gdpr-31xy"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-77072", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-77072"}, {"url": "https: ce 参数并按 Origin 头判定，预检不再授予 '*'；classes/Api/ApiRouter.php 的 process 方法相应地把 $request 透传给 createPreflightResponse；同时 JwtAuthenticator 不再接受普通 JSON 路由上的 ?token= 查询串，仅文件下载等必要 GET/HEAD 保留该回退，从源头切断跨源账户接管链路。", "effects": [{"comp_name": "getgrav/grav-plugin-api", "ecosystem": "composer", "versions": [{"affected_version": "(-∞,1.0.0-rc.16)", "min_fixed_version": "1.0.0-rc.16", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "过度许可的跨域白名单", "kind_en": "不受信任域的宽松跨域策略", "last_modified_time": "2026-08-20", "level": "High", "mps_id": "MPS-495k-b6ev", "poc": false, "poc_url": [], "published_time": "2026-08-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-495k-b6ev", "name": "https://www.oscs1024.com/hd/MPS-495k-b6ev"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-63407", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-63407"}, {"url": "https://github.com/getgrav/grav-plugin-api/commit/56ae2ca3bf36c8299a4b3d376c6a20e8c0ed5ba9", "name": ""}, {"url": "https://github.com/getgrav/grav-plugin-api/releases/tag/1.0.0-rc.16", "name": ""}, {"url": "https://github.com/getgrav/grav/security/advisories/GHSA-93px-98wh-6fj2", "name": ""}], "scope_influence": "", "tags": ["php", "开源"], "title": "Grav API 插件 CORS 通配符致跨源账户接管漏洞", "_translated": true, "_saved_at": "2026-08-19T17:21:17+00:00", "_first_saved_at": "2026-08-19T17:21:17+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-495k-b6ev"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-62673", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.2}]}, "cvss_score": 8.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-178", "description": "Grav 是基于文件的开源 PHP Web 平台，可作为内容管理系统或站点框架运行，仓库以 MIT 协议发布在 GitHub（getgrav/grav）。\n受影响版本中，仓库根目录下的 .htaccess 与 webserver-configs/htaccess.txt 中的 Apache RewriteRule 拒绝规则均未携带 [NC]（No Case）标志，对敏感目录名与扩展名的匹配严格区分大小写。在大小写不敏感的文件系统（如 macOS、Windows，或将卷挂载到此类宿主机的 Docker 部署）上，攻击者只需将请求路径中的目录或扩展名改为大写形式即可绕过这些规则；维护者已在 macOS 上确认 /User/accounts/admin.yaml 与 /USER/config/security.yaml 直接返回 HTTP 200，使未认证访问者可读取 user/accounts 与 user/config 下的文件，包括管理员密码哈希与 security.yaml 中的 CSRF salt。\n修复版本中通过为 .htaccess 与 webserver-configs/htaccess.txt 中所有安全拒绝 RewriteRule 显式追加 [NC] 标志解决了该问题，使目录名与文件扩展名的匹配在 URL 与文件系统层面均按大小写不敏感处理，从而在 macOS、Windows 等大小写不敏感文件系统上同样生效，切断大小写绕过路径并保留 user/data 媒体透传规则。", "effects": [{"comp_name": "getgrav/grav", "ecosystem": "composer", "versions": [{"affected_version": "(-∞,2.0.4)", "min_fixed_version": "2.0.4", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "大小写敏感处理不恰当", "kind_en": "大小写敏感处理不当", "last_modified_time": "2026-08-20", "level": "High", "mps_id": "MPS-gkwz-7hc0", "poc": false, "poc_url": [], "published_time": "2026-08-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-gkwz-7hc0", "name": "https://www.oscs1024.com/hd/MPS-gkwz-7hc0"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-62673", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-62673"}, {"url": "https://github.com/getgrav/grav/commit/8c9d1e7b6fd66ecea80a4bc3783fd41d36e22fb1", "name": ""}, {"url": "https://github.com/getgrav/grav/releases/tag/2.0.4", "name": ""}, {"url": "https://github.com/getgrav/grav/security/advisories/GHSA-vwg3-w8w3-pc79", "name": ""}], "scope_influence": "", "tags": ["php", "开源"], "title": "Grav CMS .htaccess安全规则大小写绕过漏洞", "_t
