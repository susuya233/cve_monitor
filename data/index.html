U:X", "severity": "high", "base_score": 8.2}]}, "cvss_score": 8.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-916", "description": "rotki 是一个采用 AGPL-3.0 协议开源的加密资产会计与投资组合追踪工具，其 premium 订阅提供用户数据库的云端备份与跨设备同步功能。\n受影响版本中，premium 备份加密位于 rotkehlchen/crypto.py 的 encrypt() 函数，该方法仅执行一次无盐 SHA-256 将用户登录口令直接变换为 AES-256-CBC 密钥，无盐值且无迭代拉伸；已登录用户通过 PUT /api/1/premium/sync（action=upload）触发上传时，rotkehlchen/data_handler.py 的 compress_and_encrypt_db() 以该弱密钥加密压缩后的 SQLite 用户数据库并存储到 premium 服务器，攻击者获取备份 blob 后可实施 GPU 并行的离线口令爆破，解密出 exchange API 密钥、钱包地址与交易历史等敏感数据。\n修复版本中通过以 encrypt_backup()/decrypt_backup() 重写备份加密：使用随机盐 Argon2id（默认 time_cost=8、256MiB 内存、8 lanes）派生主密钥并经 HKDF 拆分出 AES-256-GCM 加密密钥与 key commitment，密文按 64KiB 分块认证加密且含 last_modify_ts 的头部整体作为附加认证数据，同步流程同时拒绝降级回旧格式备份，显著提高离线爆破口令的计算成本。", "effects": [{"comp_name": "rotki", "ecosystem": "linux", "versions": [{"affected_version": "[0,1.44.2)", "min_fixed_version": "1.44.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "使用具有不充分计算复杂性的口令哈希", "kind_en": "使用密码哈希但计算量不足", "last_modified_time": "2026-10-25", "level": "High", "mps_id": "MPS-sh20-zqp1", "poc": false, "poc_url": [], "published_time": "2026-10-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-sh20-zqp1", "name": "https://www.oscs1024.com/hd/MPS-sh20-zqp1"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-116071", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-116071"}, {"url": "https://github.com/rotki/rotki/issues/13393", "name": "GitHub Issue #13393"}, {"url": "https://github.com/rotki/rotki", "name": ""}, {"url": "https://github.com/rotki/rotki/pull/13401", "name": ""}, {"url": "https://github.com/rotki/rotki/blob/v1.44.1/rotkehlchen/crypto.py#L17-L45", "name": ""}, {"url": "https://github.com/rotki/rotki/blob/v1.44.1/rotkehlchen/data_handler.py#L263-L294", "name": ""}, {"url": "https://github.com/rotki/rotki/releases/tag/v1.44.2", "name": "v1.44.2 Release Notes"}, {"url": "https://www.vulncheck.com/advisories/rotki-before-1.44.2-weak-key-derivation-for-premium-cloud-backup-encryption", "name": "VulnCheck Advisory: rotki before 1.44.2 Weak Key Derivation for Premium Cloud Backup Encryption"}], "scope_influence": "", "tags": ["应用软件"], "title": "rotki弱密钥派生漏洞", "_translated": true, "_saved_at": "2026-10-25T13:30:20+00:00", "_first_saved_at": "2026-10-25T13:30:20+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-sh20-zqp1"}, {"analysis_status": 0, "articles": [{"content": "跨站点请求伪造 (CSRF)通过利用网站对用户请求的信任进行攻击。当用户在网站A登录并在同一浏览器会话中访问网站B时，攻击者可以构造特制的请求并诱使用户执行，以使网站B误以为这些请求是用户合法发起的。\n攻击者通常通过欺骗用户点击恶意链接、在受信任的网站中植入恶意代码或通过钓鱼等手段来实施CSRF攻击，一旦用户执行了恶意请求，攻击者可以以用户的身份执行任意操作，包括更改用户密码、发起资金转账或删除重要数据等。", "title": "什么是CSRF"}, {"content": "- 链接欺骗：攻击者通过向用户发送包含恶意链接的电子邮件或社交媒体消息，诱使用户点击并执行恶意请求。\n- 图片引用攻击：攻击者通过在恶意网站上包含指向目标网站的图片引用，以触发用户浏览器自动发送目标网站的请求。\n- XSS利用：如果目标网站存在XSS漏洞，攻击者可以注入恶意脚本，以使用户在浏览器中执行恶意请求。", "title": "CSRF常见的攻击方式"}, {"content": "- 随机令牌：网站可以在每个请求中包含一个随机生成的令牌（CSRF Token），并验证该令牌的有效性，以确认请求的来源是合法的。\n- SameSite Cookie：使用SameSite属性来限制跨站点请求，将Cookie的发送限制在同一站点上，减少了跨站请求伪造的风险。\n- 双重验证：对于敏感操作，网站可以要求用户进行额外的验证，例如输入验证码、提供第二个因素的身份验证等。\n- 强化浏览器策略：网站可以设置Content-Security-Policy（CSP）头，限制浏览器执行恶意脚本的能力，减少CSRF攻击的风险。\n- 限制用户操作：网站可以要求用户在执行敏感操作之前进行明确的确认或授权，防止恶意请求被误触发。\n- 安全编码实践：开发人员应遵循安全编码实践，对用户输入进行适当的验证和过滤，防止恶意请求的注入。", "title": "如何预防CSRF"}], "cnvd_id": "", "cve_id": "CVE-2026-116204", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:N/I:H/A:H", "severity": "high", "base_score": 8.1}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:N/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:N/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-352", "description": "YesWiki 是一个采用 AGPL-3.0 协议开源的 PHP Wiki 协作系统，提供多用户页面编辑、权限控制、表单与插件扩展等能力。\n受影响版本中，tools/security/actions/despam.php 的 despam 管理动作在 isset($_POST['clean']) 分支内遍历 $_POST['suppr'] 数组并逐个调用 PageController::delete() 删除页面，同时按 $_POST['rev'] 数组将任意历史修订恢复为当前版本，整个流程仅依赖会话态的 UserIsAdmin() 判定，缺少 CSRF Token 与 Origin/Referer 校验；结合默认 default_write_acl='*' 与 allow_raw_html=true，未认证攻击者可在 Wiki 页面植入自动提交的 HTML 表单，管理员浏览该页面时浏览器携带管理员会话发出同站 POST，导致 PagePrincipale、GererConfig 等任意页面被删除或当前内容被旧版本覆盖。\n修复版本中通过在 despam 动作表单中输出 csrf-token 隐藏字段，并在进入 clean 处理分支前调用 CsrfTokenController::checkToken('main', 'POST', 'csrf-token', false) 强制校验请求，校验失败的跨站请求被拒绝，切断了上述利用链。", "effects": [{"comp_name": "yeswiki/yeswiki", "ecosystem": "composer", "versions": [{"affected_version": "(-∞,4.7.0)", "min_fixed_version": "4.7.0", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "CSRF", "kind_en": "跨站请求伪造 (CSRF)", "last_modified_time": "2026-10-25", "level": "High", "mps_id": "MPS-2co8-5sv0", "poc": false, "poc_url": [], "published_time": "2026-10-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-2co8-5sv0", "name": "https://www.oscs1024.com/hd/MPS-2co8-5sv0"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-116204", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-116204"}, {"url": "https://github.com/YesWiki/yeswiki/security/advisories/GHSA-cv88-hx5q-vq72", "name": "GitHub Security Advisory (GHSA-cv88-hx5q-vq72)"}, {"url": "https://www.vulncheck.com/advisories/yeswiki-before-4.7.0-csrf-via-despam-admin-action", "name": "VulnCheck Advisory: YesWiki before 4.7.0 CSRF via despam Admin Action"}], "scope_influence": "", "tags": ["php", "开源"], "title": "YesWiki despam动作CSRF漏洞", "_translated": true, "_saved_at": "2026-10-25T17:21:39+00:00", "_first_saved_at": "2026-10-25T17:21:39+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-2co8-5sv0"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-116208", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:N/I:H/A:H", "severity": "high", "base_score": 8.1}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:N/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:N/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-862", "description": "YesWiki 是一个基于 PHP 的开源 Wiki 与协作平台，其 Bazar 模块提供表单与条目管理，并通过 ActivityPub 支持联邦内容同步，将远端主体发布的条目镜像到本地。\n受影响版本中，ActivityPub 同步处理器 ActivityPubService::syncActorPosts 处理远端 outbox 返回的 Create、Update、Delete 活动并回收本地镜像条目时缺少逐活动授权校验：跨主体 Delete 活动以 forceEvenIfNotOwner=true 直接调用 EntryManager::delete，Create 与 Update 未校验来源主机与条目归属，垃圾回收逻辑仅按主机名匹配批量删除本地条目。运行恶意 ActivityPub 服务器的攻击者在管理员发起同步时提交包含跨主体 activity 的毒化 outbox，可删除、覆盖、伪造或批量删除其他联邦主体的镜像条目；同步动作为无 CSRF 令牌的 GET 请求，存在被跨站请求伪造放大的风险。\n修复版本中通过在同步路径引入与收件箱一致的授权校验完成修复：新增 isOwnedBy 判定远端主体对镜像条目的归属，Create 活动要求 sameHost 并以 rememberOwner 记录归属，Delete、Update 与垃圾回收删除在调用 EntryManager 前先校验归属，阻断跨主体、跨主机的条目操纵，同版本还为同步入口增加 CSRF 令牌校验。", "effects": [{"comp_name": "yeswiki/yeswiki", "ecosystem": "composer", "versions": [{"affected_version": "[4.6.2,4.7.0)", "min_fixed_version": "4.7.0", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-10-25", "level": "High", "mps_id": "MPS-hv7f-0l29", "poc": false, "poc_url": [], "published_time": "2026-10-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-hv7f-0l29", "name": "https://www.oscs1024.com/hd/MPS-hv7f-0l29"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-116208", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-116208"}, {"url": "https://github.com/YesWiki/yeswiki/security/advisories/GHSA-cr64-h6xp-9g2j", "name": "GitHub Security Advisory (GHSA-cr64-h6xp-9g2j)"}, {"url": "https://www.vulncheck.com/advisories/yeswiki-4.6.2-before-4.7.0-missing-authorization-in-activitypub-syncactorposts", "name": "VulnCheck Advisory: YesWiki 4.6.2 before 4.7.0 Missing Authorization in ActivityPub syncActorPosts"}], "scope_influence": "", "tags": ["php", "开源"], "title": "YesWiki 同步越权漏洞", "_translated": true, "_saved_at": "2026-10-25T17:21:37+00:00", "_first_saved_at": "2026-10-25T17:21:37+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-hv7f-0l29" 保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "attack_vector_type": "Local", "cnvd_id": "", "cve_id": "CVE-2026-84633", "cvss": {}, "cvss_score": 8.4, "cvss_vector": "", "cwe": "CWE-22", "description": "Apple Neural Engine 是 macOS 内置的闭源神经网络推理组件，部署在 Apple 芯片设备上，用于在本机执行机器学习计算。\n受影响版本中，该组件的路径校验不足，本地应用传入的路径可穿越到沙箱允许范围之外，从而导致应用突破沙箱限制。公开公告未给出具体文件、函数或参数。\n修复版本中通过改进路径校验阻止越界路径继续被接受，应用无法再借助路径穿越突破沙箱。修复包含在 macOS Golden Gate 27 中。", "effects": [{"comp_name": "macos", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,27)", "min_fixed_version": "27", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-10-27", "level": "High", "mps_id": "MPS-elhi-tv1y", "poc": false, "poc_url": [], "published_time": "2026-10-27", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-elhi-tv1y", "name": "https://www.oscs1024.com/hd/MPS-elhi-tv1y"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-84633", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-84633"}, {"url": "https://support.apple.com/en-us/149035", "name": ""}], "scope_influence": "", "tags": ["AI", "操作系统"], "title": "macOS神经引擎沙箱逃逸", "_translated": true, "_saved_at": "2026-10-27T05:52:18+00:00", "_first_saved_at": "2026-10-27T05:52:18+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-elhi-tv1y"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-72753", "cvss": {"cvssv31": [{"source": "sep@nlnetlabs.nl", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:L/A:H", "severity": "high", "base_score": 8.2}]}, "cvss_score": 8.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:L/A:H", "cwe": "CWE-755", "description": "Routinator 是 NLnet Labs 发布的开源 RPKI 依赖方软件，使用 Rust 编写，通过 RRDP 拉取存储库对象并生成路由源验证数据。\n受影响版本中，Notification::from_response 解析 RRDP notification 后只调用 NotificationFile::sort_deltas 按 serial 排序，不拒绝 serial 不连续的 delta 列表。RepositoryUpdate::calc_deltas 只要求最后一条 delta 的 serial 等于 notification serial，再从本地下一序号起整段应用后续 delta，空洞对应的发布内容不会写入本地仓库，但仓库 serial 仍会推进到 notification 的 serial。delta 条目过多时，解析并保留这些条目可能耗尽内存。\n修复版本中通过把 Notification::from_response 的 sort_deltas 替换为 sort_and_verify_deltas(Some(delta_list_limit))，并将依赖 rpki 升级到 0.20.0。sort_and_verify_deltas 按 serial 升序排列，超过上限时只保留最新条目，并核对相邻 serial 是否连续；NotificationFile::_parse 在 delta 数量达到 delta_limit 时标记 DeltaListError::Oversized，delta_update 据此回退到 snapshot，不再把超限 delta 列表留在增量更新路径中。", "effects": [{"comp_name": "routinator", "ecosystem": "cargo", "versions": [{"affected_version": "(-∞,0.15.3)", "min_fixed_version": "0.15.3", "repository": "cargo", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "对异常条件的处理不恰当", "kind_en": "Improper Handling of Exceptional Conditions", "last_modified_time": "2026-10-27", "level": "High", "mps_id": "MPS-x3rf-8jbn", "poc": false, "poc_url": [], "published_time": "2026-10-27", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-x3rf-8jbn", "name": "https://www.oscs1024.com/hd/MPS-x3rf-8jbn"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-72753", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-72753"}, {"url": "https://www.nlnetlabs.nl/downloads/routinator/CVE-2026-72753.txt", "name": ""}], "scope_influence": "", "tags": [], "title": "Routinator增量漏洞", "_translated": true, "_saved_at": "2026-10-26T20:15:57+00:00", "_first_saved_at": "2026-10-26T20:15:57+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-x3rf-8jbn"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "attack_vector_type": "Local", "cnvd_id": "", "cve_id": "CVE-2026-84599", "cvss": {}, "cvss_score": 7.8, "cvss_vector": "", "cwe": "CWE-787", "description": "Apple iOS/iPadOS、macOS、tvOS、visionOS 与 watchOS 是苹果公司闭源操作系统，分别运行于 iPhone、iPad、Mac、Apple TV、Apple Vision Pro 与 Apple Watch 设备，内核负责内存管理、进程调度与硬件层隔离。\n受影响版本中，操作系统内核在内存处理流程中存在缺陷，设备本地运行的应用可触发内核内存破坏，导致意外系统终止或内核内存损坏，官方公告未披露受影响的具体函数与代码路径。\n修复版本中通过改进内核内存处理消除了该缺陷，涉及版本包括 iOS 26.7.2 与 iPadOS 26.7.2、iOS 27 与 iPadOS 27、macOS Golden Gate 27、macOS Sequoia 15.8、macOS Tahoe 26.7、tvOS 27、visionOS 27 与 watchOS 27。", "effects": [{"comp_name": "iphone_os", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,26.7.2)", "min_fixed_version": "26.7.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "macos", "ecosystem": "linux", "versions": [{"affected_version": "[26.0,26.7)", "min_fixed_version": "26.7", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,15.8)", "min_fixed_version": "15.8", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "tvos", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,27.0)", "min_fixed_version": "27.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"   <script>
    const payload = JSON.parse(document.getElementById("payload").textContent);
    const levelLabels = payload.level_labels || {};
    const items = payload.items || [];
    let filtered = items.slice();
    let activeId = null;

    const $ = (id) => document.getElementById(id);
    $("generatedAt").textContent = payload.generated_at || "-";
    $("retention").textContent = payload.retention_days ?? "-";
    $("cutoff").textContent = payload.cutoff_date || "-";
    $("count").textContent = String(payload.count ?? items.length);

    function levelClass(level) {
      const cn = levelLabels[level] || level || "";
      if (level === "Critical" || cn === "严重") return "crit";
      if (level === "High" || cn === "高危") return "high";
      return "other";
    }
    function levelText(level) {
      return levelLabels[level] || level || "-";
    }
    function esc(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }
    function scoreText(v) {
      if (v === null || v === undefined || v === "" || v === -1) return "-";
      return String(v);
    }

    function renderList() {
      const list = $("list");
      $("listCount").textContent = String(filtered.length);
      if (!filtered.length) {
        list.innerHTML = '<div class="empty">没有匹配项</div>';
        return;
      }
      list.innerHTML = filtered.map((it) => {
        const id = it.mps_id || it.cve_id;
        const active = id === activeId ? " active" : "";
        return `
          <button class="item${active}" data-id="${esc(id)}" type="button">
            <div class="item-top">
              <span class="cve">${esc(it.cve_id || it.mps_id || "-")}</span>
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
            </div>
            <div class="title">${esc(it.title || "-")}</div>
            <div class="item-foot">
              <span>CVSS ${esc(scoreText(it.cvss_score))}</span>
              <span>${esc(it.published_time || "-")}</span>
              ${it.poc ? "<span>POC</span>" : ""}
            </div>
          </button>`;
      }).join("");
      list.querySelectorAll(".item").forEach((btn) => {
        btn.addEventListener("click", () => selectById(btn.dataset.id));
      });
    }

    function refsHtml(it) {
      const refs = Array.isArray(it.reference_url_list) ? it.reference_url_list : [];
      const links = [];
      if (it._source_page) links.push({ url: it._source_page, name: "OSCS 详情" });
      if (it.cve_id) links.push({ url: `https://nvd.nist.gov/vuln/detail/${it.cve_id}`, name: "NVD" });
      refs.forEach((r) => {
        if (r && r.url) links.push({ url: r.url, name: r.name || r.url });
      });
      const seen = new Set();
      const uniq = [];
      for (const l of links) {
        if (seen.has(l.url)) continue;
        seen.add(l.url);
        uniq.push(l);
      }
      if (!uniq.length) return '<div class="box">无参考链接</div>';
      return `<div class="refs">${uniq.map((l) =>
        `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name || l.url)}</a>`
      ).join("")}</div>`;
    }

    function articlesHtml(it) {
      const arts = Array.isArray(it.articles) ? it.articles : [];
      if (!arts.length) return "";
      return `<div class="section"><h3>相关说明</h3>${arts.map((a) => `
        <div class="article">
          <h4>${esc(a.title || "说明")}</h4>
          <p>${esc(a.content || "")}</p>
        </div>`).join("")}</div>`;
    }

    function renderDetail(it) {
      const detail = $("detail");
      if (!it) {
        detail.innerHTML = '<div class="empty">暂无数据</div>';
        return;
      }
      const pocUrls = Array.isArray(it.poc_url) ? it.poc_url : [];
      detail.innerHTML = `
        <div class="d-head">
          <div>
            <h1 class="d-title">${esc(it.title || "-")}</h1>
            <div class="ids">
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
              <span class="chip">${esc(it.cve_id || "无 CVE")}</span>
              <span class="chip">${esc(it.mps_id || "-")}</span>
              ${it.poc ? '<span class="chip">有 POC</span>' : ""}
              ${it.exp ? '<span class="chip">有 EXP</span>' : ""}
            </div>
          </div>
          <div class="actions">
            ${it._source_page ? `<a class="btn" href="${esc(it._source_page)}" target="_blank" rel="noopener">OSCS</a>` : ""}
            ${it.cve_id ? `<a class="btn" href="https://nvd.nist.gov/vuln/detail/${esc(it.cve_id)}" target="_blank" rel="noopener">NVD</a>` : ""}
          </div>
        </div>
        <div class="grid">
          <div class="stat"><div class="k">CVSS</div><div class="v">${esc(scoreText(it.cvss_score))}</div></div>
          <div class="stat"><div class="k">向量</div><div class="v">${esc(it.cvss_vector || "-")}</div></div>
          <div class="stat"><div class="k">CWE</div><div class="v">${esc(it.cwe || "-")}</div></div>
          <div class="stat"><div class="k">类型</div><div class="v">${esc(it.kind || it.kind_en || "-")}</div></div>
          <div class="stat"><div class="k">公开</div><div class="v">${esc(it.published_time || "-")}</div></div>
          <div class="stat"><div class="k">利用成本</div><div class="v">${esc(it.exploit_requirement_cost || "-")}</div></div>
          <div class="stat"><div class="k">可利用性</div><div class="v">${esc(it.exploitability || "-")}</div></div>
          <div class="stat"><div class="k">修复建议</div><div class="v">${esc(it.fix_suggestion || "-")}</div></div>
        </div>
        <div class="section"><h3>描述</h3><div class="box">${esc(it.description || "无描述")}</div></div>
        ${it.scope_influence ? `<div class="section"><h3>影响范围</h3><div class="box">${esc(it.scope_influence)}</div></div>` : ""}
        ${pocUrls.length ? `<div class="section"><h3>POC 链接</h3><div class="refs">${pocUrls.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join("")}</div></div>` : ""}
        <div class="section"><h3>参考链接</h3>${refsHtml(it)}</div>
        ${articlesHtml(it)}
      `;
    }

    function selectById(id) {
      const it = filtered.find((x) => (x.mps_id || x.cve_id) === id) ||
                 items.find((x) => (x.mps_id || x.cve_id) === id);
      if (!it) return;
      activeId = it.mps_id || it.cve_id;
      renderList();
      renderDetail(it);
      const btn = document.querySelector(`.item[data-id="${CSS.escape(activeId)}"]`);
      if (btn) btn.scrollIntoView({ block: "nearest" });
      history.replaceState(null, "", "#" + encodeURIComponent(activeId));
    }

    function applyFilter(q) {
      const query = (q || "").trim().toLowerCase();
      filtered = !query ? items.slice() : items.filter((it) => {
        const blob = [
          it.cve_id, it.mps_id, it.title, it.kind, it.kind_en, it.cwe, it.description, it.level
        ].map((x) => String(x || "").toLowerCase()).join(" ");
        return blob.includes(query);
      });
      renderList();
      if (filtered.length) {
        const still = filtered.some((x) => (x.mps_id || x.cve_id) === activeId);
        selectById(still ? activeId : (filtered[0].mps_id || filtered[0].cve_id));
      } else {
        activeId = null;
        renderDetail(null);
      }
    }

    $("search").addEventListener("input", (e) => applyFilter(e.target.value));

    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement !== $("search")) {
        e.preventDefault();
        $("search").focus();
        return;
      }
      if (!filtered.length) return;
      const idx = filtered.findIndex((x) => (x.mps_id || x.cve_id) === activeId);
      if (e.key === "ArrowDown") {
        e.preventDefault();
        const next = filtered[Math.min(filtered.length - 1, Math.max(0, idx) + 1)];
        selectById(next.mps_id || next.cve_id);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        const prev = filtered[Math.max(0, idx - 1)];
        selectById(prev.mps_id || prev.cve_id);
      }
    });

    const hashId = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    if (hashId && items.some((x) => (x.mps_id || x.cve_id) === hashId)) {
      activeId = hashId;
      renderList();
      selectById(hashId);
    } else if (items.length) {
      selectById(items[0].mps_id || items[0].cve_id);
    } else {
      renderList();
      renderDetail(null);
    }
  </script>
</body>
</html>
