<html lang="zh-CN">
<head>

  <title>OSCS 严重/高危情报</title>

  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg0: #071015;
      --bg1: #0d1a20;
      --bg2: #12242c;
      --panel: rgba(14, 28, 34, 0.88);
      --line: rgba(140, 190, 170, 0.16);
      --text: #e7f2ec;
      --muted: #8aa39a;
      --accent: #2fd3a2;
      --accent-dim: rgba(47, 211, 162, 0.14);
      --crit: #ff5a4e;
      --crit-bg: rgba(255, 90, 78, 0.14);
      --high: #ff9a3c;
      --high-bg: rgba(255, 154, 60, 0.14);
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; min-height: 100%;
      color: var(--text);
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(47, 211, 162, 0.16), transparent 55%),
        radial-gradient(900px 500px at 100% 0%, rgba(255, 90, 78, 0.10), transparent 50%),
        linear-gradient(160deg, var(--bg0), var(--bg1) 45%, #0a151b);
    }
    body::before {
      content: "";
      position: fixed; inset: 0; pointer-events: none; opacity: 0.35;
      background-image:
        linear-gradient(rgba(140, 190, 170, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(140, 190, 170, 0.05) 1px, transparent 1px);
      background-size: 28px 28px;
      mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
    }
    .shell {
      position: relative;
      max-width: 1280px;
      margin: 0 auto;
      padding: 28px 20px 40px;
      display: grid;
      gap: 18px;
      min-height: 100vh;
    }
    header.hero {
      display: grid;
      gap: 10px;
      padding: 22px 24px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(135deg, rgba(18, 36, 44, 0.95), rgba(10, 22, 28, 0.9));
      box-shadow: var(--shadow);
    }
    .brand {
      font-family: Syne, sans-serif;
      font-weight: 800;
      font-size: clamp(1.6rem, 3vw, 2.2rem);
      letter-spacing: -0.03em;
      line-height: 1.1;
    }
    .brand span { color: var(--accent); }
    .sub {
      color: var(--muted);
      font-size: 0.95rem;
      max-width: 62ch;
    }
    .meta {
      display: flex; flex-wrap: wrap; gap: 8px 14px;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.78rem;
      color: var(--muted);
    }
    .meta b { color: var(--text); font-weight: 500; }
    .layout {
      display: grid;
      grid-template-columns: minmax(280px, 360px) 1fr;
      gap: 16px;
      min-height: 70vh;
    }
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
    }
    .panel {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 520px;
    }
    .panel-hd {
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
    }
    .panel-hd h2 {
      margin: 0; font-size: 0.92rem; font-weight: 600; letter-spacing: 0.02em;
    }
    .search {
      width: 100%;
      margin: 0 16px 12px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: rgba(0,0,0,0.25);
      color: var(--text);
      font: inherit;
      outline: none;
    }
    .search:focus { border-color: rgba(47, 211, 162, 0.5); box-shadow: 0 0 0 3px var(--accent-dim); }
    .list {
      overflow: auto;
      padding: 0 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .item {
      text-align: left;
      width: 100%;
      border: 1px solid transparent;
      border-radius: 12px;
      padding: 12px;
      background: transparent;
      color: inherit;
      cursor: pointer;
      transition: background .15s, border-color .15s, transform .15s;
    }
    .item:hover { background: rgba(255,255,255,0.03); border-color: var(--line); }
    .item.active {
      background: var(--accent-dim);
      border-color: rgba(47, 211, 162, 0.35);
    }
    .item-top {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      margin-bottom: 6px;
    }
    .cve {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.82rem;
      font-weight: 600;
    }
    .title {
      font-size: 0.86rem;
      color: #c8ddd4;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;

      margin-top: 8px;

      font-family: "JetBrains Mono", monospace;
      font-size: 0.72rem;
      color: var(--muted);
    }

      display: inline-flex; align-items: center;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .badge.crit { color: #ffb4ad; background: var(--crit-bg); }
    .badge.high { color: #ffd0a3; background: var(--high-bg); }
    .badge.other { color: var(--muted); background: rgba(255,255,255,0.06); }
    .detail {
      overflow: auto;
      padding: 18px 20px 28px;
    }
    .empty {
      margin: auto; color: var(--muted); text-align: center; padding: 40px 20px;
    }
    .d-head {
      display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .d-title {
      font-family: Syne, sans-serif;
      font-size: clamp(1.25rem, 2.2vw, 1.7rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0 0 8px;
      line-height: 1.2;
    }
    .ids {
      display: flex; flex-wrap: wrap; gap: 8px;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.82rem;
    }
    .chip {
      padding: 4px 10px;
      border-radius: 8px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--line);
      color: #cfe4da;
    }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.03);
      color: var(--text);
      text-decoration: none;
      font-size: 0.85rem;
      transition: border-color .15s, background .15s;
    }
    .btn:hover { border-color: rgba(47,211,162,.45); background: var(--accent-dim); }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
      margin: 16px 0 20px;
    }
    .stat {
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(0,0,0,0.18);
    }
    .stat .k { color: var(--muted); font-size: 0.75rem; margin-bottom: 6px; }
    .stat .v {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.95rem;
      font-weight: 600;
      word-break: break-all;
    }
    .section { margin-top: 18px; }
    .section h3 {
      margin: 0 0 8px;
      font-size: 0.9rem;
      color: #b7d0c6;
      letter-spacing: 0.04em;
      text-transform: uppercase;

      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(0,0,0,0.2);
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.92rem;
      color: #d7e8e0;
    }
    .refs { display: flex; flex-direction: column; gap: 8px; }
    .refs a {
      color: var(--accent);
      text-decoration: none;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.8rem;
      word-break: break-all;
    }
    .refs a:hover { text-decoration: underline; }
    .article {
      margin-top: 10px;
      padding: 12px 14px;
      border-left: 3px solid rgba(47,211,162,.45);
      background: rgba(47,211,162,.05);
      border-radius: 0 10px 10px 0;

    .article h4 { margin: 0 0 6px; font-size: 0.92rem; }
    .article p { margin: 0; color: #c5d8cf; font-size: 0.88rem; white-space: pre-wrap; }
    .hint { color: var(--muted); font-size: 0.78rem; }
    .count-pill {

      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(255,255,255,0.06);
      color: var(--muted);
    }

ss_score": 9.5, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-1321", "description": "Tinypool 是开源的 Node.js 最小化 worker 线程池库（npm 包 tinypool），基于 worker_threads 为宿主应用提供并行任务执行能力，被 Vitest 等测试框架用作底层 worker 池。\n受影响版本中，ThreadPool 构造函数通过对象展开 { ...kDefaultOptions, ...options, filename, maxQueue: 0 } 构建 this.options，该写法会把从 Object.prototype 继承的 execArgv、env 属性复制为自有属性；_addNewWorker() 随后将 this.options.execArgv 与 this.options.env 显式传给 worker_threads.Worker，Node.js 本身会忽略 Worker 选项中原型继承的值，tinypool 的显式读取绕过了该保护，攻击者事先在宿主进程中污染 Object.prototype.execArgv 或 Object.prototype.env（后者可携带 NODE_OPTIONS），即可让每个新建 worker 通过命令行预加载参数或 NODE_OPTIONS 加载攻击者指定的 JavaScript，以宿主进程权限执行任意代码，进而窃取 CI 密钥、签名材料或构建产物。\n修复版本中通过以 null 原型对象聚合选项切断该链路，ThreadPool 构造函数改为 Object.assign(Object.create(null), kDefaultOptions, options, { filename, maxQueue: 0 })，继承自 Object.prototype 的 execArgv、env 不再被复制为自有属性，Worker 无法再收到被污染的预加载参数与环境变量，并新增回归测试覆盖原型污染场景。", "effects": [{"comp_name": "tinypool", "ecosystem": "npm", "versions": [{"affected_version": "(-∞,2.1.1)", "min_fixed_version": "2.1.1", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "原型污染", "kind_en": "对象原型属性的控制不当的修改（“原型污染”）", "last_modified_time": "2026-10-03", "level": "Critical", "mps_id": "MPS-pzja-fh18", "poc": false, "poc_url": [], "published_time": "2026-10-03", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-pzja-fh18", "name": "https://www.oscs1024.com/hd/MPS-pzja-fh18"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-104848", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-104848"}, {"url": "https://github.com/tinylibs/tinypool/security/advisories/GHSA-5gmw-xhrv-c9v3", "name": "https://github.com/tinylibs/tinypool/security/advisories/GHS ion": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "关键功能的认证机制缺失", "kind_en": "缺少关键功能的身份验证", "last_modified_time": "2026-10-03", "level": "Critical", "mps_id": "MPS-58d0-6a22", "poc": false, "poc_url": [], "published_time": "2026-10-03", "reference_url_list": [{"url": "https://securityonline.info/monta-ev-charging-vulnerabilities/", "name": ""}, {"url": "https://www.cisa.gov/news-events/ics-advisories/icsa-26-274-02", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Monta 充电平台认证缺失漏洞", "_translated": true, "_saved_at": "2026-10-02T22:45:16+00:00", "_first_saved_at": "2026-10-02T22:45:16+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-58d0-6a22"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-105134", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:N/AC:L/Au:N/C:C/I:C/A:C", "severity": "high", "base_score": 10}], "cvssv3": [{"source": "VulDB", "vector": "CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H/E:P/RL:O/RC:C", "severity" 实 IdP 回调写入的 linkingUser，邮箱与手机验证标志仅在表单提交值与 IdP 返回值一致时保留，切断了伪造外部身份完成注册的路径。", "effects": [{"comp_name": "github.com/zitadel/zitadel", "ecosystem": "go", "versions": [{"affected_version": "[3.0.0,3.4.14)", "min_fixed_version": "3.4.14", "repository": "go", "solutions": [], "upstream": true}, {"affected_version": "[4.0.0,4.16.2)", "min_fixed_version": "4.16.2", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "使用欺骗进行的认证绕过", "kind_en": "通过欺骗绕过身份验证", "last_modified_time": "2026-10-04", "level": "Critical", "mps_id": "MPS-njo9-pksf", "poc": false, "poc_url": [], "published_time": "2026-10-04", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-njo9-pksf", "name": "https://www.oscs1024.com/hd/MPS-njo9-pksf"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-105215", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-105215"}, {"url": "https://github.com/zitadel/zitadel/security/advisories/GHSA-738m-7888-jfv8", "name": "GitHub Security Advisory (GHSA-738m-7888-jfv8)"}, {"url": "https://www.vulncheck.com/advisories/zitadel-before-4.16.2-account-pre-hijacking-via-forged-external-idp-callback", "name": "VulnCheck Advisory: ZITADEL before 4.16.2 Account Pre-Hijacking via Forged External IdP Callback"}], "scope_influence": "", "tags": ["go"], "title": "ZITADEL账户预劫持漏洞", "_translated": true, "_saved_at": "2026-10-04T18:56:40+00:00", "_first_saved_at": "2026-10-04T18:56:40+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-njo9-pksf"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-103355", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:N/A:L", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:N/A:L", "cwe": "CWE-89", "description": "Unlimited Elements For Elementor（插件标识 unlimited-elements-for-elementor）是面向 WordPress Elementor 页面构建器的开源（GPLv2）扩展插件，提供文章列表、过滤器组件和模板库等功能，官方源码托管于 WordPress.org 插件目录。\n受影响版本中，前端 AJAX 过滤流程允许未认证请求通过 ucfrontajaxaction 触发文章搜索，攻击者可控的搜索词经请求参数 ucs 进入 WP_Query；UniteCreatorAjaxSeach::setWherePostParts 挂载在 posts_where 过滤器上，使用形如 (wp_posts.$field LIKE '[^']*') 的正则从已生成的 SQL WHERE 语句中删除未选中搜索字段的条件，正则中的 [^']* 不识别 prepare 转义后的引号，攻击者在搜索词中携带单引号可使删除边界落在字符串字面量中间，剩余搜索词被保留为可执行 SQL，造成无需登录的盲注，可用于读取或篡改数据库数据。\n修复版本中通过放弃对已生成 SQL 语句的字符串裁剪解决该问题：2.0.21 将搜索字段过滤从 posts_where 迁移到 posts_search 过滤器（setSearchPostParts），以白名单限定 post_title、post_excerpt、post_content 三个字段，并使用 $wpdb-\u003eesc_like 与 $wpdb-\u003eprepare 按搜索词重建 LIKE 条件，搜索词无法再截断 SQL 字面量，注入链路被切断。", "effects": [{"comp_name": "unlimited-elements-for-elementor", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.0.21)", "min_fixed_version": "2.0.21", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-10-04", "level": "Critical", "mps_id": "MPS-rwbc-e4mg", "poc": false, "poc_url": [] A:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-94", "description": "MindSearch 是上海人工智能实验室 InternLM 团队开源的基于大语言模型的多智能体网络搜索框架，通过规划智能体把用户问题分解为 Web 搜索图，并以 Python 解释器动作驱动子问题查询与结果汇总。\n受影响版本中，API 服务默认绑定 0.0.0.0:8002 并暴露未鉴权的 POST /solve 接口，请求体中的 inputs 参数直接作为规划器大模型的用户输入；模型按系统提示在 \u003c|action_start|\u003e\u003c|interpreter|\u003e 块中生成 Python 代码，mindsearch/agent/graph.py 的 ExecutionAction.run 经 extract_code 提取消息中的代码围栏后直接执行 exec(command, global_dict, local_dict)，而 mindsearch/agent/mindsearch_agent.py 传入的 global_dict 为 globals()，该过程无沙箱、无语法白名单且保留完整 __builtins__，攻击者通过提示词引导模型把任意系统命令写入解释器块，最终以服务进程权限（官方 Docker 镜像中为 root）执行任意代码。\n修复版本中通过，上游仓库最后一次代码推送为 2025-07-04，漏洞披露后厂商未响应；在官方修复发布前，可通过为 /solve 增加身份认证并将服务绑定地址收紧为 127.0.0.1、停止对模型输出执行 exec、仅分发结构化的 WebSearchGraph 操作，或将解释器隔离至无特权且无网络出口的沙箱容器中运行。", "effects": [{"comp_name": "InternLM:MindSearch", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,7952c5f]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "代码注入", "kind_en": "代码生成控制不当（“代码注入”）", "last_modified_time": "2026-10-04", "level": "Critical", "mps_id": "MPS-x3fy-gb6a", "poc": false, "poc_url": [], "published_time": "2026-10-04", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-x3fy-gb6a", "name": "https://www.oscs1024.com/hd/MPS-x3fy-gb6a"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-105135", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-105135"}, {"url": "https://vuldb.com/vuln/413352", "name": "VDB-413352 | InternLM MindSearch Planner Agent graph.py ExecutionAction.run code injection"}, {"url": "https://vuldb.com/vuln/413352/cti", "name": "VDB-413352 | CTI Indicators (IOB, IOC, TTP, IOA)"}, {"url": "https://vuldb.com/cve/CVE-2026-105135", "name": "CVE-2026-105135 | CVE Analysis and Report"}, {"url": "https://vuldb.com/submit/943315", "name": "Submit #943315 | InternLM MindSearch 0.1.0 Code Injection"}, {"url": "https://gist.github.com/DReazer/7ad46df9da73d0cf414276e4195b2183", "name": ""}], "scope_influence": "", "tags": ["AI", "应用软件"], "title": "MindSearch 远程代码执行漏洞", "_translated": true, "_saved_at": "2026-10-04T09:14:15+00:00", "_first_saved_at": "2026-10-04T09:14:15+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-x3fy-gb6a"}, {"analysis_status": 0, "articles": [{"content": "由于应用程序或系统中存在敏感信息未经适当保护而被泄露给攻击者或未经授权的用户，这些敏感信息可能包括用户凭据、个人身份信息、敏感业务数据、系统配置信息等。信息暴露漏洞通常是由于设计、实施或配置错误引起的，例如不正确的访问控制、弱密码策略、缺乏加密、错误的日志处理等。", "title": "什么是未授权敏感信息泄露"}, {"content": "- 直接访问敏感信息：攻击者可以通过直接访问不正确配置或不受保护的资源来获取敏感信息，如通过公开可访问的URL、未经授权的文件目录访问等。\n- 越权访问：攻击者可能利用访问控制错误或不正确的权限配置来获取他们没有权限访问的敏感信息。\n- 错误信息披露：应用程序在错误处理过程中可能泄露敏感信息，例如将错误消息中的敏感数据返回给客户端或显示在日志文件中。\n- 信息泄露通过响应：攻击者可能利用应用程序在响应中不正确地包含敏感信息，如通过网页源代码、响应头部或响应消息体中的敏感数据。", "title": "未授权敏感信息泄露常见的攻击方式"}, {"content": "- 访问控制：确保只有经过授权的用户能够访问敏感信息，使用强大的身份验证和授权机制。\n- 数据加密：对于敏感信息，使用适当的加密算法对数据进行加密，包括数据传输和存储过程中的加密。\n- 错误处理和日志安全：正确处理错误情况，避免在错误消息中暴露敏感信息。同时，确保日志记录功能的安全性，避免将敏感信息记录在日志文件中。\n- 安全配置和最佳实践：遵循安全最佳实践，对应用程序、服务器和系统进行适当的配置，包括访问控制、权限管理、密码策略等。\n- 审计和监控：实施日志审计和监控机制，及时检测和响应任何异常活动或潜在的信息暴露事件。\n- 安全开发实践：在应用程序开发过程中，进行安全代码审查、漏洞扫描和安全测试，以及敏感信息的正确处理和保护。", "title": "如何预防未授权敏感信息泄露"}], "cnvd_id": "", "cve_id": "CVE-2026-105211", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.1}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:H/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.2}]}, "cvss_score": 9.2, "cvss_vector": "CVSS:4.0/AV:N/AC:H/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-200", "description": "ZITADEL 是开源的身份认证与访问管理（IAM）系统，提供 OIDC、SAML 单点登录与多因素认证能力，其托管的 Login V2 页面用于在浏览器中完成登录流程。\n受影响版本中，Login V2 的 updateOrCreateSession server action 将浏览器提交的 challenges 参数原样转发给后端 Session API，并把响应中的挑战数据原样返回给浏览器；攻击者仅凭受害者登录名即可建立只识别用户的会话（identify-only session），同时请求 OTP-Email 与 OTP-SMS 两种挑战并指定 returnCode 投递类型，使新生成的两个 OTP 验证码以明文形式直接出现在 server action 响应中，提交这两个验证码后 ZITADEL 将两个第二因子计为已满足 MFA，攻击者无需密码、passkey 或第三方登录便获得受害者的 MFA 认证会话，当受害者为 IAM_OWNER 等实例管理员时整个实例可被接管。\n修复版本中通过在 createSessionAndUpdateCookie 与 setSessionAndUpdateCookie 转发请求前统一执行 sanitizeChallenges 清洗，强制关闭 OTP-SMS 的 returnCode 并把 OTP-Email 的 returnCode 投递类型改写为 sendCode，同时 updateOrCreateSession 仅向浏览器返回 WebAuthN 挑战，OTP 验证码不再经浏览器侧 server action 泄露，从入口处切断该攻击链。", "effects": [{"comp_name": "zitadel", "ecosystem": "linux", "versions": [{"affected_version": "[4.0.0,4.17.1)", "min_fixed_version": "4.17.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "未授权敏感信息泄露", "kind_en": "向未经授权的行为者泄露敏感信息", "last_modified_time": "2026-10-04", "level": "Critical", "mps_id": "MPS-mfiu-5l0d", "poc": false, "poc_url": [], "published_time": "2026-10-04", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-mfiu-5l0d", "name": "https://www.oscs1024.com/hd/MPS-mfiu-5l0d"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-105211", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-105211"}, {"url": "https://github.com/zitadel/zitadel/security/advisories/GHSA-3gwm-5wx8-4gm6", "name": "GitHub Security Advisory (GHSA-3gwm-5wx8-4gm6)"}, {"url": "https://www.vulncheck.com/advisories/zitadel-before-4.17.1-authentication-bypass-via-login-v2-otp-returncode", "name": "VulnCheck Advisory: ZITADEL before 4.17.1 Authentication Bypass via Login V2 OTP returnCode"}], "scope_influence": "", "tags": ["应用软件"], "title": "ZITADEL身份认证绕过漏洞", "_translated": true, "_saved_at": "2026-10-04T22:11:30+00:00", "_first_saved_at": "2026-10-04T22:11:30+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-mfiu-5l0d"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-105086", ，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-105089", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:R/S:C/C:H/I:H/A:N", "severity": "high", "base_score": 8.7}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:P/VC:H/VI:H/VA:N/SC:H/SI:H/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:P/VC:H/VI:H/VA:N/SC:H/SI:H/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-79", "description": "WWBN AVideo 是公开托管在 GitHub 上的 PHP 音视频平台，用于发布视频、管理频道播放列表并展示预告片。\n受影响版本中，具备上传权限的用户可经视频保存接口写入 trailer1。Video::setTrailer1() 仅使用 FILTER_VALIDATE_URL 接收该值，引号、尖括号和 HTML 实体仍会被保存。YouPHPFlix2 的 BigVideo.php、BigVideoButtons.php、row_info.php 以及 view/channelPlaylistItems.php 只检查字段非空，再将 parseVideos() 的返回值未转义拼入 iframe src 或 onclick 中的 JavaScript 字符串，访客打开对应页面时会在浏览器中执行注入脚本。\n修复版本中通过将上述模板的渲染条件改为 isValidURL()，并对 parseVideos() 的输出调用 htmlspecialchars 进行 ENT_QUOTES 转义，使未通过校验或含引号、尖括号的预告片地址不再进入页面脚本上下文。", "effects": [{"comp_name": "wwbn/avideo", "ecosystem": "composer", "versions": [{"affected_version": "(-∞,29.2.0]", "min_fixed_version": "", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-10-05", "level": "Critical", "mps_id": "MPS-drwq-ltfo", "poc": false, "poc_url": [ I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "cwe": "CWE-1336", "description": "fsspec 是一个开源的 Python 文件系统接口规范与实现库，为本地、远程与云存储提供统一访问抽象，其 ReferenceFileSystem 子系统负责解析 Kerchunk 引用文档并对外提供 reference:// 协议，被 xarray、kerchunk 等数据科学组件广泛使用。\n受影响版本中，ReferenceFileSystem 打开引用文档时会用未加沙箱的 jinja2.Template(...).render(...) 渲染文档字段：_process_gen 对 gen 文档的 key、url、offset、length 无条件渲染，_process_templates 把 templates 中包含 {{ 的值包装成未加沙箱的渲染函数，_process_references1._render_jinja 在 simple_templates=False 时渲染 refs 字段；攻击者构造含模板表达式的引用文档并以内联字典或 URL 提供，受害者通过 fsspec.filesystem(\"reference\", fo=...) 或 xarray 打开 reference:// 数据集时，任意 Python 代码会在读取任何数据之前执行。\n修复版本中通过两次提交完成加固：_process_gen 在 simple_templates 保持默认 True 时直接返回空结果，gen 文档不再进行任何模板求值；其余模板渲染统一改用 jinja2.sandbox.SandboxedEnvironment().from_string(...)，阻断 __init__.__globals__ 等沙箱逃逸属性访问，引用文档中的模板表达式无法再触发代码执行。", "effects": [{"comp_name": "fsspec", "ecosystem": "pip", "versions": [{"affected_version": "[0.9.0,2026.6.0)", "min_fixed_version": "2026.6.0", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "模板注入", "kind_en": "模板引擎中使用的特殊元素的不正确中和", "last_modified_time": "2026-10-03", "level": "High", "mps_id": "MPS-vml7-1shr", "poc": false, "poc_url": [], "published_time": "2026-10-03", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-vml7-1shr", "name": "https://www.oscs1024.com/hd/MPS-vml7-1shr"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-104851", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-104851"}, {"url": "https://github.com/fsspec/filesystem_spec/security/advisories/GHSA-27vj-qcqg-25rc", "name": "https://github.com/fsspec/filesystem_spec/security/advisories/GHSA-27vj-qcqg-25rc"}, {"url": "https://github.com/fsspec/filesystem_spec/pull/2029", "name": "https://github.com/fsspec/filesystem_spec/ 的安全更新和补丁，以确保已知的跨界内存读漏洞得到修复。及时更新相关软件和库，以避免使用已知存在漏洞的版本。", "title": "如何预防越界读取"}], "cnvd_id": "", "cve_id": "CVE-2026-104433", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-125", "description": "Mooncake 是 kvcache-ai 开源的 KVCache 传输引擎（Apache-2.0），面向大模型推理场景提供跨节点 KV cache 传输与 P2P 握手能力，常与 SGLang、vLLM 等推理框架配合部署，属于大模型基础设施组件。\n受影响版本中，传输引擎默认在所有网络接口上启动 P2P 握手监听线程 SocketHandShakePlugin::startDaemon，对到达的 TCP 连接不要求认证，并把已连接套接字传入 include/common.h 的 readString。readString 从网络读取 8 字节 64 位长度后仅做上界检查，随后按该长度构造 std::vector\u003cchar\u003e 并无条件访问 buffer[0]；攻击者发送长度为 0 的握手帧时缓冲区为空，buffer[0] 构成越界读，发布构建下进程收到 SIGSEGV 终止，托管该引擎的 SGLang 推理服务随之不可用。\n修复版本中通过在 readString 中新增 length == 0 的提前返回，空长度帧不再构造缓冲区、不再访问 buffer[0]，切断零长度握手帧进入越界读的路径，0.3.12 及以上版本不受该问题影响。", "effects": [{"comp_name": "mooncake-transfer-engine", "ecosystem": "pip", "versions": [{"affected_version": "(-∞,0.3.12)", "min_fixed_version": "0.3.12", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界读取", "kind_en": "越界读取", "last_modified_time": "2026-10-03", "level": "High", "mps_id": "MPS-d02j-3n9c", "poc": false, "poc_url": [], "published_time": "2026-10-03", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-d02j-3n9c", "name": "https://www.oscs1024.com/hd/MPS-d02j-3n9c"} 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-71890", "cvss": {"cvssv4": [{"source": "91579145-5d7b-4cc5-b925-a0262ff19630", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:Amber", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:Amber", "cwe": "CWE-863", "description": "Bouncy Castle for Java 是 Legion of the Bouncy Castle 开源发布的 Java 密码学库，其 org.bouncycastle.mls 模块（Maven 坐标 org.bouncycastle:bcmls-jdk18on）实现了 RFC 9420 定义的 MLS 安全群组通信协议，供应用构建端到端加密群组。\n受影响版本中，外部提交（external commit）提案列表校验函数 org.bouncycastle.mls.protocol.Group.validateExternalCachedProposals 只按类型统计提案并用 removedIsInTree 限制被移除叶子索引在树内，未校验被移除叶子与加入者本人的关系；普通提案校验器用于拦截自移除的 not_me 规则在该路径被有意跳过以支持合法的重同步提交，却没有补上等价的归属判定。任何持有群组公开 GroupInfo 的攻击者可构造携带指向任意成员 LeafIndex 的 Remove 提案的外部提交，成员端应用经 Group.handle 处理该消息时校验通过并应用移除，受害成员被逐出群组，攻击者的叶子占据其在 ratchet tree 中腾出的槽位并成为新纪元成员，可读取后续群组消息并伪造成员身份发言，Group.handle 全程不报错。\n修复版本中通过在 validateExternalCachedProposals 中引入 removesOwnPriorAppearance 归属校验切断该链路，取提交 path 字段中的加入者新叶子与被移除叶子，按凭证编码字节比较，仅当二者完全一致时接受携带 Remove 的外部提交；inferCommitType 与 validateCachedProposals 在发送侧与接收侧统一传入加入者叶子强制执行该规则，凭证按编码比较而非使用仅对 basic 类型填充的 Credential.getIdentity()，避免任意两个 x509 凭证被误判为同一参与者。", "effects": [{"comp_name": "bc-java", "ecosystem": "linux", "versions": [{"affected_version": "[1.73,1.86)", "min_fixed_version": "1.86", "repository": thReviewer 类用于对 X.509 证书路径执行逐证书审查并给出信任结论。\n受影响版本中，org.bouncycastle.pkix.jcajce.PKIXCertPathReviewer 与旧版 org.bouncycastle.x509.PKIXCertPathReviewer 的 checkNameConstraints 方法以 index \u003e 0 作为循环边界遍历证书路径，而标准 CertPath 排序中索引 0 为目标证书，RFC 5280 第 6.1.3 节 (b)、(c) 步针对叶子证书 subject DN 与 subjectAltName 的允许及排除子树检查从未覆盖目标证书。当攻击者可向应用提交一条终端实体证书违反其签发 CA 所施加 NameConstraints 的证书链时，isValidCertPath() 仍返回 true 且错误列表为空，应用据此做出信任决策时会接受受限 CA 无权签发的证书，导致名称约束保护失效。\n修复版本中通过将 checkNameConstraints 的循环边界改为 index \u003e= 0，使路径中包括目标证书在内的全部证书都接受名称约束检查，按 RFC 5280 第 6.1.3 节要求对最后一张证书豁免第 4.2.1.10 节 self-issued 豁免，并对目标证书跳过第 6.1.4 节 (g) 步约束累积，使审查结论与 CertPathValidator(\"PKIX\", \"BC\") 的判定保持一致。", "effects": [{"comp_name": "org.bouncycastle:bcpkix-fips", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,2.0.13)", "min_fixed_version": "2.0.13", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "(-∞,1.0.13)", "min_fixed_version": "1.0.13", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "(-∞,2.1.13)", "min_fixed_version": "2.1.13", "repository": "maven", "solutions": [], "upstream": true}]}, {"comp_name": "org.bouncycastle:bcpkix-jdk18on", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,1.86)", "min_fixed_version": "1.86", "repository": "maven", "solutions": [], "upstream": true}]}, {"comp_name": "org.bouncycastle:bcpkix-lts8on", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,2.73.13)", "min_fixed_version": "2.73.13", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "证书验证不恰当", "kind_en": "证书验证不当", "last_modified_time": "2026-10-03", "level": "High", "mps_id": "MPS-rv4s-hop0", "poc": false, "poc_url": [], "published_time": "2026-10-03", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-rv4s-hop0", "name": "https://www.oscs1024.com/hd/MPS-rv4s-hop0" 键资源，那么他们可能会获得未经授权的访问权限。\n- 未正确验证用户输入：当开发人员没有正确验证用户输入时，可能会发生这种情况。例如，如果开发人员未正确过滤用户输入的用户名或密码，那么黑客可能会利用这些信息轻松地访问系统。\n", "title": "关键资源权限分配不当常见的攻击方式"}, {"content": "- 使用强密码：管理员应该使用强密码来保护系统，并定期更改密码。强密码应该包括数字、字母和符号，并且应该不同于其他帐户使用的密码。\n- 正确配置权限：管理员应该正确配置系统中不同资源所需的权限。用户可以被授予访问特定资源的权限，但不应该被授予访问其他资源的权限。\n- 权限限制：管理员应该使用权限限制来限制用户对特定资源的访问。例如，用户可以被授予访问特定文件夹的权限，但不能访问其他文件夹。\n- 输入验证：开发人员应该正确验证用户输入。例如，他们可以过滤用户输入的用户名和密码，以确保它们符合预期的格式。\n- 安全培训：管理员和用户应该接受安全培训，以便了解如何识别和避免常见的安全漏洞，例如不正确权限授予漏洞。\n- 定期更新和修补软件：系统软件和应用程序应该定期更新和修补，以确保它们不受最新安全漏洞的影响。", "title": "如何预防关键资源权限分配不当"}], "cnvd_id": "", "cve_id": "CVE-2026-104854", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.5}]}, "cvss_score": 8.5, "cvss_vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-732", "description": "Nx 是 Nrwl 开源的 monorepo 构建编排工具（npm 包 nx），面向 TypeScript 及多语言代码库提供任务编排、项目图计算、构建缓存与守护进程加速，其常驻 daemon 与插件隔离 worker 通过 Unix domain socket 通信。\n受影响版本中，daemon 与 plugin worker 的 socket 目录由 tmp-dir.ts 的 socketDirName 以 workspaceRoot 与 pid 的哈希命名，并经 getSocketDir 以 mkdirSync 默认权限创建，未设置 owner-only 模式，plugin worker socket 更直接位于共享系统临时根目录，目录与 socket 文件对本机其他账户可达且连接不经过任何认证；攻击者连接 socket 后发送 PROCESS_IN_BACKGROUND 请求，handleProcessInBackground 按 payload.requirePath require 模块并调用其 default export，攻击者在本账户可写路径放置模块文件即可让 daemon 以运行 Nx 的账户执行任意代码，其余 handler 还会向同一未认证调用方返回工作区文件内容、项目图与任务哈希。\n修复版本中通过新增 owned-private-dir 守护重建 socket 目录约束：socket 根目录按 NX_SOCKET_DIR、/tmp/.nx/\u003cuid\u003e/sockets、~/.nx/sockets 回退链以 0700 owner-only 权限建立并复核，拒绝共享、symlink 与属主异常目录，socket 文件在监听后 chmod 0600，daemon 与 plugin worker 通道同时校验 workspaceRoot 并为插件 socket 名引入随机熵，切断了其他本地账户连接 socket 进而执行代码的路径。", "effects" mment，user、author 取值（含通过注册路由写入的 KirkiComponentLib_* 用户元数据）未经转义直接拼接进页面；页面渲染链路存在 do_shortcode 调用，攻击者预先存储的短代码语法被解析执行，未授权攻击者可触发站点内已注册的任意短代码，实现任意代码执行并窃取敏感数据。\n修复版本中通过新增 Utils::sanitize_plain_text_input 在存储阶段循环解码 HTML 实体至稳定态并删除全部方括号，组件库注册入口统一接入该清洗逻辑；esc_dynamic_text_value 改为解码至稳定态后直接移除所有方括号，纯文本类型扩展为 comment、user、author，ShowUserMetadata 与 post_meta 短代码输出同步剥离方括号并拒绝受保护元数据，切断了存储型短代码到 do_shortcode 执行的利用链。", "effects": [{"comp_name": "kirki", "ecosystem": "linux", "versions": [{"affected_version": "[0,6.3.2)", "min_fixed_version": "6.3.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "输入中指定数量的验证不当", "kind_en": "输入中指定数量的验证不正确", "last_modified_time": "2026-10-03", "level": "High", "mps_id": "MPS-4mrw-c9ny", "poc": false, "poc_url": [], "published_time": "2026-10-03", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-4mrw-c9ny", "name": "https://www.oscs1024.com/hd/MPS-4mrw-c9ny"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-103065", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-103065"}, {"url": "https://patchstack.com/database/wordpress/plugin/kirki/vulnerability/wordpress-kirki-plugin-6-3-1-arbitrary-code-execution-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Kirki 未授权代码执行漏洞", "_translated": true, "_saved_at": "2026-10-03T22:36:17+00:00", "_first_saved_at": "2026-10-03T16:59:13+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-4mrw-c9ny"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-85515", "cvss": {"cvssv4": [{"source": "91579145-5d7b-4cc5-b925-a0262ff19630", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:Amber", "severity": "high", "base_score": 8.2}]}, "cvss_score": 8.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:Amber", "cwe": "CWE-354", "description": "Bouncy Castle for Java 是开源的 Java 密码学库，其 OpenPGP 模块 bcpg 用于实现 RFC 9580/OpenPGP 消息的加密、签名与验证。\n受影响版本中，当加密消息被截断而外层包长度字段保持原值时，BCPGInputStream.PartialInputStream 因缺少密文抛出 EOFException，BCPGInputStream.nextPacketTag() 将该异常当作正常的消息结束返回，上层包流提前终止。SEIPDv1 路径上，IntegrityProtectedInputStream 只在 close() 中校验修改检测码，而该方法此前仅在其 read() 返回 -1 时被触发，截断消息不会产生该条件，PGPEncryptedData.verify() 始终未执行，接收方拿到未经任何完整性校验的 CFB 解密明文，厂商实测 136 种单字节密文修改均被无异常接受；AEAD 路径上，字面数据包结束在 AEAD 块边界且消费方以小于一个块的增量读取时，BcAEADUtil 与 JceAEADUtil 无法读取 RFC 9580 sec. 5.13.2 中认证总明文长度的末尾消息标签，已认证块之后的包被静默丢弃，签名并加密的消息被读取为格式良好的未签名消息且不抛出任何异常。\n修复版本中通过三处改动切断上述链路：BcAEADUtil 与 JceAEADUtil 的 AEAD 解密流将底层 EOFException 重新抛出为普通 IOException，使其不再被 nextPacketTag() 当作消息结束处理；OpenPGPMessageInputStream.close() 主动关闭本层的完整性保护流，保证截断消息的 SEIPDv1 修改检测码仍被校验；IntegrityProtectedInputStream.close() 增加幂等保护，使该流在普通路径上被关闭两次时校验逻辑仅执行一次。", "effects": [{"comp_name": "BC-FJA", "ecosystem": "linux", "versions": [{"affected_version": "[1.0.7,1.0.14)", "min_fixed_version": "1.0.14", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[2.0.7,2.0.14.1)", "min_fixed_version": "2.0.14.1", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,2.1.14)", "min_fixed_version": "2.1.14", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "BC-LTS-JAVA", "ecosystem": "linux", "versions": [{"affected_version": "[2.73.0,2.73.13)", "min_fixed_version": "2.73.13", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "org.bouncycastle:bcpg-jdk18on", "ecosystem": "maven", "versions": [{"affected_version": "[1.74,1.86)", "min_fixed_version": "1.86", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "完整性检查值验证不恰当", "kind_en": "完整性检查值验证不当", "last_modified_time": "2026-10-03", "level": "High", "mps_id": "MPS-fykd-ic2n", "poc": false, "poc_url": [], "published_time": "2026-10-03", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-fykd-ic2n", "name": "https://www.oscs1024.com/hd/MPS-fykd-ic2n"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-85515", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-85515"}, {"url": "https://github.com/bcgit/bc-java/wiki/CVE%E2%80%902026%E2%80%9085515", "name": ""}, {"url": "https://github.com/bcgit/bc-java/commit/ab7a235d1c20e3da28ce77167a96b5c14025efa7", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "Bouncy Castle OpenPGP消息截断校验绕过漏洞", "_translated": true, "_saved_at": "2026-10-03T12:56:51+00:00", "_first_saved_at": "2026-10-03T12:56:51+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-fykd-ic2n"}, {"analysis_status": 0, "articles": [{"content": "由于应用程序或系统中存在敏感信息未经适当保护而被泄露给攻击者或未经授权的用户，这些敏感信息可能包括用户凭据、个人身份信息、敏感业务数据、系统配置信息等。信息暴露漏洞通常是由于设计、实施或配置错误引起的，例如不正确的访问控制、弱密码策略、缺乏加密、错误的日志处理等。", "title": "什么是未授权敏感信息泄露"}, {"content": "- 直接访问敏感信息：攻击者可以通过直接访问不正确配置或不受保护的资源来获取敏感信息，如通过公开可访问的URL、未经授权的文件目录访问等。\n- 越权访问：攻击者可能利用访问控制错误或不正确的权限配置来获取他们没有权限访问的敏感信息。\n- 错误信息披露：应用程序在错误处理过程中可能泄露敏感信息，例如将错误消息中的敏感数据返回给客户端或显示在日志文件中。\n- 信息泄露通过响应：攻击者可能利用应用程序在响应中不正确地包含敏感信息，如通过网页源代码、响应头部或响应消息体中的敏感数据。", "title": "未授权敏感信息泄露常见的攻击方式"}, {"content": "- 访问控制：确保只有经过授权的用户能够访问敏感信息，使用强大的身份验证和授权机制。\n- 数据加密：对于敏感信息，使用适当的加密算法对数据进行加密，包括数据传输和存储过程中的加密。\n- 错误处理和日志安全：正确处理错误情况，避免在错误消息中暴露敏感信息。同时，确保日志记录功能的安全性，避免将敏感信息记录在日志文件中。\n- 安全配置和最佳实践：遵循安全最佳实践，对应用程序、服务器和系统进行适当的配置，包括访问控制、权限管理、密码策略等。\n- 审计和监控：实施日志审计和监控机制，及时检测和响应任何异常活动或潜在的信息暴露事件。\n- 安全开发实践：在应用程序开发过程中，进行安全代码审查、漏洞扫描和安全测试，以及敏感信息的正确处理和保护。", "title": "如何预防未授权敏感信息泄露"}], "cnvd_id": "", "cve_id": "CVE-2026-104476", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/U "_source_page": "https://www.oscs1024.com/hd/MPS-btmj-cphi"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-104861", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-1333", "description": "probe-image-size 是开源 npm 组件（MIT 协议），用于在不完整下载文件的前提下获取 JPG、PNG、GIF、WebP、SVG 等图片的尺寸，常用于上传校验、图片代理与链接预览等场景。\n受影响版本中，lib/parse_sync/svg.js 与 lib/parse_stream/svg.js 使用未锚定的搜索型正则 /\u003c[-_.:a-zA-Z0-9][^\u003e]*\u003e/ 提取 SVG 头部，当输入包含大量缺少闭合 \"\u003e\" 的 \"\u003c\" 字符时，正则引擎在每个 \"\u003c\" 位置重启 [^\u003e]* 扫描直至输入末尾，耗时随输入长度呈平方级增长；同步路径将整个 Buffer 无上限地转换为字符串后执行匹配，流式路径虽在 64KB 处封顶，却在每个数据块到达时对全部已累积数据重复执行 parseSvg()，攻击者可通过控制发送节奏放大重复扫描次数。攻击者向 probe.sync()、probe(stream) 或 probe(url) 提交此类数据能够占满 CPU 并阻塞 Node.js 事件循环，造成拒绝服务。\n修复版本中通过将 SVG 头部解析重构为共享模块 lib/common/svg_header.js 解决该问题，新实现的 PROLOG_RE、ROOT_RE 等正则全部以 ^ 锚定并在已知偏移处应用，消除了从每个位置重启扫描的回溯路径；同步与流式路径统一引入 10KB（MAX_DATA_LENGTH）输入上限，流式解析改为仅在数据块出现 \"\u003e\" 时对封顶后的累积数据解析一次，切断了平方级放大的因果链，恶意输入无法再长时间占用事件循环。", "effects": [{"comp_name": "probe-image-size", "ecosystem": "npm", "versions": [{"affected_version": "(-∞,7.4.0)", "min_fixed_version": "7.4.0", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "ReDoS", "kind_en": "正则表达式复杂性低效", "last_modified_time": "2026-10-03", "level": "High", "mps_id": "MPS-9cth-edka", "poc": false, "poc_url": [], "published_time": "2026-10-03", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-9cth-edka", "name": "https://www.oscs1024.com/hd/MPS-9cth-edka"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-104861", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-104861"}, {"url": "https://github.com/nodeca/probe-image-size/security/advisories/GHSA-gjj5-9665-rwrc", "name": "https://github.com/nodeca/probe-image-size/security/advisories/GHSA-gjj5-9665-rwrc"}, {"url": "https://github.com/nodeca/probe-image-size/commit/60cc96ac0b671e79e328213d0a8e831312b09e84", "name": "https://github.com/nodeca/probe-image-size/commit/60cc96ac0b671e79e328213d0a8e831312b09e84"}, {"url": "https://github.com/nodeca/probe-image-size/commit/9b74656d6f973cc59ea2ab1375c0d88390a402ad", "name": "https://github.com/nodeca/probe-image-size/commit/9b74656d6f973cc59ea2ab1375c0d88390a402ad"}, {"url": "https://github.com/nodeca/probe-image-size/commit/c032aefabdecf5cb50548ab9ba175db56353078f", "name": "https://github.com/nodeca/probe-image-size/commit/c032aefabdecf5cb50548ab9ba175db56353078f"}, {"url": "https://github.com/nodeca/probe-image-size/releases/tag/7.4.0", "name": "https://github.com/nodeca/probe-image-size/releases/tag/7.4.0"}], "scope_influence": "", "tags": ["npm", "开源"], "title": "probe-image-size拒绝服务漏洞", "_translated": true, "_saved_at": "2026-10-02T18:53:12+00:00", "_first_saved_at": "2026-10-02T18:53:12+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-9cth-edka"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-97337", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "cwe": "CWE-862", "description": "Simple Membership 是 wp.insider 开发的 WordPress 会员管理插件（GPLv2 开源），用于会员注册、付费内容保护与订阅管理，通过 wordpress.org 官方插件库分发。\n受影响版本中，前台 init 阶段 SwpmInitTimeTasks::check_and_do_email_activation() 将 swpm_email_activation 与 swpm_resend_activation_email 请求分发给 SwpmFrontRegistration::handle_email_activation() 与 resend_activation_email()，两个端点仅按 $_GET['swpm_member_id'] 定位会员并检查 account_state，缺少认证、nonce、能力与归属校验；SwpmRegistration::send_reg_email() 第 75 行优先以 $_POST['email'] 作为收件人并覆盖会员注册地址，激活数据 swpm_email_activation_data_usr_{member_id} 还以可逆加密保存注册明文密码。未认证攻击者可指定待激活会员 ID，将对方的激活邮件及包含用户名与明文密码的注册完成邮件重定向到任意地址，并利用邮件中的激活链接在未经会员同意的情况下激活该账户。\n修复版本中通过删除 send_reg_email() 内的 $_POST['email'] 覆盖逻辑、收件人固定为经 is_email() 校验的会员注册地址，并新增 SwpmEmailActivation 类统一处理激活令牌：wp_generate_password 生成 32 位随机令牌、24 小时有效期校验、hash_equals 恒时比较与按原始值条件删除的原子化消费防并发重放，同时以 allow_public_resend() 对公开重发请求限频并对缺失、已激活、限频返回一致提示以防会员枚举，注册与激活邮件不再包含明文密码。", "effects": [{"comp_name": "simple-membership", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,4.8.4)", "min_fixed_version": "4.8.4", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-10-03", "level": "High", "mps_id": "MPS-dqnh-oxv8", "poc": false, "poc_url": [], "published_time": "2026-10-03", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-dqnh-oxv8", "name": "https://www.oscs1024.com/hd/MPS-dqnh-oxv8"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-97337", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-97337"}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/ae2b6c4c-7dd6-41e7-8b8d-c09aa7fa660b?source=cve", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/simple-membership/tags/4.8.3/classes/class.swpm-registration.php#L75", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/simple-membership/tags/4.8.3/classes/class.swpm-front-registration.php#L850", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/simple-membership/tags/4.8.3/classes/class.swpm-front-registration.php#L774", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/simple-membership/tags/4.8.3/classes/class.swpm-init-time-tasks.php#L167", "name": ""}, {"url": "https://plugins.trac.wordpress.org/changeset?reponame=\u0026old=3716437%40simple-membership\u0026new=3716437%40simple-membership", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Simple Membership激活邮件劫持漏洞", "_translated": true, "_saved_at": "2026-10-03T07:27:08+00:00", "_first_saved_at": "2026-10-03T07:27:08+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-dqnh-oxv8"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-104859", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:L/AC:L/AT:P/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.3}]}, "cvss_score": 7.3, "cvss_vector": "CVSS:4.0/AV:L/AC:L/AT:P/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-78", "description": "Nx 是 Nrwl 开源的 monorepo 构建与发布管理工具，@nx/docker 为其官方 Docker 插件，用于容器项目的镜像构建、版本管理与发布。\n受影响版本中，@nx/docker 发布管道把 docker tag、docker images 镜像检查与 docker push 拼接成 shell 命令字符串，release.docker.repositoryName、registryUrl、--dockerVersion 与 NX_DOCKER_IMAGE_REF 等取值未经转义直接内插后交给 /bin/sh -c 执行，攻击者通过 Pull Request 或仓库配置变更植入 shell 语法，维护者或 CI 运行 nx release version、nx release publish 时会以发布任务权限执行任意命令，导致镜像仓库凭据与云令牌泄露，--dry-run 也无法阻止发布前置检查中的注入命令执行。\n修复版本中通过把上述命令改为 execFile、execFileSync 的参数数组调用并移除 shell 层，镜像引用中的元字符保留在单一参数内，无法再拼接出第二条命令，升级 22.7.8、23.1.1 及以上版本可获得修复。", "effects": [{"comp_name": "@nx/docker", "ecosystem": "npm", "versions": [{"affected_version": "[23.0.0,23.1.1)", "min_fixed_version": "23.1.1", "repository": "npm", "solutions": [], "upstream": true}, {"affected_version": "[21.4.0,22.7.8)", "min_fixed_version": "22.7.8", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-10-03", "level": "High", "mps_id": "MPS-miyz-kptu", "poc": false, "poc_url": [], "published_time": "2026-10-03", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-miyz-kptu", "name": "https://www.oscs1024.com/hd/MPS-miyz-kptu"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-104859", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-104859"}, {"url": "https://github.com/nrwl/nx/security/advisories/GHSA-6vc5-vf29-ffr2", "name": "https://github.com/nrwl/nx/security/advisories/GHSA-6vc5-vf29-ffr2"}, {"url": "https://github.com/nrwl/nx/pull/36505", "name": "https://github.com/nrwl/nx/pull/36505"}, {"url": "https://github.com/nrwl/nx/commit/6d60eed061f050e0d5af509a1f5a07c707f09865", "name": "https://github.com/nrwl/nx/commit/6d60eed061f050e0d5af509a1f5a07c707f09865"}, {"url": "https://github.com/nrwl/nx/commit/b587441fd8da28c5db37edb0826554e0060dc81b", "name": "https://github.com/nrwl/nx/commit/b587441fd8da28c5db37edb0826554e0060dc81b"}], "scope_influence": "", "tags": ["npm", "开源"], "title": "@nx/docker 命令注入漏洞", "_translated": true, "_saved_at": "2026-10-02T18:53:10+00:00", "_first_saved_at": "2026-10-02T18:53:10+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-miyz-kptu"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-96564", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "cwe": "CWE-79", "description": "SEOPress（插件标识 wp-seopress）是运行于 WordPress 的开源 SEO 插件，提供站点元数据优化、XML 站点地图以及 Google Analytics 4 与 Matomo 统计跟踪等功能，经 WordPress 官方插件目录分发。\n受影响版本中，插件的 GA4 与 Matomo 跟踪脚本构建逻辑在启用 Track Authors 自定义维度后，将 get_the_author() 返回的作者显示名称以字符串拼接方式写入页面头部的内联 JavaScript（inc/functions/options-google-analytics.php 与 inc/functions/options-matomo.php），该显示名称由用户自行设置且未经任何转义；攻击者在允许发布公开 singular 内容的站点（如 bbPress 论坛）将含 JavaScript 代码的字符串设为显示名称后，恶意代码随跟踪脚本输出到对应页面，任何访问该页面的用户浏览器均会执行，形成存储型 XSS。\n修复版本中通过新增 seopress_js_string() 辅助函数对动态值执行 wp_json_encode 编码（启用 JSON_HEX_TAG、JSON_HEX_AMP、JSON_HEX_APOS、JSON_HEX_QUOT 标志），10.3 中 GA4 与 Matomo 两处作者显示名称拼接均改为经该函数编码后输出，使显示名称无法逃逸 JS 字符串字面量或闭合 script 标签，从而切断注入路径。", "effects": [{"comp_name": "wp-seopress", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,10.3)", "min_fixed_version": "10.3", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-10-03", "level": "High", "mps_id": "MPS-0zcq-52dx", "poc": false, "poc_url": [], "published_time": "2026-10-03", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS ttps://nvd.nist.gov/vuln/detail/CVE-2026-103342", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-103342"}, {"url": "https://patchstack.com/database/wordpress/plugin/unlimited-elements-for-elementor/vulnerability/wordpress-unlimited-elements-for-elementor-free-widgets-addons-templates-plugin-2-0-20-cross-site-scripting-xss-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Unlimited Elements 反射型XSS", "_translated": true, "_saved_at": "2026-10-03T22:36:16+00:00", "_first_saved_at": "2026-10-03T16:59:12+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-3pgk-bqmt"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-104478", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:L", "severity": "high", "base_score": 7.1}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:L/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:L/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-22", "description": "Formwork 是 getformwork 团队开源的 PHP 轻量级 flat-file CMS，以 composer 包 getformwork/formwork 发布，用于搭建小型网站并提供后台管理面板。\n受影响版本中，后台面板的备份下载与删除路由 /backup/download/{backup:base64}/ 和 /backup/delete/{backup:base64}/ 将 base64 解码后的用户输入交给 BackupController::download() 与 delete()，二者依赖 PHP 内置 basename() 过滤文件名，而 Linux 下 basename() 只按 / 分隔、不识别反斜杠，携带 ..\\..\\..\\..\\etc\\passwd 形式的反斜杠穿越串可原样通过过滤；随后 FileSystem::joinPaths() 调用的 Path::normalize() 把反斜杠同样视为路径分隔符并消除 .. 段，最终解析出备份目录之外的文件路径，经 FileResponse 读取任意文件或经 FileSystem::delete() 删除任意文件。\n修复版本中通过收紧备份文件的边界校验解决该问题：download() 与 delete() 先对 system.backup.path 做 Path::normalize，再校验拼接结果的 Path::dirname() 与备份目录一致，只有仍位于备份目录内的文件才被下载或删除；make() 改用新增的 Path::basename()（先把反斜杠归一为 /）生成文件名，并在 formwork/src/Utils/Path.php 中补充 dirname() 与 basename() 辅助方法，切断反斜杠穿越绕过。", "effects": [{"comp_name": "getformwork/formwork", "ecosystem": "composer", "versions": [{"affected_version": "[2.0.0,2.3.13)", "min_fixed_version": "2.3.13", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-10-03", "level": "High", "mps_id": "MPS-5nd4-3ilx", "poc": false, "poc_url": [], "published_time": "2026-10-03", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-5nd4-3ilx", "name": "https://www.oscs1024.com/hd/MPS-5nd4-3ilx"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-104478", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-104478"}, {"url": "https://github.com/getformwork/formwork/commit/89e7821a6fcee89474cd401b3dde0c1dccb0687f", "name": "Patch Commit"}, {"url": "https://github.com/getformwork/formwork", "name": ""}, {"url": "https://www.vulncheck.com/advisories/formwork-before-2.3.13-path-traversal-via-backupcontroller-download-and-delete", "name": "VulnCheck Advisory: Formwork before 2.3.13 Path Traversal via BackupController Download and Delete"}], "scope_influence": "", "tags": ["php", "开源"], "title": "Formwork 备份模块路径穿越漏洞", "_translated": true, "_saved_at": "2026-10-03T01:38:22+00:00", "_first_saved_at": "2026-10-03T01:38:22+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-5nd4-3ilx"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-105050", "cvss": {"cvssv4": [{"source": "cve@mitre.org", "vector": "CVSS:4.0/AV:L/AC:L/AT:P/PR:N/UI:A/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:L/AC:L/AT:P/PR:N/UI:A/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-180", "description": "PeaZip 是一款开源（LGPL-3.0）的跨平台文件压缩与归档管理工具，基于 Free Pascal/Lazarus 开发，支持多种归档格式的压缩、解压、浏览与加密操作。\n受影响版本中，构造后端命令行时 stringdelim 以系统对应的定界引号包裹文件名，未检查文件名本身已包含该定界符的情况；归档内文件名携带定界符引号时引号配对被破坏，攻击者内容可逃逸出引号上下文，而命令行校验函数 validatecl 的单双引号检查处于注释状态，无法拦截此类命令行；在控制台模式等非默认配置下，组装后的命令行经 cmd /c 或 bash -c 交由真实 shell 解析执行，最终形成操作系统命令注入。\n修复版本中通过在 stringdelim 检测定界符冲突并返回 #rejected_string# 拒绝串，validatecl 在入口识别拒绝串并丢弃整条命令行，新增 validatecl_console 在命令行传递给真实控制台前拒绝双引号与回车、换行等字符，并补充过滤 \u0026、;、反引号、$ 等元字符，切断由归档内文件名到 shell 执行的注入链条。", "effects": [{"comp_name": "peazip", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,11.3.0)", "min_fixed_version": "11.3.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "不正确的行为次序：规范化之前验证", "kind_en": "不正确的行为顺序：先验证再规范化", "last_modified_time": "2026-10-03", "level": "High", "mps_id": "MPS-b3sy-noix", "poc": false, "poc_url": [], "published_time": "2026-10-03", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-b3sy-noix", "name": "https://www.oscs1024.com/hd/MPS-b3sy-noix"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-105050", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-105050"}, {"url": "https://github.com/peazip/PeaZip/releases/tag/11.3.0", "name": ""}, {"url": "https://github.com/peazip/PeaZip/tree/sources/peazip-sources", "name": ""}, {"url": "https://app.secur0.com/certificate/ys3yqg-avrwaq-5ybnwl", "name": ""}, {"url": "https://github.com/peazip/PeaZip/commit/009fc35530e26729863969eddf4c18f1b48331cf", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "PeaZip 命令注入漏洞", "_translated": true, "_saved_at": "2026-10-03T01:38:26+00:00", "_first_saved_at": "2026-10-03T01:38:26+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-b3sy-noix"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-71891", "cvss": {"cvssv4": [{"source": "91579145-5d7b-4cc5-b925-a0262ff19630", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:Amber", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:Amber", "cwe": "CWE-347", "description": "Bouncy Castle for Java（bc-java）是开源 Java 密码学库，其 bcprov 组件提供 BLS12-381 曲线上的 BLS 签名、消息增强签名与聚合签名等密码原语，广泛用于 Java 应用的签名验证场景。\n受影响版本中，BLS12_381BasicScheme.keyValidate 校验公钥时直接信任 ECPoint 自身携带的曲线对象，未确认该曲线为标准 BLS12-381 G1 曲线，而 ECPoint.satisfiesOrder 在曲线余因子为 1 时直接返回真，曲线方程校验同样针对点的自身曲线执行。攻击者在仅共享 BLS12-381 域特征、方程不同且余因子伪造为 1 的非标准曲线（如 y^2 = x^3 + x 上的二阶点 (0,0)）上构造公钥点并提交给验证方，可通过 keyValidate 的素数阶子群校验；该点在配对聚合中贡献目标群单位元，aggregateVerify 对包含该公钥的集合接受缺少对应签名的聚合签名，形成幻影签名者。经实测，bcprov-jdk18on 1.85 中 keyValidate 接受此类伪造点，公钥集合混入伪造点后仅含真实签名者签名的聚合签名仍验证通过。\n修复版本中通过在 keyValidate 执行子群校验前新增 BLS12_381G1.isCanonicalCurve 检查，逐一比对点的曲线的域特征、方程系数、阶与余因子是否与标准 G1 参数完全一致，构建在非标准曲线上的公钥点在进入子群校验前被直接拒绝，切断伪造公钥进入 BLS 验证与聚合验证的路径。", "effects": [{"comp_name": "bc-java", "ecosystem": "linux", "versions": [{"affected_version": "[1.85,1.86)", "min_fixed_version": "1.86", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "org.bouncycastle:bcprov-jdk15to18", "ecosystem": "maven", "versions": [{"affected_version": "[1.85,1.86)", "min_fixed_version": "1.86", "repository": "maven", "solutions": [], "upstream": true}]}, {"comp_name": "org.bouncycastle:bcprov-jdk18on", "ecosystem": "maven", "versions": [{"affected_version": "[1.85,1.86)", "min_fixed_version": "1.86", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "密码学签名的验证不恰当", "kind_en": "密码签名验证不当", "last_modified_time": "2026-10-03", "level": "High", "mps_id": "MPS-yfma-s68d", "poc": false, "poc_url": [], "published_time": "2026-10-03", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-yfma-s68d", "name": "https://www.oscs1024.com/hd/MPS-yfma-s68d"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-71891", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-71891"}, {"url": "https://github.com/bcgit/bc-java/wiki/CVE%E2%80%902026%E2%80%9071891", "name": ""}, {"url": "https://github.com/bcgit/bc-java/commit/c16bcfdce1f96230261b7c2c8c1e044bfc9d1deb", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "Bouncy Castle BLS公钥校验绕过漏洞", "_translated": true, "_saved_at": "2026-10-03T12:56:53+00:00", "_first_saved_at": "2026-10-03T12:56:53+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-yfma-s68d"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，从而导致未授权的用户或资源可以被访问或篡改。", "title": "什么是访问控制不当"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n", "title": "访问控制不当常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防访问控制不当"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-102795", "cvss": {"cvssv31": [{"source": "security@apache.org", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:H/A:N", "severity": "critical", "base_score": 9.3}], "cvssv4": [{"source": "security@apache.org", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:N/VI:N/VA:N/SC:H/SI:H/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7}]}, "cvss_score": 7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:N/VI:N/VA:N/SC:H/SI:H/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-284", "description": "Apache Traffic Server 是 Apache 软件基金会开源的高性能 HTTP 代理与缓存服务器，支持正向代理、反向代理、TLS 终止与流量转发，广泛用于 CDN 和企业出口流量场景。\n受影响版本中，在 proxy.config.http.host_sni_policy 启用（默认值为 2，即强制模式）且 sni.yaml 为请求域名配置了访问动作时，HttpSM::check_sni_host 使用 strncasecmp(host_name, sni_value, host_len) 校验客户端请求 Host 头与 TLS SNI 的一致性，该比较只覆盖 Host 长度范围内的前缀字节，未校验两个名字长度一致；攻击者与 TLS 端口建立连接时携带与受限域名共享前缀的 SNI（例如 Host 为 bob 而 SNI 为 bob.bar.com），校验被误判为匹配，告警与 403 终止逻辑被跳过，t_state.client_connection_allowed 不会被置为 false，sni.yaml 中按 fqdn 配置的 verify_client、ip_allow 等 SNI 访问控制被绕过，请求被继续转发到源站；HttpSessionManager::validate_host_sni 在复用服务端会话时使用 strncasecmp(session_sni, req_host, len) 校验，存在同样的前缀误判。\n修复版本中通过在比较前增加 strlen(sni_value) 与 host_len 的长度一致性判断，仅当 SNI 与 Host 完整字符串一致（忽略大小写）时才视为匹配，前缀或后缀不同的名字按不匹配处理并按策略返回 403 拒绝，同时扩展 tls_sni_host_policy 回归测试覆盖 SNI 与 Host 双向前缀、后缀不匹配场景。", "effects": [{"comp_name": "traffic_server", "ecosystem": "linux", "versions": [{"affected_version": "[10.0.0,10.1.4)", "min_fixed_version": "10.1.4", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[9.0.0,9.2.15)", "min_fixed_version": "9.2.15", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "访问控制不当", "kind_en": "访问控制不当", "last_modified_time": "2026-10-03", "level": "High", "mps_id": "MPS-erba-su52", "poc": false, "poc_url": [], "published_time": "2026-10-03", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-erba-su52", "name": "https://www.oscs1024.com/hd/MPS-erba-su52"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-102795", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-102795"}, {"url": "https://lists.apache.org/thread.html/qcxzvcbbln68hd0j08pdnjdj4r991nhd", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-41920", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Apache Traffic Server SNI校验绕过漏洞", "_translated": true, "_saved_at": "2026-10-02T18:53:13+00:00", "_first_saved_at": "2026-10-02T18:53:13+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-erba-su52"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-96451", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-639", "description": "Ultimate Member 是一款 WordPress 开源会员管理插件，提供用户注册、登录、个人资料、会员目录与账户页面等功能。\n受影响版本中，um-download 下载路由根据用户可控的 um_user 参数调用 um_fetch_user() 将任意用户载入插件全局用户上下文，失败分支未调用 um_reset_user() 还原；账户提交流程的 um_submitting_account_page() 只检查 $_POST['_um_account']
