应用,基于 Flask 和 Tornado 构建上传处理功能。\n受影响版本中,UploadStorageFallbackHandler 的内部保留字段 path、filename、size 等原本仅供 Tornado 上传处理器在流式写入临时文件后向 Flask 传递临时文件路径使用。CVE-2025-48067 的修复仅过滤了 multipart form-data 中的这些字段,但未防护通过 URL query parameter 或 Tornado 与 Werkzeug 之间解析差异(smuggling)注入的同名参数,导致攻击者可用具有 FILE_UPLOAD 权限的账户将服务器上任意可读文件伪装为新上传文件并移入上传文件夹,从而实现配置文件等敏感文件的外泄。\n修复版本中通过新增 _deny_reserved_fields() 方法在 Tornado handler 的 prepare 阶段和请求体处理完成后两次拒绝携带保留字段的请求,使用 secrets.token_hex 生成新 multipart boundary 替换客户端提供的 boundary 以消除解析差异,并通过 Werkzeug 的 parse_form_data 对重写后的请求体进行严格校验,确保最终传递给 Flask 的请求不包含任何客户端可控的内部字段。", "effects": [{"comp_name": "octoprint", "ecosystem": "pip", "versions": [{"affected_version": "(-∞,1.11.8)", "min_fixed_version": "1.11.8", "repository": "pip", "solutions": [], "upstream": true}, {"affected_version": "[2.0.0rc1,2.0.0rc3)", "min_fixed_version": "2.0.0rc3", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "文件名或路径的外部可控制", "kind_en": "文件名或路径的外部控制", "last_modified_time": "2026-08-22", "level": "High", "mps_id": "MPS-8apf-cmui", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://github.com/OctoPrint/OctoPrint/security/advisories/GHSA-j4h9-pm27-4rfw", "name": ""}, {"url": "https://github.com/advisories/GHSA-j4h9-pm27-4rfw", "name": ""}], "scope_influence": "", "tags": ["python", "开源", "终端软件"], "title": "OctoPrint文件越权访问漏洞", "_translated": true, "_saved_at": "2026-08-21T20:18:50+00:00", "_first_saved_at": "2026-08-21T20:18:50+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-8apf-cmui"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，从而导致未授权的用户或资源可以被访问或篡改。", "title": "什么是访问控制不当"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n", "title": "访问控制不当常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防访问控制不当"}], "cnvd_id": "", "cve_id": "CVE-2026-66916", "cvss": {"cvssv4": [{"source": "security@joomla.org", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:L/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "medium", "base_score": 6.9}]}, "cvss_score": 6.9, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:L/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-284", "description": "JoomGallery 是开源的 Joomla! 4.x/5.x 原生图库组件，以独立 component 形式通过 Joomla Extension Directory 分发，由 JoomGallery::ProjectTeam 在 GitHub 维护 GPL-3.0 版本源代码。\n受影响版本中，站点侧 Category 视图的 HtmlView 在加载前会判断 $this-\u003eitem-\u003epw_protected 标志位，仅在分类未启用密码保护时才读取子分类、父分类、图片、过滤表单等数据；而同模块下被路由 format=json 触发的 JsonView 在 display() 方法中完全没有 pw_protected 判定，照常调用 $this-\u003eget('Children')、$this-\u003eget('Parent')、$this-\u003eget('Images') 等加载逻辑，将原本受密码门控的内容完整序列化输出。未认证攻击者只需拼接 ?option=com_joomgallery\u0026view=category\u0026id=\u003c受保护分类ID\u003e\u0026format=json，就能越过密码会话校验直接读取分类内容，等价于访问控制被绕过。\n修复版本中通过让 JsonView 在拿到 $this-\u003eitem 后先做与 HtmlView 相同的 pw_protected 判断，仅在未启用密码或调用方已解锁分类时才加载并输出 children、parent、images，从而与 HTML 视图保持一致的密码门控语义，切断未授权读取链路。", "effects": [{"comp_name": "joomgalleryfriends:com_joomgallery", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,4.4.0)", "min_fixed_version": "4.4.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "访问控制不当", "kind_en": "访问控制不当", "last_modified_time": "2026-08-22", "level": "High", "mps_id": "MPS-n8iw-fbzv", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-n8iw-fbzv", "name": "https://www.oscs1024.com/hd/MPS-n8iw-fbzv"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-66916", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-66916"}, {"url": "https://www.joomgalleryfriends.net/", "name": ""}], "scope_influence": "", "tags": [], "title": "JoomGallery 受密码保护分类通过 JSON 格式绕过", "_translated": true, "_saved_at": "2026-08-22T12:25:54+00:00", "_first_saved_at": "2026-08-22T12:25:54+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-n8iw-fbzv"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过向受信任的数据序列化过程中添加恶意数据，从而在序列化和反序列化过程中执行恶意代码的攻击漏洞。这种漏洞通常存在于使用序列化 (serialization) 机制存储和传输数据的程序中。\n", "title": "什么是反序列化"}, {"content": "- 注入攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码注入到程序中，从而实现代码执行的目的。\n- 反射攻击：攻击者使用反射机制，在序列化过程中动态生成恶意数据，并将恶意代码注入到程序中，从而实现代码执行的目的。\n- 缓冲区溢出攻击：攻击者通过在序列化过程中向缓冲区输入恶意数据，导致缓冲区溢出，从而破坏程序的内存管理，实现代码执行的目的。\n- 格式字符串攻击：攻击者通过在序列化过程中输入恶意数据，导致程序使用错误的格式字符串，从而实现代码执行的目的。\n- 数据流攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码作为一个数据流传递给程序，从而实现代码执行的目的。\n", "title": "反序列化常见的攻击方式"}, {"content": "- 不信任输入数据：程序应该严格检查输入数据的有效性，并避免使用不受信任的数据。\n- 使用安全的序列化机制：程序应该使用安全的序列化机制，如 JSON 或 XML 序列化，而不是第三方序列化库。\n- 最小特权原则：程序应该限制对受信任数据的处理权限，并避免在运行时修改数据。\n- 代码审查和漏洞扫描：程序应该进行代码审查和漏洞扫描，以发现和修复潜在的安全漏洞。\n", "title": "如何预防反序列化"}], "cnvd_id": "", "cve_id": "CVE-2026-0551", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-502", "description": "PPWP – Password Protect Pages 是面向 WordPress 的开源密码保护插件，可对文章、页面以及按角色区分的内容设置访问密码。\n受影响版本中，includes/services/class-ppw-passwords.php 的 PPW_Password_Services::massage_pw_from_post_meta 在遍历 postmeta 时，对 PPW_Constants::POST_PROTECTION_ROLES 这个 meta_key 的 meta_value 直接调用 @unserialize($val-\u003emeta_value)，同文件 PPW_Password_Services::get_protected_post_ids 也对同一字段调用 @unserialize($value-\u003emeta_value)。具备 Contributor 及以上权限的认证用户可在创建或编辑文章时通过 WordPress 的 update_post_meta 写入任意 PHP 序列化字符串，该字符串随后会被上述方法反序列化。若站点同时安装了提供 POP 链的插件或主题，反序列化过程将触发任意文件删除、敏感数据读取甚至远程代码执行。\n修复版本中通过在 1.9.19 移除 massage_pw_from_post_meta 与 get_protected_post_ids 中对 post_protection_roles meta_value 的 @unserialize() 调用，让 ppw_free_fix_serialize_data 直接处理原始字符串，切断不可信序列化对象进入对象反序列化流程的链路。", "effects": [{"comp_name": "password-protect-page", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.9.19)", "min_fixed_version": "1.9.19", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "反序列化", "kind_en": "不可信数据的反序列化", "last_modified_time": "2026-08-23", "level": "High", "mps_id": "MPS-gji2-1eqb", "poc": false, "poc_url": [], "published_time": "2026-08-23", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-gji2-1eqb", "name": "https://www.oscs1024.com/hd/MPS-gji2-1eqb"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-0551", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-0551"}, {"url": "https://plugins.trac.wordpress.org/browser/password-protect-page/trunk/includes/services/class-ppw-passwords.php#L699", "name": ""}, {"url": "https://plugins.trac.wordpress.org/changeset/3567221/password-protect-page", "name": ""}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/b8f53282-740e-4ac3-a2e1-7a97893e3355?source=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "PPWP插件PHP对象注入漏洞", "_translated": true, "_saved_at": "2026-08-23T03:44:38+00:00", "_first_saved_at": "2026-08-23T00:57:50+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-gji2-1eqb"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "cnvd_id": "", "cve_id": "CVE-2026-16149", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-269", "description": "Security Hardener 是 WordPress 上由 Marc Armengou 维护的开源安全加固插件，提供安全响应头、登录保护、用户枚举拦截、限速以及内置安全清单等加固能力。\n受影响版本中，security-hardener.php 的 WPHN_Hardener::secure_user_endpoints 方法通过 rest_endpoints 过滤器，把 /wp/v2/users 与 /wp/v2/users/(?P\u003cid\u003e[\\d]+) 这两个 REST 路由上所有已注册 handler 的 permission_callback 全部覆盖为一个只返回 is_user_logged_in() 的闭包，连带覆盖 POST、PUT、PATCH、DELETE 等写操作 handler，从而剥离了 WordPress Core WP_REST_Users_Controller 原本强制要求的 create_users、promote_user、edit_users、delete_users 等能力校验。已认证的 Subscriber 级攻击者可向 /wp/v2/users 发起 POST 请求创建 administrator 账户，或向 /wp/v2/users/\u003cid\u003e 发起 PUT/POST 请求重置现有管理员密码；由于 block_user_enum 默认启用，攻击无须任何额外插件配置，插件安装后该覆写即在每次 REST 请求处理路径中生效。\n修复版本中通过收紧 secure_user_endpoints 的覆写范围解决了该问题，仅当 handler 的 methods 仅包含 GET 时才替换 permission_callback，POST、PUT、PATCH、DELETE 等写操作 handler 的 permission_callback 不再被覆写，WordPress Core 自带的 create_users、edit_users、delete_users 等能力校验得以恢复执行。", "effects": [{"comp_name": "security-hardener articles": [{"content": "应用程序未能有效地控制资源的使用，导致攻击者可以利用这个漏洞耗尽应用程序所依赖的资源。这些资源可以是计算资源（CPU、内存）、网络带宽、数据库连接或其他系统资源。攻击者可以通过发送特制的请求、恶意输入或其他方式，使应用程序消耗大量资源，导致拒绝服务或系统崩溃。", "title": "什么是拒绝服务"}, {"content": "- 消耗计算资源：攻击者可以发送计算密集型的请求，例如复杂的计算、无限循环或递归操作，以耗尽应用程序的计算资源，导致应用程序无法响应其他请求。\r\n- 消耗内存资源：攻击者可以发送大量的数据或恶意输入，以导致应用程序消耗过多的内存资源，从而使系统的可用内存耗尽，并导致应用程序崩溃或变得不可用。\r\n- 消耗网络带宽：攻击者可以发送大量的请求或大型数据包，以消耗应用程序所依赖的网络带宽。这会导致其他合法用户无法正常访问应用程序或降低系统的整体网络性能。\r\n- 消耗存储资源：攻击者可以发送大量的请求或上传大文件，以耗尽应用程序的存储资源，导致系统无法处理其他请求或存储新的数据。", "title": "拒绝服务常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对输入数据进行合理的验证和过滤，防止恶意输入导致资源消耗过高。\r\n- 实施资源限制：应用程序应该实施适当的资源限制策略，例如限制计算操作的时间或次数，限制内存使用量，限制并发连接数等，以防止资源被耗尽。\r\n- 异常处理与错误恢复：应用程序应该具备健壮的异常处理和错误恢复机制，以防止因意外错误导致资源泄漏或无法释放的情况。\r\n- 资源监控与警报：应用程序应该实施适当的资源监控和警报机制，及时发现异常的资源消耗情况，并采取相应的措施来应对。\r\n- 压力测试与性能优化：应用程序应该进行压力测试，以评估其在高负载情况下的性能，并进行必要的性能优化，以确保能够有效地处理大量请求而不耗尽资源。", "title": "如何预防拒绝服务"}], "cnvd_id": "", "cve_id": "CVE-2026-4671", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-400", "description": "justhtml 是开源 Python HTML 解析与 DOM 查询库，提供符合 HTML 标准的解析器、基于 CSS 选择器的 DOM 查询、Linkify 文本链接化以及可选的清理与变换流水线；该项目在 GitHub 上以 MIT 许可证分发。\n受影响版本中，justhtml.selector.query、justhtml.selector.matches 与 SelectorParser.parse 在解析攻击者可控的 CSS 选择器字符串时缺少结构性上限，对超大长度选择器、大量逗号分隔的子选择器、过大复合选择器项数、超长复杂选择器组合子链以及深层 :not(...)、:contains(...) 等函数式伪类会消耗不成比例的 CPU 或内存；SelectorMatcher 在祖先/兄弟/位置伪类匹配与 DOM 遍历中也缺少父链、子链与文本链的循环守卫，对程序化构造的环形或共享子节点 DOM 图会进入不可终止遍历。同时，linkify._trim_trailing 在剥离候选 URL 尾部未闭合右括号时使用 candidate.count(close) 在 while 循环中重复扫描整体字符串，对末尾附带大量未配对右括号的 URL 候选呈二次方时间复杂度。任一触发路径成立时，攻击者均可让使用 justhtml 的进程长时间占用 CPU 或内存，构成可用性拒绝服务。\n修复版本中通过引入 SelectorLimits 共享结构，强制约束 max_length、max_list_items、max_compound_simple_selectors、max_complex_selector_parts、max_parse_depth、max_match_depth、max_match_steps 与 max_match_bytes，并在 SelectorParser、query、matches 与 transform 编译入口统一应用；SelectorMatcher 增加祖先、兄弟、位置、属性、class、:not(...)、:nth-child(...) 与文本内容的预计算缓存以及程序化环路的去重与循环守卫；linkify._trim_trailing 改为一次性统计配对字符并以索引递减方式剥离尾部未闭合括号，消除原 O(n²) 重扫。", "effects": [{"comp_name": "justhtml", "ecosystem": "pip", "versions": [{"affected_version": "[0,1.18.0)", "min_fixed_version": "1.18.0", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "拒绝服务", "kind_en": "不受控制的资源消耗", "last_modified_time": "2026-08-23", "level": "High", "mps_id": "MPS-lzxq-vset", "poc": false, "poc_url": [], "published_time": "2026-08-23", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-lzxq-vset", "name": "https://www.oscs1024.com/hd/MPS-lzxq-vset"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-4671", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-4671"}, {"url": "https://github.com/EmilStenstrom/justhtml/security/advisories/GHSA-r8cj-3554-33mr", "name": ""}, {"url": "https://www.vulncheck.com/advisories/justhtml-before-denial-of-service-via-css-selector", "name": ""}], "scope_influence": "", "tags": ["python", "开源"], "title": "justhtml CSS选择器与Linkify拒绝服务漏洞", "_translated": true, "_saved_at": "2026-08-23T15:15:58+00:00", "_first_saved_at": "2026-08-23T15:15:58+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-lzxq-vset"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-9769", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/A :H", "severity": "high", "base_score": 8.5}]}, "cvss_score": 8.5, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:C/C:H/I:H/A:H", "cwe": "CWE-22", "description": "GitLab 是一站式开源 DevOps 平台，提供代码托管、CI/CD、Package Registry 等能力，社区版（CE）与企业版（EE）共享同一代码基线。\n受影响版本中，Package Registry 在处理上传制品的文件名或目标路径时未对路径分隔符进行充分校验，攻击者在请求中传入包含 ../ 等穿越片段的内容后，可突破预定的制品目录边界，覆盖或读取 GitLab 进程可访问目录之外的文件，并在满足条件时进一步触发远程代码执行，最终控制运行 GitLab 的服务器。\n修复版本中通过严格校验上传制品的文件名与最终落盘路径，禁止任何包含路径遍历字符或越界前缀的输入，从而切断利用链并消除远程代码执行风险。", "effects": [{"comp_name": "GitLab", "ecosystem": "linux", "versions": [{"affected_version": "[19.1,19.1.4)", "min_fixed_version": "19.1.4", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[18.8,19.0.6)", "min_fixed_version": "19.0.6", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[19.2,19.2.2)", "min_fixed_version": "19.2.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-08-23", "level": "High", "mps_id": "MPS-3tgj-hm79", "poc": false, "poc_url": [], "published_time": "2026-08-23", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-3tgj-hm79", "name": "https://www.oscs1024.com/hd/MPS-3tgj-hm79"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-10053", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-10053"}, {"url": "https://gitlab.com/gitlab-org/gitlab/-/work_items/601596", "name": ""}, {"url": "https://hackerone.com/reports/3754194", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "GitLab Package Registry 路径遍历致远程代码执行", "_translated": true, "_saved_at": "2026-08-23T14:16:58+00:00", "_first_saved_at": "2026-08-23T11:15:48+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-3tgj-hm79"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情  "cvss_vector": "CVSS:4.0/AV:A/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:H/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-1220", "description": "docker-socket-proxy 是 Tecnativa 开源的 HAProxy 镜像，基于环境变量对外暴露的 Docker Engine API 端点进行白名单过滤，常用于限制 Traefik、Portainer 等容器编排组件对宿主机 Docker socket 的访问。\n受影响版本中，haproxy.cfg 的 frontend dockerfrontend 段仅对 /containers/{id}/start|stop|restart|kill|pause|unpause 这几个子路径做了显式 ACL，而 ^(/v[\\d\\.]+)?/containers 这条规则只匹配到 /containers 根路径。当运维人员把 CONTAINERS=1 当作“只读查看容器元数据”的安全配置启用时，/containers/{id}/archive、/containers/{id}/export、/containers/{id}/logs、/containers/{id}/top 这四个危险子路径没有命中任何 deny 规则，会一路穿透到 default_backend dockerbackend 并被转发到宿主 /var/run/docker.sock，导致任意联网调用方仅通过 GET 请求就能从任一容器内读取任意文件、下载完整文件系统 tar 包、读取容器日志以及枚举进程命令行。\n修复版本中通过为 /containers/{id}/archive、/containers/{id}/export、/containers/{id}/logs 引入新的 ALLOW_ARCHIVE、ALLOW_EXPORT、ALLOW_LOGS 环境变量，并在对应子路径未启用时显式 http-request deny 把请求阻断，从而把 CONTAINERS=1 的语义收窄为只能访问容器列表与 inspect 等只读元数据，攻击者即使保持 CONTAINERS=1 也无法再触达这四个危险子路径。", "effects": [{"comp_name": "tecnativa/docker-socket-proxy", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,0.5.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "高", "fix_suggestion": "建议修复", "kind": "访问控制的粒度不够", "kind_en": "访问控制粒度不够", "last_modified_time": "2026-08-23", "level": "High", "mps_id": "MPS-mktl-o3sf", "poc": true, "poc_url": [], "published_time": "2026-08-23", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-mktl-o3sf", "name": "https://www.oscs1024.com/hd/MPS-mktl-o3sf"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-78122", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-78122"}, {"url": "https://gist.github.com/nedlir/e4f52f88a757f02c67db1fd5dd70d732", "name": ""}, {"url": "https://github.com/Tecnativ b56ed854baa73a731cfd99af689f0b1bac444", "name": ""}, {"url": "https://git.kernel.org/stable/c/4208db2453e1ea71b8048a5b7802360cb29a53f1", "name": ""}, {"url": "https://git.kernel.org/stable/c/5bf5ccddf00b59f1e3ea7e65d76a5f5b5c21cc2e", "name": ""}, {"url": "https://git.kernel.org/stable/c/f613b4a2d87247b51a1b2b330f2e083a454125f2", "name": ""}, {"url": "https://git.kernel.org/stable/c/f75d6f61f0d9c5c1ea725104014e10d26d1e3a00", "name": ""}], "scope_influence": "", "tags": ["操作系统"], "title": "Linux 内核 ALSA usx2y hwdep mmap 偏移量缺少边界导致任意内核页面映射", "_translated": true, "_saved_at": "2026-08-22T17:15:21+00:00", "_first_saved_at": "2026-08-22T17:15:21+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-1dju-5vc4"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "attack_vector_type": "Local", "cnvd_id": "", "cve_id": "CVE-2026-74727", "cvss": {}, "cvss_score": 7.8, "cvss_vector": "", "cwe": "CWE-416", "description": "Linux 内核是开源、跨平台的操作系统内核，其中 drivers/net/ovpn 子系统实现基于 WireGuard 思路的 OVPN 隧道驱动，对外通过 generic netlink 接口与 UDP 套接字管理 peer 与传输端点。\n受影响版本中，ovpn_nl_peer_set_doit() 先通过 ovpn_peer_get_by_id() 解析目标 peer，仅持有引用计数后再获取 ovpn-\u003elock；窗口期内的并发 OVPN_CMD_PEER_DEL、keepalive 过期或套接字拆除可能先获得锁，调用 ovpn_peer_remove() 将 peer 从 by_id、by_vpn_addr4/6、by_transp_addr 四张哈希表中 unhash 并释放锁；set_doit 之后才取得锁并调用 ovpn_peer_hash_vpn_ip()，将已被移除的 peer 重新插入哈希表。float 路径上 ovpn_peer_endpoints_update() 在异步 AEAD 解密与 netlink 通知之后才取锁，同样会在 by_transp_addr 中再次哈希同一 peer。peer 在引用计数归零后通过 call_rcu 释放，但内嵌的哈希节点尚未断链，形成 UAF 窗口。\n修复版本中通过在 ovpn-\u003elock 保护下判断 hash_entry_id 是否已 unhash 来跳过 rehash，复用 ovpn_peer_remove() 已有的哨兵检测；该检查对 add 路径是无副作用的，因为 ovpn_peer_add_mp() 在调用 ovpn_peer_hash_vpn_ip() 之前已插入 hash_entry_id，从而切断「先移除再被 rehash」的因果链，关闭 UAF 窗口。", "effects": [{"comp_name": "linux:linux_kernel", "ecosystem": "linux", "versions": [{"affected_version": "[6.16,6.18.45)", "min_fixed_version": "6.18.45", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.16,7.1.9)", "min_fixed_version": "7.1.9", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.16,7.2)", "min_fixed_version": "7.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "UAF", "kind_en": "免费后使用", "last_modified_time": "2026-08-23", "level": "High", "mps_id": "MPS-5qsy-cw9r", "poc": false, "poc_url": [], "published_time": "2026-08-23", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-5qsy-cw9r", "name": "https://www.oscs1024.com/hd/MPS-5qsy-cw9r"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-74727", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-74727"}, {"url": "https://git.kernel.org/stable/c/33ec10567fe14456063daf549fdf1a4f53448e4c", "name": ""}, {"url": "https://git.kernel.org/stable/c/66745480298775f188b2f5ad266643e85a90f73b", "name": ""}, {"url": "https://git.kernel.org/stable/c/d20c181088984b6eaa8d7fe7cb5ab3510988df59", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Linux 内核 OVPN 驱动哈希重入导致 UAF", "_translated": true, "_saved_at": "2026-08-22T22:15:23+00:00", "_first_saved_at": "2026-08-22T18:20:12+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-5qsy-cw9r"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "attack_vector_type": "Local", "cnvd_id": "", "cve_id": "CVE-2026-74731", "cvss": {}, "cvss_score": 7.8, "cvss_vector": "", "cwe": "CWE-416", "description": "Linux kernel 是开源操作系统内核,sched_ext(scx)是其可扩展调度器子系统,允许通过 BPF 程序实现自定义 CPU 调度策略,并支持 cgroup 级子调度器(sub-scheduler)层级化管理。\n受影响版本中,kernel/sched/ext.c 的 scx_sub_disable 在子调度器 enable 失败但尚未执行 scx_link_sched() 进入层级时,仍会运行完整的清理路径,包括 set_cgroup_sched 重置 cgroup 归属以及对 sch-\u003ecgrp 的任务遍历。该路径与根调度器的 disable 路径存在竞争:drain_descendants() 是子调度器 disable 时任务遍历与根 all-task teardown 之间的唯一排序点,未链接的子调度器对 drain_descendants() 不可见,根的 teardown 可能在子 drain 与 walk 之间执行,把任务切出至无调度器状态;随后 walk 命中成员不变性 WARN_ON_ONCE(!scx_task_on_sched(sch, p)) 并把已退出的任务迁移到正在死亡的层级,构成 use-after-free。\n修复版本中通过在 scx_sub_disable 取锁后立即判断 sch-\u003esibling 是否为空:若 sch 从未被链接过则跳过 cgroup 归属重置和 scx_task_iter 任务遍历,直接 goto dump 进入 scx_disable_dump,仅对已被链接的子调度器保留原路径与成员不变性检查,从而避免未链接子调度器在并发禁用场景下访问已退出的任务。", "effects": [{"comp_name": "linux", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,7.1.9-1)", "min_fixed_version": "7.1.9-1", "repository": "debian:unstable", "solutions": [], "upstream": false}, {"affected_version": "影响所有版本", "min_fixed_version": "", "repository": "debian:14", "solutions": [], "upstream": false}]}, {"comp_name": "linux_kernel", "ecosystem": "linux", "versions": [{"affected_version": "[7.1,7.1.9)", "min_fixed_version": "7.1.9", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[7.2-rc1,7.2)", "min_fixed_version": "7.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "UAF", "kind_en": "免费后使用", "last_modified_time": "2026-08-23", "level": "High", "mps_id": "MPS-70fy-lkjq", "poc": false, "poc_url": [], "published_time": "2026-08-23", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-70fy-lkjq", "name": "https://www.oscs1024.com/hd/MPS-70fy-lkjq"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-74731", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-74731"}, {"url": "https://git.kernel.org/stable/c/6428093a4a986c38c9089b5eb32b56d914ef437a", "name": ""}, {"url": "https://git.kernel.org/stable/c/8c13364db9c9a43ed286f3a8d0fb9477b1adc43c", "name": ""}], "scope_influence": "", "tags": ["操作系统"], "title": "Linux kernel sched_ext 子调度器清理路径 use-after-free", "_translated": true, "_saved_at": "2026-08-23T00:57:53+00:00", "_first_saved_at": "2026-08-22T18:20:11+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-70fy-lkjq"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-78136", "cvss": {"cvssv31": [{"source": "cve@mitre.org", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "cwe": "CWE-95", "description": "CHIRP 是开源的业余无线电写频软件，使用 Python 编写并在 GitHub（kk7ds/chirp）以 GPL-3.0 协议发布，提供对各类对讲机映像文件的读写能力。\n受影响版本中，CHIRP 的 Kenwood ITM 驱动在解析用户打开的 .itm 或 .img 文件时，于 _clean_tmode 中直接对 CSV 行中 TXSIG 与 RXSIG 字段调用 Python 内置 eval()，未做类型校验与白名单；攻击者通过构造的 CSV 字段可触发任意 Python 代码执行，危害等同本地任意代码执行。\n修复版本中通过移除 _clean_tmode 中的 eval()，改用 kenwood_tone.parse_qtdqt 按字符串语义解析音调字段，再经 chirp_common.split_tone_decode 写入内存记录，CSV 字段不再作为可执行表达式被求值，注入路径被切断。", "effects": [{"comp_name": "chirpmyradio:CHIRP", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,chirp-next-20260821)", "min_fixed_version": "chirp-next-20260821", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "eval注入", "kind_en": "动态评估代码中指令的不当中和（“评估注入”）", "last_modified_time": "2026-08-23", "level": "High", "mps_id": "MPS-dy7m-6ej1", "poc": false, "poc_url": [], "published_time": "2026-08-23", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-dy7m-6ej1", "name": "https://www.oscs1024.com/hd/MPS-dy7m-6ej1"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-78136", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-78136"}, {"url": "https://github.com/cduram/CHIRP-CodeExecution_via_Malicious_ImageFile", "name": ""}, {"url": "https://github.com/kk7ds/chirp/commit/39178dbfc4fece083ab9ed20286d6ae3a91a718e", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "CHIRP Kenwood ITM 驱动 eval 注入漏洞", "_translated": true, "_saved_at": "2026-08-23T05:22:54+00:00", "_first_saved_at": "2026-08-23T02:23:30+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-dy7m-6ej1"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "attack_vector_type": "Local", "cnvd_id": "", "cve_id": "CVE-2026-74724", "cvss": {}, "cvss_score": 7.8, "cvss_vector": "", "cwe": "CWE-787", "description": "Linux 内核是开源操作系统内核，IPVS（IP Virtual Server）作为 netfilter 模块提供基于 LVS 的四层负载均衡与 NAT 转发能力，其中 ip_vs_nat_icmp 负责在 ICMP 差错报文中改写内嵌的传输层头。\n受影响版本中，ip_vs_nat_icmp 在 has_ports 分支直接以 ciph-\u003eihl*4 推导端口偏移，但 ihl 字段在 skb 进入 IPVS 钩子与该函数读取之间并未冻结，本地攻击者可在两次读取之间改写 ihl，使后续对 (void *)ciph + ciph-\u003eihl*4 处的写入越过已校验的 ICMP/内嵌 IP 区域，造成内核堆越界写入并可能被进一步利用。ip_vs_out_icmp 与 ip_vs_in_icmp 中也存在多处重复读取 ihl 的同类问题，构成相同的越界风险。\n修复版本中通过将 ip_vs_iphdr ciph 参数从调用方传入（与 IPv6 处理方式一致）并在 has_ports 分支改用 ciph-\u003elen 作为内嵌传输层头偏移，消除了对 ihl 的二次读取，同时把 ip_vs_out_icmp/ip_vs_in_icmp 中多处 IPv4 头校验统一为只读取一次 ihl，从根本上切断本地攻击者借助 TOCTOU 改包触发越界写入的链路。", "effects": [{"comp_name": "linux_kernel", "ecosystem": "linux", "versions": [{"affected_version": "[2.6.12,6.1.183)", "min_fixed_version": "6.1.183", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.2-rc1,6.6.152)", "min_fixed_version": "6.6.152", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.7-rc1,6.12.104)", "min_fixed_version": "6.12.104", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.13-rc1,6.18.45)", "min_fixed_version": "6.18.45", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.19-rc1,7.1.9)", "min_fixed_version": "7.1.9", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[7.2-rc1,7.2)", "min_fixed_version": "7.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-08-23", "level": "High", "mps_id": "MPS-i ore": 7.8, "cvss_vector": "", "cwe": "CWE-416", "description": "Linux 内核是开源操作系统内核，其 perf 子系统负责硬件性能计数与事件采样，并通过 file_operations 中的 ioctl 接口向用户态进程开放 perf_event 文件描述符的创建、组管理、过滤与启用等操作。\n受影响版本中，kernel/events/core.c 中的 perf_group_detach 对组领导者与成员事件采用不同的分离路径：成员事件以 DETACH_GROUP 方式脱离上下文时，仅从原领导者的 sibling_list 中移除，但自身的 group_leader 指针仍指向已被分离或随后被释放的原领导者。用户态通过 PERF_IOC_FLAG_GROUP 等 ioctl 命中 perf_ioctl 时，perf_event_for_each 会沿 sibling-\u003egroup_leader 跟随陈旧指针，再在 perf_event_for_each_child 中解引用已释放领导者的 context，导致内核页错误与本地拒绝服务，并具备权限提升风险。\n修复版本中通过新增 perf_promote_sibling_to_leader 辅助函数，在成员事件脱离时主动将其提升为独立事件，重置 group_leader 为自身并修正 group_caps、active_list 与 PERF_ATTACH_CONTEXT 关联，从而切断陈旧指针路径，同时修复 __event_disable 中的 cgroup 记账与事件状态切换。", "effects": [{"comp_name": "linux_kernel", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,6.18.7]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "UAF", "kind_en": "免费后使用", "last_modified_time": "2026-08-23", "level": "High", "mps_id": "MPS-udfl-shoc", "poc": false, "poc_url": [], "published_time": "2026-08-23", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-udfl-shoc", "name": "https://www.oscs1024.com/hd/MPS-udfl-shoc"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-74637", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-74637"}, {"url": "https://git.kernel.org/stable/c/1e7abfeb23c12bf46f6457e4a3e1a1a300d50619", "name": ""}, {"url": "https://git.kernel.org/stable/c/42c5ca1f0a288a52878bd72a5595b08261057438", "name": ""}, {"url": "https://git.kernel.org/stable/c/a979a642402d0b1f856c7a729b4cb2d92de4cf2f", "name": ""}], "scope_influence": "", "tags": ["操作系统"], "title": "perf/core组领导者释放后使用漏洞", "_translated": true, "_saved_at": "2026-08-22T17:15:25+00:00", "_first_saved_at": "2026-08-22T17:15:25+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-udfl-shoc"}, {"analysis_status": 0, "articles": [{"content": "由于整数类型的有限范围，在进行算术运算或操作时，结果可能超出类型的表示范围，导致溢出或环绕。溢出指的是结果超过了类型的最大值或小于了最小值，而环绕指的是结果绕回到类型的最小值或最大值。", "title": "什么是整数溢出或环绕"}, {"content": "- 缓冲区溢出：整数溢出可能导致缓冲区溢出漏洞。当整数溢出导致分配的缓冲区大小不足以容纳结果时，攻击者可以利用这个漏洞覆盖相邻的内存区域，执行恶意代码或篡改程序的状态。\r\n- 身份验证绕过：在进行身份验证或访问控制时，整数溢出可能导致绕过验证的漏洞。攻击者可以构造特殊的输入，使溢出的整数值绕过了预期的验证逻辑，从而获得未经授权的访问权限。\r\n- 数据篡改：整数溢出可能导致数据篡改漏洞。攻击者可以通过使整数溢出，修改计数器、索引或其他控制数据的值，导致程序在处理数据时发生错误或执行意外的操作。", "title": "整数溢出或环绕常见的攻击方式"}, {"content": "- 输入验证与限制：对用户输入的整数进行合理的验证和限制，确保其在允许的范围内。\r\n- 使用安全的整数操作函数：使用安全的整数操作函数，如`add_with_overflow()`、`sub_with_overflow()`、`mul_with_overflow()`等，这些函数会检查并处理溢出情况，确保计算结果在安全范围内。\r\n- 类型检查和转换：在进行整数运算或操作之前，进行类型检查和转换，确保操作数的类型和范围是合适的。\r\n- 强制性编码标准和最佳实践：制定强制性的编码标准和最佳实践，包括对整数运算和操作的规范和限制，以帮助程序员编写更可靠、安全的代码。\r\n- 静态代码分析和测试：使用静态代码分析工具和测试技术来检测和识别潜在的整数溢出问题。这些工具可以帮助发现代码中可能存在的溢出漏洞，并及时修复。", "title": "如何预防整数溢出或环绕"}], "attack_vector_type": "Local", "cnvd_id": "", "cve_id": "CVE-2026-74721", "cvss": {}, "cvss_score": 7.8, "cvss_vector": "", "cwe": "CWE-190", "description": "Linux内核的 amdxdna 驱动属于 drivers/accel 子系统，为 AMD XDNA AI 引擎（NPU）加速器提供用户态 BO（Buffer Object）导入导出与 mmap 能力，是 AI/ML 推理加速的基础设施组件。\n受影响版本中，drivers/accel/amdxdna/amdxdna_gem.c 的 amdxdna_insert_pages 函数在两条错误返回路径上提前调用了 vma-\u003evm_ops-\u003eclose(vma)。该调用由 HMM 区间通知器注册函数所在的 amdxdna_gem_obj_mmap 触发，mmap 失败跳转到 hmm_unreg 路径后，本应仅撤销区间通知器注册，但代码同时把 shmem 的 pages_pin_count 与 GEM 对象引用计数一并释放；mmap 系统调用尚未返回 VMA 已活，等到进程 munmap 时内核 VMA 拆除会再次调用 vm_ops-\u003eclose，造成引用计数下溢。\n修复版本中通过新增 amdxdna_mark_mapp_invalid 把错误路径改为延迟缺页处理，保留 VMA 存活并交由 HMM range-fault 路径重试插入，从而切断 vm_ops-\u003eclose 在 mmap 返回前被提前调用的因果链。", "effects": [{"comp_name": "linux", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,6.16.0)", "min_fixed_version": "6.16.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "整数溢出或环绕", "kind_en" rnel 是开源操作系统内核，其 NFSv4 客户端子系统负责通过网络文件系统协议访问远程文件服务器。\n受影响版本中，fs/nfs/nfs4proc.c 的 nfs41_free_stateid 函数在发起异步 FREE_STATEID RPC 时，仅通过 nfs_put_client 释放 nfs_client 的引用计数，并未对 nfs_server 关联的 superblock 做引用计数保护。Dan Aloni 报告，当 Free_STATEID 操作被延迟时，nfs_server 可能在 RPC 完成前被回收；后续 nfs41_free_stateid_release 回调访问 data-\u003eserver-\u003enfs_client 等已释放对象时，触发 use-after-free。该缺陷由 2013 年的 7c1d5fae4a87 提交（将 nfs41_free_stateid 改造为异步 RPC）引入。\n修复版本中通过在 nfs41_free_stateid 中先调用 nfs_sb_active(server-\u003esuper) 提升 superblock 引用计数，并在 nfs41_free_stateid_release 中对应调用 nfs_sb_deactive，确保 RPC 在途期间 nfs_server 不会被清理，从而切断 use-after-free 链路。", "effects": [{"comp_name": "bpftool", "ecosystem": "linux", "versions": [{"affected_version": "影响所有版本", "min_fixed_version": "", "repository": "debian:12", "solutions": [], "upstream": false}, {"affected_version": "影响所有版本", "min_fixed_version": "", "repository": "debian:11", "solutions": [], "upstream": false}, {"affected_version": "影响所有版本", "min_fixed_version": "", "repository": "debian:13", "solutions": [], "upstream": false}]}, {"comp_name": "hyperv-daemons", "ecosystem": "linux", "versions": [{"affected_version": "影响所有版本", "min_fixed_version": "", "repository": "debian:12", "solutions": [], "upstream": false}, {"affected_version": "影响所有版本", "min_fixed_version": "", "repository": "debian:11", "solutions": [], "upstream": false}, {"affected_version": "影响所有版本", "min_fixed_version": "", "repository": "debian:13", "solutions": [], "upstream": false}]}, {"comp_name": "intel-sdsi", "ecosystem": "linux", "versions": [{"affected_version": "影响所有版本", "min_fixed_version": "", "repository": "debian:13", "solutions": [], "upstream": false}]}, {"comp_name": "libcpupower-dev", "ecosystem": "linux", "versions": [{"affected_version": "影响所有版本", "min_fixed_version": "", "repository": "debian:12", "solutions": [], "upstream": false}, {"affected_version": "影响所有版本", "min_fixed_version": "", "repository": "debian:13", "solutions": [], "upstream": false}]}, {"comp_name": "libcpupow e/c/cf616096a0f3a2b60f7d68b6b39674a6867ded9c", "name": ""}, {"url": "https://git.kernel.org/stable/c/d71dfffa512e71b166a889484e4c3b148a9a3af2", "name": ""}, {"url": "https://git.kernel.org/stable/c/d858ab09e787106432d4d9830bad9dfedf02f890", "name": ""}, {"url": "https://git.kernel.org/stable/c/ed1161ab6239761958b38d5667225634fc2be894", "name": ""}, {"url": "https://git.kernel.org/stable/c/ed2f92ce2fc48463c41e0e540b9a3454889e8af8", "name": ""}], "scope_influence": "", "tags": ["开源", "操作系统"], "title": "Linux 内核 NFSv4 FREE_STATEID 释放后使用", "_translated": true, "_saved_at": "2026-08-22T23:14:35+00:00", "_first_saved_at": "2026-08-22T18:20:10+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-oyqv-fu6w"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-77115", "cvss": {}, "cvss_score": 7.1, "cvss_vector": "", "cwe": "CWE-79", "description": "Brave Popup Builder（brave-popup-builder）是面向 WordPress 的开源弹窗插件，可在站点页面中渲染营销表单并通过 defaultType 字段读取请求参数填充表单。\n受影响版本中，插件 lib/frontend/Form.php 的 renderInput()、renderHidden() 与 renderTextarea() 在渲染 defaultType 为 \"utm\" 的表单控件时，直接从 $_GET 中取出对应 utm_* 查询参数拼入 HTML 输出，未调用 esc_attr()、esc_html() 或 esc_textarea() 进行转义。当站点加载了包含 UTM 字段的已发布弹窗时，攻击者仅需诱导受害者点击带有恶意 utm_* 参数的链接即可在受害者浏览器执行任意脚本；若管理员点击同一链接，攻击还可在已登录会话中触发。\n修复版本中通过在 renderInput()、renderHidden() 与 renderTextarea() 输出 utm_* 参数时统一调用 esc_attr()、esc_html()、esc_textarea() 进行 HTML 转义，切断未净化请求参数进入 HTML 输出的路径，阻断反射型 XSS 的形成。", "effects": [{"comp_name": "brave-popup-builder", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,0.8.6)", "min_fixed_version": "0.8.6", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-08-23", "level": "High", "mps_id": "MPS-75pz-ifwl", "poc": false, "poc_url": [], "published_time": "2026-08-23", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-75pz-ifwl", "name": "https://www.oscs1024.com/hd/MPS-75pz-ifwl"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-77115", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-77115"}, {"url": "https://wpscan.com/vulnerability/d4a760c0-8e71-4261-a08b-9b6a296c631a/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Brave Popup Builder 反射型 XSS 漏洞", "_translated": true, "_saved_at": "2026-08-23T14:16:59+00:00", "_first_saved_at": "2026-08-23T07:28:02+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-75pz-ifwl"}, {"analysis_status": 0, "articles": [{"content": "- 条件竞争漏洞是由于程序中存在多个代码块同时访问同一个条件判断语句而导致的错误。在程序中，条件判断语句通常用于决定是否执行某些代码块。当一个程序有多个代码块同时访问同一个条件判断语句时，这些代码块可能会同时执行，从而导致程序执行结果出现不可预测的错误。", "title": "什么是竞争条件"}, {"content": "- 线程切换攻击：线程切换攻击是指攻击者通过利用竞争条件漏洞，使程序在执行时频繁切换线程，从而导致系统资源耗尽，最终实现拒绝服务攻击。\n- 内存泄漏攻击：内存泄漏攻击是指攻击者通过利用竞争条件漏洞，使得程序不断申请内存，但最终无法释放内存，从而导致内存泄漏，最终程序崩溃。\n- 缓存穿透攻击：缓存穿透攻击是指攻击者通过利用竞争条件漏洞，使得程序在访问缓存时，被缓存的数据并非当前最新的数据，从而攻击者可以获取到未更新的数据。\n- 指令重放攻击：指令重放攻击是指攻击者通过利用竞争条件漏洞，在程序执行时，将先前保存的指令序列重新执行，从而实现绕过某些验证，获取系统权限等攻击目的。\n", "title": "竞争条件常见的攻击方式"}, {"content": "- 使用互斥锁：在条件判断语句中，使用互斥锁来确保只有一个代码块能够访问变量。使用互斥锁可以提高程序的安全性和可靠性。\n- 使用条件封印：在条件判断语句中，将可能会修改变量的代码块封印起来，以确保这些代码块无法被其他代码块访问。\n- 使用条件过滤：在条件判断语句中，使用条件过滤来过滤掉那些不可能发生的条件判断语句。例如，对于一个包含多个条件判断语句的循环，可以只保留其中一个条件的判断，而将其他条件的判断语句过滤掉。\n- 使用性能优化：对于一些条件判断语句，可以使用性能优化来避免条件竞争的情况。例如，可以使用数组或链表等数据结构来存储条件判断语句中的变量，从而避免条件竞争的情况。", "title": "如何预防竞争条件"}], "cnvd_id": "", "cve_id": "CVE-2026-74632", "cvss": {}, "cvss_score": 7, "cvss_vector": "", "cwe": "CWE-362", "description": "Linux内核是全球被广泛使用的开源操作系统内核，采用C语言实现，由kernel.org维护并通过git树发布稳定版本与主线版本。\n受影响版本中，mm/huge_memory.c中参考计数化的huge_zero_folio实现存在race condition：get_huge_zero_folio()在分配并安装新的huge zero folio时，会先通过cmpxchg设置huge_zero_folio、再通过WRITE_ONCE写入huge_zero_pfn；而shrinker路径的shrink_huge_zero_folio_scan()在atomic_cmpxchg把huge_zero_refcount清零后，又通过xchg把huge_zero_folio置NULL，并把huge_zero_pfn写为~0UL无效值；两条路径之间没有任何锁保护，因此当shrinker在写huge_zero_pfn之前被长时间抢占、并发缺页刚好在此窗口完成huge_zero_pfn的合法写入时，shrinker会随后用~0UL覆盖该合法PFN，导致is_huge_zero_pfn()与is_huge_zero_pmd()对正常huge zero folio错误返回false，进而把huge zero folio当作普通THP处理甚至被错误地split，引发内核内存子系统状态错乱。\n修复版本中通过新增自旋锁huge_zero_lock，把huge_zero_folio、huge_zero_pfn与huge_zero_refcount的写入放到同一临界区中序列化，get_huge_zero_folio()在锁内WRITE_ONCE写入folio与pfn后再用atomic_set_release发布huge_zero_refcount，shrink_huge_zero_folio_scan()则在scoped_guard(spinlock, \u0026huge_zero_lock)临界区内先atomic_cmpxchg把refcount清零、再WRITE_ONCE清空folio和pfn，从而消除两个CPU之间的race，并通过atomic_set_release/atomic_inc_not_zero的配对关系保证弱序架构上的fast path正确性。", "effects": [{"comp_name": "linux_kernel", "ecosystem": "linux", "versions": [{"affected_version": "[4.19.197,+∞)", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[5.4.129,+∞)", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[5.13,6.12.104)", "min_fixed_version": "6.12.104", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[5.10.47,+∞)", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.19-rc1,7.1.9)", "min_fixed_version": "7.1.9", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[5.12.14,+∞)", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[7.2-rc1,7.2)", "min_fixed_version": "7.2", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.13-rc1,6.18.45)", "min_fixed_version": "6.18.45", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "竞争条件", "kind_en": "使用共享资源并发执行且同步不正确（“竞争条件”）", "last_modified_time": "2026-08-23", "level": "High", "mps_id": "MPS-nr9t-87ye", "poc": false, "poc_url": [], "published_time": "2026-08-23", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-nr9t-87ye", "name": "https://www.oscs1024.com/hd/MPS-nr9t-87ye"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-74632", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-74632"}, {"url": "https://git.kernel.org/stable/c/105d04edbec83010df5728f74d17fd9c108e7553", "name": ""}, {"url": "https://git.kernel.org/stable/c/33192a26cddea7a7e4ca66e5c3eebd36fa8be2bb", "name": ""}, {"url": "https://git.kernel.org/stable/c/6024f6d0d9b9ca5138bfc4ac6f6e4bdf616e42b3", "name": ""}, {"url": "https://git.kernel.org/stable/c/ab7e4b407c7f58d1a003134eff3841f303d5ccc2", "name": ""}], "scope_influence": "", "tags": ["操作系统"], "title": "Linux内核 huge_zero_pfn 竞争漏洞", "_translated": true, "_saved_at": "2026-08-22T17:15:23+00:00", "_first_saved_at": "2026-08-22T17:15:23+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-nr9t-87ye"}]}</script>
  <script>
    const payload = JSON.parse(document.getElementById("payload").textContent);
    const levelLabels = payload.level_labels || {};
    const items = payload.items || [];
    let filtered = items.slice();
    let activeId = null;

    const $ = (id) => document.getElementById(id);
    $("generatedAt").textContent = payload.generated_at || "-";
    $("retention").textContent = payload.retention_days ?? "-";
    $("cutoff").textContent = payload.cutoff_date || "-";
    $("count").textContent = String(payload.count ?? items.length);

    function levelClass(level) {
      const cn = levelLabels[level] || level || "";
      if (level === "Critical" || cn === "严重") return "crit";
      if (level === "High" || cn === "高危") return "high";
      return "other";
    }
    function levelText(level) {
      return levelLabels[level] || level || "-";
    }
    function esc(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }
    function scoreText(v) {
      if (v === null || v === undefined || v === "" || v === -1) return "-";
      return String(v);
    }

    function renderList() {
      const list = $("list");
      $("listCount").textContent = String(filtered.length);
      if (!filtered.length) {
        list.innerHTML = '<div class="empty">没有匹配项</div>';
        return;
      }
      list.innerHTML = filtered.map((it) => {
        const id = it.mps_id || it.cve_id;
        const active = id === activeId ? " active" : "";
        return `
          <button class="item${active}" data-id="${esc(id)}" type="button">
            <div class="item-top">
              <span class="cve">${esc(it.cve_id || it.mps_id || "-")}</span>
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
            </div>
            <div class="title">${esc(it.title || "-")}</div>
            <div class="item-foot">
              <span>CVSS ${esc(scoreText(it.cvss_score))}</span>
              <span>${esc(it.published_time || "-")}</span>
              ${it.poc ? "<span>POC</span>" : ""}
            </div>
          </button>`;
      }).join("");
      list.querySelectorAll(".item").forEach((btn) => {
        btn.addEventListener("click", () => selectById(btn.dataset.id));
      });
    }

    function refsHtml(it) {
      const refs = Array.isArray(it.reference_url_list) ? it.reference_url_list : [];
      const links = [];
      if (it._source_page) links.push({ url: it._source_page, name: "OSCS 详情" });
      if (it.cve_id) links.push({ url: `https://nvd.nist.gov/vuln/detail/${it.cve_id}`, name: "NVD" });
      refs.forEach((r) => {
        if (r && r.url) links.push({ url: r.url, name: r.name || r.url });
      });
      const seen = new Set();
      const uniq = [];
      for (const l of links) {
        if (seen.has(l.url)) continue;
        seen.add(l.url);
        uniq.push(l);
      }
      if (!uniq.length) return '<div class="box">无参考链接</div>';
      return `<div class="refs">${uniq.map((l) =>
        `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name || l.url)}</a>`
      ).join("")}</div>`;
    }

    function articlesHtml(it) {
      const arts = Array.isArray(it.articles) ? it.articles : [];
      if (!arts.length) return "";
      return `<div class="section"><h3>相关说明</h3>${arts.map((a) => `
        <div class="article">
          <h4>${esc(a.title || "说明")}</h4>
          <p>${esc(a.content || "")}</p>
        </div>`).join("")}</div>`;
    }

    function renderDetail(it) {
      const detail = $("detail");
      if (!it) {
        detail.innerHTML = '<div class="empty">暂无数据</div>';
        return;
      }
      const pocUrls = Array.isArray(it.poc_url) ? it.poc_url : [];
      detail.innerHTML = `
        <div class="d-head">
          <div>
            <h1 class="d-title">${esc(it.title || "-")}</h1>
            <div class="ids">
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
              <span class="chip">${esc(it.cve_id || "无 CVE")}</span>
              <span class="chip">${esc(it.mps_id || "-")}</span>
              ${it.poc ? '<span class="chip">有 POC</span>' : ""}
              ${it.exp ? '<span class="chip">有 EXP</span>' : ""}
            </div>
          </div>
          <div class="actions">
            ${it._source_page ? `<a class="btn" href="${esc(it._source_page)}" target="_blank" rel="noopener">OSCS</a>` : ""}
            ${it.cve_id ? `<a class="btn" href="https://nvd.nist.gov/vuln/detail/${esc(it.cve_id)}" target="_blank" rel="noopener">NVD</a>` : ""}
          </div>
        </div>
        <div class="grid">
          <div class="stat"><div class="k">CVSS</div><div class="v">${esc(scoreText(it.cvss_score))}</div></div>
          <div class="stat"><div class="k">向量</div><div class="v">${esc(it.cvss_vector || "-")}</div></div>
          <div class="stat"><div class="k">CWE</div><div class="v">${esc(it.cwe || "-")}</div></div>
          <div class="stat"><div class="k">类型</div><div class="v">${esc(it.kind || it.kind_en || "-")}</div></div>
          <div class="stat"><div class="k">公开</div><div class="v">${esc(it.published_time || "-")}</div></div>
          <div class="stat"><div class="k">利用成本</div><div class="v">${esc(it.exploit_requirement_cost || "-")}</div></div>
          <div class="stat"><div class="k">可利用性</div><div class="v">${esc(it.exploitability || "-")}</div></div>
          <div class="stat"><div class="k">修复建议</div><div class="v">${esc(it.fix_suggestion || "-")}</div></div>
        </div>
        <div class="section"><h3>描述</h3><div class="box">${esc(it.description || "无描述")}</div></div>
        ${it.scope_influence ? `<div class="section"><h3>影响范围</h3><div class="box">${esc(it.scope_influence)}</div></div>` : ""}
        ${pocUrls.length ? `<div class="section"><h3>POC 链接</h3><div class="refs">${pocUrls.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join("")}</div></div>` : ""}
        <div class="section"><h3>参考链接</h3>${refsHtml(it)}</div>
        ${articlesHtml(it)}
      `;
    }

    function selectById(id) {
      const it = filtered.find((x) => (x.mps_id || x.cve_id) === id) ||
                 items.find((x) => (x.mps_id || x.cve_id) === id);
      if (!it) return;
      activeId = it.mps_id || it.cve_id;
      renderList();
      renderDetail(it);
      const btn = document.querySelector(`.item[data-id="${CSS.escape(activeId)}"]`);
      if (btn) btn.scrollIntoView({ block: "nearest" });
      history.replaceState(null, "", "#" + encodeURIComponent(activeId));
    }

    function applyFilter(q) {
      const query = (q || "").trim().toLowerCase();
      filtered = !query ? items.slice() : items.filter((it) => {
        const blob = [
          it.cve_id, it.mps_id, it.title, it.kind, it.kind_en, it.cwe, it.description, it.level
        ].map((x) => String(x || "").toLowerCase()).join(" ");
        return blob.includes(query);
      });
      renderList();
      if (filtered.length) {
        const still = filtered.some((x) => (x.mps_id || x.cve_id) === activeId);
        selectById(still ? activeId : (filtered[0].mps_id || filtered[0].cve_id));
      } else {
        activeId = null;
        renderDetail(null);
      }
    }

    $("search").addEventListener("input", (e) => applyFilter(e.target.value));

    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement !== $("search")) {
        e.preventDefault();
        $("search").focus();
        return;
      }
      if (!filtered.length) return;
      const idx = filtered.findIndex((x) => (x.mps_id || x.cve_id) === activeId);
      if (e.key === "ArrowDown") {
        e.preventDefault();
        const next = filtered[Math.min(filtered.length - 1, Math.max(0, idx) + 1)];
        selectById(next.mps_id || next.cve_id);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        const prev = filtered[Math.max(0, idx - 1)];
        selectById(prev.mps_id || prev.cve_id);
      }
    });

    const hashId = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    if (hashId && items.some((x) => (x.mps_id || x.cve_id) === hashId)) {
      activeId = hashId;
      renderList();
      selectById(hashId);
    } else if (items.length) {
      selectById(items[0].mps_id || items[0].cve_id);
    } else {
      renderList();
      renderDetail(null);
    }
  </script>
</body>
</html>
