rough 7.24.5 contains a session token replay vulnerability in the WebFig interface that allows attackers to bypass authentication by replaying captured session tokens across new ECDH sessions. The makeSessionKey function in libucrypto.so generates tokens using fixed salts without incorporating channel-specific or session-specific input, and the user service validates tokens against the login store without verifying channel context, enabling stolen tokens to grant persistent administrative access until the token store is explicitly cleared. This vulnerability extends the impact of CVE-2025-61481, which identified the underlying transport-layer exposure without a corresponding fix.", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "不充分的会话过期机制", "kind_en": "会话过期时间不足", "last_modified_time": "2026-10-22", "level": "Critical", "mps_id": "MPS-uml6-cq7j", "poc": false, "poc_url": [], "published_time": "2026-10-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-uml6-cq7j", "name": "https://www.oscs1024.com/hd/MPS-uml6-cq7j"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-89035", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-89035"}, {"url": "https://www.vulncheck.com/advisories/mikrotik-routeros-webfig-session-token-replay-authentication-bypass", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-89035 漏洞", "_translated": true, "_saved_at": "2026-10-24T06:46:51+00:00", "_first_saved_at": "2026-10-21T19:52:46+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-uml6-cq7j"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-83938", "cvss": {"cvssv31": [{"source": "secure@microsoft.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 10}]}, "cvss_score": 10, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H", "cwe": "CWE-306", "description": "Azure Kubernetes 配置服务中缺少对关键功能的身份验证，导致未经授权的攻击者可以通过网络提升权限。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "关键功能的认证机制缺失", "kind_en": "缺少关键功能的身份验证", "last_modified_time": "2026-10-23", "level": "Critical", "mps_id": "MPS-st6g-eqpw", "poc": false, "poc_url": [], "published_time": "2026-10-23", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-st6g-eqpw", "name": "https://www.oscs1024.com/hd/MPS-st6g-eqpw"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-83938", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-83938"}, {"url": "https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-83938", "name": "Azure Kubernetes Configuration Service Elevation of Privilege Vulnerability"}], "scope_influence": "", "tags": ["应用软件"], "title": "Azure Kubernetes 配置服务权限提升漏洞", "_translated": true, "_saved_at": "2026-10-23T00:20:39+00:00", "_first_saved_at": "2026-10-23T00:20:39+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-st6g-eqpw"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve 过滤：应用程序应该对所有用户输入进行验证和过滤，确保只接受预期的有效输入。这包括对输入数据进行输入长度验证、类型检查和格式验证等。\r\n- 使用参数化查询或预编译语句：对于数据库查询操作，应该使用参数化查询或预编译语句，确保输入数据不会被误认为是执行代码。\r\n- 最小特权原则：应用程序在执行操作系统命令或动态代码时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。\r\n- 安全编码实践：开发人员应该采用安全编码实践，包括避免使用eval函数、避免拼接用户输入的字符串作为代码执行等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止代码注入攻击。", "title": "如何预防代码注入"}], "cnvd_id": "", "cve_id": "CVE-2026-92207", "cvss": {"cvssv3": [{"source": "zdi-disclosures@trendmicro.com", "vector": "CVSS:3.0/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.0/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-94", "description": "MindsDB OpenBBtable Code Injection Remote Code Execution Vulnerability. This vulnerability allows remote attackers to execute arbitrary code on affected installations of MindsDB. Authentication is required to exploit this vulnerability.\n\nThe specific flaw exists within the OpenBBtable class. The issue results from the lack of proper validation of a user-supplied string before using it to execute Python code. An attacker can leverage this vulnerability to execute code in the context of the service account. Was ZDI-CAN-28388.", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "代码注入", "kind_en": "代码生成控制不当（“代码注入”）", "last_modified_time": "2026-10-22", "level": "High", "mps_id": "MPS-2bsv-9zpq", "poc": false, "poc_url": [], "published_time": "2026-10-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-2bsv-9zpq", "name": "https://www.oscs1024.com/hd/MPS-2bsv-9zpq"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-92207", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-92207"}, {"url": "https://www.zerodayinitiative.com/advisories/ZDI-26-707/", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-92207 漏洞", "_translated": true, "_saved_at": "2026-10-24T06:46:51+00:00", "_first_saved 序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-105937", "cvss": {}, "cvss_score": 8.8, "cvss_vector": "", "cwe": "CWE-862", "description": "Apache Pulsar 是开源的云原生分布式消息与流处理平台，broker 提供多租户主题管理以及 PIP-180 影子主题能力；影子主题通过预留属性 PULSAR.SHADOW_SOURCE 绑定源主题并读取其 managed ledger。\n受影响版本中，Admin REST 在创建非分区或分区主题以及更新主题属性时会接受 PULSAR.SHADOW_SOURCE，但只对目标主题做授权，不对属性中的源主题做校验，源侧 SHADOW_TOPIC 策略授权也不覆盖这些路径。默认授权提供者下，对本租户具备 tenant admin 角色的主体能够把本租户主题绑定到任意其他租户的持久化主题，随后仅凭本主题权限消费源主题仍保留且可读的消息，并可通过影子主题自身的保留、裁剪、卸载与删除路径永久删除源主题在 BookKeeper 与分层存储中的 ledger 数据。\n修复版本中通过新增 broker 配置 enableShadowTopics（默认 false）拒绝创建影子主题、设置 PULSAR.SHADOW_SOURCE 以及加载或复制既有影子主题，启用后跨租户绑定还要求 superuser 角色；同时让影子 managed ledger 不再裁剪或删除源主题 ledger 与卸载数据。", "effects": [{"comp_name": "org.apache.pulsar:pulsar-broker", "ecosystem": "maven", "versions": [{"affected_version": "[3.0.0,4.0.14)", "min_fixed_version": "4.0.14", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[4.1.0,4.2.5)", "min_fixed_version": "4.2.5", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": " ", "level": "High", "mps_id": "MPS-oh1b-2glp", "poc": false, "poc_url": [], "published_time": "2026-10-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-oh1b-2glp", "name": "https://www.oscs1024.com/hd/MPS-oh1b-2glp"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-86696", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-86696"}, {"url": "https://cna.erlef.org/cves/CVE-2026-86696.html", "name": ""}, {"url": "https://github.com/arekinath/esaml/commit/be692b56245071899757afa7ef47e43593d3de96", "name": ""}, {"url": "https://github.com/dropbox/esaml/commit/be692b56245071899757afa7ef47e43593d3de96", "name": ""}, {"url": "https://github.com/handnot2/esaml/commit/be692b56245071899757afa7ef47e43593d3de96", "name": ""}, {"url": "https://osv.dev/vulnerability/EEF-CVE-2026-86696", "name": ""}], "scope_influence": "", "tags": [], "title": "esaml原子表耗尽漏洞", "_translated": true, "_saved_at": "2026-10-22T12:50:01+00:00", "_first_saved_at": "2026-10-22T12:50:01+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-oh1b-2glp"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-105934", "cvss": {}, "cvss_score": 8.1, "cvss_vector": "", "cwe": "CWE-862", "description": "Apache Pulsar 是开源分布式消息与流处理平台，broker 通过 admin REST API 提供持久化主题管理能力，其中包括 truncate 操作。\n受影响版本中，DELETE /admin/v2/persistent/{tenant}/{namespace}/{topic}/truncate 在按分区主题父名称截断时，PersistentTopicsBase.internalTruncateTopicAsync 未对调用者执行 validateAdminAccessForTenantAsync。该方法读取分区元数据后，通过 broker 内部 admin 客户端对各分区发起 truncate，内部客户端使用 broker 配置凭据而非调用者身份。在授权启用且 broker 内部角色为目标租户 admin 或 superuser 的常见配置下，已认证且仅具备 lookup 权限的非租户管理员可将全部分区订阅游标移至主题末尾并删除非活跃 ledger，造成未确认积压被跳过以及历史消息永久丢失。默认授权提供者下，lookup 权限由 produce 或 consume 授予。\n修复版本中通过在读取分区元数据及截断任何分区之前，对调用者统一执行 validateAdminAccessForTenantAsync，使分区主题与非分区主题、单分区使用相同的租户管理员校验，切断普通 lookup 用户借助内部身份完成截断的路径。", "effects": [{"comp_name": "org.apache.pulsar:pulsar-broker", "ecosystem": "maven", "versions": [{"affected_version": "[2.8.0,4.0.14)", "min_fixed_version": "4.0.14", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[4.1.0,4.2.5)", "min_fixed_version": "4.2.5", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-10-22", "level": "High", "mps_id": "MPS-4f24-d042", "poc": false, "poc_url": [], "published_time": "2026-10-22", "reference_url_list": [{"url": "http://www.mail-archive.com/announce@apache.org/msg12405.html", "name": ""}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-105934", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-105934", "name": ""}, {"url": "https://lists.apache.org/thread.html/ox0vy41jlb41y2l04y7b6h2srlyqoj8o", "name": ""}, {"url": "https://pulsar.apache.org/security/CVE-2026-105934/", "name": ""}, {"url": "https://github.com/apache/pulsar/pull/26776", "name": ""}, {"url": "https://github.com/apache/pulsar/commit/b8b57698a33835c2394409e93bf7d704b779f914", "name": ""}, {"url": "http s": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-105942", "cvss": {}, "cvss_score": 7.7, "cvss_vector": "", "cwe": "CWE-863", "description": "Apache Pulsar 是 Apache 软件基金会开源的云原生消息与流处理平台，broker 支持通过官方 Proxy 以 proxy 角色转发客户端请求，并携带 original principal。\n受影响版本中，代理转发请求时 AuthorizationService 用代理自身的认证数据校验 original principal。启用 MultiRolesTokenAuthorizationProvider 后，getRolesAsync 会从该认证数据解析代理 token 的 roles 声明，使被代理的普通用户获得代理 token 中的超级用户或租户管理员权限。PulsarWebResource.validateAdminAccessForTenantAsync 在代理角色已是租户管理员时跳过对 original principal 的检查，经该代理转发的任意用户都能执行对应租户的管理 REST 操作。\n修复版本中通过 originalPrincipalAuthData 将 original principal 的授权改为 AuthenticationDataForwarded，并要求代理角色与 original principal 均通过 isSuperUserOrTenantAdmin；MultiRolesTokenAuthorizationProvider 仅在转发 token 认证身份等于 original principal 时才使用其中的角色。", "effects": [{"comp_name": "org.apache.pulsar:pulsar-broker", "ecosystem": "maven", "versions": [{"affected_version": "[2.8.1,4.0.14)", "min_fixed_version": "4.0.14", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[4.1.0,4.2.5)", "min_fixed_version": "4.2.5", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "2026-10-22", "reference_url_list": [{"url": "https://www.openwall.com/lists/oss-security/2026/10/21/28", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-94140", "name": ""}, {"url": "https://metacpan.org/release/FERKI/Rex-1.16.1/source/lib/Rex/Commands/Rsync.pm", "name": ""}, {"url": "https://metacpan.org/dist/Rex", "name": ""}, {"url": "https://github.com/RexOps/Rex", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Rex rsync主机密钥绕过", "_translated": true, "_saved_at": "2026-10-22T01:20:18+00:00", "_first_saved_at": "2026-10-21T22:58:15+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-b2ba-e008"}, {"analysis_status": 0, "articles": [{"content": "- 编写代码时没有正确处理输入数据或没有正确验证用户输入而导致的。", "title": "什么是关键资源权限分配不当"}, {"content": "- 弱密码或未使用的密码：当管理员或系统管理员在创建帐户时，没有使用强密码或未对帐户进行密码更新时，可能会发生这种情况。弱密码可能会被黑客破解或通过其他方式轻松访问系统。\n- 未正确配置权限：在系统中，不同的资源通常需要不同的权限才能访问。如果管理员未正确配置权限，那么未经授权的用户可能会通过欺骗系统或利用其他漏洞来访问关键资源。\n- 权限重用：在某些情况下，管理员可能会将某些权限分配给某个用户，但这些权限并未被正确地限制或授权给该用户。如果其他用户尝试使用这些权限访问关键资源，那么他们可能会获得未经授权的访问权限。\n- 未正确验证用户输入：当开发人员没有正确验证用户输入时，可能会发生这种情况。例如，如果开发人员未正确过滤用户输入的用户名或密码，那么黑客可能会利用这些信息轻松地访问系统。\n", "title": "关键资源权限分配不当常见的攻击方式"}, {"content": "- 使用强密码：管理员应该使用强密码来保护系统，并定期更改密码。强密码应该包括数字、字母和符号，并且应该不同于其他帐户使用的密码。\n- 正确配置权限：管理员应该正确配置系统中不同资源所需的权限。用户可以被授予访问特定资源的权限，但不应该被授予访问其他资源的权限。\n- 权限限制：管理员应该使用权限限制来限制用户对特定资源的访问。例如，用户可以被授予访问特定文件夹的权限，但不能访问其他文件夹。\n- 输入验证：开发人员应该正确验证用户输入。例如，他们可以过滤用户输入的用户名和密码，以确保它们符合预期的格式。\n- 安全培训：管理员和用户应该接受安全培训，以便了解如何识别和避免常见的安全漏洞，例如不正确权限授予漏洞。\n- 定期更新和修补软件：系统软件和应用程序应该定期更新和修补，以确保它们不受最新安全漏洞的影响。", "title": "如何预防关键资源权限分配不当"}], "cnvd_id": "", "cve_id": "CVE-2026-115253", "cvss": {"cvssv4": [{"source": "5d1c2695-1a31-4499-88ae-e847036fd7e3", "vector": "CVSS:4.0/AV:L/AC:L/AT:P/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.3}]}, "cvss_score": 7.3, "cvss_vector": "CVSS:4.0/AV:L/AC:L/AT:P/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI: UI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-918", "description": "onPhase Forms 版本 11.0.14 中未经身份验证的表单服务中存在服务器端请求伪造 (SSRF) 漏洞，允许未经身份验证的远程攻击者通过提供给可公开访问的表单的受攻击者控制的 URL 访问敏感的内部 Apache Solr 数据。", "effects": [{"comp_name": "onPhase Forms", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,11.0.14]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SSRF", "kind_en": "服务器端请求伪造 (SSRF)", "last_modified_time": "2026-10-23", "level": "High", "mps_id": "MPS-hsqf-vymi", "poc": false, "poc_url": [], "published_time": "2026-10-23", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-hsqf-vymi", "name": "https://www.oscs1024.com/hd/MPS-hsqf-vymi"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-19678", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-19678"}, {"url": "https://frevvo-docs.atlassian.net/wiki/spaces/frevvo110/pages/1069273270/Detailed+Release+Notes", "name": ""}, {"url": "https://frevvo-docs.atlassian.net/wiki/spaces/frevvo110/overview?homepageId=1069252609", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "服务器端请求伪造 (SSRF) 导致 Solr 内部数据泄露", "_translated": true, "_saved_at": "2026-10-23T05:39:40+00:00", "_first_saved_at": "2026-10-23T05:39:40+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-hsqf-vymi"}, {"analysis_status": 0, "articles": [{"content": "跨站点请求伪造 (CSRF)通过利用网站对用户请求的信任进行攻击。当用户在网站A登录并在同一浏览器会话中访问网站B时，攻击者可以构造特制的请求并诱使用户执行，以使网站B误以为这些请求是用户合法发起的。\n攻击者通常通过欺骗用户点击恶意链接、在受信任的网站中植入恶意代码或通过钓鱼等手段来实施CSRF攻击，一旦用户执行了恶意请求，攻击者可以以用户的身份执行任意操作，包括更改用户密码、发起资金转账或删除重要数据等。", "title": "什么是CSRF"}, {"content": "- 链接欺骗：攻击者通过向用户发送包含恶意链接的电子邮件或社交媒体消息，诱使用户点击并执行恶意请求。\n- 图片引用攻击：攻击者通过在恶意网站上包含指向目标网站的图片引用，以触发用户浏览器自动发送目标网站的请求。\n- XSS利用：如果目标网站存在XSS漏洞，攻击者可以注入恶意脚本，以使用户在浏览器中执行恶意请求。", "title": "CSRF常见的攻击方式"}, {"content": "- 随机令牌：网站可以在每个请求中包含一个随机生成的令牌（CSRF Token），并验证该令牌的有效性，以确认请求的来源是合法的。\n- SameSite Cookie：使用SameSite属性来限制跨站点请求，将Cookie的发送限制在同一站点上，减少了跨站请求伪造的风险。\n- 双重验证：对于敏感操作，网站可以要求用户进行额外的验证，例如输入验证码、提供第二个因素的身份验证等。\n- 强化浏览器策略：网站可以设置Content-Security-Policy（CSP）头，限制浏览器执行恶意脚本的能力，减少CSRF攻击的风险。\n- 限制用户操作：网站可以要求用户在执行敏感操作之前进行明确的确认或授权，防止恶意请求被误触发。\n- 安全编码实践：开发人员应遵循安全编码实践，对用户输入进行适当的验证和过滤，防止恶意请求的注入。", "title": "如何预防CSRF"}], "cnvd_id": "", "cve_id": "CVE-2026-58497", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-352", "description": "Uni-CLI 为人员和代理提供了一个针对网站、浏览器、桌面应用程序、本地工具和 MCP 的命令界面。在版本 0.225.2 之前，Uni-CLI 在环回上公开旧版 JSON-RPC-over-HTTP MCP 传输，而无需在路由请求之前验证浏览器 Origin 标头。恶意网页可能会向本地 /mcp 端点发送 CORS 简单 POST 请求（例如 text/plain），并将 JSON-RPC 正文传递给调度程序。如果用户已启动本地 MCP HTTP 传输，则该页面可以针对用户的本地 Uni-CLI 服务器驱动工具/调用请求。 Streamable HTTP 传输已经强制执行了浏览器到本地主机的边界。传统的无状态 HTTP 路径没有，因此两种 HTTP 传输发生了漂移。这个问题是关于浏览器到本地主机的边界；它不会改变 Uni-CLI 的本地代码执行信任模型。该问题已在 0.225.2 版本中修复。", "effects": [{"comp_name": "Uni-CLI", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,0.225.2)", "min_fixed_version": "0.225.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "CSRF", "kind_en": "跨站请求伪造 (CSRF)", "last_modified_time": "2026-10-23", "level": "High", "mps_id": "MPS-5zyg-p349", "poc": false, "poc_url": [], "published_time": "2026-10-23", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-5zyg-p349", "name": "https://www.oscs10 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-472", "description": "MarcosCamara01 Ecommerce Template 是基于 Next.js 的开源电商模板，用于提供购物车与 Stripe Checkout 结账能力。\n受影响版本中，POST /api/user/cart 将请求体里相互独立的 variantId 与 stripeId 直接写入购物车行，未校验 stripeId 是否属于该 variantId。POST /api/stripe/payment 以 { price: item.stripeId, quantity } 从购物车行构造 Stripe Checkout 扣款项，checkout.session.completed webhook 再按同一行的 variantId 生成订单商品。已认证普通用户可将高价商品的 variantId 与目录中公开可读的低价 stripeId 配对，按低价完成支付并获得高价商品。\n修复版本中通过新增 buildLineItems() 只从关联的 variant.stripeId 读取扣款价格，并使 addToCartSchema 不再接受客户端 stripeId、改由 findVariantById() 在服务端解析，令扣款金额与订单商品均由 variantId 决定。", "effects": [{"comp_name": "ecommerce-template", "ecosystem": "linux", "versions": [{"affected_version": "[2aa8ec539b6b441632096ced78e099fb096a57da,e6b364cd668f2ba875cfa7f6d55c63e771715df7)", "min_fixed_version": "e6b364cd668f2ba875cfa7f6d55c63e771715df7", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "对假设不可变Web参数的外部可控制", "kind_en": "假定不可变 Web 参数的外部控制", "last_modified_time": "2026-10-22", "level": "High", "mps_id": "MPS-y9dj-7vhx", "poc": false, "poc_url": [], "published_time": "2026-10-23", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-y9dj-7vhx", "name": "https://www.oscs1024.com/hd/MPS-y9dj-7vhx"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-115450", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-115450"}, {"url": "https://github.com/MarcosCamara01/ecommerce-template/commit/e6b364cd668f2ba875cfa7f6d55c63e771715df7", "name": ""}, {"url": "https://secur0.com/en/cna/cve-list/cve-2026-115450-price-manipulation-stripe-checkout", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "电商模板价格篡改漏洞", "_translated": true, "_saved_at": "2026-10-22T17:48:58+00:00", "_first_saved_at": "2026-10-22T17:48:58+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-y9dj-7vhx"}, {"analysis_status": 0, "articles": [{"content": "跨界内存读是指应用程序在读取内存时，未正确验证或限制读取的内存范围。攻击者利用这种漏洞可以读取应用程序内存中的敏感数据，如密码、加密密钥、会话令牌等。常见的原因是由于缓冲区溢出、格式化字符串漏洞或其他内存错误导致的。", "title": "什么是越界读取"}, {"content": "攻击者可以通过不当构造的输入来触发跨界内存读漏洞。攻击者可能会通过向应用程序发送特定的输入，使其读取超过预期的内存区域。攻击者可以利用这个漏洞来获取敏感信息，如其他用户的数据、操作系统的敏感数据或应用程序的内部状态。", "title": "越界读取常见的攻击方式"}, {"content": "- 输入验证和限制：应用程序应对所有输入数据进行严格的验证和限制。确保输入数据的长度、格式和内容符合预期，避免超出缓冲区或访问非预期的内存区域。\n- 内存安全编程实践：开发人员应使用安全的编程实践，如避免使用不安全的函数、正确处理内存分配和释放操作，以及遵循最小特权原则。\n- 使用安全的编程语言和库：选择使用安全性较高的编程语言和库，这些语言和库在内存管理和安全性方面提供了更多的保护机制。\n- 定期进行代码审查和安全测试：定期审查应用程序的代码，并进行安全测试，以发现潜在的跨界内存读漏洞。使用静态代码分析工具和漏洞扫描工具来辅助检测和修复问题。\n- 实施防御性编程技术：应用程序应采用防御性编程技术，如使用随机化地址空间布局（ASLR）、堆栈保护机制（如堆栈溢出保护）和数据执行预防（DEP）等。\n- 及时更新和修补：及时应用程序和操作系统的安全更新和补丁，以确保已知的跨界内存读漏洞得到修复。及时更新相关软件和库，以避免使用已知存在漏洞的版本。", "title": "如何预防越界读取"}], "cnvd_id": "", "cve_id": "CVE-2026-115486", "cvss": {"cvssv31": [{"source": "secalert@redhat.com", "vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:U/C:N/I:H/A:L", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:U/C:N/I:H/A:L", "cwe": "CWE-125", "description": "open-iscsi 的 iscsiuio 组件中发现缺陷。 IPv6 邻居发现处理程序以固定偏移量访问链路层地址选项，而不验证数据包是否包含这些选项。此外，ARP 表会使用数据包标头中攻击者控制的地址进行无条件更新。同一网段上的攻击者可以发送最小的邻居通告来毒害 ARP 表并重定向网络流量。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界读取", "kind_en": "越界读取", "last_modified_time": "2026-10-23", "level": "High", "mps_id": "MPS-yuwk-1r3p", "poc": false, "poc_url": [], "published_time": "2026-10-23", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-yuwk-1r3p", "name": "https://www.oscs1024.com/hd/MPS-yuwk-1r3p"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-115486", "name": "https://nvd.nist.gov/vuln/ e": "2026-10-23", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-4hsn-lfic", "name": "https://www.oscs1024.com/hd/MPS-4hsn-lfic"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-95713", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-95713"}, {"url": "https://support.hpe.com/hpesc/public/docDisplay?docId=hpesbnw05162en_us\u0026docLocale=en_US", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-95713漏洞", "_translated": true, "_saved_at": "2026-10-22T21:05:49+00:00", "_first_saved_at": "2026-10-22T21:05:49+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-4hsn-lfic"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-115748", "cvss": {}, "cvss_score": 8.8, "cvss_vector": "", "cwe": "CWE-620", "description": "Apache Vysper 是 Apache MINA 旗下的开源 XMPP（Jabber）服务器 Java 组件，用于搭建即时消息服务端并提供各类 XEP 协议扩展模块。\n受影响版本中，XEP-0077 In-Band Registration 模块的 InBandRegistrationHandler 在会话处于 AUTHENTICATED 状态时处理 iq set 注册报文，直接使用报文中攻击者可控的 username 元素解析目标账号并调用 AccountManagement.changePassword 修改口令，未校验该账号与当前会话认证实体 sessionContext.getInitiatingEntity() 是否一致，任何已认证用户可将任意已存在账号的口令改为指定值，实现其他账号的接管。\n修复版本中通过安全公告说明项目退役且不会发布修复版本；在官方修复发布前，可通过移除或禁用 InBandRegistrationModule（XEP-0077 In-Band Registration）模块、迁移至仍在维护的 XMPP 服务器切断该攻击路径。", "effects": [{"comp_name": "org.apache.vysper:vysper-core", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,0.7]", "min_fixed_version": "", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "未经验证的口令修改", "kind_en": "未经验证的密码更改", "last_modified_time": "2026-10-24", "level": "High", "mps_id": "MPS-2436-379a", "poc": false, "poc_url": [], "published_time": "2026-10-24", "reference_url_list": [{"url": "https://seclists.org/oss-sec/2026/q4/357", "name": ""}, {"url": "https://mina.apache.org/vysper-project/", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-115748", "name": ""}, {"url": "https://github.com/apache/mina-vysper", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "Apache Vysper授权绕过漏洞", "_translated": true, "_saved_at": "2026-10-24T06:46:48+00:00", "_first_saved_at": "2026-10-24T06:46:48+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-2436-379a"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-79982", "cvss": {"cvssv31": [{"source": "vulnerabilities@zephyrproject.org", "vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-787", "description": "Zephyr 是 Zephyr Project 开源的物联网实时操作系统，广泛用于嵌入式与低功耗设备，其新 USB 设备栈中的蓝牙 HCI 传输类使设备可作为 USB 蓝牙控制器与 USB 主机通信。\n受影响版本中，subsys/usb/device_next/class/bt_hci.c 的 bt_hci_tx_sync_in() 从 bt_hci_ep_pool 分配 USB 传输缓冲，该池每个槽位仅 USBD_MAX_BULK_MPS 字节（全速构建下为 64 字节），随后执行 net_buf_add_mem(buf, bt_buf-\u003edata, bt_buf-\u003elen) 复制完整的控制器到主机 HCI 包且不校验长度，而 HCI 事件与 ACL 缓冲按 CONFIG_BT_BUF_EVT_RX_SIZE、CONFIG_BT_BUF_ACL_RX_SIZE 配置可远大于槽位，复制越过槽位边界写入池内相邻槽位及池后静态内存；设备以 raw HCI 模式运行本地蓝牙控制器，超长数据源于空中接口，蓝牙范围内的未认证攻击者可通过与设备建立连接并协商数据长度扩展发送 ACL 分片，或仅广播扩展通告数据并经 LE Extended Advertising Report 事件进入该路径，库存全速配置下主机初始化阶段的 Read Supported Commands 命令完成事件（70 字节）同样触发越界；CONFIG_ASSERT=n 的生产构建中越界写静默发生，目标缺少子系统间内存保护时可被用于任意代码执行，开启断言的构建则因断言失败宕机形成远程拒绝服务。\n修复版本中通过为控制器到主机方向新增按最大完整 HCI 包定长的 bt_hci_tx_pool（容量为 MAX(BT_BUF_ACL_RX_SIZE, BT_BUF_EVT_RX_SIZE)），bt_hci_tx_sync_in() 改由该池分配 USB 传输缓冲，主机到设备方向维持按端点包大小分配并沿用重组阶段的边界检查，完整 HCI 包可在单次 USB 请求中提交且复制不再越过缓冲边界。", "effects": [{"comp_name": "zephyr", "ecosystem": "linux", "versions": [{"affected_version": "[3.3.0,4.5.0)", "min_fixed_version": "4.5.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-10-24", "level": "High", "mps_id": "MPS-lp5k-f3q9", "poc": false, "poc_url": [], "published_time": "2026-10-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-lp5k-f3q9", "name": "https://www.oscs1024.com/hd/MPS-lp5k-f3q9"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-79982", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-79982"}, {"url": "https://github.com/zephyrproject-rtos/zephyr/commit/0419defd2391652edc27689d206fcd9c48439d4a", "name": "Fix commit"}, {"url": "https://github.com/zephyrproject-rtos/zephyr/security/advisories/GHSA-w5px-w97v-c3hj", "name": "GHSA-w5px-w97v-c3hj"}], "scope_influence": "", "tags": ["应用软件"], "title": "Zephyr USB蓝牙HCI越界写漏洞", "_translated": true, "_saved_at": "2026-10-24T01:19:20+00:00", "_first_saved_at": "2026-10-23T22:49:54+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-lp5k-f3q9"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-87901", "cvss": {"cvssv3": [{"source": "support@hackerone.com", "vector": "CVSS:3.0/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:L", "severity": "high", "base_score": 8.3}]}, "cvss_score": 8.3, "cvss_vector": "CVSS:3.0/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:L", "cwe": "CWE-79", "description": "注册模块中的不当清理会导致反射性跨站点脚本攻击。", "effects": [{"comp_name": "phpBB", "ecosystem": "linux", "versions": [{"affected_version": "(3.3.0,3.3.18]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-10-24", "level": "High", "mps_id": "MPS-i8zb-1lj3", "poc": false, "poc_url": [], "published_time": "2026-10-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-i8zb-1lj3", "name": "https://www.oscs1024.com/hd/MPS-i8zb-1lj3"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-87901", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-87901"}, {"url": "https://www.phpbb.com/community/viewtopic.php?t=2675305", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-87901漏洞", "_translated": true, "_saved_at": "2026-10-23T19:43:03+00:00", "_first_saved_at": "2026-10-23T19:43:03+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-i8zb-1lj3"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-79977", "cvss": {"cvssv31": [{"source": "vulnerabilities@zephyrproject.org", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:H", "severity": "high", "base_score": 8.2}]}, "cvss_score": 8.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:H", "cwe": "CWE-346", "description": "Zephyr 是 Linux 基金会托管的开源物联网实时操作系统（RTOS），其网络子系统内置 WireGuard VPN 服务，用于在资源受限设备上建立加密隧道。\n受影响版本中，subsys/net/lib/wireguard/wg.c 的 handle_transport_data() 在传输数据报文携带的 32 位 receiver index 匹配不到任何会话、且该对端既无有效握手也无当前密钥时，会置位 send_handshake 并执行 memcpy(\u0026peer-\u003eendpoint, peer_addr, sizeof(peer-\u003eendpoint))，把该 UDP 报文的源地址直接写入对端端点；receiver index 未知意味着此类报文无法用任何密钥完成认证，而 WireGuard 监听端经 net_udp_register() 注册时不限制远端地址与端口、默认监听 UDP 51820，攻击者无需观测合法流量便可离线伪造 16 字节报文把 peer-\u003eendpoint 指向任意地址，此后握手发起、keepalive 与加密数据报文全部发往攻击者地址，合法对端因收不到握手发起而无法重新认证，隧道持续不可用，攻击者还可在中继握手报文后处于隧道路径上，观测密文与流量元数据并选择性丢包。\n修复版本中通过在 handle_transport_data() 的无会话分支移除端点学习完成修复：保留 stale-session 恢复逻辑，握手只发往已从认证消息学到的端点，尚无已知端点时回退为配置的 cfg_endpoint，两者均未知时丢弃报文并返回 -ENOENT，使对端端点无法再被未认证报文污染。", "effects": [{"comp_name": "zephyr", "ecosystem": "linux", "versions": [{"affected_version": "[4.4.0,4.4.2]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "源验证错误", "kind_en": "来源验证错误", "last_modified_time": "2026-10-24", "level": "High", "mps_id": "MPS-g3c9-spxt", "poc": false, "poc_url": [], "published_time": "2026-10-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-g3c9-spxt", "name": "https://www.oscs1024.com/hd/MPS-g3c9-spxt"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-79977", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-79977"}, {"url": "https://github.com/zephyrproject-rtos/zephyr/commit/cbaaf3e9dbe08be21f01bd23142e1ffe91fd4db6", "name": "Fix commit"}, {"url": "https://github.com/zephyrproject-rtos/zephyr/security/advisories/GHSA-w8h4-r8m3-rf5j", "name": "GHSA-w8h4-r8m3-rf5j"}], "scope_influence": "", "tags": ["应用软件"], "title": "Zephyr WireGuard 隧道端点劫持漏洞", "_translated": true, "_saved_at": "2026-10-24T01:19:21+00:00", "_first_saved_at": "2026-10-23T22:49:56+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-g3c9-spxt"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "cnvd_id": "", "cve_id": "CVE-2026-79979", "cvss": {"cvssv31": [{"source": "vulnerabilities@zephyrproject.org", "vector": "CVSS:3.1/AV:L/AC:H/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:H/PR:L/UI:N/S:C/C:H/I:H/A:H", "cwe": "CWE-416", "description": "Zephyr 是 Zephyr Project 基金会维护的开源物联网实时操作系统（RTOS），面向资源受限的嵌入式设备，其 arm64 架构后端通过 CONFIG_USERSPACE 与需求分页（demand paging）机制提供用户态内存隔离与按需换页能力。\n受影响版本中，arch/arm64/core/mmu.c 的 invalidate_tlb_page() 以 virt \u003e\u003e 12 为操作数执行 TLBI VAE1{IS}，该操作数的 ASID 字段（bits [63:48]）恒为 0，失效仅能匹配内核页表（ASID 0）与全局映射，而内存域自 1 起分配 ASID，域私有叶项由 private_map() 以 MT_NG 非全局属性建立，其缓存的翻译在该次失效中不被覆盖；运行在用户线程中的非特权代码可制造内存压力触发页面回收，回收路径 page_frame_prepare_locked() 调用 arch_mem_page_out() 置无效内核叶项并同步各内存域后仅完成上述 ASID 0 失效，do_page_fault() 随后将同一物理帧复用给新映射，已触碰过被换出页的用户线程在其自身 ASID 下仍持有指向该物理帧的有效 EL0 读写翻译，可继续读写内核后续放入该帧的内容（内核数据、其他内存域分区或其他线程的栈），破坏 CONFIG_USERSPACE 的隔离边界，导致信息泄露与内存破坏。\n修复版本中通过将 invalidate_tlb_page() 的失效指令切换为匹配全部 ASID 与全局、非全局映射的 TLBI VAAE1{IS}，使页出、脏位更新与访问位清理后不再残留任何域标记的翻译，切断对被复用物理帧的越权访问链；同一提交还让 globalize_table() 在换页状态同步时保留域私有叶项的 EL0 权限与非全局属性，消除用户线程在换页后丢失自身分区与栈访问的伴随缺陷。", "effects": [{"comp_name": "zephyr", "ecosystem": "linux", "versions": [{"affected_version": "[4.3.0,4.5.0)", "min_fixed_version": "4.5.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "UAF", "kind_en": "免费后使用", "last_modified_time": "2026-10-24", "level": "High", "mps_id": "MPS-agpz-tcr0", "poc": false, "poc_url": [], "published_time": "2026-10-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-agpz-tcr0", "name": "https://www.oscs1024.com/hd/MPS-agpz-tcr0"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-79979", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-79979"}, {"url": "https://github.com/zephyrproject-rtos/zephyr/commit/d732e9f808f16911d06769b3f756246f3528669f", "name": "Fix commit"}, {"url": "https://github.com/zephyrproject-rtos/zephyr/security/advisories/GHSA-6pqm-hfxf-48qv", "name": "GHSA-6pqm-hfxf-48qv"}], "scope_influence": "", "tags": ["应用软件"], "title": "Zephyr TLB隔离绕过漏洞", "_translated": true, "_saved_at": "2026-10-2 19:42:58+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-3ks1-uzlh"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-115721", "cvss": {}, "cvss_score": 7.5, "cvss_vector": "", "cwe": "CWE-770", "description": "Apache Vysper 是 Apache Mina 旗下的开源 XMPP（Jabber）服务器库，以独立或嵌入式方式对外提供 XMPP 服务，其 nbxml 模块内置的非阻塞 XML 解析器负责解析客户端与服务器之间的 XML 流。\n受影响版本中，nbxml 模块 org.apache.vysper.xml.sax.impl.XMLTokenizer 类的 parse 方法使用 IoBuffer.allocate(16).setAutoExpand(true) 的自动扩容缓冲区累积输入字节，在文本、元素名与属性值等状态下对每个输入字节执行 buffer.put(c)，不存在任何 token、stanza 或请求长度上限，缓冲区仅在遇到终止分隔符时才被清空；上游 XMPPDecoder 在 doDecode 返回 false 后继续等待更多数据，攻击者在 TCP XMPP 端口 5222 上发送流头后跟无终止分隔符的持续字符数据，或在 BOSH/XMPP-over-HTTP 端口 8080 上提交超大 HTTP 请求体，可使 JVM 堆内存持续增长直至抛出 OutOfMemoryError。解析发生在身份认证之前，无需任何凭据，单个 JVM 承载全部会话，内存耗尽后整个服务器对所有用户不可用。\n修复版本中通过，Apache 已于 2026-10-23 公告说明该项目处于 dormant 状态、将以 unsupported when assigned 方式发布该 CVE 且不会发布修复版本，官方建议用户改用其他仍在维护的 XMPP 服务器实现；临时缓解可在网络边界限制对 XMPP 端口（TCP 5222）与 BOSH 端口（8080）的访问来源，为服务进程配置独立 JVM 堆上限与连接级流量限制，并尽快完成迁移。", "effects": [{"comp_name": "org.apache.vysper:nbxml", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,0.7]", "min_fixed_version": "", "repository": "maven", "solutions": [], "upstream": true}]}, {"comp_name": "org.apache.vysper:vysper-core", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,0.7]", "min_fixed_version": "", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "不加限制或调节的资源分配", "kind_en": "不受限制或节流地分配资源", "last_modified_time": "2026-10-24", "level": "High", "mps_id": "MPS-c9e7-10c5", "poc": false, "poc_url": [], "published_time": "2026-10-24", "reference_url_list": [{"url": "https://seclists.org/oss-sec/2026/q4/356", "name": ""}, {"url": "https://www.zeroscience.mk/advisories/ZSL-2026-6022.html", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-115721", "name": ""}, {" com/hd/MPS-5f1j-078h"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-110975", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-110975"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-110975", "name": ""}, {"url": "https://bugzilla.redhat.com/show_bug.cgi?id=2512012", "name": "RHBZ#2512012"}, {"url": "https://github.com/kruize/autotune/pull/2038", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Autotune：kruize/autotune：kruis/autotune：数据源凭证泄露", "_translated": true, "_saved_at": "2026-10-23T19:43:01+00:00", "_first_saved_at": "2026-10-23T19:43:01+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-5f1j-078h"}, {"analysis_status": 0, "articles": [{"content": "应用程序在处理用户输入时的不完善或缺乏验证机制，所以攻击者能够通过向应用程序发送恶意输入，利用应用程序对输入数据的错误处理方式来注入自己的恶意代码。这些恶意代码会被应用程序误认为是合法的指令或数据，并在执行过程中被执行。", "title": "什么是代码注入"}, {"content": "应用程序使用可执行动态代码的函数来执行用户可控的参数，当应用程序对于用户输入过滤不完全时，攻击者可以注入恶意代码并控制代码执行流程。", "title": "代码注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对所有用户输入进行验证和过滤，确保只接受预期的有效输入。这包括对输入数据进行输入长度验证、类型检查和格式验证等。\r\n- 使用参数化查询或预编译语句：对于数据库查询操作，应该使用参数化查询或预编译语句，确保输入数据不会被误认为是执行代码。\r\n- 最小特权原则：应用程序在执行操作系统命令或动态代码时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。\r\n- 安全编码实践：开发人员应该采用安全编码实践，包括避免使用eval函数、避免拼接用户输入的字符串作为代码执行等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止代码注入攻击。", "title": "如何预防代码注入"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-113673", "cvss": {}, "cvss_score": 7.2, "cvss_vector": "", "cwe": "CWE-94", "description": "GeoDirectory 是 AyeCode 团队开发的 WordPress 开源商业目录插件，通过 WordPress.org 插件目录分发，用于搭建本地商户目录、分类信息与企业名录站点。\n受影响版本中，后台 Tools 页面的 DB Text Export 功能在 load_db_language() 中把数据库内管理员自定义文本（自定义字段标题、内容类型标签、GD 选项值等）逐条拼接为插件目录下 db-language.php 中的 __() 单引号字符串字面量，仅用 str_replace 转义单引号而不处理反斜杠，包含反斜杠与引号的文本可以闭合该字面量并注入任意 PHP 代码；生成的文件无 ABSPATH 访问控制，多站点网络中具备 manage_options 权限但并非超级管理员的子站管理员可触发导出，任意未认证访客请求该文件便可触发注入代码执行，最终形成远程代码执行。\n修复版本中通过 load_db_language() 改用 var_export() 生成合法 PHP 字符串字面量使数据库文本无法逃逸，新增 can_export_db_texts() 将导出权限收紧为多站点超级管理员或单站点 manage_options 用户，新增 is_tr 复执行完整流读取；get_object 对已判定无效的对象未提前命中已解析缓存，反复执行全文正则扫描。攻击者构造包含大量重复畸形交叉引用条目的 PDF 文件，使解析耗时随条目数量与文件大小成倍增长，造成长时间占用 CPU 的拒绝服务。\n修复版本中通过新增 get_stream_data 统一封装整流读取，并将缓冲区读取移入恢复缓存为空的分支，确保恢复缓存只加载一次；get_object 改为命中 resolved_objects 缓存时直接返回，避免对同一无效对象重复全文扫描，消除了重复整流加载带来的性能退化。", "effects": [{"comp_name": "pypdf", "ecosystem": "pip", "versions": [{"affected_version": "(-∞,6.21.2)", "min_fixed_version": "6.21.2", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "低效算法复杂性", "kind_en": "低效的算法复杂性", "last_modified_time": "2026-10-24", "level": "High", "mps_id": "MPS-oraj-3sxh", "poc": false, "poc_url": [], "published_time": "2026-10-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-oraj-3sxh", "name": "https://www.oscs1024.com/hd/MPS-oraj-3sxh"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-115585", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-115585"}, {"url": "https://github.com/py-pdf/pypdf/security/advisories/GHSA-jr96-gvgh-j3r4", "name": "https://github.com/py-pdf/pypdf/security/advisories/GHSA-jr96-gvgh-j3r4"}, {"url": "https://github.com/py-pdf/pypdf/pull/4240", "name": "https://github.com/py-pdf/pypdf/pull/4240"}, {"url": "https://github.com/py-pdf/pypdf/commit/68a0e5046cc9e14a6c24a21a713f3c7fbde18b4b", "name": "https://github.com/py-pdf/pypdf/commit/68a0e5046cc9e14a6c24a21a713f3c7fbde18b4b"}, {"url": "https://github.com/py-pdf/pypdf/releases/tag/6.21.2", "name": "https://github.com/py-pdf/pypdf/releases/tag/6.21.2"}], "scope_influence": "", "tags": ["python", "开源"], "title": "pypdf 拒绝服务漏洞", "_translated": true, "_saved_at": "2026-10-24T01:19:24+00:00", "_first_saved_at": "2026-10-23T22:50:03+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-oraj-3sxh"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-115580", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-834", "description": "pypdf 是一个免费开源的纯 python PDF 库。在 6.21.2 之前，攻击者可以使用标准交叉引用表制作 PDF，其声明的条目数超过文件可以包含的数量，从而在打开文件时导致过多的处理和较长的运行时间。此问题已在版本 6.21.2 中修复。", "effects": [{"comp_name": "pypdf", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,6.21.2)", "min_fixed_version": "6.21.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "pypdf", "ecosystem": "pip", "versions": [{"affected_version": "(-∞,6.21.2)", "min_fixed_version": "6.21.2", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "过度迭代", "kind_en": "过度迭代", "last_modified_time": "2026-10-24", "level": "High", "mps_id": "MPS-rjd2-9ywx", "poc": false, "poc_url": [], "published_time": "2026-10-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-rjd2-9ywx", "name": "https://www.oscs1024.com/hd/MPS-rjd2-9ywx"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-115580", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-115580"}, {"url": "https://github.com/py-pdf/pypdf/security/advisories/GHSA-gmh7-3g9r-mjh5", "name": "https://github.com/py-pdf/pypdf/security/advisories/GHSA-gmh7-3g9r-mjh5"}, {"url": "https://github.com/py-pdf/pypdf/pull/4239", "name": "https://github.com/py-pdf/pypdf/pull/4239"}, {"url": "https://github.com/py-pdf/pypdf/commit/a3061e34b169d34478d520f5f049c53cfb1482b2", "name": "https://github.com/py-pdf/pypdf/commit/a3061e34b169d34478d520f5f049c53 ，激活脚本 src/virtualenv/activation/bash/activate.sh 的提示符分支在激活时刻 promptvars 关闭且未启用 POSIX 模式时，把未经 $ 与反引号转义的提示值直接拼入 PS1。promptvars 与 POSIX 模式属于运行期 shell 状态，嵌入命令替换的提示值（如 x$(id)y）在激活后可通过 shopt -s promptvars、set -o posix 或启动继承导出 PS1 的交互式子 bash 进入提示符展开并被执行，攻击者以激活环境的用户身份获得命令执行；该值还持久化在 pyvenv.cfg 与生成的脚本中，可在后续会话首次提示符重绘时再次触发。\n修复版本中通过重写 bash 分支的 PS1 构造逻辑解决该问题：逐字符遍历提示值并对反斜杠、美元符与反引号统一添加反斜杠转义，不再依赖激活时刻的 shell 选项状态，使提示值在任意 promptvars 与 POSIX 模式组合下均保持字面量；zsh 分支改为将提示值存入 psvar[9] 并以 %9v 引用插入提示符，使该值始终作为数据处理，从而切断命令替换进入提示符展开的执行路径。", "effects": [{"comp_name": "virtualenv", "ecosystem": "pip", "versions": [{"affected_version": "[21.14.9,21.14.13)", "min_fixed_version": "21.14.13", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-10-24", "level": "High", "mps_id": "MPS-tyzg-v4h6", "poc": false, "poc_url": [], "published_time": "2026-10-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-tyzg-v4h6", "name": "https://www.oscs1024.com/hd/MPS-tyzg-v4h6"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-115586", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-115586"}, {"url": "https://github.com/pypa/virtualenv/security/advisories/GHSA-cx6f-vjhg-g3cc", "name": "https://github.com/pypa/virtualenv/security/advisories/GHSA-cx6f-vjhg-g3cc"}, {"url": "https://github.com/pypa/virtualenv/pull/3466", "name": "https://github.com/pypa/virtualenv/pull/3466"}, {"url": "https://github.com/pypa/virtualenv/commit/3598e201f6f044e389136b2347a8a919ac03c5f4", "name": "https://github.com/pypa/virtualenv/commit/3598e201f6f044e389136b2347a8a919ac03c5f4"}, {"url": "https://github.com/pypa/virtualenv/releases/tag/21.14.13", "name": "https://github.com/pypa/virtualenv/releases/tag/21.14.13"}], "scope_influence": "", "tags": ["python", "开源", "终端软件"], "title": "virtualenv命令执行漏洞", "_translated": true, "_saved_at": "2026-10-24T01:19:25+00:00", "_first_saved_at": "2026-10-23T22:50:05+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-tyzg-v4h6"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-112207", "cvss": {}, "cvss_score": 7.1, "cvss_vector": "", "cwe": "CWE-79", "description": "Download Monitor 是 WordPress 官方插件目录中的开源下载管理插件，用于管理和分发文件下载、统计下载次数，默认在前端通过 dlm-xhr.js 以 XMLHttpRequest 异步处理下载链接点击。\n受影响版本中，dlm-xhr.js 的点击处理逻辑使用 url.indexOf(dlmXHRGlobalLinks) 子串匹配判断链接是否属于站点下载端点，攻击者可构造包含端点字符串的跨站链接绕过该校验；用户在站点页面点击该链接后，脚本向攻击者服务器发起 XMLHttpRequest 请求，并在响应状态码为 404 或 403 时将响应 statusText 通过 innerHTML 写入页面，该状态短语完全由攻击者服务器控制，可携带任意 HTML 与 JavaScript，未认证攻击者诱导用户点击构造链接后能在受害者浏览器中以站点源执行任意代码。\n修复版本中通过新增 isDownloadLink 函数，使用 URL 解析校验链接协议为 http/https、主机与下载端点一致并匹配端点路径或查询参数，替代原子串匹配，使跨站链接不再进入 XHR 下载流程；同时将 404/403 响应的 statusText 渲染方式由 innerHTML 改为 textContent，并移除将 statusText 用作 401 跳转目标的逻辑，切断注入路径。", "effects": [{"comp_name": "download-monitor", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,5.3.4)", "min_fixed_version": "5.3.4", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-10-24", "level": "High", "mps_id": "MPS-uyem-ph8o", "poc": false, "poc_url": [], "published_time": "2026-10-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-uyem-ph8o", "name": "https://www.oscs1024.com/hd/MPS-uyem-ph8o"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-112207", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-112207"}, {"url": "https://wpscan.com/vulnerability/03d5e83b-3119-4862-b1be-8c6fe53f9963/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Download Monitor 反射型XSS漏洞", "_translated": true, "_saved_at": "2026-10-24T06:46:51+00:00", "_first_saved_at": "2026-10-24T06:46:51+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-uyem-ph8o"}]}</script>
  <script>
    const payload = JSON.parse(document.getElementById("payload").textContent);
    const levelLabels = payload.level_labels || {};
    const items = payload.items || [];
    let filtered = items.slice();
    let activeId = null;

    const $ = (id) => document.getElementById(id);
    $("generatedAt").textContent = payload.generated_at || "-";
    $("retention").textContent = payload.retention_days ?? "-";
    $("cutoff").textContent = payload.cutoff_date || "-";
    $("count").textContent = String(payload.count ?? items.length);

    function levelClass(level) {
      const cn = levelLabels[level] || level || "";
      if (level === "Critical" || cn === "严重") return "crit";
      if (level === "High" || cn === "高危") return "high";
      return "other";
    }
    function levelText(level) {
      return levelLabels[level] || level || "-";
    }
    function esc(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }
    function scoreText(v) {
      if (v === null || v === undefined || v === "" || v === -1) return "-";
      return String(v);
    }

    function renderList() {
      const list = $("list");
      $("listCount").textContent = String(filtered.length);
      if (!filtered.length) {
        list.innerHTML = '<div class="empty">没有匹配项</div>';
        return;
      }
      list.innerHTML = filtered.map((it) => {
        const id = it.mps_id || it.cve_id;
        const active = id === activeId ? " active" : "";
        return `
          <button class="item${active}" data-id="${esc(id)}" type="button">
            <div class="item-top">
              <span class="cve">${esc(it.cve_id || it.mps_id || "-")}</span>
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
            </div>
            <div class="title">${esc(it.title || "-")}</div>
            <div class="item-foot">
              <span>CVSS ${esc(scoreText(it.cvss_score))}</span>
              <span>${esc(it.published_time || "-")}</span>
              ${it.poc ? "<span>POC</span>" : ""}
            </div>
          </button>`;
      }).join("");
      list.querySelectorAll(".item").forEach((btn) => {
        btn.addEventListener("click", () => selectById(btn.dataset.id));
      });
    }

    function refsHtml(it) {
      const refs = Array.isArray(it.reference_url_list) ? it.reference_url_list : [];
      const links = [];
      if (it._source_page) links.push({ url: it._source_page, name: "OSCS 详情" });
      if (it.cve_id) links.push({ url: `https://nvd.nist.gov/vuln/detail/${it.cve_id}`, name: "NVD" });
      refs.forEach((r) => {
        if (r && r.url) links.push({ url: r.url, name: r.name || r.url });
      });
      const seen = new Set();
      const uniq = [];
      for (const l of links) {
        if (seen.has(l.url)) continue;
        seen.add(l.url);
        uniq.push(l);
      }
      if (!uniq.length) return '<div class="box">无参考链接</div>';
      return `<div class="refs">${uniq.map((l) =>
        `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name || l.url)}</a>`
      ).join("")}</div>`;
    }

    function articlesHtml(it) {
      const arts = Array.isArray(it.articles) ? it.articles : [];
      if (!arts.length) return "";
      return `<div class="section"><h3>相关说明</h3>${arts.map((a) => `
        <div class="article">
          <h4>${esc(a.title || "说明")}</h4>
          <p>${esc(a.content || "")}</p>
        </div>`).join("")}</div>`;
    }

    function renderDetail(it) {
      const detail = $("detail");
      if (!it) {
        detail.innerHTML = '<div class="empty">暂无数据</div>';
        return;
      }
      const pocUrls = Array.isArray(it.poc_url) ? it.poc_url : [];
      detail.innerHTML = `
        <div class="d-head">
          <div>
            <h1 class="d-title">${esc(it.title || "-")}</h1>
            <div class="ids">
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
              <span class="chip">${esc(it.cve_id || "无 CVE")}</span>
              <span class="chip">${esc(it.mps_id || "-")}</span>
              ${it.poc ? '<span class="chip">有 POC</span>' : ""}
              ${it.exp ? '<span class="chip">有 EXP</span>' : ""}
            </div>
          </div>
          <div class="actions">
            ${it._source_page ? `<a class="btn" href="${esc(it._source_page)}" target="_blank" rel="noopener">OSCS</a>` : ""}
            ${it.cve_id ? `<a class="btn" href="https://nvd.nist.gov/vuln/detail/${esc(it.cve_id)}" target="_blank" rel="noopener">NVD</a>` : ""}
          </div>
        </div>
        <div class="grid">
          <div class="stat"><div class="k">CVSS</div><div class="v">${esc(scoreText(it.cvss_score))}</div></div>
          <div class="stat"><div class="k">向量</div><div class="v">${esc(it.cvss_vector || "-")}</div></div>
          <div class="stat"><div class="k">CWE</div><div class="v">${esc(it.cwe || "-")}</div></div>
          <div class="stat"><div class="k">类型</div><div class="v">${esc(it.kind || it.kind_en || "-")}</div></div>
          <div class="stat"><div class="k">公开</div><div class="v">${esc(it.published_time || "-")}</div></div>
          <div class="stat"><div class="k">利用成本</div><div class="v">${esc(it.exploit_requirement_cost || "-")}</div></div>
          <div class="stat"><div class="k">可利用性</div><div class="v">${esc(it.exploitability || "-")}</div></div>
          <div class="stat"><div class="k">修复建议</div><div class="v">${esc(it.fix_suggestion || "-")}</div></div>
        </div>
        <div class="section"><h3>描述</h3><div class="box">${esc(it.description || "无描述")}</div></div>
        ${it.scope_influence ? `<div class="section"><h3>影响范围</h3><div class="box">${esc(it.scope_influence)}</div></div>` : ""}
        ${pocUrls.length ? `<div class="section"><h3>POC 链接</h3><div class="refs">${pocUrls.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join("")}</div></div>` : ""}
        <div class="section"><h3>参考链接</h3>${refsHtml(it)}</div>
        ${articlesHtml(it)}
      `;
    }

    function selectById(id) {
      const it = filtered.find((x) => (x.mps_id || x.cve_id) === id) ||
                 items.find((x) => (x.mps_id || x.cve_id) === id);
      if (!it) return;
      activeId = it.mps_id || it.cve_id;
      renderList();
      renderDetail(it);
      const btn = document.querySelector(`.item[data-id="${CSS.escape(activeId)}"]`);
      if (btn) btn.scrollIntoView({ block: "nearest" });
      history.replaceState(null, "", "#" + encodeURIComponent(activeId));
    }

    function applyFilter(q) {
      const query = (q || "").trim().toLowerCase();
      filtered = !query ? items.slice() : items.filter((it) => {
        const blob = [
          it.cve_id, it.mps_id, it.title, it.kind, it.kind_en, it.cwe, it.description, it.level
        ].map((x) => String(x || "").toLowerCase()).join(" ");
        return blob.includes(query);
      });
      renderList();
      if (filtered.length) {
        const still = filtered.some((x) => (x.mps_id || x.cve_id) === activeId);
        selectById(still ? activeId : (filtered[0].mps_id || filtered[0].cve_id));
      } else {
        activeId = null;
        renderDetail(null);
      }
    }

    $("search").addEventListener("input", (e) => applyFilter(e.target.value));

    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement !== $("search")) {
        e.preventDefault();
        $("search").focus();
        return;
      }
      if (!filtered.length) return;
      const idx = filtered.findIndex((x) => (x.mps_id || x.cve_id) === activeId);
      if (e.key === "ArrowDown") {
        e.preventDefault();
        const next = filtered[Math.min(filtered.length - 1, Math.max(0, idx) + 1)];
        selectById(next.mps_id || next.cve_id);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        const prev = filtered[Math.max(0, idx - 1)];
        selectById(prev.mps_id || prev.cve_id);
      }
    });

    const hashId = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    if (hashId && items.some((x) => (x.mps_id || x.cve_id) === hashId)) {
      activeId = hashId;
      renderList();
      selectById(hashId);
    } else if (items.length) {
      selectById(items[0].mps_id || items[0].cve_id);
    } else {
      renderList();
      renderDetail(null);
    }
  </script>
</body>
