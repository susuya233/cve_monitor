\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-82119", "cvss": {"cvssv31": [{"source": "hirt@hitachi.co.jp", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-78", "description": "HiRDB 是 Hitachi 开发的商业关系数据库管理系统，为闭源软件，面向企业关键业务场景提供高可用数据库服务，支持 AIX、HP-UX、Solaris、Linux 和 Windows 平台。\n受影响版本中，HiRDB 存在操作系统命令注入漏洞（CWE-78），攻击者可以将恶意内容注入 HiRDB 处理过程中调用的操作系统命令，远程利用无需任何权限与用户交互，成功利用可在数据库服务器上执行任意操作系统命令，导致机密信息泄露、数据被篡改或服务中断。厂商公告未披露受影响的具体功能模块与攻击入口。\n修复版本中通过官方安全更新消除该操作系统命令注入风险，HiRDB Server Version 10 需升级至 10-12-01、10-11-02 或 10-08-05 及之后修订版本，HiRDB Server Version 9、Version 9(32) 及对应附加功能版本需联系 Hitachi 支持服务代表获取相应修复版本。", "effects": [{"comp_name": "HiRDB Server Version 10", "ecosystem": "linux", "versions": [{"affected_version": "[10-00,10-12-01)", "min_fixed_version": "10-12-01", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "HiRDB Server Version 9", "ecosystem": "linux", "versions": [{"affected_version": "[09-00,09-66-22]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "HiRDB Server Version 9(32)", "ecosystem": "linux", "versions": [{"affected_version": "[09-02,09-66-22]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "HiRDB Server with Additional Function Version 9", "ecosystem": "linux", "versions": [{"affected_version": "[  9", "ecosystem": "linux", "versions": [{"affected_version": "[09-00,09-66/V]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "HiRDB Server with Additional Function Version 9(32)", "ecosystem": "linux", "versions": [{"affected_version": "[09-00,09-66-/V]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "栈缓冲区溢出", "kind_en": "基于堆栈的缓冲区溢出", "last_modified_time": "2026-10-27", "level": "Critical", "mps_id": "MPS-wdp3-4neu", "poc": false, "poc_url": [], "published_time": "2026-10-27", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-wdp3-4neu", "name": "https://www.oscs1024.com/hd/MPS-wdp3-4neu"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-82122", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-82122"}, {"url": "https://www.hitachi.com/products/it/software/security/info/vuls/hitachi-sec-2026-144/index.html", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "HiRDB 栈缓冲区溢出漏洞", "_translated": true, "_saved_at": "2026-10-27T11:25:06+00:00", "_first_saved_at": "2026-10-27T11:25:06+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-wdp3-4neu"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-86577", "cvss": {"cvssv31": [{"source": "hirt@hitachi.co.jp", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:L", "severity": "critical", "base_score": 9.4}]}, "cvss_score": 9.4, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:L", "cwe": "CWE-787", "description": "日立 JP1/Base 是闭源商业基础组件，为 JP1 集成管理与作业管理产品提供共用能力。JP1/Integrated Management 3 - Manager 以及 JP1/Automatic Job Management System 3 的 Manager、Agent 和 Agent Minimal Edition 因内置 JP1/Base 受到同一问题影响。\n受影响版本中，JP1/Base 存在越界写入缺陷。CNA 评定该问题可通过网络在无需权限、无需用户交互且攻击复杂度低的条件下触发，机密性与完整性影响为高，可用性影响为低。公开材料未披露写入点所在函数、长度检查或具体输入字段。\n修复版本中通过发布已修复的 JP1/Base 组件更新消除该越界写入。JP1/Integrated Management 3 - Manager、JP1/Automatic Job Management System 3 - Manager、Windows 与 Linux 上的 Agent 及 Agent Minimal Edition 的修复版本为 13-50-31，AIX 上的 Agent 修复版本为 13-10-31，JP1/Base 的修复版本为 12-50-54 与 11-50-36。", "effects": [{"comp_name": "JP1/Automatic Job Management System 3 - Agent", "ecosystem": "linux", "versions": [{"affected_version": "[13-50,13-50-04]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[13-00,13-00-06]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[13-10,13-10-06]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "JP1/Automatic Job Management System 3 - Agent Minimal Edition", "ecosystem": "linux", "versions": [{"affected_version": "[13-50,13-50-02]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[13-10,13-10-06]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[13-00,13-00-06]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "JP1/Automatic Job M 全编码实践：开发人员应该采用安全编码实践，包括避免使用eval函数、避免拼接用户输入的字符串作为代码执行等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止代码注入攻击。", "title": "如何预防代码注入"}], "cnvd_id": "", "cve_id": "CVE-2026-104383", "cvss": {"cvssv4": [{"source": "mandiant-cve@google.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.4}]}, "cvss_score": 9.4, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-94", "description": "EagleCloud Aquila 版本至 2.6.7.2 本地平台上的 Pigeon MFA 服务中对代码生成的不当控制允许经过身份验证的远程攻击者通过代码注入执行任意代码", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "代码注入", "kind_en": "代码生成控制不当（“代码注入”）", "last_modified_time": "2026-10-28", "level": "Critical", "mps_id": "MPS-vrwd-9k3o", "poc": false, "poc_url": [], "published_time": "2026-10-28", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-vrwd-9k3o", "name": "https://www.oscs1024.com/hd/MPS-vrwd-9k3o"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-104383", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-104383"}, {"url": "https://github.com/mandiant/Vulnerability-Disclosures/blob/master/2026/MNDT-2026-0039.md", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-104383 漏洞", "_translated": true, "_saved_at": "2026-10-28T06:31:35+00:00", "_first_saved_at": "2026-10-28T06:31:35+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-vrwd-9k3o"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-93857", "cvss": {"cvssv4": [{"source": "5d1c2695-1a31-4499-88ae-e847036fd7e3", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.2}]}, "cvss_score": 9.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-787", "description": "WatchGuard Fireware OS 是 WatchGuard Firebox 防火墙与统一威胁管理设备使用的闭源操作系统，SIP proxy 用于按防火墙策略处理 SIP 会话流量。\n受影响版本中，SIP proxy 在处理经由已启用 SIP proxy 的策略传入的远程请求时存在栈缓冲区溢出。远程且未认证的攻击者可借此在设备上执行任意代码。厂商将该问题归类为 CWE-120、CWE-121 与 CWE-787，并说明只有 Firebox 上配置了 SIP proxy 时才具备暴露条件。公开资料未披露具体源码路径或函数。\n修复版本中通过发布 Default 平台的 Fireware OS 2026.4 与 12.12.4，以及 T15/T35 平台的 12.5.22，结束对应受影响区间。厂商未公开补丁差异与修复 commit，无法确认 SIP proxy 内部改动。", "effects": [{"comp_name": "fireware", "ecosystem": "linux", "versions": [{"affected_version": "[12.0,12.12.4)", "min_fixed_version": "12.12.4", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[2025.1,2026.4)", "min_fixed_version": "2026.4", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[12.0,12.5.22)", "min_fixed_version": "12.5.22", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exp u-6h4g"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-93865", "cvss": {"cvssv4": [{"source": "5d1c2695-1a31-4499-88ae-e847036fd7e3", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.2}]}, "cvss_score": 9.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-862", "description": "WatchGuard Fireware OS 是 WatchGuard Firebox 系列防火墙设备运行的商业操作系统，FireCluster 为其提供的集群高可用功能，同步守护进程负责集群成员之间的状态同步。\n受影响版本中，FireCluster 同步守护进程对关键管理动作缺少身份认证与授权校验，远程攻击者无需任何凭据，在目标设备已配置为 FireCluster 集群成员的情况下，可向 FireCluster 管理 IP 发送构造的请求，触发特权系统级管理动作，官方将其同时标记为命令注入（CWE-77）与授权缺失（CWE-862）风险。\n修复版本中通过官方安全更新消除 FireCluster 同步守护进程的认证缺失问题，未认证请求无法再触发特权系统级管理动作；厂商未公开更细粒度的源码修改。", "effects": [{"comp_name": "fireware", "ecosystem": "linux", "versions": [{"affected_version": "[2025.1,2026.4)", "min_fixed_version" n": "建议修复", "kind": "缺省权限不正确", "kind_en": "Incorrect Default Permissions", "last_modified_time": "2026-10-26", "level": "High", "mps_id": "MPS-14b2-3fae", "poc": false, "poc_url": [], "published_time": "2026-10-26", "reference_url_list": [{"url": "https://cybersecuritynews.com/microsoft-security-updates-for-brotli-and-net-tarballs-vulnerability/", "name": ""}, {"url": "https://github.com/dotnet/aspnetcore/security/advisories/GHSA-r6pf-x897-gm86", "name": ""}, {"url": "https://github.com/dotnet/announcements/issues/495", "name": ""}, {"url": "https://github.com/dotnet/announcements/issues/496", "name": ""}, {"url": "https://devblogs.microsoft.com/dotnet/dotnet-october-2026-oob-security-updates/", "name": ""}, {"url": "https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-114148", "name": ""}, {"url": "https://github.com/dotnet/aspnetcore/discussions/70040", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-114148", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": ".NET归档所有权提权", "_translated": true, "_saved_at": "2026-10-26T14:46:10+00:00", "_first_saved_at": "2026-10-26T14:46:10+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-14b2-3fae"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "attack_vector_type": "Local", "cnvd_id": "", "cve_id": "CVE-2026-84633", "cvss": {}, "cvss_score": 8.4, "cvss_vector": "", "cwe": "CWE-22", "description": "Apple Neural Engine 是 macOS 内置的闭源神经网络推理组件，部署在 Apple 芯片设备上，用于在本机执行机器学习计算。\n受影响版本中，该组件的路径校验不足，本地应用传入的路径可穿越到沙箱允许范围之外，从而导致应用突破沙箱限制。公开公告未给出具体文件、函数或参数。\n修复版本中通过改进路径校验阻止越界路径继续被接受，应用无法再借助路径穿越突破沙箱。修复包含在 macOS Golden Gate 27 中。", "effects": [{"comp_name": "macos", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,27)", "min_fixed_version": "27", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-10-27", "level": "High", "mps_id": "MPS-elhi-tv1y", "poc": false, "poc_url": [], "published_time": "2026-10-27", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-elhi-tv1y", "name": "https://www.oscs1024.com/hd/MPS-elhi-tv1y"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-84633", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-84633"}, {"url": "https://support.apple.com/en-us/149035", "name": ""}], "scope_influence": "", "tags": ["AI", "操作系统"], "title": "macOS神经引擎沙箱逃逸", "_translated": true, "_saved_at": "2026-10-27T05:52:18+00:00", "_first_saved_at": "2026-10-27T05:52:18+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-elhi-tv1y"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-85299", "cvss": {"cvssv4": [{"source": "f45cbf4e-4146-4068-b7e1-655ffc2c548c", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:H/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:Clear", "severity": "high", "base_score": 8.3}]}, "cvss_score": 8.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:H/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:Clear", "cwe": "CWE-862", "description": "Google Compute Engine 是 Google Cloud 的托管计算服务，用于创建和管理虚拟机、持久磁盘与磁盘快照，控制面不公开源码。\n受影响版本中，disks.createSnapshot 与 regionDisks.createSnapshot 存在缺失授权。已认证但缺少目标磁盘相应 IAM 权限的调用方，可通过这两个接口跨项目导出磁盘数据。\n修复版本中通过 Google 于 2026-08-31 实施的平台侧补丁消除上述接口的授权缺失，缺少相应 IAM 权限的调用方无法再跨项目导出磁盘数据。Compute Engine 为托管服务，公告说明客户无需自行操作。", "effects": [{"comp_name": "compute_engine", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2026-08-31)", "min_fixed_version": "2026-08-31", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-10-27", "level": "High", "mps_id": "MPS-ba8i-slhg", "poc": false, "poc_url": [], "published_time": "2026-10-27", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ba8i-slhg", "name": "https://www.oscs1024.com/hd/MPS-ba8i-slhg"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-85299", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-85299"}, {"url": "https://docs.cloud.google.com/compute/docs/security-bulletins#gcp-2026-073", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "GCE快照授权缺失", "_translated": true, "_saved_at": "2026-10-27T11:25:13+00:00", "_first_saved_at": "2026-10-27T11:25:13+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ba8i-slhg"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-72753", "cvss": {"cvssv31": [{"source": "sep@nlnetlabs.nl", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:L/A:H", "severity": "high", "base_score": 8.2}]}, "cvss_score": 8.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:L/A:H", "cwe": "CWE-755", "description": "Routinator 是 NLnet Labs 发布的开源 RPKI 依赖方软件，使用 Rust 编写，通过 RRDP 拉取存储库对象并生成路由源验证数据。\n受影响版本中，Notification::from_response 解析 RRDP notification 后只调用 NotificationFile::sort_deltas 按 serial 排序，不拒绝 serial 不连续的 delta 列表。RepositoryUpdate::calc_deltas 只要求最后一条 delta 的 serial 等于 notification serial，再从本地下一序号起整段应用后续 delta，空洞对应的发布内容不会写入本地仓库，但仓库 serial 仍会推进到 notification 的 serial。delta 条目过多时，解析并保留这些条目可能耗尽内存。\n修复版本中通过把 Notification::from_response 的 sort_deltas 替换为 sort_and_verify_deltas(Some(delta_list_limit))，并将依赖 rpki 升级到 0.20.0。sort_and_verify_deltas 按 serial 升序排列，超过上限时只保留最新条目，并核对相邻 serial 是否连续；NotificationFile::_parse 在 delta 数量达到 delta_limit 时标记 DeltaListError::Oversized，delta_update 据此回退到 snapshot，不再把超限 delta 列表留在增量更新路径中。", "effects": [{"comp_name": "routinator", "ecosystem": "cargo", "versions": [{"affected_version": "(-∞,0.15.3)", "min_fixed_version": "0.15.3", "repository": "cargo", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "对异常条件的处理不恰当", "kind_en": "Improper Handling of Exceptional Conditions", "last_modified_time": "2026-10-27", "level": "High", "mps_id": "MPS-x3rf-8jbn", "poc": false, "poc_url": [], "published_time": "2026-10-27", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-x3rf-8jbn", "name": "https://www.oscs1024.com/hd/MPS-x3rf-8jbn"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-72753", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-72753"}, {"url": "https://www.nlnetlabs.nl/downloads/routinator/CVE-2026-72753.txt", "name": ""}], "scope_influence": "", "tags": [], "title": "Routinator增量漏洞", "_translated": true, "_saved_at": "2026-10-26T20:15:57+00:00", "_first_saved_at": "2026-10-26T20:15:57+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-x3rf-8jbn"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "attack_vector_type": "Local", "cnvd_id": "", "cve_id": "CVE-2026-84599", "cvss": {}, "cvss_score": 7.8, "cvss_vector": "", "cwe": "CWE-787", "description": "Apple iOS/iPadOS、macOS、tvOS、visionOS 与 watchOS 是苹果公司闭源操作系统，分别运行于 iPhone、iPad、Mac、Apple TV、Apple Vision Pro 与 Apple Watch 设备，内核负责内存管理、进程调度与硬件层隔离。\n受影响版本中，操作系统内核在内存处理流程中存在缺陷，设备本地运行的应用可触发内核内存破坏，导致意外系统终止或内核内存损坏，官方公告未披露受影响的具体函数与代码路径。\n修复版本中通过改进内核内存处理消除了该缺陷，涉及版本包括 iOS 26.7.2 与 iPadOS 26.7.2、iOS 27 与 iPadOS 27、macOS Golden Gate 27、macOS Sequoia 15.8、macOS Tahoe 26.7、tvOS 27、visionOS 27 与 watchOS 27。", "effects": [{"comp_name": "iphone_os", "ecosystem": "linux", "v 49043", "name": ""}, {"url": "https://support.apple.com/en-us/149227", "name": ""}], "scope_influence": "", "tags": ["操作系统"], "title": "Apple内核内存破坏漏洞", "_translated": true, "_saved_at": "2026-10-27T05:52:21+00:00", "_first_saved_at": "2026-10-27T05:52:21+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-cs48-dlb2"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "attack_vector_type": "Local", "cnvd_id": "", "cve_id": "CVE-2026-86916", "cvss": {"cvssv31": [{"source": "134c704f-9b21-4f2e-91b3-4a467353bcc0", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-416", "description": "Apple iOS、iPadOS 与 macOS 是闭源操作系统，内核负责进程隔离、权限控制与内存管理。\n受影响版本中，内核存在释放后使用缺陷。在默认安装的系统上，本地应用可能触发该缺陷并以内核权限执行任意代码。Apple 将问题描述为内存管理缺陷，未披露具体源码位置。\n修复版本中通过改进内存管理消除该释放后使用条件，本地应用不再能借助该缺陷获得内核权限代码执行能力。", "effects": [{"comp_name": "ipados", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,26.7)", "min_fixed_version": "26.7", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "iphone_os", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,26.7)", "min_fixed_version": "26.7", "repository": "unmanaged", "solutions": [], "ups  索引（s）与 done 索引（l）构造 Sequence 对象，未校验二者为元素列表范围内的整数，攻击者在反序列化载荷中将 done 索引改为超大数值后，由该对象生成的迭代器仅在遍历索引超过 done 索引时终止，应用代码完整消费该迭代器时循环永不结束，事件循环被阻塞、进程内存被耗尽，导致服务不可用。\n修复版本中通过新增 isSequenceIndex 校验，要求 throw 与 done 索引必须为从 -1 到元素列表末尾索引之间的整数，非法取值抛出 SerovalMalformedNodeError 拒绝反序列化，切断了恶意索引进入迭代器终止条件的路径。", "effects": [{"comp_name": "seroval", "ecosystem": "npm", "versions": [{"affected_version": "(-∞,1.6.8)", "min_fixed_version": "1.6.8", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "输入中指定数量的验证不当", "kind_en": "输入中指定数量的验证不正确", "last_modified_time": "2026-10-27", "level": "High", "mps_id": "MPS-13ao-5mxd", "poc": false, "poc_url": [], "published_time": "2026-10-27", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-13ao-5mxd", "name": "https://www.oscs1024.com/hd/MPS-13ao-5mxd"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-116581", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-116581"}, {"url": "https://github.com/lxsmnsyc/seroval/security/advisories/GHSA-97r2-qh9m-474h", "name": "https://github.com/lxsmnsyc/seroval/security/advisories/GHSA-97r2-qh9m-474h"}, {"url": "https://github.com/lxsmnsyc/seroval/commit/e176f9267e59ddd6c9de89cc9fe85c5b37a5b728", "name": "https://github.com/lxsmnsyc/seroval/commit/e176f9267e59ddd6c9de89cc9fe85c5b37a5b728"}, {"url": "https://github.com/lxsmnsyc/seroval/releases/tag/seroval@1.6.8", "name": "https://github.com/lxsmnsyc/seroval/releases/tag/seroval@1.6.8"}], "scope_influence": "", "tags": ["npm", "开源"], "title": "seroval 反序列化无限循环拒绝服务漏洞", "_translated": true, "_saved_at": "2026-10-27T00:10:18+00:00", "_first_saved_at": "2026-10-27T00:10:18+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-13ao-5mxd"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-82121", "cvss": {"cvssv31": [{"source": "hirt@hitachi.co.jp", "vector": "CVSS:3.1/AV:N/AC:L/PR: .20.0 后不再进入无界迭代，内存耗尽路径被切断。", "effects": [{"comp_name": "routinator", "ecosystem": "cargo", "versions": [{"affected_version": "(-∞,0.15.3)", "min_fixed_version": "0.15.3", "repository": "cargo", "solutions": [], "upstream": true}]}, {"comp_name": "rpki", "ecosystem": "cargo", "versions": [{"affected_version": "(-∞,0.20.0)", "min_fixed_version": "0.20.0", "repository": "cargo", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "对异常条件的处理不恰当", "kind_en": "Improper Handling of Exceptional Conditions", "last_modified_time": "2026-10-27", "level": "High", "mps_id": "MPS-psky-ntev", "poc": false, "poc_url": [], "published_time": "2026-10-27", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-psky-ntev", "name": "https://www.oscs1024.com/hd/MPS-psky-ntev"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-72758", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-72758"}, {"url": "https://www.nlnetlabs.nl/downloads/routinator/CVE-2026-72756.txt", "name": ""}], "scope_influence": "", "tags": [], "title": "Routinator畸形AS范围内存耗尽", "_translated": true, "_saved_at": "2026-10-26T20:15:54+00:00", "_first_saved_at": "2026-10-26T20:15:54+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-psky-ntev"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-72756", "cvss": {"cvssv31": [{"source": "sep@nlnetlabs.nl", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-755", "description": "Routinator 是 NLnet Labs 发布的开源 RPKI 依赖方软件，用于收集并验证路由源授权数据，默认通过 RRDP 同步发布点对象。\n受影响版本中，经 RRDP 取得的文件若带有无法落盘的 rsync URI，例如文件名过长，或目录名与已有文件名重叠，StoredPoint::create 会按清单 URI 拼接本地存储路径，并调用 fatal::create_dir_all 与 File::create。这些调用失败时返回 Failed，随后转换为致命 RunFailed，服务器模式和一次性验证都会退出进程，路由源验证随之中断。\n修复版本中通过将 Already ins 之前无条件执行 cache_serials，把序列号解码一次后放入 HashSet，切断反复解码造成的资源耗尽。同步升级的 rpki 0.20.0 在 SignedMessageCrl::take_from 中调用 set_mode(Mode::Der)，不再接受会在后续处理中触发异常的 BER CRL。", "effects": [{"comp_name": "routinator", "ecosystem": "cargo", "versions": [{"affected_version": "(-∞,0.15.3)", "min_fixed_version": "0.15.3", "repository": "cargo", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "对异常条件的处理不恰当", "kind_en": "Improper Handling of Exceptional Conditions", "last_modified_time": "2026-10-27", "level": "High", "mps_id": "MPS-yuki-c1ax", "poc": false, "poc_url": [], "published_time": "2026-10-27", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-yuki-c1ax", "name": "https://www.oscs1024.com/hd/MPS-yuki-c1ax"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-72754", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-72754"}, {"url": "https://www.nlnetlabs.nl/downloads/routinator/CVE-2026-72754.txt", "name": ""}], "scope_influence": "", "tags": [], "title": "Routinator CRL拒绝服务", "_translated": true, "_saved_at": "2026-10-26T20:15:56+00:00", "_first_saved_at": "2026-10-26T20:15:56+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-yuki-c1ax"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过向受信任的数据序列化过程中添加恶意数据，从而在序列化和反序列化过程中执行恶意代码的攻击漏洞。这种漏洞通常存在于使用序列化 (serialization) 机制存储和传输数据的程序中。\n", "title": "什么是反序列化"}, {"content": "- 注入攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码注入到程序中，从而实现代码执行的目的。\n- 反射攻击：攻击者使用反射机制，在序列化过程中动态生成恶意数据，并将恶意代码注入到程序中，从而实现代码执行的目的。\n- 缓冲区溢出攻击：攻击者通过在序列化过程中向缓冲区输入恶意数据，导致缓冲区溢出，从而破坏程序的内存管理，实现代码执行的目的。\n- 格式字符串攻击：攻击者通过在序列化过程中输入恶意数据，导致程序使用错误的格式字符串，从而实现代码执行的目的。\n- 数据流攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码作为一个数据流传递给程序，从而实现代码执行的目的。\n", "title": "反序列化常见的攻击方式"}, {"content": "- 不信任输入数据：程序应该严格检查输入数据的有效性，并避免使用不受信任的数据。\n- 使用安全的序列化机制：程序应该使用安全的序列化机制，如 JSON 或 XML 序列化，而不是第三方序列化库。\n- 最小特权原则：程序应该限制对受信任数据的处理权限，并避免在运行时修改数据。\n- 代码审查和漏洞扫描：程序应该进行代码审查和漏洞扫描，以发现和修复潜在的安全漏洞。\n", "title": "如何预防反序列化"}], "cnvd_id": "", "cve_id": "CVE-2026-116580", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:L/A:L", "severity": "high", "base_score": 7.3}]}, "cvss_score": 7.3, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:L/A:L", "cwe": "CWE-502", "description": "Seroval 促进 JavaScript 值字符串化，包括超出 JSON.stringify 功能的复杂结构。在 1.6.8 之前，fromJSON 通过调用 source.on(listener) 来重建 AsyncIteratorFactoryInstance，而不要求 source 是真正的内部流。通过不受信任的 Seroval 输入和返回可调用值或公开 on 方法的对象的应用程序插件，精心设计的节点可以重用标识符，以便反序列化器调用插件生成的值。这是 CVE-2026-59940 的不完整修复变体。由此产生的机密性、完整性或可用性影响取决于应用程序插件公开的行为。此问题已在 1.6.8 版本中修复。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "反序列化", "kind_en": "不可信数据的反序列化", "last_modified_time": "2026-10-27", "level": "High", "mps_id": "MPS-vst2-f5k9", "poc": false, "poc_url": [], "published_time": "2026-10-27", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-vst2-f5k9", "name": "https://www.oscs1024.com/hd/MPS-vst2-f5k9"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-116580", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-116580"}, {"url": "https://github.com/lxsmnsyc/seroval/commit/3edc78b495ea0d6bd498143e5b3e56996607c5f2", "name": ""}, {"url": "https://github.com/lxsmnsyc/seroval/commit/50926b3ee198fb757e6ce3aa70efeed38d931c8d", "name": ""}, {"url": "https://github.com/lxsmnsyc/seroval/releases/tag/seroval@1.6.8", "name": ""}, {"url": "https://github.com/lxsmnsyc/seroval/security/advisories/GHSA-7rv5-mrxv-xcr9", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-116580漏洞", "_translated": true, "_saved_at": "2026-10-27T00:10:20+00:00", "_first_saved_at": "2026-10-27T00:10:20+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-vst2-f5k9"}, {"analysis_status": 0, "articles": [], "attack_vector_type": "Local", "cnvd_id": "", "cve_id": "CVE-2026-84 ", "_first_saved_at": "2026-10-27T17:14:38+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-1cnx-qghl"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "cnvd_id": "", "cve_id": "CVE-2026-118357", "cvss": {}, "cvss_score": 8.8, "cvss_vector": "", "cwe": "CWE-416", "description": "Google Chrome 是基于 Chromium 开源项目的网页浏览器，其 File System Access（文件系统访问）组件在浏览器进程中为渲染进程提供文件句柄、写入器与访问锁管理，FileSystemAccessManagerImpl 是该组件在浏览器进程内的主入口类。\n受影响版本中，FileSystemAccessManagerImpl 的成员声明顺序使 access_handle_host_receivers_ 与 writer_receivers_ 先于 file_receivers_ 与 directory_receivers_ 析构，析构过程中释放 LockHandle 会触发 Lock::LockHandleDestroyed() 同步提升等待中的锁请求，并对仍然存活的 FileSystemAccessFileHandleImpl 实例执行回调；在隐身模式下 DidTakeAccessHandleLock() 到 DoOpenIncognitoFile() 的调用同步完成并调用 CreateAccessHandleHost()，向已进入析构或底层缓冲已释放的 access_handle_host_receivers_ 插入元素，形成释放后重用。攻击者诱导用户访问构造的 HTML 页面并调用文件系统访问接口，可触发该缺陷并可能在浏览器沙箱内执行任意代码。\n修复版本中通过调整成员声明顺序使 writer_receivers_ 与 access_handle_host_receivers_ 最后析构，并在析构函数中先失效 weak_factory_ 弱指针、清空 file_receivers_ 与 directory_receivers_，再以先移出后擦除的方式销毁写入器与访问句柄宿主；TakeLock() 回调改由 weak_factory_.GetWeakPtr() 保护，管理器析构期间的锁提升传入 nullptr，RemoveFileWriter() 在销毁前先移出元素，切断同步锁提升回调访问已释放内存的路径。", "effects": [{"comp_name": "chrome", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,156.0.8078.73)", "min_f :H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-502", "description": "Rank Math SEO（插件目录名 seo-by-rank-math）是一款部署广泛的 WordPress 开源 SEO 插件，提供内容优化、结构化数据（Schema）与元数据管理等功能，默认在 /wp-json/rankmath/v1 命名空间注册 REST 接口。\n受影响版本中，rankmath/v1/updateMeta 接口允许 Contributor 及以上权限的已认证用户更新 rank_math_ 前缀的对象元数据，攻击者可将序列化的 PHP 对象字符串写入 Rank Math Schema 元数据；接口响应读取 Schema 时经 includes/modules/schema/class-db.php 的 DB::get_schemas() 对 meta_value 调用 maybe_unserialize() 反序列化不可信数据，update_schemas() 按 meta_id 更新 Schema 元数据前亦未校验该行归属，注入的 PHP 对象随之实例化，配合可用 POP 链可向 uploads 目录写入 webshell，最终实现远程代码执行。\n修复版本中通过在 maybe_delete_schema() 中移除对 get_metadata_by_mid() 所取元数据的 maybe_unserialize() 反序列化调用，在 update_schemas() 中先经 DB::get_schemas() 校验 schema-{meta_id} 归属后再执行 update_metadata_by_mid()，并统一强化 post/term 的逐对象编辑能力检查，切断不可信输入的反序列化路径。", "effects": [{"comp_name": "seo-by-rank-math", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.0.277)", "min_fixed_version": "1.0.277", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "反序列化", "kind_en": "不可信数据的反序列化", "last_modified_time": "2026-10-28", "level": "High", "mps_id": "MPS-fch4-vjku", "poc": false, "poc_url": [], "published_time": "2026-10-28", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-fch4-vjku", "name": "https://www.oscs1024.com/hd/MPS-fch4-vjku"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-1928", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-1928"}, {"url": "https://plugins.trac.wordpress.org/browser/seo-by-rank-math/tags/1.0.263/includes/modules/schema/class-db.php#L66", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/seo-by-rank-math/tags/1.0.263/includes/rest/class-sanitize.php#L110", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/seo-by ame": "https://nvd.nist.gov/vuln/detail/CVE-2026-104384"}, {"url": "https://github.com/mandiant/Vulnerability-Disclosures/blob/master/2026/MNDT-2026-0040.md", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-104384 漏洞", "_translated": true, "_saved_at": "2026-10-28T06:31:32+00:00", "_first_saved_at": "2026-10-28T06:31:32+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-t1ja-58zx"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-116688", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N", "severity": "high", "base_score": 8.1}]}, "cvss_score": 8.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N", "cwe": "CWE-79", "description": "CKEditor 5 是开源 JavaScript 富文本编辑器，采用 MVC 架构，其中 engine 包（@ckeditor/ckeditor5-engine）负责编辑器视图与数据的底层处理，广泛用于各类 Web 应用的内容编辑场景。\n受影响版本中，engine 包依赖的 es-toolkit 版本存在原型污染缺陷，47.x 分支使用 1.39.5，48.x 分支使用 1.45.1，其 compat 模块的 set 函数未拦截 constructor.prototype 等危险路径。编辑器解析外来 style 属性值时，StylesMap 通过 toPath 将样式属性名转换为对象路径，并由 appendStyleValue 调用 es-toolkit 的 set 与 merge 写入样式对象，攻击者构造包含该类路径的样式属性名可污染 Object.prototype，进而在浏览器中执行未授权 JavaScript 代码。\n修复版本中通过将 es-toolkit 依赖升级至 1.52.0 切断该链路，升级后的 compat/set 会拦截 constructor.prototype 路径，阻止样式属性名被写入对象原型，消除了通过 style 属性值触发原型污染并执行未授权脚本的风险；该修复包含在 47.7.4（LTS）与 48.5.1 版本中。", "effects": [{"comp_name": "@ckeditor/ckeditor5-engine", "ecosystem": "npm", "versions": [{"affected_version": "[48.0.0,48.5.1)", "min_fixed_version": "48.5.1", "repository": "npm", "solutions": [], "upstream": true}, {"affected_version": "[45.0.0,47.7.4)", "min_fixed_version": "47.7.4", "repository": "npm", "solutions": [], "upstream": true}]}, {"comp_name": "ckeditor5", "ecosystem": "npm", "versions": [{"affected_version": "[45.0.0,47.7.4)", "min_fixed_version": "47.7.4", "repository": "npm", "solutions": [], "upstream": true}, {"affected_version": "[48.0.0,48.5.1)", "min_fixed_version": "48.5.1", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-10-28", "level": "High", "mps_id": "MPS-0bq3-p9hv", "poc": false, "poc_url": [], "published_time": "2026-10-28", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-0bq3-p9hv", "name": "https://www.oscs1024.com/hd/MPS-0bq3-p9hv"}, {"url": "https://nvd.ni | ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-58205", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:N", "severity": "high", "base_score": 8.1}]}, "cvss_score": 8.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:N", "cwe": "CWE-79", "description": "GRR 是一个资源管理和预留应用程序。在版本 4.5.0 之前，当安装文件仍然可访问时，`maj.php` 反映了 `forcemaj` 参数，而没有足够的转义。这些文件的删除不是自动的。攻击者可以制作一个 URL，当受害者访问该 URL 时，该 URL 会在受害者的浏览器中执行任意 JavaScript。这种反映的跨站点脚本可以实现网络钓鱼、重定向到恶意站点、cookie 盗窃和会话劫持，因为身份验证 cookie 不是“HttpOnly”。此问题已在 4.5.0 版本中修复。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-10-28", "level": "High", "mps_id": "MPS-fpjs-cg6q", "poc": false, "poc_url": [], "published_time": "2026-10-28", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-fpjs-cg6q", "name": "https://www.oscs1024.com/hd/MPS-fpjs-cg6q"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-58205", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-58205"}, {"url": "https://github.com/JeromeDevome/GRR/commit/4ef77f91818215c1f8e0f06023d89257dfd61c68", "name": ""}, {"url": "https://github.com/JeromeDevome/GRR/security/advisories/GHSA-r6x2-w38j-vvq2", "name": ""}, {"url": "https://github.com/JeromeDevome/GRR/tree/v4.5.0", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-58205 漏洞", "_translated": true, "_saved_at": "2026-10-28T00:53:10+00:00", "_first_saved_at": "2026-10-28T00:53:10+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-fpjs-cg6q"}, {"analysis_status": 0, "articles": [{"content": "- 编写代码时没有正确处理输入数据或没有正确验证用户输入而导致的。", "title": "什么是关键资源权限分配不当"}, {"content": "- 弱密码或未使用的密码：当管理员或系统管理员在创建帐户时，没有使用强密码或未对帐户进行密码更新时，可能会发生这种情况。弱密码可能会被黑客破解或通过其他方式轻松访问系统。\n- 未正确配置权限：在系统中，不同的资源通常需要不同的权限才能访问。如果管理员未正确配置权限，那么未经授权的用户可能会通过欺骗系统或利用其他漏洞来访问关键资源。\n- 权限重用：在某些情况下，管理员可能会将某些权限分配给某个用户，但这些权限并未被正确地限制或授权给该用户。如果其他用户尝试使用这些权限访问关键资源，那么他们可能会获得未经授权的访问权限。\n- 未正确验证用户输入：当开发人员没有正确验证用户输入时，可能会发生这种情况。例如，如果开发人员未正确过滤用户输入的用户名或密码，那么黑客可能会利用这些信息轻松地访问系统。\n", "title": "关键资源权限分配不当常见的攻击方式"}, {"content": "- 使用强密码：管理员应该使用强密码来保护系统，并定期更改密码。强密码应该包括数字、字母和符号，并且应该不同于其他帐户使用的密码。\n- 正确配置权限：管理员应该正确配置系统中不同资源所需的权限。用户可以被授予访问特定资源的权限，但不应该被授予访问其他资源的权限。\n- 权限限制：管理员应该使用权限限制来限制用户对特定资源的访问。例如，用户可以被授予访问特定文件夹的权限，但不能访问其他文件夹。\n- 输入验证：开发人员应该正确验证用户输入。例如，他们可以过滤用户输入的用户名和密码，以确保它们符合预期的格式。\n- 安全培训：管理员和用户应该接受安全培训，以便了解如何识别和避免常见的安全漏洞，例如不正确权限授予漏洞。\n- 定期更新和修补软件：系统软件和应用程序应该定期更新和修补，以确保它们不受最新安全漏洞的影响。", "title": "如何预防关键资源权限分配不当"}], "cnvd_id": "", "cve_id": "CVE-2026-92377", "cvss": {"cvssv31": [{"source": "psirt@teamviewer.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-732", "description": "TeamViewer 是 TeamViewer 公司的商业闭源远程连接软件，Windows 版 Full Client 与 Host 中的补丁管理更新机制用于获取并安装补丁管理组件的更新。\n受影响版本中，补丁管理更新机制在通过进程间通信获取更新信息时缺少访问控制校验，低权限本地认证攻击者可伪造 IPC 响应提供一个已签名可执行文件，并使该可执行文件从用户可写的临时目录加载恶意 DLL，最终以 NT AUTHORITY\\SYSTEM 权限执行任意代码，实现本地提权。\n修复版本中通过厂商安全更新修复补丁管理更新机制中的访问控制缺陷，切断伪造 IPC 响应进入更新流程的路径，15.82 及以上版本不再受该问题影响，维护分支用户需升级至 15.64.10、14.7.48868 或 13.2.36231，官方建议升级至最新版本 15.83。", "effects": [{"comp_name": "teamviewer", "ecosystem": "linux", "versions": [{"affected_version": "[14.7,14.7.48868)", "min_fixed_version": "14.7.48868", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[15.64,15.64.10)", "min_fixed_version": "15.64.10", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,15.82)", "min_fixed_version": "15.82", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[13.2,13.2.36231)", "min_fixed_version": "13.2.36231", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "关键资源权限分配不当", "kind_en": "关键资源的权限分配不正确", "last_modified_time": "2026-10-28", "level": "High", "mps_id": "MPS-cmnp-qtv9", "poc": false, "poc_url": [], "published_time": "2026-10-28", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-cmnp-qtv9", "name": "https://www.oscs1024.com/hd/MPS-cmnp-qtv9"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-92377", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-92377"}, {"url": "https://www.teamviewer.com/en/resources/trust-center/security-bulletins/tv-2026-1012/", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "TeamViewer补丁管理本地提权漏洞", "_translated": true, "_saved_at": "2026-10-27T17:14:34+00:00", "_first_saved_at": "2026-10-27T17:14:34+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-cmnp-qtv9"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-92374", "cvss": {"cvssv31": [{"source": "psirt@teamviewer.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-367", "description": "TeamViewer 是商业闭源远程访问与远程支持软件，Full Client 与 Host 用于远程控制、远程管理和 IT 支持等场景，其 macOS 版本通过特权助手执行需要 root 权限的安装操作。\n受影响版本中，macOS 特权助手在处理安装包时存在 TOCTOU 竞态条件并伴随符号链接处理不当，安装包校验与实际安装之间存在时间窗口，低权限本地攻击者可借助符号链接在该窗口内替换校验对象，绕过安装包校验并让特权助手安装恶意包，最终获得 root 权限。\n修复版本中通过官方安全更新收紧特权助手对安装包的校验与安装处理，消除校验与使用之间的竞态窗口以及符号链接滥用空间，阻止低权限用户再通过该路径安装未经验证的包，建议升级至 15.83 及以上版本。", "effects": [{"comp_name": "teamviewer", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,15.83)", "min_fixed_version": "15.83", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "检查时间与使用时间(TOCTOU)的竞争条件", "kind_en": "检查时间使用时间 (TOCTOU) 竞争条件", "last_modified_time": "2026-10-28", "level": "High", "mps_id": "MPS-d3pt-8ioh", "poc": false, "poc_url": [], "published_time": "2026-10-28", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-d3pt-8ioh", "name": "https://www.oscs1024.com/hd/MPS-d3pt-8ioh"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-92374", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-92374"}, {"url": "https://www.teamviewer.com/en/resources/trust-center/security-bulletins/tv-2026-1011/", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "TeamViewer macOS权限提升漏洞", "_translated": true, "_saved_at": "2026-10-27T17:14:38+00:00", "_first_saved_at": "2026-10-27T17:14:38+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-d3pt-8ioh"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2026-92376", "cvss": {"cvssv31": [{"source": "psirt@teamviewer.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-287", "description": "TeamViewer Remote Management Monitoring 是 TeamViewer Germany GmbH 的商业闭源远程管理附加组件，在 Windows 上由 ITbrain_Monitoring_Service.exe 以系统服务形式提供设备监控。\n受影响版本中，该组件的进程间通信机制未正确认证 IPC broker。本地低权限已认证攻击者可冒充 IPC broker，使 Monitoring 服务以 NT AUTHORITY\\SYSTEM 权限执行任意代码，从而完成本地权限提升。\n修复版本中通过将 ITbrain_Monitoring_Service.exe 更新到 26.10.1，消除允许低权限本地用户冒充 IPC broker 并驱动 Monitoring 服务以 NT AUTHORITY\\SYSTEM 执行任意代码的认证缺陷。厂商通过自动更新交付该组件，公开材料未披露具体源码改动。", "effects": [{"comp_name": "remote_management_monitoring", "ecosystem": "linux", "versions": [{"affected_version": "[0,26.10.1)", "min_fixed_version": "26.10.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "身份验证不当", "kind_en": "认证不当", "last_modified_time": "2026-10-28", "level": "High", "mps_id": "MPS-piqu-1a38", "poc": false, "poc_url": [], "published_time": "2026-10-28", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-piqu-1a38", "name": "https://www.oscs1024.com/hd/MPS-piqu-1a38"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-92376", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-92376"}, {"url": "https://www.teamviewer.com/en/resources/trust-center/security-bulletins/tv-2026-1012/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "监控服务IPC提权漏洞", "_translated": true, "_saved_at": "2026-10-27T17:14:36+00:00", "_first_saved_at": "2026-10-27T17:14:36+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-piqu-1a38"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-59158", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "cwe": "CWE-522", "description": "nuxt-ollama 是一个开源的 Nuxt 模块（npm 包），用于在 Nuxt 应用中集成 Ollama 大模型服务，支持通过 api_key 配置接入 Ollama Cloud。\n受影响版本中，模块初始化时在 src/module.ts 的 setup 函数内将包含 api_key 在内的全部模块选项合并进 Nuxt 公开运行时配置 runtimeConfig.public.ollama，Nuxt 服务端渲染会把 runtimeConfig.public 序列化进每个页面的 window.__NUXT__ 脚本负载，浏览器端组合式函数 src/runtime/composables/useOllama.ts 读取该值并作为 Authorization 请求头发送，任意未认证攻击者向应用任意 SSR 页面发送一个 HTTP GET 请求，便能从响应 HTML 中提取明文 API 密钥，进而冒用运营者的 Ollama 云服务配额。\n修复版本中通过将模块选项改为合并进仅服务端可见的私有运行时配置 runtimeConfig.ollama，并新增服务端代理路由 /api/__ollama/** 统一在服务端注入 Authorization 请求头，浏览器端组合式函数不再读取 api_key，API 密钥不再出现在 SSR HTML 响应中。", "effects": [{"comp_name": "nuxt-ollama", "ecosystem": "npm", "versions": [{"affected_version": "[1.2.26,1.3.1)", "min_fixed_version": "1.3.1", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "凭证保护不足", "kind_en": "凭证保护不足", "last_modified_time": "2026-10-15", "level": "High", "mps_id": "MPS-17kc-u05p", "poc": false, "poc_url": [], "published_time": "2026-10-28", "reference_url_list": [{"url": "https://github.com/thoda-dev/nuxt-ollama/security/advisories/GHSA-fxg7-897c-57mp", "name": ""}, {"url": "https://github.com/advisories/GHSA-fxg7-897c-57mp", "name": ""}], "scope_influence": "", "tags": ["AI", "npm", "开源"], "title": "nuxt-ollama API密钥泄露漏洞", "_translated": true, "_saved_at": "2026-10-28T00:53:04+00:00", "_first_saved_at": "2026-10-28T00:53:04+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-17kc-u05p"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-116613", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "cwe": "CWE-862", "description": "WordPress 的动画文本块插件在 1.2.6 及以下版本中容易通过“动画文本”短代码暴露敏感信息。这是由于 atb_shortcode_handler() 函数通过攻击者提供的 ID 获取任意帖子，并在“发布”分支中调用 displayContent()，而没有进行功能检查，也没有验证帖子的 post_type 是插件自己的 CPT 还是可查看的 (is_post_type_viewable())。这使得具有贡献者级别及以上访问权限的经过身份验证的攻击者可以读取任何已发布帖子的渲染块内容，包括非公共自定义帖子类型的帖子（public = false，show_in_rest = false），否则 WordPress 将从直接 URL 和 REST API 中隐藏这些帖子。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-10-28", "level": "High", "mps_id": "MPS-1bxq-usj5", "poc": false, "poc_url": [], "published_time": "2026-10-28", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-1bxq-usj5", "name": "https://www.oscs1024.com/hd/MPS-1bxq-usj5"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-116613", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-116613"}, {"url": "https://plugins.trac.wordpress.org/browser/animated-text-block/tags/1.2.6/plugin.php#L132", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/animated-text-block/tags/1.2.6/plugin.php#L142", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/animated-text-block/tags/1.2.6/plugin.php#L163", "name": ""}, {"url": "https://plugins.trac.wordpress.org/changeset?reponame=\u0026old=3767751%40animated-text-block\u0026new=3767751%40animated-text-block", "name": ""}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/7163be31-8f55-45ba-8364-e84a3e636d5b?source=cve", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-116613漏洞", "_translated": true, "_saved_at": "2026-10-28T06:31:39+00:00", "_first_saved_at": "2026-10-28T06:31:39+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-1bxq-usj5"}, {"analysis_status": 0, "articles": [{"content": "- 程序未正确处理用户上传的文件，从而导致程序可以读取、处理或存储未经授权的文件\n", "title": "什么是任意文件上传"}, {"content": "- 欺骗攻击：攻击者可以通过发送伪造的文件来欺骗程序，从而导致程序读取、处理或存储未经授权的文件。\n- 文件格式攻击：攻击者可以通过选择特定的文件格式，例如压缩文件或 ZIP 文件，从而利用上传的文件来篡改程序的执行结果或窃取程序中的重要数据。\n", "title": "任意文件上传常见的攻击方式"}, {"content": "- 使用安全文件传输协议 (FTP):使用安全 FTP 协议可以确保上传的文件格式、大小、权限等符合预期，同时可以防止文件读取、篡改或存储漏洞。\n- 使用文件上传过滤器：使用文件上传过滤器可以过滤上传的文件，以确保文件的格式、大小、权限等符合预期，同时可以防止文件读取、篡改或存储漏洞。\n- 使用白名单机制：使用白名单机制可以只允许特定的文件格式、大小、权限等存在的文件上传，从而防止非法文件的上传和攻击。\n- 定期更新和升级程序：定期更新和升级程序可以修复已知的漏洞，并增强程序的安全性。", "title": "如何预防任意文件上传"}], "cnvd_id": "", "cve_id": "CVE-2026-111255", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-434", "description": "在 3.9.2 及之前的所有版本中，WordPress 的会员工具包 - 多网络会员和亚马逊产品显示插件很容易通过 upload_image 函数受到任意文件上传的攻击。这是由于 upload_image 中的文件类型验证不足，因为 Content-Type 前缀检查较弱，且扩展名来自攻击者控制的 URL 路径，且没有危险扩展名剥离。这使得具有贡献者级别及以上访问权限的经过身份验证的攻击者可以上传可执行文件，从而使远程代码执行成为可能。利用该漏洞需要在插件设置中启用“导入产品图像”选项，因为这会激活在产品保存后触发的图像下载管道。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "任意文件上传", "kind_en": "危险类型文件无限制上传", "last_modified_time": "2026-10-28", "level": "High", "mps_id": "MPS-3mec-h1tr", "poc": false, "poc_url": [], "published_time": "2026-10-28", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-3mec-h1tr", "name": "https://www.oscs1024.com/hd/MPS-3mec-h1tr"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-111255", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-111255"}, {"url": "https://plugins.trac.wordpress.org/browser/affiliate-toolkit-starter/tags/3.9.2/includes/atkp_posttypes_product.php#L3192", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/affiliate-toolkit-starter/tags/3.9.2/includes/basics/ATKPTools.php#L546", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/affiliate-toolkit-starter/tags/3.9.2/includes/basics/ATKPTools.php#L657", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/affiliate-toolkit-starter/tags/3.9.2/includes/basics/ATKPTools.php#L710", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/affiliate-toolkit-starter/tags/3.9.2/includes/dataservices/atkp_productservice.php#L775", "name": ""}, {"url": "https://plugins.trac.wordpress.org/changeset?reponame=\u0026old=3759575%40affiliate-toolkit-starter\u0026new=3759575%40affiliate-toolkit-starter", "name": ""}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/272a8ee4-8689-4935-89c5-e2f502621511?source=cve", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-111255漏洞", "_translated": true, "_saved_at": "2026-10-28T06:31:42+00:00", "_first_saved_at": "2026-10-28T06:31:42+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-3mec-h1tr"}, {"analysis_status": 0, "articles": [{"content": "在程序试图读取、写入或复制内存缓冲区时，未对边界进行适当的检查和限制。缓冲区是用于存储数据的一块内存区域，当程序试图在缓冲区之外的位置进行操作时，就可能导致缓冲区溢出或下溢。攻击者可以利用这个漏洞来修改程序的执行流、执行任意代码或导致拒绝服务等安全问题。", "title": "什么是缓冲区溢出"}, {"content": "- 缓冲区溢出攻击：攻击者向输入缓冲区中注入超过其容量的数据，导致数据溢出到相邻的内存区域，可能覆盖关键数据、修改变量值或执行恶意代码。\n- 缓冲区下溢攻击：攻击者向输入缓冲区中注入少于其容量的数据，导致数据被读取时越过缓冲区边界，可能泄露敏感信息或破坏程序的正常执行流程。\n- 字符串格式化攻击：攻击者通过控制格式化字符串的输入，可以读取或写入任意内存位置，从而执行恶意操作。", "title": "缓冲区溢出常见的攻击方式"}, {"content": "- 输入验证和边界检查：对于所有接受用户输入的缓冲区操作，确保验证输入数据的长度和内容，以避免缓冲区溢出或下溢。\n- 使用安全的字符串操作函数：使用安全的字符串操作函数（如strncpy、strncat）替代不安全的函数（如strcpy、strcat），这些函数会在操作时自动限制操作的边界。\n- 使用内存安全工具：使用内存安全工具（如内存分析器、静态分析工具）来检测和修复潜在的缓冲区溢出问题。\n- 采用安全编码实践：遵循安全编码实践，如最小特权原则、避免使用不受信任的输入等。\n- 定期更新和修补程序：及时应用程序厂商提供的安全更新和补丁，以修复已知的缓冲区溢出漏洞。\n- 使用编程语言和框架提供的安全功能：利用编程语言和框架提供的安全特性，如内存安全函数、边界检查等。", "title": "如何预防缓冲区溢出"}], "cnvd_id": "", "cve_id": "CVE-2026-118352", "cvss": {}, "cvss_score": 7.5, "cvss_vector": "", "cwe": "CWE-119", "description": "Google Chrome 是 Google 开发的开源网页浏览器，基于 Chromium 项目，其网络栈中的 HTTP 缓存（HttpCache）负责存储与复用网页资源，加速重复访问。\n受影响版本中，HTTP 缓存事务等待进入缓存条目时记录 entry_lock_waiting_since_ 时间戳，并通过 AddCacheLockTimeoutHandler 安排最长 20 秒的缓存锁超时回调；当保存条目的重新验证响应不匹配时，HttpCache::DoomEntryValidationNoMatch 会复位排队事务的等待状态，并向任务队列投递携带 ERR_CACHE_RACE 的显式重启任务，但未取消先前安排的超时回调；在线程极度繁忙的场景下，迟到的超时回调先于重启任务执行，同一事务先后进入超时与重启两条处理路径，对已脱离条目等待队列的状态与缓存条目对象产生错误访问，形成内存破坏；攻击者可诱导用户访问其控制的页面触发该竞争，最终可能在沙箱内执行任意代码。\n修复版本中通过在 DoomEntryValidationNoMatch 投递重启任务前调用新增的 CancelEntryLockTimeout，将 entry_lock_waiting_since_ 复位为空值，使迟到的缓存锁超时回调在时间戳一致性检查处直接返回，切断超时处理与显式重启叠加的竞争路径，消除该内存破坏问题。", "effects": [{"comp_name": "chrome", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,156.0.8078.73)", "min_fixed_version": "156.0.8078.73", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "缓冲区溢出", "kind_en": "内存缓冲区范围内的操作限制不当", "last_modified_time": "2026-10-28", "level": "High", "mps_id": "MPS-d6r9-yoqs", "poc": false, "poc_url": [], "published_time": "2026-10-28", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-d6r9-yoqs", "name": "https://www.oscs1024.com/hd/MPS-d6r9-yoqs"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-118352", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-118352"}, {"url": "https://chromereleases.googleblog.com/2026/10/stable-channel-update-for-desktop_0562499947.html", "name": ""}, {"url": "https://issues.chromium.org/issues/569674221", "name": ""}], "scope_influence": "", "tags": [], "title": "Google Chrome HTTP缓存内存破坏漏洞", "_translated": true, "_saved_at": "2026-10-28T00:53:12+00:00", "_first_saved_at": "2026-10-28T00:53:12+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-d6r9-yoqs"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-116690", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "cwe": "CWE-22", "description": "MLflow 是一个开源的 AI 工程平台，面向智能体、大语言模型与机器学习模型的全生命周期管理，提供实验跟踪、模型注册表与提示词管理等能力。\n受影响版本中，创建模型版本接口的提示词分支仅在 source 携带 URL scheme 时执行路径校验，且 _is_prompt_request 按标签键存在性判定，攻击者携带 mlflow.prompt.is_prompt 标签可进入该校验较弱的分支；攻击者提交 schemeless 相对路径形式的 source，可将其保存为模型版本的产物目录，随后调用 /api/2.0/mlflow/model-versions/get-artifact 接口读取 MLflow 服务器进程权限可访问的任意文件。\n修复版本中通过新增的 _validate_prompt_source 校验切断上述链路：无 scheme 或 file scheme 的 source 仅允许 dummy-source 与 prompt-template 两个白名单占位值，其余一律拒绝；is_prompt 判定改为按标签键聚合后仅在标签值为 true 时生效，schemeless 本地路径无法再被存为提示词版本的产物目录，服务器本地文件读取链路被消除。", "effects": [{"comp_name": "mlflow", "ecosystem": "pip", "versions": [{"affected_version": "[3.10.0,3.17.0)", "min_fixed_version": "3.17.0", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-10-28", "level": "High", "mps_id": "MPS-z6rw-jin3", "poc": false, "poc_url": [], "published_time": "2026-10-28", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-z6rw-jin3", "name": "https://www.oscs1024.com/hd/MPS-z6rw-jin3"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-116690", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-116690"}, {"url": "https://github.com/mlflow/mlflow/security/advisories/GHSA-m65p-9j7q-6w33", "name": "https://github.com/mlflow/mlflow/security/advisories/GHSA-m65p-9j7q-6w33"}, {"url": "https://github.com/mlflow/mlflow/pull/25870", "name": "https://github.com/mlflow/mlflow/pull/25870"}, {"url": "https://github.com/mlflow/mlflow/commit/81730a2ce4ebcd60d5d18f68c96f422ad7e30772", "name": "https://github.com/mlflow/mlflow/commit/81730a2ce4ebcd60d5d18f68c96f422ad7e30772"}, {"url": "https://github.com/mlflow/mlflow/releases/tag/v3.17.0", "name": "https://github.com/   <script>
    const payload = JSON.parse(document.getElementById("payload").textContent);
    const levelLabels = payload.level_labels || {};
    const items = payload.items || [];
    let filtered = items.slice();
    let activeId = null;

    const $ = (id) => document.getElementById(id);
    $("generatedAt").textContent = payload.generated_at || "-";
    $("retention").textContent = payload.retention_days ?? "-";
    $("cutoff").textContent = payload.cutoff_date || "-";
    $("count").textContent = String(payload.count ?? items.length);

    function levelClass(level) {
      const cn = levelLabels[level] || level || "";
      if (level === "Critical" || cn === "严重") return "crit";
      if (level === "High" || cn === "高危") return "high";
      return "other";
    }
    function levelText(level) {
      return levelLabels[level] || level || "-";
    }
    function esc(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }
    function scoreText(v) {
      if (v === null || v === undefined || v === "" || v === -1) return "-";
      return String(v);
    }

    function renderList() {
      const list = $("list");
      $("listCount").textContent = String(filtered.length);
      if (!filtered.length) {
        list.innerHTML = '<div class="empty">没有匹配项</div>';
        return;
      }
      list.innerHTML = filtered.map((it) => {
        const id = it.mps_id || it.cve_id;
        const active = id === activeId ? " active" : "";
        return `
          <button class="item${active}" data-id="${esc(id)}" type="button">
            <div class="item-top">
              <span class="cve">${esc(it.cve_id || it.mps_id || "-")}</span>
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
            </div>
            <div class="title">${esc(it.title || "-")}</div>
            <div class="item-foot">
              <span>CVSS ${esc(scoreText(it.cvss_score))}</span>
              <span>${esc(it.published_time || "-")}</span>
              ${it.poc ? "<span>POC</span>" : ""}
            </div>
          </button>`;
      }).join("");
      list.querySelectorAll(".item").forEach((btn) => {
        btn.addEventListener("click", () => selectById(btn.dataset.id));
      });
    }

    function refsHtml(it) {
      const refs = Array.isArray(it.reference_url_list) ? it.reference_url_list : [];
      const links = [];
      if (it._source_page) links.push({ url: it._source_page, name: "OSCS 详情" });
      if (it.cve_id) links.push({ url: `https://nvd.nist.gov/vuln/detail/${it.cve_id}`, name: "NVD" });
      refs.forEach((r) => {
        if (r && r.url) links.push({ url: r.url, name: r.name || r.url });
      });
      const seen = new Set();
      const uniq = [];
      for (const l of links) {
        if (seen.has(l.url)) continue;
        seen.add(l.url);
        uniq.push(l);
      }
      if (!uniq.length) return '<div class="box">无参考链接</div>';
      return `<div class="refs">${uniq.map((l) =>
        `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name || l.url)}</a>`
      ).join("")}</div>`;
    }

    function articlesHtml(it) {
      const arts = Array.isArray(it.articles) ? it.articles : [];
      if (!arts.length) return "";
      return `<div class="section"><h3>相关说明</h3>${arts.map((a) => `
        <div class="article">
          <h4>${esc(a.title || "说明")}</h4>
          <p>${esc(a.content || "")}</p>
        </div>`).join("")}</div>`;
    }

    function renderDetail(it) {
      const detail = $("detail");
      if (!it) {
        detail.innerHTML = '<div class="empty">暂无数据</div>';
        return;
      }
      const pocUrls = Array.isArray(it.poc_url) ? it.poc_url : [];
      detail.innerHTML = `
        <div class="d-head">
          <div>
            <h1 class="d-title">${esc(it.title || "-")}</h1>
            <div class="ids">
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
              <span class="chip">${esc(it.cve_id || "无 CVE")}</span>
              <span class="chip">${esc(it.mps_id || "-")}</span>
              ${it.poc ? '<span class="chip">有 POC</span>' : ""}
              ${it.exp ? '<span class="chip">有 EXP</span>' : ""}
            </div>
          </div>
          <div class="actions">
            ${it._source_page ? `<a class="btn" href="${esc(it._source_page)}" target="_blank" rel="noopener">OSCS</a>` : ""}
            ${it.cve_id ? `<a class="btn" href="https://nvd.nist.gov/vuln/detail/${esc(it.cve_id)}" target="_blank" rel="noopener">NVD</a>` : ""}
          </div>
        </div>
        <div class="grid">
          <div class="stat"><div class="k">CVSS</div><div class="v">${esc(scoreText(it.cvss_score))}</div></div>
          <div class="stat"><div class="k">向量</div><div class="v">${esc(it.cvss_vector || "-")}</div></div>
          <div class="stat"><div class="k">CWE</div><div class="v">${esc(it.cwe || "-")}</div></div>
          <div class="stat"><div class="k">类型</div><div class="v">${esc(it.kind || it.kind_en || "-")}</div></div>
          <div class="stat"><div class="k">公开</div><div class="v">${esc(it.published_time || "-")}</div></div>
          <div class="stat"><div class="k">利用成本</div><div class="v">${esc(it.exploit_requirement_cost || "-")}</div></div>
          <div class="stat"><div class="k">可利用性</div><div class="v">${esc(it.exploitability || "-")}</div></div>
          <div class="stat"><div class="k">修复建议</div><div class="v">${esc(it.fix_suggestion || "-")}</div></div>
        </div>
        <div class="section"><h3>描述</h3><div class="box">${esc(it.description || "无描述")}</div></div>
        ${it.scope_influence ? `<div class="section"><h3>影响范围</h3><div class="box">${esc(it.scope_influence)}</div></div>` : ""}
        ${pocUrls.length ? `<div class="section"><h3>POC 链接</h3><div class="refs">${pocUrls.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join("")}</div></div>` : ""}
        <div class="section"><h3>参考链接</h3>${refsHtml(it)}</div>
        ${articlesHtml(it)}
      `;
    }

    function selectById(id) {
      const it = filtered.find((x) => (x.mps_id || x.cve_id) === id) ||
                 items.find((x) => (x.mps_id || x.cve_id) === id);
      if (!it) return;
      activeId = it.mps_id || it.cve_id;
      renderList();
      renderDetail(it);
      const btn = document.querySelector(`.item[data-id="${CSS.escape(activeId)}"]`);
      if (btn) btn.scrollIntoView({ block: "nearest" });
      history.replaceState(null, "", "#" + encodeURIComponent(activeId));
    }

    function applyFilter(q) {
      const query = (q || "").trim().toLowerCase();
      filtered = !query ? items.slice() : items.filter((it) => {
        const blob = [
          it.cve_id, it.mps_id, it.title, it.kind, it.kind_en, it.cwe, it.description, it.level
        ].map((x) => String(x || "").toLowerCase()).join(" ");
        return blob.includes(query);
      });
      renderList();
      if (filtered.length) {
        const still = filtered.some((x) => (x.mps_id || x.cve_id) === activeId);
        selectById(still ? activeId : (filtered[0].mps_id || filtered[0].cve_id));
      } else {
        activeId = null;
        renderDetail(null);
      }
    }

    $("search").addEventListener("input", (e) => applyFilter(e.target.value));

    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement !== $("search")) {
        e.preventDefault();
        $("search").focus();
        return;
      }
      if (!filtered.length) return;
      const idx = filtered.findIndex((x) => (x.mps_id || x.cve_id) === activeId);
      if (e.key === "ArrowDown") {
        e.preventDefault();
        const next = filtered[Math.min(filtered.length - 1, Math.max(0, idx) + 1)];
        selectById(next.mps_id || next.cve_id);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        const prev = filtered[Math.max(0, idx - 1)];
        selectById(prev.mps_id || prev.cve_id);
      }
    });

    const hashId = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    if (hashId && items.some((x) => (x.mps_id || x.cve_id) === hashId)) {
      activeId = hashId;
      renderList();
      selectById(hashId);
    } else if (items.length) {
      selectById(items[0].mps_id || items[0].cve_id);
    } else {
      renderList();
      renderDetail(null);
    }
  </script>
</body>
</html>
