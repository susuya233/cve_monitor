FTP 协议可以确保上传的文件格式、大小、权限等符合预期，同时可以防止文件读取、篡改或存储漏洞。\n- 使用文件上传过滤器：使用文件上传过滤器可以过滤上传的文件，以确保文件的格式、大小、权限等符合预期，同时可以防止文件读取、篡改或存储漏洞。\n- 使用白名单机制：使用白名单机制可以只允许特定的文件格式、大小、权限等存在的文件上传，从而防止非法文件的上传和攻击。\n- 定期更新和升级程序：定期更新和升级程序可以修复已知的漏洞，并增强程序的安全性。", "title": "如何预防任意文件上传"}], "cnvd_id": "", "cve_id": "CVE-2026-105123", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-434", "description": "W（vincent-peugnet/wcms）是一款采用 AGPL-3.0 协议的开源 PHP 轻量级 CMS，用于搭建 wiki、文档与静态站点，内置媒体管理接口用于上传和维护图片、附件等资源。\n受影响版本中，POST /api/v0/media/upload/[*:path] 路由对应的 Controllerapimedia::upload() 将路径参数 rawurldecode 后直接拼接 MEDIA_DIR，交给 Fs::dircheck()（仅创建或确认目录存在，无边界校验）与 Fs::writefile() 把请求体内容写入磁盘，全程无扩展名与 MIME 校验（Media::MEDIA_EXT 将 php 扩展名归类为 CODE 且无拒绝逻辑），也未验证解析后的路径仍位于媒体目录内；持有编辑者账号的攻击者可上传 .php 文件由 Web 服务器直接执行，或使用编码的 ../ 序列把任意内容写入媒体目录之外的路径，配合 DELETE /api/v0/media/[*:path] 还可删除任意文件，最终造成远程代码执行。\n修复版本中通过，建议对上传扩展名实施白名单并拒绝 php、phtml、phar、.htaccess 等危险类型，使用 realpath 前缀校验将媒体读写限制在媒体目录内，并在 Web 服务器层面禁止执行媒体目录中的脚本，以降低被利用风险。", "effects": [{"comp_name": "wcms", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,3.18.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "任意文件上传", "kind_en": "危险类型文件无限制上传", "last_modified_time": "2026-10-04", "level": "High", "mps_id": "MPS-evcj-0bh9", "poc": false, "poc_url": [], "published_time": "2026-10-04", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-evcj-0bh9", "name": "https://www.oscs1024.com/hd/MPS-evcj-0bh9"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-105123", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-105123"}, {"url": "https://github.com/vincent-peugnet/wcms/issues/662", "name": "GitHub Issue #662"}, {"url": "https://github.com/vincent-peugnet/wcms", "name": ""}, {"url": "https://github.com/vincent-peugnet/wcms/blob/cda5bcdb95dbdb1e804fdfe0e5fd2e2b2f8a90e2/app/class/Controllerapimedia.php#L24-L44", "name": ""}, {"url": "https://github.com/vincent-peugnet/wcms/blob/cda5bcdb95dbdb1e804fdfe0e5fd2e2b2f8a90e2/app/class/Media.php#L98", "name": ""}, {"url": "https://www.vulncheck.com/advisories/w-wcms-through-3.18.0-rce-and-arbitrary-file-write-via-media-upload-api", "name": "VulnCheck Advisory: W (wcms) through 3.18.0 RCE and Arbitrary File Write via Media Upload API"}], "scope_influence": "", "tags": ["应用软件"], "title": "wcms 任意文件写入漏洞", "_translated": true, "_saved_at": "2026-10-04T02:19:32+00:00", "_first_saved_at": "2026-10-04T02:19:32+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-evcj-0bh9"}, {"analysis_status": 0, "articles": [{"content": "在程序试图读取、写入或复制内存缓冲区时，未对边界进行适当的检查和限制。缓冲区是用于存储数据的一块内存区域，当程序试图在缓冲区之外的位置进行操作时，就可能导致缓冲区溢出或下溢。攻击者可以利用这个漏洞来修改程序的执行流、执行任意代码或导致拒绝服务等安全问题。", "title": "什么是缓冲区溢出"}, {"content": "- 缓冲区溢出攻击：攻击者向输入缓冲区中注入超过其容量的数据，导致数据溢出到相邻的内存区域，可能覆盖关键数据、修改变量值或执行恶意代码。\n- 缓冲区下溢攻击：攻击者向输入缓冲区中注入少于其容量的数据，导致数据被读取时越过缓冲区边界，可能泄露敏感信息或破坏程序的正常执行流程。\n- 字符串格式化攻击：攻击者通过控制格式化字符串的输入，可以读取或写入任意内存位置，从而执行恶意操作。", "title": "缓冲区溢出常见的攻击方式"}, {"content": "- 输入验证和边界检查：对于所有接受用户输入的缓冲区操作，确保验证输入数据的长度和内容，以避免缓冲区溢出或下溢。\n- 使用安全的字符串操作函数：使用安全的字符串操作函数（如strncpy、strncat）替代不安全的函数（如strcpy、strcat），这些函数会在操作时自动限制操作的边界。\n- 使用内存安全工具：使用内存安全工具（如内存分析器、静态分析工具）来检测和修复潜在的缓冲区溢出问题。\n- 采用安全编码实践：遵循安全编码实践，如最小特权原则、避免使用不受信任的输入等。\n- 定期更新和修补程序：及时应用程序厂商提供的安全更新和补丁，以修复已知的缓冲区溢出漏洞。\n- 使用编程语言和框架提供的安全功能：利用编程语言和框架提供的安全特性，如内存安全函数、边界检查等。", "title": "如何预防缓冲区溢出"}], "cnvd_id": "", "cve_id": "CVE-2026-88779", "cvss": {"cvssv4": [{"source": "50a63c94-1ea7-4568-8c11-eb79e7c5a2b5", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-119", "description": "Citrix NetScaler ADC（原 Citrix ADC）与 Citrix NetScaler Gateway（原 Citrix Gateway）是 Cloud Software Group 旗下闭源的应用交付控制器与统一接入网关，广泛用于企业应用负载均衡、身份认证和远程访问接入。\n受影响版本中，设备在配置为 SAML SP（add authentication samlAction）或 SAML IdP（add authentication samlIdPProfile）并配合 Gateway 或 AAA 认证功能使用时，处理 SAML 认证流量的内存边界校验存在缺陷，未经身份验证的远程攻击者可发送恶意请求触发内存越界访问（CWE-119），造成内存溢出并导致设备拒绝服务；Citrix 已在未修复的部署上观察到定向攻击，该条件被反复触发时服务可能持续不可用。\n修复版本中通过修复 SAML 认证处理中的内存越界缺陷消除拒绝服务风险，Citrix 已发布 14.1-73.41、13.1-64.28、14.1-73.41 FIPS 和 13.1-37.282 及以上修复版本，升级完成前可通过 Global Deny List 特征签名缓解攻击。", "effects": [{"comp_name": "netscaler_application_delivery_controller", "ecosystem": "linux", "versions": [{"affected_version": "[14.1-FIPS,14.1-73.41-FIPS)", "min_fixed_version": "14.1-73.41-FIPS", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[13.1-NDcPP,13.1-37.282)", "min_fixed_version": "13.1-37.282", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[13.1,13.1-64.28)", "min_fixed_version": "13.1-64.28", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[14.1,14.1-73.41)", "min_fixed_version": "14.1-73.41", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[13.1-FIPS,13.1-37.282)", "min_fixed_version": "13.1-37.282", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "netscaler_gateway", "ecosystem": "linux", "versions": [{"affected_version": "[14.1,14.1-73.41)", "min_fixed_version": "14.1-73.41", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[13.1,13.1-64.28)", "min_fixed_version": "13.1-64.28", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "缓冲区溢出", "kind_en": "内存缓冲区范围内的操作限制不当", "last_modified_time": "2026-10-04", "level": "High", "mps_id": "MPS-ufs2-5t6e", "poc": false, "poc_url": [], "published_time": "2026-10-04", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ufs2-5t6e", "name": "https://www.oscs1024.com/hd/MPS-ufs2-5t6e"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-88779", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-88779"}, {"url": "https://support.citrix.com/support-home/kbsearch/article?articleNumber=CTX697174", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "NetScaler SAML拒绝服务漏洞", "_translated": true, "_saved_at": "2026-10-04T09:14:18+00:00", "_first_saved_at": "2026-10-04T09:14:18+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ufs2-5t6e"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "cnvd_id": "", "cve_id": "CVE-2026-105126", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.2}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-269", "description": "LaraDashboard 是一个基于 Laravel 的开源内容管理与后台管理面板（PHP），提供角色权限、用户管理、模块安装与核心升级等站点管理能力。\n受影响版本中，RoleController 的 update() 与 destroy() 仅在 config('app.demo_mode') 为真时拦截名为 Superadmin 的角色，而默认部署 DEMO_MODE 为 false，该保护不生效；RolePolicy::update 与 delete 只校验 role.edit、role.delete 权限，未排除 Superadmin 角色，请求随后进入 RolesService::updateRole，直接修改角色名并同步任意权限。具备 role.edit 的管理员可通过 PUT /admin/roles/{id} 将自身角色改名为 Superadmin 或附加 user.login_as、user.delete 权限；系统在 BasePolicy::before 与核心升级 UploadRequest::authorize 中以 hasRole('Superadmin') 按名称识别超级管理员，改名后的角色由此获得核心升级包上传、模块安装等超管功能并可达代码执行，攻击者还可借助 user.login_as 登录接管任意账户。\n修复版本中通过在 1.4.8 引入持久的 roles.is_super_admin 标志并以迁移回填 Superadmin 角色，新增 Role::isSuperAdminRole() 与 User::isSuperAdmin() 替代按角色名的判定，RolePolicy::update 与 delete 对超管角色直接拒绝，新增 RolePermissionGuard::filterGrantablePermissions 过滤非超管编辑者提交的 user.login_as、user.delete 权限，UserPolicy::loginAs 限制为超管用户，切断了角色改名与特权铸造链路。", "effects": [{"comp_name": "laradashboard", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.4.8)", "min_fixed_version": "1.4.8", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "expl "https://nvd.nist.gov/vuln/detail/CVE-2026-97307"}, {"url": "https://patchstack.com/database/wordpress/plugin/cost-calculator-builder/vulnerability/wordpress-cost-calculator-builder-plugin-4-0-17-sensitive-data-exposure-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "Cost Calculator Builder敏感信息泄露漏洞", "_translated": true, "_saved_at": "2026-10-04T15:05:26+00:00", "_first_saved_at": "2026-10-04T15:05:26+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-upfi-laco"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-97276", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:L", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:L", "cwe": "CWE-79", "description": "WP Statistics 是 VeronaLabs 开源的 WordPress 站点统计分析插件（GPL-3.0），用于统计站点访问量、来源渠道、作者与引荐等报表数据，源码发布于 GitHub 并同步至 WordPress.org 插件目录。\n受影响版本中，管理后台过滤下拉的 URL 在服务端拼接：FilterManager、ReferralsPage 与 AuthorAnalyticsPage 使用 htmlspecialchars_decode(esc_url(remove_query_arg(...))) 生成基准地址，HTML 解码抵消了 esc_url 的实体转义，部分场景还基于原始 REQUEST_URI 调用 add_query_arg()，攻击者构造的管理页链接查询串经 wp_statistics_get_filters AJAX 接口原样进入返回的 JSON，前端 FilterGenerator.prototype.createDropdown 将 baseUrl 与 item.url 未转义地拼入 \u003ca href\u003e 并赋给 innerHTML，具备报表访问权限的已登录用户点击恶意链接后，注入脚本在管理后台上下文执行，形成反射型 XSS。\n修复版本中通过统一改用 esc_url_raw() 构造基准与条目 URL，不再对转义结果执行 HTML 解码，并在前端 createDropdown 中以 wps_js.escapeHtml() 对 baseUrl 与 item.url 转义后再写入 href，双端切断属性逃逸链路，修复包含于 14.16.15。", "effects": [{"comp_name": "wp-statistics", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,14.16.15)", "min_fixed_version": "14.16.15", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-10-04", "level": "High", "mps_id": "MPS-7mtv-1nz5", "poc": false, "poc_url": [], "published_time": "2026-10-04", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-7mtv-1nz5", "name": "https://www.oscs1024.com/hd/MPS-7mtv-1nz5"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-97276", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-97276"}, {"url": "https://patchstack.com/database/wordpress/plugin/wp-statistics/vulnerability/wordpress-wp-statistics-plugin-14-16-14-cross-site-scripting-xss-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "WP Statistics 反射型 XSS", "_translated": true, "_saved_at": "2026-10-04T15:05:27+00:00", "_first_saved_at": "2026-10-04T15:05:27+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-7mtv-1nz5"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-105129", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:N", "severity": "medium", "base_score": 6.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-863", "description": "LaraDashboard 是一个基于 Laravel 框架的开源（MIT 协议）内容管理与后台仪表盘系统，提供角色权限、模块扩展、翻译与内容管理能力，其设置项中存储 AI 服务 影响版本中，应用将 struts.mapper.class 配置为遗留 RestfulActionMapper 时，getMapping 通过 RequestUtils.getServletPath(request) 读取请求 URI，并把第一个路径片段未经 allowedActionNames 校验直接写入 ActionMapping 的 action 名称。含表达式语法的片段由此进入后续 OGNL 处理，可能造成远程代码执行。默认 ActionMapper、restful2 以及 Struts REST 插件不经过该映射器；Struts 7 仅在关闭默认启用的 OGNL allowlist 时受影响。\n修复版本中通过在 getMapping 取出 action 名称后调用 cleanupActionName，按 struts.allowed.action.names 对应模式校验，不匹配时改用 struts.default.action.name，阻断表达式字符作为 action 名称继续传递。", "effects": [{"comp_name": "org.apache.struts:struts2-core", "ecosystem": "maven", "versions": [{"affected_version": "[2.0.0,2.3.37]", "min_fixed_version": "", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[6.0.0,6.12.0)", "min_fixed_version": "6.12.0", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[2.5.0,2.5.33]", "min_fixed_version": "", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[7.0.0,7.4.0)", "min_fixed_version": "7.4.0", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "表达式语言注入", "kind_en": "表达式语言语句中使用的特殊元素的不正确中和（“表达式语言注入”）", "last_modified_time": "2026-10-05", "level": "High", "mps_id": "MPS-9702-bc72", "poc": false, "poc_url": [], "published_time": "2026-10-05", "reference_url_list": [{"url": "http://www.mail-archive.com/announce@apache.org/msg12200.html", "name": ""}, {"url": "https://cwiki.apache.org/confluence/display/WW/S2-075", "name": ""}, {"url": "https://struts.apache.org/", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-104711", "name": ""}, {"url": "https://issues.apache.org/jira/browse/WW-5706", "name": ""}, {"url": "https://github.com/apache/struts/commit/2620abedd86eb79bd1d25550bfcf878ba7ace4a9", "name": ""}, {"url": "https://github.com/apache/struts/commit/107f2ed9876d9e0d7451489ee7d1bd9397ae13ee", "name": ""}, {"url": 代码缺少完整性检查", "kind_en": "不进行完整性检查的代码下载", "last_modified_time": "2026-10-05", "level": "High", "mps_id": "MPS-1erv-du7p", "poc": false, "poc_url": [], "published_time": "2026-10-05", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-1erv-du7p", "name": "https://www.oscs1024.com/hd/MPS-1erv-du7p"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-105295", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-105295"}, {"url": "https://github.com/gitahead/gitahead/issues/662", "name": "GitHub Issue #662"}, {"url": "https://github.com/gitahead/gitahead", "name": ""}, {"url": "https://github.com/gitahead/gitahead/blob/v2.7.1/src/update/Updater.cpp#L176-L279", "name": ""}, {"url": "https://github.com/gitahead/gitahead/blob/v2.7.1/src/app/Application.cpp#L284-L309", "name": ""}, {"url": "https://www.vulncheck.com/advisories/gitahead-2.5.0-through-2.7.1-unverified-update-installation-and-tls-bypass", "name": "VulnCheck Advisory: GitAhead 2.5.0 through 2.7.1 Unverified Update Installation and TLS Bypass"}], "scope_influence": "", "tags": ["应用软件"], "title": "GitAhead未校验更新漏洞", "_translated": true, "_saved_at": "2026-10-05T01:29:03+00:00", "_first_saved_at": "2026-10-05T01:29:03+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-1erv-du7p"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-104713", "cvss": {}, "cvss_score": 7.5, "cvss_vector": "", "cwe": "CWE-770", "description": "Apache Struts 是开源 Java Web 框架，其 REST 插件 struts2-rest-plugin 把 HTTP 请求映射为 REST 风格 Action，并按内容类型读取请求体。\n受影响版本中，ContentTypeInterceptor.intercept 在请求的 Content-Length 大于 0 时调用 openBodyReader，用 request.getInputStream() 构造没有长度上限的读取器，再经 applyRequestBody 交给 ContentTypeHandler.toObject 一直读到结束。远程调用方提交的请求体越大，服务端按该体积在 Java 堆上分配的内存越多，堆耗尽后其他用户无法继续获得服务。未使用 REST 插件的应用不进入该路径，插件启用后不需要再打开额外开关。\n修复版本中通过新增框架常量 struts.rest.content.maxLength（默认 2097152），在 intercept 把请求体交给处理器之前用 BoundedReader 累计已读字符，超过上限即抛出 RequestBodyTooLargeException 并停止继续读取，使单次请求不能再按任意体积占满堆内存。", "effects": [{"comp_name": "org.apache.struts:struts2-rest-plugin", "ecosystem": "maven", "versions": [{"affected_version": "[2.5.0,2.5.33]", "min_fixed_version": "", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[6.0.0,6.12.0)", "min_fixed_version": "6.12.0", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[2.1.8,2.3.37]", "min_fixed_version": "", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[7.0.0,7.4.0)", "min_fixed_version": "7.4.0", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "不加限制或调节的资源分配", "kind_en": "不受限制或节流地分配资源", "last_modified_time": "2026-10-05", "level": "High", "mps_id": "MPS-3f7f-8c69", "poc": false, "poc_url": [], "published_time": "2026-10-05", "reference_url_list": [{"url": "http://www.mail-archive.com/announce@apache.org/msg12202.html", "name": ""}, {"url": "https://cwiki.apache.org/confluence/display/WW/S2-077", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-104713", "name": ""}, {"url": "https://struts.apache.org/", "name": ""}, {"url": "https://issues.apache.org/jira/browse/WW-5723", "name": ""}, {"url": "https://github.com/apache/struts/commit/c9183d67b1bf13f3110068f19b8711de8ff3c00b", "name": ""}, {"url": "https://github.com/apache/struts/commit/45b31ab6f5cc011a3629084d9855e089215e61c7", "name": ""}, {"url": "https://github.com/apache/struts/pull/1912", "name": ""}, {"url": "https://github.com/apache/struts/pull/1913", "name": ""}, {"url": "https://github.com/apache/struts/releases/tag/STRUTS_6_12_0", "name": ""}, {"url": "https://github.com/apache/struts/releases/tag/STRUTS_7_4_0", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "Struts REST拒绝服务", "_translated": true, "_saved_at": "2026-10-05T08:06:28+00:00", "_first_saved_at": "2026-10-05T08:06:28+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-3f7f-8c69"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-104712", "cvss": {}, "cvss_score": 7.5, "cvss_vector": "", "cwe": "CWE-405", "description": "Apache Struts 是开源 Java MVC 框架，用于构建企业级 Web 应用，类型转换与标签渲染位于可分发模块 struts2-core。\n受影响版本中，StringConverter.convertToString 在格式化 BigDecimal、Double 或 Float 时把 NumberFormat 的 maximumFractionDigits 设为 Integer.MAX_VALUE。请求参数绑定为 java.math.BigDecimal 并经 Struts 标签库渲染时，DecimalFormat 按该值的 scale 输出全部小数位，响应体积可相对请求放大多个数量级，未认证的远程调用方能够以低流量持续消耗服务器 CPU 与出站带宽。未绑定 BigDecimal 请求参数，或未通过标签库渲染该属性的应用不受影响。\n修复版本中通过将 maximumFractionDigits 上限改为常量 340，使输出长度不再跟随任意大的 BigDecimal scale。不超过该上限的数值仍按原精度格式化，超出上限的值被舍入，从而切断响应随请求参数 scale 放大的路径。", "effects": [{"comp_name": "org.apache.struts:struts2-core", "ecosystem": "maven", "versions": [{"affected_version": "[2.5.14,2.5.33]", "min_fixed_version": "", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[6.0.0,6.12.0)", "min_fixed_version": "6.12.0", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[7.0.0,7.4.0)", "min_fixed_version": "7.4.0", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "不对称的资源消耗（放大攻击）", "kind_en": "不对称资源消耗（放大）", "last_modified_time": "2026-10-05", "level": "High", "mps_id": "MPS-622c-62bf", "poc": false, "poc_url": [], "published_time": "2026-10-05", "reference_url_list": [{"url": "http://www.mail-archive.com/announce@apache.org/msg12199.html", "name": ""}, {"url": "https://cwiki.apache.org/confluence/display/WW/S2-076", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-104712", "name": ""}, {"url": "https://struts.apache.org/", "name": ""}, {"url": "https://struts.apache.org/announce-2026", "name": ""}, {"url": "https://issues.apache.org/jira/browse/WW-5711", "name": ""}, {"url": "https://github.com/apache/struts/commit/1411fe3079944fd2127314a4e091dba5a2a3654a", "name": ""}, {"url": "https://github.com/apache/struts/commit/016c2ec9c3a62b3b64807c58d67ffbbebdf62af3", "name": ""}, {"url": "https://github.com/apache/struts/pull/1887", "name": ""}, {"url": "https://github.com/apache/struts/pull/1888", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "Struts响应放大漏洞", "_translated": true, "_saved_at": "2026-10-05T08:06:59+00:00", "_first_saved_at": "2026-10-05T08:06:59+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-622c-62bf"}]}</script>
  <script>
    const payload = JSON.parse(document.getElementById("payload").textContent);
    const levelLabels = payload.level_labels || {};
    const items = payload.items || [];
    let filtered = items.slice();
    let activeId = null;

    const $ = (id) => document.getElementById(id);
    $("generatedAt").textContent = payload.generated_at || "-";
    $("retention").textContent = payload.retention_days ?? "-";
    $("cutoff").textContent = payload.cutoff_date || "-";
    $("count").textContent = String(payload.count ?? items.length);

    function levelClass(level) {
      const cn = levelLabels[level] || level || "";
      if (level === "Critical" || cn === "严重") return "crit";
      if (level === "High" || cn === "高危") return "high";
      return "other";
    }
    function levelText(level) {
      return levelLabels[level] || level || "-";
    }
    function esc(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }
    function scoreText(v) {
      if (v === null || v === undefined || v === "" || v === -1) return "-";
      return String(v);
    }

    function renderList() {
      const list = $("list");
      $("listCount").textContent = String(filtered.length);
      if (!filtered.length) {
        list.innerHTML = '<div class="empty">没有匹配项</div>';
        return;
      }
      list.innerHTML = filtered.map((it) => {
        const id = it.mps_id || it.cve_id;
        const active = id === activeId ? " active" : "";
        return `
          <button class="item${active}" data-id="${esc(id)}" type="button">
            <div class="item-top">
              <span class="cve">${esc(it.cve_id || it.mps_id || "-")}</span>
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
            </div>
            <div class="title">${esc(it.title || "-")}</div>
            <div class="item-foot">
              <span>CVSS ${esc(scoreText(it.cvss_score))}</span>
              <span>${esc(it.published_time || "-")}</span>
              ${it.poc ? "<span>POC</span>" : ""}
            </div>
          </button>`;
      }).join("");
      list.querySelectorAll(".item").forEach((btn) => {
        btn.addEventListener("click", () => selectById(btn.dataset.id));
      });
    }

    function refsHtml(it) {
      const refs = Array.isArray(it.reference_url_list) ? it.reference_url_list : [];
      const links = [];
      if (it._source_page) links.push({ url: it._source_page, name: "OSCS 详情" });
      if (it.cve_id) links.push({ url: `https://nvd.nist.gov/vuln/detail/${it.cve_id}`, name: "NVD" });
      refs.forEach((r) => {
        if (r && r.url) links.push({ url: r.url, name: r.name || r.url });
      });
      const seen = new Set();
      const uniq = [];
      for (const l of links) {
        if (seen.has(l.url)) continue;
        seen.add(l.url);
        uniq.push(l);
      }
      if (!uniq.length) return '<div class="box">无参考链接</div>';
      return `<div class="refs">${uniq.map((l) =>
        `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name || l.url)}</a>`
      ).join("")}</div>`;
    }

    function articlesHtml(it) {
      const arts = Array.isArray(it.articles) ? it.articles : [];
      if (!arts.length) return "";
      return `<div class="section"><h3>相关说明</h3>${arts.map((a) => `
        <div class="article">
          <h4>${esc(a.title || "说明")}</h4>
          <p>${esc(a.content || "")}</p>
        </div>`).join("")}</div>`;
    }

    function renderDetail(it) {
      const detail = $("detail");
      if (!it) {
        detail.innerHTML = '<div class="empty">暂无数据</div>';
        return;
      }
      const pocUrls = Array.isArray(it.poc_url) ? it.poc_url : [];
      detail.innerHTML = `
        <div class="d-head">
          <div>
            <h1 class="d-title">${esc(it.title || "-")}</h1>
            <div class="ids">
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
              <span class="chip">${esc(it.cve_id || "无 CVE")}</span>
              <span class="chip">${esc(it.mps_id || "-")}</span>
              ${it.poc ? '<span class="chip">有 POC</span>' : ""}
              ${it.exp ? '<span class="chip">有 EXP</span>' : ""}
            </div>
          </div>
          <div class="actions">
            ${it._source_page ? `<a class="btn" href="${esc(it._source_page)}" target="_blank" rel="noopener">OSCS</a>` : ""}
            ${it.cve_id ? `<a class="btn" href="https://nvd.nist.gov/vuln/detail/${esc(it.cve_id)}" target="_blank" rel="noopener">NVD</a>` : ""}
          </div>
        </div>
        <div class="grid">
          <div class="stat"><div class="k">CVSS</div><div class="v">${esc(scoreText(it.cvss_score))}</div></div>
          <div class="stat"><div class="k">向量</div><div class="v">${esc(it.cvss_vector || "-")}</div></div>
          <div class="stat"><div class="k">CWE</div><div class="v">${esc(it.cwe || "-")}</div></div>
          <div class="stat"><div class="k">类型</div><div class="v">${esc(it.kind || it.kind_en || "-")}</div></div>
          <div class="stat"><div class="k">公开</div><div class="v">${esc(it.published_time || "-")}</div></div>
          <div class="stat"><div class="k">利用成本</div><div class="v">${esc(it.exploit_requirement_cost || "-")}</div></div>
          <div class="stat"><div class="k">可利用性</div><div class="v">${esc(it.exploitability || "-")}</div></div>
          <div class="stat"><div class="k">修复建议</div><div class="v">${esc(it.fix_suggestion || "-")}</div></div>
        </div>
        <div class="section"><h3>描述</h3><div class="box">${esc(it.description || "无描述")}</div></div>
        ${it.scope_influence ? `<div class="section"><h3>影响范围</h3><div class="box">${esc(it.scope_influence)}</div></div>` : ""}
        ${pocUrls.length ? `<div class="section"><h3>POC 链接</h3><div class="refs">${pocUrls.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join("")}</div></div>` : ""}
        <div class="section"><h3>参考链接</h3>${refsHtml(it)}</div>
        ${articlesHtml(it)}
      `;
    }

    function selectById(id) {
      const it = filtered.find((x) => (x.mps_id || x.cve_id) === id) ||
                 items.find((x) => (x.mps_id || x.cve_id) === id);
      if (!it) return;
      activeId = it.mps_id || it.cve_id;
      renderList();
      renderDetail(it);
      const btn = document.querySelector(`.item[data-id="${CSS.escape(activeId)}"]`);
      if (btn) btn.scrollIntoView({ block: "nearest" });
      history.replaceState(null, "", "#" + encodeURIComponent(activeId));
    }

    function applyFilter(q) {
      const query = (q || "").trim().toLowerCase();
      filtered = !query ? items.slice() : items.filter((it) => {
        const blob = [
          it.cve_id, it.mps_id, it.title, it.kind, it.kind_en, it.cwe, it.description, it.level
        ].map((x) => String(x || "").toLowerCase()).join(" ");
        return blob.includes(query);
      });
      renderList();
      if (filtered.length) {
        const still = filtered.some((x) => (x.mps_id || x.cve_id) === activeId);
        selectById(still ? activeId : (filtered[0].mps_id || filtered[0].cve_id));
      } else {
        activeId = null;
        renderDetail(null);
      }
    }

    $("search").addEventListener("input", (e) => applyFilter(e.target.value));

    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement !== $("search")) {
        e.preventDefault();
        $("search").focus();
        return;
      }
      if (!filtered.length) return;
      const idx = filtered.findIndex((x) => (x.mps_id || x.cve_id) === activeId);
      if (e.key === "ArrowDown") {
        e.preventDefault();
        const next = filtered[Math.min(filtered.length - 1, Math.max(0, idx) + 1)];
        selectById(next.mps_id || next.cve_id);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        const prev = filtered[Math.max(0, idx - 1)];
        selectById(prev.mps_id || prev.cve_id);
      }
    });

    const hashId = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    if (hashId && items.some((x) => (x.mps_id || x.cve_id) === hashId)) {
      activeId = hashId;
      renderList();
      selectById(hashId);
    } else if (items.length) {
      selectById(items[0].mps_id || items[0].cve_id);
    } else {
      renderList();
      renderDetail(null);
    }
  </script>
</body>
</html>
