/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-843", "description": "FreeRTOS-Kernel 是开源的 C 语言实时操作系统内核，为 FreeRTOS 提供任务调度、队列与信号量原语；其中 queue set 机制（xQueueAddToSet / xQueueRemoveFromSet）允许任务将多个队列与信号量聚合为一个集合统一等待。\n受影响版本中，在启用 MPU 的移植端口上，xQueueAddToSet() 在将 QueueHandle_t 加入 QueueSetHandle_t 时缺少对入队对象 ucQueueType 与既有集合成员 ucQueueType 的一致性校验。当 configUSE_QUEUE_SETS 被设置为 1 时，未特权任务可向 queue set 投递与现有成员类型不一致的对象，借助类型不匹配绕过 MPU 边界，将不可读的特权内核内存以跨边界方式暴露给未特权上下文读取。\n修复版本中通过在 xQueueAddToSet() 中加入 ucQueueType 与已存在集合成员 ucQueueType 的严格一致性比对，仅允许类型完全匹配的队列对象加入 queue set，从而切断未特权任务借由类型错配越权读取特权内核内存的路径。", "effects": [{"comp_name": "freertos-kernel", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,11.3.1)", "min_fixed_version": "11.3.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "使用不兼容类型访问资源（类型混淆）", "kind_en": "使用不兼容类型访问资源（“类型混淆”）", "last_modified_time": "2026-08-22", "level": "High", "mps_id": "MPS-jsgh-wn46", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-jsgh-wn46", "name": "https://www.oscs1024.com/hd/MPS-jsgh-wn46"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-77237", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-77237"}, {"url": "https://aws.amazon.com/security/security-bulletins/2026-086-aws/", "name": ""}, {"url": "https://github.com/FreeRTOS/FreeRTOS-Kernel/tree/11.3.1", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "FreeRTOS-Kernel xQueueAddToSet 类型校验缺失导致特权内核内存越权读取漏洞", "_translated": true, "_saved_at": "2026-08-21T19:21:12+00:00", "_first_saved_at": "2026-08-21T19:21:12+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-jsgh-wn46"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-54682", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:C/C:H/I:H/A:N", "severity": "high", "base_score": 8.2}]}, "cvss_score": 8.2, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:C/C:H/I:H/A:N", "cwe": "CWE-79", "description": "DiscordChatExporter 是 Tyrrrz 开源的 .NET 命令行工具，用于将 Discord 频道聊天记录导出为本地 HTML、TXT 或 JSON 文件。\n受影响版本中，DiscordChatExporter.Core/Exporting/MessageGroupTemplate.cshtml 内的 FormatMarkdownAsync 与 FormatEmbedMarkdownAsync 在 ShouldFormatMarkdown 为 false 的导出路径下，直接返回原始字符串并经 Html.Raw 输出，未对 message.Content、message.ForwardedMessage.Content、message.ReferencedMessage.Content、embed.Title、embed.Description、field.Name、field.Value 等 Discord 字段做 HTML 实体编码。攻击者借助 Discord Webhook 或 Bot 在这些字段中植入脚本载荷，受害用户以关闭 Markdown 格式化的方式导出频道后，本地生成的 HTML 文件即包含未转义脚本，在浏览器中打开时执行读取导出文件或篡改显示内容。\n修复版本中通过将上述两个辅助方法的返回类型改为 RazorBlade.IEncodedContent，并在 ShouldFormatMarkdown 为 false 的分支显式调用 Html.Encode(markdown) 后再用 Html.Raw 包裹输出，确保攻击者可控字段在写入 HTML 前完成实体编码；PreambleTemplate.cshtml 中的 FormatMarkdownAsync 与 Context.Request.Channel.Topic 渲染路径同时按相同方式修正，切断未转义脚本进入导出产物的链路。", "effects": [{"comp_name": "DiscordChatExporter", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.47.2)", "min_fixed_version": "2.47.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-08-22", "level": "High", "mps_id": "MPS-q8dk-25ap", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-q8dk-25ap", "name": "https://www.oscs1024.com/hd/MPS-q8dk-25ap"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-54682", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-54682"}, {"url": "https://github.com/Tyrrrz/DiscordChatExporter/commit/5632d6c3867d2f79cba9578056c98caee4377c1b", "name": ""}, {"url": "https://github.com/Tyrrrz/DiscordChatExporter/pull/1545", "name": ""}, {"url": "https://github.com/Tyrrrz/DiscordChatExporter/releases/tag/2.47.2", "name": ""}, {"url": "https://github.com/Tyrrrz/DiscordChatExporter/security/advisories/GHSA-8qrv-mmch-fr9c", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "DiscordChatExporter导出HTML脚本注入漏洞", "_translated": true, "_saved_at": "2026-08-21T20:18:49+00:00", "_first_saved_at": "2026-08-21T20:18:49+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-q8dk-25ap"}, {"analysis_status": 0, "articles": [], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-49360", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:L/VI:L/VA:L/SC:L/SI:H/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:L/VI:L/VA:L/SC:L/SI:H/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-73", "description": "Recce 是开源的 dbt 项目评审与影响分析平台，其内嵌 HTTP 服务在 DuckDB 适配器下未对 query run API 强制认证，远程未授权攻击者可借此向 DuckDB 连接提交任意 SQL 并借助 read_csv、read_parquet、COPY TO 等文件系统原语对 Recce 进程可访问的本地文件执行读写，造成本地文件泄露、Recce/dbt 工件与浏览器静态文件被改写（可引发存储型 XSS），若以 root 权限运行则进一步扩大危害。\n受影响版本中，Recce 服务以默认配置（OSS 服务器不强制认证）将 /runs 系列查询接口直接暴露给网络，submit_run/create_task 触发 QueryTask.execute_dbt()，在 recce/tasks/query.py QueryMixin.execute_sql_with_limit 中通过 default_context().adapter.execute() 把用户 SQL 模板透传到 dbt-duckdb 连接；DbtAdapter.load() 仅执行 load_artifacts() 而未对 DuckDB 启用外部访问沙箱，使 attack vector 中的 read_csv('/etc/passwd')、COPY (SELECT '') TO '/srv/static/app.js' 等语句能够在 Recce 进程身份下落地执行，实现任意文件读、文件写、以及对前端的存储型 XSS 植入。\n修复版本中通过在 DbtAdapter 的 load() 流程中 load_artifacts() 之后新增对新增私有方法 _apply_duckdb_sandbox() 的调用，并在该方法内对 target_type 为 duckdb 的连接执行 SET enable_external_access = false，从而拦截 read_csv、read_parquet、COPY TO、httpfs 与 INSTALL/LOAD 等社区扩展操作；与此同时在 DbtAdapter 中新增默认值为 False 的 unsafe_sql 属性作为显式退出开关，并由新增 CLI 参数 --unsafe-sql 在服务器端向下游传递该标记，测试辅助类 DbtTestHelper 则以 unsafe_sql=True 加载以规避对 python_scan_all_frames 的回归影响。", "effects": [{"comp_name": "recce", "ecosystem": "pip", "versions": [{"affected_version": "(-∞,1.50.0)", "min_fixed_version": "1.50.0", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "文件名或路径的外部可控制", "kind_en": "文件名或路径的外部控制", "last_modified_time": "2026-08-22", "level": "High", "mps_id": "MPS-3jx1-6kmy", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://github.com/DataRecce/recce/security/advisories/GHSA-rh62-j648-g5qc", "name": ""}, {"url": "https://github.com/DataRecce/recce/releases/tag/v1.50.0", "name": ""}, {"url": "https://github.com/advisories/GHSA-rh62-j648-g5qc", "name": ""}], "scope_influence": "", "tags": ["python", "开源"], "title": "Recce query run API 未授权 DuckDB SQL 执行导致本地文件读写漏洞", "_translated": true, "_saved_at": "2026-08-22T03:36:25+00:00", "_first_saved_at": "2026-08-22T00:53:27+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-3jx1-6kmy"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "attack_vector_type": "Local", "cnvd_id": "", "cve_id": "CVE-2026-74580", "cvss": {}, "cvss_score": 7.8, "cvss_vector": "", "cwe": "CWE-787", "description": "Linux kernel 是开源操作系统内核，其 vhost 子系统为用户态进程（如 QEMU）管理 virtqueue 并执行 device IOTLB 翻译，是 KVM 半虚拟化 I/O 路径的核心组件。\n受影响版本中，drivers/vhost/vhost.c 的 vhost_vring_set_num_addr 在响应 VHOST_SET_VRING_ADDR 与 VHOST_SET_VRING_NUM 两个 ioctl 时未把 vq-\u003emeta_iotlb[] 缓存清空。当目标 virtqueue 已挂载 device IOTLB、处于 live 状态时，用户态后续重新下发新的 desc/avail/used 基地址或新的 vring 尺寸后，iotlb_access_ok() 仍以旧缓存命中直接返回 true，跳过对新地址的 iotlb_access_ok 慢路径校验；vhost_vq_meta_fetch() 用陈旧 vhost_iotlb_map 执行 map-\u003eaddr + addr - map-\u003estart，得到的目标地址已不再落在当前 IOTLB 实际映射范围。后续 used ring 更新或 desc 取指路径上的 vhost_copy_to_user() 与 vhost_copy_from_user() 会进一步将该地址交给 __copy_to_user() / __copy_from_user()，访问映射外的主机内核内存。\n修复版本中通过在 vhost_vring_set_num_addr 解锁 vq-\u003emutex 之前增加 __vhost_vq_meta_reset(vq)，使得 vq-\u003emeta_iotlb[] 中缓存的 vhost_iotlb_map 全部失效；后续 iotlb_access_ok() 必须重新走慢路径，针对当前真实 IOTLB 映射重新校验，禁止使用 vring 重新配置前残留的陈旧映射，从而切断越界复制链路。", "effects": [{"comp_name": "linux_kernel", "ecosystem": "linux", "versions": [{"affected_version": "[4.11,5.10.265)", "min_fixed_version": "5.10.265", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.7-rc1,6.12.104)", "min_fixed_version": "6.12.104", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.2-rc1,6.6.152)", "min_fixed_version": "6.6.152", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[7.2-rc1,7.2)", "min_fixed_version": "7.2", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[5.16-rc1,6.1.183)", "min_fixed_version": "6.1.183", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.19-rc1,7.1.9)", "min_fixed_version": "7.1.9", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[5.11-rc1,5.15.216)", "min_fixed_version": "5.15.216", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.13-rc1,6.18.45)", "min_fixed_version": "6.18.45", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-08-22", "level": "High", "mps_id": "MPS-kuj2-1vcq", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-kuj2-1vcq", "name": "https://www.oscs1024.com/hd/MPS-kuj2-1vcq"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-74580", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-74580"}, {"url": "https://git.kernel.org/stable/c/13fa6f32a56a386a82bd7451644c494beed034af", "name": ""}, {"url": "https://git.kernel.org/stable/c/5224bd37e37d36076a550d99b2aebba33939fd95", "name": ""}, {"url": "https://git.kernel.org/stable/c/54617e9119be2eb728ecdd8d977b99c99d4c498a", "name": ""}, {"url": "https://git.kernel.org/stable/c/6fa3e9b1fe856259555a7e22f3f3082e7827fd9b", "name": ""}, {"url": "https://git.kernel.org/stable/c/b70ebe0bba254e093dd5fd4c0c170941ce83eb85", "name": ""}, {"url": "https://git.kernel.org/stable/c/cf363a7a02ce132ef1f58084fdb13e1a3b7da7e7", "name": ""}, {"url": "https://git.kernel.org/stable/c/de845981da67a6b049080c87e605130b0c30adc5", "name": ""}, {"url": "https://git.kernel.org/stable/c/f1e21108e3ddfcce62f6cad4ebd7b5674543c9e6", "name": ""}], "scope_influence": "", "tags": ["操作系统"], "title": "Linux kernel vhost vring 元数据缓存陈旧映射导致的越界读写漏洞", "_translated": true, "_saved_at": "2026-08-21T18:27:47+00:00", "_first_saved_at": "2026-08-21T18:27:47+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-kuj2-1vcq"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过向受信任的数据序列化过程中添加恶意数据，从而在序列化和反序列化过程中执行恶意代码的攻击漏洞。这种漏洞通常存在于使用序列化 (serialization) 机制存储和传输数据的程序中。\n", "title": "什么是反序列化"}, {"content": "- 注入攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码注入到程序中，从而实现代码执行的目的。\n- 反射攻击：攻击者使用反射机制，在序列化过程中动态生成恶意数据，并将恶意代码注入到程序中，从而实现代码执行的目的。\n- 缓冲区溢出攻击：攻击者通过在序列化过程中向缓冲区输入恶意数据，导致缓冲区溢出，从而破坏程序的内存管理，实现代码执行的目的。\n- 格式字符串攻击：攻击者通过在序列化过程中输入恶意数据，导致程序使用错误的格式字符串，从而实现代码执行的目的。\n- 数据流攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码作为一个数据流传递给程序，从而实现代码执行的目的。\n", "title": "反序列化常见的攻击方式"}, {"content": "- 不信任输入数据：程序应该严格检查输入数据的有效性，并避免使用不受信任的数据。\n- 使用安全的序列化机制：程序应该使用安全的序列化机制，如 JSON 或 XML 序列化，而不是第三方序列化库。\n- 最小特权原则：程序应该限制对受信任数据的处理权限，并避免在运行时修改数据。\n- 代码审查和漏洞扫描：程序应该进行代码审查和漏洞扫描，以发现和修复潜在的安全漏洞。\n", "title": "如何预防反序列化"}], "cnvd_id": "", "cve_id": "CVE-2026-54071", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "cwe": "CWE-502", "description": "BabelDOC 是 funstory-ai 开发的开源 Python PDF 翻译库，它内嵌的 pdfminer CMap 加载模块对 PDF 字体字典中的 /Encoding 或 /CMapName 名称仅做 NUL 字节剥离就拼成文件路径并直接调用 pickle.loads 反序列化其内容，攻击者只需在构造的 PDF 中使用 #xx 十六进制把 /Encoding 编码为以 '/' 开头的绝对路径即可让 BabelDOC 加载并反序列化任意攻击者可控的 .pickle.gz 文件，从而以 BabelDOC 进程权限执行任意 Python 代码。\n受影响版本中，BabelDOC ≤ 0.6.2（artifact: BabelDOC，repository: pip，language: python）的 babeldoc/pdfminer/cmapdb.py 文件 CMapDB._load_data() 方法先对 PDF 控制的 name 字符串执行 name.replace(\"\\0\", \"\") 仅去除 NUL 字节，然后以 \"%s.pickle.gz\" % name 拼接出 filename，再依次在 cmap_paths = (os.environ.get(\"CMAP_PATH\", \"/usr/share/pdfminer/\"), os.path.join(os.path.dirname(__file__), \"cmap\")) 两个目录下用 os.path.join(directory, filename) 构造路径，当 PDF 字体字典的 /Encoding 使用 #2F 等十六进制解码出以 '/' 开头的绝对路径时 os.path.join 直接丢弃前者返回绝对路径本身并执行 gzip.open(path) + pickle.loads(gzfile.read())，从而触发 CWE-502 不受信任数据反序列化漏洞，以 BabelDOC 进程权限实现任意代码执行。\n修复版本中通过 BabelDOC 0.6.3（fix commit: 28f784ca6b437dbba040bfd9c67110373cd0924b）的 babeldoc/pdfminer/cmapdb.py 文件 CMapDB._load_data() 与新增的 babeldoc/format/pdf/new_parser/runtime/cmap_secure_loader.py 文件 load_verified_cmap_data() 切断上述反序列化路径：CMapDB._load_data 不再基于 PDF 控制字符串拼接并访问外部 cmap 目录，而是把清理 NUL 后的 name 传入 load_verified_cmap_data，该函数先以 _cmap_manifest_data.CMAP_MANIFEST 对文件名进行精确白名单校验，再通过 (BUNDLED_CMAP_DIR / filename).resolve() 与 path.parent == BUNDLED_CMAP_DIR 做目录包含检查，最后对压缩后的 .gz 字节计算 hashlib.sha256 并与白名单中固定的 SHA-256 与 size 逐项比对，CMAP_PATH 环境变量与外部 cmap 搜索目录被完全移除，任何一项校验失败即抛出 CMapIntegrityError 并被上层映射为 CMapNotFound，pickle.loads 永远不会触达未通过完整性校验的字节流，从根本上切断 PDF 控制的 pickle 反序列化利用路径。", "effects": [{"comp_name": "BabelDOC", "ecosystem": "pip", "versions": [{"affected_version": "[0,0.6.3)", "min_fixed_version": "0.6.3", "repository": "pip", "solutions": [], "upstream": true}]}, {"comp_name": "babeldoc", "ecosystem": "pip", "versions": [{"affected_version": "(-∞,0.6.3)", "min_fixed_version": "0.6.3", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "反序列化", "kind_en": "不可信数据的反序列化", "last_modified_time": "2026-07-14", "level": "High", "mps_id": "MPS-v670-p3ko", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://github.com/funstory-ai/BabelDOC/security/advisories/GHSA-m8gf-v64p-gfmg", "name": ""}, {"url": "https://github.com/advisories/GHSA-m8gf-v64p-gfmg", "name": ""}], "scope_influence": "", "tags": ["python", "开源"], "title": "BabelDOC CMap Pickle 反序列化任意代码执行漏洞", "_translated": true, "_saved_at": "2026-08-21T20:18:51+00:00", "_first_saved_at": "2026-08-21T20:18:51+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-v670-p3ko"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "attack_vector_type": "Local", "cnvd_id": "", "cve_id": "CVE-2026-74583", "cvss": {}, "cvss_score": 7.8, "cvss_vector": "", "cwe": "CWE-416", "description": "Linux 内核是开源操作系统核心，net/sched 子系统提供基于路由的流量分类能力，其中 cls_route (route4) 分类器通过 16 槽 fastmap 缓存按 (id, iif) 索引已命中的 struct route4_filter 指针以加速后续分类。\n受影响版本中，route4_classify 在 RCU 读侧查找 filter 后通过 route4_set_fastmap 将其写入 fastmap，而 route4_delete、route4_change 与 route4_destroy 仅在调用 route4_reset_fastmap 清空 fastmap 之后再通过 tcf_queue_work / kfree_rcu 释放 filter。由于清空与写回之间没有同步，读者在 reset 之后、kfree 之前把即将释放的 filter 重新写回 fastmap，后续命中同一 (id, iif) 的数据包会从 fastmap 读取已被释放的 route4_filter 并解引用 f-\u003eres，触发 KASAN 报告的 slab use-after-free。\n修复版本中通过在 struct route4_filter 增加 dying 布尔字段，并在 route4_destroy、route4_delete、route4_change 调用 route4_reset_fastmap 前于 fastmap_lock 内将该 filter 标记为 dying，同时让 route4_set_fastmap 在写回 fastmap 前跳过 dying 的 filter，从而切断释放后引用路径。", "effects": [{"comp_name": "linux_kernel", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,47d7f7051253bdc02b1d245d87e38f16d31a74df)", "min_fixed_version": "47d7f7051253bdc02b1d245d87e38f16d31a74df", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "UAF", "kind_en": "免费后使用", "last_modified_time": "2026-08-22", "level": "High", "mps_id": "MPS-wn5d-mz1h", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-wn5d-mz1h", "name": "https://www.oscs1024.com/hd/MPS-wn5d-mz1h"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-74583", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-74583"}, {"url": "https://git.kernel.org/stable/c/0e7a8cf8895b06d07c7311f028eba16ad742b9bc", "name": ""}, {"url": "https://git.kernel.org/stable/c/47d7f7051253bdc02b1d245d87e38f16d31a74df", "name": ""}, {"url": "https://git.kernel.org/stable/c/5ec9001be6d0eb527251125632ec8fe88278897f", "name": ""}, {"url": "https://git.kernel.org/stable/c/7897198b26445b4009a057bda1986b94a99e5d5f", "name": ""}, {"url": "https://git.kernel.org/stable/c/820f083c294ad6d319c02a7d43294f2ed2565139", "name": ""}, {"url": "https://git.kernel.org/stable/c/a17f636c9330eac879822ce29f998e5abd1b72c1", "name": ""}, {"url": "https://git.kernel.org/stable/c/ae9aff87025219005a2d16b4fe83d6f24643e50d", "name": ""}, {"url": "https://git.kernel.org/stable/c/b969984b2bdc85d721ce4047cd270cd37ec705a2", "name": ""}], "scope_influence": "", "tags": ["操作系统"], "title": "Linux内核cls_route过滤器释放后使用漏洞", "_translated": true, "_saved_at": "2026-08-21T18:27:44+00:00", "_first_saved_at": "2026-08-21T18:27:44+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-wn5d-mz1h"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用了空指针，并在不进行有效检查的情况下对其进行取消引用操作。当程序试图取消引用空指针时，由于空指针不指向任何有效的内存地址，会导致程序崩溃或产生未定义的行为。这种错误通常发生在开发者未对指针进行正确的初始化或验证时。", "title": "什么是空指针取消引用"}, {"content": "- 拒绝服务：攻击者可以通过构造恶意输入或请求，触发程序中的空指针取消引用错误，导致程序崩溃或无法正常运行。这可能导致拒绝服务攻击，使系统无法提供正常的服务。\r\n- 内存信息泄露：攻击者可以通过利用空指针取消引用错误，访问程序中的敏感内存信息。这可能包括栈上的变量、函数指针或其他敏感数据，从而暴露系统的机密信息。\r\n- 代码执行：在某些情况下，空指针取消引用错误可能导致执行恶意代码或注入恶意代码的机会。攻击者可以通过精心构造的输入，利用空指针取消引用错误来执行任意的代码，进而获取系统控制权或执行未经授权的操作。", "title": "空指针取消引用常见的攻击方式"}, {"content": "- 指针初始化和验证：开发者应该正确地初始化指针，并在使用指针之前进行有效的验证，确保指针不为空。在取消引用指针之前，应始终检查其是否为空。\r\n- 异常处理和错误恢复：程序应该具备健壮的异常处理和错误恢复机制，以便在发生空指针取消引用错误时能够适当地处理异常，而不是导致程序崩溃或暴露敏感信息。\r\n- 防御性编程：采用防御性编程的原则，如避免在未经验证的指针上进行操作，避免使用未初始化的指针等，以防止空指针取消引用错误的发生。\r\n- 静态代码分析和测试：使用静态代码分析工具和测试技术来检测和识别潜在的空指针取消引用错误。这些工具可以帮助发现代码中可能存在的空指针问题，并及时修复。\r\n- 强制性编码标准和最佳实践：制定强制性的编码标准和最佳实践，包括良好的指针使用和管理规范，以帮助开发者编写更可靠、安全的代码。", "title": "如何预防空指针取消引用"}], "cnvd_id": "", "cve_id": "CVE-2026-76905", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-476", "description": "kin-openapi 是开源的 Go 语言 OpenAPI 解析与校验库，提供 routers、openapi3filter 等用于 HTTP 请求的 schema 校验与错误渲染能力。\n受影响版本中，openapi3filter.convertParseError 函数（位于 openapi3filter/validation_error_encoder.go）在处理 multipart/form-data 请求体解析错误时，访问 e.Parameter.In 前未判空。当某个标量表单字段（如声明为 integer 的 age）提交了无法解析的值时，multipart 解码器会在 req_resp_decoder.go 中将一个 *ParseError 嵌套进外层 *ParseError，最终形成的 *RequestError 同时满足 e.Parameter 为 nil 与 innerErr.Cause 为 *ParseError 两个条件，ConvertErrors 与 ValidationErrorEncoder 路径因此触发对 nil 指针的字段解引用，请求处理 goroutine 发生 panic。\n修复版本中通过在 convertParseError 的 query 分支补上 e.Parameter != nil 判空守卫修复该问题，确保 e.Parameter 为 nil 时直接走回退分支返回 Status 400 的 ValidationError，并补充对 Title 为空场景的回退处理，避免再因同一根因发生空指针解引用。", "effects": [{"comp_name": "github.com/getkin/kin-openapi", "ecosystem": "go", "versions": [{"affected_version": "[0.10.0,0.141.0)", "min_fixed_version": "0.141.0", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "空指针取消引用", "kind_en": "空指针取消引用", "last_modified_time": "2026-08-22", "level": "High", "mps_id": "MPS-62tu-w4n1", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://github.com/getkin/kin-openapi/security/advisories/GHSA-mmfr-pmjx-hw9w", "name": ""}, {"url": "https://github.com/getkin/kin-openapi/commit/1d0a337c9b1570fab283be8a04c8af6e43b9a22c", "name": ""}, {"url": "https://github.com/getkin/kin-openapi/releases/tag/v0.141.0", "name": ""}, {"url": "https://github.com/advisories/GHSA-mmfr-pmjx-hw9w", "name": ""}], "scope_influence": "", "tags": ["go"], "title": "kin-openapi openapi3filter ConvertErrors 空指针解引用拒绝服务漏洞", "_translated": true, "_saved_at": "2026-08-21T22:17:19+00:00", "_first_saved_at": "2026-08-21T22:17:19+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-62tu-w4n1"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持 6 fib6_rule_suppress 释放后重用漏洞", "_translated": true, "_saved_at": "2026-08-21T18:27:46+00:00", "_first_saved_at": "2026-08-21T18:27:46+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-6h09-vidq"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-63462", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-674", "description": "Unleash 是开源的特性管理（feature flag）平台，使用 TypeScript/Node.js 实现，对外通过 Express 暴露 API。\n受影响版本中，OpenAPI 请求体校验失败时，错误格式化路径 src/lib/error/bad-data-error.ts 中的 genericErrorMessage 会通过 lodash.get 取出请求体中的原始字段值，并直接调用 JSON.stringify(propertyValue) 生成提示文本。当属性值是嵌套数千层的 JSON 结构时，JSON.stringify 会按层级递归并越过 V8 调用栈上限，抛出同步 RangeError: Maximum call stack size exceeded。该同步异常发生在 Express openAPIValidationMiddleware 调用的 fromOpenApiValidationErrors 中，且父级 try/catch 仅包裹路由 handler，整个进程只注册了 process.on('unhandledRejection') 而没有 uncaughtException 处理器，于是 Node 以 exit(1) 终止进程。攻击者无需任何账号、令牌或 Cookie，向 POST /edge/validate、POST /edge/issue-token 等任意 OpenAPI 校验过的匿名端点发送约 10 KB 的深度嵌套 JSON 即可单请求打挂整个服务，并以重放维持长时间不可用。\n修复版本中通过在 bad-data-error.ts 引入 safeStringify 辅助函数，把 genericErrorMessage 与 fromJoiError 中的 JSON.stringify(propertyValue) 与 JSON.stringify(detail.context.value) 都包在 try/catch 中：当 JSON.stringify 因嵌套深度过大或对象过大抛出异常时，安全地返回占位符字符串 '[value too large or deeply nested to display]'，从而切断 V8 调用栈耗尽路径，使开放 OpenAPI 校验错误格式化无法再触发进程级 RangeError，进而阻止单请求匿名 DoS。", "effects": [{"comp_name": "unleash-server", "ecosystem": "npm", "versions": [{"affected_version": "[7.6.0,7.6.5)", "min_fixed_version": "7.6.5", "repository": "npm", "solutions": [], "upstream": true}, {"affected_version": "[8.0.0,8.0.2)", "min_fixed_version": "8.0.2", "repository": "npm", "solutions": [], "upstream": true}, {"affected_version": "(-∞,7.5.2)", "min_fixed_version": "7.5.2", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "未经控制的递归", "kind_en": "Uncontrolled Recursion", "last_modified_time": "2026-08-22", "level": "High", "mps_id": "MPS-alnv-i6f7", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://github.com/Unleash/unleash/security/advisories/GHSA-r5pq-6chh-j3xp", "name": ""}, {"url": "https://github.com/Unleash/unleash/commit/b0e4da63249a9403bc209e0581db223326cb8dcf", "name": ""}, {"url": "https://github.com/Unleash/unleash/commit/d45f99df924c0d24747b3e45e46fcda7dcd3c1c1", "name": ""}, {"url": "https://github.com/Unleash/unleash/commit/d862562a5ab8f2d1e40f6519c64cf0b4fdaf806d", "name": ""}, {"url": "https://github.com/Unleash/unleash/releases/tag/v7.5.2", "name": ""}, {"url": "https://github.com/Unleash/unleash/releases/tag/v7.6.5", "name": ""}, {"url": "https://github.com/Unleash/unleash/releases/tag/v8.0.2", "name": ""}, {"url": "https://github.com/advisories/GHSA-r5pq-6chh-j3xp", "name": ""}], "scope_influence": "", "tags": ["npm", "开源"], "title": "Unleash 未授权 OpenAPI 校验错误栈耗尽拒绝服务", "_translated": true, "_saved_at": "2026-08-21T20:18:47+00:00", "_first_saved_at": "2026-08-21T20:18:47+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-alnv-i6f7"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-54789", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-787", "description": "mod_auth_openidc 是 Apache 2.x HTTP 服务器的 OpenID Certified 身份认证与授权模块，实现 OpenID Connect Relying Party 功能；该项目以 C 语言实现并以 Apache 模块形式加载，开源维护。\n受影响版本中，公开导出的 oidc_state_cookies_clean_expired 函数在请求处理路径上从 r-\u003eheaders_in 读取客户端 Cookie 头、按分号切分为多个 token 后交给内部 oidc_state_cookies_parse_token 解析。该函数使用 while (cookie != NULL \u0026\u0026 *cookie != OIDC_CHAR_EQUAL) 扫描 token 中的等号以分离 cookie 名与值，但 cookie 指针仅被自增、永不重新赋值为 NULL，因此 cookie != NULL 判断恒为真，循环只能靠遇到 '=' 退出。当未认证客户端发送以默认前缀 mod_auth_openidc_state_ 开头但不包含 '=' 的 Cookie token 时，循环会越过 token 缓冲区末端继续在相邻内存中扫描直到偶然命中 '='（越界读，命中未映射页时可导致进程崩溃/拒绝服务），随后在该偏移处写入 '\\0'（攻击者可控位置的一字节越界写）。\n修复版本中通过将扫描条件改为 (*cookie != '\\0' \u0026\u0026 *cookie != OIDC_CHAR_EQUAL)，在到达字符串结束符时即停止扫描；既有的 if (*cookie != OIDC_CHAR_EQUAL) return 0 检查随后可正常拒绝无值 token，从而切断越界读写路径，并补充 test_state_cookies_clean_no_value 回归测试覆盖该输入形态。", "effects": [{"comp_name": "mod_auth_openidc", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.4.19.4)", "min_fixed_version": "2.4.19.4", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-08-22", "level": "High", "mps_id": "MPS-fcvo-x25t", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-fcvo-x25t", "name": "https://www.oscs1024.com/hd/MPS-fcvo-x25t"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-202   <script>
    const payload = JSON.parse(document.getElementById("payload").textContent);
    const levelLabels = payload.level_labels || {};
    const items = payload.items || [];
    let filtered = items.slice();
    let activeId = null;

    const $ = (id) => document.getElementById(id);
    $("generatedAt").textContent = payload.generated_at || "-";
    $("retention").textContent = payload.retention_days ?? "-";
    $("cutoff").textContent = payload.cutoff_date || "-";
    $("count").textContent = String(payload.count ?? items.length);

    function levelClass(level) {
      const cn = levelLabels[level] || level || "";
      if (level === "Critical" || cn === "严重") return "crit";
      if (level === "High" || cn === "高危") return "high";
      return "other";
    }
    function levelText(level) {
      return levelLabels[level] || level || "-";
    }
    function esc(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }
    function scoreText(v) {
      if (v === null || v === undefined || v === "" || v === -1) return "-";
      return String(v);
    }

    function renderList() {
      const list = $("list");
      $("listCount").textContent = String(filtered.length);
      if (!filtered.length) {
        list.innerHTML = '<div class="empty">没有匹配项</div>';
        return;
      }
      list.innerHTML = filtered.map((it) => {
        const id = it.mps_id || it.cve_id;
        const active = id === activeId ? " active" : "";
        return `
          <button class="item${active}" data-id="${esc(id)}" type="button">
            <div class="item-top">
              <span class="cve">${esc(it.cve_id || it.mps_id || "-")}</span>
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
            </div>
            <div class="title">${esc(it.title || "-")}</div>
            <div class="item-foot">
              <span>CVSS ${esc(scoreText(it.cvss_score))}</span>
              <span>${esc(it.published_time || "-")}</span>
              ${it.poc ? "<span>POC</span>" : ""}
            </div>
          </button>`;
      }).join("");
      list.querySelectorAll(".item").forEach((btn) => {
        btn.addEventListener("click", () => selectById(btn.dataset.id));
      });
    }

    function refsHtml(it) {
      const refs = Array.isArray(it.reference_url_list) ? it.reference_url_list : [];
      const links = [];
      if (it._source_page) links.push({ url: it._source_page, name: "OSCS 详情" });
      if (it.cve_id) links.push({ url: `https://nvd.nist.gov/vuln/detail/${it.cve_id}`, name: "NVD" });
      refs.forEach((r) => {
        if (r && r.url) links.push({ url: r.url, name: r.name || r.url });
      });
      const seen = new Set();
      const uniq = [];
      for (const l of links) {
        if (seen.has(l.url)) continue;
        seen.add(l.url);
        uniq.push(l);
      }
      if (!uniq.length) return '<div class="box">无参考链接</div>';
      return `<div class="refs">${uniq.map((l) =>
        `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name || l.url)}</a>`
      ).join("")}</div>`;
    }

    function articlesHtml(it) {
      const arts = Array.isArray(it.articles) ? it.articles : [];
      if (!arts.length) return "";
      return `<div class="section"><h3>相关说明</h3>${arts.map((a) => `
        <div class="article">
          <h4>${esc(a.title || "说明")}</h4>
          <p>${esc(a.content || "")}</p>
        </div>`).join("")}</div>`;
    }

    function renderDetail(it) {
      const detail = $("detail");
      if (!it) {
        detail.innerHTML = '<div class="empty">暂无数据</div>';
        return;
      }
      const pocUrls = Array.isArray(it.poc_url) ? it.poc_url : [];
      detail.innerHTML = `
        <div class="d-head">
          <div>
            <h1 class="d-title">${esc(it.title || "-")}</h1>
            <div class="ids">
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
              <span class="chip">${esc(it.cve_id || "无 CVE")}</span>
              <span class="chip">${esc(it.mps_id || "-")}</span>
              ${it.poc ? '<span class="chip">有 POC</span>' : ""}
              ${it.exp ? '<span class="chip">有 EXP</span>' : ""}
            </div>
          </div>
          <div class="actions">
            ${it._source_page ? `<a class="btn" href="${esc(it._source_page)}" target="_blank" rel="noopener">OSCS</a>` : ""}
            ${it.cve_id ? `<a class="btn" href="https://nvd.nist.gov/vuln/detail/${esc(it.cve_id)}" target="_blank" rel="noopener">NVD</a>` : ""}
          </div>
        </div>
        <div class="grid">
          <div class="stat"><div class="k">CVSS</div><div class="v">${esc(scoreText(it.cvss_score))}</div></div>
          <div class="stat"><div class="k">向量</div><div class="v">${esc(it.cvss_vector || "-")}</div></div>
          <div class="stat"><div class="k">CWE</div><div class="v">${esc(it.cwe || "-")}</div></div>
          <div class="stat"><div class="k">类型</div><div class="v">${esc(it.kind || it.kind_en || "-")}</div></div>
          <div class="stat"><div class="k">公开</div><div class="v">${esc(it.published_time || "-")}</div></div>
          <div class="stat"><div class="k">利用成本</div><div class="v">${esc(it.exploit_requirement_cost || "-")}</div></div>
          <div class="stat"><div class="k">可利用性</div><div class="v">${esc(it.exploitability || "-")}</div></div>
          <div class="stat"><div class="k">修复建议</div><div class="v">${esc(it.fix_suggestion || "-")}</div></div>
        </div>
        <div class="section"><h3>描述</h3><div class="box">${esc(it.description || "无描述")}</div></div>
        ${it.scope_influence ? `<div class="section"><h3>影响范围</h3><div class="box">${esc(it.scope_influence)}</div></div>` : ""}
        ${pocUrls.length ? `<div class="section"><h3>POC 链接</h3><div class="refs">${pocUrls.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join("")}</div></div>` : ""}
        <div class="section"><h3>参考链接</h3>${refsHtml(it)}</div>
        ${articlesHtml(it)}
      `;
    }

    function selectById(id) {
      const it = filtered.find((x) => (x.mps_id || x.cve_id) === id) ||
                 items.find((x) => (x.mps_id || x.cve_id) === id);
      if (!it) return;
      activeId = it.mps_id || it.cve_id;
      renderList();
      renderDetail(it);
      const btn = document.querySelector(`.item[data-id="${CSS.escape(activeId)}"]`);
      if (btn) btn.scrollIntoView({ block: "nearest" });
      history.replaceState(null, "", "#" + encodeURIComponent(activeId));
    }

    function applyFilter(q) {
      const query = (q || "").trim().toLowerCase();
      filtered = !query ? items.slice() : items.filter((it) => {
        const blob = [
          it.cve_id, it.mps_id, it.title, it.kind, it.kind_en, it.cwe, it.description, it.level
        ].map((x) => String(x || "").toLowerCase()).join(" ");
        return blob.includes(query);
      });
      renderList();
      if (filtered.length) {
        const still = filtered.some((x) => (x.mps_id || x.cve_id) === activeId);
        selectById(still ? activeId : (filtered[0].mps_id || filtered[0].cve_id));
      } else {
        activeId = null;
        renderDetail(null);
      }
    }

    $("search").addEventListener("input", (e) => applyFilter(e.target.value));

    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement !== $("search")) {
        e.preventDefault();
        $("search").focus();
        return;
      }
      if (!filtered.length) return;
      const idx = filtered.findIndex((x) => (x.mps_id || x.cve_id) === activeId);
      if (e.key === "ArrowDown") {
        e.preventDefault();
        const next = filtered[Math.min(filtered.length - 1, Math.max(0, idx) + 1)];
        selectById(next.mps_id || next.cve_id);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        const prev = filtered[Math.max(0, idx - 1)];
        selectById(prev.mps_id || prev.cve_id);
      }
    });

    const hashId = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    if (hashId && items.some((x) => (x.mps_id || x.cve_id) === hashId)) {
      activeId = hashId;
      renderList();
      selectById(hashId);
    } else if (items.length) {
      selectById(items[0].mps_id || items[0].cve_id);
    } else {
      renderList();
      renderDetail(null);
    }
  </script>
</body>
</html>
