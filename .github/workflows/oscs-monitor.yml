name: OSCS 严重/高危监控

on:
  schedule:
    # 每小时整点（UTC）；约每小时抓一次滚动更新
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "monitor_oscs.py"
      - ".github/workflows/oscs-monitor.yml"

permissions:
  contents: write

concurrency:
  group: oscs-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run OSCS monitor
        run: python3 monitor_oscs.py --once --retention-days 3

      - name: Commit data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data index.html html_report.py monitor_oscs.py translate_zh.py
          if git diff --staged --quiet; then
            echo "无数据变更"
          else
            git commit -m "chore(data): update OSCS vulns (zh) + HTML viewer"
            git push
          fi
