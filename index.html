d": "", "cve_id": "CVE-2026-73390", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-266", "description": "Total Donations 是 KlbTheme 发布的 WordPress 付费插件，用于在站点上接受和管理捐赠表单与捐赠记录，属于闭源商业组件，分发渠道为 KlbTheme 自有下载与 Envato 等第三方市场，不托管于 WordPress.org 插件目录或 GitHub 公共仓库。\n受影响版本中，受影响版本（\u003c= 2.0.5）中，插件存在未授权权限提升风险，NVD 与 Patchstack 将其归类为 CWE-266（Incorrect Privilege Assignment）。插件在面向前端的 REST/AJAX 入口或表单提交处理中，未对调用者身份与当前权限做充分校验，使未登录或低权限请求可被用于给目标账户赋予更高角色（例如把订阅者提权为管理员），获得提升权限后即可在站点后台接管站点、注入内容或植入持久化后门。\n修复版本中通过，截至 2026-08-19 官方仍未发布修复版本，Patchstack 仅为该 CVE 发布了一条应急 mitigation 规则用于临时拦截利用。建议在官方修复发布前禁用并移除该插件，或使用 WAF/虚拟补丁规则阻断对插件公开入口的可疑提权请求，并将受影响账户恢复至原始角色。", "effects": [{"comp_name": "klbtheme/total-donations", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.0.5]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "特权授予不正确", "kind_en": "权限分配不正确", "last_modified_time": "2026-08-19", "level": "Critical", "mps_id": "MPS-3v6u-r2df", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-3v6u-r2df", "name": "https://www.oscs1024.com/hd/MPS-3v6u-r2df"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73390", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73390"}, {"url": "https://patchstack.com/database/wordpress/plugin/totaldonations/vulnerability/wordpress-total-donations-plugin-2-0-5-privilege-escalation-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Total Donations插件未授权权限提升漏洞", "_translated": true, "_saved_at": "2026-08-19T14:26:39+00:00", "_first_saved_at": "2026-08-19T13:39:15+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-3v6u-r2df"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过向受信任的数据序列化过程中添加恶意数据，从而在序列化和反序列化过程中执行恶意代码的攻击漏洞。这种漏洞通常存在于使用序列化 (serialization) 机制存储和传输数据的程序中。\n", "title": "什么是反序列化"}, {"content": "- 注入攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码注入到程序中，从而实现代码执行的目的。\n- 反射攻击：攻击者使用反射机制，在序列化过程中动态生成恶意数据，并将恶意代码注入到程序中，从而实现代码执行的目的。\n- 缓冲区溢出攻击：攻击者通过在序列化过程中向缓冲区输入恶意数据，导致缓冲区溢出，从而破坏程序的内存管理，实现代码执行的目的。\n- 格式字符串攻击：攻击者通过在序列化过程中输入恶意数据，导致程序使用错误的格式字符串，从而实现代码执行的目的。\n- 数据流攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码作为一个数据流传递给程序，从而实现代码执行的目的。\n", "title": "反序列化常见的攻击方式"}, {"content": "- 不信任输入数据：程序应该严格检查输入数据的有效性，并避免使用不受信任的数据。\n- 使用安全的序列化机制：程序应该使用安全的序列化机制，如 JSON 或 XML 序列化，而不是第三方序列化库。\n- 最小特权原则：程序应该限制对受信任数据的处理权限，并避免在运行时修改数据。\n- 代码审查和漏洞扫描：程序应该进行代码审查和漏洞扫描，以发现和修复潜在的安全漏洞。\n", "title": "如何预防反序列化"}], "cnvd_id": "", "cve_id": "CVE-2026-73364", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-502", "description": "Flexible Subscriptions 是 WP Desk 提供的开源 WordPress 插件，用于在 WooCommerce 中创建订阅商品并处理定期付款。\n受影响版本中，客户完成含订阅商品的结账后，SubscriptionCheckout 会基于父订单创建订阅，并由 OrderDataTransfer.copy_data 复制订单元数据；该函数对每个元数据值调用 maybe_unserialize，使客户写入且仍呈序列化形态的字符串进入 PHP 反序列化。存在可用 POP 链时，可导致代码执行、SQL 注入、路径穿越或拒绝服务。\n修复版本中通过移除 copy_data 对 maybe_unserialize 的调用，改为直接写入原始元数据值，切断不可信序列化字符串进入对象注入路径。", "effects": [{"comp_name": "flexible-subscriptions", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.8.2)", "min_fixed_version": "1.8.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "反序列化", "kind_en": "不可信数据的反序列化", "last_modified_time": "2026-08-19", "level": "Critical", "mps_id": "MPS-5zyf-o8lt", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-5zyf-o8lt", "name": "https://www.oscs1024.com/hd/MPS-5zyf-o8lt"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73364", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73364"}, {"url": "https://patchstack.com/database/wordpress/plugin/flexible-subscriptions/vulnerability/wordpress-flexible-subscriptions-plugin-1-8-1-php-object-injection-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Flexible Subscriptions对象注入", "_translated": true, "_saved_at": "2026-08-19T14:26:51+00:00", "_first_saved_at": "2026-08-19T13:39:32+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-5zyf-o8lt"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "", "cvss": {}, "cvss_score": 9.8, "cvss_vector": "", "cwe": "CWE-306", "description": "Confluent Platform 是 Confluent, Inc. 提供的商业数据流处理平台，社区版以 KRaft 单节点模式默认捆绑 ksqlDB、Apache Kafka broker、Kafka Connect、Schema Registry 与 REST Proxy 等组件，向数据工程师提供流处理与连接器能力。\n受影响版本中，Confluent Platform 7.9.1-ce 默认配置下 ksqlDB HTTP 8089、Kafka broker 9092（PLAINTEXT，无 SASL）与 Kafka Connect 8083 全部对外暴露未认证服务。攻击者向 ksqlDB 的 POST /ksql 提交 CREATE SINK CONNECTOR 语句，创建 FileStreamSinkConnector 并通过 StringConverter 将任意 file 路径写入配置（例如 /etc/cron.d/evil），随后通过未认证的 broker 向对应 topic 写入字节。FileStreamSinkConnector 内部以 PrintStream(new FileOutputStream(file, true)) 把每条消息直接追加写入该路径，未对路径做任何白名单或目录校验；写入符合 cron 语法的一行后，crond 在下次触发时即以 root 身份执行任意命令，研究人员已动态验证 uid=0(root)。该路径同时绕过了 ksqlDB 自带的 KSQL 语句权限边界，并通过 Kafka broker 与 Kafka Connect 的默认未认证 POST 形成整链未认证利用。\n在官方修复发布前，可通过以下方式切断风险：启用 ksqlDB 认证（配置 ksql.authentication 并接入 Confluent RBAC / Basic / LDAP）、为 Kafka broker 启用 SASL 并停用未认证 PLAINTEXT listener、收紧 Kafka Connect 的 connector.class 白名单或禁用 FileStreamSinkConnector，并对 FileStreamSinkConnector 的 file 参数强制路径白名单以禁止写入系统目录；当前公开材料未披露 Confluent 是否已就默认部署发布对应安全补丁。", "effects": [{"comp_name": "confluent_platform", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,7.9.1]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "关键功能的认证机制缺失", "kind_en": "缺少关键功能的身份验证", "last_modified_time": "2026-08-19", "level": "Critical", "mps_id": "MPS-94e0-c764", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://seclists.org/fulldisclosure/2026/Aug/55", "name": ""}, {"url": "https://0day-rubbish.com/blog/ksqldb-unauth-sink-connector-cron-rce", "name": ""}, {"url": "https://github.com/Exploit-Garbage/0day-Rubbish/tree/main/product/confluent/platform-7.9.1/ksqldb-unauth-sink-connector-cron-rce", "name": ""}, {"url": "https://github.com/confluentinc/ksql", "name": ""}, {"url": "https://docs.confluent.io/platform/current/security/advisories.html", "name": ""}, {"url": "https://ksqldb.io/security/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "ksqlDB预认证远程代码执行", "_translated": true, "_saved_at": "2026-08-19T12:33:54+00:00", "_first_saved_at": "2026-08-19T10:22:08+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-94e0-c764"}, {"analysis_status": 0, "articles": [], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-58081", "cvss": {}, "cvss_score": 9.8, "cvss_vector": "", "cwe": "CWE-122", "description": "FreeBSD 是开源操作系统，iconv(3) 是其 C 库提供的字符编码转换接口，供大量应用程序和库处理国际化文本。\n受影响版本中，HZ、UTF-7、VIQR 和 ZW 等编码模块在写出转换结果前未正确检查调用方提供的输出缓冲区剩余长度。应用程序一旦通过 iconv(3) 将不可信输入转换到或从上述编码，即可把转换后的字符写出到缓冲区之外，触发堆缓冲区溢出并导致进程内存损坏。\n修复版本中通过在 UTF-7、VIQR、ZW 的写出路径补上输出长度检查并在空间不足时返回 E2BIG，同时将 HZ 状态缓冲区从 ROWCOL_MAX 扩大为 4+ROWCOL_MAX 以容纳最多两段转义序列，阻止越界写入。", "effects": [{"comp_name": "freebsd", "ecosystem": "linux", "versions": [{"affected_version": "[15.1-RELEASE,15.1-RELEASE-p1)", "min_fixed_version": "15.1-RELEASE-p1", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[15.0-RELEASE,15.0-RELEASE-p11)", "min_fixed_version": "15.0-RELEASE-p11", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[14.4-RELEASE,14.4-RELEASE-p7)", "min_fixed_version": "14.4-RELEASE-p7", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[14.3-RELEASE,14.3-RELEASE-p16)", "min_fixed_version": "14.3-RELEASE-p16", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "堆缓冲区溢出", "kind_en": "基于堆的缓冲区溢出", "last_modified_time": "2026-08-19", "level": "Critical", "mps_id": "MPS-aq7w-hl1y", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-aq7w-hl1y", "name": "https://www.oscs1024.com/hd/MPS-aq7w-hl1y"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-58081", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-58081"}, {"url": "https://security.freebsd.org/advisories/FreeBSD-SA-26:49.iconv.asc", "name": ""}], "scope_influence": "", "tags": ["操作系统"], "title": "FreeBSD iconv堆溢出", "_translated": true, "_saved_at": "2026-08-19T10:22:16+00:00", "_first_saved_at": "2026-08-19T10:22:16+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-aq7w-hl1y"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过向受信任的数据序列化过程中添加恶意数据，从而在序列化和反序列化过程中执行恶意代码的攻击漏洞。这种漏洞通常存在于使用序列化 (serialization) 机制存储和传输数据的程序中。\n", "title": "什么是反序列化"}, {"content": "- 注入攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码注入到程序中，从而实现代码执行的目的。\n- 反射攻击：攻击者使用反射机制，在序列化过程中动态生成恶意数据，并将恶意代码注入到程序中，从而实现代码执行的目的。\n- 缓冲区溢出攻击：攻击者通过在序列化过程中向缓冲区输入恶意数据，导致缓冲区溢出，从而破坏程序的内存管理，实现代码执行的目的。\n- 格式字符串攻击：攻击者通过在序列化过程中输入恶意数据，导致程序使用错误的格式字符串，从而实现代码执行的目的。\n- 数据流攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码作为一个数据流传递给程序，从而实现代码执行的目的。\n", "title": "反序列化常见的攻击方式"}, {"content": "- 不信任输入数据：程序应该严格检查输入数据的有效性，并避免使用不受信任的数据。\n- 使用安全的序列化机制：程序应该使用安全的序列化机制，如 JSON 或 XML 序列化，而不是第三方序列化库。\n- 最小特权原则：程序应该限制对受信任数据的处理权限，并避免在运行时修改数据。\n- 代码审查和漏洞扫描：程序应该进行代码审查和漏洞扫描，以发现和修复潜在的安全漏洞。\n", "title": "如何预防反序列化"}], "cnvd_id": "", "cve_id": "CVE-2026-73389", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-502", "description": "Kalles Addons 是由 The4 发布的商业 WordPress 插件，作为 Kalles WooCommerce 主题的配套扩展用于扩展主题电商相关功能。该插件为闭源商业分发，未在 WordPress.org 公共插件目录上架，也未公开 GitHub 源码仓库。\n受影响版本中，插件在面向未认证请求的入口对 PHP 序列化数据直接进行反序列化处理，输入未经过白名单、强签名或类型校验即进入对象反序列化流程，构成 CWE-502 描述的不安全反序列化。攻击者无需任何凭据即可向暴露入口投递恶意序列化数据，借助目标 WordPress 环境中可用的 POP 链在服务端触发任意对象注入，进一步导致代码执行、SQL 注入、路径穿越或拒绝服务等后果；Patchstack 在其公告中将其风险描述为高度危险并预期被大规模利用，CVSS 基础评分 9.8。\n修复版本中通过停止在未认证请求路径直接反序列化不可信输入或对该路径上的序列化数据做强签名与白名单校验，阻断攻击者控制的字符串进入对象反序列化流程；截至本文档生成日期官方尚未发布修复版本，建议在官方修复版可用前通过 Patchstack 缓解规则（RapidMitigate）拦截攻击向量，或暂时停用 Kalles Addons 插件直至官方修复版发布。", "effects": [{"comp_name": "the4/kalles-addons", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.0.6]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "反序列化", "kind_en": "不可信数据的反序列化", "last_modified_time": "2026-08-19", "level": "Critical", "mps_id": "MPS-cwup-lj9x", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-cwup-lj9x", "name": "https://www.oscs1024.com/hd/MPS-cwup-lj9x"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73389", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73389"}, {"url": "https://patchstack.com/database/wordpress/plugin/kalles-addons/vulnerability/wordpress-kalles-addons-plugin-1-0-6-php-object-injection-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Kalles Addons WordPress 插件 PHP 对象注入漏洞", "_translated": true, "_saved_at": "2026-08-19T14:26:44+00:00", "_first_saved_at": "2026-08-19T13:39:18+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-cwup-lj9x"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-18031", "cvss": {}, "cvss_score": 9.8, "cvss_vector": "", "cwe": "CWE-287", "description": "TabaPay Gateway（插件标识 tabapay-gateway）是开源 WordPress/WooCommerce 支付网关插件，用于将商店结账接入 TabaPay（tabapay.ir）支付通道。\n受影响版本中，对外 WooCommerce API 回调 Tabapay_Gateway::handle_tabapay_callback 在校验支付结果前，当请求携带非空 token 与 wc_order 时，会读取该订单关联账号并调用 wp_set_current_user、wp_set_auth_cookie 建立登录会话。未认证攻击者可指定任意已关联注册用户（含管理员）的订单编号，直接登录对应账号。\n修复版本中通过在建立会话前完成支付回调真实性校验切断未授权登录链路；截至 2026-08-19，WPScan 标明尚无已知修复，GitHub 与 WordPress.org 最高版本仍为 1.4.0，官方插件目录已关闭下载。", "effects": [{"comp_name": "tabapay-gateway", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.4.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "身份验证不当", "kind_en": "认证不当", "last_modified_time": "2026-08-19", "level": "Critical", "mps_id": "MPS-fp4h-nl86", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-fp4h-nl86", "name": "https://www.oscs1024.com/hd/MPS-fp4h-nl86"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-18031", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-18031"}, {"url": "https://wpscan.com/vulnerability/6576dcd1-aea6-47c0-9157-4ca56f426612/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "TabaPay支付回调认证绕过", "_translated": true, "_saved_at": "2026-08-19T07:32:49+00:00", "_first_saved_at": "2026-08-19T07:32:49+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-fp4h-nl86"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "cnvd_id": "", "cve_id": "CVE-2026-18776", "cvss": {}, "cvss_score": 9.8, "cvss_vector": "", "cwe": "CWE-269", "description": "TrueBooker 是开源 WordPress 预约与日程管理插件，用于在站点前台接受预约并管理客户、服务与时间。\n受影响版本中，add_front_user_booking 与 admin_user_create 等 AJAX 动作通过 wp_ajax_nopriv_ 对未登录用户开放，处理函数未校验调用者身份与目标账户所有权，直接把请求中的 truebooker_wp_user_id 与邮箱交给 wp_update_user()，攻击者可改写任意用户包括管理员的邮箱，再走 WordPress 密码重置流程接管账户。\n修复版本中通过删除上述未授权 AJAX 处理函数，并对其余相关接口补充登录、能力与所有权校验，切断未认证请求改写用户邮箱的路径。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-08-19", "level": "Critical", "mps_id": "MPS-qnp8-ieub", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-qnp8-ieub", "name": "https://www.oscs1024.com/hd/MPS-qnp8-ieub"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-18776", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-18776"}, {"url": "https://wpscan.com/vulnerability/4b6abb2d-941b-429f-a480-33d1aafad450/", "name": ""}], "scope_influence": "", "tags": [], "title": "TrueBooker账号接管漏洞", "_translated": true, "_saved_at": "2026-08-19T07:32:43+00:00", "_first_saved_at": "2026-08-19T07:32:43+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-qnp8-ieub"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-47627", "cvss": {"cvssv31": [{"source": "psirt@nvidia.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-22", "description": "适用于 Linux 的 NVIDIA Triton 推理服务器包含一个漏洞，攻击者可能会导致路径遍历。成功利用可能会导致拒绝服务。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-08-19", "level": "Critical", "mps_id": "MPS-zcmr-0u2v", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-zcmr-0u2v", "name": "https://www.oscs1024.com/hd/MPS-zcmr-0u2v"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-47627", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-47627"}, {"url": "https://github.com/NVIDIA/product-security/tree/main/2026/5865", "name": ""}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-47627", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-47627", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-47627漏洞", "_translated": true, "_saved_at": "2026-08-18T20:16:33+00:00", "_first_saved_at": "2026-08-18T20:16:33+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-zcmr-0u2v"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-73388", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:N/A:L", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:N/A:L", "cwe": "CWE-89", "description": "Nikstore Core 是由 TeconceTheme 为其 Nikstore 商业 WordPress 主题配套提供的闭源电商扩展插件，常用于 WooCommerce 商品、订单与查询扩展，属于未在 WordPress.org 上架、不公开源码的商业组件。\n受影响版本中，未认证的攻击者可直接向插件暴露的 Web 接口发送含 SQL 元字符的请求，未对外部输入进行参数化或转义即拼入数据库查询，造成 WordPress 站点数据库的未授权读取，并因昂贵的注入载荷影响数据库与站点可用性。\n修复版本中通过上游尚未发布官方补丁，建议在 WAF 与主机层启用 Patchstack 提供的虚拟补丁规则拦截异常 SQL 元字符与 UNION/SELECT 等关键字，及时停用或卸载该插件，并持续关注上游修复版本发布直至升级至修复版本。", "effects": [{"comp_name": "nikstore-core", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.5]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-08-19", "level": "Critical", "mps_id": "MPS-0zoy-376t", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-0zoy-376t", "name": "https://www.oscs1024.com/hd/MPS-0zoy-376t"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73388", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73388"}, {"url": "https://patchstack.com/database/wordpress/plugin/nikstore-core/vulnerability/wordpress-nikstore-core-plugin-1-5-sql-injection-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Nikstore Core 插件SQL注入漏洞", "_translated": true, "_saved_at": "2026-08-19T14:26:38+00:00", "_first_saved_at": "2026-08-19T13:39:20+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-0zoy-376t"}, {"analysis_sta :X/RE:X/U:X", "severity": "critical", "base_score": 9.1}]}, "cvss_score": 9.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:N/VI:H/VA:N/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-354", "description": "Uber Kraken 是 Uber 开源的 P2P 容器镜像/Blob 分发系统，Agent 之间通过 BT 协议共享镜像层以加速大规模集群部署。\n受影响版本中，Agent 端 lib/torrent/storage/agentstorage 包内 Torrent.writePiece 仅使用 core.PieceHash（crc32.NewIEEE）逐段计算 32 位校验和并与 metainfo.GetPieceSum 比对，从未在 commit 到内容寻址缓存前对完整 blob 重新计算 SHA-256 digest 并与请求摘要比对。攻击者只要能作为恶意 peer 接入或劫持 agent 之间 P2P 通信路径，即可发送 CRC32 与 piece sum 一致但整体内容与目标 SHA-256 不一致的伪造 blob；所有通过 CRC32 校验的分片最终会被拼装并以请求的 SHA-256 digest 命名写入缓存，从而对后续拉取同一 digest 的 host 完成缓存投毒并执行任意容器层。\n修复版本中通过在 piece 全部写完后对完整 blob 重新计算 SHA-256 digest 并与请求摘要 mi.Digest() 比对来切断该路径，截至公开资料披露时官方修复版本尚未发布。", "effects": [{"comp_name": "kraken", "ecosystem": "go", "versions": [{"affected_version": "(-∞,0.1.27]", "min_fixed_version": "", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "完整性检查值验证不恰当", "kind_en": "完整性检查值验证不当", "last_modified_time": "2026-08-19", "level": "Critical", "mps_id": "MPS-s5ay-06gx", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-s5ay-06gx", "name": "https://www.oscs1024.com/hd/MPS-s5ay-06gx"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-75625", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-75625"}, {"url": "https://github.com/uber/kraken", "name": ""}, {"url": "https://github.com/uber/kraken/blob/master/lib/torrent/storage/agentstorage/torrent.go", "name": ""}, {"url": "https://github.com/uber/kraken/issues/638", "name": ""}, {"url": "https://www.vulncheck.com/advisories/kraken-agents-peer-to-peer-download-cache-poisoning-via-digest-verification-bypass", "name" ron/search-v2-operator 仓库暂未检索到对应修复 commit，建议升级至 Red Hat 提供的修复版本。", "effects": [{"comp_name": "github.com/stolostron/search-v2-operator", "ecosystem": "go", "versions": [{"affected_version": "(-∞,2.15.0]", "min_fixed_version": "", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "带着不必要的权限执行", "kind_en": "使用不必要的权限执行", "last_modified_time": "2026-08-20", "level": "Critical", "mps_id": "MPS-kizr-u5gc", "poc": false, "poc_url": [], "published_time": "2026-08-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-kizr-u5gc", "name": "https://www.oscs1024.com/hd/MPS-kizr-u5gc"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-70496", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-70496"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-70496", "name": ""}, {"url": "https://bugzilla.redhat.com/show_bug.cgi?id=2511032", "name": ""}], "scope_influence": "", "tags": ["go"], "title": "search-v2-operator 集群权限过度授权", "_translated": true, "_saved_at": "2026-08-19T21:19:54+00:00", "_first_saved_at": "2026-08-19T20:20:05+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-kizr-u5gc"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-75860", "cvss": {}, "cvss_score": 9.8, "cvss_vector": "", "cwe": "CWE-269", "description": "JSON Options 是开源 WordPress 插件，用于以 JSON 导入和导出 WordPress 选项，便于站点迁移、备份以及按过滤器处理 wp_options。\n受影响版本中，插件把 json_options_init 挂到 WordPress init 钩子，在每次请求时实例化 jsonOptions。构造函数在 count($_POST) \u003e 0 时直接调用 on_post()，该函数未执行 current_user_can 能力检查，也未校验表单 nonce。未认证攻击者可向任意站点 URL 发送包含 json_options_upload 文件的 POST 请求，使 json_import() 对 JSON 中的任意键调用 update_option()，从而改写 users_can_register 与 default_role 等选项，开启注册并把默认角色设为 administrator，造成权限提升与站点接管。\n修复版本中通过增加能力检查与 nonce 校验切断未认证请求进入 on_post 和 json_import 的路径。截至 2026-08-20，WPScan 标明 No known fix，WordPress.org 插件目录 trunk 与标签最高版本均为 0.0.4，GitHub 仓库自 2013 年起无安全修复提交，公开资料未发布已修复版本。", "effects": [{"comp_name": "json-options", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,0.0.4]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-08-20", "level": "Critical", "mps_id": "MPS-4cf5-wzag", "poc": false, "poc_url": [], "published_time": "2026-08-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-4cf5-wzag", "name": "https://www.oscs1024.com/hd/MPS-4cf5-wzag"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-75860", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-75860"}, {"url": "https://wpscan.com/vulnerability/6c9bbd44-cd10-40e2-af6f-440e7ccabf9a/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "JSON Options任意选项更新", "_translated": true, "_saved_at": "2026-08-20T09:27:29+00:00", "_first_saved_at": "2026-08-20T07:35:49+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-4cf5-wzag"}, {"analysis_status": 0, "articles": [{"content": "跨站点请求伪造 (CSRF)通过利用网站对用户请求的信任进行攻击。当用户在网站A登录并在同一浏览器会话中访问网站B时，攻击者可以构造特制的请求并诱使用户执行，以使网站B误以为这些请求是用户合法发起的。\n攻击者通常通过欺骗用户点击恶意链接、在受信任的网站中植入恶意代码或通过钓鱼等手段来实施CSRF攻击，一旦用户执行了恶意请求，攻击者可以以用户的身份执行任意操作，包括更改用户密码、发起资金转账或删除重要数据等。", "title": "什么是CSRF"}, {"content": "- 链接欺骗：攻击者通过向用户发送包含恶意链接的电子邮件或社交媒体消息，诱使用户点击并执行恶意请求。\n- 图片引用攻击：攻击者通过在恶意网站上包含指向目标网站的图片引用，以触发用户浏览器自动发送目标网站的请求。\n- XSS利用：如果目标网站存在XSS漏洞，攻击者可以注入恶意脚本，以使用户在浏览器中执行恶意请求。", "title": "CSRF常见的攻击方式"}, {"content": "- 随机令牌：网站可以在每个请求中包含一个随机生成的令牌（CSRF Token），并验证该令牌的有效性，以确认请求的来源是合法的。\n- SameSite Cookie：使用SameSite属性来限制跨站点请求，将Cookie的发送限制在同一站点上，减少了跨站请求伪造的风险。\n- 双重验证：对于敏感操作，网站可以要求用户进行额外的验证，例如输入验证码、提供第二个因素的身份验证等。\n- 强化浏览器策略：网站可以设置Content-Security-Policy（CSP）头，限制浏览器执行恶意脚本的能力，减少CSRF攻击的风险。\n- 限制用户操作：网站可以要求用户在执行敏感操作之前进行明确的确认或授权，防止恶意请求被误触发。\n- 安全编码实践：开发人员应遵循安全编码实践，对用户输入进行适当的验证和过滤，防止恶意请求的注入。", "title": "如何预防CSRF"}], "cnvd_id": "", "cve_id": "CVE-2026-28164", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.6}]}, "cvss_score": 9.6, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:H/I:H/A:H", "cwe": "CWE-352", "description": "Easy Elementor Addons 是 HashThemes 发布的开源 WordPress 插件，基于 GPLv2 授权，用于为 Elementor 页面构建器提供附加组件、模板库与编辑器扩展。\n受影响版本中，模板库 Ajax 处理函数 EEAD_Templates_Manager::get_templates 与 insert_inner_template 仅通过 current_user_can('edit_posts') 判断能力，未调用 check_ajax_referer。未认证攻击者可诱导已登录且具备编辑权限的用户访问恶意页面，浏览器会携带受害者会话向 wp-admin/admin-ajax.php 发送 action 为 eead_get_templates 或 eead_inner_template 的请求。insert_inner_template 随后从请求中的 template 参数取出内容并调用 wp_insert_post，以受害者身份发布文章或模板。\n修复版本中通过在 get_templates 与 insert_inner_template 入口调用 check_ajax_referer('eead_editor_nonce', 'nonce')，并在编辑器前端脚本中随 Ajax 请求提交该 nonce，拒绝缺少合法来源校验的跨站请求。", "effects": [{"comp_name": "easy-elementor-addons", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.3.8)", "min_fixed_version": "2.3.8", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "CSRF", "kind_en": "跨站请求伪造 (CSRF)", "last_modified_time": "2026-08-20", "level": "Critical", "mps_id": "MPS-xczg-8t4s", "poc": false, "poc_url": [], "published_time": "2026-08-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-xczg-8t4s", "name": "https://www.oscs1024.com/hd/MPS-xczg-8t4s"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-28164", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-28164"}, {"url": "https://patchstack.com/database/wordpress/plugin/easy-elementor-addons/vulnerability/wordpress-easy-elementor-addons-plugin-2-3-7-cross-site-request-forgery-csrf-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Easy Elementor Addons CSRF漏洞", "_translated": true, "_saved_at": "2026-08-20T14:29:25+00:00", "_first_saved_at": "2026-08-20T14:29:25+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-xczg-8t4s"}, {"analysis_status": 0, "articles": [{"content": "应用程序在处理用户输入时的不完善或缺乏验证机制，所以攻击者能够通过向应用程序发送恶意输入，利用应用程序对输入数据的错误处理方式来注入自己的恶意代码。这些恶意代码会被应用程序误认为是合法的指令或数据，并在执行过程中被执行。", "title": "什么是代码注入"}, {"content": "应用程序使用可执行动态代码的函数来执行用户可控的参数，当应用程序对于用户输入过滤不完全时，攻击者可以注入恶意代码并控制代码执行流程。", "title": "代码注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对所有用户输入进行验证和过滤，确保只接受预期的有效输入。这包括对输入数据进行输入长度验证、类型检查和格式验证等。\r\n- 使用参数化查询或预编译语句：对于数据库查询操作，应该使用参数化查询或预编译语句，确保输入数据不会被误认为是执行代码。\r\n- 最小特权原则：应用程序在执行操作系统命令或动态代码时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。\r\n- 安全编码实践：开发人员应该采用安全编码实践，包括避免使用eval函数、避免拼接用户输入的字符串作为代码执行等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止代码注入攻击。", "title": "如何预防代码注入"}], "cnvd_id": "", "cve_id": "CVE-2026-72530", "cvss": {"cvssv31": [{"source": "vulnerability@kaspersky.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9}], "cvssv4": [{"source": "vulnerability@kaspersky.com", "vector": "CVSS:4.0/AV:N/AC:H/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.5}]}, "cvss_score": 9.5, "cvss_vector": "CVSS:4.0/AV:N/AC:H/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-94", "description": "TrueConf Server 是 TrueConf 提供的商业视频会议服务器软件，支持 Windows 与 Linux 部署，用于企业内部音视频会议与协作，并非开源组件。\n受影响版本中，未授权远程攻击者只要能够访问默认开放的 4307/TCP 端口，即可向服务器投递构造后的脚本。该脚本会在隔离环境中运行，io、os 等危险库在该环境中不可用，但攻击者可利用此代码注入缺陷突破隔离边界，并在宿主机上执行任意代码；Kaspersky 在公开攻击链中确认 Windows 场景可达 NT AUTHORITY\\SYSTEM，且攻击复杂度较高，可能需要多次尝试才能成功。\n修复版本中通过官方发布的 5.3.9、5.4.9 和 5.5.5 安全更新切断隔离环境逃逸与宿主机任意代码执行路径。公开资料未披露更细粒度的源码修改。", "effects": [{"comp_name": "TrueConf Server", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,5.3)", "min_fixed_version": "5.3", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[5.4,5.4.9)", "min_fixed_version": "5.4.9", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[5.3,5.3.9)", "min_fixed_version": "5.3.9", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[5.5,5.5.5)", "min_fixed_version": "5.5.5", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "代码注入", "kind_en": "代码生成控制不当（“代码注入”）", "last_modified_time": "2026-08-20", "level": "Critical", "mps_id": "MPS-stb6-n1l8", "poc": false, "poc_url": [], "published_time": "2026-08-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-stb6-n1l8", "name": "https://www.oscs1024.com/hd/MPS-stb6-n1l8"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-72530", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-72530"}, {"url": "https://ics-cert.kaspersky.com/advisories/2026/08/11/trueconf-server-breakout-from-isolated-environment/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "TrueConf隔离环境逃逸", "_translated": true, "_saved_at": "2026-08-19T19:19:52+00:00", "_first_saved_at": "2026-08-19T18:24:49+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-stb6-n1l8"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，从而导致未授权的用户或资源可以被访问或篡改。", "title": "什么是访问控制不当"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n", "title": "访问控制不当常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防访问控制不当"}], "cnvd_id": "", "cve_id": "CVE-2026-76310", "cvss": {}, "cvss_score": 9.4, "cvss_vector": "", "cwe": "CWE-284", "description": "Splunk Enterprise 是商业安全信息与事件管理平台，用于日志采集、索引、搜索与告警，产品闭源。\n受影响版本中，嵌入式报告访问未拦截 REST API 对搜索作业 dispatch archive 的下载请求。未认证攻击者在持有嵌入报告令牌的情况下，可下载对应搜索作业的调度归档并从中恢复会话材料，进而访问报告所有者权限范围内的全部相关数据并影响系统完整性；当报告所有者具备 admin 角色时，还可执行管理操作。\n修复版本中通过收紧嵌入式报告的授权边界，阻止嵌入令牌用于 REST API dispatch archive 下载，切断未认证用户从归档恢复会话材料并提升权限的路径。", "effects": [{"comp_name": "splunk", "ecosystem": "linux", "versions": [{"affected_version": "[9.4.0,9.4.14)", "min_fixed_version": "9.4.14", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[10.0.0,10.0.9)", "min_fixed_version": "10.0.9", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[10.4.0,10.4.2)", "min_fixed_version": "10.4.2", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[10.2.0,10.2.6)", "min_fixed_version": "10.2.6", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp WebhookDispatcher.php 的 httpPost 方法以 curl_init 初始化请求，但未设置 CURLOPT_PROTOCOLS 与 CURLOPT_REDIR_PROTOCOLS。拥有 api.webhooks.write 权限的账户可在 JSON body 中提交 file://、dict://、gopher://、或指向 127.0.0.0/8、RFC1918 私有网段、169.254.169.254 等保留地址的目标，cURL 会按提交的协议发起请求并把响应内容写入 deliveries 接口，攻击者可借此读取本地文件、利用 gopher 等协议探测内网服务，或窃取云实例元数据凭证。\n修复版本中通过在 WebhookController 中新增 validateWebhookUrl()，要求 URL 必须为 http/https 并调用 WebhookDispatcher::hostIsPublic() 拒绝解析至 loopback、RFC1918 私有网段、link-local 与其他保留段的主机；dispatch 时再次对解析后的目标主机做公网校验，curl_init 增加 CURLOPT_PROTOCOLS 与 CURLOPT_REDIR_PROTOCOLS 限制为 CURLPROTO_HTTP | CURLPROTO_HTTPS，从根因上切断非 HTTP(S) 协议及内网地址触发的 SSRF 路径。", "effects": [{"comp_name": "getgrav/grav-plugin-api", "ecosystem": "composer", "versions": [{"affected_version": "(-∞,1.0.6)", "min_fixed_version": "1.0.6", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SSRF", "kind_en": "服务器端请求伪造 (SSRF)", "last_modified_time": "2026-08-20", "level": "Critical", "mps_id": "MPS-xg7k-w06j", "poc": false, "poc_url": [], "published_time": "2026-08-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-xg7k-w06j", "name": "https://www.oscs1024.com/hd/MPS-xg7k-w06j"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-62668", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-62668"}, {"url": "https://github.com/getgrav/grav-plugin-api/commit/dfcc947f0d6758772caac290c68fe8d4c4a4874e", "name": ""}, {"url": "https://github.com/getgrav/grav-plugin-api/releases/tag/1.0.6", "name": ""}, {"url": "https://github.com/getgrav/grav/security/advisories/GHSA-58q8-f7v4-w2vf", "name": ""}], "scope_influence": "", "tags": ["php", "开源"], "title": "Grav API插件Webhook SSRF漏洞", "_translated": true, "_saved_at": "2026-08-19T17:21:20+00:00", "_first_saved_at": "2026-08-19T17:21:20+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-xg7k-w06j"}, {"analysis_status" re": 9.1}]}, "cvss_score": 9.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-754", "description": "Netty 是开源的异步事件驱动网络应用框架，被广泛用于构建高性能 Java 网络服务端与 TLS 中间件；漏洞组件 io.netty.handler.ssl.SslClientHelloHandler 是 Netty handler 模块中负责在 TLS 握身前根据 SNI 选择 SslContext 的公开扩展类。\n受影响版本中，io.netty.handler.ssl.SslClientHelloHandler#decode 在聚合跨多个 TLS 记录分片的 ClientHello 时使用了错误的偏移量来读取四字节 TLS 握手头，当攻击者将 4 字节握手头（即 HandshakeType + handshakeLength）跨越两个或更多 TLS 记录分片时，in.getUnsignedByte(readerIndex + SSL_RECORD_HEADER_LENGTH) 与 in.getUnsignedMedium(readerIndex + SSL_RECORD_HEADER_LENGTH + 1) 会越过可用缓冲区下标而抛 IndexOutOfBoundsException，异常路径进入 select(ctx, null) 分支，使处理器跳到默认 SslContext 而不是按 server_name 匹配的 SslContext。在仅以 per-SNI clientAuth=REQUIRE 作为唯一互信 TLS 校验手段、且默认 SslContext 配置为 clientAuth=NONE 或 clientAuth=OPTIONAL、又未在应用层额外校验客户端证书的部署中，未认证的远端攻击者可通过发送分片 ClientHello 绕过受保护路由的 mTLS 客户端证书校验要求。\n修复版本中通过重写 SslClientHelloHandler#decode 解决了该问题，新增 aggregatedBytes 与 handshakeLength 实例字段跟踪已聚合字节，在跨记录读取时先把 SSL_RECORD_HEADER 之后的负载字节累积到 handshakeBuffer，等 four-byte handshake header 与完整 handshakeLength 都在聚合缓冲中后再统一解析 handshakeType、handshakeLength 与 ClientHello 主体，并在 readerIndex + SSL_RECORD_HEADER_LENGTH + 4 仍超出 endOffset 时提前 return 等待更多数据、避免越界；索引不再越过合法下标，异常路径不再被触发，per-SNI SslContext 可被稳定选中。", "effects": [{"comp_name": "io.netty:netty", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,4.1.137.Final)", "min_fixed_version": "4.1.137.Final", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "(-∞,4.2.17.Final)", "min_fixed_version": "4.2.17.Final", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "对因果或异常条件的不恰当检查", "kind_en": "对异常或特殊情况的不当检查", "last_modified_time": "2026-08-20", 预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-62941", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.9}]}, "cvss_score": 9.9, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "cwe": "CWE-863", "description": "Incus 是开源的系统容器与虚拟机管理器（Apache-2.0，Go 语言实现，仓库 github.com/lxc/incus），用于在 Linux 主机上运行 LXC 容器与 QEMU 虚拟机，并通过项目（project）划分多租户资源与权限边界。\n受影响版本中，HTTP API 处理器 cmd/incusd/instances_post.go 中的 instancesPost 在处理跨项目实例复制（source.type=copy）请求时，先在 1440 行调用 project.AllowInstanceCreation 对 req 进行限制检查（此时 req.Config 尚未包含源实例配置），随后调用 createFromCopy（600 行）把源实例通过 InstanceIncludeWhenCopying 选出的所有非易失配置键合并进 req.Config，其中包含 security.privileged、raw.lxc、raw.apparmor 等本应由目标项目限制键拒绝的危险键；限制检查通过与危险配置合并之间存在时序差，导致攻击者可把受限项目当作目标复制一个带有 privileged/raw 配置的实例并启动，实现从受限项目逃逸到宿主机。\n修复版本中通过在 cmd/incusd/instances_post.go 的 createFromCopy 内完成源配置与设备合并之后再调用一次 project.AllowInstanceCreation 对合并后的完整 req 重新校验，切断利用链路；建议升级至 v7.3.0 及以上版本。", "effects": [{"comp_name": "github.com/lxc/incus", "ecosystem": "go", "versions": [{"affected_version": "(-∞,7.3.0)", "min_fixed_version": "7.3.0", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-08-21", "level": "Critical", "mps_id": "MPS-39kx-hf7a", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-39kx-hf7a", "name": "https://www.oscs1024.com/hd/MPS-39kx-hf7a"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-62941", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-62941"}, {"url": "https://github.com/lxc/incus/security/advisories/GHSA-mq9x-prm8-3vpw", "name": ""}], "scop 数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-62940", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.9}]}, "cvss_score": 9.9, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "cwe": "CWE-862", "description": "Incus 是开源的系统容器与虚拟机管理器（Apache-2.0 许可，GitHub: lxc/incus），基于 Go 语言开发，提供集群化的容器与虚拟机生命周期管理 API。\n受影响版本中，跨集群节点迁移实例时，POST /1.0/instances/{name}?target=\u003cnode\u003e 接口对应的 cmd/incusd/instance_post.go 中 instancePost 处理器在调用 migrateInstance 路径上，通过 maps.Copy(targetInstInfo.Config, req.Config) 与 maps.Copy(targetInstInfo.Devices, req.Devices) 把用户提交的配置、设备、profile 覆盖直接合并到目标实例配置，整个文件未调用 project.AllowInstanceUpdate、project.AllowInstanceCreation 等项目限制校验，并且目标节点经 instances_post.go 的集群通知重建实例时 AllowInstanceCreation 检查被显式跳过。受限项目内的攻击者可借此把 security.privileged=true 与 raw.lxc 等键注入目标实例，启动后获得特权容器并逃逸至宿主机 root。\n修复版本中通过在 migrateInstance 内 maps.Copy 合并用户覆盖之后、存储池覆盖处理之前，新增 project.AllowInstanceUpdate(tx, inst.Project().Name, inst.Name(), targetInstInfo.Writable(), inst.LocalConfig()) 项目限制校验，对最终生效的 Writable 配置强制走项目规则，从而切断受限键在迁移路径上落地的因果链。", "effects": [{"comp_name": "github.com/lxc/incus/v7/cmd/incusd", "ecosystem": "go", "versions": [{"affected_version": "(-∞,7.3.0)", "min_fixed_version": "7.3.0", "repository": "go", "solutions": [], "upstream" stance_metadata.go 中 instanceMetadataGet、instanceMetadataPatch 与 doInstanceMetadataUpdate 对 metadata.yaml 的访问全部替换为基于 os.OpenRoot(inst.Path()) 的 root.Open(\"metadata.yaml\") 与 root.WriteFile(...) 调用，把符号链接解析限制在实例根目录之内，从而切断了从恶意镜像元数据到宿主任意文件的路径穿越链。", "effects": [{"comp_name": "github.com/lxc/incus", "ecosystem": "go", "versions": [{"affected_version": "[0,7.3.0)", "min_fixed_version": "7.3.0", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "文件名或路径的外部可控制", "kind_en": "文件名或路径的外部控制", "last_modified_time": "2026-08-21", "level": "Critical", "mps_id": "MPS-dqhx-lc8u", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-dqhx-lc8u", "name": "https://www.oscs1024.com/hd/MPS-dqhx-lc8u"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-63343", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-63343"}, {"url": "https://github.com/lxc/incus/security/advisories/GHSA-fmjx-5j3g-997p", "name": ""}], "scope_influence": "", "tags": ["go"], "title": "Incus 镜像元数据符号链接路径穿越漏洞", "_translated": true, "_saved_at": "2026-08-21T16:25:27+00:00", "_first_saved_at": "2026-08-21T16:25:27+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-dqhx-lc8u"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-62867", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.9}]}, "cvss_score": 9.9, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "cwe": "CWE-88", "description": "Incus 是开源的系统容器与虚拟机管理器，其存储卷配置允许通过 block.create_options 等控制项把额外参数透传到底层 mkfs 等文件系统创建工具。\n受影响版本中，cmd/incusd/storage_volumes.go 的 storagePoolVolumesPost HTTP handler 仅依赖 auth.EntitlementCanCreateStorageProjects（项目级权限而非服务端管理员权限）作为访问控制；请求中携带的 block.create_options 在 driver_lvm_volumes.go 等驱动内以 validate.IsAny（无任何校验）方式登记，并经 vol.ExpandedConfig(\"block.create_options\") 取出后传入 internal/server/storage/drivers/utils.go 中 makeFSType 的 mkfsOptions.ExtraArgs。makeFSType 通过 strings.Fields(fsOptions.ExtraArgs) 拆分后追加到 cmd 切片，再由 subprocess.TryRunCommand(cmd[0], cmd[1:]...) 以 root 身份执行 mkfs 等工具，使得仅具备项目级 can_create_storage_volumes 权限的用户即可向 mkfs 等命令注入任意参数（例如 XFS 的 `-p /etc/shadow`），从而读取敏感文件、破坏文件系统，或在所调用工具支持的前提下进一步升级为命令执行。\n修复版本中通过提交 041269ff2670e235faa49e3c973de657ace3f28d 在 internal/server/project/permissions.go 的 AllowVolumeCreation 中加入判断：当项目设置 restricted=true 时，若请求体 Config[\"block.create_options\"] 非空且与池配置 volume.block.create_options 默认值不一致即返回错误，切断受限项目用户覆写 mkfs 命令行的路径，从而限制项目级权限对 mkfs 等特权进程的参数影响面。", "effects": [{"comp_name": "github.com/lxc/incus", "ecosystem": "go", "versions": [{"affected_version": "(-∞,7.3.0)", "min_fixed_version": "7.3.0", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "参数注入或修改", "kind_en": "命令中参数分隔符的不正确中和（“参数注入”）", "last_modified_time": "2026-08-21", "level": "Critical", "mps_id": "MPS-exus-jvky", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-exus-jvky", "name": "https://www.oscs1024.com/hd/MPS-exus-jvky"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-62867", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-62867"}, {"url": "https://github.com/lxc/incus/security/advisories/GHSA-q7xw-r4w2-2wcm", "name": ""}], "scope_influence": "", "tags": ["go"], "title": "Incus 存储卷 block.create_options 参数注入漏洞", "_translated": true, "_saved_at": "2026-08-21T16:25:29+00:00", "_first_saved_at": "2026-08-21T16:25:29+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-exus-jvky"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-63125", "cvss": {"cvssv31": [{"source": "security-a ncus backup.yaml 符号链接主机任意写漏洞", "_translated": true, "_saved_at": "2026-08-21T16:25:25+00:00", "_first_saved_at": "2026-08-21T16:25:25+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-n0yt-48lh"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，从而导致未授权的用户或资源可以被访问或篡改。", "title": "什么是访问控制不当"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n", "title": "访问控制不当常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防访问控制不当"}], "cnvd_id": "", "cve_id": "CVE-2026-66788", "cvss": {"cvssv31": [{"source": "secalert@redhat.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.9}]}, "cvss_score": 9.9, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "cwe": "CWE-284", "description": "Lighthouse 中发现了一个缺陷。远程攻击者通过破坏分支集群，可以利用其中资源注入的目标命名空间源自代理对象上由攻击者控制的标签或注释的漏洞。这使得攻击者可以将未经授权的 EndpointSlices 和 ServiceImports 注入对等集群上的任何命名空间，包括 kube-system 和 openshift-* 等关键系统命名空间。这可能会导致集群内的权限升级或其他形式的系统危害。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "访问控制不当", "kind_en": "访问控制不当", "last_modified_time": "2026-08-21", "level": "Critical", "mps_id": "MPS-tecw-s9in", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-tecw-s9in", "name": "https://www.oscs1024.com/hd/MPS-tecw-s9in"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-66788", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-66788"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-66788", "name": ""}, {"url": "https://bugzilla.redhat.com/show_bug.cgi?id=2507533", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-66788漏洞", "_translated": true, "_saved_at": "2026-08-20T20:21:37+00:00", "_first_saved_at": "2026-08-20T20:21:37+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-tecw-s9in"}, {"analysis_status": 0, "articles": [{"content": "应用程序在处理用户输入时的不完善或缺乏验证机制，所以攻击者能够通过向应用程序发送恶意输入，利用应用程序对输入数据的错误处理方式来注入自己的恶意代码。这些恶意代码会被应用程序误认为是合法的指令或数据，并在执行过程中被执行。", "title": "什么是代码注入"}, {"content": "应用程序使用可执行动态代码的函数来执行用户可控的参数，当应用程序对于用户输入过滤不完全时，攻击者可以注入恶意代码并控制代码执行流程。", "title": "代码注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对所有用户输入进行验证和过滤，确保只接受预期的有效输入。这包括对输入数据进行输入长度验证、类型检查和格式验证等。\r\n- 使用参数化查询或预编译语句：对于数据库查询操作，应该使用参数化查询或预编译语句，确保输入数据不会被误认为是执行代码。\r\n- 最小特权原则：应用程序在执行操作系统命令或动态代码时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。\r\n- 安全编码实践：开发人员应该采用安全编码实践，包括避免使用eval函数、避免拼接用户输入的字符串作为代码执行等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止代码注入攻击。", "title": "如何预防代码注入"}], "cnvd_id": "", "cve_id": "CVE-2026-77647", "cvss": {"cvssv31": [{"source": "cve@mitre.org", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-94", "description": "4.4.20 之前的 SPIP 允许未经身份验证的远程攻击者执行任意代码，正如 2026 年 8 月在野外利用的那样。这与 \u003c?php 块的错误识别以及 var_export 对某些情况（例如存在“\u003c”字符）的错误处理有关。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "代码注入", "kind_en": "代码生成控制不当（“代码注入”）", "last_modified_time": "2026-08-21", "level": "Critical", "mps_id": "MPS-2clr-f48d", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-2clr-f48d", "name": "https://www.oscs1024.com/hd/MPS-2clr-f48d"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-77647", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-77647"}, {"url": "https://blog.s , "scope_influence": "", "tags": [], "title": "CVE-2026-77650漏洞", "_translated": true, "_saved_at": "2026-08-21T03:44:40+00:00", "_first_saved_at": "2026-08-21T02:22:20+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-bu0n-1wq6"}, {"analysis_status": 0, "articles": [{"content": "应用程序在处理用户输入时的不完善或缺乏验证机制，所以攻击者能够通过向应用程序发送恶意输入，利用应用程序对输入数据的错误处理方式来注入自己的恶意代码。这些恶意代码会被应用程序误认为是合法的指令或数据，并在执行过程中被执行。", "title": "什么是代码注入"}, {"content": "应用程序使用可执行动态代码的函数来执行用户可控的参数，当应用程序对于用户输入过滤不完全时，攻击者可以注入恶意代码并控制代码执行流程。", "title": "代码注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对所有用户输入进行验证和过滤，确保只接受预期的有效输入。这包括对输入数据进行输入长度验证、类型检查和格式验证等。\r\n- 使用参数化查询或预编译语句：对于数据库查询操作，应该使用参数化查询或预编译语句，确保输入数据不会被误认为是执行代码。\r\n- 最小特权原则：应用程序在执行操作系统命令或动态代码时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。\r\n- 安全编码实践：开发人员应该采用安全编码实践，包括避免使用eval函数、避免拼接用户输入的字符串作为代码执行等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止代码注入攻击。", "title": "如何预防代码注入"}], "cnvd_id": "", "cve_id": "CVE-2026-77806", "cvss": {"cvssv31": [{"source": "cve@mitre.org", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-94", "description": "SPIP 是开源 PHP 内容管理系统（CMS），采用 GPL 许可证，主要用于网站发布与协作编辑，源代码托管在 git.spip.net，亦以 composer 包 spip/spip 发布。\n受影响版本中，模板引擎的 analyse_resultat_skel 函数在解析编译后的模板 body 时，会按 #HTTP_HEADER / X-Spip-Filtre 形式匹配 header() 调用并把 | 链上的函数当作模板过滤器链执行。攻击者在访问 spip.php 的 GET 请求中，向任意参数值注入换行字符即可把 header(\"X-Spip-Filtre: ...\") 调用直接嵌入编译后的 PHP 模板；过滤器链 intval|_request|system 使 intval 把页面 body 规约为字符串 \"0\"，_request 读取同名 POST 参数（键为 \"0\"）取出待执行命令，system 直接执行命令，从而实现未认证远程代码执行，2026 年 8 月已在野利用。\n修复版本中通过在 analyse_resultat_skel 内限制 X-Spip-Filtre 仅在受控的 #HTTP_HEADER 标签上下文内被捕获，移除对不可信模板片段中任意函数链的自动调用，关闭 header 注入与链式过滤器调用路径，4.4.21 及以上版本不再受该漏洞影响。", "effects": [{"comp_name": "spip/spip", "ecosystem": "composer", "versions": [{"affected_version": "(-∞,4.4.21)", "min_fixed_version": "4.4.21", "repository": "composer", "solutions": [], "upstream": true ccess / web.config / .user.ini 完整基名比对、对每次净化后的最终文件名再做一次复核，并在 dnd_cf7_not_allowed_ext() 中加入 web.config，从源头阻止任何最终名包含可执行扩展或可改写服务器配置的关键基名的上传落到磁盘。", "effects": [{"comp_name": "drag-and-drop-multiple-file-upload-contact-form-7", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.3.9.9)", "min_fixed_version": "1.3.9.9", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "代码注入", "kind_en": "代码生成控制不当（“代码注入”）", "last_modified_time": "2026-08-21", "level": "Critical", "mps_id": "MPS-u05j-alro", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-u05j-alro", "name": "https://www.oscs1024.com/hd/MPS-u05j-alro"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-18781", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-18781"}, {"url": "https://wpscan.com/vulnerability/fb59519b-80ae-48e4-a31a-71d24ded205b/", "name": ""}], "scope_influence": "", "tags": [], "title": "Contact Form 7 拖放上传插件文件名绕过导致 RCE", "_translated": true, "_saved_at": "2026-08-21T09:30:12+00:00", "_first_saved_at": "2026-08-21T08:32:39+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-u05j-alro"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-77086", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.1}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.4}]}, "cvss_score": 9.4, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-22", "description": "SiYuan 是开源的个人知识管理与笔记系统，使用 Go 编写的 kernel 服务提供 HTTP API，并通过 Bazaar 集市管理插件、主题、图标、模板与挂件等扩展。\n受影响版本中，kernel/model/bazaar.go 的 getPackageInstallPath 函数将请求参数 packageName 与基础目录通过 filepath.Join 直接拼接，未校验是否包含 ../ 等路径遍历序列，导致全部 10 个 Bazaar 安装/卸载接口（POST /api/bazaar/installBazaarPlugin、uninstallBazaarPlugin、installBazaarWidget、uninstallBazaarWidget、installBazaarIcon、uninstallBazaarIcon、installBazaarTemplate、uninstallBazaarTemplate、installBazaarTheme、uninstallBazaarTheme）在收到形如 ../../../../target 的 packageName 时，安装流程会将下载的压缩包写入任意目录，卸载流程会调用 os.RemoveAll 递归删除任意目录。\n修复版本中通过在 getPackageInstallPath 入口新增 bazaar.IsValidPackageName 包名合法性校验，并结合 gulu.File.IsSubPath 对最终路径进行容器归属校验，使 ../ 等序列在路径构造阶段即被拒绝，从而切断任意位置文件写入与任意目录递归删除链路。", "effects": [{"comp_name": "github.com/siyuan-note/siyuan/kernel", "ecosystem": "go", "versions": [{"affected_version": "(-∞,3.7.4)", "min_fixed_version": "3.7.4", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制 "2026-08-21T16:25:13+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-qhlp-82tm"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-77087", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.6}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.4}]}, "cvss_score": 9.4, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-862", "description": "Paperclip是开源的AI智能体管理与编排平台，使用TypeScript/Node.js构建，提供本地与多租户部署模式，用于调度本地编码代理与远程托管代理。\n受影响版本中，Paperclip在默认的local_trusted部署模式下，server/src/middleware/auth.ts的第24-27行对所有请求自动赋予isInstanceAdmin为true的本地板级actor，且server/src/middleware/private-hostname-guard.ts仅在authenticated与private模式下启用，导致服务器完全不校验请求的Host头部。攻击者只需诱导本地运行Paperclip的开发者访问包含恶意JavaScript的网页即可触发DNS重新绑定：浏览器先连接攻击者服务器获取页面，攻击者服务器关闭后JS脚本对rebind.attacker.com:3100发起fetch请求，浏览器回退到该域名A记录中的第二个IP即127.0.0.1，到达本地Paperclip服务端；同源策略下可调用POST /api/companies/import与POST /api/agents/:id/wakeup，通过server/src/adapters/process/execute.ts中无沙箱的spawn()执行任意系统命令，实现零点击、零凭证的远程代码执行。\n修复版本中通过将privateHostnameGuard中间件对local_trusted部署模式一并启用，以仅放行Host头部匹配localhost、127.0.0.1与[::1]的请求，阻断攻击者域名的DNS重新绑定回环到本地端口，同时保持local_trusted模式下的本机开发体验。", "effects": [{"comp_name": "paperclipai", "ecosystem": "npm", "versions": [{"affected_version": "(-∞,0.3.1)", "min_fixed_version": "0.3.1", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-08-21", "level": "Critical", "mps_id": "MPS-worz-bn1m", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-worz-bn1m", "name": "https://www.oscs1024.com/hd/MPS-worz-bn1m"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-77087", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-77087"}, {"url": "https://github.com/paperclipai/paperclip/security/advisories/GHSA-x8hx-rhr2-9rf7", "name": ""}, {"url": "https://www.vulncheck.com/advisories/paperclip-before-remote-code-execution-via-dns-rebinding", "name": ""}], "scope_influence": "", "tags": ["AI", "npm", "开源"], "title": "Paperclip本地信任模式DNS重新绑定远程代码执行漏洞", "_translated": true, "_saved_at": "2026-08-21T17:22:41+00:00", "_first_saved_at": "2026-08-21T16:25:15+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-worz-bn1m"}, {"analysis_status": 3, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-59270", "cvss": {"cvssv31": [{"source": "murphysec", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:L", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvs 意数据，导致缓冲区溢出，从而破坏程序的内存管理，实现代码执行的目的。\n- 格式字符串攻击：攻击者通过在序列化过程中输入恶意数据，导致程序使用错误的格式字符串，从而实现代码执行的目的。\n- 数据流攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码作为一个数据流传递给程序，从而实现代码执行的目的。\n", "title": "反序列化常见的攻击方式"}, {"content": "- 不信任输入数据：程序应该严格检查输入数据的有效性，并避免使用不受信任的数据。\n- 使用安全的序列化机制：程序应该使用安全的序列化机制，如 JSON 或 XML 序列化，而不是第三方序列化库。\n- 最小特权原则：程序应该限制对受信任数据的处理权限，并避免在运行时修改数据。\n- 代码审查和漏洞扫描：程序应该进行代码审查和漏洞扫描，以发现和修复潜在的安全漏洞。\n", "title": "如何预防反序列化"}], "cnvd_id": "", "cve_id": "CVE-2026-77645", "cvss": {"cvssv4": [{"source": "0b655efc-079c-4cb9-9e8d-164871239f4e", "vector": "CVSS:4.0/AV:N/AC:H/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:L/SI:L/SA:L/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:Y/R:U/V:C/RE:M/U:Red", "severity": "critical", "base_score": 9.2}]}, "cvss_score": 9.2, "cvss_vector": "CVSS:4.0/AV:N/AC:H/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:L/SI:L/SA:L/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:Y/R:U/V:C/RE:M/U:Red", "cwe": "CWE-502", "description": "PTC Windchill 和 PTC FlexPLM 中报告了严重的远程代码执行 (RCE) 漏洞。该漏洞可能通过不可信数据的反序列化被利用。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "反序列化", "kind_en": "不可信数据的反序列化", "last_modified_time": "2026-08-21", "level": "Critical", "mps_id": "MPS-usyg-net5", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-usyg-net5", "name": "https://www.oscs1024.com/hd/MPS-usyg-net5"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-77645", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-77645"}, {"url": "https://www.ptc.com/en/support/article/CS474826", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-77645漏洞", "_translated": true, "_saved_at": "2026-08-21T00:56:58+00:00", "_first_saved_at": "2026-08-20T23:19:55+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-usyg-net5"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-76613", "cvss": {"cvssv4": [{"source": "security@joomla.org", "vector": "CVSS:4.0/AV:N/AC:H/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.2}]}, "cvss_score": 9.2, "cvss_vector": "CVSS:4.0/AV:N/AC:H/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-89", "description": "YOOtheme Pro 是商业 Joomla 扩展，提供可视化页面构建与内容模板能力，属于闭源商业软件。\n受影响版本中，扩展在处理 contributor 级别用户可控的字段时未对 SQL 查询进行充分过滤或参数化，导致具备 contributor 权限的认证用户可在提交内容中注入 SQL 片段并被带入查询执行，造成数据库层信息泄露或篡改。\n修复版本中通过收紧对用户可控字段的 SQL 处理，使用占位符参数化或类型校验切断注入路径，使 contributor 级别的输入无法再进入危险查询上下文。", "effects": [{"comp_name": "yootheme_pro", "ecosystem": "linux", "versions": [{"affected_version": "[1.0.0,5.0.40]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-08-21", "level": "Critical", "mps_id": "MPS-yuqk-1570", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-yuqk-1570", "name": "https://www.oscs1024.com/hd/MPS-yuqk-1570"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-76613", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-76613"}, {"url": "https://www.yootheme.com/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "YOOtheme Pro SQL注入漏洞", "_translated": true, "_saved_at": "2026-08-21T15:26:40+00:00", "_first_saved_at": "2026-08-21T13:40:21+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-yuqk-1570"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-73256", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N", "severity": "critical", "base_score": 9.1}]}, "cvss_score": 9.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N", "cwe": "CWE-444", "description": "Mongoose 是一个嵌入式 Web 服务器和网络库。在 7.22 之前，未经身份验证的远程攻击者可以通过发送带有 Transfer-Encoding：分块和冲突帧的请求来利用 HTTP/1.0 反向代理部署。 src/http.c 中的 http_cb() 函数以不可能的大于八的条件测试 hm.proto.len，即使 mg_http_parse() 需要八字节协议字符串，因此永远不会设置 is_http_1_0。 Mongoose 因此会处理 HTTP/1.0 代理可以忽略的分块编码，从而实现请求走私和未经授权的访问或状态更改。此问题已在 7.22 版本中修复。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "HTTP请求走私", "kind_en": "HTTP 请求的解释不一致（“HTTP 请求/响应走私”）", "last_modified_time": "2026-08-21", "level": "Critical", "mps_id": "MPS-f1wd-upsj", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-f1wd-upsj", "name": "https://www.oscs1024.com/hd/MPS-f1wd-upsj"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73256", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73256"}, {"url": "https://github.com/cesa ": "https://github.com/cesanta/mongoose/releases/tag/7.22", "name": ""}, {"url": "https://github.com/cesanta/mongoose/security/advisories/GHSA-5wfq-r6mr-wqp6", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-73257漏洞", "_translated": true, "_saved_at": "2026-08-20T19:25:51+00:00", "_first_saved_at": "2026-08-20T19:25:51+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-gfa1-l2cq"}, {"analysis_status": 0, "articles": [], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-75501", "cvss": {}, "cvss_score": 9.1, "cvss_vector": "", "cwe": "CWE-306", "description": "Calix GS7 XGS (GS5239XG) 是运营商面向住宅用户部署的网关设备，运行 Calix 自有的 EXOS 固件，提供路由、NAT 和防火墙功能，固件内置的 UPnP 服务基于 MiniUPnPd 2.3.7 实现，用于 LAN 侧的自动端口映射。\n受影响版本中，EXOS 6.6.47 固件把 MiniUPnPd 的 UPnP IGD WANIPConnection SOAP 控制端点绑定到 WAN 侧接口的 TCP 5000，并且没有对该服务施加访问控制。MiniUPnPd 中处理 AddPortMapping、DeletePortMapping、GetGenericPortMappingEntry 与 GetExternalIPAddress 这几个 WANIPConnection 动作的 SOAP 请求处理器在收到 WAN 上到达的 SOAP 报文时会无条件信任请求来源，攻击者只要知道设备的公网 IP，就可以远程伪造 SOAP 调用来新增、删除或枚举 NAT 端口映射并查询设备的外网地址，效果等同于直接在防火墙上打洞，将 LAN 内部服务直接暴露到公网。\n修复版本中通过将 MiniUPnPd 的控制端点绑定仅限定到 LAN 接口、并在防火墙策略上禁止外部对 TCP 5000 的访问解决了该问题；CERT/CC 公告同时指出 Calix 暂未发布固件更新，受影响用户应在管理界面禁用 UPnP，或在网关和上游同时阻断对 TCP 5000 的入站流量。", "effects": [{"comp_name": "Calix GS7 XGS (GS5239XG) running EXOS firmware", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,6.6.47]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "关键功能的认证机制缺失", "kind_en": "缺少关键功能的身份验证", "last_modified_time": "2026-08-21", "level": "Critical", "mps_id": "MPS-m728-9a1w", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-m728-9a1w", "name": "https://www.oscs1024.com/hd/MPS-m728-9a1w"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-75501", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-75501"}, {"url": "https://drkq.github.io/security-research/calix-vu756733/", "name": ""}, {"url": "https://kb.cert.org/vuls/id/756733", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Calix GS7 XGS 住宅路由器 UPnP WANIPConnection 未认证远程访问漏洞", "_translated": true, "_saved_at": "2026-08-21T16:25:18+00:00", "_first_saved_at": "2026-08-21T16:25:18+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-m728-9a1w"}, {"analysis_status": 0, "articles": [], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-63046", "cvss": {}, "cvss_score": 9, "cvss_vector": "", "cwe": "CWE-88", "description": "Apache InLong 是 Apache 软件基金会旗下的一站式海量数据集成服务，提供数据采集、传输、聚合与排序能力，相关代码以 Java 实现并在 GitHub 上以 Apache-2.0 协议开源。\n受影响版本中，Manager 端的 ModuleController 公开 REST 接口允许具备 INLONG_ADMIN 角色的调用方在 ModuleRequest 中写入任意 startCommand / stopCommand / checkCommand / installCommand / uninstallCommand 字符串；该请求经 ModuleServiceImpl.save / update 持久化至 Manager 数据库后，Agent 端的 ModuleManager 在 installModule / startModule / stopModule / uninstallModule / isProcessAllStarted 等方法中，将这些字符串原样传入 org.apache.inlong.agent.utils.ExcuteLinux.exeCmd(String)，而后者内部使用 /bin/sh -c 派生子进程，整个调用链既无 shell 元字符过滤也无 argv[0] 白名单校验。攻击者只需在命令字符串中拼接 ; | \u0026 $( ) 等 shell 元字符或附加任意可执行文件名，即可在所有部署了该模块的 Agent 主机上以运行 Agent 进程的系统权限执行任意 shell 命令，构成由 Manager 管理员凭证通向 Agent 节点完整控制权的提权 / 远程代码执行路径。\n修复版本中通过PR #12151 将 ExcuteLinux 改造为基于 ProcessBuilder 的 argv 数组入口 exeCmd(String[]) / exeCmd(List,File,long) 与链式 exePipedCmd，彻底移除 /bin/sh -c 调用，并新增 ModuleCommandValidator 与 AllowedRootsResolver 在 Agent 端执行前对 argv[0]、元字符与工作目录根路径做白名单与路径根校验；同时 PR #12155 在 ModuleServiceImpl.save / update 中调用 ModuleCommandValidator.validateOnSave / validateOnUpdate 进行保存前白名单校验，发现违规时通过 ErrorCodeEnum.MODULE_COMMAND_NOT_IN_WHITELIST 抛出 BusinessException，从源头阻断非法命令进入持久化与执行链。", "effects": [{"comp_name": "org.apache.inlong:inlong-agent", "ecosystem": "maven", "versions": [{"affected_version": "[2.0.0,2.4.0)"
