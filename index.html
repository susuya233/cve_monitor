": "如何预防空指针取消引用"}], "cnvd_id": "", "cve_id": "CVE-2026-73547", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-476", "description": "Envoy 是面向云原生应用的开源边缘与服务代理，HTTP ext_authz 过滤器负责调用外部授权服务，并按授权结果改写下游请求。\n受影响版本中，Filter::onComplete 在应用授权响应中的 query_parameters_to_set 或 query_parameters_to_remove 时，未检查 request_headers_-\u003ePath() 是否为空便调用 value() 解析查询串。不含 :path 伪头的 CONNECT 请求会使 Path() 返回空指针，解引用后导致 Envoy 进程崩溃。未认证的下游客户端在部署接受无路径 CONNECT 且授权响应启用查询参数变更时可以触发该拒绝服务。\n修复版本中通过 modifyQueryParameters 在解析查询串前判断 request_headers.Path() 是否为空，切断该空指针解引用。路径为空且开启变更校验时拒绝本次变更，未开启校验时忽略查询参数变更并继续处理请求，避免进程异常退出。", "effects": [{"comp_name": "envoy", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.36.10)", "min_fixed_version": "1.36.10", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[1.37.0,1.37.6)", "min_fixed_version": "1.37.6", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[1.38.0,1.38.4)", "min_fixed_version": "1.38.4", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[1.39.0,1.39.1)", "min_fixed_version": "1.39.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "空指针取消引用", "kind_en": "空指针取消引用", "last_modified_time": "2026-09-22", "level": "High", "mps_id": "MPS-u9il-qnyo", "poc": false, "poc_url": [], "published_time": "2026-09-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-u9il-qnyo", "name": "https://www.oscs1024.com/hd/MPS-u9il-qnyo"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73547", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73547"}, {"url": "https://github.com/envoyproxy/envoy/security/advisories/GHSA-87ph-jqwm-pg6r", "name": "https://github.com/envoyproxy/envoy/security/advisories/GHSA-87ph-jqwm-pg6r"}, {"url": "https://github.com/envoyproxy/envoy/commit/064af2e61d0d1c421490d9e3e6e643c5d117ffe4", "name": "https://github.com/envoyproxy/envoy/commit/064af2e61d0d1c421490d9e3e6e643c5d117ffe4"}, {"url": "https://github.com/envoyproxy/envoy/commit/5f3b8e9b2b8a787a63202d35bb38820f3e9271fe", "name": "https://github.com/envoyproxy/envoy/commit/5f3b8e9b2b8a787a63202d35bb38820f3e9271fe"}, {"url": "https://github.com/envoyproxy/envoy/commit/838f8ffd9d7b5217682a22ee33470d4c7afb7e98", "name": "https://github.com/envoyproxy/envoy/commit/838f8ffd9d7b5217682a22ee33470d4c7afb7e98"}, {"url": "https://github.com/envoyproxy/envoy/commit/c3170d7c747e51bb8254378ea89afc03d3e71929", "name": "https://github.com/envoyproxy/envoy/commit/c3170d7c747e51bb8254378ea89afc03d3e71929"}, {"url": "https://github.com/envoyproxy/envoy/releases/tag/v1.36.10", "name": "https://github.com/envoyproxy/envoy/releases/tag/v1.36.10"}, {"url": "https://github.com/envoyproxy/envoy/releases/tag/v1.37.6", "name": "https://github.com/envoyproxy/envoy/releases/tag/v1.37.6"}, {"url": "https://github.com/envoyproxy/envoy/releases/tag/v1.38.4", "name": "https://github.com/envoyproxy/envoy/releases/tag/v1.38.4"}, {"url": "https://github.com/envoyproxy/envoy/releases/tag/v1.39.1", "name": "https://github.com/envoyproxy/envoy/releases/tag/v1.39.1"}], "scope_influence": "", "tags": ["应用软件"], "title": "Envoy授权过滤器空指针", "_translated": true, "_saved_at": "2026-09-21T21:33:57+00:00", "_first_saved_at": "2026-09-21T21:33:57+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-u9il-qnyo"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "cnvd_id": "", "cve_id": "CVE-2026-73512", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-416", "description": "Envoy 是开源云原生边缘与服务代理，负责在云原生环境中转发 HTTP 与 HTTP/3/QUIC 流量。\n受影响版本中，启用 Capsule Protocol 后 HttpDatagramHandler 在 useCapsuleProtocol() 中把当前 RequestDecoder 缓存为裸指针。内部重定向等流重建路径会替换 ActiveStream 并更新 EnvoyQuicServerStream，但不会刷新该缓存。后续 HTTP/3 datagram 从 OnHttp3Datagram 进入 decodeCapsule，对已释放解码器调用 decodeData，造成非法虚调用并使进程崩溃。\n修复版本中通过把解码器引用改为 StreamDecoderProvider，在 decodeCapsule 使用前重新解析当前 RequestDecoder，切断流重建后继续访问已释放对象的路径。", "effects": [{"comp_name": "envoy", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.36.10)", "min_fixed_version": "1.36.10", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[1.39.0,1.39.1)", "min_fixed_version": "1.39.1", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[1.38.0,1.38.4)", "min_fixed_version": "1.38.4", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[1.37.0,1.37.6)", "min_fixed_version": "1.37.6", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "UAF", "kind_en": "免费后使用", "last_modified_time": "2026-09-22", "level": "High", "mps_id": "MPS-uoxg-t8r5", "poc": false, "poc_url": [], "published_time": "2026-09-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-uoxg-t8r5", "name": "https://www.oscs1024.com/hd/MPS-uoxg-t8r5"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73512", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73512"}, {"url": "https://github.com/envoyproxy/envoy/security/advisories/GHSA-r6j2-mrm5-72mg", "name": "https://github.com/envoyproxy/envoy/security/advisories/GHSA-r6j2-mrm5-72mg"}, {"url": "https://github.com/envoyproxy/envoy/commit/29dbaae4a9971011e2f1948acfaf383296e901ea", "name": "https://github.com/envoyproxy/envoy/commit/29dbaae4a9971011e2f1948acfaf383296e901ea"}, {"url": "https://github.com/envoyproxy/envoy/commit/85495163fdc67364a5258bfe478c34a44f6428b4", "name": "https://github.com/envoyproxy/envoy/commit/85495163fdc67364a5258bfe478c34a44f6428b4"}, {"url": "https://github.com/envoyproxy/envoy/commit/c0e46dabc3ac286bbe608e9274776555911aadb9", "name": "https://github.com/envoyproxy/envoy/commit/c0e46dabc3ac286bbe608e9274776555911aadb9"}, {"url": "https://github.com/envoyproxy/envoy/commit/f2417eec2ff49abe243d484ded916fbc2faca38d", "name": "https://github.com/envoyproxy/envoy/commit/f2417eec2ff49abe243d484ded916fbc2faca38d"}, {"url": "https://github.com/envoyproxy/envoy/releases/tag/v1.36.10", "name": "https://github.com/envoyproxy/envoy/releases/tag/v1.36.10"}, {"url": "https://github.com/envoyproxy/envoy/releases/tag/v1.37.6", "name": "https://github.com/envoyproxy/envoy/releases/tag/v1.37.6"}, {"url": "https://github.com/envoyproxy/envoy/releases/tag/v1.38.4", "name": "https://github.com/envoyproxy/envoy/releases/tag/v1.38.4"}, {"url": "https://github.com/envoyproxy/envoy/releases/tag/v1.39.1", "name": "https://github.com/envoyproxy/envoy/releases/tag/v1.39.1"}], "scope_influence": "", "tags": ["应用软件"], "title": "Envoy数据报释放后使用", "_translated": true, "_saved_at": "2026-09-21T21:34:03+00:00", "_first_saved_at": "2026-09-21T21:34:03+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-uoxg-t8r5"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-73546", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:N", "severity": "high", "base_score": 7.4}]}, "cvss_score": 7.4, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:N", "cwe": "CWE-79", "description": "Envoy 是开源的云原生边缘与服务代理，用于转发流量并提供管理接口查看运行统计。\n受影响版本中，管理接口 /stats?format=html 使用 StatsHtmlRender 输出统计项，字符串统计值会经 Html::Utility::sanitize 处理，统计项名称却被原样写入 HTML。当 grpc_stats 将 stats_for_all_methods 设为 true 时，GrpcStatsFilter::decodeHeaders 把请求的 headers.Path() 交给 resolveDynamicServiceAndMethod，攻击者可控的路径片段进入缓存的动态统计名称；浏览器或自动化工具打开该 HTML 统计页时，未编码名称在管理接口源站下执行脚本，并可发起同源特权请求。\n修复版本中通过在 StatsHtmlRender::generate 写出统计项名称前调用 Html::Utility::sanitize，并默认启用运行时开关 envoy.reloadable_features.sanitize_html_stats_names，对包含 HTML 特殊字符的名称进行编码，阻止名称中的标记在统计页执行。", "effects": [{"comp_name": "envoy", "ecosystem": "linux", "versions": [{"affected_version": "[1.38.0,1.38.4)", "min_fixed_version": "1.38.4", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[1.39.0,1.39.1)", "min_fixed_version": "1.39.1", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,1.36.10)", "min_fixed_version": "1.36.10", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[1.37.0,1.37.6)", "min_fixed_version": "1.37.6", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-09-22", "level": "High", "mps_id": "MPS-41so-pjyt", "poc": false, "poc_url": [], "published_time": "2026-09-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-41so-pjyt", "name": "https://www.oscs1024.com/hd/MPS-41so-pjyt"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73546", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73546"}, {"url": "https://github.com/envoyproxy/envoy/security/advisories/GHSA-pv9h-4fxf-7vrg", "name": "https://github.com/envoyproxy/envoy/security/advisories/GHSA-pv9h-4fxf-7vrg"}, {"url": "https://github.com/envoyproxy/envoy/commit/11d34660ca0322eb125d045a564d9d87f016397f", "name": "https://github.com/envoyproxy/envoy/commit/11d34660ca0322eb125d045a564d9d87f016397f"}, {"url": "https://github.com/envoyproxy/envoy/commit/884d30c56b835d5801733ae1dc38c94a08de23e8", "name": "https://github.com/envoyproxy/envoy/commit/884d30c56b835d5801733ae1dc38c94a08de23e8"}, {"url": "https://github.com/envoyproxy/envoy/commit/9484e17c34353662f9bfd30c74f61fa8c9ee7b83", "name": "https://github.com/envoyproxy/envoy/commit/9484e17c34353662f9bfd30c74f61fa8c9ee7b83"}, {"url": "https://github.com/envoyproxy/envoy/commit/ab63a0e52b5a28472f2ff865b6464ae4004f7593", "name": "https://github.com/envoyproxy/envoy/commit/ab63a0e52b5a28472f2ff865b6464ae4004f7593"}, {"url": "https://github.com/envoyproxy/envoy/releases/tag/v1.36.10", "name": "https://github.com/envoyproxy/envoy/releases/tag/v1.36.10"}, {"url": "https://github.com/envoyproxy/envoy/releases/tag/v1.37.6", "name": "https://github.com/envoyproxy/envoy/releases/tag/v1.37.6"}, {"url": "https://github.com/envoyproxy/envoy/releases/tag/v1.38.4", "name": "https://github.com/envoyproxy/envoy/releases/tag/v1.38.4"}, {"url": "https://github.com/envoyproxy/envoy/releases/tag/v1.39.1", "name": "https://github.com/envoyproxy/envoy/releases/tag/v1.39.1"}], "scope_influence": "", "tags": ["应用软件"], "title": "Envoy管理统计页XSS", "_translated": true, "_saved_at": "2026-09-21T21:33:58+00:00", "_first_saved_at": "2026-09-21T21:33:58+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-41so-pjyt"}]}</script>
  <script>
    const payload = JSON.parse(document.getElementById("payload").textContent);
    const levelLabels = payload.level_labels || {};
    const items = payload.items || [];
    let filtered = items.slice();
    let activeId = null;

    const $ = (id) => document.getElementById(id);
    $("generatedAt").textContent = payload.generated_at || "-";
    $("retention").textContent = payload.retention_days ?? "-";
    $("cutoff").textContent = payload.cutoff_date || "-";
    $("count").textContent = String(payload.count ?? items.length);

    function levelClass(level) {
      const cn = levelLabels[level] || level || "";
      if (level === "Critical" || cn === "严重") return "crit";
      if (level === "High" || cn === "高危") return "high";
      return "other";
    }
    function levelText(level) {
      return levelLabels[level] || level || "-";
    }
    function esc(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }
    function scoreText(v) {
      if (v === null || v === undefined || v === "" || v === -1) return "-";
      return String(v);
    }

    function renderList() {
      const list = $("list");
      $("listCount").textContent = String(filtered.length);
      if (!filtered.length) {
        list.innerHTML = '<div class="empty">没有匹配项</div>';
        return;
      }
      list.innerHTML = filtered.map((it) => {
        const id = it.mps_id || it.cve_id;
        const active = id === activeId ? " active" : "";
        return `
          <button class="item${active}" data-id="${esc(id)}" type="button">
            <div class="item-top">
              <span class="cve">${esc(it.cve_id || it.mps_id || "-")}</span>
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
            </div>
            <div class="title">${esc(it.title || "-")}</div>
            <div class="item-foot">
              <span>CVSS ${esc(scoreText(it.cvss_score))}</span>
              <span>${esc(it.published_time || "-")}</span>
              ${it.poc ? "<span>POC</span>" : ""}
            </div>
          </button>`;
      }).join("");
      list.querySelectorAll(".item").forEach((btn) => {
        btn.addEventListener("click", () => selectById(btn.dataset.id));
      });
    }

    function refsHtml(it) {
      const refs = Array.isArray(it.reference_url_list) ? it.reference_url_list : [];
      const links = [];
      if (it._source_page) links.push({ url: it._source_page, name: "OSCS 详情" });
      if (it.cve_id) links.push({ url: `https://nvd.nist.gov/vuln/detail/${it.cve_id}`, name: "NVD" });
      refs.forEach((r) => {
        if (r && r.url) links.push({ url: r.url, name: r.name || r.url });
      });
      const seen = new Set();
      const uniq = [];
      for (const l of links) {
        if (seen.has(l.url)) continue;
        seen.add(l.url);
        uniq.push(l);
      }
      if (!uniq.length) return '<div class="box">无参考链接</div>';
      return `<div class="refs">${uniq.map((l) =>
        `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name || l.url)}</a>`
      ).join("")}</div>`;
    }

    function articlesHtml(it) {
      const arts = Array.isArray(it.articles) ? it.articles : [];
      if (!arts.length) return "";
      return `<div class="section"><h3>相关说明</h3>${arts.map((a) => `
        <div class="article">
          <h4>${esc(a.title || "说明")}</h4>
          <p>${esc(a.content || "")}</p>
        </div>`).join("")}</div>`;
    }

    function renderDetail(it) {
      const detail = $("detail");
      if (!it) {
        detail.innerHTML = '<div class="empty">暂无数据</div>';
        return;
      }
      const pocUrls = Array.isArray(it.poc_url) ? it.poc_url : [];
      detail.innerHTML = `
        <div class="d-head">
          <div>
            <h1 class="d-title">${esc(it.title || "-")}</h1>
            <div class="ids">
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
              <span class="chip">${esc(it.cve_id || "无 CVE")}</span>
              <span class="chip">${esc(it.mps_id || "-")}</span>
              ${it.poc ? '<span class="chip">有 POC</span>' : ""}
              ${it.exp ? '<span class="chip">有 EXP</span>' : ""}
            </div>
          </div>
          <div class="actions">
            ${it._source_page ? `<a class="btn" href="${esc(it._source_page)}" target="_blank" rel="noopener">OSCS</a>` : ""}
            ${it.cve_id ? `<a class="btn" href="https://nvd.nist.gov/vuln/detail/${esc(it.cve_id)}" target="_blank" rel="noopener">NVD</a>` : ""}
          </div>
        </div>
        <div class="grid">
          <div class="stat"><div class="k">CVSS</div><div class="v">${esc(scoreText(it.cvss_score))}</div></div>
          <div class="stat"><div class="k">向量</div><div class="v">${esc(it.cvss_vector || "-")}</div></div>
          <div class="stat"><div class="k">CWE</div><div class="v">${esc(it.cwe || "-")}</div></div>
          <div class="stat"><div class="k">类型</div><div class="v">${esc(it.kind || it.kind_en || "-")}</div></div>
          <div class="stat"><div class="k">公开</div><div class="v">${esc(it.published_time || "-")}</div></div>
          <div class="stat"><div class="k">利用成本</div><div class="v">${esc(it.exploit_requirement_cost || "-")}</div></div>
          <div class="stat"><div class="k">可利用性</div><div class="v">${esc(it.exploitability || "-")}</div></div>
          <div class="stat"><div class="k">修复建议</div><div class="v">${esc(it.fix_suggestion || "-")}</div></div>
        </div>
        <div class="section"><h3>描述</h3><div class="box">${esc(it.description || "无描述")}</div></div>
        ${it.scope_influence ? `<div class="section"><h3>影响范围</h3><div class="box">${esc(it.scope_influence)}</div></div>` : ""}
        ${pocUrls.length ? `<div class="section"><h3>POC 链接</h3><div class="refs">${pocUrls.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join("")}</div></div>` : ""}
        <div class="section"><h3>参考链接</h3>${refsHtml(it)}</div>
        ${articlesHtml(it)}
      `;
    }

    function selectById(id) {
      const it = filtered.find((x) => (x.mps_id || x.cve_id) === id) ||
                 items.find((x) => (x.mps_id || x.cve_id) === id);
      if (!it) return;
      activeId = it.mps_id || it.cve_id;
      renderList();
      renderDetail(it);
      const btn = document.querySelector(`.item[data-id="${CSS.escape(activeId)}"]`);
      if (btn) btn.scrollIntoView({ block: "nearest" });
      history.replaceState(null, "", "#" + encodeURIComponent(activeId));
    }

    function applyFilter(q) {
      const query = (q || "").trim().toLowerCase();
      filtered = !query ? items.slice() : items.filter((it) => {
        const blob = [
          it.cve_id, it.mps_id, it.title, it.kind, it.kind_en, it.cwe, it.description, it.level
        ].map((x) => String(x || "").toLowerCase()).join(" ");
        return blob.includes(query);
      });
      renderList();
      if (filtered.length) {
        const still = filtered.some((x) => (x.mps_id || x.cve_id) === activeId);
        selectById(still ? activeId : (filtered[0].mps_id || filtered[0].cve_id));
      } else {
        activeId = null;
        renderDetail(null);
      }
    }

    $("search").addEventListener("input", (e) => applyFilter(e.target.value));

    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement !== $("search")) {
        e.preventDefault();
        $("search").focus();
        return;
      }
      if (!filtered.length) return;
      const idx = filtered.findIndex((x) => (x.mps_id || x.cve_id) === activeId);
      if (e.key === "ArrowDown") {
        e.preventDefault();
        const next = filtered[Math.min(filtered.length - 1, Math.max(0, idx) + 1)];
        selectById(next.mps_id || next.cve_id);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        const prev = filtered[Math.max(0, idx - 1)];
        selectById(prev.mps_id || prev.cve_id);
      }
    });

    const hashId = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    if (hashId && items.some((x) => (x.mps_id || x.cve_id) === hashId)) {
      activeId = hashId;
      renderList();
      selectById(hashId);
    } else if (items.length) {
      selectById(items[0].mps_id || items[0].cve_id);
    } else {
      renderList();
      renderDetail(null);
    }
  </script>
</body>
</html>
