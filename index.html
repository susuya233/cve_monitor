 "Tracecat 是一个面向安全团队与 AI 智能体的开源安全自动化（SOAR）平台，采用 Python 编写并以 AGPL-3.0 协议在 GitHub 开源，提供工作流编排、案例管理与 AI 智能体能力，支持 Docker Compose、AWS Fargate 与 Helm 等自托管部署方式。\n受影响版本中，官方 docker-compose.yml 以 ${SAML_SIGNED_ASSERTIONS} 与 ${SAML_SIGNED_RESPONSES} 的形式无默认值透传两个签名开关，部署环境未赋值时容器注入的是存在但为空的字符串；tracecat/config.py 通过 os.environ.get(\"SAML_SIGNED_ASSERTIONS\", \"true\").lower() == \"true\" 解析该变量，空字符串被判定为 False，覆盖应用内默认要求签名的安全配置；tracecat/auth/saml.py 的 create_saml_client 将 want_assertions_signed 与 want_response_signed 均置为 False 构建 pysaml2 客户端，未认证攻击者向公开端点 POST /auth/saml/acs 提交针对已有用户邮箱伪造的未签名 SAML 响应，通过校验后获得该用户会话，目标为超级管理员时导致超级管理员账户接管。\n修复版本中通过三个互补提交切断该因果链：PR #2824 在 tracecat/config.py 引入 _read_bool_env，空白值按安全默认值 true 处理，并在 SAML 启用而两个签名要求同时为 false 时抛出异常阻止启动；PR #2825 将 docker-compose.yml 等部署文件改为 ${SAML_SIGNED_ASSERTIONS:-true} 形式的默认值透传；PR #2826 在 create_saml_client 中将 want_assertions_signed 与 want_response_signed 硬编码为 True，使签名要求不再依赖部署环境，1.0.0-beta.49 起强制要求签名断言与签名响应。", "effects": [{"comp_name": "tracecat", "ecosystem": "linux", "versions": [{"affected_version": "[0.37.0,1.0.0-beta.49)", "min_fixed_version": "1.0.0-beta.49", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "密码学签名的验证不恰当", "kind_en": "密码签名验证不当", "last_modified_time": "2026-11-07", "level": "Critical", "mps_id": "MPS-i72e-olwc", "poc": false, "poc_url": [], "published_time": "2026-11-07", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-i72e-olwc", "name": "https://www.oscs1024.com/hd/MPS-i72e-olwc"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-58490", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-58490"}, {"url": "https://github.com/TracecatHQ/tracecat/security/advisories/GHSA-6g53-h6fh-c3pj", "name": "https://github.com/TracecatHQ/tracecat/security/advisories/GHSA-6g53-h6fh-c3pj"}, {"url": "https://github.com/TracecatHQ/tracecat/pull/2824", "na 库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "cnvd_id": "", "cve_id": "CVE-2026-124040", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.1}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:H/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.2}]}, "cvss_score": 9.2, "cvss_vector": "CVSS:4.0/AV:N/AC:H/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-416", "description": "CivetWeb 是一个开源的 C 语言嵌入式 Web 服务器与 HTTP 库，可集成到应用程序中提供 HTTP/HTTPS 服务，并通过实验性模块支持 HTTP/2 协议。\n受影响版本中，当服务以 USE_HTTP2 宏编译且配置 enable_http2 开启时，handle_http2() 在处理 HEADERS 帧时将 HPACK 解码出的 :method 与 :path 伪头部值所在的堆缓冲指针同时保存到 conn-\u003erequest_info 的 request_method、local_uri、request_uri 与 local_uri_raw 字段；流处理结束后 free_buffered_request_header_list() 释放全部请求头部缓冲，但不清空上述别名字段。同一连接上后续收到省略这些伪头部的 HEADERS 帧时，handle_request() 继续读取已释放的指针，访问控制规则所见的方法与路径可能被攻击者影响，也可能因访问已释放内存导致服务崩溃。\n修复版本中通过，上游尚未提供包含修复的版本，issue #1379 仍处于跟踪状态；建议不以 USE_HTTP2 宏编译或在配置中关闭 enable_http2，避免进入存在缺陷的 HTTP/2 处理路径，官方发布修复版本后应及时升级。", "effects": [{"comp_name": "civetweb", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.16]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "UAF", "kind_en": "免费后使用", "last_modified_time": "2026-11-07", "level": "Critical", "mps_id": "MPS-gdob-khe1", "poc": false, "poc_url": [], "published_time": "2026-11-07", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-gdob-khe1", "name": "https://www.oscs1024.com/hd/MPS-gdob-khe1"}, l仍按原始data_size将图像数据写入该过小缓冲区，造成堆缓冲区溢出，远程攻击者可通过提交构造的ICO图片导致进程崩溃或可能实现任意代码执行。\n修复版本中通过在分配前引入MAX_ICO_ENTRY_DATA_SIZE（10MB）上限校验，超过上限的data_size直接拒绝解析，从根源消除32位加法回绕；同时将加法结果统一保存为full_data_size使用，新增VIPS_MALLOC返回值判空与full_data_size不小于BMP位图信息头长度的边界校验，并在读取失败等错误路径释放已分配缓冲区。", "effects": [{"comp_name": "github.com/imgproxy/imgproxy/v4", "ecosystem": "go", "versions": [{"affected_version": "[4.0.0,4.0.16)", "min_fixed_version": "4.0.16", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "堆缓冲区溢出", "kind_en": "基于堆的缓冲区溢出", "last_modified_time": "2026-11-08", "level": "Critical", "mps_id": "MPS-3tmv-9f4l", "poc": false, "poc_url": [], "published_time": "2026-11-08", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-3tmv-9f4l", "name": "https://www.oscs1024.com/hd/MPS-3tmv-9f4l"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-123614", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-123614"}, {"url": "https://github.com/imgproxy/imgproxy/security/advisories/GHSA-hff9-5pqw-6w9f", "name": "GitHub Security Advisory (GHSA-hff9-5pqw-6w9f)"}, {"url": "https://www.vulncheck.com/advisories/imgproxy-4.0.0-before-4.0.16-heap-buffer-overflow-via-ico-loader-integer-overflow", "name": "VulnCheck Advisory: imgproxy 4.0.0 before 4.0.16 Heap Buffer Overflow via ICO Loader Integer Overflow"}], "scope_influence": "", "tags": ["go"], "title": "imgproxy ICO加载器堆溢出漏洞", "_translated": true, "_saved_at": "2026-11-08T03:53:33+00:00", "_first_saved_at": "2026-11-08T03:53:33+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-3tmv-9f4l"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-97175", "cvss": {"cvssv31": [{"source": "secalert@redhat.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-287", "description": "Keycloak 是红帽主导的开源身份认证与访问管理软件，keycloak-services 组件提供服务端的身份代理联邦登录与认证流程处理。\n受影响版本中，first broker login 流程的 idp-auto-link 认证器在 IdpAutoLinkAuthenticator.authenticateImpl 中经 AbstractIdpAuthenticator.getExistingUser 取回此前按邮箱匹配到的本地已有账号后，直接调用 context.setUser(existingUser) 并 context.success() 完成身份链接，未校验代理身份提供商是否已验证该邮箱（email_verified 声明），也未检查 IdP 的 Trust Email 配置。攻击者在所代理的身份提供商持有与受害者本地账号相同邮箱且未经验证的可控身份后登录该提供商，外部身份被静默链接到受害者账号，实现完整账号接管，包括读取受害者数据并修改其邮箱与密码。\n修复版本中通过在 IdpAutoLinkAuthenticator.authenticateImpl 增加邮箱归属与可信校验切断该链路：当 Review Profile 页修改过邮箱或用户名、代理邮箱与既有账号邮箱不一致、或 IdP 未启用 Trust Email 且身份上下文中 email_verified 不为真时，改用 context.attempted() 终止自动链接，使登录流程转入 idp-confirm-link 与 idp-email-verification 等邮箱归属确认步骤；同时在 BrokeredIdentityContext 新增 isEmailVerified() 方法读取 email_verified 声明。", "effects": [{"comp_name": "org.keycloak:keycloak-services", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,26.8.2)", "min_fixed_version": "26.8.2", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_req ind": "通过用户控制密钥绕过授权机制", "kind_en": "通过用户控制的密钥绕过授权", "last_modified_time": "2026-11-06", "level": "High", "mps_id": "MPS-oxqh-3inz", "poc": false, "poc_url": [], "published_time": "2026-11-06", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-oxqh-3inz", "name": "https://www.oscs1024.com/hd/MPS-oxqh-3inz"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-77439", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-77439"}, {"url": "https://github.com/immich-app/immich/security/advisories/GHSA-c9mf-h82r-8p4j", "name": "https://github.com/immich-app/immich/security/advisories/GHSA-c9mf-h82r-8p4j"}, {"url": "https://github.com/immich-app/immich/pull/29883", "name": "https://github.com/immich-app/immich/pull/29883"}, {"url": "https://github.com/immich-app/immich/commit/84dff19ca9a467752d848ff54763d62c04ebf960", "name": "https://github.com/immich-app/immich/commit/84dff19ca9a467752d848ff54763d62c04ebf960"}, {"url": "https://github.com/immich-app/immich/releases/tag/v3.0.3", "name": "https://github.com/immich-app/immich/releases/tag/v3.0.3"}], "scope_influence": "", "tags": ["npm", "开源"], "title": "Immich共享相册权限提升漏洞", "_translated": true, "_saved_at": "2026-11-05T19:20:54+00:00", "_first_saved_at": "2026-11-05T19:20:54+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-oxqh-3inz"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2025-71458", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "high", "base_score": 7.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-89", "description": "FTS3 Web Monitoring（fts-monitoring）是 CERN 开源的 FTS3 文件传输服务 Web 监控组件，基于 Python 与 Django 构建，以 RPM 包形式发布，用于展示传输任务、存储端点与链路配置等监控信息。\n受影响版本中，/linkinfo 路由映射的 get_linkinfo 视图从 http_request.GET 读取 source_se 与 dest_se 参数，未经参数化处理便以 %s 字符串格式化拼入多条查询语句，并通过不带参数绑定的 cursor.execute(query) 执行，远程攻击者无需认证，通过构造恶意请求可实现盲注，读取数据库中存储的云存储凭据与 Token Provider 客户端密钥。\n修复版本中通过将全部查询改为 %(name)s 占位符并以 cursor.execute(query, {...}) 传入参数绑定，使 source_se、dest_se 与 user_dn 等外部输入不再拼入 SQL 文本，同时新增 linkinfo.enabled 配置项支持在配置层面禁用 /linkinfo 端点；修复随 3.14.1 发布并回移植至 3.13.3。", "effects": [{"comp_name": "fts-monitoring", "ecosystem": "linux", "versions": [{"affected_version": "[3.14.0,3.14.1)", "min_fixed_version": "3.14.1", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[3.12.0,3.13.3)", "min_fixed_version": "3.13.3", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-11-06", "level": "High", "mps_id": "MPS-0ial-ng4c", /MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-22", "description": "Charmbracelet wish 是一个开源的 Go 语言 SSH 服务开发库（Go 模块 charm.land/wish/v2，MIT 许可），用于在自托管 SSH 服务器中组合命令处理、Git 服务等中间件能力。\n受影响版本中，git.Middleware 处理 git-upload-pack、git-upload-archive、git-receive-pack 会话命令时，对客户端提供的仓库名参数执行 filepath.Clean，随后统计正斜杠数量并限制不超过 1 个作为目录深度检查。该检查未识别反斜杠分隔符：../evil 经清洗后仅含 1 个斜杠，可绕过深度限制，与 repoDir 拼接后指向其上一级目录；在 Windows 上 filepath.Clean 将路径分隔符改写为反斜杠，..\\..\\evil 等载荷的正斜杠计数为 0，可达任意深度。越界路径随后传入 gitPack 执行 git 子命令，认证用户可读取或写入仓库目录之外的任意 Git 仓库。\n修复版本中通过新增 cleanRepo 函数规整客户端提供的仓库名：先将反斜杠统一替换为斜杠并去除首尾分隔符，再执行 path.Clean，随后使用 filepath.IsLocal 拒绝任何拼接后越出 repoDir 的路径，同时保留不超过两层（user/repo.git）的深度限制，并以回归测试覆盖 ../escaped、..\\..\\repo.git 等越界用例，切断了构造路径逃出仓库目录的利用链。", "effects": [{"comp_name": "charm.land/wish/v2", "ecosystem": "go", "versions": [{"affected_version": "(-∞,2.0.5)", "min_fixed_version": "2.0.5", "repository": "go", "solutions": [], "upstream": true}]}, {"comp_name": "wish", "ecosystem": "linux", "versions": [{"affected_version": "(0,2.0.5)", "min_fixed_version": "2.0.5", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-11-06", "level": "High", "mps_id": "MPS-gfyp-0xhj", "poc": false, "poc_url": [], "published_time": "2026-11-06", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-gfyp-0xhj", "name": "https://www.oscs1024.com/hd/MPS-gfyp-0xhj"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-53980", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-53980"}, {"url": "https://github.com/charmbracelet/wish/releases/tag/v2.0.5", "name": "Fixed Released Tag"}, {"url": "https://github.com/charmbracelet/wish/commit/533db0daa90446b0d4ae3284877179c37e0cc48e", "name": "Patch Commit"}, {"url": "https://www.vulncheck.com/advisories/charmbracelet-wish-pa ps://go.dev/dl/", "name": ""}], "scope_influence": "", "tags": ["go", "应用软件"], "title": "Go 标准库安全漏洞", "_translated": true, "_saved_at": "2026-11-06T00:39:09+00:00", "_first_saved_at": "2026-11-06T00:39:09+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-d708-4d17"}, {"analysis_status": 0, "articles": [], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-92857", "cvss": {"cvssv31": [{"source": "secalert@redhat.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N", "severity": "high", "base_score": 8.1}]}, "cvss_score": 8.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N", "cwe": "CWE-20", "description": "Keycloak 是 Red Hat 主导的开源身份认证与访问管理组件，提供 OIDC 与 SAML 单点登录能力，其动态客户端注册（Dynamic Client Registration）功能允许持有 Initial Access Token 的用户自助注册客户端应用。\n受影响版本中，默认的 Allowed Protocol Mapper Types 客户端注册策略仅比对协议映射器的类型是否在允许列表内，不校验映射器配置中的 claim.name 等字段；持 Initial Access Token 的攻击者注册客户端时提交 oidc-usermodel-property-mapper、oidc-usermodel-attribute-mapper 等默认放行的映射器类型，并将 claim.name 配置为 sub 或 aud、映射值指向自身可编辑的用户属性；签发访问令牌、ID 令牌与 UserInfo 响应时，UserPropertyMapper.setClaim 经 OIDCAttributeMapperHelper.mapClaim 将攻击者可控值写入受保护的 sub、aud claim 并使用 realm 密钥签名，生成可通过标准校验的冒充身份令牌。\n修复版本中通过重写 ProtocolMappersClientRegistrationPolicy 的 beforeRegister 与 beforeUpdate 校验逻辑，基于新增、变更或删除的映射器类型重新执行允许列表检查，并将策略配置与新引入的 realm 属性 allowedProtocolMapperTypesForClientAdministrators 取交集、为空时全拒绝；客户端注册策略管理器在允许策略组件被移除时兜底执行空允许列表，管理端协议映射器 CRUD 收敛为 realm 管理员权限，动态客户端注册默认不再允许提交任何协议映射器，切断了向受保护 claim 写入可控数据的利用链。", "effects": [{"comp_name": "keycloak", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,26.8.2)", "min_fixed_version": "26.8.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "输入验证不恰当", "kind_en": "输入验证不当", "last_modified_time": "2026-11-06", "level": "High", "mps_id": "MPS-j5m6-dfpo", "poc": false, "poc_url": [], "published_time": "2026-11-06", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-j5m6-dfpo", "name": "https://www.oscs1024.com/hd/MPS-j5m6-dfpo"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-92857", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-92857"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-92857", "name": ""}, {"url": "https://bugzilla.redhat.com/show_bug.cgi?id=2535817", "name": "RHBZ#2535817"}], "scope_influence": "", "tags": ["应用软件"], "title": "Keycloak 身份伪造漏洞", "_translated": true, "_saved_at": "2026-11-05T19:20:53+00:00", "_first_saved_at": "2026-11-05T19:20:53+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-j5m6-dfpo"}, {"analysis_status": 0, "articles": [], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-96453", "cvss": {"cvssv31": [{"source": "secalert@redhat.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:R/S:C/C:H/I:H/A:N", "severity": "high", "base_score": 8}]}, "cvss_score": 8, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:R/S:C/C:H/I:H/A:N", "cwe": "CWE-295", "description": "Keycloak 是红帽主导开源的身份认证与访问管理系统，用于单点登录与身份联合；kcadm 是随 Keycloak 发行包与 Maven 构件 org.keycloak:keycloak-admin-cli 提供的 Admin CLI 命令行工具，管理员用它从命令行管理 Keycloak 服务器，客户端注册 CLI kcreg 与其共用同一 HTTP 工具类。\n受影响版本中，kcadm 与 kcreg 配置自定义信任库（--truststore 或 config truststore）时，org.keycloak.client.cli.util.HttpUtil 类的 setTruststore 方法调用 Apache HttpClient 的 loadTrustMaterial 加载信任库材料，同时附加 TrustSelfSignedStrategy.INSTANCE 信任策略；该策略使客户端接受任意自签名证书链，主机名匹配即通过 TLS 校验，管理员导入信任库的 CA 信任材料失去实际约束。能够实施中间人攻击或 DNS 重定向的网络攻击者可向执行 kcadm 命令的管理员伪造 Keycloak 服务器，截获管理流量、窃取访问令牌与管理员凭据，并注入伪造响应执行特权管理操作。\n修复版本中通过将 setTruststore 方法中 loadTrustMaterial 调用的 TrustSelfSignedStrategy.INSTANCE 策略参数移除，自定义信任库成为唯一信任来源，未显式导入信任库的自签名证书在 TLS 握手阶段被拒绝；该修复随 Keycloak 26.8.2 发布，中间人伪造服务器窃取管理员凭据的攻击路径被切断。", "effects": [{"comp_name": "keycloak", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,26.8.2)", "min_fixed_version": "26.8.2", "repository": "unmanaged", "solutions": [], "upstream": 直接约简为空节点，使 (?:){N} 不再生成循环指令；运行期引入默认 100000 的回溯栈上限，ensureStorage 超限时返回 ErrBacktrackingStackLimit 终止匹配，从而将匹配期内存限制在有界范围内。", "effects": [{"comp_name": "github.com/dlclark/regexp2", "ecosystem": "go", "versions": [{"affected_version": "(-∞,1.12.0]", "min_fixed_version": "", "repository": "go", "solutions": [], "upstream": true}]}, {"comp_name": "github.com/dlclark/regexp2/v2", "ecosystem": "go", "versions": [{"affected_version": "(-∞,2.3.0)", "min_fixed_version": "2.3.0", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "不加限制或调节的资源分配", "kind_en": "不受限制或节流地分配资源", "last_modified_time": "2026-11-06", "level": "High", "mps_id": "MPS-ki0f-35dh", "poc": false, "poc_url": [], "published_time": "2026-11-06", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ki0f-35dh", "name": "https://www.oscs1024.com/hd/MPS-ki0f-35dh"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-77299", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-77299"}, {"url": "https://github.com/dlclark/regexp2/security/advisories/GHSA-wq9v-j77v-qr26", "name": "https://github.com/dlclark/regexp2/security/advisories/GHSA-wq9v-j77v-qr26"}, {"url": "https://github.com/dlclark/regexp2/commit/6e446cb3a57a0f20112bc24353604fd00bdb309a", "name": "https://github.com/dlclark/regexp2/commit/6e446cb3a57a0f20112bc24353604fd00bdb309a"}, {"url": "https://github.com/dlclark/regexp2/releases/tag/v2.3.0", "name": "https://github.com/dlclark/regexp2/releases/tag/v2.3.0"}], "scope_influence": "", "tags": ["go"], "title": "regexp2 拒绝服务漏洞", "_translated": true, "_saved_at": "2026-11-06T07:33:13+00:00", "_first_saved_at": "2026-11-06T07:33:13+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ki0f-35dh"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用了空指针，并在不进行有效检查的情况下对其进行取消引用操作。当程序试图取消引用空指针时，由于空指针不指向任何有效的内存地址，会导致程序崩溃或产生未定义的行为。这种错误通常发生在开发者未对指针进行正确的初始化或验证时。", "title": "什么是空指针取消引用"}, {"content": "- 拒绝服务：攻击者可以通过构造恶意输入或请求，触发程序中的空指针取消引用错误，导致程序崩溃或无法正常运行。这可能导致拒绝服务攻击，使系统无法提供正常的服务。\r\n- 内存信息泄露：攻击者可以通过利用空指针取消引用错误，访问程序中的敏感内存信息。这可能包括栈上的变量、函数指针或其他敏感数据，从而暴露系统的机密信息。\r\n- 代码执行：在某些情况下，空指针取消引用错误可能导致执行恶意代码或注入恶意代码的机会。攻击者可以通过精心构造的输入，利用空指针取消引用错误来执行任意的代码，进而获取系统控制权或执行未经授权的操作。", "title": "空指针取消引用常见的攻击方式"}, {"content": "- 指针初始化和验证：开发者应该正确地初始化指针，并在使用指针之前进行有效的验证，确保指针不为空。在取消引用指针之前，应始终检查其是否为空。\r\n- 异常处理和错误恢复：程序应该具备健壮的异常处理和错误恢复机制，以便在发生空指针取消引用错误时能够适当地处理异常，而不是导致程序崩溃或暴露敏感信息。\r\n- 防御性编程：采用防御性编程的原则，如避免在未经验证的指针上进行操作，避免使用未初始化的指针等，以防止空指针取消引用错误的发生。\r\n- 静态代码分析和测试：使用静态代码分析工具和测试技术来检测和识别潜在的空指针取消引用错误。这些工具可以帮助发现代码中可能存在的空指针问题，并及时修复。\r\n- 强制性编码标准和最佳实践：制定强制性的编码标准和最佳实践，包括良好的指针使用和管理规范，以帮助开发者编写更可靠、安全的代码。", "title": "如何预防空指针取消引用"}], "cnvd_id": "", "cve_id": "CVE-2026-87045", "cvss": {"cvssv31": [{"source": "vulnerabilities@zephyrproject.org", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-476", "description": "Zephyr 是 Linux 基金会旗下的开源物联网实时操作系统，面向资源受限的嵌入式设备，其网络子系统内置支持 HTTP/1.x 与 HTTP/2 的服务器组件（CONFIG_HTTP_SERVER）。\n受影响版本中，handle_http_frame_header() 在解析每个帧前无条件执行 client-\u003ecurrent_stream = NULL，而 CONTINUATION 帧不会开启新流，enter_http_frame_continuation_state() 也未重新绑定流上下文，攻击者在客户端 preface 之后发送一个未经 HEADERS 帧开启的孤立 CONTINUATION 帧（END_HEADERS 置位），服务器以空流指针完成整个头部块的处理；请求未注册资源时 send_http2_404() 与 send_http2_405() 经 send_headers_frame() 无条件写入 client-\u003ecurrent_stream-\u003eheaders_sent，向注册动态资源发送 POST/PUT/PATCH 时 handle_http2_dynamic_resource() 写入 client-\u003ecurrent_stream-\u003ecurrent_detail，两次写入均指向固定低地址，在 Cortex-M 等目标上触发硬故障并由默认致命错误处理停机，构成无需认证的远程拒绝服务，明文 h2c 连接即可触达，TLS 不能阻断。\n修复版本中通过三处改动切断该链条：handle_http_frame_header() 仅在 expect_continuation 为假时释放流上下文，使头部块跨 CONTINUATION 帧保持绑定；enter_http_frame_continuation_state() 对无绑定流或流标识不匹配的 CONTINUATION 帧返回错误并拒绝；handle_http2_dynamic_resource() 补上与同级处理函数一致的 client-\u003ecurrent_stream 判空守卫，孤立 CONTINUATION 帧被拒绝，空指针写入不再可达。", "effects": [{"comp_name": "zephyr", "ecosystem": "linux", "versions": [{"affected_version": "[4.1.0,4.3.2)", "min_fixed_version": "4.3.2", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[4.4.0,4.5.0)", "min_fixed_version": "4.5.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "空指针取消引用", "kind_en": "空指针取消引用", "last_modified_time": "2026-11-06", "level": "High", "mps_id": "MPS-sh7l-aypg", "poc": false, "poc_url": [], "published_time": "2026-11-06", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-sh7l-aypg", "name": "https://www.oscs1024.com/hd/MPS-sh7l-aypg"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-87045", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-87045"}, {"url": "https://github.com/zephyrproject-rtos/zephyr/commit/e72a9d9498092bfbb7feed4b479bf21bc3218c3d", "name": "Fix commit"}, {"url": "https://github.com/zephyrproject-rtos/zephyr/security/advisories/GHSA-cw8r-2jj2-w8fw", "name": "GHSA-cw8r-2jj2-w8fw"}], "scope_influence": "", "tags": ["应用软件"], "title": "Zephyr HTTP/2 空指针引用漏洞", "_translated": true, "_saved_at": "2026-11-06T15:33:17+00:00", "_first_saved_at": "2026-11-06T15:33:17+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-sh7l-aypg"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-92855", "cvss": {"cvssv31": [{"source": "secalert@redhat.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:N", "severity": "high", "base_score": 7.4}]}, "cvss_score": 7.4, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:N", "cwe": "CWE-287", "description": "Keycloak 是红帽主导的开源身份认证与访问管理系统，提供 SAML 身份代理功能，用于将登录认证委托给外部 SAML 身份提供者。\n受影响版本中，SAML 代理端点在 services/src/main/java/org/keycloak/broker/saml/SAMLEndpoint.java 的 validateSubjectConfirmationData 方法中只查找 bearer 类型的 SubjectConfirmation；当上游签名的断言仅声明 holder-of-key 类型的 SubjectConfirmation 时，该方法跳过全部 subject confirmation 校验并返回 true，断言被直接接受，服务端不校验持有者是否拥有与断言绑定的私钥。攻击者截获受害者的一条有效签名断言后，可将其重放到 /realms/{realm}/broker/{alias}/endpoint 端点，无需私钥完成认证，冒充受害者登录并访问其账号与下游应用。\n修复版本中通过重写 validateSubjectConfirmationData 方法，收集断言中全部 bearer 确认并逐个校验 SubjectConfirmationData 的 NotOnOrAfter、Recipient 与 InResponseTo，要求至少一个校验通过才接受响应，否则拒绝该断言，使仅含 holder-of-key 确认的断言无法再被当作 bearer 凭据重放。", "effects": [{"comp_name": "keycloak", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,26.8.2)", "min_fixed_version": "26.8.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "org.keycloak:keycloak-services", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,26.8.2)", "min_fixed_version": "26.8.2", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "身份验证不当", "kind_en": "认证不当", "last_modified_time": "2026-11-06", "level": "High", "mps_id": "MPS-59r0-b3x4", "poc": false, "poc_url": [], "published_time": "2026-11-06", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-59r0-b3x4", "name": "https://www.oscs1024.com/hd/MPS-59r0-b3x4"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-92855", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-92855"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-92855", "name": ""}, {"url": "https://bugzilla.redhat.com/show_bug.cgi?id=2535814", "name": "RHBZ#2535814"}], "scope_influence": "", "tags": ["java", "开源"], "title": "Keycloak SAML代理认证绕过漏洞", "_translated": true, "_saved_at": "2026-11-05T19:20:55+00:00", "_first_saved_at": "2026-11-05T19:20:55+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-59r0-b3x4"}, {"analysis_status": 0, "articles": [], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-93998", "cvss": {"cvssv31": [{"source": "secalert@redhat.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:N", "severity": "high", "base_score": 7.4}]}, "cvss_score": 7.4, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:N", "cwe": "CWE-347", "description": "Keycloak 是红帽主导开源的身份认证与访问管理系统，其 SAML 适配器（org.keycloak:keycloak-saml-adapter-core）用于为 Java 应用提供基于 SAML 2.0 协议的单点登录保护。\n受影响版本中，适配器的 handleLoginResponse 在处理登录响应时依次执行签名、Audience/Recipient 与时间条件校验，但未将 Response 与 Assertion 的 Issuer 元素同 keycloak-saml.xml 中配置的 IDP entityID 进行比对；当部署环境中多个身份提供方共享同一受信签名验证密钥时，控制其中一个身份提供方的攻击者可签发 Issuer 指向自身、NameID 伪造为任意用户的合法签名断言，该断言通过全部既有校验后在应用中以任意用户身份完成登录，可获取管理员权限。\n修复版本中通过在 handleLoginResponse 内新增 Issuer 绑定校验，要求 Response 级 Issuer（出现时）与 Assertion 级 Issuer 必须等于配置的 entityID，不匹配时判定认证失败；同时对 handleSamlRequest 处理的 LogoutRequest 增加相同校验，并收紧 saml-core 中 SAML2Signature.getNextSiblingOfIssuer 的 Issuer 定位逻辑，切断攻击者使用其他身份提供方签发断言登录应用的主链路。", "effects": [{"comp_name": "org.keycloak:keycloak-saml-adapter-core", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,26.8.2)", "min_fixed_version": "26.8.2", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "密码学签名的验证不恰当", "kind_en": "密码签名验证不当", "last_modified_time": "2026-11-06", "level": "High", "mps_id": "MPS-s1m3-24c8", "poc": false, "poc_url": [], "published_time": "2026-11-06", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-s1m3-24c8", "name": "https://www.oscs1024.com/hd/MPS-s1m3-24c8"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-93998", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-93998"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-93998", "name": ""}, {"url": "https://bugzilla.redhat.com/show_bug.cgi?id=2537164", "name": "RHBZ#2537164"}], "scope_influence": "", "tags": ["java", "开源"], "title": "Keycloak SAML适配器身份伪造漏洞", "_translated": true, "_saved_at": "2026-11-05T19:20:51+00:00", "_first_saved_at": "2026-11-05T19:20:51+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-s1m3-24c8"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-64894", "cvss": {"cvssv4": [{"source": "productsecurity@jci.com", "vector": "CVSS:4.0/AV:P/AC:H/AT:P/PR:L/UI:P/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.3}]}, "cvss_score": 7.3, "cvss_vector": "CVSS:4.0/AV:P/AC:H/AT:P/PR:L/UI:P/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-829", "description": "EasyIO Neo IO Manager 是 Johnson Controls 推出的商业楼宇自控配置与调试软件，非开源，随附 Tools-Installer 安装器分发，用于对 EasyIO Neo 系列边缘控制器进行配置、编程与仿真，并管理控制器输入输出与网络通信。\n受影响版本中，应用二进制文件与动态库未经数字签名且存放在用户可写目录（厂商检测指引指向 %APPDATA%\\EasyIONeoSeriesTools），具备本地目录写入能力的攻击者可用恶意二进制或库文件替换合法未签名组件，应用在启动时加载并执行被替换内容，最终以运行该应用的账户权限执行任意代码。\n修复版本中通过将全部二进制文件进行数字签名、迁移至 C:\\Program Files 等系统保护目录并强制应用 DLL 搜索顺序保护，阻止应用从用户可写路径加载库文件，切断了通过替换未签名组件实现代码执行的利用链路。", "effects": [{"comp_name": "easyio_neo_io_manager", "ecosystem": "linux", "versions": [{"affected_version": "[1.1.0.0,2.0.0.0)", "min_fixed_version": "2.0.0.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "easyio_neo_tools_installer", "ecosystem": "linux", "versions": [{"affected_version": "[1.1.0.0,2.0.0.0)", "min_fixed_version": "2.0.0.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "从非可信控制范围包含功能例程", "kind_en": "包含来自不可信控制领域的功能", "last_modified_time": "2026-11-06", "level": "High", "mps_id": "MPS-io2m-dqeg", "poc": false, "poc_url": [], "published_time": "2026-11-06", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-io2m-dqeg", "name": "https://www.oscs1024.com/hd/MPS-io2m-dqeg"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-64894", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-64894"}, {"url": "https://www.johnsoncontrols.com/trust-center/cybersecurity/security-advisories", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "EasyIO Neo IO Manager恶意组件替换漏洞", "_translated": true, "_saved_at": "2026-11-06T15:33:22+00:00", "_first_saved_at": "2026-11-06T15:33:22+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-io2m-dqeg"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-123184", "cvss": {"cvssv4": [{"source": "4760f414-e1ae-4ff1-bdad-c7a9c3538b79", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:N/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:N/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-863", "description": "Altium 365 是 Altium 公司推出的云端电子产品设计协作平台，为闭源商业 SaaS 服务，其 Git Service 组件为项目提供基于 Git 的仓库托管与推送访问能力。\n受影响版本中，Git Service 在用户向项目仓库执行推送时进行的权限检查未按所需访问级别评估，只要用户持有该项目任意级别的访问权限即可通过校验，持有查看权限的已认证账号可向目标项目仓库写入内容，未授权写入会破坏仓库数据的完整性与可用性；仓库读取访问控制未受影响。\n修复版本中通过在服务端修正推送权限检查的访问级别评估完成修复，推送操作重新按所需访问级别进行校验，官方确认 Altium 365 无需客户执行任何操作，本地部署的 Altium Enterprise Server 不受影响。", "effects": [{"comp_name": "Altium 365", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,unspecified]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-11-06", "level": "High", "mps_id": "MPS-hlnr-j579", "poc": false, "poc_url": [], "published_time": "2026-11-06", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-hlnr-j579", "name": "https://www.oscs1024.com/hd/MPS-hlnr-j579"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-123184", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-123184"}, {"url": "https://www.altium.com/platform/security-compliance/security-advisories", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Altium 365 Git Service 越权写入漏洞", "_translated": true, "_saved_at": "2026-11-05T19:20:56+00:00", "_first_saved_at": "2026-11-05T19:20:56+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-hlnr-j579"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-97847", "cvss": {"cvssv31": [{"source": "secalert@redhat.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:L", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:L", "cwe": "CWE-287", "description": "Keycloak 是 Red Hat 主导的开源身份认证与访问管理系统，支持 OIDC 与 SAML 单点登录、服务账号客户端凭证以及 Admin REST API，漏洞相关的核心服务实现位于 keycloak-services 模块。\n受影响版本中，持有目标 OIDC 客户端 manage-clients 权限的客户端管理员可通过 Admin REST API 为该客户端添加 hardcoded-claim 协议映射器，覆盖其服务账号令牌中的 sub 与 preferred_username 声明；客户端凭证令牌默认不含 sessionState（无 sid），Admin REST API 认证时经 UserSessionUtil 进入 TokenManager.lookupUserFromStatelessToken，先按 sub 查找用户，失败后回退按 preferred_username 查找任意同名用户且未校验其是否为该客户端的服务账号，令牌持有者随即被替换为真实管理域管理员的 UserModel，绕过 CVE-2026-4629 引入的角色剥离防御，攻击者可凭管理域管理员身份调用 Admin REST API 枚举、创建或删除用户并完全接管管理域。\n修复版本中通过在协议映射器 CRUD 入口（ProtocolMappersResource 与客户端、客户端作用域管理端点）统一新增 requireManageProtocolMappers 校验，仅持有 manage-realm 角色的管理员可不受限管理协议映射器，其余管理员只能操作管理域属性 ALLOWED_PROTOCOL_MAPPER_TYPES_FOR_CLIENT_ADMINISTRATORS 白名单内的映射器类型（默认为空即全部拒绝），并经 Client Registration Policies 默认禁止动态客户端注册创建协议映射器，切断攻击者注入身份声明映射器的路径，主体替换攻击链随之失效。", "effects": [{"comp_name": "keycloak", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,26.8.2)", "min_fixed_version": "26.8.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "身份验证不当", "kind_en": "认证不当", "last_modified_time": "2026-11-06", "level": "High", "mps_id": "MPS-t2mr-wzq0", "poc": false, "poc_url": [], "published_time": "2026-11-06", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-t2mr-wzq0", "name": "https://www.oscs1024.com/hd/MPS-t2mr-wzq0"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-97847", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-97847"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-97847", "name": ""}, {"url": "https://bugzilla.redhat.com/show_bug.cgi?id=2540950", "name": "RHBZ#2540950"}], "scope_influence": "", "tags": ["应用软件"], "title": "Keycloak 令牌主体替换漏洞", "_translated": true, "_saved_at": "2026-11-05T19:20:49+00:00", "_first_saved_at": "2026-11-05T19:20:49+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-t2mr-wzq0"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-65960", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "cwe": "CWE-306", "description": "Tetragon 是 Cilium 社区开源的基于 eBPF 的安全观测与运行时强制执行组件，以 Kubernetes DaemonSet 形式部署，用于采集内核事件并通过加载 tracing policy 实现威胁检测与阻断。\n受影响版本中，Helm 默认值 tetragon.grpc.address 与 agent 二进制 --server-address 的默认值均为 localhost:54321，cmd/tetragon/main.go 的 Serve 函数以不带认证与 TLS 拦截器的 grpc.NewServer 注册特权 gRPC 服务 FineGuidanceSensors，并通过 net.Listen 在 TCP 上绑定该地址；能够在同节点运行或接管 hostNetwork Pod 的攻击者与 Tetragon 共享节点 loopback，可未认证调用 pkg/server/server.go 中 AddTracingPolicy、DeleteTracingPolicy、SetDebug 等特权方法，任意加载、删除或重配置 eBPF tracing policy 并修改调试配置，最终导致容器逃逸或权限提升。\n修复版本中通过 v1.7.0 将 Helm 默认 gRPC 端点改为 unix:///var/run/tetragon/tetragon.sock，默认部署不再在 TCP 上暴露未认证的特权接口，同节点 hostNetwork Pod 无法再经节点 loopback 直接访问该服务；配套改动把宿主机 /var/run/tetragon 挂载进 agent Pod 并同步 runtime hook 默认地址，保证修复后的 Unix-domain socket 访问路径保持可用，显式配置 TCP 监听的部署仍需自行启用 TLS 与认证防护。", "effects": [{"comp_name": "cilium/tetragon", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.7.0)", "min_fixed_version": "1.7.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "关键功能的认证机制缺失", "kind_en": "缺少关键功能的身份验证", "last_modified_time": "2026-11-07", "level": "High", "mps_id": "MPS-dhgo-e51i", "poc": false, "poc_url": [], "published_time": "2026-11-07", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-dhgo-e51i", "name": "https://www.oscs1024.com/hd/MPS-dhgo-e51i"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-65960", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-65960"}, {"url": "https://github.com/cilium/tetragon/security/advisories/GHSA-6qqg-3qf7-p3v5", "name": "https://github.com/cilium/tetragon/security/advisories/GHSA-6qqg-3qf7-p3v5"}, {"url": "https://github.com/cilium/tetragon/pull/4882", "name": "https://github.com/cilium/tetragon/pull/4882"}, {"url": "https://github.com/cilium/tetragon/commit/8e89933d3526f37c04f7523013ff32f8b1c6f62a", "name": "https://github.com/cilium/tetragon/commit/8e89933d3526f37c04f7523013ff32f8b1c6f62a"}, {"url": "https://github.com/cilium/tetragon/commit/fe46101770b960ebbf39fe9749bb20d49cf178b2", "name": "https://github.com/cilium/tetragon/commit/fe46101770b960ebbf39fe9749bb20d49cf178b2"}, {"url": "https://github.com/cilium/tetragon/releases/tag/v1.7.0", "name": "https://github.com/cilium/tetragon/releases/tag/v1.7.0"}], "scope_influence": "", "tags": ["应用软件"], "title": "Tetragon gRPC接口未授权访问", "_translated": true, "_saved_at": "2026-11-06T21:12:52+00:00", "_first_saved_at": "2026-11-06T21:12:52+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-dhgo-e51i"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-33050", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-78", "description": "GeoNode 是开源地理空间内容管理系统，用于管理与发布地理空间数据，支持通过上传接口导入矢量数据文件并写入空间数据库。\n受影响版本中，矢量文件上传后其图层名会进入 ogr2ogr 命令拼接流程，geonode/upload/handlers/common/vector.py 的 create_ogr2ogr_command 将图层名 alternate 以未转义形式拼入 -nln 参数，import_with_ogr2ogr 随后以 Popen(shell=True) 执行整条命令字符串，具备数据上传权限的低权限远程用户上传图层名携带 shell 语法的矢量文件后，可在 GeoNode 服务器上执行任意操作系统命令。\n修复版本中通过在 create_ogr2ogr_command 使用 shlex.quote 转义输入文件路径与图层名，import_with_ogr2ogr 改用 shlex.split 构造参数列表并以 shell=False 执行 ogr2ogr，OGR2OGR_COPY_WITH_DUMP 场景下的 psql 管道改为 Python 内进程对接且 PGPASSWORD 经环境变量传递，切断了图层名进入 shell 解析的路径。", "effects": [{"comp_name": "GeoNode", "ecosystem": "pip", "versions": [{"affected_version": "(-∞,5.1.0)", "min_fixed_version": "5.1.0", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-11-07", "level": "High", "mps_id": "MPS-iab8-pqey", "poc": false, "poc_url": [], "published_time": "2026-11-07", "reference_url_list": [{"url": "https://github.com/GeoNode/geonode/security/advisories/GHSA-9fpx-fr6j-2vh6", "name": ""}, {"url": "https://github.com/GeoNode/geonode/commit/1408290c0bb54872924a9b334a516db9758a2180", "name": ""}, {"url": "https://github.com/advisories/GHSA-9fpx-fr6j-2vh6", "name": ""}], "scope_influence": "", "tags": ["python", "开源"], "title": "GeoNode 命令注入漏洞", "_translated": true, "_saved_at": "2026-11-06T21:12:55+00:00", "_first_saved_at": "2026-11-06T21:12:55+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-iab8-pqey"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过向受信任的数据序列化过程中添加恶意数据，从而在序列化和反序列化过程中执行恶意代码的攻击漏洞。这种漏洞通常存在于使用序列化 (serialization) 机制存储和传输数据的程序中。\n", "title": "什么是反序列化"}, {"content": "- 注入攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码注入到程序中，从而实现代码执行的目的。\n- 反射攻击：攻击者使用反射机制，在序列化过程中动态生成恶意数据，并将恶意代码注入到程序中，从而实现代码执行的目的。\n- 缓冲区溢出攻击：攻击者通过在序列化过程中向缓冲区输入恶意数据，导致缓冲区溢出，从而破坏程序的内存管理，实现代码执行的目的。\n- 格式字符串攻击：攻击者通过在序列化过程中输入恶意数据，导致程序使用错误的格式字符串，从而实现代码执行的目的。\n- 数据流攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码作为一个数据流传递给程序，从而实现代码执行的目的。\n", "title": "反序列化常见的攻击方式"}, {"content": "- 不信任输入数据：程序应该严格检查输入数据的有效性，并避免使用不受信任的数据。\n- 使用安全的序列化机制：程序应该使用安全的序列化机制，如 JSON 或 XML 序列化，而不是第三方序列化库。\n- 最小特权原则：程序应该限制对受信任数据的处理权限，并避免在运行时修改数据。\n- 代码审查和漏洞扫描：程序应该进行代码审查和漏洞扫描，以发现和修复潜在的安全漏洞。\n", "title": "如何预防反序列化"}], "cnvd_id": "", "cve_id": "CVE-2026-87112", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-502", "description": "QA Assistants – Driven by data（插件目录标识 qa-heatmap-analytics）是 QuarkA 在 WordPress.org 开源发布的热图与行为分析插件，用于采集并展示访客点击、滚动等行为数据，发行包内捆绑 Composer 依赖 Guzzle HTTP 客户端。\n受影响版本中，插件测量端点 qahm-ajax.php 无需身份验证，record_behavioral_data 与 update_msec 分支将 POST 参数 raw_name、readers_name 经 serialize_escape() 处理后直接拼接文件路径，该函数只转义冒号与花括号、未过滤 ../ 路径穿越序列，dlevent_ver 等参数携带的内容又被未转义写入数据文件，攻击者可将可控文件植入 readers/temp 等目录；wp-cron.php 以 2 分钟周期自动触发的 qahm_cron_data_manage 计划任务扫描 readers/temp 并对其中文件调用 wrap_unserialize_static()，该函数调用 unserialize() 时未设置 allowed_classes，植入的序列化数据可实例化捆绑的 GuzzleHttp\\\\Cookie\\\\FileCookieJar，其析构过程向攻击者指定路径写入任意内容，形成任意文件写入并可导致远程代码执行。\n修复版本中通过 5.3.0.1 在 wrap_unserialize_static() 中限定 unserialize() 仅允许 stdClass 实例化，其余类反序列化为 __PHP_Incomplete_Class 且魔术方法不再触发，使 FileCookieJar 利用链失效；同时新增 raw_name、readers_name 格式校验并在入口与路径拼接处做校验和 realpath 目录约束，定时任务扫描跳过不符合测量端点命名格式的文件，切断路径穿越与对象注入两条利用链路。", "effects": [{"comp_name": "qa-heatmap-analytics", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,5.3.0.1)", "min_fixed_version": "5.3.0.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "反序列化", "kind_en": "不可信数据的反序列化", "last_modified_time": "2026-11-07", "level": "High", "mps_id": "MPS-qbxz-19ry", "poc": false, "poc_url": [], "published_time": "2026-11-07", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-qbxz-19ry", "name": "https://www.oscs1024.com/hd/MPS-qbxz-19r 容符合预期，避免超出缓冲区或访问非预期的内存区域。\n- 内存安全编程实践：开发人员应使用安全的编程实践，如避免使用不安全的函数、正确处理内存分配和释放操作，以及遵循最小特权原则。\n- 使用安全的编程语言和库：选择使用安全性较高的编程语言和库，这些语言和库在内存管理和安全性方面提供了更多的保护机制。\n- 定期进行代码审查和安全测试：定期审查应用程序的代码，并进行安全测试，以发现潜在的跨界内存读漏洞。使用静态代码分析工具和漏洞扫描工具来辅助检测和修复问题。\n- 实施防御性编程技术：应用程序应采用防御性编程技术，如使用随机化地址空间布局（ASLR）、堆栈保护机制（如堆栈溢出保护）和数据执行预防（DEP）等。\n- 及时更新和修补：及时应用程序和操作系统的安全更新和补丁，以确保已知的跨界内存读漏洞得到修复。及时更新相关软件和库，以避免使用已知存在漏洞的版本。", "title": "如何预防越界读取"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-99272", "cvss": {}, "cvss_score": 8.2, "cvss_vector": "", "cwe": "CWE-125", "description": "Linux kernel 是开源操作系统内核，其 fs/smb/client 目录下的 CIFS/SMB 客户端（cifs 模块）负责在 Linux 主机上挂载和访问 SMB/CIFS 网络共享。\n受影响版本中，SMB2_read() 收到服务器返回的 READ 响应后，直接以 le32_to_cpu(rsp-\u003eDataLength) 作为复制长度、(char *)rsp + rsp-\u003eDataOffset 作为复制起点执行 memcpy，未校验该数据区是否落在实际收到的响应缓冲区内；当 DataOffset 为 0 时 smb2_get_data_area_len() 将数据区长度按 0 处理，smb2_check_message() 仅要求帧长不小于固定响应长度，短帧因此通过校验，而 SMB2_read() 仍使用服务器提供的 DataLength，仅受 CIFS_MAX_MSGSIZE 与调用方长度上限约束。恶意服务器可对 mfsymlinks（或 SFU）符号链接解析使用的同步读返回一个 81 字节、DataOffset 为 0 且 DataLength 为 1067 的 READ 响应，使客户端从 448 字节的接收对象中越界复制 1067 字节（KASAN 报告 slab-out-of-bounds，一般场景最多可达约 16 KiB），导致内核堆内存信息泄露并可触发内核异常。\n修复版本中通过在 SMB2_read() 内新增本地变量 data_offset，将小于 read_rsp_size 的 DataOffset（含 0 及与响应头重叠的情况）钳位为 read_rsp_size，与 handle_read_data() 对异步读路径的处理保持一致；同时新增校验，当 *nbytes 非零且 data_offset + *nbytes 超出 rsp_iov.iov_len 时返回 EIO 并将读取长度置零，memcpy 复制起点改用钳位后的 data_offset，越界数据区被直接拒绝，上述越界复制链路被切断。稳定分支 7.3.2 以回移 commit 1ba1937de005 修复，主线自 7.4-rc1 起包含修复 commit 2ec9cdf469dd。", "effects": [{"comp_name": "linux_kernel", "ecosystem": "linux", "versions": [{"affected_version": "[3.7,7.3.2)", "min_fixed_version": "7.3.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界读取", "kind_en": "越界读取", "last_modified_time": "2026-11-07", "level": "High", "mps_id": "MPS-tzio-qh83", "poc": false, "poc_url": [], "published_time": "2026-11-07", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-tzio-qh83", "name": "https://www.oscs1024.com/hd/MPS-tzio-qh83"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-99272", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-99272"}, {"url": "https://git.kernel.org/stable/c/1ba1937de005e261a8858f45bfef5da7458df94c", "name": ""}, {"url": "https://git.kernel.org/stable/c/2ec9cdf469dd32bcf33073aeb30c08e9356e0ca1", "name": ""}], "scope_influence": "", "tags": ["操作系统"], "title": "Linux内核SMB客户端越界读漏洞", "_translated": true, "_saved_at": "2026-11-07T15:20:00+00:00", "_first_saved_at": "2026-11-07T15:20:00+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-tzio-qh83"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-99277", "cvss": {}, "cvss_score": 7.7, "cvss_vector": "", "cwe": "CWE-416", "description": "ksmbd 是 Linux 内核内置的 SMB3 文件服务器实现（fs/smb/server），在内核态向客户端提供 SMB2/SMB3 文件共享服务，随主线内核发布，属于开源组件。\n受影响版本中，SMB2 SESSION SETUP 处理在协商 SMB3 及以上协议并执行会话绑定时调用 register_session_channel，struct channel 仅以裸指针 chann-\u003econn = conn 保存连接对象，未调用 ksmbd_conn_get 持有引用；ksmbd_session_unregister 会先把会话从全局会话表与每连接会话表摘除，连接断开时的 ksmbd_conn_sessions_cleanup 无法再定位该会话并执行 ksmbd_chann_del 删除通道，连接对象可在另一会话引用持有者（SMB3.1.1 会话绑定或 procfs 会话读取 show_proc_session/show_proc_sessions 遍历 chan-\u003econn）访问期间被并发释放，构成内核态 use-after-free。\n修复版本中通过在 register_session_channel 注册通道时改为 chann-\u003econn = ksmbd_conn_get(conn) 持有连接引用，并在 xa_store 失败、ksmbd_chann_del 删除通道、free_channel_list 随会话销毁清理通道三处调用 ksmbd_conn_put 归还引用，使连接生命周期覆盖全部通道引用持有者，切断连接被提前释放的因果链。", "effects": [{"comp_name": "linux_kernel", "ecosystem": "linux", "versions": [{"affected_version": "[7.3,7.3.2)", "min_fixed_version": "7.3.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "UAF", "kind_en": "免费后使用", "last_modified_time": "2026-11-07", "level": "High", "mps_id": "MPS-rt8a-9v1s", "poc": false, "poc_url": [], "published_time": "2026-11-07", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-rt8a-9v1s", "name": "https://www.oscs1024.com/hd/MPS-rt8a-9v1s"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-99277", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-99277"}, {"url": "https://git.kernel.org/stable/c/4b333aed69cfc2c8687b86b6a4364a0dffc16dd8", "name": ""}, {"url": "https://git.kernel.org/stable/c/add8d7fb04efe564193df73581889c62fc0016f1", "name": ""}], "scope_influence": "", "tags": ["操作系统"], "title": "ksmbd通道连接引用缺失漏洞", "_translated": true, "_saved_at": "2026-11-07T15:19:57+00:00", "_first_saved_at": "2026-11-07T15:19:57+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-rt8a-9v1s"}, {"analysis_status": 0, "articles": [{"content": "跨界内存读是指应用程序在读取内存时，未正确验证或限制读取的内存范围。攻击者利用这种漏洞可以读取应用程序内存中的敏感数据，如密码、加密密钥、会话令牌等。常见的原因是由于缓冲区溢出、格式化字符串漏洞或其他内存错误导致的。", "title": "什么是越界读取"}, {"content": "攻击者可以通过不当构造的输入来触发跨界内存读漏洞。攻击者可能会通过向应用程序发送特定的输入，使其读取超过预期的内存区域。攻击者可以利用这个漏洞来获取敏感信息，如其他用户的数据、操作系统的敏感数据或应用程序的内部状态。", "title": "越界读取常见的攻击方式"}, {"content": "- 输入验证和限制：应用程序应对所有输入数据进行严格的验证和限制。确保输入数据的长度、格式和内容符合预期，避免超出缓冲区或访问非预期的内存区域。\n- 内存安全编程实践：开发人员应使用安全的编程实践，如避免使用不安全的函数、正确处理内存分配和释放操作，以及遵循最小特权原则。\n- 使用安全的编程语言和库：选择使用安全性较高的编程语言和库，这些语言和库在内存管理和安全性方面提供了更多的保护机制。\n- 定期进行代码审查和安全测试：定期审查应用程序的代码，并进行安全测试，以发现潜在的跨界内存读漏洞。使用静态代码分析工具和漏洞扫描工具来辅助检测和修复问题。\n- 实施防御性编程技术：应用程序应采用防御性编程技术，如使用随机化地址空间布局（ASLR）、堆栈保护机制（如堆栈溢出保护）和数据执行预防（DEP）等。\n- 及时更新和修补：及时应用程序和操作系统的安全更新和补丁，以确保已知的跨界内存读漏洞得到修复。及时更新相关软件和库，以避免使用已知存在漏洞的版本。", "title": "如何预防越界读取"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-99275", "cvss": {}, "cvss_score": 7.6, "cvss_vector": "", "cwe": "CWE-125", "description": "Linux 内核 SMB 客户端（fs/smb/client，随内核以 GPL 开源发布的 CIFS 模块）是内核内置的 SMB2/3 协议客户端，用于挂载并访问远程 SMB 服务器的共享资源。\n受影响版本中，smb2_check_message() 在响应状态字段非零时提前判定帧有效，64 字节的 STATUS_MORE_PROCESSING_REQUIRED SESSION_SETUP 响应绕过最小 PDU 长度检查进入解析；SMB2_sess_auth_rawntlmssp_negotiate() 从复用接收缓冲区中残留的旧帧字节读取 SecurityBufferOffset 与 SecurityBufferLength，未与本次实际接收长度比对，decode_ntlmssp_challenge() 按伪造的 SecurityBufferLength 通过 kmemdup 最多向接收对象之外读取约 64 KB 内核堆内存并存入会话 target info，随 NTLMv2 AUTHENTICATE 消息回传给恶意服务器，造成内核内存信息泄露。\n修复版本中通过在 smb2_check_message() 的短错误路径之前拒绝长度不足的 SESSION_SETUP 响应，并在调用 decode_ntlmssp_challenge() 前校验 SecurityBufferOffset 与 SecurityBufferLength 之和不超过本次接收长度，非法帧被直接拒绝，越界读取回传链路被切断。", "effects": [{"comp_name": "linux_kernel", "ecosystem": "linux", "versions": [{"affected_version": "[7.3,7.3.3)", "min_fixed_version": "7.3.3", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,6.12.116]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,6.1.192]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,7.4-rc1)", "min_fixed_version": "7.4-rc1", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,6.18.62]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,6.6.162]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,5.15.225]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,7.2.15]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,5.10.274]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界读取", "kind_en": "越界读取", "last_modified_time": "2026-11-07", "level": "High", "mps_id": "MPS-cekv-n4tf", "poc": false, "poc_url": [], "published_time": "2026-11-07", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-cekv-n4tf", "name": "https://www.oscs1024.com/hd/MPS-cekv-n4tf"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-99275", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-99275"}, {"url": "https://git.kernel.org/stable/c/df63e01933886153e40706483b9635b2456ad91f", "name": ""}, {"url": "https://git.kernel.org/stable/c/4d8930afa3446041358a7db33e7b23a0bb9459b5", "name": ""}], "scope_influence": "", "tags": ["操作系统"], "title": "Linux内核SMB客户端内存泄露", "_translated": true, "_saved_at": "2026-11-07T15:19:58+00:00", "_first_saved_at": "2026-11-07T15:19:58+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-cekv-n4tf"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-120537", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "cwe": "CWE-79", "description": "TranslatePress（插件标识 translatepress-multilingual）是 Cozmoslabs 开发的 WordPress 开源多语言翻译插件，通过前台动态翻译把页面字符串采集进翻译词典表，并提供机器翻译与 AI 翻译能力。\n受影响版本中，未认证攻击者提交的评论属性等内容会被前台动态翻译流程采集为可翻译字符串并写入 trp_dictionary 词典表（includes/class-translation-render.php 约 1061 行，采集前仅经 includes/functions.php 中清洗不足的 trp_sanitize_string 处理）；includes/trp-ajax.php 是绕过 WordPress 加载、可被直接请求的独立端点，其构造函数在校验 $_POST['action'] 为 trp_get_translations_domchanges 且 originals、language、original_language 非空后查询词典表，output_translations 把查询结果以 echo json_encode($dictionary_by_original) 原样输出，未附加任何 HTML 转义标志，也未声明 Content-Type，词典中存储的脚本片段在该端点响应被浏览器当作文档打开时于站点源内执行。\n修复版本中通过在 3.3.9 的 includes/trp-ajax.php 输出前强制发送 Content-Type: application/json; charset=utf-8 与 X-Content-Type-Options: nosniff 响应头，并引入 SAFE_JSON_FLAGS（JSON_HEX_TAG、JSON_HEX_AMP、JSON_HEX_APOS、JSON_HEX_QUOT）常量供全部 json_encode 调用使用，把 \u003c、\u003e、\u0026、单引号与双引号转义为 \\uXXXX 序列，端点响应无法再被浏览器嗅探或解析为 HTML，词典中存储的恶意脚本失去执行条件，正常消费方经 JSON.parse 还原原始字符串不受影响。", "effects": [{"comp_name": "translatepress", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,3.3.9)", "min_fixed_version": "3.3.9", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-11-07", "level": "High", "mps_id": "MPS-4ds2-kj85", "poc": false, "poc_url": [], "published_time": "2026-11-07", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-4ds2-kj85", "name": "https://www.oscs1024.com/hd/MPS-4ds2-kj85"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-120537", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-120537"}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/e26d5534-dab1-4562-b770-aae2468505ac?source=cve", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/translatepress-multilingual/tags/3.3.8/includes/trp-ajax.php#L20", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/translatepress-multilingual/tags/3.3.8/includes/trp-ajax.php#L257", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/translatepress-multilingual/tags/3.3.8/includes/class-translation-render.php#L1061", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/translatepress-multilingual/tags/3.3.8/includes/functions.php#L206", "name": ""}, {"url": "https://plugins.trac.wordpress.org/changeset/3781398/translatepress-multilingual/trunk/includes/trp-ajax.php", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "TranslatePress 存储型 XSS", "_translated": true, "_saved_at": "2026-11-07T08:08:56+00:00", "_first_saved_at": "2026-11-07T08:08:56+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-4ds2-kj85"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-122037", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "cwe": "CWE-79", "description": "AgenWebsite Shipping（wordpress.org 插件目录标识 woocommerce-jne）是 AgenWebsite 发布的开源 WooCommerce 物流插件，面向印度尼西亚市场提供全境快递运费计算、运单号自动生成与店铺发货管理。\n受影响版本中，设置向导类 AWShipping_Setup_Wizard 将 setup_wizard 注册到 admin_init 钩子，该钩子在 admin-ajax.php、admin-post.php 上同样触发且不要求登录，向导处理 save_step 保存请求时未校验权限与 nonce；setup_save 将 $_POST['zipcode'] 经 sanitize_text_field 处理后写入 aw_shipping_settings 选项，双引号等属性边界字符未被过滤，保存值在 views/settings/settings-general.php 的 input value 属性处未做输出转义，攻击者可借双引号闭合属性注入任意 Web 脚本，管理员访问插件设置页时脚本被执行。\n修复版本中通过新增 aw_shipping_sanitize_zipcode 将邮政编码过滤为最多 5 位数字，向导入口增加 manage_options 权限校验与 aw-setup nonce 校验并直接跳过 AJAX 请求，设置保存链路 validate_and_sanitize_options 同步应用该过滤器，settings-general.php 输出改用 esc_attr 转义，同时切断未授权写入与属性逃逸两条利用路径。", "effects": [{"comp_name": "woocommerce-jne", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,9.2.42)", "min_fixed_version": "9.2.42", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-11-07", "level": "High", "mps_id": "MPS-8nal-5swx", "poc": false, "poc_url": [], "published_time": "2026-11-07", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-8nal-5swx", "name": "https://www.oscs1024.com/hd/MPS-8nal-5swx"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-122037", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-122037"}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/90d114c1-61e5-4d2b-9311-0c9c9ad3b888?source=cve", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/woocommerce-jne/tags/9.2.41/views/settings/settings-general.php#L1247", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/woocommerce-jne/tags/9.2.41/includes/admin/class-awshipping-setup-wizard.php#L448", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/woocommerce-jne/tags/9.2.41/includes/admin/class-awshipping-setup-wizard.php#L98", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/woocommerce-jne/tags/9.2.41/includes/admin/class-awshipping-setup-wizard.php#L37", "name": ""}, {"url": "https://downloads.wordpress.org/plugin/woocommerce-jne.9.2.42.zip", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "AgenWebsite Shipping存储型XSS漏洞", "_translated": true, "_saved_at": "2026-11-07T08:08:55+00:00", "_first_saved_at": "2026-11-07T08:08:55+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-8nal-5swx"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "attack_vector_type": "Local", "cnvd_id": "", "cve_id": "CVE-2026-99281", "cvss": {}, "cvss_score": 7.1, "cvss_vector": "", "cwe": "CWE-862", "description": "Linux kernel 是开源操作系统内核，其 TUN/TAP 子系统在 drivers/net/tun.c 中实现用户态虚拟网络设备，供虚拟机、容器等场景收发流量。\n受影响版本中，tun_set_iff 通过 tun_not_capable 判断调用者能否挂接既有 TUN/TAP 设备，该函数仅在设备已设置 owner 或 group 且调用者不匹配、同时不具备 CAP_NET_ADMIN 时才返回 true，对未设置 owner 与 group 的持久化设备恒返回 false，任何能够打开 /dev/net/tun 的本地普通用户通过 TUNSETIFF ioctl 均可挂接到无主设备，进而读取或注入该虚拟网络接口上的流量。\n修复版本中通过新增 tun_permitted 重写权限判断：owner 与 group 全部未设置时要求调用者具备 CAP_NET_ADMIN，任一设置时要求调用者匹配全部已设置项，tun_set_iff 调用点改为校验失败返回 -EPERM，封堵了本地低权限用户挂接无主 TUN/TAP 设备的路径。", "effects": [{"comp_name": "linux", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,7.3.2)", "min_fixed_version": "7.3.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-11-07", "level": "High", "mps_id": "MPS-7c5o-r9bz", "poc": false, "poc_url": [], "published_time": "2026-11-07", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-7c5o-r9bz", "name": "https://www.oscs1024.com/hd/MPS-7c5o-r9bz"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-99281", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-99281"}, {"url": "https://git.kernel.org/stable/c/2f92c0286cfd58bff9d6d54c01a771073d5eb775", "name": ""}, {"url": "https://git.kernel.org/stable/c/e53d1cf05da8ea58a5743b7ce5894fb51b0b9700", "name": ""}, {"url": "https://git.kernel.org/stable/c/ffdf678dd16610e3f006dac904bd37c09684673c", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Linux 内核 TUN 权限校验缺失", "_translated": true, "_saved_at": "2026-11-07T15:19:54+00:00", "_first_saved_at": "2026-11-07T15:19:54+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-7c5o-r9bz"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及 68（约 4GB）的 ICO 文件作为源图提交处理请求，触发约 4GB 的内存分配：内存受限的容器中 worker 进程被 OOM 终止，内存充裕的主机上每次请求产生约 4GB 的瞬时占用，重复请求造成内存耗尽与服务不可用。\n修复版本中通过在 vips/icoload.c 引入 MAX_ICO_ENTRY_DATA_SIZE（10 MB）上界并在头部解析阶段拒绝超限的 data_size，同时为 VIPS_MALLOC 结果增加判空、在源读取失败与缓冲区不足以容纳 BMP 头的路径释放已分配内存，切断了超大声明值进入内存分配的因果链，畸形 ICO 文件不再导致无界分配或进程崩溃。", "effects": [{"comp_name": "github.com/imgproxy/imgproxy/v3", "ecosystem": "go", "versions": [{"affected_version": "[3.3.0,4.0.16)", "min_fixed_version": "4.0.16", "repository": "go", "solutions": [], "upstream": true}]}, {"comp_name": "imgproxy", "ecosystem": "linux", "versions": [{"affected_version": "[3.3.0,4.0.16)", "min_fixed_version": "4.0.16", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "未经控制的内存分配", "kind_en": "大小值过大的内存分配", "last_modified_time": "2026-11-08", "level": "High", "mps_id": "MPS-y4ml-9bq3", "poc": false, "poc_url": [], "published_time": "2026-11-08", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-y4ml-9bq3", "name": "https://www.oscs1024.com/hd/MPS-y4ml-9bq3"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-123616", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-123616"}, {"url": "https://github.com/imgproxy/imgproxy/security/advisories/GHSA-mmq5-xm89-9pfg", "name": "GitHub Security Advisory (GHSA-mmq5-xm89-9pfg)"}, {"url": "https://www.vulncheck.com/advisories/imgproxy-3.3.0-before-4.0.16-memory-exhaustion-dos-via-ico-loader", "name": "VulnCheck Advisory: imgproxy 3.3.0 before 4.0.16 Memory Exhaustion DoS via ICO Loader"}], "scope_influence": "", "tags": ["go", "应用软件"], "title": "imgproxy ICO加载器内存耗尽漏洞", "_translated": true, "_saved_at": "2026-11-08T03:53:30+00:00", "_first_saved_at": "2026-11-08T03:53:30+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-y4ml-9bq3"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-114713", "cvss": {"cvssv 8T03:53:29+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-e5mr-lkfb"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过构造恶意的数据，将过多的数据输入到程序的缓冲区中，使得缓冲区的空间被填满，从而溢出到程序的栈 (stack) 或堆 (heap) 中，导致程序崩溃、拒绝服务、数据泄露等安全问题。\n", "title": "什么是经典缓冲区溢出"}, {"content": "| 类型        | 描述                                                         |\n| ----------- | ------------------------------------------------------------ |\n| 代码注入攻击      | 攻击者通过向程序的缓冲区输入恶意代码，从而控制程序执行流程，实现对程序操作的恶意操作。例如，攻击者可以通过向 Web 应用程序的输入框中输入恶意代码，从而执行任意的代码，破坏系统、窃取数据等。 |\n| 数据覆盖攻击      | 攻击者通过向程序的缓冲区输入过多的数据，从而覆盖程序中的重要数据或代码，实现对程序操作的恶意操作。例如，攻击者可以通过向聊天应用程序的输入框中输入过多的表情符号，从而覆盖程序中的重要数据，例如聊天消息、账号密码等。 |\n| 栈溢出攻击 | 攻击者通过向程序的栈中输入过多的数据，从而溢出到栈外部，实现对程序操作的恶意操作。例如，攻击者可以通过向游戏应用程序的输入框中输入过多的道具名称，从而覆盖程序中的重要数据，例如游戏数据、账号密码等。 |\n| 堆溢出攻击       | 攻击者通过向程序的堆中输入过多的数据，从而溢出到堆外部，实现对程序操作的恶意操作。例如，攻击者可以通过向操作系统工具的输入框中输入过多的命令，从而覆盖程序中的重要数据，例如系统文件、配置文件等。 |", "title": "经典缓冲区溢出常见的攻击方式"}, {"content": "- 输入验证：在程序输入处对输入数据进行严格的验证和过滤，确保输入数据符合预期的格式和类型，避免被攻击者注入恶意命令或数据。可以使用正则表达式、格式字符串等方式进行输入验证。\n- 输出过滤：在程序输出处对输出数据进行严格的过滤和检查，确保输出数据符合预期的格式和类型，避免被攻击者截获和篡改。可以使用安全的输出过滤库等方式进行输出过滤。\n- 使用安全的编程模型：使用安全的编程模型，例如避免使用原生的缓冲区管理函数，使用安全的框架和库来处理输入数据和执行命令，避免缓冲区溢出漏洞。\n- 数据库加密和访问控制：对于敏感数据和命令，使用加密和访问控制措施，确保只有授权用户可以访问和执行命令，避免被攻击者窃取和篡改。\n- 定期更新和升级：定期更新和升级应用程序和库的版本，确保应用程序和库的最新版本包含了最新的安全补丁和修复措施，避免安全漏洞的出现和利用。\n- 安全审计和监控：定期对系统和应用程序进行安全审计和监控，及时发现和阻止潜在的安全漏洞和攻击，确保系统和数据的安全和可靠性。", "title": "如何预防经典缓冲区溢出"}], "cnvd_id": "", "cve_id": "CVE-2026-124059", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:N/AC:L/Au:M/C:C/I:C/A:C", "severity": "high", "base_score": 8.3}], "cvssv3": [{"source": "VulDB", "vector": "CVSS:3.0/AV:N/AC:L/PR:H/UI:N/S:C/C:H/I:H/A:H/E:P/RL:X/RC:C", "severity": "critical", "base_score": 9.1}], "cvssv31": [{"source": "cna@vuldb.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.1}], "cvssv4": [{"source": "cna@vuldb.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/
