omment_content”逐字填充的），而在执行前没有清理或剥离短代码令牌；随后的“wp_strip_all_tags()”和“strip_shortcodes()”调用仅在执行完全发生后对输出字符串进行操作，不提供针对服务器端短代码调用的保护。这使得未经身份验证的攻击者可以在每个菜谱页面渲染上在服务器端执行任意注册的 WordPress 短代码，从而导致短代码输出（例如附件标题、私人帖子字段或安装的短代码公开的其他数据）嵌入到页面的 JSON-LD“reviewBody”元数据中，并向加载菜谱页面的所有访问者公开。成功利用该漏洞需要攻击者的评级评论通过自动批准或审核者操作来通过网站的评论批准阈值，然后注入的短代码开始在页面加载时执行。", "effects": [{"comp_name": "WP Recipe Maker", "ecosystem": "linux", "versions": [{"affected_version": "(0,10.8.1]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "代码注入", "kind_en": "代码生成控制不当（“代码注入”）", "last_modified_time": "2026-09-19", "level": "Critical", "mps_id": "MPS-xys3-842w", "poc": false, "poc_url": [], "published_time": "2026-09-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-xys3-842w", "name": "https://www.oscs1024.com/hd/MPS-xys3-842w"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-89274", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-89274"}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/d6ad49ff-85eb-4d05-ba23-51d89695add3?source=cve", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/wp-recipe-maker/tags/10.8.1/includes/public/class-wprm-metadata.php#L553", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/wp-recipe-maker/tags/10.8.1/includes/public/class-wprm-metadata.php#L1028", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/wp-recipe-maker/tags/10.8.1/includes/public/class-wprm-metadata.php#L181", "name": ""}, {"url": "https://plugins.trac.wordpress.org/changeset?reponame=\u0026old=3699793%40wp-recipe-maker\u0026new=3699793%40wp-recipe-maker", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-89274漏洞", "_translated": true, "_saved_at": "2026-09-19T05:24:26+00:00", "_first_saved_at": "2026-09-19T05:24:26+00:00", "_source_ , "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-94", "description": "REDCap 是 Vanderbilt University 开发的 PHP 临床科研数据采集（EDC）平台，采用商业授权分发，广泛用于医院与科研机构通过在线调查和数据表单收集研究数据。\n受影响版本中，公开调查（survey）透传路由未将公开调查上下文中的请求严格限制在预期控制器范围内，未认证攻击者在掌握有效公开调查哈希后可构造 HTTP 请求访问非预期的控制器路由，Data Import 处理逻辑随后接受攻击者控制的文件路径/流参数，使不可信输入进入危险执行路径，最终在 REDCap 服务器上远程执行任意代码。\n修复版本中通过官方安全更新阻断公开调查上下文访问非预期控制器路由并收紧 Data Import 对文件路径/流参数的处理，官方 CNA 记录确认 16.0.49、17.3.10 和 17.4.4 版本不再受该漏洞影响，公开资料未披露更细粒度的源码修改。", "effects": [{"comp_name": "redcap", "ecosystem": "linux", "versions": [{"affected_version": "[17.4.0,17.4.4)", "min_fixed_version": "17.4.4", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[13.3.0,16.0.49)", "min_fixed_version": "16.0.49", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[17.0.0,17.3.10)", "min_fixed_version": "17.3.10", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "代码注入", "kind_en": "代码生成控制不当（“代码注入”）", "last_modified_time": "2026-09-20", "level": "Critical", "mps_id": "MPS-6yjg-nz7v", "poc": false, "poc_url": [], "published_time": "2026-09-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-6yjg-nz7v", "name": "https://www.oscs1024.com/hd/MPS-6yjg-nz7v"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-90817", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-90817"}, {"url": "https://www.securifera.com/advisories/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "REDCap未授权远程代码执行漏洞", "_translated": true, "_saved_at": "2026-09-20T14:25:03+00:00", "_first_saved_at": "2026-09-20T14:25:03+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-6yjg-nz7v"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "cnvd_id": "", "cve_id": "CVE-2026-94084", "cvss": {"cvssv31": [{"source": "cve@mitre.org", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:L", "severity": "critical", "base_score": 9.4}]}, "cvss_score": 9.4, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:L", "cwe": "CWE-416", "description": "当通过使用带或不带转换的 http.response_header 的规则检查事务时，8.0.7 之前的 Suricata 具有 Http2ThreadMultiBuf 释放后使用。", "effects": [{"comp_name": "suricata", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,8.0.7)", "min_fixed_version": "8.0.7", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "UAF", "kind_en": "免费后使用", "last_modified_time": "2026-09-20", "level": "Critical", "mps_id": "MPS-tc7a-18uk", "poc": false, "poc_url": [], "published_time": "2026-09-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-tc7a-18uk", "name": "https://www.oscs1024.com/hd/MPS-tc7a-18uk"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-94084", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-94084"}, {"url": "https://forum.suricata.io/t/suricata-8-0-7-released/6467", "name": ""}, {"url": "https://github.com/OISF/suricata/commit/1d66355dc8737bb2ae7a198115b urity@joomla.org", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.4}]}, "cvss_score": 9.4, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-434", "description": "OrdaSoft Joomla Gallery（OS Gallery）是 OrdaSoft 提供的 Joomla 图片画廊扩展，包含免费包 com_osgallery_light 与商业包 com_osgallery，用于在站点中创建相册、水印与灯箱展示。\n受影响版本中，saveWatermark() 将客户端上传文件按原始文件名复制到 Web 可访问的 images/com_osgallery/gal-{id}/watermark/ 目录，未校验扩展名、文件内容或文件名。具备 core.manage 权限的已认证用户可将 .php 文件以图片 Content-Type 上传，再直接请求该路径执行任意代码。\n修复版本中通过在 saveWatermark 中增加 gif/png/jpeg/jpg/webp 扩展名白名单与 exif_imagetype 内容校验，拒绝非图片文件写入可执行 Web 路径，阻断远程代码执行。", "effects": [{"comp_name": "com_osgallery", "ecosystem": "linux", "versions": [{"affected_version": "[1.0.0,6.2.7)", "min_fixed_version": "6.2.7", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "com_osgallery_light", "ecosystem": "linux", "versions": [{"affected_version": "[1.0.0,6.2.7)", "min_fixed_version": "6.2.7", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "任意文件上传", "kind_en": "危险类型文件无限制上传", "last_modified_time": "2026-09-21", "level": "Critical", "mps_id": "MPS-52rl-xtda", "poc": false, "poc_url": [], "published_time": "2026-09-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-52rl-xtda", "name": "https://www.oscs1024.com/hd/MPS-52rl-xtda"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-88857", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-88857"}, {"url": "https://www.OrdaSoft.com/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "OS Gallery任意文件上传", "_translated": true, "_saved_at": "2026-09-20T20:08:52+00:00", "_first_saved_at": "2026-09-20T20:08:52+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-52rl-xtda"}, {"analysis_status": 0, "articles": [{"content": "应用程序在处理用户输入时的不完善或缺乏验证机制，所以攻击者能够通过向应用程序发送恶意输入，利用应用程序对输入数据的错误处理方式来注入自己的恶意代码。这些恶意代码会被应用程序误认为是合法的指令或数据，并在执行过程中被执行。", "title": "什么是代码注入"}, {"content": "应用程序使用可执行动态代码的函数来执行用户可控的参数，当应用程序对于用户输入过滤不完全时，攻击者可以注入恶意代码并控制代码执行流程。", "title": "代码注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对所有用户输入进行验证和过滤，确保只接受预期的有效输入。这包括对输入数据进行输入长度验证、类型检查和格式验证等。\r\n- 使用参数化查询或预编译语句：对于数据库查询操作，应该使用参数化查询或预编译语句，确保输入数据不会被误认为是执行代码。\r\n- 最小特权原则：应用程序在执行操作系统命令或动态代码时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。\r\n- 安全编码实践：开发人员应该采用安全编码实践，包括避免使用eval函数、避免拼接用户输入的字符串作为代码执行等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止代码注入攻击。", "title": "如何预防代码注入"}], "cnvd_id": "", "cve_id": "CVE-2026-88856", "cvss": {"cvssv4": [{"source": "security@joomla.org", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.4}]}, "cvss_score": 9.4, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-94", "description": "OrdaSoft Joomla Gallery（OS Gallery）是 OrdaSoft 发布的 Joomla 相册扩展，提供免费版 com_osgallery_light 与付费版 com_osgallery，用于创建响应式图片和视频相册；安装包采用 GNU GPL v2 授权，主要通过厂商站点分发。\n受影响版本中，后台任务 task=update_osgallery 会进入 updateOSGallery()。该函数读取 JSON 请求体，将 method 字段作为 PHP 函数直接调用，并将 package 字段作为唯一参数传入，未做允许列表或 is_callable() 校验。已通过 core.manage 鉴权的特权用户可指定 system、exec、shell_exec、passthru 等函数，在服务器上执行任意命令。\n修复版本中通过移除该危险更新入口切断调用链：6.2.7 后台任务分发不再注册 update_osgallery，扩展中也不再提供 updateOSGallery() 将请求字段映射为任意 PHP 函数的路径。", "effects": [{"comp_name": "com_osgallery", "ecosystem": "linux", "versions": [{"affected_version": "[1.0.0,6.2.7)", "min_fixed_version": "6.2.7", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "com_osgallery_light", "ecosystem": "linux", "versions": [{"affected_version": "[1.0.0,6.2.7)", "min_fixed_version": "6.2.7", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "代码注入", "kind_en": "代码生成控制不当（“代码注入”）", "last_modified_time": "2026-09-21", "level": "Critical", "mps_id": "MPS-e8d3-tzua", "poc": false, "poc_url": [], "published_time": "2026-09-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-e8d3-tzua", "name": "https://www.oscs1024.com/hd/MPS-e8d3-tzua"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-88856", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-88856"}, {"url": "https://www.OrdaSoft.com/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "OS Gallery代码注入漏洞", "_translated": true, "_saved_at": "2026-09-20T20:08:53+00:00", "_first_saved_at": "2026-09-20T20:08:53+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-e8d3-tzua"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-88854", "cvss": {"cvssv4": [{"source": "security@joomla.org", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-89", "description": "OrdaSoft Joomla Gallery（亦称 OS Gallery）是 OrdaSoft 发布的开源 Joomla 相册扩展，用于在站点前台创建响应式图片与视频相册，并随安装包提供前台搜索模块 mod_osgallery_search；官方同时维护免费组件 com_osgallery_light 与完整组件 com_osgallery。\n受影响版本中，前台组件入口在 task 为 searhResult 或 loadMore*Search 时调用 osGalleryHelperSite 的 showSearchResult() 与 showSearchResultAjax()。这两处使用 $input-\u003egetVar() 读取 textsearch 或 searchText 请求参数；getVar() 并非 Joomla 输入过滤 API，回落后只剥离 HTML 标签，不处理引号与 SQL 语法。该值随后被直接拼入 LIKE 子句且未经转义。未登录访问者可通过已发布的搜索框或等价请求注入 UNION SELECT，读取任意数据库内容。\n修复版本中通过在 showSearchResult() 与 showSearchResultAjax() 将搜索关键字改为 protectInjection() 读取，并在拼入 LIKE 条件前执行数据库 quote，切断未转义搜索词进入 SQL 的路径。", "effects": [{"comp_name": "com_osgallery", "ecosystem": "linux", "versions": [{"affected_version": "[1.0.0,6.2.7)", "min_fixed_version": "6.2.7", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "com_osgallery_light", "ecosystem": "linux", "versions": [{"affected_version": "[1.0.0,6.2.7)", "min_fixed_version": "6.2.7", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-09-21", "level": "Critical", "mps_id": "MPS-0y29-esqz", "poc": false, "poc_url": [], "published_time": "2026-09-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-0y29-esqz", "name": "https://www.oscs1024.com/hd/MPS-0y29-esqz"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-88854", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-88854"}, {"url": "https://www.OrdaSoft.com/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "OS Gallery未认证SQL注入", "_translated": true, "_saved_at": "2026-09-20T20:08:54+00:00", "_first_saved_at": "2026-09-20T20:08:54+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-0y29-esqz"}, {"analysis_status": 0, "articles": [{"content": "- 命令注入是一种攻击，其目标是通过易受攻击的应用程序在主机操作系统上执行任意命令。 当应用程序将不安全的用户提供的数据（表单、cookie、HTTP 标头等）传递到系统 shell 时，就会产生缺陷。攻击者通过构造恶意的命令或数据，将其注入到程序执行的上下文中，从而绕过程序的输入验证和安全措施，实现对程序操作的恶意操作。", "title": "什么是命令注入"}, {"content": "- 文件上传：攻击者通过构造恶意的文件上传请求，将包含恶意命令的文件上传到服务器，从而利用命令注入漏洞执行恶意命令。\n- SQL 注入：攻击者通过构造恶意的 SQL 查询语句，将包含恶意命令的 SQL 语句注入到数据库中，从而执行恶意命令，窃取数据或者破坏系统。\n- 命令执行：攻击者通过在 Web 应用程序的表单提交数据中注入恶意命令，从而执行恶意命令，例如删除文件、格式化硬盘等。\n- 命令注入漏洞的旁路攻击：攻击者可以利用命令注入漏洞旁路控制程序的执行流程，从而窃取数据、破坏系统、控制程序等。\n", "title": "命令注入常见的攻击方式"}, {"content": "- 输入验证：在程序输入处对输入数据进行严格的验证和过滤，确保输入数据符合预期的格式和类型，避免被攻击者注入恶意命令。\n- 输出过滤：在程序输出处对输出数据进行严格的过滤和检查，确保输出数据符合预期的格式和类型，避免被攻击者截获和篡改。\n- 使用安全的编程模型：使用安全的编程模型，例如避免使用原生的命令执行方式，使用安全的框架和库来处理输入数据和执行命令，避免命令注入漏洞。\n- 数据库加密和访问控制：对于敏感数据和命令，使用加密和访问控制措施，确保只有授权用户可以访问和执行命令，避免被攻击者窃取和篡改。\n- 定期更新和升级：定期更新和升级应用程序和库的版本，确保应用程序和库的最新版本包含了最新的安全补丁和修复措施，避免安全漏洞的出现和利用。\n- 安全审计和监控：定期对系统和应用程序进行安全审计和监控，及时发现和阻止潜在的安全漏洞和攻击，确保系统和数据的安全和可靠性。", "title": "如何预防命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-94097", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:N/AC:L/Au:N/C:C/I:C/A:C", "severity": "high", "base_score": 10}], "cvssv3": [{"source": "VulDB", "vector": "CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H/E:P/RL:X/RC:R", "severity": "critical", "base_score": 10}], "cvssv31": [{"source": "cna@vuldb.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 10}], "cvssv4": [{"source": "cna@vuldb.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-77", "description": "Netcore NBR200V2 是磊科（Netcore）闭源商用宽带路由器，用于网络接入、NAT 与设备管理，固件 Web 管理面提供 CGI 诊断接口。\n受影响版本中，CGI 诊断脚本 /www/cgi-bin/network_tools 在校验 sid 之前解析 QUERY_STRING，将片段拆成 param、key、val 后执行 eval \"${key}='${val}'\"。参数名未限制为安全白名单，远程攻击者可在 HTTP 查询串的 key 中嵌入 shell 元字符，使请求在进入后续 ping/traceroute 处理及会话校验前即被当作命令执行，造成设备重启、拒绝服务或任意代码执行。\n修复版本中通过取消或约束 QUERY_STRING 解析阶段对 key 的 eval 动态赋值，并让会话校验先于参数解释，切断未授权命令注入。截至本报告分析时厂商未回应且未发布公开修复版本，在官方固件更新前应限制对该诊断端点的访问。", "effects": [{"comp_name": "NBR200V2", "ecosystem": "linux", "versions": [{"affected_version": "[1.3.241127.071246,1.3.241127.071246]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "命令注入", "kind_en": "命令中使用的特殊元素的不正确中和（“命令注入”）", "last_modified_time": "2026-09-21", "level": "Critical", "mps_id": "MPS-nza1-8i9b", "poc": false, "poc_url": [], "published_time": "2026-09-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-nza1-8i9b", "name": "https://www.oscs1024.com/hd/MPS-nza1-8i9b"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-94097", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-94097"}, {"url": "https://vuldb.com/vuln/408026", "name": "VDB-408026 | Netcore NBR200V2 CGI Diagnostic Endpoint network_tools command injection"}, {"url": "https://vuldb.com/vuln/408026/cti", "name": "VDB-408026 | CTI Indicators (IOB, IOC, TTP, IOA)"}, {"url": "https://vuldb.com/cve/CVE-2026-94097", "name": "CVE-2026-94097 | CVE Analysis pt 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-79920", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.9}]}, "cvss_score": 9.9, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "cwe": "CWE-862", "description": "Ajenti 是面向 Linux 与 BSD 的开源模块化服务器管理面板，用于通过 Web 界面管理主机服务与插件。\n受影响版本中，任意已登录用户都可向 /api/core/tasks/start 提交任务。plugins/core/views/tasks.py 的 Handler.handle_api_tasks_start 只校验会话并按允许列表实例化 InstallPlugin、UnInstallPlugin 或 UpgradeAll，plugins/plugins/tasks.py 中的对应 run 方法没有插件管理权限检查。InstallPlugin 与 UnInstallPlugin 把调用方传入的 name、version 直接拼成 pip 包规格，任务进程在 root 身份下执行 pip，低权限账户可借此安装、卸载或升级插件，并在主机上以 root 执行代码。\n修复版本中通过在 InstallPlugin.run、UpgradeAll.run 与 UnInstallPlugin.run 上分别强制 plugins:install、plugins:upgrade、plugins:uninstall 权限，并在拼接包规格前拒绝不符合允许字符集的 name 与 version，同时将 pip install 限定到官方索引且不拉取依赖，使未获授权的账户无法再通过该任务接口以 root 安装软件包。", "effects": [{"comp_name": "ajenti", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.2.16)", "min_fixed_version": "2.2.16", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "ajenti.plugin.plugins", "ecosystem": "pip", "versions": [{"affected_version": "(-∞,0.55)", "min_fixed_version": "0.55", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", 09-19T00:52:46+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-i51r-3ds8"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过向受信任的数据序列化过程中添加恶意数据，从而在序列化和反序列化过程中执行恶意代码的攻击漏洞。这种漏洞通常存在于使用序列化 (serialization) 机制存储和传输数据的程序中。\n", "title": "什么是反序列化"}, {"content": "- 注入攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码注入到程序中，从而实现代码执行的目的。\n- 反射攻击：攻击者使用反射机制，在序列化过程中动态生成恶意数据，并将恶意代码注入到程序中，从而实现代码执行的目的。\n- 缓冲区溢出攻击：攻击者通过在序列化过程中向缓冲区输入恶意数据，导致缓冲区溢出，从而破坏程序的内存管理，实现代码执行的目的。\n- 格式字符串攻击：攻击者通过在序列化过程中输入恶意数据，导致程序使用错误的格式字符串，从而实现代码执行的目的。\n- 数据流攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码作为一个数据流传递给程序，从而实现代码执行的目的。\n", "title": "反序列化常见的攻击方式"}, {"content": "- 不信任输入数据：程序应该严格检查输入数据的有效性，并避免使用不受信任的数据。\n- 使用安全的序列化机制：程序应该使用安全的序列化机制，如 JSON 或 XML 序列化，而不是第三方序列化库。\n- 最小特权原则：程序应该限制对受信任数据的处理权限，并避免在运行时修改数据。\n- 代码审查和漏洞扫描：程序应该进行代码审查和漏洞扫描，以发现和修复潜在的安全漏洞。\n", "title": "如何预防反序列化"}], "cnvd_id": "", "cve_id": "CVE-2026-93872", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:H/AT:P/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.7}]}, "cvss_score": 7.7, "cvss_vector": "CVSS:4.0/AV:N/AC:H/AT:P/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-502", "description": "Cotonti 1.0.0 将 base64 解码的 cb 参数传递给 unserialize()，而在评论插件 EditAction 中没有 allowed_classes 限制。具有评论写入权限的注册用户可以实例化任意 PHP 对象，并有可能通过 gadget 链实现文件写入或代码执行。", "effects": [{"comp_name": "cotonti_siena", "ecosystem": "linux", "versions": [{"affected_version": "[1.0.0,1.0.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitabili 如不正确的访问控制、弱密码策略、缺乏加密、错误的日志处理等。", "title": "什么是未授权敏感信息泄露"}, {"content": "- 直接访问敏感信息：攻击者可以通过直接访问不正确配置或不受保护的资源来获取敏感信息，如通过公开可访问的URL、未经授权的文件目录访问等。\n- 越权访问：攻击者可能利用访问控制错误或不正确的权限配置来获取他们没有权限访问的敏感信息。\n- 错误信息披露：应用程序在错误处理过程中可能泄露敏感信息，例如将错误消息中的敏感数据返回给客户端或显示在日志文件中。\n- 信息泄露通过响应：攻击者可能利用应用程序在响应中不正确地包含敏感信息，如通过网页源代码、响应头部或响应消息体中的敏感数据。", "title": "未授权敏感信息泄露常见的攻击方式"}, {"content": "- 访问控制：确保只有经过授权的用户能够访问敏感信息，使用强大的身份验证和授权机制。\n- 数据加密：对于敏感信息，使用适当的加密算法对数据进行加密，包括数据传输和存储过程中的加密。\n- 错误处理和日志安全：正确处理错误情况，避免在错误消息中暴露敏感信息。同时，确保日志记录功能的安全性，避免将敏感信息记录在日志文件中。\n- 安全配置和最佳实践：遵循安全最佳实践，对应用程序、服务器和系统进行适当的配置，包括访问控制、权限管理、密码策略等。\n- 审计和监控：实施日志审计和监控机制，及时检测和响应任何异常活动或潜在的信息暴露事件。\n- 安全开发实践：在应用程序开发过程中，进行安全代码审查、漏洞扫描和安全测试，以及敏感信息的正确处理和保护。", "title": "如何预防未授权敏感信息泄露"}], "cnvd_id": "", "cve_id": "CVE-2026-1255", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "cwe": "CWE-200", "description": "WordPress 的 YS LeadGen 插件在 2.1.4 及之前的所有版本中都容易受到敏感信息泄露的影响，因为未经身份验证的用户可以访问“ysleadgen_get_captured_data”AJAX 操作。这使得未经身份验证的攻击者可以检索所有捕获的表单提交数据，包括个人身份信息 (PII)，例如通过 YS LeadGen 表单提交的姓名、电子邮件地址和消息内容。", "effects": [{"comp_name": "YS LeadGen – Popup Builder, Popup Maker \u0026 Form Builder for WordPress | Lead Generation, Email Marketing, Sales, Conversions, Opt-Ins \u0026 Subscribers", "ecosystem": "linux", "versions": [{"affected_version": "(0,2.1.4]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "未授权敏感信息泄露", "kind_en": "向未经授权的行为者泄露敏感信息", "last_modified_time": "2026-09-19", "level": "High", "mps_id": "MPS-rge8-oi0p", "poc": false, "poc_url": [], "published_time": "2026-09-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-rge8-oi0p", "name": "https://www.oscs10 ，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-93958", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:N/AC:L/Au:M/C:C/I:C/A:C", "severity": "high", "base_score": 8.3}], "cvssv3": [{"source": "VulDB", "vector": "CVSS:3.0/AV:N/AC:L/PR:H/UI:N/S:C/C:H/I:H/A:H/E:P/RL:X/RC:R", "severity": "critical", "base_score": 9.1}], "cvssv31": [{"source": "cna@vuldb.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.1}], "cvssv4": [{"source": "cna@vuldb.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.5}]}, "cvss_score": 8.5, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-78", "description": "D-Link R95 BE9500_1.00.16 中发现漏洞。该漏洞影响组件DHMAPI的文件/bin/ssi的功能系统。对 NTPServer 参数的操作会导致 os 命令注入。攻击可以远程执行。该漏洞已被公开并且可以被使用。", "effects": [{"comp_name": "R95", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,BE9500_1.00.16]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-09-20", "level": "High", "mps_id": "MPS-1d3p-k48h", "poc": false, "poc_url": [], "published_time": "2026-09-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-1d3p-k48h", "name": "https://www.oscs1024.com/hd/MPS-1d3p-k48h"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-93958", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-93958"}, {"url": "https://vuldb.com/vuln/407917", "name": "VDB-407917 | D-Link R95 DHMAPI ssi system os command injection"}, {"url": "https://vuldb.com/vuln/407917/cti", "name": "VDB-407917 | CTI Indicators (IOB, IOC, TTP, IOA)"}, {"url": "https://vuldb.com/cve/CVE-2026-93958", "name": "CVE-2026-93958 | CVE Analysis and Report"}, {"url": "https://vuldb.com/submit/944149", "name": "Submit #944149 | DLink R95 1.01B06 CWE-78"}, {"url": "https://github.com/FoundTL/D-Link-R95-BE9500", "name": ""}, {"url": "https://www.dlink.com/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "D-Link R95 DHMAPI ssi 系统操作系统命令注入", "_translated": true, "_saved_at": "2026-09-20T05:37:28+00:00", "_first_saved_at": "2026-09-20T05:37:28+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-1d3p-k48h"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预 WS-Policy 时只把 wsp:* 操作符节点计入 maxElements 与 maxAttributes 限额，断言子树由 StaxToDOMConverter.readDocElements 整段物化为 DOM 且不占用预算。攻击者可在策略断言内放入不受限额约束的元素或属性，使堆内存耗尽并造成拒绝服务。\n修复版本中通过在 StaxToDOMConverter 物化断言子树时调用 PolicyBuilder.chargeAmbientElement 与 chargeAmbientAttributes，把每个节点计入同一解析预算，超限立即中止解析；OMToDOMConverter 在存在 ambient budget 时改走同一 StAX 计费路径。", "effects": [{"comp_name": "org.apache.neethi:neethi", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,3.2.4)", "min_fixed_version": "3.2.4", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "不加限制或调节的资源分配", "kind_en": "不受限制或节流地分配资源", "last_modified_time": "2026-09-20", "level": "High", "mps_id": "MPS-295b-6bee", "poc": false, "poc_url": [], "published_time": "2026-09-20", "reference_url_list": [{"url": "http://www.mail-archive.com/announce@apache.org/msg11957.html", "name": ""}, {"url": "https://ws.apache.org/neethi/security.html", "name": ""}, {"url": "https://ws.apache.org/neethi/", "name": ""}, {"url": "https://www.openwall.com/lists/oss-security/2026/09/18/11", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-91864", "name": ""}, {"url": "https://github.com/apache/ws-neethi/commit/754397ee7309c48b3692af931efe349a0f31f11f", "name": ""}, {"url": "https://github.com/apache/ws-neethi/commit/fdaf27e3f093a4d65ce12df271d7922c74213eab", "name": ""}, {"url": "https://github.com/apache/ws-neethi/pull/72", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "Neethi策略解析拒绝服务", "_translated": true, "_saved_at": "2026-09-20T10:26:36+00:00", "_first_saved_at": "2026-09-20T10:26:36+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-295b-6bee"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-91866", "cvss": {}, "cvss_score": 7.5, "cvss_vector": "", "cwe": "CWE-407", "description": "Apache Neethi 是 Apache 基金会开源的 WS-Policy 处理框架，Maven 坐标为 org.apache.neethi:neethi，用于 Web 服务栈解析、规范化并计算策略交集。\n受影响版本中，Policy.intersect 将两侧策略交给 PolicyIntersector.intersect 计算兼容断言。当同名 PolicyContainingAssertion 成对出现时，内部会无上限地递归调用 compatiblePolicies，候选搜索随嵌套层扇出呈指数增长，导致 CPU 长时间占用并形成拒绝服务。\n修复版本中通过为单次 intersect 与 compatiblePolicies 引入 MAX_INTERSECT_STEPS 步数预算（默认 1000000），超出预算即抛出 RuntimeException，阻断无界递归候选搜索。", "effects": [{"comp_name": "org.apache.neethi:neethi", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,3.2.4)", "min_fixed_version": "3.2.4", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "低效算法复杂性", "kind_en": "低效的算法复杂性", "last_modified_time": "2026-09-20", "level": "High", "mps_id": "MPS-77bd-ec52", "poc": false, "poc_url": [], "published_time": "2026-09-20", "reference_url_list": [{"url": "https://www.openwall.com/lists/oss-security/2026/09/18/13", "name": ""}, {"url": "https://ws.apache.org/neethi/security.html", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-91866", "name": ""}, {"url": "https://ws.apache.org/neethi/", "name": ""}, {"url": "https://github.com/apache/ws-neethi/commit/5f6e31657326e7272933427424b9316f12d26147", "name": ""}, {"url": "https://github.com/apache/ws-neethi/pull/71", "name": ""}, {"url": "https://seclists.org/oss-sec/2026/q3/832", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "Neethi策略交集拒绝服务", "_translated": true, "_saved_at": "2026-09-20T10:26:40+00:00", "_first_saved_at": "2026-09-20T10:26:40+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-77bd-ec52"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-91863", "cvss": {}, "cvss_score": 7.5, "cvss_vector": "", "cwe": "CWE-674", "description": "Apache Neethi 是开源 Java WS-Policy 处理框架，以 Maven 构件 org.apache.neethi:neethi 发布，供 Web 服务栈解析和归一化策略文档。\n受影响版本中，PolicyBuilder.getPolicy 每次调用都会新建 ParseBudgetContext，而 XMLPrimitiveAssertionBuilder.build 在断言仅包含嵌套 wsp:Policy 时会再次调用 getPolicy。攻击者提交 Assertion 与 wsp:Policy 交替深层嵌套的策略文档后，maxDepth 限制被重置，解析线程栈被耗尽，解析器崩溃并形成拒绝服务。\n修复版本中通过 ThreadLocal 保存当前解析预算，使嵌套 getPolicy 继承同一 ParseBudgetContext 与 reentryDepth，超过 maxDepth 时抛出异常并中止解析。", "effects": [{"comp_name": "org.apache.neethi:neethi", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,3.2.4)", "min_fixed_version": "3.2.4", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "未经控制的递归", "kind_en": "Uncontrolled Recursion", "last_modified_time": "2026-09-20", "level": "High", "mps_id": "MPS-99ed-bb74", "poc": false, "poc_url": [], "published_time": "2026-09-20", "reference_url_list": [{"url": "https://www.openwall.com/lists/oss-security/2026/09/18/10", "name": ""}, {"url": "https://ws.apache.org/neethi/security.html", "name": ""}, {"url": "https://ws.apache.org/", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-91863", "name": ""}, {"url": "https://github.com/apache/ws-neethi/commit/d21f0a79a365b2c965016d7761bd9b5343439b5e", "name": ""}, {"url": "https://github.com/apache/ws-neethi/pull/66", "name": ""}, {"url": "https://github.com/apache/ws-neethi/releases/tag/neethi-3.2.4", "name": ""}, {"url": "https://seclists.org/oss-sec/2026/q3/829", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "Neethi不受控递归漏洞", "_translated": true, "_saved_at": "2026-09-20T10:26:39+00:00", "_first_saved_at": "2026-09-20T10:26:39+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-99ed-bb74"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能有效地控制资源的使用，导致攻击者可以利用这个漏洞耗尽应用程序所依赖的资源。这些资源可以是计算资源（CPU、内存）、网络带宽、数据库连接或其他系统资源。攻击者可以通过发送特制的请求、恶意输入或其他方式，使应用程序消耗大量资源，导致拒绝服务或系统崩溃。", "title": "什么是拒绝服务"}, {"content": "- 消耗计算资源：攻击者可以发送计算密集型的请求，例如复杂的计算、无限循环或递归操作，以耗尽应用程序的计算资源，导致应用程序无法响应其他请求。\r\n- 消耗内存资源：攻击者可以发送大量的数据或恶意输入，以导致应用程序消耗过多的内存资源，从而使系统的可用内存耗尽，并导致应用程序崩溃或变得不可用。\r\n- 消耗网络带宽：攻击者可以发送大量的请求或大型数据包，以消耗应用程序所依赖的网络带宽。这会导致其他合法用户无法正常访问应用程序或降低系统的整体网络性能。\r\n- 消耗存储资源：攻击者可以发送大量的请求或上传大文件，以耗尽应用程序的存储资源，导致系统无法处理其他请求或存储新的数据。", "title": "拒绝服务常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对输入数据进行合理的验证和过滤，防止恶意输入导致资源消耗过高。\r\n- 实施资源限制：应用程序应该实施适当的资源限制策略，例如限制计算操作的时间或次数，限制内存使用量，限制并发连接数等，以防止资源被耗尽。\r\n- 异常处理与错误恢复：应用程序应该具备健壮的异常处理和错误恢复机制，以防止因意外错误导致资源泄漏或无法释放的情况。\r\n- 资源监控与警报：应用程序应该实施适当的资源监控和警报机制，及时发现异常的资源消耗情况，并采取相应的措施来应对。\r\n- 压力测试与性能优化：应用程序应该进行压力测试，以评估其在高负载情况下的性能，并进行必要的性能优化，以确保能够有效地处理大量请求而不耗尽资源。", "title": "如何预防拒绝服务"}], "cnvd_id": "", "cve_id": "CVE-2026-91865", "cvss": {}, "cvss_score": 7.5, "cvss_vector": "", "cwe": "CWE-400", "description": "Apache Neethi 是 Apache Web Services 项目维护的开源 Java WS-Policy 框架，Maven 坐标为 org.apache.neethi:neethi，用于解析、归一化与合并 WS-Policy 文档。\n受影响版本中，攻击者可提交含多层重复 PolicyReference 的小型 WS-Policy 文档。文档经 PolicyEngine.getPolicy 进入组件后，Policy.normalize 调用 AbstractPolicyOperator.normalizeOperator 展开引用。该方法在每次展开完成后从 resolving 集合移除环检测标记，同层兄弟引用会再次完整展开同一目标策略，使展开工作量随 DAG 深度按二的幂增长；同时每层仍只产生一个 alternative，既有 MAX_ALTERNATIVES 上限无法拦截，最终耗尽 CPU 与内存并造成拒绝服务。\n修复版本中通过在 AbstractPolicyOperator 中引入 NormalizeBudget，将单次归一化的 PolicyReference 展开次数限制为 100000，超限时抛出 RuntimeException，阻断引用反复展开带来的指数级资源消耗。", "effects": [{"comp_name": "org.apache.neethi:neethi", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,3.2.4)", "min_fixed_version": "3.2.4", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "拒绝服务", "kind_en": "不受控制的资源消耗", "last_modified_time": "2026-09-20", "level": "High", "mps_id": "MPS-c855-d0c5", "poc": false, "poc_url": [], "published_time": "2026-09-20", "reference_url_list": [{"url": "https://www.openwall.com/lists/oss-security/2026/09/18/12", "name": ""}, {"url": "https://ws.apache.org/neethi/security.html", "name": ""}, {"url": "https://ws.apache.org/", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-91865", "name": ""}, {"url": "https://github.com/apache/ws-neethi/commit/dfcbf599f7a5fa63a9dbb71f84bcf6ba67a369f0", "name": ""}, {"url": "https://github.com/apache/ws-neethi/pull/67", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "Neethi策略引用膨胀漏洞", "_translated": true, "_saved_at": "2026-09-20T10:26:38+00:00", "_first_saved_at": "2026-09-20T10:26:38+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-c855-d0c5"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-94056", "cvss": {"cvssv31": [{"source": "cve@mitre.org", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:C/C:H/I:N/A:L", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:C/C:H/I:N/A:L", "cwe": "CWE-908", "description": "在 4.100.1 之前的 Exim 中，当代理协议与攻击者控制的代理一起使用时，允许攻击者从堆栈内存中读取某些未初始化的数据。", "effects": [{"comp_name": "exim", "ecosystem": "linux", "versions": [{"affected_version": "[4.83,4.100.1)", "min_fixed_version": "4.100.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "对未经初始化资源的使用", "kind_en": "使用未初始化的资源", "last_modified_time": "2026-09-20", "level": "High", "mps_id": "MPS-yr59-7bms", "poc": false, "poc_url": [], "published_time": "2026-09-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-yr59-7bms", "name": "https://www.oscs1024.com/hd/MPS-yr59-7bms"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-94056", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-94056"}, {"url": "https://lists.exim.org/lurker/message/20260918.121220.0f87338e.en.html", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-94056漏洞", "_translated": true, "_saved_at": "2026-09-20T00:33:33+00:00", "_first_saved_at": "2026-09-20T00:33:33+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-yr59-7bms"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-94113", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:N", "severity": "medium", "base_score": 6.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-862", "description": "ERPNext 是 Frappe 团队开源的企业资源计划（ERP）系统，基于 Frappe Framework 构建，提供项目、销售、财务与人力资源等业务模块，其 Timesheet（工时单）用于记录可计费工时与计费金额。\n受影响版本中，erpnext/projects/doctype/timesheet/timesheet.py 内多个经 @frappe.whitelist() 暴露为 HTTP RPC 的方法未执行 doctype 级授权校验：get_projectwise_timesheet_data 无权限过滤地查询全部已提交计费工时明细，get_timesheet_detail_rate 可按任意 timelog 名称返回 bil Next 工时端点越权信息泄露", "_translated": true, "_saved_at": "2026-09-20T14:25:05+00:00", "_first_saved_at": "2026-09-20T14:25:05+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-9zfe-odml"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-93992", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:N/I:H/A:H", "severity": "high", "base_score": 8.1}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:A/VC:N/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7}]}, "cvss_score": 7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:A/VC:N/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-22", "description": "Gopeed 至 2.0.0-beta.3 版本在存档提取中包含路径遍历漏洞，允许攻击者在提取目录之外写入任意文件。攻击者可以使用包含绕过验证的目录遍历序列的条目来制作恶意档案，从而在用户下载并提取启用自动解压的档案时启用文件写入操作。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-09-20", "level": "High", "mps_id": "MPS-m2ky-hela", "poc": false, "poc_url": [], "published_time": "2026-09-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-m2ky-hela", "name": "https://www.oscs1024.com/hd/MPS-m2ky-hela"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-93992", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-93992"}, {"url": "https://github.com/GopeedLab/gopeed/issues/1525", "name": "GitHub Issue #1525"}, {"url": "https://github.com/GopeedLab/gopeed/commit/38750d8505274e55cf11aa77f0694c71dd82f519", "name": ""}, {"url": "https://github.com/GopeedLab/gopeed/blob/a5cd53f94c18ac65add684b1113fa5f0b47cc4da/pkg/download/extract_7z.go#L45-L53", "name": "7z extraction sink at v1.9.3"}, {"url": "https://github.com/GopeedLab/gopeed/blob/a5cd53f94c18ac65add684b1113fa5f0b47cc4da/pkg/download/extract.go#L284-L296", "name": "extractFile directory sink at v1.9.3"}, {"url": "https://github.com/GopeedLab/gopeed", "name": ""}, {"url": "https://www.vulncheck.com/advisories/gopeed-through-2.0.0-beta.3-arbitrary-file-write-via-path-traversal", "name": "VulnCheck Advisory: Gopeed through 2.0.0-beta.3 Arbitrary File Write via Path Traversal"}], "scope_influence": "", "tags": [], "title": "Gopeed通过2.0.0-beta.3路径遍历任意文件写入", "_translated": true, "_saved_at": "2026-09-20T00:33:49+00:00", "_first_saved_at": "2026-09-20T00:33:49+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-m2ky-hela"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-94054", "cvss": {"cvssv31": [{"source": "cve@mitre.org", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:L/I:H/A:L", "severity": "high", "base_score": 7}]}, "cvss_score": 7, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:L/I:H/A:L", "cwe": "CWE-787", "description": "4.100.1 之前的 Exim，当 Proxy-Protocol 与攻击者控制的代理一起使用时，会出现越界写入。", "effects": [{"comp_name": "exim", "ecosystem": "linux", "versions": [{"affected_version": "[4.83,4.100.1)", "min_fixed_version": "4.100.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-09-20", "level": "High", "mps_id": "MPS-zk0p-139j", "poc": false, "poc_url": [], "published_time": "2026-09-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-zk0p-139j", "name": "https://www.oscs1024.com/hd/MPS-zk0p-139j"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-94054", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-94054"}, {"url": "https://lists.exim.org/lurker/message/20260918.121220.0f87338e.en.html", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-94054漏洞", "_translated": true, "_saved_at": "2026-09-20T00:33:47+00:00", "_first_saved_at": "2026-09-20T00:33:47+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-zk0p-139j"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-92574", "cvss": {"cvssv31": [{"source": "secalert@redhat.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-250", "description": "CRI-O 是开源的 Kubernetes CRI 实现，用于在节点上创建并运行 OCI 容器。\n受影响版本中，CreateContainer 在识别到 checkpoint 归档或带 checkpoint 注解的远程 OCI 镜像后会进入 CRImportCheckpoint 与 ContainerRestore。CRIU 会从 checkpoint 数据恢复进程凭证、Linux capabilities、no_new_privs 以及 seccomp 状态，而不会强制应用目标 Pod 的 Kubernetes 安全上下文，导致具备创建 Pod 权限的用户可以借助恶意 checkpoint 镜像获得更高权限执行。\n修复版本中通过将 DefaultConfig 里 container_level_enabled 的默认值改为 checkpoint_only，并让 CreateContainer 仅在 RestoreContainerEnabled() 为真时进入恢复路径，从而在默认配置下阻断从恶意 checkpoint 镜像恢复的利用链。", "effects": [{"comp_name": "github.com/cri-o/cri-o", "ecosystem": "go", "versions": [{"affected_version": "[1.35.0,1.35.9)", "min_fixed_version": "1.35.9", "repository": "go", "solutions": [], "upstream": true}, {"affected_version": "[1.34.0,1.34.14)", "min_fixed_version": "1.34.14", "repository": "go", "solutions": [], "upstream": true}, {"affected_version": "[1.36.0,1.36.6)", "min_fixed_version": "1.36.6", "repository": "go", "solutions": [], "upstream": true}]}, {"comp_name": "openshift_container_platform", "ecosystem": "linux", "versions": [{"affected_version": "[4.17,+∞)", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "带着不必要的权限执行", "kind_en": "使用不必要的权限执行", "last_modified_time": "2026-09-21", "level": "High", "mps_id": "MPS-6w2m-tg49", "poc": false, "poc_url": [], "published_time": "2026-09-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-6w2m-tg49", "name": "https://www.oscs1024.com/hd/MPS-6w2m-tg49"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-92574", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-92574"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-92574", "name": ""}, {"url": "https://bugzilla.redhat.com/show_bug.cgi?id=2535436", "name": "RHBZ#2535436"}], "scope_influence": "", "tags": ["go", "应用软件"], "title": "CRI-O安全上下文绕过", "_translated": true, "_saved_at": "2026-09-21T11:43:36+00:00", "_first_saved_at": "2026-09-21T11:43:36+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-6w2m-tg49"}, {"analysis_status": 0, "articles": [{"content": "- 命令注入是一种攻击，其目标是通过易受攻击的应用程序在主机操作系统上执行任意命令。 当应用程序将不安全的用户提供的数据（表单、cookie、HTTP 标头等）传递到系统 shell 时，就会产生缺陷。攻击者通过构造恶意的命令或数据，将其注入到程序执行的上下文中，从而绕过程序的输入验证和安全措施，实现对程序操作的恶意操作。", "title": "什么是命令注入"}, {"content": "- 文件上传：攻击者通过构造恶意的文件上传请求，将包含恶意命令的文件上传到服务器，从而利用命令注入漏洞执行恶意命令。\n- SQL 注入：攻击者通过构造恶意的 SQL 查询语句，将包含恶意命令的 SQL 语句注入到数据库中，从而执行恶意命令，窃取数据或者破坏系统。\n- 命令执行：攻击者通过在 Web 应用程序的表单提交数据中注入恶意命令，从而执行恶意命令，例如删除文件、格式化硬盘等。\n- 命令注入漏洞的旁路攻击：攻击者可以利用命令注入漏洞旁路控制程序的执行流程，从而窃取数据、破坏系统、控制程序等。\n", "title": "命令注入常见的攻击方式"}, {"content": "- 输入验证：在程序输入处对输入数据进行严格的验证和过滤，确保输入数据符合预期的格式和类型，避免被攻击者注入恶意命令。\n- 输出过滤：在程序输出处对输出数据进行严格的过滤和检查，确保输出数据符合预期的格式和类型，避免被攻击者截获和篡改。\n- 使用安全的编程模型：使用安全的编程模型，例如避免使用原生的命令执行方式，使用安全的框架和库来处理输入数据和执行命令，避免命令注入漏洞。\n- 数据库加密和访问控制：对于敏感数据和命令，使用加密和访问控制措施，确保只有授权用户可以访问和执行命令，避免被攻击者窃取和篡改。\n- 定期更新和升级：定期更新和升级应用程序和库的版本，确保应用程序和库的最新版本包含了最新的安全补丁和修复措施，避免安全漏洞的出现和利用。\n- 安全审计和监控：定期对系统和应用程序进行安全审计和监控，及时发现和阻止潜在的安全漏洞和攻击，确保系统和数据的安全和可靠性。", "title": "如何预防命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-94096", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:N/AC:L/Au:S/C:C/I:C/A:C", "severity": "high", "base_score": 9}], "cvssv3": [{"source": "VulDB", "vector": "CVSS:3.0/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H/E:P/RL:X/RC:R", "severity": "critical", "base_score": 9.9}], "cvssv31": [{"source": "cna@vuldb.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.9}], "cvssv4": [{"source": "cna@vuldb.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/ ""}], "scope_influence": "", "tags": ["应用软件"], "title": "NBR200V2命令注入漏洞", "_translated": true, "_saved_at": "2026-09-21T00:45:42+00:00", "_first_saved_at": "2026-09-21T00:45:42+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-fcju-lwd8"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-88855", "cvss": {"cvssv4": [{"source": "security@joomla.org", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-89", "description": "OrdaSoft Joomla Gallery 是 OrdaSoft 提供的 Joomla 图库扩展，包含免费版 com_osgallery_light 与付费版 com_osgallery，用于在站点后台创建和管理相册、分类与图片。该扩展以厂商发行包形式分发，源码仓库未作为 GitHub 公开项目提供。\n受影响版本中，saveGallery() 将表单数据经自写解析器写入 Joomla Input 对象，再以 ARRAY/STRING 过滤器读回，这两类过滤器不会净化 SQL 内容。category_names[]、catOrderIds 以及图片排序字段被直接拼入 SQL，缺少引号包裹与整数转换。具备 core.manage 权限的图库组件管理用户（该权限仅覆盖单个图库组件，不等于全站管理员）可对数据库进行读写，包括通过 UNION 提取 #__users 密码哈希。\n修复版本中通过官方安全更新收紧 saveGallery() 对上述表单字段进入 SQL 的处理，阻断未净化输入再被拼接执行。公开资料未披露更细粒度的源码修改，建议升级至 6.2.7 及以上版本。", "effects": [{"comp_name": "com_osgallery", "ecosystem": "linux", "versions": [{"affected_version": "[1.0.0,6.2.7)", "min_fixed_version": "6.2.7", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "com_osgallery_light", "ecosystem": "linux", "versions": [{"affected_version": "[1.0.0,6.2.7)", "min_fixed_version": "6.2.7", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-09-21", "level": "High", "mps_id": "MPS-kge6-yti1", "poc": false, "poc_url": [], "published_time": "2026-09-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-kge6-yti1", "name": "https://www.oscs1024.com/hd/MPS-kge6-yti1"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-88855", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-88855"}, {"url": "https://www.OrdaSoft.com/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "OS Gallery SQL注入漏洞", "_translated": true, "_saved_at": "2026-09-20T20:08:51+00:00", "_first_saved_at": "2026-09-20T20:08:51+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-kge6-yti1"}, {"analysis_status": 0, "articles": [{"content": "- 命令注入是一种攻击，其目标是通过易受攻击的应用程序在主机操作系统上执行任意命令。 当应用程序将不安全的用户提供的数据（表单、cookie、HTTP 标头等）传递到系统 shell 时，就会产生缺陷。攻击者通过构造恶意的命令或数据，将其注入到程序执行的上下文中，从而绕过程序的输入验证和安全措施，实现对程序操作的恶意操作。", "title": "什么是命令注入"}, {"content": "- 文件上传：攻击者通过构造恶意的文件上传请求，将包含恶意命令的文件上传到服务器，从而利用命令注入漏洞执行恶意命令。\n- SQL 注入：攻击者通过构造恶意的 SQL 查询语句，将包含恶意命令的 SQL 语句注入到数据库中，从而执行恶意命令，窃取数据或者破坏系统。\n- 命令执行：攻击者通过在 Web 应用程序的表单提交数据中注入恶意命令，从而执行恶意命令，例如删除文件、格式化硬盘等。\n- 命令注入漏洞的旁路攻击：攻击者可以利用命令注入漏洞旁路控制程序的执行流程，从而窃取数据、破坏系统、控制程序等。\n", "title": "命令注入常见的攻击方式"}, {"content": "- 输入验证：在程序输入处对输入数据进行严格的验证和过滤，确保输入数据符合预期的格式和类型，避免被攻击者注入恶意命令。\n- 输出过滤：在程序输出处对输出数据进行严格的过滤和检查，确保输出数据符合预期的格式和类型，避免被攻击者截获和篡改。\n- 使用安全的编程模型：使用安全的编程模型，例如避免使用原生的命令执行方式，使用安全的框架和库来处理输入数据和执行命令，避免命令注入漏洞。\n- 数据库加密和访问控制：对于敏感数据和命令，使用加密和访问控制措施，确保只有授权用户可以访问和执行命令，避免被攻击者窃取和篡改。\n- 定期更新和升级：定期更新和升级应用程序和库的版本，确保应用程序和库的最新版本包含了最新的安全补丁和修复措施，避免安全漏洞的出现和利用。\n- 安全审计和监控：定期对系统和应用程序进行安全审计和监控，及时发现和阻止潜在的安全漏洞和攻击，确保系统和数据的安全和可靠性。", "title": "如何预防命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-94095", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:N/AC:L/Au:S/C:C/I:C/A:C", "severity": "high", "base_score": 9}], "cvssv3": [{"source": "VulDB", "vector": "CVSS:3.0/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H/E:P/RL:X/RC:R", "severity": "critical", "base_score": 9.9}], "cvssv31": [{"source": "cna@vuldb.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.9}], "cvssv4": [{"source": "cna@vuldb.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-77", "description": "Netcore NBR200V2 是磊科（Netcore）推出的商业网络路由器产品，固件闭源，用于企业路由转发与设备诊断管理。\n受影响版本中，Traceroute 诊断功能通过 ubus JSON-RPC 方法 network_tools.tools_traceroute 接收远程请求中的 url 参数。二进制 /usr/bin/network_tools 内处理函数 sub_401BD8 解析该参数后调用 tools_traceroute()，后者使用 snprintf 把 url 直接拼入 traceroute 命令字符串并交由 system() 执行，未过滤分号与逻辑运算符，已认证远程用户可注入任意系统命令并完全控制设备。\n修复版本中通过停止将 url 直接拼入 system() 命令行来切断注入链。公开披露时厂商未回应，官方记录未给出修复版本，公开资料也未提供补丁。", "effects": [{"comp_name": "nbr200v2", "ecosystem": "linux", "versions": [{"affected_version": "[1.3.241127.071246,1.3.241127.071246]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false  0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-84990", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-862", "description": "ntopng 是 ntop 发布的开源 Web 网络流量监控应用，用于采集、分析并展示网络流量与主机行为。\n受影响版本中，REST 脚本 download_backup.lua 与 list_available_backups.lua 未调用 isAdministratorOrPrintErr()。已登录的非管理员用户可请求这两个接口；download_backup.lua 读取 _GET[\"epoch\"] 与 _GET[\"download\"] 后调用 backup_config.export_backup 返回已保存的系统配置备份。备份由 backup_config.exec_backup 经 all_import_export:export 生成，export 调用 prefs_dump_utils.build_prefs_dump_table，按 ntopng.prefs.* 与 ntopng.user.* 导出 Redis 键，因此备份包含本地用户密码哈希，并在相关凭据已配置时包含 API token、TOTP 密钥和 WebAuthn 凭据，使可直接使用或可还原的凭据暴露给非管理员账户。\n修复版本中通过在 download_backup.lua 与 list_available_backups.lua 入口调用 isAdministratorOrPrintErr() 切断未授权访问。非管理员请求返回 rest_utils.consts.err.not_granted 后结束处理，不能再列举备份，也不能再经 backup_config.export_backup 下载包含 ntopng.user.* 的配置备份。", "effects": [{"comp_name": "ntopng", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,6.7.260718)", "min_fixed_version": "6.7.260718", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-09-22", "level": "High", "mps_id": "MPS-f206-yzgj", "poc": false, "poc_url": [], "published_time": "2026-09-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-f206-yzgj", "name": "https://www.oscs1024.com/hd/MPS-f206-yzgj"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-84990", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-84990"}, {"url": "https://github.com/ntop/ntopng/security/advisories/GHSA-7gqc-vjwr-6rh5", "name": "https://github.com/ntop/ntopng/security/advisories/GHSA-7gqc-vjwr-6rh5"}, {"url": "https://github.com/ntop/ntopng/commit/f912ee93bc143330b6ff3bb946ee7211e5ee9e1a", "name": "https://github.com/ntop/ntopng/commit/f912ee93bc143330b6ff3bb946ee7211e5ee9e1a"}], "scope_influence": "", "tags": ["应用软件"], "title": "ntopng配置备份越权读取", "_translated": true, "_saved_at": "2026-09-21T17:39:46+00:00", "_first_saved_at": "2026-09-21T17:39:46+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-f206-yzgj"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-77560", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N", "severity": "high", "base_score": 8.1}]}, "cvss_score": 8.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N", "cwe": "CWE-863", "description": "Tinyauth 是开源认证与授权服务器，部署在反向代理之前，为多个应用提供统一登录和按应用访问控制。\n受影响版本中，proxyHandler 使用未经大小写规范化的转发主机名查找按应用访问控制。5.1.2 之前，lookupStaticACLs 或 Docker GetLabels、Kubernetes 域名索引至少有一条路径仍以大小写敏感的字符串相等比较主机名；比较未命中时得不到该应用的用户、用户组、OAuth、LDAP 和 IP 限制。v5.0.7 的 GetLabels 在未命中时返回空 App 且 error 为 nil，proxyHandler 把空限制当作允许，已登录但未被该应用允许的用户改变主机名大小写即可获得已认证结果。未认证请求仍进入登录，全局登录白名单不被绕过。\n修复版本中通过 getACLs 将静态配置、Docker 与 Kubernetes 标签交给 DomainValidator.Validate，由 formatHostname 把主机名转为小写并去掉末尾点号后再比较，大小写不同的等价主机名会命中原有访问控制，被排除的已登录用户不再因查找落空获得放行。", "effects": [{"comp_name": "github.com/steveiliop56/tinyauth", "ecosystem": "go", "versions": [{"affected_version": "(-∞,5.1.0)", "min_fixed_version": "5.1.0", "repository": "go", "solutions": [], "upstream": true}]}, {"comp_name": "github.com/tinyauthapp/tinyauth", "ecosystem": "go", "versions": [{"affected_version": "[5.1.0,5.1.2)", "min_fixed_version": "5.1.2", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-09-22", "level": "High", "mps_id": "MPS-4lwt-so1b", "poc": false, "poc_url": [], "published_time": "2026-09-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-4lwt-so1b", "name": "https://www.oscs1024.com/hd/MPS-4lwt-so1b"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-77560", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-77560"}, {"url": 的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-83621", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:H/A:H", "severity": "high", "base_score": 8.1}]}, "cvss_score": 8.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:H/A:H", "cwe": "CWE-862", "description": "ntopng 是 ntop 维护的开源 Web 网络流量监控应用，用于采集并展示主机、流和告警，并依据威胁情报黑名单识别可疑通信。\n受影响版本中，POST /lua/rest/v2/edit/system/edit_blacklist.lua 对应脚本 scripts/lua/rest/v2/edit/system/edit_blacklist.lua 在调用 lists_utils.editList 之前没有执行 isAdministrator 校验。任意已登录的非管理员用户提交 list_name、list_enabled、url 和 list_update 后，可改写威胁情报黑名单的下载地址、启用状态或更新周期；变更经 Redis 持久化并被重新加载，从而破坏黑名单完整性或使计划更新停止。\n修复版本中通过在读取上述参数并调用 lists_utils.editList 或 lists_utils.reset_blacklist_url 之前增加 isAdministrator 判断切断该路径。非管理员请求返回 rest_utils.consts.err.not_granted 后立即结束，不能再改写黑名单配置。", "effects": [{"comp_name": "ntopng", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,6.7.260717)", "min_fixed_version": "6.7.260717", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-09-22", "level": "High", "mps_id": "MPS-v9yk-c34d", "poc": false, "poc_url": [], "published_time": "2026-09-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-v9yk-c34d", "name": "https://www.oscs1024.com/hd/MPS-v9yk-c34d"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-83621", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-83621"}, {"url": "https://github.com/ntop/ntopng/security/advisories/GHSA-ffg5-889g-f5q8", "name": "https://github.com/ntop/ntopng/security/advisories/GHSA-ffg5-889g-f5q8"}, {"url": "https://github.com/ntop/ntopng/commit/1d0627d802c59130c82478a4eb7f14014064eae5", "name": "https:// "title": "如何预防UAF"}], "cnvd_id": "", "cve_id": "CVE-2026-73513", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-416", "description": "Envoy 是开源边缘与服务代理，用于云原生应用的流量接入与上游转发。\n受影响版本中，可选 oghttp2 上游 HTTP/2 编解码会接受未设置 END_STREAM 的响应 trailer HEADERS。ConnectionImpl::onHeaders 在 Headers 状态下仍调用 decodeTrailers，请求完成路径延迟删除 ActiveRequest，而 oghttp2 不关闭该流，ClientStreamImpl 中的 response_decoder_ 成为悬空引用，后续帧通过已释放对象派发并造成进程崩溃。默认 nghttp2 会在库内拒绝这类 trailer；1.37 及以上受影响版本需显式打开运行时特性 envoy.reloadable_features.http2_use_oghttp2，1.36 及更早版本该特性默认启用。\n修复版本中通过在 OgHttp2Session::PassthroughHeadersHandler::OnHeaderBlockEnd 校验 trailer 必须带有 END_STREAM，缺失时返回 HEADER_HTTP_MESSAGING 并重置流，使不合规 trailer 无法进入请求完成与对象释放路径。", "effects": [{"comp_name": "envoy", "ecosystem": "linux", "versions": [{"affected_version": "[1.37.0,1.37.6)", "min_fixed_version": "1.37.6", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,1.36.10)", "min_fixed_version": "1.36.10", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[1.38.0,1.38.4)", "min_fixed_version": "1.38.4", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[1.39.0,1.39.1)", "min_fixed_version": "1.39.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "UAF", "kind_en": "免费后使用", "last_modified_time": "2026-09-22", "level": "High", "mps_id": "MPS-3xkc-e4yi", "poc": false, "poc_url": [], "published_time": "2026-09-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-3xkc-e4yi", "name": "https://www.oscs1024.com/hd/MPS-3xkc-e4yi"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73513", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73513"}, {"url": "https://github.com/envoyproxy/envoy/security/advisories/GHSA-jjmm-fw8p-crpw", "name": "https://github.com/envoyproxy/envoy/security/advisories/GHSA-jjmm-fw8p-crpw"}, {"url": "https://github.com/envoyproxy/envoy/commit/0d33268d7d8cdc5c8ffef462e0cceefa56156b72", "name": "https://github.com/envoyproxy/envoy/commit/0d33268d7d8cdc5c8ffef462e0cceefa56156b72"}, {"url": "https://github.com/envoyproxy/envoy/commit/3df69eeee220d6a4088cfdd3be79b55e2e6d3514", "name": "https://github.com/envoyproxy/envoy/commit/3df69eeee220d6a4088cfdd3be79b55e2e6d3514"}, {"url": "https://github.com/envoyproxy/envoy/commit/c4610b6c85d72ed01e014c2a1aba2934a2b774e9", "name": "https://github.com/envoyproxy/envoy/commit/c4610b6c85d72ed01e014c2a1aba2934a2b774e9"}, {"url": "https://github.com/envoyproxy/envoy/commit/e6963c6b64cd62aa8e078ef17c76052b6e33e82b", "name": "https://github.com/envoyproxy/envoy/commit/e6963c6b64cd62aa8e078ef17c76052b6e33e82b"}, {"url": "https://github.com/envoyproxy/envoy/releases/tag/v1.37.6", "name": "https://github.com/envoyproxy/envoy/releases/tag/v1.37.6"}, {"url": "https://github.com/envoyproxy/envoy/releases/tag/v1.38.4", "name": "https://github.com/envoyproxy/envoy/releases/tag/v1.38.4"}, {"url": "https://github.com/envoyproxy/envoy/releases/tag/v1.39.1", "name": "https://github.com/envoyproxy/envoy/releases/tag/v1.39.1"}], "scope_influence": "", "tags": ["应用软件"], "title": "Envoy oghttp2崩溃", "_translated": true, "_saved_at": "2026-09-21T21:34:02+00:00", "_first_saved_at": "2026-09-21T21:34:02+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-3xkc-e4yi"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能有效地控制资源的使用，导致攻击者可以利用这个漏洞耗尽应用程序所依赖的资源。这些资源可以是计算资源（CPU、内存）、网络带宽、数据库连接或其他系统资源。攻击者可以通过发送特制的请求、恶意输入或其他方式，使应用程序消耗大量资源，导致拒绝服务或系统崩溃。", "title": "什么是拒绝服务"}, {"content": "- 消耗计算资源：攻击者可以发送计算密集型的请求，例如复杂的计算、无限循环或递归操作，以耗尽应用程序的计算资源，导致应用程序无法响应其他请求。\r\n- 消耗内存资源：攻击者可以发送大量的数据或恶意输入，以导致应用程序消耗过多的内存资源，从而使系统的可用内存耗尽，并导致应用程序崩溃或变得不可用。\r\n- 消耗网络带宽：攻击者可以发送大量的请求或大型数据包，以消耗应用程序所依赖的网络带宽。这会导致其他合法用户无法正常访问应用程序或降低系统的整体网络性能。\r\n- 消耗存储资源：攻击者可以发送大量的请求或上传大文件，以耗尽应用程序的存储资源，导致系统无法处理其他请求或存储新的数据。", "title": "拒绝服务常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对输入数据进行合理的验证和过滤，防止恶意输入导致资源消耗过高。\r\n- 实施资源限制：应用程序应该实施适当的资源限制策略，例如限制计算操作的时间或次数，限制内存使用量，限制并发连接数等，以防止资源被耗尽。\r\n- 异常处理与错误恢复：应用程序应该具备健壮的异常处理和错误恢复机制，以防止因意外错误导致资源泄漏或无法释放的情况。\r\n- 资源监控与警报：应用程序应该实施适当的资源监控和警报机制，及时发现异常的资源消耗情况，并采取相应的措施来应对。\r\n- 压力测试与性能优化：应用程序应该进行压力测试，以评估其在高负载情况下的性能，并进行必要的性能优化，以确保能够有效地处理大量请求而不耗尽资源。", "title": "如何预防拒绝服务"}], "cnvd_id": "", "cve_id": "CVE-2026-94449", "cvss": {"cvssv31": [{"source": "secalert@redhat.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-400", "description": "SmallRye Fault Tolerance 是采用 Apache-2.0 许可的开源 Java 容错库，实现 Eclipse MicroProfile Fault Tolerance，被 Quarkus 用于为微服务提供重试、熔断与超时等策略。\n受影响版本中，编程式 Guard、TypedGuard 或 FaultTolerance 经 @ApplyGuard 或已弃用的 @ApplyFaultTolerance 声明式作用于业务方法时，每次请求进入 FaultToleranceInterceptor.intercept 并写入新的 MeteredOperationName。DelegatingMetricsCollector.apply 以未实现 equals 与 hashCode 的 MeteredOperation 实例作为 ConcurrentHashMap 键，使每次调用都新增 DelegatingMeteredOperation 与 MetricsCollector 且长期保留，堆内存随调用次数线性增长，远程持续请求可导致进程因 OutOfMemoryError 不可用。\n修复版本中通过将 DelegatingMetricsCollector 的缓存键从 MeteredOperation 实例改为 MeteredOperation.cacheKey()，使同一容错操作复用已有 MetricsCollector，切断按调用次数持续保留跟踪对象的路径。", "effects": [{"comp_name": "io.smallrye:smallrye-fault-tolerance", "ecosystem": "maven", "versions": [{"affected_version": "[6.6.0,6.9.4)", "min_fixed_version": "6.9.4", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[6.10.0,6.10.2)", "min_fixed_version": "6.10.2", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[6.11.0,6.11.4)", "min_fixed_version": "6.11.4", "repository": "maven", "solutions": [], "upstream": true}, { S:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "cwe": "CWE-444", "description": "Envoy 是开源边缘与服务代理，用于云原生应用的流量转发与协议转换。\n受影响版本中，配置了非 WebSocket 的 upgrade_configs 时，UpstreamRequest::acceptHeadersFromRouter 只对 CONNECT 和 WebSocket 暂停请求体，通用 HTTP upgrade 的隧道数据会在上游接受升级前去掉分块编码并写入 keep-alive 的 HTTP/1.1 上游连接。未认证的 HTTP/2 客户端可把完整 HTTP/1.1 请求放进 extended CONNECT 的 DATA，Envoy 降级该请求后将这些字节交给上游解析为管线请求，再把仍排队着走私响应的套接字归还共享连接池，其他下游客户端复用该套接字时会读到不属于自己的响应。\n修复版本中通过在 acceptHeadersFromRouter 为通用 HTTP upgrade 设置 paused_for_generic_upgrade_，并由 UpstreamCodecFilter::decodeHeaders 在上游接受升级前停止转发请求体，使升级完成前的载荷不再进入上游连接，共享连接池也不会继续持有被污染的套接字。", "effects": [{"comp_name": "envoy", "ecosystem": "linux", "versions": [{"affected_version": "[1.37.0,1.37.6)", "min_fixed_version": "1.37.6", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[1.38.0,1.38.4)", "min_fixed_version": "1.38.4", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,1.36.10)", "min_fixed_version": "1.36.10", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[1.39.0,1.39.1)", "min_fixed_version": "1.39.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "HTTP请求走私", "kind_en": "HTTP 请求的解释不一致（“HTTP 请求/响应走私”）", "last_modified_time": "2026-09-22", "level": "High", "mps_id": "MPS-9rxe-3jtw", "poc": false, "poc_url": [], "published_time": "2026-09-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-9rxe-3jtw", "name": "https://www.oscs1024.com/hd/MPS-9rxe-3jtw"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73548", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73548"}, {"url": "https://github.com/envoyproxy/envoy/security/advisories/GHSA-3vhp-c83q-jqc2", "name": "https://github.com/envoyproxy/envoy/security/advisories/GHSA-3vhp-c83q-jqc2"}, {"url": "https://githu  ConnectionImpl::Http2Visitor::OnHeaderForStream 中整体复制一次，当请求已携带 :authority 又出现重复 host 头时，ServerConnectionImpl::onHeader 直接丢弃该副本并跳过 saveHeader，其字节与头个数不纳入 max_headers_kb 与 max_headers_count 限额。未认证客户端可先提交一个约 4KB 的大 host 值，再通过 HPACK 索引引用在少量流上重复提交该值的单字节索引，每次引用都触发一次完整解码复制且不受限额约束，以极小的报文开销放大出约 200GB 级头复制分配，导致代理进程被内核 OOM 杀死。\n修复版本中通过为 StreamImpl 新增 discarded_host_header_size_ 与 discarded_host_header_count_ 计数，丢弃重复 host 头时累计其字节与个数并调用新增的 checkHeaderLimits 纳入请求头限额检查，超限即重置流，切断了被丢弃副本的免计费复制链路，修复版本为 1.36.10、1.37.6、1.38.4 与 1.39.1。", "effects": [{"comp_name": "envoy", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.36.10)", "min_fixed_version": "1.36.10", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[1.36.10,1.37.6)", "min_fixed_version": "1.37.6", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[1.37.6,1.38.4)", "min_fixed_version": "1.38.4", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[1.38.4,1.39.1)", "min_fixed_version": "1.39.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "内存泄漏", "kind_en": "有效生命周期后内存丢失释放", "last_modified_time": "2026-09-22", "level": "High", "mps_id": "MPS-lcjs-iv1k", "poc": false, "poc_url": [], "published_time": "2026-09-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-lcjs-iv1k", "name": "https://www.oscs1024.com/hd/MPS-lcjs-iv1k"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73550", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73550"}, {"url": "https://github.com/envoyproxy/envoy/security/advisories/GHSA-qgf6-qvhw-4hvh", "name": "https://github.com/envoyproxy/envoy/security/advisories/GHSA-qgf6-qvhw-4hvh"}, {"url": "https://github.com/envoyproxy/envoy/commit/0910997f70e91d2d20c329bb507bfce44ce01f80", "name": "https://github.com/en
