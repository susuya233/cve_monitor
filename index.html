ability": "中", "fix_suggestion": "建议修复", "kind": "使用欺骗进行的认证绕过", "kind_en": "通过欺骗绕过身份验证", "last_modified_time": "2026-10-04", "level": "Critical", "mps_id": "MPS-njo9-pksf", "poc": false, "poc_url": [], "published_time": "2026-10-04", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-njo9-pksf", "name": "https://www.oscs1024.com/hd/MPS-njo9-pksf"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-105215", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-105215"}, {"url": "https://github.com/zitadel/zitadel/security/advisories/GHSA-738m-7888-jfv8", "name": "GitHub Security Advisory (GHSA-738m-7888-jfv8)"}, {"url": "https://www.vulncheck.com/advisories/zitadel-before-4.16.2-account-pre-hijacking-via-forged-external-idp-callback", "name": "VulnCheck Advisory: ZITADEL before 4.16.2 Account Pre-Hijacking via Forged External IdP Callback"}], "scope_influence": "", "tags": ["go"], "title": "ZITADEL账户预劫持漏洞", "_translated": true, "_saved_at": "2026-10-04T18:56:40+00:00", "_first_saved_at": "2026-10-04T18:56:40+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-njo9-pksf"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-103355", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:N/A:L", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:N/A:L", "cwe": "CWE-89", "description": "Unlimited Elements For Elementor（插件标识 unlimited-elements-for-elementor）是面向 WordPress Elementor 页面构建器的开源（GPLv2）扩展插件，提供文章列表、过滤器组件和模板库等功能，官方源码托管于 WordPress.org 插件目录。\n受影响版本中，前端 AJAX 过滤流程允许未认证请求通过 ucfrontajaxaction 触发文章搜索，攻击者可控的搜索词经请求参数 ucs 进入 WP_Query；UniteCreatorAjaxSeach::setWherePostParts 挂载在 posts_where 过滤器上，使用形如 (wp_posts.$field LIKE '[^']*') 的正则从已生成的 SQL WHERE 语句中删除未选中搜索字段的条件，正则中的 [^']* 不识别 prepare 转义后的引号，攻击者在搜索词中携带单引号可使删除边界落在字符串字面量中间，剩余搜索词被保留为可执行 SQL，造成无需登录的盲注，可用于读取或篡改数据库数据。\n修复版本中通过放弃对已生成 SQL 语句的字符串裁剪解决该问题：2.0.21 将搜索字段过滤从 posts_where 迁移到 posts_search 过滤器（setSearchPostParts），以白名单限定 post_title、post_excerpt、post_content 三个字段，并使用 $wpdb-\u003eesc_like 与 $wpdb-\u003eprepare 按搜索词重建 LIKE 条件，搜索词无法再截断 SQL 字面量，注入链路被切断。", "effects": [{"comp_name": "unlimited-elements-for-elementor", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.0.21)", "min_fixed_version": "2.0.21", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-10-04", "level": "Critical", "mps_id": "MPS-rwbc-e4mg", "poc": false, "poc_url": [], "published_time": "2026-10-04", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-rwbc-e4mg", "name": "https://www.oscs1024.com/hd/MPS-rwbc-e4mg"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-103355", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-103355"}, {"url": "https://patchstack.com/database/wordpress/plugin/unlimited-elements-for-elementor/vulnerability/wordpress-unlimited-elements-for-elementor-free-widgets-addons-templates-plugin-2-0-20-sql-injection-vulnerability-2?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Unlimited Elements SQL注入漏洞", "_translated": true, "_saved_at": "2026-10-04T15:05:29+00:00", "_first_saved_at": "2026-10-04T15:05:29+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-rwbc-e4mg"}, {"analysis_status": 0, "articles": [{"content": "应用程序在处理用户输入时的不完善或缺乏验证机制，所以攻击者能够通过向应用程序发送恶意输入，利用应用程序对输入数据的错误处理方式来注入自己的恶意代码。这些恶意代码会被应用程序误认为是合法的指令或数据，并在执行过程中被执行。", "title": "什么是代码注入"}, {"content": "应用程序使用可执行动态代码的函数来执行用户可控的参数，当应用程序对于用户输入过滤不完全时，攻击者可以注入恶意代码并控制代码执行流程。", "title": "代码注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对所有用户输入进行验证和过滤，确保只接受预期的有效输入。这包括对输入数据进行输入长度验证、类型检查和格式验证等。\r\n- 使用参数化查询或预编译语句：对于数据库查询操作，应该使用参数化查询或预编译语句，确保输入数据不会被误认为是执行代码。\r\n- 最小特权原则：应用程序在执行操作系统命令或动态代码时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。\r\n- 安全编码实践：开发人员应该采用安全编码实践，包括避免使用eval函数、避免拼接用户输入的字符串作为代码执行等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止代码注入攻击。", "title": "如何预防代码注入"}], "cnvd_id": "", "cve_id": "CVE-2026-105135", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:N/AC:L/Au:N/C:C/I:C/A:C", "severity": "high", "base_score": 10}], "cvssv3": [{"source": "VulDB", "vector": "CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H/E:P/RL:X/RC:C", "severity": "critical", "base_score": 10}], "cvssv31": [{"source": "cna@vuldb.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 10}], "cvssv4": [{"source": "cna@vuldb.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-94", "description": "MindSearch 是上海人工智能实验室 InternLM 团队开源的基于大语言模型的多智能体网络搜索框架，通过规划智能体把用户问题分解为 Web 搜索图，并以 Python 解释器动作驱动子问题查询与结果汇总。\n受影响版本中，API 服务默认绑定 0.0.0.0:8002 并暴露未鉴权的 POST /solve 接口，请求体中的 inputs 参数直接作为规划器大模型的用户输入；模型按系统提示在 \u003c|action_start|\u003e\u003c|interpreter|\u003e 块中生成 Python 代码，mindsearch/agent/graph.py 的 ExecutionAction.run 经 extract_code 提取消息中的代码围栏后直接执行 exec(command, global_dict, local_dict)，而 mindsearch/agent/mindsearch_agent.py 传入的 global_dict 为 globals()，该过程无沙箱、无语法白名单且保留完整 __builtins__，攻击者通过提示词引导模型把任意系统命令写入解释器块，最终以服务进程权限（官方 Docker 镜像中为 root）执行任意代码。\n修复版本中通过，上游仓库最后一次代码推送为 2025-07-04，漏洞披露后厂商未响应；在官方修复发布前，可通过为 /solve 增加身份认证并将服务绑定地址收紧为 127.0.0.1、停止对模型输出执行 exec、仅分发结构化的 WebSearchGraph 操作，或将解释器隔离至无特权且无网络出口的沙箱容器中运行。", "effects": [{"comp_name": "InternLM:MindSearch", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,7952c5f]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "代码注入", "kind_en": "代码生成控制不当（“代码注入”）", "last_modified_time": "2026-10-04", "level": "Critical", "mps_id": "MPS-x3fy-gb6a", "poc": false, "poc_url": [], "published_time": "2026-10-04", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-x3fy-gb6a", "name": "https://www.oscs1024.com/hd/MPS-x3fy-gb6a"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-105135", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-105135"}, {"url": "https://vuldb.com/vuln/413352", "name": "VDB-413352 | InternLM MindSearch Planner Agent graph.py ExecutionAction.run code injection"}, {"url": "https://vuldb.com/vuln/413352/cti", "name": "VDB-413352 | CTI Indicators (IOB, IOC, TTP, IOA)"}, {"url": "https://vuldb.com/cve/CVE-2026-105135", "name": "CVE-2026-105135 | CVE Analysis and Report"}, {"url": "https://vuldb.com/submit/943315", "name": "Submit #943315 | InternLM MindSearch 0.1.0 Code Injection"}, {"url": "https://gist.github.com/DReazer/7ad46df9da73d0cf414276e4195b2183", "name": ""}], "scope_influence": "", "tags": ["AI", "应用软件"], "title": "MindSearch 远程代码执行漏洞", "_translated": true, "_saved_at": "2026-10-04T09:14:15+00:00", "_first_saved_at": "2026-10-04T09:14:15+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-x3fy-gb6a"}, {"analysis_status": 0, "articles": [{"content": "由于应用程序或系统中存在敏感信息未经适当保护而被泄露给攻击者或未经授权的用户，这些敏感信息可能包括用户凭据、个人身份信息、敏感业务数据、系统配置信息等。信息暴露漏洞通常是由于设计、实施或配置错误引起的，例如不正确的访问控制、弱密码策略、缺乏加密、错误的日志处理等。", "title": "什么是未授权敏感信息泄露"}, {"content": "- 直接访问敏感信息：攻击者可以通过直接访问不正确配置或不受保护的资源来获取敏感信息，如通过公开可访问的URL、未经授权的文件目录访问等。\n- 越权访问：攻击者可能利用访问控制错误或不正确的权限配置来获取他们没有权限访问的敏感信息。\n- 错误信息披露：应用程序在错误处理过程中可能泄露敏感信息，例如将错误消息中的敏感数据返回给客户端或显示在日志文件中。\n- 信息泄露通过响应：攻击者可能利用应用程序在响应中不正确地包含敏感信息，如通过网页源代码、响应头部或响应消息体中的敏感数据。", "title": "未授权敏感信息泄露常见的攻击方式"}, {"content": "- 访问控制：确保只有经过授权的用户能够访问敏感信息，使用强大的身份验证和授权机制。\n- 数据加密：对于敏感信息，使用适当的加密算法对数据进行加密，包括数据传输和存储过程中的加密。\n- 错误处理和日志安全：正确处理错误情况，避免在错误消息中暴露敏感信息。同时，确保日志记录功能的安全性，避免将敏感信息记录在日志文件中。\n- 安全配置和最佳实践：遵循安全最佳实践，对应用程序、服务器和系统进行适当的配置，包括访问控制、权限管理、密码策略等。\n- 审计和监控：实施日志审计和监控机制，及时检测和响应任何异常活动或潜在的信息暴露事件。\n- 安全开发实践：在应用程序开发过程中，进行安全代码审查、漏洞扫描和安全测试，以及敏感信息的正确处理和保护。", "title": "如何预防未授权敏感信息泄露"}], "cnvd_id": "", "cve_id": "CVE-2026-105211", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.1}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:H/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.2}]}, "cvss_score": 9.2, "cvss_vector": "CVSS:4.0/AV:N/AC:H/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-200", "description": "ZITADEL 是开源的身份认证与访问管理（IAM）系统，提供 OIDC、SAML 单点登录与多因素认证能力，其托管的 Login V2 页面用于在浏览器中完成登录流程。\n受影响版本中，Login V2 的 updateOrCreateSession server action 将浏览器提交的 challenges 参数原样转发给后端 Session API，并把响应中的挑战数据原样返回给浏览器；攻击者仅凭受害者登录名即可建立只识别用户的会话（identify-only session），同时请求 OTP-Email 与 OTP-SMS 两种挑战并指定 returnCode 投递类型，使新生成的两个 OTP 验证码以明文形式直接出现在 server action 响应中，提交这两个验证码后 ZITADEL 将两个第二因子计为已满足 MFA，攻击者无需密码、passkey 或第三方登录便获得受害者的 MFA 认证会话，当受害者为 IAM_OWNER 等实例管理员时整个实例可被接管。\n修复版本中通过在 createSessionAndUpdateCookie 与 setSessionAndUpdateCookie 转发请求前统一执行 sanitizeChallenges 清洗，强制关闭 OTP-SMS 的 returnCode 并把 OTP-Email 的 returnCode 投递类型改写为 sendCode，同时 updateOrCreateSession 仅向浏览器返回 WebAuthN 挑战，OTP 验证码不再经浏览器侧 server action 泄露，从入口处切断该攻击链。", "effects": [{"comp_name": "zitadel", "ecosystem": "linux", "versions": [{"affected_version": "[4.0.0,4.17.1)", "min_fixed_version": "4.17.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "未授权敏感信息泄露", "kind_en": "向未经授权的行为者泄露敏感信息", "last_modified_time": "2026-10-04", "level": "Critical", "mps_id": "MPS-mfiu-5l0d", "poc": false, "poc_url": [], "published_time": "2026-10-04", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-mfiu-5l0d", "name": "https://www.oscs1024.com/hd/MPS-mfiu-5l0d"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-105211", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-105211"}, {"url": "https://github.com/zitadel/zitadel/security/advisories/GHSA-3gwm-5wx8-4gm6", "name": "GitHub Security Advisory (GHSA-3gwm-5wx8-4gm6)"}, {"url": "https://www.vulncheck.com/advisories/zitadel-before-4.17.1-authentication-bypass-via-login-v2-otp-returncode", "name": "VulnCheck Advisory: ZITADEL before 4.17.1 Authentication Bypass via Login V2 OTP returnCode"}], "scope_influence": "", "tags": ["应用软件"], "title": "ZITADEL身份认证绕过漏洞", "_translated": true, "_saved_at": "2026-10-04T22:11:30+00:00", "_first_saved_at": "2026-10-04T22:11:30+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-mfiu-5l0d"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-105086", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:R/S:C/C:H/I:H/A:N", "severity": "high", "base_score": 8.7}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:P/VC:H/VI:H/VA:N/SC:H/SI:H/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:P ure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:P/VC:H/VI:H/VA:N/SC:H/SI:H/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:P/VC:H/VI:H/VA:N/SC:H/SI:H/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-79", "description": "WWBN AVideo 是公开托管在 GitHub 上的 PHP 音视频平台，用于发布视频、管理频道播放列表并展示预告片。\n受影响版本中，具备上传权限的用户可经视频保存接口写入 trailer1。Video::setTrailer1() 仅使用 FILTER_VALIDATE_URL 接收该值，引号、尖括号和 HTML 实体仍会被保存。YouPHPFlix2 的 BigVideo.php、BigVideoButtons.php、row_info.php 以及 view/channelPlaylistItems.php 只检查字段非空，再将 parseVideos() 的返回值未转义拼入 iframe src 或 onclick 中的 JavaScript 字符串，访客打开对应页面时会在浏览器中执行注入脚本。\n修复版本中通过将上述模板的渲染条件改为 isValidURL()，并对 parseVideos() 的输出调用 htmlspecialchars 进行 ENT_QUOTES 转义，使未通过校验或含引号、尖括号的预告片地址不再进入页面脚本上下文。", "effects": [{"comp_name": "wwbn/avideo", "ecosystem": "composer", "versions": [{"affected_version": "(-∞,29.2.0]", "min_fixed_version": "", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-10-05", "level": "Critical", "mps_id": "MPS-drwq-ltfo", "poc": false, "poc_url": [], "published_time": "2026-10-05", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-drwq-ltfo", "name": "https://www.oscs1024.com/hd/MPS-drwq-ltfo"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-105089", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-105089"}, {"url": "https://github.com/WWBN/AVideo/security/advisories/GHSA-6wfr-c7fw-4xvw", "name": "GitHub Security Advisory (GHSA-6wfr-c7fw-4xvw)"}, {"url": "https://github.com/WWBN/AVideo/commit/c4adfde13d1f18e3a415722471efdcd8ab480035", "name": "Patch Commit"}, {"url": "https://www.vulncheck.com/advisories/wwbn-avideo-through-29.2.0-stored-xss-via-trailer1-in-youphpflix2-templates", "name": "VulnCheck Advisory: WWBN AVideo through 29.2.0 Stored XSS via trailer1 in YouPHPFlix2 Templates"}], "scope_influence": "", "tags": ["php", "开源"], "title": "AVideo存储型XSS漏洞", "_translated": true, "_saved_at": "2026-10-04T22:11:29+00:00", "_first_saved_at": "2026-10-04T18:56:37+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-drwq-ltfo"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-105293", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.1}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:H/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.2}]}, "cvss_score": 9.2, "cvss_vector": "CVSS:4.0/AV:N/AC:H/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-22", "description": "Legcord 是开源的轻量级 Discord 自定义客户端，基于 Electron 与 TypeScript 开发，用于增强 Discord 使用体验，并向嵌入的 Discord 页面暴露主题管理等本地接口。\n受影响版本中，Discord 页面可通过预加载桥 legcord.themes 的 folder、uninstall 与 install 传入主题标识或安装位置，主进程未将这些值限制在主题目录内。openThemeFolder 对 path.join(themesPath, id) 的结果调用 shell.openPath，uninstallTheme 对 path.join(themesFolder, id) 及其 BD 后缀变体执行 fs.rmdirSync 递归删除，installTheme 在输入不是 HTTP(S) 地址时直接 readFileSync，并把主题清单 name 拼入主题目录后写入 manifest.json 与 src.css。已能在 Discord 页面源中执行脚本的攻击者可借此启动本地可执行文件、递归删除目录，以及向主题目录外写文件。\n修复版本中通过发布消除未校验主题标识路径拼接的安全更新来完成修复的情况尚未出现。截至 2026-10-05，最新正式标签仍为 v1.3.0，GitHub issue 1163 保持开放，公开提交中没有已验证的修复 commit。", "effects": [{"comp_name": "Legcord", "ecosystem": "linux", "versions": [{"affected_version": "[1.1.0,1.3.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-10-05", "level": "Critical", "mps_id": "MPS-5pa4-jmds", "poc": false, "poc_url": [], "published_time": "2026-10-05", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-5pa4-jmds", "name": "https://www.oscs1024.com/hd/MPS-5pa4-jmds"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-105293", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-105293"}, {"url": "https://github.com/Legcord/Legcord/issues/1163", "name": "GitHub Issue #1163"}, {"url": "https://github.com/Legcord/Legcord", "name": ""}, {"url": "https://github.com/Legcord/Legcord/blob/v1.3.0/src/discord/ipc.ts#L201-L206", "name": ""}, {"url": "https://github.com/Legcord/Legcord/blob/v1.3.0/src/common/themes.ts#L269-L276", "name": ""}, {"url": "https://www.vulncheck.com/advisories/legcord-1.1.0-through-1.3.0-path-traversal-via-theme-ipc-handlers", "name": "VulnCheck Advisory: Legcord 1.1.0 through 1.3.0  接受任意配置键和值，src/discord/preload/bridge.ts 以 ipcRenderer.sendSync 调用 IPC 通道 setConfig，src/discord/ipc.ts 的处理函数不校验键名即写入本地配置文件。已在 Discord 页面获得脚本执行能力的攻击者可将 additionalArguments 写为包含 --proxy-server 与 --ignore-certificate-errors 的字符串，客户端下次启动时由 src/main.ts 按空格拆分该字符串并调用 app.commandLine.appendSwitch，从而把客户端流量导向拦截代理。\n修复版本中通过阻止页面脚本写入任意配置键的官方版本尚未发布。截至 2026-10-05，最新发行标签仍为 v1.3.0，dev 分支的 setConfig 处理仍直接持久化调用方传入的键值，用户应在上游发布修复前避免执行不可信 Discord 页面脚本，并核对本地配置中的 additionalArguments。", "effects": [{"comp_name": "legcord", "ecosystem": "linux", "versions": [{"affected_version": "[1.1.0,1.3.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "系统设置或配置在外部可控制", "kind_en": "系统或配置设置的外部控制", "last_modified_time": "2026-10-05", "level": "Critical", "mps_id": "MPS-bjt3-56ea", "poc": false, "poc_url": [], "published_time": "2026-10-05", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-bjt3-56ea", "name": "https://www.oscs1024.com/hd/MPS-bjt3-56ea"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-105294", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-105294"}, {"url": "https://github.com/Legcord/Legcord/issues/1163", "name": "GitHub Issue #1163"}, {"url": "https://github.com/Legcord/Legcord", "name": ""}, {"url": "https://github.com/Legcord/Legcord/blob/v1.3.0/src/discord/ipc.ts#L296-L299", "name": ""}, {"url": "https://github.com/Legcord/Legcord/blob/v1.3.0/src/main.ts#L277-L307", "name": ""}, {"url": "https://www.vulncheck.com/advisories/legcord-1.1.0-through-1.3.0-chromium-switch-injection-via-settings-setconfig", "name": "VulnCheck Advisory: Legcord 1.1.0 through 1.3.0 Chromium Switch Injection via settings.setConfig"}], "scope_influence": "", "tags": ["应用软件"], "title": "Legcord配置注入漏洞", "_translated": true, "_saved_at": "2026-10-05T01:29:05+00:00", "_first_saved_at": "2026-10-05T01:29:05+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-bjt3-56ea"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-105484", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:N/AC:L/Au:N/C:C/I:C/A:C", "severity": "high", "base_score": 10}], "cvssv3": [{"source": "VulDB", "vector": "CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H/E:X/RL:X/RC:R", "severity": "critical", "base_score": 10}], "cvssv31": [{"source": "cna@vuldb.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 10}], "cvssv4": [{"source": "cna@vuldb.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 10}]}, "cvss_score": 10, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-78", "description": "TOTOLINK X6000R 是面向家庭与小型网络的商用无线路由器，固件闭源，经 Web 管理接口提供路由、无线接入和固件升级能力。\n受影响版本中，UploadFirmw 107", "cvss": {"cvssv4": [{"source": "help@fluidattacks.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:N/SC:H/SI:H/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:N/SC:H/SI:H/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-639", "description": "openSIS Classic 是 OS4ED 发布的开源 PHP 学生信息系统，用于管理教职工、学生与校务数据。\n受影响版本中，教师角色请求 modules/users/Staff.php 时，若会话尚未选定教职工且 staff_id 不是 new，文件顶层会把 $_REQUEST['staff_id'] 直接写入 $_SESSION['staff_id']，服务端只按教师角色放行，不校验该记录是否属于当前登录用户。随后 modules/users/includes/SchoolsInfoInc.php 通过 UserStaffID() 读取该会话值，并在处理 staff_school[PASSWORD] 时把新密码哈希写入对应 login_authentication 记录，教师可重置其他教职工或管理员账号的密码。\n修复版本中通过在 SchoolsInfoInc.php 为非管理员增加身份归属校验，仅当 UserStaffID() 与当前登录用户在 login_authentication 中的 USER_ID 一致时才允许更新密码，否则返回 403 并终止请求。", "effects": [{"comp_name": "openSIS-Classic", "ecosystem": "linux", "versions": [{"affected_version": "[9.3,9.3]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "通过用户控制密钥绕过授权机制", "kind_en": "通过用户控制的密钥绕过授权", "last_modified_time": "2026-10-06", "level": "Critical", "mps_id": "MPS-4n9x-mt0j", "poc": false, "poc_url": [], "published_time": "2026-10-06", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-4n9x-mt0j", "name": "https://www.oscs1024.com/hd/MPS-4n9x-mt0j"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-91107", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-91107"}, {"url": "https://fluidattacks.com/advisories/hearts", "name": ""}, {"url": "https://github.com/OS4ED/openSIS-Classic", "name": ""}, {"url": "https://github.com/OS4ED/openSIS-Classic/commit/24bb530391a67c114cd4fe3dff65da7e070f5ed1", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "openSIS越权改密漏洞", "_translated": true, "_saved_at": "2026-10-05T23:35:29+00:00", "_first_saved_at": "2026-10-05T23:35:29+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-4n9x-mt0j"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-21589", "cvss": {"cvssv4": [{"source": "security@atlassian.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-22", "description": "Atlassian Bamboo、Bitbucket、Confluence、Crowd、Crucible、Fisheye、Jira Software 和 Jira Service Management 的 Data Center 以及部分 Server 版本是闭源企业协作与研发软件，用于持续集成、代码托管、知识库、身份管理、代码评审和问题跟踪。Bitbucket Cloud 不受此问题影响，受影响的 Atlassian Cloud 产品已由厂商完成修复。\n受影响版本中，未认证远程攻击者可以访问 Web 应用根目录内名称和路径均已知的 iner Storage Modules（CSM）是 Dell 面向 Kubernetes 的容器存储管理套件，用于为 PowerStore、PowerScale、PowerFlex、PowerMax 等存储平台提供 CSI 驱动与功能模块，其中 csm-operator 为 Apache-2.0 开源组件，负责按 ContainerStorageModule 自定义资源部署并管理各存储模块。\n受影响版本中，operator 渲染 observability 模块清单时，将来自自定义资源的 cr.Name、cr.Namespace、组件 env 取值与镜像地址等字符串，通过 strings.ReplaceAll 直接填入 operatorconfig/moduleconfig 下的 YAML 清单模板占位符（如 \u003cNAME\u003e、\u003cCSM_NAMESPACE\u003e、\u003cTOPOLOGY_LOG_LEVEL\u003e、\u003cOTEL_COLLECTOR_IMAGE\u003e），替换前缺少中和处理；具备创建或修改该自定义资源权限的低权限用户可在字段值中注入换行与 --- 文档分隔符，注入内容经 SplitYaml 拆分为独立 Kubernetes 对象，并由 operator 以自身高权限服务账号创建，攻击者由此获得集群级 Kubernetes Secrets 读取能力并能创建 cluster-scoped RBAC 资源，绕过预期的 Kubernetes 访问控制。\n修复版本中通过新增 ValidateYAMLSubstitutionValue 等校验函数，在模板替换前校验 CR 名称、命名空间、日志级别与镜像字符串，拒绝包含换行、回车、YAML 文档分隔符及控制字符的取值，阻断注入的清单文档进入对象创建流程。", "effects": [{"comp_name": "container_storage_modules", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.17.0)", "min_fixed_version": "1.17.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "csm-operator", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.13.0)", "min_fixed_version": "1.13.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "模板注入", "kind_en": "模板引擎中使用的特殊元素的不正确中和", "last_modified_time": "2026-10-03", "level": "Critical", "mps_id": "MPS-d0ed-b230", "poc": false, "poc_url": [], "published_time": "2026-10-07", "reference_url_list": [{"url": "https://cybersecuritynews.com/critical-dell-container-storage-flaws/", "name": ""}, {"url": "https://www.dell.com/support/kbdoc/en-us/000515771/dsa-2026-448-security-update-for-dell-container-storage-modules-multiple-vulnerabilities", "name": ""}, {"url": "https://github.com/dell/csm-operator/commit/3a16c396d2d2eee6be1365afb36a14eb2ae5", "name": ""}, {"url": "https://github.com/dell/csm-operator/releases/tag/v1.13.0", 法文件的上传和攻击。\n- 定期更新和升级程序：定期更新和升级程序可以修复已知的漏洞，并增强程序的安全性。", "title": "如何预防任意文件上传"}], "cnvd_id": "", "cve_id": "CVE-2026-105123", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-434", "description": "W（vincent-peugnet/wcms）是一款采用 AGPL-3.0 协议的开源 PHP 轻量级 CMS，用于搭建 wiki、文档与静态站点，内置媒体管理接口用于上传和维护图片、附件等资源。\n受影响版本中，POST /api/v0/media/upload/[*:path] 路由对应的 Controllerapimedia::upload() 将路径参数 rawurldecode 后直接拼接 MEDIA_DIR，交给 Fs::dircheck()（仅创建或确认目录存在，无边界校验）与 Fs::writefile() 把请求体内容写入磁盘，全程无扩展名与 MIME 校验（Media::MEDIA_EXT 将 php 扩展名归类为 CODE 且无拒绝逻辑），也未验证解析后的路径仍位于媒体目录内；持有编辑者账号的攻击者可上传 .php 文件由 Web 服务器直接执行，或使用编码的 ../ 序列把任意内容写入媒体目录之外的路径，配合 DELETE /api/v0/media/[*:path] 还可删除任意文件，最终造成远程代码执行。\n修复版本中通过，建议对上传扩展名实施白名单并拒绝 php、phtml、phar、.htaccess 等危险类型，使用 realpath 前缀校验将媒体读写限制在媒体目录内，并在 Web 服务器层面禁止执行媒体目录中的脚本，以降低被利用风险。", "effects": [{"comp_name": "wcms", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,3.18.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "任意文件上传", "kind_en": "危险类型文件无限制上传", "last_modified_time": "2026-10-04", "level": "High", "mps_id": "MPS-evcj-0bh9", "poc": false, "poc_url": [], "published_time": "2026-10-04", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-evcj-0bh9", 79e7c5a2b5", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-119", "description": "Citrix NetScaler ADC（原 Citrix ADC）与 Citrix NetScaler Gateway（原 Citrix Gateway）是 Cloud Software Group 旗下闭源的应用交付控制器与统一接入网关，广泛用于企业应用负载均衡、身份认证和远程访问接入。\n受影响版本中，设备在配置为 SAML SP（add authentication samlAction）或 SAML IdP（add authentication samlIdPProfile）并配合 Gateway 或 AAA 认证功能使用时，处理 SAML 认证流量的内存边界校验存在缺陷，未经身份验证的远程攻击者可发送恶意请求触发内存越界访问（CWE-119），造成内存溢出并导致设备拒绝服务；Citrix 已在未修复的部署上观察到定向攻击，该条件被反复触发时服务可能持续不可用。\n修复版本中通过修复 SAML 认证处理中的内存越界缺陷消除拒绝服务风险，Citrix 已发布 14.1-73.41、13.1-64.28、14.1-73.41 FIPS 和 13.1-37.282 及以上修复版本，升级完成前可通过 Global Deny List 特征签名缓解攻击。", "effects": [{"comp_name": "netscaler_application_delivery_controller", "ecosystem": "linux", "versions": [{"affected_version": "[14.1-FIPS,14.1-73.41-FIPS)", "min_fixed_version": "14.1-73.41-FIPS", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[13.1-NDcPP,13.1-37.282)", "min_fixed_version": "13.1-37.282", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[13.1,13.1-64.28)", "min_fixed_version": "13.1-64.28", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[14.1,14.1-73.41)", "min_fixed_version": "14.1-73.41", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[13.1-FIPS,13.1-37.282)", "min_fixed_version": "13.1-37.282", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "netscaler_gateway", "ecosystem": "linux", "versions": [{"affected_version": "[14.1,14.1-73.41)", "min_fixed_version": "14.1-73.41", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[13.1,13.1-64.28)", "min_fixed_version": "13.1-64.28", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "缓冲区溢出", "kind_en": "内存缓冲区范围内的操作限制不当", "last_modified_time": "2026-10-04", "level": "High", "mps_id": "MPS-ufs2-5t6e", "poc": false, "poc_url": [], "published_time": "2026-10-04", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ufs2-5t6e", "name": "https://www.oscs1024.com/hd/MPS-ufs2-5t6e"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-88779", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-88779"}, {"url": "https://support.citrix.com/support-home/kbsearch/article?articleNumber=CTX697174", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "NetScaler SAML拒绝服务漏洞", "_translated": true, "_saved_at": "2026-10-04T09:14:18+00:00", "_first_saved_at": "2026-10-04T09:14:18+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ufs2-5t6e"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "cnvd_id": "", "cve_id": "CVE-2026-105126", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.2}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-269", "description": "LaraDashboard 是一个基于 Laravel 的开源内容管理与后台管理面板（PHP），提供角色权限、用户管理、模块安装与核心升级等站点管理能力。\n受影响版本中，RoleController 的 update() 与 destroy() 仅在 config('app.demo_mode') 为真时拦截名为 Superadmin 的角色，而默认部署 DEMO_MODE 为 false，该保护不生效；RolePolicy::update 与 delete 只校验 role.edit、role.delete 权限，未排除 Superadmin 角色，请求随后进入 RolesService::updateRole，直接修改角色名并同步任意权限。具备 role.edit 的管理员可通过 PUT /admin/roles/{id} 将自身角色改名为 Superadmin 或附加 user.login_as、user.delete 权限；系统在 BasePolicy::before 与核心升级 UploadRequest::authorize 中以 hasRole('Superadmin') 按名称识别超级管理员，改名后的角色由此获得核心升级包上传、模块安装等超管功能并可达代码执行，攻击者还可借助 user.login_as 登录接管任意账户。\n修复版本中通过在 1.4.8 引入持久的 roles.is_super_admin 标志并以迁移回填 Superadmin 角色，新增 Role::isSuperAdminRole() 与 User::isSuperAdmin() 替代按角色名的判定，RolePolicy::update 与 delete 对超管角色直接拒绝，新增 RolePermissionGuard::filterGrantablePermissions 过滤非超管编辑者提交的 user.login_as、user.delete 权限，UserPolicy::loginAs 限制为超管用户，切断了角色改名与特权铸造链路。", "effects": [{"comp_name": "laradashboard", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.4.8)", "min_fixed_version": "1.4.8", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026- -97307", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "cwe": "CWE-201", "description": "Cost Calculator Builder 是 StylemixThemes 开发的开源 WordPress 报价计算表单插件，经 WordPress.org 官方目录分发，用于搭建价格估算表单并支持 Stripe、PayPal、reCAPTCHA、Webhook 等集成。\n受影响版本中，前端渲染入口将站点级敏感配置嵌入发送给访问者的页面数据：CCBFrontController::render_calculator_handler 通过 wp_localize_script 把仅删除少量支付密钥字段的 general_settings 整体写入 ajax_window，templates/frontend/render.php 将含 secret_key 的 geolocation 配置与 formFields.adminEmailAddress 写入 calc_data_\u003cID\u003e，而 ccb_strip_frontend_payment_secrets 的清理清单未覆盖 webhooks 签名密钥、reCAPTCHA v2/v3 secretKey 等字段，未认证访问者查看包含计算器的页面便可读取这些服务端机密。\n修复版本中通过移除 ajax_window 中的 general_settings 字段、扩展 ccb_strip_frontend_payment_secrets 清洗路径并新增 ccb_strip_frontend_general_settings_secrets 对全局设置做同等清理解决该问题，webhooks、reCAPTCHA secretKey、管理员通知邮箱、geolocation.secret_key 不再进入前端载荷，PayPal 商家邮箱以占位符替换，地理定位配置仅在页面渲染相关字段时输出 public_key。", "effects": [{"comp_name": "cost_calculator_builder", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,4.0.18)", "min_fixed_version": "4.0.18", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "通过发送数据的信息暴露", "kind_en": "将敏感信息插入发送的数据中", "last_modified_time": "2026-10-04", "level": "High", "mps_id": "MPS-upfi-laco", "poc": false, "poc_url": [], "published_time": "2026-10-04", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-upfi-laco", "name": "https://www.oscs1024.com/hd/MPS-upfi-laco"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-97307", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-97307"}, {"url": "https://patchstack.com/database/wordpress/plugin/cost-calculator-builder/vulnerability/wordpress-cost-calculator-builder-plugin-4-0-17-sensitive-data-exposure-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "Cost Calculator Builder敏感信息泄露漏洞", "_translated": true, "_saved_at": "2026-10-04T15:05:26+00:00", "_first_saved_at": "2026-10-04T15:05:26+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-upfi-laco"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-97276", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:L", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:L", "cwe": "CWE-79", "description": "WP Statistics 是 VeronaLabs 开源的 WordPress 站点统计分析插件（GPL-3.0），用于统计站点访问量、来源渠道、作者与引荐等报表数据，源码发布于 GitHub 并同步至 WordPress.org 插件目录。\n受影响版本中，管理后台过滤下拉的 URL 在服务端拼接：FilterManager、ReferralsPage 与 AuthorAnalyticsPage 使用 htmlspecialchars_decode(esc_url(remove_query_arg(...))) 生成基准地址，HTML 解码抵消了 esc_url 的实体转义，部分场景还基于原始 REQUEST_URI 调用 add_query_arg()，攻击者构造的管理页链接查询串经 wp_statistics_get_filters AJAX 接口原样进入返回的 JSON，前端 FilterGenerator.prototype.createDropdown 将 baseUrl 与 item.url 未转义地拼入 \u003ca href\u003e 并赋给 innerHTML，具备报表访问权限的已登录用户点击恶意链接后，注入脚本在管理后台上下文执行，形成反射型 XSS。\n修复版本中通过统一改用 esc_url_raw() 构造基准与条目 URL，不再对转义结果执行 HTML 解码，并在前端 createDropdown 中以 wps_js.escapeHtml() 对 baseUrl 与 item.url 转义后再写入 href，双端切断属性逃逸链路，修复包含于 14.16.15。", "effects": [{"comp_name": "wp-statistics", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,14.16.15)", "min_fixed_version": "14.16.15", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-10-04", "level": "High", "mps_id": "MPS-7mtv-1nz5", "poc": false, "poc_url": [], "published_time": "2026-10-04", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-7mtv-1nz5", "name": "https://www.oscs1024.com/hd/MPS-7mtv-1nz5"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-97276", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-97276"}, {"url": "https://patchstack.com/database/wordpress/plugin/wp-statistics/vulnerability/wordpress-wp-statistics-plugin-14-16-14-cross-site-scripting-xss-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "WP Statistics 反射型 XSS", "_translated": true, "_saved_at": "2026-10-04T15:05:27+00:00", "_first_saved_at": "2026-10-04T15:05:27+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-7mtv-1nz5"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-105129", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:N", "severity": "medium", "base_score": 6.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-863", "description": "LaraDashboard 是一个基于 Laravel 框架的开源（MIT 协议）内容管理与后台仪表盘系统，提供角色权限、模块扩展、翻译与内容管理能力，其设置项中存储 AI 服务 API 密钥、邮件凭据等敏感配置。\n受影响版本中，/api/v1/settings 与 /api/v1/settings/{option_name} 接口仅校验 settings.view 权限（SettingPolicy::viewAny/view），SettingService::getAllSettings 返回 settings 表全部记录，SettingResource::toArray 将 option_value 字段原样写入响应，未对 ai_openai_api_key、ai_claude_api_key、mail_password、email_verification_api_key、module_licenses 等凭据型配置做过滤或脱敏，且上述密钥以明文存储，仅持有 settings.view 权限的认证用户可以完整读取实例的全部明文凭据。\n修复版本中通过新增 SensitiveSettingValue 统一治理敏感配置：以 _key、_secret、_password、_token 结尾的凭据型键在 API 响应中统一返回掩码，module_licenses 从设置 API 列表与详情中隐藏，敏感值改为 Laravel Crypt 加密存储并按需解密，同时为 API 更新入口补充 settings.edit 权限校验，切断了低权限用户经由设置接口读取明文凭据的路径。", "effects": [{"comp_name": "laradashboard/laradashboard", "ecosystem": "composer", "versions": [{"affected_version": "[0,1.4.8)", "min_fixed_version": "1.4.8", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-10-04", "level": "High", "mps_id": "MPS-uvo9-tgcm", "poc": false, "poc_url": [], "published_time": "2026-10-04", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-uvo9-tgcm", "name": "https://www.oscs1024.com/hd/MPS-uvo9-tgcm"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-105129", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-105129"}, {"url": "https://github.com/laradashboard/laradashboard/security/advisories/GHSA-xgmw-7ppx-v7hq", "name": "GitHub Security Advisory (GHSA-xgmw-7ppx-v7hq)"}, {"url": "https://github.com/laradashboard/laradashboard/blob/v1.4.2/app/Http/Controllers/Api/SettingController.php#L23-L50", "name": ""}, {"url": "https://github.com/laradashboard/laradashboard/blob/v1.4.2/app/Http/Resources/SettingResource.php#L17-L26", "name": ""}, {"url": "https://github.com/laradashboard/laradashboard/blob/v1.4.2/app/Policies/SettingPolicy.php#L15-L34", "name": ""}, {"url": "https://github.com/laradashboard/laradashboard/pull/340", "name": ""}, {"url": "https://github.com/laradashboard/laradashboard/commit/532a10efd2cc1338ef3f59236f195df859b2dbe3", "name": ""}, {"url": "https://github.com  action 名称。含表达式语法的片段由此进入后续 OGNL 处理，可能造成远程代码执行。默认 ActionMapper、restful2 以及 Struts REST 插件不经过该映射器；Struts 7 仅在关闭默认启用的 OGNL allowlist 时受影响。\n修复版本中通过在 getMapping 取出 action 名称后调用 cleanupActionName，按 struts.allowed.action.names 对应模式校验，不匹配时改用 struts.default.action.name，阻断表达式字符作为 action 名称继续传递。", "effects": [{"comp_name": "org.apache.struts:struts2-core", "ecosystem": "maven", "versions": [{"affected_version": "[2.0.0,2.3.37]", "min_fixed_version": "", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[6.0.0,6.12.0)", "min_fixed_version": "6.12.0", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[2.5.0,2.5.33]", "min_fixed_version": "", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[7.0.0,7.4.0)", "min_fixed_version": "7.4.0", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "表达式语言注入", "kind_en": "表达式语言语句中使用的特殊元素的不正确中和（“表达式语言注入”）", "last_modified_time": "2026-10-05", "level": "High", "mps_id": "MPS-9702-bc72", "poc": false, "poc_url": [], "published_time": "2026-10-05", "reference_url_list": [{"url": "http://www.mail-archive.com/announce@apache.org/msg12200.html", "name": ""}, {"url": "https://cwiki.apache.org/confluence/display/WW/S2-075", "name": ""}, {"url": "https://struts.apache.org/", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-104711", "name": ""}, {"url": "https://issues.apache.org/jira/browse/WW-5706", "name": ""}, {"url": "https://github.com/apache/struts/commit/2620abedd86eb79bd1d25550bfcf878ba7ace4a9", "name": ""}, {"url": "https://github.com/apache/struts/commit/107f2ed9876d9e0d7451489ee7d1bd9397ae13ee", "name": ""}, {"url": "https://github.com/apache/struts/pull/1880", "name": ""}, {"url": "https://github.com/apache/struts/pull/1881", "name": ""}], "scope_influence": "", "tags": ["java", "开源 "cvss_vector": "", "cwe": "CWE-405", "description": "Apache Struts 是开源 Java MVC 框架，用于构建企业级 Web 应用，类型转换与标签渲染位于可分发模块 struts2-core。\n受影响版本中，StringConverter.convertToString 在格式化 BigDecimal、Double 或 Float 时把 NumberFormat 的 maximumFractionDigits 设为 Integer.MAX_VALUE。请求参数绑定为 java.math.BigDecimal 并经 Struts 标签库渲染时，DecimalFormat 按该值的 scale 输出全部小数位，响应体积可相对请求放大多个数量级，未认证的远程调用方能够以低流量持续消耗服务器 CPU 与出站带宽。未绑定 BigDecimal 请求参数，或未通过标签库渲染该属性的应用不受影响。\n修复版本中通过将 maximumFractionDigits 上限改为常量 340，使输出长度不再跟随任意大的 BigDecimal scale。不超过该上限的数值仍按原精度格式化，超出上限的值被舍入，从而切断响应随请求参数 scale 放大的路径。", "effects": [{"comp_name": "org.apache.struts:struts2-core", "ecosystem": "maven", "versions": [{"affected_version": "[2.5.14,2.5.33]", "min_fixed_version": "", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[6.0.0,6.12.0)", "min_fixed_version": "6.12.0", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[7.0.0,7.4.0)", "min_fixed_version": "7.4.0", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "不对称的资源消耗（放大攻击）", "kind_en": "不对称资源消耗（放大）", "last_modified_time": "2026-10-05", "level": "High", "mps_id": "MPS-622c-62bf", "poc": false, "poc_url": [], "published_time": "2026-10-05", "reference_url_list": [{"url": "http://www.mail-archive.com/announce@apache.org/msg12199.html", "name": ""}, {"url": "https://cwiki.apache.org/confluence/display/WW/S2-076", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-104712", "name": ""}, {"url": "https://struts.apache.org/", "name": ""}, {"url": "https://struts.apache.org/announce-2026", "name": ""}, {"url": "https://issues.apache.org/jira/browse/WW-5711", "name": ""}, {"url": "https://github.com/apache/struts/commit/1411fe3079944fd2127314a4e091dba5a2a3654a", "name": ""}, {"url": "https://github.com/apache/struts/commit/016c2ec9c3a62b3b64807c58d67ffbbebdf ss_score": 8.4, "cvss_vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:N/UI:A/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-918", "description": "auto-changelog 是 cookpete 维护的开源 Node.js 命令行工具，用于根据 git 标签与提交历史生成变更日志。\n受影响版本中，src/run.js 的 getOptions 将目标仓库内 .auto-changelog 文件和 package.json 的 auto-changelog 字段合并进运行选项。handlebarsSetup 随后进入 src/template.js 的 compileTemplate，并被传给 require()，因此在不可信仓库或检出不可信拉取请求的 CI 中执行该命令时，会加载攻击者提交的脚本并以当前用户或 CI 任务权限执行，且无需安装该仓库依赖。plugins 会经 importCwd 加载仓库内模块。\n修复版本中通过在 getOptions 采纳仓库配置前调用 assertRepoConfigSafe，拒绝仓库配置中的 handlebarsSetup、plugins、URL 形式的 template，以及会注入 git 参数或写出仓库目录之外的 remote、output、appendGitLog 和 appendGitTag；只有命令行显式传入 --unsafe-config 时才继续沿用这些选项。", "effects": [{"comp_name": "auto-changelog", "ecosystem": "npm", "versions": [{"affected_version": "(-∞,2.6.1)", "min_fixed_version": "2.6.1", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SSRF", "kind_en": "服务器端请求伪造 (SSRF)", "last_modified_time": "2026-10-06", "level": "High", "mps_id": "MPS-qzp9-i4ek", "poc": false, "poc_url": [], "published_time": "2026-10-06", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-qzp9-i4ek", "name": "https://www.oscs1024.com/hd/MPS-qzp9-i4ek"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-12171", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-12171"}, {"url": "https://github.com/cookpete/auto-changelog/security/advisories/GHSA-xpvr-2hvx-m8q4", "name": ""}, {"url": "https://github.com/cookpete/auto-changelog/commit/1d02a48a0a57c69a3cd268aca375d64d50877c1a", "name": ""}], "scope_influence": "", "tags": ["npm", "开源"], "title": "auto-changelog代码执行漏洞", "_translated": true, "_saved_at": "2026-10-05T17:42:51+00:00", "_first_saved_at": "2026-10-05T17:42:51+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-qzp9-i4ek"}, {"analysis_status": 0, "articles": [{"content": "- 条件竞争漏洞是由于程序中存在多个代码块同时访问同一个条件判断语句而导致的错误。在程序中，条件判断语句通常用于决定是否执行某些代码块。当一个程序有多个代码块同时访问同一个条件判断语句时，这些代码块可能会同时执行，从而导致程序执行结果出现不可预测的错误。", "title": "什么是竞争条件"}, {"content": "- 线程切换攻击：线程切换攻击是指攻击者通过利用竞争条件漏洞，使程序在执行时频繁切换线程，从而导致系统资源耗尽，最终实现拒绝服务攻击。\n- 内存泄漏攻击：内存泄漏攻击是指攻击者通过利用竞争条件漏洞，使得程序不断申请内存，但最终无法释放内存，从而导致内存泄漏，最终程序崩溃。\n- 缓存穿透攻击：缓存穿透攻击是指攻击者通过利用竞争条件漏洞，使得程序在访问缓存时，被缓存的数据并非当前最新的数据，从而攻击者可以获取到未更新的数据。\n- 指令重放攻击：指令重放攻击是指攻击者通过利用竞争条件漏洞，在程序执行时，将先前保存的指令序列重新执行，从而实现绕过某些验证，获取系统权限等攻击目的。\n", "title": "竞争条件常见的攻击方式"}, {"content": "- 使用互斥锁：在条件判断语句中，使用互斥锁来确保只有一个代码块能够访问变量。使用互斥锁可以提高程序的安全性和可靠性。\n- 使用条件封印：在条件判断语句中，将可能会修改变量的代码块封印起来，以确保这些代码块无法被其他代码块访问。\n- 使用条件过滤：在条件判断语句中，使用条件过滤来过滤掉那些不可能发生的条件判断语句。例如，对于一个包含多个条件判断语句的循环，可以只保留其中一个条件的判断，而将其他条件的判断语句过滤掉。\n- 使用性能优化：对于一些条件判断语句，可以使用性能优化来避免条件竞争的情况。例如，可以使用数组或链表等数据结构来存储条件判断语句中的变量，从而避免条件竞争的情况。", "title": "如何预防竞争条件"}], "cnvd_id": "", "cve_id": "CVE-2026-104970", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.1}]}, "cvss_score": 8.1, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-362", "description": "Plane 是开源项目管理工具，用于团队工作项跟踪、迭代规划与自托管实例管理。\n受影响版本中，未认证的 POST /api/instances/admins/sign-up/ 进入 InstanceAdminSignUpEndpoint.post。该方法用 InstanceAdmin.objects.first() 判断实例管理员是否已存在，并在没有原子事务、行锁、唯一约束或 advisory lock 的情况下创建 User 与 InstanceAdmin。两个使用不同邮箱的并发请求可同时观察到管理员不存在，分别完成注册并经 user_login 获得实例管理员会话，与合法操作者共享实例管理权限。\n修复版本中通过把检查与创建放入 transaction.atomic()，对 Instance 单例行执行 select_for_update()，并在锁内用 is_setup_done 与 InstanceAdmin.objects.exists() 复查后才创建账户，使并发注册不能同时成为实例管理员。", "effects": [{"comp_name": "plane", "ecosystem": "linux", "versions": [{"affected_version": "[0.13,1.3.1]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中" \r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "attack_vector_type": "Local", "cnvd_id": "", "cve_id": "CVE-2026-98368", "cvss": {}, "cvss_score": 7.8, "cvss_vector": "", "cwe": "CWE-416", "description": "Linux 内核是开源操作系统内核，其 IPv4 与 IPv6 ESP 模块位于 net/ipv4/esp4.c 和 net/ipv6/esp6.c，用于 IPsec 封装安全载荷的出站加密。\n受影响版本中，当 esp-\u003einplace 为 false 时，esp_output_head() 向 skb frag 数组追加 trailer frag，esp_output_tail() 再用 get_page() 取得的目的页替换原有 frag。skb 若带有 SKBFL_MANAGED_FRAG_REFS，payload frag 归 ubuf 所有，不能按页单独引用或解引用，但该路径在改写 frag 数组前没有调用 skb_zcopy_downgrade_managed()。esp_ssg_unref() 随后遍历源 scatterlist 并对每个 frag 调用 skb_page_unref()，使仍处于 GUP pin 状态的 zerocopy 页引用计数降到 pin bias 之下，造成释放后使用；esp_output_tail() 将目的页装入 frag 0 后仍保留 SKBFL_MANAGED_FRAG_REFS，skb_release_data() 走 skip_unref 分支，按包速率泄漏 x-\u003exfrag 页。\n修复版本中通过在 esp_output_head() 与 esp6_output_head() 将 esp-\u003einplace 置为 false 之后、改写 frag 数组之前调用 skb_zcopy_downgrade_managed()，为已有 frag 取得真实页引用并清除 SKBFL_MANAGED_FRAG_REFS，使 esp_ssg_unref() 的逐 frag 解引用与 skb_release_data() 的页释放重新平衡，不再留下混合所有权的 frag 数组。", "effects": [{"comp_name": "linux_kernel", "ecosystem": "linux", "versions": [{"affected_version": "[6.2,6.6.158)", "min_fixed_version": "6.6.158", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.0,6.1.189)", "min_fixed_version": "6.1.189", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.19,7.2.8)", "min_fixed_version": "7.2.8", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.7,6.12.112)", "min_fixed_version": "6.12.112", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[7.3-rc1,7.3-rc4)", "min_fixed_version": "7.3-rc4", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.13,6.18.54)", "min_fixed_version": "6.18.54", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requi cess_tikzpicture 再把 tikzpicture 正文与文档导言区传入 TectonicEngine.render。render 将不可信内容写入临时 diagram.tex 后直接执行 tectonic，未限制 \\openin 与 \\openout 等 TeX 文件原语，转换进程可读其权限范围内的文件，并可创建或覆盖可写文件。仅当 tikz_engine_allow_shell_escape 为真时，命令行才会附加 -Z shell-escape，从而允许 TeX 执行 shell 命令。未启用 Tectonic 渲染的默认配置不受影响。\n修复版本中通过将 TectonicEngine 的 allow_shell_escape 默认值改为 False，在未开启 shell escape 时由 _build_command 追加 --untrusted 与 --only-cached，并在编译前用 _precheck_staged_files 扫描导言区、TikZ 正文和已暂存文件，发现 \\openin、\\openout、\\XeTeXpicfile、\\XeTeXpdffile 或绝对路径、家目录、盘符、父目录文件引用时跳过渲染并保留原始 TikZ，从而阻断这类文件原语和越界路径进入 Tectonic 编译。", "effects": [{"comp_name": "docling", "ecosystem": "pip", "versions": [{"affected_version": "[2.94.0,2.132.0)", "min_fixed_version": "2.132.0", "repository": "pip", "solutions": [], "upstream": true}]}, {"comp_name": "docling-slim", "ecosystem": "pip", "versions": [{"affected_version": "[2.94.0,2.132.0)", "min_fixed_version": "2.132.0", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "资源默认不安全", "kind_en": "使用不安全默认值初始化资源", "last_modified_time": "2026-10-06", "level": "High", "mps_id": "MPS-15ys-269f", "poc": false, "poc_url": [], "published_time": "2026-10-06", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-15ys-269f", "name": "https://www.oscs1024.com/hd/MPS-15ys-269f"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-105744", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-105744"}, {"url": "https://github.com/docling-project/docling/security/advisories/GHSA-x3q2-h9hx-4r4j", "name": "https://github.com/docling-project/docling/security/advisories/GHSA-x3q2-h9hx-4r4j"}, {"url": "https://github.com/docling-project/docling/pull/4419", "name": "https://github.com/docling-project/docling/pull/4419"}, {"url": "https://github.com/docling-project/docling/commit/38b6fa0a465d46fdacbbec333f50fa19c4f6b342", "name": "https://github.com/docling-project/docling/commit/38b6fa0a465d46fdacbbec333f50fa19c4f6b342"}, {"url": "https://github.com/docling-project/docling/releases/tag/v2.132.0", "name": "https://github.com/docling-project/docling/releases/tag/v2.132.0"}], "scope_influence": "", "tags": ["AI", "python", "开源"], "title": "Docling任意文件读写", "_translated": true, "_saved_at": "2026-10-05T23:35:31+00:00", "_first_saved_at": "2026-10-05T23:35:31+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-15ys-269f"}, {"analysis_status": 0, "articles": [{"content": "跨界内存读是指应用程序在读取内存时，未正确验证或限制读取的内存范围。攻击者利用这种漏洞可以读取应用程序内存中的敏感数据，如密码、加密密钥、会话令牌等。常见的原因是由于缓冲区溢出、格式化字符串漏洞或其他内存错误导致的。", "title": "什么是越界读取"}, {"content": "攻击者可以通过不当构造的输入来触发跨界内存读漏洞。攻击者可能会通过向应用程序发送特定的输入，使其读取超过预期的内存区域。攻击者可以利用这个漏洞来获取敏感信息，如其他用户的数据、操作系统的敏感数据或应用程序的内部状态。", "title": "越界读取常见的攻击方式"}, {"content": "- 输入验证和限制：应用程序应对所有输入数据进行严格的验证和限制。确保输入数据的长度、格式和内容符合预期，避免超出缓冲区或访问非预期的内存区域。\n- 内存安全编程实践：开发人员应使用安全的编程实践，如避免使用不安全的函数、正确处理内存分配和释放操作，以及遵循最小特权原则。\n- 使用安全的编程语言和库：选择使用安全性较高的编程语言和库，这些语言和库在内存管理和安全性方面提供了更多的保护机制。\n- 定期进行代码审查和安全测试：定期审查应用程序的代码，并进行安全测试，以发现潜在的跨界内存读漏洞。使用静态代码分析工具和漏洞扫描工具来辅助检测和修复问题。\n- 实施防御性编程技术：应用程序应采用防御性编程技术，如使用随机化地址空间布局（ASLR）、堆栈保护机制（如堆栈溢出保护）和数据执行预防（DEP）等。\n- 及时更新和修补：及时应用程序和操作系统的安全更新和补丁，以确保已知的跨界内存读漏洞得到修复。及时更新相关软件和库，以避免使用已知存在漏洞的版本。", "title": "如何预防越界读取"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-98372", "cvss": {}, "cvss_score": 7.5, "cvss_vector": "", "cwe": "CWE-125", "description": "Linux 内核是开源操作系统内核。其 XFRM IPTFS 子系统实现 IPsec IP-TFS（AGGFRAG）隧道模式，在安全关联上接收外层报文并重组内层数据包。\n受影响版本中，iptfs_skb_reset_frag_walk() 在 offset 不小于 walk-\u003epast + walk-\u003efrags[walk-\u003efragi].len 时无上界执行 walk-\u003efragi++，并解引用栈上固定数组 walk-\u003efrags[]，全程不与 walk-\u003enr_frags 比较。iptfs_skb_can_add_frags() 没有 iptfs_skb_add_frags() 已有的长度守卫，仍会无条件调用前者。送入 IPTFS 安全关联接收路径的 IP-TFS 载荷从 iptfs_input() 进入 iptfs_reassem_cont() 后，可在 offset 达到或超过片段总长度时越界读取栈内存。\n修复版本中通过在 iptfs_skb_can_add_frags() 调用 iptfs_skb_reset_frag_walk() 之前加入与 iptfs_skb_add_frags() 相同的前置判断，在 walk-\u003enr_frags 为 0 或 offset 大于等于 walk-\u003etotal + walk-\u003einitial_offset 时直接返回 false，使越界遍历不再发生，并回退到原有线性化拷贝路径。", "effects": [{"comp_name": "linux_kernel", "ecosystem": "linux", "versions": [{"affected_version": "[6.19-rc1,7.2.8)", "min_fixed_version": "7.2.8", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.14,6.18.54)", "min_fixed_version": "6.18.54", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[7.3-rc1,7.3-rc4)", "min_fixed_version": "7.3-rc4", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界读取", "kind_en": "越界读取", "last_modified_time": "2026-10-06", "level": "High", "mps_id": "MPS-b2ka-q743", "poc": false, "poc_url": [], "published_time": "2026-10-06", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-b2ka-q743", "name": "https://www.oscs1024.com/hd/MPS-b2ka-q743"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-98372", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-98372"}, {"url": "https://git.kernel.org/stable/c/7e1c6884a0b494b7e3f204877f94c1e07a117bf7", "name": ""}, {"url": "https://git.kernel.org/stable/c/da56d0ee93d1bad779b0486f2fab92d1bc1f0cf3", "name": ""}, {"url": "https://git.kernel.org/stable/c/d042487dc118e494db2e2c1382310255c90ff544", "name": ""}], "scope_influence": "", "tags": ["操作系统"], "title": "内核IPTFS栈越界读取", "_translated": true, "_saved_at": "2026-10-06T11:40:41+00:00", "_first_saved_at": "2026-10-06T11:40:41+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-b2ka-q743"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过向受信任的数据序列化过程中添加恶意数据，从而在序列化和反序列化过程中执行恶意代码的攻击漏洞。这种漏洞通常存在于使用序列化 (serialization) 机制存储和传输数据的程序中。\n", "title": "什么是反序列化"}, {"content": "- 注入攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码注入到程序中，从而实现代码执行的目的。\n- 反射攻击：攻击者使用反射机制，在序列化过程中动态生成恶意数据，并将恶意代码注入到程序中，从而实现代码执行的目的。\n- 缓冲区溢出攻击：攻击者通过在序列化过程中向缓冲区输入恶意数据，导致缓冲区溢出，从而破坏程序的内存管理，实现代码执行的目的。\n- 格式字符串攻击：攻击者通过在序列化过程中输入恶意数据，导致程序使用错误的格式字符串，从而实现代码执行的目的。\n- 数据流攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码作为一个数据流传递给程序，从而实现代码执行的目的。\n", "title": "反序列化常见的攻击方式"}, {"content": "- 不信任输入数据：程序应该严格检查输入数据的有效性，并避免使用不受信任的数据。\n- 使用安全的序列化机制：程序应该使用安全的序列化机制，如 JSON 或 XML 序列化，而不是第三方序列化库。\n- 最小特权原则：程序应该限制对受信任数据的处理权限，并避免在运行时修改数据。\n- 代码审查和漏洞扫描：程序应该进行代码审查和漏洞扫描，以发现和修复潜在的安全漏洞。\n", "title": "如何预防反序列化"}], "cnvd_id": "", "cve_id": "CVE-2026-103831", "cvss": {"cvssv4": [{"source": "cve-coordination@incibe.es", "vector": "CVSS:4.0/AV:L/AC:H/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:4.0/AV:L/AC:H/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-502", "description": "CVE-2026-103831：TrueLayer Magento 2 插件的 Psr16CacheAdapter 组件中存在不安全反序列化漏洞，原因是使用 PHP 的本机 unserialize() 函数，在检索缓存中存储的数据时没有限制允许的类。已经能够将受操纵的数据写入 Magento 使用的缓存后端（例如 Redis 或 Memcached）的攻击者可以注入特制的 PHP 对象并触发其反序列化，从而可能导致通过应用程序环境中可用的小工具字符串执行任意代码。因此，利用需要一个先决条件，允许通过访问本地文件系统或可从 Magento 环境访问的缓存基础设施来写入缓存基础设施。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "反序列化", "kind_en": "不可信数据的反序列化", "last_modified_time": "2026-10-06", "level": "High", "mps_id": "MPS-kxrb-ado4", "poc": false, "poc_url": [], "published_time": "2026-10-06", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-kxrb-ado4", "name": "https://www.oscs1024.com/hd/MPS-kxrb-ado4"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-103831", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-103831"}, {"url": "https://www.incibe.es/en/incibe-cert/notices/aviso/insecure-deserialization-truelayer-magento-2-plugin", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "TrueLayer Magento 2 插件中的不安全反序列化", "_translated": true, "_saved_at": "2026-10-06T11:40:37+00:00", "_first_saved_at": "2026-10-06T11:40:37+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-kxrb-ado4"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-84854", "cvss": {"cvssv31": [{"source": "2fc02b1f-71e7-4514-a878-169626f68903", "vector": "CVSS:3.1/AV:L/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7}]}, "cvss_score": 7, "cvss_vector": "CVSS:3.1/AV:L/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-787", "description": "在版本 6.72 以下的 Windows WibuKey 驱动程序中，计算内核缓冲区大小时对用户输入的验证不足可能会导致少量数据写入预期内核缓冲区之外。这可能会导致系统崩溃。在不利的情况下，相邻的内核内存可能会被修改。", "effects": [{"comp_name": "wibukey", "ecosystem": "linux", "versions": [{"affected_version": "[0,6.72)", "min_fixed_version": "6.72", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-10-06", "level": "High", "mps_id": "MPS-ge1c-o9in", "poc": false, "poc_url": [], "published_time": "2026-10-06", "reference_url_list": [{"url": "  "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:L/A:N", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:L/A:N", "cwe": "CWE-696", "description": "External Secrets Operator 是 CNCF 生态中开源的 Kubernetes 操作器，采用 Go 语言编写，用于从 Vault、AWS Secrets Manager 等第三方密钥服务读取信息并自动注入为 Kubernetes Secrets，其内置的 Webhook 生成器（generators.external-secrets.io/v1alpha1 Webhook）支持通过外部 HTTP 服务动态生成 Secret。\n受影响版本中，Webhook 生成器 generators/v1/webhook/webhook.go 的 Generate 方法初始化顺序错误，w.wh.EnforceLabels = true 设置之后才执行 w.wh = webhook.Webhook{} 零值重建，标签强制标志被清除，导致后续读取生成器 spec 引用的 Kubernetes Secret 时跳过 external-secrets.io/type=webhook 标签校验；具备创建 Webhook 生成器权限的攻击者可将生成器 spec 指向同命名空间内任意受害 Secret，受害 Secret 数据经模板渲染注入请求 URL 与 Body 发往攻击者控制的 URL，造成密钥泄露。\n修复版本中通过调整 Generate 方法的初始化顺序解决该问题，w.wh = webhook.Webhook{} 零值重建移至方法开头并先于 EnforceLabels = true 执行，标签强制标志不再被清除，getStoreSecret 恢复对引用 Secret 的 external-secrets.io/type=webhook 标签校验，未携带该标签的 Secret 读取直接返回错误，1.3.2 版本包含该修复。", "effects": [{"comp_name": "github.com/external-secrets/external-secrets", "ecosystem": "go", "versions": [{"affected_version": "[0.10.0,1.3.2)", "min_fixed_version": "1.3.2", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "不正确的行为次序", "kind_en": "不正确的行为秩序", "last_modified_time": "2026-10-07", "level": "High", "mps_id": "MPS-kb58-hnlu", "poc": false, "poc_url": [], "published_time": "2026-10-07", "reference_url_list": [{"url": "https://github.com/external-secrets/external-secrets/security/advisories/GHSA-q7hv-xx6h-q2x8", "name": ""}, {"url": "https://github.com/external-secrets/external-secrets/pull/5901", "name": ""}, {"url": "https://github.com/external-secrets/external-secrets/commit/25aa09275861e3ed6fc5d2a1a60b9ac3df4a93ba", "name": ""}, {"url": "https://github.com/external-secrets/external-secrets/releases/tag/v1.3.2", "name": ""}, {"url": "http   <script>
    const payload = JSON.parse(document.getElementById("payload").textContent);
    const levelLabels = payload.level_labels || {};
    const items = payload.items || [];
    let filtered = items.slice();
    let activeId = null;

    const $ = (id) => document.getElementById(id);
    $("generatedAt").textContent = payload.generated_at || "-";
    $("retention").textContent = payload.retention_days ?? "-";
    $("cutoff").textContent = payload.cutoff_date || "-";
    $("count").textContent = String(payload.count ?? items.length);

    function levelClass(level) {
      const cn = levelLabels[level] || level || "";
      if (level === "Critical" || cn === "严重") return "crit";
      if (level === "High" || cn === "高危") return "high";
      return "other";
    }
    function levelText(level) {
      return levelLabels[level] || level || "-";
    }
    function esc(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }
    function scoreText(v) {
      if (v === null || v === undefined || v === "" || v === -1) return "-";
      return String(v);
    }

    function renderList() {
      const list = $("list");
      $("listCount").textContent = String(filtered.length);
      if (!filtered.length) {
        list.innerHTML = '<div class="empty">没有匹配项</div>';
        return;
      }
      list.innerHTML = filtered.map((it) => {
        const id = it.mps_id || it.cve_id;
        const active = id === activeId ? " active" : "";
        return `
          <button class="item${active}" data-id="${esc(id)}" type="button">
            <div class="item-top">
              <span class="cve">${esc(it.cve_id || it.mps_id || "-")}</span>
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
            </div>
            <div class="title">${esc(it.title || "-")}</div>
            <div class="item-foot">
              <span>CVSS ${esc(scoreText(it.cvss_score))}</span>
              <span>${esc(it.published_time || "-")}</span>
              ${it.poc ? "<span>POC</span>" : ""}
            </div>
          </button>`;
      }).join("");
      list.querySelectorAll(".item").forEach((btn) => {
        btn.addEventListener("click", () => selectById(btn.dataset.id));
      });
    }

    function refsHtml(it) {
      const refs = Array.isArray(it.reference_url_list) ? it.reference_url_list : [];
      const links = [];
      if (it._source_page) links.push({ url: it._source_page, name: "OSCS 详情" });
      if (it.cve_id) links.push({ url: `https://nvd.nist.gov/vuln/detail/${it.cve_id}`, name: "NVD" });
      refs.forEach((r) => {
        if (r && r.url) links.push({ url: r.url, name: r.name || r.url });
      });
      const seen = new Set();
      const uniq = [];
      for (const l of links) {
        if (seen.has(l.url)) continue;
        seen.add(l.url);
        uniq.push(l);
      }
      if (!uniq.length) return '<div class="box">无参考链接</div>';
      return `<div class="refs">${uniq.map((l) =>
        `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name || l.url)}</a>`
      ).join("")}</div>`;
    }

    function articlesHtml(it) {
      const arts = Array.isArray(it.articles) ? it.articles : [];
      if (!arts.length) return "";
      return `<div class="section"><h3>相关说明</h3>${arts.map((a) => `
        <div class="article">
          <h4>${esc(a.title || "说明")}</h4>
          <p>${esc(a.content || "")}</p>
        </div>`).join("")}</div>`;
    }

    function renderDetail(it) {
      const detail = $("detail");
      if (!it) {
        detail.innerHTML = '<div class="empty">暂无数据</div>';
        return;
      }
      const pocUrls = Array.isArray(it.poc_url) ? it.poc_url : [];
      detail.innerHTML = `
        <div class="d-head">
          <div>
            <h1 class="d-title">${esc(it.title || "-")}</h1>
            <div class="ids">
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
              <span class="chip">${esc(it.cve_id || "无 CVE")}</span>
              <span class="chip">${esc(it.mps_id || "-")}</span>
              ${it.poc ? '<span class="chip">有 POC</span>' : ""}
              ${it.exp ? '<span class="chip">有 EXP</span>' : ""}
            </div>
          </div>
          <div class="actions">
            ${it._source_page ? `<a class="btn" href="${esc(it._source_page)}" target="_blank" rel="noopener">OSCS</a>` : ""}
            ${it.cve_id ? `<a class="btn" href="https://nvd.nist.gov/vuln/detail/${esc(it.cve_id)}" target="_blank" rel="noopener">NVD</a>` : ""}
          </div>
        </div>
        <div class="grid">
          <div class="stat"><div class="k">CVSS</div><div class="v">${esc(scoreText(it.cvss_score))}</div></div>
          <div class="stat"><div class="k">向量</div><div class="v">${esc(it.cvss_vector || "-")}</div></div>
          <div class="stat"><div class="k">CWE</div><div class="v">${esc(it.cwe || "-")}</div></div>
          <div class="stat"><div class="k">类型</div><div class="v">${esc(it.kind || it.kind_en || "-")}</div></div>
          <div class="stat"><div class="k">公开</div><div class="v">${esc(it.published_time || "-")}</div></div>
          <div class="stat"><div class="k">利用成本</div><div class="v">${esc(it.exploit_requirement_cost || "-")}</div></div>
          <div class="stat"><div class="k">可利用性</div><div class="v">${esc(it.exploitability || "-")}</div></div>
          <div class="stat"><div class="k">修复建议</div><div class="v">${esc(it.fix_suggestion || "-")}</div></div>
        </div>
        <div class="section"><h3>描述</h3><div class="box">${esc(it.description || "无描述")}</div></div>
        ${it.scope_influence ? `<div class="section"><h3>影响范围</h3><div class="box">${esc(it.scope_influence)}</div></div>` : ""}
        ${pocUrls.length ? `<div class="section"><h3>POC 链接</h3><div class="refs">${pocUrls.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join("")}</div></div>` : ""}
        <div class="section"><h3>参考链接</h3>${refsHtml(it)}</div>
        ${articlesHtml(it)}
      `;
    }

    function selectById(id) {
      const it = filtered.find((x) => (x.mps_id || x.cve_id) === id) ||
                 items.find((x) => (x.mps_id || x.cve_id) === id);
      if (!it) return;
      activeId = it.mps_id || it.cve_id;
      renderList();
      renderDetail(it);
      const btn = document.querySelector(`.item[data-id="${CSS.escape(activeId)}"]`);
      if (btn) btn.scrollIntoView({ block: "nearest" });
      history.replaceState(null, "", "#" + encodeURIComponent(activeId));
    }

    function applyFilter(q) {
      const query = (q || "").trim().toLowerCase();
      filtered = !query ? items.slice() : items.filter((it) => {
        const blob = [
          it.cve_id, it.mps_id, it.title, it.kind, it.kind_en, it.cwe, it.description, it.level
        ].map((x) => String(x || "").toLowerCase()).join(" ");
        return blob.includes(query);
      });
      renderList();
      if (filtered.length) {
        const still = filtered.some((x) => (x.mps_id || x.cve_id) === activeId);
        selectById(still ? activeId : (filtered[0].mps_id || filtered[0].cve_id));
      } else {
        activeId = null;
        renderDetail(null);
      }
    }

    $("search").addEventListener("input", (e) => applyFilter(e.target.value));

    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement !== $("search")) {
        e.preventDefault();
        $("search").focus();
        return;
      }
      if (!filtered.length) return;
      const idx = filtered.findIndex((x) => (x.mps_id || x.cve_id) === activeId);
      if (e.key === "ArrowDown") {
        e.preventDefault();
        const next = filtered[Math.min(filtered.length - 1, Math.max(0, idx) + 1)];
        selectById(next.mps_id || next.cve_id);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        const prev = filtered[Math.max(0, idx - 1)];
        selectById(prev.mps_id || prev.cve_id);
      }
    });

    const hashId = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    if (hashId && items.some((x) => (x.mps_id || x.cve_id) === hashId)) {
      activeId = hashId;
      renderList();
      selectById(hashId);
    } else if (items.length) {
      selectById(items[0].mps_id || items[0].cve_id);
    } else {
      renderList();
      renderDetail(null);
    }
  </script>
</body>
</html>
