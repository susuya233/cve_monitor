unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[10.11.1,10.11.19)", "min_fixed_version": "10.11.19", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[13.0.1,13.0.2)", "min_fixed_version": "13.0.2", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[11.4.1,11.4.13)", "min_fixed_version": "11.4.13", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[11.8.1,11.8.9)", "min_fixed_version": "11.8.9", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "文件名或路径的外部可控制", "kind_en": "文件名或路径的外部控制", "last_modified_time": "2026-10-13", "level": "High", "mps_id": "MPS-a76a-a750", "poc": false, "poc_url": [], "published_time": "2026-10-13", "reference_url_list": [{"url": "https://cybersecuritynews.com/critical-mariadb-flaws/", "name": ""}, {"url": "https://github.com/MariaDB/server/security/advisories/GHSA-h4vr-wpff-jfx4", "name": ""}, {"url": "https://jira.mariadb.org/browse/MDEV-40413", "name": ""}, {"url": "https://github.com/MariaDB/server/commit/98437c30ae52ed709f266e5f8095d779261a5879", "name": ""}], "scope_influence": "", "tags": [], "title": "MariaDB分区转换越权", "_translated": true, "_saved_at": "2026-10-13T09:58:45+00:00", "_first_saved_at": "2026-10-13T09:58:45+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-a76a-a750"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "cnvd_id": "", "cve_id": "CVE-2026-95837", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-269", "description": "containerd 是开源容器运行时，其 CRI 插件为 Kubernetes 等编排系统提供容器创建、检查点与恢复能力。\n受影响版本中，CreateContainer 把本地 checkpoint 归档或带检查点注解的 OCI 镜像交给 CRImportCheckpoint。该函数读取 checkpoint 中的 spec.dump、config.dump 与 status.dump，并以 restore 为 true 创建容器；StartContainer 在 Status.Restore 为 true 时调用 container.Restore，由 CRIU 按 checkpoint 恢复进程凭证、Linux capabilities、no_new_privs 与 seccomp，而不强制执行目的地 ContainerConfig。能够创建容器的攻击者可因此以 root、完整 capabilities 且无 seccomp 限制运行进程，CRI 状态仍报告请求的配置。未使用该恢复路径的系统不受影响。\n修复版本中通过默认关闭 CreateContainer 的 checkpoint restore 切断该路径。CRImportCheckpoint 在 enable_experimental_restore_via_create 为 false 时直接拒绝恢复；2.2.7 与 2.3.4 采用该默认值，2.4.0 移除该入口。重新打开该实验选项后，CRIU 恢复仍不会按目的地安全策略收敛进程状态。", "effects": [{"comp_name": "github.com/containerd/containerd/v2", "ecosystem": "go", "versions": [{"affected_version": "[2.1.0,2.2.7)", "min_fixed_version": "2.2.7", "repository": "go", "solutions": [], "upstream": true}, {"affected_version": "[2.3.0,2.3.4)", "min_fixed_version": "2.3.4", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-10-13", "level": "High", "mps_id": "MPS-xtdm-h5jb", "poc": false, "poc_url": [], "published_time": "2026-10-13", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-xtdm-h5jb", "name": "https://www.oscs1024.com/hd/MPS-xtdm-h5jb"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-95837", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-95837"}, {"url": "https://github.com/containerd/containerd/security/advisories/GHSA-p7v4-vr35-mj6f", "name": "https://github.com/containerd/containerd/security/advisories/GHSA-p7v4-vr35-mj6f"}, {"url": "https://github.com/containerd/containerd/pull/13913", "name": "https://github.com/containerd/containerd/pull/13913"}, {"url": "https://github.com/containerd/containerd/commit/928c03c6898cad95f795300281fdff0dbc55a32f", "name": "https://github.com/containerd/containerd/commit/928c03c6898cad95f795300281fdff0dbc55a32f"}], "scope_influence": "", "tags": ["go"], "title": "containerd CRI权限绕过", "_translated": true, "_saved_at": "2026-10-12T20:44:55+00:00", "_first_saved_at": "2026-10-12T20:44:55+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-xtdm-h5jb"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-109687", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:C/C:H/I:N/A:L", "severity": "high", "base_score": 7.6}]}, "cvss_score": 7.6, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:C/C:H/I:N/A:L", "cwe": "CWE-89", "description": "Link Whisper Free 是 Link Whisper INC 在 WordPress.org 发布的开源插件（标识 link-whisper，GPLv2 或更高版本），用于生成站内链接建议并提供链接报告与点击统计。\n受影响版本中，具备 manage_categories 能力的已登录用户（WordPress Editor 及以上角色）打开 Clicks Report 时，Wpil_Table_Click::prepare_items 读取请求中的 orderby 与 s，并传入 Wpil_ClickTracker::get_data。该方法只对 orderby、search 和 post_type 做 sanitize_text_field，再把它们直接拼入 ORDER BY 与 LIKE 条件，请求中的特殊字符可以改变 SQL 语义，形成盲注并读取数据库中的敏感数据。\n修复版本中通过把 orderby 限制为 post_title、post_type、post_date、date、clicks，并用 $wpdb-\u003eprepare 与 esc_like 绑定 search 和 post_type，使这些输入不再作为 SQL 语法执行。", "effects": [{"comp_name": "link-whisper", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,0.9.8)", "min_fixed_version": "0.9.8", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-10-13", "level": "High", "mps_id": "MPS-slnt-7dwb", "poc": false, "poc_url": [], "published_time": "2026-10-13", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-slnt-7dwb", "name": "https://www.oscs1024.com/hd/MPS-slnt-7dwb"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-109687", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-109687"}, {"url": "https://patchstack.com/database/wordpress/plugin/link-whisper/vulnerability/wordpress-link-whisper-free-plugin-0-9-7-sql-injection-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": [], "title": "Link Whisper盲注", "_translated": true, "_saved_at": "2026-10-13T09:58:47+00:00", "_first_saved_at": "2026-10-13T09:58:47+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-slnt-7dwb"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-41510", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:N/I:L/A:L", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:N/I:L/A:L", "cwe": "CWE-770", "description": "Coraza 是一个开源（Apache-2.0 协议）的 Go 语言 Web 应用防火墙引擎，兼容 ModSecurity SecLang 规则语法，通常以库或网关插件形式嵌入应用与代理，用于执行 OWASP CRS 等请求检测规则。\n受影响版本中，事务层的 AddGetRequestArgument、AddPostRequestArgument、AddPathRequestArgument 在参数数量达到 SecArgumentsLimit（默认 1000）后静默丢弃后续参数，且不设置任何错误标志；ExtractGetArguments 以随机化的 map 顺序遍历查询参数，被丢弃的参数集合不可预测，攻击者在 URI 中填充大量无害参数，可使恶意参数落入被丢弃的部分，针对 ARGS、ARGS_GET、ARGS_NAMES 的全部规则（含 OWASP CRS 的 SQLi/XSS/RCE 检测）均无法再看到该参数，推荐配置 coraza.conf-recommended 又缺少等价的兜底拒绝规则，urlencoded 与 JSON 请求体处理器还不受该上限约束，攻击者可进一步借助大参数量请求体造成内存耗尽。\n修复版本中通过新增 ARGUMENTS_LIMIT_REACHED 事务变量并在全部参数写入路径置位，配合推荐配置中命中该标志即返回 400 的规则 200004/200005，把静默丢弃转为显式拦截；ExtractGetArguments 改用带 SecArgumentsLimit 上限的有序解析（ParseQueryOrdered），checkArgumentLimit 改按总取值数（TotalValues）计数以覆盖重复键泛洪，urlencoded 与 JSON 处理器经 BodyProcessorOptions 接入上限；3.8.1 补充把 JSON 展开的数组长度条目纳入字节预算并在超限时置 REQBODY_ERROR，消除参数泛洪绕过与内存放大。", "effects": [{"comp_name": "github.com/corazawaf/coraza/v3", "ecosystem": "go", "versions": [{"affected_version": "[3.0.0,3.8.1)", "min_fixed_version": "3.8.1", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "不加限制或调节的资源分配", "kind_en": "不受限制或节流地分配资源", "last_modified_time": "2026-10-13", "level": "High", "mps_id": "MPS-na7p-uyst", "poc": false, "poc_url": [], "published_time": "2026-10-13", "reference_url_list": [{"url": "https://github.com/corazawaf/coraza/security/advisories/GHSA-6r3q-mjv7-xr8m", "name": ""}, {"url": "https://github.com/corazawaf/coraza/commit/146c2f79f39ad16f13787e7d67ad400f8d8cb9a3", "name": ""}, {"url": "https://github.com/corazawaf/coraza/commit/814e1898e083d2ff2ceb644382d0da17e930f93f", "name": ""}, {"url": "https://github.com/corazawaf/coraza/commit/b98359bb7e7606c95100dcc7ad490d2d624e6dea", "name": ""}, {"url": "https://github.com/corazawaf/coraza/releases/tag/v3.8.1", "name": ""}, {"url": "https://github.com/advisories/GHSA-6r3q-mjv7-xr8m", "name": ""}], "scope_influence": "", "tags": ["go"], "title": "Coraza 参数泛洪规则绕过", "_translated": true, "_saved_at": "2026-10-12T20:44:56+00:00", "_first_saved_at": "2026-10-12T20:44:56+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-na7p-uyst"}]}</script>
  <script>
    const payload = JSON.parse(document.getElementById("payload").textContent);
    const levelLabels = payload.level_labels || {};
    const items = payload.items || [];
    let filtered = items.slice();
    let activeId = null;

    const $ = (id) => document.getElementById(id);
    $("generatedAt").textContent = payload.generated_at || "-";
    $("retention").textContent = payload.retention_days ?? "-";
    $("cutoff").textContent = payload.cutoff_date || "-";
    $("count").textContent = String(payload.count ?? items.length);

    function levelClass(level) {
      const cn = levelLabels[level] || level || "";
      if (level === "Critical" || cn === "严重") return "crit";
      if (level === "High" || cn === "高危") return "high";
      return "other";
    }
    function levelText(level) {
      return levelLabels[level] || level || "-";
    }
    function esc(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }
    function scoreText(v) {
      if (v === null || v === undefined || v === "" || v === -1) return "-";
      return String(v);
    }

    function renderList() {
      const list = $("list");
      $("listCount").textContent = String(filtered.length);
      if (!filtered.length) {
        list.innerHTML = '<div class="empty">没有匹配项</div>';
        return;
      }
      list.innerHTML = filtered.map((it) => {
        const id = it.mps_id || it.cve_id;
        const active = id === activeId ? " active" : "";
        return `
          <button class="item${active}" data-id="${esc(id)}" type="button">
            <div class="item-top">
              <span class="cve">${esc(it.cve_id || it.mps_id || "-")}</span>
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
            </div>
            <div class="title">${esc(it.title || "-")}</div>
            <div class="item-foot">
              <span>CVSS ${esc(scoreText(it.cvss_score))}</span>
              <span>${esc(it.published_time || "-")}</span>
              ${it.poc ? "<span>POC</span>" : ""}
            </div>
          </button>`;
      }).join("");
      list.querySelectorAll(".item").forEach((btn) => {
        btn.addEventListener("click", () => selectById(btn.dataset.id));
      });
    }

    function refsHtml(it) {
      const refs = Array.isArray(it.reference_url_list) ? it.reference_url_list : [];
      const links = [];
      if (it._source_page) links.push({ url: it._source_page, name: "OSCS 详情" });
      if (it.cve_id) links.push({ url: `https://nvd.nist.gov/vuln/detail/${it.cve_id}`, name: "NVD" });
      refs.forEach((r) => {
        if (r && r.url) links.push({ url: r.url, name: r.name || r.url });
      });
      const seen = new Set();
      const uniq = [];
      for (const l of links) {
        if (seen.has(l.url)) continue;
        seen.add(l.url);
        uniq.push(l);
      }
      if (!uniq.length) return '<div class="box">无参考链接</div>';
      return `<div class="refs">${uniq.map((l) =>
        `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name || l.url)}</a>`
      ).join("")}</div>`;
    }

    function articlesHtml(it) {
      const arts = Array.isArray(it.articles) ? it.articles : [];
      if (!arts.length) return "";
      return `<div class="section"><h3>相关说明</h3>${arts.map((a) => `
        <div class="article">
          <h4>${esc(a.title || "说明")}</h4>
          <p>${esc(a.content || "")}</p>
        </div>`).join("")}</div>`;
    }

    function renderDetail(it) {
      const detail = $("detail");
      if (!it) {
        detail.innerHTML = '<div class="empty">暂无数据</div>';
        return;
      }
      const pocUrls = Array.isArray(it.poc_url) ? it.poc_url : [];
      detail.innerHTML = `
        <div class="d-head">
          <div>
            <h1 class="d-title">${esc(it.title || "-")}</h1>
            <div class="ids">
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
              <span class="chip">${esc(it.cve_id || "无 CVE")}</span>
              <span class="chip">${esc(it.mps_id || "-")}</span>
              ${it.poc ? '<span class="chip">有 POC</span>' : ""}
              ${it.exp ? '<span class="chip">有 EXP</span>' : ""}
            </div>
          </div>
          <div class="actions">
            ${it._source_page ? `<a class="btn" href="${esc(it._source_page)}" target="_blank" rel="noopener">OSCS</a>` : ""}
            ${it.cve_id ? `<a class="btn" href="https://nvd.nist.gov/vuln/detail/${esc(it.cve_id)}" target="_blank" rel="noopener">NVD</a>` : ""}
          </div>
        </div>
        <div class="grid">
          <div class="stat"><div class="k">CVSS</div><div class="v">${esc(scoreText(it.cvss_score))}</div></div>
          <div class="stat"><div class="k">向量</div><div class="v">${esc(it.cvss_vector || "-")}</div></div>
          <div class="stat"><div class="k">CWE</div><div class="v">${esc(it.cwe || "-")}</div></div>
          <div class="stat"><div class="k">类型</div><div class="v">${esc(it.kind || it.kind_en || "-")}</div></div>
          <div class="stat"><div class="k">公开</div><div class="v">${esc(it.published_time || "-")}</div></div>
          <div class="stat"><div class="k">利用成本</div><div class="v">${esc(it.exploit_requirement_cost || "-")}</div></div>
          <div class="stat"><div class="k">可利用性</div><div class="v">${esc(it.exploitability || "-")}</div></div>
          <div class="stat"><div class="k">修复建议</div><div class="v">${esc(it.fix_suggestion || "-")}</div></div>
        </div>
        <div class="section"><h3>描述</h3><div class="box">${esc(it.description || "无描述")}</div></div>
        ${it.scope_influence ? `<div class="section"><h3>影响范围</h3><div class="box">${esc(it.scope_influence)}</div></div>` : ""}
        ${pocUrls.length ? `<div class="section"><h3>POC 链接</h3><div class="refs">${pocUrls.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join("")}</div></div>` : ""}
        <div class="section"><h3>参考链接</h3>${refsHtml(it)}</div>
        ${articlesHtml(it)}
      `;
    }

    function selectById(id) {
      const it = filtered.find((x) => (x.mps_id || x.cve_id) === id) ||
                 items.find((x) => (x.mps_id || x.cve_id) === id);
      if (!it) return;
      activeId = it.mps_id || it.cve_id;
      renderList();
      renderDetail(it);
      const btn = document.querySelector(`.item[data-id="${CSS.escape(activeId)}"]`);
      if (btn) btn.scrollIntoView({ block: "nearest" });
      history.replaceState(null, "", "#" + encodeURIComponent(activeId));
    }

    function applyFilter(q) {
      const query = (q || "").trim().toLowerCase();
      filtered = !query ? items.slice() : items.filter((it) => {
        const blob = [
          it.cve_id, it.mps_id, it.title, it.kind, it.kind_en, it.cwe, it.description, it.level
        ].map((x) => String(x || "").toLowerCase()).join(" ");
        return blob.includes(query);
      });
      renderList();
      if (filtered.length) {
        const still = filtered.some((x) => (x.mps_id || x.cve_id) === activeId);
        selectById(still ? activeId : (filtered[0].mps_id || filtered[0].cve_id));
      } else {
        activeId = null;
        renderDetail(null);
      }
    }

    $("search").addEventListener("input", (e) => applyFilter(e.target.value));

    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement !== $("search")) {
        e.preventDefault();
        $("search").focus();
        return;
      }
      if (!filtered.length) return;
      const idx = filtered.findIndex((x) => (x.mps_id || x.cve_id) === activeId);
      if (e.key === "ArrowDown") {
        e.preventDefault();
        const next = filtered[Math.min(filtered.length - 1, Math.max(0, idx) + 1)];
        selectById(next.mps_id || next.cve_id);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        const prev = filtered[Math.max(0, idx - 1)];
        selectById(prev.mps_id || prev.cve_id);
      }
    });

    const hashId = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    if (hashId && items.some((x) => (x.mps_id || x.cve_id) === hashId)) {
      activeId = hashId;
      renderList();
      selectById(hashId);
    } else if (items.length) {
      selectById(items[0].mps_id || items[0].cve_id);
    } else {
      renderList();
      renderDetail(null);
    }
  </script>
</body>
</html>
