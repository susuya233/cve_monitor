中 Certificate 仅对 name 强制唯一，body、serial、external_id 缺乏唯一约束，因而调用者可针对目标证书的 (authority_id, serial) 与 body 再次插入一条由自己拥有的重复记录。攻击者随后对重复记录调用 PUT /api/1/certificates/\u003cdup_id\u003e/revoke，CertificateRevoke.put 仅在 g.current_user != cert.user 时执行 CertificatePermission 检查（重复记录的 user 即为攻击者，直接绕过），且 cert.endpoints 为空时绕过“已部署端点禁止吊销”防线；最终 service.revoke 调用 issuer 插件按 certificate.body（ACME）或 certificate.external_id（DigiCert/Entrust/Google CA/CFSSL）使用 authority 的存储 CA 凭据在真实 CA 侧吊销目标证书，可在不持有 AuthorityPermission 或 CertificatePermission 的情况下造成集群级 TLS 拒绝服务。\n修复版本中通过在 CertificatesUpload.post 中校验 authority 的 AuthorityPermission，并在 (authority_id, serial) 已存在时返回 409 拒绝重复上传；在 CertificateRevoke.put 中按 (authority_id, serial) 查找全部相关 Certificate 行，对每一行均执行 CertificatePermission 与已部署端点检查，使重复记录或行内授权都不能再绕过吊销授权与端点保护。", "effects": [{"comp_name": "lemur", "ecosystem": "pip", "versions": [{"affected_version": "(-∞,1.9.3)", "min_fixed_version": "1.9.3", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "通过用户控制密钥绕过授权机制", "kind_en": "通过用户控制的密钥绕过授权", "last_modified_time": "2026-08-19", "level": "High", "mps_id": "MPS-0k8u-cthy", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-0k8u-cthy", "name": "https://www.oscs1024.com/hd/MPS-0k8u-cthy"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-71417", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-71417"}, {"url": "https://github.com/Netflix/lemur/commit/851389ae737a6d6bf16c1f9ca64a2ce56c1cc5c6", "name": ""}, {"url": "https://github.com/Netflix/lemur/releases/tag/v1.9.3", "name": ""}, {"url": "https://github.com/Netflix/lemur/security/advisories/GHSA-pxmc-2ffp-8j67", "name": ""}, {"url": "https://github.com/Netflix/lemur/security/advisories/GHSA-pxmc-2ffp-8j67", "name": ""}], "scope_influence": "", "tags": ["python", "开源", "终端软件"], "title": "Lemur 任意证书吊销漏洞", "_translated": true, "_saved_at": "2026-08-18T21:17:34+00:00", "_first_saved_at": "2026-08-18T21:17:34+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-0k8u-cthy"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-76241", "cvss": {"cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:L/AC:L/AT:P/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.3}]}, "cvss_score": 7.3, "cvss_vector": "CVSS:4.0/AV:L/AC:L/AT:P/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-494", "description": "stigmem 是 eidetic-labs 维护、采用 Apache-2.0 协议发布的开源记忆与插件治理框架；其下 stigmem-node（PyPI 包 stigmem-node）是基于 FastAPI 的节点服务，负责已安装插件的发现、签名校验与注册。\n受影响版本中，stigmem-node 仅通过单一环境变量 STIGMEM_PLUGIN_SIGNING_REQUIRED=false 即可关闭插件签名强制校验；节点启动时由 node/src/stigmem_node/main.py 的 lifespan 调用 node/src/stigmem_node/plugins/lifecycle.py 中的 register_discovered_plugins，当签名强制关闭时该函数直接调用 node/src/stigmem_node/plugins/signing.py 的 allow_unsigned_development_override，对未签名插件仅返回 trust_decision='development_unsigned_override' 的元数据，不再做完整性核验或二次确认。若该配置被带入插件目录对低信任用户可写的部署，未签名（可能为恶意）的插件代码会被加载并以节点进程权限执行，造成任意代码执行。\n修复版本中通过在 allow_unsigned_development_override 起始处读取 settings.plugin_unsigned_ack 并要求其等于字面量 'i-understand-plugins-are-unsigned'（node/src/stigmem_node/settings.py 同步新增 plugin_unsigned_ack 字段），STIGMEM_PLUGIN_SIGNING_REQUIRED 与 STIGMEM_PLUGIN_UNSIGNED_ACK 双确认不齐备时抛出 RuntimeError 拒绝启动，从而阻断未签名插件的静默加载。", "effects": [{"comp_name": "stigmem-node", "ecosystem": "pip", "versions": [{"affected_version": "[0.9.0a1,0.9.0a2)", "min_fixed_version": "0.9.0a2", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "下载代码缺少完整性检查", "kind_en": "不进行完整性检查的代码下载", "last_modified_time": "2026-08-19", "level": "High", "mps_id": "MPS-acoz-x0jf", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-acoz-x0jf", "name": "https://www.oscs1024.com/hd/MPS-acoz-x0jf"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-76241", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-76241"}, {"url": "https://github.com/eidetic-labs/stigmem/security/advisories/GHSA-w7pm-9g55-mxfm", "name": ""}, {"url": "https://www.vulncheck.com/advisories/stigmem-plugin-signature-enforcement-bypass-via-configuration", "name": ""}], "scope_influence": "", "tags": ["python", "开源"], "title": "stigmem 插件签名强制绕过", "_translated": true, "_saved_at": "2026-08-19T15:24:39+00:00", "_first_saved_at": "2026-08-19T15:24:39+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-acoz-x0jf"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "cnvd_id": "", "cve_id": "CVE-2026-75857", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:L/AC:H/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7}], "cvssv4": [{" nalysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-73933", "cvss": {"cvssv31": [{"source": "secalert_us@oracle.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:L/A:L", "severity": "high", "base_score": 7.3}]}, "cvss_score": 7.3, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:L/A:L", "cwe": "", "description": "Oracle Fusion Middleware 的 Helidon 产品（组件：Imperative Web Server）中存在漏洞。   受影响的支持版本是 4.5.3。易于利用的漏洞允许未经身份验证的攻击者通过 HTTP 进行网络访问来危害 Helidon。  成功攻击此漏洞可能会导致对某些 Helidon 可访问数据进行未经授权的更新、插入或删除访问，以及对 Helidon 可访问数据的子集进行未经授权的读取访问，并导致 Helidon 的部分拒绝服务（部分 DOS）。 CVSS 3.1 基本分数 7.3（机密性、完整性和可用性影响）。  CVSS 矢量：（CVSS：3.1/AV：N/AC：L/PR：N/UI：N/S：U/C：L/I：L/A：L）。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "", "kind_en": "", "last_modified_time": "2026-08-19", "level": "High", "mps_id": "MPS-htso-zjnw", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-htso-zjnw", "name": "https://www.oscs1024.com/hd/MPS-htso-zjnw"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73933", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73933"}, {"url": "https://www.oracle.com/security-alerts/cspuaug2026.html", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-73933漏洞", "_translated": true, "_saved_at": "2026-08-18T22:16:47+00:00", "_first_saved_at": "2026-08-18T22:16:47+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-htso-zjnw"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-76238", "cvss": {"cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:L/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:L/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-863", "description": "stigmem 是 eidetic-labs 维护的开源 Python 持久记忆图谱组件，其中 stigmem-node 提供 HTTP API、内置 federation 与可选的多租户扩展 stigmem-plugin-multi-tenant。\n受影响版本中，POST /v1/decay/sweep 路由在处理衰减扫描请求时未把调用者的 tenant_id 透传到 SQL 候选查询与异步任务执行链路，lifecycle.decay 中 _select_ttl_candidates 与 _select_confidence_candidates 的 SELECT 语句均缺少 tenant_id 谓词，导致持有单租户 write 凭据的攻击者提交的 POST 请求会以 ttl_seconds=0 把所有租户的事实记录批量过期（跨租户数据销毁），或通过 dry_run 拿到跨租户的事实计数与存在性信息（跨租户信息泄露 oracle）。\n修复版本中通过在 _select_ttl_candidates、_select_confidence_candidates 与 run_decay_sweep 中新增 AND f.tenant_id = ? 谓词，并把 identity.tenant_id 显式透传到 HTTP 路由 decay_sweep、_decay_job_worker 与 create_job 调用中，使单租户 sweep 不再跨租户生效，dry_run 仅返回调用者自己租户的候选计数。", "effects": [{"comp_name": "stigmem-node", "ecosystem": "pip", "versions": [{"affected_version": "(-∞,0.9.0a12)", "min_fixed_version": "0.9.0a12", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-08-19", "level": "High", "mps_id": "MPS-05r7-hufc", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-05r7-hufc", "name": "https://www.oscs1024.com/hd/MPS-05r7-hufc"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-76238", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-76238"}, {"url": "https://github.com/eidetic-labs/stigmem/security/advisories/GHSA-6gqw-jqv7-v88m", "name": ""}, {"url": "https://www.vulncheck.com/advisories/stigmem-before-0a12-cross-tenant-bola-via-decay-sweep", "name": ""}], "scope_influence": "", "tags": ["python", "开源"], "title": "stigmem跨租户衰减扫描BOLA漏洞", "_translated": true, "_saved_at": "2026-08-19T15:24:40+00:00", "_first_saved_at": "2026-08-19T15:24:40+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-05r7-hufc"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-15780", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "cwe": "CWE-79", "description": "由于输入清理和输出转义不足，WP Statistics – 简单、隐私友好的 WordPress Google Analytics 替代插件很容易通过 'utm_campaign' 参数在 14.16.8 及之前的所有版本中受到存储跨站脚本攻击。这使得未经身份验证的攻击者可以在页面中注入任意 Web 脚本，每当用户访问注入的页面时就会执行这些脚本。可以通过公共 /wp-statistics/v2/hit REST 端点在无需身份验证的情况下植入有效负载，因为所需的签名在公共主页上公开，并且 Base64 编码的 page_uri POST 参数会覆盖之前清理的 REQUEST_URI，从而允许恶意 utm_campaign 值绕过清理并存储在数据库中。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-08-19", "level": "High", "mps_id": "MPS-1bjc-tgfe", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-1bjc-tgfe", "name": "https://www.oscs1024.com/hd/MPS-1bjc-tgfe"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-15780", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-15780"}, {"url": "https://github.com/wp-statistics/wp-statistics/commit/6ab74427778b89c9e88471e9dd7407d9055a9b34", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/wp-statistics/tags/14.16.7/assets/dev/javascript/helper.js#L267", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/wp-statis 32:47+00:00", "_first_saved_at": "2026-08-19T07:32:47+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-4ndg-78uz"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-75981", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "cwe": "CWE-79", "description": "TranslatePress – 使用适用于 WordPress 22:48+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-mk2z-rdh6"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-76245", "cvss": {"cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-345", "description": "stigmem 是开源联邦记忆与图谱基础设施，其 Python 参考节点以 pip 包 stigmem-node 发布，用于在多节点之间按 Ed25519 签名的短效 JWT 对等令牌（peer token）完成机器到机器的联邦认证与拉/推复制。\n受影响版本中，节点对外提供联邦 HTTP 入口（POST/GET /v1/federation/facts 等），远端节点在请求头中携带对等令牌后由 stigmem_node/peer_token.py 的 verify_peer_token 执行校验。该函数以毫秒为单位读取当前时间（now_ms = int(time.time() * 1000)）并直接以 now_ms \u003e exp 判断过期，没有任何 leeway 余量；同时该函数也缺少对 iat、nbf 的合法性校验以及 iss 与数据库注册节点身份的绑定比较。其结果是跨节点的联邦对等令牌在存在正常时钟漂移、网络抖动或毫秒级边界的情况下，会被错误判定为 token_expired，联邦拉/推复制与对等认证流不可用。\n修复版本中通过在 node/src/stigmem_node/federation/peer_token.py 的 verify_peer_token 中引入 leeway_ms = settings.peer_token_leeway_s * 1000，将比较改为 now_ms \u003e exp + leeway_ms，并新增对 iss 与数据库 peer 行 node_id 的一致性比较、iat 不能在未来或过老、nbf 不能在未来以及 nonce 过期时间改为 max(exp, now_ms + window_ms) 等校验，使联邦对等令牌回到规范要求的 canonical millisecond-based 验证路径并覆盖回归测试。", "effects": [{"comp_name": "stigmem-node", "ecosystem": "pip", "versions": [{"affected_version": "[0.9.0a1,0.9.0a2)", "min_fixed_version": "0.9.0a2", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "对数据真实性的验证不充分", "kind_en": "数据真实性验证不足", "last_modified_time": "2026-08-19", "level": "High", "mps_id": "MPS-t8bg-au52", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-t8bg-au52", "name": "https://www.oscs1024.com/hd/MPS-t8bg-au52"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-76245", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-76245"}, {"url": "https://github.com/eidetic-labs/stigmem/security/advisories/GHSA-xh5j-xjfq-qvvx", "name": ""}, {"url": "https://www.vulncheck.com/advisories/stigmem-federation-peer-token-timestamp-validation-bypass", "name": ""}], "scope_influence": "", "tags": ["python", "开源"], "title": "stigmem-node联邦对等令牌时间戳校验绕过漏洞", "_translated": true, "_saved_at": "2026-08-19T15:24:45+00:00", "_first_saved_at": "2026-08-19T15:24:45+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-t8bg-au52"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-74038", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:N/I:L/A:H", "severity": "high", "base_score": 7.1}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:A/VC:N/VI:L/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7}]}, "cvss_score": 7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:A/VC:N/VI:L/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-22", "description": "Wazuh 是一款开源的主机入侵检测与日志监控平台，wazuh-manager 是其服务端守护进程，提供 Agent 注册、密钥管理与远程通信等能力。\n受影响版本中，wazuh-manager 的 Agent 注册监听端口在收到客户端发来的 OSSEC A:'\u003cname\u003e' 注册请求后，会先调用 src/addagent/validate.c 中的 OS_IsValidName 对 \u003cname\u003e 进行合法性校验。原始实现仅校验长度和字符集，未拒绝以点开头的名字，因此攻击者只需以 .. 等点序列作为 Agent 名称在注册端口发起一次注册请求，即可绕过校验通过。注册成功后，Manager 在执行队列差异清理时通过 delete_diff 等路径拼接把 Agent 名称作为目录名拼接到队列根目录之后；由于 .. 会解析到上级目录，原本应限定在 queue/\u003cagent\u003e/ 下的递归删除跨越到上级 queue 目录，将其下的全部子目录一并删除，导致所有依赖该队列的 Wazuh 服务停止，需要手工恢复。\n修复版本中通过在 src/addagent/validate.c 的 OS_IsValidName 中新增 u_name[0] == '.' 的前缀判断，从源头拒绝以点开头的 Agent 名称，恶意注册请求在第一阶段校验即被拒绝；并新增 src/unit_tests/addagent/test_validate.c 单元测试覆盖 .、..、.hidden 等点序列用例，确保后续不会再回退。", "effects": [{"comp_name": "wazuh-manager", "ecosystem": "linux", "versions": [{"affected_version": "[4.0.0,4.14.6)", "min_fixed_version": "4.14.6", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-08-19", "level": "High", "mps_id": "MPS-74xo-d3s6", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-74xo-d3s6", "name": "https://www.oscs1024.com/hd/MPS-74xo-d3s6"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-74038", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-74038"}, {"url": "https://github.com/wazuh/wazuh/pull/35833", "name": ""}, {"url": "https://github.com/wazuh/wazuh/security/advisories/GHSA-573w-mqw4-jvmr", "name": ""}, {"url": "https://www.vulncheck.com/a vss_score": 7, "cvss_vector": "", "cwe": "CWE-787", "description": "FreeBSD 是开源类 Unix 操作系统，内核提供 System V 信号量作为进程间同步机制，semctl(2) 用于对信号量集执行 GETALL、SETALL 等控制操作。\n受影响版本中，kern_semctl 处理 GETALL 与 SETALL 时先记录目标集合的 sem_nsems，再释放保护锁并按该计数分配内核堆缓冲区，随后重新加锁。复检依赖信号量集序号，而该序号在 0x8000 次创建或销毁后回绕。另一进程在同一索引上快速销毁并重建不同大小的信号量集后，校验会被绕过，后续拷贝在内核堆上越界读写，未特权本地用户可提升权限。\n修复版本中通过在分配缓冲区前后调用 semvalid() 校验集合，并在重新加锁后比较快照计数与当前 sem_nsems，不一致时返回 EAGAIN 并中止拷贝，切断序号回绕后的越界访问。", "effects": [{"comp_name": "freebsd", "ecosystem": "linux", "versions": [{"affected_version": "[15.1-RELEASE,15.1-RELEASE-p2)", "min_fixed_version": "15.1-RELEASE-p2", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[15.0-RELEASE,15.0-RELEASE-p12)", "min_fixed_version": "15.0-RELEASE-p12", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[14.4-RELEASE,14.4-RELEASE-p8)", "min_fixed_version": "14.4-RELEASE-p8", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-08-19", "level": "High", "mps_id": "MPS-bcnk-sd68", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-bcnk-sd68", "name": "https://www.oscs1024.com/hd/MPS-bcnk-sd68"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-58087", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-58087"}, {"url": "https://security.freebsd.org/advisories/FreeBSD-SA-26:54.sysvsem.asc", "name": ""}], "scope_influence": "", "tags": [], "title": "FreeBSD semctl堆越界漏洞", "_translated": true, "_saved_at": "2026-08-19T09:26:47+00:00", "_first_saved_at": "2026-08-19T09:26:47+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-bcnk-sd68"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2025-30156", "cvss": {}, "cvss_score": 8.9, "cvss_vector": "", "cwe": "CWE-327", "description": "Ceph 是开源分布式存储系统，CephX 是其默认认证协议，用于在 Monitor、OSD、MDS 与 MGR 之间签发并校验服务票据。\n受影响版本中，CephX 用 AES-128-CBC 加密票据却不附加 HMAC，并且固定使用硬编码初始化向量 CEPH_AES_IV（值为 cephsageyudagreg）。相同明文会得到相同密文。持有低权限 CephX 凭据的攻击者可向 Monitor 申请服务票据，对密文做比特翻转以将 AuthCapsInfo.allow_all 改为真，或利用 Monitor 把指定实体名加密成密文块后拼接高权限票据，从而冒充 OSD、MDS、MGR 并扩大集群权限。\n修复版本中通过新增 AES256-CTS-HMAC-SHA384-192（aes256k）密钥类型替换默认 aes 算法，每次加密加入随机 confounder 并用 HMAC-SHA384 校验完整性，密文被篡改后无法通过校验，票据伪造路径被切断。", "effects": [{"comp_name": "ceph", "ecosystem": "linux", "versions": [{"affected_version": "[20.0.0,20.2.4)", "min_fixed_version": "20.2.4", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,19.2.6)", "min_fixed_version": "19.2.6", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "密码算法不安全", "kind_en": "使用损坏或有风险的加密算法", "last_modified_time": "2026-08-20", "level": "High", "mps_id": "MPS-f3ae-72a8", "poc": false, "poc_url": [], "published_time": "2026-08-20", "reference_url_list": [{"url": "https://www.openwall.com/lists/oss-security/2026/08/19/4", "name": ""}, {"url": "https://github.com/ceph/ceph/security/advisories/GHSA-7q3q-3975-qw3q", "name": ""}, {"url": "https://docs.ceph.com/en/latest/security/CVE-2025-30156/", "name": ""}, {"url": "https://github.com/ceph/ceph/releases/tag/v20.2.4", "name": ""}, {"url": "https://github.com/ceph/ceph/releases/tag/v19.2.6", "name": ""}, {"url": "https://github.com/ceph/ceph/commit/3078188a7bdd89e2975280f2a906c71c2f6effd6", "name": ""}, {"url": "https://github.com/ceph/ceph/commit/4f130132f5c5e99099b4d61cb9316eabcbbeb044", "name": ""}, {"url": "https://docs.ceph.com/en/latest/rados/configuration/auth-config-ref/#cephx-upgrade", "name": ""}, {"url": "https://web.mit.edu/tlyu/papers/krb4peril-ndss04.pdf", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "CephX认证绕过漏洞", "_translated": true, "_saved_at": "2026-08-19T19:19:46+00:00", "_first_saved_at": "2026-08-19T19:19:46+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-f3ae-72a8"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-62666", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-862", "description": "Grav API 插件是开源 PHP 组件，以 Composer 包 getgrav/grav-plugin-api 分发，为 Grav CMS 提供 RESTful 接口，允许以无头方式访问站点全部内容。\n受影响版本中，UsersController 的 createApiKey、generate2fa 与 disable2fa 三个面向用户变更的兄弟接口缺少 accessGrantsSuper() 目标校验，调用方仅需通过 requireApiKeyPermission() 或 requirePermission('api.users.write') 校验自身权限即可对持有 access.api.super 的目标账户执行 API key 颁发或 2FA 轮换/禁用。持有 api.users.write 的非超级管理员账户因此可借 createApiKey 把 API key 绑定到超级管理员目标，由于 key 的 scopes 未被强制，最新颁发的 key 实际携带目标账户完整权限，攻击者可借此获得持久化的超级管理员访问；同一缺失的检查还允许其轮换或禁用目标账户的两步验证。\n修复版本中通过在 UsersController 中新增 requireNotSuperTarget() 私有方法，并在 createApiKey、deleteApiKey、generate2fa、disable2fa 入口前置调用，恢复与 create/update/delete 主入口一致的超级管理员目标访问控制：当调用方不是超级管理员而目标账户持有超级权限时抛出 ForbiddenException，自助操作始终放行，从根本上切断非超级账户通过兄弟接口对超级管理员账户提权的路径。", "effects": [{"comp_name": "getgrav/grav-plugin-api", "ecosystem": "composer", "versions": [{"affected_version": "(-∞,1.0.6)", "min_fixed_version": "1.0.6", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-08-20", "level": "High", "mps_id": "MPS-vuo3-kbzi", "poc": false, "poc_url": [], "published_time": "2026-08-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-vuo3-kbzi", "name": "https://www.oscs1024.com/hd/MPS-vuo3-kbzi"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-62666", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-62666"}, {"url": "https://github.com/getgrav/grav-plugin-api/commit/dfcc947f0d6758772caac290c68fe8d4c4a4874e", "name": ""}, {"url": "https://github.com/getgrav/grav-plugin-api/releases/tag/1.0.6", "name": ""}, {"url": "https://github.com/getgrav/grav/security/advisories/GHSA-8gg4-rvvv-cq96", "name": ""}], "scope_influence": "", "tags": ["php", "开源"], "title": "Grav API 插件权限提升漏洞", "_translated": true, "_saved_at": "2026-08-19T17:21:20+00:00", "_first_saved_at": "2026-08-19T17:21:20+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-vuo3-kbzi"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-14952", "cvss": {"cvssv31": [{"source": "info@cert.vde.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "high", "base_score": 7.5}], "cvssv4": [{"source": "info@cert.vde.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_sco A:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-532", "description": "Frauscher Diagnostic System FDS102 是 Frauscher Sensortechnik GmbH 的商业诊断软件，用于 FAdC/FAdCi R2 轴计数与轨道占用检测系统的状态诊断和维护，通过 Web 界面提供运维能力，不对外开放源码。\n受影响版本中，FDS102 Web 界面会将已认证用户的明文会话标识写入错误日志，低权限远程攻击者可下载错误日志归档并从中提取仍有效的会话标识，从而在不知道管理员口令的情况下劫持正在使用的管理会话。\n修复版本中通过官方安全更新消除错误日志归档中的明文会话标识泄露，使低权限用户无法再据此劫持管理会话；公开资料未披露更细粒度的源码修改。", "effects": [{"comp_name": "fds_102", "ecosystem": "linux", "versions": [{"affected_version": "[2.13.0,2.14.0)", "min_fixed_version": "2.14.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "日志敏感信息泄露", "kind_en": "将敏感信息插入日志文件", "last_modified_time": "2026-08-20", "level": "High", "mps_id": "MPS-e6cq-i5dp", "poc": false, "poc_url": [], "published_time": "2026-08-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-e6cq-i5dp", "name": "https://www.oscs1024.com/hd/MPS-e6cq-i5dp"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-14948", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-14948"}, {"url": "https://www.certvde.com/en/advisories/VDE-2026-078/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "FDS102日志会话劫持", "_translated": true, "_saved_at": "2026-08-20T11:20:31+00:00", "_first_saved_at": "2026-08-20T10:23:03+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-e6cq-i5dp"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-77080", "cvss": {"cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-78", "description": "n8n 是开源的工作流自动化平台，使用 TypeScript 实现，提供可视化节点编辑器与 Snowflake 等大量内置节点；Snowflake 节点直接调用 snowflake-sdk 执行用户填写的 SQL。\n受影响版本中，Snowflake 节点的 Execute Query 操作将用户在节点参数里填写的完整 SQL 文本直接透传给 snowflake-sdk 的 connection.execute 方法，未对 SQL 类型做任何过滤；由于 snowflake-sdk 接受 PUT/GET 文件传输语句并由其内置客户端读取或写入 n8n 进程所在主机上的任意路径，绕过 n8n 自身的文件访问限制，导致已认证用户只要配置了可用的 Snowflake 凭据，就能利用 GET 读取 n8n 主机的本地文件，或利用 PUT 把本地已 staged 的文件覆盖到 n8n 主机上的任意路径。\n修复版本中通过在 GenericFunctions.ts 中新增 stripLeadingComments 与 isFileTransferQuery 工具，并在 execute 函数入口判断 sqlText 是否以 GET 或 PUT 开头；若命中文件传输语句，立即抛出 NodeOperationError 中断执行，从而阻止客户端 PUT/GET 命令进入 snowflake-sdk 的 connection.execute 调用。", "effects": [{"comp_name": "n8n", "ecosystem": "npm", "versions": [{"affected_version": "[0,1.123.69)", "min_fixed_version": "1.123.69", "repository": "npm", "solutions": [], "upstream": true}, {"affected_version": "[2.0.0,2.33.4)", "min_fixed_version": "2.33.4", "repository": "npm", "solutions": [], "upstream": true}, {"affected_version": "[2.34.0,2.34.1)", "min_fixed_version": "2.34.1", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-08-20", "level": "High", "mps_id": "MPS-l2o8-qyn6", "poc": false, "poc_url": [], "published_time": "2026-08-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-l2o8-qyn6", "name": "https://www.oscs1024.com/hd/MPS-l2o8-qyn6"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-77080", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-77080"}, {"url": "https://github.com/n8n-io/n8n/security/advisories/GHSA-r4j2-j3wm-q689", "name": ""}, {"url": "https://www.vulncheck.com/advisories/n8n-before-arbitrary-file-read-and-write-via-snowflake", "name": ""}], "scope_influence": "", "tags": ["npm", "开源"], "title": "n8n Snowflake 节点任意文件读写漏洞", "_translated": true, "_saved_at": "2026-08-20T13:40:45+00:00", "_first_saved_at": "2026-08-20T12:34:55+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-l2o8-qyn6"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-75596", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-407", "description": "Netty 是一个异步、事件驱动的网络应用框架。在 4.1.137.Final 和 4.2.17.Final 之前，默认的 io.netty.handler.ssl.SniHandler 构造函数使用 io.netty.handler.ssl.SslClientHelloHandler#decode 处的 handler/src/main/java/io/netty/handler/ssl/SslClientHelloHandler.java 中的握手前 ClientHello 聚合路径，其中handshakeBuffer.clear() 和 writeBytes() 为每个附加 TLS 记录重新复制所有先前接收到的正文字节。未经身份验证的远程对等方可以通告大型 ClientHello 并以数千个微小记录的形式传递其主体，从而在 TLS 握手完成之前导致事件循环上的 CPU 工作量增加，并降低其他客户端的 TLS 处理能力。此问题已在版本 4.1.137.Final 和 4.2.17.Final 中修复。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "低效算法复杂性", "kind_en": "低效的算法复杂性", "last_modified_time": "2026-08-20", "level": "High", "mps_id": "MPS-pzcu-1tyq", "poc": false, "poc_url": [], "published_time": "2026-08-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-pzcu-1tyq", "name": "https://www.oscs1024.com/hd/MPS-pzcu-1tyq"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-75596", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-75596"}, {"url": "https://github.com/netty/netty/commit/1b5abc6443b63726c72cdd285af2feb7ddbb8ff7", "name": ""}, {"url": "https://github.com/netty/netty/commit/9e0519239108a69b7e9bbc5e9182ee139a0d7961", "name": ""}, {"url": "https://github.com/netty/netty/pull/17213", "name": ""}, {"url": "https://github.com/netty/netty/pull/17217", "name": ""}, {"url": "https://github.com/netty/netty/releases/tag/netty-4.1.137.Final", "name": ""}, {"url": "https://github.com/netty/netty/releases/tag/netty-4.2.17.Final", "name": ""}, {"url": "https://github.com/netty/netty/security/advisories/GHSA-fccg-mwvh-qqg4", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-75596漏洞", "_translated": true, "_saved_at": "2026-08-19T22:18:26+00:00", "_first_saved_at": "2026-08-19T22:18:26+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-pzcu-1tyq"}, {"analysis_status": 0, "articles": [{"content": "应用程序在处理用户输入时的不完善或缺乏验证机制，所以攻击者能够通过向应用程序发送恶意输入，利用应用程序对输入数据的错误处理方式来注入自己的恶意代码。这些恶意代码会被应用程序误认为是合法的指令或数据，并在执行过程中被执行。", "title": "什么是代码注入"}, {"content": "应用程序使用可执行动态代码的函数来执行用户可控的参数，当应用程序对于用户输入过滤不完全时，攻击者可以注入恶意代码并控制代码执行流程。", "title": "代码注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对所有用户输入进行验证和过滤，确保只接受预期的有效输入。这包括对输入数据进行输入长度验证、类型检查和格式验证等。\r\n- 使用参数化查询或预编译语句：对于数据库查询操作，应该使用参数化查询或预编译语句，确保输入数据不会被误认为是执行代码。\r\n- 最小特权原则：应用程序在执行操作系统命令或动态代码时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。\r\n- 安全编码实践：开发人员应该采用安全编码实践，包括避免使用eval函数、避免拼接用户输入的字符串作为代码执行等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止代码注入攻击。", "title": "如何预防代码注入"}], "cnvd_id": "", "cve_id": "CVE-2026-64850", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-94", "description": "Grav 是基于文件的开源 Web 平台，使用 PHP、Markdown、Twig 与 Symfony 构建页面与表单。\n受影响版本中，system/src/Grav/Common/Data/Blueprint.php 中的 Blueprint::dynamicData() 在处理表单字段元数据时，把读取到的 Class::method 提供器连同参数一并送入 call_user_func_array()，未对回调与参数做任何危险函数过滤。持有 admin.pages 或 api.pages.write 权限的账户可以在页面 frontmatter 的 data-*@ 指令里写入形式上像正常 helper 的提供器，例如将 Grav\\Common\\Utils::arrayFilterRecursive 的第一个参数固定为字符串 'system'，再让页面在被访问时由 dynamicData() 经 call_user_func_array 触发 system() 执行任意命令，从而以 Web 服务器用户身份实现远程代码执行。\n修复版本中通过 Blueprint::dynamicData() 在调用 call_user_func_array 之前先执行 isSafeDynamicCall() 与 paramsContainDangerousCallable() 两层校验，既拒绝作为顶层提供器传入的 system、exec、passthru 等危险函数，也递归扫描所有参数，杜绝以 arrayFilterRecursive 一类安全 helper 作为 trampoline 把 'system' 字符串走私进回调的风险，从而切断由此触发的远程命令执行路径。", "effects": [{"comp_name": "getgrav/grav", "ecosystem": "composer", "versions": [{"affected_version": "(-∞,2.0.7)", "min_fixed_version": "2.0.7", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "代码注入", "kind_en": "代码生成控制不当（“代码注入”）", "last_modified_time": "2026-08-20", "level": "High", "mps_id": "MPS-wkfe-dr6u", "poc": false, "poc_url": [], "published_time": "2026-08-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-wkfe-dr6u", "name": "https://www.oscs1024.com/hd/MPS-wkfe-dr6u"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-64850", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-64850"}, {"url": "https://github.com/getgrav/grav/commit/acffa34cbb0787fee87c609e0d6289e904fee33c", "name": ""}, {"url": "https://github.com/getgrav/grav/releases/tag/2.0.7", "name": ""}, {"url": "https://github.com/getgrav/grav/security/advisories/GHSA-fj2p-qj2f-74v5", "name": ""}], "scope_influence": "", "tags": ["php", "开源"], "title": "Grav CMS Blueprint dynamicData 代码注入漏洞", "_translated": true, "_saved_at": "2026-08-19T17:21:13+00:00", "_first_saved_at": "2026-08-19T17:21:13+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-wkfe-dr6u"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-64852", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-862", "description": "Grav API 插件（getgrav/grav-plugin-api）是 Grav CMS 的开源 PHP 插件，以 Composer 包形式分发，为站点内容提供完整的 headless RESTful API 接入能力。\n受影响版本中，插件在用户/plugins/api/api.php 拦截 admin 任务 apiKeyGenerate 与 apiKeyRevoke，仅以 admin.login 这一所有面板用户都具备的基线权限校验调用方，却直接读取路由中的目标账户名，调用 handleApiKeyGenerate 或 handleApiKeyRevoke 生成绑定到目标账户的持久 ApiKeyManager 凭证，因此继承目标账户的全部 API 权限（包括 api.super 等）。具备 admin.login 的基础面板用户即可为任意账户签发或撤销持久 API 密钥，从而触发账户接管与权限提升。\n修复版本中通过在 handleAdminApiKeyTask 中调用新增的 authorizeApiKeyTarget($current) 完成目标账户授权：管理自身账户密钥始终允许，操作其他账户则需 admin.users 或 admin.super，且只有超级管理员才能针对超级管理员账户执行；handleApiKeyGenerate 与 handleApiKeyRevoke 保持原签名，仅依赖前序授权结果切断越权签发路径。", "effects": [{"comp_name": "getgrav/grav-plugin-api", "ecosystem": "composer", "versions": [{"affected_version": "(-∞,1.0.8)", "min_fixed_version": "1.0.8", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-08-20", "level": "High", "mps_id": "MPS-zf3k-j0ng", "poc": false, "poc_url": [], "published_time": "2026-08-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-zf3k-j0ng", "name": "https://www.oscs1024.com/hd/MPS-zf3k-j0ng"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-64852", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-64852"}, {"url": "https://github.com/getgrav/grav-plugin-api/commit/ed16f0aaa9b398c6f179fb8f51e0fa53e4ed8a30", "name": ""}, {"url": "https://github.com/getgrav/grav-plugin-api/releases/tag/1.0.8", "name": ""}, {"url": "https://github.com/getgrav/grav/security/advisories/GHSA-7v74-m76q-8wf3", "name": ""}], "scope_influence": "", "tags": ["php", "开源"], "title": "Grav API插件API密钥授权绕过漏洞", "_translated": true, "_saved_at": "2026-08-19T17:21:11+00:00", "_first_saved_at": "2026-08-19T17:21:11+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-zf3k-j0ng"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-63037", "cvss": {}, "cvss_score": 8.6, "cvss_vector": "", "cwe": "CWE-89", "description": "Apache InLong 是 Apache 软件基金会的开源一站式海量数据集成框架，用于提供自动、安全、可靠的数据传输能力，其中 Manager 负责集群与审计告警等配置管理。\n受影响版本中，Manager OpenAPI 审计告警规则列表接口 OpenAuditAlertRuleController.selectByCondition 接收 AuditAlertRulePageRequest 后，未对 orderField、orderType 做枚举校验便进入查询链路。AuditAlertRuleEntityMapper.xml 的 selectByCondition 将这两个字段以 MyBatis `${request.orderField} ${request.orderType}` 直接拼入 ORDER BY，且默认配置 openapi.auth.enabled 为 false，未认证攻击者能够向 Manager 后端数据库注入 SQL。\n修复版本中通过在 AuditAlertRuleServiceImpl.selectByCondition 访问数据库前调用 OrderFieldEnum.checkOrderField 与 OrderTypeEnum.checkOrderType，仅允许 create_time、modify_time 与 asc、desc，非法输入回退为默认排序，从而切断 ORDER BY 注入。", "effects": [{"comp_name": "inlong", "ecosystem": "linux", "versions": [{"affected_version": "[2.0.0,2.4.0)", "min_fixed_version": "2.4.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "org.apache.inlong:manager-web", "ecosystem": "maven", "versions": [{"affected_version": "[2.0.0,2.4.0)", "min_fixed_version": "2.4.0", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-08-20", "level": "High", "mps_id": "MPS-2fb7-e4b7", "poc": false, "poc_url": [], "published_time": "2026-08-20", "reference_url_list": [{"url": "http://www.mail-archive.com/announce@apache.org/msg11738.html", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-63037", "name": ""}, {"url": "https://inlong.apache.org", "name": ""}, {"url": "https://inlong.apache.org/download/", "name": ""}, {"url": "https://github.com/apache/inlong/issues/12079", "name": ""}, {"url": "https://github.com/apache/inlong/pull/12080", "name": ""}, {"url": "https://github.com/apache/inlong/commit/f9b0c5d38eba6636721c7fa6c560e8e6664fab79", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "InLong Manager SQL注入", "_translated": true, "_saved_at": "2026-08-20T15:27:24+00:00", "_first_saved_at": "2026-08-20T15:27:24+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-2fb7-e4b7"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-76584", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:N/AC:L/Au:S/C:C/I:C/A:C", "severity": "high", "base_score": 9}], "cvssv31": [{"source": "cna@vuldb.com" , "name": ""}, {"url": "https://vuldb.com/cve/CVE-2026-76584", "name": ""}, {"url": "https://vuldb.com/submit/877793", "name": ""}, {"url": "https://vuldb.com/vuln/393043", "name": ""}, {"url": "https://vuldb.com/vuln/393043/cti", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "TV-IP751WIC栈溢出漏洞", "_translated": true, "_saved_at": "2026-08-19T23:17:30+00:00", "_first_saved_at": "2026-08-19T22:18:22+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-2rcu-ml4t"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "", "cvss": {"cvssv31": [{"source": "murphysec", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:N/A:N", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "", "cwe": "CWE-89", "description": "JeecgBoot 是开源 Java 低代码开发平台，基于 Spring Boot 与 Apache Shiro，提供代码生成、在线表单、数据字典和企业权限等能力。\n受影响版本中，ShiroConfig 将任意以 .js 结尾的 URL 配为 anon，而 Spring MVC 按路径变量匹配 /sys/dict/getDictItems/{dictCode}。未认证请求在该路径末尾附加 .js 后，JwtFilter 被跳过，请求仍进入 SysDictController.getDictItems。四段式 dictCode 的第四段作为 filterSql 传入 SysDictMapper.queryTableDictWithFilter，由 MyBatis ${filterSql} 直接拼入 WHERE。字典过滤器 specialFilterContentForDictSql 使用 Pattern.matches 且关键字带尾随空格，换行可绕过关键字与正则检测，形成未授权布尔盲注，可读取用户账号、口令哈希、手机号等数据。\n在官方修复发布前，可通过收窄 Shiro 静态资源匿名规则、拦截 /sys/dict/getDictItems 匿名访问，并对 filterSql 做空白归一化与参数化查询，切断认证绕过与 SQL 拼接链路。", "effects": [{"comp_name": "jeecgboot", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,3.9.3]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [{"description": "官方尚未发布修复版本。可在网关或 WAF 拦截 /sys/dict/getDictItems/* 的匿名访问；将 ShiroConfig 中 /**/*.js 等静态后缀匿名规则收窄为根路径 /*.js；对 filterSql 做空白归一化并改为参数化查询；同时更换出厂默认 jeecg.signatureSecret。", "type": "缓解措施"}], "upstream": true}]}, {"comp_name": "org.jeecgframework.boot3:jeecg-boot-base-core", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,3.9.3]", "min_fixed_version": "", "repository": "maven", "solutions": [], "upstream": true}]}, {"comp_name": "org.jeecgframework.boot3:jeecg-system-biz", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,3.9.3]", "min_fixed_version": "", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "极高", "fix_suggestion": "强烈建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-08-20", "level": "High", "mps_id": "MPS-5fth-jq8w", "poc": true, "poc_url": [], "published_time": "2026-08-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-5fth-jq8w", "name": "https://www.oscs1024.com/hd/MPS-5fth-jq8w"}, {"url": "https://github.com/jeecgboot/JeecgBoot/issues/9677", "name": ""}], "scope_influence": "广", "tags": ["java", "poc", "专家校准", "开源", "强烈建议修复"], "title": "JeecgBoot未授权SQL注入漏洞", "_translated": true, "_saved_at": "2026-08-20T11:20:26+00:00", "_first_saved_at": "2026-08-20T10:22:58+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-5fth-jq8w"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-75948", "cvss": {"cvssv4": [{"source": "security@joomla.org", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:P/VC:H/VI:H/VA:L/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:P/VC:H/VI:H/VA:L/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-79", "description": "iCagenda 是 JoomliC 开发的开源 Joomla 活动管理扩展（GNU GPL v3），用于在站点上创建、管理和展示活动日历。\n受影响版本中，前台 SubmitController::submit 接收 jform 的 image、file 字段后，S 明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-63039", "cvss": {}, "cvss_score": 8.6, "cvss_vector": "", "cwe": "CWE-89", "description": "Apache InLong 是开源的一站式海量数据集成框架，提供数据接入、同步与订阅能力，其中 Manager 对外提供审计告警规则管理接口。\n受影响版本中，AuditAlertRuleController 与 OpenAuditAlertRuleController 的 selectByCondition 接收 AuditAlertRulePageRequest 后，未校验 orderField 与 orderType，直接交给 AuditAlertRuleEntityMapper.selectByCondition；该语句在 ORDER BY 子句使用 MyBatis 美元符号插值 ${request.orderField} ${request.orderType}，攻击者可通过排序参数把任意 SQL 片段拼入查询。\n修复版本中通过在 AuditAlertRuleServiceImpl.selectByCondition 查询数据库前调用 OrderFieldEnum.checkOrderField 与 OrderTypeEnum.checkOrderType，将排序字段限制为 create_time 或 modify_time、排序方向限制为 asc 或 desc，非法输入被重置为默认值，阻断不可信字符串进入美元符号插值。", "effects": [{"comp_name": "inlong", "ecosystem": "linux", "versions": [{"affected_version": "[2.0.0,2.4.0)", "min_fixed_version": "2.4.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "org.apache.inlong:manager-web", "ecosystem": "maven", "versions": [{"affected_version": "[2.0.0,2.4.0)", "min_fixed_version": "2.4.0", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-08-20", "level": "High", "mps_id": "MPS-f1a8-7948", "poc": false, "poc_url": [], "published_time": "2026-08-20", "reference_url_list": [{"url": "http://www.mail-archive.com/announce@apache.org/msg11739.html", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-63039", "name": ""}, {"url": "https://inlong.apache.org", "name": ""}, {"url": "https://github.com/apache/inlong/pull/12080", "name": ""}, {"url": "https://github.com/apache/inlong/commit/e204cb1c1dd4f3f41817a89ab226c306be8ad145", "name": ""}, {"url": "htt tatus": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2025-14601", "cvss": {"cvssv4": [{"source": "vulnerability@kaspersky.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-676", "description": "vsDesk 是面向企业内部 IT 支持与客户服务的商业 on-premise Help Desk / Service Desk 软件，用于工单管理、服务流程自动化与资产台账，源码不对外公开。\n受影响版本中，任务调度器在处理具备管理权限的已认证用户输入时过滤不足，攻击者可将输入带入操作系统命令执行路径，从而干扰 Web 服务运行、暴露敏感数据或完全控制服务器。\n修复版本中通过厂商安全补丁修复任务调度器对管理员输入的处理，阻止不可信输入进入操作系统命令执行路径；公开资料未披露更细粒度的源码修改。", "effects": [{"comp_name": "vsDesk", "ecosystem": "linux", "versions": [{"affected_version": "[11.06.02,14.0101)", "min_fixed_version": "14.0101", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "潜在危险函数的使用", "kind_en": "使用潜在危险功能", "last_modified_time": "2026-08-20", "level": "High", "mps_id": "MPS-y7bz-p2gx", "poc": false, "poc_url": [], "published_time": "2026-08-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-y7bz-p2gx", "name": "https://www.oscs1024.com/hd/MPS-y7bz-p2gx"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2025-14601", "name": "https://nvd.nist.gov/vuln/detail/CVE-2025-14601"}, {"url": "https://github.com/klsecservices/Advisories/blob/master/KLSA-00343-vsDesk-Task-Scheduler-OS-Command-Injection.md", "name": ""}], "scope_influence": "", "tags": [], "title": "vsDesk任务调度命令注入", "_translated": true, "_saved_at": "2026-08-20T09:27:26+00:00", "_first_saved_at": "2026-08-20T09:27:26+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-y7bz-p2gx"}, {"analysis_status": 0, "articles": [{"content": "跨站点请求伪造 (CSRF)通过利用网站对用户请求的信任进行攻击。当用户在网站A登录并在同一浏览器会话中访问网站B时，攻击者可以构造特制的请求并诱使用户执行，以使网站B误以为这些请求是用户合法发起的。\n攻击者通常通过欺骗用户点击恶意链接、在受信任的网站中植入恶意代码或通过钓鱼等手段来实施CSRF攻击，一旦用户执行了恶意请求，攻击者可以以用户的身份执行任意操作，包括更改用户密码、发起资金转账或删除重要数据等。", "title": "什么是CSRF"}, {"content": "- 链接欺骗：攻击者通过向用户发送包含恶意链接的电子邮件或社交媒体消息，诱使用户点击并执行恶意请求。\n- 图片引用攻击：攻击者通过在恶意网站上包含指向目标网站的图片引用，以触发用户浏览器自动发送目标网站的请求。\n- XSS利用：如果目标网站存在XSS漏洞，攻击者可以注入恶意脚本，以使用户在浏览器中执行恶意请求。", "title": "CSRF常见的攻击方式"}, {"content": "- 随机令牌：网站可以在每个请求中包含一个随机生成的令牌（CSRF Token），并验证该令牌的有效性，以确认请求的来源是合法的。\n- SameSite Cookie：使用SameSite属性来限制跨站点请求，将Cookie的发送限制在同一站点上，减少了跨站请求伪造的风险。\n- 双重验证：对于敏感操作，网站可以要求用户进行额外的验证，例如输入验证码、提供第二个因素的身份验证等。\n- 强化浏览器策略：网站可以设置Content-Security-Policy（CSP）头，限制浏览器执行恶意脚本的能力，减少CSRF攻击的风险。\n- 限制用户操作：网站可以要求用户在执行敏感操作之前进行明确的确认或授权，防止恶意请求被误触发。\n- 安全编码实践：开发人员应遵循安全编码实践，对用户输入进行适当的验证和过滤，防止恶意请求的注入。", "title": "如何预防CSRF"}], "cnvd_id": "", "cve_id": "CVE-2026-14951", "cvss": {"cvssv31": [{"source": "info@cert.vde.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8}], "cvssv4": [{"source": "info@cert.vde.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-352", "description": "Frauscher Diagnostic System FDS102 是 Frauscher Sensortechnik 的商业铁路诊断系统，为 FAdC/FAdCi R2 计轴设备提供 Web 界面监测与管理能力。\n受影响版本中，FDS Web 界面缺少 CSRF 防护头，低权限远程攻击者可借助恶意网页促使已认证用户在其会话上下文中执行非预期操作，从而在受害者权限下完成未授权动作。\n修复版本中通过为 FDS Web 界面补齐 CSRF 防护头，阻止跨站请求借助已认证会话自动生效，切断恶意网页驱动非预期操作的利用链。", "effects": [{"comp_name": "fds102", "ecosystem": "linux", "versions": [{"affected_version": "[2.0.0,2.14.0)", "min_fixed_ SA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-80", "description": "CVAT (Computer Vision Annotation Tool) 是开源的计算机视觉视频与图像标注工具，cvat-ui 是基于 React 与 TypeScript 实现的前端组件库。\n受影响版本中，cvat-ui/src/audio/components/annotation-page/audio-workspace/top-bar/audio-right-group.tsx 在渲染音频任务标注指南时，将用户可控的指南 Markdown 直接传给 MDEditor 但未启用 rehype-sanitize 插件进行 HTML 净化。具备创建或编辑标注指南权限的用户可在指南中植入恶意脚本，当其他用户打开该指南时脚本会在浏览器中执行，并以受害者身份向 CVAT 发起任意请求，潜在读取或篡改受害者在 CVAT 中的数据。\n修复版本中通过为 MDEditor 启用 rehype-sanitize 插件对 Markdown 渲染结果进行清洗，切断恶意脚本注入路径，使渲染出的指南内容仅包含安全的 HTML 标签。", "effects": [{"comp_name": "cvat-ai/cvat", "ecosystem": "linux", "versions": [{"affected_version": "[2.68.0,2.70.0)", "min_fixed_version": "2.70.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "基本跨站脚本", "kind_en": "网页中与脚本相关的 HTML 标签的不正确中和（基本 XSS）", "last_modified_time": "2026-08-21", "level": "High", "mps_id": "MPS-4pox-gtv8", "poc": false, "poc_url": [], "published_time": "2026-08-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-4pox-gtv8", "name": "https://www.oscs1024.com/hd/MPS-4pox-gtv8"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73220", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73220"}, {"url": "https://github.com/cvat-ai/cvat/commit/33aaa1987ea89a4d229bf4c19fcbe6b04ed55b42", "name": ""}, {"url": "https://github.com/cvat-ai/cvat/pull/10893", "name": ""}, {"url": "https://github.com/cvat-ai/cvat/releases/tag/v2.70.0", "name": ""}, {"url": "https://github.com/cvat-ai/cvat/security/advisories/GHSA-chxx-45vm-qhc9", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "CVAT 音频任务标注指南存储型 XSS 漏洞", "_translated": true, "_saved_at": "2026-08-20T16:27:24+00:00", "_first_saved_at": "2026-08-20T16:27:24+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-4pox-gtv8"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-64851", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:P/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.5}]}, "cvss_score": 8.5, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:P/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-79", "description": "Grav Shortcode Core 是 Grav CMS 的开源短代码插件（PHP，MIT 许可），用于按 WordPress / BBCode 风格扩展页面内容。\n受影响版本中，shortcode 语法因不含字面量 `\u003c` 而能直接通过 Grav 的 Security::detectXss() 保存时 XSS 扫描；ColorShortcode、ColumnsShortcode、DetailsShortcode、DivShortcode、FigureShortcode、FontAwesomeShortcode、HShortcode、MarkShortcode、SafeEmailShortcode、SizeShortcode 与 SpanShortcode 等处理器在 init() 中注册的回调，会把 getParameter('color' / 'class' / 'id' / 'style' 等) 取得的参数直接拼到 HTML 属性中而不做转义。具有 admin.pages 权限的账户可以提交形如 [color color='x\" onmouseover=alert(1)']…[/color] 的内容，闭合生成属性并注入事件处理器，从而在访问者或登录管理员预览/打开该页面时执行脚本，可读取后台 nonce 并以其会话身份执行操作。\n修复版本中通过在 Grav\\Plugin\\Shortcodes\\Shortcode 基类新增 escAttr() 静态方法（对入参调用 htmlspecialchars(..., ENT_QUOTES, 'UTF-8')），并对所有参与 HTML 属性拼接的 shortcode 参数统一调用该方法进行编码，切断恶意参数闭合属性并注入事件处理器的路径。", "effects": [{"comp_name": "getgrav/grav-plugin-shortcode-core", "ecosystem": "composer", "versions": [{"affected_version": "(-∞,6.2.2)", "min_fixed_version": "6.2.2", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-08-20", "level": "High", "mps_id": "MPS-ahpd-t8fy", "poc": false, "poc_url": [], "published_time": "2026-08-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ahpd-t8fy", "name": "https://www.oscs1024.com/hd/MPS-ahpd-t8fy"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-64851", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-64851"}, {"url": "https://github.com/getgrav/grav-plugin-shortcode-core/commit/2a55eac8a2cc7f6c2d4923ab2fa7991039620597", "name": ""}, {"url": "https://github.com/getgrav/grav-plugin-shortcode-core/releases/tag/6.2.2", "name": ""}, {"url": "https://github.com/getgrav/grav/security/advisories/GHSA-q5fw-vpqc-fgph", "name": ""}], "scope_influence": "", "tags": ["php", "开源"], "title": "Gr r": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:N/VI:H/VA:N/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-863", "description": "Frauscher FDS102 是 Frauscher Sensortechnik GmbH 面向 FAdC/FAdCi R2 的商业诊断系统软件，用于铁路轮轴计数设备的诊断、监测与运维。\n受影响版本中，Web 接口 /api/user/add.php 暴露的用户创建功能未正确执行基于角色的访问控制。已持有低权限有效会话的远程攻击者可向该接口提交创建用户请求，并指定任意角色值，从而新建包含应用最高权限在内的账户。\n修复版本中通过厂商安全更新收紧用户创建接口的授权校验，阻止低权限会话再创建高权限账户；公开资料未披露更细粒度的源码修改。", "effects": [{"comp_name": "fds_102", "ecosystem": "linux", "versions": [{"affected_version": "[2.11.0,2.14.0)", "min_fixed_version": "2.14.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-08-20", "level": "High", "mps_id": "MPS-ds7u-f2vq", "poc": false, "poc_url": [], "published_time": "2026-08-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ds7u-f2vq", "name": "https://www.oscs1024.com/hd/MPS-ds7u-f2vq"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-14949", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-14949"}, {"url": "https://www.certvde.com/en/advisories/VDE-2026-078/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "FDS102越权创建账户", "_translated": true, "_saved_at": "2026-08-20T11:20:32+00:00", "_first_saved_at": "2026-08-20T10:23:04+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ds7u-f2vq"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-75142", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.5}]}, "cvss_score": 8.5, "cvss_vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-121", "description": "FFmpeg 是开源多媒体处理套件，提供命令行工具与 libavformat 等库，用于音视频解码、转码与封装。\n受影响版本中，MPEG-PS 复用器 libavformat/mpegenc.c 的 flush_packet() 使用固定 128 字节栈缓冲依次写入 pack header 与 system header。put_system_header() 按 12+3*N 字节为每路流写入系统头，但 PutBitContext 被设置成超过该栈缓冲剩余空间的长度，自身边界检查无法拦截。将含约 35 路及以上流的输入封装为 MPEG-PS 时，会触发栈缓冲区溢出。\n修复版本中通过在 mpeg_mux_init() 初始化阶段调用 get_system_header_size()，当系统头长度超过 128-14 字节时返回 EINVAL 并拒绝封装，阻断过量流配置进入固定栈缓冲写入路径。", "effects": [{"comp_name": "FFmpeg", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,9.0.1)", "min_fixed_version": "9.0.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "栈缓冲区溢出", "kind_en": "基于堆栈的缓冲区溢出", "last_modified_time": "2026-08-20", "level": "High", "mps_id": "MPS-lwd1-qf96", "poc": false, "poc_url": [], "published_time": "2026-08-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-lwd1-qf96", "name": "https://www.oscs1024.com/hd/MPS-lwd1-qf96"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-75142", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-75142"}, {"url": "https://code.ffmpeg.org/FFmpeg/FFmpeg/commit/9d786e4b5e9b8482651928574de33772aeee7be1", "name": ""}, {"url": "https://code.ffmpeg.org/FFmpeg/FFmpeg/pulls/24087", "name": ""}, {"url": "https://www.vulncheck.com/advisories/ffmpeg-stack-buffer-overflow-in-mpeg-ps-muxer-via-mpegenc-c", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "FFmpeg MPEG-PS栈溢出", "_translated": true, "_saved_at": "2026-08-19T19:19:50+00:00", "_first_saved_at": "2026-08-19T18:24:47+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-lwd1-qf96"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-75616", "cvss": {"cvssv4": [{"source": "f23511db-6c3e-4e32-a477-6aa17d310630", "vector": "CVSS:4.0/AV:A/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.5}]}, "cvss_score": 8.5, "cvss_vector": "CVSS:4.0/AV:A/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-78", "description": "TP-Link Archer C20 v6 是一款面向家庭与小微办公场景的双频无线路由器，由 TP-Link Systems Inc. 出厂销售，运行闭源 Linux 固件，设备内置基于 Web 的管理界面用于 WAN、LAN、无线及系统参数配置。\n受影响版本中，路由器 Web 管理界面在处理部分 WAN 相关配置操作时未对已认证管理员提交的请求字段进行充分校验与转义，参数被直接拼接到受影响的操作系统命令执行路径中，攻击者可在管理员权限上下文中注入额外的 shell 元字符与命令，从而以高权限在设备上执行任意系统命令并完全控制路由器，进而破坏流经设备的网络流量的机密性、完整性与可用性。\n修复版本中通过将 WAN 相关固件升级到 EU_0.9.1 Build 260811 或 US_0.9.1 Build 260812／RU_0.9.1 Build 260812，在 WAN 配置处理路径上对用户可控字段强化白名单校验与命令构造过滤，切断参数向底层 shell 拼接点的注入链路，阻止任意系统命令执行。", "effects": [ g VC-2堆溢出", "_translated": true, "_saved_at": "2026-08-19T19:19:49+00:00", "_first_saved_at": "2026-08-19T18:24:46+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-qhcu-f2ms"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-76833", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:N/UI:A/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.4}]}, "cvss_score": 8.4, "cvss_vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:N/UI:A/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-95", "description": "@cgauge/yaml 是开源 npm 包，基于 js-yaml 提供带额外 YAML 标签（如 !js、!include、!content、!env、!sub、!stringify、!querystring、!faker、!dynamodb）的 YAML 解析能力，遵循 LGPL-3.0 许可证。\n受影响版本中，yaml/src/parser.ts 内置的 jsType 标签将 kind: 'scalar' 的 !js YAML 标签注册到默认 schema，并在 construct 回调用 eval(data) 直接执行 YAML 文档中由攻击者控制的字符串值；该 schema 默认被 schema() 无条件组合进所有 load 调用，没有任何安全模式或可关闭开关。受影响版本下，任何解析不可信 YAML 输入的调用方都会在解析阶段无条件执行 JavaScript 字符串，攻击者可借此读取环境变量、访问文件系统、发起网络请求或派生子进程，拿到 Node.js 运行时下的全部权限。\n修复版本中通过在调用方侧避免直接解析不可信 YAML 输入，或在 jsType 中替换 eval 改为 Function 受控白名单 + 禁用 dynamic code execution 来切断恶意标签到任意代码执行的因果链；当前上游 0.27.0 仍未发布带修复的版本，建议临时改用支持安全 schema 的 js-yaml 替代并禁用 !js 标签。", "effects": [{"comp_name": "@cgauge/yaml", "ecosystem": "npm", "versions": [{"affected_version": "(-∞,0.27.0]", "min_fixed_version": "", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "eval注入", "kind_en": "动态评估代码中指令的不当中和（“评估注入”）", "last_modified_time": "2026-08-20", "level": "High", "mps_id": "MPS-7mcw-nlqi", "poc": false, "poc_url": [], "published_time": "2026-08-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-7mcw-nlqi", "name": "https://www.oscs1024.com/hd/MPS-7mcw-nlqi"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-76833", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-76833"}, {"url": "https://gist.github.com/arjunjaincs/35da3a80b4b16f324f194acec18489ba", "name": ""}, {"url": "https://github.com/cgauge/packages", "name": ""}, {"url": "https://www.vulncheck.com/advisories/cgauge-yaml-npm-package-arbitrary-code-execution-via-eval-yaml-tag", "name": ""}], "scope_influence": "", "tags": ["npm", "开源"], "title": "@cgauge/yaml eval注入漏洞", "_translated": true, "_saved_at": "2026-08-20T15:27:27+00:00", "_first_saved_at": "2026-08-20T15:27:27+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-7mcw-nlqi"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-77118", "cvss": {"cvssv4": [{"source": "22e2d327-25fe-45d7-9f0c-dcd23b7108df", "vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:N/UI:A/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.4}]}, "cvss_score": 8.4, "cvss_vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:N/UI:A/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-787", "description": "GraphicsMagick 是开源图像处理软件与库，提供 gm convert、gm identify 命令以及 libGraphicsMagick，用于读写和转换多种图像格式，其中包含 Kodak Photo CD（PCD/PCDS）解码器。\n受影响版本中，PCD 解码器在 ReadPCDImage 处理较高分辨率子图时调用 DecodeImage。Huffman 增量循环在每次解码后以 q++ 推进亮度与色度平面输出指针，且只在同步标记引入新平面或行时重置指针，同步标记之间的游程长度仅由输入决定。恶意 PCD 文件可将指针置于平面末尾附近并提供无同步标记的长增量序列，使指针越过按 number_pixels+1 精确分配的堆缓冲区并写入，造成堆内存破坏。\n修复版本中通过为各通道 Huffman 解码缓冲区超额分配，并在 DecodeImage 每次写入前用 plane_end 检查输出指针是否越界，一旦溢出即判定图像损坏并中止解码，切断无界 q++ 写越界链路。", "effects": [{"comp_name": "GraphicsMagick", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.3.48)", "min_fixed_version": "1.3.48", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "graphicsmagick", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.4+really1.3.48-1)", "min_fixed_version": "1.4+really1.3.48-1", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[1.0.0,1.3.48)", "min_fixed_version": "1.3.48", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-08-20", "level": "High", "mps_id": "MPS-bqrj-5zgo", "poc": false, "poc_url": [], "published_time": "2026-08-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-bqrj-5zgo", "name": "https://www.oscs1024.com/hd/MPS-bqrj-5zgo"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-77118", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-77118"}, {"url": "https://foss.heptapod.net/graphicsmagick/graphicsmagick/-/commit/937cdd9920bd96", "name": ""}, {"url": "https://foss.heptapod.net/graphicsmagick/graphicsmagick/-/raw/GraphicsMagick-1_3_48/ChangeLog", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "GraphicsMagick PCD越界写", "_translated": true, "_saved_at": "2026-08-20T14:29:21+00:00", "_first_saved_at": "2026-08-20T14:29:21+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-bqrj-5zgo"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-77072", "cvss": {"cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:A/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/
