滤：应用程序应该对所有用户输入进行验证和过滤，确保只接受预期的有效输入。这包括对输入数据进行输入长度验证、类型检查和格式验证等。\r\n- 使用参数化查询或预编译语句：对于数据库查询操作，应该使用参数化查询或预编译语句，确保输入数据不会被误认为是执行代码。\r\n- 最小特权原则：应用程序在执行操作系统命令或动态代码时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。\r\n- 安全编码实践：开发人员应该采用安全编码实践，包括避免使用eval函数、避免拼接用户输入的字符串作为代码执行等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止代码注入攻击。", "title": "如何预防代码注入"}], "cnvd_id": "", "cve_id": "CVE-2026-77075", "cvss": {"cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:A/VC:H/VI:H/VA:N/SC:L/SI:L/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.4}]}, "cvss_score": 8.4, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:A/VC:H/VI:H/VA:N/SC:L/SI:L/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-94", "description": "1.123.69 之前的 n8n、2.33.4 之前的 2.x 和 2.34.1 之前的 2.34.x 在资源定位器字段链接预览渲染中包含表达式注入漏洞。编辑器将字段的存储值直接拼接到节点类型的 URL 模板中，而不检查表达式语法。经过身份验证的成员可以存储恶意值，以便当另一个用户在编辑器中打开受影响的节点时，注入的表达式在受害者的经过身份验证的会话中被评估为 JavaScript（跨用户脚本执行）。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "代码注入", "kind_en": "代码生成控制不当（“代码注入”）", "last_modified_time": "2026-08-20", "level": "High", "mps_id": "MPS-yhxu-g1lf", "poc": false, "poc_url": [], "published_time": "2026-08-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-yhxu-g1lf", "name": "https://www.oscs1024.com/hd/MPS-yhxu-g1lf"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-77075", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-77075"}, {"url": "https://github.com/n8n-io/n8n/security/advisories/GHSA-fh4c-9rr2-p7qc", "name": ""}, {"url": "https://www.vulncheck.com/advisories/n8n-before-expression-injection-via-resource-locator", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-77075漏洞", "_translated": true, "_sav _security", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,8.6.1)", "min_fixed_version": "8.6.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "输入验证不恰当", "kind_en": "输入验证不当", "last_modified_time": "2026-08-20", "level": "High", "mps_id": "MPS-b7e5-60fa", "poc": false, "poc_url": [], "published_time": "2026-08-20", "reference_url_list": [{"url": "https://advisory.splunk.com/advisories/SVD-2026-0807", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-76387", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Splunk Enterprise Security SPL 注入漏洞", "_translated": true, "_saved_at": "2026-08-19T23:17:28+00:00", "_first_saved_at": "2026-08-19T22:18:20+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-b7e5-60fa"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-76139", "cvss": {"cvssv31": [{"source": "secalert@redhat.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:H/UI:N/S:C/C:H/I:H/A:H", "severity": "high", "base_score": 8}]}, "cvss_score": 8, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:H/UI:N/S:C/C:H/I:H/A:H", "cwe": "CWE-829", "description": "acm-operator-bundle 是 Red Hat Advanced Cluster Management for Kubernetes（RHACM）的开源 Operator Bundle 构建仓库，用于生成并发布 ACM operator 捆绑包镜像。\n受影响版本中，捆绑包构建流程会在运行时从 stolostron/release 仓库的 master 分支拉取当前 HEAD，并执行其中的 tools/konflux/common/process-triggering-pr.sh，且未校验提交 SHA、校验和或签名。该脚本继承构建环境中的完整凭据，包括覆盖 github.repository_owner 下全部仓库的 GitHub App 令牌、registry.redhat.io / registry.stage.redhat.io / quay.io 的仓库口令，以及对即将交付的 bundle PR 的写权限。能够改写 stolostron/release@master 的攻击者可向该特权构建路径注入恶意代码，窃取凭据或篡改已交付的 operator bundle。\n修复版本中通过将 config/acm-bundle-pr-config-vars 的 tools_repo_branch 从可变的 master 固定为完整 40 位 commit SHA，并在 tools/run-script-from-tools-repo 中拒绝非 SHA 引用、校验检出 HEAD 与钉扎提交一致，切断对未固定远程脚本的执行。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "从非可信控制范围包含功能例程", "kind_en": "包含来自不可信控制领域的功能", "last_modified_time": "2026-08-20", "level": "High", "mps_id": "MPS-oxh9-pkln", "poc": false, "poc_url": [], "published_time": "2026-08-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-oxh9-pkln", "name": "https://www.oscs1024.com/hd/MPS-oxh9-pkln"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-76139", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-76139"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-76139", "name": ""}, {"url": "https://bugzilla.redhat.com/show_bug.cgi?id=2519852", "name": ""}], "scope_influence": "", "tags": [], "title": "ACM捆绑包供应链漏洞", "_translated": true, "_saved_at": "2026-08-19T23:17:31+00:00", "_first_saved_at": "2026-08-19T22:18:24+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-oxh9-pkln"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-61897", "cvss": {"cvssv31": [{"source": "security@ubuntu.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-273", "description": "AccountsService 是 freedesktop 提供的开源 D-Bus 用户账号管理守护进程，Ubuntu 在其上定制了 /usr/share/language-tools/ 目录下的语言切换助手脚本。\n受影响版本中，普通本地用户通过 D-Bus 调用 org.freedesktop.Accounts.User.SetLanguage 时，src/user.c 中的 user_update_environment 仅以 setresuid(-1, accounts_user_get_uid(user), -1) 与 setresgid(-1, user-\u003egid, -1) 修改有效 UID/GID，真实 UID 仍为 0；随后派生的 /usr/share/language-tools/set-language-helper 继承 ruid=0/euid=用户 凭据执行；该脚本读取 ~/.pam_environment 中攻击者控制的 LANGUAGE 旧值并直接拼接进 data/langtools/save-to-pam-env 的 sed 替换字符串，注入 /e 标志后 GNU sed 调用 /bin/sh -c 执行替换文本，新派生的 shell 缺少 -p 选项，将有效 UID 复位到真实 UID 0，从而在用户主目录写入 setuid-root trampoline 完成本地提权。\n修复版本中通过将 src/user.c 中 user_language_validate、user_locale_validate 与 user_update_environment 三处统一替换为新增的 spawn_sync_as_user 助手，在 fork 后立即对真实、有效与保存 UID/GID 全部调用 setresuid(uid,uid,uid) 与 setresgid(gid,gid,gid) 一次性丢弃特权；同时 data/langtools/save-to-pam-env、set-language-helper 与 update-langlist 不再将 ~/.pam_environment 内容直接拼入 sed，而是改为 mktemp 临时文件 + is_valid_pam_value 白名单校验 var 与 value，禁止 /、;、#、e 等危险字符进入 sed 表达式，从根源切断 SetLanguage D-Bus 调用到 root shell 的整条提权链路。", "effects": [{"comp_name": "accountsservice", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,23.13.9-8ubuntu7)", "min_fixed_version": "23.13.9-8ubuntu7", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "对于放弃特权的检查不恰当", "kind_en": "对删除权限的不当检查", "last_modified_time": "2026-08-21", "level": "High", "mps_id": "MPS-19an-c38g", "poc": false, "poc_url": [], "published_time": "2026-08-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-19an-c38g", "name": "https://www.oscs1024.com/hd/MPS-19an-c38g"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-61897", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-61897"}, {"url": "https://bugs.launchpad.net/ubuntu/+source/accountsservice/+bug/2157985", "name": ""}, {"url": "https://ubuntu.com/security/CVE-2026-61897", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "AccountsService SetLanguage 本地权限提升", "_translated": true, "_saved_at": "2026-08-20T16:27:29+00:00", "_first_saved_at": "2026-08-20T16:27:29+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-19an-c38g"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-61898", "cvss": {"cvssv31": [{"source": "security@ubuntu.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-78", "description": "accountsservice 是 freedesktop 维护的开源 D-Bus 服务，用于集中管理系统用户账户、密码和语言环境；Ubuntu 在打包时附带了由特权进程运行的辅助脚本 save-to-pam-env 与 update-langlist，用于根据用户设置更新 ~/.pam_environment。\n受影响版本中，accountsservice（Ubuntu 打包版本 \u003c 23.13.9-8ubuntu7）随包分发的 save-to-pam-env 与 update-langlist 脚本在处理用户可控的 ~/.pam_environment LANGUAGE 条目时未做转义即直接拼入 GNU sed 替换表达式。本地攻击者可以借助 SetLanguage D-Bus 方法触发该辅助脚本，并在 LANGUAGE 值中注入 sed 的 e 标志及任意 shell 命令，从而以 AccountsService 辅助进程的真实 UID 0 权限执行任意命令。\n修复版本中通过 Ubuntu 安全更新（23.13.9-8ubuntu7）对 save-to-pam-env 与 update-langlist 中传入 sed 替换表达式的 LANGUAGE 值进行转义或采用安全替代实现，切断注入路径，使 SetLanguage 调用不会再以 root 权限执行攻击者控制的 shell 命令。", "effects": [{"comp_name": "accountsservice", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,23.13.9-8ubuntu7)", "min_fixed_version": "23.13.9-8ubuntu7", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-08-21", "level": "High", "mps_id": "MPS-bdnr-ow5a", "poc": false, "poc_url": [], "published_time": "2026-08-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-bdnr-ow5a", "name": "https://www.oscs1024.com/hd/MPS-bdnr-ow5a"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-61898", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-61898"}, {"url": "https://bugs.launchpad.net/ubuntu/+source/accountsservice/+bug/2157985", "name": ""}, {"url": "https://ubuntu.com/security/CVE-2026-61898", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "accountsservice 语言辅助脚本命令注入漏洞", "_translated": true, "_saved_at": "2026-08-20T16:27:27+00:00", "_first_saved_at": "2026-08-20T16:27:27+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-bdnr-ow5a"}, {"analysis_status": 3, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "cnvd_id": "", "cve_id": "", "cvss": {"cvssv31": [{"source": "murphysec", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "", "cwe": "CWE-416", "description": "Linux 内核是开源操作系统内核，负责进程调度、设备驱动和网络通信。机器使用 IPv6 时，内核会按路由规则挑选转发路径；用户程序也可以通过套接字选项加入 IPv6 任播组。\n受影响版本中，IPv6 路由查找碰到“按前缀长度丢掉这条结果”的规则时，fib6_rule_suppress() 会把当前路由对象释放掉，查找结果里的指针 res-\u003ert6 却还指向这块已经释放的内存。后面没有规则补上新结果时，内核会把这条失效路由继续交给后续查找使用。本机普通用户可以在用户命名空间里自行添加这类抑制规则，再调用 ipv6_setsockopt() 的 IPV6_JOIN_ANYCAST 选项、并把网卡编号设为 0，触发这次查找，形成释放后使用，最终拿到 root 权限。\n修复版本中通过在 fib6_rule_suppress() 释放路由对象之后把 res-\u003ert6 置空，让被抑制的查找改走空路由，不再继续使用已经释放的对象。", "effects": [{"comp_name": "linux_kernel", "ecosystem": "linux", "versions": [{"affected_version": "[5.16,7.2)", "min_fixed_version": "7.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "低", "fix_suggestion": "建议修复", "kind": "UAF", "kind_en": "免费后使用", "last_modified_time": "2026-08-20", "level": "High", "mps_id": "MPS-j671-qpzn", "poc": true, "poc_url": [], "published_time": "2026-08-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-j671-qpzn", "name": "https://www.oscs1024.com/hd/MPS-j671-qpzn"}, {"url": "https://x.com/nebusecurity/status/2090230697160245579", "name": ""}, {"url": "https://github.com/torvalds/linux/commit/6aea62e433fe1b586202a5fee8b5807ce635e1d7", "name": ""}, {"url": "https://github.com/torvalds/linux/commit/cdef485217d30382f3bf6448c54b4401648fe3f1", "name": ""}, {"url": "https://github.com/NebuSec/CyberMeowfia/tree/main/security-research/Linux-6aea62e4-Debian-6.12.101", "name": ""}, {"url": "https://patch.msgid.link/4b8acb7787d54e440155585dd32ebdf0bef7d122.1784710966.git.zhilinz@nebusec.ai", "name": ""}], "scope_influence": "广", "tags": [], "title": "Linux内核IPv6 UAF提权漏洞", "_translated": true, "_saved_at": "2026-08-20T06:35:10+00:00", "_first_saved_at": "2026-08-20T04:31:47+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-j671-qpzn"}, {"analysis_status": 0, "articles": [{"content": "由于整数类型的有限范围，在进行算术运算或操作时，结果可能超出类型的表示范围，导致溢出或环绕。溢出指的是结果超过了类型的最大值或小于了最小值，而环绕指的是结果绕回到类型的最小值或最大值。", "title": "什么是整数溢出或环绕"}, {"content": "- 缓冲区溢出：整数溢出可能导致缓冲区溢出漏洞。当整数溢出导致分配的缓冲区大小不足以容纳结果时，攻击者可以利用这个漏洞覆盖相邻的内存区域，执行恶意代码或篡改程序的状态。\r\n- 身份验证绕过：在进行身份验证或访问控制时，整数溢出可能导致绕过验证的漏洞。攻击者可以构造特殊的输入，使溢出的整数值绕过了预期的验证逻辑，从而获得未经授权的访问权限。\r\n- 数据篡改：整数溢出可能导致数据篡改漏洞。攻击者可以通过使整数溢出，修改计数器、索引或其他控制数据的值，导致程序在处理数据时发生错误或执行意外的操作。", "title": "整数溢出或环绕常见的攻击方式"}, {"content": "- 输入验证与限制：对用户输入的整数进行合理的验证和限制，确保其在允许的范围内。\r\n- 使用安全的整数操作函数：使用安全的整数操作函数，如`add_with_overflow()`、`sub_with_overflow()`、`mul_with_overflow()`等，这些函数会检查并处理溢出情况，确保计算结果在安全范围内。\r\n- 类型检查和转换：在进行整数运算或操作之前，进行类型检查和转换，确保操作数的类型和范围是合适的。\r\n- 强制性编码标准和最佳实践：制定强制性的编码标准和最佳实践，包括对整数运算和操作的规范和限制，以帮助程序员编写更可靠、安全的代码。\r\n- 静态代码分析和测试：使用静态代码分析工具和测试技术来检测和识别潜在的整数溢出问题。这些工具可以帮助发现代码中可能存在的溢出漏洞，并及时修复。", "title": "如何预防整数溢出或环绕"}], "cnvd_id": "", "cve_id": "CVE-2026-18917", "cvss": {"cvssv31": [{"source": "secalert@redhat.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-190", "description": "libvirt 是开源虚拟化管理工具包，提供守护进程与统一 API，用于管理 KVM、QEMU、LXC 等虚拟化平台。\n受影响版本中，远程 RPC 处理函数 remoteDispatchNodeGetFreePages 将攻击者可控的 unsigned int 参数 pages_len 与 cellCount 直接相乘，结果用于对照 REMOTE_NODE_MAX_CELLS 做上限检查并分配返回缓冲区。乘积按 32 位无符号整数回绕后，例如传入 1023 与 4198405 可使校验通过并分配过小堆缓冲；随后 hypervisor 驱动按真实 NUMA 节点数据写入该缓冲，造成堆溢出，进而损坏以 root 运行的 libvirt 守护进程内存，导致拒绝服务或本地权限提升。该 RPC 仅需 connect:read ACL，默认只读 Unix 套接字可被非特权本地用户访问。\n修复版本中通过在 remoteDispatchNodeGetFreePages 的上限检查中使用 VIR_INT_MULTIPLY_OVERFLOW 宏，拒绝 pages_len 与 cellCount 相乘溢出的请求，避免分配过小缓冲区并阻断后续 NUMA 数据越界写入。截至 2026-08-20，该修复已合入上游主线，官方尚未发布包含该修复的发行版本。", "effects": [{"comp_name": "libvirt", "ecosystem": "linux", "versions": [{"affected_version": "[1.2.6,12.6.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "整数溢出或环绕", "kind_en": "整数溢出或环绕", "last_modified_time": "2026-08-20", "level": "High", "mps_id": "MPS-mp62-yhg8", "poc": false, "poc_url": [], "published_time": "2026-08-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-mp62-yhg8", "name": "https://www.oscs1024.com/hd/MPS-mp62-yhg8"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-18917", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-18917"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-18917", "name": ""}, {"url": "https://bugzilla.redhat.com/show_bug.cgi?id=2520161", "name": ""}], "scope_influence": "", "tags": ["开源"], "title": "libvirt整数溢出漏洞", "_translated": true, "_saved_at": "2026-08-20T11:20:21+00:00", "_first_saved_at": "2026-08-20T11:20:21+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-mp62-yhg8"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "attack_vector_type": "Local", "cnvd_id": "", "cve_id": "CVE-2026-18482", "cvss": {}, "cvss_score": 7.8, "cvss_vector": "", "cwe": "CWE-78", "description": "Neo.mjs（npm 包 neo.mjs）是 Klarso GmbH 开源的 JavaScript 应用框架，内置面向自主代理的 file-system MCP 服务器，提供受限文件读写以及语法检查、Playwright 测试执行等反馈能力，属于大模型与 AI 代理基础设施组件。\n受影响版本中，ai/mcp/server/file-system/services/FileSystemService.mjs 的 checkSyntax() 与 runPlaywrightTest() 把调用方可控的 absolutePath 直接拼进 child_process.exec 生成的 shell 命令。ensureSandboxed() 只检查路径是否落在项目根目录内，并不阻止分号、\u0026\u0026、命令替换等 shell 元字符。AI 代理一旦被诱导调用 check_syntax 或 run_playwright_test 并传入此类路径，即可在 MCP 服务器进程权限下执行任意操作系统命令。\n修复版本中通过将 exec 替换为 execFile，并以 argv 数组向 node --check 与 npx playwright test 传递路径，使绝对路径中的元字符只能作为单个字面参数到达子进程，从而切断命令注入链。该代码修复位于提交 5acc564ea1b278bca5fab1f8f397a6ba9b849d75；CNA 记载的修复点 88c77fc408fd1307d6efd5cc088ba44de56d7845 叠加调整了路径隔离相关说明。截至 2026-08-20，npm 最新发布 13.1.0 尚未包含上述提交。", "effects": [{"comp_name": "neo.mjs", "ecosystem": "npm", "versions": [{"affected_version": "[13.0.0,13.1.0]", "min_fixed_version": "", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-08-20", "level": "High", "mps_id": "MPS-p63m-htif", "poc": false, "poc_url": [], "published_time": "2026-08-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-p63m-htif", "name": "https://www.oscs1024.com/hd/MPS-p63m-htif"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-18482", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-18482"}, {"url": "https://github.com/neomjs/neo/commit/5acc564ea1b278bca5fab1f8f397a6ba9b849d75", "name": ""}, {"url": "https://github.com/neomjs/neo/commit/88c77fc4", "name": ""}, {"url": "https://novice-22.com/posts/cve-2026-18482-neo.mjs/", "name": ""}], "scope_influence": "", "tags": ["AI", "npm", "开源"], "title": "Neo.mjs命令注入漏洞", "_translated": true, "_saved_at": "2026-08-20T14:29:26+00:00", "_first_saved_at": "2026-08-20T14:29:26+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-p63m-htif"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-19582", "cvss": {"cvssv31": [{"source": "secalert@redhat.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "cwe": "CWE-787", "description": "GNU Binutils 是开源二进制工具集，提供 ld、objdump、objcopy 等程序，用于汇编、链接、反汇编和检查目标文件。\n受影响版本中，BFD 合并 PE 文件 .rsrc 节时，rsrc_parse_entries 将资源名长度直接取自文件字段，rsrc_print_name 再用无边界 sprintf 写入 rsrc_sort_entries 里仅 256 字节的栈缓冲区。用户使用 binutils 处理恶意 PE 文件后，可触发栈缓冲区溢出并执行任意代码。\n修复版本中通过官方尚未发布的安全更新才能消除该越界写。当前未公布修复版本和修复代码，应避免使用 binutils 打开不可信 PE 文件。", "effects": [{"comp_name": "binutils", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.46.1]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-08-20", "level": "High", "mps_id": "MPS-vday-p9b6", "poc": false, "poc_url": [], "published_time": "2026-08-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-vday-p9b6", "name": "https://www.oscs1024.com/hd/MPS-vday-p9b6"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-19582", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-19582"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-19582", "name": ""}, {"url": "https://bugzilla.redhat.com/show_bug.cgi?id=2513754", "name": ""}], "scope_influence": "", "tags": [], "title": "Binutils栈缓冲区溢出", "_translated": true, "_saved_at": "2026-08-20T06:35:08+00:00", "_first_saved_at": "2026-08-20T06:35:08+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-vday-p9b6"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-63043", "cvss": {}, "cvss_score": 7.7, "cvss_vector": "", "cwe": "CWE-22", "description": "Apache InLong 是开源的一站式海量数据集成框架，用于数据采集、汇聚与分发，其中 Manager 负责任务配置，Agent 负责在主机上执行文件采集。\n受影响版本中，创建或更新 FILE 类型数据源时，FileSourceRequest 的 pattern 字段未经路径穿越校验即被 FileSourceOperator.setTargetEntity 写入并下发给 Agent。攻击者只要能调用 Manager 的 /openapi/source/save 或 /api/source/save 接口，即可提交含 \"..\" 路径段的采集路径，使 Agent 读取宿主机上预期目录之外的文件。\n修复版本中通过 PathValidationUtils.containsPathTraversal 在 Manager 保存数据源时拒绝含完整 \"..\" 路径段的 pattern，并在 Agent 拉取任务时由 ManagerFetcher.validateFilePattern 再次拦截，阻止非法路径进入文件采集。", "effects": [{"comp_name": "inlong", "ecosystem": "linux", "versions": [{"affected_version": "[2.0.0,2.4.0)", "min_fixed_version": "2.4.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "org.apache.inlong:agent-plugins", "ecosystem": "maven", "versions": [{"affected_version": "[2.0.0,2.4.0)", "min_fixed_version": "2.4.0", "repository": "maven", "solutions": [], "upstream": true}]}, {"comp_name": "org.apache.inlong:manager-service", "ecosystem": "maven", "versions": [{"affected_version": "[2.0.0,2.4.0)", "min_fixed_version": "2.4.0", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-08-20", "level": "High", "mps_id": "MPS-184d-34a0", "poc": false, "poc_url": [], "published_time": "2026-08-20", "reference_url_list": [{"url": "http://www.mail-archive.com/announce@apache.org/msg11743.html", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-63043", "name": ""}, {"url": "https://inlong.apache.org", "name": ""}, {"url": "https://inlong.apache.org/download/", "name": ""}, {"url": "https://github.com/apache/inlong/issues/12143", "name": ""}, {"url": "https://github.com/apache/inlong/pull/12146", "name": ""}, {"url": "https://github.com/apache/inlong/commit/0d31fbeb9c9ba9a8cbb26298bcc173f9e627ccb4", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "InLong文件源路径穿越漏洞", "_translated": true, "_saved_at": "2026-08-20T15:27:20+00:00", "_first_saved_at": "2026-08-20T15:27:20+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-184d-34a0"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-77084", "cvss": {"cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.7}]}, "cvss_score": 7.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-78", "description": "n8n 是开源的工作流自动化平台，Git node 是其内置节点之一，可在工作流中执行 clone、push、fetch、listConfig 等 Git 操作。\n受影响版本中，Git node 在执行 listConfig 操作时直接读取仓库本地 .git/config，把 remote.origin.url 与 remote.origin.pushurl 等键的原始字符串作为节点输出返回，URL 的用户名/密码片段可携带 shell 元字符。仓库内的恶意 config 因此经节点间数据流进入后续 Git 节点操作，被带入 simple-git 触发的 git 命令执行流程并以 n8n 进程用户身份执行任意命令。该路径无法通过 Git 节点自身的参数控制面实现，需要先借助另一个文件写入漏洞把恶意 config 植入目标仓库。\n修复版本中通过在 packages/nodes-base/nodes/Git/GenericFunctions.ts 中新增 sanitizeUrl 与 mapGitConfigList，对 listConfig 返回数据里的 remote.origin.url 与 remote.origin.pushurl 先经 new URL() 解析后清空 username 与 password 再写回，同时将 Git.node.ts 的 listConfig 分支替换为调用 mapGitConfigList，切断恶意 URL 在节点间流转时被复用的链路。", "effects": [{"comp_name": "n8n", "ecosystem": "npm", "versions": [{"affected_version": "(-∞,2.33.4)", "min_fixed_version": "2.33.4", "repository": "npm", "solutions": [], "upstream": true}, {"affected_version": "(-∞,1.123.69)", "min_fixed_version": "1.123.69", "repository": "npm", "solutions": [], "upstream": true}, {"affected_version": "(-∞,2.34.1)", "min_fixed_version": "2.34.1", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-08-20", "level": "High", "mps_id": "MPS-pjow-4fv3", "poc": false, "poc_url": [], "published_time": "2026-08-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-pjow-4fv3", "name": "https://www.oscs1024.com/hd/MPS-pjow-4fv3"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-77084", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-77084"}, {"url": "https://github.com/n8n-io/n8n/security/advisories/GHSA-m87g-qr43-ccvc", "name": ""}, {"url": "https://www.vulncheck.com/advisories/n8n-before-remote-code-execution-via-git-node-configuration-values", "name": ""}], "scope_influence": "", "tags": ["npm", "开源"], "title": "n8n Git node 命令注入漏洞", "_translated": true, "_saved_at": "2026-08-20T13:40:44+00:00", "_first_saved_at": "2026-08-20T12:34:57+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-pjow-4fv3"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-55643", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:L/UI:N/VC:H/VI:H/VA:L/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.6}]}, "cvss_score": 7.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:L/UI:N/VC:H/VI:H/VA:L/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-863", "description": "Snipe-IT 是开源 IT 资产与许可证管理系统，基于 PHP 与 Laravel 构建，用于管理硬件、软件许可及人员资产关系。\n受影响版本中，开启完整多公司支持（FMCS）且启用 floater 模式后，Company::scopeCompanyablesDirectly 在查询 users 表时通过 orWhereDoesntHave('companies') 把无公司关联用户纳入公司范围内账号的可见集合。/api/v1/users 可返回这些用户的个人信息，/api/v1/users/{id}/licenses 可返回其已分配许可证；/users/bulkeditsave 与 /users/merge 仅校验类级权限、未调用 isCurrentUserHasAccess，可修改范围外用户资料、软删除用户并把已分配资产转移到攻击者账号。\n修复版本中通过删除公司范围内账号查询 users 时的 floater 分支，使该类账号只能看到在 company_user 枢纽中与自己存在公司交集的用户，阻断对无公司用户的列表读取、批量修改与合并删除。", "effects": [{"comp_name": "snipe-it", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,8.6.3)", "min_fixed_version": "8.6.3", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-08-20", "level": "High", "mps_id": "MPS-qpnb-9usv", "poc": false, "poc_url": [], "published_time": "2026-08-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-qpnb-9usv", "name": "https://www.oscs1024.com/hd/MPS-qpnb-9usv"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-55643", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-55643"}, {"url": "https://github.com/grokability/snipe-it/commit/fbe05a8df4742729a9b0756c016d45f48246cc7b", "name": ""}, {"url": "https://github.com/grokability/snipe-it/releases/tag/v8.6.3", "name": ""}, {"url": "https://github.com/grokability/snipe-it/security/advisories/GHSA-c6w2-j4wq-mvwg", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "Snipe-IT租户隔离绕过", "_translated": true, "_saved_at": "2026-08-19T21:19:55+00:00", "_first_saved_at": "2026-08-19T20:20:06+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-qpnb-9usv"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-74011", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:C/C:H/I:N/A:L", "severity": "high", "base_score": 7.6}]}, "cvss_score": 7.6, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:C/C:H/I:N/A:L", "cwe": "CWE-89", "description": "InfiniteWP Client 是 Revmakx 发布的开源 WordPress 插件，用于将站点接入 InfiniteWP 管理面板，完成远程备份、更新与内容管理。\n受影响版本中，远程动作入口 iwp_mmb_parse_request 解析 HTTP 请求体后，将已认证参数交给 IWP_MMB_Comment::get_comments。该函数把请求键名去掉 iwp_get_comments_ 前缀后直接拼入 comment_approved IN (...) 子句，未做状态白名单校验，攻击者可注入 SQL 并盲注读取数据库数据。同类拼接还出现在 get_posts、get_pages 的 post_status 过滤以及 reply_comment 的 INSERT/SELECT 语句中。\n修复版本中通过将评论状态限制在 approved、pending、spam、trash 白名单，并对 IN 子句、LIMIT 与评论回复语句改用 $wpdb-\u003eprepare 和 absint 绑定，切断不可信键名与标识符进入 SQL 的路径。", "effects": [{"comp_name": "infinitewp_client", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.13.10)", "min_fixed_version": "1.13.10", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-08-20", "level": "High", "mps_id": "MPS-uaf5-g19m", "poc": false, "poc_url": [], "published_time": "2026-08-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-uaf5-g19m", "name": "https://www.oscs1024.com/hd/MPS-uaf5-g19m"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-74011", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-74011"}, {"url": "https://patchstack.com/database/wordpress/plugin/iwp-client/vulnerability/wordpress-infinitewp-client-plugin-1-13-9-sql-injection-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "InfiniteWP Client SQL注入", "_translated": true, "_saved_at": "2026-08-20T14:29:23+00:00", "_first_saved_at": "2026-08-20T14:29:23+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-uaf5-g19m"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-75963", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-98", "description": "Events Made Easy 是开源 WordPress 插件，用于管理活动、会员、场地、RSVP 与支付等功能。\n受影响版本中，具备 Contributor 及以上权限的攻击者可在创建或提交活动时把路径穿越字符串写入 event_properties.wp_page_template。活动单页渲染时，eme_single_event_page_template 未校验该值是否属于主题允许的页面模板，直接交给 locate_template 并由 template_include 包含执行，任意访客打开该活动页即可触发本地文件包含，造成访问控制绕过、敏感数据泄露或 PHP 代码执行。\n修复版本中通过在 eme_single_event_page_template 调用 locate_template 前使用 get_page_templates() 做白名单校验，拒绝非主题允许模板进入包含路径，并在活动属性保存阶段同步丢弃非法 wp_page_template，切断本地文件包含链路。", "effects": [{"comp_name": "events-made-easy", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,3.2.6)", "min_fixed_version": "3.2.6", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "php远程文件包含", "kind_en": "PHP 程序中 Include/Require 语句的文件名控制不当（“PHP 远程文件包含”）", "last_modified_time": "2026-08-20", "level": "High", "mps_id": "MPS-5pvo-87j2", "poc": false, "poc_url": [], "published_time": "2026-08-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-5pvo-87j2", "name": "https://www.oscs1024.com/hd/MPS-5pvo-87j2"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-75963", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-75963"}, {"url": "https://plugins.trac.wordpress.org/browser/events-made-easy/tags/3.2.5/includes/eme-events.php#L1721", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/events-made-easy/tags/3.2.5/includes/eme-fs.php#L670", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/events-made-easy/tags/3.2.5/includes/eme-fs.php#L842", "name": ""}, {"url": "https://plugins.trac.wordpress.org/changeset?reponame=\u0026old=3654766%40events-made-easy\u0026new=3654766%40events-made-easy", "name": ""}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/24890c27-6db1-4ca9-8ebd-601fbce93d88?source=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Events Made Easy本地文件包含漏洞", "_translated": true, "_saved_at": "2026-08-20T09:27:28+00:00", "_first_saved_at": "2026-08-20T07:35:48+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-5pvo-87j2"}, {"analysis_status": 0, "articles": [{"content": "跨界内存读是指应用程序在读取内存时，未正确验证或限制读取的内存范围。攻击者利用这种漏洞可以读取应用程序内存中的敏感数据，如密码、加密密钥、会话令牌等。常见的原因是由于缓冲区溢出、格式化字符串漏洞或其他内存错误导致的。", "title": "什么是越界读取"}, {"content": "攻击者可以通过不当构造的输入来触发跨界内存读漏洞。攻击者可能会通过向应用程序发送特定的输入，使其读取超过预期的内存区域。攻击者可以利用这个漏洞来获取敏感信息，如其他用户的数据、操作系统的敏感数据或应用程序的内部状态。", "title": "越界读取常见的攻击方式"}, {"content": "- 输入验证和限制：应用程序应对所有输入数据进行严格的验证和限制。确保输入数据的长度、格式和内容符合预期，避免超出缓冲区或访问非预期的内存区域。\n- 内存安全编程实践：开发人员应使用安全的编程实践，如避免使用不安全的函数、正确处理内存分配和释放操作，以及遵循最小特权原则。\n- 使用安全的编程语言和库：选择使用安全性较高的编程语言和库，这些语言和库在内存管理和安全性方面提供了更多的保护机制。\n- 定期进行代码审查和安全测试：定期审查应用程序的代码，并进行安全测试，以发现潜在的跨界内存读漏洞。使用静态代码分析工具和漏洞扫描工具来辅助检测和修复问题。\n- 实施防御性编程技术：应用程序应采用防御性编程技术，如使用随机化地址空间布局（ASLR）、堆栈保护机制（如堆栈溢出保护）和数据执行预防（DEP）等。\n- 及时更新和修补：及时应用程序和操作系统的安全更新和补丁，以确保已知的跨界内存读漏洞得到修复。及时更新相关软件和库，以避免使用已知存在漏洞的版本。", "title": "如何预防越界读取"}], "cnvd_id": "", "cve_id": "CVE-2026-53587", "cvss": {}, "cvss_score": 7.5, "cvss_vector": "", "cwe": "CWE-125", "description": "libgit2 是开源 C 语言 Git 核心实现库，对外提供 clone、fetch、push 等能力，被桌面客户端、代码托管平台和多种语言绑定广泛使用。\n受影响版本中，智能协议解析 refs 通告首个 ref-pkt 时，set_data 对 capability 缓冲区执行固定长度 strncmp(\"object-format=\")，未校验当前 pkt-line 剩余长度。攻击者控制或中间人劫持 HTTP/HTTPS/SSH/git:// Git 服务端，可在报文边界附近放置 NUL 与截断前缀，使比较越过 pkt-line 匹配成功，随后 memchr 的 size_t 长度下溢并在堆上越界读取，导致进程崩溃；若扫描到空格，还可能把大段堆内容写入错误字符串。\n修复版本中通过在比较 object-format= 之前检查剩余长度，避免越过 pkt-line 边界匹配，切断 memchr 长度下溢与堆外读取路径。", "effects": [{"comp_name": "libgit2", "ecosystem": "linux", "versions": [{"affected_version": "[1.6.1,1.8.6)", "min_fixed_version": "1.8.6", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[1.9.0,1.9.5)", "min_fixed_version": "1.9.5", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "极高", "fix_suggestion": "建议修复", "kind": "越界读取", "kind_en": "越界读取", "last_modified_time": "2026-08-20", "level": "High", "mps_id": "MPS-efe1-c845", "poc": true, "poc_url": [], "published_time": "2026-08-20", "reference_url_list": [{"url": "https://www.openwall.com/lists/oss-security/2026/08/20/4", "name": ""}, {"url": "https://github.com/libgit2/libgit2/security/advisories/GHSA-pm24-4jhq-3xvm", "name": ""}, {"url": "https://github.com/libgit2/libgit2/releases/tag/v1.9.5", "name": ""}, {"url": "https://github.com/libgit2/libgit2/releases/tag/v1.8.6", "name": ""}, {"url": "https://github.com/libgit2/libgit2/commit/affda60c10fcef16723451c0d7dc71b71dc20ad3", "name": ""}, {"url": "https://github.com/libgit2/libgit2/commit/2c0ce8c0132ac38ab0db28239462a671e2e5440e", "name": ""}, {"url": "https://security-tracker.debian.org/tracker/CVE-2026-53587", "name": ""}, {"url": "https://explore.alas.aws.amazon.com/CVE-2026-53587.html", "name": ""}], "scope_influence": "", "tags": [], "title": "libgit2堆越界读取漏洞", "_translated": true, "_saved_at": "2026-08-20T06:35:09+00:00", "_first_saved_at": "2026-08-20T04:31:45+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-efe1-c845"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-76956", "cvss": {"cvssv31": [{"source": "cve@mitre.org", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-394", "description": "libexpat（Expat）是以 MIT 许可证发布的开源 C 语言流式 XML 解析库，用于解析 XML 1.0，并被操作系统发行版、语言运行时与大量应用程序作为底层解析组件使用。\n受影响版本中，writeRandomBytes_getentropy 将 getentropy() 返回值直接赋给 bool 变量 success。getentropy 成功时返回 0，该值被当成失败，已写入的高质量熵被丢弃。generate_hash_secret_salt 随即回退到时间戳与进程号生成 SipHash 盐，哈希盐可被预测。攻击者通过 XML_Parse 提交构造的 XML 内容即可发起哈希洪水，造成拒绝服务。\n修复版本中通过将成功判定改为 getentropy(target, count) == 0，仅在系统调用成功时保留该熵并用于哈希盐，恢复对哈希洪水攻击的防护。", "effects": [{"comp_name": "libexpat", "ecosystem": "linux", "versions": [{"affected_version": "[2.8.2,2.8.4)", "min_fixed_version": "2.8.4", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "未预期的状态编码或返回值", "kind_en": "意外的状态代码或返回值", "last_modified_time": "2026-08-20", "level": "High", "mps_id": "MPS-h8jf-469n", "poc": false, "poc_url": [], "published_time": "2026-08-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-h8jf-469n", "name": "https://www.oscs1024.com/hd/MPS-h8jf-469n"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-76956", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-76956"}, {"url": "https://github.com/libexpat/libexpat/pull/1326", "name": ""}], "scope_influence": "", "tags": [], "title": "libexpat哈希洪水漏洞", "_translated": true, "_saved_at": "2026-08-20T06:35:06+00:00", "_first_saved_at": "2026-08-20T06:35:06+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-h8jf-469n"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-63408", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "cwe": "CWE-598", "description": "Grav API 插件是开源 PHP 包 getgrav/grav-plugin-api，为 Grav CMS 提供 RESTful API，可对外暴露站点内容的完整 headless 访问能力。\n受影响版本中，classes/Api/Auth/JwtAuthenticator.php 中的 extractBearerToken 方法在读取 X-API-Token 自定义头与 Authorization 头之外，对任意 /api/v1/* 路由都接受 ?token=\u003cJWT\u003e 查询参数作为回退鉴权入口。该回退分支同时被 GET、POST、PATCH、DELETE 等状态变更接口共用，因此 JWT 访问令牌会随请求 URL 进入 Apache 访问日志、上游代理与 CDN 日志、Referer 头、浏览器历史与共享主机日志文件，攻击者一旦获取这些被记录的 JWT，即可对 /api/v1/me、/api/v1/users、/api/v1/config/system 等接口以受害者权限完成认证并执行读取与写入。\n修复版本中通过收紧 extractBearerToken 的查询参数回退路径解决了该问题，新增 isTokenQueryAllowed 判定仅当请求方法为 GET/HEAD 且路径命中 TOKEN_QUERY_ROUTES 列表中的 /download 或 /thumbnails 后缀时才接受 ?token=\u003cJWT\u003e，其他 JSON 路由与所有状态变更方法一律忽略该参数，使访问令牌不再写入 URL，从而切断经由日志、Referer 与浏览器历史的泄露链路。", "effects": [{"comp_name": "getgrav/grav-plugin-api", "ecosystem": "composer", "versions": [{"affected_version": "[1.0.0-rc.1,1.0.0-rc.16)", "min_fixed_version": "1.0.0-rc.16", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "通过GET请求中的查询字符串导致的信息暴露", "kind_en": "使用带有敏感查询字符串的 GET 请求方法", "last_modified_time": "2026-08-20", "level": "High", "mps_id": "MPS-p5l2-btrv", "poc": false, "poc_url": [], "published_time": "2026-08-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-p5l2-btrv", "name": "https://www.oscs1024.com/hd/MPS-p5l2-btrv"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-63408", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-63408"}, {"url": "https://github.com/getgrav/grav-plugin-api/commit/56ae2ca3bf36c8299a4b3d376c6a20e8c0ed5ba9", "name": ""}, {"url": "https://github.com/getgrav/grav-plugin-api/releases/tag/1.0.0-rc.16", "name": ""}, {"url": "https://github.com/getgrav/grav/security/advisories/GHSA-4hpj-wmpw-ghwq", "name": ""}], "scope_influence": "", "tags": ["php", "开源"], "title": "Grav API插件JWT访问令牌URL泄露漏洞", "_translated": true, "_saved_at": "2026-08-19T17:21:15+00:00", "_first_saved_at": "2026-08-19T17:21:15+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-p5l2-btrv"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用了空指针，并在不进行有效检查的情况下对其进行取消引用操作。当程序试图取消引用空指针时，由于空指针不指向任何有效的内存地址，会导致程序崩溃或产生未定义的行为。这种错误通常发生在开发者未对指针进行正确的初始化或验证时。", "title": "什么是空指针取消引用"}, {"content": "- 拒绝服务：攻击者可以通过构造恶意输入或请求，触发程序中的空指针取消引用错误，导致程序崩溃或无法正常运行。这可能导致拒绝服务攻击，使系统无法提供正常的服务。\r\n- 内存信息泄露：攻击者可以通过利用空指针取消引用错误，访问程序中的敏感内存信息。这可能包括栈上的变量、函数指针或其他敏感数据，从而暴露系统的机密信息。\r\n- 代码执行：在某些情况下，空指针取消引用错误可能导致执行恶意代码或注入恶意代码的机会。攻击者可以通过精心构造的输入，利用空指针取消引用错误来执行任意的代码，进而获取系统控制权或执行未经授权的操作。", "title": "空指针取消引用常见的攻击方式"}, {"content": "- 指针初始化和验证：开发者应该正确地初始化指针，并在使用指针之前进行有效的验证，确保指针不为空。在取消引用指针之前，应始终检查其是否为空。\r\n- 异常处理和错误恢复：程序应该具备健壮的异常处理和错误恢复机制，以便在发生空指针取消引用错误时能够适当地处理异常，而不是导致程序崩溃或暴露敏感信息。\r\n- 防御性编程：采用防御性编程的原则，如避免在未经验证的指针上进行操作，避免使用未初始化的指针等，以防止空指针取消引用错误的发生。\r\n- 静态代码分析和测试：使用静态代码分析工具和测试技术来检测和识别潜在的空指针取消引用错误。这些工具可以帮助发现代码中可能存在的空指针问题，并及时修复。\r\n- 强制性编码标准和最佳实践：制定强制性的编码标准和最佳实践，包括良好的指针使用和管理规范，以帮助开发者编写更可靠、安全的代码。", "title": "如何预防空指针取消引用"}], "cnvd_id": "", "cve_id": "CVE-2026-76928", "cvss": {"cvssv31": [{"source": "cve@gitlab.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-476", "description": "Wireshark 是开源网络协议分析工具，使用 C 语言实现，主要用于抓取与解析网络数据包，并提供图形化与命令行形式的协议解码能力，因此属于通用网络流量分析基础设施。\n受影响版本中，X.509IF 协议解析器（epan/dissectors/packet-x509if.c）的 dissect_x509if_RelativeDistinguishedName 在处理嵌套的 RelativeDistinguishedName 时存在空指针解引用缺陷。当报文携带格式异常的 RDN（一个 RDN 中嵌套另一个 RDN）时，内层调用会把模块级缓冲 last_rdn_buf 重置为 NULL，外层调用继续通过 wmem_strbuf_get_str(last_rdn_buf) 读取该指针并构造 proto 文本，从而触发空指针解引用并导致 Wireshark 进程崩溃。\n修复版本中通过在 dissect_x509if_RelativeDistinguishedName 末尾以 last_rdn_buf 自身可能为 NULL 的前提收紧逻辑，仅在该缓冲非空时执行关闭括号与拼接 last_dn_buf 的字符串操作，并对自动生成的 epan/dissectors/asn1/x509if/x509if.cnf 模板同步调整，从而在 master、release-4.6 与 release-4.4 分支切断畸形嵌套 RDN 引发的崩溃链。", "effects": [{"comp_name": "wireshark", "ecosystem": "linux", "versions": [{"affected_version": "[4.6.0,4.6.8)", "min_fixed_version": "4.6.8", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[4.4.0,4.4.18)", "min_fixed_version": "4.4.18", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "空指针取消引用", "kind_en": "空指针取消引用", "last_modified_time": "2026-08-20", "level": "High", "mps_id": "MPS-qsyc-vifb", "poc": false, "poc_url": [], "published_time": "2026-08-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-qsyc-vifb", "name": "https://www.oscs1024.com/hd/MPS-qsyc-vifb"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-76928", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-76928"}, {"url": "https://gitlab.com/wireshark/wireshark/-/work_items/21469", "name": ""}, {"url": "https://www.wireshark.org/security/wnpa-sec-2026-87.html", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "Wireshark X.509IF 协议解析器空指针解引用漏洞", "_translated": true, "_saved_at": "2026-08-20T02:13:52+00:00", "_first_saved_at": "2026-08-20T00:53:34+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-qsyc-vifb"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-63490", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "cwe": "CWE-552", "description": "Handlebars.java 是开源 Java 模板引擎，handlebars-springmvc 子模块为 Spring MVC 提供基于视图名的 Handlebars 模板解析与渲染能力。\n受影响版本中，com.github.jknack.handlebars.springmvc.SpringTemplateLoader 依赖 Spring ResourceLoader 解析模板 URL，但缺少其他 URL 型 loader 的路径边界校验；攻击者可控的视图名若使用 file: 或 classpath: 形式并在末尾附加 # 片段分隔符，框架拼接的 .hbs 后缀会被丢弃，绕过前缀/后缀必须落在真实文件名上的约束。HandlebarsViewResolver.configure() 随后将该路径直接交给 handlebars.compile()，当应用对外暴露视图名受用户输入影响的 Controller 时，未认证远程攻击者可读取 JVM 可访问的文件。\n修复版本中通过移除 SpringTemplateLoader 的协议动态解析、在 resolveResource 阶段校验并阻止 ..、:、# 等危险字符，以及在 HandlebarsViewResolver.configure() 中以 IllegalArgumentException 拒绝包含 :、# 或 .. 的视图名，使路径穿越和片段符绕过失效，并将模板解析锁定在受控目录之内。", "effects": [{"comp_name": "com.github.jknack:handlebars-springmvc", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,4.5.3)", "min_fixed_version": "4.5.3", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "对外部实体的文件或目录可访问", "kind_en": "外部各方可访问的文件或目录", "last_modified_time": "2026-08-21", "level": "High", "mps_id": "MPS-ugfm-1b2x", "poc": false, "poc_url": [], "published_time": "2026-08-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ugfm-1b2x", "name": "https://www.oscs1024.com/hd/MPS-ugfm-1b2x"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-63490", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-63490"}, {"url": "https://github.com/jknack/handlebars.java/commit/61f43423a337b87db5fec1fe59f0725aaaa38df5", "name": ""}, {"url": "https://github.com/jknack/handlebars.java/releases/tag/v4.5.3", "name": ""}, {"url": "https://github.com/jknack/handlebars.java/security/advisories/GHSA-g29j-rwfv-h99w", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "Handlebars.java handlebars-springmvc SpringTemplateLoader 路径穿越与片段符绕过漏洞", "_translated": true, "_saved_at": "2026-08-20T16:27:26+00:00", "_first_saved_at": "2026-08-20T16:27:26+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ugfm-1b2x"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-77079", "cvss": {"cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:L/UI:N/VC:H/VI:L/VA:L/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.4}]}, "cvss_score": 7.4, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:L/UI:N/VC:H/VI:L/VA:L/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-639", "description": "n8n is an open-source workflow automation platform written in TypeScript that exposes both an internal HTTP API under /rest and a public API under /api/v1 for managing custom roles, projects, credentials and workflows.\n受影响版本中，DELETE /roles/{slug} 处理函数 deleteRole 在删除自定义角色时仅对角色类型调用了 assertCanManageRoleType 检查，该检查对 project 类型的角色放行持有 role:manageProject 全局作用域的用户；随后服务层 removeCustomRole 又把 query 参数 reassignRoleSlug 原样传给 reassignUsersAndRemoveRole，仅校验目标角色存在且 roleType 与被删角色相同，没有任何项目级授权或调用者角色管理范围的复核。一个持有 role:manageProject 的普通账号只要本身是被删自定义项目角色的持有者，就能删除该角色并把自身连同其他持有者一并改派到内置的 project:admin 角色，从而获得本不应具备的项目管理权限。\n修复版本中通过在 RoleController.deleteRole 中新增私有方法 canReassignUsers，仅当角色 roleType 为 global、调用者未持有该角色且同时具备 role:manage 与 user:changeRole 两个全局作用域时，才把 reassignRoleSlug 透传至 removeCustomRole，否则显式置为 undefined；与此同时 removeCustomRole 增加了对 systemRole 的拒绝以及全局角色计数校验，使得 project 角色删除路径无法触发任意重派，必须先迁移持有者才能删除，从而关闭了以 manageProject 越权获取 project:admin 的链路。", "effects": [{"comp_name": "n8n", "ecosystem": "npm", "versions": [{"affected_version": "(-∞,2.33.4)", "min_fixed_version": "2.33.4", "repository": "npm", "solutions": [], "upstr 响版本中，后台 ZIP 导入接口 ImportAjaxController::unpack 将上传文件交给 ImportService::unpack 处理。该函数仅校验客户端声明的 MIME 类型，随后使用 ZipArchive::extractTo 把压缩包完整解压到站点可访问的 wp-content/uploads/depicter 目录，既不拦截 php、phtml 等可执行后缀，也不阻止路径穿越；导入失败时异常路径不会删除已写入文件。具备 editor 角色及 import_depicter 权限的用户可将含可执行 PHP 的 ZIP 包写入 Web 目录并实现远程代码执行。\n修复版本中通过在控制器侧强制校验扩展名为 zip，并在 ImportService::unpack 中改为逐条目解压：跳过 php/phtml/phar/.htaccess 等危险扩展与含 ../ 的路径，使用随机目录与随机文件名存放临时包，并在异常路径中删除残留文件，从而切断任意文件写入。", "effects": [{"comp_name": "depicter", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,4.8.0)", "min_fixed_version": "4.8.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "任意文件上传", "kind_en": "危险类型文件无限制上传", "last_modified_time": "2026-08-20", "level": "High", "mps_id": "MPS-7zl8-2it0", "poc": false, "poc_url": [], "published_time": "2026-08-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-7zl8-2it0", "name": "https://www.oscs1024.com/hd/MPS-7zl8-2it0"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-15049", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-15049"}, {"url": "https://wpscan.com/vulnerability/c32e6a11-98f2-48e8-be64-f0c1966ddc18/", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "Depicter任意文件上传漏洞", "_translated": true, "_saved_at": "2026-08-20T07:35:50+00:00", "_first_saved_at": "2026-08-20T07:35:50+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-7zl8-2it0"}, {"analysis_status": 0, "articles": [{"content": "跨界内存读是指应用程序在读取内存时，未正确验证或限制读取的内存范围。攻击者利用这种漏洞可以读取应用程序内存中的敏感数据，如密码、加密密钥、会话令牌等。常见的原因是由于缓冲区溢出、格式化字符串漏洞或其他内存错误导致的。", "title": "什么是越界读取"}, {"content": "攻击者可以通过不当构造的输入来触发跨界内存读漏洞。攻击者可能会通过向应用程序发送特定的输入，使其读取超过预期的内存区域。攻击者可以利用这个漏洞来获取敏感信息，如其他用户的数据、操作系统的敏感数据或应用程序的内部状态。", "title": "越界读取常见的攻击方式"}, {"content": "- 输入验证和限制：应用程序应对所有输入数据进行严格的验证和限制。确保输入数据的长度、格式和内容符合预期，避免超出缓冲区或访问非预期的内存区域。\n- 内存安全编程实践：开发人员应 : "敏感数据的明文存储", "kind_en": "敏感信息的明文存储", "last_modified_time": "2026-08-20", "level": "High", "mps_id": "MPS-28js-nkl5", "poc": false, "poc_url": [], "published_time": "2026-08-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-28js-nkl5", "name": "https://www.oscs1024.com/hd/MPS-28js-nkl5"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-14163", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-14163"}, {"url": "https://advisories.octopus.com/post/2026/sa2026-07/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Octopus Server敏感变量泄露", "_translated": true, "_saved_at": "2026-08-20T09:27:27+00:00", "_first_saved_at": "2026-08-20T08:30:08+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-28js-nkl5"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用了空指针，并在不进行有效检查的情况下对其进行取消引用操作。当程序试图取消引用空指针时，由于空指针不指向任何有效的内存地址，会导致程序崩溃或产生未定义的行为。这种错误通常发生在开发者未对指针进行正确的初始化或验证时。", "title": "什么是空指针取消引用"}, {"content": "- 拒绝服务：攻击者可以通过构造恶意输入或请求，触发程序中的空指针取消引用错误，导致程序崩溃或无法正常运行。这可能导致拒绝服务攻击，使系统无法提供正常的服务。\r\n- 内存信息泄露：攻击者可以通过利用空指针取消引用错误，访问程序中的敏感内存信息。这可能包括栈上的变量、函数指针或其他敏感数据，从而暴露系统的机密信息。\r\n- 代码执行：在某些情况下，空指针取消引用错误可能导致执行恶意代码或注入恶意代码的机会。攻击者可以通过精心构造的输入，利用空指针取消引用错误来执行任意的代码，进而获取系统控制权或执行未经授权的操作。", "title": "空指针取消引用常见的攻击方式"}, {"content": "- 指针初始化和验证：开发者应该正确地初始化指针，并在使用指针之前进行有效的验证，确保指针不为空。在取消引用指针之前，应始终检查其是否为空。\r\n- 异常处理和错误恢复：程序应该具备健壮的异常处理和错误恢复机制，以便在发生空指针取消引用错误时能够适当地处理异常，而不是导致程序崩溃或暴露敏感信息。\r\n- 防御性编程：采用防御性编程的原则，如避免在未经验证的指针上进行操作，避免使用未初始化的指针等，以防止空指针取消引用错误的发生。\r\n- 静态代码分析和测试：使用静态代码分析工具和测试技术来检测和识别潜在的空指针取消引用错误。这些工具可以帮助发现代码中可能存在的空指针问题，并及时修复。\r\n- 强制性编码标准和最佳实践：制定强制性的编码标准和最佳实践，包括良好的指针使用和管理规范，以帮助开发者编写更可靠、安全的代码。", "title": "如何预防空指针取消引用"}], "cnvd_id": "", "cve_id": "CVE-2026-75618", "cvss": {"cvssv4": [{"source": "f23511db-6c3e-4e32-a477-6aa17d310630", "vector": "CVSS:4.0/AV:A/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "content": "- 指针初始化和验证：开发者应该正确地初始化指针，并在使用指针之前进行有效的验证，确保指针不为空。在取消引用指针之前，应始终检查其是否为空。\r\n- 异常处理和错误恢复：程序应该具备健壮的异常处理和错误恢复机制，以便在发生空指针取消引用错误时能够适当地处理异常，而不是导致程序崩溃或暴露敏感信息。\r\n- 防御性编程：采用防御性编程的原则，如避免在未经验证的指针上进行操作，避免使用未初始化的指针等，以防止空指针取消引用错误的发生。\r\n- 静态代码分析和测试：使用静态代码分析工具和测试技术来检测和识别潜在的空指针取消引用错误。这些工具可以帮助发现代码中可能存在的空指针问题，并及时修复。\r\n- 强制性编码标准和最佳实践：制定强制性的编码标准和最佳实践，包括良好的指针使用和管理规范，以帮助开发者编写更可靠、安全的代码。", "title": "如何预防空指针取消引用"}], "cnvd_id": "", "cve_id": "CVE-2026-8619", "cvss": {"cvssv4": [{"source": "f23511db-6c3e-4e32-a477-6aa17d310630", "vector": "CVSS:4.0/AV:A/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:A/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-476", "description": "TP-Link TL-MR100、TL-MR150、TL-MR6400 与 Archer MR600 是 TP-Link 出品的 4G LTE 路由器，固件为闭源软件，用于移动网络接入并提供 Web 管理界面。\n受影响版本中，HTTP 服务在处理异常请求条件时存在空指针解引用缺陷。相邻网络中的未认证攻击者可发送异常 HTTP 请求，使 HTTP 服务进程崩溃，造成 Web 管理界面及依赖 HTTP 的功能暂时不可用。\n修复版本中通过更新固件修正 HTTP 服务对异常请求条件的处理，阻断空指针解引用导致的进程崩溃，恢复 Web 管理界面可用性。", "effects": [{"comp_name": "Archer MR600 v2", "ecosystem": "linux", "versions": [{"affected_version": "[[, Archer MR600(EU)_V2_1.10.0 Build 260618),+∞)", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "TL-MR100 v3.2", "ecosystem": "linux", "versions": [{"affected_version": "[[, TL-MR100(EU)_V3.20_1.3.0 Build 260609 Rel.49957n),+∞)", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "TL-MR150 v3.2", "ecosystem": "linux", "versions": [{"affected_version": "[[, TL-MR150(EU)_V3.20_1.3.0 Build 260720 Rel.59727n),+∞)", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "TL-MR6400 v8.0", "ecosystem": "linux", "versions": [{"affected_version": "[[, TL-MR6400(EN)_V8_1.5.0 Build 260610 Rel.67978n),+∞)", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "空指针取消引用", "kind_en": "空指针取消引用", "last_modified_time": "2026-08-20", "level": "High", "mps_id": "MPS-o1kz-pwfh", "poc": false, "poc_url": [], "published_time": "2026-08-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-o1kz-pwfh", "name": "https://www.oscs1024.com/hd/MPS-o1kz-pwfh"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-8619", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-8619"}, {"url": "https://www.tp-link.com/en/support/download/archer-mr600/v2/#Firmware", "name": ""}, {"url": "https://www.tp-link.com/en/support/download/tl-mr100/v3.20/#Firmware", "name": ""}, {"url": "https://www.tp-link.com/en/support/download/tl-mr150/v3.20/#Firmware", "name": ""}, {"url": "https://www.tp-link.com/en/support/download/tl-mr6400/v8/#Firmware", "name": ""}, {"url": "https://www.tp-link.com/us/support/faq/5253/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "TP-Link路由器拒绝服务漏洞", "_translated": true, "_saved_at": "2026-08-20T05:24:27+00:00", "_first_saved_at": "2026-08-20T03:41:13+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-o1kz-pwfh"}, {"analysis_status": 0, "articles": [{"content": "- 条件竞争漏洞是由于程序中存在多个代码块同时访问同一个条件判断语句而导致的错误。在程序中，条件判断语句通常用于决定是否执行某些代码块。当一个程序有多个代码块同时访问同一个条件判断语句时，这些代码块可能会同时执行，从而导致程序执行结果出现不可预测的错误。", "title": "什么是竞争条件"}, {"content": "- 线程切换攻击：线程切换攻击是指攻击者通过利用竞争条件漏洞，使程序在执行时频繁切换线程，从而导致系统资源耗尽，最终实现拒绝服务攻击。\n- 内存泄漏攻击：内存泄漏攻击是指攻击者通过利用竞争条件漏洞，使得程序不断申请内存，但最终无法释放内存，从而导致内存泄漏，最终程序崩溃。\n- 缓存穿透攻击：缓存穿透攻击是指攻击者通过利用竞争条件漏洞，使得程序在访问缓存时，被缓存的数据并非当前最新的数据，从而攻击者可以获取到未更新的数据。\n- 指令重放攻击：指令重放攻击是指攻击者通过利用竞争条件漏洞，在程序执行时，将先前保存的指令序列重新执行，从而实现绕过某些验证，获取系统权限等攻击目的。\n", "title": "竞争条件常见的攻击方式"}, {"content": "- 使用互斥锁：在条件判断语句中，使用互斥锁来确保只有一个代码块能够访问变量。使用互斥锁可以提高程序的安全性和可靠性。\n- 使用条件封印：在条件判断语句中，将可能会修改变量的代码块封印起来，以确保这些代码块无法被其他代码块访问。\n- 使用条件过滤：在条件判断语句中，使用条件过滤来过滤掉那些不可能发生的条件判断语句。例如，对于一个包含多个条件判断语句的循环，可以只保留其中一个条件的判断，而将其他条件的判断语句过滤掉。\n- 使用性能优化：对于一些条件判断语句，可以使用性能优化来避免条件竞争的情况。例如，可以使用数组或链表等数据结构来存储条件判断语句中的变量，从而避免条件竞争的情况。", "title": "如何预防竞争条件"}], "cnvd_id": "", "cve_id": "CVE-2026-77638", "cvss": {"cvssv31": [{"source": "cve@mitre.org", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:C/C:H/I:H/A:L", "severity": "high", "base_score": 8.9}]}, "cvss_score": 8.9, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:C/C:H/I:H/A:L", "cwe": "CWE-362", "description": "0.4.9.11 之前的 Tor 很容易出现竞争状况，在适当的情况下，交汇点可能会成为中间人（冒充）客户端试图访问的洋葱服务。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "竞争条件", "kind_en": "使用共享资源并发执行且同步不正确（“竞争条件”）", "last_modified_time": "2026-08-21", "level": "High", "mps_id": "MPS-neih-lu31", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-neih-lu31", "name": "https://www.oscs1024.com/hd/MPS-neih-lu31"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-77638", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-77638"}, {"url": "https://gitlab.torproject.org/tpo/core/tor/-/raw/tor-0.4.9.11/ChangeLog", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-77638漏洞", "_translated": true, "_saved_at": "2026-08-20T22:20:08+00:00", "_first_saved_at": "2026-08-20T22:20:08+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-neih-lu31"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-77751", "cvss": {"cvssv4": [{"source": "5a6e4751-2f3f-4070-9419-94fb35b644e8", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:L/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:L/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-22", "description": "misp-stix 是开源 Python 库，提供 MISP 与 STIX 1/2 之间的双向转换能力，常被安全运营、威胁情报平台或分析工具嵌入以导入导出 MISP 事件。\n受影响版本中，STIX 2 导入与 MISP→STIX 2 导出两条路径都把外部 MISP object 名称直接传给 PyMISP 的对象模板解析机制；PyMISP 按 misp_objects_path/\u003cname\u003e/definition.json 拼接文件系统路径，而来自 STIX 2 自定义对象的 x_misp_name 与持久化在 MISP 事件中的 object.name 在进入该路径前没有任何分隔符或穿越校验。攻击者只需控制一份 STIX 2 bundle 或 MISP 事件，使其中 Custom Object 的 x_misp_name / Object.name 携带 ../ 等路径片段，模板解析就会逃出 MISP 模板目录，去读取进程可访问的任意 definition.json 并把其中的字段复制进转换后的对象，造成本地可访问文件内容的非预期泄露以及对象元数据/语义的篡改；导出侧还存在跨上下文放大风险，恶意名称会先随事件被持久化，再在更高权限进程导出时再次触发路径穿越。\n修复版本中通过新增 misp_stix_converter/tools/misp_object_templates.py 模块，引入 _TEMPLATE_NAME_REGEX（[A-Za-z0-9][A-Za-z0-9_-]*）对名称做严格白名单校验，任何不匹配的名称在到达 PyMISP 模板解析之前都被替换为通用的 unknown-template，原名称作为数据写入对象的 comment 并发出警告，从而切断了将不可信名称拼入模板路径的链路。", "effects": [{"comp_name": "misp-stix", "ecosystem": "pip", "versions": [{"affected_version": "(-∞,2026.7.8]", "min_fixed_version": "", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-08-21", "level": "High", "mps_id": "MPS-6kta-x2m7", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-6kta-x2m7", "name": "https://www.oscs1024.com/hd/MPS-6kta-x2m7"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-77751", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-77751"}, {"url": "https://github.com/MISP/misp-stix/commit/a0f54070", "name": ""}, {"url": "https://github.com/MISP/misp-stix/commit/a8b6808d", "name": ""}], "scope_influence": "", "tags": ["python", "开源"], "title": "misp-stix对象模板名称路径穿越漏洞", "_translated": true, "_saved_at": "2026-08-21T11:19:52+00:00", "_first_saved_at": "2026-08-21T11:19:52+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-6kta-x2m7"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-63038", "cvss": {}, "cvss_score": 8.8, "cvss_vector": "", "cwe": "CWE-89", "description": "Apache InLong 是开源的一站式海量数据集成框架，提供数据采集、汇聚与传输能力，其中 Manager 负责 Sink 配置并按需自动创建下游库表资源。\n受影响版本中，Manager 为 PostgreSQL、Greenplum 和 SQL Server Sink 构造 SQL 时，把攻击者可控的 dbName、tableName、schemaName 和 username 以字符串拼接写入语句。PostgreSQLSqlBuilder.buildCreateSchema 将 schemaName 与 user 直接拼进 CREATE SCHEMA ... AUTHORIZATION 语句且未做标识符校验，已登录用户通过 StreamSinkController.save 提交 Sink 请求后，恶意内容会随自动创建资源流程在下游数据库执行，造成 SQL 注入。\n修复版本中通过在 PostgreSQLSqlBuilder.buildCreateSchema、GreenplumSqlBuilder.buildCreateSchema 和 SQLServerSqlBuilder.buildCreateSchemaSql 拼接前，使用正则 ^[a-zA-Z0-9._]+$ 校验 schemaName 与 user，非法输入抛出 IllegalArgumentException，从而阻断恶意标识符进入 CREATE SCHEMA 语句。", "effects": [{"comp_name": "inlong", "ecosystem": "linux", "versions": [{"affected_version": "[2.0.0,2.4.0)", "min_fixed_version": "2.4.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "org.apache.inlong:manager-service", "ecosystem": "maven", "versions": [{"affected_version": "[2.0.0,2.4.0)", "min_fixed_version": "2.4.0", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-08-21", "level": "High", "mps_id": "MPS-c458-61b2", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.openwall.com/lists/oss-security/2026/08/20/12", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-63038", "name": ""}, {"url": "https://lists.apache.org/thread/79w0cfnkhs3hctv8yn861qx3qwlc3p37", "name": ""}, {"url": "https://github.com/apache/inlong/issues/12135", "name": ""}, {"url": "https://github.com/apache/inlong/pull/12136", "name": ""}, {"url": "https://github.com/apache/inlong/commit/3af0ea97e88d1e91c364db829bc19a689fc4af6c", "name": ""}, {"url": "https://inlong.apache.org", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "InLong SQL注入漏洞", "_transl 的存储资源，导致系统无法处理其他请求或存储新的数据。", "title": "拒绝服务常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对输入数据进行合理的验证和过滤，防止恶意输入导致资源消耗过高。\r\n- 实施资源限制：应用程序应该实施适当的资源限制策略，例如限制计算操作的时间或次数，限制内存使用量，限制并发连接数等，以防止资源被耗尽。\r\n- 异常处理与错误恢复：应用程序应该具备健壮的异常处理和错误恢复机制，以防止因意外错误导致资源泄漏或无法释放的情况。\r\n- 资源监控与警报：应用程序应该实施适当的资源监控和警报机制，及时发现异常的资源消耗情况，并采取相应的措施来应对。\r\n- 压力测试与性能优化：应用程序应该进行压力测试，以评估其在高负载情况下的性能，并进行必要的性能优化，以确保能够有效地处理大量请求而不耗尽资源。", "title": "如何预防拒绝服务"}], "cnvd_id": "", "cve_id": "CVE-2026-77755", "cvss": {"cvssv4": [{"source": "5a6e4751-2f3f-4070-9419-94fb35b644e8", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:L/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:L/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-400", "description": "misp-stix 是 MISP 项目维护的开源 Python 库，用于将 STIX 1 / STIX 2 威胁情报文档导入为 MISP 事件以及反向导出，本身不包含 LLM/AI 组件。\n受影响版本中，misp_stix_converter.misp_stix_converter 中 stix_1_to_misp 与 stix_2_to_misp 两条对外公开入口会把攻击者可控的 STIX 文件直接交给 load_stix1_package 或 load_stix2_file 进行解析。底层解析函数使用 sys.exit() 处理若干加载异常，由于 SystemExit 继承自 BaseException 而非 Exception，调用方 except Exception 的捕获无法拦截，一份格式异常的 STIX 文档就能让长时间运行的 importer 进程异常终止；同时解析前完全不对输入大小做限制，文档会被一次性读入并完整物化到内存（实测内存开销约为输入大小的 2 到 7 倍），攻击者只需提供足够大的 STIX 文件即可触发内存/CPU 资源耗尽，使导入服务降级或中断。\n修复版本中通过将所有 sys.exit() 调用替换为 STIXLoadingError、MissingSTIXContentError 等可被 except Exception 捕获的异常，并在 misp_stix_converter.tools.input_limits 模块中新增默认上限为 100 MB 的输入尺寸校验（调用方可通过 max_size 参数调整或传 0 关闭），STIX 1 路径额外在解析前通过 XMLPullParser 校验根元素是否为 STIXPackage，切断恶意文档触发进程终止或资源耗尽的路径。", "effects": [{"comp_name": "misp-stix", "ecosystem": "pip", "versions": [{"affected_version": "(-∞,2026.7.8]", "min_fixed_version": "", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_r  "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-77767", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "high", "base_score": 7.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-862", "description": "Reconmap 是一款开源渗透测试任务与报告管理平台，GitHub 仓库位于 reconmap/reconmap，由 C#/.NET 编写的 API (apps/api) 与前端组成，用于集中保存渗透测试项目、客户组织及最终报告内容。\n受影响版本中，apps/api/app/Program.cs 为所有 Controller 注册了回退授权策略，仅允许持有 administrator 角色的已认证用户访问，而 apps/api/app/Controllers/ReportsController.cs 中的 PreviewReport action 显式标注了 [AllowAnonymous] 注解，使该 action 完全绕过回退授权策略。PreviewReport 通过 URL 路径段中的 id 加载对应 Project 记录，再通过 Project.ClientId 关联加载 Organisation 记录，并将二者渲染进 default-report-template.html，输出项目名、项目描述以及客户组织的名称、地址和 URL，整个流程没有任何认证、项目成员或角色校验。由于 id 是 projects 表的自增主键，未经认证的远程攻击者只需遍历顺序 id 即可获取实例上每一个项目的渗透测试任务详情及对应客户组织信息，针对不存在 id 返回 404 还泄露了有效项目 id 的存在性。Reconmap 用于存储渗透测试任务，任务描述与客户组织资料天然敏感。\n修复版本中通过移除 ReportsController.PreviewReport 上的 [AllowAnonymous] 注解，使其恢复继承回退授权策略，仅持有 administrator 角色的已认证用户才能访问该 endpoint，切断了对项目与客户组织信息的未授权读取链路，配套修复 commit 为 2b2eb0cf0aa95726b4edd0045f86d2dcdb8de34d。", "effects": [{"comp_name": "reconmap", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,3.2.2]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-08-21", "le _requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "对数据真实性的验证不充分", "kind_en": "数据真实性验证不足", "last_modified_time": "2026-08-21", "level": "High", "mps_id": "MPS-m07b-cn5e", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-m07b-cn5e", "name": "https://www.oscs1024.com/hd/MPS-m07b-cn5e"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-66787", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-66787"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-66787", "name": ""}, {"url": "https://bugzilla.redhat.com/show_bug.cgi?id=2507532", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-66787漏洞", "_translated": true, "_saved_at": "2026-08-20T20:21:34+00:00", "_first_saved_at": "2026-08-20T20:21:34+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-m07b-cn5e"}, {"analysis_status": 0, "articles": [{"content": "跨界内存读是指应用程序在读取内存时，未正确验证或限制读取的内存范围。攻击者利用这种漏洞可以读取应用程序内存中的敏感数据，如密码、加密密钥、会话令牌等。常见的原因是由于缓冲区溢出、格式化字符串漏洞或其他内存错误导致的。", "title": "什么是越界读取"}, {"content": "攻击者可以通过不当构造的输入来触发跨界内存读漏洞。攻击者可能会通过向应用程序发送特定的输入，使其读取超过预期的内存区域。攻击者可以利用这个漏洞来获取敏感信息，如其他用户的数据、操作系统的敏感数据或应用程序的内部状态。", "title": "越界读取常见的攻击方式"}, {"content": "- 输入验证和限制：应用程序应对所有输入数据进行严格的验证和限制。确保输入数据的长度、格式和内容符合预期，避免超出缓冲区或访问非预期的内存区域。\n- 内存安全编程实践：开发人员应使用安全的编程实践，如避免使用不安全的函数、正确处理内存分配和释放操作，以及遵循最小特权原则。\n- 使用安全的编程语言和库：选择使用安全性较高的编程语言和库，这些语言和库在内存管理和安全性方面提供了更多的保护机制。\n- 定期进行代码审查和安全测试：定期审查应用程序的代码，并进行安全测试，以发现潜在的跨界内存读漏洞。使用静态代码分析工具和漏洞扫描工具来辅助检测和修复问题。\n- 实施防御性编程技术：应用程序应采用防御性编程技术，如使用随机化地址空间布局（ASLR）、堆栈保护机制（如堆栈溢出保护）和数据执行预防（DEP）等。\n- 及时更新和修补：及时应用程序和操作系统的安全更新和补丁，以确保已知的跨界内存读漏洞得到修复。及时更新相关软件和库，以避免使用已知存在漏洞的版本。", "title": "如何预防越界读取"}], "cnvd_id": "", "cve_id": "CVE-2026-76641", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4 php", "开源"], "title": "Prospero Flow CRM 交易API 越权读取漏洞", "_translated": true, "_saved_at": "2026-08-21T14:28:17+00:00", "_first_saved_at": "2026-08-21T13:40:31+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-scj9-4gun"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-77814", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "high", "base_score": 7.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-22", "description": "Infinite Image Browsing 是开源 Python 扩展，作为 Stable Diffusion WebUI 的脚本插件运行，用于浏览和管理生成的图像文件，并通过 FastAPI 暴露受访问控制保护的 HTTP 接口。\n受影响版本中，scripts/iib/api.py 中闭包函数 is_path_trusted 在遍历 mem[\"all_scanned_paths\"] 中的允许父目录时，对每个允许路径使用 path.startswith(parent_path) 判断请求路径是否被允许，但未在 parent_path 后追加路径分隔符。当配置的允许目录是 /data/images 时，请求 /data/images_private/secret.txt 会因前缀字符串匹配而通过校验，绕过既有的路径隔离并由同文件中的 get_file 路由通过 FileResponse 返回任意可读文件。是否真正进入这一危险分支由 scripts/iib/tool.py 的 get_enable_access_control 决定：环境变量 IIB_ACCESS_CONTROL 等于 enable 时强制启用、等于 disable 时强制关闭，否则只有宿主 Stable Diffusion WebUI 以 --share、--ngrok、--listen 或 --server_name 启动时才启用，因此影响集中在网络暴露的 WebUI 部署。\n修复版本中通过将判定改为 path.startswith(parent_path + os.sep) 并在循环内先用 os.path.realpath 解析父目录符号链接/真实路径，从而只把真正位于允许父目录之下的路径视为可信；同时将 scripts/iib/tool.py 中 to_abs_path 由 os.path.normpath 切换为 os.path.realpath，确保请求路径在比较前同样完成符号链接解析，彻底切断前缀字符串碰撞的越权读取链路。", "effects": [{"comp_name": "infinite-image-browsing", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.8.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-08-22", "level": "High", "mps_id": "MPS-u4wl-szky", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-u4wl-szky", "name": "https://www.oscs1024.com/hd/MPS-u4wl-szky"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-77814", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-77814"}, {"url": "https://github.com/zanllp/infinite-image-browsing", "name": ""}, {"url": "https://github.com/zanllp/infinite-image-browsing/blob/v1.8.0/scripts/iib/api.py#L329-L344", "name": ""}, {"url": "https://github.com/zanllp/infinite-image-browsing/commit/4057a624c7a23a36f0b4dc6a545b40767d602450", "name": ""}, {"url": "https://github.com/zanllp/infinite-image-browsing/issues/968", "name": ""}, {"url": "https://github.com/zanllp/infinite-image-browsing/pull/969", "name": ""}, {"url": "https://www.vulncheck.com/advisories/infinite-image-browsing-is-path-trusted-prefix-comparison-omits-the-trailing-path-separator", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Infinite Image Browsing 路径穿越漏洞", "_translated": true, "_saved_at": "2026-08-21T17:22:42+00:00", "_first_saved_at": "2026-08-21T16:25:14+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-u4wl-szky"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-76612", "cvss": {"cvssv4": [{"source": "security@joomla.org", "vector": "CVSS:4.0/AV:N
