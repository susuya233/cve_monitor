ndSetting::renderCss() 将未过滤的 CSS 写入后台布局 modules/backend/layouts/_custom_styles.php 的 style 标签。LESS 的 ~\"...\" 转义可输出 \u003c/style\u003e\u003cscript\u003e 闭合样式块，并在每张后台页面执行脚本。\n修复版本中通过在 BrandSetting::renderCss() 对编译结果调用 strip_tags()，剥离 HTML 与脚本标签后再输出，切断存储型 XSS 链路。", "effects": [{"comp_name": "winter/wn-backend-module", "ecosystem": "composer", "versions": [{"affected_version": "(-∞,1.2.13)", "min_fixed_version": "1.2.13", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-08-19", "level": "High", "mps_id": "MPS-qmpv-ifek", "poc": false, "poc_url": [], "published_time": "2026-08-27", "reference_url_list": [{"url": "https://github.com/wintercms/winter/security/advisories/GHSA-v7cf-8gh9-gxmj", "name": ""}, {"url": "https://github.com/wintercms/winter/commit/d28f0b9474af79cfaa80eeb9d691f7a7c4469720", "name": ""}, {"url": "https://github.com/advisories/GHSA-v7cf-8gh9-gxmj", "name": ""}], "scope_influence": "", "tags": ["php", "开源"], "title": "Winter CMS存储型XSS", "_translated": true, "_saved_at": "2026-08-26T18:53:56+00:00", "_first_saved_at": "2026-08-26T18:53:56+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-qmpv-ifek"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-77652", "cvss": {"cvssv31": [{"source": "patrick@puiterwijk.org", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "cwe": "CWE-122", "description": "A heap-based buffer overflow vulnerability exists in the Dia diagram editor WPG file format importer.\n\nIn plug-ins/wpg/wpg-import.c, the WPG import renderer allocates a fixed palette with:\n\n    ren-\u003epPal = g_new0(WPGColorRGB, 256);\n\nWhen handling a WPG_COLORMAP record, the parser reads a start index (i16) and number of colors (iNum16) from the file and reads palette data with:\n\n    bRet \u0026= (iNum16 == (int)fread(\u0026ren-\u003epPal[i16], sizeof(WPGColorRGB), iNum16, f));\n\nThe only bounds-related check is `if (i16 \u003e= 0 \u0026\u0026 i16 \u003c= iSize)`, where iSize is the WPG record size—not the palette capacity. There is no validation that i16 is less than 256 or that i16 + iNum16 does not exceed 256.\n\nA malicious WPG file can supply i16=256 and iNum16=264. That causes fread() to write 792 bytes starting at \u0026pPal[256], while the palette buffer is only 768 bytes (256 entries × 3 bytes). This overflows into adjacent heap metadata and can crash Dia (SIGABRT / malloc corruption errors) or, depending on heap layout and exploit primitives, potentially lead to arbitrary code execution.\n\nExploitation requires convincing a user to open a crafted WPG file via Dia's file dialog, command line, or file association. No special privileges are required to deliver the file to the victim.\n\nAffected component: WPG parser (plug-ins/wpg/wpg-import.c).\nAffected versions: all Dia versions containing this code path (reporter tested Dia 0.98+git20260221-1; issue present on upstream master as of 2026-08-21).", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "堆缓冲区溢出", "kind_en": "基于堆的缓冲区溢出", "last_modified_time": "2026-08-27", "level": "High", "mps_id": "MPS-h4q2-9epf", "poc": false, "poc_url": [], "published_time": "2026-08-27", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-h4q2-9epf", "name": "https://www.oscs1024.com/hd/MPS-h4q2-9epf"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-77652", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-77652"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-77652", "name": ""}, {"url": "https://bugzilla.redhat.com/show_bug.cgi?id=2520884", "name": ""}, {"url": "https://gitlab.gnome.org/GNOME/dia/-/blob/master/plug-ins/wpg/wpg-import.c", "name": ""}, {"url": "https://gitlab.gnome.org/GNOME/dia/-/issues/580", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-77652漏洞", "_translated": true, "_saved_at": "2026-08-28T08:32:18+00:00", "_first_saved_at": "2026-08-26T21:33:53+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-h4q2-9epf"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-81576", "cvss": {"cvssv31": [{"source": "2fc02b1f-71e7-4514-a878-169626f68903", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:N/A:N", "severity": "high", "base_score": 7.7}]}, "cvss_score": 7.7, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:N/A:N", "cwe": "CWE-639", "description": "CodeMeter Runtime 是 WIBU-SYSTEMS AG 提供的闭源软件许可运行时，用于在本地或网络环境中管理、验证并提供软件许可证，也可作为网络许可证服务器运行。\n受影响版本中，当 CodeMeter Runtime 配置为服务器时，会为每个连接签发会话句柄，并仅以密码学强度不足的 SID 作为唯一认证因素。攻击者可暴力猜测 SID、还原其他会话的句柄编号，并读取属于另一句柄的许可证信息。\n修复版本中通过官方安全更新纠正会话句柄认证，阻止攻击者凭借弱 SID 冒用其他会话句柄并读取其许可证信息；公开资料未披露更细粒度的源码修改。", "effects": [{"comp_name": "codemeter-runtime", "ecosystem": "linux", "versions": [{"affected_version": "[6.00,8.41a)", "min_fixed_version": "8.41a", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[9.00,9.10)", "min_fixed_version": "9.10", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "通过用户控制密钥绕过授权机制", "kind_en": "通过用户控制的密钥绕过授权", "last_modified_time": "2026-08-27", "level": "High", "mps_id": "MPS-anm4-wkds", "poc": false, "poc_url": [], "published_time": "2026-08-27", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-anm4-wkds", "name": "https://www.oscs1024.com/hd/MPS-anm4-wkds"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-81576", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-81576"}, {"url": "https://cdn.wibu.com/fileadmin/wibu_downloads/security_advisories/AdvisoryWIBU-103401.pdf", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "CodeMeter会话句柄越权", "_translated": true, "_saved_at": "2026-08-27T13:36:01+00:00", "_first_saved_at": "2026-08-27T13:36:01+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-anm4-wkds"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2026-79938", "cvss": {"cvssv31": [{"source": "security_alert@emc.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:L/I:H/A:L", "severity": "high", "base_score": 7.6}]}, "cvss_score": 7.6, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:L/I:H/A:L", "cwe": "CWE-287", "description": "Dell PowerProtect Cyber Recovery, versions prior to 20.3, contain an Improper Authentication vulnerability. A low privileged attacker with remote access could potentially exploit this vulnerability, leading to Unauthorized access.", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "身份验证不当", "kind_en": "认证不当", "last_modified "High", "mps_id": "MPS-gm8q-ltsc", "poc": false, "poc_url": [], "published_time": "2026-08-27", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-gm8q-ltsc", "name": "https://www.oscs1024.com/hd/MPS-gm8q-ltsc"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-81575", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-81575"}, {"url": "https://cdn.wibu.com/fileadmin/wibu_downloads/security_advisories/AdvisoryWIBU-103401.pdf", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "CodeMeter越界读取漏洞", "_translated": true, "_saved_at": "2026-08-27T13:36:04+00:00", "_first_saved_at": "2026-08-27T13:36:04+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-gm8q-ltsc"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-81035", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:H/A:H", "severity": "high", "base_score": 8.1}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:N/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:N/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-862", "description": "Midday 是面向自由职业者与小型团队的开源财务操作系统，提供发票、银行连接、文件对账与团队协作能力。\n受影响版本中，tRPC 过程 team.delete 只调用 hasTeamAccess 确认调用者位于 usersOnTeam 表中，该 helper 不读取 role 字段。同一路由里的 deleteMember、updateMember 会通过 getTeamMemberRole 拒绝非 owner，但删除路径未使用该检查。被邀请用户默认角色为 member，可提交 teamId 删除整个团队及团队范围内记录，并在删除前把已存储的银行连接令牌交给 delete-team 清理任务。\n修复版本中通过在 team.delete 中调用 getTeamMemberRole 并仅允许 owner 继续执行删除，使非 owner 请求返回 FORBIDDEN，阻断成员删除团队以及向 delete-team 任务提交银行连接令牌。截至本报告，官方仓库尚未合并该修复，也未发布修复版本。", "effects": [{"comp_name": "midday", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,51587319f26a0ffaa9dfccab1920373cb65689b7]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-08-27", "level": "High", "mps_id": "MPS-0vdn-tglf", "poc": false, "poc_url": [], "published_time": "2026-08-27", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-0vdn-tglf", "name": "https://www.oscs1024.com/hd/MPS-0vdn-tglf"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-81035", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-81035"}, {"url": "https://github.com/midday-ai/midday", "name": ""}, {"url": "https://github.com/midday-ai/midday/blob/e5f45ed0d49cdb34576373623c4579b72daa74c1/apps/api/src/trpc/routers/team.ts", "name": ""}, {"url": "https://github.com/midday-ai/midday/issues/890", "name": ""}, {"url": "https://www.vulncheck.com/advisories/midday-missing-owner-check-on-team-deletion", "name": ""}], "scope_influence": "", "tags": [], "tit d_time": "2026-08-27", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-7hc0-24g3", "name": "https://www.oscs1024.com/hd/MPS-7hc0-24g3"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-80183", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-80183"}, {"url": "https://launchpad.net/bugs/2154645", "name": ""}], "scope_influence": "", "tags": ["python", "开源"], "title": "Keystone角色分配越权", "_translated": true, "_saved_at": "2026-08-27T02:47:27+00:00", "_first_saved_at": "2026-08-27T02:47:27+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-7hc0-24g3"}, {"analysis_status": 0, "articles": [], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-35445", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:L/UI:N/VC:H/VI:L/VA:N/SC:H/SI:L/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:L/UI:N/VC:H/VI:L/VA:N/SC:H/SI:L/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-285", "description": "Winter CMS 是基于 Laravel 框架的开源 PHP 内容管理系统，其 composer 包 winter/wn-backend-module 提供后台管理控制器、AJAX handler 与基于 $publicActions / $requiredPermissions 的权限框架，是默认安装中承担后台功能的核心模块。\n受影响版本中，modules/backend/classes/Controller.php 的 run() 方法在处理表单 postback 分支时，直接读取 post('_handler') 并把它交由 runAjaxHandler() 执行，未按 on[A-Z][\\w+]* 模式对 handler 名称进行校验；而 modules/backend/controllers/Users.php 构造函数又会在 myaccount 路径下把 $requiredPermissions 置为 null，使得任意已登录的后端账号都能进入 Users 控制器。攻击者只需持有同一会话内的有效 CSRF token，提交 _handler=update_onDelete 等任意控制器方法名与攻击者可控的参数，即可调用 update_onDelete、update_onRestore、update_onUnsuspendUser、update_onManualPasswordReset 等特权方法，对其他用户记录执行删除、恢复、停用、密码重置等操作，从而越权篡改用户数据。\n修复版本中通过在 Controller::run() 的 postback 分支新增 validateHandlerName()，按与 AJAX 路径相同的 on[A-Z][\\w+]* 正则对 post('_handler') 进行校验，切断任意 controller 方法被直接调用的路径；同时把 myaccount 功能迁移到独立的 MyAccount 控制器，移除 Users 控制器中把 $requiredPermissions 置为 null 的条件，并在用户模型层对未授权写操作加上二次防御，确保即便 handler 校验被绕过也无法直接修改用户记录。", "effects": [{"comp_name": "winter/wn-backend-module", "ecosystem": "composer", "versions": [{"affected_version": "(-∞,1.2.13)", "min_fixed_version": "1.2.13", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权机制不恰当", "kind_en": "不当授权", "last_modified_time": "2026-08-27", "level": "High", "mps_id": "MPS-j5iu-org3", "poc": false, "poc_url": [], "published_time": "2026-08-27", "reference_url_list": [{"url": "https://github.com/wintercms/winter/security/advisories/GHSA-j5jq-cr68-v2xx", "name": ""}, {"url": "https://github.com/wintercms/winter/releases/tag/v1.2.13", "name": ""}, {"url": "https://github.com/advisories/GHSA-j5jq-cr68-v2xx", "name": ""}], "scope_influence": "", "tags": ["php", "开源"], "title": "Winter CMS 后台权限绕过漏洞", "_translated": true, "_saved_at": "2026-08-26T18:53:54+00:00", "_first_saved_at": "2026-08-26T18:53:54+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-j5iu-org3"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-81030", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:N", "severity": "medium", "base_score": 6.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-22", "description": "Mage AI 是开源数据管道平台，用于构建、运行和管理数据集成与转换流水线。\n受影响版本中，browser-items API 的 BrowserItemResource 将调用方提供的路径直接交给文件系统读写辅助函数，未调用同级 FileContentResource、FileResource 已使用的 ensure_file_is_in_project 做项目目录约束。持有 Viewer 角色的用户可向 GET /api/browser_items 传入 URL 编码的绝对路径，使 member 将解码后的 pk 交给 Item.get_content，读取服务器进程权限范围内的任意文件。默认配置 REQUIRE_USER_PERMISSIONS 为 False，该路由不会按角色权限模型限制这次读取。\n修复版本中通过在 BrowserItemResource 的 member、create、update 与 collection 入口增加 check_item_is_in_project，复用 ensure_file_is_in_project 拒绝项目目录之外的路径并返回 RESOURCE_INVALID。截至本报告编写时，官方尚未发布包含该修复的版本，公开补丁仍停留在未合并的 GitHub PR 6175。", "effects": [{"comp_name": "mage-ai", "ecosystem": "pip", "versions": [{"affected_version": "(-∞,0.9.79]", "min_fixed_version": "", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-08-27", "level": "High", "mps_id": "MPS-u1yv-0mrk", "poc": false, "poc_url": [], "published_time": "2026-08-27", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-u1yv-0mrk", "name": "https ommit/264a44defb5e438689c75679617f6edc4c038abc", "name": ""}, {"url": "https://www.vulncheck.com/advisories/dolibarr-9.0.0-through-23.0.4-path-traversal-via-emailcollector-attachment-filename", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Dolibarr附件路径穿越", "_translated": true, "_saved_at": "2026-08-27T23:27:44+00:00", "_first_saved_at": "2026-08-27T23:27:44+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-pn1w-6bhr"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": ttps://github.com/wallabag/android-app/blob/master/app/src/main/java/fr/gaulupeau/apps/Poche/events/EventProcessor.java", "name": ""}, {"url": "https://github.com/wallabag/android-app/blob/master/app/src/main/java/fr/gaulupeau/apps/Poche/service/workers/ArticleAsFileDownloader.java", "name": ""}, {"url": "https://github.com/wallabag/android-app/blob/master/app/src/main/java/fr/gaulupeau/apps/Poche/service/workers/ArticleUpdater.java", "name": ""}, {"url": "https://github.com/wallabag/android-app/blob/master/app/src/main/java/fr/gaulupeau/apps/Poche/ui/ReadArticleActivity.java", "name": ""}, {"url": "https://github.com/wallabag/wallabag/security/advisories/GHSA-q2g2-www6-wf5h", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "wallabag Android XSS", "_translated": true, "_saved_at": "2026-08-28T08:32:10+00:00", "_first_saved_at": "2026-08-28T08:32:10+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-z348-hslt"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-81728", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N", "severity": "high", "base_score": 8.1}], "cvssv4": [{"source": "disclosure@vulncheck.com", ss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "任意文件上传", "kind_en": "危险类型文件无限制上传", "last_modified_time": "2026-08-28", "level": "High", "mps_id": "MPS-lyk5-1vq2", "poc": false, "poc_url": [], "published_time": "2026-08-28", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-lyk5-1vq2", "name": "https://www.oscs1024.com/hd/MPS-lyk5-1vq2"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-18983", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-18983"}, {"url": "https://plugins.trac.wordpress.org/browser/one-user-avatar/trunk/includes/class-wp-user-avatar.php#L45", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/one-user-avatar/trunk/includes/class-wp-user-avatar.php#L546", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/one-user-avatar/trunk/includes/class-wp-user-avatar.php#L549", "name": ""}, {"url": "https://plugins.trac.wordpress.org/changeset/3659509/one-user-avatar/trunk/includes/class-wp-user-avatar.php", "name": ""}, {"url": "https://plugins.trac.wordpress.org/changeset?old_path=%2Fone-user-avatar/tags/2.5.4\u0026new_path=%2Fone-user-avatar/tags/2.5.5", "name": ""}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/f413b610-839a-4a93-aec5-b6566371ccb7?source=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "One User Avatar文件上传漏洞", "_translated": true, "_saved_at": "2026-08-28T08:32:18+00:00", "_first_saved_at": "2026-08-28T08:32:18+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-lyk5-1vq2"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-77365", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "cwe": "CWE-79", "description": "Optimole（插件目录名 optimole-wp）是开源 WordPress 图片优化插件，提供压缩、WebP/AVIF 转换、CDN 分发和懒加载能力。\n受影响版本中，REST 路由 optml/v1/optimizations 的 permission_callback 为 __return_true，Optml_Rest::optimizations() 读取参数 a（above_fold_images）后只截取前 6 项，未限制为数值 ID 即交给 Profile::store()，并以 array_fill_keys() 作为画像键保存。Profile::get_current_profile_html_comment() 使用默认 json_encode() 把画像写入 HTML 注释，无法转义标签与注释结束符，未认证攻击者可向 a 注入可闭合注释的脚本，使用户访问注入页面时执行。\n修复版本中通过在 optimizations() 内用 is_numeric 与 intval 过滤 a 参数，只保留整数图片 ID，并在 get_current_profile_html_comment() 以 JSON_HEX_TAG 与 JSON_HEX_AMP 编码 04ed-ff17-4e10-9224-64a674a40416?source=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "TranslatePress存储型XSS", "_translated": true, "_saved_at": "2026-08-28T08:32:16+00:00", "_first_saved_at": "2026-08-28T08:32:16+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-wfxu-ym5k"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-81729", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:H/A:N", "severity": "medium", "base_score": 6.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-863", "description": "Dolibarr 是开源 ERP/CRM 系统，提供客户、财务、库存与文档管理能力，并通过 REST API 对接第三方系统完成文档下载、上传和删除。\n受影响版本中，REST 接口 Documents::delete() 在处理 DELETE /api/index.php/documents 时，调用 dol_check_secure_access_document() 将 mode 参数设为 'read'，而同文件中会改写存储数据的 builddoc() 正确传入 'write'。仅持有 societe:lire 或 facture:lire 等模块读权限、不具备创建、写入、删除或管理员权限的认证 API 用户可通过校验，永久删除第三方文件、发票、订单、报价、项目文件和已生成 PDF，且没有恢复路径。\n修复版本中通过将 delete() 内 dol_check_secure_access_document() 的 mode 参数改为 'write'，使删除操作必须具备写权限，阻止只读用户进入文档删除路径。", "effects": [{"comp_name": "dolibarr_erp/crm", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,23.0.4)", "min_fixed_version": "23.0.4", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-08-28", "level": "High", "mps_id": "MPS-su1x-34pg", "poc": false, "poc_url": [], "published_time": "2026-08-28", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-su1x-34pg", "name": "https://www.oscs1024.com/hd/MPS-su1x-34pg"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-81729", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-81729"}, {"url": "https://github.com/Dolibarr/dolibarr", "name": ""}, {"url": "https://github.com/Dolibarr/dolibarr/blob/23.0.3/htdocs/api/class/api_documents.class.php#L1276", "name": ""}, {"url": "https://github.com/Dolibarr/dolibarr/commit/de1d7a623e98484cc71fe43e93fdd5cd796abee5", "name": ""}, {"url": "https://www.vulncheck.com/advisories/dolibarr-before-23.0.4-incorrect-authorization-on-rest-api-document-deletion", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Dolibarr文档删除越权", "_translated": true, "_saved_at": "2026-08-27T23:27:45+00:00", "_first_saved_at": "2026-08-27T23:27:45+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-su1x-34pg"}]}</script>
  <script>
    const payload = JSON.parse(document.getElementById("payload").textContent);
    const levelLabels = payload.level_labels || {};
    const items = payload.items || [];
    let filtered = items.slice();
    let activeId = null;

    const $ = (id) => document.getElementById(id);
    $("generatedAt").textContent = payload.generated_at || "-";
    $("retention").textContent = payload.retention_days ?? "-";
    $("cutoff").textContent = payload.cutoff_date || "-";
    $("count").textContent = String(payload.count ?? items.length);

    function levelClass(level) {
      const cn = levelLabels[level] || level || "";
      if (level === "Critical" || cn === "严重") return "crit";
      if (level === "High" || cn === "高危") return "high";
      return "other";
    }
    function levelText(level) {
      return levelLabels[level] || level || "-";
    }
    function esc(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }
    function scoreText(v) {
      if (v === null || v === undefined || v === "" || v === -1) return "-";
      return String(v);
    }

    function renderList() {
      const list = $("list");
      $("listCount").textContent = String(filtered.length);
      if (!filtered.length) {
        list.innerHTML = '<div class="empty">没有匹配项</div>';
        return;
      }
      list.innerHTML = filtered.map((it) => {
        const id = it.mps_id || it.cve_id;
        const active = id === activeId ? " active" : "";
        return `
          <button class="item${active}" data-id="${esc(id)}" type="button">
            <div class="item-top">
              <span class="cve">${esc(it.cve_id || it.mps_id || "-")}</span>
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
            </div>
            <div class="title">${esc(it.title || "-")}</div>
            <div class="item-foot">
              <span>CVSS ${esc(scoreText(it.cvss_score))}</span>
              <span>${esc(it.published_time || "-")}</span>
              ${it.poc ? "<span>POC</span>" : ""}
            </div>
          </button>`;
      }).join("");
      list.querySelectorAll(".item").forEach((btn) => {
        btn.addEventListener("click", () => selectById(btn.dataset.id));
      });
    }

    function refsHtml(it) {
      const refs = Array.isArray(it.reference_url_list) ? it.reference_url_list : [];
      const links = [];
      if (it._source_page) links.push({ url: it._source_page, name: "OSCS 详情" });
      if (it.cve_id) links.push({ url: `https://nvd.nist.gov/vuln/detail/${it.cve_id}`, name: "NVD" });
      refs.forEach((r) => {
        if (r && r.url) links.push({ url: r.url, name: r.name || r.url });
      });
      const seen = new Set();
      const uniq = [];
      for (const l of links) {
        if (seen.has(l.url)) continue;
        seen.add(l.url);
        uniq.push(l);
      }
      if (!uniq.length) return '<div class="box">无参考链接</div>';
      return `<div class="refs">${uniq.map((l) =>
        `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name || l.url)}</a>`
      ).join("")}</div>`;
    }

    function articlesHtml(it) {
      const arts = Array.isArray(it.articles) ? it.articles : [];
      if (!arts.length) return "";
      return `<div class="section"><h3>相关说明</h3>${arts.map((a) => `
        <div class="article">
          <h4>${esc(a.title || "说明")}</h4>
          <p>${esc(a.content || "")}</p>
        </div>`).join("")}</div>`;
    }

    function renderDetail(it) {
      const detail = $("detail");
      if (!it) {
        detail.innerHTML = '<div class="empty">暂无数据</div>';
        return;
      }
      const pocUrls = Array.isArray(it.poc_url) ? it.poc_url : [];
      detail.innerHTML = `
        <div class="d-head">
          <div>
            <h1 class="d-title">${esc(it.title || "-")}</h1>
            <div class="ids">
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
              <span class="chip">${esc(it.cve_id || "无 CVE")}</span>
              <span class="chip">${esc(it.mps_id || "-")}</span>
              ${it.poc ? '<span class="chip">有 POC</span>' : ""}
              ${it.exp ? '<span class="chip">有 EXP</span>' : ""}
            </div>
          </div>
          <div class="actions">
            ${it._source_page ? `<a class="btn" href="${esc(it._source_page)}" target="_blank" rel="noopener">OSCS</a>` : ""}
            ${it.cve_id ? `<a class="btn" href="https://nvd.nist.gov/vuln/detail/${esc(it.cve_id)}" target="_blank" rel="noopener">NVD</a>` : ""}
          </div>
        </div>
        <div class="grid">
          <div class="stat"><div class="k">CVSS</div><div class="v">${esc(scoreText(it.cvss_score))}</div></div>
          <div class="stat"><div class="k">向量</div><div class="v">${esc(it.cvss_vector || "-")}</div></div>
          <div class="stat"><div class="k">CWE</div><div class="v">${esc(it.cwe || "-")}</div></div>
          <div class="stat"><div class="k">类型</div><div class="v">${esc(it.kind || it.kind_en || "-")}</div></div>
          <div class="stat"><div class="k">公开</div><div class="v">${esc(it.published_time || "-")}</div></div>
          <div class="stat"><div class="k">利用成本</div><div class="v">${esc(it.exploit_requirement_cost || "-")}</div></div>
          <div class="stat"><div class="k">可利用性</div><div class="v">${esc(it.exploitability || "-")}</div></div>
          <div class="stat"><div class="k">修复建议</div><div class="v">${esc(it.fix_suggestion || "-")}</div></div>
        </div>
        <div class="section"><h3>描述</h3><div class="box">${esc(it.description || "无描述")}</div></div>
        ${it.scope_influence ? `<div class="section"><h3>影响范围</h3><div class="box">${esc(it.scope_influence)}</div></div>` : ""}
        ${pocUrls.length ? `<div class="section"><h3>POC 链接</h3><div class="refs">${pocUrls.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join("")}</div></div>` : ""}
        <div class="section"><h3>参考链接</h3>${refsHtml(it)}</div>
        ${articlesHtml(it)}
      `;
    }

    function selectById(id) {
      const it = filtered.find((x) => (x.mps_id || x.cve_id) === id) ||
                 items.find((x) => (x.mps_id || x.cve_id) === id);
      if (!it) return;
      activeId = it.mps_id || it.cve_id;
      renderList();
      renderDetail(it);
      const btn = document.querySelector(`.item[data-id="${CSS.escape(activeId)}"]`);
      if (btn) btn.scrollIntoView({ block: "nearest" });
      history.replaceState(null, "", "#" + encodeURIComponent(activeId));
    }

    function applyFilter(q) {
      const query = (q || "").trim().toLowerCase();
      filtered = !query ? items.slice() : items.filter((it) => {
        const blob = [
          it.cve_id, it.mps_id, it.title, it.kind, it.kind_en, it.cwe, it.description, it.level
        ].map((x) => String(x || "").toLowerCase()).join(" ");
        return blob.includes(query);
      });
      renderList();
      if (filtered.length) {
        const still = filtered.some((x) => (x.mps_id || x.cve_id) === activeId);
        selectById(still ? activeId : (filtered[0].mps_id || filtered[0].cve_id));
      } else {
        activeId = null;
        renderDetail(null);
      }
    }

    $("search").addEventListener("input", (e) => applyFilter(e.target.value));

    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement !== $("search")) {
        e.preventDefault();
        $("search").focus();
        return;
      }
      if (!filtered.length) return;
      const idx = filtered.findIndex((x) => (x.mps_id || x.cve_id) === activeId);
      if (e.key === "ArrowDown") {
        e.preventDefault();
        const next = filtered[Math.min(filtered.length - 1, Math.max(0, idx) + 1)];
        selectById(next.mps_id || next.cve_id);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        const prev = filtered[Math.max(0, idx - 1)];
        selectById(prev.mps_id || prev.cve_id);
      }
    });

    const hashId = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    if (hashId && items.some((x) => (x.mps_id || x.cve_id) === hashId)) {
      activeId = hashId;
      renderList();
      selectById(hashId);
    } else if (items.length) {
      selectById(items[0].mps_id || items[0].cve_id);
    } else {
      renderList();
      renderDetail(null);
    }
  </script>
</body>
</html>
