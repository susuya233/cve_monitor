b.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-522", "description": "GravitLauncher LaunchServer 是 GravitLauncher 项目中开源的 Java Minecraft 启动器服务端应用，提供客户端更新分发、文件下载、JWT 身份认证与 Web 管理接口，默认在 0.0.0.0:9274 端口监听。\n受影响版本中，FileServerHandler.channelRead0 在处理 Netty HttpServerCodec 解码后的 FullHttpRequest 时，先对 path 调用 Paths.get(...).normalize() 再通过 substring(1) 盲目去除首字符，假定请求目标必然以 '/' 开头。Netty 的 HttpServerCodec 会接受 decoderResult().isSuccess() 为 true 且不带前导斜杠的请求目标，导致原始 '..' 段无法被首次 normalize() 折叠；substring(1) 又把首段 '../' 转成 './'，剩余 '..' 通过 base.resolve(path) 被解析到 updatesDir 之外，且未对结果再次归一化校验 startsWith(base)，同时 file.isHidden() 仅校验末级路径名，使得远程未认证攻击者只需构造一条不带前导斜杠的 GET 请求即可读取进程可访问的任意文件，包括用于签署 JWT 的 .keys/ecdsa_id、.keys/legacySalt 与包含数据库凭证的 LaunchServer.json，导出签名密钥后可伪造任意账号（含管理员）的访问令牌。\n修复版本中通过在 channelRead0 中改为先取 basePath = base.toAbsolutePath().normalize()，再计算 resolved = basePath.resolve(path).toAbsolutePath().normalize()，并使用 !resolved.startsWith(basePath) 判断路径是否越界，越界则调用 sendError(ctx, FORBIDDEN) 直接返回，从根本上阻断路径遍历读取 updatesDir 之外的文件。", "effects": [{"comp_name": "GravitLauncher/LaunchServer", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,5.7.11]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "凭证保护不足", "kind_en": "凭证保护不足", "last_modified_time": "2026-09-18", "level": "Critical", "mps_id": "MPS-bifa-xv4q", "poc": false, "poc_url": [], "published_time": "2026-09-18", "reference_url_list": [{"url": "https://github.com/GravitLauncher/Launcher/security/advisories/GHSA-5g75-477j-2c2f", "name": ""}, {"url": "https://github.com/advisories/GHSA-5g75-477j-2c2f", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "GravitLauncher LaunchServer 路径  "title": "经典缓冲区溢出常见的攻击方式"}, {"content": "- 输入验证：在程序输入处对输入数据进行严格的验证和过滤，确保输入数据符合预期的格式和类型，避免被攻击者注入恶意命令或数据。可以使用正则表达式、格式字符串等方式进行输入验证。\n- 输出过滤：在程序输出处对输出数据进行严格的过滤和检查，确保输出数据符合预期的格式和类型，避免被攻击者截获和篡改。可以使用安全的输出过滤库等方式进行输出过滤。\n- 使用安全的编程模型：使用安全的编程模型，例如避免使用原生的缓冲区管理函数，使用安全的框架和库来处理输入数据和执行命令，避免缓冲区溢出漏洞。\n- 数据库加密和访问控制：对于敏感数据和命令，使用加密和访问控制措施，确保只有授权用户可以访问和执行命令，避免被攻击者窃取和篡改。\n- 定期更新和升级：定期更新和升级应用程序和库的版本，确保应用程序和库的最新版本包含了最新的安全补丁和修复措施，避免安全漏洞的出现和利用。\n- 安全审计和监控：定期对系统和应用程序进行安全审计和监控，及时发现和阻止潜在的安全漏洞和攻击，确保系统和数据的安全和可靠性。", "title": "如何预防经典缓冲区溢出"}], "cnvd_id": "", "cve_id": "CVE-2026-93740", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:N/AC:L/Au:N/C:C/I:C/A:C", "severity": "high", "base_score": 10}], "cvssv3": [{"source": "VulDB", "vector": "CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H/E:P/RL:X/RC:R", "severity": "critical", "base_score": 10}], "cvssv31": [{"source": "cna@vuldb.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 10}], "cvssv4": [{"source": "cna@vuldb.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-120", "description": "Totolink A3002MU Hh-B20211125.1046 中发现了一个漏洞。受影响的是文件 /boafrm/formWlEncrypt 的函数 formWlEncrypt。对参数submit-url 的操作会导致缓冲区溢出。可以远程发起攻击。该漏洞是公开可用的并且可能会被使用。", "effects": [{"comp_name": "A3002MU", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,Hh-B20211125.1046]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "经典缓 tream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "使用外部可控制的输入来选择类或代码（不安全的反射）", "kind_en": "使用外部控制输入来选择类或代码（“不安全反射”）", "last_modified_time": "2026-09-19", "level": "Critical", "mps_id": "MPS-vbdp-kg54", "poc": false, "poc_url": [], "published_time": "2026-09-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-vbdp-kg54", "name": "https://www.oscs1024.com/hd/MPS-vbdp-kg54"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-93762", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-93762"}, {"url": "https://jira.mongodb.org/browse/MONGOID-5973", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-93762漏洞", "_translated": true, "_saved_at": "2026-09-18T19:22:48+00:00", "_first_saved_at": "2026-09-18T19:22:48+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-vbdp-kg54"}, {"analysis_status": 0, "articles": [{"content": "应用程序在处理用户输入时的不完善或缺乏验证机制，所以攻击者能够通过向应用程序发送恶意输入，利用应用程序对输入数据的错误处理方式来注入自己的恶意代码。这些恶意代码会被应用程序误认为是合法的指令或数据，并在执行过程中被执行。", "title": "什么是代码注入"}, {"content": "应用程序使用可执行动态代码的函数来执行用户可控的参数，当应用程序对于用户输入过滤不完全时，攻击者可以注入恶意代码并控制代码执行流程。", "title": "代码注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对所有用户输入进行验证和过滤，确保只接受预期的有效输入。这包括对输入数据进行输入长度验证、类型检查和格式验证等。\r\n- 使用参数化查询或预编译语句：对于数据库查询操作，应该使用参数化查询或预编译语句，确保输入数据不会被误认为是执行代码。\r\n- 最小特权原则：应用程序在执行操作系统命令或动态代码时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。\r\n- 安全编码实践：开发人员应该采用安全编码实践，包括避免使用eval函数、避免拼接用户输入的字符串作为代码执行等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止代码注入攻击。", "title": "如何预防代码注入"}], "cnvd_id": "", "cve_id": "CVE-2026-89274", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N", "severity": "critical", "base_score": 9.1}]}, "cvss_score": 9.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N", "cwe": "CWE-94", "description": "WordPress 的 WP Recipe Maker 插件在 10.8.1 及之前的所有版本中都容易受到任意短代码执行的攻击。该漏洞的存在是因为“WPRM_Metadata::sanitize_metadata()”在配方结构化元数据数组的每个标量字段上递归调用“do_shortcode()”（包括“reviewBody”字段，该字段是从已批准的“wprm-comment- rating”评论的“comment_content”逐字填充的），而在执行前没有清理或剥离短代码令牌；随后的“wp_strip_all_tags()”和“strip_shortcodes()”调用仅在执行完全发生后对输出字符串进行操作，不提供针对服务器端短代码调用的保护。这使得未经身份验证的攻击者可以在每个菜谱页面渲染上在服务器端执行任意注册的 WordPress 短代码，从而导致短代码输出（例如附件标题、私人帖子字段或安装的短代码公开的其他数据）嵌入到页面的 JSON-LD“reviewBody”元数据中，并向加载菜谱页面的所有访问者公开。成功利用该漏洞需要攻击者的评级评论通过自动批准或审核者操作来通过网站的评论批准阈值，然后注入的短代码开始在页面加载时执行。", "effects": [{"comp_name": "WP Recipe Maker", "ecosystem": "linux", "versions": [{"affected_version": "(0,10.8.1]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "代码注入", "kind_en": "代码生成控制不当（“代码注入”）", "last_modified_time": "2026-09-19", "level": "Critical", "mps_id": "MPS-xys3-842w", "poc": false, "poc_url": [], "published_time": "2026-09-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-xys3-842w", "name": "https://www.oscs1024.com/hd/MPS-xys3-842w"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-89274", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-89274"}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/d6ad49ff-85eb-4d05-ba23-51d89695add3?source=cve", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/wp-recipe-maker/tags/10.8.1/includes/public/class-wprm-metadata.php#L553", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/wp-recipe-maker/tags/10.8.1/includes/public/class-wprm-metadata.php#L1028", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/wp-recipe-maker/tags/10.8.1/includes/public/class-wprm-metadata.php#L181", "name": ""}, {"url": "https://plugins.trac.wordpress.org/changeset?reponame=\u0026old=3699793%40wp-recipe-maker\u0026new=3699793%40wp-recipe-maker", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-89274漏洞", "_translated": true, "_sa ://www.oscs1024.com/hd/MPS-yrv3-coja", "name": "https://www.oscs1024.com/hd/MPS-yrv3-coja"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-92229", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-92229"}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/7c28869c-c880-4322-9f17-09495a08576e?source=cve", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/forminator/tags/1.57.2/library/modules/quizzes/front/front-action.php#L870", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/forminator/tags/1.57.2/library/modules/quizzes/front/front-action.php#L837", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/forminator/tags/1.57.2/library/modules/quizzes/front/front-action.php#L60", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/forminator/tags/1.57.2/library/abstracts/abstract-class-front-action.php#L127", "name": ""}, {"url": "https://plugins.trac.wordpress.org/changeset?reponame=\u0026old=3700724%40forminator\u0026new=3700724%40forminator", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-92229漏洞", "_translated": true, "_saved_at": "2026-09-19T14:06:43+00:00", "_first_saved_at": "2026-09-19T05:24:19+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-yrv3-coja"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-61599", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:L/VI:H/VA:L/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:L/VI:H/VA:L/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-470", "description": "djust 为 Django 提供 Phoenix LiveView 风格的反应式服务器端渲染，并具有 Rust 驱动的性能。在版本 1.0.7 之前，调整实时传输通过调用“__import__(module_path, ...)”将 LiveView 解析为从客户端提供的点路径安装。在框架检查解析的对象是否为“LiveView”子类之前以及在任何按视图身份验证之前，导入模块 - 运行其顶级代码（导入副作用）。应包含此内容的“LIVEVIEW_ALLOWED_MODULES”白名单是失败开放的（“if allowed_modules:”——在未设置设置时跳过，框架默认）并使用松散的“startswith”匹配。因此，未经身份验证的 WebSocket 客户端（WS 握手不需要身份验证；每个视图身份验证仅在导入 + 实例化之后运行）可以发送带有 `view = \"\u003cany.importable.module\u003e.AnyName\"` 的 `mount` / `live_redirect_mount` / `url_change` 框架（或 SSE 安装），并导致服务器按名称导入并执行任何可导入 Python 模块的顶级代码。版本 1.0.7 修复了故障关闭解析门的问题（`djust._view_resolution.is_view_import_allowed`）：客户端视图路径仅在以下情况下解析：(a) 其模块已加载（`sys.modules` - 因此解析不会运行新代码；URLconf 在启动时加载的 URL 路由视图继续以零配置工作）或 (b) 它与模块段边界上的 `LIVEVIEW_ALLOWED_MODULES` 匹配（显式选择加入延迟导入的视图）。该门在所有三个接收器的“__import__”之前运行（+“_instantiate_view”内部的纵深防御）。作为解决方法，请将“LIVEVIEW_ALLOWED_MODULES”设置为包含可安装 LiveView 类的模块的狭窄列表。 （注意：预修补允许列表是“startswith”匹配的，并且导入仍然先于子类检查，因此这是缓解措施，而不是完整的修复。）", "effects": [{"comp_name": "djust", "ecosystem": "pip", "versions": [{"affected_version": "(-∞,1.0.7)", "min_fixed_version": "1.0.7", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "使用外部可控制的输入来选择类或代码（不安全的反射）", "kind_en": "使用外部控制输入来选择类或代码（“不安全反射”）", "last_modified_time": "2026-09-17", "level": "High", "mps_id": "MPS-9qtc-zx0v", "poc": false, "poc_url": [], "published_time": "2026-09-17", "reference_url_list": [{"url": "https://github.com/djust-org/djust/security/advisories/GHSA-7prp-2623-8g45", "name": ""}, {"url": "https://github.com/djust-org/djust/releases/tag/v1.0.7", "name": ""}, {"url": "https://github.com/advisories/GHSA-7prp-2623-8g45", "name": ""}], "scope_influence": "", "tags": ["python", "开源"], "title": "djust 通过 WebSocket/SSE 视图安装路径导入未经身份验证的任意模块", "_translated": true, "_saved_at": "2026-09-17T01:01:19+00:00", "_first_saved_at": "2026-09-17T01:01:19+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-9qtc-zx0v"}, {"analysis_status": 0, "articles": [{"content": "由于应用程序或系统中存在敏感信息未经适当保护而被泄露给攻击者或未经授权的用户，这些敏感信息可能包括用户凭据、个人身份信息、敏感业务数据、系统配置信息等。信息暴露漏洞通常是由于设计、实施或配置错误引起的，例如不正确的访问控制、弱密码策略、缺乏加密、错误的日志处理等。", "title": "什么是未授权敏感信息泄露"}, {"content": "- 直接访问敏感信息：攻击者可以通过直接访问不正确配置或不受保护的资源来获取敏感信息，如通过公开可访问的URL、未经授权的文件目录访问等。\n- 越权访问：攻击者可能利用访问控制错误或不正确的权限配置来获取他们没有权限访问的敏感信息。\n- 错误信息披露：应用程序在错误处理过程中可能泄露敏感信息，例如将错误消息中的敏感数据返回给客户端或显示在日志文件中。\n- 信息泄露通过响应：攻击者可能利用应用程序在响应中不正确地包含敏感信息，如通过网页源代码、响应头部或响应消息体中的敏感数据。", "title": "未授权敏感信息泄露常见的攻击方式"}, {"content": "- 访问控制：确保只有经过授权的用户能够访问敏感信息，使用强大的身份验证和授权机制。\n- 数据加密：对于敏感信息，使用适当的加密算法对数据进行加密，包括数据传输和存储过程中的加密。\n- 错误处理和日志安全：正确处理错误情况，避免在错误消息中暴露敏感信息。同时，确保日志记录功能的安全性，避免将敏感信息记录在日志文件中。\n- 安全配置和最佳实践：遵循安全最佳实践，对应用程序、服务器和系统进行适当的配置，包括访问控制、权限管理、密码策略等。\n- 审计和监控：实施日志审计和监控机制，及时检测和响应任何异常活动或潜在的信息暴露事件。\n- 安全开发实践：在应用程序开发过程中，进行安全代码审查、漏洞扫描和安全测试，以及敏感信息的正确处理和保护。", "title": "如何预防未授权敏感信息泄露"}], "cnvd_id": "", "cve_id": "CVE-2026-92594", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "high", "base_score": 7.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-200", "description": "Craft CMS 5.0.0-RC1 到 5.11.0 之前的版本错误地授权了 GraphQL DraftCreator 和 revisionCreator 字段：这些字段仅在 elements.drafts:read / elements.revisions:read 范围上进行门控，而不是要求 Gql::canQueryUsers() (usergroups.*:read) 强制执行的用户数据范围，并且它们的解析器返回一个原始 User 元素，其电子邮件、用户名、fullName 和地址字段没有每个字段的授权。仅持有草稿或修订范围的客户端（包括操作员启用了具有这些范围的公共 GraphQL 模式时未经身份验证的客户端）因此可以获取所有草稿/修订创建者（通常是站点编辑和管理员）的电子邮件地址、用户名、全名和邮政地址。该问题已在 5.11.0 中修复。", "effects": [{"comp_name": "craft_cms", "ecosystem": "linux", "versions 于应用程序或系统中存在敏感信息未经适当保护而被泄露给攻击者或未经授权的用户，这些敏感信息可能包括用户凭据、个人身份信息、敏感业务数据、系统配置信息等。信息暴露漏洞通常是由于设计、实施或配置错误引起的，例如不正确的访问控制、弱密码策略、缺乏加密、错误的日志处理等。", "title": "什么是未授权敏感信息泄露"}, {"content": "- 直接访问敏感信息：攻击者可以通过直接访问不正确配置或不受保护的资源来获取敏感信息，如通过公开可访问的URL、未经授权的文件目录访问等。\n- 越权访问：攻击者可能利用访问控制错误或不正确的权限配置来获取他们没有权限访问的敏感信息。\n- 错误信息披露：应用程序在错误处理过程中可能泄露敏感信息，例如将错误消息中的敏感数据返回给客户端或显示在日志文件中。\n- 信息泄露通过响应：攻击者可能利用应用程序在响应中不正确地包含敏感信息，如通过网页源代码、响应头部或响应消息体中的敏感数据。", "title": "未授权敏感信息泄露常见的攻击方式"}, {"content": "- 访问控制：确保只有经过授权的用户能够访问敏感信息，使用强大的身份验证和授权机制。\n- 数据加密：对于敏感信息，使用适当的加密算法对数据进行加密，包括数据传输和存储过程中的加密。\n- 错误处理和日志安全：正确处理错误情况，避免在错误消息中暴露敏感信息。同时，确保日志记录功能的安全性，避免将敏感信息记录在日志文件中。\n- 安全配置和最佳实践：遵循安全最佳实践，对应用程序、服务器和系统进行适当的配置，包括访问控制、权限管理、密码策略等。\n- 审计和监控：实施日志审计和监控机制，及时检测和响应任何异常活动或潜在的信息暴露事件。\n- 安全开发实践：在应用程序开发过程中，进行安全代码审查、漏洞扫描和安全测试，以及敏感信息的正确处理和保护。", "title": "如何预防未授权敏感信息泄露"}], "cnvd_id": "", "cve_id": "CVE-2026-92916", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "high", "base_score": 7.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-200", "description": "Grav 是一个平面文件 CMS。在 Grav 1.7.0 到 1.7.53.2 以及 2.0.0 到 2.0.21 中，当启用调试器时（system.debugger.enabled: true，这不是默认值），Clockwork 探查器端点会在没有身份验证的情况下公开：InitializeProcessor::handleDebuggerRequest() 在引导过程中拦截任何包含 /__clockwork/ 的路径，并将其传递给 Debugger::debuggerRequest()，这不会执行任何用户操作查找、IP 限制或 Clockwork 身份验证器检查，并且还支持对整个存储的历史记录进行匿名分页。默认情况下，每个存储的记录都包含原始请求 cookie（包括 Grav 的会话 cookie，其值为 PHP 会话 id，允许攻击者恢复另一个用户的会话，包括经过身份验证的管理员的会话）、完整解析的请求正文（Grav 的登录表单发布数据[用户名]/数据[密码]，因此密码以明文形式存储，因为 Clockwork 的密码过滤器仅检查顶级密钥）以及站点的整个系统和插件配置，包括操作员保存的机密，例如 SMTP 凭据、第三方 API 密钥和许可证密钥。即使在审查时也会存储授权和 X-API-Token 标头：true。在 Grav 2.0 上，设置提供程序：debugbar 并不能避免该问题，因为 Grav 强制使用 Clockwork 提供程序来处理更喜欢 JSON 响应的请求。该问题已在 1.7.53.4 和 2.0.22 中得到修复，它们将 /__clockwork/ 限制为服务器本地请求或提供新 system.debugger.token 密钥的请求，并从存储的记录中删除 cookie 和凭证标头。解决方法包括在 Web 服务器或 CDN 上设置 debugger.enabled: false 或阻止 /__clockwork/。", "effects": [{"comp_name": "grav", "ecosystem": "linux", "versions": [{"affected_version": "[2.0.0,2.0.21]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "未授权敏感信息泄露", "kind_en": "向未经授权的行为者泄露敏感信息", "last_modified_time": "2026-09-17", "level": "High", "mps_id": "MPS-x06o-tehc", "poc": false, "poc_url": [], "published_time": "2026-09-17", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-x06o-tehc", "name": "https://www.oscs1024.com/hd/MPS-x06o-tehc"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-92916", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-92916"}, {"url": "https://github.com/getgrav/grav/security/advisories/GHSA-q3ff-cj6v-rr5g", "name": "GitHub Security Advisory (GHSA-q3ff-cj6v-rr5g)"}, {"url": "https://www.vulncheck.com/advisories/grav-through-2.0.21-unauthenticated-information-disclosure-via-clockwork", "name": "VulnCheck Advisory: Grav through 2.0.21 Unauthenticated Information Disclosure via Clockwork"}], "scope_influence": "", "tags": ["应用软件"], "title": "Grav 至 2.0.21 通过 Clockwork 泄露未经身份验证的信息", "_translated": true, "_saved_at": "2026-09-17T12:57:15+00:00", "_first_saved_at": "2026-09-17T12:57:15+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-x06o-tehc"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-92716", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:N", "severity": fle through 2.2.1 API Key Reset Cross-Tenant Privilege Escalation"}], "scope_influence": "", "tags": ["应用软件"], "title": "2.2.1 API 密钥重置跨租户权限提升的随机播放", "_translated": true, "_saved_at": "2026-09-16T19:18:07+00:00", "_first_saved_at": "2026-09-16T19:18:07+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-1dvj-q5bc"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2026-92914", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N", "severity": "high", "base_score": 8.1}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-287", "description": "AVideo LoginControl 在 PGP 第二因素验证中包含身份验证绕过漏洞，该验证 行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-92816", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.5}]}, "cvss_score": 8.5, "cvss_vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-22", "description": "0.30.0之前的ComfyUI无法清理数据集保存节点中的folder_name输入，从而允许攻击者将文件写入输出目录之外的任意路径。攻击者可以加载精心设计的工作流程，将攻击者控制的内容写入任意位置，从而通过修改的启动文件或包初始值设定项启用代码执行。", "effects": [{"comp_name": "comfyui", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,0.30.0)", "min_fixed_version": "0.30.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-09-17", "level": "High", "mps_id": "MPS-7mdp-swve", "poc": false, "poc_url": [], "published_time": "2026-09-17", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-7mdp-swve", "name": "https://www.oscs1024.com/hd/MPS-7mdp-swve"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-92816", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-92816"}, {"url": "https://github.com/geo  {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-92604", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-92604"}, {"url": "https://github.com/geo-chen/oss/blob/main/scirius.md", "name": ""}, {"url": "https://github.com/StamusNetworks/scirius", "name": ""}, {"url": "https://github.com/StamusNetworks/scirius/blob/3bb49d383f4801b79e6356f9de9f25806afe0311/suricata/rest_api.py#L105-L113", "name": ""}, {"url": "https://www.vulncheck.com/advisories/scirius-through-3.8.0-arbitrary-file-write-via-pcap-upload", "name": "VulnCheck Advisory: Scirius through 3.8.0 Arbitrary File Write via PCAP Upload"}], "scope_influence": "", "tags": ["应用软件"], "title": "Scirius 至 3.8.0 通过 PCAP 上传任意文件写入", "_translated": true, "_saved_at": "2026-09-16T19:18:10+00:00", "_first_saved_at": "2026-09-16T19:18:10+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-68r5-17gt"}, {"analysis_status": 0, "articles": [{"content": "跨站点请求伪造 (CSRF)通过利用网站对用户请求的信任进行攻击。当用户在网站A登录并在同一浏览器会话中访问网站B时，攻击者可以构造特制的请求并诱使用户执行，以使网站B误以为这些请求是用户合法发起的。\n攻击者通常通过欺骗用户点击恶意链接、在受信任的网站中植入恶意代码或通过钓鱼等手段来实施CSRF攻击，一旦用户执行了恶意请求，攻击者可以以用户的身份执行任意操作，包括更改用户密码、发起资金转账或删除重要数据等。", "title": "什么是CSRF"}, {"content": "- 链接欺骗：攻击者通过向用户发送包含恶意链接的电子邮件或社交媒体消息，诱使用户点击并执行恶意请求。\n- 图片引用攻击：攻击者通过在恶意网站上包含指向目标网站的图片引用，以触发用户浏览器自动发送目标网站的请求。\n- XSS利用：如果目标网站存在XSS漏洞，攻击者可以注入恶意脚本，以使用户在浏览器中执行恶意请求。", "title": "CSRF常见的攻击方式"}, {"content": "- 随机令牌：网站可以在每个请求中包含一个随机生成的令牌（CSRF Token），并验证该令牌的有效性，以确认请求的来源是合法的。\n- SameSite Cookie：使用SameSite属性来限制跨站点请求，将Cookie的发送限制在同一站点上，减少了跨站请求伪造的风险。\n- 双重验证：对于敏感操作，网站可以要求用户进行额外的验证，例如输入验证码、提供第二个因素的身份验证等。\n- 强化浏览器策略：网站可以设置Content-Security-Policy（CSP）头，限制浏览器执行恶意脚本的能力，减少CSRF攻击的风险。\n- 限制用户操作：网站可以要求用户在执行敏感操作之前进行明确的确认或授权，防止恶意请求被误触发。\n- 安全编码实践：开发人员应遵循安全编码实践，对用户输入进行适当的验证和过滤，防止恶意请求的注入。", "title": "如何预防CSRF"}], "cnvd_id": "", "cve_id": "CVE-2026-92806", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:N/I:H/A:H", "severity": "high", "base_score": 8.1}], "cvssv4": [{"source": "disclosure@vulncheck.com", lity": "中", "fix_suggestion": "建议修复", "kind": "SSRF", "kind_en": "服务器端请求伪造 (SSRF)", "last_modified_time": "2026-09-17", "level": "High", "mps_id": "MPS-a2gt-owml", "poc": false, "poc_url": [], "published_time": "2026-09-17", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-a2gt-owml", "name": "https://www.oscs1024.com/hd/MPS-a2gt-owml"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-92804", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-92804"}, {"url": "https://github.com/NangoHQ/nango/security/advisories/GHSA-hgjm-c252-ccxx", "name": "GitHub Security Advisory (GHSA-hgjm-c252-ccxx)"}, {"url": "https://github.com/NangoHQ/nango/blob/v0.70.4/packages/shared/lib/utils/utils.ts", "name": "getConnectionConfig accepts any string value"}, {"url": "https://github.com/NangoHQ/nango", "name": ""}, {"url": "https://www.vulncheck.com/advisories/nango-through-0.70.4-server-side-request-forgery-via-configuration", "name": "VulnCheck Advisory: Nango through 0.70.4 Server-Side Request Forgery via Configuration"}], "scope_influence": "", "tags": ["应用软件"], "title": "Nango 通过 0.70.4 通过配置进行服务器端请求伪造", "_translated": true, "_saved_at": "2026-09-16T22:33:57+00:00", "_first_saved_at": "2026-09-16T22:33:57+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-a2gt-owml"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应 ": "缺少关键功能的身份验证", "last_modified_time": "2026-09-18", "level": "High", "mps_id": "MPS-5gb9-q62r", "poc": false, "poc_url": [], "published_time": "2026-09-18", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-5gb9-q62r", "name": "https://www.oscs1024.com/hd/MPS-5gb9-q62r"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-79954", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-79954"}, {"url": "https://fluidattacks.com/advisories/linkin", "name": ""}, {"url": "https://github.com/nasa/CryptoLib", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "NASA CryptoLib 1.5.0 - TC 接收路径接受来自错误 GVCID 的安全关联", "_translated": true, "_saved_at": "2026-09-18T02:42:50+00:00", "_first_saved_at": "2026-09-18T02:42:50+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-5gb9-q62r"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-86864", "cvss": {"cvssv31": [{"source": "f86ef6dc-4d3a-42ad-8f28-e6d5547a5007", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}], "cvssv4": [{"source": "f86ef6dc-4d3a-42ad-8f28-e6d5547a5007", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-88", "description": "pgAdmin 4 的备份工具将 /backup/job/\u003csid\u003e/object 请求中客户端提供的“数据库”字段作为裸尾位置参数附加到 pg_dump 参数向量，而无需进行验证。因为 pg_dump 使用 getopt_long 解析其选项，它会排列参数，所以以破折号开头的值被解释为选项而不是数据库名称。因此，像 --file=/absolute/path 这样的值会覆盖 pgAdmin 之前构建的存储受限的 --file，导致 pg_dump 将其输出写入 pgAdmin 进程可以写入的任何位置，即用户的文件管理器存储目录之外。当运行 pgAdmin 的操作系统帐户时，这会产生任意文件创建和覆盖，这可能会破坏 pgAdmin 自己的配置数据库，并且根据所选目标，进一步升级。\n\n同一字段还允许连接字符串注入。 libpq 将包含等号的数据库名称扩展为完整的连接字符串，其中嵌入的关键字会覆盖 pgAdmin 传递的 --host 和 --port ，因此诸如“host=attacker.example port=5432 dbname=x”之类的值将 pg_dump 重定向到攻击者选择的服务器。由于 pgAdmin 在执行该实用程序之前会导出 PGPASSWORD 环境变量中已解密的存储数据库密码，因此重定向的连接会将该凭据携带到攻击者指定的端点。任何持有 tools_backup 权限（授予默认用户角色）的经过身份验证的用户都可以访问这两种行为。\n\n该修复完全停止通过参数向量传递数据库名称，并将其提供在 PGDATABASE 环境变量中，libpq 将其视为文字数据库名称，并且从不扩展为连接字符串。这与导入/导出工具已使用的方法相匹配。回归测试断言构造的参数向量中不存在数据库名称，并且 PGDATABASE 携带准确的请求值。\n\n此问题影响 pgAdmin 4：源自 9.18 之前的备份工具中引入的尾随位置数据库参数。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "参数注入或修改", "kind_en": "命令中参数分隔符的不正确中和（“参数注入”）", "last_modified_time": "2026-09-18", "level": "High", "mps_id": "MPS-hk6w-evbl", "poc": false, "poc_url": [], "published_time": "2026-09-18", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-hk6w-evbl", "name": "https://www.oscs1024.com/hd/MPS-hk6w-evbl"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-86864", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-86864"}, {"url": "https://github.com/pgadmin-org/pgadmin4/issues/10384", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-86864漏洞", "_translated": true, "_saved_at": "2026-09-17T17:29:17+00:00", "_first_saved_at": "2026-09-17T17:29:17+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-hk6w-evbl"}, {"analysis_status": 0, "articles": [{"content": "由于整数类型的有限范围，在进行算术运算或操作时，结果可能超出类型的表示范围，导致溢出或环绕。溢出指的是结果超过了类型的最大值或小于了最小值，而环绕指的是结果绕回到类型的最小值或最大值。", "title": "什么是整数溢出或环绕"}, {"content": "- 缓冲区溢出：整数溢出可能导致缓冲区溢出漏洞。当整数溢出导致分配的缓冲区大小不足以容纳结果时，攻击者可以利用这个漏洞覆盖相邻的内存区域，执行恶意代码或篡改程序的状态。\r\n- 身份验证绕过：在进行身份验证或访问控制时，整数溢出可能导致绕过验证的漏洞。攻击者可以构造特殊的输入，使溢出的整数值绕过了预期的验证逻辑，从而获得未经授权的访问权限。\r\n- 数据篡改：整数溢出可能导致数据篡改漏洞。攻击者可以通过使整数溢出，修改计数器、索引或其他控制数据的值，导致程序在处理数据时发生错误或执行意外的操作。", "title": "整数溢出或环绕常见的攻击方式"}, {"content": "- 输入验证与限制：对用户输入的整数进行合理的验证和限制，确保其在允许的范围内。\r\n- 使用安全的整数操作函数：使用安全的整数操作函数，如`add_with_overflow()`、`sub_with_overflow()`、`mul_with_overflow()`等，这些函数会检查并处理溢出情况，确保计算结果在安全范围内。\r\n- 类型检查和转换：在进行整数运算或操作之前，进行类型检查和转换，确保操作数的类型和范围是合适的。\r\n- 强制性编码标准和最佳实践：制定强制性的编码标准和最佳实践，包括对整数运算和操作的规范和限制，以帮助程序员编写更可靠、安全的代码。\r\n- 静态代码分析和测试：使用静态代码分析工具和测试技术来检测和识别潜在的整数溢出问题。这些工具可以帮助发现代码中可能存在的溢出漏洞，并及时修复。", "title": "如何预防整数溢出或环绕"}], "cnvd_id": "", "cve_id": "CVE-2026-54571", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-190", "description": "ESPAsyncWebServer 是适用于 ESP32、ESP8266、RP2040 和 RP2350 的异步 HTTP 和 WebSocket 服务器库。在 3.11.1 之前，src/WebRequest.cpp 中的 multipart/form-data 解析器将 _boundaryPosition 存储为 8 位值，而 _parseMultipartPostByte 处理边界。包含恰好 256 字节多部分边界的远程请求将 _boundaryPosition 从 255 包装到零，防止边界解析循环终止，消耗过多的 CPU，并在受影响的 ESP32 或 ESP8266 设备上触发 FreeRTOS 看门狗重置。此问题已在版本 3.11.1 中修复。", "effects": [{"comp_name": "ESPAsyncWebServer", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,3.11.1)", "min_fixed_version": "3.11.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "整数溢出或环绕", "kind_en": "整数溢出或环绕", "last_modified_time": "2026-09-18", "level": "High", "mps_id": "MPS-q6g4-yuao", "poc": false, "poc_url": [], "published_time": "2026-09-18", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-q6g4-yuao", "name": "https://www.oscs1024.com/hd/MPS-q6g4-yuao"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-54571", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-54571"}, {"url": "https://github.com/ESP32Async/ESPAsyncWebServer/security/advisorie 库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-93426", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:L/A:N", "severity": "high", "base_score": 8.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:L/VA:N/SC:H/SI:L/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.4}]}, "cvss_score": 8.4, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:L/VA:N/SC:H/SI:L/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-89", "description": "0.142.0 之前的 SigNoz 版本 0.87.0 无法转义 v5 query_range API 中用户提供的遥测字段键名称，从而允许经过身份验证的用户注入 SQL。具有查看者或更高角色的攻击者可以在字段名称中嵌入反引号和引号来突破标识符和字符串文字，执行任意 ClickHouse SQL 来读取系统表并窃取数据。", "effects": [{"comp_name": "signoz", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,0.142.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(0.87.0,0.142.0)", "min_fixed_version": "0.142.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-09-18", "level": "High", "mps_id": "MPS-3jfx-5am1", "poc": false, "poc_url": [], "published_time": "2026-09-18", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-3jfx-5am1", "name": "https://www.oscs1024.com/hd/MPS-3jfx-5am1"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-93426", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-93426"}, {"url": "https://git y-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:H/A:L", "severity": "high", "base_score": 8.2}]}, "cvss_score": 8.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:H/A:L", "cwe": "CWE-345", "description": "libp2p 是 libp2p 网络堆栈的 JavaScript 实现。从8.0.0到12.0.24，packages/peer-store/src/index.ts中的@libp2p/peer-store使用consumePeerRecord来验证RecordEnvelope签名，但不要求签名有效负载中的PeerRecord.peerId等于RecordEnvelope.openAndCertify派生的签名者对等ID。 ExpectedPeer选项仅检查信封签名者，gossipsub Peer Exchange路径可以提供攻击者自己的peer ID作为expectedPeer。因此，攻击者可以使用攻击者的密钥签署记录，将受害者对等 ID 和攻击者控制的多地址放入有效负载中，并为受害者存储经过认证的地址。尽管连接升级仍会验证远程对等方身份并防止完全身份接管，但中毒地址可能会导致地址簿损坏、拨号重定向或故障、路由操纵和可达性中断。该问题已在版本 12.0.24 中修复。", "effects": [{"comp_name": "js-libp2p", "ecosystem": "linux", "versions": [{"affected_version": "[8.0.0,12.0.24)", "min_fixed_version": "12.0.24", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "对数据真实性的验证不充分", "kind_en": "数据真实性验证不足", "last_modified_time": "2026-09-18", "level": "High", "mps_id": "MPS-brnv-u0io", "poc": false, "poc_url": [], "published_time": "2026-09-18", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-brnv-u0io", "name": "https://www.oscs1024.com/hd/MPS-brnv-u0io"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-86039", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-86039"}, {"url": "https://github.com/libp2p/js-libp2p/security/advisories/GHSA-vrf4-mx87-p53w", "name": "https://github.com/libp2p/js-libp2p/security/advisories/GHSA-vrf4-mx87-p53w"}, {"url": "https://github.com/libp2p/js-libp2p/pull/3570", "name": "https://github.com/libp2p/js-libp2p/pull/3570"}, {"url": "https://github.com/libp2p/js-libp2p/commit/3bf5d395cbca1488eea6e87cd771e4613b661c30", "name": "https://github.com/libp2p/js-libp2p/commit/3bf5d395cbca1488eea6e87cd771e4613b661c30"}, {"url": "https://github.com/libp2p/js-libp2p/releases/tag/peer-store-v12.0.24", "name": "https://github.com/libp2p/js-libp2p/releases/tag/peer-store-v12.0.24"}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-86039漏洞", "_translated": true, "_saved_at": "2026-09-17T17:29:21+00:00", "_first_saved_at": "2026-09-17T17:29:21+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-brnv-u0io"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-54253", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:H/I:L/A:N", "severity": "high", "base_score": 8.2}]}, "cvss_score": 8.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:H/I:L/A:N", "cwe": "CWE-79", "description": "TS3 Manager 是用于维护 Teamspeak3 服务器的现代 Web 界面。在 2.2.6 之前，packages/server/routes/api.js 中的 /api/download 处理程序将攻击者控制的端口查询参数传递给 socket.connect(port, host) 并通过 res.status(400).send(error.message) 将生成的 error.message 作为 text/html 返回，而无需内容安全策略。当登录的操作员遵循精心设计的顶级链接时，反射值将在管理器源中执行。在packages/ui/src/store/modules/query.js 中设置的令牌cookie 缺少HttpOnly、Secure 和显式的SameSite 属性，允许脚本读取令牌并调用packages/server/socket.js 中的autofillform 事件。 autofillform 返回解码后的 JWT，包括明文 ServerQuery 密码，从而在操作员使用管理 ServerQuery 凭据时启用操作员会话劫持和对托管 TeamSpeak 服务器的控制。需要有效的操作员会话和用户交互。此问题已在 2.2.6 中修复。", "effects": [{"comp_name": "ts3-manager", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.2.6)", "min_fixed_version": "2.2.6", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-09-18", "level": "High", "mps_id": "MPS-qi7v-186p", "poc": false, "poc_url": [], "published_time": "2026-09-18", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-qi7v-186p", "name": "https://www.oscs1024.com/hd/MPS-qi7v-186p"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-54253", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-54253"}, {"url": "https://github.com/joni1802/ts3-manager/security/advisories/GHSA-3cgm-7p4g-gffj", "name": "https://github.com/joni1802/ts3-manager/security/advisories/GHSA-3cgm-7p4g-gffj"}, {"url": "https://github.com/joni1802/ts3-manager/commit/48df540786d2784c5d7b9bd55786d63e31288d07", "name": "https://github.com/joni1802/ts3-manager/commit/48df540786d2784c5d7b9bd55786d63e31288d07"}, {"url": "https://github.com/joni1802/ts3-manager/releases/tag/v2.2.6", "name": "https://github.com/joni1802/ts3-manager/releases/tag/v2.2.6"}], "scope_influence": "", "tags": ["应用软件"], "title": "TS3 Manager：通过 /api/download 端口参数反射的 XSS 窃取操作员会话", "_translated": true, "_saved_at": "2026-09-17T20:51:09+00:00", "_first_saved_at": "2026-09-17T20:51:09+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-qi7v-186p"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-89413", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:H/A:H", "severity": "high", "base_score": 8.1}]}, "cvss_score": 8.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:H/A:H", "cwe": "CWE-862", "description": "The Filter Gallery plugin for WordPress is vulnerable to authorization bypass in all versions up to, and including, 1.1.4. This is due to the plugin not properly verifying that a user is authorized to perform an action. This makes it possible for authenticated attackers, with subscriber-level access and above, to delete any arbitrary Filter Gallery records — including all associated filters, image mappings, settings, and details op "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:A/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-384", "description": "team-alembic ash_authentication 中的会话固定漏洞允许攻击者在受害者的浏览器中植入会话标识符，以便在受害者登录后保持经过身份验证的会话。\n\nAshAuthentication.Plug.Helpers.store_in_session/2 使用 Plug.Conn.put_session/3 将经过身份验证的主题写入现有会话，并且从不调用 Plug.Conn.configure_session(renew: true)，因此访问者到达时携带的标识符会带入其经过身份验证的会话。每个身份验证事件都会到达以下一个函数：AshAuthentication.Phoenix.Controller.__using__/1 注入的默认 success/4、mix ash_authentication_phoenix.install 发出的 AuthController 以及 Remember-me 自动登录。 AshAuthentication.Phoenix.Plug.store_in_session/2 是它的默认委托。注销也不会关闭窗口，因为clear_session/2以Plug.Conn.clear_session/1结尾，这会清除会话内容但保持标识符不变，因此植入的标识符可以在注销然后登录的循环中幸存下来。\n\n此问题影响 ash_authentication：从 4.15.0 之前的 0.2.0 到 5.0.0-rc.14 之前的 5.0.0-rc.0。", "effects": [{"comp_name": "ash_authentication", "ecosystem": "linux", "versions": [{"affected_version": "[0.2.0,4.15.0)", "min_fixed_version": "4.15.0", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[5.0.0-rc.0,5.0.0-rc.14)", "min_fixed_version": "5.0.0-rc.14", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "会话固定", "kind_en": "会话固定", "last_modified_time": "2026-09-18", "level": "High", "mps_id": "MPS-q3fx-aev2", "poc": false, "poc_url": [], "published_time": "2026-09-18", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-q3fx-aev2", "name": "https://www.oscs1024.com/hd/MPS-q3fx-aev2"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-86688", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-86688"}, {"url": "https://github.com/team-alembic/ash_authentication/security/advisories/GHSA-v577-944g-7h3x", "name": "GitHub Advisory"}, {"url": "https://cna.erlef.org/cves/CVE-2026-86688.html", "name": "EEF CNA record for CVE-2026-86688"}, {"url": "https://osv.dev/vulnerability/EEF-CVE-2026-86688", "name": "OSV record EEF-CVE-2026-86688"}, {"url": "https://github.com/team-alembic/ash_authentication/commit/a939dde9b917c072cdf10c4b0913a9886a4b0231", "name": "Introducing commit a939dde in team-alembic/ash_authentication"}, {"url": "https://github.com/team-alembic/ash_authentication/commit/872db454405ecad4fcdabd9ff3d8755d1d6a69ae", "name": "Fix commit 872db45 in team-alembic/ash_authentication"}, {"url": "https://github.com/team-alembic/ash_authentication/commit/3e1d452cbf1564e87f5f97be882b66fe25af7cfa", "name": "Fix commit 3e1d452 in team-alembic/ash_authentication"}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-86688漏洞", "_translated": true, "_saved_at": "2026-09-17T23:19:15+00:00", "_first_saved_at": "2026-09-17T23:19:15+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-q3fx-aev2"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-87915", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "cwe": "CWE-79", "description": "Popup Maker – 使用适用于 WordPress 的 Ultimate WP Popup Builder 插件提高销售、转化、选择和订阅者在 1.24.0 及之前的所有版本中，由于输入清理和输出转义不足，容易受到通过 value[Name] 参数存储的跨站点脚本攻击。这使得未经身份验证的攻击者可以在页面中注入任意 Web 脚本，每当用户访问注入的页面时就会执行这些脚本。在这种情况下，应用于输出的 wp_kses 清理是不够的，因为允许的属性值内的 HTML 实体在规范化中完好无损，并且稍后在单击上下文帮助选项卡锚点时由 wp-admin/js/common.js 中的 jQuery(link.attr('href')) 接收器进行评估。", "effects": [{"comp_name": "Popup Maker – Boost Sales, Conversions, Optins, Subscribers with the Ultimate WP Popup Builder", "ecosystem": "linux", "versions": [{"affected_version": "(0,1.24.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-09-18", "level": "High", "mps_id": "MPS-ib1n-alpc", "poc": false, "poc_url": [], "published_time": "2026-09-18", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ib1n-alpc", "name": "https://www.oscs1024.com/hd/MPS-ib1n-alpc"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-87915", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-87915"}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/ea8b1eee-2e3f-4d61-b815-4ea0aaa188b5?source=cve", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/popup-maker/tags/1.24.0/classes/Admin/Subscribers/Table.php#L281", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/popup-maker/tags/1.24.0/classes/ListTable.php#L1408", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/popup-maker/tags/1.24.0/classes/Newsletters.php#L74", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/popup-maker/tags/1.24.0/classes/Newsletters.php#L273", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/popup-maker/tags/1.24.0/classes/Abstract/Database.php#L359", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/popup-maker/tags/1.24.0/classes/Newsletters.php#L59", "name": ""}, {"url": "https://plugins.trac.wordpress.org/changeset?reponame=\u0026new=3690634%40popup-maker%2Ftags%2F1.25.0\u0026old=3648112%40popup-maker%2Ftags%2F1.24.0", "name": ""}, {"url": "https://plugins.trac.wordpress.org/changeset/3690634/popup-maker/trunk/classes/Admin/Subscribers/Table.php", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-87915漏洞", "_translated": true, "_saved_at": "2026-09-18T12:35:54+00:00", "_first_saved_at": "2026-09-18T12:35:54+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ib1n-alpc"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-54647", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-89", "description": "CubeCart 是一个电子商务软件解决方案。在 6.7.5 之前，admin/sources/settings.index.inc.php 直接将管理员控制的 download_expire POST 参数连接到 CubeCart_downloads 的原始 UPDATE 语句中，无需进行数字验证。经过身份验证的管理员可以提供一个逗号分隔的值来更改 SET 子句，因为 HTML 清理不会中和 SQL 语法，从而允许在应用程序的数据库权限内操作数据库列和潜在的其他数据。此问题已在版本 6.7.5 中修复。", "effects": [{"comp_name": "v6", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,6.7.5)", "min_fixed_version": "6.7.5", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-09-18", "level": "High", "mps_id": "MPS-km2t-bch8", "poc": false, "poc_url": [], "published_time": "2026-09-18", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-km2t-bch8", "name": "https://www.oscs1024.com/hd/MPS-km2t-bch8"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-54647", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-54647"}, {"url": "https://github.com/cubecart/v6/security/advisories/GHSA-hvmw-v8gc-4c29", "name": "https://github.com/cubecart/v6/security/advisories/GHSA-hvmw-v8gc-4c29"}, {"url": "https://github.com/cubecart/v6/commit/af7def4d279f7cefb23c1009a987737c16a105da", "name": "https://github.com/cubecart/v6/commit/af7def4d279f7cefb23c1009a987737c16a105da"}, {"url": "https://github.com/cubecart/v6/blob/6.7.5/admin/sources/release_notes/6.7.5.inc.php", "name": "https://github.com/cubecart/v6/blob/6.7.5/admin/sources/release_notes/6.7.5.inc.php"}, {"url": "https://github.com/cubecart/v6/releases/tag/6.7.5", "name": "https://github.com/cubecart/v6/releases/tag/6.7.5"}], "scope_influence": "", "tags": ["应用软件"], "title": "CubeCart：通过settings.index.inc.php中的download_expire参数进行SQL注入", "_translated": true, "_saved_at": "2026-09-17T23:19:32+00:00", "_first_saved_at": "2026-09-17T23:19:32+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-km2t-bch8"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "cnvd_id": "", "cve_id": "CVE-2026-92619", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-269", "description": "The Booking Calendar plugin for WordPress is vulnerable to Privilege Escalation in all versions up to, and including, 11.8.2 via the `wpbc_ajax_option_save` AJAX action. The vulnerability exists because the `handle_ajax_save()` function applies per-option safeguards only to names explicitly registered via `register_option_policy()`, causing `get_option_policy()` to return an empty policy — bypassing all can_save, force_mode, and allowed_keys checks — for any unregistered option name, including core WordPress options, while an attacker-controlled `data_name` parameter passes through `sanitize_key()` and is written directly to `update_option()` without restriction. This makes it possible for authenticated attackers with Editor-level access and above to escalate their privileges to Administrator by writing core WordPress options such as `default_role=administrator` and `users_can_register=1`, then self-registering a new Administrator account. The nonce check does not meaningfully restrict this attack, as both the nonce value and nonce action are attacker-supplied POST parameters, and a valid nonce is trivially obtainable via `admin-ajax.php?action=rest-nonce`.", "effects": [{"comp_name": "Booking Calendar", "ecosystem": "linux", "versions": [{"affected_version": "(0,11.8.2]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-09-18", "level": "High", "mps_id": "MPS-xh8k-2riq", "poc": false, "poc_url": [], "published_time": "2026-09-18", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-xh8k-2riq", "name": "https://www.oscs1024.com/hd/MPS-xh8k-2riq"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-92619", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-92619"}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/ab68a6b2-e9b0-4efa-bd01-c6e3e11011db?source=cve", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/booking/tags/11.8.2/includes/save-load-option/save-load-option.php#L303", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/booking/tags/11.8.2/includes/save-load-option/save-load-option.php#L197", "name": ""}, rl": "https://plugins.trac.wordpress.org/changeset?reponame=\u0026old=3701613%40wp-photo-album-plus\u0026new=3701613%40wp-photo-album-plus", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-87909漏洞", "_translated": true, "_saved_at": "2026-09-19T05:24:30+00:00", "_first_saved_at": "2026-09-19T05:24:30+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-4576-dih1"}, {"analysis_status": 0, "articles": [{"content": "由于应用程序或系统中存在敏感信息未经适当保护而被泄露给攻击者或未经授权的用户，这些敏感信息可能包括用户凭据、个人身份信息、敏感业务数据、系统配置信息等。信息暴露漏洞通常是由于设计、实施或配置错误引起的，例如不正确的访问控制、弱密码策略、缺乏加密、错误的日志处理等。", "title": "什么是未授权敏感信息泄露"}, {"content": "- 直接访问敏感信息：攻击者可以通过直接访问不正确配置或不受保护的资源来获取敏感信息，如通过公开可访问的URL、未经授权的文件目录访问等。\n- 越权访问：攻击者可能利用访问控制错误或不正确的权限配置来获取他们没有权限访问的敏感信息。\n- 错误信息披露：应用程序在错误处理过程中可能泄露敏感信息，例如将错误消息中的敏感数据返回给客户端或显示在日志文件中。\n- 信息泄露通过响应：攻击者可能利用应用程序在响应中不正确地包含敏感信息，如通过网页源代码、响应头部或响应消息体中的敏感数据。", "title": "未授权敏感信息泄露常见的攻击方式"}, {"content": "- 访问控制：确保只有经过授权的用户能够访问敏感信息，使用强大的身份验证和授权机制。\n- 数据加密：对于敏感信息，使用适当的加密算法对数据进行加密，包括数据传输和存储过程中的加密。\n- 错误处理和日志安全：正确处理错误情况，避免在错误消息中暴露敏感信息。同时，确保日志记录功能的安全性，避免将敏感信息记录在日志文件中。\n- 安全配置和最佳实践：遵循安全最佳实践，对应用程序、服务器和系统进行适当的配置，包括访问控制、权限管理、密码策略等。\n- 审计和监控：实施日志审计和监控机制，及时检测和响应任何异常活动或潜在的信息暴露事件。\n- 安全开发实践：在应用程序开发过程中，进行安全代码审查、漏洞扫描和安全测试，以及敏感信息的正确处理和保护。", "title": "如何预防未授权敏感信息泄露"}], "cnvd_id": "", "cve_id": "CVE-2026-1255", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "cwe": "CWE-200", "description": "WordPress 的 YS LeadGen 插件在 2.1.4 及之前的所有版本中都容易受到敏感信息泄露的影响，因为未经身份验证的用户可以访问“ysleadgen_get_captured_data”AJAX 操作。这使得未经身份验证的攻击者可以检索所有捕获的表单提交数据，包括个人身份信息 (PII)，例如通过 YS LeadGen 表单提交的姓名、电子邮件地址和消息内容。", "effects": [{"comp_name": "YS LeadGen – Popup Builder, Popup Maker \u0026 Form Builder for WordPress | Lead Generation, Email Marketing, Sales, Conversions, Opt-Ins \u0026 Subscribers", "ecosystem": "linux", "versions": [{"affe /azkaban/azkaban/issues/3348", "name": "GitHub Issue #3348"}, {"url": "https://github.com/azkaban/azkaban", "name": ""}, {"url": "https://github.com/azkaban/azkaban/blob/4.0.0/azkaban-web-server/src/main/java/azkaban/webapp/servlet/ScheduleServlet.java#L237-L262", "name": ""}, {"url": "https://github.com/azkaban/azkaban/blob/4.0.0/azkaban-web-server/src/main/java/azkaban/webapp/servlet/ScheduleServlet.java#L403-L412", "name": ""}, {"url": "https://github.com/azkaban/azkaban/releases/tag/4.0.0", "name": "azkaban 4.0.0 Release Notes"}, {"url": "https://www.vulncheck.com/advisories/azkaban-through-4.0.0-authorization-bypass-via-scheduleservlet", "name": "VulnCheck Advisory: Azkaban through 4.0.0 Authorization Bypass via ScheduleServlet"}], "scope_influence": "", "tags": [], "title": "通过 ScheduleServlet 绕过 Azkaban 4.0.0 授权", "_translated": true, "_saved_at": "2026-09-18T16:52:43+00:00", "_first_saved_at": "2026-09-18T16:52:43+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-7x42-vbwr"}]}</script>
  <script>
    const payload = JSON.parse(document.getElementById("payload").textContent);
    const levelLabels = payload.level_labels || {};
    const items = payload.items || [];
    let filtered = items.slice();
    let activeId = null;

    const $ = (id) => document.getElementById(id);
    $("generatedAt").textContent = payload.generated_at || "-";
    $("retention").textContent = payload.retention_days ?? "-";
    $("cutoff").textContent = payload.cutoff_date || "-";
    $("count").textContent = String(payload.count ?? items.length);

    function levelClass(level) {
      const cn = levelLabels[level] || level || "";
      if (level === "Critical" || cn === "严重") return "crit";
      if (level === "High" || cn === "高危") return "high";
      return "other";
    }
    function levelText(level) {
      return levelLabels[level] || level || "-";
    }
    function esc(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }
    function scoreText(v) {
      if (v === null || v === undefined || v === "" || v === -1) return "-";
      return String(v);
    }

    function renderList() {
      const list = $("list");
      $("listCount").textContent = String(filtered.length);
      if (!filtered.length) {
        list.innerHTML = '<div class="empty">没有匹配项</div>';
        return;
      }
      list.innerHTML = filtered.map((it) => {
        const id = it.mps_id || it.cve_id;
        const active = id === activeId ? " active" : "";
        return `
          <button class="item${active}" data-id="${esc(id)}" type="button">
            <div class="item-top">
              <span class="cve">${esc(it.cve_id || it.mps_id || "-")}</span>
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
            </div>
            <div class="title">${esc(it.title || "-")}</div>
            <div class="item-foot">
              <span>CVSS ${esc(scoreText(it.cvss_score))}</span>
              <span>${esc(it.published_time || "-")}</span>
              ${it.poc ? "<span>POC</span>" : ""}
            </div>
          </button>`;
      }).join("");
      list.querySelectorAll(".item").forEach((btn) => {
        btn.addEventListener("click", () => selectById(btn.dataset.id));
      });
    }

    function refsHtml(it) {
      const refs = Array.isArray(it.reference_url_list) ? it.reference_url_list : [];
      const links = [];
      if (it._source_page) links.push({ url: it._source_page, name: "OSCS 详情" });
      if (it.cve_id) links.push({ url: `https://nvd.nist.gov/vuln/detail/${it.cve_id}`, name: "NVD" });
      refs.forEach((r) => {
        if (r && r.url) links.push({ url: r.url, name: r.name || r.url });
      });
      const seen = new Set();
      const uniq = [];
      for (const l of links) {
        if (seen.has(l.url)) continue;
        seen.add(l.url);
        uniq.push(l);
      }
      if (!uniq.length) return '<div class="box">无参考链接</div>';
      return `<div class="refs">${uniq.map((l) =>
        `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name || l.url)}</a>`
      ).join("")}</div>`;
    }

    function articlesHtml(it) {
      const arts = Array.isArray(it.articles) ? it.articles : [];
      if (!arts.length) return "";
      return `<div class="section"><h3>相关说明</h3>${arts.map((a) => `
        <div class="article">
          <h4>${esc(a.title || "说明")}</h4>
          <p>${esc(a.content || "")}</p>
        </div>`).join("")}</div>`;
    }

    function renderDetail(it) {
      const detail = $("detail");
      if (!it) {
        detail.innerHTML = '<div class="empty">暂无数据</div>';
        return;
      }
      const pocUrls = Array.isArray(it.poc_url) ? it.poc_url : [];
      detail.innerHTML = `
        <div class="d-head">
          <div>
            <h1 class="d-title">${esc(it.title || "-")}</h1>
            <div class="ids">
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
              <span class="chip">${esc(it.cve_id || "无 CVE")}</span>
              <span class="chip">${esc(it.mps_id || "-")}</span>
              ${it.poc ? '<span class="chip">有 POC</span>' : ""}
              ${it.exp ? '<span class="chip">有 EXP</span>' : ""}
            </div>
          </div>
          <div class="actions">
            ${it._source_page ? `<a class="btn" href="${esc(it._source_page)}" target="_blank" rel="noopener">OSCS</a>` : ""}
            ${it.cve_id ? `<a class="btn" href="https://nvd.nist.gov/vuln/detail/${esc(it.cve_id)}" target="_blank" rel="noopener">NVD</a>` : ""}
          </div>
        </div>
        <div class="grid">
          <div class="stat"><div class="k">CVSS</div><div class="v">${esc(scoreText(it.cvss_score))}</div></div>
          <div class="stat"><div class="k">向量</div><div class="v">${esc(it.cvss_vector || "-")}</div></div>
          <div class="stat"><div class="k">CWE</div><div class="v">${esc(it.cwe || "-")}</div></div>
          <div class="stat"><div class="k">类型</div><div class="v">${esc(it.kind || it.kind_en || "-")}</div></div>
          <div class="stat"><div class="k">公开</div><div class="v">${esc(it.published_time || "-")}</div></div>
          <div class="stat"><div class="k">利用成本</div><div class="v">${esc(it.exploit_requirement_cost || "-")}</div></div>
          <div class="stat"><div class="k">可利用性</div><div class="v">${esc(it.exploitability || "-")}</div></div>
          <div class="stat"><div class="k">修复建议</div><div class="v">${esc(it.fix_suggestion || "-")}</div></div>
        </div>
        <div class="section"><h3>描述</h3><div class="box">${esc(it.description || "无描述")}</div></div>
        ${it.scope_influence ? `<div class="section"><h3>影响范围</h3><div class="box">${esc(it.scope_influence)}</div></div>` : ""}
        ${pocUrls.length ? `<div class="section"><h3>POC 链接</h3><div class="refs">${pocUrls.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join("")}</div></div>` : ""}
        <div class="section"><h3>参考链接</h3>${refsHtml(it)}</div>
        ${articlesHtml(it)}
      `;
    }

    function selectById(id) {
      const it = filtered.find((x) => (x.mps_id || x.cve_id) === id) ||
                 items.find((x) => (x.mps_id || x.cve_id) === id);
      if (!it) return;
      activeId = it.mps_id || it.cve_id;
      renderList();
      renderDetail(it);
      const btn = document.querySelector(`.item[data-id="${CSS.escape(activeId)}"]`);
      if (btn) btn.scrollIntoView({ block: "nearest" });
      history.replaceState(null, "", "#" + encodeURIComponent(activeId));
    }

    function applyFilter(q) {
      const query = (q || "").trim().toLowerCase();
      filtered = !query ? items.slice() : items.filter((it) => {
        const blob = [
          it.cve_id, it.mps_id, it.title, it.kind, it.kind_en, it.cwe, it.description, it.level
        ].map((x) => String(x || "").toLowerCase()).join(" ");
        return blob.includes(query);
      });
      renderList();
      if (filtered.length) {
        const still = filtered.some((x) => (x.mps_id || x.cve_id) === activeId);
        selectById(still ? activeId : (filtered[0].mps_id || filtered[0].cve_id));
      } else {
        activeId = null;
        renderDetail(null);
      }
    }

    $("search").addEventListener("input", (e) => applyFilter(e.target.value));

    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement !== $("search")) {
        e.preventDefault();
        $("search").focus();
        return;
      }
      if (!filtered.length) return;
      const idx = filtered.findIndex((x) => (x.mps_id || x.cve_id) === activeId);
      if (e.key === "ArrowDown") {
        e.preventDefault();
        const next = filtered[Math.min(filtered.length - 1, Math.max(0, idx) + 1)];
        selectById(next.mps_id || next.cve_id);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        const prev = filtered[Math.max(0, idx - 1)];
        selectById(prev.mps_id || prev.cve_id);
      }
    });

    const hashId = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    if (hashId && items.some((x) => (x.mps_id || x.cve_id) === hashId)) {
      activeId = hashId;
      renderList();
      selectById(hashId);
    } else if (items.length) {
      selectById(items[0].mps_id || items[0].cve_id);
    } else {
      renderList();
      renderDetail(null);
    }
  </script>
