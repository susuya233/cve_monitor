-1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SSRF", "kind_en": "服务器端请求伪造 (SSRF)", "last_modified_time": "2026-08-22", "level": "Critical", "mps_id": "MPS-ngky-fdth", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ngky-fdth", "name": "https://www.oscs1024.com/hd/MPS-ngky-fdth"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-69502", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-69502"}, {"url": "https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-69502", "name": ""}], "scope_influence": "", "tags": [], "title": "Azure SQL Database SSRF权限提升漏洞", "_translated": true, "_saved_at": "2026-08-21T18:27:52+00:00", "_first_saved_at": "2026-08-21T17:22:37+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ngky-fdth"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "cnvd_id": "", "cve_id": "CVE-2026-39909", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.1}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:H/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.2}]}, "cvss_score": 9.2, "cvss_vector": "CVSS:4.0/AV:N/AC:H/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-416", "description": "llama.cpp 是开源的 C/C++ 大模型推理引擎，ggml-org 在 GitHub 上以 MIT 协议发布，支持本地与分布式模型推理，属于大模型与机器学习基础设施组件。\n受影响版本中，ggml/src/ggml-rpc/ggml-rpc.cpp 的 RPC 服务器在 rpc_server::free_buffer 直接释放 backend buffer 时，没有同步使 stored_graphs 中缓存的 ggml_cgraph 失效。rpc_server::graph_recompute 从 stored_graphs 取出 graph 后调用 ggml_backend_graph_compute，图中节点仍持有已被 free_buffer 释放的 backend buffer 指针，触发释放后重用。RPC 协议不要求认证，远程攻击者只要能连接 RPC 服务器 TCP 端口，先通过 GRAPH_COMPUTE 写入带 buffer 引用的图，再以 FREE_BUFFER 释放对应 buffer 并用 ALLOC_BUFFER/SET_TENSOR 重塑同一块内存，最后通过 GRAPH_RECOMPUTE 让服务器沿悬空指针执行，可泄漏 libc 地址并劫持 buffer 接口的 vtable，最终实现远程代码执行。\n修复版本中通过在 rpc_server::free_buffer 中按设备遍历 stored_graphs 并将每个 sg.graph 置空，使 cached graph 随引用 buffer 一同失效；之后 graph_recompute 中原有的 nullptr 检查会拒绝该请求，客户端自动回退到 GRAPH_COMPUTE，悬空指针不再进入危险执行路径。", "effects": [{"comp_name": "llama.cpp", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,b8585)", "min_fixed_version": "b8585", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "UAF", "kind_en": "免费后使用", "last_modified_time": "2026-08-22", "level": "Critical", "mps_id": "MPS-ld2x-tp9b", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ld2x-tp9b", "name": "https://www.oscs1024.com/hd/MPS-ld2x-tp9b"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-39909", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-39909"}, {"url": "https://github.com/ggml-org/llama.cpp/commit/389c7d4955ba55c7418afaebf7c23d9ed64ef707", "name": ""}, {"url": "https://github.com/ggml-org/llama.cpp/pull/21175", "name": ""}, {"url": "https://github.com/ggml-org/llama.cpp/releases/tag/b8585", "name": ""}, {"url": "https://www.vulncheck.com/advisories/llama-cpp-use-after-free-in-rpc-graph-recompute-handler", "name": ""}], "scope_influence": "", "tags": ["AI", "应用软件"], "title": "llama.cpp RPC服务器GRAPH_RECOMPUTE处理器释放后重用漏洞", "_translated": true, "_saved_at": "2026-08-21T18:27:48+00:00", "_first_saved_at": "2026-08-21T18:27:48+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ld2x-tp9b"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-75932", "cvss": {"cvssv31": [{"source": "9119a7d8-5eab-497f-8521-727c672e3725", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:L/A:H", "severity": "high", "base_score": 8.6}], "cvssv4": [{"source": "9119a7d8-5eab-497f-8521-727c672e3725", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:L/VI:L/VA:H/SC:H/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.2}]}, "cvss_score": 9.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:L/VI:L/VA:H/SC:H/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-862", "description": "Jet Admin 是 Jet Admin Inc. 提供的无代码业务应用构建与托管 SaaS 平台，用户可在其工作区中创建应用并绑定自有自定义域名对外提供访问。NVD 漏洞标签为 exclusively-hosted-service，表明该缺陷仅存在于官方托管的多租户服务中。\n受影响版本中，Jet Admin 多租户服务在处理用户自定义域名接入请求时缺少对域名归属的授权校验，攻击者可在自己的工作区创建恶意应用并将该应用关联到目标用户的自定义域名，进而修改受害工作区的身份认证配置，将原本应路由到目标应用的流量改写到攻击者控制的应用；一旦恶意应用成功挂载到受害域名，受害工作区中配置的 OAuth Provider 的 Client ID 与 Client Secret 会泄露到攻击者工作区，造成凭据外泄与潜在的进一步账户接管。\n修复版本中通过官方托管服务侧的访问控制强化解决了该问题，对自定义域名与应用工作区之间的绑定操作追加域名所有权校验，并阻断非授权工作区对受害域名身份认证配置的改写与对 OAuth Provider 凭据的拉取；NVD/CVE.org 未披露具体修复版本号，建议所有 Jet Admin SaaS 租户及时关注官方安全通知并按厂商指引复核自定义域名与 OAuth Provider 凭据。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-08-22", "level": "Critical", "mps_id": "MPS-wilm-nr1o", "poc": false, "poc_url": [], "published_time": "2026-08-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-wilm-nr1o", "name": "https://www.oscs1024.com/hd/MPS-wilm-nr1o"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-75932", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-75932"}, {"url": "https://raw.githubusercontent.com/cisagov/CSAF/develop/csaf_files/IT/white/2026/va-26-232-02.json", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-75932", "name": ""}, {"url": "https://www.jetadmin.io/", "name": ""}], "scope_influence": "", "tags": [], "title": "Jet Admin 自定义域名授权缺失漏洞", "_translated": true, "_saved_at": "2026-08-21T18:27:49+00:00", "_first_saved_at": "2026-08-21T17:22:33+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-wilm-nr1o"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-52876", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "cwe": "CWE-78", "description": "Streambert 是一款跨平台 Electron 桌面应用程序，用于流式传输和下载视频内容。在版本 2.6.0 之前，src/ipc/player.js 中的 open-path-at-time IPC 处理程序接受渲染器控制的 filePath，而不验证其类型或位置。如果 mpv 或 VLC 启动尝试被跳过或失败，处理程序会将 filePath 传递给 Electron 的 shell.openPath。受损的渲染器可以通过执行默认处理程序提供本地可执行文件、脚本、快捷方式或其他文件的路径，从而导致操作系统以 StreamBERT 进程的权限启动它，并能够逃离渲染器沙箱。此问题已在 2.6.0 版本中修复。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-08-19", "level": "High", "mps_id": "MPS-ika3-09nz", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ika3-09nz", "name": "https://www.oscs1024.com/hd/MPS-ika3-09nz"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-52876", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-52876"}, {"url": "https://github.com/truelockmc/streambert/commit/43566ed031183b046675761c9813c5379b619269", "name": ""}, {"url": "https://github.com/truelockmc/streambert/pull/149", "name": ""}, {"url": "https://github.com/truelockmc/streambert/releases/tag/2.6.0", "name": ""}, {"url": "https://github.com/truelockmc/streambert/security/advisories/GHSA-85vf-2qwc-qpm4", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-52876漏洞", "_translated": true, "_saved_at": "2026-08-18T23:16:30+00:00", "_first_saved_at": "2026-08-18T23:16:30+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ika3-09nz"}, {"analysis_status": 0, "articles": [{"content": "跨站点请求伪造 (CSRF)通过利用网站对用户请求的信任进行攻击。当用户在网站A登录并在同一浏览器会话中访问网站B时，攻击者可以构造特制的请求并诱使用户执行，以使网站B误以为这些请求是用户合法发起的。\n攻击者通常通过欺骗用户点击恶意链接、在受信任的网站中植入恶意代码或通过钓鱼等手段来实施CSRF攻击，一旦用户执行了恶意请求，攻击者可以以用户的身份执行任意操作，包括更改用户密码、发起资金转账或删除重要数据等。", "title": "什么是CSRF"}, {"content": "- 链接欺骗：攻击者通过向用户发送包含恶意链接的电子邮件或社交媒体消息，诱使用户点击并执行恶意请求。\n- 图片引用攻击：攻击者通过在恶意网站上包含指向目标网站的图片引用，以触发用户浏览器自动发送目标网站的请求。\n- XSS利用：如果目标网站存在XSS漏洞，攻击者可以注入恶意脚本，以使用户在浏览器中执行恶意请求。", "title": "CSRF常见的攻击方式"}, {"content": "- 随机令牌：网站可以在每个请求中包含一个随机生成的令牌（CSRF Token），并验证该令牌的有效性，以确认请求的来源是合法的。\n- SameSite Cookie：使用SameSite属性来限制跨站点请求，将Cookie的发送限制在同一站点上，减少了跨站请求伪造的风险。\n- 双重验证：对于敏感操作，网站可以要求用户进行额外的验证，例如输入验证码、提供第二个因素的身份验证等。\n- 强化浏览器策略：网站可以设置Content-Security-Policy（CSP）头，限制浏览器执行恶意脚本的能力，减少CSRF攻击的风险。\n- 限制用户操作：网站可以要求用户在执行敏感操作之前进行明确的确认或授权，防止恶意请求被误触发。\n- 安全编码实践：开发人员应遵循安全编码实践，对用户输入进行适当的验证和过滤，防止恶意请求的注入。", "title": "如何预防CSRF"}], "cnvd_id": "", "cve_id": "CVE-2026-66602", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "cwe": "CWE-352", "description": "HashBar – WordPress Notification Bar 是 DevItems 发布的开源 WordPress 插件，用于创建公告栏、通知栏和弹窗营销活动。\n受影响版本中，公告分析、弹窗分析和 A/B 测试跟踪模块在 rest_authentication_errors 过滤器里使用 strpos() 判断 $_SERVER['REQUEST_URI'] 是否包含 /hashbar/v1/announcement-analytics/batch 等公开跟踪路径。攻击者可在任意 WordPress REST 请求的查询串中植入该子串，使过滤器返回 true 并跳过 cookie 认证 REST 调用所需的 nonce 校验。未认证攻击者诱导已登录的高权限用户访问恶意页面后，可冒用其身份向站点 REST API 提交状态变更请求。\n修复版本中通过改为读取 WordPress 解析后的 $GLOBALS['wp']-\u003equery_vars['rest_route'] 并与跟踪路由做精确相等比较，阻止查询串走私触发认证绕过，切断跨站请求对其他 REST 接口的伪造路径。", "effects": [{"comp_name": "hashbar-wp-notification-bar", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.0.1)", "min_fixed_version": "2.0.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "CSRF", "kind_en": "跨站请求伪造 (CSRF)", "last_modified_time": "2026-08-19", "level": "High", "mps_id": "MPS-ozyn-p8w9", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ozyn-p8w9", "name": "https://www.oscs1024.com/hd/MPS-ozyn-p8w9"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-66602", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-66602"}, {"url": "https://patchstack.com/database/wordpress/plugin/hashbar-wp-notification-bar/vulnerability/wordpress-hashbar-wordpress-notification-bar-plugin-2-0-0-cross-site-request-forgery-csrf-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": [], "title": "HashBar CSRF漏洞", "_translated": true, "_saved_at": "2026-08-19T02:15:08+00:00", "_first_saved_at": "2026-08-18T23:16:24+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ozyn-p8w9"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-75935", "cvss": {"cvssv31": [{"source": "ff89ba41-3aa1-4d27-914a-91399e9639e5", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}], "cvssv4": [{"source": "ff89ba41-3aa1-4d27-914a-91399e9639e5", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-70408", "cvss": {"cvssv3": [{"source": "vultures@jpcert.or.jp", "vector": "CVSS:3.0/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}], "cvssv4": [{"source": "vultures@jpcert.or.jp", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-863", "description": "acmailer 是 Extra Innovation Inc. 提供的邮件投递软件，并非 GitHub 开源项目，分为 acmailer CGI 与 acmailer DB，以 Perl CGI 形式部署在服务器上，用于邮件列表与邮件营销。\n受影响版本中，子账号用户的授权校验存在缺陷，已登录的子账号可创建另一个具备管理员权限的子账号，从而获得管理权限。\n修复版本中通过限制子账号对子账号管理功能的使用，阻止低权限子账号再创建具备管理员权限的账号。", "effects": [{"comp_name": "acmailer CGI", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,4.1.2)", "min_fixed_version": "4.1.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "acmailer DB", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.2.2)", "min_fixed_version": "1.2.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-08-19", "level": "High", "mps_id": "MPS-7bqc-1eow", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-7bqc-1eow", "name": "https://www.oscs1024.com/hd/MPS-7bqc-1eow"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-70408", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-70408"}, {"url": "https://jvn.jp/en/jp/JVN47716829/", "name": ""}, {"url": "https://www.acmailer.jp/info/de.cgi?id=119", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "acmailer错误授权漏洞", "_translated": true, "_saved_at": "2026-08-19T06:33:24+00:00", "_first_saved_at": "2026-08-19T06:33:24+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-7bqc-1eow"}, {"analysis_status": 0, "articles": [{"content": "由于应用程序或系统中存在敏感信息未经适当保护而被泄露给攻击者或未经授权的用户，这些敏感信息可能包括用户凭据、个人身份信息、敏感业务数据、系统配置信息等。信息暴露漏洞通常是由于设计、实施或配置错误引起的，例如不正确的访问控制、弱密码策略、缺乏加密、错误的日志处理等。", "title": "什么是未授权敏感信息泄露"}, {"content": "- 直接访问敏感信息：攻击者可以通过直接访问不正确配置或不受保护的资源来获取敏感信息，如通过公开可访问的URL、未经授权的文件目录访问等。\n- 越权访问：攻击者可能利用访问控制错误或不正确的权限配置来获取他们没有权限访问的敏感信息。\n- 错误信息披露：应用程序在错误处理过程中可能泄露敏感信息，例如将错误消息中的敏感数据返回给客户端或显示在日志文件中。\n- 信息泄露通过响应：攻击者可能利用应用程序在响应中不正确地包含敏感信息，如通过网页源代码、响应头部或响应消息体中的敏感数据。", "title": "未授权敏感信息泄露常见的攻击方式"}, {"content": "- 访问控制：确保只有经过授权的用户能够访问敏感信息，使用强大的身份验证和授权机制。\n- 数据加密：对于敏感信息，使用适当的加密算法对数据进行加密，包括数据传输和存储过程中的加密。\n- 错误处理和日志安全：正确处理错误情况，避免在错误消息中暴露敏感信息。同时，确保日志记录功能的安全性，避免将敏感信息记录在日志文件中。\n- 安全配置和最佳实践：遵循安全最佳实践，对应用程序、服务器和系统进行适当的配置，包括访问控制、权限管理、密码策略等。\n- 审计和监控：实施日志审计和监控机制，及时检测和响应任何异常活动或潜在的信息暴露事件。\n- 安全开发实践：在应用程序开发过程中，进行安全代码审查、漏洞扫描和安全测试，以及敏感信息的正确处理和保护。", "title": "如何预防未授权敏感信息泄露"}], "cnvd_id": "", "cve_id": "CVE-2026-75915", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "high", "base_score": 7.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-200", "description": "CodeWhale 0.8.64 之前的版本在 js_execution 工具中包含一个环境变量暴露漏洞，该漏洞无法在生成 Node.js 之前清理父进程环境变量。攻击者可以编写由该工具执行的恶意 JavaScript 代码来读取 process.env 并将 API 密钥、云凭据和身份验证令牌泄漏回模型上下文。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "未授权敏感信息泄露", "kind_en": "向未经授权的行为者泄露敏感信息", "last_modified_time": "2026-08-19", "level": "High", "mps_id": "MPS-ca01-wzsx", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ca01-wzsx", "name": "https://www.oscs1024.com/hd/MPS-ca01-wzsx"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-75915", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-75915"}, {"url": "https://github.com/Hmbown/CodeWhale/commit/26de44a8bd5051f8f944ea60b2c37ae1d2b7d25e", "name": ""}, {"url": "https://github.com/Hmbown/CodeWhale/security/advisories/GHSA-h539-c7r8-3xq4", "name": ""}, {"url": "https://www.vulncheck.com/advisories/codewhale-before-environment-variable-leak-via-js-execution", "name": ""}, {"url": "https://github.com/Hmbown/CodeWhale/security/advisories/GHSA-h539-c7r8-3xq4", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-75915漏洞", "_translated": true, "_saved_at": "2026-08-18T17:21:28+00:00", "_first_saved_at": "2026-08-18T17:21:28+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ca01-wzsx"}, {"analysis_status": 0, "articles": [{"content": "跨界内存读是指应用程序在读取内存时，未正确验证或限制读取的内存范围。攻击者利用这种漏洞可以读取应用程序内存中的敏感数据，如密码、加密密钥、会话令牌等。常见的原因是由于缓冲区溢出、格式化字符串漏洞或其他内存错误导致的。", "title": "什么是越界读取"}, {"content": "攻击者可以通过不当构造的输入来触发跨界内存读漏洞。攻击者可能会通过向应用程序发送特定的输入，使其读取超过预期的内存区域。攻击者可以利用这个漏洞来获取敏感信息，如其他用户的数据、操作系统的敏感数据或应用程序的内部状态。", "title": "越界读取常见的攻击方式"}, {"content": "- 输入验证和限制：应用程序应对所有输入数据进行严格的验证和限制。确保输入数据的长度、格式和内容符合预期，避免超出缓冲区或访问非预期的内存区域。\n- 内存安全编程实践：开发人员应使用安全的编程实践，如避免使用不安全的函数、正确处理内存分配和释放操作，以及遵循最小特权原则。\n- 使用安全的编程语言和库：选择使用安全性较高的编程语言和库，这些语言和库在内存管理和安全性方面提供了更多的保护机制。\n- 定期进行代码审查和安全测试：定期审查应用程序的代码，并进行安全测试，以发现潜在的跨界内存读漏洞。使用静态代码分析工具和漏洞扫描工具来辅助检测和修复问题。\n- 实施防御性编程技术：应用程序应采用防御性编程技术，如使用随机化地址空间布局（ASLR）、堆栈保护机制（如堆栈溢出保护）和数据执行预防（DEP）等。\n- 及时更新和修补：及时应用程序和操作系统的安全更新和补丁，以确保已知的跨界内存读漏洞得到修复。及时更新相关软件和库，以避免使用已知存在漏洞的版本。", "title": "如何预防越界读取"}], "cnvd_id": "", "cve_id": "CVE-2026-62292", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-125", "description": "libheif 是 HEIF 和 AVIF 文件格式解码器和编码器。从 1.19.0 到 1.23.1，使用通用 zlib unci 全项目压缩精心制作的未压缩 HEIF 图像可能会导致使用 heif_image_handle_decode_image_tile() 解码广告图块的应用程序崩溃。在 libheif/codecs/uncompressed/unc_decoder.cc 中，unc_decoder::fetch_tile_data() 计算大的切片偏移量，而 unc_decoder::get_compressed_image_data_uncompressed() 使用 range_start_offset 加 range_size 对其进行验证。对于最后通告的图块 (4095, 4095)，加法可以回绕到零，绕过边界检查，并将无效的源指针和 1 TB 长度传递给 memcpy。观察到的结果是越界读取和进程崩溃；单独打开文件不会触发问题，因为需要进行图块解码。此问题已在版本 1.23.1 中修复。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界读取", "kind_en": "越界读取", "last_modified_time": "2026-08-19", "level": "High", "mps_id": "MPS-dj7z-my51", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/M  "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-22", "description": "CodeWhale 0.8.64 之前的版本在 image_analyze 工具中包含路径遍历漏洞，该漏洞无法在读取文件之前规范化符号链接。攻击者可以创建指向具有图像扩展名的外部文件的工作区符号链接，从而在未经用户批准的情况下将文件字节泄漏到视觉端点。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-08-19", "level": "High", "mps_id": "MPS-pkxh-dv3e", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-pkxh-dv3e", "name": "https://www.oscs1024.com/hd/MPS-pkxh-dv3e"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-75914", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-75914"}, {"url": "https://github.com/Hmbown/CodeWhale/commit/26de44a8bd5051f8f944ea60b2c37ae1d2b7d25e", "name": ""}, {"url": "https://github.com/Hmbown/CodeWhale/security/advisories/GHSA-w7wx-5q49-r59w", "name": ""}, {"url": "https://www.vulncheck.com/advisories/codewhale-before-path-traversal-via-image-analyze-symlink", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-75914漏洞", "_translated": true, "_saved_at": "2026-08-18T17:21:24+00:00", "_first_saved_at": "2026-08-18T17:21:24+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-pkxh-dv3e"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "cnvd_id": "", "cve_id": "CVE-2026-75924", "cvss": {"cvssv31": [{"source": "secalert@redhat.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:C/C:H/I:H/A:N", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:C/C:H/I:H/A:N", "cwe": "CWE-269", "description": "托管服务帐户中发现缺陷。受损的 addon-manager pod 由于其 ClusterRole 授予过多权限，可以读取所有命名空间中的任何机密。此外，它还可以批准任意证书签名请求 (CSR)，这可能会导致集群内的信息泄露和权限升级。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-08-19", "level": "High", "mps_id": "MPS-rtnw-xosz", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-rtnw-xosz", "name": "https://www.oscs1024.com/hd/MPS-rtnw-xosz"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-75924", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-75924"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-75924", "name": ""}, {"url": "https://bugzilla.redhat.com/show_bug.cgi?id=2515720", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-75924漏洞", "_translated": true, "_saved_at": "2026-08-18T18:28:35+00:00", "_first_saved_at": "2026-08-18T18:28:35+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-rtnw-xosz"}, {"analysis_status": 0, "articles": [], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-69220", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-674", "description": "RabbitMQ Java Client 是开源 Java 客户端库，供 Java 与 JVM 应用连接并与 RabbitMQ 节点交互，Maven 坐标为 com.rabbitmq:amqp-client，由 rabbitmq/rabbitmq-java-client 维护。\n受影响版本中，src/main/java/com/rabbitmq/client/impl/ValueReader.java 的 readTable 与 readArray 在解析 AMQP 表类型 F 与数组类型 A 时递归调用 readFieldValue，但未限制嵌套深度。攻击者控制的 AMQP 服务器或网络中间人在预认证的 connection.start 帧中发送约 580 层嵌套表，每层约 7 字节、合计约 4060 字节，远在默认 131072 字节帧上限之内；在默认 JVM 栈（约 512KB、约 864 字节/帧）下即可触发 StackOverflowError，终止客户端输入处理线程，造成拒绝服务。\n修复版本中通过在 ValueReader 中新增 MAX_FIELD_VALUE_NESTING_DEPTH = 32 常量，给 readTable、readArray、readFieldValue 增加 depth 参数并在 depth 超过阈值时抛出 MalformedFrameException，从而切断恶意深嵌套帧触发栈溢出的递归路径。", "effects": [{"comp_name": "com.rabbitmq:amqp-client", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,5.33.1)", "min_fixed_version": "5.33.1", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "未经控制的递归", "kind_en": "Uncontrolled Recursion", "last_modified_time": "2026-08-19", "level": "High", "mps_id": "MPS-so3r-qknf", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://github.com/rabbitmq/rabbitmq-java-client/security/advisories/GHSA-93j5-89vc-pph4", "name": ""}, {"url": "https://github.com/rabbitmq/rabbitmq-java-client/pull/2007", "name": ""}, {"url": "https://github.com/rabbitmq/rabbitmq-java-client/pull/2008", "name": ""}, {"url": "https://github.com/rabbitmq/rabbitmq-java-client/commit/09af76fce136f3136931654a0a1d43095c80e2f0", "name": ""}, {"url": "https://github.com/rabbitmq/rabbitmq-java-client/commit/db89e34809fbc6ba4e946615f297f3684ccd0acc", "name": ""}, {"url": "https://github.com/rabbitmq/rabbitmq-java-client/releases/tag/v5.33.1", "name": ""}, {"url": "https://github.com/advisories/GHSA-93j5-89vc-pph4", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "RabbitMQ Java客户端栈溢出拒绝服务漏洞", "_translated": true, "_saved_at": "2026-08-18T18:28:38+00:00", "_first_saved_at": "2026-08-18T18:28:38+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-so3r-qknf"}, {"analysis_status": 0, "articles": [], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-69219", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-789", "description": "RabbitMQ Java 客户端（com.rabbitmq:amqp-client）是 Pivotal/Broadcom 维护的开源 Java 消息队列客户端库，用于让 Java 与 JVM 应用连接并交互 RabbitMQ 节点；该项目为 GitHub 开源软件，不属于大模型或机器学习基础设施。\n受影响版本中，src/main/java/com/rabbitmq/client/impl/ValueReader.java 的私有静态方法 readBytes 在解析 AMQP 帧字段时，会先读取 32 位无符号 contentLength，并在 contentLength 小于 Integer.MAX_VALUE 时立即 new byte[(int)contentLength] 分配对应大小的字节数组，再调用 readFully 填充数据。该分配尺寸完全由对端声明值决定，未与帧内剩余可读字节数或协商的 max-frame-size（默认 131072）做任何校验。攻击者只需充当恶意 AMQP 对端，在 pre-authentication 阶段的 connection.start server-properties 表中发送类型 tag 为 S 的 LongString，并将声明长度置为 0x7FFFFFFE，即可触发约 2 GB 的 byte[] 分配并抛出 OutOfMemoryError，最终使整个 JVM 因内存耗尽而终止，造成拒绝服务。\n修复版本中通过将 readBytes 的判定改为先获取 in.available() 并在 contentLength 大于 available 时抛出 MalformedFrameExc @vulncheck.com", "vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.5}]}, "cvss_score": 8.5, "cvss_vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-94", "description": "CodeWhale（软件包 codewhale / codewhale-tui）版本 \u003e= 0.8.41 和 \u003c 0.8.64 在 rlm_eval 工具中包含远程代码执行漏洞。该工具的approval_requirement()返回ApprovalRequirement::Auto，引擎将其视为“从不提示”，导致模型提供的任意Python代码在python3解释器中运行，而无需咨询用户配置的--approval-policy，也没有任何批准提示或审核步骤。攻击者可以通过在代理读取的不可信内容（网页、获取的 URL、存储库文件或 MCP 工具结果）中提示注入来诱导代理执行任意代码；配套的 rlm_open 工具可以暂存此类内容。代码以用户的权限级别在用户的计算机上运行。已于 0.8.64 中修复。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "代码注入", "kind_en": "代码生成控制不当（“代码注入”）", "last_modified_time": "2026-08-19", "level": "High", "mps_id": "MPS-uyda-rb21", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-uyda-rb21", "name": "https://www.oscs1024.com/hd/MPS-uyda-rb21"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-75858", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-75858"}, {"url": "https://github.com/Hmbown/CodeWhale/commit/57f3c89471e27ac4032d9791f6885e5d4408c381", "name": ""}, {"url": "https://github.com/Hmbown/CodeWhale/security/advisories/GHSA-wrj3-vj8c-784f", "name": ""}, {"url": "https://www.vulncheck.com/advisories/codewhale-rlm-eval-before-remote-code-execution", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-75858漏洞", "_translated": true, "_saved_at": "2026-08-18T17:21:35+00:00", "_first_saved_at": "2026-08-18T17:21:35+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-uyda-rb21"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-63338", "cvss": {}, "cvss_score": 8.3, "cvss_vector": "", "cwe": "CWE-863", "description": "IXP Manager 是由 INEX 维护的开源 PHP/Laravel 应用，为全球两百多家互联网交换中心（IXP）提供对等互联管理、路由服务器、客户服务与 API 密钥等核心能力。\n受影响版本中，IXP\\Http\\Controllers\\ApiKeyController 的 doUpdate 方法直接以 ApiKey::findOrFail($id) 取得目标记录，没有按 user_id 做归属校验；随后调用 $this-\u003eobject-\u003eupdate($r-\u003eall())，配合 IXP\\Models\\ApiKey 中 $fillable = ['apiKey', 'expires', 'allowedIPs', 'created', 'lastseenAt', 'lastseenFrom', 'description']，使请求中可控的 apiKey 字段被批量赋值覆盖。任意拥有 AUTH_CUSTUSER 权限的已登录客户用户都可向 PUT /api-key/update/{id} 提交带 apiKey 的表单，把任意其他用户（含超级管理员）的 API Key 明文改写为攻击者控制值，再以新 Key 走 API 完成身份冒用并获得对应权限。\n修复版本中通过在 doUpdate 内显式比对 $this-\u003eobject-\u003euser_id !== $r-\u003euser()-\u003eid 时直接 abort(403)，阻断跨用户更新路径，并将批量赋值替换为仅对受校验的 description 字段赋值（$this-\u003eobject-\u003edescription = $r-\u003edescription），同时去除 apiKey 在 $fillable 中的可批量赋值能力，从而切断越权读取/编辑其他用户资源以及 API Key 明文覆写的攻击链路。", "effects": [{"comp_name": "inex/ixp-manager", "ecosystem": "composer", "versions": [{"affected_version": "[v7.0.0,v7.3.0)", "min_fixed_version": "v7.3.0", "repository" R：N/UI：N/S：C/C：L/I：L/A：L）。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "", "kind_en": "", "last_modified_time": "2026-08-19", "level": "High", "mps_id": "MPS-6qt7-eylc", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-6qt7-eylc", "name": "https://www.oscs1024.com/hd/MPS-6qt7-eylc"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73931", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73931"}, {"url": "https://www.oracle.com/security-alerts/cspuaug2026.html", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-73931漏洞", "_translated": true, "_saved_at": "2026-08-18T22:16:50+00:00", "_first_saved_at": "2026-08-18T22:16:50+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-6qt7-eylc"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "", "cvss": {}, "cvss_score": 8.3, "cvss_vector": "", "cwe": "CWE-79", "description": "MeshCentral 是开源的远程计算机管理服务器，提供基于 Web 的远程控制台与设备管理面板；MeshAgent 是部署在被管理主机上的轻量代理，定期通过 WebSocket 向服务器上报 coreinfo、硬件、卷信息等核心状态。\n受影响版本中，MeshCentral 服务器处理 MeshAgent 上报的核心信息时仅对字段类型做 typeof == 'string' 校验，未对内容进行 HTML 实体转义。攻击者只要控制任意一台被入侵或恶意注册的 MeshAgent，就能让 coreinfo 消息中的 osdesc、node.name、mesh.name、cpuinfo.thermals[].InstanceName、volumes[].name 等字段携带 HTML/脚本片段；这些值随后被 views/default3.handlebars 等模板的 addDeviceAttribute()、addHtmlValue() 等辅助函数拼入 HTML 字符串，再由 QH() 直接写入 innerHTML 等价位置，最终在管理员查看设备详情、文件浏览器、共享/权限对话框时被浏览器解析执行。叠加 MeshCentral 主管理界面 CSP 设置为 'unsafe-inline'（webserver.js:7072），内联事件处理器与脚本执行不受限制，攻击者借此即可在管理员会话中执行任意脚本。\n修复版本中通过 MeshCentral 1.1.60 提交 aee83b7780（PR #7823）将 addDeviceAttribute(\"Operating System\", node.osdesc)、addHtmlValue(\"Device\", node.name)、mesh.name、volumes[].name、thermals[].InstanceName 等多个渲染调用点统一用 EscapeHtml() 包裹，与同文件其它已转义位置保持一致，从而切断 Agent 上报内容按 HTML 解释执行的可能。", "effects": [{"comp_name": "meshcentral", "ecosystem": "npm", "versions": [{"affected_version": "(-∞,1.1.60)", "min_fixed_version": "1.1.60", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-08-19", "level": "High", "mps_id": "MPS-a041-c236", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https:/ "(-∞,1.5]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "php远程文件包含", "kind_en": "PHP 程序中 Include/Require 语句的文件名控制不当（“PHP 远程文件包含”）", "last_modified_time": "2026-08-19", "level": "High", "mps_id": "MPS-84n7-w1fq", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-84n7-w1fq", "name": "https://www.oscs1024.com/hd/MPS-84n7-w1fq"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73387", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73387"}, {"url": "https://patchstack.com/database/wordpress/theme/resido/vulnerability/wordpress-resido-theme-1-5-local-file-inclusion-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Resido WordPress 主题本地文件包含漏洞", "_translated": true, "_saved_at": "2026-08-19T14:26:41+00:00", "_first_saved_at": "2026-08-19T13:39:23+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-84n7-w1fq"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-19942", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:H/A:H", "severity": "high", "base_score": 8.1}]}, "cvss_score": 8.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:H/A:H", "cwe": "CWE-22", "description": "Atarim（WordPress.org 插件标识 atarim-visual-collaboration）是开源 WordPress 插件，通过 MCP / DoIt 能力层向已连接的 AI 客户端提供站点编辑、媒体替换和字段写入等操作。\n受影响版本中，具备 Author 及以上权限的已认证用户可先调用 atarim/update-post-field，将自己拥有附件的 _wp_attached_file 元数据改写为目录穿越或绝对路径；随后调用 atarim/replace-media-file 时，AVCF_Abilities_Media::register 注册的 execute_callback 直接把 get_attached_file() 返回的路径交给 unlink，未校验该路径是否位于 uploads 目录内，导致可删除 wp-config.php 等任意服务器文件并进一步造成远程代码执行。该调用链可通过 MCP Adapter 默认 HTTP 接口以已登录用户身份进入。\n修复版本中通过新增 avcf_resolve_within_uploads() 在删除或覆盖前将附件路径约束在 uploads 目录内，同时禁止经通用字段能力写入穿越或绝对的 _wp_attached_file，并停止注册未设置传输门禁的 MCP Adapter 默认服务器，切断任意文件删除链路。", "effects": [{"comp_name": "atarim-visual-collaboration", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,5.1.2)", "min_fixed_version": "5.1.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-08-19", "level": "High", "mps_id": "MPS-cnlv-3wq6", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-cnlv-3wq6", "name": "https://www.oscs1024.com/hd/MPS-cnlv-3wq6"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-19942", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-19942"}, {"url": "https://plugins.trac.wordpress.org/browser/atarim-visual-collaboration/tags/5.1.1/doit/abilities/class-avcf-abilities-media.php#L1212", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/atarim-visual-collaboration/tags/5.1.1/doit/abilities/class-avcf-abilities-metadata.php#L1279", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/atarim-visual-collaboration/tags/5.1.1/doit/class-avcf-mcp.php#L329", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/atarim-visual-collaboration/tags/5.1.1/vendor/wordpress/mcp-adapter/includes/Abilities/ExecuteAbilityAbility.php#L91", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/atarim-visual-collaboration/tags/5.1.1/vendor/wordpress/mcp-adapter/includes/Servers/DefaultServerFactory.php#L73", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/atarim-visual-collaboration/tags/5.1.1/vendor/wordpress/mcp-adapter/includes/Transport/HttpTransport.php#L99", "name": ""}, {"url": "https://plugins.trac.wordpress.org/changeset?reponame=\u0026old=3653026%40atarim-visual-collaboration\u0026new=3653026%40atarim-visual-collaboration", "name": ""}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/c66a75a3-d420-4f2e-9f61-fe7dc2cb759e?source=cve", "name": ""}], "scope_influence": "", "tags": ["AI", "应用软件"], "title": "Atarim任意文件删除漏洞", "_translated": true, "_saved_at": "2026-08-19T06:33:32+00:00", "_first_saved_at": "2026-08-19T06:33:32+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-cnlv-3wq6"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过构造恶意的数据，将过多的数据输入到程序的缓冲区中，使得缓冲区的空间被填满，从而溢出到程序的栈 (stack) 或堆 (heap) 中，导致程序崩溃、拒绝服务、数据泄露等安全问题。\n", "title": "什么是经典缓冲区溢出"}, {"content": "| 类型        | 描述                                                         |\n| ----------- | ------------------------------------------------------------ |\n| 代码注入攻击      | 攻击者通过向程序的缓冲区输入恶意代码，从而控制程序执行流程，实现对程序操作的恶意操作。例如，攻击者可以通过向 Web 应用程序的输入框中输入恶意代码，从而执行任意的代码，破坏系统、窃取数据等。 |\n| 数据覆盖攻击      | 攻击者通过向程序的缓冲区输入过多的数据，从而覆盖程序中的重要数据或代码，实现对程序操作的恶意操作。例如，攻击者可以通过向聊天应用程序的输入框中输入过多的表情符号，从而覆盖程序中的重要数据，例如聊天消息、账号密码等。 |\n| 栈溢出攻击 | 攻击者通过向程序的栈中输入过多的数据，从而溢出到栈外部，实现对程序操作的恶意操作。例如，攻击者可以通过向游戏应用程序的输入框中输入过多的道具名称，从而覆盖程序中的重要数据，例如游戏数据、账号密码等。 |\n| 堆溢出攻击       | 攻击者通过向程序的堆中输入过多的数据，从而溢出到堆外部，实现对程序操作的恶意操作。例如，攻击者可以通过向操作系统工具的输入框中输入过多的命令，从而覆盖程序中的重要数据，例如系统文件、配置文件等。 |", "title": "经典缓冲区溢出常见的攻击方式"}, {"content": "- 输入验证：在程序输入处对输入数据进行严格的验证和过滤，确保输入数据符合预期的格式和类型，避免被攻击者注入恶意命令或数据。可以使用正则表达式、格式字符串等方式进行输入验证。\n- 输出过滤：在程序输出处对输出数据进行严格的过滤和检查，确保输出数据符合预期的格式和类型，避免被攻击者截获和篡改。可以使用安全的输出过滤库等方式进行输出过滤。\n- 使用安全的编程模型：使用安全的编程模型，例如避免使用原生的缓冲区管理函数，使用安全的框架和库来处理输入数据和执行命令，避免缓冲区溢出漏洞。\n- 数据库加密和访问控制：对于敏感数据和命令，使用加密和访问控制措施，确保只有授权用户可以访问和执行命令，避免被攻击者窃取和篡改。\n- 定期更新和升级：定期更新和升级应用程序和库的版本，确保应用程序和库的最新版本包含了最新的安全补丁和修复措施，避免安全漏洞的出现和利用。\n- 安全审计和监控：定期对系统和应用程序进行安全审计和监控，及时发现和阻止潜在的安全漏洞和攻击，确保系统和数据的安全和可靠性。", "title": "如何预防经典缓冲区溢出"}], "cnvd_id": "", "cve_id": "CVE-2026-70415", "cvss": {"cvssv31": [{"source": "security_alert@emc.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.1}]}, "cvss_score": 8.1, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-120", "description": "Dell PowerStore 是 Dell 的企业级存储阵列产品，其内置的 PowerStore OS 通过 SDNAS（Software Defined NAS）组件对外提供 NFS/RPC 等 NAS 协议服务；SDNAS 与底层 NFS/RPC 实现为 Dell 专有闭源组件，不作为独立开源项目分发。\n受影响版本中，SDNAS 在处理远程 NFS/RPC 请求时存在未校验输入长度的缓冲区拷贝（CWE-120 经典缓冲区溢出），未经认证的远程攻击者可向受影响 PowerStore 的 NFS/RPC 服务发送包含恶意负载的网络请求触发缓冲区写入越界，进而导致命令执行或拒绝服务。\n修复版本中通过厂商安全更新 DSA-2026-330 将 PowerStore OS 中 SDNAS 的 NFS/RPC 处理路径修正为对输入数据进行长度校验，阻断未授权远程请求进入危险缓冲区写入路径，从而消除命令执行与拒绝服务风险，建议升级至 PowerStore OS 5.0.0.2-2761110 或更高版本。", "effects": [{"comp_name": "dell_powerstore", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,5.0.0.2-2761110)", "min_fixed_version": "5.0.0.2-2761110", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "经典缓冲区溢出", "kind_en": "不检查输入大小的缓冲区复制（“经典缓冲区溢出”）", "last_modified_time": "2026-08-19", "level": "High", "mps_id": "MPS-x51a-tugf", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-x51a-tugf", "name": "堆缓冲区溢出", "kind_en": "基于堆的缓冲区溢出", "last_modified_time": "2026-08-19", "level": "High", "mps_id": "MPS-1096-grv2", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-1096-grv2", "name": "https://www.oscs1024.com/hd/MPS-1096-grv2"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-49430", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-49430"}, {"url": "https://security.freebsd.org/advisories/FreeBSD-SA-26:40.zfs.asc", "name": ""}], "scope_influence": "", "tags": ["操作系统"], "title": "ZFS接收路径堆溢出", "_translated": true, "_saved_at": "2026-08-19T08:29:19+00:00", "_first_saved_at": "2026-08-19T08:29:19+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-1096-grv2"}, {"analysis_status": 0, "articles": [], "attack_vector_type": "Local", "cnvd_id": "", "cve_id": "CVE-2026-49419", "cvss": {}, "cvss_score": 7.8, "cvss_vector": "", "cwe": "CWE-911", "description": "FreeBSD 是开源 UNIX 类操作系统，其 Jail 子系统提供操作系统级进程隔离；自 15.0 起，jail_set(2) 与 jail_get(2) 支持 JAIL_AT_DESC，使调用可在 jail 描述符所指 prison 的上下文中创建或查询 jail。\n受影响版本中，指定 JAIL_AT_DESC 时，kern_jail_set() 与 kern_jail_get() 在调用 jaildesc_find() 查找描述符对应 prison 之前，先对调用者当前 prison 指针 mypr 执行 prison_free()。若描述符无效或指向已销毁 jail，查找失败后的 done_errmsg/done 路径会再次 prison_free(mypr)，造成引用计数下溢，prison 结构体可能在仍被使用时被释放。无特权本地用户可经 jail_set(2)/jail_get(2) 触发该路径：在宿主上通常立即导致内核 panic，在 jail 内则可能被用于提升权限。\n修复版本中通过先将 jaildesc_find() 结果写入临时指针 jdpr，仅在查找成功后再 prison_free(mypr) 并切换 mypr，使查找失败时错误路径不再二次释放当前 prison，从而消除引用计数下溢。", "effects": [{"comp_name": "freebsd", "ecosystem": "linux", "versions": [{"affected_version": "[15.0-RELEASE,15.0-RELEASE-p11)", "min_fixed_version": "15.0-RELEASE-p11", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[15.1-RELEASE,15.1-RELEASE-p1)", "min_fixed_version": "15.1-RELEASE-p1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "引用计数的更新不恰当", "kind_en": "引用计数更新不当", "last_modified_time": "2026-08-19", "level": "High", "mps_id": "MPS-3efy-v6qk", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-3efy-v6qk", "name": "https://www.oscs1024.com/hd/MPS-3efy-v6qk"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-49419", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-49419"}, {"url": "https://security.freebsd.org/advisories/FreeBSD-SA-26:38.jail.asc", "name": ""}], "scope_influence": "", "tags": ["操作系统"], "title": "FreeBSD Jail引用计数下溢", "_translated": true, "_saved_at": "2026-08-19T06:33:26+00:00", "_first_saved_at": "2026-08-19T06:33:26+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-3efy-v6qk"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-58088", "cvss": {}, "cvss_score": 7.8, "cvss_vector": "", "cwe": "CWE-787", "description": "FreeBSD 是开源类 Unix 操作系统，sys/kern/imgact_elf.c 中的 ELF 核心转储代码负责在进程崩溃或被请求时将进程虚拟内存布局以 ELF 格式写入 core 文件。\n受影响版本中，imgact_elf.c 的 __elfN(corehdr) 流程先统计 vmspace 中可转储 VM map 项数并按该数量分配程序头缓冲区，再以 each_dumpable_segment 回调 cb_put_phdr 第二次遍历 map 填充程序头。通过 rfork(2) 共享地址空间的进程可以在两次遍历之间修改自身 map 项，使第二遍写入超出按初值分配缓冲区边界，造成内核堆越界写入，可能被进一步利用以提升本地权限。\n修复版本中通过为 struct phdr_closure 增加 numsegs 与 nextseg 字段，在 cb_put_phdr 回调里判断 nextseg \u003e= numsegs 时直接返回，并在分配程序头缓冲区时使用 M_ZERO 标志将其清零，确保未被填充的项保持初始化状态，从而切断共享地址空间竞态触发的越界写入路径。", "effects": [{"comp_name": "freebsd", "ecosystem": "linux", "versions": [{"affected_version": "[15.0-RELEASE,15.0-RELEASE-p12)", "min_fixed_version": "15.0-RELEASE-p12", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,14.4-RELEASE-p8)", "min_fixed_version": "14.4-RELEASE-p8", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[15.1-RELEASE,15.1-RELEASE-p2)", "min_fixed_version": "15.1-RELEASE-p2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-08-19", "level": "High", "mps_id": "MPS-5tj6-prgb", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-5tj6-prgb", "name": "https://www.oscs1024.com/hd/MPS-5tj6-prgb"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-58088", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-58088"}, {"url": "https://security.freebsd.org/advisories/FreeBSD-SA-26:55.elf.asc", "name": ""}], "scope_influence": "", "tags": [], "title": "FreeBSD ELF核心转储竞争漏洞", "_translated": true, "_saved_at": "2026-08-19T09:26:50+00:00", "_first_saved_at": "2026-08-19T09:26:50+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-5tj6-prgb"}, {"analysis_status": 0, "articles": [], "attack_vector_type": "Local", "cnvd_id": "", "cve_id": "CVE-2026-49427", "cvss": {}, "cvss_score": 7.8, "cvss_vector": "", "cwe": "CWE-826", "description": "FreeBSD 是开源 UNIX 类操作系统，内核 posixshm 模块提供 POSIX 共享内存，并支持通过 shm_create_largepage(3) 创建由物理连续大页支撑的 largepage 对象。\n受影响版本中，largepage 共享内存对象的物理页未被显式 wired。本地无特权用户可对仍存在映射的该对象调用 sendfile(2) 并传入 SF_NOCACHE，传输完成后 vm_page_release() 会释放底层页，用户空间 unmanaged 映射仍指向已释放内核内存，可被用于提权。\n修复版本中通过在 shm_dotruncate_largepage 分配页时加入 VM_ALLOC_WIRED，在 shm_largepage_phys_ctor 设置 OBJ_PG_DTOR，改由对象析构路径 unwire 并释放，同时让 vm_page_release 对 unmanaged 页只做 unwire，切断 SF_NOCACHE 提前释放仍被映射引用之页的路径。", "effects": [{"comp_name": "freebsd", "ecosystem": "linux", "versions": [{"affected_version": "[15.1-RELEASE,15.1-RELEASE-p1)", "min_fixed_version": "15.1-RELEASE-p1", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[14.3-RELEASE,14.3-RELEASE-p16)", "min_fixed_version": "14.3-RELEASE-p16", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[15.0-RELEASE,15.0-RELEASE-p11)", "min_fixed_version": "15.0-RELEASE-p11", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[14.4-RELEASE,14.4-RELEASE-p7)", "min_fixed_version": "14.4-RELEASE-p7", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "在预期生命周期中对资源的过早释放", "kind_en": "在预期生命周期内过早释放资源", "last_modified_time": "2026-08-19", "level": "High", "mps_id": "MPS-7ud4-vxq0", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-7ud4-vxq0", "name": "https://www.oscs1024.com/hd/MPS-7ud4-vxq0"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-49427", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-49427"}, {"url": "https://security.freebsd.org/advisories/FreeBSD-SA-26:44.posixshm.asc", "name": ""}], "scope_influence": "", "tags": ["操作系统"], "title": "FreeBSD内核页提前释放漏洞", "_translated": true, "_saved_at": "2026-08-19T08:29:25+00:00", "_first_saved_at": "2026-08-19T08:29:25+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-7ud4-vxq0"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "attack_vector_type": "Local", "cnvd_id": "", "cve_id": "CVE-2026-49418", "cvss": {}, "cvss_score": 7.8, "cvss_vector": "", "cwe": "CWE-416", "description": "FreeBSD 是开源操作系统，其虚拟内存子系统通过 device pager 管理可内存映射设备页，非托管设备对象维护内部页链表以便在映射销毁时释放这些页。\n受影响版本中，对非托管设备对象映射调用 msync(MS_INVALIDATE) 时，范围内物理页会被标为无效但仍留在 pager 的 devp_pglist 中；随后缺页由 dev_pager_getpages() 再次把同一页插入该链表，链表损坏，对象销毁时页面被释放两次，可导致内核释放后使用。\n修复版本中通过取消 devp_pglist 链表维护切断重复插入路径，对 OBJT_DEVICE 设置 OBJ_PG_DTOR，改由 dev_pager_dealloc() 按对象页集合释放虚构页，避免双重释放。", "effects": [{"comp_name": "freebsd", "ecosystem": "linux", "versions": [{"affected_version": "[15.1-RELEASE,15.1-RELEASE-p1)", "min_fixed_version": "15.1-RELEASE-p1", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[15.0-RELEASE,15.0-RELEASE-p11)", "min_fixed_version": "15.0-RELEASE-p11", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[14.4-RELEASE,14.4-RELEASE-p7)", "min_fixed_version": "14.4-RELEASE-p7", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[14.3-RELEASE,14.3-RELEASE-p16)", "min_fixed_version": "14.3-RELEASE-p16", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", ffected_version": "[14.3-RELEASE,14.3-RELEASE-p16)", "min_fixed_version": "14.3-RELEASE-p16", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "动态确定对象属性修改的控制不恰当", "kind_en": "动态确定的对象属性的受控修改不当", "last_modified_time": "2026-08-19", "level": "High", "mps_id": "MPS-dgae-98fo", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-dgae-98fo", "name": "https://www.oscs1024.com/hd/MPS-dgae-98fo"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-49428", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-49428"}, {"url": "https://security.freebsd.org/advisories/FreeBSD-SA-26:44.posixshm.asc", "name": ""}], "scope_influence": "", "tags": ["操作系统"], "title": "FreeBSD共享内存释放漏洞", "_translated": true, "_saved_at": "2026-08-19T08:29:21+00:00", "_first_saved_at": "2026-08-19T08:29:21+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-dgae-98fo"}, {"analysis_status": 0, "articles": [], "attack_vector_type": "Local", "cnvd_id": "", "cve_id": "CVE-2026-49429", "cvss": {}, "cvss_score": 7.8, "cvss_vector": "", "cwe": "CWE-122", "description": "FreeBSD 是开源操作系统，基础系统从 7.0 起集成 OpenZFS，并提供 zfs-userspace(8) 查询数据集按用户统计的空间占用。\n受影响版本中，ZFS_IOC_USERSPACE_MANY ioctl 对应的 zfs_ioc_userspace_many 将调用方提供的 64 位 zc_nvlist_dst_size 截断为 32 位 int 后调用 vmem_alloc 分配内核缓冲区，却仍把原始 64 位大小作为 zfs_userspace_many 写回记录的上限。拥有 userused 委托权限的本地用户可触发内核堆溢出并可能提升权限。\n修复版本中通过把 bufsize 改为 uint64_t，并以 1000 条 zfs_useracct_t 为上限截取分配长度，在调用 zfs_userspace_many 前将 zc_nvlist_dst_size 同步为实际分配大小，避免写回超过已分配缓冲区。", "effects": [{"comp_name": "freebsd", "ecosystem": "linux", "versions": [{"affected_version": "[15.1-RELEASE,15.1-RELEASE-p1)", "min_fixed_version": "15.1-RELEASE-p1", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[14.3-RELEASE,14.3-RELEASE-p16)", "min_fixed_version": "14.3-RELEASE-p16", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[15.0-RELEASE,15.0-RELEASE-p11)", "min_fixed_version": "15.0-RELEASE-p11", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[14.4-RELEASE,14.4-RELEASE-p7)", "min_fixed_version": "14.4-RELEASE-p7", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "堆缓冲区溢出", "kind_en": "基于堆的缓冲区溢出", "last_modified_time": "2026-08-19", "level": "High", "mps_id": "MPS-pqjh-nwyo", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-pqjh-nwyo", "name": "https://www.oscs1024.com/hd/MPS-pqjh-nwyo"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-49429", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-49429"}, {"url": "https://security.freebsd.org/advisories/FreeBSD-SA-26:40.zfs.asc", "name": ""}], "scope_influence": "", "tags": ["操作系统"], "title": "FreeBSD ZFS堆溢出漏洞", "_translated": true, "_saved_at": "2026-08-19T08:29:23+00:00", "_first_saved_at": "2026-08-19T08:29:23+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-pqjh-nwyo"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-71551", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "cwe": "CWE-78", "description": "Super Productivity 是一款开源的进阶任务管理与时间跟踪桌面应用，基于 Electron 构建并通过 GitHub Releases 在 Windows、macOS 与 Linux 上分发。\n受影响版本中，electron/ipc-handlers/exec.ts 中由 initExecIpc 通过 ipcMain.on('EXEC') 注册的 listener 接收渲染进程经 IPC.EXEC 通道传入的命令字符串后直接调用 child_process.exec() 执行，未与插件 nodeExecution 同意门控解耦；electron/preload.ts 通过 contextBridge 暴露的 window.ea.exec() 桥可被同源 iframe 插件以及由 new Function() 在宿主 renderer realm 内运行的社区 JS 插件调用，确认弹窗仅保护首次执行且“记住我的回答”默认勾选，已批准的命令随后会被持久化到 simpleSettings 的 ALLOWED_COMMANDS 中以便静默复用，攻击者借助恶意插件、含恶意 JS 的渲染页面或渲染层 XSS 即可在桌面账号权限下获得任意 shell 命令执行能力。\n修复版本中通过从根源移除该 EXEC IPC 原语解决了该问题：删除 electron/ipc-handlers/exec.ts 全部内容并清理 initExecIpc 装配，同时移除 preload.exec 桥、电子端 ElectronAPI.exec() 方法签名与 IPC.EXEC 通道常量与执行链路，仅保留受 nodeExecution 同意门控的 executeNodeScript 作为唯一受认可的进程路径，遗留 COMMAND 任务附件不再执行。", "effects": [{"comp_name": "super-productivity", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,18.13.0)", "min_fixed_version": "18.13.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-08-19", "level": "High", "mps_id": "MPS-xf8y-kzwj", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-xf8y-kzwj", "name": "https://www.oscs1024.com/hd/MPS-xf8y-kzwj"}, {"url": "https://nvd.nist. d": "", "cve_id": "CVE-2026-71676", "cvss": {}, "cvss_score": 7.5, "cvss_vector": "", "cwe": "CWE-122", "description": "Open5GS 是开源 5G 核心网实现，采用 C 语言开发，提供 AMF、SMF、UPF 等 5G 核心网功能组件，其中 AMF 模块使用 lib/nas/5gs/decoder.c 与 lib/nas/5gs/ies.c 中的解码器处理来自 gNB 的 NAS PDU。\n受影响版本中，lib/nas/5gs/decoder.c 的 ogs_nas_5gmm_decode 根据 NAS PDU 的 message type 字节分发到对应的子解码器；攻击者将 message type 从 0x57（Service Accept 类）篡改为 0x4e（注册请求相关），使得解码器把原本属于 Authentication Response IE 的负载误判为 Service Accept 的 TLV 列表，调用链最终进入 lib/nas/5gs/ies.c 的 ogs_nas_5gs_decode_gprs_timer_2。 该函数仅检查 pkbuf-\u003elen \u003c 1 就读取首字节作为 length，并直接以 source-\u003elength + sizeof(source-\u003elength) 计算长度后通过 memcpy 写入目标结构与剩余缓冲区；当攻击者控制 length 字段且超出实际可用缓冲时，会触发 ASAN 报告的 heap-buffer-overflow，导致 open5gs-amfd 进程崩溃，造成 5G 核心网接入与移动性管理服务拒绝。\n修复版本中通过为 lib/nas/5gs/ies.c 中所有 NAS 5GS 解码器增加 pkbuf 最小长度前置校验（pkbuf-\u003elen \u003c N 即返回 -1），并在 lib/nas/5gs/decoder.c 的服务接受解码链路中收紧 type 判定与边界检查，阻止类型混淆后的畸形 TLV 进入 gprs_timer_2 等深层解码函数。", "effects": [{"comp_name": "open5gs", "ecosystem": "linux", "versions": [{"affected_version": "[2.7.0,2.7.5)", "min_fixed_version": "2.7.5", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "堆缓冲区溢出", "kind_en": "基于堆的缓冲区溢出", "last_modified_time": "2026-08-19", "level": "High", "mps_id": "MPS-0z5m-wr12", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-0z5m-wr12", "name": "https://www.oscs1024.com/hd/MPS-0z5m-wr12"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-71676", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-71676"}, {"url": "https://gist.github.com/centauruszzz/0d267967fc5d072f31c866603f7aaf7c", "name": ""}], "scope_influence": "", "tags": [], "title": "Open5GS NAS 5GS 解码器链堆缓冲区溢出漏洞", "_translated": true, "_saved_at": "2026-08-18T21:17:33+00:00", "_first_saved_at": "2026-08-18T21:17:33+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-0z5m-wr12"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-76235", "cvss": {"cvssv31": [{"source": "secalert@redhat.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-401", "description": "Cockpit 是开源的服务器 Web 管理界面，其中 cockpit-ws 是其对外提供 HTTP/WS 服务的守护进程，cockpit-ws 同时由 Red Hat Enterprise Linux 7/8/9/10 以及 Red Hat OpenShift Dev Spaces 发行。\n受影响版本中，src/ws/cockpithandlers.c 中 send_login_html 函数在解析请求头时通过 cockpit_web_server_parse_cookie 取出 CockpitLang cookie 字符串并赋值给局部变量 language，随后该变量被传入 cockpit_web_response_negotiation 用于选择 login 页面的本地化资源，但函数末尾仅调用 g_strfreev(languages) 释放 Accept-Language 路径产生的 languages 数组，并未释放 parse_cookie 返回的 language 字符串。每次携带 CockpitLang cookie 的未鉴权 GET /login 请求都会泄漏该堆分配，远程未鉴权攻击者可重复触发该路径耗尽 cockpit-ws 进程堆内存并造成拒绝服务。\n修复版本中通过在 send_login_html 中针对 CockpitLang cookie 路径使用 g_autofree 管理 language，并在所有出口路径确保该分配的字符串被释放，切断每个未鉴权请求对应的堆泄漏。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "内存泄漏", "kind_en": "有效生命周期后内存丢失释放", "last_modified_time": "2026-08-19", "level": "High", "mps_id": "MPS-1fm5-avdx", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-1fm5-avdx", "name": "https://www.oscs1024.com/hd/MPS-1fm5-avdx"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-76235", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-76235"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-76235", "name": ""}, {"url": "https://bugzilla.redhat.com/show_bug.cgi?id=2519497", "name": ""}], "scope_influence": "", "tags": [], "title": "cockpit-ws登录页处理器内存泄漏漏洞", "_translated": true, "_saved_at": "2026-08-19T14:26:37+00:00", "_first_saved_at": "2026-08-19T13:39:03+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-1fm5-avdx"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-47629", "cvss": {"cvssv31": [{"source": "psirt@nvidia.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-20", "description": "适用于 Linux 的 NVIDIA Triton 推理服务器包含一个漏洞，攻击者可能会导致不正确的输入验证。成功利用可能会导致拒绝服务。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "输入验证不恰当", "kind_en": "输入验证不当", "last_modified_time": "2026-08-19", "level": "High", "mps_id": "MPS-8wjk-3ycl", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-8wjk-3ycl", "name": "https://www.oscs1024.com/hd/MPS-8wjk-3ycl"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-47629", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-47629"}, {"url": "https://github.com/NVIDIA/product-security/tree/main/2026/5865", "name": ""}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-47629", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-47629", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-47629漏洞", "_translated": true, "_saved_at": "2026-08-18T20:16:30+00:00", "_first_saved_at": "2026-08-18T20:16:30+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-8wjk-3ycl"}, {"analysis_status": 3, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "cnvd_id": "", "cve_id": "", "cvss": {"cvssv31": [{"source": "murphysec", "vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "", "cwe": "CWE-416", "description": "Redis 是开源内存数据库，通过 redis-server 对外提供命令接口，广泛用于缓存、消息队列和实时数据处理。\n受影响版本中，多个客户端同时在同一键上等待 BLPOP 等阻塞命令时，服务端会在 handleClientsBlockedOnKey() 中沿等待队列依次唤醒这些连接。唤醒并重新执行其中一个命令时，可能因客户端内存限制把队列里下一个仍在等待的连接连同链表节点一起释放，遍历却继续把这块已释放内存当作有效客户端使用。已认证攻击者可借此接管 redis-server 进程，在主机上执行任意系统命令。该问题独立于 CVE-2026-23479，后者只覆盖“当前正在执行命令的那个客户端”被释放的情况。\n修复版本中通过调整等待队列的遍历方式，每处理完一个等待客户端后重新定位队列头部，不再跨命令缓存下一个节点，避免已驱逐连接被再次访问，从而切断远程代码执行路径。", "effects": [{"comp_name": "redis", "ecosystem": "linux", "versions": [{"affected_version": "[8.4.0,8.4.6)", "min_fixed_version": "8.4.6", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[8.8.0,8.8.2)", "min_fixed_version": "8.8.2", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[7.4.0,7.4.11)", "min_fixed_version": "7.4.11", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[8.6.0,8.6.6)", "min_fixed_version": "8.6.6", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[7.2.0,7.2.16)", "min_fixed_version": "7.2.16", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[8.10.0,8.10.1)", "min_fixed_version": "8.10.1", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[8.2.0,8.2.9)", "min_fixed_version": "8.2.9", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requi  "", "kind_en": "", "last_modified_time": "2026-08-19", "level": "High", "mps_id": "MPS-mqir-4e3a", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-mqir-4e3a", "name": "https://www.oscs1024.com/hd/MPS-mqir-4e3a"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73935", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73935"}, {"url": "https://www.oracle.com/security-alerts/cspuaug2026.html", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-73935漏洞", "_translated": true, "_saved_at": "2026-08-18T22:16:44+00:00", "_first_saved_at": "2026-08-18T22:16:44+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-mqir-4e3a"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "attack_vector_type": "Local", "cnvd_id": "", "cve_id": "CVE-2026-58083", "cvss": {}, "cvss_score": 7.5, "cvss_vector": "", "cwe": "CWE-416", "description": "FreeBSD 是开源操作系统，其内核 kqueue(2) 事件通知机制支持 KQUEUE_CPONFORK 模式，在 fork(2) 时把已注册 knote 复制到子进程。\n受影响版本中，内核在 fork 复制 knote 期间，带定时器过滤器的 knote 可能先触发并进入 kqueue 活动链表。kqueue_fork_copy_knote() 未持有 kqueue 与 knlist 锁即复制 knote 状态，并在 knote 已入队后仍按 KN_QUEUED 再次调用 knote_enqueue()，造成活动链表损坏。本地无特权用户可触发内核释放后使用，并可能导致权限提升。\n修复版本中通过在复制时持有 knlist 与 kqueue 锁、仅继承 KN_ACTIVE 与 KN_DISABLED，并在入队前以 f_event() 判定且拒绝重复 knote_enqueue()，避免活动链表被二次入队损坏，切断释放后使用路径。", "effects": [{"comp_name": "freebsd", "ecosystem": "linux", "versions": [{"affected_version": "[15.1-RELEASE,15.1-RELEASE-p2)", "min_fixed_version": "15.1-RELEASE-p2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "UAF", "kind_en": "免费后使用", "last_modified_time": "2026-08-19", "level": "High", "mps_id": "MPS-mvwo-bqgt", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-mvwo-bqgt", "name": "https://www.oscs1024.com/hd/MPS-mvwo-bqgt"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-58083", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-58083"}, {"url": "https://security.freebsd.org/advisories/FreeBSD-SA-26:50.kqueue.asc", "name": ""}], "scope_influence": "", "tags": ["操作系统"], "title": "FreeBSD kqueue释放后使用", "_translated": true, "_saved_at": "2026-08-19T09:26:48+00:00", "_first_saved_at": "2026-08-19T09:26:48+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-mvwo-bqgt"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-73384", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "cwe": "CWE-201", "description": "Pay with Contact Form 7 是 cmsMinds 维护的开源 WordPress 插件，用于将 PayPal 支付接入 Contact Form 7 表单，并在后台保存表单提交与交易信息。\n受影响版本中，公开可访问的 PayPal IPN 回调脚本 admin/partials/ipn.php 使用 fopen 将 $_POST 完整内容追加写入同目录 PaypalResponse.txt。该日志位于插件 Web 目录，发行包还附带含付款人邮箱、地址、交易号和收款账号的历史 IPN 记录，未认证访问者直接请求该文件即可读取敏感支付数据。\n修复版本中通过尚未发布的官方安全更新切断该日志文件的 Web 暴露路径；截至 2026-08-19，WordPress.org 稳定版本仍为 1.0.4 且 Patchstack 标明无官方补丁，可通过停用插件并删除或禁止访问 PaypalResponse.txt 降低未授权读取风险。", "effects": [{"comp_na 恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-76240", "cvss": {"cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-89", "description": "stigmem-node 是开源 Python 组件，作为 Stigmem 参考节点提供智能体事实存储、召回与联邦能力，并支持 SQLite、libSQL 与 PostgreSQL 后端。\n受影响版本中，PostgresBackend 在建立连接和执行迁移时，将 schema 标识符直接拼入 search_path 连接选项以及 CREATE SCHEMA 语句，未做标识符引用或合法性校验。当前审查路径中该值来自运维配置 Settings.pg_schema（环境变量 STIGMEM_PG_SCHEMA）；若 schema 名称来自租户、请求或用户输入，攻击者可注入 SQL 并破坏数据库机密性、完整性与可用性。\n修复版本中通过 _validate_schema_name 将 schema 限制为安全标识符，并使用 psycopg2.sql.Identifier 构造 CREATE SCHEMA 与 SET search_path，切断标识符拼接注入路径。", "effects": [{"comp_name": "stigmem-node", "ecosystem": "pip", "versions": [{"affected_version": "[0.9.0a1,0.9.0a2)", "min_fixed_version": "0.9.0a2", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-08-19", "level": "High", "mps_id": "MPS-w2i9-8mnk", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-w2i9-8mnk", "name": "https://www.oscs1024.com/hd/MPS-w2i9-8mnk"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-76240", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-76240"}, {"url": "https://github.com/eidetic-labs/stigmem/security/advisories/GHSA-9pc9-4crj-mhpj", "name": ""}, {"url": "https://www.vulncheck.com/advisories/stigmem-postgres-sql-injection-via-schema-identifier", "name": ""}], "scope_influence": "", "tags": ["AI", "python", "开源"], "title": "stigmem-node SQL注入", "_translated": true, "_saved_at": "2026-08-19T15:24:37+00:00", "_first_saved_at": "2026-08-19T15:24:37+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-w2i9-8mnk"}, {"analysis_status": 0, "articles": [], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-58085", "cvss": {}, "cvss_score": 7.4, "cvss_vector": "", "cwe": "CWE-347", "description": "FreeBSD 是开源类 Unix 操作系统内核与用户态系统，wg(4) 是其内核中实现 WireGuard VPN 协议的驱动，使用 ChaCha20-Poly1305 认证加密保护隧道内流量。\n受影响版本中，sys/dev/wg/wg_crypto.c 中的 chacha20poly1305_decrypt_mbuf 等加解密分发辅助函数在调用 OCF 的 crypto_dispatch 之后没有检查返回的 crp_etype，Poly1305 MAC 校验失败被静默忽略，使携带错误认证标签的密文仍被当作合法明文进入隧道。远程攻击者只需能向 WireGuard 端点发送 UDP 数据报并猜中接收方重放窗口的边界，便可向隧道注入伪造或被篡改的传输数据包；位于转发路径上的攻击者更能直接修改通往 FreeBSD 主机的密文与认证数据而绕过完整性校验。\n修复版本中通过在 chacha20poly1305_encrypt_mbuf 与 chacha20poly1305_decrypt_mbuf 中，当 crypto_dispatch 返回 0 时进一步读取并返回 crp_etype，使 MAC 校验失败能够沿调用链传播；同时在 crypto_init 中显式拒绝非同步 OCF 会话，从源头保证解密路径始终处理同步结果，最终拦截一切 Poly1305 校验未通过的报文。", "effects": [{"comp_name": "freebsd:freebsd", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,14.4-RELEASE-p8)", "min_fixed_version": "14.4-RELEASE-p8", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,15.0-RELEASE-p12)", "min_fixed_version": "15.0-RELEASE-p12", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,15.1-RELEASE-p2)", "min_fixed_version": "15.1-RELEASE-p2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "密码学签名的验证不恰当", "kind_en": "密码签名验证不当", "last_modified_time": "2026-08-19", "level": "High", "mps_id": "MPS-br9w-xt0l", "poc": false, "poc_url": [], "published_time": "2026-08-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-br9w-xt0l", "name": "https://www.oscs1024.com/hd/MPS-br9w-xt0l"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-58085", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-58085"}, {"url": "https://security.freebsd.org/advisories/FreeBSD-SA-26:52.if_wg.asc", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "FreeBSD wg(4) WireGuard 驱动 MAC 校验缺失漏洞", "_translated": true, "_saved_at": "2026-08-19T11:19:53+00:00", "_first_saved_at": "2026-08-19T11:19:53+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-br9w-xt0l"}, {"analysis_status": 0, "articles": [], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-75589", "cvss": {}, "cvss_score": 7.4, "cvss_vector": "", "cwe": "CWE-208", "description": "Net::OAuth 是开源 Perl 库，用于构造、签名和校验 OAuth 1.0 协议消息，供 Perl 应用在消费者端或服务端处理 OAuth 请求与响应。\n受影响版本中，对外入口 Net::OAuth::Message::verify 将报文交给 HMAC_SHA1、HMAC_SHA256 或 PLAINTEXT 签名插件，插件使用 Perl 的 eq 运算符比较报文携带的 signature 与本地计算结果，字符串出现差异即返回，拒绝耗时随匹配前缀长度变化。能够提交报文并测量应答时延的客户端可按字节恢复有效签名；PLAINTEXT 模式下比较对象为签名密钥本身，搜索会得到 consumer_secret 与 token_secret。RSA-SHA1 通过 RSA 密钥对象验签，不受影响。\n修复版本中通过新增基类方法 Net::OAuth::SignatureMethod::secure_compare，并将上述三种插件的 verify 改为恒定时间比较，使拒绝时延不再依赖匹配前缀，阻断基于时序的签名或密钥恢复。", "effects": [{"comp_name": "Net::OAuth", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,0.33)",
