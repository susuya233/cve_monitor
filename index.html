63", "description": "Fast Note Sync Service 是开源笔记同步与在线管理服务，提供 WebGUI、远程 REST API 以及与 Obsidian 的笔记同步能力。\n受影响版本中，默认配置开启用户注册且将 admin-uid 设为 0。AdminControlHandler 的 CheckAdmin 与 GetConfig 把 AdminUID 为 0 当作不限制管理员身份，任意已认证用户都能访问 GET /api/admin/config 并取得 AuthTokenKey。用户 JWT 使用 AuthTokenKey 与 machine_id 拼接后签名，Docker 部署下 GetMachineID() 可能返回空串。攻击者可先调用 POST /api/user/register 获得普通账号，再读取签名密钥并伪造任意用户令牌，从而冒充管理员并读取、修改或删除同步笔记。\n修复版本中通过 UserService.IsRegisterEnabled 在 AdminUID 为 0 且系统已存在用户时自动关闭注册，切断未指定管理员时的自注册入口，阻止攻击者继续获取可用于越权的认证令牌。", "effects": [{"comp_name": "github.com/haierkeys/fast-note-sync-service", "ecosystem": "go", "versions": [{"affected_version": "(-∞,2.13.8)", "min_fixed_version": "2.13.8", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-09-02", "level": "Critical", "mps_id": "MPS-r7vl-uyf3", "poc": false, "poc_url": [], "published_time": "2026-09-02", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-r7vl-uyf3", "name": "https://www.oscs1024.com/hd/MPS-r7vl-uyf3"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-52111", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-52111"}, {"url": "https://gist.github.com/L4wCat/924c10c36d6d11651049787d547d411b", "name": ""}, {"url": "https://github.com/haierkeys/fast-note-sync-service/issues/268", "name": ""}], "scope_influence": "", "tags": ["go"], "title": "Fast Note Sync越权漏洞", "_translated": true, "_saved_at": "2026-09-01T20:23:36+00:00", "_first_saved_at": "2026-09-01T20:23:36+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-r7vl-uyf3"}, {"analysis_status": 3, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "", "cvss": {"cvssv31": [{"source": "murphysec", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "", "cwe": "CWE-89", "description": "畅捷通 T+ 是一款面向中小企业的闭源管理软件，POSSyncService.asmx 用于对接零售与 POS 业务同步。\n受影响版本中，该服务未纳入登录校验，也未经过统一安全过滤；多个对外方法把请求参数直接拼进 SQL，攻击者无需登录即可注入，轻则窃取库内敏感数据，重则在数据库权限较高时进一步拿下系统控制权。\n修复版本中通过厂商安全补丁堵住这条注入路径；按 2026-08-20 官方通告，T+2026 请升至补丁 2026.000.000.00157 及以后，T+13.0 请升至补丁 13.000.001.0573 及以后，补丁下载见 https://www.chanjetvip.com/product/goods 。", "effects": [{"comp_name": "畅捷通-TPlus", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2026.000.000.00157)", "min_fixed_version": "2026.000.000.00157", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,13.000.001.0573)", "min_fixed_version": "13.000.001.0573", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "极高", "fix_suggestion": "强烈建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-09-02", "level": "Critical", "mps_id": "MPS-xfyz-0csj", "poc": true, "poc_url": [], "published_time": "2026-09-02", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-xfyz-0csj", "name": "https://www.oscs1024.com/hd/MPS-xfyz-0csj"}, {"url": "https://www.chanjetvip.com/pr SS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-290", "description": "AVideo（WWBN/AVideo）是开源音视频平台，可用于自建点播、直播与频道站点。\n受影响版本中，登录阶段的三项安全控制只依赖客户端 User-Agent。objects/functionsAVideo.php 里的 isAVideoEncoder() 与 isAVideoMobileApp() 将 HTTP_USER_AGENT 与公开硬编码字面量 AVideoEncoder、AVideoMobileApp 做正则匹配，没有 IP 校验或共享密钥。攻击者在提交有效凭证的同时设置 User-Agent: AVideoEncoder，即可让 User::login 跳过暴力破解验证码升级，并让 LoginControl::onUserSignIn 提前返回，从而绕过双因子认证且不写入登录/设备审计记录。\n修复版本中通过取消登录路径对 User-Agent 的信任来恢复上述控制。官方尚未发布修复版本；GitHub Security Advisory 所附建议补丁从 User::login 与 LoginControl::onUserSignIn 中移除 isAVideoEncoder()/isAVideoMobileApp() 豁免，并将 2FA 邮件发送失败改为失败关闭。在上游合入并发布前，应在反向代理或 WAF 侧拒绝不可信来源使用上述 User-Agent。", "effects": [{"comp_name": "AVideo", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,e01e41ecc]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,29.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "使用欺骗进行的认证绕过", "kind_en": "通过欺骗绕过身份验证", "last_modified_time": "2026-09-02", "level": "Critical", "mps_id": "MPS-v5zo-f6yk", "poc": false, "poc_url": [], "published_time": "2026-09-02", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-v5zo-f6yk", "name": "https://www.oscs1024.com/hd/MPS-v5zo-f6yk"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-84479", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-84479"}, {"url": "https://github.com/WWBN/AVideo/security/advisories/GHSA-m9m3-gwh2-337c", "name": ""}, {"url": "https://www.vulncheck.com/advisories/wwbn-avideo-authentication-bypass-via-user-agent-header", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "AVideo认证绕过漏洞", "_translated": true, "_saved_at": "2026-09-02T00:47:03+00:00", "_first_saved_at": "2026-09-02T00:47:03+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-v5zo-f6yk"}, {"analysis_status": 0, "articles": [{"content": "由于整数类型的有限范围，在进行算术运算或操作时，结果可能超出类型的表示范围，导致溢出或环绕。溢出指的是结果超过了类型的最大值或小于了最小值，而环绕指的是结果绕回到类型的最小值或最大值。", "title": "什么是整数溢出或环绕"}, {"content": "- 缓冲区溢出：整数溢出可能导致缓冲区溢出漏洞。当整数溢出导致分配的缓冲区大小不足以容纳结果时，攻击者可以利用这个漏洞覆盖相邻的内存区域，执行恶意代码或篡改程序的状态。\r\n- 身份验证绕过：在进行身份验证或访问控制时，整数溢出可能导致绕过验证的漏洞。攻击者可以构造特殊的输入，使溢出的整数值绕过了预期的验证逻辑，从而获得未经授权的访问权限。\r\n- 数据篡改：整数溢出可能导致数据篡改漏洞。攻击者可以通过使整数溢出，修改计数器、索引或其他控制数据的值，导致程序在处理数据时发生错误或执行意外的操作。", "title": "整数溢出或环绕常见的攻击方式"}, {"content": "- 输入验证与限制：对用户输入的整数进行合理的验证和限制，确保其在允许的范围内。\r\n- 使用安全的整数操作函数：使用安全的整数操作函数，如`add_with_overflow()`、`sub_with_overflow()`、`mul_with_overflow()`等，这些函数会检查并处理溢出情况，确保计算结果在安全范围内。\r\n- 类型检查和转换：在进行整数运算或操作之前，进行类型检查和转换，确保操作数的类型和范围是合适的。\r\n- 强制性编码标准和最佳实践：制定强制性的编码标准和最佳实践，包括对整数运算和操作的规范和限制，以帮助程序员编写更可靠、安全的代码。\r\n- 静态代码分析和测试：使用静态代码分析工具和测试技术来检测和识别潜在的整数溢出问题。这些工具可以帮助发现代码中可能存在的溢出漏洞，并及时修复。", "title": "如何预防整数溢出或环绕"}], "cnvd_id": "", "cve_id": "CVE-2026-59346", "cvss": {}, "cvss_score": 9.3, "cvss_vector": "", "cwe": "CWE-190", "description": "VMware Workstation 与 VMware Fusion 是 Broadcom 旗下的闭源商业桌面虚拟化产品，分别运行于 Windows/Linux 与 macOS 主机，用于在桌面环境中创建和管理虚拟机，其 VMXNET3 虚拟网卡由宿主机侧的 VMX 进程模拟。\n受影响版本中，VMXNET3 虚拟网络适配器的设备模型实现存在整数溢出缺陷，在客户机内拥有本地管理员权限的攻击者可经由该虚拟网卡向宿主机侧的设备模拟逻辑提交触发溢出的输入，破坏宿主机进程的内存状态，最终实现虚拟机逃逸并在宿主机上执行代码。VMXNET3 是两类产品支持的常用高性能半虚拟化网卡，攻击由客户机本地发起，无需网络可达性与宿主机侧用户交互。\n修复版本中通过发布 26H1u1 更新修复 VMXNET3 设备模型中的整数溢出缺陷，Workstation Pro 26H1u1 与 Fusion 26H1u1 的官方发布说明均确认解决该问题；Broadcom 同时声明无可用变通措施，需通过升级完成修复。", "effects": [{"comp_name": "vmware_fusion", "ecosystem": "linux", "versions": [{"affected_version": "[25H2,26H1u1)", "min_fixed_version": "26H1u1", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "vmware_workstation", "ecosystem": "linux", "versions": [{"affected_version": "[25H2,26H1u1)", "min_fixed_version": "26H1u1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "整数溢出或环绕", "kind_en": "整数溢出或环绕", "last_modified_time": "2026-09-03", "level": "Critical", "mps_id": "MPS-14a5-f407", "poc": false, "poc_url": [], "published_time": "2026-09-03", "reference_url_list": [{"url": "https://cybersecuritynews.com/vmware-workstation-and-fusion-vulnerabilities/", "name": ""}, {"url": "https://support.broadcom.com/web/ecx/support-content-notification/-/external/content/SecurityAdvisories/0/38288", "name": ""}, {"url": "https://techdocs.broadcom.com/us/en/vmware-cis/desktop-hypervisors/workstation-pro/26H1/release-notes/vmware-workstation-pro-26h1u1-release-notes.html", "name": ""}, {"url": "https://securityonline.info/vmware-cve-2026-59346-code-execution-host/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "VMware VMXNET3 整数溢出漏洞", "_translated": true, "_saved_at": "2026-09-03T12:28:22+00:00", "_first_saved_at": "2026-09-03T12:28:22+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-14a5-f407"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-85061", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:N", "severity": "critical", "base_score": 10}]}, "cvss_score": 10, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:N", "cwe": "CWE-79", "description": "MapLibre GL JS 是一个用于 Web 浏览器的交互式矢量切片地图库。在 6.4.1 之前，src/util/dom.ts 中的 DOM.sanitize() 将 elem.attributes 作为实时 NamedNodeMap 进行迭代，而 removeAttributes() 从同一集合中删除属性，移动索引并跳过相邻的危险属性。控制不受信任的第三方样式属性字符串或用户提供的自定义属性的攻击者可以提供连续的危险属性，从而导致诸如 onload 或 ontoggle 之类的属性在属性控制将内容插入innerHTML 时幸存下来并执行。受害者必须渲染受影响的地图内容才能执行脚本。此问题已在版本 6.4.1 中修复。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-09-04", "level": "Critical", "mps_id": "MPS-hjtv-ygu3", "poc": false, "poc_url": [], "published_time": "2026-09-04", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-hjtv-ygu3", "name": "https://www.oscs1024.com/hd/MPS-hjtv-ygu3"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-85061", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-85061"}, {"url": "https://github.com/maplibre/maplibre-gl-js/commit/1da69f3cd913a39fa948708e01478663bf48bc27", "name": ""}, {"url": "https://github.com/maplibre/maplibre-gl-js/pull/8189", "name": ""}, {"url": "https://github.com/maplibre/maplibre-gl-js/releases/tag/v6.4.1", "name": ""}, {"url": "https://github.com/maplibre/maplibre-gl-js/security/advisories/GHSA-jrc7-96c5-q579", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-85061漏洞", "_translated": true, "_saved_at": "2026-09-03T22:08:31+00:00", "_first_saved_at": "2026-09-03T22:08:31+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-hjtv-ygu3"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-58400", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.1}]}, "cvss_score": 9.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:C/C:H/I:H/A:H", "cwe": "CWE-470", "description": "GeoNetwork 是一个用于管理空间参考资源的目录应用程序。在版本 4.4.12 和 4.2.17 之前，用于呈现格式化程序的 Saxon XSLT 处理器配置为不进行安全处理 (FEATURE_SECURE_PROCESSING)，并且不禁用 Java 扩展函数 (ALLOW_EXTERNAL_FUNCTIONS)。因此，GeoNetwork 加载的任何样式表都可以调用\n直接`java.lang.Runtime.exec()`或`java.lang.ProcessBuilder`，实现以GeoNetwork进程用户的任意命令执行。具有足够权限上传格式化程序的用户可以传递包含 Java 扩展调用的“.xsl”文件，该文件使用 GeoNetwork 进程的权限执行任意操作系统命令。该问题已在 GeoNetwork 版本 4.4.12 和 4.2.17 中修复。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "使用外部可控制的输入来选择类或代码（不安全的反射）", "kind_en": "使用外部控制输入来选择类或代码（“不安全反射”）", "last_modified_time": "2026-09-04", "level": "Critical", "mps_id": "MPS-qa7r-ixdw", "poc": false, "poc_url": [], "published_time": "2026-09-04", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-qa7r-ixdw", "name": "https://www.oscs1024.com/hd/MPS-qa7r-ixdw"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-58400", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-58400"}, {"url": "https://docs.geonetwork-opensource.org/4.2/overview/change-log/version-4.2.17", "name": ""}, {"url": "https://docs.geonetwork-opensource.org/4.4/overview/change-log/version-4.4.12", "name": ""}, {"url": "https://github.com/geonetwork/core-geonetwork/security/advisories/GHSA-x898-729x-cc3r", "name": ""}, {"url": "https://thehackernews.com/2026/09/geonetwork-fixes-unauthenticated-rce.html", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-58400漏洞", "_translated": true, "_saved_at": "2026-09-03T19:34:22+00:00", "_first_saved_at": "2026-09-03T19:34:22+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-qa7r-ixdw"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-14828", "cvss": {"cvssv31": [{"source": "0fc0942c-577d-436f-ae8e-945763c79b02", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-89", "description": "ManageEngine Password Manager Pro、PAM360 与 Access Manager Plus 是 Zoho 提供的闭源企业特权访问与密码管理软件，用于集中保管凭证、控制特权会话并审计敏感账户访问。\n受影响版本中，已认证用户可向应用提交恶意查询输入，使本应作为普通条件的数据进入 SQL 语句执行路径，从而对后端数据库执行非预期 SQL 操作，造成凭证库数据泄露、篡改或进一步扩大访问。\n修复版本中通过官方安全更新消除该认证 SQL 注入路径，Password Manager Pro 13235、PAM360 8561 与 Access Manager Plus 4405 及后续版本不再存在该问题。", "effects": [{"comp_name": "manageengine_access_manager_plus", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,4405)", "min_fixed_version": "4405", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "manageengine_pam360", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,8561)", "min_fixed_version": "8561", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "manageengine_password_manager_pro", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,13235)", "min_fixed_version": "13235", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-09-02", "level": "High", "mps_id": "MPS-05cd-ga4u", "poc": false, "poc_url": [], "published_time": "2026-09-02", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-05cd-ga4u", "name": "https://www.oscs1024.com/hd/MPS-05cd-ga4u"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-14828", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-14828"}, {"url": "https://www.manageengine.com/products/passwordmanagerpro/advisory/cve-2026-14828.html", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "ManageEngine SQL注入漏洞", "_translated": true, "_saved_at": "2026-09-02T10:24:06+00:00", "_first_saved_at": "2026-09-02T10:24:06+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-05cd-ga4u"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应 \\"\\%\\\u003c\\\u003e]*，并在 sac_special_chars() 中增加 htmlspecialchars($s, ENT_QUOTES, 'UTF-8')，阻止属性注入并切断存储型 XSS。", "effects": [{"comp_name": "simple-ajax-chat", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,20260827)", "min_fixed_version": "20260827", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-09-02", "level": "High", "mps_id": "MPS-a4yl-x2br", "poc": false, "poc_url": [], "published_time": "2026-09-02", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-a4yl-x2br", "name": "https://www.oscs1024.com/hd/MPS-a4yl-x2br"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-81807", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-81807"}, {"url": "https://wpscan.com/vulnerability/7aceefd5-aa09-4828-b375-6a62997fa0c2/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Simple Ajax Chat存储型XSS", "_translated": true, "_saved_at": "2026-09-02T10:24:14+00:00", "_first_saved_at": "2026-09-02T10:24:14+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-a4yl-x2br"}, {"analysis_status": 3, "articles": [{"content": "- 攻击者通过向受信任的数据序列化过程中添加恶意数据，从而在序列化和反序列化过程中执行恶意代码的攻击漏洞。这种漏洞通常存在于使用序列化 (serialization) 机制存储和传输数据的程序中。\n", "title": "什么是反序列化"}, {"content": "- 注入攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码注入到程序中，从而实现代码执行的目的。\n- 反射攻击：攻击者使用反射机制，在序列化过程中动态生成恶意数据，并将恶意代码注入到程序中，从而实现代码执行的目的。\n- 缓冲区溢出攻击：攻击者通过在序列化过程中向缓冲区输入恶意数据，导致缓冲区溢出，从而破坏程序的内存管理，实现代码执行的目的。\n- 格式字符串攻击：攻击者通过在序列化过程中输入恶意数据，导致程序使用错误的格式字符串，从而实现代码执行的目的。\n- 数据流攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码作为一个数据流传递给程序，从而实现代码执行的目的。\n", "title": "反序列化常见的攻击方式"}, {"content": "- 不信任输入数据：程序应该严格检查输入数据的有效性，并避免使用不受信任的数据。\n- 使用安全的序列化机制：程序应该使用安全的序列化机制，如 JSON 或 XML 序列化，而不是第三方序列化库。\n- 最小特权原则：程序应该限制对受信任数据的处理权限，并避免在运行时修改数据。\n- 代码审查和漏洞扫描：程序应该进行代码审查和漏洞扫描，以发现和修复潜在的安全漏洞。\n", "title": "如何预防反序列化"}], "cnvd_id": "", "cve_id": "", "cvss": {"cvssv31": [{"source": "github_advisory", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}, {"source": "murphysec", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "", "cwe": "CWE-502", "description": "MLflow 是开源机器学习生命周期管理平台，提供模型注册、部署与加载能力，广泛用于 MLOps 与 AI 基础设施。\n受影响版本中，MLflow 引入 MLFLOW_ALLOW_PICKLE_DESERIALIZATION 环境变量以阻止不安全的 pickle 反序列化，但 mlflow.statsmodels 模型加载模块中的 _load_model 与 _load_pyfunc 在加载模型时未检查该开关，直接调用 statsmodels.iolib.api.load_pickle 执行 pickle.load。攻击者将 loader_module 设为 mlflow.statsmodels 的恶意 MLmodel 工件写入 MLflow 工件存储后，受害者调用 mlflow.pyfunc.load_model 加载该模型时，即使 MLFLOW_ALLOW_PICKLE_DESERIALIZATION=False 也会触发任意代码执行。\n修复版本中通过在 mlflow/statsmodels/__init__.py 的 _load_model 函数开头增加与 sklearn 模型加载模块一致的 MLFLOW_ALLOW_PICKLE_DESERIALIZATION 守卫检查，在开关为 False 且非 Databricks 运行环境时抛出 MlflowException，阻止 statsmodels 模型加载路径绕过 pickle 反序列化安全控制。", "effects": [{"comp_name": "mlflow", "ecosystem": "pip", "versions": [{"affected_version": "[2.1.0,3.15.0)", "min_fixed_version": "3.15.0", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "低", "fix_suggestion": "建议修复", "kind": "反序列化", "kind_en": "不可信数据的反序列化", "last_modified_time": "2026-09-02", "level": "High", "mps_id": "MPS-inla-z0vu", "poc": true, "poc_url": [], "published_time": "2026-09-02", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-inla-z0vu", "name": "https://www.oscs1024.com/hd/MPS-inla-z0vu"}, {"url": "https://github.com/mlflow/mlflow/security/advisories/GHSA-gqvg-gmmx-x4hm", "name": ""}, {"url": "https://github.com/mlflow/mlflow/pull/24686", "name": ""}, {"url": "https://github.com/mlflow/mlflow/commit/38615289094a4b700a20b5d1dbfbe57bdfb0411f", "name": ""}, {"url": "https://github.com/mlflow/mlflow/releases/tag/v3.15.0", "name": ""}, {"ur 增 verifySafeModelBeforeLoad，调用 CModelGraphValidator 对模型归档做静态扫描；一旦发现 __setstate__/__getstate__ 或禁止操作即拒绝加载，切断加载阶段的恶意执行，并继续保留加载后的图校验作为补充防护。", "effects": [{"comp_name": "elasticsearch", "ecosystem": "linux", "versions": [{"affected_version": "[8.0.0,8.19.20)", "min_fixed_version": "8.19.20", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[9.0.0,9.4.5)", "min_fixed_version": "9.4.5", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[9.5.0,9.5.1)", "min_fixed_version": "9.5.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "高", "fix_suggestion": "建议修复", "kind": "反序列化", "kind_en": "不可信数据的反序列化", "last_modified_time": "2026-09-02", "level": "High", "mps_id": "MPS-jer9-yi2x", "poc": true, "poc_url": [], "published_time": "2026-09-02", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-jer9-yi2x", "name": "https://www.oscs1024.com/hd/MPS-jer9-yi2x"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-72649", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-72649"}, {"url": "https://discuss.elastic.co/t/elasticsearch-8-19-20-9-4-5-9-5-1-security-update-esa-2026-114/390087", "name": ""}, {"url": "https://github.com/elastic/ml-cpp/commit/09ea7b580b44112c1b02cbd78b37e885e9be397a", "name": "Commit"}], "scope_influence": "一般", "tags": ["AI", "poc", "专家校准", "应用软件", "数据库"], "title": "Elasticsearch 机器学习组件反序列化远程代码执行漏洞", "_translated": true, "_saved_at": "2026-09-02T10:24:11+00:00", "_first_saved_at": "2026-09-02T10:24:11+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-jer9-yi2x"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-84268", "cvss": {"cvssv31": [{"source": "secalert@redhat.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "cwe": "CWE-122", "description": "gvfs 是 GNOME 桌面环境默认使用的开源虚拟文件系统框架，通过 sftp、smb、ftp 等后端守护进程为文件管理器与 GIO 应用提供统一的网络文件系统挂载和读写能力，本次漏洞涉及其 SFTP 后端进程 gvfsd-sftp。\n受影响版本中，daemon/gvfsbackendsftp.c 的 read_reply() 把服务器返回的 32 位数据长度 count 直接作为读取长度，调用 g_input_stream_read_all() 写入按客户端请求大小 g_malloc (bytes_requested) 分配的 GVfsJobRead 缓冲区，全程未将 count 与 bytes_requested 比较；恶意 SFTP 服务器在响应 SSH_FXP_READ 时返回超过请求量的长度，便能向该堆缓冲区后方越界写入数据，破坏相邻堆内存，gvfsd-sftp 因 glibc 检测到堆损坏而 abort，形成可靠拒绝服务，越界数据可到达回复对象的 free_func 指针等控制流数据，存在进一步演变为代码执行的空间。\n修复版本中通过在 read_reply() 中增加服务器长度校验解决该问题：上游提交 5ab77256 先以 count = MIN (count, G_VFS_JOB_READ (job)-\u003ebytes_requested) 将读取长度截断到客户端请求大小，随后提交 1ff24454 与稳定分支提交 1590471a 按 SFTP 规范改为当 count 大于 bytes_requested 时直接返回 Invalid reply received 错误，使服务器返回的超长数据无法再越过客户端请求的缓冲区边界。", "effects": [{"comp_name": "gvfs", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.60.2)", "min_fixed_version": "1.60.2", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,1.61.90)", "min_fixed_version": "1.61.90", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "堆缓冲区溢出", "kind_en": "基于堆的缓冲区溢出", "last_modified_time": "2026-09-02", "level": "High", "mps_id": "MPS-r2da-blcv", "poc": false, "poc_url": [], "published_time": "2026-09-02", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-r2da-blcv", "name": "https://www.oscs1024.com/hd/MPS-r2da-blcv"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-84268", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-84268"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-84268", "name": ""}, {"url": "https://bugzilla.redhat.com/show_bug.cgi?id=2526485", "name": ""}, {"url": "https://gitlab.gnome.org/GNOME/gvfs/-/issues/862", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "gvfs SFTP后端堆缓冲区溢出漏洞", "_translated": true, "_saved_at": "2026-09-01T17:10:59+00:00", "_first_saved_at": "2026-09-01T17:10:59+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-r2da-blcv"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-84208", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "high", "base_score": 7.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-89", "description": "AVideo 是 WWBN 维护的开源音视频平台（Composer 包 wwbn/avideo），用于自建直播、点播与内容分发，User_Location 插件提供基于 IP 的地理位置识别。\n受影响版本中，plugin/User_Location/regions.json.php 与 cities.json.php 无认证校验，将 GET 参数 country、region 传入 IP2Location::getRegions() 与 getCities()，并以 country_name = '{$country_name}'、region_name = '{$region_name}' 拼入查询后调用 sqlDAL::readSql($sql)。未绑定占位符导致攻击者可用 UNION 注入读取 users 密码哈希及其他库数据。\n修复版本中通过把上述语句改为 country_name = ? 与 region_name = ?，并分别以 sqlDAL::readSql($sql, 's', [$country_name]) 与 sqlDAL::readSql($sql, 'ss', [$country_name, $region_name]) 绑定参数，使外部输入不再进入 SQL 文本，切断未认证读取。", "effects": [{"comp_name": "wwbn/avideo", "ecosystem": "composer", "versions": [{"affected_version": "(-∞,29.0]", "min_fixed_version": "", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-09-02", "level": "High", "mps_id": "MPS-8kad-7gwq", "poc": false, "poc_url": [], "published_time": "2026-09-02", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-8kad-7gwq", "name": "https://www.oscs1024.com/hd/MPS-8kad-7gwq"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-84208", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-84208"}, {"url": "https://github.com/WWBN/AVideo/security/advisories/GHSA-xj29-cg44-33q6", "name": ""}, {"url": "https://www.vulncheck.com/advisories/avideo-user-location-plugin-unauthenticated-sql-injection", "name": ""}], "scope_influence": "", "tags": ["php", "开源"], "title": "AVideo SQL注入漏洞", "_translated": true, "_saved_at": "2026-09-02T00:47:07+00:00", "_first_saved_at": "2026-09-02T00:47:07+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-8kad-7gwq"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-84476", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "high", "base_score": 7.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U: l_list": [{"url": "https://www.oscs1024.com/hd/MPS-e6vj-7xr0", "name": "https://www.oscs1024.com/hd/MPS-e6vj-7xr0"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-84485", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-84485"}, {"url": "https://github.com/apitable/apitable", "name": ""}, {"url": "https://github.com/apitable/apitable/blob/88b24ce9f359cc434778be75d03603182882dc76/backend-server/application/src/main/java/com/apitable/internal/controller/InternalOrganizationController.java#L58", "name": ""}, {"url": "https://github.com/apitable/apitable/blob/88b24ce9f359cc434778be75d03603182882dc76/backend-server/application/src/main/java/com/apitable/shared/context/LoginContext.java", "name": ""}, {"url": "https://github.com/apitable/apitable/blob/88b24ce9f359cc434778be75d03603182882dc76/backend-server/application/src/main/java/com/apitable/shared/interceptor/ResourceInterceptor.java#L85", "name": ""}, {"url": "https://www.vulncheck.com/advisories/apitable-through-1.13.0-beta.1-missing-authentication-on-the-internal-organization-load-or-search-endpoint", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "APITable组织接口缺失认证", "_translated": true, "_saved_at": "2026-09-02T05:20:38+00:00", "_first_saved_at": "2026-09-02T05:20:38+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-e6vj-7xr0"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-84715", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-862", "description": "FeatherPanel 是 MythicalLTD 维护的开源服务器托管面板，采用 AGPL-3.0 许可，用于管理游戏服务器、子用户权限、备份与节点配置。\n受影响版本中，已认证子用户访问 PATCH /api/user/servers/{uuidShort}/subusers/{subuserId} 时，ServerMiddleware 经 ServerGateway::canUserAccessServer 只确认调用者属于该服务器，SubuserController::updateSubuser 未再校验 user.update，也未禁止修改自身权限记录，请求体中的 permissions 数组会被 json_encode 后直接交给 Subuser::updateSubuser 写入，最低权限子用户可借此授予自己完整服务器控制权并访问敏感数据、备份与服务器配置。\n修复版本中通过在 updateSubuser 中强制检查 user.update、拒绝修改自身子用户记录、校验权限名是否属于已知集合，并限制子用户只能授予自己已持有的权限，切断低权限子用户自我提权路径。", "effects": [{"comp_name": "FeatherPanel", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.3.7.10)", "min_fixed_version": "1.3.7.10", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-09-02", "level": "High", "mps_id": "MPS-hr8x-eyma", "poc": false, "poc_url": [], "published_time": "2026-09-02", "refer 制，及时发现异常的资源消耗情况，并采取相应的措施来应对。\r\n- 压力测试与性能优化：应用程序应该进行压力测试，以评估其在高负载情况下的性能，并进行必要的性能优化，以确保能够有效地处理大量请求而不耗尽资源。", "title": "如何预防拒绝服务"}], "cnvd_id": "", "cve_id": "CVE-2026-84304", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-400", "description": "gRPC-Go（模块路径 google.golang.org/grpc）是 gRPC 的开源 Go 语言实现，用于基于 HTTP/2 提供高性能远程过程调用。\n受影响版本中，HTTP/2 DATA 帧经 http2Server.handleData 进入 Stream.write 后，recvBuffer.put 会把每一帧单独存为 backlog 中的一条 recvMsg。未认证攻击者可将负载拆成海量 1 字节 DATA 帧并多路复用并发流；即便总字节数仍处于连接与流的流量控制窗口内，每帧的 recvMsg 结构体与缓冲元数据仍会不成比例地占用堆内存，最终导致进程 panic 或因内存耗尽退出。\n修复版本中通过 compactBacklogLocked 对接收缓冲做压缩：当未压缩后缀的堆开销相对实际负载过高且超过阈值时，把连续小缓冲合并为 BufferPool 中的单一大缓冲，切断按帧膨胀内存的路径。该压缩默认启用，可用环境变量 GRPC_GO_EXPERIMENTAL_ENABLE_RECEIVE_BUFFER_COMPACTION 临时关闭。", "effects": [{"comp_name": "google.golang.org/grpc", "ecosystem": "go", "versions": [{"affected_version": "(-∞,1.83.1)", "min_fixed_version": "1.83.1", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "拒绝服务", "kind_en": "不受控制的资源消耗", "last_modified_time": "2026-09-02", "level": "High", "mps_id": "MPS-rjov-gs27", "poc": false, "poc_url": [], "published_time": "2026-09-02", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-rjov-gs27", "name": "https://www.oscs1024.com/hd/MPS-rjov-gs27"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-84304", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-84304"}, {"url": "https://github.c E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-613", "description": "Memos 是开源的自托管笔记与知识管理服务，采用 Go 语言编写，支持多用户注册与 Web 端访问，0.26.0 版本起引入基于刷新令牌轮换的会话保持机制。\n受影响版本中，用户通过 UpdateUser RPC 修改密码时，password 更新路径仅重新计算 bcrypt 口令哈希并写入 update.PasswordHash，落库后未调用 RemoveUserRefreshToken 撤销该用户已签发的刷新令牌；server/auth/authenticator.go 的 AuthenticateByRefreshToken 校验时仅检查令牌签名、数据库记录存在性与 ExpiresAt 有效期，不比对口令修改时间。攻击者预先窃取的刷新令牌在受害用户修改密码后仍保持有效，可继续调用公开的 /memos.api.v1.AuthService/RefreshToken RPC 换取新的访问令牌，并轮换出新的 30 天有效期刷新令牌，从而无限期维持对账户的访问。\n修复版本中通过，可通过以下方式缓解：在密码修改成功后删除该用户的全部刷新令牌记录并强制重新登录，强制全站 HTTPS 以降低刷新令牌被窃取的风险，并在反向代理侧限制 RefreshToken RPC 的调用来源与频率；对已疑似失陷的账户，由管理员清除其全部会话令牌。", "effects": [{"comp_name": "github.com/usememos/memos", "ecosystem": "go", "versions": [{"affected_version": "[0.26.0,0.30.0]", "min_fixed_version": "", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "不充分的会话过期机制", "kind_en": "会话过期时间不足", "last_modified_time": "2026-09-02", "level": "High", "mps_id": "MPS-2lp3-6nvw", "poc": false, "poc_url": [], "published_time": "2026-09-02", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-2lp3-6nvw", "name": "https://www.oscs1024.com/hd/MPS-2lp3-6nvw"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-84203", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-84203"}, {"url": "https://github.com/usememos/memos", "name": ""}, {"url": "https://github.com/usememos/memos/blob/v0.30.0/server/auth/authenticator.go", "name": ""}, {"url": "https://github.com/usememos/memos/blob/v0.30.0/server/router/api/v1/user_service.go", "name": ""}, {"url": "https://www.vulncheck.com/advisories/memos-0.26.0-through-0.30.0-insufficient-session-expiration-on-password-change", "name": ""}], "scope_influence": "", "tags": ["go"], "title": "Memos 刷新令牌撤销缺失漏洞", "_translated": true, "_saved_at": "2026-09-01T17:11:04+00:00", "_first_saved_at": "2026-09-01T17:11:04+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-2lp3-6nvw"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-19754", "cvss": {"cvssv4": [{"source": "help@fluidattacks.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-89", "description": "Baserow 是开源无代码数据库与应用构建平台，基于 Django 与 PostgreSQL，提供表格、自动化和 API，可自托管或使用云服务。\n受影响版本中，公式函数 index() 对外接受未文档化的第四个参数。类型检查只确认该参数为文本，随后 BaserowIndex.to_django_expression_given_args 把它当作 value_sql 交给 JSONBArrayGetElement.as_sql()，再用字符串格式化写入 PostgreSQL 表达式。已认证的低权限用户只要能够创建或修改公式字段，保存后 FormulaFieldType.after_create 会立即重算字段值，注入语句以 Baserow 数据库角色权限执行，可读取 auth_user 中的用户名与密码哈希，并把攻击者账号的 is_staff 改为 true 以获得实例管理权限。\n修复版本中通过拒绝用户提供的第三、四个 index() 参数，并在 JSONBArrayGetElement 中把 value_sql 限制为内置白名单模板，阻止攻击者控制的 SQL 模板进入查询文本。截至 2026-09-02，该改动已合入 develop（PR #5902），官方尚未发布包含该修复的正式版本。", "effects": [{"comp_name": "baserow", "ecosystem": "linux", "versions": [{"affected_version": "[2.2.0,2.3.3]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-09-02", "level": "High", "mps_id": "MPS-fj2p-z5in", "poc": false, "poc_url": [], "published_time": "2026-09-02", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-fj2p-z5in", "name": "https://www.oscs1024.com/hd/MPS-fj2p-z5in"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-19754", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-19754"}, {"url": "https://fluidattacks.com/es/advisories/superestrella", "name": ""}, {"url": "https://github.com/baserow/baserow", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Baserow公式SQL注入", "_translated": true, "_saved_at": "2026-09-02T05:20:31+00:00", "_first_saved_at": "2026-09-02T05:20:31+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-fj2p-z5in"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-83551", "cvss": {"cvssv31": [{"source": "ff89ba41-3aa1-4d27-914a-91399e9639e5", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.2}], "cvssv4": [{"source": "ff89ba41-3aa1-4d27-914a-91399e9639e5", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:N/VA:N/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.5}]}, "cvss_score": 8.5, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:N/VA:N/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-312", "description": "Amazon SageMaker Python SDK 是 AWS 官方开源 Python 库，用于在 Amazon SageMaker 上训练、部署机器学习模型，并通过 @step、@remote 装饰器将 Python 函数编译为流水线步骤或远程作业。\n受影响版本中，@step 与 @remote 装饰器流水线组件使用 HMAC 校验上传到 S3 的 cloudpickle 函数载荷。StepsCompiler 用 secrets.token_hex(32) 生成对称 HMAC 密钥，_Job.compile 将其写入训练作业 Environment 的 REMOTE_FUNCTION_SECRET_KEY，并随流水线定义持久化。同一 AWS 账号内具备 sagemaker:DescribePipeline 权限的身份可从 DescribePipeline 响应提取该明文密钥，伪造带有效 HMAC 的载荷并覆盖 S3 对象，使受害用户流水线在其执行角色上下文中反序列化执行攻击者代码。\n修复版本中通过将 v3 步骤编译器的 _function_step_secret_token 替换为客户端持有的 ECDSA 私钥、仅把公钥写入流水线定义，并在 v2 中移除 hmac_key 及 REMOTE_FUNCTION_SECRET_KEY 存储，阻止对称密钥经 DescribePipeline 泄露后被用于伪造完整性签名。已用 @step 创建的流水线需在升级后调用 pipeline.upsert() 替换旧密钥材料；@remote 用户升级 SDK 即可，因每次调用会创建不含持久化密钥的新作业。", "effects": [{"comp_name": "sagemaker", "ecosystem": "pip", "versions": [{"affected_version": "(-∞,2.256.0)", "min_fixed_version": "2.256.0", "repository": "pip", "solutions": [], "upstream": true}, {"affected_version": "[3.0.0,3.11.0)", "min_fixed_version": "3.11.0", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "敏感数据的明文存储", "kind_en": "敏感信息的明文存储", "last_modified_time": "2026-09-02", "level": "High", "mps_id": "MPS-xm6t-lzkp", "poc": false, "poc_url": [], "published_time": "2026-09-02", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-xm6t-lzkp", "name": "https://www.oscs1024.com/hd/MPS-xm6t-lzkp"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-83551", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-83551"}, {"url": "https://aws.amazon.com/security/security-bulletins/2026-093-aws/", "name": ""}, {"url": "https://github.com/aws/sagemaker-python-sdk/releases/tag/v2.256.0", "name": ""}, {"url": "https://github.com/aws/sagemaker-python-sdk/releases/tag/v3.11.0", "name": ""}, {"url": "https://github.com/aws/sagemaker-python-sdk/security/advisories/GHSA-7xmc-crrw-fv5r", "name": ""}], "scope_influence": "", "tags": ["AI", "python", "开源"], "title": "SageMaker明文存储密钥", "_translated": true, "_saved_at": "2026-09-01T20:23:33+00:00", "_first_saved_at": "2026-09-01T20:23:33+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-xm6t-lzkp"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-14982", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:H/A:H", "severity": "high", "base_score": 8.1}]}, "cvss_score": 8.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:H/A:H", "cwe": "CWE-22", "description": "WP File Download 是 JoomUnited 出品的商业 WordPress 插件，用于在站点中管理、分类并提供文件下载，源码不以公开 GitHub 仓库或 WordPress.org 插件目录形式分发。\n受影响版本中，delete 功能对文件路径校验不足。订阅者及以上权限的认证用户可先向 file.save 任务提交路径穿越字符串并写入文件元数据，再请求 file.delete 任务触发 unlink，从而删除服务器上的任意文件；两条接口均缺少能力校验与 nonce 校验。删除 wp-config.php 等关键文件后可导致远程代码执行。官方标题指出触发参数为 remoteurl。\n修复版本中通过官方 CVE 记录将受影响范围限定为 6.3.4 及之前版本，但厂商 changelog 未单独记载路径校验、能力校验或 nonce 校验改动，公开渠道也未提供修复 commit。部署方应按官方影响范围核对待升级版本，并限制低权限用户调用 file.save 与 file.delete 接口。", "effects": [{"comp_name": "wp-file-download", "ecosystem": "linux", "versions": [{"affected_vers ntent. The rb+ behavior creates a non-truncating overwrite and trailing bytes when the new export is shorter, and overwriting an executable PHP file can lead to remote code execution. This issue is fixed in version 3.1.70.", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "文件名或路径的外部可控制", "kind_en": "文件名或路径的外部控制", "last_modified_time": "2026-09-02", "level": "High", "mps_id": "MPS-dti8-s2e3", "poc": false, "poc_url": [], "published_time": "2026-09-02", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-dti8-s2e3", "name": "https://www.oscs1024.com/hd/MPS-dti8-s2e3"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-84374", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-84374"}, {"url": "https://github.com/SpartnerNL/Laravel-Excel/commit/b5cafdfcf7ec63924e83303763be8fcae340f70b", "name": ""}, {"url": "https://github.com/SpartnerNL/Laravel-Excel/releases/tag/3.1.70", "name": ""}, {"url": "https://github.com/SpartnerNL/Laravel-Excel/security/advisories/GHSA-c7r6-vx3h-w5g2", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-84374漏洞", "_translated": true, "_saved_at": "2026-09-04T00:37:59+00:00", "_first_saved_at": "2026-09-01T22:55:49+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-dti8-s2e3"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-84375", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-407", "description": "js-yaml is a JavaScript YAML parser and dumper. From 3.0.0 until 3.15.2 and 4.3.2, maxTotalMergeKeys in lib/js-yaml/loader.js and lib/loader.js does not count empty mapping sources while processing the merge key \u003c\u003c. An attacker can alias a large sequence of emp 0", "description": "ldap_auth（LDAP / Active Directory Integration）是发布在 drupal.org 的开源 Drupal 贡献模块，用于让用户使用 LDAP 或 Active Directory 凭据登录 Drupal 站点。\n受影响版本中，模块的测试配置端点 /testLdapConfig 在路由 ldap_auth.test_configuration 中声明 _access: 'TRUE'，未认证请求可携带 POST 参数 user 直接调用；控制器 miniorange_ldapController::test_configuration() 将输入传入 search_user_attributes()，该函数通过 str_replace('?', $username, $search_filter) 把未经 ldap_escape() 转义的用户名拼入 LDAP 搜索过滤器并交给 ldap_search() 执行，且把命中条目的属性回显给调用者。登录链路 LDAPFlow::ldapLogin() 与用户同步链路 UserSyncService 在构造过滤器前均已调用 LdapConnectionService::escape() 转义，此路径缺少同等处理，攻击者可注入 LDAP 过滤器语法检索服务账号可见的任意目录条目并读取其属性，造成信息泄露。\n修复版本中通过将 /testLdapConfig 限制为授权管理员访问并对用户名输入执行 LDAP 过滤器转义来切断注入链路，官方安全公告 SA-CONTRIB-2026-115 指定修复版本为 2.2.1；截至 2026-09-02，公开仓库中 2.2.1 标签与 2.2.0 指向同一提交、对应发布包除打包版本信息外代码一致，修复 diff 暂无法逐行核对，已部署站点在升级基础上建议额外限制外部对 /testLdapConfig 的访问。", "effects": [{"comp_name": "drupal/ldap_auth", "ecosystem": "composer", "versions": [{"affected_version": "[0.0.0,2.2.1)", "min_fixed_version": "2.2.1", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "LDAP注入", "kind_en": "LDAP 查询中使用的特殊元素的不正确中和（“LDAP 注入”）", "last_modified_time": "2026-09-02", "level": "High", "mps_id": "MPS-p86n-xula", "poc": false, "poc_url": [], "published_time": "2026-09-02", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-p86n-xula", "name": "https://www.oscs1024.com/hd/MPS-p86n-xula"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-81205", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-81205"}, {"url": "https://www.drupal.org/sa-contrib-2026-115", "name": ""}], "scope_influence": "", "tags": [], "title": "Drupal ldap_auth LDAP注入漏洞", "_translated": true, "_saved_at": "2026-09-02T14:53:22+00:00", "_first_saved_at": "2026-09-02T14:53:22+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-p86n-xula"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-14957", "cvss": {"cvssv31": [{"source": "d42dc95b-23f1-4e06-9076-20753a0fb0df", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-617", "description": "Libreswan 是开源 IPsec 实现，提供 IKEv1 与 IKEv2 密钥交换，用于在不可信网络上建立加密 VPN 隧道。\n受影响版本中，FIPS 模式下 add_decoded_cert() 调用 CERT_ExtractPublicKey() 后执行 passert(pk != NULL)。远程攻击者可在对等认证完成前发送公钥无法提取的畸形 X.509 CERT 载荷（例如 RSA 指数为 0），CERT_ExtractPublicKey() 返回 NULL 后断言失败，pluto 守护进程中止并重启；重复发送可造成拒绝服务，官方确认无法远程代码执行。\n修复版本中通过取消该空指针断言，在公钥提取失败时记录 NSS 错误并直接返回，拒绝该证书且保持 pluto 进程继续运行，切断畸形 CERT 载荷导致的拒绝服务路径。", "effects": [{"comp_name": "libreswan", "ecosystem": "linux", "versions": [{"affected_version": "[3.0,5.3.2)", "min_fixed_version": "5.3.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "可达断言", "kind_en": "Reachable Assertion", "last_modified_time": "2026-09-02", "level": "High", "mps_id": "MPS-xo3d-ipkw", "poc": false, "poc_url": [], "published_time": "2026-09-02", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-xo3d-ipkw", "name": "https://www.oscs1024.com/hd/MPS-xo3d-ipkw"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-14957", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-14957"}, {"url": "https://libreswan.org/security/CVE-2026-14957/", "name": ""}, {"url": "https://libreswan.org/security/CVE-2026-14957/CVE-2026-14957.txt", "name": ""}], "scope_influence": "", "tags": ["开源", "终端软件"], "title": "Libreswan FIPS断言崩溃", "_translated": true, "_saved_at": "2026-09-02T05:20:34+00:00", "_first_saved_at": "2026-09-02T05:20:34+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-xo3d-ipkw"}, {"analysis_status": 0, "articles": [], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-81161", "cvss": {}, "cvss_score": 7.2, "cvss_vector": "", "cwe": "CWE-267", "description": "Content Moderation Notifications 是 Drupal 的开源贡献模块（PHP 编写，基于 GPL 协议发布），用于在内容经过内容审核工作流发生状态流转时，按管理员配置的规则向指定角色、内容作者或指定邮箱发送通知邮件，其通知标题、正文与收件地址等字段支持编写 Twig 模板代码。\n受影响版本中，模块在 content_moderation_notifications.permissions.yml 中声明的 administer content moderation notifications 权限缺少 restrict access: true 元数据，Drupal 权限管理界面不会将该权限标示为受限权限；持有该权限的用户可以在 /admin/config/workflow/notifications 下的通知配置表单中编辑允许 Twig 代码的邮件字段，模板代码会在通知邮件生成时于服务器端渲染，被误授予该权限的低信任用户可借助模板代码访问仅限高信任管理员使用的功能与数据，实现权限提升。\n修复版本中通过在权限定义中为该权限补充 restrict access: true 元数据完成修复，Drupal 权限界面据此将该权限标记为受限权限并向管理员展示警告提示，明确该权限允许编写具有安全影响的 Twig 模板，避免权限被误授予低信任角色，切断由此形成的权限提升路径。", "effects": [{"comp_name": "drupal/content_moderation_notifications", "ecosystem": "composer", "versions": [{"affected_version": "[0.0.0,3.9.0)", "min_fixed_version": "3.9.0", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "特权定义了不安全动作", "kind_en": "使用不安全操作定义的权限", "last_modified_time": "2026-09-02", "level": "High", "mps_id": "MPS-6rct-75dk", "poc": false, "poc_url": [], "published_time": "2026-09-02", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-6rct-75dk", "name": "https://www.oscs1024.com/hd/MPS-6rct-75dk"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-81161", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-81161"}, {"url": "https://www.drupal.org/sa-contrib-2026-107", "name": ""}], "scope_influence": "", "tags": ["php", "开源"], "title": "Content Moderation Notifications 权限提升漏洞", "_translated": true, "_saved_at": "2026-09-02T14:53:24+00:00", "_first_saved_at": "2026-09-02T14:53:24+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-6rct-75dk"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-75528", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "cwe": "CWE-79", "description": "Broken Link Checker 是 WPMU DEV 维护的开源 WordPress 插件，用于扫描站点中的失效链接、重定向与缺失图片，并在后台集中展示检测结果。\n受影响版本中，未认证攻击者可通过 WordPress 评论作者 URL 提交指向其控制服务器的链接。管理员对该链接执行插件标准的忽略后再检测流程后，攻击者服务器将请求重定向到包含 HTML/JavaScript 的 URL。blcCurlHttp::check() 默认跟随重定向并把最终 URL 写入 result_hash，blcLink::status_changed() 再把未转义的 result_hash 追加到链接日志；blcTablePrinter::details_row_contents() 随后以 nl2br 直接输出该日志，导致存储型跨站脚本在用户查看注入页面时执行。\n修复版本中通过在 status_changed() 写入日志时对 result_hash 执行 esc_html，在 WP HTTP 检测路径对响应消息执行 esc_html，并在 details_row_contents() 输出日志时使用 wp_kses 仅允许 em 与 strong 标签，阻止恶意脚本进入后台链接日志并执行。", "effects": [{"comp_name": "broken-link-checker", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.4.13.1)", "min_fixed_version": "2.4.13.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-09-02", "level": "High", "mps_id": "MPS-meyh-o8rz", "poc": false, "poc_url": [], "published_time": "2026-09-02", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-meyh-o8rz", "name": "https://www.oscs1024.com/hd/MPS-meyh-o8rz"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-75528", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-75528"}, {"url": "https://plugins.trac.wordpress.org/browser/broken-link-checker/tags/2.4.13/legacy/includes/admin/table-printer.php#L658", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/broken-link-checker/tags/2.4.13/legacy/includes/links.php#L485", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/broken-link-checker/tags/2.4.13/legacy/modules/checkers/http.php#L291", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/broken-link-checker/tags/2.4.13/legacy/modules/checkers/http.php#L432", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/broken-link-checker/tags/2.4.13/legacy/modules/containers/comment.php#L228", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/broken-link-checker/tags/2.4.8/legacy/includes/admin/table-printer.php#L658", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/broken-link-checker/tags/2.4.8/legacy/includes/l 编写、权限管理与内容共享。\n受影响版本中，GET /_api/v3/revisions/:id 的处理函数按 query 参数 pageId 调用 Page.isAccessiblePageByViewer 校验页面访问权限，随后以路径参数 id 执行 prisma.revisions.findUnique 获取修订记录并返回正文，未校验 revision.pageId 与 pageId 是否指向同一页面；已认证攻击者可将可访问页面的 pageId 与任意 revisionId 组合成请求，绕过权限校验读取无权访问页面的修订内容。\n修复版本中通过在取得修订记录后新增 revision 为空或 revision.pageId 与已校验 pageId 不一致时返回 403 的判断，确保返回内容与权限校验对象为同一页面，同批修改还为 GET /_api/v3/attachment/:id 补充了所属页面的访问权限校验。", "effects": [{"comp_name": "growi", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,8.0.2]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "通过用户控制密钥绕过授权机制", "kind_en": "通过用户控制的密钥绕过授权", "last_modified_time": "2026-09-02", "level": "High", "mps_id": "MPS-mvk9-7gcn", "poc": false, "poc_url": [], "published_time": "2026-09-02", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-mvk9-7gcn", "name": "https://www.oscs1024.com/hd/MPS-mvk9-7gcn"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-84205", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-84205"}, {"url": "https://github.com/growilabs/growi", "name": ""}, {"url": "https://github.com/growilabs/growi/blob/v8.0.2/apps/app/src/server/routes/apiv3/revisions.js", "name": ""}, {"url": "https://github.com/growilabs/growi/commit/d298e0b1dbbf568c99db657fa0f7e90f72ddc59b", "name": ""}, {"url": "https://github.com/growilabs/growi/pull/11810", "name": ""}, {"url": "https://www.vulncheck.com/advisories/growi-through-8.0.2-authorization-bypass-through-user-controlled-key-on-apiv3-revision-retrieval", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "GROWI 越权读取页面修订内容", "_translated": true, "_saved_at": "2026-09-01T17:11:01+00:00", "_first_saved_at": "2026-09-01T17:11:01+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-mvk9-7gcn"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-82883", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:L", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:L", "cwe": "CWE-79", "description": "Login With Ajax 是开源 WordPress 插件，以 GPLv2 许可发布于 wordpress.org，用于在站点侧边栏、区块或页面中提供 AJAX 登录、注册、密码找回、Passkeys 与双因素认证，减少对默认 wp-login.php 页面的依赖。\n受影响版本中，插件在网页生成阶段未正确中和外部输入，存在反射型跨站脚本漏洞。未认证攻击者可构造恶意链接并诱导用户访问，使脚本在受害者浏览器中执行，从而注入重定向、广告或其他 HTML 载荷。该问题影响 Login With Ajax 至 4.5.1 版本。\n修复版本中通过对页面输出进行转义以切断反射型 XSS 输入进入响应的路径；截至 2026-09-02，Patchstack 公告确认尚无官方补丁，wordpress.org 稳定版本仍为 4.5.1，建议先停用该插件或部署虚拟补丁。", "effects": [{"comp_name": "login-with-ajax", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,4.5.1]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-09-02", "level": "High", "mps_id": "MPS-sy24-u7wn", "poc": false, "poc_url": [], "published_time": "2026-09-02", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-sy24-u7wn", "name": "https://www.oscs1024.com/hd/MPS-sy24-u7wn"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-82883", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-82883"}, {"url": "https://patchstack.com/database/wordpress/plugin/login-with-ajax/vulnerability/wordpress-login-with-ajax-plugin-4-5-1-cross-site-scripting-xss-vulnerability-2?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Login With Ajax反射型XSS", "_translated": true, "_saved_at": "2026-09-02T10:24:08+00:00", "_first_saved_at": "2026-09-02T10:24:08+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-sy24-u7wn"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-84204", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:N", "severity": "medium", "base_score": 6.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-862", "description": "GROWI 是 WESEEK 开源的基于 Node.js/Express 的团队 Wiki 与知识库系统，用于企业内部文档协作与附件管理，以 Docker 镜像与源码形式分发。\n受影响版本中，apiv3 的 GET /_api/v3/attachment/:id 路由在认证后按 req.params.id 直接 Attachment.findById 读取附件并返回完整附件对象，未调用 Page.isAccessiblePageByViewer 校验当前用户对附件所属页面的访问权限，而同文件 /list 端点均有该校验；认证用户提供已知附件 ID，可越权读取自身无权访问页面上的附件元数据（原始文件名、格式、大小、创建者与所属页面）。\n修复版本中通过在该处理器取得附件后新增 Page.isAccessiblePageByViewer(attachment.page, req.user) 页面访问权限校验修复该问题：非页面附件与共享链接场景不受影响，校验未通过时返回 404，从而切断越权读取链路；该修复已随 PR #11810 合入上游 master 分支，包含该修复的正式版本发布前建议采取缓解措施。", "effects": [{"comp_name": "growi", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,8.0.2]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-09-02", "level": "High", "mps_id": "MPS-xswj-7fvt", "poc": false, "poc_url": [], "published_time": "2026-09-02", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-xswj-7fvt", "name": "https://www.oscs1024.com/hd/MPS-xswj-7fvt"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-84204", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-84204"}, {"url": "https://github.com/growilabs/growi", "name": ""}, {"url": "https://github.com/growilabs/growi/blob/v8.0.2/apps/app/src/server/routes/apiv3/attachment.js", "name": ""}, {"url": "https://github.com/growilabs/growi/commit/d298e0b1dbbf568c99db657fa0f7e90f72ddc59b", "name": ""}, {"url": "https://github.com/growilabs/growi/pull/11810", "name": ""}, {"url": "https://www.vulncheck.com/advisories/growi-through-8.0.2-missing-authorization-on-apiv3-attachment-retrieval", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "GROWI 附件接口越权漏洞", "_translated": true, "_saved_at": "2026-09-01T17:11:02+00:00", "_first_saved_at": "2026-09-01T17:11:02+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-xswj-7fvt"}, {"analysis_status": 3, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-84233", "cvss": {"cvssv31": [{"source": "se erity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-915", "description": "Jenkins 是开源持续集成与持续交付自动化服务器，使用 XStream 保存配置，并通过 Stapler 把 Java 对象图映射为 HTTP 路由。Script Console 是控制器上的 Groovy 执行入口，正常路径为 /script，由 Jenkins.doScript 调用 _doScript：对当前对象 getACL() 做 Overall/Administer 检查，再执行 Groovy。\n受影响版本中，反序列化用户提交 config.xml 的 RobustReflectionConverter 在填充对象字段时未限制嵌套字段值的类型，实现了 PersistenceRoot 接口的类型（如 Jenkins 全局配置、Job、Build、Queue 等本应以独立顶层配置文件存储的对象）可作为嵌套字段值出现在提交的 XML 中并被实例化。具备目标 Job 的 Item/Configure 权限的攻击者通过 POST /job/\u003c名称\u003e/config.xml 提交 XML 后，这些对象进入该 Job 的 Stapler 图。Stapler 按 URL 在对象图上分发请求，并不只认 /script 这一条管理入口；Jenkins、节点等 PersistenceRoot 自身带有 doScript。把带 doScript 的对象接到攻击者已能访问的 Job 图上之后，后续请求会打到植入对象的 Script Console，_doScript 校验的是这份植入对象的 ACL，不是真实控制器单例的 Overall/Administer，因此不需要管理员权限即可执行 Groovy，造成远程代码执行。\n修复版本中通过在 doUnmarshal 拒绝将 PersistenceRoot 作为嵌套字段反序列化，使带 doScript 的文档根无法再进入 Job 的 Stapler 图。", "effects": [{"comp_name": "org.jenkins-ci.main:jenkins-core", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,2.580)", "min_fixed_version": "2.580", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "(-∞,2.568.3)", "min_fixed_version": "2.568.3", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "动态确定对象属性修改的控制不恰当", "kind_en": "动态确定的对象属性的受控修改不当", "last_modified_time": "2026-09-03", "level": "High", "mps_id": "MPS-kry8-zsgv", "poc": false, "poc_url": [], "published_time": "2026-09-03", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-kry8-zsgv", "name": "https://www.oscs1024.com/hd/MPS-kry8-zsgv"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-84645", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-84645"}, {"url": "https://www.jenkins.io/security/advisory/2026-09-02/#SECURITY-3972", "name": ""}, {"url": "https://github.com/jenkinsci/jenkins/commit/0d731367e08656f8cd1e8275f0e820f97af07fc6", "name": "Commit"}, {"url": "https://github.com/jenkinsci/jenkins/commit/e174eeb116a565c166215acc2e0c1ce94d60a16c", "name": "Commit"}], "scope_influence": "广", "tags": ["java", "专家校准", "开源"], "title": "Jenkins配置反序列化远程代码执行漏洞", "_translated": true, "_saved_at": "2026-09-03T12:28:26+00:00", "_first_saved_at": "2026-09-03T07:38:02+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-kry8-zsgv"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-79756", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-78", "description": "Nuclio 是一个用于实时事件和数据处理的“无服务器”框架。在版本 1.17.4 之前，本地/Docker 平台上 nuclio 仪表板中未经身份验证的操作系统命令注入的修复不完整。该修复为函数名称添加了 validateFunctionName，为命名资源 shell 命令路径添加了 common.Quote()，但列出所有资源路径（在未提供特定资源名称时触发）仍然会将不带引号的 resourceNamespace 参数插入到 /bin/sh -c 命令字符串中。未经身份验证的攻击者可以通过 X-Nuclio-Function-Namespace、X-Nuclio-Project-Namespace 或 X-Nuclio-Function-Event-Namespace HTTP 标头注入 shell 元字符，以在仪表板容器内实现任意命令执行。该问题已在1.17.4版本中修复。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-09-03", "level": "High", "mps_id": "MPS-23q0-ulsg", "poc": false, "poc_url": [], "published_time": "2026-09-03", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-23q0-ulsg", "name": "https://www.oscs1024.com/hd/MPS-23q0-ulsg"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-79756", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-79756"}, {"url": "https://github.com/nuclio/nuclio/commit/86d4e39387d8845f567649201798800830f08411", "name": ""}, {"url": "https://github.com/nuclio/nuclio/pull/4223", "name": ""}, {"url": "https://github.com/nuclio/nuclio/releases/tag/1.17.4", "name": ""}, {"url": "https://github.com/nuclio/nuclio/security/advisories/GHSA-mq8w-f7w8-5rgg", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-79756漏洞", "_translated": true, "_saved_at": "2026-09-02T18:20:37+00:00", "_first_saved_at": "2026-09-02T18:20:37+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-23q0-ulsg"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-84851", "cvss": {"cvssv31": [{"source": "ff89ba41-3aa1-4d27-914a-91399e9639e5", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}], "cvssv4": [{"source": "ff89ba41-3aa1-4d27-914a-91399e9639e5", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/M slated": true, "_saved_at": "2026-09-03T12:28:23+00:00", "_first_saved_at": "2026-09-03T07:38:00+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ryug-08l9"}, {"analysis_status": 0, "articles": [{"content": "- 程序未正确处理用户上传的文件，从而导致程序可以读取、处理或存储未经授权的文件\n", "title": "什么是任意文件上传"}, {"content": "- 欺骗攻击：攻击者可以通过发送伪造的文件来欺骗程序，从而导致程序读取、处理或存储未经授权的文件。\n- 文件格式攻击：攻击者可以通过选择特定的文件格式，例如压缩文件或 ZIP 文件，从而利用上传的文件来篡改程序的执行结果或窃取程序中的重要数据。\n", "title": "任意文件上传常见的攻击方式"}, {"content": "- 使用安全文件传输协议 (FTP):使用安全 FTP 协议可以确保上传的文件格式、大小、权限等符合预期，同时可以防止文件读取、篡改或存储漏洞。\n- 使用文件上传过滤器：使用文件上传过滤器可以过滤上传的文件，以确保文件的格式、大小、权限等符合预期，同时可以防止文件读取、篡改或存储漏洞。\n- 使用白名单机制：使用白名单机制可以只允许特定的文件格式、大小、权限等存在的文件上传，从而防止非法文件的上传和攻击。\n- 定期更新和升级程序：定期更新和升级程序可以修复已知的漏洞，并增强程序的安全性。", "title": "如何预防任意文件上传"}], "cnvd_id": "", "cve_id": "CVE-2026-82524", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.2}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-434", "description": "UnoPim 是 Webkul 开源（MIT 许可证）的 PHP/Laravel 产品信息管理（PIM）系统，基于 Laravel 构建管理后台，用于集中管理商品、分类、属性与数字化资产。\n受影响版本中，管理后台 TinyMCE 富文本图片上传接口 POST /admin/tinymce/upload（Webkul\\Admin\\Http\\Controllers\\TinyMCEController::upload）把上传文件交给 FileStorer::store 落盘，文件名沿用 UploadedFile::getClientOriginalName()，整条链路缺少扩展名白名单、真实 MIME 校验与文件名随机化（FileStorer 仅对 SVG 执行 sanitizeSVG）；持有管理员会话的攻击者将 PHP Web Shell 写入 public 磁盘的 tinymce 目录后，访问响应中返回的 /storage/tinymce/*.php URL 触发 PHP 解析，执行任意操作系统命令，导致服务器被完全接管。\n修复版本中通过 新增 TinyMCEUploadRequest 表单请求校验上传文件，规则限定 required、
