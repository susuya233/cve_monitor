据。\n- 代码审查和漏洞扫描：程序应该进行代码审查和漏洞扫描，以发现和修复潜在的安全漏洞。\n", "title": "如何预防反序列化"}], "cnvd_id": "", "cve_id": "CVE-2026-93327", "cvss": {"cvssv4": [{"source": "f45cbf4e-4146-4068-b7e1-655ffc2c548c", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:Clear", "severity": "critical", "base_score": 9.4}]}, "cvss_score": 9.4, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:Clear", "cwe": "CWE-502", "description": "Google Cloud Application Integration 是 Google Cloud 提供的托管集成平台服务（非开源），用于在云环境中编排应用、数据与业务流程，SubWorkflow 任务用于在集成流程中调用子工作流。\n受影响版本中，SubWorkflow 任务在处理序列化数据时缺少对不可信数据的安全校验，经身份认证的攻击者可提交恶意构造的序列化对象，该对象在服务端反序列化过程中被执行，导致任意代码执行。\n修复版本中通过服务端安全更新切断了恶意序列化对象进入反序列化执行路径的链路，Google 于 2026-09-11 完成修复并在托管服务上自动生效，官方说明无需客户执行任何操作。", "effects": [{"comp_name": "application_integration", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2026-09-11)", "min_fixed_version": "2026-09-11", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "反序列化", "kind_en": "不可信数据的反序列化", "last_modified_time": "2026-10-30", "level": "Critical", "mps_id": "MPS-e793-fjic", "poc": false, "poc_url": [], "published_time": "2026-10-30", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-e793-fjic", "name": "https://www.oscs1024.com/hd/MPS-e793-fjic"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-93327", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-93327"}, {"url": "https://docs.cloud.google.com/support/bulletins", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Application Integration SubWorkflow反序列化漏洞", "_translated": true, "_saved_at": "2026-10-30T16:26:47+00:00", "_first_saved_at": "2026-10-30T16:26:47+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-e793-fjic"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-82104", "cvss": {"cvssv4": [{"source": "001d69cf-3fc9-4203-93fb-9865b54e05b2", "vector": "CVSS:4.0/AV:A/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.4}]}, "cvss_score": 9.4, "cvss_vector": "CVSS:4.0/AV:A/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-863", "description": "RutOS 与 TswOS 是 Teltonika Networks 工业路由器、网关与交换机产品线搭载的专有固件，基于 OpenWrt 构建，提供 HTTPS Web 管理界面、API 接口与设备配置能力，广泛部署于工业物联网与关键基础设施联网场景。\n受影响版本中，RutOS 7.22 至 7.24.2 与 TswOS 1.9 至 1.10 的设备允许请求直接调用 Lua 函数，未认证攻击者通过 HTTPS 管理端口发送绕过正常 API 流程的请求，可跳过正常调用链中强制执行的鉴权与校验逻辑（CWE-863：Incorrect Authorization），由于这类请求未遵循正常流程，攻击者最终可在设备操作系统层面执行任意命令，获得设备完整控制能力。\n修复版本中通过限制未认证请求直接调用 Lua 函数、恢复正常 API 请求流程中的校验约束，切断未认证命令执行路径；Teltonika 已在 RutOS 7. dent_alert.py 的 verify_velociraptor_header 在读取 GRAYLOG_API_HEADER_VALUE、VELOCIRAPTOR_API_HEADER_VALUE 时回退到公开源码与 .env.example 内置的同一常量 ab73de7a-6f61-4dde-87cd-3af5175a7281，匿名攻击者携带该已知请求头便能绕过其余 API 要求的 JWT 认证；POST /api/graylog/invoke 会把请求体 event.fields 中攻击者可控的 COMMAND、ACTION、VALUE 与 AGENT_ID 直接转发给已配置 Wazuh manager 的 /active-response 接口，缺少认证调用路由具备的命令枚举校验，可在任意代理上触发主动响应脚本并篡改防御控制；POST /api/incidents/alerts/create/threshold 与 /api/incidents/alerts/create/velo-sigma 还接受任意 customer_code 的伪造告警并驱动攻击者可控的 OpenSearch 查询。\n修复版本中通过将两个校验函数改为无默认值读取环境变量并在未配置时返回 403 拒绝请求实现失效关闭，从 .env.example 移除硬编码默认值，并在 backend/app/active_response/schema/graylog.py 为 COMMAND 增加 [A-Za-z0-9_-]{1,64} 脚本名格式校验，切断了匿名调用与伪造告警进入 Wazuh 主动响应投递链路的路径。", "effects": [{"comp_name": "socfortress:CoPilot", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,0.1.76)", "min_fixed_version": "0.1.76", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "使用硬编码的凭证", "kind_en": "使用硬编码凭证", "last_modified_time": "2026-10-31", "level": "Critical", "mps_id": "MPS-zp5g-rwnt", "poc": false, "poc_url": [], "published_time": "2026-10-30", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-zp5g-rwnt", "name": "https://www.oscs1024.com/hd/MPS-zp5g-rwnt"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-61729", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-61729"}, {"url": "https://github.com/socfortress/CoPilot/security/advisories/GHSA-x8gc-f8p4-frc2", "name": "https://github.com/socfortress/CoPilot/security/advisories/GHSA-x8gc-f8p4-frc2"}, {"url": "https://github.com/socfortress/CoPilot/pull/939", "name": "https://github.com/socfortress/CoPilot/pull/939"}, {"url": "https://github.com/socfortress/CoPilot/commit/1b2c3f97243988301285b395ce4239769c66bd9e", "name": "https://github.com/socfortress/CoPilot/commit/1b2c3f97243988301285b395ce4239769c66bd9e"}, {"url": "https://github.com/socfortress/CoPilot/tree/v0.1.76", "name": "https://github.com/socfortress/CoPilot/tree/v0.1.76"}], "scope_influence": "", "tags": ["应用软件"], "title": "SOCFortress CoPilot认证绕过漏洞", "_translated": true, "_saved_at": "2026-10-30T16:26:49+00:00", "_first_saved_at": "2026-10-30T16:26:49+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-zp5g-rwnt"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过向受信任的数据序列化过程中添加恶意数据，从而在序列化和反序列化过程中执行恶意代码的攻击漏洞。这种漏洞通常存在于使用序列化 (serialization) 机制存储和传输数据的程序中。\n", "title": "什么是反序列化"}, {"content": "- 注入攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码注入到程序中，从而实现代码执行的目的。\n- 反射攻击：攻击者使用反射机制，在序列化过程中动态生成恶意数据，并将恶意代码注入到程序中，从而实现代码执行的目的。\n- 缓冲区溢出攻击：攻击者通过在序列化过程中向缓冲区输入恶意数据，导致缓冲区溢出，从而破坏程序的内存管理，实现代码执行的目的。\n- 格式字符串攻击：攻击者通过在序列化过程中输入恶意数据，导致程序使用错误的格式字符串，从而实现代码执行的目的。\n- 数据流攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码作为一个数据流传递给程序，从而实现代码执行的目的。\n", "title": "反序列化常见的攻击方式"}, {"content": "- 不信任输入数据：程序应该严格检查输入数据的有效性，并避免使用不受信任的数据。\n- 使用安全的序列化机制：程序应该使用安全的序列化机制，如 JSON 或 XML 序列化，而不是第三方序列化库。\n- 最小特权原则：程序应该限制对受信任数据的处理权限，并避免在运行时修改数据。\n- 代码审查和漏洞扫描：程序应该进行代码审查和漏洞扫描，以发现和修复潜在的安全漏洞。\n", "title": "如何预防反序列化"}], "cnvd_id": "", "cve_id": "CVE-2026-90888", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-502", "description": "LeadSnap 是发布于 WordPress 官方插件目录的开源 WordPress 插件（GPLv2），当前最新版本为 1.25（2023-03-09 发布），用于将 Contact Form 7、Ninja Forms、WP Forms、Gravity Forms、Formidable Forms 等表单插件收集的销售线索同步至 LeadSnap CRM 平台。\n受影响版本中，插件在主文件 leadsnap.php 中通过 add_action('frm_after_create_entry', 'wncrm_fomidable', 30, 2) 注册 Formidable Forms 提交回调，回调缺少登录与 nonce 校验，也未受 wncrm_is_send_to_crm 配置开关保护，访客提交公开表单即触发处理逻辑；Wncrm_formidable_Api 构造函数调用 get_field_data() 按 entry_id 联表查询 frm_item_metas 与 frm_fields，并将字段类型为 address 的行中的 meta_value 直接传入 unserialize()，未使用 allowed_classes 限制可反序列化的类，攻击者借表单提交写入的反序列化数据被原样还原，构成未授权 PHP 对象注入，站点环境中存在可用 POP 链时可能导致任意代码执行、敏感信息泄露或数据库写入。\n修复版本中通过，可通过以下方式缓解：1.25 版本仅在 Thrive Forms 集成中移除了同类 unserialize(base64_decode($submission['tve_labels'])) 调用，未处理 Formidable 处理路径中的 unserialize($val-\u003emeta_value)，Patchstack 标注无官方补丁，建议立即停用并移除 LeadSnap 插件，或在 WAF 中启用拦截 PHP 对象注入利用特征的虚拟补丁规则，并避免公开暴露包含 address 类型字段的 Formidable 表单。", "effects": [{"comp_name": "leadsnap", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.25]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "反序列化", "kind_en": "不可信数据的反序列化", "last_modified_time": "2026-10-31", "level": "Critical", "mps_id": "MPS-xzh8-tmq4", "poc": false, "poc_url": [], "published_time": "2026-10-31", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-xzh8-tmq4", "name": "https://www.oscs1024.com/hd/MPS-xzh8-tmq4"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-90888", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-90888"}, {"url": "https://patchstack.com/database/wordpress/plugin/leadsnap/vulnerability/wordpress-leadsnap-plugin-1-25-php-object-injection-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "LeadSnap PHP对象注入漏洞", "_translated": true, "_saved_at": "2026-10-30T21:18:35+00:00", "_first_saved_at": "2026-10-30T21:18:35+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-xzh8-tmq4"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通 gs 为所有 buildah run 与 bud 调用追加 --isolation=oci、--pid=private、--ipc=private、--network=private，buildahEnv 显式设置 BUILDAH_ISOLATION=oci，租户 ARG 值改为仅传入构建容器内部，worker 镜像同步安装 CNI 插件以支持私有网络，RUN 步骤因此获得独立的 PID、IPC 与网络命名空间，租户输入不再作用于 worker 进程与其文件系统，逃逸链路被切断。", "effects": [{"comp_name": "beta9", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,0.1.756)", "min_fixed_version": "0.1.756", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "不充分的划分", "kind_en": "不适当的隔离或划分", "last_modified_time": "2026-11-01", "level": "Critical", "mps_id": "MPS-zdih-6v5m", "poc": false, "poc_url": [], "published_time": "2026-11-01", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-zdih-6v5m", "name": "https://www.oscs1024.com/hd/MPS-zdih-6v5m"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-120306", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-120306"}, {"url": "https://github.com/beam-cloud/beta9", "name": "Beta9 repository"}, {"url": "https://github.com/beam-cloud/beta9/pull/1897", "name": "Handle sandbox edge cases (fix pull request)"}, {"url": "https://github.com/beam-cloud/beta9/commit/a28bf12cf0007c792a25d8ed282b4e8bf6f30393", "name": "Fix commit a28bf12"}, {"url": "https://github.com/beam-cloud/beta9/releases/tag/worker-0.1.756", "name": "worker-0.1.756"}], "scope_influence": "", "tags": ["AI", "应用软件"], "title": "Beta9 镜像构建容器逃逸", "_translated": true, "_saved_at": "2026-11-01T15:40:55+00:00", "_first_saved_at": "2026-11-01T15:40:55+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-zdih-6v5m"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过向受信任的数据序列化过程中添加恶意数据，从而在序列化和反序列化过程中执行恶意代码的攻击漏洞。这种漏洞通常存在于使用序列化 (serialization) 机制存储和传输数据的程序中。\n", "title": "什么是反序列化"}, {"content": "- 注入攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码注入到程序中，从而实现代码执行的目的。\n- 反射攻击：攻击者使用反射机制，在序列化过程中动态生成恶意数据，并将恶意代码注入到程序中，从而实现代码执行的目的。\n- 缓冲区溢出攻击：攻击者通过在序列化过程中向缓冲区输入恶意数据，导致缓冲区溢出，从而破坏程序的内存管理，实现代码执行的目的。\n- 格式字符串攻击：攻击者通过在序列化过程中输入恶意数据，导致程序使用错误的格式字符串，从而实现代码执行的目的。\n- 数据流攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码作为一个数据流传递给程序，从而实现代码执行的目的。\n", "title": "反序列化常见的攻击方式"}, {"content": "- 不信任输入数据：程序应该严格检查输入数据的有效性，并避免使用不受信任的数据。\n- 使用安全的序列化机制：程序应该使用安全的序列化机制，如 JSON 或 XML 序列化，而不是第三方序列化库。\n- 最小特权原则：程序应该限制对受信任数据的处理权限，并避免在运行时修改数据。\n- 代码审查和漏洞扫描：程序应该进行代码审查和漏洞扫描，以发现和修复潜在的安全漏洞。\n", "title": "如何预防反序列化"}], "cnvd_id": "", "cve_id": "CVE-2026-118636", "cvss": {"cvssv31": [{"source": "security@apache.org", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-502", "description": "Apache MINA 是 Apache 软件基金会开源的 Java 网络应用框架，用于构建高性能网络服务，其 3.0 开发线提供了独立的 codec 模块（Maven 坐标 org.apache.mina:mina-codec），模块内的 JavaNativeMessageDecoder 提供基于 Java 原生序列化的消息解码器。\n受影响版本中，JavaNativeMessageDecoder 的 decode 方法将网络帧字节通过 asInputStream() 直接包装为 java.io.ObjectInputStream 并调用 readObject()，全过程未配置 ObjectInputFilter 或任何类白名单校验，应用将该解码器部署在不可信对端前方时，攻击者发送的序列化数据可实例化任意可反序列化类并执行 gadget 调用链，最终导致远程代码执行。\n修复版本中通过，官方已确认 3.0.0 分支处于不活跃状态并不再发布修复版本，受影响版本在 3.0 线内无修复可用，可通过迁移至仍在维护的 Apache MINA 2.2.X 最新分支切断风险，无法立即迁移的应用应停止使用 JavaNativeMessageDecoder 处理不可信网络数据并收紧相关端口的访问控制。", "effects": [{"comp_name": "mina", "ecosystem": "linux", "versions": [{"affected_version": "[3.0.0-M1,3.0.0-M2]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "org.apache.mina:mina-codec", "ecosystem": "maven", "versions": [{"affected_version": "[3.0.0-M1,3.0.0-M2]", "min_fixed_version": "", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "反序列化", "kind_en": "不可信数据的反序列化", "last_modified_time": "2026-10-31", "level": "Critical", "mps_id": "MPS-b091-655f", "poc": false, "poc_url": [], "published_time": "2026-11-01", "reference_url_list": [{"url": "https://seclists.org/oss-sec/2026/q4/457", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-118636", "name": ""}, {"url": "https://mina.apache.org/", "name": ""}, {"url": "https://github.com/apache/mina/blob/3.0.0-M2/codec/src/main/java/org/apache/mina/codec/delimited/serialization/JavaNativeMessageDecoder.java", "name": ""}, {"url": "https://repo1.maven.org/maven2/org/apache/mina/mina-codec/", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "Apache MINA反序列化RCE漏洞", "_translated": true, "_saved_at": "2026-10-31T22:22:22+00:00", "_first_saved_at": "2026-10-31T22:22:22+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-b091-655f"}, {"analysis_status": 0, "articles": [{"content": "- 命令注入是一种攻击，其目标是通过易受攻击的应用程序在主机操作系统上执行任意命令。 当应用程序将不安全的用户提供的数据（表单、cookie、HTTP 标头等）传递到系统 shell 时，就会产生缺陷。攻击者通过构造恶意的命令或数据，将其注入到程序执行的上下文中，从而绕过程序的输入验证和安全措施，实现对程序操作的恶意操作。", "title": "什么是命令注入"}, {"content": "- 文件上传：攻击者通过构造恶意的文件上传请求，将包含恶意命令的文件上传到服务器，从而利用命令注入漏洞执行恶意命令。\n- SQL 注入：攻击者通过构造恶意的 SQL 查询语句，将包含恶意命令的 SQL 语句注入到数据库中，从而执行恶意命令，窃取数据或者破坏系统。\n- 命令执行：攻击者通过在 Web 应用程序的表单提交数据中注入恶意命令，从而执行恶意命令，例如删除文件、格式化硬盘等。\n- 命令注入漏洞的旁路攻击：攻击者可以利用命令注入漏洞旁路控制程序的执行流程，从而窃取数据、破坏系统、控制程序等。\n", "title": "命令注入常见的攻击方式"}, {"content": "- 输入验证：在程序输入处对输入数据进行严格的验证和过滤，确保输入数据符合预期的格式和类型，避免被攻击者注入恶意命令。\n- 输出过滤：在程序输出处对输出数据进行严格的过滤和检查，确保输出数据符合预期的格式和类型，避免被攻击者截获和篡改。\n- 使用安全的编程模型：使用安全的编程模型，例如避免使用原生的命令执行方式，使用安全的框架和库来处理输入数据和执行命令，避免命令注入漏洞。\n- 数据库加密和访问控制：对于敏感数据和命令，使用加密和访问控制措施，确保只有授权用户可以访问和执行命令，避免被攻击者窃取和篡改。\n- 定期更新和升级：定期更新和升级应用程序和库的版本，确保应用程序和库的最新版本包含了最新的安全补丁和修复措施，避免安全漏洞的出现和利用。\n- 安全审计和监控：定期对系统和应用程序进行安全审计和监控，及时发现和阻止潜在的安全漏洞和攻击，确保系统和数据的安全和可靠性。", "title": "如何预防命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-120198", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:N/AC:L/Au:N/C:C/I:C/A:C", "severity": "high", "base_score": 10}], "cvssv3": [{"source": "VulDB", "vector": "CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H/E:P/RL:X/RC:R", "severity": "critical" oovy 类静态初始化块中的任意 Java 代码随即执行，构成未授权远程代码执行。\n修复版本中通过将 JWT 密钥移出源码改为外部强随机配置、按精确路径匹配分享令牌并为数据转换接口增加独立鉴权，可切断伪造令牌进入 Groovy 执行的链路；截至 2026-11-01 上游尚未发布包含修复的版本，最新发布版本 V1.7.1 仍受影响，官方修复发布前建议优先采取缓解措施。", "effects": [{"comp_name": "aj_report", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.7.1]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "使用硬编码的密码学密钥", "kind_en": "使用硬编码密钥", "last_modified_time": "2026-11-01", "level": "Critical", "mps_id": "MPS-nkbz-g4st", "poc": false, "poc_url": [], "published_time": "2026-11-01", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-nkbz-g4st", "name": "https://www.oscs1024.com/hd/MPS-nkbz-g4st"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-120209", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-120209"}, {"url": "https://gitee.com/belief-team/report/issues/IKRV6T", "name": ""}, {"url": "https://gitee.com/belief-team/report/blob/V1.7.1/report-core/src/main/java/com/anjiplus/template/gaea/business/util/JwtUtil.java", "name": ""}, {"url": "https://gitee.com/belief-team/report", "name": ""}, {"url": "https://www.vulncheck.com/advisories/aj-report-through-1.7.1-authentication-bypass-leading-to-rce-via-share-token", "name": "VulnCheck Advisory: AJ-Report through 1.7.1 Authentication Bypass leading to RCE via Share-Token"}], "scope_influence": "", "tags": ["应用软件"], "title": "AJ-Report硬编码密钥未授权RCE漏洞", "_translated": true, "_saved_at": "2026-10-31T22:22:26+00:00", "_first_saved_at": "2026-10-31T18:59:29+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-nkbz-g4st"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-120195", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:N/AC:L/Au:N/C:C/I:C/A:C", "severity": "high", "base_score": 10}], "cvssv3": [{"source": "VulDB", "vector": "CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H/E:P/RL:X/RC:R", "severity": "critical", "base_score": 10}], "cvssv31": [{"source": "cna@vuldb.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 10}], "cvssv4": [{"source": "cna@vuldb.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-78", "description": "WAVLINK WL-WN579A3-A 是 Wavlink 推出的一款基于 MediaTek MT7628 平台的无线路由设备，固件基于 OpenWrt 构建，通过 lighttpd 与 /cgi-bin/adm.cgi 提供 Web 管理界面和初始配置向导，固件为闭源软件。\n受影响版本中，POST /cgi-bin/adm.cgi 且 page 参数为 wzdgwMesh 的请求会进入 set_wzdgwMesh 函数处理，该函数读取 wlan_ssid 等表单参数后仅经过只拦截竖线与反引号的黑名单校验，未过滤分号、双引号、重定向等字符，参数随后被拼接进由 system() 执行的 shell 命令；设备处于初始配置向导状态（UserInit 为 0）时该请求无需任何身份认证，远程攻击者可在 wlan_ssid 中闭合双引号并注入任意命令，以 root 权限在设备上执行。\n修复版本中通过，可通过尽快完成设备初 1"}, {"url": "https://github.com/dromara/Jpom/blob/v2.11.12/modules/server/src/main/java/org/dromara/jpom/common/interceptor/LoginInterceptor.java#L146", "name": ""}, {"url": "https://github.com/dromara/Jpom", "name": ""}, {"url": "https://www.vulncheck.com/advisories/jpom-2.10.0-through-2.11.12-authentication-bypass-via-jpom-user-token-header", "name": "VulnCheck Advisory: Jpom 2.10.0 through 2.11.12 Authentication Bypass via JPOM-USER-TOKEN Header"}], "scope_influence": "", "tags": ["应用软件"], "title": "Jpom认证绕过漏洞", "_translated": true, "_saved_at": "2026-10-31T18:59:36+00:00", "_first_saved_at": "2026-10-31T18:59:36+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-u50v-l8sd"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-62048", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:N/A:L", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:N/A:L", "cwe": "CWE-89", "description": "BookIt（插件标识 bookit）是 Liquid Web / StellarWP 开源的 WordPress 预约日历插件，以 GPLv2 或更高协议通过 WordPress 官方插件目录分发，用于管理员工、服务与客户的预约排期，其前端预约流程通过 admin-ajax 注册的无需登录 AJAX 接口完成。\n受影响版本中，bookit_book_appointment 等预约接口被注册为 wp_ajax_nopriv 动作并向未登录访客开放，2.6.0.7 之前的输入清洗规则未对 date_timestamp、start_time、end_time 做类型约束；员工服务关联查询 Staff_Services::get_staff_services 又把 implode 拼接的编号列表以未加引号的形式填入 WHERE staff_id IN (…) 片段，仅依赖只转义引号类字符的 esc_sql 过滤，不含引号的注入载荷可原样并入 SQL 语句，未认证攻击者可借此读取、篡改或删除数据库数据。\n修复版本中通过在 Staff_Services::get_staff_services 中改用 implode( ',', array_map( 'absint', $staffIds ) ) 重建 IN 列表，将元素强制为非负整数，并为 date_timestamp、start_time、end_time 补充 intval 清洗规则、在预约数据入库前强制整数转换，同时以服务端 validate() 返回的价格作为权威值，切断了未加引号拼接 SQL 的注入路径。", "effects": [{"comp_name": "bookit", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.6.0.7)", "min_fixed_version": "2.6.0.7", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-11-02", "level": "Critical", "mps_id": "MPS-cqwd-n3ml", "poc": false, "poc_url": [], "published_time": "2026-11-02", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-cqwd-n3ml", "name": "https://www.oscs1024.com/hd/MPS-cqwd-n3ml"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-62048", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-62048"}, {"url": "https://patchstack.com/database/wordpress/plugin/bookit/vulnerability/wordpress-bookit-plugin-2-6-0-6-sql-injection-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "BookIt 插件 SQL 注入漏洞", "_translated": true, "_saved_at": "2026-11-01T20:03:51+00:00", "_first_saved_at": "2026-11-01T20:03:51+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-cqwd-n3ml"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-89435", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/ ps://www.wordfence.com/threat-intel/vulnerabilities/id/87661de6-e835-495e-9bd2-4d64b4718108?source=cve", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/formidable/tags/6.35/classes/controllers/FrmAddonsController.php#L1514", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/formidable/tags/6.35/classes/controllers/FrmAddonsController.php#L1489", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/formidable/tags/6.35/classes/helpers/FrmAppHelper.php#L4934", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/formidable/tags/6.35/classes/controllers/FrmAddonsController.php#L1459", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/formidable/tags/6.35/classes/controllers/FrmAppController.php#L1167", "name": ""}, {"url": "https://plugins.trac.wordpress.org/changeset?reponame=\u0026new=3750372%40formidable%2Ftags%2F7.0\u0026old=3688662%40formidable%2Ftags%2F6.35", "name": ""}, {"url": "https://plugins.trac.wordpress.org/changeset/3746820/formidable/trunk/classes/controllers/FrmAddonsController.php", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "Formidable Forms任意插件安装漏洞", "_translated": true, "_saved_at": "2026-10-30T09:26:30+00:00", "_first_saved_at": "2026-10-30T09:26:30+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-8qko-m20t"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-91913", "cvss": {"cvssv31": [{"source": "security_alert@emc.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-78", "description": "Dell OpenManage Enterprise 是戴尔推出的闭源商业服务器生命周期管理平台，用于对数据中心内的服务器固件、配置、合规与系统更新进行集中监控和管理。\n受影响版本中，产品在处理低权限用户远程提交的输入时，未对操作系统命令中的特殊元素进行充分中和，携带命令分隔符等特殊元素的参数可进入命令执行流程并在宿主操作系统上执行附加命令，最终导致命令执行；厂商公告未披露具体受影响接口与源码位置。\n修复版本中通过厂商安全更新收紧相关功能对用户输入的处理，对操作系统命令中的特殊元素完成中和后再构造命令，阻断低权限用户输入进入命令执行流程；公开资料未披露更细粒度的源码修改，建议升级至 4.8.0 及以上版本。", "effects": [{"comp_name": "openmanage_enterprise", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,4.8.0)", "min_fixed_version": "4.8.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-10-30", "level": "High", "mps_id": "MPS-oxhu-wadm", "poc": false, "poc_url": [], "published_time": "2026-10-30", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-oxhu-wadm", "name": "https://www.oscs1024.com/hd/MPS-oxhu-wadm"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-91913", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-91913"}, {"url": "https://www.dell.com/support/kbdoc/en-us/000523220/dsa-2026-467-security-update-for-dell-openmanage-enterprise-vulnerabilities?msockid=3021cac2195069ed3194ddad186a68f9", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "OpenManage Enterprise命令注入漏洞", "_translated": true, "_saved_at": "2026-10-30T16:26:58+00:00", "_first_saved_at": "2026-10-30T16:26:58+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-oxhu-wadm"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-65584", "cvss": {}, "cvss_score": 7.8, "cvss_vector": "", "cwe": "CWE-121", "description": "Imagination Technologies Graphics DDK 是 PowerVR GPU 的闭源内核态驱动组件，随 SoC 与设备厂商的 Linux、Android 系统分发，负责 GPU 命令提交与 CPU、GPU 之间的同步管理。\n受影响版本中，当客户端 CCB 停滞在 FENCE 命令上时，rgxccb.c 的 DumpStalledContextInfo 以命令头 ui32CmdSize 推导的数量遍历全部 UFO，把处于未触发状态的 Linux/Android fence 同步检查点地址逐个写入大小固定为 PVRSRV_MAX_SYNCS 的栈数组 ui32UnsignalledUFOVaddrs，用户提交的普通同步原语不写入该数组；提交入口仅校验单一输入的数量上限，内核侧解析后追加的 fence 同步检查点未被计入总量，单条 FENCE 命令携带的未触发同步检查点数量超过栈数组容量时发生越界写入，造成内核内存破坏并通常导致内核崩溃。\n修复版本中通过修正该 UFO 地址数组容量不足的问题消除对内核栈的越界写入，官方记录标注 Graphics DDK 26.2 RTM 不受影响。", "effects": [{"comp_name": "imagination_graphics_ddk", "ecosystem": "linux", "versions": [{"affected_version": "[1.18 RTM2,+∞)", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[24.2 RTM2,+∞)", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[26.1 RTM2,+∞)", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[23.2 RTM2,+∞)", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[25.1 RTM2,25.3 RTM]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "栈缓冲区溢出", "kind_en": "基于堆栈的缓冲区溢出", "last_modified_time": "2026-10-30", "level": "High", "mps_id": "MPS-tdq1-9j56", "poc": false, "poc_url": [], "published_time": "2026-10-30", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-tdq1-9j56", "name": "https://www.oscs1024.com/hd/MPS-tdq1-9j56"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-65584", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-65584"}, {"url": "https://www.imaginationtech.com/gpu-driver-vulnerabilities/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Imagination Graphics DDK 栈溢出漏洞", "_translated": true, "_saved_at": "2026-10-30T02:19:49+00:00", "_first_saved_at": "2026-10-30T02:19:49+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-tdq1-9j56"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-61626", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:L/AC:H/AT:N/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.3}]}, "cvss_score": 7.3, "cvss_vector": "CVSS:4.0/AV:L/AC:H/AT:N/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-787", "description": "libass 是一个开源的便携式字幕渲染库，用于渲染 ASS/SSA（Advanced SubStation Alpha/SubStation Alpha）格式字幕，被 mpv、FFmpeg 等多媒体播放与转码软件广泛集成。\n受影响版本中，事件清理流程在清除 ReadOrder 重复检查位图标志位时未校验 ReadOrder 为负值的情况。当应用通过 ass_process_chunk 加载含负 ReadOrder 的 Matroska 字幕数据包且读序检查处于默认开启状态时，resize_read_order_bitmap 判定该值为非法并释放位图，将基指针置空；此后 ass_prune_events 或已启用的自动清理流程清理这些过期事件时，clear_read_order_bit 仍以负索引访问位图，在 NULL 附近的地址执行按位清零写入，清零地址与位偏移由攻击者通过数据包内容控制，常规系统环境下导致进程崩溃，形成拒绝服务。\n修复版本中通过在 clear_read_order_bit 入口增加 id \u003c 0 的判断并直接返回，跳过对负 ReadOrder 值的清位操作，切断负索引到 NULL 附近地址的写入路径，同时保持对含负 ReadOrder 数据包的解析兼容，修复版本为 0.17.5。", "effects": [{"comp_name": "libass", "ecosystem": "linux", "versions": [{"affected_version": "[0.17.4,0.17.5)", "min_fixed_version": "0.17.5", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-10-30", "level": "High", "mps_id": "MPS-iknc-jugh", "poc": false, "poc_url": [], "published_time": "2026-10-30", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-iknc-jugh", "name": "https://www.oscs1024.com/hd/MPS-iknc-jugh"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-61626", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-61626"}, {"url": "https://github.com/libass/libass/security/advisories/GHSA-5gf7-wjfm-vmvm", "name": "https://github.com/libass/libass/security/advisories/GHSA-5gf7-wjfm-vmvm"}, {"url": "https://github.com/libass/libass/commit/23da65a130bb8c5b2cf0c7df0dd7d424607f98f1", "name": "https://github.com/libass/libass/commit/23da65a130bb8c5b2cf0c7df0dd7d424607f98f1"}, {"url": "https://github.com/libass/libass/releases/tag/0.17.5", "name": "https://github.com/libass/libass/releases/tag/0.17.5"}], "scope_influence": "", "tags": ["开源"], "title": "libass 越界写入漏洞", "_translated": true, "_saved_at": "2026-10-30T16:26:50+00:00", "_first_saved_at": "2026-10-30T16:26:50+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-iknc-jugh"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-97645", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "cwe": "CWE-79", "description": "Gravity Forms 是 WordPress 商业表单插件（闭源发布），用于构建在线表单、收集与管理提交条目，被大量企业站点用于客户交互与数据采集。\n受影响版本中，List 字段提交值在存储与后台输出时未做充分的输入清理与输出转义，未认证攻击者可通过公开表单提交携带恶意脚本内容的 List 字段值并持久保存；管理员打开条目详情视图时页面包含注入内容，点击其中的链接并确认弹窗后，管理端 JavaScript 包中以事件委托方式绑定 data-dialog-callback 属性的处理器会调用该属性中攻击者指定的函数引用，最终在管理后台会话中执行任意 Web 脚本。\n修复版本中通过 3.1.3 版本引入的安全增强，加强相关字段值的输入清理与输出转义，阻  [{"url": "https://www.oscs1024.com/hd/MPS-r5d2-mx3k", "name": "https://www.oscs1024.com/hd/MPS-r5d2-mx3k"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-91914", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-91914"}, {"url": "https://www.dell.com/support/kbdoc/en-us/000523220/dsa-2026-467-security-update-for-dell-openmanage-enterprise-vulnerabilities?msockid=3021cac2195069ed3194ddad186a68f9", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "OpenManage Enterprise 认证绕过漏洞", "_translated": true, "_saved_at": "2026-10-30T16:26:56+00:00", "_first_saved_at": "2026-10-30T16:26:56+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-r5d2-mx3k"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "attack_vector_type": "Local", "cnvd_id": "", "cve_id": "CVE-2026-15466", "cvss": {}, "cvss_score": 7, "cvss_vector": "", "cwe": "CWE-416", "description": "Imagination Technologies Graphics DDK 是面向 PowerVR/Rogue 系列 GPU 的闭源图形驱动组件（内核态驱动模块），用于在 Linux 与 Android 设备上管理图形、计算与硬件性能计数器等 GPU 资源，广泛集成于搭载 Imagination GPU 的移动、汽车与消费电子平台。\n受影响版本中，本地普通用户通过 GPU 驱动 ioctl 关闭硬件性能计数器客户端流时，PVRSRVRGXCloseHWPerfClientStreamKM() 在流的销毁路径中缺少充分的锁保护，引用计数以非原子方式递减，并发关闭或连接清理与该路径竞争可导致对象被提前释放，其他代码路径继续访问已释放对象，造成对内核堆内存的读取或写入 UAF。\n修复版本中通过在硬件性能计数器客户端流的关闭与销毁路径补充锁保护并保证引用计数原子递减，消除并发销毁与并发使用之间的竞态，阻断内核堆 UAF 读写；官方 CVE 记录显示 26.2 RTM 为不受影响版本。", "effects": [{"comp_name": "Imagination Technologies Graphics DDK", "ecosystem": "linux", "versions": [{"affected_version": "[24.2 RTM2,24.2 RTM2]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[25.1 RTM2,25.3 RTM]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[26.1 RTM2,26.1 RTM2]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "UAF", "kind_en": "免费后使用", "last_modified_time": "2026-10-30", "level": "High", "mps_id": "MPS-mqnj-hu8a", "poc": false, "poc_url": [], "published_time": "2026-10-30", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-mqnj-hu8a", "name": "https://www.oscs1024.com/hd/MPS-mqnj-hu8a"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-15466", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-15466"}, {"url": "https://www.imaginationtech.com/gpu-driver-vulnerabilities/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Imagination GPU DDK UAF漏洞", "_translated": true, "_saved_at": "2026-10-30T02:19:51+00:00", "_first_saved_at": "2026-10-30T02:19:51+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-mqnj-hu8a"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过向受信任的数据序列化过程中添加恶意数据，从而在序列化和反序列化过程中执行恶意代码的攻击漏洞。这种漏洞通常存在于使用序列化 (serialization) 机制存储和传输数据的程序中。\n", "title": "什么是反序列化"}, {"content": "- 注入攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码注入到程序中，从而实现代码执行的目的。\n- 反射攻击：攻击者使用反射机制，在序列化过程中动态生成恶意数据，并将恶意代码注入到程序中，从而实现代码执行的目的。\n- 缓冲区溢出攻击：攻击者通过在序列化过程中向缓冲区输入恶意数据，导致缓冲区溢出，从而破坏程序的内存管理，实现代码执行的目的。\n- 格式字符串攻击：攻击者通过在序列化过程中输入恶意数据，导致程序使用错误的格式字符串，从而实现代码执行的目的。\n- 数据流攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码作为一个数据流传递给程序，从而实现代码执行的目的。\n", "title": "反序列化常见的攻击方式"}, {"content": "- 不信任输入数据：程序应该严格检查输入数据的有效性，并避免使用不受信任的数据。\n- 使用安全的序列化机制：程序应该使用安全的序列化机制，如 JSON 或 XML 序列化，而不是第三方序列化库。\n- 最小特权原则：程序应该限制对受信任数据的处理权限，并避免在运行时修改数据。\n- 代码审查和漏洞扫描：程序应该进行代码审查和漏洞扫描，以发现和修复潜在的安全漏洞。\n", "title": "如何预防反序列化"}], "cnvd_id": "", "cve_id": "CVE-2026-78527", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-502", "description": "GS Testimonial Slider（现已更名为 Solid Testimonials）是 GS Plugins 开发的开源 WordPress 推荐语轮播插件，发布于 WordPress.org 官方插件目录，用于创建和管理客户评价、推荐语轮播与视频评价等展示内容。\n受影响版本中，插件的导入导出 AJAX 端点 gs_tm_import_data 与 gs_tm_export_data 仅调用 check_ajax_referer 校验 nonce、未执行 current_user_can 能力校验，import__posts 函数将上传 data.json 中的 meta_input 键值对未经净化直接传入 wp_insert_post 写入 gs_testimonial 文章的 post meta；导出流程 export__testimonial 函数遍历文章全部 meta 值，对判定为序列化数据的值调用 maybe_unserialize 还原，低权限账户预先植入的恶意序列化对象字符串在该处被实例化，形成 PHP 对象注入，可进一步触发敏感信息泄露或代码执行等后果。\n修复版本中通过官方补丁消除该反序列化链路的方案尚未发布，Patchstack 记录显示截至 2026-10-30 无官方补丁可用，仅提供临时缓解规则；在官方修复发布前，可限制低权限账户使用导入导出功能并部署 WAF 拦截相关 AJAX 请求，待补丁发布后升级插件完成修复。", "effects": [{"comp_name": "gs-testimonial", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,3.3.10]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "反序列化", "kind_en": "不可信数据的反序列化", "last_modified_time": "2026-10-31", "level": "High", "mps_id": "MPS-3s02-rmha", "poc": false, "poc_url": [], "published_time": "2026-10-31", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-3s02-rmha", "name": "https://www.oscs1024.com/hd/MPS-3s02-rmha"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-78527", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-78527"}, {"url": "https://patchstack.com/database/wordpress/plugin/gs-testimonial/vulnerability/wordpress-gs-testimonial-slider-plugin-3-3-10-php-object-injection-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "GS Testimonial Slider PHP对象注入漏洞", "_translated": true, "_saved_at": "2026-10-30T21:18:36+00:00", "_first_saved_at": "2026-10-30T21:18:36+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-3s02-rmha"}, {"analysis_status": 0, "articles": [{"content": "- 程序未正确处理用户上传的文件，从而导致程序可以读取、处理或存储未经授权的文件\n", "title": "什么是任意文件上传"}, {"content": "- 欺骗攻击：攻击者可以通过发送伪造的文件来欺骗程序，从而导致程序读取、处理或存储未经授权的文件。\n- 文件格式攻击：攻击者可以通过选择特定的文件格式，例如压缩文件或 ZIP 文件，从而利用上传的文件来篡改程序的执行结果或窃取程序中的重要数据。\n", "title": "任意文件上传常见的攻击方式"}, {"content": "- 使用安全文件传输协议 (FTP):使用安全 FTP 协议可以确保上传的文件格式、大小、权限等符合预期，同时可以防止文件读取、篡改或存储漏洞。\n- 使用文件上传过滤器：使用文件上传过滤器可以过滤上传的文件，以确保文件的格式、大小、权限等符合预期，同时可以防止文件读取、篡改或存储漏洞。\n- 使用白名单机制：使用白名单机制可以只允许特定的文件格式、大小、权限等存在的文件上传，从而防止非法文件的上传和攻击。\n- 定期更新和升级程序：定期更新和升级程序可以修复已知的漏洞，并增强程序的安全性。", "title": "如何预防任意文件上传"}], "cnvd_id": "", "cve_id": "CVE-2026-76010", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-434", "description": "NextGEN Gallery（插件标识 nextgen-gallery）是 Imagely 维护的开源 WordPress 图库插件，用于创建与管理照片图库、幻灯片、缩略图与相册，WordPress.org 统计活跃安装量约 30 万。\n受影响版本中，XML-RPC 方法 ngg.editImage 对应的 Controller::edit_image() 把调用方提交的 other_properties 数组无限制地批量赋值到图像模型并持久化，攻击者可写入 meta_data 与 filename 等任意键；DataStorage Manager 的 get_computed_image_abspath() 使用 path_join() 把 meta_data 中按尺寸存储的 filename 拼接到图库或缓存目录，缺少 realpath 包含校验，../ 序列可逃出图库目录；公开图片投递路由 /nextgen-image/ 的 Controller::index_action() 在解析出的文件已存在时跳过 wp_hash 签名校验，render_image() 随后 readfile() 输出该路径内容，generate_image_size() 还会向由攻击者数据推出的路径写入生成的图像副本，攻击者借助可控路径与可控扩展名形成危险类型文件写入，最终在服务器上执行任意代码。\n修复版本中通过在 get_computed_image_abspath() 引入 Security::contain_path() realpath 包含校验与 is_safe_generated_image_path() 生成路径扩展名白名单，拒绝任何解析到图库目录之外的存量路径与生成路径；edit_image() 改用 MassAssignment::filter() 仅放行描述类字段并原子拒绝 meta_data、filename 等敏感键；index_action() 对每个请求强制校验 wp_hash 签名，_can_manage_gallery() 重新要求 nextgen_edit_gallery 能力作为前置门槛，切断了批量赋值、路径构造与公开投递之间的完整利用链。", "effects": [{"comp_name": "nextgen-gallery", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,4.5.0)", "min_fixed_version": "4.5.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "任意文件上传", "kind_en": "危险类型文件无限制上传", "last_modified_time": "2026-10-31", "level": "High", "mps_id": "MPS-yfj3-c5lo", "poc": false, "poc_url": [], "published_time": "2026-10-31", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-yfj3-c5lo", "name": "https://www.oscs1024.com/hd/MPS-yfj3-c5lo"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-76010", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-76010"}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/36dcde20-0af2-4b8b-8637-9a070dffa8a1?source=cve", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/nextgen-gallery/tags/4.3.0/src/DataStorage/Manager.php#L2373", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/nextgen-gallery/tags/4.3.0/src/XMLRPC/Controller.php#L289", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/nextgen-gallery/tags/4.3.0/src/DataStorage/Manager.php#L1226", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/nextgen-gallery/tags/4.3.0/src/DynamicThumbnails/Controller.php#L33", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/nextgen-gallery/tags/4.3.0/src/XMLRPC/Controller.php#L69", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/nextgen-gallery/tags/4.3.0/src/DataStorage/Manager.php#L2951", "name": ""}, {"url": "https://plugins.trac.wordpress.org/changeset/3699076/nextgen-gallery/trunk/src/DataStorage/Manager.php", "name": ""}], "scope_ nhr"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-63346", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:A/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:A/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-116", "description": "Refitter 是一个开源（MIT 许可）的 C# REST API 客户端代码生成工具，基于 Refit 库把 OpenAPI/Swagger 描述转换为强类型 Refit 接口源码，以 dotnet 全局工具与 NuGet 包形式分发，通常在开发与构建阶段使用。\n受影响版本中，生成器把 OpenAPI 描述里 in: header 参数的名称（parameters[].name）未经转义地拼接进 Refit [Header(\"\u003cname\u003e\")] 特性字符串字面量。攻击者可控或受攻击者影响的 OpenAPI 文档携带的恶意名称可通过默认校验（无需 --skip-validation），闭合该特性字符串并依次结束参数列表、方法、接口与命名空间，注入一个包含 [ModuleInitializer] 方法的顶级 file class，随后重新打开命名空间与接口，使生成文件仍为合法 C#。生成代码被编译进应用后，.NET 运行时在程序集加载阶段自动执行 [ModuleInitializer] 方法，攻击者代码于应用启动时运行，即使生成的客户端从未被调用。\n修复版本中通过 ParameterNaming.EscapeString 对 header 参数名与安全方案名称统一转义双引号、反斜杠与控制字符，使规格值无法闭合特性字符串字面量，并在默认校验阶段新增 AttributeStringValidator 拒绝包含越界字符的值，同时把同一编码器应用到路径与 Accept/Content-Type 等其余特性字符串发射点，从而切断注入链。", "effects": [{"comp_name": "refitter", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.1.2)", "min_fixed_version": "2.1.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "对输出编码和转义不恰当", "kind_en": "输出编码或转义不当", "last_modified_time": "2026-10-31", "level": "High", "mps_id": "MPS-cjlp-wh78", "poc": false, "poc_url": [], "published_time": "2026-10-31", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-cjlp-wh78", "name": "https://www.oscs1024.com/hd/MPS-cjlp-wh78"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-63346", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-63346"}, {"url": "https://github.com/christianhelle/refitter/security/advisories/GHSA-58x9-vjvp-6mx8", "name": "https://github.com/christianhelle/refitter/security/advisories/GHSA-58x9-vjvp-6mx8"}, {"url": "https://github.com/christianhelle/refitter/pull/1178", "name": "https://github.com/christianhelle/refitter/pull/1178"}, {"url": "https://github.com/christianhelle/refitter/commit/63a19b03699a9c267d6fab5f758ec26484db83a1", "name": "https://github.com/christianhelle/refitter/commit/63a19b03699a9c267d6fab5f758ec26484db83a1"}, {"url": "https://github.com/christianhelle/refitter/releases/tag/2.1.2", "name": "https://github.com/christianhelle/refitter/releases/tag/2.1.2"}, {"url": "https://github.com/user-attachments/files/29395048/maintainer-report.txt", "name": "https://github.com/user-attachments/files/29395048/maintainer-report.txt"}, {"url": "https://github.com/user-attachments/files/29395050/make_spec.py", "name": "https://github.com/user-attachments/files/29395050/make_spec.py"}, {"url": "https://github.com/user-attachments/files/29395051/reproduce.sh", "name": "https://github.com/user-attachments/files/29395051/reproduce.sh"}], "scope_influence": "", "tags": ["应用软件"], "title": "Refitter 代码注入漏洞", "_translated": true, "_saved_at": "2026-10-31T01:21:11+00:00", "_first_saved_at": "2026-10-31T01:21:11+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-cjlp-wh78"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-62162", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.2}]}, "cvss_score": 8.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-862", "description": "Hydra 是 Cardano 官方开源的二层（Layer-2）扩容方案（仓库 cardano-scaling/hydra，Apache-2.0 许可证），通过 Head 状态通道把链上资金转移到链下处理，用户可调用 hydra-node 提供的 HTTP 接口 POST /commit 向 Head 发起存款，存款以受链上 Plutus/Aiken 校验器保护的 UTxO 形式存在。\n受影响版本中，hydra-plutus/validators/deposit.ak 的 deposit 校验器在处理 Claim 赎回器时只检查 datum.head_id 与攻击者可控的 redeemer.currencySymbol 一致，并要求交易有效期落在存款截止时间之前，既不要求同一笔交易花费对应 Head 的状态代币 UTxO，也不对交易输出施加任何约束；受害者经 POST /commit 发起的存款确认上链后，任何能够构造并提交 Cardano 交易的第三方可在截止时间前直接观察并花费该待处理存款 UTxO，把其中资产重定向到任意地址，该笔独立花费不会触发 Head 校验器的任何安全检查，默认截止时间为 depositPeriod 的三倍，攻击窗口覆盖该期间内的全部待处理存款。\n修复版本中通过重定义 Claim 赎回器并新增 expect_increment_redeemer 检查切断该利用链：赎回器不再携带攻击者可控的 PolicyId，花费存款的交易必须在同一笔交易中消费对应 Head 状态代币 UTxO，且该 Head 输入的赎回器必须是 Head 校验器的 Increment 变体（构造子索引 1），同时在 hydra-plutus/src/Hydra/Contract/Head.hs 的 checkIncrement 中以 mustPreserveValue 强制 head 输入价值与全部非 head 脚本输入价值之和等于 head 输出价值，确保存款资产只能并入 Head 状态，无法被重定向到任意地址。", "effects": [{"comp_name": "hydra", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.1.0)", "min_fixed_version": "2.1.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-10-31", "level": "High", "mps_id": "MPS-jthi-dqnk", "poc": false, "poc_url": [], "published_time": "2026-10-31", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-jthi-dqnk", "name": "https://www.oscs1024.com/hd/MPS-jthi-dqnk"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-62162", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-62162"}, {"url": "https://github.com/cardano-scaling/hydra/security/advisories/GHSA-gfpc-m687-p7h5", "name": "https://github.com/cardano-scaling/hydra/security/advisories/GHSA-gfpc-m687-p7h5"}, {"url": "https://github.com/cardano-scaling/hydra/commit/ff60e4af4ecf05545a696a6d9bf1afeffe991de0", "name": "https://github.com/cardano-scaling/hydra/commit/ff60e4af4ecf05545a696a6d9bf1afeffe991de0"}, {"url": "https://github.com/cardano-scaling/hydra/releases/tag/2.1.0", "name": "https://github.com/cardano-scaling/hydra/releases/tag/2.1.0"}], "scope_influence": "", "tags": ["应用软件"], "title": "Hydra 存款盗取漏洞", "_translated": true, "_saved_at": "2026-10-30T21:18:40+00:00", "_first_saved_at": "2026-10-30T21:18:40+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-jthi-dqnk"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-63414", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:L/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.6}]}, "cvss_score": 7.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:L/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-863", "description": "shopify_app 是 Shopify 官方开源的 Ruby on Rails 引擎（gem），用于为 Shopify 嵌入式应用提供安装、认证、会话管理与 Admin API 访问能力，经 RubyGems 分发。\n受影响版本中，token exchange 认证控制器的辅助方法 current_shopify_domain 以清洗后的 shop 查询参数（sanitized_shop_name）优先于会话商店域名，返回值可被请求中的 shop 参数控制，而非来自经验证 ID token 或会话推导的商店身份；持有商店 A 有效会话的攻击者在已认证请求中附带指向商店 B 的 shop 参数后，依赖 current_shopify_domain 或 params[:shop] 做授权判定、租户定位、存储访问令牌选择或数据隔离的应用代码会切换到商店 B 上下文执行，导致跨商店未授权访问与越权操作。\n修复版本中通过重写 current_shopify_domain 使其仅从经验证 ID token 或会话解析已认证商店域名，新增 authenticated_shopify_domain 与 requested_shopify_domain 分别暴露可信上下文与请求上下文，并在 activate_shopify_session 中校验二者，shop 参数与已认证商店不一致时返回 401，切断攻击者可控参数进入授权上下文的路径。", "effects": [{"comp_name": "shopify_app", "ecosystem": "linux", "versions": [{"affected_version": "[22.1.0,23.0.3)", "min_fixed_version": "23.0.3", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-10-31", "level": "High", "mps_id": "MPS-x6u2-g58w", "poc": false, "poc_url": [], "published_time": "2026-10-31", "reference_url_list": [{"url": "https://github.com/Shopify/shopify_app/security/advisories/GHSA-6j52-38f8-qhxr", "name": ""}, {"url": "https://github.com/Shopify/shopify_app/releases/tag/v23.0.3", "name": ""}, {"url": "https://github.com/advisories/GHSA-6j52-38f8-qhxr", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "shopify_app 跨商店授权绕过", "_translated": true, "_saved_at": "2026-10-31T01:21:08+00:00", "_first_saved_at": "2026-10-31T01:21:08+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-x6u2-g58w"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-62264", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "cwe": "CWE-306", "description": "@sylphx/pdf-reader-mcp 是 SylphxAI/anymd 开源仓库（MIT 许可）发布的 npm 包，提供读取 PDF 并转换为 Markdown 的 MCP 服务器，供 AI 代理与大模型客户端通过 stdio 或 HTTP 传输调用。\n受影响版本中，HTTP 传输读取 MCP_API_KEY 环境变量并输出 API key authentication enabled 启动日志，但 src/index.ts 的 createTransport 未把该值传入传输配置，src/mcp.ts 的 startHttpServer 注册的 /mcp 请求处理逻辑不校验 X-API-Key 请求头，/mcp 端点接受未认证请求；配合默认绑定 0.0.0.0，任何能访问该端口的客户端可调用全部 PDF 工具并读取服务器进程可打开的任意 PDF 内容，URL 形式的文档来源还引入有限的 SSRF 攻击面。\n修复版本中通过在 src/mcp.ts 新增 isApiKeyValid，以 SHA-256 与 timingSafeEqual 对 X-API-Key 做常量时间比较，对配置了 MCP_API_KEY 的 /mcp 请求强制校验并对缺失或不匹配返回 401，同时把 MCP_HTTP_HOST 默认值从 0.0.0.0 改为 127.0.0.1，在非回环绑定且未配置密钥时输出启动告警，切断未认证调用链。", "effects": [{"comp_name": "@sylphx/pdf-reader-mcp", "ecosystem": "npm", "versions": [{"affected_version": "[2.2.0,3.0.1)", "min_fixed_version": "3.0.1", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "关键功能的认证机制缺失", "kind_en": "缺少关键功能的身份验证", "last_modified_time": "2026-10-31", "level": "High", "mps_id": "MPS-58mc-rosi", "poc": false, "poc_url": [], "published_time": "2026-10-31", "reference_url_list": [{"url": "https://github.com/SylphxAI/pdf-reader-mcp/security/advisories/GHSA-q344-5v34-gm84", "name": ""}, {"url": "https://github.com/SylphxAI/anymd/pull/332", "name": ""}, {"url": "https://github.com/SylphxAI/anymd/commit/4c35f72862d729301e3912ab8c8317d2828cf4c2", "name": ""}, {"url": "https://github.com/SylphxAI/anymd/releases/tag/v3.0.1", "name": ""}, {"url": "https://github.com/advisories/GHSA-q344-5v34-gm84", "name": ""}], "scope_influence": "", "tags": ["AI", "npm", "开源"], "title": "pdf-reader-mcp未授权访问漏洞", "_translated": true, "_saved_at": "2026-10-30T21:18:39+00:00", "_first_saved_at": "2026-10-30T21:18:39+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-58mc-rosi"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "cnvd_id": "", "cve_id": "CVE-2026-120040", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-269", "description": "Mail logging \u0026 Catcher（WP Mail Catcher）是 WordPress 开源邮件日志插件（GitHub 开源，GPL-3.0 许可），自动将站点发出的邮件记录为日志，供管理员查看、重发与导出。\n受影响版本中，插件通过 wp_mail 过滤器在 src/Loggers/WpMail.php 的 getTransformedMailArgs 中将邮件正文原样写入日志 message 字段，未对敏感链接做脱敏；当管理员把插件的 default_view_role 设置改为 read 等低权限能力后，订阅者级别用户可通过 src/Bootstrap.php 中 route() 的 single_mail 动作读取日志条目，src/Views/HtmlMessage.php 与 src/Views/TextMessage.php 输出 message 内容，泄露其中管理员密码重置链接的 action=rp 与 key 参数值，攻击者凭借该有效重置密钥完成 WordPress 密码重置流程，将账户提升为管理员。\n修复版本中通过新增 src/Redactor.php 的 Redactor 类，在 LogHelper::saveMail 保存与 Logs::dbResultTransform 读取两个环节调用 redactLog，由默认注册的 redactSensitiveUrls 将包含 action=rp 或 key= 参数的 URL 替换为 [redacted]，默认启用 redact_sensitive_urls 设置，历史日志在读取阶段同样被脱敏，随 2.3.0 版本发布，切断管理员密码重置密钥泄露链路。", "effects": [{"comp_name": "wp-mail-catcher", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.3.0)", "min_fixed_version": "2.3.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-10-31", "level": "High", "mps_id": "MPS-ats9-o5hy", "poc": false, "poc_url": [], "published_time": "2026-10-31", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ats9-o5hy", "name": "https://www.oscs1024.com/hd/MPS-ats9-o5hy"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-120040", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-120040"}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/599e46ed-a71c-41d1-839f-6bb76808a58f?source=cve", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/wp-mail-catcher/tags/2.2.0/src/Bootstrap.php#L259", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/wp-mail-catcher/tags/2.2.0/src/Bootstrap.php#L101", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/wp-mail-catcher/tags/2.2.0/src/Loggers/WpMail.php#L42", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/wp-mail-catcher/tags/2.2.0/src/Views/TextMessage.php#L10", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/wp-mail-catcher/tags/2.2.0/src/Views/HtmlMessage.php#L9", "name": ""}, {"url": "https://github.com/JWardee/wp-mail-catcher/releases/tag/v2.3.0", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "WP Mail Catcher敏感信息泄露漏洞", "_translated": true, "_saved_at": "2026-10-31T07:52:51+00:00", "_first_saved_at": "2026-10-31T07:52:51+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ats9-o5hy"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-109197", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "cwe": "CWE-89", "description": "WP Directory Kit 是一款在 WordPress.org 发布的开源目录管理插件（插件标识 wpdirectorykit），用于构建房源、企业等目录站点，提供自定义字段管理、前台搜索表单与列表筛选能力。\n受影响版本中，前台搜索表单渲染时由 application/helpers/Basic.php 的 wdk_generate_search_form 加载 search_fields/SLIDER_RANGE.php 视图，该视图第15行与第67行通过 wmvc_show_data('idfield') 读取字段 ID，而 vendor/Winter_MVC/core/helpers.php 第770行的 wmvc_show_data 在请求携带 $_POST['idfield'] 时优先返回该请求参数且仅做 XSS 清洗、未做 SQL 转义；当搜索字段为 Slider Range 类型且未设置 value_max 时，该值被拼入 order_by('field_'.$field_id.'_'…' DESC')，vendor/Winter_MVC/core/database.php 第441行再将该 ORDER BY 片段原样并入 SQL 语句执行，未认证攻击者发送携带恶意 idfield 参数的 POST 请求即可附加查询并提取数据库敏感信息。\n修复版本中通过将 SLIDER_RANGE.php 第15行改为 $field_id =(int) wmvc_show_data('idfield',$field_data, '', TRUE, TRUE)，以整型强制转换并以 skip_post=TRUE 阻断 $_POST 覆盖，order_by 子句与字段属性统一改用整型化后的 $field_id 并对 wdk_field_option 返回值做 esc_html 处理，切断 idfield 进入 ORDER BY 子句的注入链路。", "effects": [{"comp_name": "wpdirectorykit", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.6.1)", "min_fixed_version": "1.6.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-10-31", "level": "High", "mps_id": "MPS-kiqf-xt7u", "poc": false, "poc_url": [], "published_time": "2026-10-31", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-kiqf-xt7u", "name": "https://www.oscs1024.com/hd/MPS-kiqf-xt7u"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-109197", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-109197"}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/73ecfe84-dbe1-4e89-959b-e810d9a436f6?source=cve", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/wpdirectorykit/trunk/application/views/search_fields/SLIDER_RANGE.php#L67", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/wpdirectorykit/trunk/vendor/Winter_MVC/core/database.php#L441", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/wpdirectorykit/trunk/vendor/Winter_MVC/core/helpers.php#L770", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/wpdirectorykit/trunk/application/helpers/Basic.php#L179", "name": ""}, {"url": "https://wordpress.org/plugins/wpdirectorykit/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "WP Directory Kit SQL注入漏洞", "_translated": true, "_saved_at": "2026-10-31T14:11:50+00:00", "_first_saved_at": "2026-10-31T14:11:50+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-kiqf-xt7u"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-120194", "cvss": {"cvssv31": [{"source": "secalert@redhat.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-835", "description": "json-glib 是 GNOME 开发的开源 C 语言 JSON 解析库，为基于 GLib 的应用提供 JSON 解析、生成与 JSONPath 查询能力，随主流 Linux 发行版和 GNOME 桌面环境广泛分发。\n受影响版本中，json-glib/json-path.c 的 JSONPath 切片求值循环写作 for (i = start; i \u003c end; i += node-\u003edata.slice.step)，循环退出条件仅在步长为正时成立，而 json_path_compile() 解析切片表达式时允许步长携带负号。应用调用 json_path_query() 执行攻击者可控的形如 $[:5:-1] 的表达式时，求值参数为 start=0、end=5、step=-1，循环变量持续减小并远离退出条件，函数无法返回，期间反复以负数下标访问数组元素并触发断言失败，最终造成进程挂起与 CPU 拒绝服务。\n修复版本中通过，可在应用侧对不可信 JSONPath 表达式做前置校验并拒绝携带负数步长的切片表达式，同时对表达式求值设置超时与资源限制；上游 GNOME GitLab issue #96 与 Red Hat Bugzilla 2564418 截至 2026-10-31 均处于未修复状态，官方修复发布后建议及时升级。", "effects": [{"comp_name": "json-glib", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.10.8]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "不可达退出条件的循环（无限循环）", "kind_en": "具有无法到达的退出条件的循环（“无限循环”）", "last_modified_time": "2026-10-31", "level": "High", "mps_id": "MPS-os5p-hvqz", "poc": false, "poc_url": [], "published_time": "2026-10-31", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-os5p-hvqz", "name": "https://www.oscs1024.com/hd/MPS-os5p-hvqz"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-120194", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-120194"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-120194", "name": ""}, {"url": "https://bugzilla.redhat.com/show_bug.cgi?id=2564418", "name": ""}, {"url": "https://gitlab.gnome.org/GNOME/json-glib/-/issues/96", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "json-glib JSONPath死循环漏洞", "_translated": true, "_saved_at": "2026-10-31T14:11:48+00:00", "_first_saved_at": "2026-10-31T14:11:48+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-os5p-hvqz"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2026-63398", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:H/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.4}]}, "cvss_score": 7.4, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:H/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-287", "description": "Coop 是 ROOST 开源的审核与内容审查工具，托管于 GitHub（roostorg/coop），基于 Node.js 与 TypeScript 构建，面向多组织（多租户）场景提供内容审核与仲裁能力，各组织可独立配置 SAML 单点登录。\n受影响版本中，SAML 策略的 verify 回调在 /saml/login/:orgId/callback 认证流程中仅按断言中的 email 调用 kyselyUserFindByEmail 查询用户，未将查询与回调路径中的组织 ID 绑定。攻击者作为其所辖组织的管理员配置并控制该组织 SAML IdP 签名密钥后，可向目标组织的 SAML 回调提交以受害者邮箱为主题的断言；当目标组织注册的 SAML 证书与攻击者控制的签名证书相同时，断言通过目标组织证书校验，按邮箱的查询命中目标组织内的用户并创建其会话，攻击者在目标组织无需任何权限便能获得该用户身份，形成跨租户账户接管。\n修复版本中通过在 server/graphql/datasources/userKyselyPersistence.ts 新增 kyselyUserFindByEmailAndOrg 将用户查询同时限定 email 与 org_id，并新增 server/graphql/utils/resolveSamlUser.ts 与 getOrgIdFromPath 从回调路径解析组织 ID，SAML 登录与登出共用按组织限定的 verify 回调；跨组织邮箱不再命中查询，认证被拒绝，缺失或非字符串的 email claim 也在查询前被拒绝。", "effects": [{"comp_name": "coop", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.0.2)", "min_fixed_version": "1.0.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "身份验证不当", "kind_en": "认证不当", "last_modified_time": "2026-10-31", "level": "High", "mps_id": "MPS-e59c-7udi", "poc": false, "poc_url": [], "published_time": "2026-10-31", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-e59c-7udi", "name": "https://www.oscs1024.com/hd/MPS-e59c-7udi"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-63398", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-63398"}, {"url": "https://github.com/roostorg/coop/security/advisories/GHSA-2v93-383c-9fw2", "name": "https://github.com/roostorg/coop/security/advisories/GHSA-2v93-383c-9fw2"}, {"url": "https://github.com/roostorg/coop/pull/783", "name": "https://github.com/roostorg/coop/pull/783"}, {"url": "https://github.com/roostorg/coop/commit/d1be81b6b33abc1162ee6b9952d4bd1ca761b071", "name": "https://github.com/roostorg/coop/commit/d1be81b6b33abc1162ee6b9952d4bd1ca761b071"}, {"url": "https://github.com/roostorg/coop/releases/tag/1.0.2", "name": "https://github.com/roostorg/coop/releases/tag/1.0.2"}], "scope_influence": "", "tags": ["应用软件"], "title": "Coop SAML 跨租户认证绕过漏洞", "_translated": true, "_saved_at": "2026-10-31T01:21:09+00:00", "_first_saved_at": "2026-10-31T01:21:09+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-e59c-7udi"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-119089", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_ 本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-120114", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "cwe": "CWE-79", "description": "Debug Log Manager 是一款 WordPress 开源调试日志管理插件（GPLv2，作者 qriouslad），供站点管理员在后台集中查看、检索与清理 debug.log，并支持把前端 JavaScript 错误提交到调试日志。\n受影响版本中，插件以 wp_ajax_nopriv_log_js_errors 注册的未认证接口 log_js_errors 允许任意访客提交 JS 错误内容，message 与 pageUrl 参数仅经 sanitize_log_field 写入 debug.log，其中 sanitize_text_field 只剥离字面量标签、不解码 \\uXXXX 转义与 HTML 实体，编码后的脚本标记可原样落盘；日志查看与自动刷新接口 get_latest_entries 组装条目时直接回显 $error['details']，对判定为 JSON 的内容以 print_r 拼入 pre 标签且未转义，后台 DataTables 以 HTML 渲染单元格，管理员打开日志页面或仪表盘小部件时脚本即在后台会话中执行。\n修复版本中通过在写入前新增 decode_encoded_markup 迭代解码 \\uXXXX 转义与 HTML 实体，再经 sanitize_text_field 与 wp_strip_all_tags 剥离全部标签，使编码标记无法持久化；日志条目输出点统一以 wp_kses_post 转义 $error['details']，JSON 内容改用 esc_html 包裹后再放入 pre 标签，并收紧日志按 [ 字符切分时的伪条目保护规则，封堵利用空格加引号伪造日志条目的路径，注入内容不再以脚本形式渲染。", "effects": [{"comp_name": "debug-log-manager", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.5.3)", "min_fixed_version": "2.5.3", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-10-31", "level": "High", "mps_id": "MPS
