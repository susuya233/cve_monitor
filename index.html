88", "name": ""}, {"url": "https://techdocs.broadcom.com/us/en/vmware-cis/desktop-hypervisors/workstation-pro/26H1/release-notes/vmware-workstation-pro-26h1u1-release-notes.html", "name": ""}, {"url": "https://techdocs.broadcom.com/us/en/vmware-cis/desktop-hypervisors/fusion-pro/26H1/release-notes/vmware-fusion-26h1u1-release-notes.html", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "VMware HGFS 栈溢出逃逸漏洞", "_translated": true, "_saved_at": "2026-09-03T12:28:20+00:00", "_first_saved_at": "2026-09-03T12:28:20+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-01ab-afad"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-79755", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:H/UI:N/S:C/C:H/I:H/A:H", "severity": "high", "base_score": 8}]}, "cvss_score": 8, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:H/UI:N/S:C/C:H/I:H/A:H", "cwe": "CWE-78", "description": "Nuclio 是一个用于实时事件和数据处理的“无服务器”框架。在版本 1.17.4 之前，在 Nuclio 本地 Docker 平台上，函数命名空间被插入（未经验证）到通过主机 shell (/bin/sh -c) 执行的双引号 docker ps --filter \"label=nuclio.io/namespace=\u003cvalue\u003e\" 命令中。由于默认的身份验证类型是 nop（未经身份验证），因此远程攻击者可以注入以 root 身份在仪表板容器内运行的任意操作系统命令，该容器保存着 Docker 套接字 → 主机妥协。该问题已在1.17.4版本中修复。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-09-03", "level": "High", "mps_id": "MPS-z024-urfg", "poc": false, "poc_url": [], "published_time": "2026-09-03", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-z024-urfg", "name": "https://www.oscs1024.com/hd/MPS-z024-urfg"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-79755", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-79755"}, {"url": "https://github.com/nuclio/nuclio/commit/24582ac354d04951ec6786b3fe6ccf3b32652e9f", "name": ""}, {"url": "https://github.com/nuclio/nuclio/pull/4220", "name": ""}, {"url": "https://github.com/nuclio/nuclio/releases/tag/1.17.4", "name": ""}, {"url": "https://github.com/nuclio/nuclio/security/advisories/GHSA-2893-rq73-w22x", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-79755漏洞", "_translated": true, "_saved_at": "2026-09-02T18:20:40+00:00", "_first_saved_at": "2026-09-02T18:20:40+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-z024-urfg"}, {"analysis_status": 0, "articles": [{"content": "- 命令注入是一种攻击，其目标是通过易受攻击的应用程序在主机操作系统上执行任意命令。 当应用程序将不安全的用户提供的数据（表单、cookie、HTTP 标头等）传递到系统 shell 时，就会产生缺陷。攻击者通过构造恶意的命令或数据，将其注入到程序执行的上下文中，从而绕过程序的输入验证和安全措施，实现对程序操作的恶意操作。", "title": "什么是命令注入"}, {"content": "- 文件上传：攻击者通过构造恶意的文件上传请求，将包含恶意命令的文件上传到服务器，从而利用命令注入漏洞执行恶意命令。\n- SQL 注入：攻击者通过构造恶意的 SQL 查询语句，将包含恶意命令的 SQL 语句注入到数据库中，从而执行恶意命令，窃取数据或者破坏系统。\n- 命令执行：攻击者通过在 Web 应用程序的表单提交数据中注入恶意命令，从而执行恶意命令，例如删除文件、格式化硬盘等。\n- 命令注入漏洞的旁路攻击：攻击者可以利用命令注入漏洞旁路控制程序的执行流程，从而窃取数据、破坏系统、控制程序等。\n", "title": "命令注入常见的攻击方式"}, {"content": "- 输入验证：在程序输入处对输入数据进行严格的验证和过滤，确保输入数据符合预期的格式和类型，避免被攻击者注入恶意命令。\n- 输出过滤：在程序输出处对输出数据进行严格的过滤和检查，确保输出数据符合预期的格式和类型，避免被攻击者截获和篡改。\n- 使用安全的编程模型：使用安全的编程模型，例如避免使用原生的命令执行方式，使用安全的框架和库来处理输入数据和执行命令，避免命令注入漏洞。\n- 数据库加密和访问控制：对于敏感数据和命令，使用加密和访问控制措施，确保只有授权用户可以访问和执行命令，避免被攻击者窃取和篡改。\n- 定期更新和升级：定期更新和升级应用程序和库的版本，确保应用程序和库的最新版本包含了最新的安全补丁和修复措施，避免安全漏洞的出现和利用。\n- 安全审计和监控：定期对系统和应用程序进行安全审计和监控，及时发现和阻止潜在的安全漏洞和攻击，确保系统和数据的安全和可靠性。", "title": "如何预防命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-71963", "cvss": {}, "cvss_score": 7.8, "cvss_vector": "", "cwe": "CWE-77", "description": "Hermes Agent 是 Nous Research 开源的命令行 AI 编码代理（GitHub 仓库 NousResearch/hermes-agent，MIT 许可，PyPI 包名 hermes-agent），基于大模型在终端中自动采集仓库上下文并执行编码任务，GitHub Star 数超过 23 万。\n受影响版本中，Hermes 在会话启动、用户发送首条消息时会在会话目录自动运行 git status 采集工作区快照（agent/coding_context.py 的 build_coding_workspace_block 经 _git 调用 bounded_git_probe 直接派生 git 子进程），未剥离仓库自带的 .git/config；git 在该命令触发的索引刷新中执行仓库配置的 core.fsmonitor 辅助程序，攻击者将 core.fsmonitor 设为任意命令、把含 .git 目录的仓库以 zip 压缩包、共享目录、同步盘或 U 盘等文件形式投递（git clone/fetch/pull 不传输 .git/config），受害者用 Hermes 打开该仓库并发送消息时，该命令即以当前用户身份在沙箱外、无审批提示地执行，可窃取 SSH 私钥、环境变量与 shell 配置中的云凭据并取得主机立足点；0.18.2 与 0.21.0 均经实测确认受影响。\n修复版本中通过合入 main 分支的安全修复 commit（f6234d00c5d59450adea1d7edd30ad3859375c79，2026-09-02，尚未随正式版本发布）切断上述链路：全部自动 git 探测统一经 noninteractive_git_env() 执行，通过 GIT_CONFIG_* 环境变量将 core.fsmonitor、core.hooksPath、pager、editor、credential helper 固定为惰性值并忽略全局与系统配置，同时对 diff/show/log/blame 注入 --no-ext-diff --no-textconv 阻断 .gitattributes 指定的外部 diff/textconv 驱动，并新增真实 git 环境下的端到端回归测试；截至 2026-09-03 最新发布版本 0.21.0 仍包含受影响代码，修复版本发布前需按缓解措施防护。", "effects": [{"comp_name": "hermes-agent", "ecosystem": "pip", "versions": [{"affected_version": "(-∞,0.21.0]", "min_fixed_version": "", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "命令注入", "kind_en": "命令中使用的特殊元素的不正确中和（“命令注入”）", "last_modified_time": "2026-09-03", "level": "High", "mps_id": "MPS-eae9-f52a", "poc": false, "poc_url": [], "published_time": "2026-09-03", "reference_url_list": [{"url": "https://cybersecuritynews.com/gitspawn-flaws-execute-code/", "name": ""}, {"url": "https://www.manifold.security/blog/ai-coding-agents-git-hijack", "name": ""}, {"url": "https://github.com/NousResearch/hermes-agent", "name": ""}, {"url": "https://github.com/NousResearch/hermes-agent/commit/f6234d00c5d59450adea1d7edd30ad3859375c79", "name": ""}, {"url": "https://github.com/NousResearch/hermes-agent/releases/tag/v2026.8.31", "name": ""}], "scope_influence": "", "tags": ["AI"], "title": "Hermes Agent 仓库配置命令执行漏洞", "_translated": true, "_saved_at": "2026-09-03T12:28:28+00:00", "_first_saved_at": "2026-09-02T23:46:00+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-eae9-f52a"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-84292", "cvss": {"cvssv31": [{"source": "ce714d77-add3-4f53-aff5-83d477b104bb", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:H/A:N", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:H/A:N", "cwe": "CWE-116", "description": "fast-uri 是 fastify 组织开源的零依赖 RFC 3986 URI 处理库（npm 包 fast-uri），提供 serialize、parse、normalize、equal、resolve 等 URI 组装、解析与比较能力，被 Node.js 生态大量服务端组件用于构造内部与外部请求地址。\n受影响版本中，serialize() 组装 authority 时对 userinfo 与 host 做了转义，而 lib/utils.js 的 recomposeAuthority() 将 port 值直接字符串拼接进结果，未按 RFC 3986 校验其是否为纯数字序列。应用以固定 host 配合来自用户输入或服务注册记录的 port 构造 URI 时，攻击者可让 port 携带 @127.0.0.1:8124 之类的值，使序列化结果变为 http://trusted.example:@127.0.0.1:8124/app，原 host 被降级为 userinfo，authority 实际指向攻击者控制的主机；fast-uri 与 Node 的 URL 回读该结果时均不报错，应用对生成 URI 的再校验无法发现异常，请求会发往攻击者主机。\n修复版本中通过在 recomposeAuthority() 中新增 isPort（/^\\d*$/）校验切断该链路，port 不是数字序列时抛出 TypeError: URI port is malformed.，拒绝完成序列化，修复随 4.1.4、3.1.7、2.4.6 覆盖 v4、v3、v2 三条支持线发布。", "effects": [{"comp_name": "fast-uri", "ecosystem": "npm", "versions": [{"affected_version": "[3.0.0,3.1.7)", "min_fixed_version": "3.1.7", "repository": "npm", "solutions": [], "upstream": true}, {"affected_version": "[4.0.0,4.1.4)", "min_fixed_version": "4.1.4", "repository": "npm", "solutions": [], "upstream": true}, {"affected_version": "(-∞,2.4.6)", "min_fixed_version": "2.4.6", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "对输出编码和转义不恰当", "kind_en": "输出编码或转义不当", "last_modified_time": "2026-09-03", "level": "High", "mps_id": "MPS-4wzm-i9cu", "poc": false, "poc_url": [], "published_time": "2026-09-03", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-4wzm-i9cu", "name": "https://www.oscs1024.com/hd/MPS-4wzm-i9cu"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-84292", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-84292"}, {"url": "https://cna.openjsf.org/security-advisories.html", "name": ""}, {"url": "https://github.com/fastify/fast-uri/security/advisories/GHSA-qw65-cvwx-89v3", "name": ""}], "scope_influence": "", "tags": ["npm", "开源"], "title": "fast-uri 端口注入漏洞", "_translated": true, "_saved_at": "2026-09-03T02:31:58+00:00", "_first_saved_at": "2026-09-02T21:30:08+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-4wzm-i9cu"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-84394", "cvss": {"cvssv31": [{"source": "ce714d77-add3-4f53-aff5-83d477b104bb", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:H/A:N", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:H/A:N", "cwe": "CWE-436", "description": "fast-uri 是 Fastify 维护的开源 RFC 3986 URI 工具库，以 npm 包发布，用于解析、序列化、规范化与比较 URI。\n受影响版本中，parse() 对含未闭合或不在合法 IPv6 字面量位置的方括号主机既不按 IP-literal 校验、也不按域名规范化，会把该字符串作为 host 返回且 error 为 undefined。攻击者可提交如 http://user@[@127.0.0.1:8123/admin 的 URI，使应用按 parse().host 执行 SSRF 拒绝列表、重定向白名单或代理路由时对照到 [@127.0.0.1，而 Node 的 URL 与 http.get、axios、got 等客户端会把同一输入解析到 127.0.0.1 并实际发往该主机。normalize()、equal() 与 resolve() 会沿用同一 host。\n修复版本中通过在 parseWithStatus 中把任意含方括号且不是合法 [IPv6] 字面量的 host 标记为畸形，使 parse() 报告 URI host is malformed.，切断与 Node URL 解析结果不一致的主机判定路径。", "effects": [{"comp_name": "fast-uri", "ecosystem": "npm", "versions": [{"affected_version": "[3.1.6,3.1.7)", "min_fixed_version": "3.1.7", "repository": "npm", "solutions": [], "upstream": true}, {"affected_version": "[2.4.5,2.4.6)", "min_fixed_version": "2.4.6", "repository": "npm", "solutions": [], "upstream": true}, {"affected_version": "[4.1.3,4.1.4)", "min_fixed_version": "4.1.4", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "解释冲突", "kind_en": "Interpretation Conflict", "last_modified_time": "2026-09-03", "level": "High", "mps_id": "MPS-jgot-alqp", "poc": false, "poc_url": [], "published_time": "2026-09-03", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-jgot-alqp", "name": "https://www.oscs1024.com/hd/MPS-jgot-alqp"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-84394", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-84394"}, {"url": "https://cna.openjsf.org/security-advisories.html", "name": ""}, {"url": "https://github.com/fastify/fast-uri/security/advisories/GHSA-58mr-gqgx-xq4g", "name": ""}], "scope_influence": "", "tags": ["npm", "开源"], "title": "fast-uri主机混淆漏洞", "_translated": true, "_saved_at": "2026-09-03T12:28:24+00:00", "_first_saved_at": "2026-09-03T07:38:01+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-jgot-alqp"}, {"analysis_status": 0, "articles": [{"content": "- 命令注入是一种攻击，其目标是通过易受攻击的应用程序在主机操作系统上执行任意命令。 当应用程序将不安全的用户提供的数据（表单、cookie、HTTP 标头等）传递到系统 shell 时，就会产生缺陷。攻击者通过构造恶意的命令或数据，将其注入到程序执行的上下文中，从而绕过程序的输入验证和安全措施，实现对程序操作的恶意操作。", "title": "什么是命令注入"}, {"content": "- 文件上传：攻击者通过构造恶意的文件上传请求，将包含恶意命令的文件上传到服务器，从而利用命令注入漏洞执行恶意命令。\n- SQL 注入：攻击者通过构造恶意的 SQL 查询语句，将包含恶意命令的 SQL 语句注入到数据库中，从而执行恶意命令，窃取数据或者破坏系统。\n- 命令执行：攻击者通过在 Web 应用程序的表单提交数据中注入恶意命令，从而执行恶意命令，例如删除文件、格式化硬盘等。\n- 命令注入漏洞的旁路攻击：攻击者可以利用命令注入漏洞旁路控制程序的执行流程，从而窃取数据、破坏系统、控制程序等。\n", "title": "命令注入常 MPS-a3d7-d3e3"}, {"analysis_status": 0, "articles": [{"content": "跨站点请求伪造 (CSRF)通过利用网站对用户请求的信任进行攻击。当用户在网站A登录并在同一浏览器会话中访问网站B时，攻击者可以构造特制的请求并诱使用户执行，以使网站B误以为这些请求是用户合法发起的。\n攻击者通常通过欺骗用户点击恶意链接、在受信任的网站中植入恶意代码或通过钓鱼等手段来实施CSRF攻击，一旦用户执行了恶意请求，攻击者可以以用户的身份执行任意操作，包括更改用户密码、发起资金转账或删除重要数据等。", "title": "什么是CSRF"}, {"content": "- 链接欺骗：攻击者通过向用户发送包含恶意链接的电子邮件或社交媒体消息，诱使用户点击并执行恶意请求。\n- 图片引用攻击：攻击者通过在恶意网站上包含指向目标网站的图片引用，以触发用户浏览器自动发送目标网站的请求。\n- XSS利用：如果目标网站存在XSS漏洞，攻击者可以注入恶意脚本，以使用户在浏览器中执行恶意请求。", "title": "CSRF常见的攻击方式"}, {"content": "- 随机令牌：网站可以在每个请求中包含一个随机生成的令牌（CSRF Token），并验证该令牌的有效性，以确认请求的来源是合法的。\n- SameSite Cookie：使用SameSite属性来限制跨站点请求，将Cookie的发送限制在同一站点上，减少了跨站请求伪造的风险。\n- 双重验证：对于敏感操作，网站可以要求用户进行额外的验证，例如输入验证码、提供第二个因素的身份验证等。\n- 强化浏览器策略：网站可以设置Content-Security-Policy（CSP）头，限制浏览器执行恶意脚本的能力，减少CSRF攻击的风险。\n- 限制用户操作：网站可以要求用户在执行敏感操作之前进行明确的确认或授权，防止恶意请求被误触发。\n- 安全编码实践：开发人员应遵循安全编码实践，对用户输入进行适当的验证和过滤，防止恶意请求的注入。", "title": "如何预防CSRF"}], "cnvd_id": "", "cve_id": "CVE-2026-85236", "cvss": {"cvssv4": [{"source": "5a6e4751-2f3f-4070-9419-94fb35b644e8", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:L/VA:L/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:L/VA:L/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-352", "description": "MISP 的 cullEmptyEvents 操作中存在跨站点请求伪造 (CSRF) 漏洞。端点在接受 HTTP GET 请求时执行了状态更改且不可逆的操作。\n\n\n由于无正文 GET 请求不受 CakePHP 的 CSRF 验证的约束，因此攻击者只需通过使浏览器加载精心设计的 URL（例如通过嵌入的图像或其他自动请求的资源）即可使具有足够权限的经过身份验证的 MISP 用户调用端点。\n\n\n成功利用该漏洞会触发删除已发布的空事件。删除特别重要，因为该操作使用skipBlocklist，这意味着删除的事件不会留下可能阻止或跟踪其后续同步的块列表条目。这可能会导致在没有显式用户交互的情况下意外且可能不可逆转地删除 MISP 事件记录。\n\n\n该漏洞已通过将 cullEmptyEvents 限制为 HTTP POST 请求来解决，确保 CakePHP 的正常 CSRF 保护应用于该操作。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", " :X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-307", "description": "MISP 基于电子邮件的一次性密码 (OTP) 身份验证流程中存在漏洞，允许攻击者执行不受限制次数的 OTP 验证尝试。\n\n\n在验证提交的 OTP 值时，email_otp() 端点未应用暴力保护。已达到 OTP 验证阶段的攻击者（例如，在成功提供用户的主要身份验证凭据后）可以重复提交候选 OTP 值，同时同一 OTP 仍然有效。这显着增加了猜测 OTP 并绕过额外身份验证因素的可能性，从而可能导致未经授权访问受影响用户的帐户。\n\n\n由于 OTP 与用户而不是与单个挂起的登录会话关联，从而允许多个并发会话尝试猜测同一有效 OTP，这一事实加剧了该问题。\n\n\n该补丁将现有的 MISP 暴力保护机制集成到电子邮件 OTP 流程中。现在，失败的 OTP 尝试会针对用户进行计数，一旦达到配置的阈值，进一步的尝试就会被拒绝，并且当尝试预算耗尽时，活动的 OTP 将失效。列入黑名单的用户也无法请求生成新的 OTP。此外，OTP 比较现在使用 hash_equals() 并验证提交的值是否为字符串。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "过多认证尝试的限制不恰当", "kind_en": "对过多身份验证尝试的不当限制", "last_modified_time": "2026-09-04", "level": "High", "mps_id": "MPS-2756-4xom", "poc": false, "poc_url": [], "published_time": "2026-09-04", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-2756-4xom", "name": "https://www.oscs1024.com/hd/MPS-2756-4xom"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-85237", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-85237"}, {"url": "https://github.com/MISP/MISP/commit/8658062ea", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-85237漏洞", "_translated": true, "_saved_at": "2026-09-03T16:50:45+00:00", "_first_saved_at": "2026-09-03T16:50:45+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-2756-4xom"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-63219", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:N/I:H/A:N", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:N/I:H/A:N", "cwe": "CWE-862", "description": "GeoNetwork 是一个用于管理空间参考资源的目录应用程序。在版本 4.4.12 和 4.2.17 之前，用于通过文件上传创建新格式化程序的 API 端点不受保护，并允许上传外部不受控制的文件。未经身份验证的攻击者可以将任意“.xsl”或“.zip”格式化程序文件上传到服务器。  未经身份验证的攻击者可以将任意文件写入 GeoNetwork 格式化程序目录。就其本身而言，这构成了对服务器存储的未经授权的写访问。该问题已在 GeoNetwork 版本 4.4.12 和 4.2.17 中修复。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-09-04", "level": "High", "mps_id": "MPS-efgq-zd6n", "poc": false, "poc_url": [], "published_time": "2026-09-04", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-efgq-zd6n", "name": "https://www.oscs1024.com/hd/MPS-efgq-zd6n"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-63219", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-63219"}, {"url": "https://docs.geonetwork-opensource.org/4.2/overview/change-log/version-4.2.17", "name": ""}, {"url": "https://docs.geonetwork-opensource.org/4.4/overview/change-log/version-4.4.12", "name": ""}, {"url": "https://github.com/geonetwork/core-geonetwork/pull/9346", "name": ""}, {"url": "https://github.com/geonetwork/core-geonetwork/security/advisories/GHSA-mh22-prqr-vf42", "name": ""}, {"url": "https://thehackernews.com/2026/09/geonetwork-fixes-unauthenticated-rce.html", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-63219漏洞", "_translated": true, "_saved_at": "2026-09-03T19:34:23+00:00", "_first_saved_at": "2026-09-03T19:34:23+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-efgq-zd6n"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-85012", "cvss": {"cvssv31": [{"source": "ff89ba41-3aa1-4d27-914a-91399e9639e5", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8}], "cvssv4": [{"source": "ff89ba41-3aa1-4d27-914a-91399e9639e5", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:A/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.5}]}, "cvss_score": 8.5, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:A/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-78", "description": "在 0.3.156 之前的 Amazon Web Services codecatalyst-blueprints 中，对操作系统命令 (CWE-78) 中使用的特殊元素进行不正确的中和可能会允许有权提 e::afterFind() 尝试使用 JsonTool::decode() 解码存储的定义，而不处理解码失败。因此，包含无效 JSON 的定义可能会在检索期间触发异常。由于事件模板索引可供所有经过身份验证的用户使用，因此单个恶意或格式错误的模板可能会使事件模板列表和依赖于 EventTemplate 查询的其他功能返回 HTTP 500 错误，直到手动修复有问题的数据库行。\n\n表示意外类型的有效 JSON（而不是预期的 JSON 对象）同样可能导致下游消费者收到无效数据。\n\n因此，能够保存事件模板以保留格式错误的模板数据的用户可以利用该漏洞，并导致其他用户持续拒绝针对事件模板功能的服务。\n\n该补丁强制要求事件模板定义在保存之前必须作为结构化对象提供，并且始终应用语义验证。检索时，格式错误的 JSON 和未解码为预期结构的定义将被捕获、记录并替换为空定义，从而防止格式错误的数据库条目破坏所有事件模板查询。\n\n 根据首席开发人员的说法，中毒似乎无法实现。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "输入验证不恰当", "kind_en": "输入验证不当", "last_modified_time": "2026-09-04", "level": "High", "mps_id": "MPS-opy1-d87m", "poc": false, "poc_url": [], "published_time": "2026-09-04", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-opy1-d87m", "name": "https://www.oscs1024.com/hd/MPS-opy1-d87m"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-85239", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-85239"}, {"url": "https://github.com/MISP/MISP/commit/a90d552b3", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-85239漏洞", "_translated": true, "_saved_at": "2026-09-03T16:50:42+00:00", "_first_saved_at": "2026-09-03T16:50:42+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-opy1-d87m"}]}</script>
  <script>
    const payload = JSON.parse(document.getElementById("payload").textContent);
    const levelLabels = payload.level_labels || {};
    const items = payload.items || [];
    let filtered = items.slice();
    let activeId = null;

    const $ = (id) => document.getElementById(id);
    $("generatedAt").textContent = payload.generated_at || "-";
    $("retention").textContent = payload.retention_days ?? "-";
    $("cutoff").textContent = payload.cutoff_date || "-";
    $("count").textContent = String(payload.count ?? items.length);

    function levelClass(level) {
      const cn = levelLabels[level] || level || "";
      if (level === "Critical" || cn === "严重") return "crit";
      if (level === "High" || cn === "高危") return "high";
      return "other";
    }
    function levelText(level) {
      return levelLabels[level] || level || "-";
    }
    function esc(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }
    function scoreText(v) {
      if (v === null || v === undefined || v === "" || v === -1) return "-";
      return String(v);
    }

    function renderList() {
      const list = $("list");
      $("listCount").textContent = String(filtered.length);
      if (!filtered.length) {
        list.innerHTML = '<div class="empty">没有匹配项</div>';
        return;
      }
      list.innerHTML = filtered.map((it) => {
        const id = it.mps_id || it.cve_id;
        const active = id === activeId ? " active" : "";
        return `
          <button class="item${active}" data-id="${esc(id)}" type="button">
            <div class="item-top">
              <span class="cve">${esc(it.cve_id || it.mps_id || "-")}</span>
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
            </div>
            <div class="title">${esc(it.title || "-")}</div>
            <div class="item-foot">
              <span>CVSS ${esc(scoreText(it.cvss_score))}</span>
              <span>${esc(it.published_time || "-")}</span>
              ${it.poc ? "<span>POC</span>" : ""}
            </div>
          </button>`;
      }).join("");
      list.querySelectorAll(".item").forEach((btn) => {
        btn.addEventListener("click", () => selectById(btn.dataset.id));
      });
    }

    function refsHtml(it) {
      const refs = Array.isArray(it.reference_url_list) ? it.reference_url_list : [];
      const links = [];
      if (it._source_page) links.push({ url: it._source_page, name: "OSCS 详情" });
      if (it.cve_id) links.push({ url: `https://nvd.nist.gov/vuln/detail/${it.cve_id}`, name: "NVD" });
      refs.forEach((r) => {
        if (r && r.url) links.push({ url: r.url, name: r.name || r.url });
      });
      const seen = new Set();
      const uniq = [];
      for (const l of links) {
        if (seen.has(l.url)) continue;
        seen.add(l.url);
        uniq.push(l);
      }
      if (!uniq.length) return '<div class="box">无参考链接</div>';
      return `<div class="refs">${uniq.map((l) =>
        `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name || l.url)}</a>`
      ).join("")}</div>`;
    }

    function articlesHtml(it) {
      const arts = Array.isArray(it.articles) ? it.articles : [];
      if (!arts.length) return "";
      return `<div class="section"><h3>相关说明</h3>${arts.map((a) => `
        <div class="article">
          <h4>${esc(a.title || "说明")}</h4>
          <p>${esc(a.content || "")}</p>
        </div>`).join("")}</div>`;
    }

    function renderDetail(it) {
      const detail = $("detail");
      if (!it) {
        detail.innerHTML = '<div class="empty">暂无数据</div>';
        return;
      }
      const pocUrls = Array.isArray(it.poc_url) ? it.poc_url : [];
      detail.innerHTML = `
        <div class="d-head">
          <div>
            <h1 class="d-title">${esc(it.title || "-")}</h1>
            <div class="ids">
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
              <span class="chip">${esc(it.cve_id || "无 CVE")}</span>
              <span class="chip">${esc(it.mps_id || "-")}</span>
              ${it.poc ? '<span class="chip">有 POC</span>' : ""}
              ${it.exp ? '<span class="chip">有 EXP</span>' : ""}
            </div>
          </div>
          <div class="actions">
            ${it._source_page ? `<a class="btn" href="${esc(it._source_page)}" target="_blank" rel="noopener">OSCS</a>` : ""}
            ${it.cve_id ? `<a class="btn" href="https://nvd.nist.gov/vuln/detail/${esc(it.cve_id)}" target="_blank" rel="noopener">NVD</a>` : ""}
          </div>
        </div>
        <div class="grid">
          <div class="stat"><div class="k">CVSS</div><div class="v">${esc(scoreText(it.cvss_score))}</div></div>
          <div class="stat"><div class="k">向量</div><div class="v">${esc(it.cvss_vector || "-")}</div></div>
          <div class="stat"><div class="k">CWE</div><div class="v">${esc(it.cwe || "-")}</div></div>
          <div class="stat"><div class="k">类型</div><div class="v">${esc(it.kind || it.kind_en || "-")}</div></div>
          <div class="stat"><div class="k">公开</div><div class="v">${esc(it.published_time || "-")}</div></div>
          <div class="stat"><div class="k">利用成本</div><div class="v">${esc(it.exploit_requirement_cost || "-")}</div></div>
          <div class="stat"><div class="k">可利用性</div><div class="v">${esc(it.exploitability || "-")}</div></div>
          <div class="stat"><div class="k">修复建议</div><div class="v">${esc(it.fix_suggestion || "-")}</div></div>
        </div>
        <div class="section"><h3>描述</h3><div class="box">${esc(it.description || "无描述")}</div></div>
        ${it.scope_influence ? `<div class="section"><h3>影响范围</h3><div class="box">${esc(it.scope_influence)}</div></div>` : ""}
        ${pocUrls.length ? `<div class="section"><h3>POC 链接</h3><div class="refs">${pocUrls.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join("")}</div></div>` : ""}
        <div class="section"><h3>参考链接</h3>${refsHtml(it)}</div>
        ${articlesHtml(it)}
      `;
    }

    function selectById(id) {
      const it = filtered.find((x) => (x.mps_id || x.cve_id) === id) ||
                 items.find((x) => (x.mps_id || x.cve_id) === id);
      if (!it) return;
      activeId = it.mps_id || it.cve_id;
      renderList();
      renderDetail(it);
      const btn = document.querySelector(`.item[data-id="${CSS.escape(activeId)}"]`);
      if (btn) btn.scrollIntoView({ block: "nearest" });
      history.replaceState(null, "", "#" + encodeURIComponent(activeId));
    }

    function applyFilter(q) {
      const query = (q || "").trim().toLowerCase();
      filtered = !query ? items.slice() : items.filter((it) => {
        const blob = [
          it.cve_id, it.mps_id, it.title, it.kind, it.kind_en, it.cwe, it.description, it.level
        ].map((x) => String(x || "").toLowerCase()).join(" ");
        return blob.includes(query);
      });
      renderList();
      if (filtered.length) {
        const still = filtered.some((x) => (x.mps_id || x.cve_id) === activeId);
        selectById(still ? activeId : (filtered[0].mps_id || filtered[0].cve_id));
      } else {
        activeId = null;
        renderDetail(null);
      }
    }

    $("search").addEventListener("input", (e) => applyFilter(e.target.value));

    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement !== $("search")) {
        e.preventDefault();
        $("search").focus();
        return;
      }
      if (!filtered.length) return;
      const idx = filtered.findIndex((x) => (x.mps_id || x.cve_id) === activeId);
      if (e.key === "ArrowDown") {
        e.preventDefault();
        const next = filtered[Math.min(filtered.length - 1, Math.max(0, idx) + 1)];
        selectById(next.mps_id || next.cve_id);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        const prev = filtered[Math.max(0, idx - 1)];
        selectById(prev.mps_id || prev.cve_id);
      }
    });

    const hashId = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    if (hashId && items.some((x) => (x.mps_id || x.cve_id) === hashId)) {
      activeId = hashId;
      renderList();
      selectById(hashId);
    } else if (items.length) {
      selectById(items[0].mps_id || items[0].cve_id);
    } else {
      renderList();
      renderDetail(null);
    }
  </script>
</body>
</html>
