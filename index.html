C 语言实现，通过 mod_php、php-fpm 等 SAPI 嵌入 Web 服务器，为 WordPress、Laravel 等主流应用提供执行环境。\n受影响版本中，默认启用的会话上传进度（Session Upload Progress，ext/session）功能存在 use-after-free 缺陷，攻击者发送携带进度跟踪字段（默认名 PHP_SESSION_UPLOAD_PROGRESS）的 multipart 请求可触达该功能，利用链逐步泄露堆地址与内部函数符号以绕过地址随机化，最终以 Web 服务运行用户（如 www-data）身份执行任意命令，WordPress、Laravel 等标准部署无需认证即可远程利用。\n修复版本中通过升级至 PHP 官方安全版本消除风险：官方修复定于 2026-10-21 14:00 UTC 随安全版本发布，受支持的 8.2/8.3/8.4/8.5 分支将获得补丁，8.1 及更早分支无官方补丁；修复发布前可在 php.ini 中设置 session.upload_progress.enabled=0 关闭会话上传进度功能缓解该触发路径，并对暂无法修补的互联网侧服务进行网络隔离。", "effects": [{"comp_name": "php", "ecosystem": "linux", "versions": [{"affected_version": "[5.4.0,+∞)", "min_fixed_version": "", "repository": "unmanaged", "solutions": [{"description": "官方修复定于 2026-10-21 14:00 UTC 随安全版本发布，受支持的 8.2/8.3/8.4/8.5 分支将获得补丁，8.1 及更早分支无官方补丁；修复发布前可在 php.ini 中设置 session.upload_progress.enabled=0 关闭会话上传进度功能缓解该触发路径，并对暂无法修补的互联网侧服务进行网络隔离。", "type": "缓解措施"}], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "极高", "fix_suggestion": "建议修复", "kind": "UAF", "kind_en": "免费后使用", "last_modified_time": "2026-10-21", "level": "Critical", "mps_id": "MPS-04qc-xjg6", "poc": true, "poc_url": [], "published_time": "2026-10-21", "reference_url_list": [{"url": "https://www.php.net/archive/2026.php#2026-10-20-1", "name": ""}, {"url": "https://cert.europa.eu/publications/security-advisories/2026-018/", "name": ""}, {"url": "https://sansec.io/research/php2shell", "name": ""}, {"url": "https://www.huntress.com/blog/php2shell-leaked-critical-php-vulnerabilities", "name": ""}, {"url": "https://blog.flatt.tech/entry/php2shell", "name": ""}, {"url": "https://cyberplace.social/@GossiTheDog/117474220875882526", "name": ""}, {"url": "https://github.com/php/php-src", "name": ""}, {"url": "https://github.com/ocf/puppet/pull/1502", "name": ""}], "scope_influence": "", "tags": ["poc", "专家校准", "应用软件"], "title": "PHP未授权远程代码执行漏洞", "_translated": true, "_saved_at": "2026-10-21T05:38:53+00:00", "_first_saved_at": "2026-10-21T05:38:53+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-04qc-xjg6"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2026-48830", "cvss": {}, "cvss_score": 9.1, "cvss_vector": "", "cwe": "CWE-287", "description": "Apache bRPC 是 Apache 软件基金会维护的开源 C++ RPC 框架，用于构建高并发服务间通信，并默认提供 HTTP 协议及 /status 等内置管理接口。\n受影响版本中，HTTP 协议在每个连接上最多执行一次认证。VerifyHttpRequest 在 URI 命中内置服务时直接返回 true，跳过 Authenticator::VerifyCredential。InputMessenger 随即将该 Socket 标记为认证成功，同一 HTTP/1.1 keep-alive 连接上后续受保护的非内置 HTTP 请求不再校验 Authorization，远程未认证攻击者可先访问公网监听端口上的内置接口再调用业务接口以绕过 ServerOptions.auth。\n修复版本中通过将内置服务免认证限定为仅 internal_port：公网监听端口上的内置 HTTP 请求同样读取 Authorization 并调用 VerifyCredential，认证失败时连接不会被标记为已认证，后续业务请求也无法复用该路径。", "effects": [{"comp_name": "brpc", "ecosystem": "linux", "versions": [{"affected_version": "[0,1.18.0)", "min_fixed_version": "1.18.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "身份验证不当", "kind_en": "认证不当", "last_modified_  "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "关键功能的认证机制缺失", "kind_en": "缺少关键功能的身份验证", "last_modified_time": "2026-10-22", "level": "Critical", "mps_id": "MPS-0a8c-9295", "poc": false, "poc_url": [], "published_time": "2026-10-22", "reference_url_list": [{"url": "http://www.mail-archive.com/announce@apache.org/msg12410.html", "name": ""}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-105944", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-105944", "name": ""}, {"url": "https://pulsar.apache.org/security/CVE-2026-105944/", "name": ""}, {"url": "https://pulsar.apache.org/docs/administration-ui", "name": ""}, {"url": "https://lists.apache.org/thread.html/hol3z7fzhjntwvrv8xqqwx4l4d2jx796", "name": ""}, {"url": "https://github.com/apache/pulsar-manager", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Pulsar Manager认证缺失", "_translated": true, "_saved_at": "2026-10-22T01:20:19+00:00", "_first_saved_at": "2026-10-21T22:58:17+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-0a8c-9295"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，从而导致未授权的用户或资源可以被访问或篡改。", "title": "什么是访问控制不当"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n", "title": "访问控制不当常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防访问控制不当"}], "cnvd_id": "", "cve_id": "CVE-2026-76299", "cvss": {}, "cvss_score": 9.9, "cvss_vector": "", "cwe": "CWE-284", "description": "Splunk Enterprise 是 Splunk（Cisco）提供的闭源商业平台，用于采集、检索和可视化机器数据，支撑日志分析与安全监控。\n受影响版本中，Cisco 内部安全审查确认存在访问控制不当缺陷，并按 CWE-284 归入 CVE-2026-76299。该组问题属于产品内访问限制不正确或不完整，可使未获授权主体接触本应受保护的资源；厂商 losure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:N", "severity": "high", "base_score": 7.4}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:H/AT:N/PR:N/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.1}]}, "cvss_score": 9.1, "cvss_vector": "CVSS:4.0/AV:N/AC:H/AT:N/PR:N/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-613", "description": "MikroTik RouterOS through 7.24.5 contains a session token replay vulnerability in the WebFig interface that allows attackers to bypass authentication by replaying captured session tokens across new ECDH sessions. The makeSessionKey function in libucrypto.so generates tokens using fixed salts without incorporating channel-specific or session-specific input, and the user service validates tokens against the login store without verifying channel context, enabling stolen tokens to grant persistent administrative access until the token store is explicitly cleared. This vulnerability extends the impact of CVE-2025-61481, which identified the underlying transport-layer exposure without a corresponding fix.", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "不充分的会话过期机制", "kind_en": "会话过期时间不足", "last_modified_time": "2026-10-22", "level": "Critical", "mps_id": "MPS-uml6-cq7j", "poc": false, "poc_url": [], "published_time": "2026-10-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-uml6-cq7j", "name": "https://www.oscs1024.com/hd/MPS-uml6-cq7j"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-89035", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-89035"}, {"url": "https://www.vulncheck.com/advisories/mikrotik-routeros-webfig-session-token-replay-authentication-bypass", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-89035 漏洞", "_translated": true, "_saved_at": "2026-10-23T19:43:03+00:00", "_first_saved_at": "2026-10-21T19:52:46+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-uml6-cq7j"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-83938", "cvss": {"cvssv31": [{"source": "secure@microsoft.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 10}]}, "cvss_score": 10, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H", "cwe": "CWE-306", "description": "Azure Kubernetes 配置服务中缺少对关键功能的身份验证，导致未经授权的攻击者可以通过网络提升权限。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "关键功能的认证机制缺失", "kind_en": "缺少关键功能的身份验证", "last_modified_time": "2026-10-23", "level": "Critical", "mps_id": "MPS-st6g-eqpw", "poc": false, "poc_url": [], "published_time": "2026-10-23", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-st6g-eqpw", "name": "https://www.oscs1024.com/hd/MPS-st6g-eqpw"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-83938", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-83938"}, {"url": "https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-83938", "name": "Azure Kubernetes Configuration Service Elevation of Privilege Vulnerability"}], "scope_influence": "", "tags": ["应用软件"], "title": "Azure Kubernetes 配置服务权限提升漏洞", "_translated": true, "_saved_at": "2026-10-23T00:20:39+00:00", "_first_saved_at": "2026-10-23T00:20:39+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-st6g-eqpw"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2026-97785", "cvss": {"cvssv31": [{"source": "secure@microsoft.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:N", "severity": "critical", "base_score": 10}]}, "cvss_score": 10, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:N", "cwe": "CWE-287", "description": "AAD 应用程序代理中的不正确身份验证允许未经授权的攻击者通过网络提升权限。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "身份验证不当", "kind_en": "认证不当", "last_modified_time": "2026-10-23", "level": "Critical", "mps_id": "MPS-u0z8-2l4n", "poc": false, "poc_url": [], "published_time": "2026-10-23", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-u0z8-2l4n", "name": "https://www.oscs1024.com/hd/MPS-u0z8-2l4n"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-97785", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-97785"}, {"url": "https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-97785", "name": "AAD App Proxy Elevation of Privilege Vulnerability"}], "scope_influence": "", "tags": ["应用软件"], "title": "AAD 应用代理权限提升漏洞", "_translated": true, "_saved_at": "2026-10-23T00:20:32+00:00", "_first_saved_at": "2026-10-23T00:20:32+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-u0z8-2l4n"}, {"analysis_status": 0, n/detail/CVE-2026-115812"}, {"url": "https://aws.amazon.com/security/security-bulletins/2026-148-aws/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-115812漏洞", "_translated": true, "_saved_at": "2026-10-23T19:42:56+00:00", "_first_saved_at": "2026-10-23T19:42:56+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-2isg-5hmr"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-28328", "cvss": {"cvssv31": [{"source": "psirt@solarwinds.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-863", "description": "SolarWinds Observability Self-Hosted 被发现受到损坏的授权架构的影响，该架构可能允许低权限用户访问和修改超出其分配权限的信息。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-10-21", "level": "High", "mps_id": "MPS-cbts-p0ik", "poc": false, "poc_url": [], "published_time": "2026-10-21", "reference_url_list": [{"url": "https://w ps://nvd.nist.gov/vuln/detail/CVE-2026-91668"}, {"url": "https://www.oracle.com/security-alerts/cpuoct2026.html", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-91668漏洞", "_translated": true, "_saved_at": "2026-10-21T05:38:58+00:00", "_first_saved_at": "2026-10-21T00:19:35+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-plzu-t8rh"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能有效地控制资源的使用，导致攻击者可以利用这个漏洞耗尽应用程序所依赖的资源。这些资源可以是计算资源（CPU、内存）、网络带宽、数据库连接或其他系统资源。攻击者可以通过发送特制的请求、恶意输入或其他方式，使应用程序消耗大量资源，导致拒绝服务或系统崩溃。", "title": "什么是拒绝服务"}, {"content": "- 消耗计算资源：攻击者可以发送计算密集型的请求，例如复杂的计算、无限循环或递归操作，以耗尽应用程序的计算资源，导致应用程序无法响应其他请求。\r\n- 消耗内存资源：攻击者可以发送大量的数据或恶意输入，以导致应用程序消耗过多的内存资源，从而使系统的可用内存耗尽，并导致应用程序崩溃或变得不可用。\r\n- 消耗网络带宽：攻击者可以发送大量的请求或大型数据包，以消耗应用程序所依赖的网络带宽。这会导致其他合法用户无法正常访问应用程序或降低系统的整体网络性能。\r\n- 消耗存储资源：攻击者可以发送大量的请求或上传大文件，以耗尽应用程序的存储资源，导致系统无法处理其他请求或存储新的数据。", "title": "拒绝服务常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对输入数据进行合理的验证和过滤，防止恶意输入导致资源消耗过高。\r\n- 实施资源限制：应用程序应该实施适当的资源限制策略，例如限制计算操作的时间或次数，限制内存使用量，限制并发连接数等，以防止资源被耗尽。\r\n- 异常处理与错误恢复：应用程序应该具备健壮的异常处理和错误恢复机制，以防止因意外错误导致资源泄漏或无法释放的情况。\r\n- 资源监控与警报：应用程序应该实施适当的资源监控和警报机制，及时发现异常的资源消耗情况，并采取相应的措施来应对。\r\n- 压力测试与性能优化：应用程序应该进行压力测试，以评估其在高负载情况下的性能，并进行必要的性能优化，以确保能够有效地处理大量请求而不耗尽资源。", "title": "如何预防拒绝服务"}], "cnvd_id": "", "cve_id": "CVE-2026-93441", "cvss": {"cvssv31": [{"source": "psirt@us.ibm.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:N/I:N/A:H", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:N/I:N/A:H", "cwe": "CWE-400", "description": "IBM QRadar SIEM 可能允许远程攻击者因不受控制的资源消耗而导致拒绝服务。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "拒绝服务", "kind_en": "不受控制的资源消耗", "last_modified_time": "2026-10-21", "level": "High", "mps_id": "MPS-3r9n-jz2f", "poc": false, "poc_url": [], "published_time": "2026-10-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-3r9n-jz2f", "name": "https://www.oscs1024.com/hd/MPS-3r9n-jz2f"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-93441", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-93441"}, {"url": "https://www.ibm.com/support/pages/node/7292244", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-93441 漏洞", "_translated": true, "_saved_at": "2026-10-21T05:39:00+00:00", "_first_saved_at": "2026-10-21T00:19:37+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-3r9n-jz2f"}, {"analysis_status": 0, "articles": [], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-113867", "cvss": {}, "cvss_score": 8.2, "cvss_vector": "", "cwe": "CWE-91", "description": "Mozilla Thunderbird 是开源桌面邮件客户端，内置 XMPP（Jabber）聊天协议，用于与远程联系人收发即时消息并管理订阅关系。\n受影响版本中，XMPP 出站 stanza 序列化未转义 XML 属性值。XMLNode._getAttributeText 把 id、from 等属性直接拼进双引号字符串；XMPPAccountPrototype.onIQStanza 在自动应答 ping、软件版本查询与服务发现请求时，会把入站 IQ 的 id 与 from 原样写入 Stanza.iq 再经 getXML 发送。远程 XMPP 用户可在这些属性中嵌入引号与额外标签，使服务器把注入的 message 或联系人/订阅 stanza 当作受害者发出的操作执行，从而代发消息或更改联系人与订阅设置，且无需用户交互。\n修复版本中通过新增 escapeAttribute，在 _getAttributeText 与 _getXmlns 序列化时转义 \u0026, \u003c, \u003e, \"，切断属性注入拆分额外 stanza 的路径。", "effects": [{"comp_name": "thunderbird", "ecosystem": "linux", "versions": [{"affected_version": "[154.0,158.0.1)", "min_fixed_version": "158.0.1", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,153.5.1)", "min_fixed_version": "153.5.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XPath盲注", "kind_en": "XML 注入（又名 XPath 盲注入）", "last_modified_time": "2026-10-21", "level": "High", "mps_id": "MPS-7ko4-982n", "poc": false, "poc_url": [], "published_time": "2026-10-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-7ko4-982n", "name": "https://www.oscs1024.com/hd/MPS-7ko4-982n"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-113867", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-113867"}, {"url": "https://bugzilla.mozilla.org/show_bug.cgi?id=2080073", "name": ""}, {"url": "https://www.mozilla.org/security/advisories/mfsa2026-114/", "name": ""}, {"url": "https://www.mozilla.org/security/advisories/mfsa2026-115/", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "Thunderbird XMPP注入漏洞", "_translated": true, "_saved_at": "2026-10-20T21:08:04+00:00", "_first_saved_at": "2026-10-20T21:08:04+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-7ko4-982n"}, {"analysis_status": 0, "articles": [{"content": "跨界内存读是指应用程序在读取内存时，未正确验证或限制读取的内存范围。攻击者利用这种漏洞可以读取应用程序内存中的敏感数据，如密码、加密密钥、会话令牌等。常见的原因是由于缓冲区溢出、格式化字符串漏洞或其他内存错误导致的。", "title": "什么是越界读取"}, {"content": "攻击者可以通过不当构造的输入来触发跨界内存读漏洞。攻击者可能会通过向应用程序发送特定的输入，使其读取超过预期的内存区域。攻击者可以利用这个漏洞来获取敏感信息，如其他用户的数据、操作系统的敏感数据或应用程序的内部状态。", "title": "越界读取常见的攻击方式"}, {"content": "- 输入验证和限制：应用程序应对所有输入数据进行严格的验证和限制。确保输入数据的长度、格式和内容符合预期，避免超出缓冲区或访问非预期的内存区域。\n- 内存安全编程实践：开发人员应使用安全的编程实践，如避免使用不安全的函数、正确处理内存分配和释放操作，以及遵循最小特权原则。\n- 使用安全的编程语言和库：选择使用安全性较高的编程语言和库，这些语言和库在内存管理和安全性方面提供了更多的保护机制。\n- 定期进行代码审查和安全测试：定期审查应用程序的代码，并进行安全测试，以发现潜在的跨界内存读漏洞。使用静态代码分析工具和漏洞扫描工具来辅助检测和修复问题。\n- 实施防御性编程技术：应用程序应采用防御性编程技术，如使用随机化地址空间布局（ASLR）、堆栈保护机制（如堆栈溢出保护）和数据执行预防（DEP）等。\n- 及时更新和修补：及时应用程序和操作系统的安全更新和补丁，以确保已知的跨界内存读漏洞得到修复。及时更新相关软件和库，以避免使用已知存在漏洞的版本。", "title": "如何预防越界读取"}], "cnvd_id": "", "cve_id": "CVE-2026-93442", "cvss": {"cvssv31": [{"source": "psirt@us.ibm.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:H", "severity": "high", "base_score": 8.2}]}, "cvss_score": 8.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:H", "cwe": "CWE-125", "description": "IBM QRadar SIEM 7.6.0.0 到 7.6.0.4 以及 7.5.0 到 7.5.0 Update Package 16 Interim Fix 001 可能允许远程攻击者因越界读取而造成拒绝服务或获取敏感信息。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界读取", "kind_en": "越界读取", "last_modified_time": "2026-10-21", "level": "High", "mps_id": "MPS-7rjw-bnaq", "poc": false, "poc_url": [], "published_time": "2026-10-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-7rjw-bnaq", "name": "https://www.oscs1024.com/hd/MPS-7rjw-bnaq"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-93442", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-93442"}, {"url": "https://www.ibm.com/support/pages/node/7292240", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-93442 漏洞", "_translated": true, "_saved_at": "2026-10-21T05:38:59+00:00", "_first_saved_at": "2026-10-21T00:19:32+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-7rjw-bnaq"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-110523", "cvss": {}, "cvss_score": 8.1, "cvss_vector": "", "cwe": "CWE-269", "description": "WP User Manager 是开源 WordPress 插件，用于前台注册、登录、用户资料和会员目录，并支持 Stripe 付费注册。\n受影响版本中，Stripe 集成仅在当前模式的公钥、密钥和 webhook secret 全部配置后才挂载未付费能力限制。支付网关断开后，已发布的付费注册表单仍由 WPUM_Form_Registration::submit_handler 按表单配置角色创建账户，未认证访问者无需完成支付即可获得管理员等价权限。\n修复版本中通过在无密钥时仍调用 Account::enforce_payment() 保持未付费限制，并由 Stripe::reject_paid_registration() 拒绝带 Stripe 产品的注册提交，切断免费获得付费角色的路径。", "effects": [{"comp_name": "wp-user-manager", "ecosystem": "linux", "versions": [{"affected_version": "[2.9.21,2.9.26)", "min_fixed_version": "2.9.26", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-10-21", "level": "High", "mps_id": "MPS-iy9a-fl7k", "poc": false, "poc_url": [], "published_time": "2026-10-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-iy9a-fl7k", "name": "https://www.oscs1024.com/hd/MPS-iy9a-fl7k"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-110523", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-110523"}, {"url": "https://wpscan.com/vulnerability/0f26a111-043f-4f03-899a-256673672fd3/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "WPUM付费注册权限提升", "_translated": true, "_saved_at": "2026-10-21T11:00:11+00:00", "_first_saved_at": "2026-10-21T11:00:11+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-iy9a-fl7k"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "", "cvss": {"cvssv31": [{"source": "murphysec", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:R/S:C/C:H/I:H/A:N", "severity": "high", "base_score": 8}]}, "cvss_score": 8, "cvss_vector": "", "cwe": "CWE-330", "description": "eMudhra 是一家证书颁发机构。Firefox、Chrome、苹果和微软的系统默认信任它签发的证书。Bug 2083449 记录它有 8 张中间证书的私钥已经泄露。中间证书位于根证书和最终证书之间，其中 6 张用来给网站签发证书，2 张用来给软件签发代码签名证书。\n受影响版本中，影响对象是 2025 年 4 月 30 日生成的 B、C 两批椭圆曲线 P-384 中间证书。这些证书在生成私钥时随机数不足，私钥可以从证书还原。拿到网站证书私钥的人可以给任意网站签发证书，拿到代码签名私钥的人可以签发软件的代码签名证书。客户端没有核对证书透明日志，也没有安装吊销名单或信任库更新时，会接受这些证书。\n修复版本中通过以证书机构私钥泄露为由吊销这 8 张中间证书，由浏览器下发 OneCRL、CRLSet 和 CRLite 拦截名单，并在 NSS 3.131.1 中移除根证书 emSign ECC Root CA - G3，停止对泄露私钥的信任。各信任库已经发布的版本见下方影响范围。", "effects": [{"comp_name": "Mozilla::CA", "ecosystem": "linux", "versions": [ :00", "_first_saved_at": "2026-10-21T00:19:40+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-a3xi-0jdp"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-113722", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "cwe": "CWE-78", "description": "virtualenv 是 PyPA 维护的开源 Python 工具，用于创建隔离虚拟环境，可通过 pip 安装，并提供 virtualenv 命令与 Python API。\n受影响版本中，app-data seeder 的 ScriptMakerCustom.__init__ 通过 distlib.scripts.enquote_executable 把解释器路径交给 distlib ScriptMaker。当路径含空格或 shebang 超过 127 字节时，distlib 会写出 #!/bin/sh 包装脚本，并把路径放在双引号内；POSIX sh 在双引号内仍会展开 $(...) 与反引号。攻击者若能影响环境目标路径，用户随后运行生成的 bin/pip 等启动器，会以该用户权限执行命令；创建和激活环境本身不会触发。pip seeder 还会经 pip 内置 distlib 写出同类启动器。\n修复版本中通过 ScriptMakerCustom._build_shebang 与 shell_shebang 使用 shlex.quote 将路径放入单引号，并对反斜杠做 sh 与 Python 均可安全读取的转义，切断双引号内命令替换；pip seeder 在安装后由 _rewrite_launchers 按同一规则重写 POSIX 启动器并更新 RECORD。仅升级软件不会修复已有启动器，需要重建环境；后续独立 pip 安装或升级仍可能再次写入受影响启动器。", "effects": [{"comp_name": "virtualenv", "ecosy ability": "中", "fix_suggestion": "建议修复", "kind": "对输出编码和转义不恰当", "kind_en": "输出编码或转义不当", "last_modified_time": "2026-10-21", "level": "High", "mps_id": "MPS-vlq3-5khp", "poc": false, "poc_url": [], "published_time": "2026-10-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-vlq3-5khp", "name": "https://www.oscs1024.com/hd/MPS-vlq3-5khp"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-113725", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-113725"}, {"url": "https://github.com/pypa/virtualenv/commit/c3104e02474b652832a9bbaae79f6e1696296932", "name": ""}, {"url": "https://github.com/pypa/virtualenv/releases/tag/21.14.7", "name": ""}, {"url": "https://github.com/pypa/virtualenv/security/advisories/GHSA-vxj4-q4g9-crj7", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-113725 漏洞", "_translated": true, "_saved_at": "2026-10-20T21:08:06+00:00", "_first_saved_at": "2026-10-20T21:08:06+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-vlq3-5khp"}, {"analysis_status": 0, "articles": [], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-74757", "cvss": {}, "cvss_score": 7.5, "cvss_vector": "", "cwe": "CWE-770", "description": "Apache bRPC 是开源 C++ RPC 框架，提供多协议服务端与客户端能力，其中 mcpack2pb 可将 protobuf 作为 mcpack 前端。\n受影响版本中，mcpack2pb 的 ArrayIterator::init 直接采信数组头中的 item_count，未对照剩余载荷长度；由 mcpack2pb 插件生成的 parse_body 会对该计数值调用 repeated 字段的 Reserve()。攻击者向接入 UbrpcMcpack2Adaptor 的 NsheadService 发送 item_count 为 0x7fffffff 的畸形 mcpack 请求，能够在认证前迫使服务端预分配约 16GB 虚拟内存，并在内存受限主机上触发 SIGABRT。\n修复版本中通过在 ArrayIterator::init 将 item_count 钳制为数组剩余字节数，切断超大 Reserve() 预分配路径。", "effects": [{"comp_name": "brpc", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.18.0)", "min_fixed_version": "1.18.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "不加限制或调节的资源分配", "kind_en": "不受限制或节流地分配资源", "last_modified_time": "2026-10-21", "level": "High", "mps_id": "MPS-0gnl-xfau", "poc": false, "poc_url": [], "published_time": "2026-10-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-0gnl-xfau", "name": "https://www.oscs1024.com/hd/MPS-0gnl-xfau"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-74757", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-74757"}, {"url": "https://lists.apache.org/thread/2pf15ojj0vr7rtx95677kgtl1mx3gdgb", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "bRPC不受控内存分配漏洞", "_translated": true, "_saved_at": "2026-10-21T15:54:55+00:00", "_first_saved_at": "2026-10-21T15:54:55+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-0gnl-xfau"}, {"analysis_status": 0, "articles": [], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-78066", "cvss": {}, "cvss_score": 7.5, "cvss_vector": "", "cwe": "CWE-770", "description": "Apache bRPC 是 Apache 软件基金会的开源 C++ RPC 框架，用于提供多协议高性能远程过程调用能力。\n受影响版本中，gzip/zlib/snappy 解压只按压缩后字节检查 FLAGS_max_body_size，未限制解压输出，符合上限的压缩包可膨胀到数十 GiB；AMF 的 ReadAMFString 按报文声明长度一次性 resize；RTMP 的 RtmpChunkStream::Feed 允许中途重报 message_length 且未与 max_body_size 比较；sofa-pbrpc 的 ParseSofaMessage 未限制 meta_size；mcpack2pb 的 ObjectIterator::init 直接采用报文 item_count，value_size 为 0 时还会下溢并中止进程。不可信客户端可借上述路径造成内存耗尽或进程崩溃。\n修复版本中通过新增 FLAGS_max_decompressed_body_size（默认 32 倍 max_body_size）在 GzipDecompress 与 SnappyDecompress 中截断超限输出，将 AMF 字符串改为分块读取，拒绝超过 max_body_size 的 RTMP 消息长度并丢弃中途重报半包，限制 sofa-pbrpc 的 meta_size，并校验 mcpack2pb 声明计数，使超限请求被拒绝。", "effects": [{"comp_name": "brpc", "ecosystem": "linux", "versions": [{"affected_version": "[0,1.18.0)", "min_fixed_version": "1.18.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "不加限制或调节的资源分配", "kind_en": "不受限制或节流地分配资源", "last_modified_time": "2026-10-21", "level": "High", "mps_id": "MPS-21jo-ntul", "poc": false, "poc_url": [], "published_time": "2026-10-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-21jo-ntul", "name": "https://www.oscs1024.com/hd/MPS-21jo-ntul"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-78066", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-78066"}, {"url": "https://lists.apache.org/thread/2pf15ojj0vr7rtx95677kgtl1mx3gdgb", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "bRPC资源耗尽漏洞", "_translated": true, "_saved_at": "2026-10-21T15:54:51+00:00", "_first_saved_at": "2026-10-21T15:54:51+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-21jo-ntul"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-74758", "cvss": {}, "cvss_score": 7.5, "cvss_vector": "", "cwe": "CWE-416", "description": "Apache bRPC 是开源 C++ 工业级 RPC 框架，用于高并发服务间通信，并内置 RTMP 协议组件。\n受影响版本中，启用 RTMP 服务后，远程攻击者可发送将 Abort 控制消息指向当前正在解析的 chunk stream 的报文。RtmpChunkStream::OnAbortMessage 会调用 RtmpContext::ClearChunkStream 删除仍处于 Feed() 执行中的当前对象，消息处理返回后 Feed() 继续访问已释放对象成员，导致堆释放后使用并可使 RTMP 服务器崩溃。\n修复版本中通过在 OnAbortMessage 中比较 Abort 目标 cs_id 与当前解析中的 _cs_id，仅在二者不同时调用 ClearChunkStream，避免释放仍在 Feed() 中的对象，切断堆释放后使用路径。", "effects": [{"comp_name": "brpc", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.18.0)", "min_fixed_version": "1.18.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "UAF", "kind_en": "免费后使用", "last_modified_time": "2026-10-21", "level": "High", "mps_id": "MPS-8hai-vcby", "poc": false, "poc_url": [], "published_time": "2026-10-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-8hai-vcby", "name": "https://www.oscs1024.com/hd/MPS-8hai-vcby"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-74758", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-74758"}, {"url": "https://lists.apache.org/thread/2pf15ojj0vr7rtx95677kgtl1mx3gdgb", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "bRPC RTMP释放后使用漏洞", "_translated": true, "_saved_at": "2026-10-21T15:54:57+00:00", "_first_saved_at": "2026-10-21T15:54:57+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-8hai-vcby"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能有效地控制资源的使用，导致攻击者可以利用这个漏洞耗尽应用程序所依赖的资源。这些资源可以是计算资源（CPU、内存）、网络带宽、数据库连接或其他系统资源。攻击者可以通过发送特制的请求、恶意输入或其他方式，使应用程序消耗大量资源，导致拒绝服务或系统崩溃。", "title": "什么是拒绝服务"}, {"content": "- 消耗计算资源：攻击者可以发送计算密集型的请求，例如复杂的计算、无限循环或递归操作，以耗尽应用程序的计算资源，导致应用程序无法响应其他请求。\r\n- 消耗内存资源：攻击者可以发送大量的数据或恶意输入，以导致应用程序消耗过多的内存资源，从而使系统的可用内存耗尽，并导致应用程序崩溃或变得不可用。\r\n- 消耗网络带宽：攻击者可以发送大量的请求或大型数据包，以消耗应用程序所依赖的网络带宽。这会导致其他合法用户无法正常访问应用程序或降低系统的整体网络性能。\r\n- 消耗存储资源：攻击者可以发送大量的请求或上传大文件，以耗尽应用程序的存储资源，导致系统无法处理其他请求或存储新的数据。", "title": "拒绝服务常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对输入数据进行合理的验证和过滤，防止恶意输入导致资源消耗过高。\r\n- 实施资源限制：应用程序应该实施适当的资源限制策略，例如限制计算操作的时间或次数，限制内存使用量，限制并发连接数等，以防止资源被耗尽。\r\n- 异常处理与错误恢复：应用程序应该具备健壮的异常处理和错误恢复机制，以防止因意外错误导致资源泄漏或无法释放的情况。\r\n- 资源监控与警报：应用程序应该实施适当的资源监控和警报机制，及时发现异常的资源消耗情况，并采取相应的措施来应对。\r\n- 压力测试与性能优化：应用程序应该进行压力测试，以评估其在高负载情况下的性能，并进行必要的性能优化，以确保能够有效地处理大量请求而不耗尽资源。", "title": "如何预防拒绝服务"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-81755", "cvss": {}, "cvss_score": 7.5, "cvss_vector": "", "cwe": "CWE-400", "description": "Apache bRPC 是 Apache 软件基金会的开源 C++ RPC 框架，用于提供高性能远程过程调用和流式 RPC。\n受影响版本中，流式 RPC 允许客户端在一次请求的 RPC meta 字段 stream_settings.extra_stream_ids 中声明额外流标识。服务端公开接口 StreamAccept 会按声明数量为每个标识调用 Stream::Create 创建响应流，且不限制单次请求可接受的流数量；请求体仅受 max_body_size（默认 64MB）约束，足以携带大量流标识。每个被接受的流都会分配独立的 bthread 执行队列及相关资源，远程攻击者发送单次请求即可耗尽服务器内存并造成拒绝服务。\n修复版本中通过新增 gflag stream_max_streams_per_request（默认 64），在 StreamAccept 创建任何响应流之前校验声明的流数量，超出上限的请求直接拒绝，从而切断无界创建流导致的内存耗尽路径。", "effects": [{"comp_name": "brpc", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.18.0)", "min_fixed_version": "1.18.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "拒绝服务", "kind_en": "不受控制的资源消耗", "last_modified_time": "2026-10-21", "level": "High", "mps_id": "MPS-8jam-lge9", "poc": false, "poc_url": [], "published_time": "2026-10-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-8jam-lge9", "name": "https://www.oscs1024.com/hd/MPS-8jam-lge9"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-81755", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-81755"}, {"url": "https://lists.apache.org/thread/2pf15ojj0vr7rtx95677kgtl1mx3gdgb", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Apache bRPC资源耗尽漏洞", "_translated": true, "_saved_at": "2026-10-21T15:54:48+00:00", "_first_saved_at": "2026-10-21T15:54:48+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-8jam-lge9"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-111574", "cvss": {}, "cvss_score": 7.5, "cvss_vector": "", "cwe": "CWE-79", "description": "Redirection for Contact Form 7 是 Themeisle 维护的开源 WordPress 插件，为 Contact Form 7 提供提交后重定向、保存线索和多种后续动作。\n受影响版本中，当站点开启调试模式后，WPCF7R_Post_Types 的 debug_helper 会在 lead 条目的 Action Meta 元框中直接 print_r 输出 get_post_custom() 结果，未对已存储的表单字段做 HTML 转义。未认证攻击者可向配置了 Save Entry 动作的表单提交含脚本的字段，已登录用户查看该条目时会在管理后台执行恶意脚本。\n修复版本中通过将 debug_helper 的输出改为 esc_html(print_r(get_post_custom(), true))，并同步对调试日志字段做 HTML 转义，阻止存储的表单数据再作为脚本执行。", "effects": [{"comp_name": "wpcf7-redirect", "ecosystem": "linux", "versions": [{"affected_version": "[2.2.7,3.2.12)", "min_fixed_version": "3.2.12", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-10-21", "level": "High", "mps_id": "MPS-8qpk-20ds", "poc": false, "poc_url": [], "published_time": "2026-10-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-8qpk-20ds", "name": "https://www.oscs1024.com/hd/MPS-8qpk-20ds"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-111574", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-111574"}, {"url": "https://wpscan.com/vulnerability/f40440de-3947-48f9-8fa4-200f83e87d8e/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "CF7重定向插件存储型XSS", "_translated": true, "_saved_at": "2026-10-21T11:00:06+00:00", "_first_saved_at": "2026-10-21T11:00:06+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-8qpk-20ds"}, {"analysis_status": 0, "articles": [], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-80463", "cvss": {}, "cvss_score": 7.5, "cvss_vector": "", "cwe": "CWE-770", "description": "Apache bRPC 是 Apache 软件基金会发布的开源工业级 C++ RPC 框架，用于高性能系统中的远程过程调用与流式 RPC。\n受影响版本中，内置流式 RPC 协议对单个数据帧按 max_body_size 设上限，但分片消息会把 continuation 帧累积进 Stream::_pending_buf 且不限制累计长度。远程攻击者在服务通过 brpc::StreamAccept 或 brpc::StreamCreate 打开流后，可持续发送 continuation 数据帧，使接收端内存无界增长直至进程耗尽内存并拒绝服务；默认 socket_max_streams_unconsumed_bytes=0 不会节流发送速率。\n修复版本中通过在 Stream::OnReceived 处理 FRAME_TYPE_DATA 时将分片消息累计载荷限制为 max_body_size（默认 64MB），超过限制即释放 pending fragments 并以 EMSGSIZE 关闭流，切断无界内存累积路径。", "effects": [{"comp_name": "brpc", "ecosystem": "linux", "versions": [{"affected_version": "[0,1.18.0)", "min_fixed_version": "1.18.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "不加限制或调节的资源分配", "kind_en": "不受限制或节流地分配资源", "last_modified_time": "2026-10-21", "level": "High", "mps_id": "MPS-hspg-vnmb", "poc": false, "poc_url": [], "published_time": "2026-10-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-hspg-vnmb", "name": "https://www.oscs1024.com/hd/MPS-hspg-vnmb"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-80463", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-80463"}, {"url": "https://lists.apache.org/thread/2pf15ojj0vr7rtx95677kgtl1mx3gdgb", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "bRPC流重组内存耗尽漏洞", "_translated": true, "_saved_at": "2026-10-21T15:54:49+00:00", "_first_saved_at": "2026-10-21T15:54:49+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-hspg-vnmb"}, {"analysis_status": 0, "articles": [], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-78048", "cvss": {}, "cvss_score": 7.5, "cvss_vector": "", "cwe": "CWE-617", "description": "Apache bRPC 是 Apache 软件基金会维护的开源 C++ RPC 框架，内置 HTTP/2 与 gRPC（h2）协议栈，用于高性能服务间通信。\n受影响版本中，HTTP/2 HPACK 解码器的 IndexTable::Init 按最小 34 字节表项分配动态表环形缓冲区（num_headers = max_size / (32 + 2)），与 RFC 7541 第 4.1 节允许空 value、最小表项 33 字节的规定不一致。AddHeader 仅按字节用量 _max_size 淘汰条目，默认 4096 字节表可写入 121 个 33 字节表项（121*33=3993）而不淘汰，第 121 次写入触发 CHECK(!_header_queue.full()) 并中止进程。未认证远程攻击者向默认启用 HTTP/2 或 gRPC 的 bRPC 服务发送带增量索引且 value 为空的 HPACK 头部序列，可造成拒绝服务。\n修复版本中通过将动态表容量改为按 33 字节最小表项计算（max_size / (32 + 1)），并在 max_size 小于最小表项时至少保留一个环形缓冲槽，使淘汰发生在队列写满之前，消除该可达断言导致的进程中止。", "effects": [{"comp_name": "brpc", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.18.0)", "min_fixed_version": "1.18.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "可达断言", "kind_en": "Reachable Assertion", "last_modified_time": "2026-10-21", "level": "High", "mps_id": "MPS-ni30-lkpc", "poc": false, "poc_url": [], "published_time": "2026-10-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ni30-lkpc", "name": "https://www.oscs1024.com/hd/MPS-ni30-lkpc"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-78048", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-78048"}, {"url": "https://lists.apache.org/thread/2pf15ojj0vr7rtx95677kgtl1mx3gdgb", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "bRPC HPACK断言漏洞", "_translated": true, "_saved_at": "2026-10-21T15:54:50+00:00", "_first_saved_at": "2026-10-21T15:54:50+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ni30-lkpc"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-113658", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-770", "description": "ApostropeCMS 是一个开源 Node.js 内容管理系统。在 4.33.0 之前，未经身份验证的富文本 CSV 转换路由会在检查其扩展名之前将分段上传写入系统临时目录，并且在验证拒绝时不会删除暂存文件。使用正常的公共 CSRF cookie 重复进行大量被拒绝的上传可能会持续消耗临时磁盘容量，并可能会中断 ApostropeCMS 和依赖于同一分区的其他服务。此问题已在版本 4.33.0 中修复。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "不加限制或调节的资源分配", "kind_en": "不受限制或节流地分配资源", "last_modified_time": "2026-10-21", "level": "High", "mps_id": "MPS-x1gw-ae5y", "poc": false, "poc_url": [], "published_time": "2026-10-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-x1gw-ae5y", "name": "https://www.oscs1024.com/hd/MPS-x1gw-ae5y"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-113658", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-113658"}, {"url": "https://github.com/apostrophecms/apostrophe/commit/9500b8b0e1d630d5e07fbb5fd2c25ed0943845ce", "name": ""}, {"url": "https://github.com/apostrophecms/apostrophe/commit/f84fd41cbf6c22eb8d0008fc9c25df1f7130b350", "name": ""}, {"url": "https://github.com/apostrophecms/apostrophe/releases/tag/apostrophe@4.33.0", "name": ""}, {"url": "https://github.com/apostrophecms/apostrophe/security/advisories/GHSA-qhcq-9pm2-c9w9", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-113658漏洞", "_translated": true, "_saved_at": "2026-10-20T17:43:07+00:00", "_first_saved_at": "2026-10-20T17:43:07+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-x1gw-ae5y"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用了空指针，并在不进行有效检查的情况下对其进行取消引用操作。当程序试图取消引用空指针时，由于空指针不指向任何有效的内存地址，会导致程序崩溃或产生未定义的行为。这种错误通常发生在开发者未对指针进行正确的初始化或验证时。", "title": "什么是空指针取消引用"}, {"content": "- 拒绝服务：攻击者可以通过构造恶意输入或请求，触发程序中的空指针取消引用错误，导致程序崩溃或无法正常运行。这可能导致拒绝服务攻击，使系统无法提供正常的服务。\r\n- 内存信息泄露：攻击者可以通过利用空指针取消引用错误，访问程序中的敏感内存信息。这可能包括栈上的变量、函数指针或其他敏感数据，从而暴露系统的机密信息。\r\n- 代码执行：在某些情况下，空指针取消引用错误可能导致执行恶意代码或注入恶意代码的机会。攻击者可以通过精心构造的输入，利用空指针取消引用错误来执行任意的代码，进而获取系统控制权或执行未经授权的操作。", "title": "空指针取消引用常见的攻击方式"}, {"content": "- 指针初始化和验证：开发者应该正确地初始化指针，并在使用指针之前进行有效的验证，确保指针不为空。在取消引用指针之前，应始终检查其是否为空。\r\n- 异常处理和错误恢复：程序应该具备健壮的异常处理和错误恢复机制，以便在发生空指针取消引用错误时能够适当地处理异常，而不是导致程序崩溃或暴露敏感信息。\r\n- 防御性编程：采用防御性编程的原则，如避免在未经验证的指针上进行操作，避免使用未初始化的指针等，以防止空指针取消引用错误的发生。\r\n- 静态代码分析和测试：使用静态代码分析工具和测试技术来检测和识别潜在的空指针取消引用错误。这些工具可以帮助发现代码中可能存在的空指针问题，并及时修复。\r\n- 强制性编码标准和最佳实践：制定强制性的编码标准和最佳实践，包括良好的指针使用和管理规范，以帮助开发者编写更可靠、安全的代码。", "title": "如何预防空指针取消引用"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-78058", "cvss": {}, "cvss_score": 7.5, "cvss_vector": "", "cwe": "CWE-476", "description": "Apache bRPC 是开源 C++ 工业级 RPC 框架，默认在每个服务端口启用 HTTP/2 解析，并同时用于 h2/gRPC 客户端。\n受影响版本中，HTTP/2 接收路径向对端广告了 SETTINGS_MAX_CONCURRENT_STREAMS 与 SETTINGS_MAX_HEADER_LIST_SIZE 等限制但未真正执行：对端可挂起无界并发流、用 1 字节 HPACK 索引把小 HEADERS 帧放大成无界解码头表，并用 PING 洪水配合停读撑爆写缓冲；HPACK 动态表大小更新按协议默认值 4096 校验而非广告的 SETTINGS_HEADER_TABLE_SIZE，可导致解码器失步后空指针崩溃。该解析发生在 Authenticator 之前，远程未认证攻击者可造成进程内存无界增长或崩溃。\n修复版本中通过将默认并发流限制为每连接 1024、解码头表限制为 1MiB，并在 H2Context::TryToInsertStream、H2StreamContext::ConsumeHeaders、HPacker::Decode 与 WriteAck 中强制执行这些上限，超出则返回 RST_STREAM(REFUSED_STREAM) 或关闭连接，切断无界资源消耗路径。", "effects": [{"comp_name": "brpc", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.18.0)", "min_fixed_version": "1.18.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "空指针取消引用", "kind_en": "空指针取消引用", "last_modified_time": "2026-10-21", "level": "High", "mps_id": "MPS-yi8f-e03b", "poc": false, "poc_url": [], "published_time": "2026-10-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-yi8f-e03b", "name": "https://www.oscs1024.com/hd/MPS-yi8f-e03b"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-78058", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-78058"}, {"url": "https://lists.apache.org/thread/2pf15ojj0vr7rtx95677kgtl1mx3gdgb", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "bRPC HTTP/2资源耗尽漏洞", "_translated": true, "_saved_at": "2026-10-21T15:54:54+00:00", "_first_saved_at": "2026-10-21T15:54:54+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-yi8f-e03b"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-113812", "cvss": {}, "cvss_score": 7.4, "cvss_vector": "", "cwe": "CWE-295", "description": "Mozilla::CA 是 Perl 生态中的开源模块，以 PEM 文件形式提供 Mozilla CA 证书包，供基于 OpenSSL 的 TLS 客户端作为信任锚使用。\n受影响版本中，随发行包分发的 lib/Mozilla/CA/cacert.pem 包含根证书 emSign ECC Root CA - G3，该根证书为私钥已公开的 eMudhra 中间证书提供信任路径。攻击者在能够拦截或重定向客户端流量时，可利用这些私钥冒充 TLS 服务器并读取或篡改通信内容。模块对外通过 SSL_ca_file() 返回该证书包绝对路径；LWP、HTTP::Tiny 等客户端通常经 IO::Socket::SSL 先查找 OpenSSL 默认 CA 位置，再回退到 Mozilla::CA。\n修复版本中通过新增 CA denylist，在生成 cacert.pem 时删除 emSign ECC Root CA - G3，切断对已泄露中间证书私钥的信任路径。", "effects": [{"comp_name": "Mozilla-CA", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,20261020)", "min_fixed_version": "20261020", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "证书验证不恰当", "kind_en": "证书验证不当", "last_modified_time": "2026-10-21", "level": "High", "mps_id": "MPS-fd7d-8fdf", "poc": false, "poc_url": [], "published_time": "2026-10-21", "reference_url_list": [{"url": "https://www.openwall.com/lists/oss-security/2026/10/20/36", "name": ""}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-113812", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-113812", "name": ""}, {"url": "https://www.openwall.com/lists/oss-security/2026/10/20/1", "name": ""}, {"url": "https://metacpan.org/release/LWP/Mozilla-CA-20261020/changes", "name": ""}, {"url": "https://github.com/libwww-perl/Mozilla-CA/commit/3c4d166625d82b22fd50b48c272b0bc278fac046", "name": ""}, {"url": "https://github.com/libwww-perl/Mozilla-CA/commit/18fc26558b3b9672f5813afd07b4295cfa0dc00a", "name": ""}, {"url": "https://github.com/libwww-perl/Mozilla-CA/releases/tag/v20261020", "name": ""}, {"url": "https://bugzilla.mozilla.org/show_bug.cgi?id=2083449", "name": ""}, {"url": "https://emudhra.we-have-a-problem.com/", "name": ""}, {"url": "https://blog.mozilla.org/security/2026/10/20/protecting-firefox-users-following-the-compromise-of-emudhra-intermediate-certificates/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Mozilla::CA根证书漏洞", "_translated": true, "_saved_at": "2026-10-21T05:38:57+00:00", "_first_saved_at": "2026-10-21T00:19:29+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-fd7d-8fdf"}, {"analysis_status": 0, "articles": [{"content": "应用程序在处理用户输入时的不完善或缺乏验证机制，所以攻击者能够通过向应用程序发送恶意输入，利用应用程序对输入数据的错误处理方式来注入自己的恶意代码。这些恶意代码会被应用程序误认为是合法的指令或数据，并在执行过程中被执行。", "title": "什么是代码注入"}, {"content": "应用程序使用可执行动态代码的函数来执行用户可控的参数，当应用程序对于用户输入过滤不完全时，攻击者可以注入恶意代码并控制代码执行流程。", "title": "代码注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对所有用户输入进行验证和过滤，确保只接受预期的有效输入。这包括对输入数据进行输入长度验证、类型检查和格式验证等。\r\n- 使用参数化查询或预编译语句：对于数据库查询操作，应该使用参数化查询或预编译语句，确保输入数据不会被误认为是执行代码。\r\n- 最小特权原则：应用程序在执行操作系统命令或动态代码时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。\r\n- 安全编码实践：开发人员应该采用安全编码实践，包括避免使用eval函数、避免拼接用户输入的字符串作为代码执行等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止代码注入攻击。", "title": "如何预防代码注入"}], "cnvd_id": "", "cve_id": "CVE-2026-113718", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:L/AC:H/AT:P/PR:N/UI:A/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:L/AC:H/AT:P/PR:N/UI:A/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-94", "description": "virtualenv 是 PyPA 维护的开源 Python 工具，用于创建隔离虚拟环境并生成各 shell 的激活脚本。\n受影响版本中，POSIX 路径下 XonshActivator.quote() 使用 repr() 将可打印非 ASCII 的 prompt 或目标路径写入 UTF-8 的 activate.xsh，xonsh 可能以 $XONSH_ENCODING 读取该脚本。在 GBK 或 Big5 等遗留多字节编码下，UTF-8 尾字节会吞掉相邻引号前的反斜杠，字符串字面量提前结束，攻击者植入的语句在用户 source 激活脚本时以用户权限执行。\n修复版本中通过将 quote() 改为调用 ascii()，把非 ASCII 写成转义序列，使字面量在遗留编码下仍保持为数据，阻断激活阶段的代码执行。", "effects": [{"comp_name": "virtualenv", "ecosystem": "pip", "versions": [{"affected_version": "(-∞,21.14.9)", "min_fixed_version": "21.14.9", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "代码注入", "kind_en": "代码生成控制不当（“代码注入”）", "last_modified_time": "2026-10-21", "level": "High", "mps_id": "MPS-2hve-lu7s", "poc": false, "poc_url": [], "published_time": "2026-10-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-2hve-lu7s", "name": "https://www.oscs1024.com/hd/MPS-2hve-lu7s"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-113718", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-113718"}, {"url": "https://github.com/pypa/virtualenv/commit/e5fc2e6e189a877ff559af288919e3525d13e5e0", "name": ""}, {"url": "https://github.com/pypa/virtualenv/pull/3432", "name": ""}, {"url": "https://github.com/pypa/virtualenv/releases/tag/21.14.9", "name": ""}, {"url": "https://github.com/pypa/virtualenv/security/advisories/GHSA-394h-qwmc-48pf", "name": ""}], "scope_influence": "", "tags": [], "title": "virtualenv代码注入漏洞", "_translated": true, "_saved_at": "2026-10-20T21:08:08+00:00", "_first_saved_at": "2026-10-20T21:08:08+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-2hve-lu7s"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-111948", "cvss": {}, "cvss_score": 7.1, "cvss_vector": "", "cwe": "CWE-79", "description": "User Profile Builder（WordPress 插件目录标识 profile-builder）是 Cozmoslabs 发布的开源 WordPress 用户资料与注册插件，用于构建前台注册、登录和资料表单，并提供邮箱确认、角色编辑与内容限制等能力。\n受影响版本中，后台 Users 的未确认邮箱列表由 wppb_unconfirmed_email_address_custom_menu_page 渲染。wpp_list_unfonfirmed_email_table 的 column_username 方法把 wppb_curpageurl() 读取的当前页 URL 直接拼进 javascript:confirmECAction(...) 行操作链接，未按 JavaScript 字符串上下文转义。攻击者构造带恶意查询串的该后台 URL 并诱导高权限用户访问后，可在管理员会话中执行反射型跨站脚本。\n修复版本中通过新增 wppb_ec_action_link，将 URL、操作类型和邮箱写入经 esc_url 与 esc_attr 处理的 data-* 属性，并由前端点击事件读取后再调用 confirmECAction，阻止当前页 URL 进入 JavaScript 字符串拼接。", "effects": [{"comp_name": "profile-builder", "ecosystem": "linux", "versions": [{"affected_version": "[0,4.0.1)", "min_fixed_version": "4.0.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-10-21", "level": "High", "mps_id": "MPS-do5c-i08u", "poc": false, "poc_url": [], "published_time": "2026-10-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-do5c-i08u", "name": "https://www.oscs1024.com/hd/MPS-do5c-i08u"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-111948", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-111948"}, {"url": "https://wpscan.com/vulnerability/c47a205d-3413-4835-a852-05ea8609802a/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Profile Builder反射型XSS", "_translated": true, "_saved_at": "2026-10-21T11:00:07+00:00", "_first_saved_at": "2026-10-21T11:00:07+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-do5c-i08u"}, {"analysis_status": 0, "articles": [{"content": "应用程序在处理用户输入时的不完善或缺乏验证机制，所以攻击者能够通过向应用程序发送恶意输入，利用应用程序对输入数据的错误处理方式来注入自己的恶意代码。这些恶意代码会被应用程序误认为是合法的指令或数据，并在执行过程中被执行。", "title": "什么是代码注入"}, {"content": "应用程序使用可执行动态代码的函数来执行用户可控的参数，当应用程序对于用户输入过滤不完全时，攻击者可以注入恶意代码并控制代码执行流程。", "title": "代码注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对所有用户输入进行验证和过滤，确保只接受预期的有效输入。这包括对输入数据进行输入长度验证、类型检查和格式验证等。\r\n- 使用参数化查询或预编译语句：对于数据库查询操作，应该使用参数化查询或预编译语句，确保输入数据不会被误认为是执行代码。\r\n- 最小特权原则：应用程序在执行操作系统命令或动态代码时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。\r\n- 安全编码实践：开发人员应该采用安全编码实践，包括避免使用eval函数、避免拼接用户输入的字符串作为代码执行等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止代码注入攻击。", "title": "如何预防代码注入"}], "cnvd_id": "", "cve_id": "CVE-2026-92207", "cvss": {"cvssv3": [{"source": "zdi-disclosures@trendmicro.com", "vector": "CVSS:3.0/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.0/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-94", "description": "MindsDB OpenBBtable Code Injection Remote Code Execution Vulnerability. This vulnerability allows remote attackers to execute arbitrary code on affected installations of MindsDB. Authentication is required to exploit this vulnerability.\n\nThe specific flaw exists within the OpenBBtable class. The issue results from the lack of proper validation of a user-supplied string before using it to execute Python code. An attacker can leverage this vulnerability to execute code in the context of the service account. Was ZDI-CAN-28388.", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "代码注入", "kind_en": "代码生成控制不当（“代码注入”）", "last_modified_time": "2026-10-22", "level": "High", "mps_id": "MPS-2bsv-9zpq", "poc": false, "poc_url": [], "published_time": "2026-10-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-2bsv-9zpq", "name": "https://www.oscs1024.com/hd/MPS-2bsv-9zpq"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-92207", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-92207"}, {"url": "https://www.zerodayinitiative.com/advisories/ZDI-26-707/", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-92207 漏洞", "_translated": true, "_saved_at": "2026-10-23T19:43:03+00:00", "_first_saved_at": "2026-10-21T19:52:35+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-2bsv-9zpq"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-92208", "cvss": {"cvssv3": [{"source": "zdi-disclosures@trendmicro.com", "vector": "CVSS:3.0/AV:A/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.0/AV:A/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-122", "description": "NoMachine mDNS Heap-based Buffer Overflow Remote Code Execution Vulnerability. This vulnerability allows network-adjacent attackers to execute arbitrary code on affected installations of NoMachine. Authentication is not required to exploit this vulnerability.\n\nThe specific flaw exists within the parsing of mDNS resource records. The issue results from the lack of proper validation of the length of user-supplied data prior to copying it to a heap-based buffer. An attacker can leverage this vulnerability to execute code in the context of the service account. Was ZDI-CAN-30982.", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "堆缓冲区溢出", "kind_en": "基于堆的缓冲区溢出", "last_modified_time": "2026-10-22", "level": "High", "mps_id": "MPS-4k2f-mnqa", "poc": false, "poc_url": [], "published_time": "2026-10-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-4k2f-mnqa", "name": "https://www.oscs1024.com/hd/MPS-4k2f-mnqa"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-92208", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-92208"}, {"url": "https://www.zerodayinitiative.com/advisories/ZDI-26-710/", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-92208 漏洞", "_translated": true, "_saved_at": "2026-10-23T19:43:03+00:00", "_first_saved_at": "2026-10-21T19:52:39+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-4k2f-mnqa"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-105937", "cvss": {}, "cvss_score": 8.8, "cvss_vector": "", "cwe": "CWE-862", "description": "Apache Pulsar 是开源的云原生分布式消息与流处理平台，broker 提供多租户主题管理以及 PIP-180 影子主题能力；影子主题通过预留属性 PULSAR.SHADOW_SOURCE 绑定源主题并读取其 managed ledger。\n受影响版本中，Admin REST 在创建非分区或分区主题以及更新主题属性时会接受 PULSAR.SHADOW_SOURCE，但只对目标主题做授权，不对属性中的源主题做校验，源侧 SHADOW_TOPIC 策略授权也不覆盖这些路径。默认授权提供者下，对本租户具备 tenant admin 角色的主体能够把本租户主题绑定到任意其他租户的持久化主题，随后仅凭本主题权限消费源主题仍保留且可读的消息，并可通过影子主题自身的保留、裁剪、卸载与删除路径永久删除源主题在 BookKeeper 与分层存储中的 ledger 数据。\n修复版本中通过新增 broker 配置 enableShadowTopics（默认 false）拒绝创建影子主题、设置 PULSAR.SHADOW_SOURCE 以及加载或复制既有影子主题，启用后跨租户绑定还要求 superuser 角色；同时让影子 managed ledger 不再裁剪或删除源主题 ledger 与卸载数据。", "effects": [{"comp_name": "org.apache.pulsar:pulsar-broker", "ecosystem": "maven", "versions": [{"affected_version": "[3.0.0,4.0.14)", "min_fixed_version": "4.0.14", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[4.1.0,4.2.5)", "min_fixed_version": "4.2.5", "repository": "maven", "solutions": [], "upstream": true}]}], 用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防访问控制不当"}], "cnvd_id": "", "cve_id": "CVE-2026-76291", "cvss": {}, "cvss_score": 8.8, "cvss_vector": "", "cwe": "CWE-284", "description": "Splunk Enterprise 是商业闭源数据分析与安全监测平台，用于日志采集、检索、告警和关联分析，计划搜索由搜索调度器按设定周期执行。\n受影响版本中，持有 schedule_search 能力的用户可在计划搜索流程中绕过 SPL 高风险命令防护。搜索调度器未对计划搜索应用这些防护，用户可将本应触发额外确认或限制的高风险 SPL 命令写入计划搜索并执行，从而泄露或篡改 Splunk Enterprise 数据，或影响服务可用性。\n修复版本中通过厂商安全更新修复搜索调度器未对计划搜索应用 SPL 高风险命令防护的问题，切断该绕过路径；公开资料未披露更细粒度的源码修改。", "effects": [{"comp_name": "splunk", "ecosystem": "linux", "versions": [{"affected_version": "[9.4.0,9.4.16)", "min_fixed_version": "9.4.16", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[10.2.0,10.2.8)", "min_fixed_version": "10.2.8", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[10.4.0,10.4.4)", "min_fixed_version": "10.4.4", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[10.0.0,10.0.11)", "min_fixed_version": "10.0.11", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "访问控制不当", "kind_en": "访问控制不当", "last_modified_time": "2026-10-22", "level": "High", "mps_id": "MPS-88fc-84fa", "poc": false, "poc_url": [], "published_time": "2026-10-22", "reference_url_list": [{"url": "https://advisory.splunk.com/advisories/SVD-2026-1007", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-76291", "name": ""}, {"url": "https://help.splunk.com/en/splunk-enterprise/administer/manage-users-and-security/10.6/best-practices-for-splunk-platform-security/spl-safeguards-for-risky-commands", "name": ""}, {"url": "https://help.splunk.com/en/data-management/splunk-enterprise-admin-manual/10.6/configuration-file-reference/10.6.0-configuration-file-reference/authorize.conf", "name": ""}], "scope_influence": "", "tags": ["应 il/CVE-2026-93471"}, {"url": "https://cna.erlef.org/cves/CVE-2026-93471.html", "name": ""}, {"url": "https://github.com/arekinath/esaml/commit/deeb84378d5c82153b470e99d24f77c38afca14a", "name": ""}, {"url": "https://github.com/dropbox/esaml/commit/deeb84378d5c82153b470e99d24f77c38afca14a", "name": ""}, {"url": "https://github.com/handnot2/esaml/commit/deeb84378d5c82153b470e99d24f77c38afca14a", "name": ""}, {"url": "https://osv.dev/vulnerability/EEF-CVE-2026-93471", "name": ""}], "scope_influence": "", "tags": [], "title": "esaml解压放大漏洞", "_translated": true, "_saved_at": "2026-10-22T12:49:59+00:00", "_first_saved_at": "2026-10-22T12:49:59+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-yqj4-wp9v"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-86696", "cvss": {"cvssv4": [{"source": "6b3ad84c-e1a6-4bf7-a703-f496b71e49db", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.2}]}, "cvss_score": 8.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-770", "description": "esaml 是开源 Erlang SAML Service Provider 库，用于在 Erlang/OTP 节点上实现 SAML 2.0 单点登录与单点登出，源码以 BSD-2-Clause 许可证发布，可通过 Hex 包 esaml 获取。\n受影响版本中，单点登出端点将未签名 LogoutResponse 交给 esaml_sp:validate_logout_response/2，该函数仅在存在 ds:Signature 时验签，未签名报文会进入 esaml:decode_logout_response/1。随后 esaml:status_code_map/1 对无法识别且以 urn: 开头的 StatusCode 调用 list_to_atom/1，把 URN 最后一段永久写入 Erlang 原子表。攻击者反复提交互不相同的状态码可耗尽约一百万条原子表上限并造成节点崩溃。\n修复版本中通过官方尚未发布可用补丁切断该链路，需在单点登出入口拒绝未签名 LogoutResponse，并将未知 StatusCode 限制为已知 SAML 状态码或改用 list_to_existing_atom，阻止攻击者向原子表写入任意新原子。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix 加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-105934", "cvss": {}, "cvss_score": 8.1, "cvss_vector": "", "cwe": "CWE-862", "description": "Apache Pulsar 是开源分布式消息与流处理平台，broker 通过 admin REST API 提供持久化主题管理能力，其中包括 truncate 操作。\n受影响版本中，DELETE /admin/v2/persistent/{tenant}/{namespace}/{topic}/truncate 在按分区主题父名称截断时，PersistentTopicsBase.internalTruncateTopicAsync 未对调用者执行 validateAdminAccessForTenantAsync。该方法读取分区元数据后，通过 broker 内部 admin 客户端对各分区发起 truncate，内部客户端使用 broker 配置凭据而非调用者身份。在授权启用且 broker 内部角色为目标租户 admin 或 superuser 的常见配置下，已认证且仅具备 lookup 权限的非租户管理员可将全部分区订阅游标移至主题末尾并删除非活跃 ledger，造成未确认积压被跳过以及历史消息永久丢失。默认授权提供者下，lookup 权限由 produce 或 consume 授予。\n修复版本中通过在读取分区元数据及截断任何分区之前，对调用者统一执行 validateAdminAccessForTenantAsync，使分区主题与非分区主题、单分区使用相同的租户管理员校验，切断普通 lookup 用户借助内部身份完成截断的路径。", "effects": [{"comp_name": "org.apache.pulsar:pulsar-broker", "ecosystem": "maven", "versions": [{"affected_version": "[2.8.0,4.0.14)", "min_fixed_version": "4.0.14", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[4.1.0,4.2.5)", "min_fixed_version": "4.2.5", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-10-22", "level": "High", "mps_id": "MPS-4f24-d042", "poc": false, "poc_url": [], "published_time": "2026-10-22", "reference_url_list": [{"url": "http://www.mail-archive.com/announce@apache.org/msg12405.html", "name": ""}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-105934", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-105934", "name": ""}, {"url": "https://lists.apache.org/thread.html/ox0vy41jlb41y2l04y7b6h2srlyqoj8o", "name": ""}, {"url": "https://pulsar.apache.org/security/CVE-2026-105934/", "name": ""}, {"url": "https://github.com/apache/pulsar/pull/26776", "name": ""}, {"url": "htt 2:41+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-6emn-z04s"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-105942", "cvss": {}, "cvss_score": 7.7, "cvss_vector": "", "cwe": "CWE-863", "description": "Apache Pulsar 是 Apache 软件基金会开源的云原生消息与流处理平台，broker 支持通过官方 Proxy 以 proxy 角色转发客户端请求，并携带 original principal。\n受影响版本中，代理转发请求时 AuthorizationService 用代理自身的认证数据校验 original principal。启用 MultiRolesTokenAuthorizationProvider 后，getRolesAsync 会从该认证数据解析代理 token 的 roles 声明，使被代理的普通用户获得代理 token 中的超级用户或租户管理员权限。PulsarWebResource.validateAdminAccessForTenantAsync 在代理角色已是租户管理员时跳过对 original principal 的检查，经该代理转发的任意用户都能执行对应租户的管理 REST 操作。\n修复版本中通过 originalPrincipalAuthData 将 original principal 的授权改为 AuthenticationDataForwarded，并要求代理角色与 original principal 均通过 isSuperUserOrTenantAdmin；MultiRolesTokenAuthorizationProvider 仅在转发 token 认证身份等于 original principal 时才使用其中的角色。", "effects": [{"comp_name": "org.apache.pulsar:pulsar-broker", "ecosystem": "maven", "versions": [{"affected_version": "[2.8.1,4.0.14)", "min_fixed_version": "4.0.14", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[4.1.0,4.2.5)", "min_fixed_v ations of Airbyte. Authentication is required to exploit this vulnerability.\n\nThe specific flaw exists within the _get_shared_drive_object method. The issue results from the lack of proper validation of a URI prior to accessing resources. An attacker can leverage this vulnerability to disclose information in the context of the service account. Was ZDI-CAN-28216.", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SSRF", "kind_en": "服务器端请求伪造 (SSRF)", "last_modified_time": "2026-10-22", "level": "High", "mps_id": "MPS-ltch-b128", "poc": false, "poc_url": [], "published_time": "2026-10-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ltch-b128", "name": "https://www.oscs1024.com/hd/MPS-ltch-b128"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-92204", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-92204"}, {"url": "https://www.zerodayinitiative.com/advisories/ZDI-26-704/", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-92204漏洞", "_translated": true, "_saved_at": "2026-10-23T19:43:03+00:00", "_first_saved_at": "2026-10-21T19:52:43+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ltch-b128"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-110354", "cvss": {"cvssv31": [{"source": "cve@mitre.org", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-835", "description": "HAProxy 是开源高性能反向代理与负载均衡软件，HTTP/1.1 前端由 mux-h1 多路复用器接收请求并调用 h1-htx 解析器处理报文。\n受影响版本中，未认证攻击者可向 HTTP/1.1 前端发送 Transfer-Encoding 为 chunked 且 chunk-size 行超过输入缓冲区的请求。h1_parse_msg_data 在 H1_MF_CHNK 路径调用 h1_parse_msg_chunks 时，行未结束且缓冲区已满导致解析进度为零，同一批字节被反复重试。H1 多路复用器在关闭流前会排空请求，超时与客户端断开后工作线程仍占用 100% CPU，重复请求可耗尽全部工作线程直至进程重启。\n修复版本中通过在 h1_parse_msg_data 对不完整 chunk-size 行增加满缓冲判定，当解析无进展、偏移为零且  "2026-10-22", "level": "High", "mps_id": "MPS-b2ba-e008", "poc": false, "poc_url": [], "published_time": "2026-10-22", "reference_url_list": [{"url": "https://www.openwall.com/lists/oss-security/2026/10/21/28", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-94140", "name": ""}, {"url": "https://metacpan.org/release/FERKI/Rex-1.16.1/source/lib/Rex/Commands/Rsync.pm", "name": ""}, {"url": "https://metacpan.org/dist/Rex", "name": ""}, {"url": "https://github.com/RexOps/Rex", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Rex rsync主机密钥绕过", "_translated": true, "_saved_at": "2026-10-22T01:20:18+00:00", "_first_saved_at": "2026-10-21T22:58:15+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-b2ba-e008"}, {"analysis_status": 0, "articles": [{"content": "- 编写代码时没有正确处理输入数据或没有正确验证用户输入而导致的。", "title": "什么是关键资源权限分配不当"}, {"content": "- 弱密码或未使用的密码：当管理员或系统管理员在创建帐户时，没有使用强密码或未对帐户进行密码更新时，可能会发生这种情况。弱密码可能会被黑客破解或通过其他方式轻松访问系统。\n- 未正确配置权限：在系统中，不同的资源通常需要不同的权限才能访问。如果管理员未正确配置权限，那么未经授权的用户可能会通过欺骗系统或利用其他漏洞来访问关键资源。\n- 权限重用：在某些情况下，管理员可能会将某些权限分配给某个用户，但这些权限并未被正确地限制或授权给该用户。如果其他用户尝试使用这些权限访问关键资源，那么他们可能会获得未经授权的访问权限。\n- 未正确验证用户输入：当开发人员没有正确验证用户输入时，可能会发生这种情况。例如，如果开发人员未正确过滤用户输入的用户名或密码，那么黑客可能会利用这些信息轻松地访问系统。\n", "title": "关键资源权限分配不当常见的攻击方式"}, {"content": "- 使用强密码：管理员应该使用强密码来保护系统，并定期更改密码。强密码应该包括数字、字母和符号，并且应该不同于其他帐户使用的密码。\n- 正确配置权限：管理员应该正确配置系统中不同资源所需的权限。用户可以被授予访问特定资源的权限，但不应该被授予访问其他资源的权限。\n- 权限限制：管理员应该使用权限限制来限制用户对特定资源的访问。例如，用户可以被授予访问特定文件夹的权限，但不能访问其他文件夹。\n- 输入验证：开发人员应该正确验证用户输入。例如，他们可以过滤用户输入的用户名和密码，以确保它们符合预期的格式。\n- 安全培训：管理员和用户应该接受安全培训，以便了解如何识别和避免常见的安全漏洞，例如不正确权限授予漏洞。\n- 定期更新和修补软件：系统软件和应用程序应该定期更新和修补，以确保它们不受最新安全漏洞的影响。", "title": "如何预防关键资源权限分配不当"}], "cnvd_id": "", "cve_id": "CVE-2026-115253", "cvss": {"cvssv4": [{"source": "5d1c2695-1a31-4499-88ae-e847036fd7e3", "vector": "CVSS:4.0/AV:L/AC:L/AT:P/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.3}]}, "cvss_score": 7.3, "cvss_vector": "CVSS:4.0/AV:L/AC:L/AT:P/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-732", "description": "WatchGuard Agent 是 WatchGuard 提供的商业端点代理软件，在 Windows 平台以特权服务形式运行，用于写入并维护代理安全日志。\n受影响版本中，代理日志目录权限分配不正确，本地已认证的非管理员用户可创建、修改、追加或删除该目录中的代理日志文件，并写入其他文件，从而篡改或销毁安全日志，以及向特权服务所属目录投放可执行内容以准备后续本地攻击。\n修复版本中通过官方发布 1.25.14.0000 及以上版本，纠正日志目录的权限配置，阻止非管理员本地用户继续对该目录执行写入、篡改或文件投放。", "effects": [{"comp_name": "watchguard_agent", "ecosystem": "linux", "versions": [{"affected_version": "[0,1.25.14.0000)", "min_fixed_version": "1.25.14.0000", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "关键资源权限分配不当", "kind_en": "关键资源的权限分配不正确", "last_modified_time": "2026-10-22", "level": "High", "mps_id": "MPS-86r4-qgju", "poc": false, "poc_url": [], "published_time": "2026-10-22", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-86r4-qgju", "name": "https://www.oscs1024.com/hd/MPS-86r4-qgju"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-115253", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-115253"}, {"url": "https://psirt.watchguard.com/CVE-2026-115253", "name": ""}], "scope_influence": "", "tags": [], "title": "WatchGuard Agent日志权限漏洞", "_translated": true, "_saved_at": "2026-10-22T12:50:02+00:00", "_first_saved_at": "2026-10-22T12:50:02+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-86r4-qgju"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-92210", "cvss": {"cvssv3": [{"source": "zdi-disclosures@trendmicro.com", "vector": "CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "cwe": "CWE-918", "description": "N 级。", "effects": [{"comp_name": "github.com/ThalesGroup/gose", "ecosystem": "go", "versions": [{"affected_version": "[0.9.0,0.13.0-rc1]", "min_fixed_version": "", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "完整性检查值验证不恰当", "kind_en": "完整性检查值验证不当", "last_modified_time": "2026-10-23", "level": "High", "mps_id": "MPS-78um-tso1", "poc": false, "poc_url": [], "published_time": "2026-10-23", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-78um-tso1", "name": "https://www.oscs1024.com/hd/MPS-78um-tso1"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-89320", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-89320"}, {"url": "https://github.com/eclipse-keypont/gose/security/advisories/GHSA-h6w5-722x-2h3m", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "gose JWE完整性校验失效漏洞", "_translated": true, "_saved_at": "2026-10-23T10:52:06+00:00", "_first_saved_at": "2026-10-23T10:52:06+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-78um-tso1"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-54668", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-611", "description": "Kitodo.Production 是一种用于大规模数字化的工作流程管理工具，是 Kitodo 数字图书馆套件的一部分。在版本 3.9.2 之前，org.kitodo.production.helper.XMLUtils 公开了几个 XML 解析帮助器，这些解析器使用默认的非安全配置构造 JAXP 解析器。 parseXMLString(String)、getNumberOfEADElements(String, String) 和 checkIfXmlIsWel
