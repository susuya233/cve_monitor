具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-87977", "cvss": {"cvssv31": [{"source": "psirt@us.ibm.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-89", "description": "IBM Guardium Data Protection 12.2 的边缘控制器组件中容易受到 SQL 注入的攻击。未经身份验证的远程攻击者可以利用此漏洞访问或修改敏感数据库信息。", "effects": [{"comp_name": "Guardium Data Protection", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,12.2]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-11-20", "level": "Critical", "mps_id": "MPS-9o73-az6v", "poc": false, "poc_url": [], "published_time": "2026-11-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-9o73-az6v", "name": "https://www.oscs1024.com/hd/MPS-9o73-az6v"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-87977", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-87977"}, {"url": "https://www.ibm.com/support/pages/node/7297484", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-87977 漏洞", "_translated": true, "_saved_at": "2026-11-20T00:09:34+00:00", "_first_saved_at": "2026-11-20T00:09:34+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-9o73-az6v"}, {"analysis_status": 3, "articles": [{"content": "应用程序在处理用户输入时的不完善或缺乏验证机制，所以攻击者能够通过向应用程序发送恶意输入，利用应用程序对输入数据的错误处理方式来注入自己的恶意代码。这些恶意代码会被应用程序误认为是合法的指令或数据，并在执行过程中被执行。", "title": "什么是代码注入"}, {"content": "应用程序使用可执行动态代码的函数来执行用户可控的参数，当应用程序对于用户输入过滤不完全时，攻击者可以注入恶意代码并控制代码执行流程。", "title": "代码注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对所有用户输入进行验证和过滤，确保只接受预期的有效输入。这包括对输入数据进行输入长度验证、类型检查和格式验证等。\r\n- 使用参数化查询或预编译语句：对于数据库查询操作，应该使用参数化查询或预编译语句，确保输入数据不会被误认为是执行代码。\r\n- 最小特权原则：应用程序在执行操作系统命令或动态代码时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。\r\n- 安全编码实践：开发人员应该采用安全编码实践，包括避免使用eval函数、避免拼接用户输入的字符串作为代码执行等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止代码注入攻击。", "title": "如何预防代码注入"}], "cnvd_id": "", "cve_id": "CVE-2026-59273", "cvss": {"cvssv31": [{"source": "murphysec", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "", "cwe": "CWE-94", "description": "Spring Security 是开源的 Java 认证与授权框架，spring-security-web 用请求匹配器判断 HTTP 请求是否命中某条安全规则。\n受影响版本中，请求匹配器 ELRequestMatcher 用 SpelExpressionParser 解析构造参数里的表达式；matches() 调用 createELContext() 建立不受限求值上下文 StandardEvaluationContext，再对表达式执行 Expression.getValue()。该上下文允许类型引用、反射和任意方法调用，文档给出的根对象 ELRequestMatcherContext 只提供 hasIpAddress() 与 hasHeader()。属性编辑器 RequestMatcherEditor 按类名约定被数据绑定发现，setAsText() 把外部字符串交给 ELRequestMatcher。应用把外部输入绑定到 RequestMatcher 类型的 Bean 属性后，这段输入会在后续请求匹配时执行，可导致远程代码执行。\n修复版本中通过把 createELContext() 改为 SimpleEvaluationContext.forReadOnlyDataBinding().withInstanceMethods()，求值只保留根对象 ELRequestMatcherContext 的实例方法，类型引用和根对象以外的方法调用在 matches() 时失败，从而切断这条远程代码执行路径。", "effects": [{"comp_name": "org.springframework.security:spring-security-web", "ecosystem": "maven", "versions": [{"affected_version": "[7.1.0,7.1.2.1)", "min_fixed_version": "7.1.3", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[5.8.0,5.8.29)", "min_fixed_version": "7.0.9", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[3.0.2,5.7.27)", "min_fixed_version": "7.0.9", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[7.0.0,7.0.9)", "min_fixed_version": "7.0.9", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[6.5.0,6.5.13)", "min_fixed_version": "7.0.9", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[6.4.0,6.4.20)", "min_fixed_version": "7.0.9", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "代码注入", "kind_en": "代码生成控制不当（“代码注入”）", "last_modified_time": "2026-11-20", "level": "Critical", "mps_id": "MPS-sx72-nc9v", "poc": true, "poc_url": [], "published_time": "2026-11-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-sx72-nc9v", "name": "https://www.oscs1024.com/hd/MPS-sx72-nc9v"}, {"url": "https://spring.io/security/cve-2026-59273", "name": ""}, {"url": "https://github.com/spring-projects/spring-security/commit/5d28474a5cefab43d41b0da8c487ce40df957855", "name": ""}], "scope_influence": "小", "tags": [], "title": "Spring Security表达式注入漏洞", "_translated": true, "_saved_at": "2026-11-20T16:47:04+00:00", "_first_saved_at": "2026-11-20T16:47:04+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-sx72-nc9v"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过向受信任的数据序列化过程中添加恶意数据，从而在序列化和反序列化过程中执行恶意代码的攻击漏洞。这种漏洞通常存在于使用序列化 (serialization) 机制存储和传输数据的程序中。\n", "title": "什么是反序列化"}, {"content": "- 注入攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码注入到程序中，从而实现代码执行的目的。\n- 反射攻击：攻击者使用反射机制，在序列化过程中动态生成恶意数据，并将恶意代码注入到程序中，从而实现代码执行的目的。\n- 缓冲区溢出攻击：攻击者通过在序列化过程中向缓冲区输入恶意数据，导致缓冲区溢出，从而破坏程序的内存管理，实现代码执行的目的。\n- 格式字符串攻击：攻击者通过在序列化过程中输入恶意数据，导致程序使用错误的格式字符串，从而实现代码执行的目的。\n- 数据流攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码作为一个数据流传递给程序，从而实现代码执行的目的。\n", "title": "反序列化常见的攻击方式"}, {"content": "- 不信任输入数据：程序应该严格检查输入数据的有效性，并避免使用不受信任的数据。\n- 使用安全的序列化机制：程序应该使用安全的序列化机制，如 JSON 或 XML 序列化，而不是第三方序列化库。\n- 最小特权原则：程序应该限制对受信任数据的处理权限，并避免在运行时修改数据。\n- 代码审查和漏洞扫描：程序应该进行代码审查和漏洞扫描，以发现和修复潜在的安全漏洞。\n", "title": "如何预防反序列化"}], "cnvd_id": "", "cve_id": "CVE-2026-84236", "cvss": {"cvssv31": [{"source": "psirt@us.ibm.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector m/eclipse-keypont/crypto11/v2` 版本 `\u003c= 2.0.0-rc8` （以及已弃用的 v1 模块路径 `github.com/eclipse-keypont/crypto11 \u003c= 1.6.8`、`github.com/ThalesGroup/crypto11 \u003c= 1.7.0-rc1` 和 `github.com/ThalesIgnite/crypto11 \u003c= 1.2.5`），“SecretKey.NewGCM()”返回的“cipher.AEAD”将直接给定的任何随机数传递给“CK_GCM_PARAMS”，而不根据“NonceSize()”检查其长度，并接受空随机数。在接受零长度 GCM IV 的令牌上（SoftHSM2 会这样做），每个具有空随机数的“Seal”都会在同一 IV 下进行加密，重用密钥流并暴露 GHASH 身份验证密钥，从而允许伪造。另外，“Config.UseGCMIVFromHSM”会向令牌发送长度为零的 NULL IV，除非还设置了“GCMIVFromHSMControl.SupplyIvForHSMGCMEncrypt”，因此令牌无处可写它生成的 IV：在明文已加密后，具有非空随机数的“Seal”会发生恐慌，而具有空随机数的“Seal”会在空 IV 下返回密文，不会出现错误。另外，在 v1 线路上，HSM-IV 模式永远不会将令牌生成的 IV 复制回调用者，因此调用者保留自己的随机数，同时数据在另一个随机数下加密。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "弱初始化向量的生成（IV）", "kind_en": "弱初始化向量的生成（IV）", "last_modified_time": "2026-11-21", "level": "Critical", "mps_id": "MPS-1j8f-zaq5", "poc": false, "poc_url": [], "published_time": "2026-11-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-1j8f-zaq5", "name": "https://www.oscs1024.com/hd/MPS-1j8f-zaq5"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-115407", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-115407"}, {"url": "https://github.com/eclipse-keypont/crypto11/security/advisories/GHSA-c2cp-4qw8-q4jg", "name": ""}, {"url": "https://github.com/eclipse-keypont/crypto11/commit/8d99b73c721c173ad85c0ca4e063c3da360a611d", "name": ""}, {"url": "https://gitlab.eclipse.org/security/cve-assignment/-/work_items/491", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-115407 漏洞", "_translated": true, "_saved_at": "2026-11-20T16:47:21+00:00", "_first_saved_at": "2026-11-20T16:47:21+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-1j8f-zaq5"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-82339", "cvss": {"cvssv31": [{"source": "psirt@us.ibm.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI _status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-76538", "cvss": {}, "cvss_score": 8.8, "cvss_vector": "", "cwe": "CWE-943", "description": "Splunk Enterprise 是 Splunk 公司的商业化机器数据平台（闭源软件），用于采集、索引与检索机器数据，提供 SPL 搜索语言、数据模型与 REST API 等分析和管理能力。\n受影响版本中，不持有 admin 或 power 角色的低权限用户可通过 REST API 提交数据模型加速参数，Splunk Enterprise 在将调用方提供的这些加速值写入自动生成的汇总检索（summarization search）前未进行正确中和，注入的 Search Processing Language（SPL）随汇总检索以提升权限运行，导致低权限用户可令平台执行任意 SPL 检索（CWE-943）。\n修复版本中通过在将调用方提供的数据模型加速值写入生成的汇总检索之前对其进行正确中和，切断注入 SPL 进入高权限检索执行路径的链路，消除低权限用户以提升权限运行任意 SPL 的能力。", "effects": [{"comp_name": "splunk_enterprise", "ecosystem": "linux", "versions": [{"affected_version": "[9.4.0,9.4.16)", "min_fixed_version": "9.4.16", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[10.0.0,10.0.12)", "min_fixed_version": "10.0.12", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[10.2.0,10.2.9)", "min_fixed_version": "10.2.9", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[10.4.0,10.4.5)", "min_fixed_version": "10.4.5", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "数据查询逻辑中特殊元素的不当中和", "kind_en": "数据查询逻辑中特殊元素的不当中和", "last_modified_time": "2026-11-19", "level": "High", "mps_id": "MPS-0aa9-1558", "poc": false, "poc_url": [], "published_time": "2026-11-19", "reference_url_list": [{"url": "https://advisory.splunk.com/advisories/SVD-2026-1103", "name": ""}], "scope_influence": "", "tags": [], "title": "Splunk Enterprise SPL注入漏洞", "_translated": true, "_saved_at": "2026-11-19T00:55:01+00:00", "_first_saved_at": "2026-11-19T00:55:01+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-0aa9-1558"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "cnvd_id": "", "cve_id": "", "cvss": {}, "cvss_score": 8.8, "cvss_vector": "", "cwe": "CWE-416", "description": "Linux kernel 是开源的操作系统内核，其 SCTP（流控制传输协议）子系统位于 net/sctp，提供面向连接、支持多宿主与多流的传输服务，在多数发行版中以 sctp 模块随内核提供，应用程序首次打开 SCTP 套接字时由内核自动加载。\n受影响版本中，SCTP 发送路径存在竞态缺陷：发送操作在内核中等待期间，其关联（association）可被转移到另一个套接字，等待中的发送操作随后释放该关联；另一套接字继续访问已释放的关联时形成 use-after-free，特定条件下表现为 double free，Xint 在启用 KASAN 的内核上捕获到 double-free 报告。利用该缺陷可获得内核内存泄露与内核任意函数调用两个原语，前者可绕过 KASLR，后者可劫持内核执行流程，Xint 已在 nginx worker 账户环境中稳定获得 root，并在 nginx 运行于 Docker 容器时取得宿主机 root shell。该缺陷随 Linux v4.15 于 2018 年引入，已存在超过八年。\n在官方修复发布前，可通过在不使用 SCTP 的主机 /etc/modprobe.d/ 目录下的配置文件写入 install sctp /bin/false，阻止 sctp 模块经 modprobe 自动加载；该措施无法卸载已加载模块，也无法禁用编译进内核的 SCTP。上游内核补丁尚未发布，Xint 表示将在后续数周内提供，发布后应按发行版内核安全公告及时升级。", "effects": [{"comp_name": "linux_kernel", "ecosystem": "linux", "versions": [{"affected_version": "[4.15,+∞)", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "UAF", "kind_en": "免费后使用", "last_modified_time": "2026-11-19", "level": "High", "mps_id": "MPS-cf96-bda7", "poc": false, "poc_url": [], "published_time": "2026-11-19", "reference_url_list": [{"url": "https://seclists.org/oss-sec/2026/q4/781", "name": ""}, {"url": "https://nginx2root.com/", "name": ""}, {"url": "https://xint.io/blog/nginx2root-remote-code-execution", "name": ""}, {"url": "https://lwn.net/Articles/1108362/", "name": ""}, {"url": "https://github.com/torvalds/linux", "name": ""}], "scope_influence": "", "tags": ["操作系统"], "title": "Linux内核SCTP本地提权漏洞", "_translated": true, "_saved_at": "2026-11-19T08:18:05+00:00", "_first_saved_at": "2026-11-19T08:18:05+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-cf96-bda7"}, {"analysis_status": 0, "articles": [{"content": "- 命令注入是一种攻击，其目标是通过易受攻击的应用程序在主机操作系统上执行任意命令。 当应用程序将不安全的用户提供的数据（表单、cookie、HTTP 标头等）传递到系统 shell 时，就会产生缺陷。攻击者通过构造恶意的命令或数据，将其注入到程序执行的上下文中，从而绕过程序的输入验证和安全措施，实现对程序操作的恶意操作。", "title": "什么是命令注入"}, {"content": "- 文件上传：攻击者通过构造恶意的文件上传请求，将包含恶意命令的文件上传到服务器，从而利用命令注入漏洞执行恶意命令。\n- SQL 注入：攻击者通过构造恶意的 SQL 查询语句，将包含恶意命令的 SQL 语句注入到数据库中，从而执行恶意命令，窃取数据或者破坏系统。\n- 命令执行：攻击者通过在 Web 应用程序的表单提交数据中注入恶意命令，从而执行恶意命令，例如删除文件、格式化硬盘等。\n- 命令注入漏洞的旁路攻击：攻击者可以利用命令注入漏洞旁路控制程序的执行流程，从而窃取数据、破坏系统、控制程序等。\n", "title": "命令注入常见的攻击方式"}, {"content": "- 输入验证：在程序输入处对输入数据进行严格的验证和过滤，确保输入数据符合预期的格式和类型，避免被攻击者注入恶意命令。\n- 输出过滤：在程序输出处对输出数据进行严格的过滤和检查，确保输出数据符合预期的格式和类型，避免被攻击者截获和篡改。\n- 使用安全的编程模型：使用安全的编程模型，例如避免使用原生的命令执行方式，使用安全的框架和库来处理输入数据和执行命令，避免命令注入漏洞。\n- 数据库加密和访问控制：对于敏感数据和命令，使用加密和访问控制措施，确保只有授权用户可以访问和执行命令，避免被攻击者窃取和篡改。\n- 定期更新和升级：定期更新和升级应用程序和库的版本，确保应用程序和库的最新版本包含了最新的安全补丁和修复措施，避免安全漏洞的出现和利用。\n- 安全审计和监控：定期对系统和应用程序进行安全审计和监控，及时发现和阻止潜在的安全漏洞和攻击，确保系统和数据的安全和可靠性。", "title": "如何预防命令注入"}], "cnvd_id": "", "cve_id": "", "cvss": {}, "cvss_score": 8.7, "cvss_vector": "", "cwe": "CWE-77", "description": "lettre 是 Rust 生态中广泛使用的开源电子邮件发送库（crates.io 包 lettre，MIT 许可），提供 SMTP 传输、连接池与消息构建能力，常用于应用内通知、验证码等邮件发送。\n受影响版本中，SMTP DATA 阶段负责透明化的编解码器 ClientCodec 只在完整 CRLF 之后重置到行首状态，行首以点开头的行会被补写第二个点（dot-stuffing），而裸 LF 或裸 CR 之后的内容停留在行中状态，不会触发补点；攻击者控制 send_raw 传入的原始报文或未经编码的邮件正文时，可植入 \\n.\\n 序列，该序列以未补点形式原样发往服务器，在接受裸 LF 行结束符的服务器上被识别为 DATA 结束标记，其后的字节在同一已认证 SMTP 连接上被解析为命令，攻击者可复用该连接发送其他邮件。\n修复版本中通过重写 ClientCodec 状态机切断上述因果链：新增 AfterBareLf 状态，把裸 CR 与裸 LF 同样视为行边界，凡处于非行中状态时遇到的点一律先补写第二个点，DATA 结束序列仍只接受 CRLF，消除了对宽松服务器的 SMTP 命令注入。", "effects": [{"comp_name": "lettre", "ecosystem": "cargo", "versions": [{"affected_version": "(-∞,0.11.24)", "min_fixed_version": "0.11.24", "repository": "cargo", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "命令注入", "kind_en": "命令中使用的特殊元素的不正确中和（“命令注入”）", "last_modified_time": "2026-11-19", "level": "High", "mps_id": "MPS-af39-3670", "poc": false, "poc_url": [], "published_time": "2026-11-19", "reference_url_list": [{"url": "https://rustsec.org/advisories/RUSTSEC-2026-0561.html", "name": ""}, {"url": "https://github.com/lettre/lettre/commit/3d9a6e6a467c6ce00bd39ada6aa1a00e57540a1d", "name": ""}, {"url": "https://github.com/rustsec/advisory-db/blob/main/crates/lettre/RUSTSEC-2026-0561.md", "name": ""}, {"url": "https://api.osv.dev/v1/vulns/RUSTSEC-2026-0561", "name": ""}, {"url": "https://github.com/lettre/lettre/blob/master/CHANGELOG.md", "name": ""}, {"url": "https://github.com/lettre/lettre/releases/tag/v0.11.24", "name": ""}, {"url": "https://crates.io/crates/lettre", "name": ""}, {"url": "https://rustsec.org/advisories/RUSTSEC-2021-0069.html", "name": ""}], "scope_influence": "", "tags": [], "title": "lettre SMTP命令注入漏洞", "_translated": true, "_saved_at": "2026-11-19T08:18:05+00:00", "_first_saved_at": "2026-11-19T08:18:05+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-af39-3670"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-19609", "cvss": {"cvssv4": [{"source": "vulnerability@ncsc.ch", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-79", "description": "Unblu Spark 是 Unblu inc. 开发的商业客户互动与协同浏览平台，支持本地部署与云部署，提供嵌入式协同浏览、Agent Desk 客服工作台与 Single Conversation Desk 等组件，服务端源码未公开。\n受影响版本中，嵌入式协同浏览捕获的页面包含以前缀 dyn. 标记的动态属性，用于同步表单字段值、滚动位置等 DOM 属性的实时取值；坐席端浏览器把接收到的任意 dyn. 键直接应用为对应 DOM 属性，未做键名白名单校验，处于访客角色的未认证远程攻击者可发送类似 dyn.innerHTML 的键，向坐席浏览器的协同浏览视图中注入受控标记，使攻击者提供的 JavaScript 在坐席会话的上下文与身份下于 Agent Desk 或 Single Conversation Desk 中执行。\n修复版本中通过固定白名单将坐席端浏览器可应用的 dyn. 键限制 全的编程模型，例如避免使用原生的命令执行方式，使用安全的框架和库来处理输入数据和执行命令，避免命令注入漏洞。\n- 数据库加密和访问控制：对于敏感数据和命令，使用加密和访问控制措施，确保只有授权用户可以访问和执行命令，避免被攻击者窃取和篡改。\n- 定期更新和升级：定期更新和升级应用程序和库的版本，确保应用程序和库的最新版本包含了最新的安全补丁和修复措施，避免安全漏洞的出现和利用。\n- 安全审计和监控：定期对系统和应用程序进行安全审计和监控，及时发现和阻止潜在的安全漏洞和攻击，确保系统和数据的安全和可靠性。", "title": "如何预防命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-76544", "cvss": {}, "cvss_score": 8.1, "cvss_vector": "", "cwe": "CWE-77", "description": "Splunk Enterprise 是 Splunk 公司发布的商业数据搜索与分析平台（闭源），用于采集、索引和检索机器数据，提供搜索、告警、仪表盘与 REST API 等能力，广泛用于企业与安全运营场景。\n受影响版本中，Splunk Enterprise 在计划执行的 metric alert 搜索中使用过滤器输入前未对其进行完整校验，不持有 admin 或 power 角色的普通用户可构造包含注入内容的 metric alert 过滤器输入，使计划执行的 metric alert 搜索运行任意 Search Processing Language（SPL）命令，并访问以明文形式存储的凭据；利用前提为实例上存在至少一个非内部 metric 索引。该漏洞对应厂商 Bug ID VULN-81808。\n修复版本中通过对 metric alert 过滤器输入的完整校验，消除计划搜索中的任意 SPL 执行路径，受影响分支需升级至 10.4.5、10.2.9、10.0.12、9.4.16 或更高版本；厂商公告未提供针对该漏洞的缓解措施或临时规避方案。", "effects": [{"comp_name": "splunk", "ecosystem": "linux", "versions": [{"affected_version": "[10.4.0,10.4.5)", "min_fixed_version": "10.4.5", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[10.2.0,10.2.9)", "min_fixed_version": "10.2.9", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[10.0.0,10.0.12)", "min_fixed_version": "10.0.12", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[9.4.0,9.4.16)", "min_fixed_version": "9.4.16", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "命令注入", "kind_en": "命令中使用的特殊元素的不正确中和（“命令注入”）", "last_modified_time": "2026-11-19", "level": "High", "mps_id": "MPS-47c0-01f7", "poc": false, "poc_url": [], "published_time": "2026-11-19", "reference_url_list": [{"url": "https://advisory.splunk.com/advisories/SVD-2026-1103", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-76544", "name": ""}], "scope_influence": "", "tags": [], "title": "Splunk 指标告警 SPL 注入漏洞", "_translated": true, "_saved_at": "2026-11-19T00:54:58+00:00", "_first_saved_at": "2026-11-19T00:54:58+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-47c0-01f7"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-131178", "cvss": {}, "cvss_score": 7.6, "cvss_vector": "", "cwe": "CWE-74", "description": "Splunk Enterprise 是 Splunk 公司推出的闭源商业数据平台，用于采集、索引与检索机器数据，并提供基于仪表板的可视化分析能力，Classic Dashboard（经典仪表板）支持用户保存搜索面板并共享给其他已认证用户。\n受影响版本中，持有 power 角色的用户可以构造一个共享的 Classic Dashboard，在其中嵌入任意 Search Processing Language（SPL）命令；当其他已认证用户打开该共享仪表板时，Splunk Enterprise 会以查看者的权限运行注入的 SPL，攻击者可读取和修改查看者可访问的数据，并部分破坏 Splunk Enterprise 的可用性。利用需要查看者打开共享仪表板，官方公告未披露源码位置，并提示参考 sparkline 添加、仪表板权限配置与 SPL 高危命令防护的官方文档。\n修复版本中通过升级至 Splunk Enterprise 10.4.5、10.2.9、10.0.12 或 9.4.17 及以上版本消除该注入链，官方公告未披露闭源代码改动，也未提供额外缓解措施，建议同步审计共享经典仪表板的共享范围并遵循 SPL 高危命令防护最佳实践。", "effects": [{"comp_name": "splunk", "ecosystem": "linux", "versions": [{"affected_version": "[10.4.0,10.4.5)", "min_fixed_version": "10.4.5", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[9.4.0,9.4.17)", "min_fixed_version": "9.4.17", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[10.2.0,10.2.9)", "min_fixed_version": "10.2.9", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[10.0.0,10.0.12)", "min_fixed_version": "10.0.12", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "注入", "kind_en": "下游组件使用的输出中特殊元素的不正确中和（“注入”）", "last_modified_time": "2026-11-19", "level": "High", "mps_id": "MPS-2e48-a4bc", "poc": false, "poc_url": [], "published_time": "2026-11-19", "reference_url_list": [{"url": "https://advisory.splunk.com/advisories/SVD-2026-1103", "name": ""}, {"url": "https://www pository": "cargo", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "不加限制或调节的资源分配", "kind_en": "不受限制或节流地分配资源", "last_modified_time": "2026-11-19", "level": "High", "mps_id": "MPS-3a0c-a970", "poc": false, "poc_url": [], "published_time": "2026-11-19", "reference_url_list": [{"url": "https://rustsec.org/advisories/RUSTSEC-2026-0523.html", "name": ""}, {"url": "https://github.com/quinn-rs/quinn/security/advisories/GHSA-53rm-773f-4q8c", "name": ""}, {"url": "https://github.com/quinn-rs/quinn/commit/3eb7465d9e11d7a245e99cde1a4eb872ec26d264", "name": ""}, {"url": "https://github.com/quinn-rs/quinn/commit/73114d8289d42bd536c790fa00a9beed05a4e5fa", "name": ""}, {"url": "https://github.com/quinn-rs/quinn/releases/tag/quinn-proto-0.11.19", "name": ""}, {"url": "https://crates.io/crates/quinn-proto", "name": ""}, {"url": "https://datatracker.ietf.org/doc/html/rfc9000#section-4.6", "name": ""}], "scope_influence": "", "tags": [], "title": "quinn-proto流限制绕过致拒绝服务", "_translated": true, "_saved_at": "2026-11-19T08:18:04+00:00", "_first_saved_at": "2026-11-19T08:18:04+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-3a0c-a970"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-76516", "cvss": {"cvssv31": [{"source": "psirt@cisco.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:H/A:N", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:H/A:N", "cwe": "CWE-841", "description": "ClamAV 是 Cisco Talos 开源的跨平台反病毒引擎，以 C 语言实现，广泛用于邮件网关、文件服务与终端防护产品对不可信文件的恶意软件扫描，支持解析 XAR 等多种归档格式。\n受影响版本中，libclamav/xar.c 的 cli_scanxar 在提取 XAR 归档内 application/x-gzip 编码成员时，将累计解压输出计数变量 outsize 声明在内层 inflate 循环体内并每轮清零，解压数据先经 cli_writen 写入临时文件，随后传给 cli_checklimits 的始终是单个 FILEBUFF 缓冲区的字节数，配置的 MaxFileSize 与 MaxScanSize 无法被成员累计输出触发；同时外层 TOC 成员循环未在达到 MaxFiles、扫描超时或收到中止标志后停止。攻击者将高压缩比 deflate 流封装为 XAR GZIP 成员并提交扫描，引擎会持续解压并把全部输出写入临时文件直至流结束，可超出配置限额耗尽临时存储并陷入长时间循环，造成拒绝服务。\n修复版本中通过在写入前跟踪成员累计解压输出并校验 out_size 与本次解压字节之和，超出 MaxFileSize 或 MaxScanSize 时将本次写入截断到剩余配额并停止当前成员解压，超出部分计入聚合扫描配额避免后续成员重复占用；同时在提取每个成员前检查文件数、超时与中止标志，向上传播 CL_ETIMEOUT 与 CL_EMAXFILES 退出条件，切断了利用无界解压写入耗尽临时存储的路径。", "effects": [{"comp_name": "clamav", "ecosystem": "linux", "versions": [{"affected_version": "[0.98,1.4.7)", "min_fixed_version": "1.4.7", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[1.5.0,1.5.5)", "min_fixed_version": "1.5.5", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "行为工作流的不恰当实施", "kind_en": "Improper Enforcement of Behavioral Workflow", "last_modified_time": "2026-11-19", "level": "High", "mps_id": "MPS-4jcl-r1m5", "poc": false, "poc_url": [], "published_time": "2026-11-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-4jcl-r1m5", "name": "https://www.oscs1024.com/hd/MPS-4jcl-r1m5"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-76516", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-76516"}, {"url": "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-clamav-multi-e93M3vdA", "name": "cisco-sa-clamav-multi-e93M3vdA"}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "ClamAV XAR GZIP解压限额绕过致拒绝服务漏洞", "_translated": true, "_saved_at": "2026-11-18T18:36:43+00:00", "_first_saved_at": "2026-11-18T18:36:43+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-4jcl-r1m5"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "", "cvss": {}, "cvss_score": 7.5, "cvss_vector": "", "cwe": "CWE-617", "description": "quinn-proto 是 Rust 生态开源的 QUIC 传输协议核心实现（crates.io 组件），负责 QUIC 报文构造、解析与连接状态机，quinn 客户端与服务端均基于该组件工作。\n受影响版本中，客户端缓存 Retry 报文携带的令牌时没有任何长度限制，并在后续每个 Initial 报文头中原样写入该令牌。Initial 数据报固定为 1200 字节，当令牌与连接 ID 占满报文头后，PacketBuilder::new 计算出的最小报文尺寸大于最大可用尺寸，该矛盾仅由 debug_assert 检查；在下一次 poll_transmit 时，debug 构建触发断言 panic，release 构建按错误的最小尺寸执行单次超过 10 GiB 的内存分配，令牌更长时分配失败并中止进程。攻击者仅凭客户端发出的首个 Initial 即可构造匹配的 Retry 报文，发送者可以是客户端正在连接的服务端，也可以是能够抢在该服务端之前应答的任意网络位置攻击者，因此所有使用 quinn-proto 发起出站连接的应用均受影响，服务端不处理 Retry 报文。\n修复版本中通过在 PacketBuilder::new 中改用饱和减法计算最大尺寸，并在 Initial 报文头之后剩余帧空间不足时截断缓冲区、以 PROTOCOL_VIOLATION 关闭连接，统一覆盖 Retry 令牌与缓存的地址验证令牌两类来自对端的输入，同时在大型 Initial 报文头之后为 CONNECTION_CLOSE 保留帧空间，避免关闭帧越过报文边界，上述修复包含在 quinn-proto 0.11.19 中。", "effects": [{"comp_name": "quinn-proto", "ecosystem": "cargo", "versions": [{"affected_version": "[0.11.0,0.11.19)", "min_fixed_version": "0.11.19", "repository": "cargo", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "可达断言", "kind_en": "Reachable Assertion", "last_modified_time": "2026-11-19", "level": "High", "mps_id": "MPS-7ea8-570f", "poc": false, "poc_url": [], "published_time": "2026-11-19", "reference_url_list": [{"url": "https://rustsec.org/advisories/RUSTSEC-2026-0524.html", "name": ""}, {"url": "https://github.com/quinn-rs/quinn/security/advisories/GHSA-wppq-2f6r-wfvm", "name": ""}, {"url": "https://github.com/quinn-rs/quinn/releases/tag/quinn-proto-0.11.19", "name": ""}, {"url": "https://crates.io/crates/quinn-proto", "name": ""}, {"url": "https://github.com/quinn-rs/quinn/commit/3bba467893ceff64d6cda0b3a2c51a1429e10372", "name": ""}, {"url": "https://github.com/quinn-rs/quinn/commit/a6e78d1c8bf28630f1e92fbcc38f60e0a134b01a", "name": ""}, {"url": "https://github.com/quinn-rs/quinn/commit/74c33ff75281d7751488e410e21e4f030782b655", "name": ""}, {"url": "https://github.com/quinn-rs/quinn/commit/d45b5136ed1d5b2b04ff6456443c0662acf1d0d3", "name": ""}], "scope_influence": "", "tags": [], "title": "quinn-proto拒绝服务漏洞", "_translated": true, "_saved_at": "2026-11-19T08:18:03+00:00", "_first_saved_at": "2026-11-19T08:18:03+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-7ea8-570f"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-76422", "cvss": {"cvssv31": [{"source": "psirt@cisco.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-134", "description": "ClamAV 是 Cisco Talos 维护的开源防病毒引擎，用于邮件网关、终端防护等场景的文件扫描与恶意软件检测。\n受影响版本中，Rust 模块的日志桥接层 libclamav_rust/src/logging.rs 在 ClamLogger::log 方法中将已渲染完成的日志消息指针直接用作 C 侧变参日志函数 cli_dbgmsg_no_inline、cli_errmsg、cli_infomsg_simple、cli_warnmsg 的格式化字符串。在启用调试日志功能时，攻击者提交的待扫描文件中的可控文本（如归档内条目名等解析结果）可进入日志消息，其中的百分号指示符被变参函数当作格式说明符解析并读取不存在的变参参数，导致扫描进程终止，也可能造成内存信息泄露或内存破坏。\n修复版本中通过为全部 Rust 到 C 的日志调用改用固定 %s 格式说明符，并将已渲染的消息作为数据参数传入，日志内容不再被解释为格式化字符串，切断格式指示符注入路径，消除扫描进程崩溃风险。", "effects": [{"comp_name": "clamav", "ecosystem": "linux", "versions": [{"affected_version": "[0.105.0,1.4.7)", "min_fixed_version": "1.4.7", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[1.5.0,1.5.5)", "min_fixed_version": "1.5.5", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "使用外部控制的格式字符串", "kind_en": "使用外部控制的格式字符串", "last_modified_time": "2026-11-19", "level": "High", "mps_id": "MPS-8j7u-9il6", "poc": false, "poc_url": [], "published_time": "2026-11-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-8j7u-9il6", "name": "https://www.oscs1024.com/hd/MPS-8j7u-9il6"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-76422", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-76422"}, {"url": "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-clamav-multi-e93M3vdA", "name": "cisco-sa-clamav-multi-e93M3vdA"}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "ClamAV 格式字符串漏洞", "_translated": true, "_saved_at": "2026-11-18T18:36:45+00:00", "_first_saved_at": "2026-11-18T18:36:45+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-8j7u-9il6"}, {"analysis_status": 0, "articles": [{"content": "跨界内存读是指应用程序在读取内存时，未正确验证或限制读取的内存范围。攻击者利用这种漏洞可以读取应用程序内存中的敏感数据，如密码、加密密钥、会话令牌等。常见的原因是由于缓冲区溢出、格式化字符串漏洞或其他内存错误导致的。", "title": "什么是越界读取"}, {"content": "攻击者可以通过不当构造的输入来触发跨界内存读漏洞。攻击者可能会通过向应用程序发送特定的输入，使其读取超过预期的内存区域。攻击者可以利用这个漏洞来获取敏感信息，如其他用户的数据、操作系统的敏感数据或应用程序的内部状态。", "title": "越界读取常见的攻击方式"}, {"content": "- 输入验证和限制：应用程序应对所有输入数据进行严格的验证和限制。确保输入数据的长度、格式和内容符合预期，避免超出缓冲区或访问非预期的内存区域。\n- 内存安全编程实践：开发人员应使用安全的编程实践，如避免使用不安全的函数、正确处理内存分配和释放操作，以及遵循最小特权原则。\n- 使用安全的编程语言和库：选择使用安全性较高的编程语言和库，这些语言和库在内存管理和安全性方面提供了更多的保护机制。\n- 定期进行代码审查和安全测试：定期审查应用程序的代码，并进行安全测试，以发现潜在的跨界内存读漏洞。使用静态代码分析工具和漏洞扫描工具来辅助检测和修复问题。\n- 实施防御性编程技术：应用程序应采用防御性编程技术，如使用随机化地址空间布局（ASLR）、堆栈保护机制（如堆栈溢出保护）和数据执行预防（DEP）等。\n- 及时更新和修补：及时应用程序和操作系统的安全更新和补丁，以确保已知的跨界内存读漏洞得到修复。及时更新相关软件和库，以避免使用已知存在漏洞的版本。", "title": "如何预防越界读取"}], "cnvd_id": "", "cve_id": "CVE-2026-76430", "cvss": {"cvssv31": [{"source": "psirt@cisco.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-125", "description": "ClamAV 是 Cisco Talos 团队维护的开源反病毒引擎（GPL-2.0），以 libclamav 库及 clamscan、clamd 等工具提供，广泛用于邮件网关、文件上传扫描与终端防护产品（含 Cisco Secure Endpoint），可解析扫描 UPX 加壳的 PE 可执行文件。\n受影响版本中，libclamav 的 cli_scanpe 在解包 UPX 文件时让全部解码尝试共享同一块按 dsize + 8192 字节分配的堆缓冲区，并以指针方式传递逻辑输出长度 dsize；NRV2B/NRV2D/NRV2E 解码成功后 pefromupx 会把 *dsize 更新为重建 PE 的 foffset，随后的 LZMA 解码器 upx_inflatelzma 仍复用该缓冲区并按放大后的长度写入，而 pefromupx 仅以可被放大的 *dsize + 8192 作为 memcpy(dst, newbuf, foffset) 的边界依据，未对照真实分配容量校验长度，攻击者提交构造的 UPX 文件即可使长度检查失效，造成堆内存越界读取并使扫描进程崩溃，形成拒绝服务。\n修复版本中通过引入不可变的分配容量 dst_capacity 切断该链条：解码前校验 *dsize 不超过容量，优先匹配显式 LZMA stub 并在首个解码成功后停止复用目的缓冲区，要求 LZMA 输出完整结束并清理失败输出，把重建 PE 的段拷贝同时限制在解码输入与物理目的缓冲区边界内，并以无符号运算解码 NRV 回引偏移，消除越界访问导致的扫描进程崩溃。", "effects": [{"comp_name": "clamav", "ecosystem": "linux", "versions": [{"affected_version": "[0.94.1,1.4.7)", "min_fixed_version": "1.4.7", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[1.5.0,1.5.5)", "min_fixed_version": "1.5.5", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界读取", "kind_en": "越界读取", "last_modified_time": "2026-11-19", "level": "High", "mps_id": "MPS-hn8k-73r1", "poc": false, "poc_url": [], "published_time": "2026-11-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-hn8k-73r1", "name": "https://www.oscs1024.com/hd/MPS-hn8k-73r1"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-76430", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-76430"}, {"url": "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-clamav-multi-e93M3vdA", "name": "cisco-sa-clamav-multi-e93M3vdA"}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "ClamAV UPX堆越界读漏洞", "_translated": true, "_saved_at": "2026-11-18T18:36:47+00:00", "_first_saved_at": "2026-11-18T18:36:47+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-hn8k-73r1"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能有效地控制资源的使用，导致攻击者可以利用这个漏洞耗尽应用程序所依赖的资源。这些资源可以是计算资源（CPU、内存）、网络带宽、数据库连接或其他系统资源。攻击者可以通过发送特制的请求、恶意输入或其他方式，使应用程序消耗大量资源，导致拒绝服务或系统崩溃。", "title": "什么是拒绝服务"}, {"content": "- 消耗计算资源：攻击者可以发送计算密集型的请求，例如复杂的计算、无限循环或递归操作，以耗尽应用程序的计算资源，导致应用程序无法响应其他请求。\r\n- 消耗内存资源：攻击者可以发送大量的数据或恶意输入，以导致应用程序消耗过多的内存资源，从而使系统的可用内存耗尽，并导致应用程序崩溃或变得不可用。\r\n- 消耗网络带宽：攻击者可以发送大量的请求或大型数据包，以消耗应用程序所依赖的网络带宽。这会导致其他合法用户无法正常访问应用程序或降低系统的整体网络性能。\r\n- 消耗存储资源：攻击者可以发送大量的请求或上传大文件，以耗尽应用程序的存储资源，导致系统无法处理其他请求或存储新的数据。", "title": "拒绝服务常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对输入数据进行合理的验证和过滤，防止恶意输入导致资源消耗过高。\r\n- 实施资源限制：应用程序应该实施适当的资源限制策略，例如限制计算操作的时间或次数，限制内存使用量，限制并发连接数等，以防止资源被耗尽。\r\n- 异常处理与错误恢复：应用程序应该具备健壮的异常处理和错误恢复机制，以防止因意外错误导致资源泄漏或无法释放的情况。\r\n- 资源监控与警报：应用程序应该实施适当的资源监控和警报机制，及时发现异常的资源消耗情况，并采取相应的措施来应对。\r\n- 压力测试与性能优化：应用程序应该进行压力测试，以评估其在高负载情况下的性能，并进行必要的性能优化，以确保能够有效地处理大量请求而不耗尽资源。", "title": "如何预防拒绝服务"}], "cnvd_id": "", "cve_id": "CVE-2026-76515", "cvss": {"cvssv31": [{"source": "psirt@cisco.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-400", "description": "ClamAV 是 Cisco Talos 维护的开源反恶意软件扫描引擎，以 GPL-2.0 协议发布，提供 clamscan 命令行扫描器、clamd 扫描守护进程与 libclamav 扫描库，广泛用于邮件网关、文件上传检测和终端安全产品，其中 OLE2 解析器负责处理 Microsoft Compound File Binary（CFB）复合文档。\n受影响版本中，libclamav/ole2_extract.c 的 ole2_walk_property_tree() 在处理每个目录属性节点时都将 current_block 重置为 hdr-\u003eprop_start，并通过 ole2_get_next_block_number() 从头重走目录扇区 FAT 链定位属性所在扇区，重复遍历成本随属性节点数与目录链长叠加；该循环内唯一的超时检查 cli_json_timeout_cycle_check() 只在启用 JSON 元数据收集时才间接检查扫描时限，BAT/XBAT 扇区回读与 XBAT 链回溯均无截止时间检查，攻击者向扫描服务提交构造的 CFB 文件，可使 OLE2 解析超出 MaxScanTime 限制并陷入无限循环，耗尽扫描进程 CPU 造成拒绝服务。\n修复版本中通过新增 ole2_build_property_block_list() 一次性遍历并缓存可达的目录扇区链，配合 visited 位集检测环路、按文件长度限制扇区数上限，ole2_walk_property_tree() 改为按每扇区目录项数 entries_per_sector 直接从缓存定位属性，节点处理与 BAT/XBAT 链回溯统一接入 cli_checktimelimit() 实时时限检查，切断了反复重走 FAT 链的放大路径，保证 MaxScanTime 超时被及时强制执行。", "effects": [{"comp_name": "cisco:secure_endpoint_connector", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,8.6.4)", "min_fixed_version": "8.6.4", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,1.27.5)", "min_fixed_version": "1.27.5", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,1.29.3)", "min_fixed_version": "1.29.3", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "clamav", "ecosystem": "linux", "versions": [{"affected_version": "[0.98.1,1.4.7)", "min_fixed_version": "1.4.7", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": " av", "ecosystem": "linux", "versions": [{"affected_version": "[0.80,1.4.7)", "min_fixed_version": "1.4.7", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[1.5.0,1.5.5)", "min_fixed_version": "1.5.5", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "堆缓冲区溢出", "kind_en": "基于堆的缓冲区溢出", "last_modified_time": "2026-11-19", "level": "High", "mps_id": "MPS-sm2r-igv9", "poc": false, "poc_url": [], "published_time": "2026-11-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-sm2r-igv9", "name": "https://www.oscs1024.com/hd/MPS-sm2r-igv9"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-76421", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-76421"}, {"url": "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-clamav-multi-e93M3vdA", "name": "cisco-sa-clamav-multi-e93M3vdA"}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "ClamAV CHM堆越界写漏洞", "_translated": true, "_saved_at": "2026-11-18T18:36:49+00:00", "_first_saved_at": "2026-11-18T18:36:49+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-sm2r-igv9"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能有效地控制资源的使用，导致攻击者可以利用这个漏洞耗尽应用程序所依赖的资源。这些资源可以是计算资源（CPU、内存）、网络带宽、数据库连接或其他系统资源。攻击者可以通过发送特制的请求、恶意输入或其他方式，使应用程序消耗大量资源，导致拒绝服务或系统崩溃。", "title": "什么是拒绝服务"}, {"content": "- 消耗计算资源：攻击者可以发送计算密集型的请求，例如复杂的计算、无限循环或递归操作，以耗尽应用程序的计算资源，导致应用程序无法响应其他请求。\r\n- 消耗内存资源：攻击者可以发送大量的数据或恶意输入，以导致应用程序消耗过多的内存资源，从而使系统的可用内存耗尽，并导致应用程序崩溃或变得不可用。\r\n- 消耗网络带宽：攻击者可以发送大量的请求或大型数据包，以消耗应用程序所依赖的网络带宽。这会导致其他合法用户无法正常访问应用程序或降低系统的整体网络性能。\r\n- 消耗存储资源：攻击者可以发送大量的请求或上传大文件，以耗尽应用程序的存储资源，导致系统无法处理其他请求或存储新的数据。", "title": "拒绝服务常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对输入数据进行合理的验证和过滤，防止恶意输入导致资源消耗过高。\r\n- 实施资源限制：应用程序应该实施适当的资源限制策略，例如限制计算操作的时间或次数，限制内存使用量，限制并发连接数等，以防止资源被耗尽。\r\n- 异常处理与错误恢复：应用程序应该具备健壮的异常处理和错误恢复机制，以防止因意外错误导致资源泄漏或无法释放的情况。\r\n- 资源监控与警报：应用程序应该实施适当的资源监控和警报机制，及时发现异常的资源消耗情况，并采取相应的措施来应对。\r\n- 压力测试与性能优化：应用程序应该进行压力测试，以评估其在高负载情况下的性能，并进行必要的性能优化，以确保能够有效地处理大量请求而不耗尽资源。", "title": "如何预防拒绝服务"}], "cnvd_id": "", "cve_id": "CVE-2026-76417", "cvss": {"cvssv31": [{"source": "psirt@cisco.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-400", "description": "ClamAV 是 Cisco Talos 开源维护的防病毒引擎，被 clamscan、clamd 守护进程以及 Cisco Secure Endpoint Connector 等产品用于恶意软件扫描，其 libclamav 库内置 OLE2 解析器，负责处理 Microsoft Compound File Binary 格式文档。\n受影响版本中，libclamav/ole2_extract.c 的 ole2_walk_property_tree 函数遍历 OLE2 属性树时，根属性与目录属性的子节点递归调用传入 rec_level + 1，文件类型属性的子节点递归调用仍传入原 rec_level，纯文件属性构成的深层链路上递归深度计数保持不变，函数入口处 rec_level 大于 100 与 max_recursion_level 的上限检查不会命中，未认证攻击者向扫描流程发送构造的 CFB 文件可引发无上限递归，耗尽进程栈与可用内存，导致 ClamAV 扫描进程终止并形成拒绝服务。\n修复版本中通过在文件属性的子属性递归调用中传入 rec_level + 1，使全部递归边均计入递归深度，深层链路会命中既有的递归上限检查并终止属性遍历，阻断栈与内存耗尽导致的进程崩溃。", "effects": [{"comp_name": "clamav", "ecosystem": "linux", "versions": [{"affected_version": "[0.71,1.4.7)", "min_fixed_version": "1.4.7", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[1.5.0,1.5.5)", "min_fixed_version": "1.5.5", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "拒绝服务", "kind_en": "不受控制的资源消耗", "last_modified_time": "2026-11-19", "level": "High", "mps_id": "MPS-u5mj-yf8n", "poc": false, "poc_url": [], "published_time": "2026-11-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-u5mj-yf8n", "name": "https://www.oscs1024.com/hd/MPS-u5mj-yf8n"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-76417", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-76417"}, {"url": "https://sec.cloudapps.cisco.com/security/center/conten : [], "upstream": true}, {"affected_version": "[1.23.0,1.23.2)", "min_fixed_version": "1.23.2", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,1.21.2)", "min_fixed_version": "1.21.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "输入中指定数量的验证不当", "kind_en": "输入中指定数量的验证不正确", "last_modified_time": "2026-11-20", "level": "High", "mps_id": "MPS-3h6p-x5wu", "poc": false, "poc_url": [], "published_time": "2026-11-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-3h6p-x5wu", "name": "https://www.oscs1024.com/hd/MPS-3h6p-x5wu"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-63390", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-63390"}, {"url": "https://github.com/samtools/htslib/commit/00a30cdb8db1f5832eb58a799383a462c6b58cb3", "name": ""}, {"url": "https://github.com/samtools/htslib/commit/2713f39242f4afff5382aad5c1ba02abe12950cd", "name": ""}, {"url": "https://github.com/samtools/htslib/commit/3a3585dc844f7caad266bbec8d91e45c09c1dcd4", "name": ""}, {"url": "https://github.com/samtools/htslib/pull/2047", "name": ""}, {"url": "https://github.com/samtools/htslib/releases/tag/1.21.2", "name": ""}, {"url": "https://github.com/samtools/htslib/releases/tag/1.22.3", "name": ""}, {"url": "https://github.com/samtools/htslib/releases/tag/1.23.2", "name": ""}, {"url": "https://github.com/samtools/htslib/releases/tag/1.24", "name": ""}, {"url": "https://github.com/samtools/htslib/security/advisories/GHSA-2wm6-8hgm-7g92", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-63390 漏洞", "_translated": true, "_saved_at": "2026-11-21T11:58:36+00:00", "_first_saved_at": "2026-11-19T17:54:13+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-3h6p-x5wu"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-62257", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:H/VA:L/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:H/VA:L/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-787", "description": "HTSlib is a library for reading and writing bioinformatics file formats. Prior to 1.21.2, 1.22.3, 1.23.2, and 1.24, the experimental CRAM v4 XPACK and XRLE decoders cache expanded block pointers at indexes beyond the 512-element slice-\u003eblock_by_id array. An array index partially controlled by data in the input file first causes an out-of-bounds read to determine whether a block is cached; a null value then causes allocation of a block and an out-of-bounds pointer write to the same element. The invalid read may crash the process, while the write may corrupt heap state and could permit arbitrary code execution. This issue is fixed in versions 1.21.2, 1.22.3, 1.23.2, and 1.24.", "effects": [{"comp_name": "htslib", "ecosystem": "linux", , and 1.24.", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-11-20", "level": "High", "mps_id": "MPS-s1zb-dhye", "poc": false, "poc_url": [], "published_time": "2026-11-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-s1zb-dhye", "name": "https://www.oscs1024.com/hd/MPS-s1zb-dhye"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-62258", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-62258"}, {"url": "https://github.com/samtools/htslib/commit/25278797c251a9af789382ecf5aa0c86f417bdf5", "name": ""}, {"url": "https://github.com/samtools/htslib/commit/df93e245f1b517aec86c69684fcb2faf5942c5c2", "name": ""}, {"url": "https://github.com/samtools/htslib/commit/f1d1bf835aaafa1e511996dcd49760c36f683b17", "name": ""}, {"url": "https://github.com/samtools/htslib/pull/2046", "name": ""}, {"url": "https://github.com/samtools/htslib/releases/tag/1.21.2", "name": ""}, {"url": "https://github.com/samtools/htslib/releases/tag/1.22.3", "name": ""}, {"url": "https://github.com/samtools/htslib/releases/tag/1.23.2", "name": ""}, {"url": "https://github.com/samtools/htslib/releases/tag/1.24", "name": ""}, {"url": "https://github.com/samtools/htslib/security/advisories/GHSA-2jx2-wm7f-rv9m", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-62258 漏洞", "_translated": true, "_saved_at": "2026-11-21T11:58:36+00:00", "_first_saved_at": "2026-11-19T17:54:17+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-s1zb-dhye"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-113347", "cvss": {"cvssv3": [{"source": "vultures@jpcert.or.jp", "vector": "CVSS:3.0/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.2}], "cvssv4": [{"source": "vultures@jpcert.or.jp", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-78", "description": "Multiple products produced by Ruijie Networks Co., Ltd. contain an OS command injection vulnerability that may lead to arbitrary OS commands being executed by an attacker with the administrative privilege.", "effects": [{"comp_name": "RG-AP180-AC V4", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,Release(11172318)]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,MA_1.3(1)B10]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,Release(11181517)]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,MA_1.3(1)B10P1]", "min_fixed_version": "", "repository": "unmanage /cybersecurity-bulletins/10009", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-113347漏洞", "_translated": true, "_saved_at": "2026-11-21T11:58:36+00:00", "_first_saved_at": "2026-11-20T07:58:10+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-kvni-9luw"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-133874", "cvss": {"cvssv31": [{"source": "VulnCheck", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N", "severity": "high", "base_score": 8.1}], "cvssv4": [{"source": "VulnCheck", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "", "cwe": "CWE-863", "description": "Iceburg CRM 到 5.0.0 的 Module::saveRecord() 中包含一个不正确的授权漏洞，该漏洞允许经过身份验证的用户通过在请求主体密钥前添加另一个模块 ID 来写入未经授权的模块。对一个模块具有写入权限的攻击者可以向 POST /data/save 或 PUT /api/crm/{id} 提交精心设计的请求，以将其 role_id 设置为 Admin 并访问管理数据。", "effects": [{"comp_name": "iceburgcrm", "ecosystem": "linux", "versions": [{"affected_version": "(0,5.0.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false 于堆栈的缓冲区溢出的影响。远程攻击者可以利用此漏洞导致拒绝服务或可能执行任意代码。", "effects": [{"comp_name": "Guardium Data Protection", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,12.2]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "缓冲区溢出", "kind_en": "内存缓冲区范围内的操作限制不当", "last_modified_time": "2026-11-20", "level": "High", "mps_id": "MPS-uej1-wnzc", "poc": false, "poc_url": [], "published_time": "2026-11-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-uej1-wnzc", "name": "https://www.oscs1024.com/hd/MPS-uej1-wnzc"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-82342", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-82342"}, {"url": "https://www.ibm.com/support/pages/node/7297484", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-82342 漏洞", "_translated": true, "_saved_at": "2026-11-20T00:09:46+00:00", "_first_saved_at": "2026-11-20T00:09:46+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-uej1-wnzc"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "",  writable volume with the container being created can change that path between the two lookups, so crun copies image files onto host files, including files under /proc/sys.", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "检查时间与使用时间(TOCTOU)的竞争条件", "kind_en": "检查时间使用时间 (TOCTOU) 竞争条件", "last_modified_time": "2026-11-20", "level": "High", "mps_id": "MPS-5hmq-6yjf", "poc": false, "poc_url": [], "published_time": "2026-11-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-5hmq-6yjf", "name": "https://www.oscs1024.com/hd/MPS-5hmq-6yjf"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-133553", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-133553"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-133553", "name": ""}, {"url": "https://bugzilla.redhat.com/show_bug.cgi?id=2577547", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-133553 漏洞", "_translated": true, "_saved_at": "2026-11-21T11:58:36+00:00", "_first_saved_at": "2026-11-20T07:58:07+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-5hmq-6yjf"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "cnvd_id": "", "cve_id": "CVE-2026-84087", "cvss": {"cvssv31": [{"source": "psirt@us.ibm.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-269", "description": "IBM Guardium Data Protection 12.2 容易受到通过 Collector 设备上的 SUID-root podman_wrapper 二进制文件进行本地权限升级的攻击。对 Collector 具有低权限访问权限的本地攻击者可以利用 SUID 二进制文件中参数验证不足的问题，以 root 身份执行任意命令，从而导致 Collector 设备完全受损。", "effects": [{"comp_name": "Guardium Data Protection", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,12.2]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-11-20", "level": "High", "mps_id": "MPS-rs57-a8ux", "poc": false, "poc_url": [], "published_time": "2026-11-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-rs57-a8ux", "name": "https://www.oscs1024.com/hd/MPS-rs57-a8ux"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-84087", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-84087"}, {"url": "https://www.ibm.com/support/pages/node/7297484", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-84087 漏洞", "_translated": true, "_saved_at": "2026-11-20T00:09:43+00:00", "_first_saved_at": "2026-11-20T00:09:43+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-rs57-a8ux"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-133274", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:N/I:N/A:H", "severity": "medium", "base_score": 6.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR: 4.com/hd/MPS-kmos-ljt8"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-62255", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:N/VI:H/VA:L/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:N/VI:H/VA:L/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-789", "description": "HTSlib is a library for reading and writing bioinformatics file formats. Prior to 1.21.2, 1.22.3, 1.23.2, and 1.24, cram_index_load does not verify that the number of reference sequences in a CRAM .crai index does not exceed the CRAM header reference count. A malformed index can drive unbounded index-array allocation, and when the number of references in the index is within two of INT_MAX, the growth calculation can wrap, read beyond a heap buffer, and use the resulting value as a pointer for an unchecked memory write. Any region query can trigger the flaw, causing denial of service or memory corruption. This issue is fixed in versions 1.21.2, 1.22.3, 1.23.2, and 1.24.", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "未经控制的内存分配", "kind_en": "大小值过大的内存分配", "last_modified_time": "2026-11-20", "level": "High", "mps_id": "MPS-pfol-maz2", "poc": false, "poc_url": [], "published_time": "2026-11-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-pfol-maz2", "name": "https://www.oscs1024.com/hd/MPS-pfol-maz2"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-62255", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-62255"}, {"url": "https://github.com/samtools/htslib/commit/08fbbceefdfac073e768c1fce593181ca7379222", "name": ""}, {"url": "https://github.com/samtools/htslib/commit/57e1a0763c9a5f34a1d1ab9deb3a3ad2bd8fe11d", "name": ""}, {"url": "https://github.com/samtools/htslib/commit/8a2394e63c9bdd758cc6a7de04c5e2ee7acc8e65", "name": ""}, {"url": "https://github.com/samtools/htslib/commit/924e21755d0b5db7a33f1920d20c0e441667d22f", "name": ""}, {"url": "https://github.com/samtools/htslib/pull/2029", "name": ""}, {"url": "https://github.com/samtools/htslib/releases/tag/1.21.2", "name": ""}, {"url": "https://github.com/samtools/htslib/releases/tag/1.22.3", "name": ""}, {"url": "https://github.com/samtools/htslib/releases/tag/1.23.2", "name": ""}, {"url": "https://github.com/samtools/htslib/releases/tag/1.24", "name": ""}, {"url": "https://github.com/samtools/htslib/security/advisories/GHSA-28r7-prwc-hf5c", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-62255 漏洞", "_translated": true, "_saved_at": "2026-11-21T11:58:36+00:00", "_first_saved_at": "2026-11-19T17:54:21+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-pfol-maz2"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-62256", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:N/VI:H/VA:L/SC:N/SI:N/SA:N/E: 58:32+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-9wpo-jmfk"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "attack_vector_type": "Local", "cnvd_id": "", "cve_id": "CVE-2026-112603", "cvss": {}, "cvss_score": 7.8, "cvss_vector": "", "cwe": "CWE-269", "description": "Apple Xcode 是 Apple 官方发布的 macOS 集成开发环境（闭源软件），Instruments 是其中随附的性能分析与调试工具组件，用于应用剖析、跟踪与性能调优。\n受影响版本中，Xcode 的 Instruments 组件存在逻辑问题，对相关特权操作缺少充分校验，本地应用可借助该缺陷获得 root 权限；Apple 官方公告未披露具体函数与判定细节，受影响的代码位置不可确认。\n修复版本中通过增强校验（improved checks）修复该逻辑问题，修复随 Xcode 27.2 发布（2026 年 10 月 29 日发布），升级后本地应用无法再借助该缺陷获得 root 权限。", "effects": [{"comp_name": "xcode", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,27.2)", "min_fixed_version": "27.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-11-21", "level": "High", "mps_id": "MPS-y04x-726g", "poc": false, "poc_url": [], "published_time": "2026-11-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-y04x-726g", "name": "https://www.oscs1024.com/hd/MPS-y04x-726g"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-112603", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-112603"}, {"url": "https://support.apple.com/en-us/149589", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "Apple Xcode 本地提权漏洞", "_translated": true, "_saved_at": "2026-11-21T03:42:21+00:00", "_first_saved_at": "2026-11-21T03:42:21+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-y04x-726g"}, {"analysis_status": 0, "articles": [], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-114023", "cvss": {}, "cvss_score": 7.7, "cvss_vector": "", "cwe": "CWE-20", "description": "macOS App Store 是 Apple macOS 系统内置的应用商店，为闭源组件，负责应用的浏览、搜索、下载与更新，并处理商店页面中的网页内容。\n受影响版本中，App Store 处理网页内容时的路径处理逻辑存在校验缺陷，攻击者可控的网页内容进入该路径处理流程后未经充分验证，处理此类内容可能导致执行任意代码。\n修复版本中通过改进路径验证消除该缺陷，Apple 已在 macOS Golden Gate 27.2、macOS Sequoia 15.8.2 与 macOS Tahoe 26.7.2 中发布修复，升级后处理网页内容不再触发任意代码执行。", "effects": [{"comp_name": "macos", "ecosystem": "linux", "versions": [{"affected_version": "[15,15.8.2)", "min_fixed_version": "15.8.2", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[27,27.2)", "min_fixed_version": "27.2", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[26,26.7.2)", "min_fixed_version": "26.7.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "输入验证不恰当", "kind_en": "输入验证不当", "last_modified_time": "2026-11-21", "level": "High", "mps_id": "MPS-mutp-9jb3", "poc": false, "poc_url": [], "published_time": "2026-11-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-mutp-9jb3", "name": "https://www.oscs1024.com/hd/MPS-mutp-9jb3"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-114023", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-114023"}, {"url": "https://support.apple.com/en-us/149521", "name": ""}, {"url": "https://support.apple.com/en-us/149522", "name": ""}, {"url": "https://support.apple.com/en-us/149523", "name": ""}], "scope_influence": "", "tags": ["操作系统"], "title": "macOS App Store 任意代码执行漏洞", "_translated": true, "_saved_at": "2026-11-21T03:42:19+00:00", "_first_saved_at": "2026-11-21T03:42:19+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-mutp-9jb3"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-131609", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "cwe": "CWE-79", "description": "Germanized for WooCommerce 是 vendidero 开发的 WordPress 开源插件（GPLv3），用于让 WooCommerce 店铺符合德国及欧盟市场的合规要求，提供结账调整、税项处理与订单撤回（withdrawal）管理等功能，其中内置的 EU Order Withdrawal Button 子模块通过公开的撤回请求表单和后台撤回列表处理客户撤回请求。\n受影响版本中，后台撤回列表 WithdrawalTable::render_order_number_column() 将买家姓名 get_formatted_full_name() 的返回值仅经 wp_kses_post() 白名单过滤后直接输出，未使用 esc_html() 做整字段转义；攻击者先通过 WooCommerce Store API 游客结账把恶意脚本写入订单账单名（billing_address.first_name），再经 /withdraw-from-contract/ 页面公开 nonce 的未认证撤回请求接口（Ajax::order_withdrawal_request）以该订单为父单提交撤回请求，WithdrawalOrder::get_first_name() 在撤回单自身未填姓名且邮箱完成双重确认验证时回退读取父订单的 billing first name，注入内容随之进入后台撤回列表的买家姓名列，wp_kses_post() 的标签白名单可被拆分标签重组方式绕过，管理员打开后台撤回列表或订单详情时脚本在其会话中执行。\n修复版本中通过将 WithdrawalTable::render_order_number_column() 中买家姓名、render_order_address_column() 的地址字段以及 Admin.php 订单页撤回明细与邮件模板中的姓名、邮箱、验证码等客户可控字段统一改为 esc_html()/esc_attr() 转义输出，不再依赖 wp_kses_post() 白名单过滤；配套提交（withdrawal button 包 2.4.8 的第二项修复）还剥离客户可控邮件占位符中的尖括号、转义拒回原因并限制后台保存撤回 AJAX 的可编辑属性，从根源消除标签重组绕过，阻止任意脚本注入并在管理员会话中执行。", "effects": [{"comp_name": "woocommerce-germanized", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,4.1.9)", "min_fixed_version": "4.1.9", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-11-21", "level": "High", "mps_id": "MPS-hf9j-36a4", "poc": false, "poc_url": [], "published_time": "2026-11-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-hf9j-36a4", "name": "https://www.oscs1024.com/hd/MPS-hf9j-36a4"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-131609", "name": "https:// $_POST['variation'] ?? [] ) ) 直接读取攻击者提交的 variation 数组，不做任何清洗或属性白名单校验，便作为第 4 个参数传入 WC()-\u003ecart-\u003eadd_to_cart()。恶意属性值随购物车项持久化并进入后续订单数据，在其他用户访问渲染该数据的页面时因输出转义不足以 Web 脚本执行。该方法虽校验 woobt-security nonce，但 enqueue_scripts 方法通过 wp_localize_script 把同一 nonce 输出给所有未登录访问者，nonce 不构成认证屏障，未认证攻击者无需登录即可调用该入口。\n修复版本中通过 8.0.3 重写 ajax_add_all_to_cart 的 variation 处理：先确认 product_id 本身是变体商品，或 variation_id 对应一个已发布且父商品等于 product_id 的变体商品，再将原始 $_POST['variation'] 交给新增的 WPCleverWoobt_Helper::sanitize_variation() 清洗，该函数只保留 attribute_ 前缀的字符串键与标量值，去除标签后按变体商品的已注册属性（分类法 term slug 或父商品自定义属性选项）做白名单比对，不匹配的值全部丢弃；不存在合法变体商品时 variation_id 归零、variation 置空。同一清洗逻辑也应用到 woobt_ids 驱动的关联商品加购路径。", "effects": [{"comp_name": "woo-bought-together", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,8.0.3)", "min_fixed_version": "8.0.3", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-11-21", "level": "High", "mps_id": "MPS-pexl-zago", "poc": false, "poc_url": [], "published_time": "2026-11-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-pexl-zago", "name": "https://www.oscs1024.com/hd/MPS-pexl-zago"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-133367", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-133367"}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/08e4c3a3-040f-4d2b-805c-f512bd95812d?source=cve", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/woo-bought-together/tags/8.0.2/includes/class-woobt.php#L67", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/woo-bought-together/tags/8.0.2/includes/class-woobt.php#L219", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/woo-bought-together/tags/8.0.2/includes/class-woobt.php#L610", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/woo-bought-together/tags/8.0.2/includes/class-woobt.php#L624", "name": ""}, {"url": "https://wordpress.org/plugins/woo-bought-together/", "name": ""}, {"url": "https://plugins.trac.wordpress.org/changeset/3813247/woo-bought-together/trunk/includes/class-woobt.php", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "WPC Frequently Bought Together存储型XSS", "_translated": true, "_saved_at": "2026-11-21T11:58:34+00:00", "_first_saved_at": "2026-11-21T11:58:34+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-pexl-zago"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-134126", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:N", "severity": "medium", "base_score": 6.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVS
