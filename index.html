www.oscs1024.com/hd/MPS-88b4-8f0e"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-77299", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-770", "description": "regexp2 是一个基于 .NET 正则引擎的开源 Go 正则表达式库，提供 .NET 风格的高级正则语法支持，常被嵌入需要用户自定义正则能力的 Go 应用中。\n受影响版本中，语法解析器接受最高达 math.MaxInt32 的重复次数，匹配引擎对回溯栈 runtrack 的倍增扩容没有任何上限；当形如 (?:){50000000} 这类对零宽子表达式施加超大定次量词的模式被编译并对空输入执行匹配时，Branchcount 指令在迭代计数从 1-m 攀升回 0 之前不会短路空迭代，前 m-1 次迭代每次通过 trackPush1 向 runtrack 压入两个整数，十余字节长度的模式即可造成多 GiB 内存分配并将进程 OOM 终止，MatchTimeout 因内存分配速度快于 100 毫秒的时钟检查周期而无法有效拦截。\n修复版本中通过两层改动切断该链路：语法树规约阶段 reduceRep 将字面空表达式的重复直接约简为空节点，使 (?:){N} 不再生成循环指令；运行期引入默认 100000 的回溯栈上限，ensureStorage 超限时返回 ErrBacktrackingStackLimit 终止匹配，从而将匹配期内存限制在有界范围内。", "effects": [{"comp_name": "github.com/dlclark/regexp2", "ecosystem": "go", "versions": [{"affected_version": "(-∞,1.12.0]", "min_fixed_version": "", "repository": "go", "solutions": [], "upstream": true}]}, {"comp_name": "github.com/dlclark/regexp2/v2", "ecosystem": "go", "versions": [{"affected_version": "(-∞,2.3.0)", "min_fixed_version": "2.3.0", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "不加限制或调节的资源分配", "kind_en": "不受限制或节流地分配资源", "last_modified_time": "2026-11-06", "level": "High", "mps_id": "MPS-ki0f-35dh", "poc": false, "poc_url": [], "published_time": "2026-11-06", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ki0f-35dh", "name": "https://www.oscs1024.com/hd/MPS-ki0f-35dh"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-77299", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-77299"}, {"url": "https://github.com/dlclark/regexp2/security/advisories/GHSA-wq9v-j77v-qr26", "name": "https://github.com/dlclark/regexp2/security/advisories/GHSA-wq9v-j77v-qr26"}, {"url": "https://github.com/dlclark/regexp2/commit/6e446cb3a57a0f20112bc24353604fd00bdb309a", "name": "https://github.com/dlclark/regexp2/commit/6e446cb3a57a0f20112bc24353604fd00bdb309a"}, {"url": "https://github.com/dlclark/regexp2/releases/tag/v2.3.0", "name": "https://github.com/dlclark/regexp2/releases/tag/v2.3.0"}], "scope_influence": "", "tags": ["go"], "title": "regexp2 拒绝服务漏洞", "_translated": true, "_saved_at": "2026-11-06T07:33:13+00:00", "_first_saved_at": "2026-11-06T07:33:13+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ki0f-35dh"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用了空指针，并在不进行有效检查的情况下对其进行取消引用操作。当程序试图取消引用空指针时，由于空指针不指向任何有效的内存地址，会导致程序崩溃或产生未定义的行为。这种错误通常发生在开发者未对指针进行正确的初始化或验证时。", "title": "什么是空指针取消引用"}, {"content": "- 拒绝服务：攻击者可以通过构造恶意输入或请求，触发程序中的空指针取消引用错误，导致程序崩溃或无法正常运行。这可能导致拒绝服务攻击，使系统无法提供正常的服务。\r\n- 内存信息泄露：攻击者可以通过利用空指针取消引用错误，访问程序中的敏感内存信息。这可能包括栈上的变量、函数指针或其他敏感数据，从而暴露系统的机密信息。\r\n- 代码执行：在某些情况下，空指针取消引用错误可能导致执行恶意代码或注入恶意代码的机会。攻击者可以通过精心构造的输入，利用空指针取消引用错误来执行任意的代码，进而获取系统控制权或执行未经授权的操作。", "title": "空指针取消引用常见的攻击方式"}, {"content": "- 指针初始化和验证：开发者应该正确地初始化指针，并在使用指针之前进行有效的验证，确保指针不为空。在取消引用指针之前，应始终检查其是否为空。\r\n- 异常处理和错误恢复：程序应该具备健壮的异常处理和错误恢复机制，以便在发生空指针取消引用错误时能够适当地处理异常，而不是导致程序崩溃或暴露敏感信息。\r\n- 防御性编程：采用防御性编程的原则，如避免在未经验证的指针上进行操作，避免使用未初始化的指针等，以防止空指针取消引用错误的发生。\r\n- 静态代码分析和测试：使用静态代码分析工具和测试技术来检测和识别潜在的空指针取消引用错误。这些工具可以帮助发现代码中可能存在的空指针问题，并及时修复。\r\n- 强制性编码标准和最佳实践：制定强制性的编码标准和最佳实践，包括良好的指针使用和管理规范，以帮助开发者编写更可靠、安全的代码。", "title": "如何预防空指针取消引用"}], "cnvd_id": "", "cve_id": "CVE-2026-87045", "cvss": {"cvssv31": [{"source": "vulnerabilities@zephyrproject.org", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-476", "description": "Zephyr 是 Linux 基金会旗下的开源物联网实时操作系统，面向资源受限的嵌入式设备，其网络子系统内置支持 HTTP/1.x 与 HTTP/2 的服务器组件（CONFIG_HTTP_SERVER）。\n受影响版本中，handle_http_frame_header() 在解析每个帧前无条件执行 client-\u003ecurrent_stream = NULL，而 CONTINUATION 帧不会开启新流，enter_http_frame_continuation_state() 也未重新绑定流上下文，攻击者在客户端 preface 之后发送一个未经 HEADERS 帧开启的孤立 CONTINUATION 帧（END_HEADERS 置位），服务器以空流指针完成整个头部块的处理；请求未注册资源时 send_http2_404() 与 send_http2_405() 经 send_headers_frame() 无条件写入 client-\u003ecurrent_stream-\u003eheaders_sent，向注册动态资源发送 POST/PUT/PATCH 时 handle_http2_dynamic_resource() 写入 client-\u003ecurrent_stream-\u003ecurrent_detail，两次写入均指向固定低地址，在 Cortex-M 等目标上触发硬故障并由默认致命错误处理停机，构成无需认证的远程拒绝服务，明文 h2c 连接即可触达，TLS 不能阻断。\n修复版本中通过三处改动切断该链条：handle_http_frame_header() 仅在 expect_continuation 为假时释放流上下文，使头部块跨 CONTINUATION 帧保持绑定；enter_http_frame_continuation_state() 对无绑定流或流标识不匹配的 CONTINUATION 帧返回错误并拒绝；handle_http2_dynamic_resource() 补上与同级处理函数一致的 client-\u003ecurrent_stream 判空守卫，孤立 CONTINUATION 帧被拒绝，空指针写入不再可达。", "effects": [{"comp_name": "zephyr", "ecosystem": "linux", "versions": [{"affected_version": "[4.1.0,4.3.2)", "min_fixed_version": "4.3.2", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[4.4.0,4.5.0)", "min_fixed_version": "4.5.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "空指针取消引用", "kind_en": "空指针取消引用", "last_modified_time": "2026-11-06", "level": "High", "mps_id": "MPS-sh7l-aypg", "poc": false, "poc_url": [], "published_time": "2026-11-06", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-sh7l-aypg", "name": "https://www.oscs1024.com/hd/MPS-sh7l-aypg"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-87045", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-87045"}, {"url": "https://github.com/zephyrproject-rtos/zephyr/commit/e72a9d9498092bfbb7feed4b479bf21bc3218c3d", "name": "Fix commit"}, {"url": "https://github.com/zephyrproject-rtos/zephyr/security/advisories/GHSA-cw8r-2jj2-w8fw", "name": "GHSA-cw8r-2jj2-w8fw"}], "scope_influence": "", "tags": ["应用软件"], "title": "Zephyr HTTP/2 空指针引用漏洞", "_translated": true, "_saved_at": "2026-11-06T15:33:17+00:00", "_first_saved_at": "2026-11-06T15:33:17+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-sh7l-aypg"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-92855", "cvss": {"cvssv31": [{"source": "secalert@redhat.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:N", "severity": "high", "base_score": 7.4}]}, "cvss_score": 7.4, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:N", "cwe": "CWE-287", "description": "Keycloak 是红帽主导的开源身份认证与访问管理系统，提供 SAML 身份代理功能，用于将登录认证委托给外部 SAML 身份提供者。\n受影响版本中，SAML 代理端点在 services/src/main/java/org/keycloak/broker/saml/SAMLEndpoint.java 的 validateSubjectConfirmationData 方法中只查找 bearer 类型的 SubjectConfirmation；当上游签名的断言仅声明 holder-of-key 类型的 SubjectConfirmation 时，该方法跳过全部 subject confirmation 校验并返回 true，断言被直接接受，服务端不校验持有者是否拥有与断言绑定的私钥。攻击者截获受害者的一条有效签名断言后，可将其重放到 /realms/{realm}/broker/{alias}/endpoint 端点，无需私钥完成认证，冒充受害者登录并访问其账号与下游应用。\n修复版本中通过重写 validateSubjectConfirmationData 方法，收集断言中全部 bearer 确认并逐个校验 SubjectConfirmationData 的 NotOnOrAfter、Recipient 与 InResponseTo，要求至少一个校验通过才接受响应，否则拒绝该断言，使仅含 holder-of-key 确认的断言无法再被当作 bearer 凭据重放。", "effects": [{"comp_name": "keycloak", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,26.8.2)", "min_fixed_version": "26.8.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "org.keycloak:keycloak-services", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,26.8.2)", "min_fixed_version": "26.8.2", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "身份验证不当", "kind_en": "认证不当", "last_modified_time": "2026-11-06", "level": "High", "mps_id": "MPS-59r0-b3x4", "poc": false, "poc_url": [], "published_time": "2026-11-06", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-59r0-b3x4", "name": "https://www.oscs1024.com/hd/MPS-59r0-b3x4"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-92855", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-92855"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-92855", "name": ""}, {"url": "https://bugzilla.redhat.com/show_bug.cgi?id=2535814", "name": "RHBZ#2535814"}], "scope_influence": "", "tags": ["java", "开源"], "title": "Keycloak SAML代理认证绕过漏洞", "_translated": true, "_saved_at": "2026-11-05T19:20:55+00:00", "_first_saved_at": "2026-11-05T19:20:55+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-59r0-b3x4"}, {"analysis_status": 0, "articles": [], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-93998", "cvss": {"cvssv31": [{"source": "secalert@redhat.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:N", "severity": "high", "base_score": 7.4}]}, "cvss_score": 7.4, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:N", "cwe": "CWE-347", "description": "Keycloak 是红帽主导开源的身份认证与访问管理系统，其 SAML 适配器（org.keycloak:keycloak-saml-adapter-core）用于为 Java 应用提供基于 SAML 2.0 协议的单点登录保护。\n受影响版本中，适配器的 handleLoginResponse 在处理登录响应时依次执行签名、Audience/Recipient 与时间条件校验，但未将 Response 与 Assertion 的 Issuer 元素同 keycloak-saml.xml 中配置的 IDP entityID 进行比对；当部署环境中多个身份提供方共享同一受信签名验证密钥时，控制其中一个身份提供方的攻击者可签发 Issuer 指向自身、NameID 伪造为任意用户的合法签名断言，该断言通过全部既有校验后在应用中以任意用户身份完成登录，可获取管理员权限。\n修复版本中通过在 handleLoginResponse 内新增 Issuer 绑定校验，要求 Response 级 Issuer（出现时）与 Assertion 级 Issuer 必须等于配置的 entityID，不匹配时判定认证失败；同时对 handleSamlRequest 处理的 LogoutRequest 增加相同校验，并收紧 saml-core 中 SAML2Signature.getNextSiblingOfIssuer 的 Issuer 定位逻辑，切断攻击者使用其他身份提供方签发断言登录应用的主链路。", "effects": [{"comp_name": "org.keycloak:keycloak-saml-adapter-core", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,26.8.2)", "min_fixed_version": "26.8.2", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "密码学签名的验证不恰当", "kind_en": "密码签名验证不当", "last_modified_time": "2026-11-06", "level": "High", "mps_id": "MPS-s1m3-24c8", "poc": false, "poc_url": [], "published_time": "2026-11-06", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-s1m3-24c8", "name": "https://www.oscs1024.com/hd/MPS-s1m3-24c8"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-93998", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-93998"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-93998", "name": ""}, {"url": "https://bugzilla.redhat.com/show_bug.cgi?id=2537164", "name": "RHBZ#2537164"}], "scope_influence": "", "tags": ["java", "开源"], "title": "Keycloak SAML适配器身份伪造漏洞", "_translated": true, "_saved_at": "2026-11-05T19:20:51+00:00", "_first_saved_at": "2026-11-05T19:20:51+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-s1m3-24c8"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-64894", "cvss": {"cvssv4": [{"source": "productsecurity@jci.com", "vector": "CVSS:4.0/AV:P/AC:H/AT:P/PR:L/UI:P/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.3}]}, "cvss_score": 7.3, "cvss_vector": "CVSS:4.0/AV:P/AC:H/AT:P/PR:L/UI:P/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-829", "description": "EasyIO Neo IO Manager 是 Johnson Controls 推出的商业楼宇自控配置与调试软件，非开源，随附 Tools-Installer 安装器分发，用于对 EasyIO Neo 系列边缘控制器进行配置、编程与仿真，并管理控制器输入输出与网络通信。\n受影响版本中，应用二进制文件与动态库未经数字签名且存放在用户可写目录（厂商检测指引指向 %APPDATA%\\EasyIONeoSeriesTools），具备本地目录写入能力的攻击者可用恶意二进制或库文件替换合法未签名组件，应用在启动时加载并执行被替换内容，最终以运行该应用的账户权限执行任意代码。\n修复版本中通过将全部二进制文件进行数字签名、迁移至 C:\\Program Files 等系统保护目录并强制应用 DLL 搜索顺序保护，阻止应用从用户可写路径加载库文件，切断了通过替换未签名组件实现代码执行的利用链路。", "effects": [{"comp_name": "easyio_neo_io_manager", "ecosystem": "linux", "versions": [{"affected_version": "[1.1.0.0,2.0.0.0)", "min_fixed_version": "2.0.0.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "easyio_neo_tools_installer", "ecosystem": "linux", "versions": [{"affected_version": "[1.1.0.0,2.0.0.0)", "min_fixed_version": "2.0.0.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "从非可信控制范围包含功能例程", "kind_en": "包含来自不可信控制领域的功能", "last_modified_time": "2026-11-06", "level": "High", "mps_id": "MPS-io2m-dqeg", "poc": false, "poc_url": [], "published_time": "2026-11-06", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-io2m-dqeg", "name": "https://www.oscs1024.com/hd/MPS-io2m-dqeg"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-64894", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-64894"}, {"url": "https://www.johnsoncontrols.com/trust-center/cybersecurity/security-advisories", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "EasyIO Neo IO Manager恶意组件替换漏洞", "_translated": true, "_saved_at": "2026-11-06T15:33:22+00:00", "_first_saved_at": "2026-11-06T15:33:22+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-io2m-dqeg"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-123184", "cvss": {"cvssv4": [{"source": "4760f414-e1ae-4ff1-bdad-c7a9c3538b79", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:N/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:N/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-863", "description": "Altium 365 是 Altium 公司推出的云端电子产品设计协作平台，为闭源商业 SaaS 服务，其 Git Service 组件为项目提供基于 Git 的仓库托管与推送访问能力。\n受影响版本中，Git Service 在用户向项目仓库执行推送时进行的权限检查未按所需访问级别评估，只要用户持有该项目任意级别的访问权限即可通过校验，持有查看权限的已认证账号可向目标项目仓库写入内容，未授权写入会破坏仓库数据的完整性与可用性；仓库读取访问控制未受影响。\n修复版本中通过在服务端修正推送权限检查的访问级别评估完成修复，推送操作重新按所需访问级别进行校验，官方确认 Altium 365 无需客户执行任何操作，本地部署的 Altium Enterprise Server 不受影响。", "effects": [{"comp_name": "Altium 365", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,unspecified]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-11-06", "level": "High", "mps_id": "MPS-hlnr-j579", "poc": false, "poc_url": [], "published_time": "2026-11-06", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-hlnr-j579", "name": "https://www.oscs1024.com/hd/MPS-hlnr-j579"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-123184", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-123184"}, {"url": "https://www.altium.com/platform/security-compliance/security-advisories", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Altium 365 Git Service 越权写入漏洞", "_translated": true, "_saved_at": "2026-11-05T19:20:56+00:00", "_first_saved_at": "2026-11-05T19:20:56+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-hlnr-j579"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-97847", "cvss": {"cvssv31": [{"source": "secalert@redhat.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:L", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:L", "cwe": "CWE-287", "description": "Keycloak 是 Red Hat 主导的开源身份认证与访问管理系统，支持 OIDC 与 SAML 单点登录、服务账号客户端凭证以及 Admin REST API，漏洞相关的核心服务实现位于 keycloak-services 模块。\n受影响版本中，持有目标 OIDC 客户端 manage-clients 权限的客户端管理员可通过 Admin REST API 为该客户端添加 hardcoded-claim 协议映射器，覆盖其服务账号令牌中的 sub 与 preferred_username 声明；客户端凭证令牌默认不含 sessionState（无 sid），Admin REST API 认证时经 UserSessionUtil 进入 TokenManager.lookupUserFromStatelessToken，先按 sub 查找用户，失败后回退按 preferred_username 查找任意同名用户且未校验其是否为该客户端的服务账号，令牌持有者随即被替换为真实管理域管理员的 UserModel，绕过 CVE-2026-4629 引入的角色剥离防御，攻击者可凭管理域管理员身份调用 Admin REST API 枚举、创建或删除用户并完全接管管理域。\n修复版本中通过在协议映射器 CRUD 入口（ProtocolMappersResource 与客户端、客户端作用域管理端点）统一新增 requireManageProtocolMappers 校验，仅持有 manage-realm 角色的管理员可不受限管理协议映射器，其余管理员只能操作管理域属性 ALLOWED_PROTOCOL_MAPPER_TYPES_FOR_CLIENT_ADMINISTRATORS 白名单内的映射器类型（默认为空即全部拒绝），并经 Client Registration Policies 默认禁止动态客户端注册创建协议映射器，切断攻击者注入身份声明映射器的路径，主体替换攻击链随之失效。", "effects": [{"comp_name": "keycloak", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,26.8.2)", "min_fixed_version": "26.8.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "身份验证不当", "kind_en": "认证不当", "last_modified_time": "2026-11-06", "level": "High", "mps_id": "MPS-t2mr-wzq0", "poc": false, "poc_url": [], "published_time": "2026-11-06", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-t2mr-wzq0", "name": "https://www.oscs1024.com/hd/MPS-t2mr-wzq0"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-97847", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026 "2026-11-07", "level": "High", "mps_id": "MPS-dhgo-e51i", "poc": false, "poc_url": [], "published_time": "2026-11-07", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-dhgo-e51i", "name": "https://www.oscs1024.com/hd/MPS-dhgo-e51i"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-65960", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-65960"}, {"url": "https://github.com/cilium/tetragon/security/advisories/GHSA-6qqg-3qf7-p3v5", "name": "https://github.com/cilium/tetragon/security/advisories/GHSA-6qqg-3qf7-p3v5"}, {"url": "https://github.com/cilium/tetragon/pull/4882", "name": "https://github.com/cilium/tetragon/pull/4882"}, {"url": "https://github.com/cilium/tetragon/commit/8e89933d3526f37c04f7523013ff32f8b1c6f62a", "name": "https://github.com/cilium/tetragon/commit/8e89933d3526f37c04f7523013ff32f8b1c6f62a"}, {"url": "https://github.com/cilium/tetragon/commit/fe46101770b960ebbf39fe9749bb20d49cf178b2", "name": "https://github.com/cilium/tetragon/commit/fe46101770b960ebbf39fe9749bb20d49cf178b2"}, {"url": "https://github.com/cilium/tetragon/releases/tag/v1.7.0", "name": "https://github.com/cilium/tetragon/releases/tag/v1.7.0"}], "scope_influence": "", "tags": ["应用软件"], "title": "Tetragon gRPC接口未授权访问", "_translated": true, "_saved_at": "2026-11-06T21:12:52+00:00", "_first_saved_at": "2026-11-06T21:12:52+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-dhgo-e51i"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-33050", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-78", "description": "GeoNode 是开源地理空间内容管理系统，用于管理与发布地理空间数据，支持通过上传接口导入矢量数据文件并写入空间数据库。\n受影响版本中，矢量文件上传后其图层名会进入 ogr2ogr 命令拼接流程，geonode/upload/handlers/common/vector.py 的 create_ogr2ogr_command 将图层名 alternate 以未转义形式拼入 -nln 参数，import_with_ogr2ogr 随后以 Popen(shell=True) 执行整条命令字符串，具备数据上传权限的低权限远程用户上传图层名携带 shell 语法的矢量文件后，可在 GeoNode 服务器上执行任意操作系统命令。\n修复版本中通过在 create_ogr2ogr_command 使用 shlex.quote 转义输入文件路径与图层名，import_with_ogr2ogr 改用 shlex.split 构造参数列表并以 shell=False 执行 ogr2ogr，OGR2OGR_COPY_WITH_DUMP 场景下的 psql 管道改为 Python 内进程对接且 PGPASSWORD 经环境变量传递，切断了图层名进入 shell 解析的路径。", "effects": [{"comp_name": "GeoNode", "ecosystem": "pip", "versions": [{"affected_version": "(-∞,5.1.0)", "min_fixed_version": "5.1.0", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-11-07", "level": "High", "mps_id": "MPS-iab8-pqey", "poc": false, "poc_url": [], "published_time": "2026-11-07", "reference_url_list": [{"url": "https://github.com/GeoNode/geonode/security/advisories/GHSA-9fpx-fr6j-2vh6", "name": ""}, {"url": "https://github.com/GeoNode/geonode/commit/1408290c0bb54872924a9b334a516db9758a2180", "name": ""}, {"url": "https://github.com/advisories/GHSA-9fpx-fr6j-2vh6", "name": ""}], "scope_influence": "", "tags": ["python", "开源"], "title": "GeoNode 命令注入漏洞", "_translated": true, "_saved_at": "2026-11-06T21:12:55+00:00", "_first_saved_at": "2026-11-06T21:12:55+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-iab8-pqey"}]}</script>
  <script>
    const payload = JSON.parse(document.getElementById("payload").textContent);
    const levelLabels = payload.level_labels || {};
    const items = payload.items || [];
    let filtered = items.slice();
    let activeId = null;

    const $ = (id) => document.getElementById(id);
    $("generatedAt").textContent = payload.generated_at || "-";
    $("retention").textContent = payload.retention_days ?? "-";
    $("cutoff").textContent = payload.cutoff_date || "-";
    $("count").textContent = String(payload.count ?? items.length);

    function levelClass(level) {
      const cn = levelLabels[level] || level || "";
      if (level === "Critical" || cn === "严重") return "crit";
      if (level === "High" || cn === "高危") return "high";
      return "other";
    }
    function levelText(level) {
      return levelLabels[level] || level || "-";
    }
    function esc(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }
    function scoreText(v) {
      if (v === null || v === undefined || v === "" || v === -1) return "-";
      return String(v);
    }

    function renderList() {
      const list = $("list");
      $("listCount").textContent = String(filtered.length);
      if (!filtered.length) {
        list.innerHTML = '<div class="empty">没有匹配项</div>';
        return;
      }
      list.innerHTML = filtered.map((it) => {
        const id = it.mps_id || it.cve_id;
        const active = id === activeId ? " active" : "";
        return `
          <button class="item${active}" data-id="${esc(id)}" type="button">
            <div class="item-top">
              <span class="cve">${esc(it.cve_id || it.mps_id || "-")}</span>
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
            </div>
            <div class="title">${esc(it.title || "-")}</div>
            <div class="item-foot">
              <span>CVSS ${esc(scoreText(it.cvss_score))}</span>
              <span>${esc(it.published_time || "-")}</span>
              ${it.poc ? "<span>POC</span>" : ""}
            </div>
          </button>`;
      }).join("");
      list.querySelectorAll(".item").forEach((btn) => {
        btn.addEventListener("click", () => selectById(btn.dataset.id));
      });
    }

    function refsHtml(it) {
      const refs = Array.isArray(it.reference_url_list) ? it.reference_url_list : [];
      const links = [];
      if (it._source_page) links.push({ url: it._source_page, name: "OSCS 详情" });
      if (it.cve_id) links.push({ url: `https://nvd.nist.gov/vuln/detail/${it.cve_id}`, name: "NVD" });
      refs.forEach((r) => {
        if (r && r.url) links.push({ url: r.url, name: r.name || r.url });
      });
      const seen = new Set();
      const uniq = [];
      for (const l of links) {
        if (seen.has(l.url)) continue;
        seen.add(l.url);
        uniq.push(l);
      }
      if (!uniq.length) return '<div class="box">无参考链接</div>';
      return `<div class="refs">${uniq.map((l) =>
        `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name || l.url)}</a>`
      ).join("")}</div>`;
    }

    function articlesHtml(it) {
      const arts = Array.isArray(it.articles) ? it.articles : [];
      if (!arts.length) return "";
      return `<div class="section"><h3>相关说明</h3>${arts.map((a) => `
        <div class="article">
          <h4>${esc(a.title || "说明")}</h4>
          <p>${esc(a.content || "")}</p>
        </div>`).join("")}</div>`;
    }

    function renderDetail(it) {
      const detail = $("detail");
      if (!it) {
        detail.innerHTML = '<div class="empty">暂无数据</div>';
        return;
      }
      const pocUrls = Array.isArray(it.poc_url) ? it.poc_url : [];
      detail.innerHTML = `
        <div class="d-head">
          <div>
            <h1 class="d-title">${esc(it.title || "-")}</h1>
            <div class="ids">
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
              <span class="chip">${esc(it.cve_id || "无 CVE")}</span>
              <span class="chip">${esc(it.mps_id || "-")}</span>
              ${it.poc ? '<span class="chip">有 POC</span>' : ""}
              ${it.exp ? '<span class="chip">有 EXP</span>' : ""}
            </div>
          </div>
          <div class="actions">
            ${it._source_page ? `<a class="btn" href="${esc(it._source_page)}" target="_blank" rel="noopener">OSCS</a>` : ""}
            ${it.cve_id ? `<a class="btn" href="https://nvd.nist.gov/vuln/detail/${esc(it.cve_id)}" target="_blank" rel="noopener">NVD</a>` : ""}
          </div>
        </div>
        <div class="grid">
          <div class="stat"><div class="k">CVSS</div><div class="v">${esc(scoreText(it.cvss_score))}</div></div>
          <div class="stat"><div class="k">向量</div><div class="v">${esc(it.cvss_vector || "-")}</div></div>
          <div class="stat"><div class="k">CWE</div><div class="v">${esc(it.cwe || "-")}</div></div>
          <div class="stat"><div class="k">类型</div><div class="v">${esc(it.kind || it.kind_en || "-")}</div></div>
          <div class="stat"><div class="k">公开</div><div class="v">${esc(it.published_time || "-")}</div></div>
          <div class="stat"><div class="k">利用成本</div><div class="v">${esc(it.exploit_requirement_cost || "-")}</div></div>
          <div class="stat"><div class="k">可利用性</div><div class="v">${esc(it.exploitability || "-")}</div></div>
          <div class="stat"><div class="k">修复建议</div><div class="v">${esc(it.fix_suggestion || "-")}</div></div>
        </div>
        <div class="section"><h3>描述</h3><div class="box">${esc(it.description || "无描述")}</div></div>
        ${it.scope_influence ? `<div class="section"><h3>影响范围</h3><div class="box">${esc(it.scope_influence)}</div></div>` : ""}
        ${pocUrls.length ? `<div class="section"><h3>POC 链接</h3><div class="refs">${pocUrls.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join("")}</div></div>` : ""}
        <div class="section"><h3>参考链接</h3>${refsHtml(it)}</div>
        ${articlesHtml(it)}
      `;
    }

    function selectById(id) {
      const it = filtered.find((x) => (x.mps_id || x.cve_id) === id) ||
                 items.find((x) => (x.mps_id || x.cve_id) === id);
      if (!it) return;
      activeId = it.mps_id || it.cve_id;
      renderList();
      renderDetail(it);
      const btn = document.querySelector(`.item[data-id="${CSS.escape(activeId)}"]`);
      if (btn) btn.scrollIntoView({ block: "nearest" });
      history.replaceState(null, "", "#" + encodeURIComponent(activeId));
    }

    function applyFilter(q) {
      const query = (q || "").trim().toLowerCase();
      filtered = !query ? items.slice() : items.filter((it) => {
        const blob = [
          it.cve_id, it.mps_id, it.title, it.kind, it.kind_en, it.cwe, it.description, it.level
        ].map((x) => String(x || "").toLowerCase()).join(" ");
        return blob.includes(query);
      });
      renderList();
      if (filtered.length) {
        const still = filtered.some((x) => (x.mps_id || x.cve_id) === activeId);
        selectById(still ? activeId : (filtered[0].mps_id || filtered[0].cve_id));
      } else {
        activeId = null;
        renderDetail(null);
      }
    }

    $("search").addEventListener("input", (e) => applyFilter(e.target.value));

    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement !== $("search")) {
        e.preventDefault();
        $("search").focus();
        return;
      }
      if (!filtered.length) return;
      const idx = filtered.findIndex((x) => (x.mps_id || x.cve_id) === activeId);
      if (e.key === "ArrowDown") {
        e.preventDefault();
        const next = filtered[Math.min(filtered.length - 1, Math.max(0, idx) + 1)];
        selectById(next.mps_id || next.cve_id);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        const prev = filtered[Math.max(0, idx - 1)];
        selectById(prev.mps_id || prev.cve_id);
      }
    });

    const hashId = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    if (hashId && items.some((x) => (x.mps_id || x.cve_id) === hashId)) {
      activeId = hashId;
      renderList();
      selectById(hashId);
    } else if (items.length) {
      selectById(items[0].mps_id || items[0].cve_id);
    } else {
      renderList();
      renderDetail(null);
    }
  </script>
</body>
</html>
