status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-120306", "cvss": {"cvssv31": [{"source": "reefs@jfrog.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.9}]}, "cvss_score": 9.9, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "cwe": "CWE-653", "description": "Beta9 是 Beam Cloud 开源的面向 AI 与机器学习工作负载的无服务器 GPU 计算平台，租户通过网关提交镜像定义，由 worker 节点使用 Buildah 完成容器镜像构建。\n受影响版本中，worker 镜像以环境变量 BUILDAH_ISOLATION=chroot 运行 Buildah，分层构建的 RUN 步骤与 WORKDIR 建目录命令均未传入 --isolation 参数，租户命令仅切换文件系统根目录，继续沿用特权 worker pod 的 PID、IPC、网络与用户命名空间，并以 uid 0 携带 CAP_DAC_OVERRIDE 运行；此时 /proc/1/root 指向可写的 worker 容器文件系统，其中包含 worker 用来启动租户容器的 runc、buildah、runsc 二进制、worker 的 Kubernetes ServiceAccount 令牌以及挂载进 pod 的宿主机目录，持有效 workspace token 的租户提交一次镜像构建，便能写入这些对象，从构建步骤逃逸至特权 worker 并进一步威胁集群。\n修复版本中通过 buildahIsolationArgs 为所有 buildah run 与 bud 调用追加 --isolation=oci、--pid=private、--ipc=private、--network=private，buildahEnv 显式设置 BUILDAH_ISOLATION=oci，租户 ARG 值改为仅传入构建容器内部，worker 镜像同步安装 CNI 插件以支持私有网络，RUN 步骤因此获得独立的 PID、IPC 与网络命名空间，租户输入不再作用于 worker 进程与其文件系统，逃逸链路被切断。", "effects": [{"comp_name": "beta9", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,0.1.756)", "min_fixed_version": "0.1.756", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "不充分的划分", "kind_en": "不适当的隔离或划分", "last_modified_time": "2026-11-01", "level": "Critical", "mps_id": "MPS-zdih-6v5m", "poc": false, "poc_url": [], "published_time": "2026-11-01", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-zdih-6v5m", "name": "https://www.oscs1024.com/hd/MPS-zdih-6v5m"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-120306", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-120306"}, {"url": "https://github.com/beam-cloud/beta9", "name": "Beta9 repository"}, {"url": "https://github.com/beam-cloud/beta9/pull/1897", "name": "Handle sandbox edge cases (fix pull request)"}, {"url": "https://github.com/beam-cloud/beta9/commit/a28bf12cf0007c792a25d8ed282b4e8bf6f30393", "name": "Fix commit a28bf12"}, {"url": "https://github.com/beam-cloud/beta9/releases/tag/worker-0.1.756", "name": "worker-0.1.756"}], "scope_influence": "", "tags": ["AI", "应用软件"], "title": "Beta9 镜像构建容器逃逸", "_translated": true, "_saved_at": "2026-11-01T15:40:55+00:00", "_first_saved_at": "2026-11-01T15:40:55+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-zdih-6v5m"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过向受信任的数据序列化过程中添加恶意数据，从而在序列化和反序列化过程中执行恶意代码的攻击漏洞。这种漏洞通常存在于使用序列化 (serialization) 机制存储和传输数据的程序中。\n", "title": "什么是反序列化"}, {"content": "- 注入攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码注入到程序中，从而实现代码执行的目的。\n- 反射攻击：攻击者使用反射机制，在序列化过程中动态生成恶意数据，并将恶意代码注入到程序中，从而实现代码执行的目的。\n- 缓冲区溢出攻击：攻击者通过在序列化过程中向缓冲区输入恶意数据，导致缓冲区溢出，从而破坏程序的内存管理，实现代码执行的目的。\n- 格式字符串攻击：攻击者通过在序列化过程中输入恶意数据，导致程序使用错误的格式字符串，从而实现代码执行的目的。\n- 数据流攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码作为一个数据流传递给程序，从而实现代码执行的目的。\n", "title": "反序列化常见的攻击方式"}, {"content": "- 不信任输入数据：程序应该严格检查输入数据的有效性，并避免使用不受信任的数据。\n- 使用安全的序列化机制：程序应该使用安全的序列化机制，如 JSON 或 XML 序列化，而不是第三方序列化库。\n- 最小特权原则：程序应该限制对受信任数据的处理权限，并避免在运行时修改数据。\n- 代码审查和漏洞扫描：程序应该进行代码审查和漏洞扫描，以发现和修复潜在的安全漏洞。\n", "title": "如何预防反序列化"}], "cnvd_id": "", "cve_id": "CVE-2026-118636", "cvss": {"cvssv31": [{"source": "security@apache.org", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-502", "description": "Apache MINA 是 Apache 软件基金会开源的 Java 网络应用框架，用于构建高性能网络服务，其 3.0 开发线提供了独立的 codec 模块（Maven 坐标 org.apache.mina:mina-codec），模块内的 JavaNativeMessageDecoder 提供基于 Java 原生序列化的消息解码器。\n受影响版本中，JavaNativeMessageDecoder 的 decode 方法将网络帧字节通过 asInputStream() 直接包装为 java.io.ObjectInputStream 并调用 readObject()，全过程未配置 ObjectInputFilter 或任何类白名单校验，应用将该解码器部署在不可信对端前方时，攻击者发送的序列化数据可实例化任意可反序列化类并执行 gadget 调用链，最终导致远程代码执行。\n修复版本中通过，官方已确认 3.0.0 分支处于不活跃状态并不再发布修复版本，受影响版本在 3.0 线内无修复可用，可通过迁移至仍在维护的 Apache MINA 2.2.X 最新分支切断风险，无法立即迁移的应用应停止使用 JavaNativeMessageDecoder 处理不可信网络数据并收紧相关端口的访问控制。", "effects": [{"comp_name": "mina", "ecosystem": "linux", "versions": [{"affected_version": "[3.0.0-M1,3.0.0-M2]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "org.apache.mina:mina-codec", "ecosystem": "maven", "versions": [{"affected_version": "[3.0.0-M1,3.0.0-M2]", "min_fixed_version": "", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "反序列化", "kind_en": "不可信数据的反序列化", "last_modified_time": "2026-10-31", "level": "Critical", "mps_id": "MPS-b091-655f", "poc": false, "poc_url": [], "published_time": "2026-11-01", "reference_url_list": [{"url": "https://seclists.org/oss-sec/2026/q4/457", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-118636", "name": ""}, {"url": "https://mina.apache.org/", "name": ""}, {"url": "https://github.com/apache/mina/blob/3.0.0-M2/codec/src/main/java/org/apache/mina/codec/delimited/serialization/JavaNativeMessageDecoder.java", "name": ""}, {"url": "https://repo1.maven.org/maven2/org/apache/mina/mina-codec/", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "Apache MINA反序列化RCE漏洞", "_translated": true, "_saved_at": "2026-10-31T22:22:22+00:00", "_first_saved_at": "2026-10-31T22:22:22+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-b091-655f"}, {"analysis_status": 0, "articles": [{"content": "- 命令注入是一种攻击，其目标是通过易受攻击的应用程序在主机操作系统上执行任意命令。 当应用程序将不安全的用户提供的数据（表单、cookie、HTTP 标头等）传递到系统 shell 时，就会产生缺陷。攻击者通过构造恶意的命令或数据，将其注入到程序执行的上下文中，从而绕过程序的输入验证和安全措施，实现对程序操作的恶意操作。", "title": "什么是命令注入"}, {"content": "- 文件上传：攻击者通过构造恶意的文件上传请求，将包含恶意命令的文件上传到服务器，从而利用命令注入漏洞执行恶意命令。\n- SQL 注入：攻击者通过构造恶意的 SQL 查询语句，将包含恶意命令的 SQL 语句注入到数据库中，从而执行恶意命令，窃取数据或者破坏系统。\n- 命令执行：攻击者通过在 Web 应用程序的表单提交数据中注入恶意命令，从而执行恶意命令，例如删除文件、格式化硬盘等。\n- 命令注入漏洞的旁路攻击：攻击者可以利用命令注入漏洞旁路控制程序的执行流程，从而窃取数据、破坏系统、控制程序等。\n", "title": "命令注入常见的攻击方式"}, {"content": "- 输入验证：在程序输入处对输入数据进行严格的验证和过滤，确保输入数据符合预期的格式和类型，避免被攻击者注入恶意命令。\n- 输出过滤：在程序输出处对输出数据进行严格的过滤和检查，确保输出数据符合预期的格式和类型，避免被攻击者截获和篡改。\n- 使用安全的编程模型：使用安全的编程模型，例如避免使用原生的命令执行方式，使用安全的框架和库来处理输入数据和执行命令，避免命令注入漏洞。\n- 数据库加密和访问控制：对于敏感数据和命令，使用加密和访问控制措施，确保只有授权用户可以访问和执行命令，避免被攻击者窃取和篡改。\n- 定期更新和升级：定期更新和升级应用程序和库的版本，确保应用程序和库的最新版本包含了最新的安全补丁和修复措施，避免安全漏洞的出现和利用。\n- 安全审计和监控：定期对系统和应用程序进行安全审计和监控，及时发现和阻止潜在的安全漏洞和攻击，确保系统和数据的安全和可靠性。", "title": "如何预防命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-120198", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:N/AC:L/Au:N/C:C/I:C/A:C", "severity": "high", "base_score": 10}], "cvssv3": [{"source": "VulDB", "vector": "CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H/E:P/RL:X/RC:R", "severity": "critical", "base_score": 10}], "cvssv31": [{"source": "cna@vuldb.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 10}], "cvssv4": [{"source": "cna@vuldb.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-77", "description": "WAVLINK WL-WN530BE1-A 是 WAVLINK 推出的无线路由器，固件为闭源嵌入式软件，内置 ioos 二进制提供的 Web 管理服务，通过 /protocol.csp 接口处理配置请求。\n受影响版本中，固件将 HTTP 请求头 IP-FROM 的值写入 con-\u003eip_from，con_check_read_finish 以该值等于 127.0.0.1 作为跳过登录校验的条件，攻击者伪造该请求头后可以未授权访问管理接口；ioos 二进制的 sub_27B20 在处理 opt=wireguard_cli_group\u0026function=set\u0026action=add 请求时，通过 snprintf 将参数 group_name 包裹单引号后直接拼入 system() 执行，未做任何过滤，远程攻击者最终可以 root 权限执行任意命令。\n修复版本中通过改用 socket 对端地址校验登录来源并过滤 group_name、移除 system() 拼接可切断该 :X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-321", "description": "AJ-Report 是开源的 Java Web 报表与数据大屏平台，提供数据集查询、数据转换和大屏分享功能，在企业内网报表场景中广泛部署。\n受影响版本中，report-core 模块的 JwtUtil 类使用硬编码常量 JWT_SECRET（值为 aj-report）对分享令牌执行 HMAC256 签名与验签，攻击者可离线伪造任意 Share-Token；TokenFilter 对分享令牌的放行判断仅检查 reportCode 声明是否为请求 URI 的子串（reportCodeList.stream().noneMatch(uri::contains)），令牌中携带 reportCode=dataSet 即可让 /dataSet/testTransform 请求跳过登录与权限校验；该接口再把请求体中的 transformScript 交给 GroovyTransformServiceImpl，经 groovyClassLoader.parseClass 编译并由 newInstance 实例化，Groovy 类静态初始化块中的任意 Java 代码随即执行，构成未授权远程代码执行。\n修复版本中通过将 JWT 密钥移出源码改为外部强随机配置、按精确路径匹配分享令牌并为数据转换接口增加独立鉴权，可切断伪造令牌进入 Groovy 执行的链路；截至 2026-11-01 上游尚未发布包含修复的版本，最新发布版本 V1.7.1 仍受影响，官方修复发布前建议优先采取缓解措施。", "effects": [{"comp_name": "aj_report", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.7.1]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "使用硬编码的密码学密钥", "kind_en": "使用硬编码密钥", "last_modified_time": "2026-11-01", "level": "Critical", "mps_id": "MPS-nkbz-g4st", "poc": false, "poc_url": [], "published_time": "2026-11-01", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-nkbz-g4st", "name": "https://www.oscs1024.com/hd/MPS-nkbz-g4st"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-120209", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-120209"}, {"url": "https://gitee.com/belief-team/report/issues/IKRV6T", "name": ""}, {"url": "https://gitee.com/belief-team/report/blob/V1.7.1/report-core/src/main/java/com/anjiplus/template/gaea/business/util/JwtUtil.java", "name": ""}, {"url": "https://gitee.com/belief-team/report", "name": ""}, {"url": "https://www.vulncheck.com/advisories/aj-report-through-1.7.1-authentication-bypass-leading-to-rce-via-share-token", "name": "VulnCheck Advisory: AJ-Report through 1.7.1 Authentication Bypass leading to RCE via Share-Token"}], "scope_influence": "", "tags": ["应用软件"], "title": "AJ-Report硬编码密钥未授权RCE漏洞", "_translated": true, "_saved_at": "2026-10-31T22:22:26+00:00", "_first_saved_at": "2026-10-31T18:59:29+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-nkbz-g4st"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-120195", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:N/AC:L/Au:N/C:C/I:C/A:C", "severity": "high", "base_score": 10}], "cvssv3": [{"source": "VulDB", "vector": "CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H/E:P/RL:X/RC:R", "severity": "critical", "base_score": 10}], "cvssv31": [{"source": "cna@vuldb.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 10}], "cvssv4": [{"source": "cna@vuldb.com", "vector": "CVSS:4.0/AV:N/AC:L/A -02", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-0473-evk1", "name": "https://www.oscs1024.com/hd/MPS-0473-evk1"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2025-11969", "name": "https://nvd.nist.gov/vuln/detail/CVE-2025-11969"}, {"url": "https://security.docs.wso2.com/en/latest/security-announcements/security-advisories/2026/WSO2-2025-4733/", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "WSO2系统API越权漏洞", "_translated": true, "_saved_at": "2026-11-02T07:04:14+00:00", "_first_saved_at": "2026-11-02T07:04:14+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-0473-evk1"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-62048", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:N/A:L", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:N/A:L", "cwe": "CWE-89", "description": "BookIt（插件标识 bookit）是 Liquid Web / StellarWP 开源的 WordPress 预约日历插件，以 GPLv2 或更高协议通过 WordPress 官方插件目录分发，用于管理员工、服务与客户的预约排期，其前端预约流程通过 admin-ajax 注册的无需登录 AJAX 接口完成。\n受影响版本中，bookit_book_appointment 等预约接口被注册为 wp_ajax_nopriv 动作并向未登录访客开放，2.6.0.7 之前的输入清洗规则未对 date_timestamp、start_time、end_time 做类型约束；员工服务关联查询 Staff_Services::get_staff_services 又把 implode 拼接的编号列表以未加引号的形式填入 WHERE staff_id IN (…) 片段，仅依赖只转义引号类字符的 esc_sql 过滤，不含引号的注入载荷可原样并入 SQL 语句，未认证攻击者可借此读取、篡改或删除数据库数据。\n修复版本中通过在 Staff_Services::get_staff_services 中改用 implode( ',', array_map( 'absint', $staffIds ) ) 重建 IN 列表，将元素强制为非负整数，并为 date_timestamp、start_time、end_time 补充 intval 清洗规则、在预约数据入库前强制整数转换，同时以服务端 validate() 返回的价格作为权威值，切断了未加引号拼接 SQL 的注入路径。", "effects": [{"comp_name": "bookit", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.6.0.7)", "min_fixed_version": "2.6.0.7", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-11-02", "level": "Critical", "mps_id": "MPS-cqwd-n3ml", "poc": false, "poc_url": [], "published_time": "2026-11-02", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-cqwd-n3ml", "name": "https://www.oscs1024.com/hd/MPS-cqwd-n3ml"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-62048", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-62048"}, {"url": "https://patchstack.com/database/wordpress/plugin/bookit/vulnerability/wordpress-bookit-plugin-2-6-0-6-sql-injection-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "BookIt 插件 SQL 注入漏洞", "_translated": true, "_saved_at": "2026-11-01T20:03:51+00:00", "_first_saved_at": "2026-11-01T20:03:51+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-cqwd-n3ml"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n V:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-94", "description": "ShowDoc 是一款开源（Apache-2.0 许可）的在线 API 文档与团队知识库工具，服务端基于 PHP 与 ThinkPHP 框架实现，并附带独立的 Node.js Mock 数据服务（mock/index.js，默认监听 7123 端口），用于按用户保存的模板渲染接口模拟数据。\n受影响版本中，登录用户通过 server/Application/Api/Controller/MockController.class.php 的 add 接口保存 Mock 模板，该接口仅校验 JSON 语法后入库；MockController::infoByKey 在无需登录的情况下读取存量模板并转发至本机 mock 服务，mock/index.js 将模板 JSON.parse 后直接交给 Mock.mock() 渲染；mockjs 对 @name(参数) 形式的占位符会把参数拼接进 eval() 求值，攻击者在模板中以 \\u0028、\\u0029 转义括号绕过占位符正则，经 constructor 属性链取得 Function 构造器并调用 child_process 模块，最终以 mock 进程的权限执行任意系统命令，官方 Docker 镜像中该进程以 root 运行。\n修复版本中通过在调用 Mock.mock 前新增 isSafeMockTemplate 白名单校验切断上述链条：占位符参数仅允许数字、字符串字面量、布尔值、null、裸标识符与字面量数组，整体拒绝反引号、\\u 转义以及占位符名后跟 . 或 [ 的属性链访问，使转义括号构造的调用无法进入 eval；PHP 侧在 add、infoByKey、infoByPath 中同步加入等价的 mockTemplateIsSafe 校验以覆盖历史存量模板，unique_key 改用 random_bytes 随机生成，mock 服务默认仅绑定 127.0.0.1，并在官方容器中改以低权用户 mockmock 运行。", "effects": [{"comp_name": "showdoc", "ecosystem": "linux", "versions": [{"affected_version": "[2.8.14,3.9.6)", "min_fixed_version": "3.9.6", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "代码注入", "kind_en": "代码生成控制不当（“代码注入”）", "last_modified_time": "2026-11-01", "level": "High", "mps_id": "MPS-sj0w-kdgm", "poc": false, "poc_url": [], "published_time": "2026-11-01", "reference_url SI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-119", "description": "Horizon DataSys Reboot Restore Standard 是 Horizon DataSys 公司推出的商业重启还原软件（闭源），依托 shield.sys 内核磁盘过滤驱动在每次重启后将系统恢复到受保护状态，常用于公共机房、企业与教育场景的批量终端还原。\n受影响版本中，shield.sys 驱动创建的 \\Device\\EAZShield 设备对象未配置安全描述符，IRP_MJ_CREATE 不做访问检查，任意经过身份验证的本地用户均可打开该设备；其 IOCTL 0x96102014 派发逻辑中的 sub_23908 函数在处理子命令 0xF0016（魔术值 'wCMD'）时，将输入缓冲区 +0x48 处用户可控的 64 位地址与 +0x44 处的长度直接交给内核内存拷贝，既未调用 ProbeForRead/ProbeForWrite 校验用户态指针，也未对长度做边界检查，仅依赖 MmIsAddressValid 判断地址有效性，攻击者可据此获得任意内核内存读写原语，改写 System 进程 Token 将自身权限提升至 SYSTEM。\n修复版本中通过，可通过限制不可信本地账户登录受影响主机、按最小权限原则管控终端用户并及时关注 Horizon DataSys 官方版本更新来降低风险；官方已表示将在即将发布的版本中提供修复。", "effects": [{"comp_name": "reboot_restore_standard", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,13.2]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "高", "fix_suggestion": "可选修复", "kind": "缓冲区溢出", "kind_en": "内存缓冲区范围内的操作限制不当", "last_modified_time": "2026-11-01", "level": "High", "mps_id": "MPS-xgm1-zft5", "poc": true, "poc_url": [], "published_time": "2026-11-01", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-xgm1-zft5", "name": "https://www.oscs1024.com/hd/MPS-xgm1-zft5"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-120232", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-120232"}, {"url": "https://vuldb.com/vuln/429591", "name": "VDB-429591 | Horizon DataSys Reboot Restore Standard Kernel Driver shield.sys sub_23908 memory corruption"}, {"url": "https://vuldb.com/vuln/429591/cti", "name": "VDB-429591 | CTI Indicators (IOB, IOC, IOA)"}, {"url": "https://vuldb.com/cve/CVE-2026-120232", "name": "CVE-2026-120232 | CVE Analysis and Report"}, {"url": "https://vuldb.com/submit/1001497", "name": "Submit #1001497 | Horizon DataSys Reboot Restore Standard v13.2 (and prior) Improper Input Validation"}, {"url": "https://gist.github.co 节宽度与列偏移，经 memcpy_to_native_endian() 对两个色度平面同时写入。当文件声明 Cb 为 16 bit、Cr 为 8 bit 时，按每样本 1 字节分配的 Cr 平面持续收到 2 字节宽度写入，写入内容为攻击者可控的色度样本字节，构成随色度平面尺寸重复放大的堆越界写入，可破坏堆内存并在图像处理管线中导致代码执行。\n修复版本中通过在 ChannelListEntry 中以 chroma[2] 数组分别记录两个色度平面的指针、行跨度与各自字节宽度，processTile() 按每个色度样本所属平面自身的宽度与跨度写入，消除了以单一字节宽度写两个平面的越界路径，并新增 Y8/Cb16/Cr8 混合隔行回归测试覆盖该场景。", "effects": [{"comp_name": "libheif", "ecosystem": "linux", "versions": [{"affected_version": "[1.18.0,1.23.3)", "min_fixed_version": "1.23.3", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "堆缓冲区溢出", "kind_en": "基于堆的缓冲区溢出", "last_modified_time": "2026-11-01", "level": "High", "mps_id": "MPS-c3pl-m0rt", "poc": false, "poc_url": [], "published_time": "2026-11-01", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-c3pl-m0rt", "name": "https://www.oscs1024.com/hd/MPS-c3pl-m0rt"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-120208", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-120208"}, {"url": "https://github.com/strukturag/libheif/security/advisories/GHSA-x8r2-mggj-j6wr", "name": "GitHub Security Advisory (GHSA-x8r2-mggj-j6wr)"}, {"url": "https://github.com/strukturag/libheif/commit/9d3cd91d7b1c8c68deef6d06057ab956bcb0dfb9", "name": ""}, {"url": "https://github.com/strukturag/libheif/releases/tag/v1.23.3", "name": "libheif v1.23.3 Release Notes"}, {"url": "https://github.com/strukturag/libheif/blob/v1.23.2/libheif/codecs/uncompressed/unc_decoder_mixed_interleave.cc#L95", "name": ""}, {"url": "https://www.vulncheck.com/advisories/libheif-1.18.0-before-1.23.3-heap-buffer-overflow-via-unci-mixed-interleave-decoder", "name": "VulnCheck Advisory: libheif 1.18.0 before 1.23.3 Heap Buffer Overflow via unci Mixed-Interleave Decoder"}], "scope_influence": "", "tags": ["开源"], "title": "libheif unci解码堆越界写入漏洞", "_translated": true, "_saved_at": "2026-10-31T22:22:25+00:00", "_first_saved_at": "2026-10-31T18:59:30+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-c3pl-m0rt"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-118147", "cvss": {"cvssv31": [{"source": "secure@microsoft.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:N", "severity": "high", "base_score": 7.4}]}, "cvss_score": 7.4, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:N", "cwe": "CWE-295", "description": "Microsoft Visual Studio 是微软开发的闭源集成开发环境，广泛用于 Windows 平台上的 .NET、C++ 等应用开发，其组件在访问远程资源时依赖 HTTPS 证书校验保障通信安全。\n受影响版本中，Visual Studio 与远程资源建立连接时对服务器证书校验不当，未授权攻击者位于目标主机与所请求资源之间的网络路径上实施中间人劫持后，可让伪造资源伪装成合法资源，进而读取高度敏感的资源信息并篡改传输数据，导致机密性与完整性受损，可用性不受影响，微软将最新版软件的利用可能性评估为较低。\n修复版本中通过微软官方安全更新修正证书校验逻辑，使伪造证书无法再通过校验，切断中间人伪装合法资源的路径，各分支修复版本为 Visual Studio 2026 18.11.3、Visual Studio 2022 17.14.44、Visual Studio 2019 16.11.62、Visual Studio 2017 15.9.84。", "effects": [{"comp_name": "visual_studio_2017", "ecosystem": "linux", "versions": [{"affected_version": "[15.9,15.9.84)", "min_fixed_version": "15.9.84", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "visual_studio_2019", "ecosystem": "linux", "versions": [{"affected_version": "[16.11,16.11.62)", "min_fixed_version": "16.11.62", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "visual_studio_2022", "ecosystem": "linux", "versions": [{"affected_version": "[17.14,17.14.44)", "min_fixed_version": "17.14.44", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "visual_studio_2026", "ecosystem": "linux", "versions": [{"affected_version": "[18.11,18.11.3)", "min_fixed_version": "18.11.3", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "证书验证不恰当", "kind_en": "证书验证不当", "last_modified_time": "2026-11-01", "level": "High", "mps_id": "MPS-a1hj-m8d7", "poc": false, "poc_url": [], "published_time": "2026-11-01", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-a1hj-m8d7", "name": "https://www.oscs1024.com/hd/MPS-a1hj-m8d7"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-118147", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-118147"}, {"url": "https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-118147", "name": "Visual Studio Spoofing Vulnerability"}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "Visual Studio 证书验证欺骗漏洞", "_translated": true, "_saved_at": "2026-10-31T22:22:24+00:00", "_first_saved_at": "2026-10-31T22:22:24+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-a1hj-m8d7"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-120205", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:R/S:C/C:H/I:H/A:N", "severity": "high", "base_score": 8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:A/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.4}]}, "cvss_score": 7.4, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:A/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-79", "description": "Thelia 是 OpenStudio 团队维护的开源 PHP 电商内容管理系统，经由 Composer 包 thelia/thelia 与 thelia/core 分发，用于搭建在线商店并提供商品、订单、客户与优惠券营销等能力。\n受影响版本中，前台注册表单 CustomerRegisterForm 对 firstname 与 lastname 仅施加 NotBlank 校验，攻击者注册普通客户账户时可将 HTML 脚本载荷作为姓名存入 customer 表；后台优惠券页面生成条件摘要时，ForSomeCustomers::getSummary() 将客户 lastname、firstname 与 ref 原文拼接进消息 'Customer is %op% \u003cstrong\u003e%customer_list%\u003c/strong\u003e' 的 %customer_list% 参数，翻译器按纯文本插值且不转义，渲染链路再经 DataTable 的 html 单元格以 {{ value|raw }} 关闭自动转义，管理员打开关联该客户的优惠券页面时载荷在 /admin 源以管理员会话执行，攻击者可进一步读取页面内嵌 CSRF token 并创建超级管理员账户，导致后台权限被接管。\n修复版本中通过在 ConditionAbstract 新增 escapeSummaryValue() 方法并统一以 htmlspecialchars((string) $value, ENT_QUOTES | ENT_SUBSTITUTE, 'UTF-8') 转义解决该问题，ForSomeCustomers::getSummary() 对 lastname、firstname、ref 转义后再拼接，国家、分类、商品、配送模块、金额、数量与开始日期等其余条件实现的摘要参数同步接入该方法，条件摘要保留原有 HTML 标记的同时不再执行注入的脚本。", "effects": [{"comp_name": "thelia/core", "ecosystem": "composer", "versions": [{"affected_version": "(-∞,3.1.0)", "min_fixed_version": "3.1.0", "repository": "composer", "solutions": [], "upstream": true}]}, e@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-693", "description": "ramparts 是 Highflame 开源的 Rust 语言 MCP 与 AI Agent 安全扫描器，发布于 GitHub 与 crates.io，用于对 MCP 服务器和 agentskills.io 技能包执行静态安全分析，其中 ramparts skills scan 子命令负责扫描本地技能包目录。\n受影响版本中，src/skills.rs 的 collect_bundle_siblings 依据 SCRIPT_EXTS 扩展名白名单枚举技能包 scripts/ 目录下的脚本文件，白名单仅覆盖 py、sh、bash、zsh、js、mjs、cjs、ts、rb、pl、ps1 且不包含 .pyc，walk_bundle_subdir 使用单层 read_dir 遍历并对目录与符号链接条目直接跳过，因此 scripts/\u003c子目录\u003e/__pycache__/ 内的编译字节码不会被枚举为待扫描资源，YARA 与 LLM 分析均无法触达该文件；攻击者向技能包中放入经 PEP 552 UNCHECKED_HASH 模式编译并携带恶意逻辑的 .pyc，同时提供干净的 .py 源码作为掩护，扫描输出为 0 findings，而 CPython 在技能运行、模块导入时不校验该哈希并直接执行其中的任意代码，形成确定性扫描绕过与代码执行。\n修复版本中通过，可将 __pycache__ 目录与 .pyc 文件纳入递归扫描范围，在扫描与运行技能前清除或人工核查编译字节码，仅部署来源可信的技能包进行缓解，并跟踪上游仓库 issue 154 的修复进展，待官方发布修复版本后升级并重新扫描。", "effects": [{"comp_name": "ramparts", "ecosystem": "cargo", "versions": [{"affected_version": "[0.8.1,0.8.10]", "min_fixed_version": "", "repository": "cargo", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "保护机制失效", "kind_en": "保护机制失效", "last_modified_time": "2026-11-01", "level": "High", "mps_id": "MPS-jcou-h82q", "poc": false, "poc_url": [], "published_time": "2026-11-01", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-jcou-h82q", "name": "https://www.oscs1024.com/hd/MPS-jcou-h82q"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-120202", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-120202"}, {"url": "https://github.com/highflame-ai/ramparts/issues/154", "name": "GitHub Issue #154"}, {"url": "https://github.com/highflame-ai/ramparts/blob/v0.8.10/src/skills.rs#L898", "name": ""}, {"url": "https://github.com/highflame-ai/ramparts", "name": ""}, {"url": "https://www.vulncheck.com/advisories/highflame-ramparts-0.8.1-through-0.8.10-skill-bundle-scan-bypass-via-nested-pyc", "name": "VulnCheck Advisory: Highflame ramparts 0.8.1 through 0.8.10 Skill Bundle Scan Bypass via Nested .pyc"}], "scope_influence": "", "tags": ["AI"], "title": "ramparts 技能包扫描绕过漏洞", "_translated": true, "_saved_at": "2026-10-31T22:22:30+00:00", "_first_saved_at": "2026-10-31T18:59:34+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-jcou-h82q"}, {"analysis_status": 0, "articles": [{"content": "跨站点请求伪造 (CSRF)通过利用网站对用户请求的信任进行攻击。当用户在网站A登录并在同一浏览器会话中访问网站B时，攻击者可以构造特制的请求并诱使用户执行，以使网站B误以为这些请求是用户合法发起的。\n攻击者通常通过欺骗用户点击恶意链接、在受信任的网站中植入恶意代码或通过钓鱼等手段来实施CSRF攻击，一旦用户执行了恶意请求，攻击者可以以用户的身份执行任意操作，包括更改用户密码、发起资金转账或删除重要数据等。", "title": "什么是CSRF"}, {"content": "- 链接欺骗：攻击者通过向用户发送包含恶意链接的电子邮件或社交媒体消息，诱使用户点击并执行恶意请求。\n- 图片引用攻击：攻击者通过在恶意网站上包含指向目标网站的图片引用，以触发用户浏览器自动发送目标网站的请求。\n- XSS利用：如果目标网站存在XSS漏洞，攻击者可以注入恶意脚本，以使用户在浏览器中执行恶意请求。", "title": "CSRF常见的攻击方式"}, {"content": "- 随机令牌：网站可以在每个请求中包含一个随机生成的令牌（CSRF Token），并验证该令牌的有效性，以确认请求的来源是合法的。\n- SameSite Cookie：使用SameSite属性来限制跨站点请求，将Cookie的发送限制在同一站点上，减少了跨站请求伪造的风险。\n- 双重验证：对于敏感操作，网站可以要求用户进行额外的验证，例如输入验证码、提供第二个因素的身份验证等。\n- 强化浏览器策略：网站可以设置Content-Security-Policy（CSP）头，限制浏览器执行恶意脚本的能力，减少CSRF攻击的风险。\n- 限制用户操作：网站可以要求用户在执行敏感操作之前进行明确的确认或授权，防止恶意请求被误触发。\n- 安全编码实践：开发人员应遵循安全编码实践，对用户输入进行适当的验证和过滤，防止恶意请求的注入。", "title": "如何预防CSRF"}], "cnvd_id": "", "cve_id": "CVE-2026-120207", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:N/I:H/A:L", "severity": "high", "base_score": 7.1}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:A/VC:N/VI:H/VA:L/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7}]}, "cvss_score": 7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:A/VC:N/VI:H/VA:L/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-352", "description": "Thelia Page 是 Thelia 开源电商 CMS 的官方页面管理模块，以 composer 包 thelia/page-module 形式分发，用于管理店铺静态页面及其标签、文档与图片，图片存储依赖共享媒体库模块 TheliaLibrary。\n受影响版本中，后台 page-tag、page-document、page-image 三类删除路由均未调用令牌校验与模块权限检查，PageTagController::deletePageTagAction 的路由未限制请求方法，PageImageController::deleteImageAction 与 PageDocumentController::deleteDocumentAction 声明为 GET 路由，其中 deleteImageAction 将参数 $pageImageId 同时传入 deleteImageAssociation 与 LibraryImageService::deleteImage，前者读取 library_item_image 表主键、后者按共享媒体库 library_image 表主键解析，$pageId 仅用于拼装重定向地址而不参与任何归属校验，攻击者构造携带顺序 id 的外部链接诱导已登录管理员点击后，浏览器携带会话 Cookie 发起顶层 GET 导航即可逐个删除页面、产品与分类共用的媒体库图片文件、全部渲染变体及数据库记录，并经 ON DELETE CASCADE 级联解除跨条目引用。\n修复版本中通过在删除路由统一引入 ChecksAdminWriteAccess 检查，要求 POST 请求体携带会话 _token 并校验 Page 模块 DELETE、UPDATE 权限，将各删除路由改为 POST-only 并限定 id 为数字，删除前经 LibraryItemImageQuery 校验记录确属给定页面，同时新增 LibraryImageDetacher 仅在该共享库图片不再被其他条目引用时删除图片及其文件，令牌缺失或权限不足时返回 403，切断了跨站请求伪造删除链路。", "effects": [{"comp_name": "thelia/page-module", "ecosystem": "composer", "versions": [{"affected_version": "(-∞,2.0.4)", "min_fixed_version": "2.0.4", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "CSRF", "kind_en": "跨站请求伪造 (CSRF)", "last_modified_time": "2026-11-01", "level": "High", "mps_id": "MPS-gpfo-0xvq", "poc": false, "poc_url": [], "published_time": "2026-11-01", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-gpfo-0xvq", "name": "https://www.oscs1024.com/hd/MPS-gpfo-0xvq"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-120207", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-120207"}, {"url": "https://github.com/thelia/thelia/security/advisories/GHSA-whqr-4v2h-6jhc", "name": "GitHub Security Advisory (GHSA-whqr-4v2h-6jhc)"}, {"url": "https://github.com/thelia-modules/Page/commit/e7206a7c35c945cc8fe529fe95a9b30402f0fb60", "name": ""}, {"url": "https://github.com/thelia-modules/Page/blob/2.0.3/Controller/Admin/PageImageController.php#L117", "name": ""}, {"url": "https://www.vulncheck.com/advisories/thelia-page-module-before-2.0.4-csrf-via-page-tag-document-and-image-delete-routes", "name": "VulnCheck Advisory: Thelia Page Module before 2.0.4 CSRF via Page Tag, Document and Image Delete Routes"}], "scope_influence": "", "tags": ["php", "开源"], "title": "Thelia Page模块CSRF漏洞", "_translated": true, "_saved_at": "2026-10-31T18:59:31+00:00", "_first_saved_at": "2026-10-31T18:59:31+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-gpfo-0xvq"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-120240", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:N/AC:L/Au:S/C:C/I:C/A:C", "severity": "high", "base_score": 9}], "cvssv3": [{"source": "VulDB", "vector": "CVSS:3.0/AV:N/AC:L/PR:L/UI:N/S:C/C 析器，这些数值没有绑定到发起上传的 FileUploadToResourceField。应用通过 setMaxSize、setFileMaxSize 和 setFileCountMax 配置的限制只在客户端省略对应参数时才被读取；客户端提交很大的 maxSize，或省略 fileMaxSize 与 fileCountMax 时，解析没有有效的总大小、单文件或文件数量上限。超过内存阈值的文件部分会写入容器临时目录，再复制到 IUploadsFileManager 目录下由请求命名的子目录，非文件部分会在解析时完整读入堆，单次请求即可消耗磁盘或堆内存。该资源默认没有授权注解，默认授权策略放行全部资源请求。此路径仅在应用使用 FileUploadToResourceField 或自行挂载 FileUploadResourceReference 时存在，8.x 没有该资源，Form 配合 FileUploadField 以及 AjaxFileDropBehavior 不走这条路径。\n修复版本中通过在解析请求前校验会话绑定的 HMAC 上传令牌，切断客户端自行指定上限的路径。FileUploadToResourceField 渲染时使用保存在会话中的随机密钥，对 uploadId 与三项上限计算 HmacSHA256；newResourceResponse 调用 hasValidUploadToken，只接受与请求中的上限一致且密钥属于已渲染会话的 uploadToken，缺失或不匹配的请求在进入 multipart 解析前被拒绝。", "effects": [{"comp_name": "org.apache.wicket:wicket-core", "ecosystem": "maven", "versions": [{"affected_version": "[10.0.0,10.9.1]", "min_fixed_version": "", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[9.14.0,9.25.0)", "min_fixed_version": "9.25.0", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "不加限制或调节的资源分配", "kind_en": "不受限制或节流地分配资源", "last_modified_time": "2026-11-02", "level": "High", "mps_id": "MPS-dypi-b4z6", "poc": false, "poc_url": [], "published_time": "2026-11-02", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-dypi-b4z6", "name": "https://www.oscs1024.com/hd/MPS-dypi-b4z6"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-84170", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-84170"}, {"url": "https://lists.apache.org/thread.html/bw3hn5cch3q7yrsl05m8mvmgyx4m98y7", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "Wicket上传资源限制绕过", "_translated": true, "_saved_at": "2026-11-02T00:08:34+00:00", "_first_saved_at": "2026-11-02T00:08:34+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-dypi-b4z6"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过构造恶意的数据，将过多的数据输入到程序的缓冲区中，使得缓冲区的空间被填满，从而溢出到程序的栈 (stack) 或堆 (heap) 中，导致程序崩溃、拒绝服务、数据泄露等安全问题。\n", "title": "什么是经典缓冲区溢出"}, {"content": "| 类型        | 描述                                                         |\n| ----------- | ------------------------------------------------------------ |\n| 代码注入攻击      | 攻击者通过向程序的缓冲区输入恶意代码，从而控制程序执行流程，实现对程序操作的恶意操作。例如，攻击者可以通过向 Web 应用程序的输入框中输入恶意代码，从而执行任意的代码，破坏系统、窃取数据等。 |\n| 数据覆盖攻击      | 攻击者通过向程序的缓冲区输入过多的数据，从而覆盖程序中的重要数据或代码，实现对程序操作的恶意操作。例如，攻击者可以通过向聊天应用程序的输入框中输入过多的表情符号，从而覆盖程序中的重要数据，例如聊天消息、账号密码等。 |\n| 栈溢出攻击 | 攻击者通过向程序的栈中输入过多的数据，从而溢出到栈外部，实现对程序操作的恶意操作。例如，攻击者可以通过向游戏应用程序的输入框中输入过多的道具名称，从而覆盖程序中的重要数据，例如游戏数据、账号密码等。 |\n| 堆溢出攻击       | 攻击者通过向程序的堆中输入过多的数据，从而溢出到堆外部，实现对程序操作的恶意操作。例如，攻击者可以通过向操作系统工具的输入框中输入过多的命令，从而覆盖程序中的重要数据，例如系统文件、配置文件等。 |", "title": "经典缓冲区溢出常见的攻击方式"}, {"content": "- 输入验证：在程序输入处对输入数据进行严格的验证和过滤，确保输入数据符合预期的格式和类型，避免被攻击者注入恶意命令或数据。可以使用正则表达式、格式字符串等方式进行输入验证。\n- 输出过滤：在程序输出处对输出数据进行严格的过滤和检查，确保输出数据符合预期的格式和类型，避免被攻击者截获和篡改。可以使用安全的输出过滤库等方式进行输出过滤。\n- 使用安全的编程模型：使用安全的编程模型，例如避免使用原生的缓冲区管理函数，使用安全的框架和库来处理输入数据和执行命令，避免缓冲区溢出漏洞。\n- 数据库加密和访问控制：对于敏感数据和命令，使用加密和访问控制措施，确保只有授权用户可以访问和执行命令，避免被攻击者窃取和篡改。\n- 定期更新和升级：定期更新和升级应用程序和库的版本，确保应用程序和库的最新版本包含了最新的安全补丁和修复措施，避免安全漏洞的出现和利用。\n- 安全审计和监控：定期对系统和应用程序进行安全审计和监控，及时发现和阻止潜在的安全漏洞和攻击，确保系统和数据的安全和可靠性。", "title": "如何预防经典缓冲区溢出"}], "cnvd_id": "", "cve_id": "CVE-2026-120241", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:N/AC:L/Au:N/C:N/I:N/A:C", "severity": "high", "base_score": 7.8}], "cvssv3": [{"source": "VulDB", "vector": "CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H/E:P/RL:X/RC:R", "severity": "high", "base_score": 7.5}], "cvssv31": [{"source": "cna@vuldb.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}], "cvssv4": [{"source": "cna@vuldb.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.7}]} igh", "mps_id": "MPS-4wfm-c8h7", "poc": false, "poc_url": [], "published_time": "2026-11-02", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-4wfm-c8h7", "name": "https://www.oscs1024.com/hd/MPS-4wfm-c8h7"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-120241", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-120241"}, {"url": "https://vuldb.com/vuln/429600", "name": "VDB-429600 | Ruijie RG-ES205GC Local Firmware Upgrade httpupg.cgi buffer overflow"}, {"url": "https://vuldb.com/vuln/429600/cti", "name": "VDB-429600 | CTI Indicators (IOB, IOC, IOA)"}, {"url": "https://vuldb.com/cve/CVE-2026-120241", "name": "CVE-2026-120241 | CVE Analysis and Report"}, {"url": "https://vuldb.com/submit/1016041", "name": "Submit #1016041 | Ruijie Networks Co., Ltd. RG-ES205GC, RG-ES206GC-P, RG-ES208GC, RG-ES210GC-LP, RG-ES210GS-P (sharing the same ESW firmware; NIS2100 series may also be aff ESW_1.0(1)B1P48, Release(12211919) Buffer Overflow"}, {"url": "https://github.com/byseeker/Ruijie-RG-ES-Series-Switches_PreAuth_Boundary_Overflow_DoS", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "锐捷交换机缓冲区溢出", "_translated": true, "_saved_at": "2026-11-01T20:03:43+00:00", "_first_saved_at": "2026-11-01T20:03:43+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-4wfm-c8h7"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-95863", "cvss": {"cvssv4": [{"source": "security@apache.org", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:P/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.6}]}, "cvss_score": 7.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:P/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-79", "description": "Apache Wicket 是 Apache 软件基金会的开源 Java 组件化 Web 框架，源码仓库为 apache/wicket，用于以服务端组件构建页面和表单。核心分发制品为 org.apache.wicket:wicket-core，扩展制品 org.apache.wicket:wicket-extensions 按同一版本线发布。\n受影响版本中，Component 构造函数对组件 id 只拒绝 ':' 与 '~'，setMarkupId(String) 与模板 id 属性进入组件后也不按 JavaScript 字符串上下文转义。渲染时 markup id 以及由组件 id 拼出的 input name 被放进单引号 JavaScript 字面量，含单引号或反斜杠的标识会结束该字面量，其后的内容在页面加载时于应用源站执行。9.x 与 10.x 的 OnEventHeaderItem.forMarkupId 将 markup id 拼为 Wicket.Event.add 的目标参数，并把脚本写入带有当次响应 nonce 的 script 元素，因此这两条版本线默认下发的 Content-Security-Policy 不能拦截该脚本。\n修复版本中通过在标识进入组件时拒绝危险字符，而不是在每个写出点逐一转义，切断未转义标识进入脚本字面量的路径。组件 id 与 markup id 不得再包含引号、反引号、反斜杠、花括号、尖括号、分号、与号或控制字符，markup id 还不得包含圆括号或方括号；构造组件、调用 setMarkupId 或读取模板 id 属性时，非法标识会抛出异常。", "effects": [{"comp_name": "org.apache.wicket:wicket-core", "ecosystem": "maven", "versions": [{"affected_version": "[9.0.0,9.25.0)", "min_fixed_version": "9.25.0", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[8.0.0,8.20.0)", "min_fixed_version": "8.20.0", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[10.0.0,10.12.0)", "min_fixed_version": "10.12.0", "repository": "maven", "solutions": [], "upstream": true}]}, {"comp_name": "org.apache.wicket:wicket-extensions", "ecosystem": "maven", "versions": [{"affected_version": "[9.0.0,9.25.0)", "min_fixed_version": "9.25.0", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[8.0.0,8.20.0)", "min_fixed_version": "8.20.0", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[10.0.0,10.12.0)", "min_fixed_version": "10.12.0", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-11-02", "level": "High", "mps_id": "MPS-axig-u2yt", "poc": false, "poc_url": [], "published_time": "2026-11-02", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-axig-u2yt", "name": "https://www.oscs1024.com/hd/MPS-axig-u2yt"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-95863", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-95863"}, {"url": "https://lists.apache.org/thread.html/5wg754b873tlnsc268myrwcoy9lt046v", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "Wicket跨站脚本漏洞", "_translated": true, "_saved_at": "2026-11-02T00:08:33+00:00", "_first_saved_at": "2026-11-02T00:08:33+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-axig-u2y /MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-79", "description": "Apache Wicket 是开源的面向组件 Java Web 框架，用于构建服务端渲染的 Web 应用；AjaxNewWindowNotifyingBehavior 是框架提供的 Ajax 行为，用于检测当前页面实例是否在新浏览器窗口或标签页中被打开。\n受影响版本中，该行为在 respond() 方法读取请求参数 windowName 携带的浏览器 window.name 值，未做校验写入 boundName 字段，该字段随页面序列化状态保存在 page store 中；页面实例此后每次渲染时，updateAjaxAttributes() 将 boundName 未经转义地替换进单引号 JavaScript 字符串字面量 return (window.name !== '...') 中，而 Wicket Ajax 调用监听器的前置条件按调用方提供的脚本原文写入页面，窗口名称中的单引号与反斜杠可以终止该字面量，其余内容在应用源内作为脚本执行，载荷在该页面实例的每次渲染中反复触发，构成存储型跨站脚本漏洞。\n修复版本中通过将浏览器上报的窗口名称经 JavaScriptUtils#escapeQuotes 转义后再写入前置条件字符串，并对回写客户端的生成窗口名称同样转义，消除引号与反斜杠终止字符串字面量的路径，升级至 8.20.0、9.25.0 或 10.12.0 版本可获得修复。", "effects": [{"comp_name": "apache_wicket", "ecosystem": "linux", "versions": [{"affected_version": "[9.0.0,9.25.0)", "min_fixed_version": "9.25.0", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[8.0.0,8.20.0)", "min_fixed_version": "8.20.0", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[10.0.0,10.12.0)", "min_fixed_version": "10.12.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "org.apache.wicket:wicket-core", "ecosystem": "maven", "versions": [{"affected_version": "[9.0.0,9.25.0)", "min_fixed_version": "9.25.0", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[8.0.0,8.20.0)", "min_fixed_version": "8.20.0", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[10.0.0,10.12.0)", "min_fixed_version": "10.12.0", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-11-02", "level": "High", "mps_id": "MPS-u1jt-igph", "poc": false, "poc_url": [], "published_time": "2026-11-02", "referen : {"cvssv4": [{"source": "security@apache.org", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:A/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.4}]}, "cvss_score": 7.4, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:A/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-79", "description": "Apache Wicket 是 Apache 软件基金会维护的开源 Java 组件化 Web 框架，用于构建服务端页面应用。其 wicket-extensions 模块提供 SmartLinkLabel 与 SmartLinkMultiLineLabel，把待展示文本中的邮箱地址和 URL 自动转换为超链接。\n受影响版本中，SmartLinkLabel.onComponentTagBody 与 SmartLinkMultiLineLabel.onComponentTagBody 读取模型文本并交给 DefaultLinkParser。该类的 urlPattern 匹配任意字母组成的 scheme 加 ://，URL_RENDER_STRATEGY.buildLink 把匹配文本原样写入 a 标签的 href。模型中带有可执行脚本的 scheme（CNA 标题明确为 javascript）会变成应用源站上的链接，阅读者点击后在本人会话中执行脚本；只渲染页面不会触发。模型值进入解析器前会经过 Strings.escapeMarkup，但该转义保留 URL 所需字符，且结果进入 URL 上下文而不是元素文本，转义不能消除该问题。未使用这两个组件的应用不受影响。Wicket 9.x 与 10.x 默认 Content-Security-Policy 只放行带一次性 nonce 的脚本，此类 URL 无法携带该 nonce，默认策略可阻止脚本执行；策略被削弱或关闭时影响完整成立。Wicket 8.x 没有 Content-Security-Policy，按默认状态受影响。\n修复版本中通过将 DefaultLinkParser 的 URL 模式收窄为不区分大小写、且前面不能紧邻字母的 http、https 与 ftp，并让 URL_RENDER_STRATEGY.buildLink 对其他 scheme 直接返回原文、不再生成锚点，使可执行脚本的 scheme 不再进入 href。", "effects": [{"comp_name": "org.apache.wicket:wicket-extensions", "ecosystem": "maven", "versions": [{"affected_version": "[8.0.0,8.20.0)", "min_fixed_version": "8.20.0", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[9.0.0,9.25.0)", "min_fixed_version": "9.25.0", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[10.0.0,10.12.0)", "min_fixed_version": "10.12.0", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议 ：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-66570", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:L", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:L", "cwe": "CWE-79", "description": "WordPress File Upload（插件标识 wp-file-upload，现名 Iptanus File Upload）是 Nickboss（Iptanus）开发的开源 WordPress 文件上传插件，通过短代码在文章、页面或侧栏中提供可配置的上传表单，支持访客上传、分块传输与多种存储后端。\n受影响版本中，上传文件的内容检查 wfu_security_filecontent_checks() 依赖 wfu_content_scan_script_pattern() 的返回规则，仅当文件 MIME 类型以 text 开头时才扫描 \u003cscript\u003e 等脚本标记，默认参数 WFU_CHECKPHPTAGS_FILETYPES=commonimages 下扩展名不属于常见图片的非文本文件不进入任何内容扫描；默认配置允许访客上传（uploadrole 默认含 guests）且扩展名白名单默认为 *.*，未认证攻击者可上传以 \u003c!-- 等浏览器 HTML 嗅探特征字节开头、同时被 libmagic 识别为 video/3gpp 等非文本类型的复合文件，文件通过检查并存储到站点上传目录后，受害者直接访问该文件 URL 时浏览器按 HTML 渲染并执行内嵌脚本，窃取同源会话凭据，形成存储型 XSS。\n修复版本中通过在 wfu_security_filecontent_checks() 入口新增 wfu_file_leading_bytes_are_html() 前导字节检查，读取文件前 512 字节并模拟浏览器 HTML 嗅探签名，命中 \u003c!--、\u003c!doctype、\u003c?xml 或带终止字节校验的常见 HTML 标签特征时返回 WFU_ERROR_ADMIN_FILE_HASSCRIPTTAGS 拒绝上传，阻断以非文本类型伪装的 HTML 脚本文件进入站点存储，切断该存储型 XSS 利用链。", "effects": [{"comp_name": "wp-file-upload", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,5.2.2)", "min_fixed_version": "5.2.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-11-02", "level": "High", "mps_id": "MPS-4y3a-lx90", "poc": false, "poc_url": [], "published_time": "2026-11-02", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-4y3a-lx90", "name": "https://www.oscs1024.com/hd/MPS-4y3a-lx90"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-66570", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-66570"}, {"url": "https://patchstack.com/database/wordpress/plugin/wp-file-upload/vulnerability/wordpress-wordpress-file-upload-plugin-5-2-1-cross-site-scripting-xss-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "WordPress File Upload 存储型 XSS", "_translated": true, "_saved_at": "2026-11-01T20:03:49+00:00", "_first_saved_at": "2026-11-01T20:03:49+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-4y3a-lx90"}, {"analysis_status": 0, "articles": [], "attack_vector_type": "Local", "cnvd_id": "", "cve_id": "CVE-2026-74760", "cvss": {}, "cvss_score": 7.1, "cvss_vector": "", "cwe": "CWE-346", "description": "Google::Auth 是 Google 在 GitHub 开源的 Perl 语言云端认证库（google-auth-library-perl），实现应用默认凭证、用户 OAuth 授权与工作负载身份联邦等能力，随包发布的 gcloud-auth 命令行工具提供 login、application-default login 等登录命令。\n受影响版本中，gcloud-auth 的 login 与 application-default login 命令向授权请求附加随机 state 参数，回环回调处理函数 _wait_for_code 对监听器收到的首个请求只提取查询串中的 code，不读取也不比对 state；本机攻击进程抢在用户浏览器回调之前向 127.0.0.1 监听端口提交其自身 Google 账号的授权码后，命令行使用用户侧客户端凭证完成兑换，该流程未启用 PKCE，攻击者账号的 refresh_token 被写入令牌存储或 application_default_credentials.json，用户后续工具调用改以攻击者账号身份执行。\n修复版本中通过，可通过缓解措施阻断该利用链：仅在受信任的单用户环境中执行 gcloud-auth 登录命令并尽快完成浏览器授权，避免在存在不可信本地进程的主机上登录，登录完成后核对 application_default_credentials.json 与令牌存储中的账号归属，发现凭证被替换时立即执行 gcloud-auth revoke 并重新登录，官方发布包含 state 校验的版本后升级。", "effects": [{"comp_name": "google-auth", "ecosystem": "linux", "versions": [{"affected_version": "[0.11,0.12]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "源验证错误", "kind_en": "来源验证错误", "last_modified_time": "2026-11-02", "level": "High", "mps_id": "MPS-rgie-o5ny", "poc": false, "poc_url": [], "published_time": "2026-11-02", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-rgie-o5ny", "name": "https://www.oscs1024.com/hd/MPS-rgie-o5ny"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-74760", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-74760"}, {"url": "https://metacpan.org/release/CJCOLLIER/Google-Auth-0.12/source/bin/gcloud-auth.pl", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Google::Auth 授权码注入漏洞", "_translated": true, "_saved_at": "2026-11-01T20:03:48+00:00", "_first_saved_at": "2026-11-01T20:03:48+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-rgie-o5ny"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-107441", "cvss": {"cvssv31": [{"source": "security@zyxel.com.tw", "vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-787", "description": "Zyxel GS1900 系列是合勤科技的商用智能网管交换机，固件闭源，用于局域网接入、端口管理以及 Web 管理。\n受影响版本中，固件 CGI 程序存在越界写入。未经身份认证的相邻网络攻击者向 Web 管理接口发送构造的 HTTP 请求即可触发该缺陷，并可能在设备上执行操作系统命令。\n修复版本中通过发布各受影响型号的修复固件，消除 CGI 程序中的越界写入，使未认证相邻网络 HTTP 请求不能再导致操作系统命令执行。", "effects": [{"comp_name": "gs1900-10hp_firmware", "ecosystem": "linux", "versions": [{"affected_version": "[[, 2.90(AAZI.3)C0),+∞)", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "gs1900-16_firmware", "ecosystem": "linux", "versions": [{"affected_version": "[[, 2.90(AAHJ.3)C0),+∞)", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "gs1900-24_firmware", "ecosystem": "linux", "versions": [{"affected_version": "[[, 2.90(AAHL.3)C0),+∞)", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "gs1900-24e_firmware", "ecosystem": "linux", "versions": [{"affected_version": "[[, 2.90(AAHK.3)C0),+∞)", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "gs1900-24ep_firmware", "ecosystem": "linux", "versions": [{"affected_version": "[[, 2.90(ABTO.3)C0),+∞)", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "gs1900-24hpv2_firmware", "ecosystem": "linux", "versions": [{"affected_version": "[[, 2.90(ABTP.3)C0),+∞)", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "gs1900-48_firmware", "ecosystem": "linux", "versions": [{"affected_version": "[[, 2.90(AAHN.3)C0),+∞)", "min_f ----------------------------------------------- |\n| 代码注入攻击      | 攻击者通过向程序的缓冲区输入恶意代码，从而控制程序执行流程，实现对程序操作的恶意操作。例如，攻击者可以通过向 Web 应用程序的输入框中输入恶意代码，从而执行任意的代码，破坏系统、窃取数据等。 |\n| 数据覆盖攻击      | 攻击者通过向程序的缓冲区输入过多的数据，从而覆盖程序中的重要数据或代码，实现对程序操作的恶意操作。例如，攻击者可以通过向聊天应用程序的输入框中输入过多的表情符号，从而覆盖程序中的重要数据，例如聊天消息、账号密码等。 |\n| 栈溢出攻击 | 攻击者通过向程序的栈中输入过多的数据，从而溢出到栈外部，实现对程序操作的恶意操作。例如，攻击者可以通过向游戏应用程序的输入框中输入过多的道具名称，从而覆盖程序中的重要数据，例如游戏数据、账号密码等。 |\n| 堆溢出攻击       | 攻击者通过向程序的堆中输入过多的数据，从而溢出到堆外部，实现对程序操作的恶意操作。例如，攻击者可以通过向操作系统工具的输入框中输入过多的命令，从而覆盖程序中的重要数据，例如系统文件、配置文件等。 |", "title": "经典缓冲区溢出常见的攻击方式"}, {"content": "- 输入验证：在程序输入处对输入数据进行严格的验证和过滤，确保输入数据符合预期的格式和类型，避免被攻击者注入恶意命令或数据。可以使用正则表达式、格式字符串等方式进行输入验证。\n- 输出过滤：在程序输出处对输出数据进行严格的过滤和检查，确保输出数据符合预期的格式和类型，避免被攻击者截获和篡改。可以使用安全的输出过滤库等方式进行输出过滤。\n- 使用安全的编程模型：使用安全的编程模型，例如避免使用原生的缓冲区管理函数，使用安全的框架和库来处理输入数据和执行命令，避免缓冲区溢出漏洞。\n- 数据库加密和访问控制：对于敏感数据和命令，使用加密和访问控制措施，确保只有授权用户可以访问和执行命令，避免被攻击者窃取和篡改。\n- 定期更新和升级：定期更新和升级应用程序和库的版本，确保应用程序和库的最新版本包含了最新的安全补丁和修复措施，避免安全漏洞的出现和利用。\n- 安全审计和监控：定期对系统和应用程序进行安全审计和监控，及时发现和阻止潜在的安全漏洞和攻击，确保系统和数据的安全和可靠性。", "title": "如何预防经典缓冲区溢出"}], "cnvd_id": "", "cve_id": "CVE-2026-76955", "cvss": {"cvssv31": [{"source": "security@zyxel.com.tw", "vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-120", "description": "Zyxel 无线接入点、FWA7 与安全路由器固件是 Zyxel 发布的闭源网络设备固件，用于提供无线接入、网状组网与安全路由，zdp_wtp 是这些固件中的二进制组件。\n受影响版本中，固件二进制 zdp_wtp 存在缓冲区溢出。同一局域网内无需认证的攻击者可向受影响设备发送触发该溢出的输入，并在设备上提升权限。\n修复版本中通过安装 Zyxel 为各受影响型号发布的补丁固件，修复 zdp_wtp 缓冲区溢出并阻断局域网未授权权限提升。公开资料未披露补丁内的具体代码改动。", "effects": [{"comp_name": "FWA7 Leaf Plus", "ecosystem": "linux", "versions": [{"affected_version": "[[, 7.40(ACQL.2)C0),+∞)", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "FWA7 Root", "ecosystem": "linux", "versions": [{"affected_version": "[[, 7.40(ACUJ.2)C0),+∞)", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstr escription": "Eclipse ThreadX NetX Duo 是 Eclipse 基金会维护的开源嵌入式 TCP/IP 协议栈，采用 MIT 许可证。其 NetX Secure 组件提供 DTLS 服务端，用于在资源受限设备上为 UDP 通信建立安全会话。\n受影响版本中，DTLS 服务端的 _nx_secure_dtls_receive_callback 在 nx_secure_dtls_session_cache_find 未命中时，对长度达到 DTLS 记录头且记录类型不是 Alert 的数据报直接调用 nx_secure_dtls_session_cache_get_new，按源地址和端口占用固定会话池中的一个槽位，并调用 connect_notify。HelloVerifyRequest 的 cookie 存放在该会话内，分配之前不能完成回程可达性校验。槽位仅在应用结束、删除或重置会话，或停止服务时经 _nx_secure_dtls_session_reset 释放；_nx_secure_dtls_session_start 在握手超时或重试耗尽后返回，且不重置会话。远程、无需凭据的攻击者对每个伪造源地址或端口发送一个数据报，便可占满应用设定的 nx_dtls_server_sessions_count。池满后新对端收到 internal_error，nx_secure_dtls_server_session_start 返回 NX_SECURE_TLS_NO_FREE_DTLS_SESSIONS。该状态持续到应用重置被占用的会话；应用若不重置，状态不会自行结束。此问题不影响机密性与完整性。6.5.2.202603a 为 GHSA-7c5f-gmpm-f655 增加的 cookie 比较只决定已有会话是否继续握手，不能避免提前分配。\n修复版本中通过在未知来源进入会话分配前调用 _nx_secure_dtls_server_cookie_check，对未分片且会话标识不超过 32 字节的初始 ClientHello 发送无状态 HelloVerifyRequest，发送时不分配会话。cookie 由服务端周期性轮换的密钥对客户端地址、客户端端口、服务端端口以及 ClientHello 的版本、随机数、会话标识、密码套件和压缩方法计算 HMAC。只有携带有效 cookie 的 ClientHello 才会调用 nx_secure_dtls_session_cache_get_new 并触发 connect_notify。未知来源的其他数据报被丢弃且不回复。", "effects": [{"comp_name": "netxduo", "ecosystem": "linux", "versions": [{"affected_version": "[6.0,6.5.2.202603b)", "min_fixed_version": "6.5.2.202603b", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "对已超过有效生命周期的资源丧失索引", "kind_en": "有效生命周期后缺少资源释放", "last_modified_time": "2026-11-03", "level": "High", "mps_id": "MPS-j6vf-kaow", "poc": false, "poc_url": [], "published_time": "2026-11-03", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-j6vf-kaow", "name": "https://www.oscs1024.com/hd/MPS-j6vf-kaow"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-115215", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-115215"}, {"url": "https://github.com/eclipse-threadx/netxduo/security/advisories/GHSA-3p2g-x7 6 !release，使官方构建不再编译并经 init 注册 k8s 提供者，同时在 common/api/metadata.go 中把 ValidateWorkerDeploymentVersionComputeConfig 的 Access 从 AccessReadOnly 改为 AccessWrite，默认部署上的命令执行路径被切断。厂商说明该修复不改变客户端配置仍取自调用方请求；操作者若自行使用 computeprovider_k8s 标签编译并在名单中放行 k8s，请求中的 kubeconfig 仍会被接受。", "effects": [{"comp_name": "go.temporal.io/server", "ecosystem": "go", "versions": [{"affected_version": "[1.31.0,1.31.5)", "min_fixed_version": "1.31.5", "repository": "go", "solutions": [], "upstream": true}, {"affected_version": "[1.32.0,1.32.2)", "min_fixed_version": "1.32.2", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "资源默认不安全", "kind_en": "使用不安全默认值初始化资源", "last_modified_time": "2026-11-03", "level": "High", "mps_id": "MPS-yziu-4crs", "poc": false, "poc_url": [], "published_time": "2026-11-03", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-yziu-4crs", "name": "https://www.oscs1024.com/hd/MPS-yziu-4crs"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-120091", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-120091"}, {"url": "https://github.com/temporalio/temporal/releases/tag/v1.32.2", "name": "First fixed 1.32 release"}, {"url": "https://github.com/temporalio/temporal/releases/tag/v1.31.5", "name": "First fixed 1.31 release"}, {"url": "https://github.com/temporalio/temporal-auto-scaled-workers/pull/165", "name": "Fix pull request, Kubernetes compute provider removed from default builds"}, {"url": "https://github.com/temporalio/temporal/pull/12843", "name": "Fix pull request, compute configuration validation requires namespace write access"}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-89139", "name": "CVE-2026-89139, related compute provider vulnerability in the same module"}], "scope_influence": "", "tags": ["go"], "title": "Temporal Server命令注入", "_translated": true, "_saved_at": "2026-11-03T00:19:54+00:00", "_first_saved_at": "2026-11-03T00:19:54+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-yziu-4crs"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过向受信任的数据序列化过程中添加恶意数据，从而在序列化和反序列化过程中执行恶意代码的攻击漏洞。这种漏洞通常存在于使用序列化 (serialization) 机制存储和传输数据的程序中。\n", "title": "什么是反序列化"}, {"content": "- 注入攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码注入到程序中，从而实现代码执行的目的。\n- 反射攻击：攻击者使用反射机制，在序列化过程中动态生成恶意数据，并将恶意代码注入到程序中，从而实现代码执行的目的。\n- 缓冲区溢出攻击：攻击者通过在序列化过程中向缓冲区输入恶意数据，导致缓冲区溢出，从而破坏程序的内存管理，实现代码执行的目的。\n- 格式字符串攻击：攻击者通过在序列化过程中输入恶意数据，导致程序使用错误的格式字符串，从而实现代码执行的目的。\n- 数据流攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码作为一个数据流传递给程序，从而实现代码执行的目的。\n", "title": "反序列化常见的攻击方式"}, {"content": "- 不信任输入数据：程序应该严格检查输入数据的有效性，并避免使用不受信任的数据。\n- 使用安全的序列化机制：程序应该使用安全的序列化机制，如 JSON 或 XML 序列化，而不是第三方序列化库。\n- 最小特权原则：程序应该限制对受信任数据的处理权限，并避免在运行时修改数据。\n- 代码审查和漏洞扫描：程序应该进行代码审查和漏洞扫描，以发现和修复潜在的安全漏洞。\n", "title": "如何预防反序列化"}], "cnvd_id": "", "cve_id": "CVE-2026-120833", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.5}]}, "cvss_score": 8.5, "cvss_vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-502", "description": "labbench 是 NIST 维护的开源 Python 实验室自动化库，通过 PyPI 分发，用于把实验流程写成可复用脚本，并对外提供 labbench.read 与 labbench.read_relational 读取表格数据和关系型实验数据。\n受影响版本中，src/labbench/_data.py 的 read() 在 reader_guess 中把扩展名 p 与 pickle 直接映射到 pandas.read_pickle。format 为 auto 时仅依据路径扩展名选择读取器，显式传入 p 或 pickle 时同样选择该读取器，并在后续分支调用 pandas.read_pickle。read_relational() 先调用 read() 加载根表，再由 MungeReader 按根表记录的成员路径再次调用 read()，关系型归档内扩展名为 p 或 pickle 的成员因此进入同一反序列化路径。用户加载攻击者提供的数据文件或关系型归档时，pickle 会在本地进程中执行任意代码。\n修复版本中通过新增 read_pickle()，在环境变量 LABBENCH_AUTOLOAD_PICKLE 未设置或取值为空、0、false、no、off 时抛出 RuntimeError 并拒绝调用 pandas.read_pickle，同时把 reader_guess 中 p 与 pickle 的目标改为 read_pickle，使 read() 与 read_relational() 在默认配置下不再自动反序列化不可信 pickle 数据。", "effects": [{"comp_name": "labbench", "ecosystem": "pip", "versions": [{"affected_version": "[0,0.46.1)", "min_fixed_version": "0.46.1", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "高", "fix_suggestion": "建议修复", "kind": "反序列化", "kind_en": "不可信数据的反序列化", "last_modified_time": "2026-11-03", "level": "High", "mps_id": "MPS-yg2s-7i8r", "poc": true, "poc_url": [], "published_time": "2026-11-03", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-yg2s-7i8r", "name": "https://www.oscs1024.com/hd/MPS-yg2s-7i8r"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-120833", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-120833"}, {"url": "https://github.com/usnistgov/labbench/pull/32", "name": "GitHub Pull Request #32"}, {"url": "https://github.com/usnistgov/labbench/commit/ac9b9b18cba67cb8e85eb563b6bb7dc1092b4c54", "name": "Patch Commit"}, {"url": "https://github.com/usnistgov/labbench/blob/0.46.0/src/labbench/_data.py#L1664-L1666", "name": ""}, {"url": "https://github.com/usnistgov/labbench/blob/0.46.1/ChangeLog.md", "name": "labbench ChangeLog"}, {"url": "https://pypi.org/project/labbench/0.46.1/", "name": ""}, {"url": "https://github.com/usnistgov/labbench", "name": ""}, {"url": "https://www.vulncheck.com/advisories/labbench-before-0.46.1-deserialization-of-untrusted-data-via-read-pickle-auto-dispatch", "name": "VulnCheck Advisory: labbench before 0.46.1 Deserialization of Untrusted Data via read() Pickle Auto-Dispatch"}], "scope_influence": "", "tags": ["poc", "python", "开源"], "title": "labbench反序列化漏洞", "_translated": true, "_saved_at": "2026-11-03T07:28:13+00:00", "_first_saved_at": "2026-11-03T07:28:13+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-yg2s-7i8r"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用了空指针，并在不进行有效检查的情况下对其进行取消引用操作。当程序试图取消引用空指针时，由于空指针不指向任何有效的内存地址，会导致程序崩溃或产生未定义的行为。这种错误通常发生在开发者未对指针进行正确的初始化或验证时。", "title": "什么是空指针取消引用"}, {"content": "- 拒绝服务：攻击者可以通过构造恶意输入或请求，触发程序中的空指针取消引用错误，导致程序崩溃或无法正常运行。这可能导致拒绝服务攻击，使系统无法提供正常的服务。\r\n- 内存信息泄露：攻击者可以通过利用空指针取消引用错误，访问程序中的敏感内存信息。这可能包括栈上的变量、函数指针或其他敏感数据，从而暴露系统的机密信息。\r\n- 代码执行：在某些情况下，空指针取消引用错误可能导致执行恶意代码或注入恶意代码的机会。攻击者可以通过精心构造的输入，利用空指针取消引用错误来执行任意的代码，进而获取系统控制权或执行未经授权的操作。", "title": "空指针取消引用常见的攻击方式"}, {"content": "- 指针初始化和验证：开发者应该正确地初始化指针，并在使用指针之前进行有效的验证，确保指针不为空。在取消引用指针之前，应始终检查其是否为空。\r\n- 异常处理和错误恢复：程序应该具备健壮的异常处理和错误恢复机制，以便在发生空指针取消引用错误时能够适当地处理异常，而不是导致程序崩溃或暴露敏感信息。\r\n- 防御性编程：采用防御性编程的原则，如避免在未经验证的指针上进行操作，避免使用未初始化的指针等，以防止空指针取消引用错误的发生。\r\n- 静态代码分析和测试：使用静态代码分析工具和测试技术来检测和识别潜在的空指针取消引用错误。这些工具可以帮助发现代码中可能存在的空指针问题，并及时修复。\r\n- 强制性编码标准和最佳实践：制定强制性的编码标准和最佳实践，包括良好的指针使用和管理规范，以帮助开发者编写更可靠、安全的代码。", "title": "如何预防空指针取消引用"}], "cnvd_id": "", "cve_id": "CVE-2026-115403", "cvss": {"cvssv4": [{"source": "emo@eclipse.org", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.2}]}, "cvss_score": 8.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-476", "description": "Eclipse ThreadX NetX Duo 是 Eclipse 基金会维护的开源嵌入式双栈 TCP/IP 协议栈，为实时操作系统设备提供 IPv4/IPv6 通信与 BSD 套接字接口。\n受影响版本中，在同时启用 NX_BSD_ENABLE、NX_BSD_RAW_SUPPORT 与 FEATURE_NX_IPV6 的构建里，应用对 AF_INET6 原始套接字设置 IP_RAW_IPV6_HDRINCL 后发送自带 IPv6 首部的报文时，_nxd_bsd_ipv6_packet_send 会为尚未进入目的地址表的链路外目的地调用 _nx_icmpv6_dest_table_add。当默认路由器的邻居缓存项未知时，该函数在检查返回状态之前读取 dest_entry_ptr 的 nx_ipv6_destination_entry_nd_entry。目的地址表已满或无法为下一跳建立邻居缓存时，添加操作返回 NX_NOT_SUCCESSFUL 且表项指针为空，发送线程因此发生空指针解引用并崩溃。远程发送方可借助 ICMPv6 Packet Too Big 报文填满目的地址表。\n修复版本中通过先判断 _nx_icmpv6_dest_table_add 返回 NX_SUCCESS，再读取目的表项中的邻居缓存指针，使添加失败时进入原有的报文释放路径，不再解引用空指针。", "effects": [{"comp_name": "netxduo", "ecosystem": "linux", "versions": [{"affected_version": "[6.0,6.5.2.202603b)", "min_fixed_version": "6.5.2.202603b", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "空指针取消引用", "kind_en": "空指针取消引用", "last_modified_time": "2026-11-03", "level": "High", "mps_id": "MPS-2yzv-95sb", "poc": false, "poc_url": [], "published_time": "2026-11-03", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-2yzv-95sb", "name": "https://www.oscs1024.com/hd/MPS-2yzv-95sb"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-115403", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-115403"}, {"url": "https://github.com/eclipse-threadx/netxduo/security/advisories/GHSA-9w9h-x3fh-m3fp", "name": ""}, {"url": "https://gitlab.eclipse.org/security/cve-assignment/-/work_items/500", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "NetX Duo空指针解引用", "_translated": true, "_saved_at": "2026-11-03T00:19:57+00:00", "_first_saved_at": "2026-11-03T00:19:57+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-2yzv-95sb"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "cnvd_id": "", "cve_id": "CVE-2026-99238", "cvss": {"cvssv31": [{"source": "416baaa9-dc9f-4396-8d5f-8c081fb06d67", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-416", "description": "Linux内核是开源的操作系统内核，其tracing子系统（ftrace）基于tracefs提供跟踪实例与持久化缓冲管理，persistent trace实例在内核模块加载或卸载时更新已记录的模块信息，用于维护跨启动的模块映射。\n受影响版本中，模块加载与卸载通知回调trace_module_notify()调用trace_module_record()遍历全局实例链表ftrace_trace_arrays，该遍历未持有trace_types_lock；并发的跟踪实例删除路径instance_rmdir()在持有该锁的情况下将实例移出链表并释放，模块加载或卸载与实例删除并发时可能访问已释放的trace_array，形成use-after-free。\n修复版本中通过在trace_module_record()入口处添加guard(mutex)(\u0026trace_types_lock)持锁遍历实例链表，使模块通知路径与实例删除操作互斥，消除对已释放trace_array的访问。", "effects": [{"comp_name": "linux_kernel", "ecosystem": "linux", "versions": [{"affected_version": "[6.15,7.4)", "min_fixed_version": "7.4", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "UAF", "kind_en": "免费后使用", "last_modified_time": "2026-11-03", "level": "High", "mps_id": "MPS-4d8g-z7x3", "poc": false, "poc_url": [], "published_time": "2026-11-03", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-4d8g-z7x3", "name": "https://www.oscs1024.com/hd/MPS-4d8g-z7x3"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-99238", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-99238"}, {"url": "https://git.kernel.org/stable/c/57408eac99b0d8a005796346d317d31f0ca4e07a", "name": ""}, {"url": "https://git.kernel.org/stable/c/dab2bd4d67ad5eaa95019a9511f8d379401b5021", "name": ""}, {"url": "https://git.kernel.org/stable/c/244c442f54601a24c86ad90572bf36fc3df41c5e", "name": ""}], "scope_influence": "", "t d() 更新状态时持有 l2cap_chan_lock，使同一信道不能被第二次加入连接。", "effects": [{"comp_name": "linux_kernel", "ecosystem": "linux", "versions": [{"affected_version": "[5.10.265,5.10.273)", "min_fixed_version": "5.10.273", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.6.145,6.6.161)", "min_fixed_version": "6.6.161", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.12.97,6.12.115)", "min_fixed_version": "6.12.115", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.1.183,6.1.191)", "min_fixed_version": "6.1.191", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[7.1.4,7.2)", "min_fixed_version": "7.2", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[5.15.216,5.15.224)", "min_fixed_version": "5.15.224", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[7.2,7.2.14)", "min_fixed_version": "7.2.14", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[7.3,7.3.1)", "min_fixed_version": "7.3.1", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.18.39,6.18.60)", "min_fixed_version": "6.18.60", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "检查时间与使用时间(TOCTOU)的竞争条件", "kind_en": "检查时间使用时间 (TOCTOU) 竞争条件", "last_modified_time": "2026-11-03", "level": "High", "mps_id": "MPS-je50-nvch", "poc": false, "poc_url": [], "published_time": "2026-11-03", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-je50-nvch", "name": "https://www.oscs1024.com/hd/MPS-je50-nvch"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-99239", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-99239"}, {"url": "https://git.kernel.org/stable/c/85cc289eb08afa97537
