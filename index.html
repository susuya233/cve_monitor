4.com/hd/MPS-8bli-k04d"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2025-41770", "name": "https://nvd.nist.gov/vuln/detail/CVE-2025-41770"}, {"url": "https://phoenixcontact.csaf-tp.certvde.com/.well-known/csaf/white/2026/vde-2025-056.json", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2025-41770漏洞", "_translated": true, "_saved_at": "2026-08-12T12:54:55+00:00", "_first_saved_at": "2026-08-12T09:06:46+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-8bli-k04d"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-64954", "cvss": {"cvssv31": [{"source": "cve@rapid7.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:C/C:H/I:H/A:N", "severity": "high", "base_score": 8.2}]}, "cvss_score": 8.2, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:C/C:H/I:H/A:N", "cwe": "CWE-862", "description": "Velociraptor 允许通过笔记本中的 VQL 查询来安排新集合。对于计划新收集的用户，他们需要 COLLECT_CLIENT 权限。但是，当用户可以运行重置授权提供程序的 VQL 查询时，不会强制执行此操作。\n\n这允许可以运行任意 VQL 的用户（通常具有“分析师”角色）启动新集合（通常需要“调查员”角色）。此漏洞是从分析师角色升级为调查员角色。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-08-12", "level": "High", "mps_id": "MPS-dfiw-k783", "poc": false, "poc_url": [], "published_time": "2026-08-12", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-dfiw-k783", "name": "https://www.oscs1024.com/hd/MPS-dfiw-k783"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-64954", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-64954"}, {"url": "http://docs.velociraptor.app/announcements/advisories/cve-2026-64954/", "name": ""}, {"url": "https://github.com/Velocidex/velociraptor/commit/d7de958e846d3742a7a3a8538fd463e4f12fc528", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-64954漏洞", "_translated": true, "_saved_at": "2026-08-12T12:55:02+00:00", "_first_saved_at": "2026-08-12T07:15:48+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-dfiw-k783"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过构造恶意的数据，将过多的数据输入到程序的缓冲区中，使得缓冲区的空间被填满，从而溢出到程序的栈 (stack) 或堆 (heap) 中，导致程序崩溃、拒绝服务、数据泄露等安全问题。\n", "title": "什么是经典缓冲区溢出"}, {"content": "| 类型        | 描述                                                         |\n| ----------- | ------------------------------------------------------------ |\n| 代码注入攻击      | 攻击者通过向程序的缓冲区输入恶意代码，从而控制程序执行流程，实现对程序操作的恶意操作。例如，攻击者可以通过向 Web 应用程序的输入框中输入恶意代码，从而执行任意的代码，破坏系统、窃取数据等。 |\n| 数据覆盖攻击      | 攻击者通过向程序的缓冲区输入过多的数据，从而覆盖程序中的重要数据或代码，实现对程序操作的恶意操作。例如，攻击者可以通过向聊天应用程序的输入框中输入过多的表情符号，从而覆盖程序中的重要数据，例如聊天消息、账号密码等。 |\n| 栈溢出攻击 | 攻击者通过向程序的栈中输入过多的数据，从而溢出到栈外部，实现对程序操作的恶意操作。例如，攻击者可以通过向游戏应用程序的输入框中输入过多的道具名称，从而覆盖程序中的重要数据，例如游戏数据、账号密码等。 |\n| 堆溢出攻击       | 攻击者通过向程序的堆中输入过多的数据，从而溢出到堆外部，实现对程序操作的恶意操作。例如，攻击者可以通过向操作系统工具的输入框中输入过多的命令，从而覆盖程序中的重要数据，例如系统文件、配置文件等。 |", "title": "经典缓冲区溢出常见的攻击方式"}, {"content": "- 输入验证：在程序输入处对输入数据进行严格的验证和过滤，确保输入数据符合预期的格式和类型，避免被攻击者注入恶意命令或数据。可以使用正则表达式、格式字符串等方式进行输入验证。\n- 输出过滤：在程序输出处对输出数据进行严格的过滤和检查，确保输出数据符合预期的格式和类型，避免被攻击者截获和篡改。可以使用安全的输出过滤库等方式进行输出过滤。\n- 使用安全的编程模型：使用安全的编程模型，例如避免使用原生的缓冲区管理函数，使用安全的框架和库来处理输入数据和执行命令，避免缓冲区溢出漏洞。\n- 数据库加密和访问控制：对于敏感数据和命令，使用加密和访问控制措施，确保只有授权用户可以访问和执行命令，避免被攻击者窃取和篡改。\n- 定期更新和升级：定期更新和升级应用程序和库的版本，确保应用程序和库的最新版本包含了最新的安全补丁和修复措施，避免安全漏洞的出现和利用。\n- 安全审计和监控：定期对系统和应用程序进行安全审计和监控，及时发现和阻止潜在的安全漏洞和攻击，确保系统和数据的安全和可靠性。", "title": "如何预防经典缓冲区溢出"}], "cnvd_id": "", "cve_id": "CVE-2026-70465", "cvss": {"cvssv31": [{"source": "psirt@fortinet.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.1}]}, "cvss_score": 8.1, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-120", "description": "Fortinet FortiClientWindows 7.4.0 至 7.4.3、FortiClientWindows 7.2.0 至 7.2.11 中存在不检查输入大小的缓冲区复制（“经典缓冲区溢出”）漏洞，可能允许未经身份验证的攻击者更改或制作对目标主机的 DNS 响应，从而通过恶意数据包执行任意代码。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "经典缓冲区溢出", "kind_en": "不检查输入大小的缓冲区复制（“经典缓冲区溢出”）", "last_modified_time": "2026-08-12", "level": "High", "mps_id": "MPS-4vaq-e2y6", "poc": false, "poc_url": [], "published_time": "2026-08-12", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-4vaq-e2y6", "name": "https://www.oscs1024.com/hd/MPS-4vaq-e2y6"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-70465", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-70465"}, {"url": "https://fortiguard.fortinet.com/psirt/FG-IR-26-156", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-70465漏洞", "_translated": true, "_saved_at": "2026-08-12T16:51:49+00:00", "_first_saved_at": "2026-08-12T14:18:04+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-4vaq-e2y6"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-19594", "cvss": {"cvssv31": [{"source": "412d305a-227d-44f9-a262-a31ba44f2aea", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:H/A:H", "severity": "high", "base_score": 8.1}]}, "cvss_score": 8.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:H/A:H", "cwe": "CWE-141", "description": "1.13.0 之前的 Snowflake Python API (`snowflake.core`) 版本中输入清理不足，导致通过两个相关弱点进行混乱的代理权限升级：通过未编码的 `..` 标识符路径段进行路径遍历 (CWE-22)，以及通过查询字符串值中未编码的 `\u0026`/`#`/`=` 字符进行 HTTP 参数污染 (CWE-141)。有权访问基于 Snowflake.core 构建的下游应用程序的攻击者可以通过提供“..”作为对象名称来利用路径遍历，从而导致“snowflake.core”向父资源发出 REST 请求，或者通过将“\u0026”/“#”/“=”注入到自由格式名称字段中来利用参数污染，以覆盖对交换、克隆或重命名操作的限制——所有这些操作都在应用程序的特权会话下执行。成功利用该漏洞需要攻击者控制基于snowflake.core构建的应用程序中的标识符或对象名称字符串，并将其传递到更高权限的Snowflake会话下的“snowflake.core”（例如，EXECUTE AS OWNER存储过程、Streamlit应用程序或本机应用程序）。 Snowflake Python API 版本 1.13.0 中提供了该修复程序，该版本还解决了一些其他安全问题。用户必须手动升级。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "参数分隔符转义处理不恰当", "kind_en": "参数/参数分隔符的不正确中和", "last_modified_time": "2026-08-12", "level": "High", "mps_id": "MPS-lyni-ud47", "poc": false, "poc_url": [], "published_time": "2026-08-12", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-lyni-ud47", "name": "https://www.oscs1024.com/hd/MPS-lyni-ud47"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-19594", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-19594"}, {"url": "https://pypi.org/project/snowflake.core/1.13.0/", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-19594漏洞", "_translated": true, "_saved_at": "2026-08-12T12:55:01+00:00", "_first_saved_at": "2026-08-12T09:06:54+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-lyni-ud47"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2026-18961", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.1}]}, "cvss_score": 8.1, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-287", "description": "WordPress 的社交登录、密码、Magic Link 和电子邮件 OTP – VentraConnect 插件的无密码登录在 1.4.3 及之前的所有版本中都容易通过未经验证的提供商电子邮件绕过身份验证。这是因为插件信任 Spotify 的 /v1/me 端点返回的未经验证的电子邮件字段作为邮箱所有权的证明 - Generic::normalize_common() 将此值复制到规范化配置文件中，而不需要 email_verified 断言，而 User_Links::link_or_login_user() 随后将其直接传递给 get_user_by('email', $email) 并通过 wp_set_auth_cookie() 发出持久身份验证 cookie无需特定于提供商的验证电子邮件门、本地邮箱质询或登录批准步骤。这使得未经身份验证的攻击者可以通过受控的 Spotify OAuth 流程提供已知的目标电子邮件地址，以任何现有 WordPress 用户（包括管理员）身份登录，从而获得对该网站的完全管理访问权限。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "身份验证不当", "kind_en": "认证不当", "last_modified_time": "2026-08-12", "level": "High", "mps_id": "MPS-q6xk-i9n3", "poc": false, "poc_url": [], "published_time": "2026-08-12", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-q6xk-i9n3", "name": "https://www.oscs1024.com/hd/MPS-q6xk-i9n3"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-18961", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-18961"}, {"url": "https://developer.spotify.com/documentation/web-api/reference/get-current-users-profile", "name": ""}, {"url": "https://plugins.svn.wordpress.org/ventraconnect-social-login/tags/1.4.3/includes/class-oauth.php", "name": ""}, {"url": "https://plugins.svn.word ，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-44741", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-89", "description": "Pimcore 的 Admin Classic Bundle 为 Pimcore 提供了后端 UI。 2.3.6 和 1.7.18 之前的版本在 Pimcore 的翻译网格日期过滤器中存在 SQL 注入漏洞 - 用户提供的过滤器 JSON 中的“property”字段会直接插入到“UNIX_TIMESTAMP(DATE(FROM_UNIXTIME(...)))”SQL 表达式中，而无需参数化或白名单验证。版本 2.3.6 和 1.7.18 修复了该问题。", "effects": [{"comp_name": "pimcore/admin-ui-classic-bundle", "ecosystem": "composer", "versions": [{"affected_version": "(-∞,1.7.18)", "min_fixed_version": "1.7.18", "repository": "composer", "solutions": [], "upstream": true}, {"affected_version": "[2.0.0-RC1,2.3.6)", "min_fixed_version": "2.3.6", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-08-13", "level": "High", "mps_id": "MPS-fz05-kor3", "poc": false, "poc_url": [], "published_time": "2026-08-13", "reference_url_list": [{"url": "https://github.com/pimcore/pimcore/security/advisories/GHSA-h4ph-crvj-9h92", "name": ""}, {"url": "https://github.com/pimcore/admin-ui-classic-bundle/pull/1111", "name": ""}, {"url": "https://github.com/pimcore/admin-ui-classic-bundle/commit/80e57a23d9e19574eddfe9b08e8f26785b2b0d90", "name": ""}, {"url": "https://github.com/pimcore/admin-ui-classic-bundle/releases/tag/v2.3.6", "name": ""}, {"url": "https://github.com/advisories/GHSA-h4ph-crvj-9h92", "name": ""}], "scope_influence": "", "tags": ["php", "开源"], "title": "Pimcore admin-ui-classic-bundle 翻译网格日期过滤器 SQL 注入漏洞", "_translated": true, "_saved_at": "2026-08-12T18:54:37+00:00", "_first_saved_at": "2026-08-12T18:54:37+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-fz05-kor3"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "cnvd_id": "", "cve_id": "CVE-2026-73293", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-269", "description": "Semaphore UI 是一个用于管理 DevOps 工具的 Web 界面。  在 2.18.19 之前以及从 2.19.0-alpha3 到 2.19.5-beta5，ProjectMidd ervice.ts”中的异步“verifyPassword”方法和“auth.service.ts”中的“authenticateUser”方法时缺少“await”关键字。在 JavaScript 中，未等待的“Promise”总是真实的。因此，逻辑旨在当密码不正确时抛出“ForbiddenException”。它永远不会执行，因为表达式评估“Promise”对象的存在而不是其解析的布尔结果。通过确保正确等待所有异步身份验证调用，该漏洞在版本 1.18.1 中得到修复。没有官方的解决方法。如果用户被锁定，管理员必须在数据库中手动重置用户的 TOTP 状态。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "认证中关键步骤缺失", "kind_en": "缺少身份验证的关键步骤", "last_modified_time": "2026-08-13", "level": "High", "mps_id": "MPS-u2wl-d7p1", "poc": false, "poc_url": [], "published_time": "2026-08-13", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-u2wl-d7p1", "name": "https://www.oscs1024.com/hd/MPS-u2wl-d7p1"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-49467", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-49467"}, {"url": "https://github.com/smp46/pingvin-share-x/security/advisories/GHSA-59q6-jvp6-w282", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-49467漏洞", "_translated": true, "_saved_at": "2026-08-12T18:54:34+00:00", "_first_saved_at": "2026-08-12T18:54:34+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-u2wl-d7p1"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-73298", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-639", "description": "Microsoft 容器迁移解决方案加速器是一个多服务应用程序，提供多代理、AI 驱动的迁移解决方案，用于将容器服务配置迁移到 Azure Kubernetes 服务。在版本 2.1.2 及更早版本中，容器迁移解决方案加速器中发现了一个安全漏洞，特别是经过身份验证的 IDOR（不安全的直接对象引用），该漏洞允许用户读取、写入   <script>
    const payload = JSON.parse(document.getElementById("payload").textContent);
    const levelLabels = payload.level_labels || {};
    const items = payload.items || [];
    let filtered = items.slice();
    let activeId = null;

    const $ = (id) => document.getElementById(id);
    $("generatedAt").textContent = payload.generated_at || "-";
    $("retention").textContent = payload.retention_days ?? "-";
    $("cutoff").textContent = payload.cutoff_date || "-";
    $("count").textContent = String(payload.count ?? items.length);

    function levelClass(level) {
      const cn = levelLabels[level] || level || "";
      if (level === "Critical" || cn === "严重") return "crit";
      if (level === "High" || cn === "高危") return "high";
      return "other";
    }
    function levelText(level) {
      return levelLabels[level] || level || "-";
    }
    function esc(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }
    function scoreText(v) {
      if (v === null || v === undefined || v === "" || v === -1) return "-";
      return String(v);
    }

    function renderList() {
      const list = $("list");
      $("listCount").textContent = String(filtered.length);
      if (!filtered.length) {
        list.innerHTML = '<div class="empty">没有匹配项</div>';
        return;
      }
      list.innerHTML = filtered.map((it) => {
        const id = it.mps_id || it.cve_id;
        const active = id === activeId ? " active" : "";
        return `
          <button class="item${active}" data-id="${esc(id)}" type="button">
            <div class="item-top">
              <span class="cve">${esc(it.cve_id || it.mps_id || "-")}</span>
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
            </div>
            <div class="title">${esc(it.title || "-")}</div>
            <div class="item-foot">
              <span>CVSS ${esc(scoreText(it.cvss_score))}</span>
              <span>${esc(it.published_time || "-")}</span>
              ${it.poc ? "<span>POC</span>" : ""}
            </div>
          </button>`;
      }).join("");
      list.querySelectorAll(".item").forEach((btn) => {
        btn.addEventListener("click", () => selectById(btn.dataset.id));
      });
    }

    function refsHtml(it) {
      const refs = Array.isArray(it.reference_url_list) ? it.reference_url_list : [];
      const links = [];
      if (it._source_page) links.push({ url: it._source_page, name: "OSCS 详情" });
      if (it.cve_id) links.push({ url: `https://nvd.nist.gov/vuln/detail/${it.cve_id}`, name: "NVD" });
      refs.forEach((r) => {
        if (r && r.url) links.push({ url: r.url, name: r.name || r.url });
      });
      const seen = new Set();
      const uniq = [];
      for (const l of links) {
        if (seen.has(l.url)) continue;
        seen.add(l.url);
        uniq.push(l);
      }
      if (!uniq.length) return '<div class="box">无参考链接</div>';
      return `<div class="refs">${uniq.map((l) =>
        `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name || l.url)}</a>`
      ).join("")}</div>`;
    }

    function articlesHtml(it) {
      const arts = Array.isArray(it.articles) ? it.articles : [];
      if (!arts.length) return "";
      return `<div class="section"><h3>相关说明</h3>${arts.map((a) => `
        <div class="article">
          <h4>${esc(a.title || "说明")}</h4>
          <p>${esc(a.content || "")}</p>
        </div>`).join("")}</div>`;
    }

    function renderDetail(it) {
      const detail = $("detail");
      if (!it) {
        detail.innerHTML = '<div class="empty">暂无数据</div>';
        return;
      }
      const pocUrls = Array.isArray(it.poc_url) ? it.poc_url : [];
      detail.innerHTML = `
        <div class="d-head">
          <div>
            <h1 class="d-title">${esc(it.title || "-")}</h1>
            <div class="ids">
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
              <span class="chip">${esc(it.cve_id || "无 CVE")}</span>
              <span class="chip">${esc(it.mps_id || "-")}</span>
              ${it.poc ? '<span class="chip">有 POC</span>' : ""}
              ${it.exp ? '<span class="chip">有 EXP</span>' : ""}
            </div>
          </div>
          <div class="actions">
            ${it._source_page ? `<a class="btn" href="${esc(it._source_page)}" target="_blank" rel="noopener">OSCS</a>` : ""}
            ${it.cve_id ? `<a class="btn" href="https://nvd.nist.gov/vuln/detail/${esc(it.cve_id)}" target="_blank" rel="noopener">NVD</a>` : ""}
          </div>
        </div>
        <div class="grid">
          <div class="stat"><div class="k">CVSS</div><div class="v">${esc(scoreText(it.cvss_score))}</div></div>
          <div class="stat"><div class="k">向量</div><div class="v">${esc(it.cvss_vector || "-")}</div></div>
          <div class="stat"><div class="k">CWE</div><div class="v">${esc(it.cwe || "-")}</div></div>
          <div class="stat"><div class="k">类型</div><div class="v">${esc(it.kind || it.kind_en || "-")}</div></div>
          <div class="stat"><div class="k">公开</div><div class="v">${esc(it.published_time || "-")}</div></div>
          <div class="stat"><div class="k">利用成本</div><div class="v">${esc(it.exploit_requirement_cost || "-")}</div></div>
          <div class="stat"><div class="k">可利用性</div><div class="v">${esc(it.exploitability || "-")}</div></div>
          <div class="stat"><div class="k">修复建议</div><div class="v">${esc(it.fix_suggestion || "-")}</div></div>
        </div>
        <div class="section"><h3>描述</h3><div class="box">${esc(it.description || "无描述")}</div></div>
        ${it.scope_influence ? `<div class="section"><h3>影响范围</h3><div class="box">${esc(it.scope_influence)}</div></div>` : ""}
        ${pocUrls.length ? `<div class="section"><h3>POC 链接</h3><div class="refs">${pocUrls.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join("")}</div></div>` : ""}
        <div class="section"><h3>参考链接</h3>${refsHtml(it)}</div>
        ${articlesHtml(it)}
      `;
    }

    function selectById(id) {
      const it = filtered.find((x) => (x.mps_id || x.cve_id) === id) ||
                 items.find((x) => (x.mps_id || x.cve_id) === id);
      if (!it) return;
      activeId = it.mps_id || it.cve_id;
      renderList();
      renderDetail(it);
      const btn = document.querySelector(`.item[data-id="${CSS.escape(activeId)}"]`);
      if (btn) btn.scrollIntoView({ block: "nearest" });
      history.replaceState(null, "", "#" + encodeURIComponent(activeId));
    }

    function applyFilter(q) {
      const query = (q || "").trim().toLowerCase();
      filtered = !query ? items.slice() : items.filter((it) => {
        const blob = [
          it.cve_id, it.mps_id, it.title, it.kind, it.kind_en, it.cwe, it.description, it.level
        ].map((x) => String(x || "").toLowerCase()).join(" ");
        return blob.includes(query);
      });
      renderList();
      if (filtered.length) {
        const still = filtered.some((x) => (x.mps_id || x.cve_id) === activeId);
        selectById(still ? activeId : (filtered[0].mps_id || filtered[0].cve_id));
      } else {
        activeId = null;
        renderDetail(null);
      }
    }

    $("search").addEventListener("input", (e) => applyFilter(e.target.value));

    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement !== $("search")) {
        e.preventDefault();
        $("search").focus();
        return;
      }
      if (!filtered.length) return;
      const idx = filtered.findIndex((x) => (x.mps_id || x.cve_id) === activeId);
      if (e.key === "ArrowDown") {
        e.preventDefault();
        const next = filtered[Math.min(filtered.length - 1, Math.max(0, idx) + 1)];
        selectById(next.mps_id || next.cve_id);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        const prev = filtered[Math.max(0, idx - 1)];
        selectById(prev.mps_id || prev.cve_id);
      }
    });

    const hashId = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    if (hashId && items.some((x) => (x.mps_id || x.cve_id) === hashId)) {
      activeId = hashId;
      renderList();
      selectById(hashId);
    } else if (items.length) {
      selectById(items[0].mps_id || items[0].cve_id);
    } else {
      renderList();
      renderDetail(null);
    }
  </script>
</body>
</html>
