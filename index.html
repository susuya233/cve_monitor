: "2026-11-03T21:25:33+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-8a22-d922"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "cnvd_id": "", "cve_id": "CVE-2026-82418", "cvss": {"cvssv31": [{"source": "psirt@us.ibm.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-416", "description": "IBM Watson Speech Services Cartridge 是 IBM Cloud Pak for Data 上的商业语音服务组件，运行于 Red Hat OpenShift 平台，提供语音识别与语音合成能力，其语音运行时随附 Python cryptography 预编译 wheel，wheel 内嵌 OpenSSL 加密库。\n受影响版本中，4.0.0 至 5.4.0 版本随附的 cryptography wheel 内嵌了存在缺陷的 OpenSSL 版本，PKCS#7 签名验证流程在处理签名消息时存在释放后使用缺陷，远程攻击者可向受影响服务提交构造的 PKCS#7 或 S/MIME 签名消息触发该缺陷，破坏内存并执行任意代码。\n修复版本中通过 IBM 发布的 5.4.0 Patch 8 更新语音运行时随附的 cryptography wheel，消除 PKCS#7 签名验证流程中的释放后使用缺陷，该补丁适用于 4.0.0 至 5.4.0 全部受影响版本。", "effects": [{"comp_name": "watson_speech_services_cartridge", "ecosystem": "linux", "versions": [{"affected_version": "[4.0.0,5.4.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "UAF", "kind_en": "免费后使用"  WooCommerce 商店安全插件（插件目录标识 ultimate-security-for-woocommerce），提供 IP 与国家访问限制、登录保护、双因素认证、临时登录等功能。\n受影响版本中，插件将创建临时用户的 AJAX 动作 usfw_create_temporary_user 同时注册到 wp_ajax 与 wp_ajax_nopriv 钩子，未登录访问者可直接请求 admin-ajax.php 触发该动作；处理函数只验证插件在全部前台页面输出的共享 nonce，未执行任何 current_user_can 能力检查，并允许调用方通过 role 参数指定新建账号的角色，攻击者传入 role=administrator 与自身控制的邮箱即可创建站点管理员账号，随后经 WordPress 密码找回流程取得该账号会话并接管站点。\n修复版本中通过，WPScan 将该漏洞标记为无已知修复版本，最新版本 1.0.16 仍受影响，站点可暂时停用并移除该插件，排查并删除来源不明的管理员账号，或通过 WAF 拦截针对 action=usfw_create_temporary_user 的未授权请求。", "effects": [{"comp_name": "ultimate-security-for-woocommerce", "ecosystem": "linux", "versions": [{"affected_version": "[1.0.10,1.0.16]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-11-05", "level": "Critical", "mps_id": "MPS-nu9l-ibps", "poc": false, "poc_url": [], "published_time": "2026-11-05", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-nu9l-ibps", "name": "https://www.oscs1024.com/hd/MPS-nu9l-ibps"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-100109", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-100109"}, {"url": "https://wpscan.com/vulnerability/b4d26eb3-ab32-456e-9f69-9ab300fdf44c/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Security For WooCommerce 未授权提权漏洞", "_translated": true, "_saved_at": "2026-11-05T11:46:06+00:00", "_first_saved_at": "2026-11-05T11:46:06+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-nu9l-ibps"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-123025", "cvss": {"cvssv4": [{"source": "cve@mitre.org", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.4}]}, "cvss_score": 9.4, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-78", "description": "OPNsense os-acme-client 是 OPNsense 防火墙的开源 ACME 客户端插件，基于 acme.sh 实现证书的自动签发与续期，其 Google Cloud DNS 验证模块依赖 gcloud 命令行工具完成 DNS-01 验证。\n受影响版本中，具备证书签发或续期权限的已认证用户可通过 WebGUI/API 将 DNS 验证配置中的 dns_gcloud_key 字段设置为恶意 JSON 内容，DnsGcloud::prepare() 使用 json_decode 提取其中的 project_id 与 client_email 赋值给 gcloud_project 与 gcloud_account 后，未做任何校验或转义，直接拼接进传给 LeUtils::run_shell_command() 的 gcloud 命令字符串，并由 proc_open() 以 root 身份执行，攻击者在 JSON 字段中注入 shell 元字符可以 root 权限执行任意命令。\n修复版本中通过 Shell::exec_safe() 以 %s 占位符构造上述 gcloud 命令，对 gcloud_config、gcloud_key_file、gcloud_account 与 gcloud_project 逐一执行 escapeshellarg 转义后再传入 LeUtils::run_shell_command()，使 dns_gcloud_key 中的可控内容无法再改变 shell 命令结构，切断了命令注入路径。", "effects": [{"comp_name": "os-acme-client", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,4.18)", "min_fixed_version": "4.18", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "低", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-11-05", "level": "Critical", "mps_id": "MPS-xbpe-l75t", "poc": true, "poc_url": [], "published_time": "2026-11-05", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-xbpe-l75t", "name": "https://www.oscs1024.com/hd/MPS-xbpe-l75t"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-123025", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-123025"}, {"url": "https://github.com/opnsense/plugins/pull/5873", "name": ""}], "scope_influence": "", "tags": ["poc", "应用软件"], "title": "OPNsense os-acme-client 命令注入漏洞", "_translated": true, "_saved_at": "2026-11-05T11:46:13+00:00", "_first_saved_at": "2026-11-05T11:46:13+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-xbpe-l75t"}, {"analysis_status": 0, "articles": [{"content": "- 命令注入是一种攻击，其目标是通过易受攻击的应用程序在主机操作系统上执行任意命令。 当应用程序将不安全的用户提供的数据（表单、cookie、HTTP 标头等）传递到系统 shell 时，就会产生缺陷。攻击者通过构造恶意的命令或数据，将其注入到程序执行的上下文中，从而绕过程序的输入验证和安全措施，实现对程序操作的恶意操作。", "title": "什么是命令注入"}, {"content": "- 文件上传：攻击者通过构造恶意的文件上传请求，将包含恶意命令的文件上传到服务器，从而利用命令注入漏洞执行恶意命令。\n- SQL 注入：攻击者通过构造恶意的 SQL 查询语句，将包含恶意命令的 SQL 语句注入到数据库中，从而执行恶意命令，窃取数据或者破坏系统。\n- 命令执行：攻击者通过在 Web 应用程序的表单提交数据中注入恶意命令，从而执行恶意命令，例如删除文件、格式化硬盘等。\n- 命令注入漏洞的旁路攻击：攻击者可以利用命令注入漏洞旁路控制程序的执行流程，从而窃取数据、破坏系统、控制程序等。\n", "title": "命令注入常见的攻击方式"}, {"content": "- 输入验证：在程序输入处对输入数据进行严格的验证和过滤，确保输入数据符合预期的格式和类型，避免被攻击者注入恶意命令。\n- 输出过滤：在程序输出处对输出数据进行严格的过滤和检查，确保输出数据符合预期的格式和类型，避免被攻击者截获和篡改。\n- 使用安全的编程模型：使用安全的编程模型，例如避免使用原生的命令执行方式，使用安全的框架和库来处理输入数据和执行命令，避免命令注入漏洞。\n- 数据库加密和访问控制：对于敏感数据和命令，使用加密和访问控制措施，确保只有授权用户可以访问和执行命令，避免被攻击者窃取和篡改。\n- 定期更新和升级：定期更新和升级应用程序和库的版本，确保应用程序和库的最新版本包含了最新的安全补丁和修复措施，避免安全漏洞的出现和利用。\n- 安全审计和监控：定期对系统和应用程序进行安全审计和监控，及时发现和阻止潜在的安全漏洞和攻击，确保系统和数据的安全和可靠性。", "title": "如何预防命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-122051", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:N/AC:L/Au:N/C:C/I:C/A:C", "severity": "high", "base_score": 10}], "cvssv3": [{"source": "VulDB", "vector": "CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H/E:P/RL:X/RC:C", "severity": "critical", "base_score": 10}], "cvssv31": [{"source": "cna@vuldb.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 10}], "cvssv4": [{"source": "cna@vuldb.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-77", "description": "Edimax BR-6208AC 是 Edimax 推出的双频无线路由器，运行闭源固件，通过内置 Boa Web 服务提供设备管理界面，面向家庭与小规模办公网络。\n受影响版本中，固件 1.32 的管理端点 /goform/mp 通过 websGetVar 读取 POST 参数 command，仅在该值首个分号处截断，未做其他过滤，随后以 sprintf 将其拼接为固定命令模板 /bin/rftest.sh %s \u003e /tmp/rftest.out 并传入 system() 执行；攻击者在 command 参数中插入管道符可绕过分号截断处理，使任意命令在设备系统上以 Web 服务进程权限运行，公开 PoC 已验证可远程创建文件并回显执行结果。\n修复版本中通过，可通过将设备管理界面限制于可信网络、关闭面向外网的远程管理能力并阻断对 /goform/mp 的未授权访问来降低风险；厂商在披露前已收到通报但未回应，截至 2026-11-05 未发布修复固件，后续需关注 Edimax 官方固件更新并在新版本发布后及时升级。", "effects": [{"comp_name": "br-6208ac", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.32]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "命令注入", "kind_en": "命令中使用的特殊元素的不正确中和（“命令注入”）", "last_modified_time": "2026-11-05", "level": "Critical", "mps_id": "MPS-9a4s-u2yf", "poc": false, "poc_url": [], "published_time": "2026-11-05", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-9a4s-u2yf", "name": "https://www.oscs1024.com/hd/MPS-9a4s-u2yf"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-122051", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-122051"}, {"url": "https://vuldb.com/vuln/431135", "name": "VDB-431135 | Edimax BR-6208AC mp command injection"}, {"url": "https://vuldb.com/vuln/431135/cti", "name": "VDB-431135 | CTI Indicators (IOB, IOC, TTP, IOA)"}, {"url": "https://vuldb.com/cve/CVE-2026-122051", "name": "CVE-2026-122051 | CVE Analysis and Report"}, {"url": "https://vuldb.com/submit/1025459", "name": "Submit #1025459 | Edimax BR-6208AC BR-6208AC_1.32 Command Injection"}, {"url": "https://github.com/fizz-is-on-the-way/Iot_vuls/tree/main/BR-6208AC/RCE_mp", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Edimax BR-6208AC命令注入漏洞", "_translated": true, "_saved_at": "2026-11-05T03:01:11+00:00", "_first_saved_at": "2026-11-05T03:01:11+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-9a4s-u2yf"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-63774", "cvss": {"cvssv31": [{"source": "ics-cert@hq.dhs.gov", "vector": "CVSS:3.1/AV:A/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9}], "cvssv4": [{"source": "ics-cert@hq.dhs.gov", "vector": "CVSS:4.0/AV:A/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.4}]}, "cvss_score": 9.4, "cvss_vector": "CVSS:4.0/AV:A/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-89", "description": "PowerSYSTEM Center 是 Subnet Solutions 开发的闭源 OT 数据平台，面向能源与关键制造行业，用于电网运行数据的采集、管理与可视化，漏洞位于其报表设计器（report designer）功能。\n受影响版本中，报表设计器对用户提交的输入校验不足，经过身份认证的用户可构造包含 SQL 语法的输入并进入后端数据库查询执行，从而执行未授权 SQL 命令，按官方 CVSS 评估可造成高程度的信息泄露、数据篡改与可用性影响，且危害范围可跨越安全边界。\n修复版本中通过官方发布的 PowerSYSTEM Center 2026 Update 1.1 完成修复，官方建议受影响用户升级至该版本；无法升级时，官方建议禁用用户对报表设计器的访问。", "effects": [{"comp_name": "Subnet Solutions PowerSYSTEM Center 2024", "ecosystem": "linux", "versions": [{"affected_version": "[6.0,6.2]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "Subnet Solutions PowerSYSTEM Center 2026", "ecosystem": "linux", "versions": [{"affected_version": "[7.0,7.1]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-11-06", "level": "Critical", "mps_id": "MPS-d4ij-7n0r", "poc": false, "poc_url": [], "published_time": "2026-11-06", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-d4ij-7n0r", "name": "https://www.oscs1024.com/hd/MPS-d4ij-7n0r"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-63774", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-63774"}, {"url": "https://github.com/cisagov/CSAF/blob/develop/csaf_files/OT/white/2026/icsa-26-307-01.json", "name": ""}, {"url": "https://www.cisa.gov/news-events/ics-advisories/icsa-26-307-01", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "PowerSYSTEM Center报表设计器SQL注入漏洞", "_translated": true, "_saved_at": "2026-11-06T07:33:14+00:00", "_first_saved_at": "2026-11-06T07:33:14+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-d4ij-7n0r"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-63017", "cvss": {"cvssv31": [{"source": "ics-cert@hq.dhs.gov", "vector": "CVSS:3.1/AV:A/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9}], "cvssv4": [{"source": "ics-cert@hq.dhs.gov", "vector": "CVSS:4.0/AV:A/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.4}]}, "cvss_score": 9.4, "cvss_vector": "CVSS:4.0/AV:A/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-863", "description": "PowerSYSTEM Center 是 Subnet Solutions 公司的商业闭源电网设备管理平台，用于变电站自动化、设备监控与数据采集（SCADA/EMS），并通过 Client Access Server 向用户提供 Web 客户端访问。\n受影响版本中，平台对管理员限定资源的授权校验存在缺陷（CWE-863），低权限普通用户完成身份认证后可越权访问仅限管理员使用的资源；CISA 协调公告同时建议禁用 PowerSYSTEM Center Client Access Server 用户访问浏览器 F12 开发者工具，并监控用户活动记录作为缓解手段。\n修复版本中通过厂商安全更新更正授权控制，阻止低权限用户访问管理员限定资源；Subnet Solutions 已在 PowerSYSTEM Center 2020 Update 30 与 PowerSYSTEM Center 2026 Update 1.1 中完成修复，PowerSYSTEM Center 2024 用户需升级至 PowerSYSTEM Center 2026 Update 1.1。", "effects": [{"comp_name": "PowerSYSTEM Center 2020", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,5.29.x]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "PowerSYSTEM Center 2024", "ecosystem": "linux", "versions": [{"affected_version": "[6.0.x,6.2.x]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "PowerSYSTEM Center 2026", "ecosystem": "linux", "versions": [{"affected_version": "[7.0.x,7.1.x]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-11-06", "level": "Critical", "mps_id": "MPS-knvu-q8xz", "poc": false, "poc_url": [], "published_time": "2026-11-06", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-knvu-q8xz", "name": "https://www.oscs1024.com/hd/MPS-knvu-q8xz"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-63017", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-63017"}, {"url": "https://www.cisa.gov/news-events/ics-advisories/icsa-26-307-01", "name": ""}, {"url": "https://github.com/cisagov/CSAF/blob/develop/csaf_files/OT/white/2026/icsa-26-307-01.json", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "PowerSYSTEM Center越权访问漏洞", "_translated": true, "_saved_at": "2026-11-06T07:33:16+00:00", "_first_saved_at": "2026-11-06T07:33:16+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-knvu-q8xz"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-59105", "cvss": {"cvssv31": [{"source": "a6d3dc9e-0591-4a13-bce7-0f5b31ff6158", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}], "cvssv4": [{"source": "a6d3dc9e-0591-4a13-bce7-0f5b31ff6158", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-1391", "description": "Jumis（原 Tildes Jumis）是拉脱维亚 Jumis Pro SIA（原 SIA Tilde）开发的闭源 Windows 财务记账软件，账套数据存储在 Microsoft SQL Server 数据库中，共享部署模式下多个客户的数据库可位于同一台服务器。\n受影响版本中，客户端为管理数据库创建并使用名为 ##Tilde_JumisAdmin## 的 SQL Server 登录，该登录属于 sysadmin 固定服务器角色，其口令并非逐安装随机生成，而是在客户端代码中由硬编码常量与 SQL Server 服务器名（@@servername）确定性推导得到，推导逻辑在所有安装中完全相同；实例后缀为固定值，主机名可经 SQL Server Browser 服务（UDP 1434）、TDS pre-login 响应或 DNS/NetBIOS 获取，能够访问该 SQL Server 实例的攻击者可离线计算出口令并直接以 sysadmin 身份认证，获得实例上全部客户账套数据库的读写权限，本地服务器版运行期间还会启用 xp_cmdshell，攻击者可进一步在数据库服务器上执行操作系统命令。\n修复版本中通过停止从服务器名推导通用管理口令解决该问题，自 TJ7.0.141.36（2026 年 7 月版）起，升级后的数据库不再允许 ##Tilde_JumisAdmin## 登录访问，旧数据库中该登录仅保留受限 public 账户，通用口令不再可用于获取 sysadmin 权限。", "effects": [{"comp_name": "jumis", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,TJ7.0.141.36)", "min_fixed_version": "TJ7.0.141.36", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "", "kind_en": "", "last_modified_time": "2026-11-06", "level": "Critical", "mps_id": "MPS-4eqf-5kc3", "poc": false, "poc_url": [], "published_time": "2026-11-06", "reference_url_list": [{"url": "https://www ence": "", "tags": ["应用软件"], "title": "Tracecat SAML签名验证绕过漏洞", "_translated": true, "_saved_at": "2026-11-06T21:12:53+00:00", "_first_saved_at": "2026-11-06T21:12:53+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-i72e-olwc"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "cnvd_id": "", "cve_id": "CVE-2026-124040", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.1}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:H/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.2}]}, "cvss_score": 9.2, "cvss_vector": "CVSS:4.0/AV:N/AC:H/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-416", "description": "CivetWeb 是一个开源的 C 语言嵌入式 Web 服务器与 HTTP 库，可集成到应用程序中提供 HTTP/HTTPS 服务，并通过实验性模块支持 HTTP/2 协议。\n受影响版本中，当服务以 USE_HTTP2 宏编译且配置 enable_http2 开启时，handle_http2() 在处理 HEADERS 帧时将 HPACK 解码出的 :method 与 :path 伪头部值所在的堆缓冲指针同时保存到 conn-\u003erequest_info 的 request_method、local_uri、request_uri 与 loca VE-2026-121727", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-121727"}, {"url": "https://github.com/jorisvink/kore/commit/1ff3c0f6f7973dc7fc8bf38369790ef2d8079b3b", "name": "Patch Commit"}, {"url": "https://github.com/jorisvink/kore", "name": ""}, {"url": "https://kore.io/releases/4.3.0", "name": "Kore 4.3.0 Release Notes"}, {"url": "https://github.com/jorisvink/kore/blob/4.3.0-rc5/src/http.c#L934", "name": ""}, {"url": "https://www.vulncheck.com/advisories/kore-before-4.3.0-integer-underflow-memory-exhaustion-via-http-header-recv", "name": "VulnCheck Advisory: Kore before 4.3.0 Integer Underflow Memory Exhaustion via http_header_recv()"}], "scope_influence": "", "tags": ["应用软件"], "title": "kore整数下溢内存耗尽漏洞", "_translated": true, "_saved_at": "2026-11-04T01:49:02+00:00", "_first_saved_at": "2026-11-04T01:49:02+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-fdx5-iklq"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-121731", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H min_fixed_version": "5.19.12", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "org.apache.activemq:activemq-broker", "ecosystem": "maven", "versions": [{"affected_version": "[6.0.0,6.3.3)", "min_fixed_version": "6.3.3", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "(-∞,5.19.12)", "min_fixed_version": "5.19.12", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "输入验证不恰当", "kind_en": "输入验证不当", "last_modified_time": "2026-11-04", "level": "High", "mps_id": "MPS-18ca-568c", "poc": false, "poc_url": [], "published_time": "2026-11-04", "reference_url_list": [{"url": "https://www.openwall.com/lists/oss-security/2026/11/03/17", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-108946", "name": ""}, {"url": "https://activemq.apache.org/", "name": ""}, {"url": "https://github.com/apache/activemq/pull/2682", "name": ""}, {"url": "https://github.com/apache/activemq/commit/afdbf624c92d60a5adef62d7fc584bb5d09fb33b", "name": ""}, {"url": "https://github.com/apache/activemq/commit/d7665d7497f7e48b676a62a0e294b512fa2dc9d3", "name": ""}, {"url": "https://github.com/apache/activemq/commit/ce5794bd44b7636b63ea4736eb5419472d3cb4c0", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "ActiveMQ连接标识校验缺失漏洞", "_translated": true, "_saved_at": "2026-11-03T21:25:34+00:00", "_first_saved_at": "2026-11-03T21:25:34+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-18ca-568c"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-87040", "cvss": {"cvssv31": [{"source": "vulnerabilities@zephyrproject.org", "vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:U/C:L/I:H/A:H", "severity": "high", "base_score": 8.3}]}, "cvss_score": 8.3, "cvss_vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:U/C:L/I:H/A:H", "cwe": "CWE-787", "description": "Zephyr 是 Linux 基金会旗下 Zephyr 项目开源维护的嵌入式实时操作系统，其蓝牙 LE 控制器为 Nordic nRF 系列射频提供链路层实现，广泛用于物联网、医疗与工业嵌入式设备的低功耗蓝牙通信。\n受影响版本中，nRF 链路层接收路径未校验空口 PDU 头部 LENGTH 字段是否超过无线收发器配置的最大接收长度。lll_conn.c 中 isr_rx_pdu() 在序列号与 MIC 校验通过后直接入队任意非空数据 PDU，而 nRF radio 硬件仅按 PCNF1.MAXLEN 截断 payload 并原样保存头部长度字节，攻击者在无线信号范围内发送长度字节最大为 255 的伪造 PDU（控制器默认编程的 lll-\u003edle.eff.max_rx_octets 为 27），形成 len 字段大于缓冲区实际容量的 node_rx；该缓冲区随后进入 hci.c 的 hci_acl_encode()，其 net_buf_add(buf, pdu_data-\u003elen) 与 memcpy 按未校验长度越界读取约 228 字节并越界写入 HCI ACL 缓冲池相邻内存，ISO 接收路径经 isoal_rx_append_to_sdu() 同样越界读取并把控制器内存作为 ISO 数据上送主机，导致远程内存破坏、控制器崩溃与内存信息泄露。\n修复版本中通过在接收路径统一增加长度边界校验解决该问题：isr_rx_pdu() 在解密后调用新增的 max_rx_octets_get() 比对 pdu_data_rx-\u003elen，超长 PDU 返回 -EINVAL 丢弃，lll_central_iso.c 与 lll_peripheral_iso.c 按 cis_lll-\u003erx.max_pdu、lll_sync_iso.c 按 lll-\u003emax_pdu、lll_scan_aux.c 按 LL_EXT_OCTETS_RX_MAX 同样丢弃超长 PDU，超长帧不再进入入队与 HCI 编码流程，越界读写与内存泄露链路被切断。", "effects": [{"comp_name": "zephyr", "ecosystem": "linux", "versions": [{"affected_version": "[4.4.0,4.5.0)", "min_fixed_version": "4.5.0", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[1.6.0,4.3.2)", "min_fixed_version": "4.3.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "  "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "表达式语言注入", "kind_en": "表达式语言语句中使用的特殊元素的不正确中和（“表达式语言注入”）", "last_modified_time": "2026-11-04", "level": "High", "mps_id": "MPS-00a1-18e7", "poc": false, "poc_url": [], "published_time": "2026-11-04", "reference_url_list": [{"url": "https://seclists.org/fulldisclosure/2026/Nov/7", "name": ""}, {"url": "https://github.com/apache/struts", "name": ""}, {"url": "https://github.com/apache/struts/blob/STRUTS_7_4_0/core/src/main/java/org/apache/struts2/ognl/SecurityMemberAccess.java", "name": ""}, {"url": "https://github.com/apache/struts/blob/STRUTS_7_4_0/core/src/main/resources/struts-excluded-classes.xml", "name": ""}, {"url": "https://github.com/apache/struts/blob/STRUTS_7_4_0/core/src/main/resources/org/apache/struts2/default.properties", "name": ""}, {"url": "https://struts.apache.org/security/", "name": ""}, {"url": "https://central.sonatype.com/artifact/org.apache.struts/struts2-core/7.4.0", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "Struts2 OGNL沙箱绕过", "_translated": true, "_saved_at": "2026-11-04T08:27:12+00:00", "_first_saved_at": "2026-11-04T08:27:12+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-00a1-18e7"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-87041", "cvss": {"cvssv31": [{"source": "vulnerabilities@zephyrproject.org", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-822", "description": "Zephyr 是 Linux 基金会托管的开源嵌入式实时操作系统，面向资源受限的物联网与嵌入式设备，RTIO 子系统为其提供异步 I/O 提交队列机制，并支持在 CONFIG_USERSPACE 下由用户态线程提交 I/O 请求。\n受影响版本中，RTIO 用户态提交队列校验函数 rtio_vrfy_sqe()（v4.3.0 前位于 subsys/rtio/rtio_handlers.c，其后位于 subsys/rtio/rtio_syscalls.c）使用 \u0026= 将 K_SYSCALL_MEMORY() 的返回值累加进 valid_sqe 标志，而该宏基于 K_SYSCALL_VERIFY_MSG() 实现、校验失败时返回非零值，导致缓冲区权限检查结果被反向采用。用户态线程经 rtio_sqe_copy_in_get_handles() 系统调用提交 SQE 时，指向内核内存的 tx.buf、rx.buf 或 txrx.tx_buf/txrx.rx_buf 指针被判定为合法并原样转发给 I2C、I3C、SPI 等 RTIO 总线驱动以内核特权解引用：RTIO_OP_RX 提交使外设数据写入攻击者指定的内核地址，RTIO_OP_TX 提交使内核内存经总线外泄，指向未映射地址的提交触发内核崩溃，攻击者由此突破 CONFIG_USERSPACE 用户态隔离边界。\n修复版本中通过为 RTIO_OP_TX、RTIO_OP_RX 与 RTIO_OP_TXRX 分支中的每处 K_SYSCALL_MEMORY() 检查结果取反后再累加进 valid_sqe，恢复权限判定的正确极性，使调用线程不可访问的缓冲区提交被拒绝，同时将 TXRX 发送缓冲区改为只读校验以对齐 SPI、I2C 与 I3C 处理器的既有行为，阻断内核内存经发送通道外泄。", "effects": [{"comp_name": "zephyr", "ecosystem": "linux", "versions": [{"affected_version": "[3.3.0,4.3.2)", "min_fixed_version": "4.3.2", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[4.4.0,4.5.0)", "min_fixed_version": "4.5.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "非可信指针解引用", "kind_en": "Untrusted Pointer Dereference", "last_modified_time": "2026-11-04", "level": "High", "mps_id": "MPS-8kvr-5yqf", "poc": false, "poc_url": [], "published_time": "2026-11-04", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-8kvr-5yqf", "name": "https://www.oscs1024.com/hd/MPS-8kvr-5yqf"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-87041", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-87041"}, {"url": "https://github.com/zephyrproject-rtos/zephyr/commit/454a848006595ce2d77fc2c9e458b0c557f5e4af", "name": "Fix commit"}, {"url": "https://github.com/zephyrproject-rtos/zephyr/security/advisories/GHSA-mvxr-jx9h-jxh4", "name": "GHSA-mvxr-jx9h-jxh4"}], "scope_influence": "", "tags": ["应用软件"], "title": "Zephyr RTIO 内核内存越权读写漏洞", "_translated": true, "_saved_at": "2026-11-04T08:27:15+00:00", "_first_saved_at": "2026-11-04T08:27:15+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-8kvr-5yqf"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-112445", "cvss": {}, "cvss_score": 7.8, "cvss_vector": "", "cwe": "CWE-250", "description": "macOS 是 Apple 开发的闭源桌面操作系统，launchd 作为系统首进程负责系统域后台作业的调度，/System/Library/LaunchDaemons 目录中的作业配置默认以 root 权限运行。\n受影响版本中，系统自带作业 com.apple.xpc.uscwoap 以 BootShell 配置启动 /bin/bash（参数 bash -sh），并将标准输入、输出与错误全部连接到 /dev/console，该作业位于 launchd 系统域且未指定降权账户，bash 进程以 UID 0 运行并从 /dev/console 读取命令；登录活动图形控制台的非管理员账号可以通过 launchctl 作业控制接口 kickstart 该作业，此时 /dev/console 设备由当前控制台用户持有，攻击者通过 TIOCSTI 终端控制接口向其输入队列注入字符，root 权限的 bash 将注入字符当作命令解释并执行，攻击者借此让 root bash 对自身副本执行 chown 0:0 与 chmod 4755，再运行该 setuid 副本获得 root shell，完成本地权限提升。\n修复版本中通过移除 com.apple.xpc.uscwoap 的 LaunchDaemon 配置切断上述利用链，macOS 27.2 删除该作业配置后，系统中不再存在以 root 身份从 /dev/console 读取命令的 bash 作业，TIOCSTI 注入路径随之失效，普通用户无法继续借道该作业获得 root 权限。", "effects": [{"comp_name": "macos", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,27.2)", "min_fixed_version": "27.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "高", "fix_suggestion": "建议修复", "kind": "带着不必要的权限执行", "kind_en": "使用不必要的权限执行", "last_modified_time": "2026-11-04", "level": "High", "mps_id": "MPS-9174-0892", "poc": true, "poc_url": [], "published_time": "2026-11-04", "reference_url_list": [{"url": "https://securityonline.info/macos-privilege-escalation-poc-cve-2026-112445/", "name": ""}, {"url": "https://github.com/Mas0nShi/CVE-2026-112445", "name": ""}, {"url": "https://support.apple.com/en-us/149521", "name": ""}], "scope_influence": "", "tags": ["poc", "操作系统"], "title": "macOS 本地权限提升漏洞", "_translated": true, "_saved_at": "2026-11-04T08:27:10+00:00", "_first_saved_at": "2026-11-04T08:27:10+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-9174-0892"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-87039", "cvss": {"cvssv31": [{"source": "vulnerabilities@zephyrproject.org", "vector": "CVSS:3.1/AV:L/AC:H/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:H/PR:L/UI:N/S:C/C:H/I:H/A:H", "cwe": "CWE-787", "description": "Zephyr 是 Zephyr Project 开源的嵌入式实时操作系统，广泛用于物联网与资源受限设备，其 CONFIG_USERSPACE 机制为用户态线程提供内核隔离，I2S 音频驱动位于内核 drivers/i2s 目录并由系统调用校验层保护。\n受影响版本中，drivers/i2s/i2s_handlers.c 的系统调用校验函数 z_vrfy_i2s_configure() 从用户内存拷贝 struct i2s_config 后，当 cfg-\u003eframe_clk_freq 为 0（取消流配置请求）时跳过 K_SYSCALL_OBJ(config.mem_slab, K_OBJ_MEM_SLAB) 对象归属校验与 block_size 合法性检查，未经校验的用户可控 mem_slab 指针直接传入驱动；drivers/i2s/i2s_litex.c 的 i2s_litex_configure() 对该场景仅记录告警，随后 memcpy() 保存完整配置并将流状态置为 I2S_STATE_READY，之后的 i2s_trigger(I2S_TRIGGER_START) 使能 FIFO 中断，中断处理函数 i2s_litex_isr_rx() 与 i2s_litex_isr_tx() 在内核态对攻击者提供的指针执行 k_mem_slab_alloc() 与 k_mem_slab_free()，构成内核态任意指针读写原语，绕过 CONFIG_USERSPACE 隔离边界；持有 I2S 设备对象访问权限的用户态线程单次 i2s_configure() 调用可触发，未启用 CONFIG_USERSPACE 的构建不受影响。\n修复版本中通过在 frame_clk_freq 为 0 的取消配置分支内清零 config.mem_slab 与 config.block_size 后再调用实现函数，驱动在该路径不再收到未校验指针，切断未校验指针进入驱动的传递链，同时保留调用方不持有内存 slab 时的取消流配置能力。", "effects": [{"comp_name": "zephyr", "ecosystem": "linux", "versions": [{"affected_version": "[4.4.0,4.5.0)", "min_fixed_version": "4.5.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_r g Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-121729", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:L/I:H/A:H", "severity": "high", "base_score": 8.3}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:L/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:L/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-862", "description": "emailflare 是 0xdps 开源（MIT 许可证）的自托管邮件发送平台，基于 Cloudflare Workers 构建，提供域名管理、API Key 发信接口（/v1/send）、收件箱、模板与统计等能力，代码以 pnpm monorepo 组织，包含 inbox-worker、inbox-server 服务与 email-core、inbox-core 等内部包。\n受影响版本中，inbox 服务的 /api/keys 路由仅要求登录会话而缺少角色授权：services/inbox-worker/src/routes/keys.ts 与 services/inbox-server/src/routes/keys.ts 的 GET /、POST /、DELETE /:id 处理逻辑均未挂载 requireAdmin 中间件，member、tester 等低权限已认证用户可以列出全部 API Key、创建新 Key 并吊销任意 Key；同时 email-core 的 keyCreateSchema 将 scope 默认值设为 global，缺省创建的 live 类型 Key（eflive_ 前缀）为全局作用域，而 /v1/* 的 requireApiKey 中间件对 global 作用域 Key 不做发信域名限制，攻击者可以铸造全局发信 Key 并以任意域名发送邮件，或吊销存量 Key 使依赖方集成失效。\n修复版本中通过在两个服务的 keys 路由注册 app.use(\"*\", requireAdmin) 并在 GET、POST、DELETE 各路由上追加该中间件，将 /api/keys 的访 x_suggestion": "建议修复", "kind": "系统设置或配置在外部可控制", "kind_en": "系统或配置设置的外部控制", "last_modified_time": "2026-11-05", "level": "High", "mps_id": "MPS-16cd-7i5a", "poc": false, "poc_url": [], "published_time": "2026-11-05", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-16cd-7i5a", "name": "https://www.oscs1024.com/hd/MPS-16cd-7i5a"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-13292", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-13292"}, {"url": "https://www.ibm.com/support/pages/node/7294641", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "IBM MQ环境变量注入漏洞", "_translated": true, "_saved_at": "2026-11-04T22:20:05+00:00", "_first_saved_at": "2026-11-04T22:20:05+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-16cd-7i5a"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-118869", "cvss": {"cvssv3": [{"source": "vultures@jpcert.or.jp", "vector": "CVSS:3.0/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}], "cvssv4": [{"source": "vultures@jpcert.or.jp", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/M url_list": [{"url": "https://www.oscs1024.com/hd/MPS-kify-taw4", "name": "https://www.oscs1024.com/hd/MPS-kify-taw4"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-76892", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-76892"}, {"url": "https://github.com/tsparticles/tsparticles/security/advisories/GHSA-4p8p-pjpq-2w7h", "name": "https://github.com/tsparticles/tsparticles/security/advisories/GHSA-4p8p-pjpq-2w7h"}, {"url": "https://github.com/tsparticles/tsparticles/pull/5875", "name": "https://github.com/tsparticles/tsparticles/pull/5875"}, {"url": "https://github.com/tsparticles/tsparticles/commit/25fb70e7f527a91568adaef576570289083f243b", "name": "https://github.com/tsparticles/tsparticles/commit/25fb70e7f527a91568adaef576570289083f243b"}], "scope_influence": "", "tags": ["AI", "npm", "开源"], "title": "tsParticles MCP服务器拒绝服务漏洞", "_translated": true, "_saved_at": "2026-11-05T03:01:13+00:00", "_first_saved_at": "2026-11-05T03:01:13+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-kify-taw4"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-123033", "cvss": {"cvssv31": [{"source": "cve@mitre.org", "vector": "CVSS:3.1/AV:A/AC:H/PR:N/UI:N/S:C/C:H/I:H/A:H", "severity": "high", "base_score": 8.3}]}, "cvss_score": 8.3, "cvss_vector": "CVSS:3.1/AV:A/AC:H/PR:N/UI:N/S:C/C:H/I:H/A:H", "cwe": "CWE-290", "description": "TrueNAS SCALE 是 iXsystems 开发的开源网络存储操作系统，middlewared 是其核心中间件服务，通过 WebSocket API 对外提供系统管理能力。\n受影响版本中，middlewared 在 setup 阶段无条件注册 core.on_connect 钩子 ha_permission，不检查 failover 许可与心跳接口；该钩子在 app.origin.is_ha_connection 为真时调用 AuthService.session_manager.login，授予 TruenasNodeSessionManagerCredentials 节点凭据，而该凭据对所有 API 方法具备完整管理员权限。ConnectionOrigin.is_ha_connection 仅校验对端地址属于硬编码心跳地址 169.254.10.1/169.254.10.2 且对端端口不超过 1024，两者均为攻击者自身套接字的属性，同一二层网段内的攻击者把本机地址设为上述链路本地心跳地址并绑定特权源端口后连接管理接口，未认证的 WebSocket 连接便能通过节点凭据校验获得完整管理员 API 权限，进而以 root 身份执行命令。\n修复版本中通过在 is_ha_connection 中追加本地端点校验切断该链路，要求连接终止于本机 HA 心跳监听器，本地地址属于 169.254.10.1/169.254.10.2、本地端口为 6000 且本地地址与对端地址不同；该监听器仅绑定在 HA 心跳接口上，nginx 不会向其转发流量，攻击者无法控制本地端点，管理接口上的普通流量不再满足节点凭据授予条件。", "effects": [{"comp_name": "truenas_scale", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,25.10.8)", "min_fixed_version": "25.10.8", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "使用欺骗进行的认证绕过", "kind_en": "通过欺骗绕过身份验证", "last_modified_time": "2026-11-05", "level": "High", "mps_id": "MPS-4hou-cxvt", "poc": false, "poc_url": [], "published_time": "2026-11-05", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-4hou-cxvt", "name": "https://www.oscs1024.com/hd/MPS-4hou-cxvt"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-123033", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-123033"}, {"url": "https://security.truenas.com/scale/impact-statements/ha-node-auth-bypass/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "TrueNAS SCALE认证绕过漏洞", "_translated": true, "_saved_at": "2026-11-05T11:46:11+00:00", "_first_saved_at": "2026-11-05T11:46:11+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-4hou-cxvt"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-121489", "cvss": {}, "cvss_score": 8.1, "cvss_vector": "", "cwe": "CWE-22", "description": "Apache Juneau 是 Apache 软件基金会开源的 Java 序列化与 REST 微服务框架，juneau-microservice-core 模块内置的 DirectoryResource 资源用于通过 REST 接口浏览、查看、上传与删除指定根目录下的文件。\n受影响版本中，DirectoryResource 的 getFile 方法直接将请求路径与根目录绝对路径拼接构造 File 对象，仅检查目标文件是否存在，未校验解析结果是否仍位于配置的根目录之内，攻击者在 URL 路径中使用 ../ 段、绝对路径或指向根目录外的符号链接可访问服务器进程权限内的任意文件；当应用启用 allowViews、allowDeletes 或 allowUploads 时，攻击者可分别实现任意文件读取、删除或写入，这些开关默认关闭，仅显式启用相关功能的应用受影响。\n修复版本中通过 FileUtils.resolveSafely 方法先规范化根目录，再将请求路径解析并规范化后校验其是否以根目录为前缀，并复核符号链接的真实指向，任何逃逸根目录的请求返回 403 Forbidden，根目录内不存在的路径仍返回 404，从而切断路径穿越链路。", "effects": [{"comp_name": "org.apache.juneau:juneau-commons", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,9.2.1)", "min_fixed_version": "9.2.1", "repository": "maven", "solutions": [], "upstream": true}]}, {"comp_name": "org.apache.juneau:juneau-microservice-core", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,9.2.1)", "min_fixed_version": "9.2.1", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-11-05", "level": "High", "mps_id": "MPS-d16d-c4c8", "poc": false, "poc_url": [], "published_time": "2026-11-05", "reference_url_list": [{"url": "https://www.openwall.com/lists/oss-security/2026/11/04/7", "name": ""}, {"url": "https://juneau.apache.org/docs/release-notes/9.2.1", "name": ""}, {"url": "https://github.com/apache/juneau/commit/b91bce161713998fc9953b713263cd894af2931d", "name": ""}, {"url": "https://github.com/apache/juneau/releases/tag/juneau-9.2.1", "name": ""}, {"url": "https://downloads.apache.org/juneau/9.2.1/", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "Juneau路径穿越漏洞", "_translated": true, "_saved_at": "2026-11-04T16:44:55+00:00", "_first_saved_at": "2026-11-04T16:44:55+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-d16d-c4c8"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-73116", "cvss": {}, "cvss_score": 7.5, "cvss_vector": "", "cwe": "CWE-522", "description": "Apache Juneau 是 Apache 软件基金会开源的 Java REST 服务与序列化框架，其中 juneau-rest-client 模块提供基于 RestClient 构建器的 REST 客户端，用于应用与远程服务之间的 HTTP 调用。\n受影响版本中，RestClient.Builder 的 createHttpClient() 方法直接以默认重定向策略构建底层 Apache HttpClient，未注册任何凭据防护拦截器，HttpClient 默认重定向执行器在跟随 3xx 重定向时会把原请求的全部请求头复制到跳转请求，Authorization、Cookie、Proxy-Authorization、X-API-Key 等凭据头随请求被发往 Location 指向的不同主机或不同端口目标，重定向由 HTTPS 降级为 HTTP 时凭据以明文发出，控制该服务端或能诱导其返回跨源重定向的攻击者由此获得这些凭据。\n修复版本中通过在 createHttpClient() 中注册 RedirectCredentialGuard 拦截器修复该问题，拦截器记录一次请求交换中首个请求的源站，后续请求经 RedirectSecurity.shouldStripCredentials() 判定源站变化或 HTTPS 降级 HTTP 后，按 RedactedHeaders 定义的凭据头集合移除 Authorization、Cookie、Set-Cookie、Proxy-Authorization、X-API-Key，阻止凭据转发到其他源站；该保护仅覆盖由 RestClient 构建器创建的 HTTP 客户端。", "effects": [{"comp_name": "org.apache.juneau:juneau-rest-client", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,9.2.1)", "min_fixed_version": "9.2.1", "repository": "maven", "solutions": [], "upstream": true}]}, {"comp_name": "org.apache.juneau:juneau-rest-common", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,9.2.1)", "min_fixed_version": "9.2.1", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "凭证保护不足", "kind_en": "凭证保护不足", "last_modified_time": "2026-11-05", "level": "High", "mps_id": "MPS-5a1c-a752", "poc": false, "poc_url": [], "published_time": "2026-11-05", "reference_url_list": [{"url": "https://www.openwall.com/lists/oss-security/2026/11/04/7", "name": ""}, {"url": "https://juneau.apache.org/security", "name": ""}, {"url": "https://downloads.apache.org/juneau/9.2.1/", "name": ""}, {"url": "https://github.com/apache/juneau/releases/tag/juneau-9.2.1", "name": ""}, {"url": "https://github.com/apache/juneau/commit/81677c11fb4b35157ea176a97af0ace82126d25e", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "Juneau REST客户端重定向凭据泄露漏洞", "_translated": true, "_saved_at": "2026-11-04T16:44:56+00:00", "_first_saved_at": "2026-11-04T16:44:56+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-5a1c-a752"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-73100", "cvss": {}, "cvss_score": 7.5, "cvss_vector": "", "cwe": "CWE-532", "description": "Apache Juneau 是 Apache 软件基金会的开源 Java 工具包，提供 POJO 序列化框架与基于 Servlet 的 REST 服务端组件，通过 Maven org.apache.juneau 坐标分发。\n受影响版本中，REST 服务端默认调用日志器 BasicCallLogger 针对状态码 500 以上的请求按 HEADER 级别记录请求头，CallLogger 的 log(HttpServletRequest, HttpServletResponse) 方法将 req.getHeader(h) 返回的头部值原样拼入日志文本且未做任何脱敏，任意能触发服务端 5xx 响应的客户端会使该请求中的 Authorization、Cookie、Proxy-Authorization、X-API-Key 等凭据请求头以明文形式写入应用日志，可读取日志的人由此获得这些凭据。\n修复版本中通过在 CallLogger 写入日志前将请求头与响应头值统一交由新增的 RedactedHeaders.redact 方法处理实现脱敏，默认命中 Authorization、Cookie、Set-Cookie、Proxy-Authorization、X-API-Key 五类凭据头时以 [REDACTED] 占位符替代真实值，并支持经 redactedHeaders(String...) 与 redactHeader(String) 调整脱敏名单，切断凭据写入日志的路径。", "effects": [{"comp_name": "org.apache.juneau:juneau-rest-common", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,9.2.1)", "min_fixed_version": "9.2.1", "repository": "maven", "solutions": [], "upstream": true}]}, {"comp_name": "org.apache.juneau:juneau-rest-server", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,9.2.1)", "min_fixed_version": "9.2.1", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "日志敏感信息泄露", "kind_en": "将敏感信息插入日志文件", "last_modified_time": "2026-11-05", "level": "High", "mps_id": "MPS-9147-2d90", "poc": false, "poc_url": [], "published_time": "2026-11-05", "reference_url_list": [{"url": "https://www.openwall.com/lists/oss-security/2026/11/04/7", "name": ""}, {"url": "https://juneau.apache.org/security", "name": ""}, {"url": "https://github.com/apache/juneau/releases/tag/juneau-9.2.1", "name": ""}, {"url": "https://downloads.apache.org/juneau/9.2.1/", "name": ""}, {"url": "https://github.com/apache/juneau/commit/81677c11fb4b35157ea176a97af0ace82126d25e", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "Apache Juneau敏感请求头明文日志漏洞", "_translated": true, "_saved_at": "2026-11-04T16:44:57+00:00", "_first_saved_at": "2026-11-04T16:44:57+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-9147-2d90"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-76826", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:A/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:4.0/AV:N ithub.com/tsparticles/tsparticles/commit/d3b5672bd61bb847abfa21193c34eabf7aba6896"}], "scope_influence": "", "tags": ["应用软件"], "title": "tsParticles发布流程命令注入漏洞", "_translated": true, "_saved_at": "2026-11-05T03:01:12+00:00", "_first_saved_at": "2026-11-05T03:01:12+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-94j1-cftm"}, {"analysis_status": 0, "articles": [{"content": "跨界内存读是指应用程序在读取内存时，未正确验证或限制读取的内存范围。攻击者利用这种漏洞可以读取应用程序内存中的敏感数据，如密码、加密密钥、会话令牌等。常见的原因是由于缓冲区溢出、格式化字符串漏洞或其他内存错误导致的。", "title": "什么是越界读取"}, {"content": "攻击者可以通过不当构造的输入来触发跨界内存读漏洞。攻击者可能会通过向应用程序发送特定的输入，使其读取超过预期的内存区域。攻击者可以利用这个漏洞来获取敏感信息，如其他用户的数据、操作系统的敏感数据或应用程序的内部状态。", "title": "越界读取常见的攻击方式"}, {"content": "- 输入验证和限制：应用程序应对所有输入数据进行严格的验证和限制。确保输入数据的长度、格式和内容符合预期，避免超出缓冲区或访问非预期的内存区域。\n- 内存安全编程实践：开发人员应使用安全的编程实践，如避免使用不安全的函数、正确处理内存分配和释放操作，以及遵循最小特权原则。\n- 使用安全的编程语言和库：选择使用安全性较高的编程语言和库，这些语言和库在内存管理和安全性方面提供了更多的保护机制。\n- 定期进行代码审查和安全测试：定期审查应用程序的代码，并进行安全测试，以发现潜在的跨界内存读漏洞。使用静态代码分析工具和漏洞扫描工具来辅助检测和修复问题。\n- 实施防御性编程技术：应用程序应采用防御性编程技术，如使用随机化地址空间布局（ASLR）、堆栈保护机制（如堆栈溢出保护）和数据执行预防（DEP）等。\n- 及时更新和修补：及时应用程序和操作系统的安全更新和补丁，以确保已知的跨界内存读漏洞得到修复。及时更新相关软件和库，以避免使用已知存在漏洞的版本。", "title": "如何预防越界读取"}], "cnvd_id": "", "cve_id": "CVE-2026-17493", "cvss": {"cvssv31": [{"source": "psirt@us.ibm.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-125", "description": "IBM Watson Speech Services Cartridge 是 IBM 商业闭源软件，作为 Cloud Pak for Data 上的语音服务组件运行，提供语音识别与语音合成等 Speech 运行时能力。\n受影响版本中，Speech 运行时使用的 Unpacker 在处理外部不可信输入时存在越界读取（CWE-125）。IBM 官方公告说明，Unpacker 在发生错误后仍被重复使用时，越界读取可触发段错误（SEGV），导致 Speech 运行时进程崩溃，攻击者可从外部输入远程发起并造成拒绝服务。\n修复版本中通过安装 IBM 官方 5.4.0 Patch 8 修复该问题，补丁适用于 4.0.0 至 5.4.0 全部受影响版本，修复后消除了错误状态下重复使用 Unpacker 引发的越界读取崩溃；官方未披露源码级修复细节，也未提供变通方案。", "effects": [{"comp_name": "watson_speech_services_cartridge", "ecosystem": "linux", "versions": [{"affected_version": "[4.0.0,5.4.0]", "min_fixed_version": "", "repositor 户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-100168", "cvss": {}, "cvss_score": 7.1, "cvss_vector": "", "cwe": "CWE-862", "description": "Apache OFBiz 是 Apache 软件基金会开源的企业级 ERP 与电子商务应用框架，其内容管理组件提供基于 JSON 请求的内容维护接口，用于管理内容关联与站点路径别名。\n受影响版本中，ContentJsonEvents 类的 moveContent 与 deleteContent 方法分别响应 /content/control/moveContentJson 与 /content/control/deleteContentJson 请求，在变更 ContentAssoc 内容关联以及级联删除 WebSitePathAlias 路径别名前未调用 genericContentPermission 服务进行 UPDATE、DELETE 权限校验，任何已登录用户（包括仅具备只读权限的用户）均可直接请求上述接口，移动或删除其无权管理的内容关联，破坏站点内容结构并导致线上路径别名被级联清除。\n修复版本中通过在执行变更前调用 genericContentPermission 服务分别校验新旧父内容与目标内容的 UPDATE、DELETE 权限，校验未通过时抛出异常终止操作，阻断低权限用户对内容关联与路径别名的未授权变更。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-11-05", "level": "High", "mps_id": "MPS-7b69-dbe7", "poc": false, "poc_url": [], "published_time": "2026-11-05", "reference_url_list": [{"url": "https://seclists.org/oss-sec/2026/q4/516", "name": ""}, {"url": "https://ofbiz.apache.org/security.html", "name": ""}, {"url": "https://github.com/apache/ofbiz-framework/pull/2065", "name": ""}, {"url": "https://github.com/apache/ofbiz-framework/pull/2100", "name": ""}], "scope_influence": "", "tags": [], "title": "Apache OFBiz内容管理接口缺失授权漏洞", "_translated": true, "_saved_at": "2026-11-05T03:01:10+00:00", "_first_saved_at": "2026-11-05T03:01:10+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-7b69-dbe7"}, {"analysis_status": 0, "articles": [{"content": "跨站点请求伪造 (CSRF)通过利用网站对用户请求的信任进行攻击。当用户在网站A登录并在同一浏览器会话中访问网站B时，攻击者可以构造特制的请求并诱使用户执行，以使网站B误以为这些请求是用户合法发起的。\n攻击者通常通过欺骗用户点击恶意链接、在受信任的网站中植入恶意代码或通过钓鱼等手段来实施CSRF攻击，一旦用户执行了恶意请求，攻击者可以以用户的身份执行任意操作，包括更改用户密码、发起资金转账或删除重要数据等。", "title": "什么是CSRF"}, {"content": "- 链接欺骗：攻击者通过向用户发送包含恶意链接的电子邮件或社交媒体消息，诱使用户点击并执行恶意请求。\n- 图片引用攻击：攻击者通过在恶意网站上包含指向目标网站的图片引用，以触发用户浏览器自动发送目标网站的请求。\n- XSS利用：如果目标网站存在XSS漏洞，攻击者可以注入恶意脚本，以使用户在浏览器中执行恶意请求。", "title": "CSRF常见的攻击方式"}, {"content": "- 随机令牌：网站可以在每个请求中包含一个随机生成的令牌（CSRF Token），并验证该令牌的有效性，以确认请求的来源是合法的。\n- SameSite Cookie：使用SameSite属性来限制跨站点请求，将Cookie的发送限制在同一站点上，减少了跨站请求伪造的风险。\n- 双重验证：对于敏感操作，网站可以要求用户进行额外的验证，例如输入验证码、提供第二个因素的身份验证等。\n- 强化浏览器策略：网站可以设置Content-Security-Policy（CSP）头，限制浏览器执行恶意脚本的能力，减少CSRF攻击的风险。\n- 限制用户操作：网站可以要求用户在执行敏感操作之前进行明确的确认或授权，防止恶意请求被误触发。\n- 安全编码实践：开发人员应遵循安全编码实践，对用户输入进行适当的验证和过滤，防止恶意请求的注入。", "title": "如何预防CSRF"}], "cnvd_id": "", "cve_id": "CVE-2026-73099", "cvss": {}, "cvss_score": 7.1, "cvss_vector": "", "cwe": "CWE-352", "description": "Apache Juneau 是 Apache 软件基金会开源的 Java 序列化与 REST 服务框架，juneau-rest-server 模块用于通过注解将 POJO 快速发布为 REST 接口。\n受影响版本中，juneau-rest-server 默认启用 content 查询参数对请求体的覆盖（disableContentParam 默认为 false），RestRequest 构造函数在 isAllowContentParam 为真时直接读取查询参数 content 并将其设置为请求体、强制按 UON 格式解析，且不校验 HTTP 方法，攻击者可通过跨站链接、表单或嵌入资源以 GET 等任意方法向端点投递攻击者可控的请求体，全程无 CORS 预检且不受端点预期 Content-Type 限制，绕过依赖请求方法或内容类型而非 anti-CSRF token 的防护，以受害者会话执行状态变更操作。\n修复版本中通过新增 isContentParamMethod 方法并调整 RestRequest 构造函数的启用条件，使 content 查询参数仅在 PUT 与 POST 请求上生效，跨站 GET 无法再注入攻击者请求体，切断该 CSRF 攻击链。", "effects": [{"comp_name": "org.apache.juneau:juneau-rest-server", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,9.2.1)", "min_fixed_version": "9.2.1", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "CSRF", "kind_en": "跨站请求伪造 (CSRF)", "last_modified_time": "2026-11-05", "level": "High", "mps_id": "MPS-cef4-bd21", "poc": false, "poc_url": [], "published_time": "2026-11-05", "reference_url_list": [{"url": "https://www.openwall.com/lists/oss-security/2026/11/04/7", "name": ""}, {"url": "https://github.com/apache/juneau/commit/81677c11fb4b35157ea176a97af0ace82126d25e", "name": ""}, {"url": "https://github.com/apache/juneau/releases/tag/juneau-9.2.1", "name": ""}, {"url": "https://downloads.apache.org/juneau/9.2.1/", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "Juneau请求体覆盖CSRF漏洞", "_translated": true, "_saved_at": "2026-11-04T16:44:54+00:00", "_first_saved_at": "2026-11-04T16:44:54+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-cef4-bd21"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-13289", "cvss": {"cvssv31": [{"source": "psirt@us.ibm.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:L", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:L", "cwe": "CWE-611", "description": "IBM MQ 是 IBM 开发的商业消息中间件，属于闭源软件，用于在企业应用与系统之间提供可靠的消息传递，其 Managed File Transfer 组件提供基于队列架构的托管文件传输能力，运行于 AIX、Linux、Windows 与 IBM i 平台。\n受影响版本中，Managed File Transfer 组件在处理 XML 数据时未充分限制 XML 外部实体的解析与引用，持有普通用户权限的远程攻击者可提交包含恶意实体声明的 XML 数据，解析器在解析过程中加载攻击者指定的外部实体，导致敏感信息泄露或内存资源被消耗。\n修复版本中通过厂商安全更新收紧了 XML 解析器对外部实体引用的处理，阻止不可信实体声明进入解析流程，消除敏感信息泄露与内存资源消耗风险；公开渠道未披露该闭源产品的具体修复代码，需按 IBM 官方公告升级至对应修复版本。", "effects": [{"comp_name": "ibm:mq", "ecosystem": "linux", "versions": [{"affected_version": "[9.2.0.0,9.2.0.46)", "min_fixed_version": "9.2.0.46", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[9.4.0.0,9.4.0.30)", "min_fixed_version": "9.4.0.30", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[9.3.0.0,9.3.0.43)", "min_fixed_version": "9.3.0.43", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[9.4.0.0,9.4.5.1]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[10.0.0.0,10.0.1.0)", "min_fixed_version": "10.0.1.0", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[10.0.0.0,10.0.0.6)", "min_fixed_version": "10.0.0.6", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XXE", "kind_en": "XML外部实体引用限制不当", "last_modified_time": "2026-11-05", "level": "High", "mps_id": "MPS-gxu3-jzsv", "poc": false, "poc_url": [], "published_time": "2026-11-05", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-gxu3-jzsv", "name": "https://www.oscs1024.com/hd/MPS-gxu3-jzsv"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-13289", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-13289"}, {"url": "https://www.ibm.com/support/pages/node/7294499", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "IBM MQ XML外部实体注入漏洞", "_translated": true, "_saved_at": "2026-11-04T22:20:06+00:00", "_first_saved_at": "2026-11-04T22:20:06+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-gxu3-jzsv"}, {"analysis_status": 0, "articles": [{"content": "由于整数类型的有限范围，在进行算术运算或操作时，结果可能超出类型的表示范围，导致溢出或环绕。溢出指的是结果超过了类型的最大值或小于了最小值，而环绕指的是结果绕回到类型的最小值或最大值。", "title": "什么是整数溢出或环绕"}, {"content": "- 缓冲区溢出：整数溢出可能导致缓冲区溢出漏洞。当整数溢出导致分配的缓冲区大小不足以容纳结果时，攻击者可以利用这个漏洞覆盖相邻的内存区域，执行恶意代码或篡改程序的状态。\r\n- 身份验证绕过：在进行身份验证或访问控制时，整数溢出可能导致绕过验证的漏洞。攻击者可以构造特殊的输入，使溢出的整数值绕过了预期的验证逻辑，从而获得未经授权的访问权限。\r\n- 数据篡改：整数溢出可能导致数据篡改漏洞。攻击者可以通过使整数溢出，修改计数器、索引或其他控制数据的值，导致程序在处理数据时发生错误或执行意外的操作。", "title": "整数溢出或环绕常见的攻击方式"}, {"content": "- 输入验证与限制：对用户输入的整数进行合理的验证和限制，确保其在允许的范围内。\r\n- 使用安全的整数操作函数：使用安全的整数操作函数，如`add_with_overflow()`、`sub_with_overflow()`、`mul_with_overflow()`等，这些函数会检查并处理溢出情况，确保计算结果在安全范围内。\r\n- 类型检查和转换：在进行整数运算或操作之前，进行类型检查和转换，确保操作数的类型和范围是合适的。\r\n- 强制性编码标准和最佳实践：制定强制性的编码标准和最佳实践，包括对整数运算和操作的规范和限制，以帮助程序员编写更可靠、安全的代码。\r\n- 静态代码分析和测试：使用静态代码分析工具和测试技术来检测和识别潜在的整数溢出问题。这些工具可以帮助发现代码中可能存在的溢出漏洞，并及时修复。", "title": "如何预防整数溢出或环绕"}], "cnvd_id": "", "cve_id": "CVE-2026-18142", "cvss": {"cvssv31": [{"source": "psirt@us.ibm.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:L/A:H", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:L/A:H", "cwe": "CWE-190", "description": "IBM MQ 是 IBM 推出的商业消息队列中间件（闭源），用于企业应用之间的异步消息传递与队列管理，支持在 AIX、Linux、Windows、IBM i 等平台部署，受影响组件为 MQ 服务器（Server）。\n受影响版本中，MQ 服务器队列管理器在处理畸形的 MQINQ 请求时存在整数溢出缺陷，远程认证攻击者获得普通用户权限后可发送构造的 MQINQ 请求，使整数运算超出边界并破坏内存布局，最终导致拒绝服务与有限的内存破坏。\n修复版本中通过修正 MQINQ 请求处理中的整数溢出计算切断了该触发链路，IBM 已在 Known Issue DT500561 下完成修复，对应安全更新为 9.2.0.46、9.3.0.43、9.4.0.30、10.0.0.6（LTS）以及 10.0.1.0（CD）。", "effects": [{"comp_name": "mq", "ecosystem": "linux", "versions": [{"affected_version": "[9.4.0.0,9.4.0.30)", "min_fixed_version": "9.4.0.30", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[9.2.0.0,9.2.0.46)", "min_fixed_version": "9.2.0.46", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[9.4.0.0,10.0.1.0)", "min_fixed_version": "10.0.1.0", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[9.3.0.0,9.3.0.43)", "min_fixed_version": "9.3.0.43", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[10.0.0.0,10.0.0.6)", "min_fixed_version": "10.0.0.6", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "整数溢出或环绕", "kind_en": "整数溢出或环绕", "last_modified_time": "2026-11-05", "level": "High", "mps_id": "MPS-ufaw-92qm", "poc": false, "poc_url": [], "published_time": "2026-11-05", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ufaw-92qm", "name": "https://www.oscs1024.com/hd/MPS-ufaw-92qm"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-18142", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-18142"}, {"url": "https://www.ibm.com/support/pages/node/7294663", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "IBM MQ整数溢出拒绝服务漏洞", "_translated": true, "_saved_at": "2026-11-04T22:20:04+00:00", "_first_saved_at": "2026-11-04T22:20:04+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ufaw-92qm"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-13284", "cvss": {"cvssv31": [{"source": "psirt@us.ibm.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:L", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:L", "cwe": "CWE-611", "description": "IBM MQ 是 IBM 开发的企业级消息中间件，闭源商业软件，用于分布式系统之间的可靠消息传递与异步集成；Managed File Transfer 是其可选安装组件，用于在网络内外的系统之间执行受控文件传输。\n受影响版本中，Managed File Transfer 组件在处理 XML 数据时未正确限制 XML 外部实体引用（CWE-611），远程攻击者以低权限用户身份提交包含外部实体声明的 XML 数据，解析过程会读取实体指向的本地资源或加载超量数据，导致敏感信息泄露或内存资源消耗。\n修复版本中通过升级官方累积安全更新完成修复，IBM 在 9.2.0.46、9.3.0.43、9.4.0.30、10.0.0.6 与 10.0.1.0 中修复该问题，对 Managed File Transfer 的 XML 数据处理进行加固，消除外部实体注入带来的信息泄露与资源消耗风险。", "effects": [{"comp_name": "ibm_mq", "ecosystem": "linux", "versions": [{"affected_version": "[9.3.0.0,9.3.0.43)", "min_fixed_version": "9.3.0.43", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[9.4.0.0,10.0.1.0)", "min_fixed_version": "10.0.1.0", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[9.2.0.0,9.2.0.46)", "min_fixed_version": "9.2.0.46", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[9.4.0.0,9.4.0.30)", "min_fixed_version": "9.4.0.30", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[10.0.0.0,10.0.0.6)", "min_fixed_version": "10.0.0.6", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XXE", "kind_en": "XML外部实体引用限制不当", "last_modified_time": "2026-11-05", "level": "High", "mps_id": "MPS-xfb6-7sn5", "poc": false, "poc_url": [], "published_time": "2026-11-05", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-xfb6-7sn5", "name": "https://www.oscs1024.com/hd/MPS-xfb6-7sn5"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-13284", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-13284"}, {"url": "https://www.ibm.com/support/pages/node/7294500", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "IBM MQ XXE注入漏洞", "_translated": true, "_saved_at": "2026-11-04T22:20:08+00:00", "_first_saved_at": "2026-11-04T22:20:08+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-xfb6-7sn5"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-97175", "cvss": {"cvssv31": [{"source": "secalert@redhat.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-287", "description": "Keycloak 是红帽主导的开源身份认证与访问管理软件，keycloak-services 组件提供服务端的身份代理联邦登录与认证流程处理。\n受影响版本中，first broker login 流程的 idp-auto-link 认证器在 IdpAutoLinkAuthenticator.authenticateImpl 中经 AbstractIdpAuthenticator.getExistingUser 取回此前按邮箱匹配到的本地已有账号后，直接调用 context.setUser(existingUser) 并 context.success() 完成身份链接，未校验代理身份提供商是否已验证该邮箱（email_verified 声明），也未检查 IdP 的 Trust Email 配置。攻击者在所代理的身份提供商持有与受害者本地账号相同邮箱且未经验证的可控身份后登录该提供商，外部身份被静默链接到受害者账号，实现完整账号接管，包括读取受害者数据并修改其邮箱与密码。\n修复版本中通过在 IdpAutoLinkAuthenticator.authenticateImpl 增加邮箱归属与可信校验切断该链路：当 Review Profile 页修改过邮箱或用户名、代理邮箱与既有账号邮箱不一致、或 IdP 未启用 Trust Email 且身份上下文中 email_verified 不为真时，改用 context.attempted() 终止自动链接，使登录流程转入 idp-confirm-link 与 idp-email-verification 等邮箱归属确认步骤；同时在 BrokeredIdentityContext 新增 isEmailVerified() 方法读取 email_verified 声明。", "effects": [{"comp_name": "org.keycloak:keycloak-services", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,26.8.2)", "min_fixed_version": "26.8.2", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "身份验证不当", "kind_en": "认证不当", "last_modified_time": "2026-11-06", "level": "High", "mps_id": "MPS-d6c3-0lok", "poc": false, "poc_url": [], "published_time": "2026-11-06", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-d6c3-0lok", "name": "https://www.oscs1024.com/hd/MPS-d6c3-0lok"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-97175", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-97175"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-97175", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "Keycloak身份代理自动链接账号接管漏洞", "_translated": true, "_saved_at": "2026-11-05T19:20:50+00:00", "_first_saved_at": "2026-11-05T19:20:50+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-d6c3-0lok"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-77439", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-639", "description": "Immich 是一个开源（AGPL-3.0）的自托管照片与视频管理解决方案，支持多用户账户与共享相册协作，相册成员可被授予 Owner、Editor 或 Viewer 角色。\n受影响版本中，server/src/services/album.service.ts 的 updateUser 方法更新相册成员角色时仅校验 AlbumShare 权限（Editor 角色满足该权限），未保护相册 Owner 角色不被修改，请求体中的 role 字段也接受 owner 取值；受数据库每相册仅允许存在一个 Owner 的唯一索引影响，拥有 Editor 角色的认证用户可先将相册原 Owner 降级，再将自身提升为 Owner，从而完全接管共享相册，进一步移除原 Owner 并删除相册。\n修复版本中通过在 updateUser 更新角色前加载相册成员并判断目标用户是否为相册 Owner，若目标为 Owner 则拒绝请求并返回错误，使相册 Owner 角色无法被其他成员降级，Editor 无法再完成先降级原 Owner 再自我提权的接管链。", "effects": [{"comp_name": "immich", "ecosystem": "npm", "versions": [{"affected_version": "(-∞,3.0.3)", "min_fixed_version": "3.0.3", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "通过用户控制密钥绕过授权机制", "kind_en": "通过用户控制的密钥绕过授权", "last_modified_time": "2026-11-06", "level": "High", "mps_id": "MPS-oxqh-3inz", "poc": false, "poc_url": [], "published_time": "2026-11-06", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-oxqh-3inz", "name": "https://www.oscs1024.com/hd/MPS-oxqh-3inz"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-77439", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-77439"}, {"url": "https://github.com/immich-app/immich/security/advisories/GHSA-c9mf-h82r-8p4j", "name": "https://github.com/immich-app/immich/security/advisories/GHSA-c9mf-h82r-8p4j"}, {"url": "https://github.com/immich-app/immich/pull/29883", "name": "https://github.com/immich-app/immich/pull/29883"}, {"url": "https://github.com/immich-app/immich/commit/84dff19ca9a467752d848ff54763d62c04ebf960", "name": "https://github.com/immich-app/immich/commit/84dff19ca9a467752d848ff54763d62c04ebf960"}, {"url": "https://github.com/immich-app/immich/releases/tag/v3.0.3", "name": "https://github.com/immich-app/immich/releases/tag/v3.0.3"}], "scope_influence": "", "tags": ["npm", "开源"], "title": "Immich共享相册权限提升漏洞", "_translated": true, "_saved_at": "2026-11-05T19:20:54+00:00", "_first_saved_at": "2026-11-05T19:20:54+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-oxqh-3inz"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2025-71458", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "high", "base_score": 7.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-89", "description": "FTS3 Web Monitoring（fts-monitoring）是 CERN 开源的 FTS3 文件传输服务 Web 监控组件，基于 Python 与 Django 构建，以 RPM 包形式发布，用于展示传输任务、存储端点与链路配置等监控信息。\n受影响版本中，/linkinfo 路由映射的 get_linkinfo 视图从 http_request.GET 读取 source_se 与 dest_se 参数，未经参数化处理便以 %s 字符串格式化拼入多条查询语句，并通过不带参数绑定的 cursor.execute(query) 执行，远程攻击者无需认证，通过构造恶意请求可实现盲注，读取数据库中存储的云存储凭据与 Token Provider 客户端密钥。\n修复 对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-53980", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N", "severity": "high", "base_score": 8.1}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-22", "description": "Charmbracelet wish 是一个开源的 Go 语言 SSH 服务开发库（Go 模块 charm.land/wish/v2，MIT 许可），用于在自托管 SSH 服务器中组合命令处理、Git 服务等中间件能力。\n受影响版本中，git.Middleware 处理 git-upload-pack、git-upload-archive、git-receive-pack 会话命令时，对客户端提供的仓库名参数执行 filepath.Clean，随后统计正斜杠数量并限制不超过 1 个作为目录深度检查。该检查未识别反斜杠分隔符：../evil 经清洗后仅含 1 个斜杠，可绕过深度限制，与 repoDir 拼接后指向其上一级目录；在 Windows 上 filepath.Clean 将路径分隔符改写为反斜杠，..\\..\\evil 等载荷的正斜杠计数为 0，可达任意深度。越界路径随后传入 gitPack 执行 git 子命令，认证用户可读取或写入仓库目录之外的任意 Git 仓库。\n修复版本中通过新增 cleanRepo 函数规整客户端提供的仓库名：先将反斜杠统一替换为斜杠并去除首尾分隔符，再执行 path.Clean，随后使用 filepath.IsLocal 拒绝任何拼接后越出 repoDir 的路径，同时保留不超过两层（user/repo.git）的深度限制，并以回归测试覆盖 ../escaped、..\\..\\repo.git 等越界用例，切断了构造路径逃出仓库目录的利用链。", "effects": [{"comp_name": "charm.land/wish/v2", "ecosystem": "go", "versions": [{"affected_version": "(-∞,2.0.5)", "min_fixed_version": "2.0.5", "repository": "go", "solutions": [], "upstream": true}]}, {"comp_name": "wish", "ecosystem": "linux", "versions": [{"affected_version": "(0,2.0.5)", "min_fixed_version": "2.0.5", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", " 通过标准校验的冒充身份令牌。\n修复版本中通过重写 ProtocolMappersClientRegistrationPolicy 的 beforeRegister 与 beforeUpdate 校验逻辑，基于新增、变更或删除的映射器类型重新执行允许列表检查，并将策略配置与新引入的 realm 属性 allowedProtocolMapperTypesForClientAdministrators 取交集、为空时全拒绝；客户端注册策略管理器在允许策略组件被移除时兜底执行空允许列表，管理端协议映射器 CRUD 收敛为 realm 管理员权限，动态客户端注册默认不再允许提交任何协议映射器，切断了向受保护 claim 写入可控数据的利用链。", "effects": [{"comp_name": "keycloak", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,26.8.2)", "min_fixed_version": "26.8.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "输入验证不恰当", "kind_en": "输入验证不当", "last_modified_time": "2026-11-06", "level": "High", "mps_id": "MPS-j5m6-dfpo", "poc": false, "poc_url": [], "published_time": "2026-11-06", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-j5m6-dfpo", "name": "https://www.oscs1024.com/hd/MPS-j5m6-dfpo"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-92857", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-92857"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-92857", "name": ""}, {"url": "https://bugzilla.redhat.com/show_bug.cgi?id=2535817", "name": "RHBZ#2535817"}], "scope_influence": "", "tags": ["应用软件"], "title": "Keycloak 身份伪造漏洞", "_translated": true, "_saved_at": "2026-11-05T19:20:53+00:00", "_first_saved_at": "2026-11-05T19:20:53+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-j5m6-dfpo"}, {"analysis_status": 0, "articles": [], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-96453", "cvss": {"cvssv31": [{"source": "secalert@redhat.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:R/S:C/C:H/I:H/A:N", "severity": "high", "base_score": 8}]}, "cvss_score": 8, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:R/S:C/C:H/I:H/A:N", "cwe": "CWE-295", "description": "Keycloak 是红帽主导开源的身份认证与访问管理系统，用于单点登录与身份联合；kcadm 是随 Keycloak 发行包与 Maven 构件 org.keycloak:keycloak-admin-cli 提供的 Admin CLI 命令行工具，管理员用它从命令行管理 Keycloak 服务器，客户端注册 CLI kcreg 与其共用同一 HTTP 工具类。\n受影响版本中，kcadm 与 kcreg 配置自定义信任库（--truststore 或 config truststore）时，org.keycloak.client.cli.util.HttpUtil 类的 setTruststore 方法调用 Apache HttpClient 的 loadTrustMaterial 加载信任库材料，同时附加 TrustSelfSignedStrategy.INSTANCE 信任策略；该策略使客户端接受任意自签名证书链，主机名匹配即通过 TLS 校验，管理员导入信任库的 CA 信任材料失去实际约束。能够实施中间人攻击或 DNS 重定向的网络攻击者可向执行 kcadm 命令的管理员伪造 Keycloak 服务器，截获管理流量、窃取访问令牌与管理员凭据，并注入伪造响应执行特权管理操作。\n修复版本中通过将 setTruststore 方法中 loadTrustMaterial 调用的 TrustSelfSignedStrategy.INSTANCE 策略参数移除，自定义信任库成为唯一信任来源，未显式导入信任库的自签名证书在 TLS 握手阶段被拒绝；该修复随 Keycloak 26.8.2 发布，中间人伪造服务器窃取管理员凭据的攻击路径被切断。", "effects": [{"comp_name": "keycloak", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,26.8.2)", "min_fixed_version": "26.8.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "org.keycloak:keycloak-admin-cli", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,26.8.2)", "min_fixed_version": "26.8.2", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "证书验证不恰当", "kind_en": "证书验证不当", "last_modified_time": "2026-11-06", "level": "High", "mps_id": "MPS-k3hl-icnt", "poc": false, "poc_url": [], "published_time": "2026-11-06", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-k3hl-icnt", "name": "https://www.oscs1024.com/hd/MPS-k3hl-icnt"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-96453", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-96453"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-96453", "name": ""}, {"url": "https://bugzilla.redhat.com/show_bug.cgi?id=2539294", "name": "RHBZ#2539294"}], "scope_influence": "", "tags": ["java", "开源"], "title": "Keycloak kcadm 证书校验缺陷", "_translated": true, "_saved_at": "2026-11-05T19:20:52+00:00", "_first_saved_at": "2026-11-05T19:20:52+00:00", "_source_page": "https://www.oscs1024.
