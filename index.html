d", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-10-31", "level": "High", "mps_id": "MPS-1hsp-iknu", "poc": false, "poc_url": [], "published_time": "2026-10-31", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-1hsp-iknu", "name": "https://www.oscs1024.com/hd/MPS-1hsp-iknu"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-94175", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-94175"}, {"url": "https://patchstack.com/database/wordpress/plugin/change-wp-admin-login/vulnerability/wordpress-all-in-one-login-plugin-2-4-1-cross-site-scripting-xss-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": [], "title": "All In One Login XSS漏洞", "_translated": true, "_saved_at": "2026-10-30T21:18:34+00:00", "_first_saved_at": "2026-10-30T21:18:34+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-1hsp-iknu"}, {"analysis_status": 0, "articles": [{"content": "应用程序在处理用户输入时的不完善或缺乏验证机制，所以攻击者能够通过向应用程序发送恶意输入，利用应用程序对输入数据的错误处理方式来注入自己的恶意代码。这些恶意代码会被应用程序误认为是合法的指令或数据，并在执行过程中被执行。", "title": "什么是代码注入"}, {"content": "应用程序使用可执行动态代码的函数来执行用户可控的参数，当应用程序对于用户输入过滤不完全时，攻击者可以注入恶意代码并控制代码执行流程。", "title": "代码注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对所有用户输入进行验证和过滤，确保只接受预期的有效输入。这包括对输入数据进行输入长度验证、类型检查和格式验证等。\r\n- 使用参数化查询或预编译语句：对于数据库查询操作，应该使用参数化查询或预编译语句，确保输入数据不会被误认为是执行代码。\r\n- 最小特权原则：应用程序在执行操作系统命令或动态代码时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。\r\n- 安全编码实践：开发人员应该采用安全编码实践，包括避免使用eval函数、避免拼接用户输入的字符串作为代码执行等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止代码注入攻击。", "title": "如何预防代码注入"}], "cnvd_id": "", "cve_id": "CVE-2026-120203", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-94", "description": "ShowDoc 是一款开源（Apache-2.0 许可）的在线 API 文档与团队知识库工具，服务端基于 PHP 与 ThinkPHP 框架实现，并附带独立的 Node.js Mock 数据服务（mock/index.js，默认监听 7123 端口），用于按用户保存的模板渲染接口模拟数据。\n受影响版本中，登录用户通过 server/Application/Api/Controller/MockController.class.php 的 add 接口保存 Mock 模板，该接口仅校验 JSON 语法后入库；MockController::infoByKey 在无需登录的情况下读取存量模板并转发至本机 mock 服务，mock/index.js 将模板 JSON.parse 后直接交给 Mock.mock() 渲染；mockjs 对 @name(参数) 形式的占位符会把参数拼接进 eval() 求值，攻击者在模板中以 \\u0028、\\u0029 转义括号绕过占位符正则，经 constructor 属性链取得 Function 构造器并调用 child_process 模块，最终以 mock 进程的权限执行任意系统命令，官方 Docker 镜像中该进程以 root 运行。\n修复版本中通过在调用 Mock.mock 前新增 isSafeMockTemplate 白名单校验切断上述链条：占位符参数仅允许数字、字符串字面量、布尔值、null、裸标识符与字面量数组，整体拒绝反引号、\\u 转义以及占位符名后跟 . 或 [ 的属性链访问，使转义括号构造的调用无法进入 eval；PHP 侧在 add、infoByKey、infoByPath 中同步加入等价的 mockTemplateIsSafe 校验以覆盖历史存量模板，unique_key 改用 random_bytes 随机生成，mock 服务默认仅绑定 127.0.0.1，并在官方容器中改以低权用户 mockmock 运行。", "effects": [{"comp_name": "showdoc", "ecosystem": "linux", "versions": [{"affected_version": "[2.8.14,3.9.6)", "min_fixed_version": "3.9.6", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "代码注入", "kind_en": "代码生成控制不当（“代码注入”）", "last_modified_time": "2026-11-01", "level": "High", "mps_id": "MPS-sj0w-kdgm", "poc": false, "poc_url": [], "published_time": "2026-11-01", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-sj0w-kdgm", "name": "https://www.oscs1024.com/hd/MPS-sj0w-kdgm"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-120203", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-120203"}, {"url": "https://github.com/star7th/showdoc/commit/5a2087a3f408f5266f61e9e2fb98845ef4788288", "name": "Patch Commit"}, {"url": "https://gist.github.com/LioTree/028af150fd991cf9924dd2c7d5912e54", "name": ""}, {"url": "https://github.com/star7th/showdoc/blob/v3.9.5/mock/index.js#L42", "name": ""}, {"url": "https://github.com/star7th/showdoc", "name": ""}, {"url": "https://www.vulncheck.com/advisories/showdoc-2.8.14-before-3.9.6-code-injection-via-mock-templates", "name": "VulnCheck Advisory: ShowDoc 2.8.14 before 3.9.6 Code Injection via Mock Templates"}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "ShowDoc Mock代码注入", "_translated": true, "_saved_at": "2026-10-31T22:22:28+00:00", "_first_saved_at": "2026-10-31T18:59:32+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-sj0w-kdgm"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-120230", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:N/AC:L/Au:S/C:C/I:C/A:C", "severity": "high", "base_score": 9}], "cvssv3": [{"source": "VulDB", "vector": "CVSS:3.0/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I 00", "_first_saved_at": "2026-11-01T15:40:52+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-0kdl-q4iy"}, {"analysis_status": 0, "articles": [{"content": "在程序试图读取、写入或复制内存缓冲区时，未对边界进行适当的检查和限制。缓冲区是用于存储数据的一块内存区域，当程序试图在缓冲区之外的位置进行操作时，就可能导致缓冲区溢出或下溢。攻击者可以利用这个漏洞来修改程序的执行流、执行任意代码或导致拒绝服务等安全问题。", "title": "什么是缓冲区溢出"}, {"content": "- 缓冲区溢出攻击：攻击者向输入缓冲区中注入超过其容量的数据，导致数据溢出到相邻的内存区域，可能覆盖关键数据、修改变量值或执行恶意代码。\n- 缓冲区下溢攻击：攻击者向输入缓冲区中注入少于其容量的数据，导致数据被读取时越过缓冲区边界，可能泄露敏感信息或破坏程序的正常执行流程。\n- 字符串格式化攻击：攻击者通过控制格式化字符串的输入，可以读取或写入任意内存位置，从而执行恶意操作。", "title": "缓冲区溢出常见的攻击方式"}, {"content": "- 输入验证和边界检查：对于所有接受用户输入的缓冲区操作，确保验证输入数据的长度和内容，以避免缓冲区溢出或下溢。\n- 使用安全的字符串操作函数：使用安全的字符串操作函数（如strncpy、strncat）替代不安全的函数（如strcpy、strcat），这些函数会在操作时自动限制操作的边界。\n- 使用内存安全工具：使用内存安全工具（如内存分析器、静态分析工具）来检测和修复潜在的缓冲区溢出问题。\n- 采用安全编码实践：遵循安全编码实践，如最小特权原则、避免使用不受信任的输入等。\n- 定期更新和修补程序：及时应用程序厂商提供的安全更新和补丁，以修复已知的缓冲区溢出漏洞。\n- 使用编程语言和框架提供的安全功能：利用编程语言和框架提供的安全特性，如内存安全函数、边界检查等。", "title": "如何预防缓冲区溢出"}], "cnvd_id": "", "cve_id": "CVE-2026-120232", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:L/AC:L/Au:S/C:C/I:C/A:C", "severity": "medium", "base_score": 6.8}], "cvssv3": [{"source": "VulDB", "vector": "CVSS:3.0/AV:L/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H/E:P/RL:X/RC:C", "severity": "high", "base_score": 8.8}], "cvssv31": [{"source": "cna@vuldb.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}], "cvssv4": [{"source": "cna@vuldb.com", "vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.5}]}, "cvss_score": 8.5, "cvss_vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-119", "description": "Horizon DataSys Reboot Restore Standard 是 Horizon DataSys 公司推出的商业重启还原软件（闭源），依托 shield.sys 内核磁盘过滤驱动在每次重启后将系统恢复到受保护状态，常用于公共机房、企业与教育场景的批量终端还原。\n受影响版本中，shield.sys 驱动创建的 \\Device\\EAZShield 设备对象未配置安全描述符，IRP_MJ_CREATE 不做访问检查，任意经过身份验证的本地用户均可打开该设备；其 IOCTL 0x96102014 派发逻辑中的 sub_23908 函数在处理子命令 0xF0016（魔术值 'wCMD'）时，将输入缓冲区 +0x48 处用户可控的 64 位地址与 +0x44 处的长度直接交给内核内存拷贝，既未调用 ProbeForRead/ProbeForWrite 校验用户态指针，也未对长度做边界检查，仅依赖 MmIsAddressValid 判断地址有效性，攻击者可据此获得任意内核内存读写原语，改写 System 进程 Token 将自身权限提升至 SYSTEM。\n修复版本中通过，可通过限制不可信本地账户登录受影响主机、按最小权限原则管控终端用户并及时关注 Horizon DataSys 官方版本更新来降低风险；官方已表示将在即将发布的版本中提供修复。", "effects": [{"comp_name": "reboot_restore_standard", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,13.2]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "高", "fix_suggestion": "可选修复", "kind": "缓冲区溢出", "kind_en": "内存缓冲区范围内的操作限制不当", "last_modified_time": "2026-11-01", "level": "High", "mps_id": "MPS-xgm1-zft5", "poc": true, "poc_url": [], "published_time": "2026-11-01", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-xgm1-zft5", "name": "https://www.oscs1024.com/hd/MPS-xgm1-zft5"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-120232", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-120232"}, {"url": "https://vuldb.com/vuln/429591", "name": "VDB-429591 | Horizon DataSys Reboot Restore Standard Kernel Driver shield.sys sub_23908 memory corruption"}, {"url": "https://vuldb.com/vuln/429591/cti", "name": "VDB-429591 | CTI Indicators (IOB, IOC, IOA)"}, {"url": "https://vuldb.com/cve/CVE-2026-120232", "name": "CVE-2026-120232 | CVE Analysis and Report"}, {"url": "https://vuldb.com/submit/1001497", "name": "Submit #1001497 | Horizon DataSys Reboot Restore Standard v13.2 (and prior) Improper Input Validation"}, {"url": "https://gist.github.com/Element2023H/a176865b1f4015e003620154f3ba103c", "name": ""}], "scope_influence": "", "tags": ["poc", "应用软件"], "title": "Reboot Restore Standard驱动内存破坏漏洞", "_translated": true, "_saved_at": "2026-11-01T15:40:48+00:00", "_first_saved_at": "2026-11-01T15:40:48+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-xgm1-zft5"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-120135", "cvss": {"cvssv4": [{"source": "security@apache.org", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.2}]}, "cvss_score": 8.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-674", "description": "Apache Thrift 是 Apache 基金会开源的跨语言 RPC 与序列化框架，libthrift（Maven 坐标 org.apache.thrift:libthrift）是其 Java 语言绑定库，广泛用于服务间远程调用与结构化数据的序列化解析。\n受影响版本中，org.apache.thrift.protocol.TProtocolUtil 的静态字段 maxSkipDepth 默认取 Integer.MAX_VALUE，skip() 方法在跳过 STRUCT、MAP、SET、LIST 类型字段时按子元素逐层递归调用自身，深度上限实际不可达。攻击者向解析其可控 Thrift 消息的服务发送深度嵌套的序列化数据（例如连续嵌套的结构体）时，skip() 会沿嵌套层持续递归，直至耗尽线程栈抛出 StackOverflowError，使处理该消息的服务线程崩溃，形成远程拒绝服务。\n修复版本中通过将 maxSkipDepth 默认值从 Integer.MAX_VALUE 收敛为 64，并把 skip() 的深度上限接入传输层 TConfiguration 的递归限制（setMaxSkipDepth 废弃为空操作，统一由 TConfiguration.setRecursionLimit 控制），深度超限时抛出带 DEPTH_LIMIT 类型的 TProtocolException，终止递归跳过过程，消除栈溢出导致的拒绝服务风险。0.24.0 版本包含上述修复。", "effects": [{"comp_name": "org.apache.thrift:libthrift", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,0.24.0)", "min_fixed_version": "0.24.0", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "未经控制的递归", "kind_en": "Uncontrolled Recursion", "last_modified_time": "2026-10-31", "level": "High", "mps_id": "MPS-7f9e-8da3", "poc": false, "poc_url": [], "published_time": "2026-11-01", "reference_url_list": [{"url" 行。\n修复版本中通过在 ChannelListEntry 中以 chroma[2] 数组分别记录两个色度平面的指针、行跨度与各自字节宽度，processTile() 按每个色度样本所属平面自身的宽度与跨度写入，消除了以单一字节宽度写两个平面的越界路径，并新增 Y8/Cb16/Cr8 混合隔行回归测试覆盖该场景。", "effects": [{"comp_name": "libheif", "ecosystem": "linux", "versions": [{"affected_version": "[1.18.0,1.23.3)", "min_fixed_version": "1.23.3", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "堆缓冲区溢出", "kind_en": "基于堆的缓冲区溢出", "last_modified_time": "2026-11-01", "level": "High", "mps_id": "MPS-c3pl-m0rt", "poc": false, "poc_url": [], "published_time": "2026-11-01", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-c3pl-m0rt", "name": "https://www.oscs1024.com/hd/MPS-c3pl-m0rt"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-120208", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-120208"}, {"url": "https://github.com/strukturag/libheif/security/advisories/GHSA-x8r2-mggj-j6wr", "name": "GitHub Security Advisory (GHSA-x8r2-mggj-j6wr)"}, {"url": "https://github.com/strukturag/libheif/commit/9d3cd91d7b1c8c68deef6d06057ab956bcb0dfb9", "name": ""}, {"url": "https://github.com/strukturag/libheif/releases/tag/v1.23.3", "name": "libheif v1.23.3 Release Notes"}, {"url": "https://github.com/strukturag/libheif/blob/v1.23.2/libheif/codecs/uncompressed/unc_decoder_mixed_interleave.cc#L95", "name": ""}, {"url": "https://www.vulncheck.com/advisories/libheif-1.18.0-before-1.23.3-heap-buffer-overflow-via-unci-mixed-interleave-decoder", "name": "VulnCheck Advisory: libheif 1.18.0 before 1.23.3 Heap Buffer Overflow via unci Mixed-Interleave Decoder"}], "scope_influence": "", "tags": ["开源"], "title": "libheif unci解码堆越界写入漏洞", "_translated": true, "_saved_at": "2026-10-31T22:22:25+00:00", "_first_saved_at": "2026-10-31T18:59:30+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-c3pl-m0rt"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-118147", "cvss": {"cvssv31": [{"source": "secure@microsoft.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:N", "severity": "high", "base_score": 7.4}]}, "cvss_score": 7.4, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:N", "cwe": "CWE-295", "description": "Microsoft Visual Studio 是微软开发的闭源集成开发环境，广泛用于 Windows 平台上的 .NET、C++ 等应用开发，其组件在访问远程资源时依赖 HTTPS 证书校验保障通信安全。\n受影响版本中，Visual Studio 与远程资源建立连接时对服务器证书校验不当，未授权攻击者位于目标主机与所请求资源之间的网络路径上实施中间人劫持后，可让伪造资源伪装成合法资源，进而读取高度敏感的资源信息并篡改传输数据，导致机密性与完整性受损，可用性不受影响，微软将最新版软件的利用可能性评估为较低。\n修复版本中通过微软官方安全更新修正证书校验逻辑，使伪造证书无法再通过校验，切断中间人伪装合法资源的路径，各分支修复版本为 Visual Studio 2026 18.11.3、Visual Studio 2022 17.14.44、Visual Studio 2019 16.11.62、Visual Studio 2017 15.9.84。", "effects": [{"comp_name": "visual_studio_2017", "ecosystem": "linux", "versions": [{"affected_version": "[15.9,15.9.84)", "min_fixed_version": "15.9.84", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "visual_studio_2019", "ecosystem": "linux", "versions": [{"affected_version": "[16.11,16.11.62)", "min_fixed_version": "16.11.62", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "visual_studio_2022", "ecosystem": "linux", "versions": [{"affected_version": "[17.14,17.14.44)", "min_fixed_version": "17.14.44", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "visual_studio_2026", "ecosystem": "linux", "versions": [{"affected_version": "[18.11,18.11.3)", "min_fixed_version": "18.11.3", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "证书验证不恰当", "kind_en": "证书验证不当", "last_modified_time": "2026-11-01", "level": "High", "mps_id": "MPS-a1hj-m8d7", "poc": false, "poc_url": [], "published_time": "2026-11-01", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-a1hj-m8d7", "name": "https://www.oscs1024.com/hd/MPS-a1hj-m8d7"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-118147", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-118147"}, {"url": "https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-118147", "name": "Visual Studio Spoofing Vulnerability"}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "Visual Studio 证书验证欺骗漏洞", "_translated": true, "_saved_at": "2026-10-31T22:22:24+00:00", "_first_saved_at": "2026-10-31T22:22:24+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-a1hj-m8d7"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-120205", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:R/S:C/C:H/I:H/A:N", "severity": "high", "base_score": 8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:A/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.4}]}, "cvss_score": 7.4, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:A/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-79", "description": "Thelia 是 OpenStudio 团队维护的开源 PHP 电商内容管理系统，经由 Composer 包 thelia/thelia 与 thelia/core 分发，用于搭建在线商店并提供商品、订单、客户与优惠券营销等能力。\n受影响版本中，前台注册表单 CustomerRegisterForm 对 firstname 与 lastname 仅施加 NotBlank 校验，攻击者注册普通客户账户时可将 HTML 脚本载荷作为姓名存入 customer 表；后台优惠券页面生成条件摘要时，ForSomeCustomers::getSummary() 将客户 lastname、firstname 与 ref 原文拼接进消息 'Customer is %op% \u003cstrong\u003e%customer_list%\u003c/strong\u003e' 的 %customer_list% 参数，翻译器按纯文本插值且不转义，渲染链路再经 DataTable 的 html 单元格以 {{ value|raw }} 关闭自动转义，管理员打开关联该客户的优惠券页面时载荷在 /admin 源以管理员会话执行，攻击者可进一步读取页面内嵌 CSRF token 并创建超级管理员账户，导致后台权限被接管。\n修复版本中通过在 ConditionAbstract 新增 escapeSummaryValue() 方法并统一以 htmlspecialchars((string) $value, ENT_QUOTES | ENT_SUBSTITUTE, 'UTF-8') 转义解决该问题，ForSomeCustomers::getSummary() 对 lastname、firstname、ref 转义后再拼接，国家、分类、商品、配送模块、金额、数量与开始日期等其余条件实现的摘要参数同步接入该方法，条件摘要保留原有 HTML 标记的同时不再执行注入的脚本。", "effects": [{"comp_name": "thelia/core", "ecosystem": "composer", "versions": [{"affected_version": "(-∞,3.1.0)", "min_fixed_version": "3.1.0", "repository": "composer", "solutions": [], "upstream": true}]}, {"comp_name": "thelia/thelia", "ecosystem": "composer", "versions": [{"affected_version": "(-∞,3.1.0)", "min_fixed_version": "3.1.0", "repository": "composer", "solutio :X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-693", "description": "ramparts 是 Highflame 开源的 Rust 语言 MCP 与 AI Agent 安全扫描器，发布于 GitHub 与 crates.io，用于对 MCP 服务器和 agentskills.io 技能包执行静态安全分析，其中 ramparts skills scan 子命令负责扫描本地技能包目录。\n受影响版本中，src/skills.rs 的 collect_bundle_siblings 依据 SCRIPT_EXTS 扩展名白名单枚举技能包 scripts/ 目录下的脚本文件，白名单仅覆盖 py、sh、bash、zsh、js、mjs、cjs、ts、rb、pl、ps1 且不包含 .pyc，walk_bundle_subdir 使用单层 read_dir 遍历并对目录与符号链接条目直接跳过，因此 scripts/\u003c子目录\u003e/__pycache__/ 内的编译字节码不会被枚举为待扫描资源，YARA 与 LLM 分析均无法触达该文件；攻击者向技能包中放入经 PEP 552 UNCHECKED_HASH 模式编译并携带恶意逻辑的 .pyc，同时提供干净的 .py 源码作为掩护，扫描输出为 0 findings，而 CPython 在技能运行、模块导入时不校验该哈希并直接执行其中的任意代码，形成确定性扫描绕过与代码执行。\n修复版本中通过，可将 __pycache__ 目录与 .pyc 文件纳入递归扫描范围，在扫描与运行技能前清除或人工核查编译字节码，仅部署来源可信的技能包进行缓解，并跟踪上游仓库 issue 154 的修复进展，待官方发布修复版本后升级并重新扫描。", "effects": [{"comp_name": "ramparts", "ecosystem": "cargo", "versions": [{"affected_version": "[0.8.1,0.8.10]", "min_fixed_version": "", "repository": "cargo", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "保护机制失效", "kind_en": "保护机制失效", "last_modified_time": "2026-11-01", "level": "High", "mps_id": "MPS-jcou-h82q", "poc": false, "poc_url": [], "published_time": "2026-11-01", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-jcou-h82q", "name": "https://www.oscs1024.com/hd/MPS-jcou-h82q"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-120202", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-120202"}, {"url": "https://github.com/highflame-ai/ramparts/issues/154", "name": "GitHub Issue #154"}, {"url": "https://github.com/highflame-ai/ramparts/blob/v0.8.10/src/skills.rs#L898", "name": ""}, {"url": "https://github.com/highflame-ai/ramparts", "name": ""}, {"url": "https://www.vulncheck.com/advisories/highflame-ramparts-0.8.1-through-0.8.10-skill-bundle-scan-bypass-via-nested-pyc", "name": "VulnCheck Advisory: Highflame ramparts 0.8.1 through 0.8.10 Skill Bundle Scan Bypass via Nested .pyc"}], "scope_influence": "", "tags": ["AI"], "title": "ramparts 技能包扫描绕过漏洞", "_translated": true, "_saved_at": "2026-10-31T22:22:30+00:00", "_first_saved_at": "2026-10-31T18:59:34+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-jcou-h82q"}, {"analysis_status": 0, "articles": [{"content": "跨站点请求伪造 (CSRF)通过利用网站对用户请求的信任进行攻击。当用户在网站A登录并在同一浏览器会话中访问网站B时，攻击者可以构造特制的请求并诱使用户执行，以使网站B误以为这些请求是用户合法发起的。\n攻击者通常通过欺骗用户点击恶意链接、在受信任的网站中植入恶意代码或通过钓鱼等手段来实施CSRF攻击，一旦用户执行了恶意请求，攻击者可以以用户的身份执行任意操作，包括更改用户密码、发起资金转账或删除重要数据等。", "title": "什么是CSRF"}, {"content": "- 链接欺骗：攻击者通过向用户发送包含恶意链接的电子邮件或社交媒体消息，诱使用户点击并执行恶意请求。\n- 图片引用攻击：攻击者通过在恶意网站上包含指向目标网站的图片引用，以触发用户浏览器自动发送目标网站的请求。\n- XSS利用：如果目标网站存在XSS漏洞，攻击者可以注入恶意脚本，以使用户在浏览器中执行恶意请求。", "title": "CSRF常见的攻击方式"}, {"content": "- 随机令牌：网站可以在每个请求中包含一个随机生成的令牌（CSRF Token），并验证该令牌的有效性，以确认请求的来源是合法的。\n- SameSite Cookie：使用SameSite属性来限制跨站点请求，将Cookie的发送限制在同一站点上，减少了跨站请求伪造的风险。\n- 双重验证：对于敏感操作，网站可以要求用户进行额外的验证，例如输入验证码、提供第二个因素的身份验证等。\n- 强化浏览器策略：网站可以设置Content-Security-Policy（CSP）头，限制浏览器执行恶意脚本的能力，减少CSRF攻击的风险。\n- 限制用户操作：网站可以要求用户在执行敏感操作之前进行明确的确认或授权，防止恶意请求被误触发。\n- 安全编码实践：开发人员应遵循安全编码实践，对用户输入进行适当的验证和过滤，防止恶意请求的注入。", "title": "如何预防CSRF"}], "cnvd_id": "", "cve_id": "CVE-2026-120207", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:N/I:H/A:L", "severity": "high", "base_score": 7.1}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:A/VC:N/VI:H/VA:L/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7}]}, "cvss_score": 7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:A/VC:N/VI:H/VA:L/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-352", "description": "Thelia Page 是 Thelia 开源电商 CMS 的官方页面管理模块，以 composer 包 thelia/page-module 形式分发，用于管理店铺静态页面及其标签、文档与图片，图片存储依赖共享媒体库模块 TheliaLibrary。\n受影响版本中，后台 page-tag、page-document、page-image 三类删除路由均未调用令牌校验与模块权限检查，PageTagController::deletePageTagAction 的路由未限制请求方法，PageImageController::deleteImageAction 与 PageDocumentController::deleteDocumentAction 声明为 GET 路由，其中 deleteImageAction 将参数 $pageImageId 同时传入 deleteImageAssociation 与 LibraryImageService::deleteImage，前者读取 library_item_image 表主键、后者按共享媒体库 library_image 表主键解析，$pageId 仅用于拼装重定向地址而不参与任何归属校验，攻击者构造携带顺序 id 的外部链接诱导已登录管理员点击后，浏览器携带会话 Cookie 发起顶层 GET 导航即可逐个删除页面、产品与分类共用的媒体库图片文件、全部渲染变体及数据库记录，并经 ON DELETE CASCADE 级联解除跨条目引用。\n修复版本中通过在删除路由统一引入 ChecksAdminWriteAccess 检查，要求 POST 请求体携带会话 _token 并校验 Page 模块 DELETE、UPDATE 权限，将各删除路由改为 POST-only 并限定 id 为数字，删除前经 LibraryItemImageQuery 校验记录确属给定页面，同时新增 LibraryImageDetacher 仅在该共享库图片不再被其他条目引用时删除图片及其文件，令牌缺失或权限不足时返回 403，切断了跨站请求伪造删除链路。", "effects": [{"comp_name": "thelia/page-module", "ecosystem": "composer", "versions": [{"affected_version": "(-∞,2.0.4)", "min_fixed_version": "2.0.4", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "CSRF", "kind_en": "跨站请求伪造 (CSRF)", "last_modified_time": "2026-11-01", "level": "High", "mps_id": "MPS-gpfo-0xvq", "poc": false, "poc_url": [], "published_time": "2026-11-01", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-gpfo-0xvq", "name": "https://www.oscs1024.com/hd/MPS-gpfo-0xvq"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-120207", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-120207"}, {"url": "https://github.com/thelia/thelia/security/advisories/GHSA-whqr-4v2h-6jhc", "name": "GitHub Security Advisory (GHSA-whqr-4v2h-6jhc)"}, {"url": "https://github.com/thelia-modules/Page/commit/e7206a7c35c945cc8fe529fe95a9b30402f0fb60", "name": ""}, {"url": "https://github.com/thelia-modules/Page/blob/2.0.3/Controller/Admin/PageImageController.php#L117", "name": ""}, {"url": "https://www.vulncheck.com/advisories/thelia-page-module-before-2.0.4-csrf-via-page-tag-document-and-image-delete-routes", "name": "VulnCheck Advisory: Thelia Page Module before 2.0.4 CSRF via Page Tag, Document and Image Delete Routes"}], "scope_influence": "", "tags": ["php", "开源"], "title": "Thelia Page模块CSRF漏洞", "_translated": true, "_saved_at": "2026-10-31T18:59:31+00:00", "_first_saved_at": "2026-10-31T18:59:31+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-gpfo-0xvq"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-120240", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:N/AC:L/Au:S/C:C/I:C/A:C", "severity": "high", "base_score": 9}], "cvssv3": [{"source": "VulDB", "vector": "CVSS:3.0/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H/E:P/RL:X/RC:R", "severity": "critical", "base_score": 9.9}], "cvssv31": [{"source": "cna@vuldb.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", , "cwe": "CWE-78", "description": "WAVLINK WN553X1-B 是闭源路由器固件，用于提供无线接入、路由转发以及基于 /bin/ioos 的 Web 管理功能。\n受影响版本中，ovpn_file 处理函数 sub_4162A8 在 function 为 set 且 type 为 del 时，将请求参数 file_id 未经校验写入 snprintf 生成的 uci 查询字符串，并交给 popen 执行。持有有效会话的远程调用者可闭合命令中的双引号注入系统命令；ioos 以 root 运行，设备可被完全控制。\n修复版本中通过阻断 file_id 进入 shell 命令拼接来消除该注入，但公开材料未提供修复版本、补丁或可核验代码差异。", "effects": [{"comp_name": "wn553x1-b", "ecosystem": "linux", "versions": [{"affected_version": "[260403_2.0.0,260403_2.0.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-11-02", "level": "High", "mps_id": "MPS-yh5e-tnu0", "poc": false, "poc_url": [], "published_time": "2026-11-02", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-yh5e-tnu0", "name": "https://www.oscs1024.com/hd/MPS-yh5e-tnu0"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-120238", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-120238"}, {"url": "https://vuldb.com/vuln/429597", "name": "VDB-429597 | WAVLINK WN553X1-B ovpn_file ioos sub_4162A8 os command injection"}, {"url": "https://vuldb.com/vuln/429597/cti", "name": "VDB-429597 | CTI Indicators (IOB, IOC, TTP, IOA)"}, {"url": "https://vuldb.com/cve/CVE-2026-120238", "name": "CVE-2026-120238 | CVE Analysis and Report"}, {"url": "https://vuldb.com/submit/919248", "name": "Submit #919248 | Wavlink Router Firmware V260403_2.0.0 Command Injection"}, {"url": "https://github.com/senxitoyshuyi-ui/HACKALL/blob/main/WAVLINK%20WN553X1-B%20Router/WAVLINK_WN553X1-B_ovpn_file_command_injection.md", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "WN553X1-B命令注入", "_translated": true, "_saved_at": "2026-11-01T20:03:47+00:00", "_first_saved_at": "2026-11-01T20:03:47+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-yh5e-tnu0"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过构造恶意的数据，将过多的数据输入到程序的缓冲区中，使得缓冲区的空间被填满，从而溢出到程序的栈 (stack) 或堆 (heap) 中，导致程序崩溃、拒绝服务、数据泄露等安全问题。\n", "title": "什么是经典缓冲区溢出"}, {"content": "| 类型        | 描述                                                         |\n| ----------- | ------------------------------------------------------------ |\n| 代码注入攻击      | 攻击者通过向程序的缓冲区输入恶意代码，从而控制程序执行流程，实现对程序操作的恶意操作。例如，攻击者可以通过向 Web 应用程序的输入框中输入恶意代码，从而执行任意的代码，破坏系统、窃取数据等。 |\n| 数据覆盖攻击      | 攻击者通过向程序的缓冲区输入过多的数据，从而覆盖程序中的重要数据或代码，实现对程序操作的恶意操作。例如，攻击者可以通过向聊天应用程序的输入框中输入过多的表情符号，从而覆盖程序中的重要数据，例如聊天消息、账号密码等。 |\n| 栈溢出攻击 | 攻击者通过向程序的栈中输入过多的数据，从而溢出到栈外部，实现对程序操作的恶意操作。例如，攻击者可以通过向游戏应用程序的输入框中输入过多的道具名称，从而覆盖程序中的重要数据，例如游戏数据、账号密码等。 |\n| 堆溢出攻击       | 攻击者通过向程序的堆中输入过多的数据，从而溢出到堆外部，实现对程序操作的恶意操作。例如，攻击者可以通过向操作系统工具的输入框中输入过多的命令，从而覆盖程序中的重要数据，例如系统文件、配置文件等。 |", "title": "经典缓冲区溢出常见的攻击方式"}, {"content": "- 输入验证：在程序输入处对输入数据进行严格的验证和过滤，确保输入数据符合预期的格式和类型，避免被攻击者注入恶意命令或数据。可以使用正则表达式、格式字符串等方式进行输入验证。\n- 输出过滤：在程序输出处对输出数据进行严格的过滤和检查，确保输出数据符合预期的格式和类型，避免被攻击者截获和篡改。可以使用安全的输出过滤库等方式进行输出过滤。\n- 使用安全的编程模型：使用安全的编程模型，例如避免使用原生的缓冲区管理函数，使用安全的框架和库来处理输入数据和执行命令，避免缓冲区溢出漏洞。\n- 数据库加密和访问控制：对于敏感数据和命令，使用加密和访问控制措施，确保只有授权用户可以访问和执行命令，避免被攻击者窃取和篡改。\n- 定期更新和升级：定期更新和升级应用程序和库的版本，确保应用程序和库的最新版本包含了最新的安全补丁和修复措施，避免安全漏洞的出现和利用。\n- 安全审计和监控：定期对系统和应用程序进行安全审计和监控，及时发现和阻止潜在的安全漏洞和攻击，确保系统和数据的安全和可靠性。", "title": "如何预防经典缓冲区溢出"}], "cnvd_id": "", "cve_id": "CVE-2026-120241", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:N/AC:L/Au:N/C:N/I:N/A:C", "severity": "high", "base_score": 7.8}], "cvssv3": [{"source": "VulDB", "vector": "CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H/E:P/RL:X/RC:R", "severity": "high", "base_score": 7.5}], "cvssv31": [{"source": "cna@vuldb.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}], "cvssv4": [{"source": "cna@vuldb.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/ 不检查输入大小的缓冲区复制（“经典缓冲区溢出”）", "last_modified_time": "2026-11-02", "level": "High", "mps_id": "MPS-4wfm-c8h7", "poc": false, "poc_url": [], "published_time": "2026-11-02", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-4wfm-c8h7", "name": "https://www.oscs1024.com/hd/MPS-4wfm-c8h7"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-120241", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-120241"}, {"url": "https://vuldb.com/vuln/429600", "name": "VDB-429600 | Ruijie RG-ES205GC Local Firmware Upgrade httpupg.cgi buffer overflow"}, {"url": "https://vuldb.com/vuln/429600/cti", "name": "VDB-429600 | CTI Indicators (IOB, IOC, IOA)"}, {"url": "https://vuldb.com/cve/CVE-2026-120241", "name": "CVE-2026-120241 | CVE Analysis and Report"}, {"url": "https://vuldb.com/submit/1016041", "name": "Submit #1016041 | Ruijie Networks Co., Ltd. RG-ES205GC, RG-ES206GC-P, RG-ES208GC, RG-ES210GC-LP, RG-ES210GS-P (sharing the same ESW firmware; NIS2100 series may also be aff ESW_1.0(1)B1P48, Release(12211919) Buffer Overflow"}, {"url": "https://github.com/byseeker/Ruijie-RG-ES-Series-Switches_PreAuth_Boundary_Overflow_DoS", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "锐捷交换机缓冲区溢出", "_translated": true, "_saved_at": "2026-11-01T20:03:43+00:00", "_first_saved_at": "2026-11-01T20:03:43+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-4wfm-c8h7"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-66570", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:L", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:L", "cwe": "CWE-79", "description": "WordPress File Upload（插件标识 wp-file-upload，现名 Iptanus File Upload）是 Nickboss（Iptanus）开发的开源 WordPress 文件上传插件，通过短代码在文章、页面或侧栏中提供可配置的上传表单，支持访客上传、分块传输与多种存储后端。\n受影响版本中，上传文件的内容检查 wfu_security_filecontent_checks() 依赖 wfu_content_scan_script_pattern() 的返回规则，仅当文件 MIME 类型以 text 开头时才扫描 \u003cscript\u003e 等脚本标记，默认参数 WFU_CHECKPHPTAGS_FILETYPES=commonimages 下扩展名不属于常见图片的非文本文件不进入任何内容扫描；默认配置允许访客上传（uploadrole 默认含 guests）且扩展名白名单默认为 *.*，未认证攻击者可上传以 \u003c!-- 等浏览器 HTML 嗅探特征字节开头、同时被 libmagic 识别为 video/3gpp 等非文本类型的复合文件，文件通过检查并存储到站点上传目录后，受害者直接访问该文件 URL 时浏览器按 HTML 渲染并执行内嵌脚本，窃取同源会话凭据，形成存储型 XSS。\n修复版本中通过在 wfu_security_filecontent_checks() 入口新增 wfu_file_leading_bytes_are_html() 前导字节检查，读取文件前 512 字节并模拟浏览器 HTML 嗅探签名，命中 \u003c!--、\u003c!doctype、\u003c?xml 或带终止字节校验的常见 HTML 标签特征时返回 WFU_ERROR_ADMIN_FILE_HASSCRIPTTAGS 拒绝上传，阻断以非文本类型伪装的 HTML 脚本文件进入站点存储，切断该存储型 XSS 利用链。", "effects": [{"comp_name": "wp-file-upload", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,5.2.2)", "min_fixed_version": "5.2.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-11-02", "level": "High", "mps_id": "MPS-4y3a-lx90", "poc": false, "poc_url": [], "published_time": "2026-11-02", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-4y3a-lx90", "name": "https://www.oscs1024.com/hd/MPS-4y3a-lx90"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-66570", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-66570"}, {"url": "https://patchstack.com/database/wordpress/plugin/wp-file-upload/vulnerability/wordpress-wordpress-file-upload-plugin-5-2-1-cross-site-scripting-xss-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "WordPress File Upload 存储型 XSS", "_translated": true, "_saved_at": "2026-11-01T20:03:49+00:00", "_first_saved_at": "2026-11-01T20:03:49+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-4y3a-lx90"}, {"analysis_status": 0, "articles": [], "attack_vector_type": "Local", "cnvd_id": "", "cve_id": "CVE-2026-74760", "cvss": {}, "cvss_score": 7.1, "cvss_vector": "", "cwe": "CWE-346", "description": "Google::Auth 是 Google 在 GitHub 开源的 Perl 语言云端认证库（google-auth-library-perl），实现应用默认凭证、用户 OAuth 授权与工作负载身份联邦等能力，随包发布的 gcloud-auth 命令行工具提供 login、application-default login 等登录命令。\n受影响版本中，gcloud-auth 的 login 与 application-default login 命令向授权请求附加随机 state 参数，回环回调处理函数 _wait_for_code 对监听器收到的首个请求只提取查询串中的 code，不读取也不比对 state；本机攻击进程抢在用户浏览器回调之前向 127.0.0.1 监听端口提交其自身 Google 账号的授权码后，命令行使用用户侧客户端凭证完成兑换，该流程未启用 PKCE，攻击者账号的 refresh_token 被写入令牌存储或 application_default_credentials.json，用户后续工具调用改以攻击者账号身份执行。\n修复版本中通过，可通过缓解措施阻断该利用链：仅在受信任的单用户环境中执行 gcloud-auth 登录命令并尽快完成浏览器授权，避免在存在不可信本地进程的主机上登录，登录完成后核对 application_default_credentials.json 与令牌存储中的账号归属，发现凭证被替换时立即执行 gcloud-auth revoke 并重新登录，官方发布包含 state 校验的版本后升级。", "effects": [{"comp_name": "google-auth", "ecosystem": "linux", "versions": [{"affected_version": "[0.11,0.12]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "源验证错误", "kind_en": "来源验证错误", "last_modified_time": "2026-11-02", "level": "High", "mps_id": "MPS-rgie-o5ny", "poc": false, "poc_url": [], "published_time": "2026-11-02", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-rgie-o5ny", "name": "https://www.oscs1024.com/hd/MPS-rgie-o5ny"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-74760", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-74760"}, {"url": "https://metacpan.org/release/CJCOLLIER/Google-Auth-0.12/source/bin/gcloud-auth.pl", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Google::Auth 授权码注入漏洞", "_translated": true, "_saved_at": "2026-11-01T20:03:48+00:00", "_first_saved_at": "2026-11-01T20:03:48+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-rgie-o5ny"}]}</script>
  <script>
    const payload = JSON.parse(document.getElementById("payload").textContent);
    const levelLabels = payload.level_labels || {};
    const items = payload.items || [];
    let filtered = items.slice();
    let activeId = null;

    const $ = (id) => document.getElementById(id);
    $("generatedAt").textContent = payload.generated_at || "-";
    $("retention").textContent = payload.retention_days ?? "-";
    $("cutoff").textContent = payload.cutoff_date || "-";
    $("count").textContent = String(payload.count ?? items.length);

    function levelClass(level) {
      const cn = levelLabels[level] || level || "";
      if (level === "Critical" || cn === "严重") return "crit";
      if (level === "High" || cn === "高危") return "high";
      return "other";
    }
    function levelText(level) {
      return levelLabels[level] || level || "-";
    }
    function esc(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }
    function scoreText(v) {
      if (v === null || v === undefined || v === "" || v === -1) return "-";
      return String(v);
    }

    function renderList() {
      const list = $("list");
      $("listCount").textContent = String(filtered.length);
      if (!filtered.length) {
        list.innerHTML = '<div class="empty">没有匹配项</div>';
        return;
      }
      list.innerHTML = filtered.map((it) => {
        const id = it.mps_id || it.cve_id;
        const active = id === activeId ? " active" : "";
        return `
          <button class="item${active}" data-id="${esc(id)}" type="button">
            <div class="item-top">
              <span class="cve">${esc(it.cve_id || it.mps_id || "-")}</span>
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
            </div>
            <div class="title">${esc(it.title || "-")}</div>
            <div class="item-foot">
              <span>CVSS ${esc(scoreText(it.cvss_score))}</span>
              <span>${esc(it.published_time || "-")}</span>
              ${it.poc ? "<span>POC</span>" : ""}
            </div>
          </button>`;
      }).join("");
      list.querySelectorAll(".item").forEach((btn) => {
        btn.addEventListener("click", () => selectById(btn.dataset.id));
      });
    }

    function refsHtml(it) {
      const refs = Array.isArray(it.reference_url_list) ? it.reference_url_list : [];
      const links = [];
      if (it._source_page) links.push({ url: it._source_page, name: "OSCS 详情" });
      if (it.cve_id) links.push({ url: `https://nvd.nist.gov/vuln/detail/${it.cve_id}`, name: "NVD" });
      refs.forEach((r) => {
        if (r && r.url) links.push({ url: r.url, name: r.name || r.url });
      });
      const seen = new Set();
      const uniq = [];
      for (const l of links) {
        if (seen.has(l.url)) continue;
        seen.add(l.url);
        uniq.push(l);
      }
      if (!uniq.length) return '<div class="box">无参考链接</div>';
      return `<div class="refs">${uniq.map((l) =>
        `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name || l.url)}</a>`
      ).join("")}</div>`;
    }

    function articlesHtml(it) {
      const arts = Array.isArray(it.articles) ? it.articles : [];
      if (!arts.length) return "";
      return `<div class="section"><h3>相关说明</h3>${arts.map((a) => `
        <div class="article">
          <h4>${esc(a.title || "说明")}</h4>
          <p>${esc(a.content || "")}</p>
        </div>`).join("")}</div>`;
    }

    function renderDetail(it) {
      const detail = $("detail");
      if (!it) {
        detail.innerHTML = '<div class="empty">暂无数据</div>';
        return;
      }
      const pocUrls = Array.isArray(it.poc_url) ? it.poc_url : [];
      detail.innerHTML = `
        <div class="d-head">
          <div>
            <h1 class="d-title">${esc(it.title || "-")}</h1>
            <div class="ids">
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
              <span class="chip">${esc(it.cve_id || "无 CVE")}</span>
              <span class="chip">${esc(it.mps_id || "-")}</span>
              ${it.poc ? '<span class="chip">有 POC</span>' : ""}
              ${it.exp ? '<span class="chip">有 EXP</span>' : ""}
            </div>
          </div>
          <div class="actions">
            ${it._source_page ? `<a class="btn" href="${esc(it._source_page)}" target="_blank" rel="noopener">OSCS</a>` : ""}
            ${it.cve_id ? `<a class="btn" href="https://nvd.nist.gov/vuln/detail/${esc(it.cve_id)}" target="_blank" rel="noopener">NVD</a>` : ""}
          </div>
        </div>
        <div class="grid">
          <div class="stat"><div class="k">CVSS</div><div class="v">${esc(scoreText(it.cvss_score))}</div></div>
          <div class="stat"><div class="k">向量</div><div class="v">${esc(it.cvss_vector || "-")}</div></div>
          <div class="stat"><div class="k">CWE</div><div class="v">${esc(it.cwe || "-")}</div></div>
          <div class="stat"><div class="k">类型</div><div class="v">${esc(it.kind || it.kind_en || "-")}</div></div>
          <div class="stat"><div class="k">公开</div><div class="v">${esc(it.published_time || "-")}</div></div>
          <div class="stat"><div class="k">利用成本</div><div class="v">${esc(it.exploit_requirement_cost || "-")}</div></div>
          <div class="stat"><div class="k">可利用性</div><div class="v">${esc(it.exploitability || "-")}</div></div>
          <div class="stat"><div class="k">修复建议</div><div class="v">${esc(it.fix_suggestion || "-")}</div></div>
        </div>
        <div class="section"><h3>描述</h3><div class="box">${esc(it.description || "无描述")}</div></div>
        ${it.scope_influence ? `<div class="section"><h3>影响范围</h3><div class="box">${esc(it.scope_influence)}</div></div>` : ""}
        ${pocUrls.length ? `<div class="section"><h3>POC 链接</h3><div class="refs">${pocUrls.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join("")}</div></div>` : ""}
        <div class="section"><h3>参考链接</h3>${refsHtml(it)}</div>
        ${articlesHtml(it)}
      `;
    }

    function selectById(id) {
      const it = filtered.find((x) => (x.mps_id || x.cve_id) === id) ||
                 items.find((x) => (x.mps_id || x.cve_id) === id);
      if (!it) return;
      activeId = it.mps_id || it.cve_id;
      renderList();
      renderDetail(it);
      const btn = document.querySelector(`.item[data-id="${CSS.escape(activeId)}"]`);
      if (btn) btn.scrollIntoView({ block: "nearest" });
      history.replaceState(null, "", "#" + encodeURIComponent(activeId));
    }

    function applyFilter(q) {
      const query = (q || "").trim().toLowerCase();
      filtered = !query ? items.slice() : items.filter((it) => {
        const blob = [
          it.cve_id, it.mps_id, it.title, it.kind, it.kind_en, it.cwe, it.description, it.level
        ].map((x) => String(x || "").toLowerCase()).join(" ");
        return blob.includes(query);
      });
      renderList();
      if (filtered.length) {
        const still = filtered.some((x) => (x.mps_id || x.cve_id) === activeId);
        selectById(still ? activeId : (filtered[0].mps_id || filtered[0].cve_id));
      } else {
        activeId = null;
        renderDetail(null);
      }
    }

    $("search").addEventListener("input", (e) => applyFilter(e.target.value));

    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement !== $("search")) {
        e.preventDefault();
        $("search").focus();
        return;
      }
      if (!filtered.length) return;
      const idx = filtered.findIndex((x) => (x.mps_id || x.cve_id) === activeId);
      if (e.key === "ArrowDown") {
        e.preventDefault();
        const next = filtered[Math.min(filtered.length - 1, Math.max(0, idx) + 1)];
        selectById(next.mps_id || next.cve_id);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        const prev = filtered[Math.max(0, idx - 1)];
        selectById(prev.mps_id || prev.cve_id);
      }
    });

    const hashId = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    if (hashId && items.some((x) => (x.mps_id || x.cve_id) === hashId)) {
      activeId = hashId;
      renderList();
      selectById(hashId);
    } else if (items.length) {
      selectById(items[0].mps_id || items[0].cve_id);
    } else {
      renderList();
      renderDetail(null);
    }
  </script>
</body>
</html>
