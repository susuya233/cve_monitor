v9", "poc": false, "poc_url": [], "published_time": "2026-11-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-sm2r-igv9", "name": "https://www.oscs1024.com/hd/MPS-sm2r-igv9"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-76421", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-76421"}, {"url": "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-clamav-multi-e93M3vdA", "name": "cisco-sa-clamav-multi-e93M3vdA"}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "ClamAV CHM堆越界写漏洞", "_translated": true, "_saved_at": "2026-11-18T18:36:49+00:00", "_first_saved_at": "2026-11-18T18:36:49+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-sm2r-igv9"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能有效地控制资源的使用，导致攻击者可以利用这个漏洞耗尽应用程序所依赖的资源。这些资源可以是计算资源（CPU、内存）、网络带宽、数据库连接或其他系统资源。攻击者可以通过发送特制的请求、恶意输入或其他方式，使应用程序消耗大量资源，导致拒绝服务或系统崩溃。", "title": "什么是拒绝服务"}, {"content": "- 消耗计算资源：攻击者可以发送计算密集型的请求，例如复杂的计算、无限循环或递归操作，以耗尽应用程序的计算资源，导致应用程序无法响应其他请求。\r\n- 消耗内存资源：攻击者可以发送大量的数据或恶意输入，以导致应用程序消耗过多的内存资源，从而使系统的可用内存耗尽，并导致应用程序崩溃或变得不可用。\r\n- 消耗网络带宽：攻击者可以发送大量的请求或大型数据包，以消耗应用程序所依赖的网络带宽。这会导致其他合法用户无法正常访问应用程序或降低系统的整体网络性能。\r\n- 消耗存储资源：攻击者可以发送大量的请求或上传大文件，以耗尽应用程序的存储资源，导致系统无法处理其他请求或存储新的数据。", "title": "拒绝服务常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对输入数据进行合理的验证和过滤，防止恶意输入导致资源消耗过高。\r\n- 实施资源限制：应用程序应该实施适当的资源限制策略，例如限制计算操作的时间或次数，限制内存使用量，限制并发连接数等，以防止资源被耗尽。\r\n- 异常处理与错误恢复：应用程序应该具备健壮的异常处理和错误恢复机制，以防止因意外错误导致资源泄漏或无法释放的情况。\r\n- 资源监控与警报：应用程序应该实施适当的资源监控和警报机制，及时发现异常的资源消耗情况，并采取相应的措施来应对。\r\n- 压力测试与性能优化：应用程序应该进行压力测试，以评估其在高负载情况下的性能，并进行必要的性能优化，以确保能够有效地处理大量请求而不耗尽资源。", "title": "如何预防拒绝服务"}], "cnvd_id": "", "cve_id": "CVE-2026-76417", "cvss": {"cvssv31": [{"source": "psirt@cisco.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-400", "description": "ClamAV 是 Cisco Talos 开源维护的防病毒引擎，被 clamscan、clamd 守护进程以及 Cisco Secure Endpoint Connector 等产品用于恶意软件扫描，其 libclamav 库内置 OLE2 解析器，负责处理 Microsoft Compound File Binary 格式文档。\n受影响版本中，libclamav/ole2_extract.c 的 ole2_walk_property_tree 函数遍历 OLE2 属性树时，根属性与目录属性的子节点递归调用传入 rec_level + 1，文件类型属性的子节点递归调用仍传入原 rec_level，纯文件属性构成的深层链路上递归深度计数保持不变，函数入口处 rec_level 大于 100 与 max_recursion_level 的上限检查不会命中，未认证攻击者向扫描流程发送构造的 CFB 文件可引发无上限递归，耗尽进程栈与可用内存，导致 ClamAV 扫描进程终止并形成拒绝服务。\n修复版本中通过在文件属性的子属性递归调用中传入 rec_level + 1，使全部递归边均计入递归深度，深层链路会命中既有的递归上限检查并终止属性遍历，阻断栈与内存耗尽导致的进程崩溃。", "effects": [{"comp_name": "clamav", "ecosystem": "linux", "versions": [{"affected_version": "[0.71,1.4.7)", "min_fixed_version": "1.4.7", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[1.5.0,1.5.5)", "min_fixed_version": "1.5.5", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "拒绝服务", "kind_en": "不受控制的资源消耗", "last_modified_time": "2026-11-19", "level": "High", "mps_id": "MPS-u5mj-yf8n", "poc": false, "poc_url": [], "published_time": "2026-11-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-u5mj-yf8n", "name": "https://www.oscs1024.com/hd/MPS-u5mj-yf8n"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-76417", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-76417"}, {"url": "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-clamav-multi-e93M3vdA", "name": "cisco-sa-clamav-multi-e93M3vdA"}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "ClamAV OLE2 内存耗尽漏洞", "_translated": true, "_saved_at": "2026-11-18T18:36:46+00:00", "_first_saved_at": "2026-11-18T18:36:46+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-u5mj-yf8n"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-76416", "cvss": {"cvssv31": [{"source": "psirt@cisco.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "https://www.oscs1024.com/hd/MPS-v8gy-qaek"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-132825", "cvss": {"cvssv31": [{"source": "cve@mitre.org", "vector": "CVSS:3.1/AV:L/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.4}]}, "cvss_score": 7.4, "cvss_vector": "CVSS:3.1/AV:L/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-122", "description": "Ruby 是开源的通用脚本语言解释器，广泛用于 Web 应用与系统自动化，字符串大小写转换由 rb_str_casemap 协同各单字节编码的 case_map 回调完成。\n受影响版本中，ISO-8859-x 与 Windows-125x 等单字节编码的 case_map 函数在处理 sharp s（0xDF）时按大写映射输出两字节的 SS，但循环条件 to \u003c to_end 只校验剩余一个字节的空间，最后一个字节写入时越过输出缓冲区末尾。输出缓冲区按输入长度加 20 字节分配，包含 21 个 sharp s 的字符串执行 upcase、downcase(:fold)、swapcase 或 casecmp? 时会越界写入一字节，写入内容为 S（0x53）或 s（0x73），攻击者可通过输入长度控制缓冲区布局，官方确认该缺陷在部分场景可导致远程代码执行。\n修复版本中通过将 case_map 循环条件改为 to_end - to \u003e 1，要求输出缓冲区至少剩余两字节空间才继续映射，该修改同步应用于 ISO-8859-1、ISO-8859-2、Windows-1252 等 14 个单字节编码文件，并新增 sharp s 展开回归测试，消除了这一字节堆溢出。", "effects": [{"comp_name": "ruby", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,3.3.14)", "min_fixed_version": "3.3.14", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[4.0.0,4.0.10)", "min_fixed_version": "4.0.10", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[3.4.0,3.4.13)", "min_fixed_version": "3.4.13", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "堆缓冲区溢出", "kind_en": "基于堆的缓冲区溢出", "last_modified_time": "2026-11-19", "level": "High", "mps_id": "MPS-xq4u-6var", "poc": false, "poc_url": [], "published_time": "2026-11-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-xq4u-6var", "name": "https://www.oscs1024.com/hd/MPS-xq4u-6var"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-132825", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-132825"}, {"url": "https://news.ycombinator.com/item?id=50554038", "name": ""}, {"url": "https://www.ruby-lang.org/en/news/2026/11/18/multiple-vulnerabilities-in-regexp-and-string/", "name": ""}, {"url": "https://github.com/ruby/ruby/security/advisories/GHSA-34m4-m9fh-gqp5", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Ruby大小写转换堆溢出漏洞", "_translated": true, "_saved_at": "2026-11-19T08:17:59+00:00", "_first_saved_at": "2026-11-19T08:17:59+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-xq4u-6var"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-131181", "cvss": {}, "cvss_score": 7.1, "cvss_vector": "", "cwe": "CWE-943", "description": "Splunk Enterprise 是 Splunk 公司推出的商业化机器数据搜索与分析平台，用于索引、检索和可视化企业日志与安全数据，为闭源商业软件。\n受影响版本中，不持有 admin 或 power 角色的低权限用户可以通过数据模型加速（Data Model Acceleration）功能运行恶意 Search Processing Language（SPL）命令，并通过 REST API 执行超出自身权限的操作。漏洞成因为 Splunk Enterprise 在把用户提供的数据加入生成的搜索语句前未对其进行中性化处理，攻击者构造的数据直接以 SPL 语法进入生成的搜索，注入的命令随后在服务端执行。\n修复版本中通过在用户提供的数据进入生成的搜索语句之前增加中性化处理，切断低权限用户借数据模型加速注入 SPL 命令的路径；官方已在 Splunk Enterprise 10.4.5、10.2.9、10.0.12 和 9.4.16 版本修复该问题，公告未提供缓解措施。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "数据查询逻辑中特殊元素的不当中和", "kind_en": "数据查询逻辑中特殊元素的不当中和", "last_modified_time": "2026-11-19", "level": "High", "mps_id": "MPS-5295-24ea", "poc": false, "poc_url": [], "published_time": "2026-11-19", "reference_url_list": [{"url": "https://advisory.splunk.com/advisories/SVD-2026-1103", "name": ""}, {"url": "https://advisory.splunk.com/advisories/SVD-2026-1103#cve-2026-131181", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-131181", "name": ""}], "scope_influence": "", "tags": [], "title": "Splunk数据模型SPL注入", "_translated": true, "_saved_at": "2026-11-19T00:54:54+00:00", "_first_saved_at": "2026-11-19T00:54:54+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-5295-24ea"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-63390", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:H/VA:L/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:H/VA:L/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-1284", "description": "HTSlib is a library for reading and writing bioinformatics file formats. Prior to 1.21.2, 1.22.3, 1.23.2, and 1.24, the BCF reader can experience an integer overflow in a record-length check that verifies whether a record contains enough bytes for the expected number and size of stored items. A crafted BCF record can bypass this check, causing reads beyond the stored data and, in some cases, writes beyond the heap buffer when the reader sets the least significant bit of accessed bytes. Opening such a file can crash the process, corrupt data or heap structures, and may permit arbitrary code execution. This issue is fixed in versions 1.21.2, 1.22.3, 1.23.2, and 1.24.", "effects": [{"comp_name": "htslib", "ecosystem": "linux", "versions": [{"affected_version": "[1.22.0,1.22.3)", "min_fixed_version": "1.22.3", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[1.23.0,1.23.2)", "min_fixed_version": "1.23.2", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,1.21.2)", "min_fixed_version": "1.21.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "输入中指定数量的验证不当", "kind_en": "输入中指定数量的验证不正确", "last_modified_time": "2026-11-20", "level": "High", "mps_id": "MPS-3h6p-x5wu", "poc": false, "poc_url": [], "published_time": "2026-11-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-3h6p-x5wu", "name": "https://www.oscs1024.com/hd/MPS-3h6p-x5wu"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-63390", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-63390"}, {"url": "https://github.com/samtools/htslib/commit/00a30cdb8db1f5832eb58a799383a462c6b58cb3", "name": ""}, {"url": "https://github.com/samtools/htslib/commit/2713f39242f4afff5382aad5c1ba02abe12950cd", "name": ""}, {"url": "https://github.com/samtools/htslib/commit/3a3585dc844f7caad266bbec8d91e45c09c1dcd4", "name": ""}, {"url": "https://github.com/samtools/htslib/pull/2047", "name": ""}, {"url": "https://github.com/samtools/htslib/releases/tag/1.21.2", "name": ""}, {"url": "https://github.com/samtools/htslib/releases/tag/1.22.3", "name": ""}, {"url": "https://github.com/samtools/htslib/releases/tag/1.23.2", "name": ""}, {"url": "https://github.com/samtools/htslib/releases/tag/1.24", "name": ""}, {"url": "https://github.com/samtools/htslib/security/advisories/GHSA-2wm6-8hgm-7g92", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-63390 漏洞", "_translated": true, "_saved_at": "2026-11-20T07:58:10+00:00", "_first_saved_at": "2026-11-19T17:54:13+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-3h6p-x5wu"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-62257", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:H/VA:L/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:H/VA:L/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-787", "description": "HTSlib is a library for reading and writing bioinformatics file formats. Prior to 1.21.2, 1.22.3, 1.23.2, and 1.24, the experimental CRAM v4 XPACK and XRLE decoders cache expanded block pointers at indexes beyond the 512-element slice-\u003eblock_by_id array. An array index partially controlled by data in the input file first causes an out-of-bounds read to determine whether a block is cached; a null value then causes allocation of a block and an out-of-bounds pointer write to the same element. The invalid read may crash the process, while the write may corrupt heap state and could permit arbitrary code execution. This issue is fixed in versions 1.21.2, 1.22.3, 1.23.2, and 1.24.", "effects": [{"comp_name": "htslib", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.21.2)", "min_fixed_version": "1.21.2", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[1.22.0,1.22.3)", "min_fixed_version": "1.22.3", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[1.23.0,1.23.2)", "min_fixed_version": "1.23.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": 作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-62258", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:H/VA:L/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:H/VA:L/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-787", "description": "HTSlib is a library for reading and writing bioinformatics file formats. Prior to 1.21.2, 1.22.3, 1.23.2, and 1.24, the CRAM decoder validates the 254-character query-name limit only after decoding the name into a 1024-byte stack array. An attacker-controlled CRAM record can provide an overlong query name and overflow the local stack buffer before the later validation runs; all CRAM format versions are affected. Opening such a file can crash the process, corrupt stack data, and may permit arbitrary code execution. This issue is fixed in versions 1.21.2, 1.22.3, 1.23.2, and 1.24.", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-11-20", "level": "High", "mps_id": "MPS-s1zb-dhye", "poc": false, "poc_url": [], "published_time": "2026-11-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-s1zb-dhye", "name": "https://www.oscs1024.com/hd/MPS-s1zb-dhye"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-62258", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-62258"}, {"url": "https://github.com/samtools/htslib/commit/25278797c251a9af789382ecf5aa0c86f417bdf5", "name": ""}, {"url": "https://github.com/samtools/htslib/commit/df93e245f1b517aec86c69684fcb2faf5942c5c2", "name": ""}, {"url": "https://github.com/samtools/htslib/commit/f1d1bf835aaafa1e511996dcd49760c36f683b17", "name": ""}, {"url": "https://github.com/samtools/htslib/pull/2046", "name": ""}, {"url": "https://github.com/samtools/htslib/releases/tag/1.21.2", "name": ""}, {"url": "https://github.com/samtools/htslib/releases/tag/1.22.3", "name": ""}, {"url": "https://github.com/samtools/htslib/releases/tag/1.23.2", "name": ""}, {"url": "https://github.com/samtools/htslib/releases/tag/1.24", "name": ""}, {"url": "https://github.com/samtools/htslib/security/advisories/GHSA-2jx2-wm7f-rv9m", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-62258 漏洞", "_translated": true, "_saved_at": "2026-11-20T07:58:10+00:00", "_first_saved_at": "2026-11-19T17:54:17+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-s1zb-dhye"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-113347", "cvss": {"cv ": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-295", "description": "IBM Guardium Data Protection 12.2 容易受到 GDP Terraform 提供程序中不正确的 TLS 证书验证的影响，从而允许具有中间人位置的网络攻击者拦截传输到 Guardium 设备的敏感凭证。", "effects": [{"comp_name": "Guardium Data Protection", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,12.2]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "证书验证不恰当", "kind_en": "证书验证不当", "last_modified_time": "2026-11-20", "level": "High", "mps_id": "MPS-i4v2-3qtn", "poc": false, "poc_url": [], "published_time": "2026-11-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-i4v2-3qtn", "name": "https://www.oscs1024.com/hd/MPS-i4v2-3qtn"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-85018", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-85018"}, {"url": "https://www.ibm.com/support/pages/node/7297484", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-85018 漏洞", "_translated": true, "_saved_at": "2026-11-20T00:09:36+00:00", "_first_saved_at": "2026-11-20T00:09:36+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-i4v2-3qtn"}, {"analysis_status": 0, "articles": [{"content": "在程序试图读取、写入或复制内存缓冲区时，未对边界进行适当的检查和限制。缓冲区是用于存储数据的一块内存区域，当程序试图在缓冲区之外的位置进行操作时，就可能导致缓冲区溢出或下溢。攻击者可以利用这个漏洞来修改程序的执行流、执行任意代码或导致拒绝服务等安全问题。", "title": "什么是缓冲区溢出"}, {"content": "- 缓冲区溢出攻击：攻击者向输入缓冲区中注入超过其容量的数据，导致数据溢出到相邻的内存区域，可能覆盖关键数据、修改变量值或执行恶意代码。\n- 缓冲区下溢攻击：攻击者向输入缓冲区中注入少于其容量的数据，导致数据被读取时越过缓冲区边界，可能泄露敏感信息或破坏程序的正常执行流程。\n- 字符串格式化攻击：攻击者通过控制格式化字符串的输入，可以读取或写入任意内存位置，从而执行恶意操作。", "title": "缓冲区溢出常见的攻击方式"}, {"content": "- 输入验证和边界检查：对于所有接受用户输入的缓冲区操作，确保验证输入数据的长度和内容，以避免缓冲区溢出或下溢。\n- 使用安全的字符串操作函数：使用安全的字符串操作函数（如strncpy、strncat）替代不安全的函数（如strcpy、strcat），这些函数会在操作时自动限制操作的边界。\n- 使用内存安全工具：使用内存安全工具（如内存分析器、静态分析工具）来检测和修复潜在的缓冲区溢出问题。\n- 采用安全编码实践：遵循安全编码实践，如最小特权原则、避免使用不受信任的输入等。\n- 定期更新和修补程序：及时应用程序厂商提供的安全更新和补丁，以修复已知的缓冲区溢出漏洞。\n- 使用编程语言和框架提供的安全功能：利用编程语言和框架提供的安全特性，如内存安全函数、边界检查等。", "title": "如何预防缓冲区溢出"}], "cnvd_id": "", "cve_id": "CVE-2026-82342", "cvss": {"cvssv31": [{"source": "psirt@us.ibm.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.1}]}, "cvss_score": 8.1, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-119", "description": "在处理特制的 PROXY 协议 v1 标头时，IBM Guardium Data Protection 12.2 容易受到基于堆栈的缓冲区溢出的影响。远程攻击者可以利用此漏洞导致拒绝服务或可能执行任意代码。", "effects": [{"comp_name": "Guardium Data Protection", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,12.2]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "缓冲区溢出", "kind_en": "内存缓冲区范围内的操作限制不当", "last_modified_time": "2026-11-20", "level": "High", "mps_id": "MPS-uej1-wnzc", "poc": false, "poc_url": [], "published_time": "2026-11-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-uej1-wnzc", "name": "https://www.oscs1024.com/hd/MPS-uej1-wnzc"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-82342", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-82342"}, {"url": "https://www.ibm.com/support/pages/node/7297484", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-82342 漏洞", "_translated": true, "_saved_at": "2026-11-20T00:09:46+00:00", "_first_saved_at": "2026-11-20T00:09:46+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-uej1-wnzc"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-84273", "cvss": {"cvssv31": [{"source": "psirt@us.ibm.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:H/A:H", "severity": "high", "base_score": 8.1}]}, "cvss_score": 8.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:H/A:H", "cwe": "CWE-22", "description": "IBM Guardium Data Protection 12.2 在数据源功能中容易受到路径遍历的攻击。经过身份验证的攻击者可以利用此漏洞删除设备上的任意文件。", "effects": [{"comp_name": "Guardium Data Protection", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,12.2]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-11-20", "level": "High", "mps_id": "MPS-urph-qydx", "poc": false, "poc_url": [], "published_time": "2026-11-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-urph-qydx", "name": "https://www.oscs1024.com/hd/MPS-urph-qydx"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-84273", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-84273"}, {"url": "https://www.ibm.com/support/pages/node/7297484", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-84273 漏洞", "_translated": true, "_saved_at": "2026-11-20T00:09:29+00:00", "_first_saved_at": "2026-11-20T00:09:29+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-urph-qydx"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-133553", "cvss": {"cvssv31": [{"source": "secalert@redhat.com", "vector": "CVSS:3.1/AV:L/AC:H/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:H/PR:L/UI:N/S:C/C:H/I:H/A:H", "cwe": "CWE-367", "description": "A flaw was found in crun. When copying files onto a tmpfs mounted with tmpcopyup, crun opens the destination a second time by name. A container that shares a writable volume with the container being created can change that path between the two lookups, so crun copies image files onto host files, including files under /proc/sys.", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "检查时间与使用时间(TOCTOU)的竞争条件", "kind_en": "检查时间使用时间 (TOCTOU) 竞争条件", "last_modified_time": "2026-11-20", "level": "High", "mps_id": "MPS-5hmq-6yjf", "poc": false, "poc_url": [], "published_time": "2026-11-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-5hmq-6yjf", "name": "https://www.oscs1024.com/hd/MPS-5hmq-6yjf"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-133553", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-133553"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-133553", "name": ""}, {"url": "https://bugzilla.redhat.com/show_bug.cgi?id=2577547", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-133553 漏洞", "_translated": true, "_saved_at": "2026-11-20T07:58:10+00:00", "_first_saved_at": "2026-11-20T07:58:07+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-5hmq-6yjf"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "cnvd_id": "", "cve_id": "CVE-2026-84087", "cvss": {"cvssv31": [{"source": "psirt@us.ibm.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-269", "description": "IBM Guardium Data Protection 12.2 容易受到通过 Collector 设备上的 SUID-root podman_wrapper 二进制文件进行本地权限升级的攻击。对 Collector 具有低权限访问权限的本地攻击者可以利用 SUID 二进制文件中参数验证不足的问题，以 root 身份执行任意命令，从而导致 Collector 设备完全受损。", "effects": [{"comp_name": "Guardium Data Protection", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,12.2]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-11-20", "level": "High", "mps_id": "MPS-rs57-a8ux", "poc": false, "poc_url": [], "published_time": "2026-11-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-rs57-a8ux", "name": "https://www.oscs1024.com/hd/MPS-rs57-a8ux"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-84087", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-84087"}, {"url": "https://www.ibm.com/support/pages/node/7297484", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-84087 漏洞", "_translated": true, "_saved_at": "2026-11-20T00:09:43+00:00", "_first_s 入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-62256", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:N/VI:H/VA:L/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:N/VI:H/VA:L/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-787", "description": "HTSlib is a library for reading and writing bioinformatics file formats. Prior to 1.21.2, 1.22.3, 1.23.2, and 1.24, fai_retrieve does not verify that the line width recorded in a FASTA .fai index is greater than or equal to the number of bases per line. When the line width is exactly one less than the base count, retrieval allocates an undersized heap buffer and writes one byte beyond its end; larger discrepancies instead cause an allocation failure that is handled. This issue can corrupt heap memory and crash the process. This issue is fixed in versions 1.21.2, 1.22.3, 1.23.2, and 1.24.", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-11-20", "level": "High", "mps_id": "MPS-qwoj-yxem", "poc": false, "poc_url": [], "published_time": "2026-11-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-qwoj-yxem", "name": "https://www.oscs1024.com/hd/MPS-qwoj-yxem"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-62256", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-62256"}, {"url": "https://github.com/samtools/htslib/commit/4af640f9ffd7f1fac95a739df7f560e3e5557960", "name": ""}, {"url": "https://github.com/samtools/htslib/commit/504fb841b70afb948f58089c3a4337ce875c1e52", "name": ""}, {"url": "https://github.com/samtools/htslib/commit/567fd43c6ef938de53c98217f99336e3ce5a60ab", "name": ""}, {"url": "https://github.com/samtools/htslib/commit/cdf22929aad8dde719c1b2070ad565ac9dd76c02", "name": ""}, {"url": "https://github.com/samtools/htslib/pull/2008", "name": ""}, {"url": "https://github.com/samtools/htslib/releases/tag/1.21.2", "name": ""}, {"url": "https://github.com/samtools/htslib/releases/tag/1.22.3", "name": ""}, {"url": "https://github.com/samtools/htslib/releases/tag/1.23.2", "name": ""}, {"url": "https://github.com/samtools/htslib/releases/tag/1.24", "name": ""}, {"url": "https://github.com/samtools/htslib/security/advisories/GHSA-4hjq-r829-8c8v", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-62256 漏洞", "_translated": true, "_saved_at": "2026-11-20T07:58:10+00:00", "_first_saved_at": "2026-11-19T17:54:19+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-qwoj-yxem"}]}</script>
  <script>
    const payload = JSON.parse(document.getElementById("payload").textContent);
    const levelLabels = payload.level_labels || {};
    const items = payload.items || [];
    let filtered = items.slice();
    let activeId = null;

    const $ = (id) => document.getElementById(id);
    $("generatedAt").textContent = payload.generated_at || "-";
    $("retention").textContent = payload.retention_days ?? "-";
    $("cutoff").textContent = payload.cutoff_date || "-";
    $("count").textContent = String(payload.count ?? items.length);

    function levelClass(level) {
      const cn = levelLabels[level] || level || "";
      if (level === "Critical" || cn === "严重") return "crit";
      if (level === "High" || cn === "高危") return "high";
      return "other";
    }
    function levelText(level) {
      return levelLabels[level] || level || "-";
    }
    function esc(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }
    function scoreText(v) {
      if (v === null || v === undefined || v === "" || v === -1) return "-";
      return String(v);
    }

    function renderList() {
      const list = $("list");
      $("listCount").textContent = String(filtered.length);
      if (!filtered.length) {
        list.innerHTML = '<div class="empty">没有匹配项</div>';
        return;
      }
      list.innerHTML = filtered.map((it) => {
        const id = it.mps_id || it.cve_id;
        const active = id === activeId ? " active" : "";
        return `
          <button class="item${active}" data-id="${esc(id)}" type="button">
            <div class="item-top">
              <span class="cve">${esc(it.cve_id || it.mps_id || "-")}</span>
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
            </div>
            <div class="title">${esc(it.title || "-")}</div>
            <div class="item-foot">
              <span>CVSS ${esc(scoreText(it.cvss_score))}</span>
              <span>${esc(it.published_time || "-")}</span>
              ${it.poc ? "<span>POC</span>" : ""}
            </div>
          </button>`;
      }).join("");
      list.querySelectorAll(".item").forEach((btn) => {
        btn.addEventListener("click", () => selectById(btn.dataset.id));
      });
    }

    function refsHtml(it) {
      const refs = Array.isArray(it.reference_url_list) ? it.reference_url_list : [];
      const links = [];
      if (it._source_page) links.push({ url: it._source_page, name: "OSCS 详情" });
      if (it.cve_id) links.push({ url: `https://nvd.nist.gov/vuln/detail/${it.cve_id}`, name: "NVD" });
      refs.forEach((r) => {
        if (r && r.url) links.push({ url: r.url, name: r.name || r.url });
      });
      const seen = new Set();
      const uniq = [];
      for (const l of links) {
        if (seen.has(l.url)) continue;
        seen.add(l.url);
        uniq.push(l);
      }
      if (!uniq.length) return '<div class="box">无参考链接</div>';
      return `<div class="refs">${uniq.map((l) =>
        `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name || l.url)}</a>`
      ).join("")}</div>`;
    }

    function articlesHtml(it) {
      const arts = Array.isArray(it.articles) ? it.articles : [];
      if (!arts.length) return "";
      return `<div class="section"><h3>相关说明</h3>${arts.map((a) => `
        <div class="article">
          <h4>${esc(a.title || "说明")}</h4>
          <p>${esc(a.content || "")}</p>
        </div>`).join("")}</div>`;
    }

    function renderDetail(it) {
      const detail = $("detail");
      if (!it) {
        detail.innerHTML = '<div class="empty">暂无数据</div>';
        return;
      }
      const pocUrls = Array.isArray(it.poc_url) ? it.poc_url : [];
      detail.innerHTML = `
        <div class="d-head">
          <div>
            <h1 class="d-title">${esc(it.title || "-")}</h1>
            <div class="ids">
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
              <span class="chip">${esc(it.cve_id || "无 CVE")}</span>
              <span class="chip">${esc(it.mps_id || "-")}</span>
              ${it.poc ? '<span class="chip">有 POC</span>' : ""}
              ${it.exp ? '<span class="chip">有 EXP</span>' : ""}
            </div>
          </div>
          <div class="actions">
            ${it._source_page ? `<a class="btn" href="${esc(it._source_page)}" target="_blank" rel="noopener">OSCS</a>` : ""}
            ${it.cve_id ? `<a class="btn" href="https://nvd.nist.gov/vuln/detail/${esc(it.cve_id)}" target="_blank" rel="noopener">NVD</a>` : ""}
          </div>
        </div>
        <div class="grid">
          <div class="stat"><div class="k">CVSS</div><div class="v">${esc(scoreText(it.cvss_score))}</div></div>
          <div class="stat"><div class="k">向量</div><div class="v">${esc(it.cvss_vector || "-")}</div></div>
          <div class="stat"><div class="k">CWE</div><div class="v">${esc(it.cwe || "-")}</div></div>
          <div class="stat"><div class="k">类型</div><div class="v">${esc(it.kind || it.kind_en || "-")}</div></div>
          <div class="stat"><div class="k">公开</div><div class="v">${esc(it.published_time || "-")}</div></div>
          <div class="stat"><div class="k">利用成本</div><div class="v">${esc(it.exploit_requirement_cost || "-")}</div></div>
          <div class="stat"><div class="k">可利用性</div><div class="v">${esc(it.exploitability || "-")}</div></div>
          <div class="stat"><div class="k">修复建议</div><div class="v">${esc(it.fix_suggestion || "-")}</div></div>
        </div>
        <div class="section"><h3>描述</h3><div class="box">${esc(it.description || "无描述")}</div></div>
        ${it.scope_influence ? `<div class="section"><h3>影响范围</h3><div class="box">${esc(it.scope_influence)}</div></div>` : ""}
        ${pocUrls.length ? `<div class="section"><h3>POC 链接</h3><div class="refs">${pocUrls.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join("")}</div></div>` : ""}
        <div class="section"><h3>参考链接</h3>${refsHtml(it)}</div>
        ${articlesHtml(it)}
      `;
    }

    function selectById(id) {
      const it = filtered.find((x) => (x.mps_id || x.cve_id) === id) ||
                 items.find((x) => (x.mps_id || x.cve_id) === id);
      if (!it) return;
      activeId = it.mps_id || it.cve_id;
      renderList();
      renderDetail(it);
      const btn = document.querySelector(`.item[data-id="${CSS.escape(activeId)}"]`);
      if (btn) btn.scrollIntoView({ block: "nearest" });
      history.replaceState(null, "", "#" + encodeURIComponent(activeId));
    }

    function applyFilter(q) {
      const query = (q || "").trim().toLowerCase();
      filtered = !query ? items.slice() : items.filter((it) => {
        const blob = [
          it.cve_id, it.mps_id, it.title, it.kind, it.kind_en, it.cwe, it.description, it.level
        ].map((x) => String(x || "").toLowerCase()).join(" ");
        return blob.includes(query);
      });
      renderList();
      if (filtered.length) {
        const still = filtered.some((x) => (x.mps_id || x.cve_id) === activeId);
        selectById(still ? activeId : (filtered[0].mps_id || filtered[0].cve_id));
      } else {
        activeId = null;
        renderDetail(null);
      }
    }

    $("search").addEventListener("input", (e) => applyFilter(e.target.value));

    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement !== $("search")) {
        e.preventDefault();
        $("search").focus();
        return;
      }
      if (!filtered.length) return;
      const idx = filtered.findIndex((x) => (x.mps_id || x.cve_id) === activeId);
      if (e.key === "ArrowDown") {
        e.preventDefault();
        const next = filtered[Math.min(filtered.length - 1, Math.max(0, idx) + 1)];
        selectById(next.mps_id || next.cve_id);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        const prev = filtered[Math.max(0, idx - 1)];
        selectById(prev.mps_id || prev.cve_id);
      }
    });

    const hashId = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    if (hashId && items.some((x) => (x.mps_id || x.cve_id) === hashId)) {
      activeId = hashId;
      renderList();
      selectById(hashId);
    } else if (items.length) {
      selectById(items[0].mps_id || items[0].cve_id);
    } else {
      renderList();
      renderDetail(null);
    }
  </script>
</body>
</html>
