      color: var(--muted);

    .meta b { color: var(--text); font-weight: 500; }

      grid-template-columns: minmax(280px, 360px) 1fr;
      gap: 16px;
      min-height: 70vh;
    }

      padding: 12px;
      background: transparent;

ontent": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-123274", "cvss": {}, "cvss_score": 9.8, "cvss_vector": "", "cwe": "CWE-787", "description": "Apache DataSketches C++ 是 Apache 软件基金会开源的流式草图算法库，提供 KLL、Theta、HLL、REQ 等近似计算数据结构，支持草图以二进制图像序列化并在不同系统与语言间交换。\n受影响版本中，kll_sketch 的 deserialize() 从序列化图像读取 levels 层级边界数组时未做任何校验，攻击者构造的图像可携带超出 items 缓冲区容量或递减的层级边界，使层级偏移越过缓冲区，后续基于 levels 数组的更新与合并操作按这些偏移写入堆内存，造成堆越界写入与内存损坏；bytes 重载在读取 levels 数组前也未检查输入剩余长度，可进一步触发越界读取。\n修复版本中通过在 deserialize() 解析流程中新增 check_k、check_num_levels 与 check_levels 校验，要求 k 不小于 MIN_K、层级数大于 0、levels 数组单调不减且末项固定为容量，并在 bytes 重载读取 levels 数组前调用 ensure_minimum_memory 检查输入剩余长度，非法图像在解析阶段即被拒绝，切断堆越界写入链路。", "effects": [{"comp_name": "datasketches-cpp", "ecosystem": "linux", "versions": [{"affected_version": "[2.0.0-incubating,5.3.1)", "min_fixed_version": "5.3.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-11-13", "level": "Critical", "mps_id": "MPS-17a2-5baa", "poc": false, "poc_url": [], "published_time": "2026-11-13", "reference_url_list": [{"url": "http://www.mail-archive.com/announce@apache.org/msg12674.html", "name": "" ,7.3.2-86009-5)", "min_fixed_version": "7.3.2-86009-5", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[7.2.1-69057,7.2.1-69057-13)", "min_fixed_version": "7.2.1-69057-13", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[7.4.1-90080,7.4.1-90080-1)", "min_fixed_version": "7.4.1-90080-1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "使用候选路径或通道进行的认证绕过", "kind_en": "使用备用路径或通道绕过身份验证", "last_modified_time": "2026-11-12", "level": "High", "mps_id": "MPS-5u6w-gjiv", "poc": false, "poc_url": [], "published_time": "2026-11-12", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-5u6w-gjiv", "name": "https://www.oscs1024.com/hd/MPS-5u6w-gjiv"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-85101", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-85101"}, {"url": "https://www.synology.com/en-global/security/advisory/Synology_SA_26_19", "name": "Synology-SA-26:19 DSM"}], "scope_influence": "", "tags": ["应用软件"], "title": "Synology DSM rsync认证绕过漏洞", "_translated": true, "_saved_at": "2026-11-12T09:05:56+00:00", "_first_saved_at": "2026-11-12T09:05:56+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-5u6w-gjiv"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-93404", "cvss": {}, "cvss_score": 8.6, "cvss_vector": "", "cwe": "CWE-89", "description": "rsyslog 是一款开源的 Linux 与 Unix 平台 syslog 日志采集和转发守护进程，omclickhouse 是其可选输出模块，用于将日志消息渲染为 INSERT 语句写入 ClickHouse 数据库，该模块默认不加载。\n受影响版本中，内置 INSERT 模板 StdClickHouseFmt 在 8.1901.0 中缺少 SQL 模式声明，后续版本改用 STDSQL 模式，该模式转义由 runtime/template.c 的 doEscape 函数实现，仅将字段中的单引号翻倍为两个单引号，不处理反斜杠；ClickHouse 对单引号字符串字面量内的反斜杠序列有自身转义解释，能够提交日志消息且消息被路由至该动作的攻击者可构造以反斜杠结尾的消息内容抵消模板拼接的收尾单引号，篡改发送至 ClickHouse 的 INSERT 语句，伪造存储的日志记录或以所配置 ClickHouse 账户权限执行表达式。\n修复版本中通过将 StdClickHouseFmt 的转义模式由 STDSQL 改为反斜杠感知的 SQL 模式，新增 OMSR_RQD_TPL_OPT_SQL_BACKSLASH 模板要求，并在 runtime/action.c 的 addAction 中强制该动作模板 optFormatEscape 为 SQL_ESCAPE 且拒绝 strgen 与 subtree 模板，保证写入 ClickHouse 的字段均经反斜杠感知转义，切断日志内容逃逸字符串字面量的路径；官方将修复版本标签定为 2026-11-11 daily stable，正式编号版本发布前需采用对应每日构建。", "effects": [{"comp_name": "rsyslog", "ecosystem": "linux", "versions": [{"affected_version": "[8.1901.0,2026-11-11-daily-stable)", "min_fixed_version": "2026-11-11-daily-stable", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-11-12", "level": "High", "mps_id": "MPS-eeb9-f228", "poc": false, "poc_url": [], "published_time": "2026-11-12", "reference_url_list": [{"url": "https://www.openwall.com/lists/oss-security/2026/11/11/26", "name": ""}, {"url": "https://www.openwall.com/lists/oss-security/2026/11/11/26/1", "name": ""}, {"url": "https://github.com/rsyslog/rsyslog/security/advisories/GHSA-8rx7-ww92-p4vr", "name": ""}, {"url": "https://github.com/rsyslog/rsyslog", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "rsyslog omclickhouse SQL注入", "_translated": true, "_saved_at": "2026-11-12T01:13:50+00:00", "_first_saved_at": "2026-11-12T01:13:50+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-eeb9-f228"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-101107", "cvss": {"cvssv3": [{"source": "vultures@jpcert.or.jp", "vector": "CVSS:3.0/AV:A/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8}], "cvssv4": [{"source": "vultures@jpcert.or.jp", "vector": "CVSS:4.0/AV:A/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:A/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-78", "description": "Air Terminal 6 是 SoftBank 株式会社提供的家用 Wi-Fi 路由器设备，通过内置 Web 管理控制台提供设备配置管理能力，产品固件未公开源码。\n受影响版本中，Web 管理控制台的处理流程存在 OS 命令注入缺陷（CWE-78），能够登录 Web 管理界面的用户提交的输入可进入设备系统命令执行流程，最终以 root 权限执行任意命令；厂商公告未披露具体涉及的功能入口与源码位置。\n修复版本中通过厂商于 2026 年 9 月发布的修复固件收紧相关处理，消除以 root 权限执行任意命令的风险；修复固件已在联网设备上自动下发，未联网设备恢复联网后会自动获取，公开资料未披露具体代码修改。", "effects": [{"comp_name": "air_terminal_6", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.01.80]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-11-12", "level": "High", "mps_id": "MPS-wfzp-31or", "poc": false, "poc_url": [], "published_time": "2026-11-12", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-wfzp-31or", "name": "https://www.oscs1024.com/hd/MPS-wfzp-31or"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-101107", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-101107"}, {"url": "https://jvn.jp/en/jp/JVN64740097/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "SoftBank Air Terminal 6命令注入漏洞", "_translated": true, "_saved_at": "2026-11-12T09:05:54+00:00", "_first_saved_at": "2026-11-12T09:05:54+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-wfzp-31or"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-89061", "cvss": {"cvssv31": [{"source": "psirt@lenovo.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}], "cvssv4": [{"source": "psirt@lenovo.com", "vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.5}]}, "cvss_score": 8.5, "cvss_vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-276", "description": "During an internal security asses tle": "如何预防反序列化"}], "cnvd_id": "", "cve_id": "CVE-2026-77882", "cvss": {"cvssv31": [{"source": "psirt@lenovo.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}], "cvssv4": [{"source": "psirt@lenovo.com", "vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.5}]}, "cvss_score": 8.5, "cvss_vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-502", "description": "A deserialization of untrusted data vulnerability was discovered in Lenovo System Update that could allow a local authenticated user to execute code with elevated privileges.", "effects": [{"comp_name": "system_update", "ecosystem": "linux", "versions": [{"affected_version": "[0,5.08.03.59]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "反序列化", "kind_en": "不可信数据的反序列化", "last_modified_time": "2026-11-12", "level": "High", "mps_id": "MPS-sq5t-8eod", "poc": false, "poc_url": [], "published_time": "2026-11-12", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-sq5t-8eod", "name": "https://www.oscs1024.com/hd/MPS-sq5t-8eod"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-77882", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-77882"}, {"url": "https://support.lenovo.com/us/en/product_security/LEN-232748", "name": ""}, {"url": "https://support.lenovo.com/us/en/downloads/ds012808", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "CVE-2026-77882漏洞", "_translated": true, "_saved_at": "2026-11-13T04:37:58+00:00", "_first_saved_at": "2026-11-11T18:17:03+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-sq5t-8eod"}, {"analysis_status": 3, "articles": [{"content": "由于整数类型的有限范围，在进行算术运算或操作时，结果可能超出类型的表示范围，导致溢出或环绕。溢出指的是结果超过了类型的最大值或小于了最小值，而环绕指的是结果绕回到类型的最小值或最大值。", "title": "什么是整数溢出或环绕"}, {"content": "- 缓冲区溢出：整数溢出可能导致缓冲区溢出漏洞。当整数溢出导致分配的缓冲区大小不足以容纳结果时，攻击者可以利用这个漏洞覆盖相邻的内存区域，执行恶意代码或篡改程序的状态。\r\n- 身份验证绕过：在进行身份验证或访问控制时，整数溢出可能导致绕过验证的漏洞。攻击者可以构造特殊的输入，使溢出的整数值绕过了预期的验证逻辑，从而获得未经授权的访问权限。\r\n- 数据篡改：整数溢出可能导致数据篡改漏洞。攻击者可以通过使整数溢出，修改计数器、索引或其他控制数据的值，导致程序在处理数据时发生错误或执行意外的操作。", "title": "整数溢出或环绕常见的攻击方式"}, {"content": "- 输入验证与限制：对用户输入的整数进行合理的验证和限制，确保其在允许的范围内。\r\n- 使用安全的整数操作函数：使用安全的整数操作函数，如`add_with_overflow()`、`sub_with_overflow()`、`mul_with_overflow()`等，这些函数会检查并处理溢出情况，确保计算结果在安全范围内。\r\n- 类型检查和转换：在进行整数运算或操作之前，进行类型检查和转换，确保操作数的类型和范围是合适的。\r\n- 强制性编码标准和最佳实践：制定强制性的编码标准和最佳实践，包括对整数运算和操作的规范和限制，以帮助程序员编写更可靠、安全的代码。\r\n- 静态代码分析和测试：使用静态代码分析工具和测试技术来检测和识别潜在的整数溢出问题。这些工具可以帮助发现代码中可能存在的溢出漏洞，并及时修复。", "title": "如何预防整数溢出或环绕"}], "cnvd_id": "", "cve_id": "CVE-2026-111760", "cvss": {"cvssv31": [{"source": "murphysec", "vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:R/S:C/C:H/I:H/A:H", "severity": "high", "base_score": 8}]}, "cvss_score": 8, "cvss_vector": "", "cwe": "CWE-190", "description": "Git 是广泛使用的开源分布式版本控制系统，为开发者工作机、构建服务器与代码托管平台提供代码版本管理与协作能力。\n受影响版本中，攻击者放入一条超长路径。Git 用较宽的整数 size_t 算出它有多长，记入索引的长度字段 ce_namelen 时只保留 32 位，记下的长度变成较小正数。这条路径的开头几个字符是 .git，后面还有很长一段。安全检查看的是带有后半段的整条路径，整条路径不是单独的名字 .git，检查通过。写到磁盘时，Git 只按记下的短长度保留开头几个字符，后半段被丢掉，文件名变成 .git。这条记录若是符号链接，子模块文件夹里的 .git 由路标小文件变成符号链接，指向攻击者准备的另一个目录。常见代码托管网站拒收这种超长路径，仓库要由攻击者自己提供，并且用户要做子模块递归克隆。Git 顺着这个 .git 进入该目录，把它当作子模块的仓库目录，可能执行里面的钩子。钩子是 Git 在克隆过程中自动调用的脚本，其中的命令以执行克隆的用户身份运行。命令跑在开发人员的电脑或持续集成任务里，攻击者能在这台机器上执行命令，并读取该用户能访问的代码和凭据。\n修复版本中通过在记入索引之前核对路径的真实长度。长度超过有符号整数的上限时，Git 拒绝这条路径，变短的长度不会被保存。安全检查和写到磁盘的文件名因此看到同一条路径，超长路径不会再被写成名叫 .git 的符号链接，克隆时也不会执行攻击者放在该目录里的钩子。索引路径还有长度上限 index.maxPathLen，默认 1073740799 字节。读取目录树和检出时也使用真实长度，避免在核对之前先被截短。", "effects": [{"comp_name": "enterprise_server", "ecosystem": "linux", "versions": [{ Bounty Report #4044249"}, {"url": "https://github.com/git/git/commit/b1313872cefef5704a0acff14b7c0869a9d5dc7c", "name": "Commit"}], "scope_influence": "小", "tags": ["poc", "应用软件"], "title": "Git 文本三方合并堆缓冲区溢出漏洞", "_translated": true, "_saved_at": "2026-11-12T09:05:51+00:00", "_first_saved_at": "2026-11-12T09:05:51+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-6gwm-2bq0"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-118597", "cvss": {"cvssv4": [{"source": "help@fluidattacks.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:H/UI:P/VC:H/VI:H/VA:N/SC:L/SI:L/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:H/UI:P/VC:H/VI:H/VA:N/SC:L/SI:L/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-79", "description": "Akaunting 是开源的免费自托管会计与发票管理软件，基于 PHP/Laravel 构建，面向中小企业提供记账、开票以及多公司与多用户权限管理能力。\n受影响版本中，内置 Manager 角色用户默认拥有 settings-invoice 读/写权限，可向 PATCH /{company_id}/settings/invoice 提交自定义付款期限字段 payment_terms，App\\Abstracts\\Http\\SettingController 的 update() 方法未对该字段做校验，直接以公司级设置 invoice.payment_terms 存储。Invoice 设置页将该存储值传入 PaymentTerm 组件，当值不属于预定义选项时 render() 方法将其写入 $value 并把选中项改为 custom，组件模板随后在第 123-129 行把 $value 直接拼接进 @interface 的 Alpine.js 事件处理表达式，Blade 的 HTML 转义无法阻止由标识符、点号、括号、逗号和数字组成的 JavaScript 表达式生效，同公司更高权限用户（含 Administrator）打开 Invoice 设置页时，浏览器在其已认证会话中执行攻击者控制的脚本。\n修复版本中通过官方建议的方式消除风险：不再将存储值拼接进 JavaScript 源码，改用 Laravel 的 @js()/Js::from 以数据形式输出，并将 invoice.payment_terms 校验为有界整数；截至 2026-11-12 官方尚未发布包含该修复的版本，3.3.1 与 master 分支仍保留相同拼接逻辑，官方修复发布前可改用预定义付款期限选项并限制 settings-invoice 更新权限。", "effects": [{"comp_name": "akaunting", "ecosystem": "linux", "versions": [{"affected_version": "[3.3.0,3.3.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-11-12", "level": "High", "mps_id": "MPS-luf3-iath", "poc": false, "poc_url": [], "published_time": "2026-11-12", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-luf3-iath", "name": "https://www.oscs1024.com/hd/MPS-luf3-iath"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-118597", "name": "https: ross-Site Scripting via the spriteCssClass Field in Kendo UI for jQuery", "_translated": true, "_saved_at": "2026-11-13T04:37:58+00:00", "_first_saved_at": "2026-11-11T18:17:19+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ot8a-jp54"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-124690", "cvss": {"cvssv31": [{"source": "security@progress.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:L", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_ hat.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-639", "description": "Foreman 是开源的服务器生命周期管理平台，用于物理与虚拟主机的自动化部署、配置与升级，也是 Red Hat Satellite 6 的上游组件。\n受影响版本中，Api::V2::PersonalAccessTokensController 通过 Foreman::Controller::UserAware 注册的 before_action :find_user 解析目标用户，editing_self? 为假时直接执行 User.find(params[:user_id])，缺少父用户授权检查；持有 create_personal_access_tokens 权限的调用者向 POST /api/v2/users/:user_id/personal_access_tokens 传入他人用户 ID，能够为任意目标用户创建个人访问令牌，PersonalAccessToken#check_permissions_after_save 仅回查令牌资源上的 create_personal_access_tokens 权限，未对目标用户执行 edit_users 授权，接口随后在响应中返回令牌明文，攻击者可使用该令牌以受害者身份通过 API 认证，导致包括管理员在内的账号接管。\n修复版本中通过在 Foreman::Controller::UserAware 引入 find_authorized_user(permission) 方法收紧目标用户解析，编辑自身时返回 User.current，否则改为 User.authorized(permission).except_hidden.find_by(:id =\u003e params[:user_id]) 在调用者授权范围内查找；Api::V2::PersonalAccessTokensController#create 在创建令牌前调用 find_authorized_user(:edit_users)，目标用户不在授权范围时直接返回 not_found 且不再生成令牌，切断了为无权编辑用户创建令牌并冒用其身份的越权链路。", "effects": [{"comp_name": "foreman", "ecosystem": "linux", "versions": [{"affected_version": "[1.17.0,5.0.1]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "通过用户控制密钥绕过授权机制", "kind_en": "通过用户控制的密钥绕过授权", "last_modified_time": "2026-11-13", "level": "High", "mps_id": "MPS-d5o9-hqfs", "poc": false, "poc_url": [], "published_time": "2026-11-13", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-d5o9-hqfs", "name": "https://www.oscs1024.com/hd/MPS-d5o9-hqfs"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-86322", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-86322"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-86322", "name": ""}, {"url": "ht 器与安全接入网关，广泛用于负载均衡、SSL VPN、身份认证与流量安全防护。\n受影响版本中，设备对 WebAuth authentication 认证流程的处理存在内存越界缺陷（CWE-122，堆缓冲区溢出），配置了 WebAuth action（add authentication webAuthAction）的 NetScaler ADC 或 NetScaler Gateway 在处理相关认证流量时可能向缓冲区边界外写入内存，远程攻击者无需身份认证，通过网络请求可触发该缺陷，导致设备出现不可预测或错误行为，严重时造成拒绝服务。\n修复版本中通过更新设备固件修复 WebAuth 认证处理中的越界内存访问，切断远程触发的堆缓冲区溢出路径，Citrix 已在 NetScaler ADC 和 NetScaler Gateway 14.1-73.57、13.1-64.39，NetScaler ADC FIPS 14.1-73.58 FIPS，以及 NetScaler ADC FIPS 和 NDcPP 13.1-37.293 及以上构建中完成修复，官方建议受影响用户尽快升级。", "effects": [{"comp_name": "netscaler_adc", "ecosystem": "linux", "versions": [{"affected_version": "[13.1,13.1-64.39)", "min_fixed_version": "13.1-64.39", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[14.1,14.1-73.57)", "min_fixed_version": "14.1-73.57", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "netscaler_adc_fips", "ecosystem": "linux", "versions": [{"affected_version": "[13.1,13.1-37.293)", "min_fixed_version": "13.1-37.293", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[14.1,14.1-73.58)", "min_fixed_version": "14.1-73.58", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "netscaler_adc_ndcpp", "ecosystem": "linux", "versions": [{"affected_version": "[13.1,13.1-37.293)", "min_fixed_version": "13.1-37.293", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "netscaler_gateway", "ecosystem": "linux", "versions": [{"affected_version": "[14.1,14.1-73.57)", "min_fixed_version": "14.1-73.57", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[13.1,13.1-64.39)", "min_fixed_version": "13.1-64.39", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "堆缓冲区溢出", "kind_en": "基于堆的缓冲区溢出", "last_modified_time": "2026-11-13", "level": "High", "mps_id": "MPS-d25x-usaz", "poc": false, "poc_url": [], "published_time": "2026-11-13", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-d25x-usaz", "name": "https://www.oscs1024.com/hd/MPS-d25x-usaz"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-107414", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-107414"}, {"url": "https://support.citrix.com/support-home/kbsearch/article?articleNumber=CTX697305", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "NetScaler WebAuth认证堆溢出漏洞", "_translated": true, "_saved_at": "2026-11-13T04:37:53+00:00", "_first_saved_at": "2026-11-13T04:37:53+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-d25x-usaz"}, {"analysis_status": 0, "articles": [{"content": "在程序试图读取、写入或复制内存缓冲区时，未对边界进行适当的检查和限制。缓冲区是用于存储数据的一块内存区域，当程序试图在缓冲区之外的位置进行操作时，就可能导致缓冲区溢出或下溢。攻击者可以利用这个漏洞来修改程序的执行流、执行任意代码或导致拒绝服务等安全问题。", "title": "什么是缓冲区溢出"}, {"content": "- 缓冲区溢出攻击：攻击者向输入缓冲区中注入超过其容量的数据，导致数据溢出到相邻的内存区域，可能覆盖关键数据、修改变量值或执行恶意代码。\n- 缓冲区下溢攻击：攻击者向输入缓冲区中注入少于其容量的数据，导致数据被读取时越过缓冲区边界，可能泄露敏感信息或破坏程序的正常执行流程。\n- 字符串格式化攻击：攻击者通过控制格式化字符串的输入，可以读取或写入任意内存位置，从而执行恶意操作。", "title": "缓冲区溢出常见的攻击方式"}, {"content": "- 输入验证和边界检查：对于所有接受用户输入的缓冲区操作，确保验证输入数据的长度和内容，以避免缓冲区溢出或下溢。\n- 使用安全的字符串操作函数：使用安全的字符串操作函数（如strncpy、strncat）替代不安全的函数（如strcpy、strcat），这些函数会在操作时自动限制操作的边界。\n- 使用内存安全工具：使用内存安全工具（如内存分析器、静态分析工具）来检测和修复潜在的缓冲区溢出问题。\n- 采用安全编码实践：遵循安全编码实践，如最小特权原则、避免使用不受信任的输入等。\n- 定期更新和修补程序：及时应用程序厂商提供的安全更新和补丁，以修复已知的缓冲区溢出漏洞。\n- 使用编程语言和框架提供的安全功能：利用编程语言和框架提供的安全特性，如内存安全函数、边界检查等。", "title": "如何预防缓冲区溢出"}], "cnvd_id": "", "cve_id": "CVE-2026-107411", "cvss": {"cvssv4": [{"source": "50a63c94-1ea7-4568-8c11-eb79e7c5a2b5", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-119", "description": "Citrix NetScaler ADC 与 Citrix NetScaler Gateway 是 Cloud Software Group 旗下的闭源应用交付与安全接入设备，用于负载均衡、大尺度 NAT（LSN）、网关与远程接入等场景。\n受影响版本中，设备的 RTSP ALG（实时流协议应用层网关）处理逻辑存在内存溢出缺陷（CWE-119），当设备配置了 RTSP 类型的 LB 虚拟服务器（add lb vserver \u003cn\u003e RTSP \u003cVIP\u003e 554）或在 LSN 组上启用 RTSP ALG（add lsn group \u003cgroup\u003e -clientname \u003cclient\u003e -rtspalg ENABLED）时，远程攻击者无需认证可直接向 RTSP 流量路径发送数据触发越界内存访问，导致设备行为异常或拒绝服务，官方 CVSS v4.0 基础评分为 8.7，主要影响可用性。\n修复版本中通过升级至 14.1-73.57、13.1-64.39、14.1-73.58 FIPS 或 13.1-37.293 及之后版本，Citrix 修复了 RTSP ALG 处理逻辑中的内存溢出缺陷，消除了上述配置路径下的越界内存访问与拒绝服务风险。", "effects": [{"comp_name": "netscaler_adc", "ecosystem": "linux", "versions": [{"affected_version": "[14.1,14.1-73.57)", "min_fixed_version": "14.1-73.57", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[13.1-FIPS/NDcPP,13.1-37.293)", "min_fixed_version": "13.1-37.293", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[13.1,13.1-64.39)", "min_fixed_version": "13.1-64.39", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[14.1-FIPS,14.1-73.58-FIPS)", "min_fixed_version": "14.1-73.58-FIPS", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "netscaler_gateway", "ecosystem": "linux", "versions": [{"affected_version": "[14.1,14.1-73.57)", "min_fixed_version": "14.1-73.57", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[13.1,13.1-64.39)", "min_fixed_version": "13.1-64.39", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "缓冲区溢出", "kind_en": "内存缓冲区范围内的操作限制不当", "last_modified_time": "2026-11-13", "level": "High", "mps_id": "MPS-l1u9-omtv", "poc": false, "poc_url": [], "publis cted_version": "[13.1,13.1-64.39)", "min_fixed_version": "13.1-64.39", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[14.1-FIPS,14.1-73.58-FIPS)", "min_fixed_version": "14.1-73.58-FIPS", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[13.1-FIPS/NDcPP,13.1-37.293)", "min_fixed_version": "13.1-37.293", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "citrix_netscaler_gateway", "ecosystem": "linux", "versions": [{"affected_version": "[14.1,14.1-73.57)", "min_fixed_version": "14.1-73.57", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[13.1,13.1-64.39)", "min_fixed_version": "13.1-64.39", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "堆缓冲区溢出", "kind_en": "基于堆的缓冲区溢出", "last_modified_time": "2026-11-13", "level": "High", "mps_id": "MPS-tf7i-3n6v", "poc": false, "poc_url": [], "published_time": "2026-11-13", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-tf7i-3n6v", "name": "https://www.oscs1024.com/hd/MPS-tf7i-3n6v"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-107413", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-107413"}, {"url": "https://support.citrix.com/support-home/kbsearch/article?articleNumber=CTX697305", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "NetScaler SAML认证堆溢出漏洞", "_translated": true, "_saved_at": "2026-11-13T04:37:57+00:00", "_first_saved_at": "2026-11-13T04:37:57+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-tf7i-3n6v"}, {"analysis_status": 0, "articles": [{"content": "应用程序在处理用户输入时的不完善或缺乏验证机制，所以攻击者能够通过向应用程序发送恶意输入，利用应用程序对输入数据的错误处理方式来注入自己的恶意代码。这些恶意代码会被应用程序误认为是合法的指令或数据，并在执行过程中被执行。", "title": "什么是代码注入"}, {"content": "应用程序使用可执行动态代码的函数来执行用户可控的参数，当应用程序对于用户输入过滤不完全时，攻击者可以注入恶意代码并控制代码执行流程。", "title": "代码注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对所有用户输入进行验证和过滤，确保只接受预期的有效输入。这包括对输入数据进行输入长度验证、类型检查和格式验证等。\r\n- 使用参数化查询或预编译语句：对于数据库查询操作，应该使用参数化查询或预编译语句，确保输入数据不会被误认为是执行代码。\r\n- 最小特权原则：应用程序在执行操作系统命令或动态代码时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。\r\n- 安全编码实践：开发人员应该采用安全编码实践，包括避免使用eval函数、避免拼接用户输入的字符串作为代码执行等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止代码注入攻击。", "title": "如何预防代码注入"}], "cnvd_id": "", "cve_id": "CVE-2026-127208", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:A/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:A/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-94", "description": "datamodel-code-generator 是一个开源 Python 代码生成工具，可从 JSON Schema、OpenAPI、GraphQL 等输入生成 Pydantic 模型、dataclasses、TypedDict 等数据模型代码，通过 PyPI 分发，常用于后端接口建模与 CI/CD 代码生成流水线。\n受影响版本中，JSON Schema 扩展字段 x-python-type 的外部文本经 parse_python_type_annotation 解析，_python_type_expr_from_ast 的 Subscript 分支对所有下标参数固定传入 allow_literal=True 且未校验下标基类型，而字面值类型集合 _LITERAL_VALUE_TYPES 包含 str 与 bytes，形如 list[\"...\"]、Optional[\"...\"]、dict[str, \"...\"] 中的字符串常量被当作 PythonTypeLiteralValue 接受，并按带引号前向引用的形式写入生成的模型代码；生成代码在 Pydantic v2 环境中被导入或触发 model_rebuild() 时，前向引用经 eval() 求值，攻击者嵌入的 __import__ 等表达式被执行，开发者本机、CI/CD 流水线以及运行时生成并加载模型的应用面临任意代码执行风险。\n修复版本中通过在 _python_type_expr_from_ast 中新增 _is_literal_base 基类型判定并引入 allow_string_literal 标志，字符串与字节常量仅在 Literal[...] 参数位置被接受，其余下标位置抛出 _InvalidPythonTypeAnnotationError，代码生成阶段直接拒绝恶意注解，切断带引号前向引用注入与 eval() 求值链路。", "effects": [{"comp_name": "datamodel-code-generator", "ecosystem": "pip", "versions" ", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-426", "description": "AWS Advanced Go Wrapper 是 AWS 开源的 Go 语言数据库驱动包装器（Apache-2.0 许可），以 database/sql 驱动形式包装 pgx、go-sql-driver/mysql 等底层驱动，用于连接 Amazon RDS 与 Amazon Aurora 集群，并在建立连接时自动探测数据库方言，以启用故障转移、读写分离等插件功能。\n受影响版本中，wrapper 在每次建立初始连接后自动执行方言探测，GlobalAuroraPgDatabaseDialect.IsDialect 向集群发送 SELECT count(1) FROM pg_catalog.aurora_global_db_status()，其中聚合函数 count 未限定到 pg_catalog 模式，PostgreSQL 按会话 search_path 解析该标识符；对受害用户 search_path 中的 schema（如 public）持有 CREATE 权限的已认证数据库用户可创建同名 count 函数覆盖内置实现，当受害用户（包括 rds_superuser 角色成员）通过受影响版本 wrapper 连接 Aurora PostgreSQL 集群时，方言探测改为执行攻击者定义的函数，攻击者代码以受害用户权限运行，权限最高可提升至 rds_superuser；v2.0.0 中同一条查询的表函数 aurora_global_db_status() 同样未限定，2026-05-15 合并的 CVE-2026-11401 修复在 v2.0.1 中限定了表函数与比较操作符，但遗留 count(1) 未限定，构成不完整修复。\n修复版本中通过 release-2026-07-29（awssql/v2 v2.0.3）包含的提交 0ec76a0 将探测查询重写为 SELECT pg_catalog.count(1) FROM pg_catalog.aurora_global_db_status()，并将 pg_database_dialects.go 中剩余的 LIKE 操作符、::regproc 类型转换与等号比较全部限定到 pg_catalog，使方言探测查询的函数、操作符与类型名称解析不再经过用户 search_path，攻击者植入 schema 的同名对象无法再被选中，提权链路被切断。", "effects": [{"comp_name": "aws-advanced-go-wrapper", "ecosystem": "linux", "versions": [{"affected_version": "[2026-04-06,2026-07-29)", "min_fixed_version": "2026-07-29", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "github.com/aws/aws-advanced-go-wrapper/awssql/v2", "ecosystem": "go", "versions": [{"affected_version": "[2.0.0,2.0.3)", "min_fixed_version": "2.0.3", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "不可信的搜索路径", "kind_en": "不受信任的搜索路径", "last_modified_time": "2026-11-13", "level": "High", "mps_id": "MPS-dj1l-fot3", "poc": false, "poc_url": [], "published_time": "2026-11-13", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-dj1l-fot3", "name": "https://www.oscs1024.com/hd/MPS-dj1l-fot3"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-126793", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-126793"}, {"url": "https://github.com/aws/aws-advanced-go-wrapper/releases/tag/release-2026-07-29", "name": ""}, {"url": "https://aws.amazon.com/security/security-bulletins/2026-182-aws/", "name": ""}, {"url": "https://github.com/aws/aws-advanced-go-wrapper/security/advisories/GHSA-fhr2-6r5v-gm9f", "name": ""}], "scope_influence": "", "tags": ["go", "应用软件"], "title": "AWS Go Wrapper 方言探测提权", "_translated": true, "_saved_at": "2026-11-12T23:04:46+00:00", "_first_saved_at": "2026-11-12T23:04:46+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-dj1l-fot3"}, {"analysis_status": 0, "articles": [{"content": "- 编写代码时没有正确处理输入数据或没有正确验证用户输入而导致的。", "title": "什么是关键资源权限分配不当"}, {"content": "- 弱密码或未使用的密码：当管理员或系统管理员在创建帐户时，没有使用强密码或未对帐户进行密码更新时，可能会发生这种情况。弱密码可能会被黑客破解或通过其他方式轻松访问系统。\n- 未正确配置权限：在系统中，不同的资源通常需要不同的权限才能访问。如果管理员未正确配置权限，那么未经授权的用户可能会通过欺骗系统或利用其他漏洞来访问关键资源。\n- 权限重用：在某些情况下，管理员可能会将某些权限分配给某个用户，但这些权限并未被正确地限制或授权给该用户。如果其他用户尝试使用这些权限访问关键资源，那么他们可能会获得未经授权的访问权限。\n- 未正确验证用户输入：当开发人员没有正确验证用户输入时，可能会发生这种情况。例如，如果开发人员未正确过滤用户输入的用户名或密码，那么黑客可能会利用这些信息轻松地访问系统。\n", "title": "关键资源权限分配不当常见的攻击方式"}, {"content": "- 使用强密码：管理员应该使用强密码来保护系统，并定期更改密码。强密码应该包括数字、字母和符号，并且应该不同于其他帐户使用的密码。\n- 正确配置权限：管理员应该正确配置系统中不同资源所需的权限。用户可以被授予访问特定资源的权限，但不应该被授予访问其他资源的权限。\n- 权限限制：管理员应该使用权限限制来限制用户对特定资源的访问。例如，用户可以被授予访问特定文件夹的权限，但不能访问其他文件夹。\n- 输入验证：开发人员应该正确验证用户输入。例如，他们可以过滤用户输入的用户名和密码，以确保它们符合预期的格式。\n- 安全培训：管理员和用户应该接受安全培训，以便了解如何识别和避免常见的安全漏洞，例如不正确权限授予漏洞。\n- 定期更新和修补软件：系统软件和应用程序应该定期更新和修补，以确保它们不受最新安全漏洞的影响。", "title": "如何预防关键资源权限分配不当"}], "cnvd_id": "", "cve_id": "CVE-2026-82977", "cvss": {"cvssv4": [{"source": "support@hackerone.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:H/SI:L/SA:L/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.4}]}, "cvss_score": 8.4, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:H/SI:L/SA:L/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-732", "description": "Plesk Obsidian 是 WebPros 旗下闭源的商业服务器托管管理面板，用于 Linux 与 Windows 服务器上的站点、订阅与运维管理；GoAccess 统计集成自 18.0.77 起成为 Plesk for Linux 默认的网页统计工具，基于站点访问日志生成流量报表。\n受影响版本中，Plesk for Linux 的 GoAccess 网页统计功能对统计数据的访问权限控制不正确（CWE-732），在同一服务器上持有订阅账户的攻击者可以越权访问其他订阅站点的网页统计报表，泄露内容包括带查询字符串的完整请求 URL、访问者 IP 地址与来源页面，请求 URL 中携带的令牌等敏感值随之跨订阅暴露。\n修复版本中通过厂商安全更新收紧了网页统计数据的访问权限控制，消除了跨订阅越权读取路径，18.0.81.8、18.0.82.3 及之后版本不再受该问题影响；厂商同时建议对可能已在请求 URL 中暴露的令牌与密钥进行轮换。", "effects": [{"comp_name": "plesk_obsidian", "ecosystem": "linux", "versions": [{"affected_version": "[18.0.77,18.0.81.8)", "min_fixed_version": "18.0.81.8", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[18.0.82,18.0.82.3)", "min_fixed_version": "18.0.82.3", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "关键资源权限分配不当", "kind_en": "关键资源的权限分配不正确", "last_modified_time": "2026-11-13", "level": "High", "mps_id": "MPS-pkgq-406e", "poc": false, "poc_url": [], "published_time": "2026-11-13", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-pkgq-406e", "name": "https://www.oscs1024.com/hd/MPS-pkgq-406e"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-82977", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-82977"}, {"url": "https://support.plesk.com/hc/en-us/articles/44915912496535-Vulnerability-CVE-2026-82977-Information-disclosure-in-Plesk-for-Linux-web-statistics", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Plesk GoAccess跨订阅信息泄露漏洞", "_translated": true, "_saved_at": "2026-11-12T17:50:28+00:00", "_first_saved_at": "2026-11-12T17:50:28+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-pkgq-406e"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2026-110279", "cvss": {}, "cvss_score": 8.1, "cvss_vector": "", "cwe": "CWE-287", "description": "IBM ContextForge MCP Gateway 是 Apache-2.0 开源的 AI 网关，PyPI 包名为 mcp-contextforge-gateway，用来把 MCP、A2A 与 REST 请求统一转发到上游服务器，并可自行持有上游凭据，例如按用户存储的 OAuth 令牌、client_credentials 令牌，以及网关配置的 bearer、basic 或自定义认证头。\n受影响版本中，已认证用户经公开 RPC 入口 handle_rpc、SSE 入口 sse_endpoint、WebSocket 入口 websocket_endpoint 或 Streamable HTTP 处理函数 handle_streamable_http 把请求送进网关时，请求里的上游授权头 X-Upstream-Authorization 进入透传头构造函数 get_passthrough_headers 与缓存路径 compute_passthrough_headers_cached；这两处读到该头后无条件把它改名为 Authorization 写进发往上游的头，改名不依赖全局开关 ENABLE_HEADER_PASSTHROUGH。工具服务 invoke_tool 在 REST 与 A2A 路径上把网关认证类型 gateway_auth_type 传成 None，缓存路径无法识别 oauth、bearer、basic、authheaders 已存凭据，调用者即可用自己的令牌替换网关代管的上游凭据，审计只记下调用者身份，上游却以另一套凭据执行，绕过按用户权限与审计归属。\n修复版本中通过增加网关代管认证类型集合 _GATEWAY_MANAGED_AUTH_TYPES，在 get_passthrough_headers 与 compute_passthrough_headers_cached 中对 oauth、bearer、basic、authheaders 丢弃 X-Upstream-Authorization 并记录告警，REST 与 A2A 调用改为传入真实的 tool_auth_type 与 a2a_agent_auth_type；token-exchange 仍保持拦截，none、未设置与 one_time_auth 仍允许改名。", "effects": [{"comp_name": "ibm_contextforge_mcp_gateway", "ecosystem": "linux", "versions": [{"affected_version": "[1.0.0,1.1.1)", "min_fixed_version": "1.1.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "mcp-contextforge-gateway", "ecosystem": "pip", "versions": [{"affected_version": "[1.0.0,1.1.1)", "min_fixed_version": "1.1.1", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "身份验证不当", "kind_en": "认证不当", "last_modified_time": "2026-11-13", "level": "High", "mps_id": "MPS-3u0j-nhif", "poc": false, "poc_url": [], "published_time": "2026-11-13", "reference_url_list": [{"url": "https://www.ibm.com/support/pages/node/7296490", "name": ""}, {"url": "https://github.com/IBM/mcp-context-forge/commit/724b13eef5a98cfb6db3274a88e90def6288a1d1", "name": ""}], "scope_influence": "", "tags": ["AI"], "title": "ContextForge凭据覆盖漏洞", "_translated": true, "_saved_at": "2026-11-13T04:37:51+00:00", "_first_saved_at": "2026-11-13T04:37:51+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-3u0j-nhif"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-126191", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-1333", "description": "Soup Sieve is a CSS selector library designed to be used with Beautiful Soup 4. Prior to 3.0, the CSS_ESCAPES and IDENTIFIER regular-expression subpatterns can backtrack exponentially on runs of ambiguous digit escapes in an attribute-name or tag position of an otherwise valid selector. The failure occurs during selector compilation through soupsieve.compile() or Beautiful Soup select() before SELECTOR_LIMIT is applied, so an application that accepts untrusted selector strings can have a worker stalled by a short input. This issue is fixed in version 3.0.", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "ReDoS", "kind_en": "正则表达式复杂性低效", "last_modified_time": "2026-11-13", "level": "High", "mps_id": "MPS-487m-ypl5", "poc": false, "poc_url": [], "published_time": "2026-11-13", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-487m-ypl5", "name": "https://www.oscs1024.com/hd/MPS-487m-ypl5"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-126191", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-126191"}, {"url": "https://github.com/facelessuser/soupsieve/commit/dbfa2854ff31a863326bd6660d4e55c6f068db9e", "name": ""}, {"url": "https://github.com/facelessuser/soupsieve/pull/300", "name": ""}, {"url": "https://github.com/facelessuser/soupsieve/releases/tag/3.0", "name": ""}, {"url": "https://github.com/facelessuser/soupsieve/security/advisories/GHSA-6655-6qjp-jx7x", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-126191 漏洞", "_translated": true, "_saved_at": "2026-11-13T04:37:58+00:00", "_first_saved_at": "2026-11-12T17:50:34+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-487m-ypl5"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-127029", "cvss": {"cvssv31": [{"source": "secalert@redhat.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-787", "description": "FreeRADIUS 是开源的 RADIUS 认证与计费服务器，其 rlm_eap 模块在 eap 模块配置中显式添加 sim 配置块后支持 EAP-SIM 方案，用于基于 SIM 卡的移动网络用户认证。\n受影响版本中，EAP-SIM 处理流程将客户端提交的身份标识以未校验长度的方式复制进内部密钥派生结构 eapsim_keys 的 identity[MAX_STRING_LEN] 固定数组，随后 eapsim_calculate_keys 在派生会话密钥时把该身份连同 Kc、nonce_mt、versionlist 等字段打包进 256 字节的栈缓冲区 buf，身份长度超出限制时写入越过缓冲区末尾，未认证的远程客户端通过发送包含超长身份的 EAP-SIM 报文可触发栈缓冲区溢出，导致 radiusd 进程崩溃、认证服务中断。\n修复版本中通过将 identity 字段改为按实际长度分配的指针并仅在长度合法时保存身份，同时 eapsim_calculate_keys 改为在遍历各输入时逐段计算 SHA1、不再把数据预先打包进固定栈缓冲区，使密钥派生流程不再受身份长度影响，消除越界写入并恢复服务稳定性。", "effects": [{"comp_name": "freeradius", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,3.2.10]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-11-13", "level": "High", "mps_id": "MPS-ayqs-drev", "poc": false, "poc_url": [], "published_time": "2026-11-13", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ayqs-drev", "name": "https://www.oscs1024.com/hd/MPS-ayqs-drev"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-127029", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-127029"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-127029", "name": ""}, {"url": "https://bugzilla.redhat.com/show_bug.cg ": "ContextForge身份信息泄露漏洞", "_translated": true, "_saved_at": "2026-11-13T04:37:58+00:00", "_first_saved_at": "2026-11-13T04:37:58+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-jw68-q13x"}]}</script>
  <script>
    const payload = JSON.parse(document.getElementById("payload").textContent);
    const levelLabels = payload.level_labels || {};
    const items = payload.items || [];
    let filtered = items.slice();
    let activeId = null;

    const $ = (id) => document.getElementById(id);
    $("generatedAt").textContent = payload.generated_at || "-";
    $("retention").textContent = payload.retention_days ?? "-";
    $("cutoff").textContent = payload.cutoff_date || "-";
    $("count").textContent = String(payload.count ?? items.length);

    function levelClass(level) {
      const cn = levelLabels[level] || level || "";
      if (level === "Critical" || cn === "严重") return "crit";
      if (level === "High" || cn === "高危") return "high";
      return "other";
    }
    function levelText(level) {
      return levelLabels[level] || level || "-";
    }
    function esc(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }
    function scoreText(v) {
      if (v === null || v === undefined || v === "" || v === -1) return "-";
      return String(v);
    }

    function renderList() {
      const list = $("list");
      $("listCount").textContent = String(filtered.length);
      if (!filtered.length) {
        list.innerHTML = '<div class="empty">没有匹配项</div>';
        return;
      }
      list.innerHTML = filtered.map((it) => {
        const id = it.mps_id || it.cve_id;
        const active = id === activeId ? " active" : "";
        return `
          <button class="item${active}" data-id="${esc(id)}" type="button">
            <div class="item-top">
              <span class="cve">${esc(it.cve_id || it.mps_id || "-")}</span>
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
            </div>
            <div class="title">${esc(it.title || "-")}</div>
            <div class="item-foot">
              <span>CVSS ${esc(scoreText(it.cvss_score))}</span>
              <span>${esc(it.published_time || "-")}</span>
              ${it.poc ? "<span>POC</span>" : ""}
            </div>
          </button>`;
      }).join("");
      list.querySelectorAll(".item").forEach((btn) => {
        btn.addEventListener("click", () => selectById(btn.dataset.id));
      });
    }

    function refsHtml(it) {
      const refs = Array.isArray(it.reference_url_list) ? it.reference_url_list : [];
      const links = [];
      if (it._source_page) links.push({ url: it._source_page, name: "OSCS 详情" });
      if (it.cve_id) links.push({ url: `https://nvd.nist.gov/vuln/detail/${it.cve_id}`, name: "NVD" });
      refs.forEach((r) => {
        if (r && r.url) links.push({ url: r.url, name: r.name || r.url });
      });
      const seen = new Set();
      const uniq = [];
      for (const l of links) {
        if (seen.has(l.url)) continue;
        seen.add(l.url);
        uniq.push(l);
      }
      if (!uniq.length) return '<div class="box">无参考链接</div>';
      return `<div class="refs">${uniq.map((l) =>
        `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name || l.url)}</a>`
      ).join("")}</div>`;
    }

    function articlesHtml(it) {
      const arts = Array.isArray(it.articles) ? it.articles : [];
      if (!arts.length) return "";
      return `<div class="section"><h3>相关说明</h3>${arts.map((a) => `
        <div class="article">
          <h4>${esc(a.title || "说明")}</h4>
          <p>${esc(a.content || "")}</p>
        </div>`).join("")}</div>`;
    }

    function renderDetail(it) {
      const detail = $("detail");
      if (!it) {
        detail.innerHTML = '<div class="empty">暂无数据</div>';
        return;
      }
      const pocUrls = Array.isArray(it.poc_url) ? it.poc_url : [];
      detail.innerHTML = `
        <div class="d-head">
          <div>
            <h1 class="d-title">${esc(it.title || "-")}</h1>
            <div class="ids">
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
              <span class="chip">${esc(it.cve_id || "无 CVE")}</span>
              <span class="chip">${esc(it.mps_id || "-")}</span>
              ${it.poc ? '<span class="chip">有 POC</span>' : ""}
              ${it.exp ? '<span class="chip">有 EXP</span>' : ""}
            </div>
          </div>
          <div class="actions">
            ${it._source_page ? `<a class="btn" href="${esc(it._source_page)}" target="_blank" rel="noopener">OSCS</a>` : ""}
            ${it.cve_id ? `<a class="btn" href="https://nvd.nist.gov/vuln/detail/${esc(it.cve_id)}" target="_blank" rel="noopener">NVD</a>` : ""}
          </div>
        </div>
        <div class="grid">
          <div class="stat"><div class="k">CVSS</div><div class="v">${esc(scoreText(it.cvss_score))}</div></div>
          <div class="stat"><div class="k">向量</div><div class="v">${esc(it.cvss_vector || "-")}</div></div>
          <div class="stat"><div class="k">CWE</div><div class="v">${esc(it.cwe || "-")}</div></div>
          <div class="stat"><div class="k">类型</div><div class="v">${esc(it.kind || it.kind_en || "-")}</div></div>
          <div class="stat"><div class="k">公开</div><div class="v">${esc(it.published_time || "-")}</div></div>
          <div class="stat"><div class="k">利用成本</div><div class="v">${esc(it.exploit_requirement_cost || "-")}</div></div>
          <div class="stat"><div class="k">可利用性</div><div class="v">${esc(it.exploitability || "-")}</div></div>
          <div class="stat"><div class="k">修复建议</div><div class="v">${esc(it.fix_suggestion || "-")}</div></div>
        </div>
        <div class="section"><h3>描述</h3><div class="box">${esc(it.description || "无描述")}</div></div>
        ${it.scope_influence ? `<div class="section"><h3>影响范围</h3><div class="box">${esc(it.scope_influence)}</div></div>` : ""}
        ${pocUrls.length ? `<div class="section"><h3>POC 链接</h3><div class="refs">${pocUrls.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join("")}</div></div>` : ""}
        <div class="section"><h3>参考链接</h3>${refsHtml(it)}</div>
        ${articlesHtml(it)}
      `;
    }

    function selectById(id) {
      const it = filtered.find((x) => (x.mps_id || x.cve_id) === id) ||
                 items.find((x) => (x.mps_id || x.cve_id) === id);
      if (!it) return;
      activeId = it.mps_id || it.cve_id;
      renderList();
      renderDetail(it);
      const btn = document.querySelector(`.item[data-id="${CSS.escape(activeId)}"]`);
      if (btn) btn.scrollIntoView({ block: "nearest" });
      history.replaceState(null, "", "#" + encodeURIComponent(activeId));
    }

    function applyFilter(q) {
      const query = (q || "").trim().toLowerCase();
      filtered = !query ? items.slice() : items.filter((it) => {
        const blob = [
          it.cve_id, it.mps_id, it.title, it.kind, it.kind_en, it.cwe, it.description, it.level
        ].map((x) => String(x || "").toLowerCase()).join(" ");
        return blob.includes(query);
      });
      renderList();
      if (filtered.length) {
        const still = filtered.some((x) => (x.mps_id || x.cve_id) === activeId);
        selectById(still ? activeId : (filtered[0].mps_id || filtered[0].cve_id));
      } else {
        activeId = null;
        renderDetail(null);
      }
    }

    $("search").addEventListener("input", (e) => applyFilter(e.target.value));

    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement !== $("search")) {
        e.preventDefault();
        $("search").focus();
        return;
      }
      if (!filtered.length) return;
      const idx = filtered.findIndex((x) => (x.mps_id || x.cve_id) === activeId);
      if (e.key === "ArrowDown") {
        e.preventDefault();
        const next = filtered[Math.min(filtered.length - 1, Math.max(0, idx) + 1)];
        selectById(next.mps_id || next.cve_id);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        const prev = filtered[Math.max(0, idx - 1)];
        selectById(prev.mps_id || prev.cve_id);
      }
    });

    const hashId = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    if (hashId && items.some((x) => (x.mps_id || x.cve_id) === hashId)) {
      activeId = hashId;
      renderList();
      selectById(hashId);
    } else if (items.length) {
      selectById(items[0].mps_id || items[0].cve_id);
    } else {
      renderList();
      renderDetail(null);
    }
  </script>
</body>
</html>
