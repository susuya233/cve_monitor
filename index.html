ository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "任意文件上传", "kind_en": "危险类型文件无限制上传", "last_modified_time": "2026-09-26", "level": "Critical", "mps_id": "MPS-welf-yosj", "poc": false, "poc_url": [], "published_time": "2026-09-26", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-welf-yosj", "name": "https://www.oscs1024.com/hd/MPS-welf-yosj"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-94132", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-94132"}, {"url": "https://www.acymailing.com/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-94132漏洞", "_translated": true, "_saved_at": "2026-09-26T20:31:51+00:00", "_first_saved_at": "2026-09-26T17:34:11+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-welf-yosj"}, {"analysis_status": 0, "articles": [{"content": "应用程序在处理用户输入时的不完善或缺乏验证机制，所以攻击者能够通过向应用程序发送恶意输入，利用应用程序对输入数据的错误处理方式来注入自己的恶意代码。这些恶意代码会被应用程序误认为是合法的指令或数据，并在执行过程中被执行。", "title": "什么是代码注入"}, {"content": "应用程序使用可执行动态代码的函数来执行用户可控的参数，当应用程序对于用户输入过滤不完全时，攻击者可以注入恶意代码并控制代码执行流程。", "title": "代码注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对所有用户输入进行验证和过滤，确保只接受预期的有效输入。这包括对输入数据进行输入长度验证、类型检查和格式验证等。\r\n- 使用参数化查询或预编译语句：对于数据库查询操作，应该使用参数化查询或预编译语句，确保输入数据不会被误认为是执行代码。\r\n- 最小特权原则：应用程序在执行操作系统命令或动态代码时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。\r\n- 安全编码实践：开发人员应该采用安全编码实践，包括避免使用eval函数、避免拼接用户输入的字符串作为代码执行等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止代码注入攻击。", "title": "如何预防代码注入"}], "cnvd_id": "", "cve_id": "CVE-2026-97160", "cvss": {"cvssv4": [{"source": "security@joomla.org", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.4}]}, "cvss_score": 9.4, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-94", "description": "Joomla 扩展 - lomart.fr - UP 插件扩展 5.0.0-5.2.0、6.0.0-6.0.29 中经过身份验证的特权 PHP 命令注入", "effects": [{"comp_name": "UP plugin for Joomla", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,6.0.0-6.0.29]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,5.0.0-5.2.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "代码注入", "kind_en": "代码生成控制不当（“代码注入”）", "last_modified_time": "2026-09-26", "level": "Critical", "mps_id": "MPS-m32c-l7y1", "poc": false, "poc_url": [], "published_time": "2026-09-26", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-m32c-l7y1", "name": "https://www.oscs1024.com/hd/MPS-m32c-l7y1"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-97160", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-97160"}, {"url": "https://up.lomart.fr/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-97160漏洞", "_translated": true, "_saved_at": "2026-09-26T20:31:54+00:00", "_first_saved_at": "2026-09-26T17:34:13+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-m32c-l7y1"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-94130", "cvss": {"cvssv4": [{"source": "security@joomla.org", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-89", "description": "Joomla 扩展 - joomlaboat.com - YouTube Gallery 扩展中未经身份验证的 SQL 注入 \u003c 5.7.3 - 视频搜索功能和排序中的 SQL 注入漏洞允许攻击者在读取查询中注入 SQL 命令。", "effects": [{"comp_name": "YouTube Gallery extension for Joomla", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.0.0-5.7.2]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-09-26", "level": "Critical", "mps_id": "MPS-jg03-1w8v", "poc": false, "poc_url": [], "published_time": "2026-09-26", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-jg03-1w8v", "name": "https://www.oscs1024.com/hd/MPS-jg03-1w8v"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-94130", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-94130"}, {"url": "https://joomlaboat.com/youtube-gallery", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-94130漏洞", "_translated": true, "_saved_at": "2026-09-26T20:31:56+00:00", "_first_saved_at": "2026-09-26T17:34:28+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-jg03-1w8v"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-100720", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:R/S:C/C:H/I:H/A:N", "severity": "high", "base_score": 8.7}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:P/VC:H/VI:H/VA:N/SC:H/SI:H/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:P/VC:H/VI:H/VA:N/SC:H/SI:H/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-79", "description": "Froxlor 2.0.0 至 2.3.10 容易受到存储的跨站点脚本的攻击。当客户（权限最低的经过身份验证的角色）为其自己的域之一上传 SSL 证书时，证书 API add()/update() 方法使用 openssl_x509_parse() 对其进行解析，并逐字存储颁发者组织 (issuer['O']) 值而不进行清理。然后，Froxlor 的表格列表渲染器通过 Twig 的“原始”过滤器发出标量单元，从而禁用 HTML 自动转义，因此当管理员或经销商打开“域”\u003e“SSL 证书”时，攻击者提供的颁发者值将在特权用户会话中作为脚本执行。这跨越了从客户到管理员的权限边界，并可能导致管理员帐户完全被接管；由于 Froxlor 管理员控制以 root 身份运行的 cron 作业应用的 Web 服务器、DNS 和 PHP 配置，因此该问题可以进一步升级为在托管服务器上以 root 身份执行命令。该问题已在 Froxlor 2.3.12 中修复。", "effects": [{"comp_name": "froxlor", "ecosystem": "linux", "versions": [{"affected_version": "[2.0.0,2.3.12)", "min_fixed_version": "2.3.12", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-09-26", "level": "Critical", "mps_id": "MPS-qy9l-5edb", "poc": false, "poc_url": [], "published_time": "2026-09-26", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-qy9l-5edb", "name": "https://www.oscs1024.com/hd/MPS-qy9l-5edb"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-100720", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-100720"}, {"url": "https://github.com/froxlor/froxlor/security/advisories/GHSA-89vj-gqqr-73p8", "name": "GitHub Security Advisory (GHSA-89vj-gqqr-73p8)"}, {"url": "https://www.vulncheck.com/advisories/froxlor-before-2.3.12-stored-xss-via-ssl-certificate-issuer", "name": "VulnCheck Advisory: Froxlor before 2.3.12 Stored XSS via SSL certificate issuer"}], "scope_influence": "", "tags": ["应用软件"], "title": "Froxlor 2.3.12 之前通过 SSL 证书颁发者存储的 XSS", "_translated": true, "_saved_at": "2026-09-26T17:34:32+00:00", "_first_saved_at": "2026-09-26T17:34:32+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-qy9l-5edb"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，从而导致未授权的用户或资源可以被访问或篡改。", "title": "什么是访问控制不当"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n", "title": "访问控制不当常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防访问控制不当"}], "cnvd_id": "", "cve_id": "CVE-2026-97161", "cvss": {"cvssv4": [{"source": "security@joomla.org", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:H/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.2}]}, "cvss_score": 9.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:H/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-284", "description": "Joomla 扩展 - lomart.fr - UP 插件扩展 5.0.0-5.2.0、6.0.0-6.0.29 中的各种路径遍历/文件访问向量", "effects": [{"comp_name": "UP plugin for Joomla", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,6.0.0-6.0.29]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,5.0.0-5.2.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "访问控制不当", "kind_en": "访问控制不当", "last_modified_time": "2026-09-26", "level": "Critical", "mps_id": "MPS-p52j-rweu", "poc": false, "poc_url": [], "published_time": "2026-09-26", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-p52j-rweu", "name": "https://www.oscs1024.com/hd/MPS-p52j-rweu"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-97161", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-97161"}, {"url": "https://up.lomart.fr/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-97161漏洞", "_translated": true, "_saved_at": "2026-09-26T20:31:50+00:00", "_first_saved_at": "2026-09-26T17:34:23+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-p52j-rweu"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2026-85984", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-287", "description": "WordPress 的 miniOrange OTP 登录、验证和短信通知插件在 5.5.5 及之前的所有版本中都容易通过 mo_wp_login_intent 参数受到身份验证绕过。这是由于 mo_by_pass_login() 函数的启用了skip_pass_fallback的配置分支中缺少密码意图保护，每当未经身份验证、未经验证的 POST 参数 mo_wp_login_intent 与值 otp 一起提交时，它会将管理员角色成员资格单独视为足够的身份验证，从而导致 mo_get_user() 跳过 wp_authenticate_username_password() 并纯粹从用户名解析 WP_User查找。这使得未经身份验证的攻击者可以通过仅提供已知的用户名和空密码以及 mo_wp_login_intent=otp 来以任何现有管理员帐户身份登录，而无需密码或 OTP 验证。攻击的条件是站点管理员同时启用了以下插件选项：WP Login OTP、仅使用 OTP 登录、允许用户使用用户名和密码登录以及管理员 OTP 绕过。", "effects": [{"comp_name": "miniOrange OTP Login, Verification and SMS Notifications", "ecosystem": "linux", "versions": [{"affected_version": "(0,5.5.5]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "身份验证不当", "kind_en": "认证不当", "last_modified_time": "2026-09-27", "level": "Critical", "mps_id": "MPS-2uno-z8ij", "poc": false, "poc_url": [], "published_time": "2026-09-27", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-2uno-z8ij", "name": "https://www.oscs1024.com/hd/MPS-2uno-z8ij"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-85984", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-85984"}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/2895f0c2-41b6-4b11-9865-3bded4402aa9?source=cve", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/miniorange-otp-verification/tags/5.5.5/views/forms/mowploginform.php#L134", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/miniorange-otp-verification/tags/5.5.5/includes/js/loginform.js#L176", "name": ""}, {"url": "https://plugins.trac.wordpress.org/changeset/3687601/miniorange-otp-verification", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-85984漏洞", "_translated": true, "_saved_at": "2026-09-26T20:31:47+00:00", "_first_saved_at": "2026-09-26T20:31:47+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-2uno-z8ij"}, {"analysis_status": 0, "articles": [{"content": "- 程序未正确处理用户上传的文件，从而导致程序可以读取、处理或存储未经授权的文件\n", "title": "什么是任意文件上传"}, {"content": "- 欺骗攻击：攻击者可以通过发送伪造的文件来欺骗程序，从而导致程序读取、处理或存储未经授权的文件。\n- 文件格式攻击：攻击者可以通过选择特定的文件格式，例如压缩文件或 ZIP 文件，从而利用上传的文件来篡改程序的执行结果或窃取程序中的重要数据。\n", "title": "任意文件上传常见的攻击方式"}, {"content": "- 使用安全文件传输协议 (FTP):使用安全 FTP 协议可以确保上传的文件格式、大小、权限等符合预期，同时可以防止文件读取、篡改或存储漏洞。\n- 使用文件上传过滤器：使用文件上传过滤器可以过滤上传的文件，以确保文件的格式、大小、权限等符合预期，同时可以防止文件读取、篡改或存储漏洞。\n- 使用白名单机制：使用白名单机制可以只允许特定的文件格式、大小、权限等存在的文件上传，从而防止非法文件的上传和攻击。\n- 定期更新和升级程序：定期更新和升级程序可以修复已知的漏洞，并增强程序的安全性。", "title": "如何预防任意文件上传"}], "cnvd_id": "", "cve_id": "CVE-2026-82901", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-434", "description": "WordPress 的 Ultra Addons for Contact Form 7 插件容易受到任意文件上传的攻击，因为在 3.5.50 及之前的所有版本中，“uacf7_wpcf7_mail_components”功能中的文件类型验证不足。这使得未经身份验证的攻击者可以在受影响站点的服务器上上传任意文件，从而可能实现远程代码执行。注意：仅当启用插件的 PDF 生成器模块（默认情况下禁用）时，此漏洞才可被利用。", "effects": [{"comp_name": "Ultra Addons for Contact Form 7", "ecosystem": "linux", "versions": [{"affected_version": "(0,3.5.50]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "任意文件上传", "kind_en": "危险类型文件无限制上传", "last_modified_time": "2026-09-27", "level": "Critical", "mps_id": "MPS-o6h8-ydta", "poc": false, "poc_url": [], "published_time": "2026-09-27", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-o6h8-ydta", "name": "https://www.oscs1024.com/hd/MPS-o6h8-ydta"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-82901", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-82901"}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/872e1a05-aacc-44fa-93c1-8c3f7b2fb46d?source=cve", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/ultimate-addons-for-contact-form-7/tags/3.5.48/addons/signature/ultimate-signature.php#L133", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/ultimate-addons-for-contact-form-7/tags/3.5.48/addons/signature/ultimate-signature.php#L192", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/ultimate-addons-for-contact-form-7/tags/3.5.48/addons/signature/ultimate-signature.php#L300", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/ultimate-addons-for-contact-form-7/tags/3.5.48/addons/pdf-generator/pdf-generator.php#L608", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/ultimate-addons-for-contact-form-7/tags/3.5.48/addons/pdf-generator/pdf-generator.php#L807", "name": ""}, {"url": "https://plugins.trac.wordpress.org/changeset/3698232/ultimate-addons-for-contact-form-7", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-82901漏洞", "_translated": true, "_saved_at": "2026-09-26T20:31:44+00:00", "_first_saved_at": "2026-09-26T20:31:44+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-o6h8-ydta"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-87722", "cvss": {"cvssv4": [{"source": "cve-coordination@google.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-1333", "description": "Gerrit Code Review 版本 2.1.6 到 正则表达式搜索查询谓词（例如 RegexProjectPredicate、RegexRefPredicate、RegexPathPredicate 和同级谓词）和 REST 正则表达式过滤器端点（RegexListSearcher /projects/?r= 和 RefFilter /projects/{project}/branches/?r=）中存在不受控制的资源消耗 (CWE-400 / CWE-1333) 3.12.9、3.13.0 到 3.13.8 以及 3.14.0 到 3.14.2 允许未经身份验证的远程攻击者（如果禁用 elog/ide/1-0-242/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-95985漏洞", "_translated": true, "_saved_at": "2026-09-24T19:42:56+00:00", "_first_saved_at": "2026-09-24T19:42:56+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-gvzl-dsif"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-97818", "cvss": {"cvssv31": [{"source": "cve@mitre.org", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:N/A:N", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:N/A:N", "cwe": "CWE-863", "description": "phpIPAM 到 1.8.3 对 api/controllers/User.php 中的 id==\"admins\" 和 id==\"all\" 的授权不正确。", "effects": [{"comp_name": "phpipam", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.8.3]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-09-25", "level": "High", "mps_id": "MPS-v2i0-n4el", "poc": fal epository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "不充分的划分", "kind_en": "不适当的隔离或划分", "last_modified_time": "2026-09-25", "level": "High", "mps_id": "MPS-1ruj-5xh7", "poc": false, "poc_url": [], "published_time": "2026-09-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-1ruj-5xh7", "name": "https://www.oscs1024.com/hd/MPS-1ruj-5xh7"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-95699", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-95699"}, {"url": "https://raw.githubusercontent.com/cisagov/CSAF/develop/csaf_files/VA/white/2026/va-26-267-01.json", "name": ""}, {"url": "https://www.mrsteam.com/contactus/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "MrSteam iSteamX 不正确的隔离或划分", "_translated": true, "_saved_at": "2026-09-25T01:06:22+00:00", "_first_saved_at": "2026-09-24T22:55:39+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-1ruj-5xh7"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-97898", "cvss": {"cvssv4": [{"source": "5a6e4751-2f3f-4070-9419-94fb35b644e8", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:A/VC:H/VI:L/VA:N/SC:H/SI:H/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.4}]}, "cvss_score": 8.4, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:A/VC:H/VI:L/VA:N/SC:H/SI:H/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-862", "description": "Akia 无钥匙进入云服务中不安全的直接对象引用/缺少对象级授权。解锁操作依赖于客户端提供的房间/门标识符，该标识符未针对经过身份验证的客人的预订在服务器端进行正确授权。经过身份验证的客人可以解锁自己房间以外的房间，从而导致未经授权的实体访问受影响酒店的客房。\n\n\n\n\n截至 2026 年 9 月 19 日，该服务不再容易受到此攻击（记者收到的反馈）。 \n\n\n\n\n攻击是远程的，但影响仅限于受影响的财产。", "effects": [{"comp_name": "akia", "ecosystem": "linux", "versions": [{"affected_version": "(0,2026.10.19)", "min_fixed_version": "2026.10.19", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-09-25", "level": "High", "mps_id": "MPS-dq3n-emlp", "poc": false, "poc_url": [], "published_time": "2026-09-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-dq3n-emlp", "name": "https://www.oscs1024.com/hd/MPS-dq3n-emlp"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-97898", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-97898"}, {"url": "https://www.akia.com/platform/keyless-entry", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Akia 无钥匙进入中的授权被破坏，可让经过身份验证的客人解锁其他房间", "_translated": true, "_saved_at": "2026-09-25T12:40:16+00:00", "_first_saved_at": "2026-09-25T12:40:16+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-dq3n-emlp"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2026-85056", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:L/A:N", "severity": "high", "base_score": 8.2}]}, "cvss_score": 8.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:L/A:N", "cwe": "CWE-287", "description": "ZITADEL 是一个开源身份管理平台。从 4.0.0 到 4.16.1，ZITADEL Login V2 在密码验证后创建浏览器会话，并且可以在以后的身份验证请求中重用该会话，而无需验证用户注册的 TOTP、OTP 或 U2F 第二因素。当放弃 MFA 步骤并再次开始登录时，仅当组织启用强制 MFA 或仅对本地用户强制 MFA 时，会话有效性检查才需要 MFA，因此在为客户应用程序完成 OIDC 或 SAML 回调时可以跳过自愿注册因素。登录 V1、ZITADEL 控制台、管理和管理 API 以及用户自我管理不受影响。此问题已在版本 4.16.1 中修复。", "effects": [{"comp_name": "github.com/zitadel/zitadel", "ecosystem": "go", "versions": [{"affected_version": "(-∞,v1.80.0-v2.20.0.20260717062356-56f4798ed31f)", "min_fixed_version": "v1.80.0-v2.20.0.20260717062356-56f4798ed31f", "repository": "go", "solutions": [], "upstream": true}]}, {"comp_name": "zitadel", "ecosystem": "linux", "versions": [{"affected_version": "[4.0.0,4.16.1)", "min_fixed_version": "4.16.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "身份验证不当", "kind_en": "认证不当", "last_modified_time": "2026-09-25", "level": "High", "mps_id": "MPS-lfz5-sgpo", "poc": false, "poc_url": [], "published_time": "2026-09-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-lfz5-sgpo", "name": "https://www.oscs1024.com/hd/MPS-lfz5-sgpo"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-85056", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-85056"}, {"url": "https://github.com/zitadel/zitadel/security/advisories/GHSA-9993-rfwp-rhwf", "name": "https://github.com/zitadel/zitadel/security/advisories/GHSA-9993-rfwp-rhwf"}, {"url": "https://github.com/zitadel/zitadel/commit/049dbb25a56587fb3980c85c99819cad69f637db", "name": "https://github.com/zitadel/zitadel/commit/049dbb25a56587fb3980c85c99819cad69f637db"}, {"url": "https://github.com/zitadel/zitadel/commit/56f4798ed31fc1cfcd9a0e7f6f0152289d2fdc43", "name": "https://github.com/zitadel/zitadel/commit/56f4798ed31fc1cfcd9a0e7f6f0152289d2fdc43"}, {"url": "https://github.com/zitadel/zitadel/releases/tag/v4.16.1", "name": "https://github.com/zitadel/zitadel/releases/tag/v4.16.1"}], "scope_influence": "", "tags": ["go", "应用软件"], "title": "ZITADEL：通过 Login V2 中的会话重用绕过 MFA", "_translated": true, "_saved_at": "2026-09-24T19:42:59+00:00", "_first_saved_at": "2026-09-24T19:42:59+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-lfz5-sgpo"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-97875", "cvss": {"cvssv31": [{"source": "74b3a70d-cca6-4d34-9789-e83b222ae3be", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:N", "severity": "high", "base_score": 8.1}]}, "cvss_score": 8.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:N", "cwe": "CWE-350", "description": "Rojo 的“rojoserve”HTTP API（默认端口 34872）没有 Host/Origin 标头验证，因此容易受到 DNS 重新绑定的影响。恶意网页可以读取所有项目源代码，将恶意代码写入磁盘上的文件，并通过 opener::open() 启动本地程序，除了访问页面之外无需用户交互。", "effects": [{"comp_name": "rojo", "ecosystem": "linux", "versions": [{"affected_version": "(0,7.7.0)", "min_fixed_version": "7.7.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "不恰当地信任反向DNS", "kind_en": "依赖反向 DNS 解析来执行安全关键操作", "last_modified_time": "2026-09-25", "level": "High", "mps_id": "MPS-ktwy-rax9", "poc": false, "poc_url": [], "published_time": "2026-09-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ktwy-rax9", "name": "https://www.oscs1024.com/hd/MPS-ktwy-rax9"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-97875", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-97875"}, {"url": "https://github.com/rojo-rbx/rojo/pull/1270", "name": ""}, {"url": "https://rustsec.org/advisories/RUSTSEC-2026-0279.html", "name": ""}, {"url": "https://osv.dev/vulnerability/RUSTSEC-2026-0279", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "rojo 服务 HTTP API 中的 DNS 重新绑定漏洞", "_translated": true, "_saved_at": "2026-09-25T12:40:14+00:00", "_first_saved_at": "2026-09-25T12:40:14+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ktwy-rax9"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-97735", "cvss": {"cvssv31": [{"source": "cve@mitre.org", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:R/S:C/C:H/I:H/A:N", "severity": "high", "base_score": 8}]}, "cvss_score": 8, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:R/S:C/C:H/I:H/A:N", "cwe": "CWE-79", "description": "26.08 之前的 ITFlow 允许在票证电子邮件解析器 (cron/ticket_email_parser.php) 中添加 SVG 附件，用于处理可能通过 SMTP 从任意发件人到达的电子邮件。", "effects": [{"comp_name": "itflow", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,26.08)", "min_fixed_version": "26.08", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-09-25", "level": "High", "mps_id": "MPS-ixlj-286u", "poc": false, "poc_url": [], "published_time": "2026-09-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ixlj-286u", "name": "https://www.oscs1024.com/hd/MPS-ixlj-286u"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-97735", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-97735"}, {"url": "https://github.com/itflow-org/itflow/security/advisories/GHSA-89fw-w69c-vghj", "name": ""}, {"url": "https://github.com/itflow-org/itflow/commit/16000efcf7f7c833aae9f8da22d2a82df21a49c0", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "CVE-2026-97735漏洞", "_translated": true, "_saved_at": "2026-09-25T06:59:35+00:00", "_first_saved_at": "2026-09-25T06:59:35+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ixlj-286u"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-87720", "cvss": {"cvssv4": [{"source": "cve-coordination@google.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:L/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.6}]}, "cvss_score": 7.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:L/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-863", "description": "Gerrit Code Review 版本 2.16.0 到 3.12.9、3.13.0 到 3.13.8、3.14.0 到 3.14.2 中的项目名称规范化 (ProjectUtil.stripGitSuffix) 和 ProjectCache 逐出逻辑 (ProjectCacheImpl) 中的授权不正确 (CWE-863) 允许经过身份验证的用户（如果存储库以前是未经身份验证的用户） public），通过跨 REST API、Gtiles 或 SSH Git 命令使用重复的 .git 后缀（例如 project.git.git）精心设计的请求，导致私有存储库内容未经授权泄露，并持久恢复已撤销的项目所有者管理权限。由于在构造逻辑 ProjectCache 键时，Gerrit 仅删除单个终端 .git 后缀，而 JGit (FileKey.lenient) 将后缀别名解析为磁盘上的同一规范裸存储库，因此撤销对规范项目名称的读取访问权限或删除所有者规则无法在缓存有效性窗口期间逐出缓存的别名 ProjectState，从而允许读取新创建的私有提交或写入 refs/meta/config。此问题已在 Gerrit Code Review 版本 3.12.10、3.13.9 和 3.14.3 中修复。", "effects": [{"comp_name": "Gerrit", "ecosystem": "linux", "versions": [{"affected_version": "(3.13.0,3.13.9)", "min_fixed_version": "3.13.9", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(3.14.0,3.14.3)", "min_fixed_version": "3.14.3", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(2.16.0,3.12.10)", "min_fixed_version": "3.12.10", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-09-25", "level": "High", "mps_id": "MPS-0cv3-5npd", "poc": false, "poc_url": [], "published_time": "2026-09-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-0cv3-5npd", "name": "https://www.oscs1024.com/hd/MPS-0cv3-5npd"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-87720", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-87720"}, {"url": "https://issues.gerritcodereview.com/issues/538883789", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-87720漏洞", "_translated": true, "_saved_at": "2026-09-25T01:06:19+00:00", "_first_saved_at": "2026-09-24T22:55:33+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-0cv3-5npd"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-97737", "cvss": {"cvssv31": [{"source": "cve@mitre.org", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:N", "severity": "high", "base_score": 7.4}]}, "cvss_score": 7.4, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR: 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止代码注入攻击。", "title": "如何预防代码注入"}], "cnvd_id": "", "cve_id": "CVE-2026-96795", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-94", "description": "Horilla 是一款 HR 和 CRM 软件。在 2.0.0 之前，horilla_views/generic/cbv/views.py 中的 HorillaListView.export_data 接受经过身份验证的用户的列 POST 参数，采用 field_tuple[1]，将其插入到dynamic_fn_str 作为 Python 源，并将生成的函数定义传递给 exec()。在 ast.literal_eval 下保持有效的精心设计的字符串可以将 Python 语法注入到函数定义期间评估的默认参数中，从而允许使用应用程序进程权限执行任意操作系统命令，包括附带的 Docker 映像中的 root 权限。此问题已在 2.0.0 版本中修复。", "effects": [{"comp_name": "horilla-hr", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.0.0)", "min_fixed_version": "2.0.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "代码注入", "kind_en": "代码生成控制不当（“代码注入”）", "last_modified_time": "2026-09-26", "level": "High", "mps_id": "MPS-iz0o-qb2c", "poc": false, "poc_url": [], "published_time": "2026-09-26", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-iz0o-qb2c", "name": "https://www.oscs1024.com/hd/MPS-iz0o-qb2c"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-96795", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-96795"}, {"url": "https://github.com/horilla/horilla-hr/security/advisories/GHSA-5g4v-4rv4-r26f", "name": "https://github.com/horilla/horilla-hr/security/advisories/GHSA-5g4v-4rv4-r26f"}, {"url": "https://github.com/horilla/horilla-hr/releases/tag/2.0.0", "name": "https://github.com/horilla/horilla-hr/releases/tag/2.0.0"}], "scope_influence": "", "tags": ["应用软件"], "title": "Horilla：Horilla 列表视图导出中经过身份验证的 RCE", "_translated": true, "_saved_at": "2026-09-26T03:02:37+00:00", "_first_saved_at": "2026-09-2 GHSA-57wv-g7m3-hmff)"}, {"url": "https://www.vulncheck.com/advisories/froxlor-before-2.3.12-authentication-bypass-via-session-persistence", "name": "VulnCheck Advisory: froxlor before 2.3.12 Authentication Bypass via Session Persistence"}], "scope_influence": "", "tags": [], "title": "2.3.12 之前的 froxlor 通过会话持久性绕过身份验证", "_translated": true, "_saved_at": "2026-09-26T13:41:13+00:00", "_first_saved_at": "2026-09-26T13:41:13+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-han9-57dg"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-100599", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-78", "description": "OpenClaw 版本 2026.5.1 至 2026.7.0 无法将配置的执行批准路径应用于 Google Meet 节点命令。 googlemeet.chrome 命令接受调用者提供的音频命令数组，并在配对节点上执行它们，而无需经过正常的 system.run 批准流程。在启用 Google Meet 插件、配对 Chrome 节点和允许 googlemeet.chrome 节点命令的部署中，能够调用该命令的工具代理可以在配对节点上执行攻击者选择的进程，从而影响该节点上的文件、凭据、浏览器配置文件和可用性。该问题已于2026.7.1修复；作为解决方法，请从允许的节点命令中删除 googlemeet.chrome 或禁用 Google Meet 插件。", "effects": [{"comp_name": "openclaw", "ecosystem": "linux", "versions": [{"affected_version": "[2026.5.1,2026.7.1)", "min_fixed_version": "2026.7.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-09-26", "level": "High", "mps_id": "MPS-khqv-54ce", "poc": false, "poc_url": [], "published_time": "2026-09-26", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-khqv-54ce", "name": "https://www.oscs1024.com/hd/MPS-khqv-54ce"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-100599", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-100599"}, {"url": "https://github.com/openclaw/openclaw/security/advisories/GHSA-224w-vfr9-h35c", "name": "GitHub Security Advisory (GHSA-224w-vfr9-h35c)"}, {"url": "https://www.vulncheck.com/advisories/openclaw-2026.5.1-before-2026.7.1-remote-code-execution-via-googlemeet-chrome", "name": "VulnCheck Advisory: OpenClaw 2026.5.1 before 2026.7.1 Remote Code Execution via googlemeet.chrome"}], "scope_influence": "", "tags": ["应用软件"], "title": "OpenClaw 2026.7.1 之前的 2026.5.1 通过 googlemeet.chrome 远程执行代码", "_translated": true, "_saved_at": "2026-09-26T08:59:18+00:00", "_first_saved_at": "2026-09-26T08:59:18+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-khqv-54ce"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-100596", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-862", "description": "2026.7.1 之前的 OpenClaw 版本无法正确授权非所有者用户通过 /mcp set 和 /mcp unset 命令执行 MCP 配置更改。攻击者可以在配置加载时保留以 OpenClaw 进程权限执行的任意 stdio MCP 命令，从而损害主机的机密性、完整性和可用性。", "effects": [{"comp_name": "openclaw", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2026.7.1)", "min_fixed_version": "2026.7.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-09-26", "level": "High", "mps_id": "MPS-krhj-yvxg", "poc": false, "poc_url": [], "published_time": "2026-09-26", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-krhj-yvxg", "name": "https://www.oscs1024.com/hd/MPS-krhj-yvxg"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-100596", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-100596"}, {"url": "https://github.com/openclaw/openclaw/security/advisories/GHSA-wwx7-573h-pqwc", "name": "GitHub Security Advisory (GHSA-wwx7-573h-pqwc)"}, {"url": "https://www.vulncheck.com/advisories/openclaw-before-2026.7.1-authorization-bypass-via-mcp-configuration", "name": "VulnCheck Advisory: OpenClaw before 2026.7.1 Authorization Bypass via MCP Configuration"}], "scope_influence": "", "tags": ["应用软件"], "title": "2026.7.1 之前的 OpenClaw 通过 MCP 配置绕过授权", "_translated": true, "_saved_at": "2026-09-26T08:59:11+00:00", "_first_saved_at": "2026-09-26T08:59:11+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-krhj-yvxg"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-100520", "cvss": {"cvssv31": [{"source": "d age": "https://www.oscs1024.com/hd/MPS-qkj8-ingr"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-100717", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:L/I:H/A:H", "severity": "critical", "base_score": 9.9}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:L/VI:H/VA:H/SC:L/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.5}]}, "cvss_score": 8.5, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:L/VI:H/VA:H/SC:L/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-93", "description": "froxlor 是一个服务器管理面板。在版本 2.3.10 及更早版本中，Validate::validateUrl 仅拒绝 parse_url 返回的路径、查询和片段组件中的回车符和换行符，并且从不检查 userinfo (user:pass@) 组件。这是 GHSA-c3p2 的不完整修复。具有子域创建权限（无需 admin 或 change_serversettings 权限）的经过身份验证的低权限客户可以提供在 userinfo 部分中携带 CR/LF 负载的子域重定向 URL（例如 http://user%0areturn 200 \"pwned\";%0a@evil.com/）。该值通过验证，在 IDNA 编码中幸存下来，并逐字写入生成的 nginx 或 Apache 虚拟主机配置中，从而允许攻击者突破发出的指令并注入任意 Web 服务器配置行。 froxlor 以 root 身份重新生成并重新加载 Web 服务器配置，因此注入的指令在服务器范围内生效，并且可以劫持响应或读取本地文件。该问题已在 2.3.12 版本中修复。", "effects": [{"comp_name": "froxlor", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.3.12)", "min_fixed_version": "2.3.12", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "CRLF注入", "kind_en": "Improper Neutralization of CRLF Sequences ('CRLF Injection')", "last_modified_time": "2026-09-26", "level": "High", "mps_id": "MPS-xil2-stmw", "poc": false, "poc_url": [], "published_time": "2026-09-26", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-xil2-stmw", "name": "https://www.oscs1024.com/hd/MPS-xil2-stmw"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-100717", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-100717"}, {"url": "https://github.com/froxlor/froxlor/security/advisories/GHSA-gxx3-hwjc-h2gp", "name": "GitHub Security Advisory (GHSA-gxx3-hwjc-h2gp)"}, {"url": "https://www.vulncheck.com/advisories/froxlor-before-2.3.12-crlf-injection-via-validateurl-userinfo", "name": "VulnCheck Advisory: froxlor before 2.3.12 CRLF Injection via validateUrl userinfo"}], "scope_influence": "", "tags": ["应用软件"], "title": "2.3.12 之前的 froxlor 通过 validateUrl userinfo 进行 CRLF 注入", "_translated": true, "_saved_at": "2026-09-26T17:34:39+00:00", "_first_saved_at": "2026-09-26T17:34:39+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-xil2-stmw"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-71483", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:A/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.5}]}, "cvss_score": 8.5, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:A/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-79", "description": "Horilla 是一款 HR 和 CRM 软件。在 1.6.0 之前，/employee/employee-filter-view 处的搜索参数由 jQuery .html() 反映在 employee/templates/employee_nav.html 中，而不进行 HTML 中和。外部攻击者可以制作并传递一个链接，当经过身份验证的员工或管理员到达员工过滤器时，该链接会导致 JavaScript 执行，从而允许使用受害者的应用程序权限访问浏览器可见的会话数据和操作。此问题已在 1.6.0 版本中修复。", "effects": [{"comp_name": "horilla-hr", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.6.0)", "min_fixed_version": "1.6.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-09-26", "level": "High", "mps_id": "MPS-zw6v-blyp", "poc": false, "poc_url": [], "published_time": "2026-09-26", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-zw6v-blyp", "name": "https://www.oscs1024.com/hd/MPS-zw6v-blyp"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-71483", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-71483"}, {"url": "https://github.com/horilla/horilla-hr/commit/39ed01306341a1f6b7702df2825ab5431b5401a9", "name": ""}, {"url": "https://github.com/horilla/horilla-hr/security/advisories/GHSA-rw86-x8hq-xgwh", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-71483 漏洞", "_translated": true, "_saved_at": "2026-09-25T23:54:12+00:00", "_first_saved_at": "2026-09-25T23:54:12+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-zw6v-blyp"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-100368", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.4}]}, "cvss_score": 8.4, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-78", "description": "CliInvoke 是一个用于调用命令行程序的 .NET 库，其“CliInvoke.Specializations”包为 PowerShell 和 Windows 命令提示符等 shell 提供了专门的包装器。 `CliInvoke.Specializations` 版本 2.2.0 到 2.8.4、2.9.0 到 2.9.3、2.10.0 到 2.10.4、3.0.0-alpha.1 到 3.0.0-alpha.4、3.0.0-alpha.8 到 3.0.0-alpha.10，以及“AlastairLundy.CliInvoke.Specializations”版本 1.0.0-rc.1 至 1.6.1.1 在其 PowerShell 和 Cmd 包装器中包含操作系统命令注入漏洞。包装器使用单个“ProcessStartInfo.Arguments”字符串将调用者控制的目标和参数传递给“pwsh -Command”或“cmd /c”，允许不受信任的输入中的双引号破坏操作系统级引用，并导致 shell 使用主机进程的权限执行附加命令。该漏洞已在“CliInvoke.Specializations”版本 2.8.5、2.9.4、2.10.5 和 3.0.0-beta.1 以及“AlastairLundy.CliInvoke.Specializations”版本 2.0.2 中修补。 No complete workaround is available;无法升级的用户应拒绝或删除目标路径和参数中的双引号，另外拒绝版本 2.2.0 到 2.9.2 以及 3.0.0-alpha.1 到 3.0.0-alpha.4 中的 shell 元字符，或者在处理不受信任的输入时绕过 PowerShell 和 Cmd 包装器并直接调用目标进程。", "effects": [{"comp_name": "CliInvoke.Specializations", "ecosystem": "linux", "versions": [{"affected_version": "[2.9.0,2.9.3]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[3.0.0-alpha.8,3.0.0-alpha.10]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[2.2.0,2.8.4]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[3.0.0-alpha.1,3.0.0-alpha.4]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[1.0.0-rc.1,1.6.1.1]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[2.10.0,2.10.4]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-09-26", "level": "High", "mps_id": "MPS-s7er-u4xo", "poc": false, "poc_url": [], "published_time": "2026-09-26", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-s7er-u4xo", "name": "https://www.oscs1024.com/hd/MPS-s7er-u4xo"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-100368", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-100368"}, {"url": "https://github.com/alastairlundy/CliInvoke/security/advisories/GHSA-wrvw-254r-wpmv", "name": "https://github.com/alastairlundy/CliInvoke/security/advisories/GHSA-wrvw-254r-wpmv"}], "scope_influence": "", "tags": ["应用软件"], "title": "CliInvoke.Specializations：PowerShell 和 Cmd shell 包装器中的命令注入", "_translated": true, "_saved_at": "2026-09-25T20:59:18+00:00", "_first_saved_at": "2026-09-25T20:59:18+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-s7er-u4xo"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-97162", "cvss": {"cvssv4": [{"source": "security@joomla.org", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:N/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.3}]}, "cvss_score": 8.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:N/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-89", "description": "Joomla 扩展 - lomart.fr - UP 插件扩展 5.0.0-5.2.0、6.0.0-6.0.29 中的各种 SQL 注入向量", "effects": [{"comp_name": "UP plugin for Joomla", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,5.0.0-5.2.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,6.0.0-6.0.29]", " 话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2026-100709", "cvss": {"cvssv31": [{"source": "VulnCheck", "vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.5}], "cvssv4": [{"source": "VulnCheck", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N", "severity": "high", "base_score": 7.7}]}, "cvss_score": 7.7, "cvss_vector": "", "cwe": "CWE-287", "description": "Froxlor 到 2.3.10 仅在记忆 2FA 令牌 (panel_2fa_tokens) 中存储数字用户 ID，而不记录帐户命名空间，并且登录期间记忆令牌查找不受客户或管理员帐户类型的限制。由于客户和管理员 ID 是从不同的命名空间分配的，因此合法颁发给具有给定 ID 的客户的记忆 2FA 令牌也会匹配具有相同 ID 的管理员。使用冲突 ID 控制客户帐户、为其持有有效的记住 2FA cookie 并且已经知道目标管理员密码的攻击者可以绕过管理员的 TOTP 第二因素并获得经过身份验证的管理员会话。这只是第二因素旁路；它不会破坏密码验证。已于 2.3.12 中修复。", "effects": [{"comp_name": "froxlor", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.3.12)", "min_fixed_version": "2.3.12", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "身份验证不当", "kind_en": "认证不当", "last_modified_time": "2026-09-26", "level": "High", "mps_id": "MPS-2a7n-9ujd", "poc": false, "poc_url": [], "published_time": "2026-09-26", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-2a7n-9ujd", "name": "https://www.oscs1024.com/hd/MPS-2a7n-9ujd"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-100709", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-100709"}, {"url": "https://github.com/froxlor/froxlor/security/advisories/GHSA-9fq7-9w8p-c3qh", "name": "GitHub Security Advisory (GHSA-9fq7-9w8p-c3qh)"}, {"url": "https://www.vulncheck.com/advisories/froxlor-before-2.3.12-2fa-bypass-via-namespace-confusion", "name": "VulnCheck Advisory: Froxlor before 2.3.12 2FA Bypass via Namespace Confusion"}], "scope_influence": "", "tags": [], "title": "2.3.12 之前的 Froxlor 通过命名空间混乱绕过 2FA", "_translated": true, "_saved_at": "2026-09-26T13:41:17+00:00", "_first_saved_at": "2026-09-26T13:41:17+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-2a7n-9ujd"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-88003", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-863", "description": "InvoicePlane 是一个自托管开源应用程序，用于管理发票、客户和付款。在 1.7.2 之前，InvoicePlane 在角色降级后无法撤销管理权限，因为 Admin_Controller 信任现有会话中存储的 user_type 快照，而不是重新验证 ip_users.user_type。当一名管理员降级另一帐户时，目标的活动会话将继续授权管理请求。降级的用户可以使用Users::form()将user_type设置回1，恢复数据库角色并使权限提升持续存在。此漏洞已在 1.7.2 中修复。", "effects": [{"comp_name": "InvoicePlane", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.7.2)", "min_fixed_version": "1.7.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-09-26", "level": "High", "mps_id": "MPS-5my1-7b6k", "poc": false, "poc_url": [], "published_time": "2026-09-26", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-5my1-7b6k", "name": "https://www.oscs1024.com/hd/MPS-5my1-7b6k"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-88003", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-88003"}, {"url": "https://github.com/InvoicePlane/InvoicePlane/commit/904847f4e87b66fd6743cf9cc6f88b66c7fc3b81", "name": ""}, {"url": "https://github.com/InvoicePlane/InvoicePlane/commit/daa49ce3a50e0c93e01459b69c0d61bfc23d23eb", "name": ""}, {"url": "https://github.com/InvoicePlane/InvoicePlane/releases/tag/v1.7.2", "name": ""}, {"url": "https://github.com/InvoicePlane/InvoicePlane/security/advisories/GHSA-25xj-pj36-wpp8", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-88003 漏洞", "_translated": true, "_saved_at": "2026-09-25T23:54:10+00:00", "_first_saved_at": "2026-09-25T23:54:10+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-5my1-7b6k"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-100598", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.1}], "cvssv4": [{" rst_saved_at": "2026-09-26T08:59:14+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-gzm1-qne5"}, {"analysis_status": 0, "articles": [{"content": "由于整数类型的有限范围，在进行算术运算或操作时，结果可能超出类型的表示范围，导致溢出或环绕。溢出指的是结果超过了类型的最大值或小于了最小值，而环绕指的是结果绕回到类型的最小值或最大值。", "title": "什么是整数溢出或环绕"}, {"content": "- 缓冲区溢出：整数溢出可能导致缓冲区溢出漏洞。当整数溢出导致分配的缓冲区大小不足以容纳结果时，攻击者可以利用这个漏洞覆盖相邻的内存区域，执行恶意代码或篡改程序的状态。\r\n- 身份验证绕过：在进行身份验证或访问控制时，整数溢出可能导致绕过验证的漏洞。攻击者可以构造特殊的输入，使溢出的整数值绕过了预期的验证逻辑，从而获得未经授权的访问权限。\r\n- 数据篡改：整数溢出可能导致数据篡改漏洞。攻击者可以通过使整数溢出，修改计数器、索引或其他控制数据的值，导致程序在处理数据时发生错误或执行意外的操作。", "title": "整数溢出或环绕常见的攻击方式"}, {"content": "- 输入验证与限制：对用户输入的整数进行合理的验证和限制，确保其在允许的范围内。\r\n- 使用安全的整数操作函数：使用安全的整数操作函数，如`add_with_overflow()`、`sub_with_overflow()`、`mul_with_overflow()`等，这些函数会检查并处理溢出情况，确保计算结果在安全范围内。\r\n- 类型检查和转换：在进行整数运算或操作之前，进行类型检查和转换，确保操作数的类型和范围是合适的。\r\n- 强制性编码标准和最佳实践：制定强制性的编码标准和最佳实践，包括对整数运算和操作的规范和限制，以帮助程序员编写更可靠、安全的代码。\r\n- 静态代码分析和测试：使用静态代码分析工具和测试技术来检测和识别潜在的整数溢出问题。这些工具可以帮助发现代码中可能存在的溢出漏洞，并及时修复。", "title": "如何预防整数溢出或环绕"}], "cnvd_id": "", "cve_id": "CVE-2026-100208", "cvss": {"cvssv31": [{"source": "secure@microsoft.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:R/S:U/C:H/I:H/A:H", "cwe": "CWE-190", "description": "Microsoft Office Outlook 中的整数溢出或环绕允许未经授权的攻击者通过网络执行代码。", "effects": [{"comp_name": "365_apps", "ecosystem": "linux", "versions": [{"affected_version": "[16.0.1,+∞)", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "office_2021", "ecosystem": "linux", "versions": [{"affected_version": "[16.0.1,+∞)", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "office_2024", "ecosystem": "linux", "versions": [{"affected_version": "[16.0.0,+∞)", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requireme snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-100504", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:L/AC:H/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:L/AC:L/AT:P/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.3}]}, "cvss_score": 7.3, "cvss_vector": "CVSS:4.0/AV:L/AC:L/AT:P/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-787", "description": "从 12.1.4 开始，Ghidra 版本在处理 p 代码的负移位量时，反编译器的 leftshift128 函数中包含基于堆栈的越界写入漏洞。攻击者可以使用特定的指令序列制作恶意二进制文件，这些指令序列在反编译时会触发溢出，从而破坏内存并可能实现代码执行。", "effects": [{"comp_name": "ghidra", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,12.1.4]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-09-26", "level": "High", "mps_id": "MPS-vu5i-497j", "poc": false, "poc_url": [], "published_time": "2026-09-26", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-vu5i-497j", "name": "https://www.oscs1024.com/hd/MPS-vu5i-497j"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-100504", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-100504"}, {"url": "https://github.com/NationalSecurityAgency/ghidra/commit/6babe3c1cec7f5ec920dd16cdc86a02893e5b33c", "name": "Patch Commit"}, {"url": "https://gith :X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-863", "description": "Actual是本地首创的个人理财工具。在 26.7.0 之前，Actual Sync Server 的 CORS 代理旨在让经过身份验证的用户仅从官方插件白名单中列出的存储库获取资源。配置“ACTUAL_GITHUB_TOKEN”后，代理会自动将服务器的 GitHub 令牌附加到 GitHub 请求。 GitHub API 白名单检查对“/repos/{owner}/{repo}”使用原始“startsWith()”前缀测试，无需在存储库名称后添加路径边界。如果列入白名单的公共插件存储库是“https://github.com/acme/plugin”，则代理还接受 GitHub API URL。这些 URL 位于允许列表存储库之外，但仍然通过，因为它们的 API 路径以“/repos/acme/plugin”开头。然后，代理使用服务器的“ACTUAL_GITHUB_TOKEN”转发请求，允许任何经过身份验证的实际用户读取可通过该令牌访问的私有 GitHub 资源。版本 26.7.0 修复了该问题。", "effects": [{"comp_name": "actual", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,26.7.0)", "min_fixed_version": "26.7.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-09-26", "level": "High", "mps_id": "MPS-253w-0boy", "poc": false, "poc_url": [], "published_time": "2026-09-26", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-253w-0boy", "name": "https://www.oscs1024.com/hd/MPS-253w-0boy"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-57449", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-57449"}, {"url": "https://github.com/actualbudget/actual/security/advisories/GHSA-m62c-5q34-f3cf", "name": "https://github.com/actualbudget/actual/security/advisories/GHSA-m62c-5q34-f3cf"}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-57449漏洞", "_translated": true, "_saved_at": "2026-09-25T23:54:09+00:00", "_first_saved_at": "2026-09-25T23:54:09+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-253w-0boy"}, {"analysis_status": 0, "articles": [{"content": "由于应用程序或系统中存在敏感信息未经适当保护而被泄露给攻击者或未经授权的用户，这些敏感信息可能包括用户凭据、个人身份信息、敏感业务数据、系统配置信息等。信息暴露漏洞通常是由于设计、实施或配置错误引起的，例如不正确的访问控制、弱密码策略、缺乏加密、错误的日志处理等。", "title": "什么是未授权敏感信息泄露"}, {"content": "- 直接访问敏感信息：攻击者可以通过直接访问不正确配置或不受保护的资源来获取敏感信息，如通过公开可访问的URL、未经授权的文件目录访问等。\n- 越权访问：攻击者可能利用访问控制错误或不正确的权限配置来获取他们没有权限访问的敏感信息。\n- 错误信息披露：应用程序在错误处理过程中可能泄露敏感信息，例如将错误消息中的敏感数据返回给客户端或显示在日志文件中。\n- 信息泄露通过响应：攻击者可能利用应用程序在响应中不正确地包含敏感信息，如通过网页源代码、响应头部或响应消息体中的敏感数据。", "title": "未授权敏感信息泄露常见的攻击方式"}, {"content": "- 访问控制：确保只有经过授权的用户能够访问敏感信息，使用强大的身份验证和授权机制。\n- 数据加密：对于敏感信息，使用适当的加密算法对数据进行加密，包括数据传输和存储过程中的加密。\n- 错误处理和日志安全：正确处理错误情况，避免在错误消息中暴露敏感信息。同时，确保日志记录功能的安全性，避免将敏感信息记录在日志文件中。\n- 安全配置和最佳实践：遵循安全最佳实践，对应用程序、服务器和系统进行适当的配置，包括访问控制、权限管理、密码策略等。\n- 审计和监控：实施日志审计和监控机制，及时检测和响应任何异常活动或潜在的信息暴露事件。\n- 安全开发实践：在应用程序开发过程中，进行安全代码审查、漏洞扫描和安全测试，以及敏感信息的正确处理和保护。", "title": "如何预防未授权敏感信息泄露"}], "cnvd_id": "", "cve_id": "CVE-2026-100595", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:N", "severity": "medium", "base_score": 6.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-200", "description": "2026.7.1 之前的 OpenClaw 版本在诊断导出命令中包含授权绕过漏洞，允许非所有者通道发送者访问仅限所有者的主机诊断包。攻击者可以请求并接收有关主机、配置、运行时和仅供所有者使用的连接服务的诊断详细信息。", "effects": [{"comp_name": "openclaw", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2026.7.1)", "min_fixed_version": "2026.7.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", sory (GHSA-6q2v-jjq5-m2c8)"}, {"url": "https://www.vulncheck.com/advisories/froxlor-before-2.3.13-private-key-disclosure-via-certificates-api", "name": "VulnCheck Advisory: Froxlor before 2.3.13 Private Key Disclosure via Certificates API"}], "scope_influence": "", "tags": [], "title": "2.3.13 之前的 Froxlor 通过证书 API 泄​​露私钥", "_translated": true, "_saved_at": "2026-09-26T13:41:22+00:00", "_first_saved_at": "2026-09-26T13:41:22+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ptli-z0g1"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "cnvd_id": "", "cve_id": "CVE-2026-77203", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-269", "description": "WordPress 的群组 - 会员资格和访问控制插件在 4.6.0 及之前的所有版本中都容易受到权限升级的影响。这是因为 groups_join() 函数通过全局 $post-\u003epost_author 从环境帖子的作者能力中派生出组加入资格，而不是从当前经过身份验证的用户自己的能力中得出组加入资格，同时在同一响应中为调用者创建并返回有效的组加入数据哈希和 WordPress 随机数 - 消除了自我注册的所有授权障碍。这使得具有订阅者级别及以上访问权限的经过身份验证的攻击者可以将自己注册到任何组中，包括具有 groups_admin_groups 功能的特权组，并随后创建并加入包含每个已注册 WordPress 功能的组，从而有效地将其权限升级为管理员。利用该漏洞需要攻击者通过经过身份验证的 wp_ajax_parse_media_shortcode 处理程序的 post_ID 参数提供管理员编写的帖子 ID，以便建立有缺陷的授权检查所使用的特权环境帖子上下文。", "effects": [{"comp_name": "Groups – Memberships and Access Control", "ecosystem": "linux", "versions": [{"affected_version": "(0,4.6.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-09-27", "level": "High", "mps_id": "MPS-64w8-3sdc", "poc": false, "poc_url": [], "published_time": "2026-09-27", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-64w8-3sdc", "name": "https://www.oscs1024.com/hd/MPS-64w8-3sdc"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-77203", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-77203"}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/e86dddc9-c1d3-426b-8ec7-2e56dc3c2379?source=cve", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/groups/tags/4.5.0/lib/views/class-groups-shortcodes.php#L586", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/groups/tags/4.5.0/lib/views/class-groups-shortcodes.php#L624", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/groups/tags/4.5.0/lib/views/class-groups-shortcodes.php#L463", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/groups/tags/4.5.0/lib/wp/class-groups-wordpress.php#L248", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/groups/tags/4.5.0/lib/views/class-groups-shortcodes.php#L521", "name": ""}, {"url": "https://plugins.trac.wordpress.org/changeset/3693123/groups", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-77203漏洞", "_translated": true, "_saved_at": "2026-09-26T20:31:50+00:00", "_first_saved_at": "2026-09-26T20:31:50+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-64w8-3sdc"}, {"analysis_status":
