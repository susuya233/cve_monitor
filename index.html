88131", "cvss": {"cvssv31": [{"source": "secure@microsoft.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-502", "description": "Microsoft Dataverse 是微软托管的闭源云数据平台，作为 Power Platform 与 Dynamics 365 系列产品的统一数据底座，提供数据存储、业务逻辑与安全模型服务。\n受影响版本中，Dataverse 服务对通过网络接收的不可信数据执行反序列化，未经授权的攻击者可以提交恶意数据触发该缺陷，在服务端执行代码，微软将该漏洞评定为严重级别，CVSS 基础评分为 9.8。\n修复版本中通过微软在 Dataverse 云服务端部署的修复消除不可信数据反序列化风险，相关修复已自动生效，客户无需执行任何操作。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "反序列化", "kind_en": "不可信数据的反序列化", "last_modified_time": "2026-10-09", "level": "Critical", "mps_id": "MPS-uh52-ltxn", "poc": false, "poc_url": [], "published_time": "2026-10-09", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-uh52-ltxn", "name": "https://www.oscs1024.com/hd/MPS-uh52-ltxn"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-88131", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-88131"}, {"url": "https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-88131", "name": "Microsoft Dataverse Remote Code Execution Vulnerability"}], "scope_influence": "", "tags": ["应用软件"], "title": "Dataverse 反序列化远程代码执行漏洞", "_translated": true, "_saved_at": "2026-10-09T08:19:19+00:00", "_first_saved_at": "2026-10-09T01:38:39+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-uh52-ltxn"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-69435", "cvss": {"cvssv31": [{"source": "secure@microsoft.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:N", "severity": "critical", "base_score": 9.6}]}, "cvss_score": 9.6, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:N", "cwe": "CWE-918", "description": "Azure SRE Agent 是微软提供的托管式 AI 运维智能体服务（闭源），基于大模型执行事件分诊、根因分析与受治理的自动化运维操作，属于 AI 基础设施组件。\n受影响版本中，Azure SRE Agent 服务端存在授权缺失，微软官方将弱点归类为服务端请求伪造（CWE-918）。持有合法账户的低权限攻击者可通过网络利用该缺陷提升权限，微软确认该漏洞此前未公开披露、未检测到在野利用。\n修复版本中通过微软在服务端完成的修复消除了该授权缺失，漏洞已在托管服务侧被完全缓解，Azure SRE Agent 用户无需执行任何操作。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SSRF", "kind_en": "服务器端请求伪造 (SSRF)", "last_modified_time": "2026-10-09", "level": "Critical", "mps_id": "MPS-7df2-bvh5", "poc": false, "poc_url": [], "published_time": "2026-10-09", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-7df2-bvh5", "name": "https://www.oscs1024.com/hd/MPS-7df2-bvh5"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-69435", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-69435"}, {"url": "https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-69435", "name": "Azure SRE Agent Elevation of Privilege Vulnerability"}], "scope_influence": "", "tags": ["AI", "应用软件"], "title": "Azure SRE Agent 特权提升漏洞", "_translated": true, "_saved_at": "2026-10-09T01:38:42+00:00", "_first_saved_at": "2026-10-09T01:38:42+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-7df2-bvh5"}, {"analysis_status": 0, "articles": [{"content": "应用程序在处理用户输入时的不完善或缺乏验证机制，所以攻击者能够通过向应用程序发送恶意输入，利用应用程序对输入数据的错误处理方式来注入自己的恶意代码。这些恶意代码会被应用程序误认为是合法的指令或数据，并在执行过程中被执行。", "title": "什么是代码注入"}, {"content": "应用程序使用可执行动态代码的函数来执行用户可控的参数，当应用程序对于用户输入过滤不完全时，攻击者可以注入恶意代码并控制代码执行流程。", "title": "代码注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对所有用户输入进行验证和过滤，确保只接受预期的有效输入。这包括对输入数据进行输入长度验证、类型检查和格式验证等。\r\n- 使用参数化查询或预编译语句：对于数据库查询操作，应该使用参数化查询或预编译语句，确保输入数据不会被误认为是执行代码。\r\n- 最小特权原则：应用程序在执行操作系统命令或动态代码时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。\r\n- 安全编码实践：开发人员应该采用安全编码实践，包括避免使用eval函数、避免拼接用户输入的字符串作为代码执行等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止代码注入攻击。", "title": "如何预防代码注入"}], "cnvd_id": "", "cve_id": "CVE-2026-107700", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-94", "description": "dot-access 是 npm 上一个约 18 行的开源 Node.js 工具库，用于通过点号路径读写对象属性，npm latest 为 2015 年 4 月发布的 1.0.0。\n受影响版本中，exports.get 将调用方传入的 path 直接拼接进 new Function('_', 'return _.' + path) 的函数体执行，攻击者传入形如 constructor.constructor(\"return process\")() 的路径可触达 Function 构造器并执行任意 JavaScript，进而加载 child_process 在 Node.js 进程中执行操作系统命令，实测 1.0.0 可成功执行 id 命令。\n修复版本中通过，npm latest 仍为受影响的 1.0.0，可在官方修复发布前停用该库，改用按 path.split('.') 遍历属性索引取值的实现，并避免将外部可控输入直接作为 get() 的 path 参数。", "effects": [{"comp_name": "dot-access", "ecosystem": "npm", "versions": [{"affected_version": "[0.0.3,1.0.0]", "min_fixed_version": "", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "代码注入", "kind_en": "代码生成控制不当（“代码注入”）", "last_modified_time": "2026-10-09", "level": "Critical", "mps_id": "MPS-5039-dl47", "poc": false, "poc_url": [], "published_time": "2026-10-09", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-5039-dl47", "name": "https://www.oscs1024.com/hd/MPS-5039-dl47"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-107700", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-107700"}, {"url": "https://gist.github.com/R3tro16/e094e4318a040f189fd5d2d33e8c3ec2", "name": ""}, {"url": "https://github.com/ntharim/dot-access/blob/v1.0.0/index.js#L1-L7", "name": ""}, {"url": "https://github.com/ntharim/dot-access", "name": ""}, {"url": "https://www.vulncheck.com/advisories/dot-access-0.0.3-through-1.0.0-code-injection-via-get-path-argument", "name": "VulnCheck Advisory: dot-access 0.0.3 through 1.0.0 Code Injection via get() Path Argument"}], "scope_influence": "", "tags": ["npm", "开源"], "title": "dot-access 代码注入漏洞", "_translated": true, "_saved_at": "2026-10-08T21:43:43+00:00", "_first_saved_at": "2026-10-08T21:43:43+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-5039-dl47"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-107704", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA: ，采用 GPL-3.0 协议在 GitHub 开源，npm 仓库仅发布 1.0.0 版本，项目自 2017 年起未再维护。\n受影响版本中，convert.js 导出的转换函数将调用方传入的 filepath 与 convertTo 参数未经任何过滤直接拼接进 shell 命令字符串，并交给 child_process.exec() 执行：filepath 仅以单引号包裹，可用单引号闭合逃逸，convertTo 完全未加引号，且 fs.existsSync 检查后缺少 return，目标文件不存在时命令仍会执行。攻击者注入 shell 元字符即可以 Node.js 进程权限执行任意系统命令。\n修复版本中通过，可通过移除该依赖，或以 execFile 参数数组方式调用 ImageMagick、对目标扩展名做白名单校验并补齐缺失的 return，切断 shell 拼接链路来缓解风险。", "effects": [{"comp_name": "@enmaso/node-convert", "ecosystem": "npm", "versions": [{"affected_version": "(-∞,1.0.0]", "min_fixed_version": "", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-10-09", "level": "Critical", "mps_id": "MPS-skun-6ht8", "poc": false, "poc_url": [], "published_time": "2026-10-09", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-skun-6ht8", "name": "https://www.oscs1024.com/hd/MPS-skun-6ht8"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-107703", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-107703"}, {"url": "https://gist.github.com/R3tro16/5a508fcfddfb0dfe66a0a53437ede74c", "name": ""}, {"url": "https://github.com/enmaso/node-convert/blob/143e4d76244e2daac57eef59d8ed5983e33ee4fb/convert.js#L4-L15", "name": ""}, {"url": "https://github.com/enmaso/node-convert", "name": ""}, {"url": "https://www.vulncheck.com/advisories/enmaso-node-convert-through-1.0.0-os-command-injection-via-filepath-and-convertto", "name": "VulnCheck Advisory: @enmaso/node-convert through 1.0.0 OS Command Injection via filepath and convertTo"}], "scope_influence": "", "tags": ["npm", "开源"], "title": "node-convert 命令注入漏洞", "_translated": true, "_saved_at": "2026-10-08T21:43:41+00:00", "_first_saved_at": "2026-10-08T21:43:41+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-skun-6ht8"}, {"analysis_status": 0, "ar elying party 将攻击者终止的握手误判为已认证的 enclave 连接。\n修复版本中通过在 TLS 1.3 密钥调度上派生 32 字节会话 binder，即 HKDF-Expand-Label(client_handshake_traffic_secret, \"privasys-ratls-binder-v1\", Hash(ClientHello..ServerHello), 32)，并在 Certificate 发送前的 emit seam 处重新铸造叶子证书，使 ReportData 变为 SHA-512(SHA-256(SPKI_DER) || nonce || binder)；验证方经 ConnectionState.RATLSChannelBinder 重算 binder 并比对 quote，与当前会话不匹配时失败关闭，中继路径被切断。", "effects": [{"comp_name": "Privasys/go", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,privasys-v0.5.1-go1.26.5)", "min_fixed_version": "privasys-v0.5.1-go1.26.5", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "源验证错误", "kind_en": "来源验证错误", "last_modified_time": "2026-10-10", "level": "Critical", "mps_id": "MPS-4hrj-2xat", "poc": false, "poc_url": [], "published_time": "2026-10-10", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-4hrj-2xat", "name": "https://www.oscs1024.com/hd/MPS-4hrj-2xat"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-108267", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-108267"}, {"url": "https://github.com/Privasys/go/security/advisories/GHSA-7jfw-53rm-phh2", "name": "https://github.com/Privasys/go/security/advisories/GHSA-7jfw-53rm-phh2"}, {"url": "https://github.com/Privasys/go/commit/00a7d21ba53bba0ea09ac7a67eb2c6714e651700", "name": "https://github.com/Privasys/go/commit/00a7d21ba53bba0ea09ac7a67eb2c6714e651700"}, {"url": "https://github.com/Privasys/go/releases/tag/privasys-v0.5.1-go1.26.5", "name": "https://github.com/Privasys/go/releases/tag/privasys-v0.5.1-go1.26.5"}, {"url": "https://privasys.org/blog/binding-attestation-to-the-tls-session", "name": "https://privasys.org/blog/binding-attestation-to-the-tls-session"}], "scope_influence": "", "tags": ["应用软件"], "title": "Privasys Go RA-TLS证明中继漏洞", "_translated": true, "_saved_at": "2026-10-10T00:26:04+00: }, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-502", "description": "Photolia 是 ThemeRex（Axiom Themes）面向摄影师与作品集网站推出的商业 WordPress 主题，通过 ThemeForest 等渠道分发，源码不公开。\n受影响版本中，未认证请求传入的数据进入主题的 PHP 反序列化流程且缺乏充分校验，远程攻击者无需账号权限，通过提交恶意序列化载荷触发 PHP 对象注入，干扰站点数据处理流程并在服务器端执行有害操作，Patchstack 预计该漏洞会被大规模利用。\n修复版本中通过，可通过部署 WAF 或虚拟补丁规则拦截相关利用请求，限制站点对不可信数据的反序列化处理，待 ThemeRex 发布修复版本后及时升级以消除风险。", "effects": [{"comp_name": "photolia", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.0.3]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "反序列化", "kind_en": "不可信数据的反序列化", "last_modified_time": "2026-10-11", "level": "Critical", "mps_id": "MPS-y8r9-kzi2", "poc": false, "poc_url": [], "published_time": "2026-10-11", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-y8r9-kzi2", "name": "https://www.oscs1024.com/hd/MPS-y8r9-kzi2"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-78535", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-78535"}, {"url": "https://patchstack.com/database/wordpress/theme/photolia/vulnerability/wordpress-photolia-theme-1-0-3-php-object-injection-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": [], "title": "Photolia 主题 PHP 对象注入漏洞", "_translated": true, "_saved_at": "2026-10-10T22:09:22+00:00", "_first_saved_at": "2026-10-10T22:09:22+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-y8r9-kzi2"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-105889", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:N/A:L", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:N/A:L", "cwe": "CWE-89", "description": "Tickera 是一款开源（GPLv2 或更高版本）的 WordPress 活动售票与票务管理插件，提供活动管理、订单处理、检票接口与销售统计等功能。\n受影响版本中，插件 Sales API 通过 init 钩子对外提供服务且无需登录，TC_Sales_API 将请求参数 period_compare 仅经 sanitize_text_field 处理后传入 TC_Orders_Search，其 filter_where 方法经 posts_where 过滤器把该值以字符串拼接方式并入 WP_Query 的 WHERE 子句，攻击者可在请求中注入 SQL 比较表达式构造布尔或延时盲注；受影响版本对 api_key 的校验在 api_key 为空时因 meta 查询空值语义而失效，未认证请求可到达上述拼接点，最终形成未认证盲注 SQL 注入，导致数据库信息泄露。\n修复版本中通过在 TC_Orders_Search 构造函数中对 period_compare 实施操作符白名单校验并将非法值回落为 '='，filter_where 改用 $wpdb-\u003eprepare 以占位符绑定日期与 post_status，切断了外部输入拼接进入 SQL 语句的路径；Sales API 的 api_key 校验对空值改为直接失败，未认证请求无法再进入统计查询。", "effects": [{"comp_name": "tickera-event-ticketing-system", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,3.6.0.7)", "min_fixed_version": "3.6.0.7", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-10-11", "level": "Critical", "mps_id": "MPS-4wqj-klu9", "poc": false, "poc_url": [], "published_time": "2026-10-11", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-4wqj-klu9", "name": "https://www.oscs1024.com/hd/MP b6e30b4 仍使用同一 Jwt:Key。", "effects": [{"comp_name": "botsharp", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,5.2.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "使用硬编码的密码学密钥", "kind_en": "使用硬编码密钥", "last_modified_time": "2026-10-11", "level": "Critical", "mps_id": "MPS-bjwr-7hgl", "poc": false, "poc_url": [], "published_time": "2026-10-11", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-bjwr-7hgl", "name": "https://www.oscs1024.com/hd/MPS-bjwr-7hgl"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-108860", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-108860"}, {"url": "https://hackmd.io/@1ExmmukzRMWN7B4gQ4W-4Q/scisharp-botsharp-public-jwt-signing-key", "name": ""}, {"url": "https://github.com/SciSharp/BotSharp/blob/a11ee0317cab5c619df1cb5d0c4fc39d1b6e30b4/src/WebStarter/appsettings.json#L16-L20", "name": ""}, {"url": "https://github.com/SciSharp/BotSharp/blob/a11ee0317cab5c619df1cb5d0c4fc39d1b6e30b4/src/Infrastructure/BotSharp.OpenAPI/BotSharpOpenApiExtensions.cs#L46-L57", "name": ""}, {"url": "https://github.com/SciSharp/BotSharp", "name": ""}, {"url": "https://www.vulncheck.com/advisories/botsharp-through-5.2.0-authentication-bypass-via-hard-coded-jwt-signing-key", "name": "VulnCheck Advisory: BotSharp through 5.2.0 Authentication Bypass via Hard-Coded JWT Signing Key"}], "scope_influence": "", "tags": ["AI", "应用软件"], "title": "BotSharp认证绕过", "_translated": true, "_saved_at": "2026-10-11T15:15:52+00:00", "_first_saved_at": "2026-10-11T15:15:52+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-bjwr-7hgl"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过向受信任的数据序列化过程中添加恶意数据，从而在序列化和反序列化过程中执行恶意代码的攻击漏洞。这种漏洞通常存在于使用序列化 (serialization) 机制存储和传输数据的程序中。\n", "title": "什么是反序列化"}, {"content": "- 注入攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码注入到程序中，从而实 "content": "- 直接访问敏感信息：攻击者可以通过直接访问不正确配置或不受保护的资源来获取敏感信息，如通过公开可访问的URL、未经授权的文件目录访问等。\n- 越权访问：攻击者可能利用访问控制错误或不正确的权限配置来获取他们没有权限访问的敏感信息。\n- 错误信息披露：应用程序在错误处理过程中可能泄露敏感信息，例如将错误消息中的敏感数据返回给客户端或显示在日志文件中。\n- 信息泄露通过响应：攻击者可能利用应用程序在响应中不正确地包含敏感信息，如通过网页源代码、响应头部或响应消息体中的敏感数据。", "title": "未授权敏感信息泄露常见的攻击方式"}, {"content": "- 访问控制：确保只有经过授权的用户能够访问敏感信息，使用强大的身份验证和授权机制。\n- 数据加密：对于敏感信息，使用适当的加密算法对数据进行加密，包括数据传输和存储过程中的加密。\n- 错误处理和日志安全：正确处理错误情况，避免在错误消息中暴露敏感信息。同时，确保日志记录功能的安全性，避免将敏感信息记录在日志文件中。\n- 安全配置和最佳实践：遵循安全最佳实践，对应用程序、服务器和系统进行适当的配置，包括访问控制、权限管理、密码策略等。\n- 审计和监控：实施日志审计和监控机制，及时检测和响应任何异常活动或潜在的信息暴露事件。\n- 安全开发实践：在应用程序开发过程中，进行安全代码审查、漏洞扫描和安全测试，以及敏感信息的正确处理和保护。", "title": "如何预防未授权敏感信息泄露"}], "cnvd_id": "", "cve_id": "CVE-2026-83943", "cvss": {"cvssv31": [{"source": "secure@microsoft.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:C/C:H/I:H/A:N", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:C/C:H/I:H/A:N", "cwe": "CWE-200", "description": "Azure API Center 是 Microsoft Azure 提供的全托管 API 治理与编目服务，为闭源云服务，用于集中登记、发现和治理组织内的 API 资产及其版本、定义文件与元数据。\n受影响版本中，该云服务在面向网络的未授权访问路径上存在敏感信息暴露缺陷，未授权攻击者可通过网络获取本不应访问的敏感信息，官方评估该漏洞无需攻击者权限与用户交互，利用复杂度较高（AC:H），漏洞类型为信息泄露，官方未披露更细粒度的漏洞代码细节。\n修复版本中通过微软在服务端实施的安全修复切断了未授权访问路径，微软已完全缓解该漏洞，客户无需升级版本或更改配置，官方未观察到该漏洞被公开披露或在野利用。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "未授权敏感信息泄露", "kind_en": "向未经授权的行为者泄露敏感信息", "last_modified_time": "2026-10-09", "level": "High", "mps_id": "MPS-jt7e-g4or", "poc": false, "poc_url": [], "published_time": "2026-10-09", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-jt7e-g4or", "name": "https://www.oscs1024.com/hd/MPS-jt7e-g4or"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-83943", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-83943"}, {"url": "https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-83943", "name": "Azure API Center Information Disclosure Vulnera nfluence": "", "tags": ["应用软件"], "title": "The Voux本地文件包含漏洞", "_translated": true, "_saved_at": "2026-10-09T15:44:18+00:00", "_first_saved_at": "2026-10-09T15:44:18+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-6mgi-5l0w"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-83947", "cvss": {"cvssv31": [{"source": "secure@microsoft.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:N/I:H/A:N", "severity": "high", "base_score": 7.7}]}, "cvss_score": 7.7, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:N/I:H/A:N", "cwe": "CWE-862", "description": "Azure Event Grid 是微软 Azure 提供的全托管事件路由服务，为闭源云服务，用于在应用与 Azure 服务之间以发布/订阅模式集中转发事件，并支持 Webhook 等多种事件处理目标。\n受影响版本中，服务端对特定网络功能缺少授权校验（CWE-862），持有低权限授权账户的攻击者可跨网络冒充合法实体，伪造事件来源或身份；官方 CVSS 评估该问题作用域改变（S:C），仅造成完整性影响（C:N/I:H/A:N），无需用户交互。\n修复版本中通过服务端更新补齐缺失的授权校验，切断攻击者冒充合法实体的路径；微软已在 Azure Event Grid 服务端完成完全缓解，客户无需执行任何操作，该 CVE 的发布目的为透明度说明。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-10-09", "level": "High", "mps_id": "MPS-x4z1-ourj", "poc": false, "poc_url": [], "published_time": "2026-10-09", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-x4z1-ourj", "name": "https://www.oscs1024.com/hd/MPS-x4z1-ourj"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-83947", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-83947"}, {"url": "https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-83947", "name": "Azure Event Grid Spoofing Vulnerability"}], "scope_influence": "", "tags": ["应用软件"], "title": "Azure Event Grid 欺骗漏洞", "_translated": true, "_saved_at": "2026-10-09T08:19:22+00:00", "_first_saved_at": "2026-10-09T01:38:38+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-x4z1-ourj"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能有效地控制资源的使用，导致攻击者可以利用这个漏洞耗尽应用程序所依赖的资源。这些资源可以是计算资源（CPU、内存）、网络带宽、数据库连接或其他系统资源。攻击者可以通过发送特制的请求、恶意输入或其他方式，使应用程序消耗大量资源，导致拒绝服务或系统崩溃。", "title": "什么是拒绝服务"}, {"content": "- 消耗计算资源：攻击者可以发送计算密集型的请求，例如复杂的计算、无限循环或递归操作，以耗尽应用程序的计算资源，导致应用程序无法响应其他请求。\r\n- 消耗内存资源：攻击者可以发送大量的数据或恶意输入，以导致应用程序消耗过多的内存资源，从而使系统的可用内存耗尽，并导致应用程序崩溃或变得不可用。\r\n- 消耗网络带宽：攻击者可以发送大量的请求或大型数据包，以消耗应用程序所依赖的网络带宽。这会导致其他合法用户无法正常访问应用程序或降低系统的整体网络性能。\r\n- 消耗存储资源：攻击者可以发送大量的请求或上传大文件，以耗尽应用程序的存储资源，导致系统无法处理其他请求或存储新的数据。", "title": "拒绝服务常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对输入数据进行合理的验证和过滤，防止恶意输入导致资源消耗过高。\r\n- 实施资源限制：应用程序应该实施适当的资源限制策略，例如限制计算操作的时间或次数，限制内存使用量，限制并发连接数等，以防止资源被耗尽。\r\n- 异常处理与错误恢复：应用程序应该具备健壮的异常处理和错误恢复机制，以防止因意外错误导致资源泄漏或无法释放的情况。\r\n- 资源监控与警报：应用程序应该实施适当的资源监控和警报机制，及时发现异常的资源消耗情况，并采取相应的措施来应对。\r\n- 压力测试与性能优化：应用程序应该进行压力测试，以评估其在高负载情况下的性能，并进行必要的性能优化，以确保能够有效地处理大量请求而不耗尽资源。", "title": "如何预防拒绝服务"}], "cnvd_id": "", "cve_id": "CVE-2026-84276", "cvss": {"cvssv31": [{"source": "psirt@us.ibm.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-400", "description": "IBM Guardium Data Protection 是 IBM 推出的商业数据安全平台，用于数据库活动监控、敏感数据发现与安全合规审计，edge-controller 是其边缘架构中负责与集中管理平面交互、接收并执行任务的控制组件，产品源码闭源。\n受影响版本中，edge-controller 的 gRPC 服务对远端提交的任务数据缺少类型校验，攻击者无需身份认证，通过网络向该服务发送畸形任务数据触发未受保护的类型断言，断言失败导致 edge-controller 进程意外终止，服务不可用，官方公告确认受影响版本为 12.2.2。\n修复版本中通过官方安全更新完成对该问题的修复，IBM 在 12.2.3 版本中提供修复程序（Fix Central 修复包 SqlGuard_12.0p15004_Edge），升级后畸形任务数据不再导致 edge-controller 进程终止，服务可用性恢复正常。", "effects": [{"comp_name": "guardium_data_protection", "ecosystem": "linux", "versions": [{"affected_version": "[12.2.2,12.2.3)", "min_fixed_version": "12.2.3", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "拒绝服务", "kind_en": "不受控制的资源消耗", "last_modified_time": "2026-10-09", "level": "High", "mps_id": "MPS-75ft-e61n", "poc": false, "poc_url": [], "published_time": "2026-10-09", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-75ft-e61n", "name": "https://www.oscs1024.com/hd/MPS-75ft-e61n"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-84276", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-84276"}, {"url": "https://www.ibm.com/support/pages/node/7288627", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "IBM Guardium 边缘控制器拒绝服务漏洞", "_translated": true, "_saved_at": "2026-10-08T21:43:37+00:00", "_first_saved_at": "2026-10-08T21:43:37+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-75ft-e61n"}, {"analysis_status": 0, "articles": [{"content": "- 条件竞争漏洞是由于程序中存在多个代码块同时访问同一个条件判断语句而导致的错误。在程序中，条件判断语句通常用于决定是否执行某些代码块。当一个程序有多个代码块同时访问同一个条件判断语句时，这些代码块可能会同时执行，从而导致程序执行结果出现不可预测的错误。", "title": "什么是竞争条件"}, {"content": "- 线程切换攻击：线程切换攻击是指攻击者通过利用竞争条件漏洞，使程序在执行时频繁切换线程，从而导致系统资源耗尽，最终实现拒绝服务攻击。\n- 内存泄漏攻击：内存泄漏攻击是指攻击者通过利用竞争条件漏洞，使得程序不断申请内存，但最终无法释放内存，从而导致内存泄漏，最终程序崩溃。\n- 缓存穿透攻击：缓存穿透攻击是指攻击者通过利用竞争条件漏洞，使得程序在访问缓存时，被缓存的数据并非当前最新的数据，从而攻击者可以获取到未更新的数据。\n- 指令重放攻击：指令重放攻击是指攻击者通过利用竞争条件漏洞，在程序执行时，将先前保存的指令序列重新执行，从而实现绕过某些验证，获取系统权限等攻击目的。\n", "title": "竞争条件常见的攻击方式"}, {"content": "- 使用互斥锁：在条件判断语句中，使用互斥锁来确保只有一个代码块能够访问变量。使用互斥锁可以提高程序的安全性和可靠性。\n- 使用条件封印：在条件判断语句中，将可能会修改变量的代码块封印起来，以确保这些代码块无法被其他代码块访问。\n- 使用条件过滤：在条件判断语句中，使用条件过滤来过滤掉那些不可能发生的条件判断语句。例如，对于一个包含多个条件判断语句的循环，可以只保留其中一个条件的判断，而将其他条件的判断语句过滤掉。\n- 使用性能优化：对于一些条件判断语句，可以使用性能优化来避免条件竞争的情况。例如，可以使用数组或链表等数据结构来存储条件判断语句中的变量，从而避免条件竞争的情况。", "title": "如何预防竞争条件"}], "cnvd_id": "", "cve_id": "CVE-2026-97032", "cvss": {}, "cvss_score": 7.5, "cvss_vector": "", "cwe": "CWE-362", "description": "Go 是 Google 开源的静态编译型编程语言，其标准库 net/http 内置 HTTP/2 服务器实现，该实现以 golang.org/x/net/http2 为上游，在 Go 1.26 打包于 net/http/h2_bundle.go，Go 1.27 起迁移至 net/http/internal/http2，广泛用于构建各类网络服务。\n受影响版本中，HTTP/2 服务器在处理客户端 SETTINGS 帧时，processSetting 对 SETTINGS_HEADER_TABLE_SIZE 立即调用 sc.hpackEncoder.SetMaxDynamicTableSize(s.Val) 修改连接共享的 HPACK 编码器，而异步写协程 writeFrameAsync 正在使用同一编码器编码响应 HEADERS 帧，两个 goroutine 无同步并发访问编码器形成数据竞争，恶意客户端在同一连接上反复发送请求并持续变更头部表大小，能够破坏编码器状态并触发 panic，导致服务器崩溃。\n修复版本中通过缓存客户端发送的 SETTINGS_HEADER_TABLE_SIZE，不再立即应用，改为在 startFrameWrite 发起下一次帧写入前按先最小值后最新值的顺序调用 SetMaxDynamicTableSize，使编码器修改只发生在无帧写入窗口内，消除数据竞争；修复随 Go 1.27.2 与 Go 1.26.9 发布，并同步至 golang.org/x/net v0.60.0。", "effects": [{"comp_name": "golang.org/x/net", "ecosystem": "go", "versions": [{"affected_version": "(-∞,0.60.0)", "min_fixed_version": "0.60.0", "repository": "go", "solutions": [], "upstream": true}]}, {"comp_name": "stdlib", "ecosystem": "go", "versions": [{"affected_version": "[1.27.0,1.27.2)", "min_fixed_version": "1.27.2", "repository": "go", "solutions": [], "upstream": true}, {"affected_version": "(-∞,1.26.9)", "min_fixed_version": "1.26.9", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "竞争条件", "kind_en": "使用共享资源并发执行且同步不正确（“竞争条件”）", "last_modified_time": "2026-10-09", "level": "High", "mps_id": "MPS-f28e-d41e", "poc": false, "poc_url": [], "published_time": "2026-10-09", "reference_url_list": [{"url": "https://www.openwall.com/lists/oss-security/2026/10/08/9", "name": ""}, {"url": "https://go.dev/issue/81867", "name": ""}, {"url": "https://github.com/golang/go/commit/ba8f5c9adecf4546e95cbeacb816f39ec88be183", "name": ""}, {"url": "https://github.com/golang/go/commit/12acaf3086437e140e2dd3b7d2c30fdd633c5fe0", "name": ""}, {"url": "https://github.com/golang/go/commit/6e049521882c944afc1e519a83971ec421dc2974", "name": ""}, {"url": "https://github.com/golang/net/commit/18ece0ce30bc35fa81fe72028bf309bb3ff3f4a5", "name": ""}, {"url": "https://go-review.googlesource.com/c/go/+/847313", "name": ""}, {"url": "https://go.dev/doc/devel/release#go1.27.2", "name": ""}], "scope_influence": "", "tags": ["go"], "title": "Go HTTP/2 HPACK 竞态致服务崩溃", "_translated": true, "_saved_at": "2026-10-08T21:43:36+00:00", "_first_saved_at": "2026-10-08T21:43:36+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-f28e-d41e"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-78659", "cvss": {}, "cvss_score": 7.5, "cvss_vector": "", "cwe": "CWE-770", "description": "golang.org/x/net 是 Go 官方维护的开源网络扩展库（BSD-3-Clause 许可），其 http2 包提供 HTTP/2 服务端与客户端实现，被大量 Go 服务直接依赖或经标准库 net/http 间接引入。\n受影响版本中，HTTP/2 服务端在 Framer 的 readMetaFrame 方法中使用单一 remainSize 预算按头部字面字节数扣减 maxHeaderListSize 限额；客户端在请求 HEADERS 头部中携带名为 trailer 的头部时，该头部按其少量报文字节计入预算，其以逗号分隔声明的字段数量不消耗预算，服务端随后按声明逐条填充 Request.Trailer 映射，每个映射条目产生固定内存开销，攻击者可绕过 Server.MaxHeaderValueCount 与 Server.MaxHeaderBytes 限制，以极小的请求成本使服务端内存不成比例增长并造成拒绝服务。\n修复版本中通过在 readMetaFrame 中为 trailer 声明引入独立的 trailersRemainSize 预算，并按声明字段数量乘以单个 HPACK 头部字段的固定开销计算内存占用，超限时同步清零头部与 trailer 两份预算，使 trailer 声明同样受头部大小限制约束，切断了以少量报文字节换取大量映射条目的资源消耗路径。", "effects": [{"comp_name": "golang.org/x/net", "ecosystem": "go", "versions": [{"affected_version": "(-∞,0.60.0)", "min_fixed_version": "0.60.0", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_ 本提前闭合带引号参数，后续内容被解析为独立参数；NormalizeTextForPromptTemp 仅过滤 \\r、\\n、\\t，不会中和反斜杠与引号，攻击者因此可通过文档中被选中的文本或粘贴到翻译对话框源文框的文本，向 Grok Build、Claude Code、OpenAI Codex 注入 --model、--cwd 或 --always-approve、--dangerously-skip-permissions、--dangerously-bypass-approvals-and-sandbox 等任意参数。\n修复版本中通过重写 src/base/CmdLineArgsIter.cpp 的 QuoteCmdLineArgTemp 切断该链路：该函数按 CommandLineToArgvW 规则始终用引号包裹整个参数，将引号前的连续反斜杠按 2n+1 倍输出后输出转义引号、结尾反斜杠双倍输出，使含引号与反斜杠的文本无法突破参数边界；src/SelectionTranslate.cpp 三个翻译命令行构建函数与 AI 聊天侧边栏各 Provider 的命令行拼接统一改用该函数，并新增经 CommandLineToArgvW 回环验证的回归测试确认注入载荷保持为单一参数。", "effects": [{"comp_name": "sumatrapdf", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,3.6.1]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "参数注入或修改", "kind_en": "命令中参数分隔符的不正确中和（“参数注入”）", "last_modified_time": "2026-10-09", "level": "High", "mps_id": "MPS-1fqh-v76x", "poc": false, "poc_url": [], "published_time": "2026-10-09", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-1fqh-v76x", "name": "https://www.oscs1024.com/hd/MPS-1fqh-v76x"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-107802", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-107802"}, {"url": "https://github.com/sumatrapdfreader/sumatrapdf/security/advisories/GHSA-xvxg-cwmx-hr7j", "name": "https://github.com/sumatrapdfreader/sumatrapdf/security/advisories/GHSA-xvxg-cwmx-hr7j"}, {"url": "https://github.com/sumatrapdfreader/sumatrapdf/commit/6b88a751ab34a28bafca3bdd635aaa2f4c1e06b6", "name": "https://github.com/sumatrapdfreader/sumatrapdf/commit/6b88a751ab34a28bafca3bdd635aaa2f4c1e06b6"}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "SumatraPDF 参数注入漏洞", "_translated": true, "_saved_at": "2026-10-09T01:38:43+00:00", "_first_saved_at": "2026-10-09T01:38:43+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-1fqh-v76x"}, {"analysis_status": 0, "articles": [{"content": "跨站点请求伪造 (CSRF)通过利用网站对用户请求的信任进行攻击。当用户在网站A登录并在同一浏览器会话中访问网站B时，攻击者可以构造特制的请求并诱使用户执行，以使网站B误以为这些请求是用户合法发起的。\n攻击者通常通过欺骗用户点击恶意链接、在受信任的网站中植入恶意代码或通过钓鱼等手段来实施CSRF攻击，一旦用户执行了恶意请求，攻击者可以以用户的身份执行任意操作，包括更改用户密码、发起资金转账或删除重要数据等。", "title": "什么是CSRF"}, {"content": "- 链接欺骗：攻击者通过向用户发送包含恶意链接的电子邮件或社交媒体消息，诱使用户点击并执行恶意请求。\n- 图片引用攻击：攻击者通过在恶意网站上包含指向目标网站的图片引用，以触发用户浏览器自动发送目标网站的请求。\n- XSS利用：如果目标网站存在XSS漏洞，攻击者可以注入恶意脚本，以使用户在浏览器中执行恶意请求。", "title": "CSRF常见的攻击方式"}, {"content": "- 随机令牌：网站可以在每个请求中包含一个随机生成的令牌（CSRF Token），并验证该令牌的有效性，以确认请求的来源是合法的。\n- SameSite Cookie：使用SameSite属性来限制跨站点请求，将Cookie的发送限制在同一站点上，减少了跨站请求伪造的风险。\n- 双重验证：对于敏感操作，网站可以要求用户进行额外的验证，例如输入验证码、提供第二个因素的身份验证等。\n- 强化浏览器策略：网站可以设置Content-Security-Policy（CSP）头，限制浏览器执行恶意脚本的能力，减少CSRF攻击的风险。\n- 限制用户操作：网站可以要求用户在执行敏感操作之前进行明确的确认或授权，防止恶意请求被误触发。\n- 安全编码实践：开发人员应遵循安全编码实践，对用户输入进行适当的验证和过滤，防止恶意请求的注入。", "title": "如何预防CSRF"}], "cnvd_id": "", "cve_id": "CVE-2026-62026", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:L", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:L", "cwe": "CWE-352", "description": "Dashboard Notes 是 MIGHTYminnow 开发的 WordPress 开源插件（GPLv2 协议），用于在站点后台仪表盘中向客户展示便签与操作说明，支持为便签配置颜色、Logo 并按 URL 控制可见范围。\n受影响版本中，插件将 save_widget_context_settings 注册到 admin_init 钩子，使其在任意后台请求上执行；该函数仅检查当前用户是否具备 edit_theme_options 能力，整个插件未调用 wp_verify_nonce 或 check_admin_referer 校验请求合法性，随后把 $_POST['dn'] 提交的便签配置 array_merge 进内存并经 update_option 写入 dashboard_notes_options 选项；攻击者可构造跨站 POST 页面，诱导已登录管理员访问后以该管理员身份篡改仪表盘便签的样式、Logo URL 与可见性配置。\n修复版本中通过，可通过暂时停用该插件缓解；修复方向是在 save_widget_context_settings 处理请求前加入 check_admin_referer 等 nonce 校验，拒绝缺少有效令牌的跨站请求，从而切断上述伪造路径。", "effects": [{"comp_name": "dashboard-notes", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.0.3]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "CSRF", "kind_en": "跨站请求伪造 (CSRF)", "last_modified_time": "2026-10-09", "level": "High", "mps_id": "MPS-1l70-tn5g", "poc": false, "poc_url": [], "published_time": "2026-10-09", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-1l70-tn5g", "name": "https://www.oscs1024.com/hd/MPS-1l70-tn5g"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-62026", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-62026"}, {"url": "https://patchstack.com/database/wordpress/plugin/dashboard-notes/vulnerability/wordpress-dashboard-notes-plugin-1-0-3-cross-site-request-forgery-csrf-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Dashboard Notes 插件 CSRF 漏洞", "_translated": true, "_saved_at": "2026-10-09T15:44:25+00:00", "_first_saved_at": "2026-10-09T15:44:25+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-1l70-tn5g"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-94063", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:L", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:L", "cwe": "CWE-79", "description": "Education Center 是 ThemeREX 开发的商业 WordPress 主题（主题标识 education），面向学校、培训机构与教育中心类网站，通过 ThemeForest 发行，无公开源码仓库。\n受影响版本中，主题在 Web 页面生成过程中未对请求输入进行正确中和处理，未认证攻击者可将恶意脚本拼接到构造链接中，已登录用户点击后脚本在其浏览器会话中反射执行，可窃取会话凭证或以该用户身份执行操作；官方记录显示该问题影响 3.6.12 及更早版本。\n修复版本中通过，可部署 Patchstack 虚拟补丁或 WAF 规则拦截相关反射型载荷，提示用户避免点击来源不明的链接，待厂商发布包含输入中和处理的更新版本后及时升级。", "effects": [{"comp_name": "education", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,3.6.12]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-10-09", "level": "High", "mps_id": "MPS-743r-q2ni", "poc": false, "poc_url": [], "published_time": "2026-10-09", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-743r-q2ni", "name": "https://www.oscs1024.com/hd/MPS-743r-q2ni"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-94063", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-94063"}, {"url": "https://patchstack.com/database/wordpress/theme/education/vulnerabil , "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.16.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-10-09", "level": "High", "mps_id": "MPS-ydhl-ukrn", "poc": false, "poc_url": [], "published_time": "2026-10-09", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ydhl-ukrn", "name": "https://www.oscs1024.com/hd/MPS-ydhl-ukrn"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-40804", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-40804"}, {"url": "https://patchstack.com/database/wordpress/plugin/ablocks/vulnerability/wordpress-ablocks-plugin-2-15-0-cross-site-scripting-xss-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "aBlocks 反射型 XSS", "_translated": true, "_saved_at": "2026-10-08T21:43:40+00:00", "_first_saved_at": "2026-10-08T21:43:40+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ydhl-ukrn"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-103634", "cvss": {}, "cvss_score": 8.6, "cvss_vector": "", "cwe": "CWE-787", "description": "Apache DataSketches C++（datasketches-cpp）是 Apache 软件基金会开源的流式数据概要算法库，提供 Count-Min、Theta、HLL 等概要结构，用于大数据系统中的近似统计与频率估计。\n受影响版本中，count_min_sketch 的公开反序列化入口 deserialize() 在非空分支执行的长度检查 ensure_minimum_memory(size, sizeof(W) * (1 + nbuckets * nhashes)) 未计入已读取的 16 字节前导，截断的序列化数据可通过检查，使权重与表数据的读取越过输入缓冲区末尾最多 16 字节；同时构造函数以 32 位运算计算 num_hashes 与 num_buckets 的乘积作为表长度，攻击者提交使该乘积回绕为 0 的参数组合后，2^30 上限检查同样以 32 位计算而失效，sketch 以空表反序列化成功，后续 update 与 get_estimate 将读写堆分配之外的内存，破坏堆数据并导致崩溃。\n修复版本中通过将输入长度检查改为包含 16 字节前导与实际表长度，并以 64 位运算计算表大小乘积与上限检查，使回绕的参数组合在构造阶段被拒绝，消除了反序列化与后续访问中的越界读写。", "effects": [{"comp_name": "datasketches-cpp", "ecosystem": "linux", "versions": [{"affected_version": "[4.1.0,5.3.0)", "min_fixed_version": "5.3.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-10-10", "level": "High", "mps_id": "MPS-b786-c043", "poc": false, "poc_url": [], "published_time": "2026-10-10", "reference_url_list": [{"url": "http://www.mail-archive.com/announce@apache.org/msg12258.html", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-103634", "name": ""}, {"url": "https://datasketches.apache.org", "name": ""}, {"url": "https://github.com/apache/datasketches-cpp/commit/70505c331d12551cce268a1417c90b8a698222d3", "name": ""}, {"url": "https://github.com/apache/datasketches-cpp/pull/538", "name": ""}, {"url": "https://github.com/apache/datasketches-cpp/releases/tag/5.3.0", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "DataSketches C++越界读写漏洞", "_translated": true, "_saved_at": "2026-10-10T00:26:00+00:00", "_first_saved_at": "2026-10-10T00:26:00+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-b786-c043"}, {"analysis_status": 0, "articles": [{"content": "跨界内存读是指应用程序在读取内存时，未正确验证或限制读取的内存范围。攻击者利用这种漏洞可以读取应用程序内存中的敏感数据，如密码、加密密钥、会话令牌等。常见的原因是由于缓冲区溢出、格式化字符串漏洞或其他内存错误导致的。", "title": "什么是越界读取"}, {"content": "攻击者可以通过不当构造的输入来触发跨界内存读漏洞。攻击者可能会通过向应用程序发送特定的输入，使其读取超过预期的内存区域。攻击者可以利用这个漏洞来获取敏感信息，如其他用户的数据、操作系统的敏感数据或应用程序的内部状态。", "title": "越界读取常见的攻击方式"}, {"content": "- 输入验证和限制：应用程序应对所有输入数据进行严格的验证和限制。确保输入数据的长度、格式和内容符合预期，避免超出缓冲区或访问非预期的内存区域。\n- 内存安全编程实践：开发人员应使用安全的编程实践，如避免使用不安全的函数、正确处理内存分配和释放操作，以及遵循最小特权原则。\n- 使用安全的编程语言和库：选择使用安全性较高的编程语言和库，这些语言和库在内存管理和安全性方面提供了更多的保护机制。\n- 定期进行代码审查和安全测试：定期审查应用程序的代码，并进行安全测试，以发现潜在的跨界内存读漏洞。使用静态代码分析工具和漏洞扫描工具来辅助检测和修复问题。\n- 实施防御性编程技术：应用程序应采用防御性编程技术，如使用随机化地址空间布局（ASLR）、堆栈保护机制（如堆栈溢出保护）和数据执行预防（DEP）等。\n- 及时更新和修补：及时应用程序和操作系统的安全更新和补丁，以确保已知的跨界内存读漏洞得到修复。及时更新相关软件和库，以避免使用已知存在漏洞的版本。", "title": "如何预防越界读取"}], "cnvd_id": "", "cve_id": "CVE-2026-107837", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:H", "severity": "high", "base_score": 8.2}]}, "cvss_score": 8.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:H", "cwe": "CWE-125", "description": "RIOT 是面向物联网与嵌入式设备的开源微控制器操作系统，其 GNRC 网络栈在 IEEE 802.15.4 等低功耗链路上提供 6LoWPAN 分片与重组能力。\n受影响版本中，sys/net/gnrc/network_layer/sixlowpan/gnrc_sixlowpan.c 的 _receive() 函数收到报文后仅执行 payload-\u003esize 不小于 1 字节的最小载荷检查，随后通过 sixlowpan_frag_is((sixlowpan_frag_t *)dispatch) 读取调度字节判定报文为分片，未校验报文 snip 是否容纳完整的 sixlowpan_frag_t 头部，攻击者向启用 GNRC 6LoWPAN 分片的设备发送带分片调度字节但长度不足的报文后，报文进入 gnrc_sixlowpan_frag_recv()，该函数将 pkt-\u003edata 直接按 sixlowpan_frag_t 或 sixlowpan_frag_n_t 结构解析并读取数据报长度、tag 与 offset 等字段，读取超出数据包缓冲区边界，可导致内存信息泄露与网络栈崩溃。\n修复版本中通过在 sys/include/net/gnrc/sixlowpan.h 新增 sixlowpan_frag_is_snip() 辅助函数，先检查 snip-\u003esize 不小于 sizeof(sixlowpan_frag_t)，对 FRAG_N 分片再要求不小于 sizeof(sixlowpan_frag_n_t)，并让 _receive() 使用该函数完成分片判定，长度不足的报文不再进入分片重组路径，越界读取被消除；修复已合入上游 master（PR #22504），并随 2026.07 版本发布。", "effects": [{"comp_name": "riot", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2026.07)", "min_fixed_version": "2026.07", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss ::memcpy 将 couponCount 个 4 字节 coupon 复制进固定 8 项（32 字节）的堆数组 coupons_，流路径同样按 couponCount 定长读取，最多写入 1020 字节，超出数组末尾最多 988 字节，形成攻击者可控内容的堆越界写，可破坏堆内存导致崩溃并可能为进一步利用创造条件。\n修复版本中通过在两个 newList 重载的复制/读取动作前新增 couponCount 与固定容量 8（1u\u003c\u003cLG_INIT_LIST_SIZE）的比较实现防护，超限即抛出 std::invalid_argument 拒绝该图像，从源头切断越界写入；该修复随 Apache DataSketches C++ 5.3.0 发布。", "effects": [{"comp_name": "datasketches-cpp", "ecosystem": "linux", "versions": [{"affected_version": "[1.0.0-incubating,5.3.0)", "min_fixed_version": "5.3.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "堆缓冲区溢出", "kind_en": "基于堆的缓冲区溢出", "last_modified_time": "2026-10-10", "level": "High", "mps_id": "MPS-9383-2eda", "poc": false, "poc_url": [], "published_time": "2026-10-10", "reference_url_list": [{"url": "http://www.mail-archive.com/announce@apache.org/msg12260.html", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-103501", "name": ""}, {"url": "https://datasketches.apache.org", "name": ""}, {"url": "https://github.com/apache/datasketches-cpp", "name": ""}, {"url": "https://github.com/apache/datasketches-cpp/pull/503", "name": ""}, {"url": "https://github.com/apache/datasketches-cpp/commit/a07e6f6f81953fa8881b258c1cb3df23a1ad9989", "name": ""}, {"url": "https://github.com/apache/datasketches-cpp/commit/805eaf3c5d96bf6263298880be10da30a604faec", "name": ""}, {"url": "https://github.com/apache/datasketches-cpp/releases/tag/5.3.0", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "DataSketches HLL 反序列化堆溢出", "_translated": true, "_saved_at": "2026-10-10T00:26:01+00:00", "_first_saved_at": "2026-10-10T00:26:01+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-9383-2eda"}, {"analysis_status": 0, "articles": [{"content": "跨界内存读是指应用程序在读取内存时，未正确验证或限制读取的内存范围。攻击者利用这种漏洞可以读取应用程序内存中的敏感数据，如密码、加密密钥、会话令牌等。常见的原因是由于缓冲区溢出、格式化字符串漏洞或其他内存错误导致的。", "title": "什么是越界读取"}, {"content": "攻击者可以通过不当构造的输入来触发跨界内存读漏洞。攻击者可能会通过向应用程序发送特定的输入，使其读取超过预期的内存区域。攻击者可以利用这个漏洞来获取敏感信息，如其他用户的数据、操作系统的敏感数据或应用程序的内部状态。", "title": "越界读取常见的攻击方式"}, {"content": "- 输入验证和限制：应用程序应对所有输入数据进行严格的验证和限制。确保输入数据的长度、格式和内容符合预期，避免超出缓冲区或访问非预期的内存区域。\n- 内存安全编程实践：开发人员应使用安全的编程实践，如避免使用不安全的函数、正确处理内存分配和释放操作，以及遵循最小特权原则。\n- 使用安全的编程语言和库：选择使用安全性较高的编程语言和库，这些语言和库在内存管理和安全性方面提供了更多的保护机制。\n- 定期进行代码审查和安全测试：定期审查应用程序的代码，并进行安全测试，以发现潜在的跨界内存读漏洞。使用静态代码分析工具和漏洞扫描工具来辅助检测和修复问题。\n- 实施防御性编程技术：应用程序应采用防御性编程技术，如使用随机化地址空间布局（ASLR）、堆栈保护机制（如堆栈溢出保护）和数据执行预防（DEP）等。\n- 及时更新和修补：及时应用程序和操作系统的安全更新和补丁，以确保已知的跨界内存读漏洞得到修复。及时更新相关软件和库，以避免使用已知存在漏洞的版本。", "title": "如何预防越界读取"}], "cnvd_id": "", "cve_id": "CVE-2026-103636", "cvss": {}, "cvss_score": 7.9, "cvss_vector": "", "cwe": "CWE-125", "description": "Apache DataSketches 是 Apache 软件基金会开源的流式数据草图（sketch）算法库，datasketches-cpp 为其 C++ 实现，提供 VarOpt 抽样等近似统计草图，应用通过库公开的 deserialize 接口还原序列化数据中的草图。\n受影响版本中，var_opt_union::deserialize() 反序列化非空 union 前仅执行 ensure_minimum_memory(size, 8) 的 8 字节长度检查，随后仍按 32 字节前导区读取 items_seen、outer_tau_numer、outer_tau_denom 等字段，长度在 8 至 31 字节之间的截断输入最多可越过输入缓冲区末尾读取 24 字节；同时内嵌 sketch 的长度由 size - (PREAMBLE_LONGS_NON_EMPTY \u003c\u003c 3) 以无符号整数计算，size 小于 32 时回绕为极大值，使内嵌 sketch 自身的长度检查无法把读取限制在输入范围内，越界读取的字节可进入反序列化后的 union 状态，造成进程崩溃（拒绝服务）并可能暴露相邻内存内容。\n修复版本中通过在读取非空前导区前增加 ensure_minimum_memory(size, PREAMBLE_LONGS_NON_EMPTY \u003c\u003c 3) 校验，要求输入至少包含完整的 32 字节非空前导区，长度不足时在读取前抛出 std::out_of_range 异常，切断越界读取与长度回绕路径，消除崩溃与内存信息泄露风险。", "effects": [{"comp_name": "datasketches-cpp", "ecosystem": "linux", "versions": [{"affected_version": "[2.0.0-incubating,5.3.0)", "min_fixed_version": "5.3.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界读取", "kind_en": "越界读取", "last_modified_time": "2026-10-10", "level": "High", "mps_id": "MPS-5e48-0ebb", "poc": false, "poc_url": [], "published_time": "2026-10-10", "reference_url_list": [{"url": "http://www.mail-archive.com/announce@apache.org/msg12256.html", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-103636", "name": ""}, {"url": "https://github.com/apache/datasketches-cpp/pull/538", "name": ""}, {"url": "https://github.com/apache/datasketches-cpp/commit/412c47efa67e3c5e601bb0db1a97778eaca9c724", "name": ""}, {"url": "https://github.com/apache/datasketches-cpp/releases/tag/5.3.0", "name": ""}, {"url": "https://datasketches.apache.org", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "DataSketches C++ VarOpt反序列化越界读取漏洞", "_translated": true, "_saved_at": "2026-10-10T00:26:03+00:00", "_first_saved_at": "2026-10-10T00:26:03+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-5e48-0ebb"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-92705", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "cwe": "CWE-829", "description": "Aegisub 是 TypesettingTools 维护的开源跨平台字幕编辑器，采用 C++ 开发，用于字幕制作、时间轴调整与特效制作，并支持通过 Lua Automation 脚本扩展功能。\n受影响版本中，用户打开字幕文件时 SubsController::Load 发出的文件打开事件会触发 Automation4::LocalScriptManager::Reload，该方法读取 ASS 文件 Aegisub Project Garbage 节中 Automation Scripts 元数据引用的本地脚本路径，不询问用户是否信任脚本作者便直接调用 ScriptFactory::CreateFromFile 加载并执行对应脚本，攻击者分发恶意 ASS 文件及配套 Lua 脚本可在用户打开文件时以 Aegisub 进程权限执行任意代码；3.4.0 至 3.4.2 中 agi::fs::HasExtension 以 std::string 保留 NUL 之后字符校验扩展名，而文件系统操作按 NUL 截断路径，构造同时满足 ASS 与 Lua 语法的单一文件可在元数据中以 .lua 扩展名引用自身并被执行，形成单文件攻击变体。\n修复版本中通过三项修改切断攻击链：加载本地 Automation 脚本前弹出确认对话框并列出待加载脚本，用户确认后才加载执行；agi::fs::HasExtension 改为按 C 字符串截断，与文件系统操作保持一致；解析 Aegisub Project Garbage 与 Extradata 行时将嵌入的 NUL 字符替换为 Unicode 替换符，阻止单文件变体引用自身。", "effects": [{"comp_name": "Aegisub", "ecosystem": "linux", "versions": [{"affected_version": "[3.2.0,3.5.0)", "min_fixed_version": "3.5.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "从非可信控制范围包含功能例程", "kind_en": "包含来自不可信控制领域的功能", "last_modified_time": "2026-10-10", "level": "High", "mps_id": "MPS-z0o7-w6rl", "poc": false, "poc_url": [], "published_time": "2026-10-10", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-z0o7-w6rl", "name": "https://www.oscs1024.com/hd/MPS-z0o7-w6rl"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-92705", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-92705"}, {"url": "https://github.com/TypesettingTools/Aegisub/security/advisories/GHSA-67hq-5vgg-6f23", "name": "https://github.com/TypesettingTools/Aegisub/security/advisories/GHSA-67hq-5vgg-6f23"}, {"url": "https://github.com/TypesettingTools/Aegisub/commit/0a3073d59f10432eeebea65018b02ef4d0a87fff", "name": "https://github.com/TypesettingTools/Aegisub/commit/0a3073d59f10432eeebea65018b02ef4d0a87fff"}, {"url": "https://github.com/TypesettingTools/Aegisub/commit/b5bf23979e7453f7b1cc8ffeb82b3cc2d2ca75e6", "name": "https://github.com/TypesettingTools/Aegisub/commit/b5bf23979e7453f7b1cc8ffeb82b3cc2d2ca75e6"}, {"url": "https://github.com/TypesettingTools/Aegisub/commit/e4099055711cce327840870c050ce46e58f4aee0", "name": "https://github.com/TypesettingTools/Aegisub/commit/e4099055711cce327840870c050ce46e58f4aee0"}], "scope_influence": "", "tags": ["应用软件"], "title": "Aegisub任意代码执行漏洞", "_translated": true, "_saved_at": "2026-10-10T00:26:07+00:00", "_first_saved_at": "2026-10-10T00:26:07+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-z0o7-w6rl"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能有效地控制资源的使用，导致攻击者可以利用这个漏洞耗尽应用程序所依赖的资源。这些资源可以是计算资源（CPU、内存）、网络带宽、数据库连接或其他系统资源。攻击者可以通过发送特制的请求、恶意输入或其他方式，使应用程序消耗大量资源，导致拒绝服务或系统崩溃。", "title": "什么是拒绝服务"}, {"content": "- 消耗计算资源：攻击者可以发送计算密集型的请求，例如复杂的计算、无限循环或递归操作，以耗尽应用程序的计算资源，导致应用程序无法响应其他请求。\r\n- 消耗内存资源：攻击者可以发送大量的数据或恶意输入，以导致应用程序消耗过多的内存资源，从而使系统的可用内存耗尽，并导致应用程序崩溃或变得不可用。\r\n- 消耗网络带宽：攻击者可以发送大量的请求或大型数据包，以消耗应用程序所依赖的网络带宽。这会导致其他合法用户无法正常访问应用程序或降低系统的整体网络性能。\r\n- 消耗存储资源：攻击者可以发送大量的请求或上传大文件，以耗尽应用程序的存储资源，导致系统无法处理其他请求或存储新的数据。", "title": "拒绝服务常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对输入数据进行合理的验证和过滤，防止恶意输入导致资源消耗过高。\r\n- 实施资源限制：应用程序应该实施适当的资源限制策略，例如限制计算操作的时间或次数，限制内存使用量，限制并发连接数等，以防止资源被耗尽。\r\n- 异常处理与错误恢复：应用程序应该具备健壮的异常处理和错误恢复机制，以防止因意外错误导致资源泄漏或无法释放的情况。\r\n- 资源监控与警报：应用程序应该实施适当的资源监控和警报机制，及时发现异常的资源消耗情况，并采取相应的措施来应对。\r\n- 压力测试与性能优化：应用程序应该进行压力测试，以评估其在高负载情况下的性能，并进行必要的性能优化，以确保能够有效地处理大量请求而不耗尽资源。", "title": "如何预防拒绝服务"}], "cnvd_id": "", "cve_id": "CVE-2026-107839", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-400", "description": "ageLANServer 是一个以 AGPL-3.0 协议开源的跨平台 Web 服务器与启动器，用于在离线或局域网环境中为《帝国时代》与《神话时代》系列游戏提供多人对战服务，其内置的 AoE3 游戏服务器默认以 HTTPS 对外监听。\n受影响版本中，AoE3 的 POST /game/cloud/getFileURL 处理器经 i.Bind 使用 json.NewDecoder 直接解码请求体，全程没有请求体大小限制，也未对攻击者可控的 JSON names 数组长度设置上限，随后以 make(i.A, len(req.Names.Data)) 按数组长度直接预分配响应切片；默认配置 Authentication='disabled' 时，远程攻击者无需真实游戏凭据，通过 /game/login/platformlogin 获取会话后提交一条超大请求，便能迫使服务器分配与输入规模成正比的内存，导致进程崩溃或挂起、已连接玩家全部掉线，服务在重启前持续不可用。\n修复版本中通过在路由链新增 MaxBodySizeMiddleware 中间件并以 http.MaxBytesReader 将请求体上限设为 1MB，超限请求在 JSON 解码与内存分配前被拒绝，切断了超长 names 数组进入内存分配路径的链路，单条请求不再能引发内存过度分配。", "effects": [{"comp_name": "ageLANServer", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.15.2)", "min_fixed_version": "1.15.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "github.com/luskaner/ageLANServer/server", "ecosystem": "go", "versions": [{"affected_version": "(-∞,1.15.2)", "min_fixed_version": "1.15.2", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "拒绝服务", "kind_en": "不受控制的资源消耗", "last_modified_time": "2026-10-10", "level": "High", "mps_id": "MPS-1tws-4fki", "poc": false, "poc_url": [], "published_time": "2026-10-10", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-1tws-4fki", "name": "https://www.oscs1024.com/hd/MPS-1tws-4fki"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-107839", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-107839"}, {"url": "https://github.com/luskaner/ageLANServer/security/advisories/GHSA-4jfq-pmq9-257h", "name": "https://github.com/luskaner/ageLANServer/security/advisories/GHSA-4jfq-pmq9-257h"}, {"url": "https://github.com/luskaner/ageLANServer/commit/1dd40166a59356865c0a4b1800f32d05dc8bec79", "name": "https://github.com/luskaner/ageLANServer/commit/1dd40166a59356865c0a4b1800f32d05dc8bec79"}, {"url": "https://github.com/luskaner/ageLANServer/releases/tag/v1.15.2", "name": "https://github.com/luskaner/ageLANServer/releases/tag/v1.15.2"}], "scope_influence": "", "tags": ["go", "应用软件"], "title": "ageLANServer拒绝服务漏洞", "_translated": true, "_saved_at": "2026-10-09T20:27:49+00:00", "_first_saved_at": "2026-10-09T20:27:49+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-1tws-4fki"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-91136", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "cwe": "CWE-22", "description": "Divi Plus 是 Elicus 开发的商业 WordPress 插件，为 Divi 主题提供 SVG 动画、博客列表、WooCommerce 网格等多种页面扩展模块，该插件按许可付费分发，未公开官方源码仓库。\n受影响版本中，/wp-json/elicus/v1/dipl-modules/svg-animator REST 端点的权限回调 SVGAnimatorController::index_permission 无条件返回 true，svg_image 参数仅经 sanitize_text_field() 与 esc_html() 处理，此类处理无法限制文件系统路径、file:// 流封装或任意 URL，参数随后被传入 file_get_contents()（失败时回落 wp_remote_get()），读取到的原始响应体经 JSON 的 html 字段返回，未认证攻击者可借此读取服务器上的任意文件，并可能进一步实现远程代码执行。\n修复版本中通过在 2.4.1 版本为多个模块的 REST 接口增加文件校验与权限检查，阻止未经认证的请求进入文件读取逻辑，消除 svg_image 参数导致的任意文件读取风险。", "effects": [{"comp_name": "divi_plus", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.4.1)", "min_fixed_version": "2.4.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-10-10", "level": "High", "mps_id": "MPS-4oqt-ed0h", "poc": false, "poc_url": [], "published_time": "2026-10-10", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-4oqt-ed0h", "name": "https://www.oscs1024.com/hd/MPS-4oqt-ed0h"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-91136", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-91136"}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/2c0bbdf6-afaf-4194-ada2-24d142892c32?source=cve", "name": ""}, {"url": "https://diviplus.io/changelog/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Divi Plus任意文件读取漏洞", "_translated": true, "_saved_at": "2026-10-10T13:13:02+00:00", "_first_saved_at": "2026-10-10T13:13:02+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-4oqt-ed0h"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-107838", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-617", "description": "RIOT 是开源的物联网微控制器操作系统，面向资源受限嵌入式设备，nanocoap_fileserver 是其 nanocoap CoAP 协议栈中对外提供文件读写能力的文件服务组件。\n受影响版本中，_resp_init() 在 coap_build_reply() 无法将响应头放入响应缓冲区时返回 -1，而 _get_file() 与 _get_directory() 未检查该返回值并继续使用过期的响应状态。远程客户端在启用 nanocoap_token_ext 的设备上发送携带超长扩展令牌（RFC 8974）的 CoAP 请求，响应头长度按请求令牌长度计算并超过默认 128 字节的响应缓冲区，流程进入 _calc_szx2() 并命中 assert(pdu-\u003epayload_len \u003e reserve) 断言，设备上的 CoAP 服务任务终止。\n修复版本中通过在 fileserver.c 的全部 _resp_init() 调用点检查返回值解决该问题，初始化失败时释放已打开的文件或目录句柄并返回 -1 终止请求处理，不再以无效响应状态继续构建响应，消除远程可达断言导致的服务终止。", "effects": [{"comp_name": "riot", "ecosystem": "linux", "versions": [{"affected_version": "[2023.07,2026.07]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "可达断言", "kind_en": "Reachable Assertion", "last_modified_time": "2026-10-10", "level": "High", "mps_id": "MPS-7yge-vlwh", "poc": false, "poc_url": [], "published_time": "2026-10-10", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-7yge-vlwh", "name": "https://www.oscs1024.com/hd/MPS-7yge-vlwh"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-107838", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-107838"}, {"url": "https://github.com/RIOT-OS/RIOT/security/advisories/GHSA-39j3-3v73-5mj2", "name": "https://github.com/RIOT-OS/RIOT/security/advisories/GHSA-39j3-3v73-5mj2"}, {"url": "https://github.com/RIOT-OS/RIOT/pull/22745", "name": "https://github.com/RIOT-OS/RIOT/pull/22745"}, {"url": "https://github.com/RIOT-OS/RIOT/commit/d3a47289c58d108575a19e623e4d3f647659e743", "name": "https://github.com/RIOT-OS/RIOT/commit/d3a47289c58d108575a19e623e4d3f647659e743"}], "scope_influence": "", "tags": ["应用软件"], "title": "RIOT nanocoap_fileserver远程拒绝服务漏洞", "_translated": true, "_saved_at": "2026-10-09T20:27:51+00:00", "_first_saved_at": "2026-10-09T20:27:51+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-7yge-vlwh"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过构造恶意的数据，将过多的数据输入到程序的缓冲区中，使得缓冲区的空间被填满，从而溢出到程序的栈 (stack) 或堆 (heap) 中，导致程序崩溃、拒绝服务、数据泄露等安全问题。\n", "title": "什么是经典缓冲区溢出"}, {"content": "| 类型        | 描述                                                         |\n| ----------- | ------------------------------------------------------------ |\n| 代码注入攻击      | 攻击者通过向程序的缓冲区输入恶意代码，从而控制程序执行流程，实现对程序操作的恶意操作。例如，攻击者可以通过向 Web 应用程序的输入框中输入恶意代码，从而执行任意的代码，破坏系统、窃取数据等。 |\n| 数据覆盖攻击      | 攻击者通过向程序的缓冲区输入过多的数据，从而覆盖程序中的重要数据或代码，实现对程序操作的恶意操作。例如，攻击者可以通过向聊天应用程序的输入框中输入过多的表情符号，从而覆盖程序中的重要数据，例如聊天消息、账号密码等。 |\n| 栈溢出攻击 | 攻击者通过向程序的栈中输入过多的数据，从而溢出到栈外部，实现对程序操作的恶意操作。例如，攻击者可以通过向游戏应用程序的输入框中输入过多的道具名称，从而覆盖程序中的重要数据，例如游戏数据、账号密码等。 |\n| 堆溢出攻击       | 攻击者通过向程序的堆中输入过多的数据，从而溢出到堆外部，实现对程序操作的恶意操作。例如，攻击者可以通过向操作系统工具的输入框中输入过多的命令，从而覆盖程序中的重要数据，例如系统文件、配置文件等。 |", "title": "经典缓冲区溢出常见的攻击方式"}, {"content": "- 输入验证：在程序输入处对输入数据进行严格的验证和过滤，确保输入数据符合预期的格式和类型，避免被攻击者注入恶意命令或数据。可以使用正则表达式、格式字符串等方式进行输入验证。\n- 输出过滤：在程序输出处对输出数据进行严格的过滤和检查，确保输出数据符合预期的格式和类型，避免被攻击者截获和篡改。可以使用安全的输出过滤库等方式进行输出过滤。\n- 使用安全的编程模型：使用安全的编程模型，例如避免使用原生的缓冲区管理函数，使用安全的框架和库来处理输入数据和执行命令，避免缓冲区溢出漏洞。\n- 数据库加密和访问控制：对于敏感数据和命令，使用加密和访问控制措施，确保只有授权用户可以访问和执行命令，避免被攻击者窃取和篡改。\n- 定期更新和升级：定期更新和升级应用程序和库的版本，确保应用程序和库的最新版本包含了最新的安全补丁和修复措施，避免安全漏洞的出现和利用。\n- 安全审计和监控：定期对系统和应用程序进行安全审计和监控，及时发现和阻止潜在的安全漏洞和攻击，确保系统和数据的安全和可靠性。", "title": "如何预防经典缓冲区溢出"}], "cnvd_id": "", "cve_id": "CVE-2026-75350", "cvss": {"cvssv31": [{"source": "cve@mitre.org", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-120", "description": "OpENer 是 EIPStackGroup 开源的 EtherNet/IP 适配器协议栈，以 C 语言实现，用于让工业现场设备以适配器角色接入 EtherNet/IP 网络并处理显式与隐式报文。\n受影响版本中，Identity 对象默认注册的 GetAttributeList 服务在 source/src/cip/cipcommon.c 中按 GetCipDataTypeLength 估算单条响应所需空间，未计入每条响应固定写入的属性 ID（2 字节）、status（1 字节）与 reserved（1 字节），单条属性至少低估 4 字节；远程攻击者通过 TCP 44818 端口发送携带大量属性项与合法 sockaddr 项的 Get_Attribute_List 显式请求后，累计低估使 message_router_response 越界写入并破坏 current_message_position，响应组装阶段 AssembleLinearMessage 继续编码合法 CPF 项时在 AddIntToMessage 中解引用该越界指针，进程崩溃，造成远程拒绝服务。\n修复版本中通过，可通过将 EtherNet/IP 端口 TCP/UDP 44818 限定于可信网络、阻断不可信主机的显式报文会话缓解远程拒绝服务风险；截至 2026-10-10，上游 master 分支至 d8820ef41 仍包含该缺陷代码，尚未发布包含修复的版本。", "effects": [{"comp_name": "OpENer", "ecosystem": "linux", "versions": [{"affected_version": "[8e6763e16,d8820ef41]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "经典缓冲区溢出", "kind_en": "不检查输入大小的缓冲区复制（“经典缓冲区溢出”）", "last_modified_time": "2026-10-10", "level": "High", "mps_id": "MPS-dxmo-7ic1", "poc": false, "poc_url": [], "published_time": "2026-10-10", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-dxmo-7ic1", "name": "https://www.oscs1024.com/hd/MPS-dxmo-7ic1"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-75350", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-75350"}, {"url": "https://github.com/EIPStackGroup/OpENer", "name": ""}, {"url": "https://github.com/EIPStackGroup/OpENer/blob/master/source/src/cip/cipcommon.c", "name": ""}, {"url": "https://github.com/EIPStackGroup/OpENer/blob/master/source/src/enet_encap/endianconv.c", "name": ""}, {"url": "https://github.com/EIPStackGroup/OpENer/blob/master/source/src/enet_encap/cpf.c", "name": ""}, {"url": "https://github.co ndle_sideload，按攻击者指定的服务器路径移动文件并移除源文件，未认证攻击者可删除服务器上的受限安全文件。\n修复版本中通过移除 set_file 中基于 files 参数的旁路输入、仅接受标准 multipart $_FILES['rtmedia_file']，并将 process 中的上传方式固定为 wp_handle_upload，切断了攻击者指定服务器路径进入 sideload 处理的链路，消除了未认证任意文件删除风险。", "effects": [{"comp_name": "buddypress-media", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,4.7.14)", "min_fixed_version": "4.7.14", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-10-10", "level": "High", "mps_id": "MPS-hxw7-0key", "poc": false, "poc_url": [], "published_time": "2026-10-10", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-hxw7-0key", "name": "https://www.oscs1024.com/hd/MPS-hxw7-0key"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-89301", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-89301"}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/ea679227-5ab3-408b-ae1b-340099880789?source=cve", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/buddypress-media/tags/4.7.13/app/main/controllers/upload/processors/RTMediaUploadFile.php#L91", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/buddypress-media/tags/4.7.13/app/main/controllers/upload/RTMediaUploadEndpoint.php#L85", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/buddypress-media/tags/4.7.13/app/main/controllers/upload/RTMediaUploadModel.php#L49", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/buddypress-media/tags/4.7.13/app/main/controllers/upload/processors/RTMediaUploadFile.php#L180", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/buddypress-media/tags/4.7.13/app/main/controllers/upload/processors/RTMediaUploadFile.php#L253", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/buddypress-media/tags/4.7.13 ux 的 catch-all 路由接受任意 HTTP 方法名，未认证攻击者持续发送携带唯一方法名的请求，会让 Prometheus registry 中不断新增永不回收的时间序列，内存单调增长直至进程被 OOM 终止，同时 /metrics 抓取延迟随序列数量恶化，可导致监控失效。\n修复版本中通过新增 normalizedMethod 函数把方法标签收敛到固定白名单，白名单外的方法统一折叠为 \u003cother\u003e，中间件记录指标时不再使用原始方法名，切断攻击者制造无界标签基数的路径。", "effects": [{"comp_name": "yopass", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,14.7.0)", "min_fixed_version": "14.7.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "拒绝服务", "kind_en": "不受控制的资源消耗", "last_modified_time": "2026-10-10", "level": "High", "mps_id": "MPS-t05c-qsnd", "poc": false, "poc_url": [], "published_time": "2026-10-10", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-t05c-qsnd", "name": "https://www.oscs1024.com/hd/MPS-t05c-qsnd"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-107840", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-107840"}, {"url": "https://github.com/jhaals/yopass/security/advisories/GHSA-6r69-c6wg-7g8m", "name": "https://github.com/jhaals/yopass/security/advisories/GHSA-6r69-c6wg-7g8m"}, {"url": "https://github.com/jhaals/yopass/pull/3773", "name": "https://github.com/jhaals/yopass/pull/3773"}, {"url": "https://github.com/jhaals/yopass/commit/61e31ead04a4fc27ce80bed226af41c7c0426ccf", "name": "https://github.com/jhaals/yopass/commit/61e31ead04a4fc27ce80bed226af41c7c0426ccf"}, {"url": "https://github.com/jhaals/yopass/commit/78d0c14f7085048130199662a2ec8a18ec8d6ebb", "name": "https://github.com/jhaals/yopass/commit/78d0c14f7085048130199662a2ec8a18ec8d6ebb"}, {"url": "https://github.com/jhaals/yopass/releases/tag/14.7.0", "name": "https://github.com/jhaals/yopass/releases/tag/14.7.0"}], "scope_influence": "", "tags": ["应用软件"], "title": "Yopass指标标签资源耗尽漏洞", "_translated": true, "_saved_at": "2026-10-09T20:27:48+00:00", "_first_saved_at": "2026-10-09T20:27:48+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-t05c-qsnd"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-107657", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "cwe": "CWE-79", "description": "HivePress 是一款面向 WordPress 的开源商业目录、列表与分类信息插件，提供自定义属性、用户注册与前端个人资料展示等功能。\n受影响版本中，管理员把文本类型自定义用户属性的显示格式配置为将 %value% 置于 HTML 属性上下文（如官方文档示例 \u003ca href=\"%value%\"\u003eCustom link\u003c/a\u003e）并启用前端用户资料页后，未认证攻击者可在注册接口提交带引号与事件属性的自定义属性参数（如 profile_test），该值经 includes/fields/class-text.php 的 sanitize_text_field() 清理后入库，前端渲染时 includes/fields/class-field.php 的 display() 将未转义值交由 includes/helpers.php 的 replace_tokens() 替换进显示模板，注入的 Web 脚本在任意用户访问注入页面时执行。\n修复版本中通过在 includes/fields/class-field.php 新增 escape_display_value() 并在 display() 中对 value 与 raw_value 统一转义，文本字段在未启用 HTML 时调用 esc_html() 输出，replace_tokens() 同步区分 format 与 fallback 分支，阻断未转义的用户值进入 HTML 属性上下文。", "effects": [{"comp_name": "hivepress", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.7.32)", "min_fixed_version": "1.7.32", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-10-10", "level": "High", "mps_id": "MPS-xvue-df3s", "poc": false, "poc_url": [], "published_time": "2026-10-10", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-xvue-df3s", "name": "https://www.oscs1024.com/hd/MPS-xvue-df3s"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-107657", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-107657"}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/d0e73b59-58d7-4f4b-b7f3-568190be9b09?source=cve", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/hivepress/tags/1.7.31/includes/helpers.php#L382", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/hivepress/tags/1.7.31/includes/fields/class-field.php#L561", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/hivepress/tags/1.7.31/includes/fields/class-text.php#L197", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/hivepress/tags/1.7.31/includes/components/class-attribute.php#L1298", "name": ""}, {"url": "https://github.com/hivepress/ I:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:L/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-191", "description": "RIOT 是面向物联网设备与嵌入式系统的开源微控制器操作系统，内置 nanoCoAP 模块提供轻量级 CoAP 协议实现，用于资源受限设备上的网络请求与分块数据传输。\n受影响版本中，sys/net/application_layer/nanocoap/sock.c 的 _block_cb() 校验 Block2 响应时只比对块号与期望值一致，未校验服务器控制的块尺寸 szx 及其派生 offset 是否匹配请求的块几何；恶意 CoAP 服务器返回期望块号但更大的块尺寸时，派生 offset 超过客户端切片偏移，_2buf_slice() 中 ctx-\u003eoffset - offset 发生 size_t 下溢，后续 memcpy 以回绕后的偏移从 payload 缓冲区之前的内存读取数据，形成越界读，可导致客户端崩溃、拒绝服务，并可能泄露相邻内存。\n修复版本中通过将分块传输状态从按块号追踪改为按资源偏移追踪，在 _block_cb() 中拒绝服务器升大的块尺寸并校验响应偏移与期望偏移一致，同时收紧 _2buf_slice() 的边界判断，阻断偏移下溢路径；截至 2026-10-09 官方尚未发布包含该修复的正式版本，修复代码已合入 master 分支。", "effects": [{"comp_name": "riot", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2026.07]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "超界折返", "kind_en": "整数下溢（环绕或环绕）", "last_modified_time": "2026-10-10", "level": "High", "mps_id": "MPS-wye2-mt3j", "poc": false, "poc_url": [], "published_time": "2026-10-10", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-wye2-mt3j", "name": "https://www.oscs1024.com/hd/MPS-wye2-mt3j"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-107836", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-107836"}, {"url": "https://github.com/RIOT-OS/RIOT/security/advisories/GHSA-x924-p5fq-26pc", "name": "https://github.com/RIOT-OS/RIOT/security/advisories/GHSA-x924-p5fq-26pc"}, {"url": "https://github.com/RIOT-OS/RIOT/pull/22518", "name": "https://github.com/RIOT-OS/RIOT/pull/22518"}, {"url": "https://github.com/RIOT-OS/RIOT/commit/49b894cbe091510093273b98d92c4a17167d6839", "name": "https://github.com/RIOT-OS/RIOT/commit/49b894cbe091510093273b98d92c4a17167d6839"}], "scope_influence": "", "tags": ["应用软件"], "title": "RIOT nanoCoAP越界读漏洞", "_translated": true, "_saved_at": "2026-10-09T20:27:47+00:00", "_first_saved_at": "2026-10-09T20:27:47+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-wye2-mt3j"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2026-108865", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:L/A:N", "severity": "high", "base_score": 8.2}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:L/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:L/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-287", "description": "Unla 是 AmoyLab 开源的 Go 语言 MCP 网关，模块路径为 github.com/amoylab/unla，用于把现有 MCP Server 和 HTTP API 转成可供大模型客户端调用的 MCP 端点，并可按路由前缀启用 OAuth2 访问控制。\n受影响版本中，OAuth2 授权服务的 Authorize 在校验 client_id、redirect_uri 与 response_type 后直接签发授权码，storage.AuthorizationCode 与 storage.Token 都没有用户字段。未认证调用者可经 handleOAuthRegister 注册客户端，再由 handleOAuthAuthorize 取得授权码并在 handleOAuthToken 换取访问令牌。OAuth2 模式前缀上的 handleRoot 只调用 ValidateToken 检查令牌是否存在且未过期，不核对用户、scope 或前缀，因此该令牌可访问受保护的 MCP 前缀、被代理的上游 API，以及这些路由为上游请求配置注入的凭据。\n修复版本中通过校验资源所有者并绑定令牌主体的改动尚未发布。截至 2026-10-11，最新标签 v0.10.0（5da380b8d883165def1c0a19ec55025ef12db8a5）与 main（87c3169b9fd525b51b31202df553aad8ecb9dcca）的 internal/auth/oauth.go 内容相同，Authorize 与 ValidateToken 仍保持上述行为。", "effects": [{"comp_name": "github.com/amoylab/unla", "ecosystem": "go", "versions": [{"affected_version": "(-∞,0.10.0]", "min_fixed_version": "", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "身份验证不当", "kind_en": "认证不当", "last_modified_time": "2026-10-11", "level": "High", "mps_id": "MPS-5u3j-6plq", "poc": false, "poc_url": [], "published_time": "2026-10-11", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-5u3j-6plq", "name": "https://www.oscs1024.com/hd/MPS-5u3j-6plq"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-108865", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-108865"}, {"url": "https://hackmd.io/@1ExmmukzRMWN7B4gQ4W-4Q/amoylab-unla-oauth-self-issued-token-authz", "name": ""}, {"url": "https://github.com/AmoyLab/Unla/blob/v0.10.0/internal/auth/oauth.go#L86-L147", "name": ""}, {"url": "https://github.com/AmoyLab/Unla/blob/v0.10.0/internal/core/server.go#L229-L261", "name": ""}, {"url": "https://github.com/AmoyLab/Unla", "name": ""}, {"url": "https://www.vulncheck.com/advisories/amoylab-unla-through-0.10.0-oauth2-authentication-by
