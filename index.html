      color: var(--muted);

      min-height: 70vh;

序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止代码注入攻击。", "title": "如何预防代码注入"}], "cnvd_id": "", "cve_id": "CVE-2026-93985", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.9}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.4}]}, "cvss_score": 9.4, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-94", "description": "OpenPanel js-runtime 通过提交 bad75bdd 在 JavaScript Webhook 模板验证器中包含沙箱逃逸漏洞，该漏洞无法阻止计算成员对构造函数链的访问。具有项目写入权限的攻击者可以使用计算属性表示法创建 Webhook 模板，以访问 Function 构造函数并在工作进程中执行任意代码。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "代码注入", "kind_en": "代码生成控制不当（“代码注入”）", "last_modified_time": "2026-09-19", "level": "Critical", "mps_id": "MPS-3gcw-eh7i", "poc": false, "poc_url": [], "published_time": "2026-09-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-3gcw-eh7i", "name": "https://www.oscs1024.com/hd/MPS-3gcw-eh7i"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-93985", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-93985"}, {"url": "https://github.com/Openpanel-dev/openpanel/security/advisories/GHSA-6f7h-cvp6-w9w5", "name": "GitHub Security Advisory (GHSA-6f7h-cvp6-w9w5)"}, {"url": "https://www.vulncheck.com/advisories/openpanel-js-runtime-javascript-template-sandbox-escape-rce", "name": "VulnCheck Advisory: OpenPanel js-runtime JavaScript Template Sandbox Escape RCE"}], "scope_influence": "", "tags": ["应用软件"], "title": "OpenPanel js-runtime JavaScript 模板沙箱逃逸 RCE /S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-338", "description": "NivoCart 是一款基于 PHP 的开源购物车/电商系统（GitHub 开源，GPL-3.0 许可），提供商品、订单与后台管理员管理能力。\n受影响版本中，管理员密码找回入口 upload/admin/controller/common/forgotten.php 的 index() 使用 substr(md5(mt_rand()), 0, 10) 生成 10 位十六进制重置令牌：mt_rand() 为非加密安全随机源，输出可由其 32 位种子状态推算，令牌可预测空间上限仅约 2^32；令牌经 model/user/user.php 的 editCode() 写入数据库后没有过期时间（getUserByCode() 仅要求 code != ''），找回与重置入口 common/forgotten、common/reset 均无速率限制，知道管理员邮箱的攻击者可请求找回并预测或穷举有效令牌，通过 common/reset 直接重置管理员密码并接管后台。\n修复版本中通过，上游 issue #25 给出的修复建议为改用 bin2hex(random_bytes(32)) 生成高熵令牌、记录令牌创建时间并使超时令牌（如 60 分钟）失效、对令牌申请与重置接口增加速率限制；运维上可在后台设置中关闭密码找回功能（config_password 置 0）切断该入口，并等待官方发布包含修复的版本。", "effects": [{"comp_name": "nivocart", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.4.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "使用具有密码学弱点缺陷的PRNG", "kind_en": "使用弱加密伪随机数生成器 (PRNG)", "last_modified_time": "2026-09-20", "level": "Critical", "mps_id": "MPS-l78w-krms", "poc": false, "poc_url": [], "published_time": "2026-09-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-l78w-krms", "name": "https://www.oscs1024.com/hd/MPS-l78w-krms"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-94107", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-94107"}, {"url": "https://github.com/nivocart/nivocart/issues/25", "name": "GitHub Issue #25"}, {"url": "https://github.com/nivocart/nivocart/blob/6ea6600cda1263ae70c0aab0a70d31091a32c46b/upload/admin/controller/common/forgotten.php#L20-L34", "name": "reset token generation at v2.4.0"}, {"url": "https://github.com/nivocart/nivocart/blob/6ea6600cda1263ae70c0aab0a70d31091a32c46b/upload/admin/model/user/user.php#L119-L123", "name": "getUserByCode at v2.4.0"}, {"url": "https://github.com/nivocart/nivocart", "name": ""}, {"url": "https://www.vulncheck.com/advisories/nivocart-through-2.4.0-predictable-administrator-password-reset-token", "name": "VulnCheck Advisory: NivoCart through 2.4.0 Predictable Administrator Password Reset Token"}], "scope_influence": "", "tags": ["应用软件"], "title": "NivoCart重置令牌可预测", "_translated": true, "_saved_at": "2026-09-20T14:25:07+00:00", "_first_saved_at": "2026-09-20T14:25:07+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-l78w-krms"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-54671", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-862", "description": "WeGIA 是慈善机构的网络管理器。在 3.8.5 之前，WeGIA 将 InternoControle 映射到 web/controle/control.php 中的空资源数组，而 web/dao/MiddlewareDAO.php 中的 verificarPermissao 将该空数组视为每个经过身份验证的用户的无条件访问。 web/controle/InternoControle.php 中的方法（包括 listarUm、alterar 和 excluir）接受用户控制的 id 或 idInterno 值而不验证所有权，从而允许低权限用户读取、修改或删除他人的记录并暴露个人、身份、地址、医疗和家庭信息。该通报指出，自引用加载错误可能会导致报告版本中的 域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-93452", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-787", "description": "snappy-java 到 1.1.10.8 的 Snappy.compress(ByteBuffer, ByteBuffer) 中包含一个缓冲区溢出漏洞，该漏洞会写入超过目标缓冲区的末尾。攻击者可以提供超出目标缓冲区剩余容量的不可压缩数据，从而损坏堆外内存并导致 JVM 终止。", "effects": [{"comp_name": "snappy-java", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.1.10.8]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-09-18", "level": "High", "mps_id": "MPS-zxy9-s5un", "poc": false, "poc_url": [], "published_time": "2026-09-18", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-zxy9-s5un", "name": "https://www.oscs1024.com/hd/MPS-zxy9-s5un"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-93452", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-93452"}, {"url": "https://github.com/xerial/snappy-java/issues/732", "name": "GitHub Issue #732"}, {"url": "https://github.com/xerial/snappy-java/blob/v1.1.10.8/src/main/java/org/xerial/snappy/Snappy.java#L137", "name": ""}, {"url": "https://github.com/xerial/snappy-java", "name": ""}, {"url": "https://www.vulncheck.com/advisories/snappy-java-through-1.1.10.8-buffer-overflow-in-snappy-compress", "name": "VulnCheck Advisory: snappy-java through 1.1.10.8 Buffer Overflow in Snappy.compress"}], "scope_influence": "", "tags": ["应用软件"], "title": "snappy-java 到 1.1.10.8 Snappy.compress 中的缓冲区溢出", "_translated": true, "_saved_at": "2026-09-18T02:42:56+00:00", "_first_saved_at": "2026-09-18T02:42:56+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-zxy9-s5un"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-93426", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:L/A:N", "severity": "high", "base_score": 8.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/  "effects": [{"comp_name": "gitlab.com/uniget-org/cli", "ecosystem": "go", "versions": [{"affected_version": "(-∞,0.27.6)", "min_fixed_version": "0.27.6", "repository": "go", "solutions": [], "upstream": true}]}, {"comp_name": "govulncheck-vulndb", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,0.0.20260827T195228-160000.1.1)", "min_fixed_version": "0.0.20260827T195228-160000.1.1", "repository": "opensuse:leap:16.0", "solutions": [], "upstream": false}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "文件名或路径的外部可控制", "kind_en": "文件名或路径的外部控制", "last_modified_time": "2026-09-18", "level": "High", "mps_id": "MPS-6msd-hnjv", "poc": false, "poc_url": [], "published_time": "2026-09-18", "reference_url_list": [{"url": "https://github.com/uniget-org/cli/security/advisories/GHSA-m6jg-wr9m-cg2f", "name": ""}, {"url": "https://github.com/uniget-org/cli/commit/7b4f18a9f00f0955f830c7ccf266ed0de5f9fd91", "name": ""}, {"url": "https://github.com/uniget-org/cli/releases/tag/v0.27.6", "name": ""}, {"url": "https://github.com/advisories/GHSA-m6jg-wr9m-cg2f", "name": ""}], "scope_influence": "", "tags": ["go"], "title": "uniget CLI hook文件路径遍历漏洞", "_translated": true, "_saved_at": "2026-09-17T20:50:59+00:00", "_first_saved_at": "2026-09-17T20:50:59+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-6msd-hnjv"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-86039", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:H/A:L", "severity": "high", "base_score": 8.2}]}, "cvss_score": 8.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:H/A:L", "cwe": "CWE-345", "description": "libp2p 是 libp2p 网络堆栈的 JavaScript 实现。从8.0.0到12.0.24，packages/peer-store/src/index.ts中的@libp2p/peer-store使用consumePeerRecord来验证RecordEnvelope签名，但不要求签名有效负载中的PeerRecord.peerId等于RecordEnvelope.openAndCertify派生的签名者对等ID。 ExpectedPeer选项仅检查信封签名者，gossipsub Peer Exchange路径可以提供攻击者自己的peer ID作为expectedPeer。因此，攻击者可以使用攻击者的密钥签署记录，将受害者对等 ID 和攻击者控制的多地址放入有效负载中，并为受害者存储经过认证的地址。尽管连接升级仍会验证远程对等方身份并防止完全身份接管，但中毒地址可能会导致地址簿损坏、拨号重定向或故障、路由操纵和可达性中断。该问题已在版本 12.0.24 中修复。", "effects": [{"comp_name": "js-libp2p", "ecosystem": "linux", "versions": [{"affected_version": "[8.0.0,12.0.24)", "min_fixed_version": "12.0.24", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "对数据真实性的验证不充分", "kind_en": "数据真实性验证不足", "last_modified_time": "2026-09-18", "level": "High", "mps_id": "MPS-brnv-u0io", "poc": false, "poc_url": [], "published_time": "2026-09-18", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-brnv-u0io", "name": "https://www.oscs1024.com/hd/MPS-brnv-u0io"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-86039", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-86039"}, {"url": "https://github.com/libp2p/js-libp2p/security/advisories/GHSA-vrf4-mx87-p53w", "name": "https://github.com/libp2p/js-libp2p/security/advisories/GHSA-vrf4-mx87-p53w"}, {"url": "https://github.com/libp2p/js-libp2p/pull/3570", "name": "https://github.com/libp2p/js-libp2p/pull/3570"}, {"url": "https://github.com/libp2p/js-libp2p/commit/3bf5d395cbca1488eea6e87cd771e4613b661c30", "name": "https://github.com/libp2p/js-libp2p/commit/3bf5d395cbca1488eea6e87cd771e4613b661c30"}, {"url": "https://github.com/libp2p/js-libp2p/releases/tag/peer-store-v12.0.24", "name": "https://github.com/libp2p/js-libp2p/releases/tag/peer-store-v12.0.24"}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-86039漏洞", "_translated": true, "_saved_at": "2026-09-17T17:29:21+00:00", "_first_saved_at": "2026-09-17T17:29:21+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-brnv-u0io"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-54253", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:H/I:L/A:N", "severity": "high", "base_score": 8.2}]}, "cvss_score": 8.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:H/I:L/A:N", "cwe": "CWE-79", "description": "TS3 Manager 是用于维护 Teamspeak3 服务器的现代 Web 界面。在 2.2.6 之前，packages/server/routes/api.js 中的 /api/download 处理程序将攻击者控制的端口查询参数传递给 socket.connect(port, host) 并通过 res.status(400).send(error.message) 将生成的 error.message 作为 text/html 返回，而无需内容安全策略。当登录的操作员遵循精心设计的顶级链接时，反射值将在管理器源中执行。在packages/ui/src/store/modules/query.js 中设置的令牌cookie 缺少HttpOnly、Secure 和显式的SameSite 属性，允许脚本读取令牌并调用packages/server/socket.js 中的autofillform 事件。 autofillform 返回解码后的 JWT，包括明文 ServerQuery 密码，从而在操作员使用管理 ServerQuery 凭据时启用操作员会话劫持和对托管 TeamSpeak 服务器的控制。需要有效的操作员会话和用户交互。此问题已在 2.2.6 中修复。", "effects": [{"comp_name": "ts3-manager", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.2.6)", "min_fixed_version": "2.2.6", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-09-18", "level": "High", "mps_id": "MPS-qi7v-186p", "poc": false, "poc_url": [], "published_time": "2026-09-18", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-qi7v-186p", "name": "https://www.oscs1024.com/hd/MPS-qi7v-186p"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-54253", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-54253"}, {"url": "https://github.com/joni1802/ts3-manager/security/advisories/GHSA-3cgm-7p4g-gffj", "name": "https://github.com/joni1802/ts3-manager/security/advisories/GHSA-3cgm-7p4g-gffj"}, {"url": "https://github.com/joni1802/ts3-manager/commit/48df540786d2784c5d7b9bd55786d63e31288d07", "name": "https://github.com/joni1802/ts3-manager/commit/48df540786d2784c5d7b9bd55786d63e31288d07"}, {"url": "https://github.com/joni1802/ts3-manager/releases/tag/v2.2.6", "name": "https://github.com/joni1802/ts3-manager/releases/tag/v2.2.6"}], "scope_influence": "", "tags": ["应用软件"], "title": "TS3 Manager：通过 /api/download 端口参数反射的 XSS 窃取操作员会话", "_translated": true, "_saved_at": "2026-09-17T20:51:09+00:00", "_first_saved_at": "2026-09-17T20:51:09+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-qi7v-186p"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-89413", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:H/A:H", "severity": "high", "base_score": 8.1}]}, "cvss_score": 8.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:H/A:H", "cwe": "CWE-862", "description": "The Filter Gallery plugin for WordPress is vulnerable to authorization bypass in all versions up to, and including, 1.1.4. This is due to the plugin not properly verifying that a user is authorized to perform an action. This makes it possible for authenticated attackers, with subscriber-level access and above, to delete any arbitrary Filter Gallery records — including all associated filters, image mappings, settings, and details options — by supplying attacker-controlled gallery IDs. The nonce bypass requires omitting the nonce POST field entirely rather than submitting an invalid value, as a present-but-invalid nonce is correctly rejected.", "effects": [{"comp_name": "Filter Gallery", "ecosystem": "linux", "versions": [{"affected_version": "(0,1.1.4]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "e : true)，因此访问者到达时携带的标识符会带入其经过身份验证的会话。每个身份验证事件都会到达以下一个函数：AshAuthentication.Phoenix.Controller.__using__/1 注入的默认 success/4、mix ash_authentication_phoenix.install 发出的 AuthController 以及 Remember-me 自动登录。 AshAuthentication.Phoenix.Plug.store_in_session/2 是它的默认委托。注销也不会关闭窗口，因为clear_session/2以Plug.Conn.clear_session/1结尾，这会清除会话内容但保持标识符不变，因此植入的标识符可以在注销然后登录的循环中幸存下来。\n\n此问题影响 ash_authentication：从 4.15.0 之前的 0.2.0 到 5.0.0-rc.14 之前的 5.0.0-rc.0。", "effects": [{"comp_name": "ash_authentication", "ecosystem": "linux", "versions": [{"affected_version": "[0.2.0,4.15.0)", "min_fixed_version": "4.15.0", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[5.0.0-rc.0,5.0.0-rc.14)", "min_fixed_version": "5.0.0-rc.14", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "会话固定", "kind_en": "会话固定", "last_modified_time": "2026-09-18", "level": "High", "mps_id": "MPS-q3fx-aev2", "poc": false, "poc_url": [], "published_time": "2026-09-18", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-q3fx-aev2", "name": "https://www.oscs1024.com/hd/MPS-q3fx-aev2"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-86688", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-86688"}, {"url": "https://github.com/team-alembic/ash_authentication/security/advisories/GHSA-v577-944g-7h3x", "name": "GitHub Advisory"}, {"url": "https://cna.erlef.org/cves/CVE-2026-86688.html", "name": "EEF CNA record for CVE-2026-86688"}, {"url": "https://osv.dev/vulnerability/EEF-CVE-2026-86688", "name": "OSV record EEF-CVE-2026-86688"}, {"url": "https://github.com/team-alembic/ash_authentication/commit/a939dde9b917c072cdf10c4b0913a9886a4b0231", "name": "Introducing commit a939dde in team-alembic/ash_authentication"}, {"url": "https://github.com/team-alembic/ash_authentication/commit/872db454405ecad4fcdabd9ff3d8755d1d6a69ae", "name": "Fix commit 872db45 in team-alembic/ash_authentication"}, {"url": "https://github.com/team-alembic/ash_authentication/commit/3e1d452cbf1564e87f5f97be882b66fe25af7cfa", "name": "Fix commit 3e1d452 in team-alembic/ash_authentication"}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-86688漏洞", "_translated": true, "_saved_at": "2026-09-17T23:19:15+00:00", "_first_saved_at": "2026-09-17T23:19:15+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-q3fx-aev2"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-87915", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "cwe": "CWE-79", "description": "Popup Maker – 使用适用于 WordPress 的 Ultimate WP Popup Builder 插件提高销售、转化、选择和订阅者在 1.24.0 及之前的所有版本中，由于输入清理和输出转义不足，容易受到通过 value[Name] 参数存储的跨站点脚本攻击。这使得未经身份验证的攻击者可以在页面中注入任意 Web 脚本，每当用户访问注入的页面时就会执行这些脚本。在这种情况下，应用于输出的 wp_kses 清理是不够的，因为允许的属性值内的 HTML 实体在规范化中完好无损，并且稍后在单击上下文帮助选项卡锚点时由 wp-admin/js/common.js 中的 jQuery(link.attr('href')) 接收器进行评估。", "effects": [{"comp_name": "Popup Maker – Boost Sales, Conversions, Optins, Subscribers with the Ultimate WP Popup Builder", "ecosystem": "linux", "versions": [{"affected_version": "(0,1.24.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-09-18", "level": "High", "mps_id": "MPS-ib1n-alpc", "poc": false, "poc_url": [], "published_time": "2026-09-18", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ib1n-alpc", "name": "https://www.oscs1024.com/hd/MPS-ib1n-alpc"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-87915", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-87915"}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/ea8b1eee-2e3f-4d61-b815-4ea0aaa188b5?source=cve", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/popup-maker/tags/1.24.0/classes/Admin/Subscribers/Table.php#L281", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/popup-maker/tags/1.24.0/classes/ListTable.php#L1408", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/popup-maker/tags/1.24.0/classes/Newsletters.php#L74", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/popup-maker/tags/1.24.0/classes/Newsletters.php#L273", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/popup-maker/tags/1.24.0/classes/Abstract/Database.php#L359", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/popup-maker/tags/1.24.0/classes/Newsletters.php#L59", "name": ""}, {"url": "https://plugins.trac.wordpress.org/changeset?reponame=\u0026new=3690634%40popup-maker%2Ftags%2F1.25.0\u0026old=3648112%40popup-maker%2Ftags%2F1.24.0", "name": ""}, {"url": "https://plugins.trac.wordpress.org/changeset/3690634/popup-maker/trunk/classes/Admin/Subscribers/Table.php", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-87915漏洞", "_translated": true, "_saved_at": "2026-09-18T12:35:54+00:00", "_first_saved_at": "2026-09-18T12:35:54+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ib1n-alpc"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-54647", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-89", "description": "CubeCart 是一个电子商务软件解决方案。在 6.7.5 之前，admin/sources/settings.index.inc.php 直接将管理员控制的 download_expire POST 参数连接到 CubeCart_downloads 的原始 UPDATE 语句中，无需进行数字验证。经过身份验证的管理员可以提供一个逗号分隔的值来更改 SET 子句，因为 HTML 清理不会中和 SQL 语法，从而允许在应用程序的数据库权限内操作数据库列和潜在的其他数据。此问题已在版本 6.7.5 中修复。", "effects": [{"comp_name": "v6", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,6.7.5)", "min_fixed_version": "6.7.5", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-09-18", "level": "High", "mps_id": "MPS-km2t-bch8", "poc": false, "poc_url": [], "published_time": "2026-09-18", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-km2t-bch8", "name": "https://www.oscs1024.com/hd/MPS-km2t-bch8"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-54647", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-54647"}, {"url": "https://github.com/cubecart/v6/security/advisories/GHSA-hvmw-v8gc-4c29", "name": "https://github.com/cubecart/v6/security/advisories/GHSA-hvmw-v8gc-4c29"}, {"url": "https://github.com/cubecart/v6/commit/af7def4d279f7cefb23c1009a987737c16a105da", "name": "https://github.com/cubecart/v6/commit/af7def4d279f7cefb23c1009a987737c16a105da"}, {"url": "https://github.com/cubecart/v6/blob/6.7.5/admin/sources/release_notes/6.7.5.inc.php", "name": "https://github.com/cubecart/v6/blob/6.7.5/admin/sources/release_notes/6.7.5.inc.php"}, {"url": "https://github.com/cubecart/v6/releases/tag/6.7.5", "name": "https://github.com/cubecart/v6/releases/tag/6.7.5"}], "scope_influence": "", "tags": ["应用软件"], "title": "CubeCart：通过settings.index.inc.php中的download_expire参数进行SQL注入", "_translated": true, "_saved_at": "2026-09-17T23:19:32+00:00", "_first_saved_at": "2026-09-17T23:19:32+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-km2t-bch8"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "cnvd_id": "", "cve_id": "CVE-2026-92619", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-269", "description": "The Booking Calendar plugin for WordPress is vulnerable to Privilege Escalation in all versions up to, and including, 11.8.2 via the `wpbc_ajax_option_save` AJAX action. The vulnerability exists because the `handle_ajax_save()` function applies per-option safeguards only to names explicitly registered via `register_option_policy()`, causing `get_option_policy()` to return an empty policy — bypassing all can_save, force_mode, and allowed_keys checks — for any unregistered option name, including core WordPress options, while an attacker-controlled `data_name` parameter passes through `sanitize_key()` and is written directly to `update_option()` without restriction. This makes it possible for authenticated attackers with Editor-level access and above to escalate their privileges to Administrator by writing core WordPress options such as `default_role=administrator` and `users_can_register=1`, then self-registering a new Administrator account. The nonce check does not meaningfully restrict this attack, as both the nonce value and nonce action are attacker-supplied POST parameters, and a valid nonce is trivially obtainable via `admin-ajax.php?action=rest-nonce`.", "effects": [{"comp_name": "Booking Calendar", "ecosystem": "linux", "versions": [{"affected_version": "(0,11.8.2]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-09-18", "level": "High", "mps_id": "MPS-xh8k-2riq", "poc": false, "poc_url": [], "published_time": "2026-09-18", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-xh8k-2riq", "name": "https://www.oscs1024.com/hd/MPS-xh8k-2riq"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-92619", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-92619"}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/ab68a6b2-e9b0-4efa-bd01-c6e3e11011db?source=cve", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/booking/tags/11.8.2/includes/save-load-option/save-load-option.php#L303", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/booking/tags/11.8.2/includes/save-load-option/save-load-option.php#L197", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/booking/tags/11.8.2/includes/save-load-option/save-load-option.php#L138", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/booking/tags/11.8.2/includes/page-form-builder/ajax/bfb-ajax.php#L82", "name": ""}, {"url": "https://plugins.trac.wordpress.org/changeset?reponame=\u0026old=3699185%40booking\u0026new=3699185%40booking", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-92619漏洞", "_translated": true, "_saved_at": "2026-09-20T17:51:58+00:00", "_first_saved_at": "2026-09-18T07:52:10+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-xh8k-2riq"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-54524", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-89", "description": "Frappe HR 是一个开源人力资源管理解决方案 (HRMS)。在 16.7.0 之前，具有 HR 用户角色的经过身份验证的用户可以通过“基于付款模式的工资付款”报告中的过滤器注入 SQL。在 hrms/payroll/report/salary_ payments_based_on_ payment_mode/salary_ payments_based_on_ payment_mode.py 中， get_conditions 根据用户控制的值构造过滤子句， get_data 将这些子句合并到字符串格式的 SQL 查询中，从而允许提取任意数据库数据。此问题已在 16.7.0 中修复。", "effects": [{"comp_name": "hrms", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,16.7.0)", "min_fixed_version": "16.7.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-09-18", "level": "High", "mps_id": "MPS-evp2-t60x", "poc": false, "poc_url": [], "published_time": "2026-09-18", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-evp2-t60x", "name": "https://www.oscs1024.com/hd/MPS-evp2-t60x"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-54524", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-54524"}, {"url": "https://github.com/frappe/hrms/security/advisories/GHSA-2gv7-x4h2-3737", "name": "https://github.com/frappe/hrms/security/advisories/GHSA-2gv7-x4h2-3737"}, {"url": "https://github.com/frappe/hrms/pull/4515", "name": "https://github.com/frappe/hrms/pull/4515"}, {"url": "https://github.com/frappe/hrms/commit/b16148531954531a448dafdff20dc61882430ee9", "name": "https://github.com/frappe/hrms/commit/b16148531954531a448dafdff20dc61882430ee9"}, {"url": "https://github.com/frappe/hrms/releases/tag/v16.7.0", "name": "https://github.com/frappe/hrms/releases/tag/v16.7.0"}], "scope_influence": "", "tags": ["应用软件"], "title": "Frappe HR：基于支付模式报告的HRMS工资支付中的SQL注入", "_translated": true, "_saved_at": "2026-09-17T20:51:06+00:00", "_first_saved_at": "2026-09-17T20:51:06+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-evp2-t60x"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入 UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "cnvd_id": "", "cve_id": "CVE-2026-88097", "cvss": {"cvssv31": [{"source": "secure@microsoft.com", "vector": "CVSS:3.1/AV:L/AC:H/PR:N/UI:N/S:C/C:H/I:H/A:H", "severity": "high", "base_score": 8.1}]}, "cvss_score": 8.1, "cvss_vector": "CVSS:3.1/AV:L/AC:H/PR:N/UI:N/S:C/C:H/I:H/A:H", "cwe": "CWE-416", "description": "Microsoft Edge（基于 Chromium）中的释放后使用允许未经授权的攻击者在本地提升权限。", "effects": [{"comp_name": "edge_chromium", "ecosystem": "linux", "versions": [{"affected_version": "[1.0.0.0,153.0.4234.46)", "min_fixed_version": "153.0.4234.46", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "UAF", "kind_en": "免费后使用", "last_modified_time": "2026-09-19", "level": "High", "mps_id": "MPS-i51r-3ds8", "poc": false, "poc_url": [], "published_time": "2026-09-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-i51r-3ds8", "name": "https://www.oscs1024.com/hd/MPS-i51r-3ds8"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-88097", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-88097"}, {"url": "https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-88097", "name": "Microsoft Edge (Chromium-based) Elevation of Privilege Vulnerability"}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "Microsoft Edge（基于 Chrom 于应用程序或系统中存在敏感信息未经适当保护而被泄露给攻击者或未经授权的用户，这些敏感信息可能包括用户凭据、个人身份信息、敏感业务数据、系统配置信息等。信息暴露漏洞通常是由于设计、实施或配置错误引起的，例如不正确的访问控制、弱密码策略、缺乏加密、错误的日志处理等。", "title": "什么是未授权敏感信息泄露"}, {"content": "- 直接访问敏感信息：攻击者可以通过直接访问不正确配置或不受保护的资源来获取敏感信息，如通过公开可访问的URL、未经授权的文件目录访问等。\n- 越权访问：攻击者可能利用访问控制错误或不正确的权限配置来获取他们没有权限访问的敏感信息。\n- 错误信息披露：应用程序在错误处理过程中可能泄露敏感信息，例如将错误消息中的敏感数据返回给客户端或显示在日志文件中。\n- 信息泄露通过响应：攻击者可能利用应用程序在响应中不正确地包含敏感信息，如通过网页源代码、响应头部或响应消息体中的敏感数据。", "title": "未授权敏感信息泄露常见的攻击方式"}, {"content": "- 访问控制：确保只有经过授权的用户能够访问敏感信息，使用强大的身份验证和授权机制。\n- 数据加密：对于敏感信息，使用适当的加密算法对数据进行加密，包括数据传输和存储过程中的加密。\n- 错误处理和日志安全：正确处理错误情况，避免在错误消息中暴露敏感信息。同时，确保日志记录功能的安全性，避免将敏感信息记录在日志文件中。\n- 安全配置和最佳实践：遵循安全最佳实践，对应用程序、服务器和系统进行适当的配置，包括访问控制、权限管理、密码策略等。\n- 审计和监控：实施日志审计和监控机制，及时检测和响应任何异常活动或潜在的信息暴露事件。\n- 安全开发实践：在应用程序开发过程中，进行安全代码审查、漏洞扫描和安全测试，以及敏感信息的正确处理和保护。", "title": "如何预防未授权敏感信息泄露"}], "cnvd_id": "", "cve_id": "CVE-2026-1255", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "cwe": "CWE-200", "description": "WordPress 的 YS LeadGen 插件在 2.1.4 及之前的所有版本中都容易受到敏感信息泄露的影响，因为未经身份验证的用户可以访问“ysleadgen_get_captured_data”AJAX 操作。这使得未经身份验证的攻击者可以检索所有捕获的表单提交数据，包括个人身份信息 (PII)，例如通过 YS LeadGen 表单提交的姓名、电子邮件地址和消息内容。", "effects": [{"comp_name": "YS LeadGen – Popup Builder, Popup Maker \u0026 Form Builder for WordPress | Lead Generation, Email Marketing, Sales, Conversions, Opt-Ins \u0026 Subscribers", "ecosystem": "linux", "versions": [{"affected_version": "(0,2.1.4]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "未授权敏感信息泄露", "kind_en": "向未经授权的行为者泄露敏感信息", "last_modified_time": "2026-09-19", "level": "High", "mps_id": "MPS-rge8-oi0p", "poc": false, "poc_url": [], "published_time": "2026-09-19", "r - 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-93958", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:N/AC:L/Au:M/C:C/I:C/A:C", "severity": "high", "base_score": 8.3}], "cvssv3": [{"source": "VulDB", "vector": "CVSS:3.0/AV:N/AC:L/PR:H/UI:N/S:C/C:H/I:H/A:H/E:P/RL:X/RC:R", "severity": "critical", "base_score": 9.1}], "cvssv31": [{"source": "cna@vuldb.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.1}], "cvssv4": [{"source": "cna@vuldb.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.5}]}, "cvss_score": 8.5, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-78", "description": "D-Link R95 BE9500_1.00.16 中发现漏洞。该漏洞影响组件DHMAPI的文件/bin/ssi的功能系统。对 NTPServer 参数的操作会导致 os 命令注入。攻击可以远程执行。该漏洞已被公开并且可以被使用。", "effects": [{"comp_name": "R95", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,BE9500_1.00.16]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中" 源 Java WS-Policy 框架，用于解析、规范化并处理 Web 服务策略文档，主要被 Apache CXF、Axis2 等 SOAP 栈依赖。\n受影响版本中，PolicyBuilder 解析 WS-Policy 时只把 wsp:* 操作符节点计入 maxElements 与 maxAttributes 限额，断言子树由 StaxToDOMConverter.readDocElements 整段物化为 DOM 且不占用预算。攻击者可在策略断言内放入不受限额约束的元素或属性，使堆内存耗尽并造成拒绝服务。\n修复版本中通过在 StaxToDOMConverter 物化断言子树时调用 PolicyBuilder.chargeAmbientElement 与 chargeAmbientAttributes，把每个节点计入同一解析预算，超限立即中止解析；OMToDOMConverter 在存在 ambient budget 时改走同一 StAX 计费路径。", "effects": [{"comp_name": "org.apache.neethi:neethi", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,3.2.4)", "min_fixed_version": "3.2.4", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "不加限制或调节的资源分配", "kind_en": "不受限制或节流地分配资源", "last_modified_time": "2026-09-20", "level": "High", "mps_id": "MPS-295b-6bee", "poc": false, "poc_url": [], "published_time": "2026-09-20", "reference_url_list": [{"url": "http://www.mail-archive.com/announce@apache.org/msg11957.html", "name": ""}, {"url": "https://ws.apache.org/neethi/security.html", "name": ""}, {"url": "https://ws.apache.org/neethi/", "name": ""}, {"url": "https://www.openwall.com/lists/oss-security/2026/09/18/11", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-91864", "name": ""}, {"url": "https://github.com/apache/ws-neethi/commit/754397ee7309c48b3692af931efe349a0f31f11f", "name": ""}, {"url": "https://github.com/apache/ws-neethi/commit/fdaf27e3f093a4d65ce12df271d7922c74213eab", "name": ""}, {"url": "https://github.com/apache/ws-neethi/pull/72", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "Neethi策略解析拒绝服务", "_translated": true, "_saved_at": "2026-09-20T10:26:36+00:00", "_first_saved_at": "2026-09-20T10:26:36+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-295b-6bee"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-91866", "cvss": {}, "cvss_score": 7.5, "cvss_vector": "", "cwe": "CWE-407", "description": "Apache Neethi 是 Apache 基金会开源的 WS-Policy 处理框架，Maven 坐标为 org.apache.neethi:neethi，用于 Web 服务栈解析、规范化并计算策略交集。\n受影响版本中，Policy.intersect 将两侧策略交给 PolicyIntersector.intersect 计算兼容断言。当同名 PolicyContainingAssertion 成对出现时，内部会无上限地递归调用 compatiblePolicies，候选搜索随嵌套层扇出呈指数增长，导致 CPU 长时间占用并形成拒绝服务。\n修复版本中通过为单次 intersect 与 compatiblePolicies 引入 MAX_INTERSECT_STEPS 步数预算（默认 1000000），超出预算即抛出 RuntimeException，阻断无界递归候选搜索。", "effects": [{"comp_name": "org.apache.neethi:neethi", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,3.2.4)", "min_fixed_version": "3.2.4", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "低效算法复杂性", "kind_en": "低效的算法复杂性", "last_modified_time": "2026-09-20", "level": "High", "mps_id": "MPS-77bd-ec52", "poc": false, "poc_url": [], "published_time": "2026-09-20", "reference_url_list": [{"url": "https://www.openwall.com/lists/oss-security/2026/09/18/13", "name": ""}, {"url": "https://ws.apache.org/neethi/security.html", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-91866", "name": ""}, {"url": "https://ws.apache.org/neethi/", "name": ""}, {"url": "https://github.com/apache/ws-neethi/commit/5f6e31657326e7272933427424b9316f12d26147", "name": ""}, {"url": "https://github.com/apache/ws-neethi/pull/71", "name": ""}, {"url": "https://seclists.org/oss-sec/2026/q3/832", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "Neethi策略交集拒绝服务", "_translated": true, "_saved_at": "2026-09-20T10:26:40+00:00", "_first_saved_at": "2026-09-20T10:26:40+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-77bd-ec52"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-91863", "cvss": {}, "cvss_score": 7.5, "cvss_vector": "", "cwe": "CWE-674", "description": "Apache Neethi 是开源 Java WS-Policy 处理框架，以 Maven 构件 org.apache.neethi:neethi 发布，供 Web 服务栈解析和归一化策略文档。\n受影响版本中，PolicyBuilder.getPolicy 每次调用都会新建 ParseBudgetContext，而 XMLPrimitiveAssertionBuilder.build 在断言仅包含嵌套 wsp:Policy 时会再次调用 getPolicy。攻击者提交 Assertion 与 wsp:Policy 交替深层嵌套的策略文档后，maxDepth 限制被重置，解析线程栈被耗尽，解析器崩溃并形成拒绝服务。\n修复版本中通过 ThreadLocal 保存当前解析预算，使嵌套 getPolicy 继承同一 ParseBudgetContext 与 reentryDepth，超过 maxDepth 时抛出异常并中止解析。", "effects": [{"comp_name": "org.apache.neethi:neethi", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,3.2.4)", "min_fixed_version": "3.2.4", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "未经控制的递归", "kind_en": "Uncontrolled Recursion", "last_modified_time": "2026-09-20", "level": "High", "mps_id": "MPS-99ed-bb74", "poc": false, "poc_url": [], "published_time": "2026-09-20", "reference_url_list": [{"url": "https://www.openwall.com/lists/oss-security/2026/09/18/10", "name": ""}, {"url": "https://ws.apache.org/neethi/security.html", "name": ""}, {"url": "https://ws.apache.org/", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-91863", "name": ""}, {"url": "https://github.com/apache/ws-neethi/commit/d21f0a79a365b2c965016d7761bd9b5343439b5e", "name": ""}, {"url": "https://github.com/apache/ws-neethi/pull/66", "name": ""}, {"url": "https://github.com/apache/ws-neethi/releases/tag/neethi-3.2.4", "name": ""}, {"url": "https://seclists.org/oss-sec/2026/q3/829", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "Neethi不受控递归漏洞", "_translated": true, "_saved_at": "2026-09-20T10:26:39+00:00", "_first_saved_at": "2026-09-20T10:26:39+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-99ed-bb74"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能有效地控制资源的使用，导致攻击者可以利用这个漏洞耗尽应用程序所依赖的资源。这些资源可以是计算资源（CPU、内存）、网络带宽、数据库连接或其他系统资源。攻击者可以通过发送特制的请求、恶意输入或其他方式，使应用程序消耗大量资源，导致拒绝服务或系统崩溃。", "title": "什么是拒绝服务"}, {"content": "- 消耗计算资源：攻击者可以发送计算密集型的请求，例如复杂的计算、无限循环或递归操作，以耗尽应用程序的计算资源，导致应用程序无法响应其他请求。\r\n- 消耗内存资源：攻击者可以发送大量的数据或恶意输入，以导致应用程序消耗过多的内存资源，从而使系统的可用内存耗尽，并导致应用程序崩溃或变得不可用。\r\n- 消耗网络带宽：攻击者可以发送大量的请求或大型数据包，以消耗应用程序所依赖的网络带宽。这会导致其他合法用户无法正常访问应用程序或降低系统的整体网络性能。\r\n- 消耗存储资源：攻击者可以发送大量的请求或上传大文件，以耗尽应用程序的存储资源，导致系统无法处理其他请求或存储新的数据。", "title": "拒绝服务常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对输入数据进行合理的验证和过滤，防止恶意输入导致资源消耗过高。\r\n- 实施资源限制：应用程序应该实施适当的资源限制策略，例如限制计算操作的时间或次数，限制内存使用量，限制并发连接数等，以防止资源被耗尽。\r\n- 异常处理与错误恢复：应用程序应该具备健壮的异常处理和错误恢复机制，以防止因意外错误导致资源泄漏或无法释放的情况。\r\n- 资源监控与警报：应用程序应该实施适当的资源监控和警报机制，及时发现异常的资源消耗情况，并采取相应的措施来应对。\r\n- 压力测试与性能优化：应用程序应该进行压力测试，以评估其在高负载情况下的性能，并进行必要的性能优化，以确保能够有效地处理大量请求而不耗尽资源。", "title": "如何预防拒绝服务"}], "cnvd_id": "", "cve_id": "CVE-2026-91865", "cvss": {}, "cvss_score": 7.5, "cvss_vector": "", "cwe": "CWE-400", "description": "Apache Neethi 是 Apache Web Services 项目维护的开源 Java WS-Policy 框架，Maven 坐标为 org.apache.neethi:neethi，用于解析、归一化与合并 WS-Policy 文档。\n受影响版本中，攻击者可提交含多层重复 PolicyReference 的小型 WS-Policy 文档。文档经 PolicyEngine.getPolicy 进入组件后，Policy.normalize 调用 AbstractPolicyOperator.normalizeOperator 展开引用。该方法在每次展开完成后从 resolving 集合移除环检测标记，同层兄弟引用会再次完整展开同一目标策略，使展开工作量随 DAG 深度按二的幂增长；同时每层仍只产生一个 alternative，既有 MAX_ALTERNATIVES 上限无法拦截，最终耗尽 CPU 与内存并造成拒绝服务。\n修复版本中通过在 AbstractPolicyOperator 中引入 NormalizeBudget，将单次归一化的 PolicyReference 展开次数限制为 100000，超限时抛出 RuntimeException，阻断引用反复展开带来的指数级资源消耗。", "effects": [{"comp_name": "org.apache.neethi:neethi", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,3.2.4)", "min_fixed_version": "3.2.4", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "拒绝服务", "kind_en": "不受控制的资源消耗", "last_modified_time": "2026-09-20", "level": "High", "mps_id": "MPS-c855-d0c5", "poc": false, "poc_url": [], "published_time": "2026-09-20", "reference_url_list": [{"url": "https://www.openwall.com/lists/oss-security/2026/09/18/12", "name": ""}, {"url": "https://ws.apache.org/neethi/security.html", "name": ""}, {"url": "https://ws.apache.org/", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-91865", "name": ""}, {"url": "https://github.com/apache/ws-neethi/commit/dfcbf599f7a5fa63a9dbb71f84bcf6ba67a369f0", "name": ""}, {"url": "https://github.com/apache/ws-neethi/pull/67", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "Neethi策略引用膨胀漏洞", "_translated": true, "_saved_at": "2026-09-20T10:26:38+00:00", "_first_saved_at": "2026-09-20T10:26:38+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-c855-d0c5"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-94056", "cvss": {"cvssv31": [{"source": "cve@mitre.org", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:C/C:H/I:N/A:L", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:C/C:H/I:N/A:L", "cwe": "CWE-908", "description": "在 4.100.1 之前的 Exim 中，当代理协议与攻击者控制的代理一起使用时，允许攻击者从堆栈内存中读取某些未初始化的数据。", "effects": [{"comp_name": "exim", "ecosystem": "linux", "versions": [{"affected_version": "[4.83,4.100.1)", "min_fixed_version": "4.100.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "对未经初始化资源的使用", "kind_en": "使用未初始化的资源", "last_modified_time": "2026-09-20", "level": "High", "mps_id": "MPS-yr59-7bms", "poc": false, "poc_url": [], "published_time": "2026-09-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-yr59-7bms", "name": "https://www.oscs1024.com/hd/MPS-yr59-7bms"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-94056", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-94056"}, {"url": "https://lists.exim.org/lurker/message/20260918.121220.0f87338e.en.html", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-94056漏洞", "_translated": true, "_saved_at": "2026-09-20T00:33:33+00:00", "_first_saved_at": "2026-09-20T00:33:33+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-yr59-7bms"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-94113", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:N", "severity": "medium", "base_score": 6.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-862", "description": "ERPNext 是 Frappe 团队开源的企业资源计划（ERP）系统，基于 Frappe Framework 构建，提供项目、销售、财务与人力资源等业务模块，其 Timesheet（工时单）用于记录可计费工时与计费金额。\n受影响版本中，erpnext/projects/doctype/timesheet/timesheet.py 内多个经 @frappe.whitelist() 暴露为 HTTP RPC 的方法未执行 doctype 级授权   <script>
    const payload = JSON.parse(document.getElementById("payload").textContent);
    const levelLabels = payload.level_labels || {};
    const items = payload.items || [];
    let filtered = items.slice();
    let activeId = null;

    const $ = (id) => document.getElementById(id);
    $("generatedAt").textContent = payload.generated_at || "-";
    $("retention").textContent = payload.retention_days ?? "-";
    $("cutoff").textContent = payload.cutoff_date || "-";
    $("count").textContent = String(payload.count ?? items.length);

    function levelClass(level) {
      const cn = levelLabels[level] || level || "";
      if (level === "Critical" || cn === "严重") return "crit";
      if (level === "High" || cn === "高危") return "high";
      return "other";
    }
    function levelText(level) {
      return levelLabels[level] || level || "-";
    }
    function esc(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }
    function scoreText(v) {
      if (v === null || v === undefined || v === "" || v === -1) return "-";
      return String(v);
    }

    function renderList() {
      const list = $("list");
      $("listCount").textContent = String(filtered.length);
      if (!filtered.length) {
        list.innerHTML = '<div class="empty">没有匹配项</div>';
        return;
      }
      list.innerHTML = filtered.map((it) => {
        const id = it.mps_id || it.cve_id;
        const active = id === activeId ? " active" : "";
        return `
          <button class="item${active}" data-id="${esc(id)}" type="button">
            <div class="item-top">
              <span class="cve">${esc(it.cve_id || it.mps_id || "-")}</span>
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
            </div>
            <div class="title">${esc(it.title || "-")}</div>
            <div class="item-foot">
              <span>CVSS ${esc(scoreText(it.cvss_score))}</span>
              <span>${esc(it.published_time || "-")}</span>
              ${it.poc ? "<span>POC</span>" : ""}
            </div>
          </button>`;
      }).join("");
      list.querySelectorAll(".item").forEach((btn) => {
        btn.addEventListener("click", () => selectById(btn.dataset.id));
      });
    }

    function refsHtml(it) {
      const refs = Array.isArray(it.reference_url_list) ? it.reference_url_list : [];
      const links = [];
      if (it._source_page) links.push({ url: it._source_page, name: "OSCS 详情" });
      if (it.cve_id) links.push({ url: `https://nvd.nist.gov/vuln/detail/${it.cve_id}`, name: "NVD" });
      refs.forEach((r) => {
        if (r && r.url) links.push({ url: r.url, name: r.name || r.url });
      });
      const seen = new Set();
      const uniq = [];
      for (const l of links) {
        if (seen.has(l.url)) continue;
        seen.add(l.url);
        uniq.push(l);
      }
      if (!uniq.length) return '<div class="box">无参考链接</div>';
      return `<div class="refs">${uniq.map((l) =>
        `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name || l.url)}</a>`
      ).join("")}</div>`;
    }

    function articlesHtml(it) {
      const arts = Array.isArray(it.articles) ? it.articles : [];
      if (!arts.length) return "";
      return `<div class="section"><h3>相关说明</h3>${arts.map((a) => `
        <div class="article">
          <h4>${esc(a.title || "说明")}</h4>
          <p>${esc(a.content || "")}</p>
        </div>`).join("")}</div>`;
    }

    function renderDetail(it) {
      const detail = $("detail");
      if (!it) {
        detail.innerHTML = '<div class="empty">暂无数据</div>';
        return;
      }
      const pocUrls = Array.isArray(it.poc_url) ? it.poc_url : [];
      detail.innerHTML = `
        <div class="d-head">
          <div>
            <h1 class="d-title">${esc(it.title || "-")}</h1>
            <div class="ids">
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
              <span class="chip">${esc(it.cve_id || "无 CVE")}</span>
              <span class="chip">${esc(it.mps_id || "-")}</span>
              ${it.poc ? '<span class="chip">有 POC</span>' : ""}
              ${it.exp ? '<span class="chip">有 EXP</span>' : ""}
            </div>
          </div>
          <div class="actions">
            ${it._source_page ? `<a class="btn" href="${esc(it._source_page)}" target="_blank" rel="noopener">OSCS</a>` : ""}
            ${it.cve_id ? `<a class="btn" href="https://nvd.nist.gov/vuln/detail/${esc(it.cve_id)}" target="_blank" rel="noopener">NVD</a>` : ""}
          </div>
        </div>
        <div class="grid">
          <div class="stat"><div class="k">CVSS</div><div class="v">${esc(scoreText(it.cvss_score))}</div></div>
          <div class="stat"><div class="k">向量</div><div class="v">${esc(it.cvss_vector || "-")}</div></div>
          <div class="stat"><div class="k">CWE</div><div class="v">${esc(it.cwe || "-")}</div></div>
          <div class="stat"><div class="k">类型</div><div class="v">${esc(it.kind || it.kind_en || "-")}</div></div>
          <div class="stat"><div class="k">公开</div><div class="v">${esc(it.published_time || "-")}</div></div>
          <div class="stat"><div class="k">利用成本</div><div class="v">${esc(it.exploit_requirement_cost || "-")}</div></div>
          <div class="stat"><div class="k">可利用性</div><div class="v">${esc(it.exploitability || "-")}</div></div>
          <div class="stat"><div class="k">修复建议</div><div class="v">${esc(it.fix_suggestion || "-")}</div></div>
        </div>
        <div class="section"><h3>描述</h3><div class="box">${esc(it.description || "无描述")}</div></div>
        ${it.scope_influence ? `<div class="section"><h3>影响范围</h3><div class="box">${esc(it.scope_influence)}</div></div>` : ""}
        ${pocUrls.length ? `<div class="section"><h3>POC 链接</h3><div class="refs">${pocUrls.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join("")}</div></div>` : ""}
        <div class="section"><h3>参考链接</h3>${refsHtml(it)}</div>
        ${articlesHtml(it)}
      `;
    }

    function selectById(id) {
      const it = filtered.find((x) => (x.mps_id || x.cve_id) === id) ||
                 items.find((x) => (x.mps_id || x.cve_id) === id);
      if (!it) return;
      activeId = it.mps_id || it.cve_id;
      renderList();
      renderDetail(it);
      const btn = document.querySelector(`.item[data-id="${CSS.escape(activeId)}"]`);
      if (btn) btn.scrollIntoView({ block: "nearest" });
      history.replaceState(null, "", "#" + encodeURIComponent(activeId));
    }

    function applyFilter(q) {
      const query = (q || "").trim().toLowerCase();
      filtered = !query ? items.slice() : items.filter((it) => {
        const blob = [
          it.cve_id, it.mps_id, it.title, it.kind, it.kind_en, it.cwe, it.description, it.level
        ].map((x) => String(x || "").toLowerCase()).join(" ");
        return blob.includes(query);
      });
      renderList();
      if (filtered.length) {
        const still = filtered.some((x) => (x.mps_id || x.cve_id) === activeId);
        selectById(still ? activeId : (filtered[0].mps_id || filtered[0].cve_id));
      } else {
        activeId = null;
        renderDetail(null);
      }
    }

    $("search").addEventListener("input", (e) => applyFilter(e.target.value));

    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement !== $("search")) {
        e.preventDefault();
        $("search").focus();
        return;
      }
      if (!filtered.length) return;
      const idx = filtered.findIndex((x) => (x.mps_id || x.cve_id) === activeId);
      if (e.key === "ArrowDown") {
        e.preventDefault();
        const next = filtered[Math.min(filtered.length - 1, Math.max(0, idx) + 1)];
        selectById(next.mps_id || next.cve_id);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        const prev = filtered[Math.max(0, idx - 1)];
        selectById(prev.mps_id || prev.cve_id);
      }
    });

    const hashId = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    if (hashId && items.some((x) => (x.mps_id || x.cve_id) === hashId)) {
      activeId = hashId;
      renderList();
      selectById(hashId);
    } else if (items.length) {
      selectById(items[0].mps_id || items[0].cve_id);
    } else {
      renderList();
      renderDetail(null);
    }
  </script>
</body>
</html>
