analysis_status": 0, "articles": [{"content": "- 攻击者通过向受信任的数据序列化过程中添加恶意数据，从而在序列化和反序列化过程中执行恶意代码的攻击漏洞。这种漏洞通常存在于使用序列化 (serialization) 机制存储和传输数据的程序中。\n", "title": "什么是反序列化"}, {"content": "- 注入攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码注入到程序中，从而实现代码执行的目的。\n- 反射攻击：攻击者使用反射机制，在序列化过程中动态生成恶意数据，并将恶意代码注入到程序中，从而实现代码执行的目的。\n- 缓冲区溢出攻击：攻击者通过在序列化过程中向缓冲区输入恶意数据，导致缓冲区溢出，从而破坏程序的内存管理，实现代码执行的目的。\n- 格式字符串攻击：攻击者通过在序列化过程中输入恶意数据，导致程序使用错误的格式字符串，从而实现代码执行的目的。\n- 数据流攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码作为一个数据流传递给程序，从而实现代码执行的目的。\n", "title": "反序列化常见的攻击方式"}, {"content": "- 不信任输入数据：程序应该严格检查输入数据的有效性，并避免使用不受信任的数据。\n- 使用安全的序列化机制：程序应该使用安全的序列化机制，如 JSON 或 XML 序列化，而不是第三方序列化库。\n- 最小特权原则：程序应该限制对受信任数据的处理权限，并避免在运行时修改数据。\n- 代码审查和漏洞扫描：程序应该进行代码审查和漏洞扫描，以发现和修复潜在的安全漏洞。\n", "title": "如何预防反序列化"}], "cnvd_id": "", "cve_id": "CVE-2026-10196", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-502", "description": "Mail Mint – WordPress 的电子邮件营销、时事通讯、电子邮件自动化和 WooCommerce 电子邮件插件在 1.31.0 及之前的所有版本中都容易通过“handle_form_submission”函数中不受信任的输入反序列化而受到 PHP 对象注入的攻击。这使得未经身份验证的攻击者可以注入 PHP 对象。 POP 链的额外存在允许攻击者在服务器上执行代码。该漏洞已在 1.23.1 版本中部分修复。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "反序列化", "kind_en": "不可信数据的反序列化", "last_modified_time": "2026-09-05", "level": "Critical", "mps_id": "MPS-lurw-xhn1", "poc": false, "poc_url": [], "published_time": "2026-09-05", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-lurw-xhn1", "name": "https://www.oscs1024.com/hd/MPS-lurw-xhn1"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-10196", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-10196"}, {"url": "https://plugins.trac.wordpress.org/browser/mail-mint/tags/1.21.0/app/API/Actions/Frontend/FormAction.php#L59", "name": ""}, {"url": "https:// 通过在序列化过程中向缓冲区输入恶意数据，导致缓冲区溢出，从而破坏程序的内存管理，实现代码执行的目的。\n- 格式字符串攻击：攻击者通过在序列化过程中输入恶意数据，导致程序使用错误的格式字符串，从而实现代码执行的目的。\n- 数据流攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码作为一个数据流传递给程序，从而实现代码执行的目的。\n", "title": "反序列化常见的攻击方式"}, {"content": "- 不信任输入数据：程序应该严格检查输入数据的有效性，并避免使用不受信任的数据。\n- 使用安全的序列化机制：程序应该使用安全的序列化机制，如 JSON 或 XML 序列化，而不是第三方序列化库。\n- 最小特权原则：程序应该限制对受信任数据的处理权限，并避免在运行时修改数据。\n- 代码审查和漏洞扫描：程序应该进行代码审查和漏洞扫描，以发现和修复潜在的安全漏洞。\n", "title": "如何预防反序列化"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-52777", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:A/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.4}]}, "cvss_score": 9.4, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:A/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-502", "description": "YesWiki 是基于 PHP 的开源 Wiki/CMS 框架；其 BazarImportAction 在 'importentries' 模式下直接将 $_POST['importfiche'] 经 base64 解码后传入 CSVManager::importEntry，由于 unserialize 调用未限制可实例化的类，认证管理员会话在跨站请求伪造场景下可触发 PHP 对象注入，并借助 Doctrine 依赖上的 gadget chain 在服务器上执行任意 PHP 代码。\n受影响版本中，yeswiki/yeswiki Composer 包 4.6.6 之前的全部发布版本均存在该缺陷；BazarImportAction 既未对 'importentries' 分支调用 CsrfTokenController::checkToken 进行校验，CSVManager::importEntry 又以 unserialize(base64_decode($entry)) 直接反序列化请求体数据，array_map('strval', $entry) 进一步触发任意 __toString/__destruct 魔术方法，攻击者只需诱导已登录管理员访问其控制的页面并自动提交 importfiche[0]=\u003cbase64 负载\u003e，即可在服务器上实例化任意类、串联 Doctrine 链取得远程代码执行。\n修复版本中通过 yeswiki/yeswiki 4.6.6 的提交 8f70a8d6b8befa0e644d03c785701dbbc55b8fd0，将 CSVManager::importEntry 中的反序列化改为 unserialize(base64_decode($entry), ['allowed_classes' =\u003e false]) 限制允许实例化的类，并在 BazarImportAction::run() 的 'importentries' 分支前加入 $this-\u003egetService(CsrfTokenController::class)-\u003echeckToken('main', 'POST', 'csrf-token', false) 调用，配套在 bazar-import.twig 模板注入 csrf-token 隐藏字段，从对象注入与跨站请求伪造两个维度切断了攻击链。", "effects": [{"comp_name": "yeswiki/yeswiki", "ecosystem": "composer", "versions": [{"affected_version": "(-∞,4.6.6)", "min_fixed_version": "4.6.6", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "反序列化", "kind_en": "不可信数据的反序列化", "last_modified_time": "2026-09-05", "level": "Critical", "mps_id": "MPS-un01-rsdp", "poc": false, "poc_url": [], "published_time": "2026-09-05", "reference_url_list": [{"url": "https://github.com/YesWiki/yeswiki/security/advisories/GHSA-9369-69wj-7m2f", "name": ""}, {"url": "https://github.com/YesWiki/yeswiki/commit/8f70a8d6b8befa0e644d03c785701dbbc55b8fd0", "name": ""}, {"url": "https://github.com/advisories/GHSA-9369-69wj-7m2f", "name": ""}], "scope_influence": "", "tags": ["php", "开源"], "title": "YesWiki BazarImportAction PHP 对象注入漏洞", "_translated": true, "_saved_at": "2026-09-05T05:10:29+00:00", "_first_saved_at": "2026-09-05T05:10:29+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-un01-rsdp"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-75925", "cvss": {"cvssv31": [{"source": "ics-cert@hq.dhs.gov", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.6}], "cvssv4": [{"source": "ics-cert@hq.dhs.gov", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.4}]}, "cvss_score": 9.4, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-93", "description": "1.4.7 版本之前的 IXON VPN Client 中对 CRLF 序列的不正确中和允许攻击者以 root 或 SYSTEM 身份执行命令。本地服务接受的配置值将写入稍后由特权子进程使用的文件中，而行结束序列不会被中和，这允许将其他指令引入到该文件中。配置接口接受更改，而不验证或验证请求者的来源。注入的配置在客户端和操作系统重新启动后仍保留在磁盘上，并且 VPN 连接继续正常运行，因此用户看不到任何行为变化。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "CRLF注入", "kind_en": "Improper Neutralization of CRLF Sequences ('CRLF Injection')", "last_modified_time": "2026-09-05", "level": "Critical", "mps_id": "MPS-ztvf-1ejg", "poc": false, "poc_url": [], "published_time": "2026-09-05", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ztvf-1ejg", "name": "https://www.oscs1024.com/hd/MPS-ztvf-1ejg"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-75925", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-75925"}, {"url": "https://github.com/cisagov/CSAF/blob/develop/csaf_files/OT/white/2026/icsa-26-246-02.json", "name": ""}, {"url": "https://www.cisa.gov/news-events/ics-advisories/icsa-26-246-02", "name": ""}, {"url": "https://www.ixon.cloud/Advisories/ADV-2026-08-05.pdf", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-75925漏洞", "_translated": true, "_saved_at": "2026-09-05T00:33:22+00:00", "_first_saved_at": "2026-09-05T00:33:22+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ztvf-1ejg"}, {"analysis_status": 0, "articles": [{"content": "由于应用程序或系统中存在敏感信息未经适当保护而被泄露给攻击者或未经授权的用户，这些敏感信息可能包括用户凭据、个人身份信息、敏感业务数据、系统配置信息等。信息暴露漏洞通常是由于设计、实施或配置错误引起的，例如不正确的访问控制、弱密码策略、缺乏加密、错误的日志处理等。", "title": "什么是未授权敏感信息泄露"}, {"content": "- 直接访问敏感信息：攻击者可以通过直接访问不正确配置或不受保护的资源来获取敏感信息，如通过公开可访问的URL、未经授权的文件目录访问等。\n- 越权访问：攻击者可能利用访问控制错误或不正确的权限配置来获取他们没有权限访问的敏感信息。\n- 错误信息披露：应用程序在错误处理过程中可能泄露敏感信息，例如将错误消息中的敏感数据返回给客户端或显示在日志文件中。\n- 信息泄露通过响应：攻击者可能利用应用程序在响应中不正确地包含敏感信息，如通过网页源代码、响应头部或响应消息体中的敏感数据。", "title": "未授权敏感信息泄露常见的攻击方式"}, {"content": "- 访问控制：确保只有经过授权的用户能够访问敏感信息，使用强大的身份验证和授权机制。\n- 数据加密：对于敏感信息，使用适当的加密算法对数据进行加密，包括数据传输和存储过程中的加密。\n- 错误处理和日志安全：正确处理错误情况，避免在错误消息中暴露敏感信息。同时，确保日志记录功能的安全性，避免将敏感信息记录在日志文件中。\n- 安全配置和最佳实践：遵循安全最佳实践，对应用程序、服务器和系统进行适当的配置，包括访问控制、权限管理、密码策略等。\n- 审计和监控：实施日志审计和监控机制，及时检测和响应任何异常活动或潜在的信息暴露事件。\n- 安全开发实践：在应用程序开发过程中，进行安全代码审查、漏洞扫描和安全测试，以及敏感信息的正确处理和保护。", "title": "如何预防未授权敏感信息泄露"}], "cnvd_id": "", "cve_id": "CVE-2026-86190", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N", "severity": "critical", "base_score": 9.1}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-200", "description": "WWBN AVideo 是一个开源流媒体视频平台（GitHub 仓库 WWBN/AVideo，主体为 PHP），提供视频点播、直播、用户管理与观看统计等功能。\n受影响版本中，view/videoViewsInfo.json.php、view/videoViewsInfo.csv.php 与 view/videoViewsInfo.php 三个统计入口在请求携带 hash 参数时跳过 Video::canEdit() 权限检查，直接调用 VideoStatistic::getAllFromVideos_id() 获取统计数据；该函数使用 SELECT u.*, vs.* 将 users 表全部列并入观看记录并原样序列化输出，其中包括记录观看行为时经 setSession_id(session_id()) 写入的真实会话标识，以及 password、recoverPass、email、phone、address、birth_date、isAdmin 等 52 个字段，持有 hash 的匿名调用者可读取任意视频全部观看者的敏感数据，并冒用泄露的 session_id 劫持观看者会话，波及管理员账户。\n修复版本中通过在 VideoStatistic::getAllFromVideos_id() 中将查询改为仅选取 user_name、user_login、user_channelName、user_photoURL 等展示列，并在序列化前 unset($row['session_id']) 移除会话标识，使凭据与会话信息不再进入统计响应，同时在三个统计入口补充安全审查注释以保留 hash 免登录访问能力。", "effects": [{"comp_name": "AVideo", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,29.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "未授权敏感信息泄露", "kind_en": "向未经 al", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-306", "description": "1.3.0 之前的 Lara Dashboard 在屏幕截图登录路径中包含一个身份验证绕过漏洞，允许未经身份验证的攻击者在 APP_ENV 未生产时通过电子邮件以任何用户身份进行身份验证。攻击者可以使用注册的电子邮件地址请求 GET /screenshot-login/{email} 端点，以接收经过完全身份验证的会话，从而能够通过模块安装程序访问用户管理、设置、数据库内容和任意代码执行。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "关键功能的认证机制缺失", "kind_en": "缺少关键功能的身份验证", "last_modified_time": "2026-09-05", "level": "Critical", "mps_id": "MPS-zs9u-bpji", "poc": false, "poc_url": [], "published_time": "2026-09-05", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-zs9u-bpji", "name": "https://www.oscs1024.com/hd/MPS-zs9u-bpji"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-86184", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-86184"}, {"url": "https://github.com/laradashboard/laradashboard", "name": ""}, {"url": "https://github.com/laradashboard/laradashboard/blob/v1.2.2/app/Http/Controllers/Backend/Auth/ScreenshotGeneratorLoginController.php", "name": ""}, {"url": "https://github.com/laradashboard/laradashboard/commit/50986e4ac58c883dd8f064cf32be3e2a87c11b24", "name": ""}, {"url": "https://github.com/laradashboard/laradashboard/releases/tag/v1.3.0", "name": ""}, {"url": "https://github.com/laradashboard/laradashboard/security/advisories/GHSA-wj35-4h53-phfp", "name": ""}, {"url": "https://www.vulncheck.com/advisories/lara-dashboard-before-1.3.0-missing-authentication-in-screenshot-login-route", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-86184漏洞", "_translated": true, "_saved_at": "2026-09-05T13:11:43+00:00", "_first_saved_at": "2026-09-05T13:11:43+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-zs9u-bpji"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-52766", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:H/A:H", "severity": "critical", "base_score": 9.1}]}, "cvss_score": 9.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:H/A:H", "cwe": "CWE-862", "description": "YesWiki 是一款开源的 PHP wiki 引擎，通过动作（action）插件机制向访客暴露页面编辑与管理能力；在默认 `default_write_acl='*'` 配置下，匿名用户可借助 `{{erasespamedcomments}}` 动作触发对任意 wiki 页面的删除操作，导致包括首页与管理页面在内的页面被永久删除。\n受影响版本中，YesWiki \u003c=4.6.5（artifact yeswiki/yeswiki）`actions/EraseSpamedCommentsAction.php::run()` 在处理 `$_POST['clean']` 与 `$_POST['suppr'][]` 前未做任何身份或权限校验、亦未校验目标 tag 是否为评论页面，其底层调用 `PageManager::deleteOrphaned()` 名义上仅删除孤立页面、实则对 `pages`、`links`、`acls`、`triples`、`referrers`、`tags` 表发起无条件 `DELETE`；由于默认动作 ACL 模型在 `includes/YesWiki.php` 中允许 `*` 通过 `CheckModuleACL`，匿名用户只需先创建一个内容为 `{{erasespamedcomments}}` 的触发页面，再以 `clean=yes\u0026suppr[]=\u003c目标 tag\u003e` 提交 POST 请求，便可从数据库中永久删除 `PagePrincipale` 等任意页面，并写入“Effacement de : …”回显日志。\n修复版本中通过 commit ed5b548a705c8091ba0282aaaba73ddda976abef 在 YesWiki 4.6.6 中对 `EraseSpamedCommentsAction::run()` 设置三道防线：入口处调用 `$wiki-\u003eUserIsAdmin()` 拒绝非管理员；循环体内使用 `$wiki-\u003eLoadPage($page)` 校验 `$pageData['comment_on']` 非空，仅删除真正的评论页面；同时把回显的 `$_POST['suppr']` 值以 `htmlspecialchars()` 转义，缓解响应型 XSS 风险，由此切断匿名用户借助 `suppr[]` 触发任意页面删除的因果链。", "effects": [{"comp_name": "yeswiki/yeswiki", "ecosystem": "composer", "versions": [{"affected_version": "(-∞,4.6.5]", "min_fixed_version": "", "repository": "composer", "solutions": [], "upstream": true}, {"affected_version": "(-∞,4.6.6)", "min_fixed_version": "4.6.6", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-09-05", "level": "Critical", "mps_id": "MPS-rga5-ds1j", "poc": false, "poc_url": [], "published_time": "2026-09-05", "reference_url_list": [{"url": "https://github.com/YesWiki/yeswiki/security/advisories/GHSA-6x7x-gcmf-7r8x", "name": ""}, {"url": "https://github.com/YesWiki/yeswiki/commit/ed5b548a705c8091ba0282aaaba73ddda976abef", "name": ""}, {"url": "https://github.com/advisories/GHSA-6x7x-gcmf-7r8x", "name": ""}], "scope_influence": "", "tags": ["php", "开源"], "title": "YesWiki erasespamedcomments 动作未授权任意页面删除漏洞", "_translated": true, "_saved_at": "2026-09-05T05:10:37+00:00", "_first_saved_at": "2026-09-05T05:10:37+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-rga5-ds1j"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-86218", "cvss": {"cvssv4": [{"source": "a5532a13-c4dd-4202-bef1-e0b8f2f8d12b", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 10}]}, "cvss_score": 10, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-96", "description": "N-central 是 N-able 公司面向托管服务提供商（MSP）的远程监控与管理（RMM）平台，用于集中管理与监控客户网络中的终端设备，为闭源商业软件，提供本地部署与云端托管两种形态。\n受影响版本中，N-central 存在身份认证前的远程代码执行缺陷，官方将其归类为 CWE-96（静态代码注入）；未经身份认证的远程攻击者可向服务器发送恶意请求，相关输入未被正确中和而被作为代码处理，从而在服务器上执行任意代码，整个过程无需任何用户账户与用户交互，可导致服务器被攻击者完全控制。\n修复版本中通过官方补丁消除该缺陷，官方未公开具体修复代码改动，受影响用户应升级至 2026.3.1.14 及以上版本。", "effects": [{"comp_name": "n-central", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2026.3.1.14)", "min_fixed_version": "2026.3.1.14", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "静态代码注入", "kind_en": "静态保存代码中指令的不正确中和（“静态代码注入”）", "last_modified_time": "2026-09-06", "level": "Critical", "mps_id": "MPS-bsim-txon", "poc": false, "poc_url": [], "published_time": "2026-09-06", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-bsim-txon", "name": "https://www.oscs1024.com/hd/MPS-bsim-txon"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-86218", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-86218"}, {"url": "https://me.n-able.com/s/security-advisory/aArVy0000002Ld3KAE/cve202686218-preauthentication-remote-code-execution", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "N-central 认证前远程代码执行漏洞", "_translated": true, "_saved_at": "2026-09-06T05:24:56+00:00", "_first_saved_at": "2026-09-06T05:24:56+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-bsim-txon"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2026-75816", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-287", "description": "Frontend Admin by DynamiApps（插件标识 acf-frontend-form-element）是一款开源 WordPress 前端表单插件，允许站点访客在前台创建与编辑文章、用户、分类等对象，wordpress.org 显示约 9000 个活跃安装。\n受影响版本中，表单提交时携带的 _acf_objects 加密令牌由 Display_Form::get_form_data() 解密后直接写入 post_id 等对象标识且未做数值校验；当令牌携带 user_1 之类的非数值字符串时，ActionPost::conditions_logic() 在 current_user_can('edit_post') 判定前提前返回，show_form 授权关卡失效。未认证攻击者获取插件自身签发的服务端签名令牌后构造提交，把指定字段值经 acf_update_value 与 pre_update_value 写入目标用户记录，覆盖包括管理员在内任意用户的注册邮箱，再借 WordPress 原生找回密码流程完成账户接管。\n修复版本中通过在 ActionPost::conditions_logic() 仅放行 none 与 add_post 两种合法非数值状态、其余非数值 post_id 一律强制复位为 none，使编辑权限判定必然执行；同时对 _acf_objects 与动态加载路径的对象标识增加 is_numeric() 与 absint() 校验并在 ActionTerm::conditions_logic() 应用同等约束，切断未授权提交向任意用户记录写入的路径。", "effects": [{"comp_name": "acf-frontend-form-element", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,3.29.13)", "min_fixed_version": "3.29.13", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "身份验证不当", "kind_en": "认证不当", "last_modified_time": "2026-09-06", "level": "Critical", "mps_id": "MPS-medj-5szy", "poc": false, "poc_url": [], "published_time": "2026-09-06", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-medj-5szy", "name": "https://www.oscs1024.com/hd/MPS-medj-5szy"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-75816", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-75816"}, {"url": "https://plugins.trac.wordpress.org/browser/acf-frontend-form-element/tags/3.29.10/main/frontend/fields/user/class-user-email.php#L127", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/acf-frontend-form-element/tags/3.29.10/main/frontend/forms/actions/post.php#L1001", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/acf-frontend-form-element/tags/3.29.10/main/frontend/forms/actions/post.php#L1224", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/acf-frontend-form-element/tags/3.29.10/main/frontend/forms/classes/display.php#L26", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/acf-frontend-form-element/tags/3.29.10/main/frontend/forms/classes/submit.php#L125", "name": ""}, {"url": "https://plugins.trac.wordpress.org/changeset/3664865/acf-frontend-form-element", "name": ""}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/f1637a3b-7b0f-485d-9d19-4f711f8c671b?source=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Frontend Admin 未授权账户接管漏洞", "_translated": true, "_saved_at": "2026-09-06T05:24:57+00:00", "_first_saved_at": "2026-09-06T05:24:57+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-medj-5szy"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-86149", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:N/AC:L/Au:M/C:C/I:C/A:C", "severity": "high", "base_score": 8.3}], "cvssv31": [{"source": "cna@vuldb.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.1}], "cvssv4": [{"source": "cna@vuldb.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.4}]}, "cvss_score": 9.4, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-78", "description": "Tenda CP3 是滕达科技（Tenda）推出的消费级 Wi-Fi 智能网络摄像头，固件为闭源商业软件，用于家庭与商铺场景的视频监控和远程查看。\n受影响版本中，固件 Net/NetCheckPing.cpp 内的网络检测（Ping）处理逻辑直接使用外部传入的 interface_name 与 host 参数构造并执行系统命令，未做转义或白名单校验，经身份认证的远程攻击者在这两个参数中插入 shell 元字符后可改变实际执行的命令，以设备进程权限执行任意操作系统命令，进而完全控制摄像头。\n修复版本中通过在命令拼接前对 interface_name 与 host 参数执行合法性校验并过滤 shell 元字符，可切断从参数注入到命令执行的利用链；截至 2026-09-05 官方尚未发布修复固件，建议关注厂商更新并在修复发布前采取访问限制等缓解措施。", "effects": [{"comp_name": "tenda:cp3_firmware", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,27.5.57.101]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_ lutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "密码学签名的验证不恰当", "kind_en": "密码签名验证不当", "last_modified_time": "2026-09-06", "level": "Critical", "mps_id": "MPS-f480-eibt", "poc": false, "poc_url": [], "published_time": "2026-09-06", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-f480-eibt", "name": "https://www.oscs1024.com/hd/MPS-f480-eibt"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-67276", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-67276"}, {"url": "https://cert.pl/en/posts/2026/09/mikrotik-routeros-cve", "name": ""}, {"url": "https://cert.pl/en/posts/2026/09/vulnerabilities-in-mikrotik-routeros-actively-exploited/", "name": ""}, {"url": "https://forum.mikrotik.com/t/6-49-21-long-term-is-released/272802", "name": ""}, {"url": "https://forum.mikrotik.com/t/7-23-4-long-term-is-released/272801", "name": ""}, {"url": "https://forum.mikrotik.com/t/7-24-2-stable-is-released/272800", "name": ""}, {"url": "https://mikrotik.com/supportsec/september-2026-vulnerability/", "name": ""}, {"url": "https://npratley.net/reversing-mikrotiks-silent-patch-the-routeros-7-23-4-fix-they-wouldnt-explain/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "RouterOS SSH 认证绕过漏洞", "_translated": true, "_saved_at": "2026-09-06T00:29:35+00:00", "_first_saved_at": "2026-09-05T20:53:40+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-f480-eibt"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-86060", "cvss": {"cvssv4": [{"source": "cvd@cert.pl", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.2}]}, "cvss_score": 9.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-88", "description": "MikroTik RouterOS 是 MikroTik 公司开发的闭源网络操作系统，运行于其路由器、交换机等网络设备，提供路由、防火墙、VPN 以及 SSH、WebFig 等管理通道，在运营商与中小企业网络中部署广泛。\n受影响版本中，SSH 登录路径未过滤以连字符开头的用户名：/nova/bin/login 保留了供内部组件经管道传递受信任登录信息的文件描述符传输逻辑，参数以“-”开头时 login 将剩余部分经 atoi 解析为文件描述符编号，并从该描述符读取受信任的用户名与授权策略掩码字段；攻击者以形如“-2”的用户名发起 SSH 会话触达登录辅助进程后，login 转而从攻击者可控的 PTY 输入读取这两个字段，注入的策略掩码（如 654958，对应完整权限集合 0x9fe6e）经 strtoul 解析后直接成为会话授权策略，受限会话由此获得完整管理员权限。\n修复版本中通过在 libumsg.so 新增 validLoginParamInput 校验函数切断上述链路：SSH 登录路径在派生 login 子进程前校验存储的 SSH 用户名，拒绝空值、前导“-”或空格、尾随空格以及控制字符与 DEL，构造用户名“-2”被 invalid user input 拒绝，受信任字段只能来自内部受控管道，会话授权策略掩码不再可被外部输入变更。", "effects": [{"comp_name": "routeros", "ecosystem": "linux", "versions": [{"affected_version": "[7.0.0,7.23.4)", "min_fixed_version": "7.23.4", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.0.0,6.49.21)", "min_fixed_version": "6.49.21", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[7.24,7.24.2)", "min_fixed_version": "7.24.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "参数注入或修改", "kind_en": "命令中参数分隔符的不正确中和（“参数注入”）", "last_modified_time": "2026-09-06", "level": "Critical", "mps_id": "MPS-ln7d-2twz", "poc": false, "poc_url": [], "published_time": "2026-09-06", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ln7d-2twz", "name": "https://www.oscs1024.com/hd/MPS-ln7d-2twz"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-86060", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-86060"}, {"url": "https://cert.pl/en/posts/2026/09/mikrotik-routeros-cve", "name": ""}, {"url": "https://cert.pl/en/posts/2026/09/vulnerabilities-in-mikrotik-routeros-actively-exploited/", "name": ""}, {"url": "https://forum.mikroti 件执行，本地网络放行统一收敛到 ssrf-guard 的 ALLOW_LOCAL_NETWORKS 开关，并新增仓库扫描测试防止门控调用点复发；出站 Provider 请求的每一跳重定向也经新增的共享 transport 重新校验，1.0.1 起切断了该利用链。", "effects": [{"comp_name": "OpenMAIC", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.0.1)", "min_fixed_version": "1.0.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SSRF", "kind_en": "服务器端请求伪造 (SSRF)", "last_modified_time": "2026-09-06", "level": "Critical", "mps_id": "MPS-73zh-flbs", "poc": false, "poc_url": [], "published_time": "2026-09-06", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-73zh-flbs", "name": "https://www.oscs1024.com/hd/MPS-73zh-flbs"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-86259", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-86259"}, {"url": "https://github.com/THU-MAIC/OpenMAIC", "name": ""}, {"url": "https://github.com/THU-MAIC/OpenMAIC/blob/v1.0.0/app/api/generate/image/route.ts#L73-L78", "name": ""}, {"url": "https://github.com/THU-MAIC/OpenMAIC/blob/v1.0.0/middleware.ts#L60-L63", "name": ""}, {"url": "https://github.com/THU-MAIC/OpenMAIC/releases/tag/v1.0.1", "name": ""}, {"url": "https://github.com/THU-MAIC/OpenMAIC/security/advisories/GHSA-9m7h-vh2h-rc3w", "name": ""}, {"url": "https://www.vulncheck.com/advisories/openmaic-before-1.0.1-ssrf-via-environment-gated-url-validation", "name": ""}], "scope_influence": "", "tags": ["AI", "应用软件"], "title": "OpenMAIC 未授权 SSRF 漏洞", "_translated": true, "_saved_at": "2026-09-06T16:39:11+00:00", "_first_saved_at": "2026-09-06T13:53:35+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-73zh-flbs"}, {"analysis_status": 0, "articles": [{"content": "跨站点请求伪造 (CSRF)通过利用网站对用户请求的信任进行攻击。当用户在网站A登录并在同一浏览器会话中访问网站B时，攻击者可以构造特制的请求并诱使用户执行，以使网站B误以为这些请求是用户合法发起的。\n攻击者通常通过欺骗用户点击恶意链接、在受信任的网站中植入恶意代码或通过钓鱼等手段来实施CSRF攻击，一旦用户执行了恶意请求，攻击者可以以用户的身份执行任意操作，包括更改用户密码、发起资金转账或删除重要数据等。", "title": "什么是CSRF"}, {"content": "- 链接欺骗：攻击者通过向用户发送包含恶意链接的电子邮件或社交媒体消息，诱使用户点击并执行恶意请求。\n- 图片引用攻击：攻击者通过在恶意网站上包含指向目标网站的图片引用，以触发用户浏览器自动发送目标网站的请求。\n- XSS利用：如果目标网站存在XSS漏洞，攻击者可以注入恶意脚本，以使用户在浏览器中执行恶意请求。", "title": "CSRF常见的攻击方式"}, {"content": "- 随机令牌：网站可以在每个请求中包含一个随机生成的令牌（CSRF Token），并验证该令牌的有效性，以确认请求的来源是合法的。\n- SameSite Cookie：使用SameSite属性来限制跨站点请求，将Cookie的发送限制在同一站点上，减少了跨站请求伪造的风险。\n- 双重验证：对于敏感操作，网站可以要求用户进行额外的验证，例如输入验证码、提供第二个因素的身份验证等。\n- 强化浏览器策略：网站可以设置Content-Security-Policy（CSP）头，限制浏览器执行恶意脚本的能力，减少CSRF攻击的风险。\n- 限制用户操作：网站可以要求用户在执行敏感操作之前进行明确的确认或授权，防止恶意请求被误触发。\n- 安全编码实践：开发人员应遵循安全编码实践，对用户输入进行适当的验证和过滤，防止恶意请求的注入。", "title": "如何预防CSRF"}], "cnvd_id": "", "cve_id": "CVE-2026-85236", "cvss": {"cvssv4": [{"source": "5a6e4751-2f3f-4070-9419-94fb35b644e8", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:L/VA:L/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:L/VA:L/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-352", "description": "MISP 的 cullEmptyEvents 操作中存在跨站点请求伪造 (CSRF) 漏洞。端点在接受 HTTP GET 请求时执行了状态更改且不可逆的操作。\n\n\n由于无正文 GET 请求不受 CakePHP 的 CSRF 验证的约束，因此攻击者只需通过使浏览器加载精心设计的 URL（例如通过嵌入的图像或其他自动请求的资源）即可使具有足够权限的经过身份验证的 MISP 用户调用端点。\n\n\n成功利用该漏洞会触发删除已发布的空事件。删除特别重要，因为该操作使用skipBlocklist，这意味着删除的事件不会留下可能阻止或跟踪其后续同步的块列表条目。这可能会导致在没有显式用户交互的情况下意外且可能不可逆转地删除 MISP 事件记录。\n\n\n该漏洞已通过将 cullEmptyEvents 限制为 HTTP POST 请求来解决，确保 CakePHP 的正常 CSRF 保护应用于该操作。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "CSRF", "kind_en": "跨站请求伪造 (CSRF)", "last_modified_time": "2026-09-04", "level": "High", "mps_id": "MPS-d1pc-ks3n", "poc": false, "poc_url": [], "published_time": "2026-09-04", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-d1pc-ks3n", "name": "https://www.oscs1024.com/hd/MPS-d1pc-ks3n"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-85236", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-85236"}, {"url": "https://github.com/MISP/MISP/commit/2b6b3ac90", "name": ""}, {"url": "https://github.com/MISP/MISP/commit/50106c9a0", "name": ""}, {"url": "https://github.com/MISP/MISP/commit/66ecb5acb", "name": ""}, {"url": "https://github.com/MISP/MISP/commit/9c1346ce1", "name": ""}, {"url": "https://github.com/MISP/MISP/commit/cfc8b8a6d", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-85236漏洞", "_translated": true, "_saved_at": "2026-09-03T16:50:36+00:00", "_first_saved_at": "2026-09-03T16:50:36+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-d1pc-ks3n"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-18198", "cvss": {"cvssv31": [{"source": "iletisim@usom.gov.tr", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-89", "description": "GOLDENHORN ONEIT 是土耳其 TAC Bilişim Hizmetleri İç ve Dış Ticaret A.Ş. 开发的商业 IT 服务管理（ITSM）套件，集成 GRC 与风险管理能力，面向企业 IT 运维与业务流程管理，为闭源商用软件。\n受影响版本中，应用程序未对进入 SQL 语句的用户输入进行充分中和，远程攻击者使用低权限账号向受影响接口提交包含 SQL 语法的参数可触发盲注，在无页面回显的情况下逐位推断并提取数据库内容，造成敏感数据泄露与数据被篡改的风险。\n修复版本中通过发布 Göbeklitepe 版本消除该注入风险，官方安全公告建议将 GOLDENHORN ONEIT 升级至 Göbeklitepe 及以上版本。", "effects": [{"comp_name": "goldenhorn_oneit", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,\"G\\u00f6beklitepe\")", "min_fixed_version": "Göbeklitepe", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-09-04", "level": "High", "mps_id": "MPS-fab7-dwmp", "poc": false, "poc_url": [], "published_time": "2026-09-04", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-fab7-dwmp", "name": "https://www.oscs1024.com/hd/MPS-fab7-dwmp"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-18198", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-18198"}, {"url": "https://siberguvenlik.gov.tr/guvenlik-bildirimleri/detay/tr-26-0990", "name": ""}], "scope_influence": "", "tags": [], "title": "GOLDENHORN ONEIT SQL注入漏洞", "_translated": true, "_saved_at": "2026-09-04T14:41:55+00:00", "_first_saved_at": "2026-09-04T14:41:55+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-fab7-dwmp"}, {"analysis_status": 0, "articles": [{"content": "跨界内存读是指应用程序在读取内存时，未正确验证或限制读取的内存范围。攻击者利用这种漏洞可以读取应用程序内存中的敏感数据，如密码、加密密钥、会话令牌等。常见的原因是由于缓冲区溢出、格式化字符串漏洞或其他内存错误导致的。", "title": "什么是越界读取"}, {"content": "攻击者可以通过不当构造的输入来触发跨界内存读漏洞。攻击者可能会通过向应用程序发送特定的输入，使其读取超过预期的内存区域。攻击者可以利用这个漏洞来获取敏感信息，如其他用户的数据、操作系统的敏感数据或应用程序的内部状态。", "title": "越界读取常见的攻击方式"}, {"content": "- 输入验证和限制：应用程序应对所有输入数据进行严格的验证和限制。确保输入数据的长度、格式和内容符合预期，避免超出缓冲区或访问非预期的内存区域。\n- 内存安全编程实践：开发人员应使用安全的编程实践，如避免使用不安全的函数、正确处理内存分配和释放操作，以及遵循最小特权原则。\n- 使用安全的编程语言和库：选择使用安全性较高的编程语言和库，这些语言和库在内存管理和安全性方面提供了更多的保护机制。\n- 定期进行代码审查和安全测试：定期审查应用程序的代码，并进行安全测试，以发现潜在的跨界内存读漏洞。使用静态代码分析工具和漏洞扫描工具来辅助检测和修复问题。\n- 实施防御性编程技术：应用程序应采用防御性编程技术，如使用随机化地址空间布局（ASLR）、堆栈保护机制（如堆栈溢出保护）和数据执行预防（DEP）等。\n- 及时更新和修补：及时应用程序和操作系统的安全更新和补丁，以确保已知的跨界内存读漏洞得到修复。及时更新相关软件和库，以避免使用已知存在漏洞的版本。", "title": "如何预防越界读取"}], "cnvd_id": "", "cve_id": "CVE-2026-85455", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:H", "severity": "high", "base_score": 8.2}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:L/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:L/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-125", "description": "MOOS core-moos 到 10.4.0 包含 CMOOSCommPkt 中的缓冲区过度读取漏洞，其中四字节数据包在反序列化期间触发越界内存访问。 Attackers can open a TCP connection to the MOOSDB port and send a crafted short packet to read memory before authentication.", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界读取", "kind_en": "越界读取", "last_modified_time": "2026-09-04", "level": "High", "mps_id": "MPS-m837-o6rj", "poc": false, "poc_url": [], "published_time": "2026-09-04", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-m837-o6rj", "name": "https://www.oscs1024.com/hd/MPS-m837-o6rj"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-85455", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-85455"}, {"url": "https://github.com/themoos/core-moos", "name": ""}, {"url": "https://github.com/themoos/core-moos/blob/ec9c77c68fcbdef8f5e4c60fe243acd223433f0c/Core/libMOOS/Comms/MOOSCommPkt.cpp#L228", "name": ""}, {"url": "https://github.com/themoos/core-moos/commit/d30c14585753f9ae39749d9628ed1 0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:N/SC:L/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:N/SC:L/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-307", "description": "MISP 基于电子邮件的一次性密码 (OTP) 身份验证流程中存在漏洞，允许攻击者执行不受限制次数的 OTP 验证尝试。\n\n\n在验证提交的 OTP 值时，email_otp() 端点未应用暴力保护。已达到 OTP 验证阶段的攻击者（例如，在成功提供用户的主要身份验证凭据后）可以重复提交候选 OTP 值，同时同一 OTP 仍然有效。这显着增加了猜测 OTP 并绕过额外身份验证因素的可能性，从而可能导致未经授权访问受影响用户的帐户。\n\n\n由于 OTP 与用户而不是与单个挂起的登录会话关联，从而允许多个并发会话尝试猜测同一有效 OTP，这一事实加剧了该问题。\n\n\n该补丁将现有的 MISP 暴力保护机制集成到电子邮件 OTP 流程中。现在，失败的 OTP 尝试会针对用户进行计数，一旦达到配置的阈值，进一步的尝试就会被拒绝，并且当尝试预算耗尽时，活动的 OTP 将失效。列入黑名单的用户也无法请求生成新的 OTP。此外，OTP 比较现在使用 hash_equals() 并验证提交的值是否为字符串。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "过多认证尝试的限制不恰当", "kind_en": "对过多身份验证尝试的不当限制", "last_modified_time": "2026-09-04", "level": "High", "mps_id": "MPS-2756-4xom", "poc": false, "poc_url": [], "published_time": "2026-09-04", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-2756-4xom", "name": "https://www.oscs1024.com/hd/MPS-2756-4xom"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-85237", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-85237"}, {"url": "https://github.com/MISP/MISP/commit/8658062ea", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-85237漏洞", "_translated": true, "_saved_at": "2026-09-03T16:50:45+00:00", "_first_saved_at": "2026-09-03T16:50:45+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-2756-4xom"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-63219", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:N/I:H/A:N", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:N/I:H/A:N", "cwe": "CWE-862", "description": "GeoNetwork 是一个用于管理空间参考资源的目录应用程序。在版本 4.4.12 和 4.2.17 之前，用于通过文件上传创建新格式化程序的 API 端点不受保护，并允许上传外部不受控制的文件。未经身份验证的攻击者可以将任意“.xsl”或“.zip”格式化程序文件上传到服务器。  未经身份验证的攻击者可以将任意文件写入 GeoNetwork 格式化程序目录。就其本身而言，这构成了对服务器存储的未经授权的写访问。该问题已在 GeoNetwork 版本 4.4.12 和 4.2.17 中修复。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-09-04", "level": "High", "mps_id": "MPS-efgq-zd6n", "poc": false, "poc_url": [], "published_time": "2026-09-04", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-efgq-zd6n", "name": "https://www.oscs1024.com/hd/MPS-efgq-zd6n"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-63219", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-63219"}, {"url": "https://docs.geonetwork-opensource.org/4.2/overview/change-log/version-4.2.17", "name": ""}, {"url": "https:/ rsion": "(-∞,6.3 patch 6)", "min_fixed_version": "6.3 patch 6", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "PalletControl", "ecosystem": "linux", "versions": [{"affected_version": "[9.2,10 Update 9)", "min_fixed_version": "10 Update 9", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "PalletControl Cloud", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,10 Update 9)", "min_fixed_version": "10 Update 9", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "缺省权限不正确", "kind_en": "Incorrect Default Permissions", "last_modified_time": "2026-09-04", "level": "High", "mps_id": "MPS-07r1-4k3x", "poc": false, "poc_url": [], "published_time": "2026-09-04", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-07r1-4k3x", "name": "https://www.oscs1024.com/hd/MPS-07r1-4k3x"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-81302", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-81302"}, {"url": "https://jvn.jp/en/jp/JVN84094853/", "name": ""}, {"url": "https://www.jaldx.co.jp/solution/palletcontrol/2026/08/31/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "PALLET CONTROL 权限提升漏洞", "_translated": true, "_saved_at": "2026-09-04T10:22:01+00:00", "_first_saved_at": "2026-09-04T10:22:01+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-07r1-4k3x"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-85012", "cvss": {"cvssv31": [{"source": "ff89ba41-3aa1-4d27-914a-91399e9639e5", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8}], "cvssv4": [{"source": "ff89ba41-3aa1-4d27-914a-91399e9639e5", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:A/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.5}]}, "cvss_score": 8.5, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:A/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-78", "description": "在 0.3.156 之前的 Amazon Web Services codecatalyst-blueprints 中，对操作系统命令 (CWE-78) 中使用的特殊元素进行不正确的中和可能会允许有权提交到项目中存储库的用户通过精心设计的 .ownership 文件中的 [local] 合并策略条目的所有者字段中的 shell 元字符在蓝图重新合成环境中执行任意命令。\n\n\n\n版本 0.3.156 删除了所有者字段的 shell 解释，直接运行命令而不是通过 shell，并拒绝允许列表命令形式之外的值。这消除了 shell 元字符命令注入。要修复此问题，用户应升级到版本 0.3.156 或更高版本。\n\n\n\n使用 Amazon CodeCatalyst 服务无需执行任何操作。重新合成在具有范围凭据的隔离的每个项目环境中运行，并且该服务在其中应用服务器端验证，拒绝受限制的允许列表形式之外的[本地]合并策略命令，包括 0.3.156 之前发布的蓝图版本。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-09-04", "level": "High", "mps_id": "MPS-el57-42rn", "poc": false, "poc_url": [], "published_time": "2026-09-04", "reference_url_list": [{"url": "https://www.oscs1024.co ontent": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-85538", "cvss": {"cvssv4": [{"source": "5a6e4751-2f3f-4070-9419-94fb35b644e8", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:N/VI:H/VA:L/SC:N/SI:H/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.3}]}, "cvss_score": 8.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:N/VI:H/VA:L/SC:N/SI:H/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-863", "description": "MISP（Malware Information Sharing Platform）是开源威胁情报共享平台，采用 PHP 开发，供可信组织之间存储、共享与协同分析威胁事件及其属性数据。\n受影响版本中，attributes 控制器的 delete 与 deleteSelection 删除入口在动作级 ACL 检查中仅要求 perm_add 权限，随后调用的 MispAttribute::deleteAttribute() 对非站点管理员只比较用户所属组织与事件的归属组织或创建组织，全程未校验 perm_modify 或 perm_modify_org，而同一属性的编辑路径 edit() 通过 ACL::canModifyEvent() 强制要求这两项角色权限之一；因此属于事件创建组织、角色缺少修改权限的普通用户可以删除单个属性，也可以通过 deleteSelection 提交跨事件的属性 ID 列表执行批量删除，造成威胁情报数据被未授权篡改或丢失。\n修复版本中通过在 AttributesController 新增 __assertCanModifyEvents() 公共授权检查，删除前先解析目标属性涉及的全部事件，再逐事件复用与编辑操作一致的 ACL::canModifyEvent() 校验，未授权时抛出 ForbiddenException，使属性删除与属性编辑采用同一授权边界，2.5.46 起属性删除不再绕过事件修改权限。", "effects": [{"comp_name": "misp", "ecosystem": "linux", "ve , "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-lyd8-a026", "name": "https://www.oscs1024.com/hd/MPS-lyd8-a026"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-83959", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-83959"}, {"url": "https://helpx.adobe.com/security/products/substance3d-sampler/apsb26-121.html", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-83959漏洞", "_translated": true, "_saved_at": "2026-09-03T19:34:20+00:00", "_first_saved_at": "2026-09-03T19:34:20+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-lyd8-a026"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-57777", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:C/C:H/I:N/A:L", "severity": "high", "base_score": 7.6}]}, "cvss_score": 7.6, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:C/C:H/I:N/A:L", "cwe": "CWE-89", "description": "WooCommerce 是 Automattic 开发的开源 WordPress 电商插件，用于搭建在线商店并管理订单、支付与销售分析报表。\n受影响版本中，Analytics 订单报表数据存储类在构造函数中把 woocommerce_date_type 选项值未经校验地赋给 $date_column_name 属性，Orders\\Stats\\DataStore 的 get_noncached_stats_data 还会直接取用 $query_args['date_type']，该属性随后被拼接进 where_time、MAX()、ORDER BY 等 SQL 子句；拥有商店管理权限的用户可通过 /wp-json/wc-analytics/options 接口把 woocommerce_date_type 选项写成任意字符串，此后访问 Analytics 报表时注入内容进入 SQL 执行流程，形成盲注。\n修复版本中通过在 Reports\\DataStore 基类新增 sanitize_date_column_name 白名单方法，仅放行 date_created、date_created_gmt、date_paid、date_completed 四个日期列，非法值回退为默认列名，Orders 与 Orders\\Stats 数据存储在读取 woocommerce_date_type 选项及 date_type 查询参数时统一经过该方法处理，切断了选项值进入 SQL 的注入路径。", "effects": [{"comp_name": "woocommerce", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,11.0.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-09-04", "level": "High", "mps_id": "MPS-102n-3ua9", "poc": false, "poc_url": [], "published_time": "2026-09-04", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-102n-3ua9", "name": "https://www.oscs1024.com/hd/MPS-102n-3ua9"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-57777", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-57777"}, {"url": "https://github.com/woocommerce/woocommerce/pull/67554", "name": ""}, {"url": "https://patchstack.com/database/wordpress/plugin/woocommerce/vulnerability/wordpress-woocommerce-plugin-10-9-4-sql-injection-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "WooCommerce SQL注入漏洞", "_translated": true, "_saved_at": "2026-09-04T10:22:03+00:00", "_first_saved_at": "2026-09-04T10:22:03+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-102n-3ua9"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-85238", "cvss": {"cvssv4": [{"source": "5a6e4751-2f3f-4070-9419-94fb35b644e8", "vector": "CVSS:4.0/AV:N/AC:H/AT:P/PR:L/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.6}]}, "cvss_score": 7.6, "cvss_vector": "CVSS:4.0/AV:N/AC:H/AT:P/PR:L/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-384", "description": "MISP 在 CustomAuth 身份验证（自定义配置）流程中包含会话固定漏洞。当用户通过 CustomAuth 成功进行身份验证时，MISP 将经过身份验证的用户身份存储在现有会话中，而无需先轮换会话标识符。\n\n\n因此，如果攻击者可以使受害者在身份验证之前使用攻击者已知的会话标识符，则在受害者成功进行身份验证后，相同的会话标识符仍然有效。随后，攻击者可以重复使用固定会话标识符来访问受害者经过身份验证的 MISP 会话，从而可能获得与受害者帐户相关的特权。\n\n\n出现此问题的原因是 __customAuthentication() 将经过身份验证的用户写入现有的 CakePHP 会话，而对 Session-\u003erenew() 的调用之前已被禁用。当发生新的身份验证或经过身份验证的用户发生更改时，该补丁会恢复会话标识符轮换，同时避免每个请求上不必要的会话更新。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "会话固定", "kind_en": "会话固定", "last_modified_time": "2026-09-04", "level": "High", "mps_id": "MPS-2msn-i8ao", "poc": false, "poc_url": [], "published_time": "2026-09-04", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-2msn-i8ao", "name": "https://www.oscs1024.com/hd/MPS-2msn-i8ao"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-85238", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-85238"}, {"url": "https://github.com/MISP/MISP/commit/e2eb2f058", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-85238漏洞", "_translated": true, "_saved_at": "2026-09-03T16:50:39+00:00", "_first_saved_at": "2026-09-03T16:50:39+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-2msn-i8ao"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-85533", "cvss": {"cvssv4": [{"source": "5a6e4751-2f3f-4070-9419-94fb35b644e8", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:L/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.6}]}, "cvss_score": 7.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:L/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-862", "description": "MISP 是 CIRCL 维护的开源威胁情报共享平台（PHP/CakePHP），用于机构之间以事件、属性和 Galaxy Cluster 等形式共享威胁信息，并通过共享组（Sharing Group）控制数据的可见与分发范围。\n受影响版本中，AttributesController 的 add_attachment 与 edit 以及 GalaxyClustersController 的 add 与 edit 只在请求显式提交 distribution=4 时才校验 sharing_group_id 的使用授权，已登录用户提交 sharing_group_id 并省略 distribution 参数可跳过该授权检查，将事件附件、属性或 Galaxy Cluster 关联到自己无权使用的共享组；SharingGroup::fetchAllAuthorised() 在收到空标识符时按无过滤条件处理并返回全部已授权共享组，使授权判定存在 fail-open 风险，最终数据可被分发到其他共享组的成员。\n修复版本中通过新增 SharingGroup::canUse() 集中授权判定，控制器在提交任意非空 sharing_group_id 时一律执行校验，空标识符直接拒绝，切断了依赖 distribution 参数取值的旁路，恢复共享组的信息共享边界。", "effects": [{"comp_name": "misp", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.5.45]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en" :08:28+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-26f8-3oab"}, {"analysis_status": 0, "articles": [], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-82309", "cvss": {}, "cvss_score": 7.5, "cvss_vector": "", "cwe": "CWE-770", "description": "Robots::Validate 是开源 Perl 模块（CPAN 分发名 Robots-Validate），通过反向 DNS 加正向确认校验自称搜索引擎爬虫的客户端是否来自真实机器人地址，常被 PSGI/Web 应用用于机器人识别。\n受影响版本中，公开入口 validate 接收客户端 IP 与 User-Agent，当 User-Agent 命中配置了 domain 字段的机器人规则时进入内部 _check_dns：该方法先对客户端地址发起一次 PTR 查询，把应答中匹配规则域名的 ptrdname 收入 @matched，再在循环中对每个名称发起一次正向 DNS 查询做 forward-confirmed reverse DNS 验证，循环次数没有任何上限；客户端可控制自身地址反向 zone 返回的 PTR 记录数量，Net::DNS 默认在应答截断时经 TCP 重取完整 RRset，512 字节 UDP 报文上限无法约束该列表，且每个正向名称互不相同导致本地缓存全部失效，全部查询同步执行并阻塞调用方，单次请求即可产生大量出站 DNS 查询并占用服务工作进程。\n修复版本中通过新增 max_forward_lookups 属性（默认 4），在正向确认循环前以 splice 截断 @matched，把单次 validate 调用的正向 DNS 查询数量限制在配置上限内，切断了客户端借助 PTR 记录数量放大出站查询的路径，真实机器人仍可正常完成验证。", "effects": [{"comp_name": "Robots-Validate", "ecosystem": "linux", "versions": [{"affected_version": "[0.3.2,0.3.11)", "min_fixed_version": "0.3.11", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "不加限制或调节的资源分配", "kind_en": "不受限制或节流地分配资源", "last_modified_time": "2026-09-04", "level": "High", "mps_id": "MPS-8jmv-3toz", "poc": false, "poc_url": [], "published_time": "2026-09-04", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-8jmv-3toz", "name": "https://www.oscs1024.com/hd/MPS-8jmv-3toz"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-82309", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-82309"}, {"url": "https://github.com/robrwo/Robots-Validate/commit/6426178c49ff6c440922f31a92a6feb3c661b143.patch", "name": ""}, {"url": "https://github.com/robrwo/Robots-Validate/security/advisories/GHSA-6399-5qhh-48h5", "name": ""}, {"url": "https://metacpan.org/release/RRWO/Robots-Validate-v0.4.0 l/CVE-2026-85239", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-85239"}, {"url": "https://github.com/MISP/MISP/commit/a90d552b3", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-85239漏洞", "_translated": true, "_saved_at": "2026-09-03T16:50:42+00:00", "_first_saved_at": "2026-09-03T16:50:42+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-opy1-d87m"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-74236", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:N/I:H/A:H", "severity": "medium", "base_score": 6.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:N/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7}]}, "cvss_score": 7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:N/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-22", "description": "GFI Exinda AI（又称 GFI Exinda Network Orchestrator） I:H/A:L", "cwe": "CWE-93", "description": "Laravel 是一个 Web 应用程序框架。在版本 12.60.0 和 13.10.0 之前，Laravel 电子邮件验证中的 CRLF 注入漏洞与 Symfony Mailer 和 Symfony Mime 处理某些字符序列的方式相结合，可能允许未经身份验证的攻击者干扰将邮件发送到用户提供的地址的应用程序中的出站电子邮件处理。此问题已在版本 12.60.0 和 13.10.0 中修复。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "低", "fix_suggestion": "建议修复", "kind": "CRLF注入", "kind_en": "Improper Neutralization of CRLF Sequences ('CRLF Injection')", "last_modified_time": "2026-09-05", "level": "High", "mps_id": "MPS-7qnz-0fxs", "poc": true, "poc_url": [], "published_time": "2026-09-05", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-7qnz-0fxs", "name": "https://www.oscs1024.com/hd/MPS-7qnz-0fxs"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-48019", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-48019"}, {"url": "https://github.com/laravel/framework/commit/96e9a663db657cf37ef26cd794fda8ff60eaa451", "name": ""}, {"url": "https://github.com/laravel/framework/commit/f336ba79e744257f84ebf0d096b0ebc62e8e1a4d", "name": ""}, {"url": "https://github.com/laravel/framework/pull/60151", "name": ""}, {"url": "https://github.com/laravel/framework/releases/tag/v12.60.0", "name": ""}, {"url": "https://github.com/laravel/framework/releases/tag/v13.10.0", "name": ""}, {"url": "https://github.com/laravel/framework/security/advisories/GHSA-5vg9-5847-vvmq", "name": ""}], "scope_influence": "", "tags": ["poc"], "title": "CVE-2026-48019漏洞", "_translated": true, "_saved_at": "2026-09-05T00:33:16+00:00", "_first_saved_at": "2026-09-05T00:33:16+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-7qnz-0fxs"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2025-9049", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-862", "description": "WordPress 的 Nokri – 求职板 WordPress 主题容易受到未经授权的数据修改，因为在 1.6.4 及之前的所有版本中缺少对“nokri_account_member_permissions”功能的功能检查。这使得具有订阅者级别及以上访问权限的经过身份验证的攻击者可以添加具有雇主帐户成员权限的新订阅者用户，而这些用户又可以通过更新任何用户（包括管理员用户）的电子邮件地址来升级权限。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-09-05", "level": "High", "mps_id": "MPS-78gn-jl9v", "poc": false, "poc_url": [], "published_time": "2026-09-05", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-78gn-jl9v", "name": "https://www.oscs1024.com/hd/MPS-78gn-jl9v"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2025-9049", "name": "https://nvd.nist.gov/vuln/detail/CVE-2025-9049"}, {"url": "https://themeforest.net/item/nokri-job-board-wordpress-theme/22677241#item-description__nokri-theme-change-logs", "name": ""}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/e079e886-70a5-4188-ad99-96fc37651ed0?source=cve", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2025-9049漏洞", "_translated": true, "_saved_at": "2026-09-05T13:11:48+00:00", "_first_saved_at": "2026-09-05T13:11:48+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-78gn-jl9v"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-52775", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-89", "description": "YesWiki `ReactionManager::deleteUserReaction()` 在 `else` 分支直接将 URL 路径参数 `$idreaction`、`$id` 拼接进 SQL `LIKE` 子句而未转义，使任意已认证用户通过 `DELETE /api/reactions/{idreaction}/{id}/{page}/{username}` 接口即可触发 SQL 注入，进而完整读写 wiki 数据库，包括 `yeswiki_users` 表中的密码哈希与邮箱数据。\n受影响版本中，YesWiki 4.6.6 之前的全部发布版本与 `doryphore-dev` 等开发分支在 `includes/services/ReactionManager.php` 第 356 行 `else` 分支通过 `'value LIKE \\'%user\\\":\\\"' . $user . '\\\",\\\"idReaction\\\":\\\"' . $reactionId . '\\\",\\\"id\\\":\\\"' . $id . '\\\"%\\''` 拼接方式将请求参数传入 `TripleStore::delete()`，而 `includes/controllers/ApiController.php` 第 728 行 `deleteReaction()` 通过 `@Route(..., options={\"acl\":{\"+\"}})` 限定仅需已认证用户即可由 `$idreaction` 与 `$id` 路径参数触发。\n修复版本中通过 commit `90ca54fb518e1c43a1ead6e4f5bf9f0389789841`（随 v4.6.6 发布）将同分支表达式改为 `'value LIKE \\'%user\\\":\\\"' . $this-\u003edbService-\u003eescape($user) . '\\\",\\\"idReaction\\\":\\\"' . $this-\u003edbService-\u003eescape($reactionId) . '\\\",\\\"id\\\":\\\"' . $this-\u003edbService-\u003eescape($id) . '\\\"%\\''`，使三个入参在进入 `TripleStore::delete()` 之前完成 SQL 转义，与 `if` 分支一致地切断用户可控字符串进入 SQL 拼接的路径。", "effects": [{"comp_name": "yeswiki/yeswiki", "ecosystem": "composer", "versions": [{"affected_version": "(-∞,4.6.6)", "min_fixed_version": "4.6.6", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-07-12", "level": "High", "mps_id": "MPS-jywh-5qun", "poc": false, "poc_url": [], "published_time": "2026-09-05", "reference_url_list": [{"url": "https://github.com/YesWiki/yeswiki/security/advisories/GHSA-4pf7-cc4r-g63h", "name": ""}, {"url": "https://github.com/YesWiki/yeswiki/commit/90ca54fb518e1c43a1ead6e4f5bf9f0389789841", "name": ""}, {"url": "https://github.com/advisories/GHSA-4pf7-cc4r-g63h", "name": ""}], "scope_influence": "", "tags": ["php", "开源"], "title": "YesWiki ReactionManager 已认证 SQL 注入漏洞", "_translated": true, "_saved_at": "2026-09-05T05:10:31+00:00", "_first_saved_at": "2026-09-05T05:10:31+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-jywh-5qun"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "cnvd_id": "", "cve_id": "CVE-2026-81543", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-269", "description": "适用于 WordPress 的 Abandoned Cart Pro for WooCommerce 插件在 10.7.1 及之前的所有版本中都容易受到权限升级的影响。这是由于缺少对多个 AJAX 操作（包括 wcap_save_connector_settings、wcap_send_manual_email、wcap_abandoned_cart_info 和 wcap_change_manual_email_data）的功能检查和随机数验证。这使得具有订阅者级别及以上访问权限的经过身份验证的攻击者可以修改 SMTP 连接器设置，以通过攻击者控制的服务器路由管理员恢复电子邮件，并拦截自动登录链接以获得完全管理访问权限。必须启用插件的自动登录功能，这是默认配置。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-09-05", "level": "High", "mps_id": "MPS-m16k-qg85", "poc": false, "poc_url": [], "published_time": "2026-09-05", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-m16k-qg85", "name": "https://www.oscs1024.com/hd/MPS-m16k-qg85"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-81543", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-81543"}, {"url": "https://woocommerce.com/products/abandoned-cart-pro/", "name": ""}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/b8d8aa73-2e68-4353-a603-6fb61ab3406b?source=cve", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-81543漏洞", "_translated": true, "_saved_at": "2026-09-05T09:49:34+00:00", "_first_saved_at": "2026-09-05T09:49:34+00:00", "_source_page": "https://w 该载荷原样写入新账号并立即签发 JWT，持有 api.access 与 api.users.write 的非超级用户管理账号无需真实受邀者参与即可创建超级管理员账号。\n修复版本中通过在 stripSuperFlags() 的作用域循环内新增 unset($access[\"{$scope}.super\"])，与嵌套形式一并移除 admin.super 与 api.super 的点号键形式，使其与 UsersController::accessGrantsSuper() 的双形式判定保持一致，携带点号键越权标志的邀请在持久化前被清除，公开接受接口无法再将越权权限写入新账号，并新增回归测试覆盖两种载荷形式。", "effects": [{"comp_name": "getgrav/grav-plugin-api", "ecosystem": "composer", "versions": [{"affected_version": "[1.0.0,1.0.20)", "min_fixed_version": "1.0.20", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-09-05", "level": "High", "mps_id": "MPS-c70b-l2u4", "poc": false, "poc_url": [], "published_time": "2026-09-05", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-c70b-l2u4", "name": "https://www.oscs1024.com/hd/MPS-c70b-l2u4"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-86195", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-86195"}, {"url": "https://github.com/getgrav/grav/security/advisories/GHSA-m363-3hww-gcwc", "name": ""}, {"url": "https://www.vulncheck.com/advisories/grav-plugin-api-1.0.0-through-1.0.19-privilege-escalation-via-dot-keyed-super-flag", "name": ""}], "scope_influence": "", "tags": ["php", "开源"], "title": "Grav API 插件权限提升漏洞", "_translated": true, "_saved_at": "2026-09-05T18:44:32+00:00", "_first_saved_at": "2026-09-05T16:28:16+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-c70b-l2u4"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-77393", "cvss": {"cvssv31": [{"source": "ics-cert@hq.dhs.gov", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}], "cvssv4": [{"source": "ics-cert@hq.dhs.gov", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X ion 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-86177", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-862", "description": "1.14.1之前的Pterodactyl Panel无法验证计划任务创建中特定于操作的权限，从而允许仅具有schedule.update权限的子用户执行任意控制台命令。攻击者可以创建并立即触发计划任务，这些任务运行游戏服务器控制台命令、控制服务器电源状态或在没有适当授权检查的情况下创建备份。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-09-05", "level": "High", "mps_id": "MPS-lsoy-ntp4", "poc": false, "poc_url": [], "published_time": "2026-09-05", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-lsoy-ntp4", "name": "https://www.oscs1024.com/hd/MPS-lsoy-ntp4"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-86177", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-86177"}, {"u 调用 POST /api/v1/auth/reset-password 完成账号接管，超级管理员账号被接管将导致全站失陷。\n修复版本中通过新增 trustedAdminBaseUrl() 将重置、邀请与单点登录链接锚定到运维配置的 system.custom_base_url（未设置时取 plugins.login.site_host），resolveAdminBaseUrl() 与 allowedAdminOrigins() 不再使用请求派生的根 URL，并在 require_trusted_host 开启且无可信主机配置时扣发重置邮件，使重置链接无法再被投毒。", "effects": [{"comp_name": "getgrav/grav-plugin-api", "ecosystem": "composer", "versions": [{"affected_version": "(-∞,1.0.20)", "min_fixed_version": "1.0.20", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "使用欺骗进行的认证绕过", "kind_en": "通过欺骗绕过身份验证", "last_modified_time": "2026-09-05", "level": "High", "mps_id": "MPS-of4g-2nqu", "poc": false, "poc_url": [], "published_time": "2026-09-05", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-of4g-2nqu", "name": "https://www.oscs1024.com/hd/MPS-of4g-2nqu"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-86196", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-86196"}, {"url": "https://github.com/getgrav/grav/security/advisories/GHSA-262p-56vv-7v5r", "name": ""}, {"url": "https://www.vulncheck.com/advisories/grav-api-plugin-before-1.0.20-authentication-bypass-via-host-header", "name": ""}], "scope_influence": "", "tags": ["php", "开源"], "title": "Grav API 插件 Host 头投毒致账号接管", "_translated": true, "_saved_at": "2026-09-05T18:44:27+00:00", "_first_saved_at": "2026-09-05T16:28:08+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-of4g-2nqu"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-86193", "cvss": {"cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-863", "description": "grav-plugin-api 是 Grav CMS 官方维护的开源（MIT 许可）REST API 插件，为 Grav 站点提供 /api/v1 路径下的用户、页面、配置等管理接口，是新版管理后台进行用户管理的通道。\n受影响版本中，classes/Api/Controllers/UsersController.php 的目标超管防护以 accessGrantsSuper($target-\u003eget('access')) 判定目标账号是否为超级管理员，该检查只读取目标账号自身的 access 映射；而 Grav 实际授权层（核心 UserTrait::authorize() 与插件的 PermissionResolver）会合并用户组继承的权限，仅凭所属组持有 admin.super 或 api.super 的账号对这套防护不可见。持有 api.access 与 api.users.write 的非超管用户管理员请求 PATCH /api/v1/users/{username} 时可通过该防护，password 字段不在字段级权限白名单内，提交后直接改写目标账号口令，实现超级管理员账户接管；同一防护链中 api.php 的 authorizeApiKeyTarget() 对从存储加载、未经认证的用户对象调用 authorize('admin.super')，结果恒为 false，API Key 场景的目标防护从未生效。\n修复版本中通过新增 targetIsSuper() 与 accountIsSuper() 判定，在目标账号自身 access 之外遍历其所属用户组并读取 groups.{name}.access 配置，使组继承超管同样被识别为超管目标；update()、delete() 与 requireNotSuperTarget() 统一改用该判定，API Key 目标防护改为直接读取自身与组继承的有效访问映射而非依赖恒为 false 的 authorize()，切断了用户管理员改写组继承超管账号口令的越权路径。", "effects": [{"comp_name": "grav-plugin-api", "ecosystem": "linux", "versions": [{"affected_version": "
