选项，把选项键拼接到字体目录路径后调用 WPCFTO_WebFont_Loader::deleteDirFiles 递归删除，删除目标不受字体目录边界约束，从而删除站点任意文件。\n修复版本中通过将权限判断改为必须具备 manage_options 且存在 WebFont 加载类，仅向具备管理权限的用户下发 wpcfto_regenerate_fonts nonce，强制 name 与当前 option_name 一致并限制 field_name 字符范围，同时在 deleteDirFiles 内用 realpath 把删除路径限制在字体目录之内，阻止未授权任意文件删除。", "effects": [{"comp_name": "masterstudy-lms-learning-management-system", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,3.7.43)", "min_fixed_version": "3.7.43", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-08-25", "level": "High", "mps_id": "MPS-a50f-w49s", "poc": false, "poc_url": [], "published_time": "2026-08-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-a50f-w49s", "name": "https://www.oscs1024.com/hd/MPS-a50f-w49s"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-78284", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-78284"}, {"url": "https://patchstack.com/database/wordpress/plugin/masterstudy-lms-learning-management-system/vulnerability/wordpress-masterstudy-lms-plugin-3-7-42-arbitrary-file-deletion-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "MasterStudy LMS任意文件删除", "_translated": true, "_saved_at": "2026-08-25T02:16:15+00:00", "_first_saved_at": "2026-08-24T23:17:14+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-a50f-w49s"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-71943", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.2}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-78", "description": "DrayTek VigorSwitch 是商用以太网交换机产品系列，固件未开源，提供 Web 管理界面用于设备网络配置与运维。\n受影响版本中，Web 管理组件 mainfunction.cgi 的 setDevNet 函数在命令执行前未充分过滤 username 与 password 字段。远程攻击者在持有设备 Web 管理有效管理员凭证后，可通过构造恶意输入触发操作系统命令注入，并以 root 权限执行任意命令。\n修复版本中通过发布对应型号固件更新，消除 setDevNet 对 username 与 password 字段过滤不足导致的命令注入风险。", "effects": [{"comp_name": "VigorSwitch FX2120", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,3.9.10)", "min_fixed_version": "3.9.10", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "VigorSwitch G1280", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.9.10)", "min_fixed_version": "2.9.10", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "VigorSwitch G1282", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.9.10)", "min_fixed_version 全性较高的编程语言和库，这些语言和库在内存管理和安全性方面提供了更多的保护机制。\n- 定期进行代码审查和安全测试：定期审查应用程序的代码，并进行安全测试，以发现潜在的跨界内存读漏洞。使用静态代码分析工具和漏洞扫描工具来辅助检测和修复问题。\n- 实施防御性编程技术：应用程序应采用防御性编程技术，如使用随机化地址空间布局（ASLR）、堆栈保护机制（如堆栈溢出保护）和数据执行预防（DEP）等。\n- 及时更新和修补：及时应用程序和操作系统的安全更新和补丁，以确保已知的跨界内存读漏洞得到修复。及时更新相关软件和库，以避免使用已知存在漏洞的版本。", "title": "如何预防越界读取"}], "attack_vector_type": "Adjacent", "cnvd_id": "", "cve_id": "CVE-2026-75370", "cvss": {}, "cvss_score": 8.3, "cvss_vector": "", "cwe": "CWE-125", "description": "SpaceDot AcubeSAT OBC 是开源立方星星上计算机软件，运行于 Microchip ATSAMV71Q21B 微控制器，用于通过 CAN 总线处理 ECSS PUS 遥测遥控，并依赖 ecss-services 库完成报文解析与服务调度。\n受影响版本中，CAN::Application::parseTCMessage 在收到 messageType 为 0x21 的 CAN-TP 遥控后，调用 MessageParser::parseECSSTC 时把长度固定为 ECSSTCRequestStringSize（64 字节）。parseECSSTCHeader 按该长度读取 PUS 头并从 data[5] 起执行 std::copy，不核验 CAN 报文实际有效载荷。攻击者在 CAN 总线上发送短于 64 字节的遥控，即可控制 serviceType 与 messageType，使越界填充后的 Message 进入 MessageParser::execute，造成拒绝服务或执行非预期遥控。\n修复版本中通过向 parseECSSTCHeader 传入 CAN 报文实际载荷长度，替代硬编码的 64 字节，避免短报文触发越界拷贝。截至 2026-08-25，AcubeSAT OBC 软件与 ecss-services 公开仓库均未包含该修复，也未公布正式修复版本号。", "effects": [{"comp_name": "ecss-services", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.2]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "obc-software", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,eaf90ec]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界读取", "kind_en": "越界读取", "last_modified_time": "2026-08-25", "level": "High", "mps_id": "MPS-mjy2-c5zs", "poc": false, "poc_url": [], "published_time": "2026-08-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-mjy2-c5zs", "name": "https://www.oscs1024.com/hd/MPS-mjy2-c5zs"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-75370", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-75370"}, {"url": "https://github.com/dazuo233/cve/issues/5", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "AcubeSAT越界读写漏洞", "_translated": true, "_saved_at": "2026-08-24T20:22:28+00:00", "_first_saved_at": "2026-08-24T20:22:28+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-mjy2-c5zs"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-75542", "cvss": {"cvssv4": [{"source": "6b3ad84c-e1a6-4bf7-a703-f496b71e49db", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:H/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.3}]}, "cvss_score": 8.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:H/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-863", "description": "hexpm 是开源 Elixir 包仓库 hex.pm 的服务端实现，用于包发布、组织私有仓库以及基于 OAuth 的 API 访问控制。\n受影响版本中，持有 repositories 权限的 API 密钥通过 OAuth client_credentials 授权换取令牌时，HexpmWeb.API.OAuthController.validate_scopes_against_key/2 只要权限中含 :all_repositories 且请求的 scope 以 repository: 为前缀便予以放行，未把冒号后的组织名对照主体实际可达范围；expand_repositories_scope/3 只改写字面量 repositories，显式的 repository:\u003cname\u003e 会被原样写入令牌。CDN 边缘仅凭令牌中的 scope 声明授权且不查询数据库，攻击者可读取其无权访问的组织私有包，直至令牌过期。\n修复版本中通过将 validate_scopes_against_key 改为按主体解析组织名（reaches_repository?/2 调用 Hexpm.Permissions.verify_user_access/3，公开仓库 hexpm 仍对所有人开放），并在 Hexpm.OAuth.Tokens.create_for_org/6 签发时丢弃指向其他组织的 repository: 与 docs: 范围，阻止越权 scope 进入令牌，切断私有包读取路径。", "effects": [{"comp_name": "hexpm", "ecosystem": "linux", "versions": [{"affected_version": "[71829cb6f6559bcceb1ef4e43a2fb8cdd3af654b,bf0fb9d208f0acfabf7a2f7467c8231659e322a8)", "min_fixed_version": "bf0fb9d208f0acfabf7a2f7467c8231659e322a8", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[2025-10-18,2026-08-24)", "min_fixed_version": "2026-08-24", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-08-25", "level": "High", "mps_id": "MPS-vpun-fb2k", "poc": false, "poc_url": [], "published_time": "2026-08-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-vpun-fb2k", "name": "https://www.oscs1024.com/hd/MPS-vpun-fb2k"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-75542", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-75542"}, {"url": "https://cna.erlef.org/cves/CVE-2026-75542.html", "name": ""}, {"url": "https://github.com/hexpm/hexpm/commit/bf0fb9d208f0acfabf7a2f7467c8231659e322a8", "name": ""}, {"url": "https://github.com/hexpm/hexpm/security/advisories/GHSA-rfx8-w654-8cpr", "name": ""}, {"url": "https://osv.dev/vulnerability/EEF-CVE-2026-75542", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "hexpm不正确授权漏洞", "_translated": true, "_saved_at": "2026-08-24T22:19:23+00:00", "_first_saved_at": "2026-08-24T22:19:23+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-vpun-fb2k"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-77634", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.2}]}, "cvss_score": 8.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-93", "description": "CakePHP 是开源 PHP 快速开发框架，其 Mailer 组件用于构建和发送电子邮件。\n受影响版本中，SmtpTransport::_sendData 调用 Message::getHeadersString() 序列化邮件头时未剥离自定义头值中的 CRLF 字节。应用把用户可控数据传入 Message::setHeaders() 或 Message::addHeaders() 并通过 SmtpTransport 发信时，攻击者可注入额外邮件头并篡改收件人、主题或其他头字段。\n修复版本中通过向 getHeadersString() 传入回调，在写入 SMTP DATA 前用 str_replace(\"\\r\\n\", '', $val) 删除头值中的 CRLF，切断邮件头注入路径。", "effects": [{"comp_name": "cakephp/cakephp", "ecosystem": "composer", "versions": [{"affected_version": "[5.0.0,5.1.8)", "min_fixed_version": "5.1.8", "repository": "composer", "solutions": [], "upstream": true}, {"affected_version": "[4.6.0,4.6.5)", "min_fixed_version": "4.6.5", "repository": "composer", "solutions": [], "upstream": true}, {"affected_version": "[5.3.0,5.3.7)", "min_fixed_version": "5.3.7", "repository": "composer", "solutions": [], "upstream": true}, {"affected_version": "[4.5.0,4.5.12)", "min_fixed_version": "4.5.12", "repository": "composer", "solutions": [], "upstream": true}, {"affected_version": "[5.2.0,5.2.14)", "min_fixed_version": "5.2.14", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "CRLF注入", "kind_en": "Improper Neutralization of CRLF Sequences ('CRLF Injection')", "last_modified_time": "2026-08-25", "level": "High", "mps_id": "MPS-2jg6-0qfy", "poc": false, "poc_url": [], "published_time": "2026-08-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-2jg6-0qfy", "name": "https://www.oscs1024.com/hd/MPS-2jg6-0qfy"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-77634", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-77634"}, {"url": "https://github.com/cakephp/cakephp/commit/08188962bcd99a95da1e49f62e786f2d688f1e41", "name": ""}, {"url": "https://github.com/cakephp/cakephp/commit/2afe42b02d8ddc5d442bca5e8bb61910a727646e", "name": ""}, {"url": "https://github.com/cakephp/cakephp/commit/3e09dae6cbdc983754fa3a8e6aae74da102a3ea1", "name": ""}, {"url": "https://github.com/cakephp/cakephp/commit/b67b622457362b075bb37e625a82af73a0b3c9c3", "name": ""}, {"url": "https://github.com/cakephp/cakephp/security/advisories/GHSA-2qh5-382h-3jpc", "name": ""}], "scope_influence": "", "tags": ["php", "开源"], "title": "CakePHP邮件头注入漏洞", "_translated": true, "_saved_at": "2026-08-24T22:19:19+00:00", "_first_saved_at": "2026-08-24T22:19:19+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-2jg6-0qfy"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2026-77567", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N", "severity": "high", "base_score": 8.1}]}, "cvss_score": 8.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N", "cwe": "CWE-287", "description": "Filament 是开源 Laravel 全栈组件库，用于快速构建管理后台与应用界面。\n受影响版本中，当账号启用基于应用的多因素认证并开启恢复码时，登录挑战表单对一次性验证码字段 code 的必填条件在 useRecoveryCode 为 true 时被关闭，同时 recoveryCode 的无条件必填在直接改写表单状态等情况下可能未生效。攻击者在使用合法密码通过第一因素后，可将挑战表单状态 data.multiFactor.app.useRecoveryCode 设为 true 并提交空的第二因素，绕过应用多因素认证完成登录。基于电子邮件的多因素认证不受影响。\n修复版本中通过将 AppAuthentication::getChallengeFormComponents() 中 code 的 required 条件改为仅在已选择恢复码路径且 recoveryCode 非空时才放宽，并取消 recoveryCode 的无条件 required，使恢复码为空时仍要求一次性验证码，切断挑战阶段绕过第二因素的路径。", "effects": [{"comp_name": "filament/filament", "ecosystem": "composer", "versions": [{"affected_version": "[5.0.0,5.7.0)", "min_fixed_version": "5.7.0", "repository": "composer", "solutions": [], "upstream": true}, {"affected_version": "[4.0.0,4.12.0)", "min_fixed_version": "4.12.0", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "身份验证不当", "kind_en": "认证不当", "last_modified_time": "2026-08-25", "level": "High", "mps_id": "MPS-43dt-91h8", "poc": false, "poc_url": [], "published_time": "2026-08-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-43dt-91h8", "name": "https://www.oscs1024.com/hd/MPS-43dt-91h8"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-77567", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-77567"}, {"url": "https://github.com/filamentphp/filament/commit/45534a6f87f50ac6df3b43680bb33f8da9ef207b", "name": ""}, {"url": "https://github.com/filamentphp/filament/releases/tag/v4.12.0", "name": ""}, {"url": "https://github.com/filamentphp/filament/releases/tag/v5.7.0", "name": ""}, {"url": "https://github.com/filamentphp/filament/security/advisories/GHSA-52xp-w8hr-xv3c", "name": ""}], "scope_influence": "", "tags": ["php", "开源"], "title": "Filament MFA绕过漏洞", "_translated": true, "_saved_at": "2026-08-24T22:19:22+00:00", "_first_saved_at": "2026-08-24T22:19:22+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-43dt-91h8"}, {"analysis_status": 0, "articles": [], "attack_vector_type": "Local", "cnvd_id": "", "cve_id": "CVE-2026-56135", "cvss": {}, "cvss_score": 7.9, "cvss_vector": "", "cwe": "CWE-122", "description": "NTFS-3G 是 Tuxera 维护的开源用户态 NTFS 读写驱动，通过 FUSE 在 Linux 等系统上挂载 Windows NTFS 分区，发行包常将 ntfs-3g 安装为 SUID-root 二进制。\n受影响版本中，以非默认 inherit 选项挂载恶意 NTFS 镜像后，在构造目录中创建文件会进入 build_inherited_id()。该函数仅按 parentattrsz + 3*usidsz + 3*gsidsz 为继承安全描述符分配堆缓冲，无法覆盖父目录 DACL/SACL 中大量 ACCESS_DENIED CREATOR_OWNER ACE 在 ntfs_inherit_acl() 中替换为更大属主 SID 并保留原文副本时的增长，导致 SUID-root 的 ntfs-3g 进程发生堆溢出。\n修复版本中通过在分配前调用 ntfs_inherit_acl_extra_size() 统计父目录 DACL 与 SACL 内全部 ALLOW/DENY 的 CREATOR_OWNER 与 CREATOR_GROUP ACE 所需最坏额外字节，并将该余量计入 newattrsz，使 ntfs_inherit_acl() 写入不会超出堆缓冲。", "effects": [{"comp_name": "ntfs-3g", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2026.7.7)", "min_fixed_version": "2026.7.7", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "堆缓冲区溢出", "kind_en": "基于堆的缓冲区溢出", "last_modified_time": "2026-08-25", "level": "High", "mps_id": "MPS-vbl6-047o", "poc": false, "poc_url": [], "published_time": "2026-08-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-vbl6-047o", "name": "https://www.oscs1024.com/hd/MPS-vbl6-047o"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-56135", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-56135"}, {"url": "https://github.com/tuxera/ntfs-3g/security/advisories/GHSA-c9qg-fh4v-mq8r", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "NTFS-3G堆溢出漏洞", "_translated": true, "_saved_at": "2026-08-24T22:19:24+00:00", "_first_saved_at": "2026-08-24T22:19:24+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-vbl6-047o"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-7455", "cvss": {"cvssv31": [{"source": "psirt@autodesk.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "cwe": "CWE-787", "description": "Autodesk 3ds Max 是 Autodesk 推出的闭源三维建模、动画与渲染软件，用于影视、游戏和可视化内容制作。\n受影响版本中，3ds Max 解析 FLT 文件时会发生越界写入。攻击者可诱使使用者打开或导入恶意 FLT 文件，造成进程崩溃、数据损坏，或在当前进程上下文中执行任意代码。\n修复版本中通过官方安全更新修正 FLT 文件解析过程中的越界写入，使 2026.3.4 与 2027.2.0 及后续对应版本不再因恶意 FLT 文件出现崩溃、数据损坏或任意代码执行；公开资料未披露更细粒度的源码修改。", "effects": [{"comp_name": "3ds_max", "ecosystem": "linux", "versions": [{"affected_version": "[2027.0.0,2027.2.0)", "min_fixed_version": "2027.2.0", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[2026.0.0,2026.3.4)", "min_fixed_version": "2026.3.4", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_co scs1024.com/hd/MPS-7lic-v23p"}, {"analysis_status": 0, "articles": [{"content": "跨界内存读是指应用程序在读取内存时，未正确验证或限制读取的内存范围。攻击者利用这种漏洞可以读取应用程序内存中的敏感数据，如密码、加密密钥、会话令牌等。常见的原因是由于缓冲区溢出、格式化字符串漏洞或其他内存错误导致的。", "title": "什么是越界读取"}, {"content": "攻击者可以通过不当构造的输入来触发跨界内存读漏洞。攻击者可能会通过向应用程序发送特定的输入，使其读取超过预期的内存区域。攻击者可以利用这个漏洞来获取敏感信息，如其他用户的数据、操作系统的敏感数据或应用程序的内部状态。", "title": "越界读取常见的攻击方式"}, {"content": "- 输入验证和限制：应用程序应对所有输入数据进行严格的验证和限制。确保输入数据的长度、格式和内容符合预期，避免超出缓冲区或访问非预期的内存区域。\n- 内存安全编程实践：开发人员应使用安全的编程实践，如避免使用不安全的函数、正确处理内存分配和释放操作，以及遵循最小特权原则。\n- 使用安全的编程语言和库：选择使用安全性较高的编程语言和库，这些语言和库在内存管理和安全性方面提供了更多的保护机制。\n- 定期进行代码审查和安全测试：定期审查应用程序的代码，并进行安全测试，以发现潜在的跨界内存读漏洞。使用静态代码分析工具和漏洞扫描工具来辅助检测和修复问题。\n- 实施防御性编程技术：应用程序应采用防御性编程技术，如使用随机化地址空间布局（ASLR）、堆栈保护机制（如堆栈溢出保护）和数据执行预防（DEP）等。\n- 及时更新和修补：及时应用程序和操作系统的安全更新和补丁，以确保已知的跨界内存读漏洞得到修复。及时更新相关软件和库，以避免使用已知存在漏洞的版本。", "title": "如何预防越界读取"}], "attack_vector_type": "Adjacent", "cnvd_id": "", "cve_id": "CVE-2026-75369", "cvss": {}, "cvss_score": 7.5, "cvss_vector": "", "cwe": "CWE-125", "description": "SpaceDot AcubeSAT OBC 软件是开源星载计算机固件，运行于 AcubeSAT 纳卫星的 ATSAMV71 平台，负责 ECSS 遥控遥测处理以及子系统间 CAN 通信。\n受影响版本中，CAN::Application::parsePerformFunctionMessage 在读取 6 字节函数 ID 后，固定循环 ECSSFunctionMaxArgLength（32）次调用 Message::readUint8；底层 Message::readByte 只按 1024 字节缓冲区容量检查 readPosition，不校验实际 dataSize。攻击者在 CAN 总线上发送 messageType 为 PerformFunction 且参数区短于 32 字节的报文后，循环会读出内部缓冲区残留字节，写入构造的 TC 并交给 MessageParser::execute，造成拒绝服务，并可能把残留数据当作函数参数继续处理。\n修复版本中通过按报文实际剩余长度读取参数字节，避免将内部缓冲区残留数据拷入遥测遥控执行路径；截至本报告分析日，公开仓库尚未发布对应修复提交或官方修复版本。", "effects": [{"comp_name": "cross-platform-software", "ecosystem": "linux", "versions": [{"affected_version": "[1cc365a5,5d333741]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "obc-software", "ecosystem": "linux", "versions": [{"affected_version": "[eaf90ec,eaf90ec]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界读取", "kind_en": "越界读取", "last_modified_time": "2026-08-25", "level": "High", "mps_id": "MPS-85jb-hskf", "poc": false, "poc_url": [], "published_time": "2026-08-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-85jb-hskf", "name": "https://www.oscs1024.com/hd/MPS-85jb-hskf"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-75369", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-75369"}, {"url": "https://github.com/dazuo233/cve/issues/4", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "AcubeSAT越界读取漏洞", "_translated": true, "_saved_at": "2026-08-24T21:22:30+00:00", "_first_saved_at": "2026-08-24T21:22:30+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-85jb-hskf"}, {"analysis_status": 0, "articles": [{"content": "由于应用程序或系统中存在敏感信息未经适当保护而被泄露给攻击者或未经授权的用户，这些敏感信息可能包括用户凭据、个人身份信息、敏感业务数据、系统配置信息等。信息暴露漏洞通常是由于设计、实施或配置错误引起的，例如不正确的访问控制、弱密码策略、缺乏加密、错误的日志处理等。", "title": "什么是未授权敏感信息泄露"}, {"content": "- 直接访问敏感信息：攻击者可以通过直接访问不正确配置或不受保护的资源来获取敏感信息，如通过公开可访问的URL、未经授权的文件目录访问等。\n- 越权访问：攻击者可能利用访问控制错误或不正确的权限配置来获取他们没有权限访问的敏感信息。\n- 错误信息披露：应用程序在错误处理过程中可能泄露敏感信息，例如将错误消息中的敏感数据返回给客户端或显示在日志文件中。\n- 信息泄露通过响应：攻击者可能利用应用程序在响应中不正确地包含敏感信息，如通过网页源代码、响应头部或响应消息体中的敏感数据。", "title": "未授权敏感信息泄露常见的攻击方式"}, {"content": "- 访问控制：确保只有经过授权的用户能够访问敏感信息，使用强大的身份验证和授权机制。\n- 数据加密：对于敏感信息，使用适当的加密算法对数据进行加密，包括数据传输和存储过程中的加密。\n- 错误处理和日志安全：正确处理错误情况，避免在错误消息中暴露敏感信息。同时，确保日志记录功能的安全性，避免将敏感信息记录在日志文件中。\n- 安全配置和最佳实践：遵循安全最佳实践，对应用程序、服务器和系统进行适当的配置，包括访问控制、权限管理、密码策略等。\n- 审计和监控：实施日志审计和监控机制，及时检测和响应任何异常活动或潜在的信息暴露事件。\n- 安全开发实践：在应用程序开发过程中，进行安全代码审查、漏洞扫描和安全测试，以及敏感信息的正确处理和保护。", "title": "如何预防未授权敏感信息泄露"}], "cnvd_id": "", "cve_id": "CVE-2026-75099", "cvss": {}, "cvss_score": 7.5, "cvss_vector": "", "cwe": "CWE-200", "description": "Apache Allura 是 Apache 软件基金会的开源软件协作平台，用于托管代码仓库、缺陷跟踪、讨论区、Wiki 与博客，并默认提供以 /rest 为前缀的 REST API。\n受影响版本中，部分 REST 控制器未与 Web 界面实施同等访问控制。未认证请求可通过 /rest 路径直接读取本应隐藏的内容：TicketRestController.index 在工单已删除时仍返回完整 JSON；PostRestContro igh", "mps_id": "MPS-0noc-5h7t", "poc": false, "poc_url": [], "published_time": "2026-08-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-0noc-5h7t", "name": "https://www.oscs1024.com/hd/MPS-0noc-5h7t"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-78678", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-78678"}, {"url": "https://github.com/gitpython-developers/GitPython/security/advisories/GHSA-5xxx-qhh7-9287", "name": ""}, {"url": "https://www.vulncheck.com/advisories/gitpython-before-arbitrary-file-read-via-repo-blame", "name": ""}], "scope_influence": "", "tags": ["python", "开源"], "title": "GitPython任意文件读取漏洞", "_translated": true, "_saved_at": "2026-08-25T03:42:57+00:00", "_first_saved_at": "2026-08-25T03:42:57+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-0noc-5h7t"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, ": "Dolibarr银行账户越权漏洞", "_translated": true, "_saved_at": "2026-08-24T20:22:30+00:00", "_first_saved_at": "2026-08-24T20:22:30+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-gsd7-qh3y"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-71505", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:L/I:H/A:N", "severity": "high", "base_score": 7.1}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:L/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:L/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-639", "description": "Dolibarr 是开源的企业资源计划与客户关系管理软件，用于管理第三方客户、发票、会计以及客户 WebPortal。\n受影响版本中，REST API 类 Thirdparties 的站点账户写接口 putSocieteAccount 只检查调用者是否具备 societe/creer 权限，未调用 DolibarrApi::_checkAccessToResource('societe', $id) 校验对该公司的对象级访问。已认证且仅有第三方创建权限的攻击者可对无权读取的公司调用 PUT /thirdparties/{id}/accounts/{site}，并在请求体中提交 pass 字段以覆盖其 WebPortal 密码，随后以该公司身份登录门户读取发票数据；该写接口响应还会返回更新前的口令校验值。同文件中的 postSocieteAccount 与 deleteSocieteAccount 同样缺少对象级检查。\n修复版本中通过在 postSocieteAccount、putSocieteAccount 和 deleteSocieteAccount 的角色校验之后补上 _checkAccessToResource('societe', $id)，对无权访问的第三方返回 403，阻止跨公司改写或删除门户账户。", "effects": [{"comp_name": "dolibarr", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,24.0.0)", "min_fixed_version": "24.0.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "通过用户控制密钥绕过授权机制", "kind_en": "通过用户控制的密钥绕过授权", "last_modified_time": "2026-08-25", "level": "High", "mps_id": "MPS-itos-547c", "poc": false, "poc_url": [], "published_time": "2026-08-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-itos-547c", "name": "https://www.oscs1024.com/hd/MPS-itos-547c"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-71505", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-71505"}, {"url": "https://codeant.ai/security-research/cve-2026-71505-dolibarr-bola-enables-portal-account-takeover", "name": ""}, {"url": "https://github.com/Dolibarr/dolibarr/commit/4cf305ebb958eeffa921aad7c94de179b764f7e7", "name": ""}, {"url": "https://github.com/Dolibarr/dolibarr/releases/tag/24.0.0", "name": ""}, {"url": "https://www.vulncheck.com/advisories/dolibarr-rest-api-broken-object-level-authorization-via-third-party-write-route", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Dolibarr对象级越权", "_translated": true, "_saved_at": "2026-08-24T20:22:31+00:00", "_first_saved_at": "2026-08-24T20:22:31+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-itos-547c"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-78263", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:L", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:L", "cwe": "CWE-79", "description": "Event Tickets 是 Nexcess / StellarWP 开源的 WordPress 插件，用于活动售票、RSVP 与参会者管理，并内置 Tickets Commerce 处理购票订单。\n受影响版本中，Tickets Commerce 订单详情模板将参会者 meta 先经 esc_html 转义，再把首个字段拼接 `%s` 后整体交给 sprintf，并把含原始 HTML 的 Edit 链接作为格式化参数。未认证攻击者可在购物车请求的 tribe_tickets_ar_data 中写入带 sprintf 格式说明符的参会者 meta，利用 `%1$.Ns` 从该 HTML 参数截取尖括号并拼出脚本标签；管理员打开对应订单页时，脚本会在后台页面上下文执行。\n修复版本中通过停止把参会者 meta 当作 sprintf 格式串处理，改为对每个字段单独 esc_html 输出，并将 Edit 链接作为独立标记渲染，切断格式化注入绕过转义的路径。", "effects": [{"comp_name": "event-tickets", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,5.29.3)", "min_fixed_version": "5.29.3", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-08-25", "level": "High", "mps_id": "MPS-jqkf-14ui", "poc": false, "poc_url": [], "published_time": "2026-08-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-jqkf-14ui", "name": "https://www.oscs1024.com/hd/MPS-jqkf-14ui"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-78263", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-78263"}, {"url": "https://patchstack.com/database/wordpress/plugin/event-tickets/vulnerability/wordpress-event-tickets-plugin-5-29-2-1-cross-site-scripting-xss-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Event Tickets跨站脚本漏洞", "_translated": true, "_saved_at": "2026-08-25T00:55:37+00:00", "_first_saved_at": "2026-08-24T23:17:18+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-jqkf-14ui"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-77914", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:N", "severity": "medium", "base_score": 6.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-22", "description": "rConfig 是开源网络配置管理平台，用于备份、管理和审计网络设备配置。\n受影响版本中，导出下载接口 FileDownloadController::download_export 将查询参数 filename 未经净化直接拼接到 export_path() 之后作为本地下载路径。已认证用户可在 filename 中传入目录穿越序列，使解析路径离开导出目录并读取应用进程有权访问的任意文件。\n修复版本中通过 basename() 截取请求文件名，并在提供文件前确认解析后的真实路径位于导出目录内，从而阻断目录穿越读取。", "effects": [{"comp_name": "rconfig", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,8.2.13)", "min_fixed_version": "8.2.13", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-08-25", "level": "High", "mps_id": "MPS-kjcp-1yeo", "poc": false, "poc_url": [], "published_time": "2026-08-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-kjcp-1yeo", "name": "https://www.oscs1024.com/hd/MPS-kjcp-1yeo"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-77914", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-77914"}, {"url": "https://github.com/rconfig/rconfig/releases/tag/core-8.2.13", "name": ""}, {"url": "https://github.com/rconfig/rconfig/security/advisories/GHSA-m5rw-jcrm-mmwc", "name": ""}, {"url": "https://www.vulncheck.com/advisories/rconfig-v8-core-path-traversal-via-export-download-endpoint", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "rConfig路径穿越漏洞", "_translated": true, "_saved_at": "2026-08-24T18:30:44+00:00", "_first_saved_at": "2026-08-24T18:30:44+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-kjcp-1yeo"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-78679", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:N", "severity": "medium", "base_score": 6.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/A 整数溢出或环绕"}, {"content": "- 缓冲区溢出：整数溢出可能导致缓冲区溢出漏洞。当整数溢出导致分配的缓冲区大小不足以容纳结果时，攻击者可以利用这个漏洞覆盖相邻的内存区域，执行恶意代码或篡改程序的状态。\r\n- 身份验证绕过：在进行身份验证或访问控制时，整数溢出可能导致绕过验证的漏洞。攻击者可以构造特殊的输入，使溢出的整数值绕过了预期的验证逻辑，从而获得未经授权的访问权限。\r\n- 数据篡改：整数溢出可能导致数据篡改漏洞。攻击者可以通过使整数溢出，修改计数器、索引或其他控制数据的值，导致程序在处理数据时发生错误或执行意外的操作。", "title": "整数溢出或环绕常见的攻击方式"}, {"content": "- 输入验证与限制：对用户输入的整数进行合理的验证和限制，确保其在允许的范围内。\r\n- 使用安全的整数操作函数：使用安全的整数操作函数，如`add_with_overflow()`、`sub_with_overflow()`、`mul_with_overflow()`等，这些函数会检查并处理溢出情况，确保计算结果在安全范围内。\r\n- 类型检查和转换：在进行整数运算或操作之前，进行类型检查和转换，确保操作数的类型和范围是合适的。\r\n- 强制性编码标准和最佳实践：制定强制性的编码标准和最佳实践，包括对整数运算和操作的规范和限制，以帮助程序员编写更可靠、安全的代码。\r\n- 静态代码分析和测试：使用静态代码分析工具和测试技术来检测和识别潜在的整数溢出问题。这些工具可以帮助发现代码中可能存在的溢出漏洞，并及时修复。", "title": "如何预防整数溢出或环绕"}], "cnvd_id": "", "cve_id": "CVE-2026-78465", "cvss": {"cvssv31": [{"source": "secalert@redhat.com", "vector": "CVSS:3.1/AV:L/AC:H/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7}]}, "cvss_score": 7, "cvss_vector": "CVSS:3.1/AV:L/AC:H/PR:N/UI:R/S:U/C:H/I:H/A:H", "cwe": "CWE-190", "description": "GIMP（GNU Image Manipulation Program）是开源图像编辑软件，内置 file-pcx 插件用于加载和导出 PCX 图像。\n受影响版本中，仅 32 位构建会在处理 planes=4 的 PCX 时出现整数溢出：load_image 以 G_MAXSIZE / width / height \u003c 3 做溢出防护，却按 width * height * pcx_header.planes 分配缓冲；攻击者诱使用户打开宽高足够大的 4 平面 PCX 后，检查仍通过而 gsize 乘法回绕，load_24 向过小堆缓冲写入，造成堆溢出，可导致任意代码执行或拒绝服务。\n修复版本中通过在 load_image 使用 g_size_checked_mul 按实际 width、height 与 planes 计算分配大小，溢出时拒绝加载，切断错误防护与越界写入之间的因果链。该改动已合入 master 与 gimp-3-2，对应里程碑 3.2.6，截至 2026-08-25 尚无包含该提交的正式发行标签。", "effects": [{"comp_name": "gimp", "ecosystem": "linux", "versions": [{"affected_version": "[3.0.0,3.2.4]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "整数溢出或环绕", "kind_en": "整数溢出或环绕", "last_modified_time": "2026-08-25", "level": "High", "mps_id": "MPS-186m-2dpq", "poc": false, "poc_url": [], "published_time": "2 ]}, "cvss_score": 7, "cvss_vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:N/UI:N/VC:H/VI:L/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-732", "description": "RansomLook 是开源勒索软件团伙与暗网市场监控平台，基于 Flask 提供 Web 管理界面、REST API 以及受害者情报采集能力。\n受影响版本中，website/web/helpers.py 的 get_secret_key() 在首次创建 Flask 会话签名密钥文件 secret_key 时调用 Path.open(\"wb\")，未显式限制文件权限，进程在常见 umask 022 下会生成 0644 权限文件。能够访问 RansomLook 主目录的其他本地用户可读取该密钥，伪造已认证会话 Cookie 并冒充包括管理员在内的用户；该密钥还参与遗留 API-key 的 PBKDF2 派生。启用 LDAP 时，user_loader 不要求用户名存在于本地用户表，伪造会话更加直接。\n修复版本中通过改用 os.open 以 0600 权限原子创建 secret_key，并在每次启动时将已有密钥文件权限收紧为仅属主可读写，切断其他本地用户读取会话签名密钥的路径。", "effects": [{"comp_name": "ransomlook", "ecosystem": "linux", "versions": [{"affected_version": "[0,2.0.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "关键资源权限分配不当", "kind_en": "关键资源的权限分配不正确", "last_modified_time": "2026-08-25", "level": "High", "mps_id": "MPS-6qpz-lkcu", "poc": false, "poc_url": [], "published_time": "2026-08-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-6qpz-lkcu", "name": "https://www.oscs1024.com/hd/MPS-6qpz-lkcu"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-78553", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-78553"}, {"url": "https://github.com/RansomLook/RansomLook/commit/df9d47edcf02dd0125db869d5bc19d93f426d892", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "RansomLook密钥权限漏洞", "_translated": true, "_saved_at": "2026-08-24T21:22:26+00:00", "_first_saved_at": "2026-08-24T21:22:26+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-6qpz-lkcu"}]}</script>
  <script>
    const payload = JSON.parse(document.getElementById("payload").textContent);
    const levelLabels = payload.level_labels || {};
    const items = payload.items || [];
    let filtered = items.slice();
    let activeId = null;

    const $ = (id) => document.getElementById(id);
    $("generatedAt").textContent = payload.generated_at || "-";
    $("retention").textContent = payload.retention_days ?? "-";
    $("cutoff").textContent = payload.cutoff_date || "-";
    $("count").textContent = String(payload.count ?? items.length);

    function levelClass(level) {
      const cn = levelLabels[level] || level || "";
      if (level === "Critical" || cn === "严重") return "crit";
      if (level === "High" || cn === "高危") return "high";
      return "other";
    }
    function levelText(level) {
      return levelLabels[level] || level || "-";
    }
    function esc(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }
    function scoreText(v) {
      if (v === null || v === undefined || v === "" || v === -1) return "-";
      return String(v);
    }

    function renderList() {
      const list = $("list");
      $("listCount").textContent = String(filtered.length);
      if (!filtered.length) {
        list.innerHTML = '<div class="empty">没有匹配项</div>';
        return;
      }
      list.innerHTML = filtered.map((it) => {
        const id = it.mps_id || it.cve_id;
        const active = id === activeId ? " active" : "";
        return `
          <button class="item${active}" data-id="${esc(id)}" type="button">
            <div class="item-top">
              <span class="cve">${esc(it.cve_id || it.mps_id || "-")}</span>
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
            </div>
            <div class="title">${esc(it.title || "-")}</div>
            <div class="item-foot">
              <span>CVSS ${esc(scoreText(it.cvss_score))}</span>
              <span>${esc(it.published_time || "-")}</span>
              ${it.poc ? "<span>POC</span>" : ""}
            </div>
          </button>`;
      }).join("");
      list.querySelectorAll(".item").forEach((btn) => {
        btn.addEventListener("click", () => selectById(btn.dataset.id));
      });
    }

    function refsHtml(it) {
      const refs = Array.isArray(it.reference_url_list) ? it.reference_url_list : [];
      const links = [];
      if (it._source_page) links.push({ url: it._source_page, name: "OSCS 详情" });
      if (it.cve_id) links.push({ url: `https://nvd.nist.gov/vuln/detail/${it.cve_id}`, name: "NVD" });
      refs.forEach((r) => {
        if (r && r.url) links.push({ url: r.url, name: r.name || r.url });
      });
      const seen = new Set();
      const uniq = [];
      for (const l of links) {
        if (seen.has(l.url)) continue;
        seen.add(l.url);
        uniq.push(l);
      }
      if (!uniq.length) return '<div class="box">无参考链接</div>';
      return `<div class="refs">${uniq.map((l) =>
        `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name || l.url)}</a>`
      ).join("")}</div>`;
    }

    function articlesHtml(it) {
      const arts = Array.isArray(it.articles) ? it.articles : [];
      if (!arts.length) return "";
      return `<div class="section"><h3>相关说明</h3>${arts.map((a) => `
        <div class="article">
          <h4>${esc(a.title || "说明")}</h4>
          <p>${esc(a.content || "")}</p>
        </div>`).join("")}</div>`;
    }

    function renderDetail(it) {
      const detail = $("detail");
      if (!it) {
        detail.innerHTML = '<div class="empty">暂无数据</div>';
        return;
      }
      const pocUrls = Array.isArray(it.poc_url) ? it.poc_url : [];
      detail.innerHTML = `
        <div class="d-head">
          <div>
            <h1 class="d-title">${esc(it.title || "-")}</h1>
            <div class="ids">
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
              <span class="chip">${esc(it.cve_id || "无 CVE")}</span>
              <span class="chip">${esc(it.mps_id || "-")}</span>
              ${it.poc ? '<span class="chip">有 POC</span>' : ""}
              ${it.exp ? '<span class="chip">有 EXP</span>' : ""}
            </div>
          </div>
          <div class="actions">
            ${it._source_page ? `<a class="btn" href="${esc(it._source_page)}" target="_blank" rel="noopener">OSCS</a>` : ""}
            ${it.cve_id ? `<a class="btn" href="https://nvd.nist.gov/vuln/detail/${esc(it.cve_id)}" target="_blank" rel="noopener">NVD</a>` : ""}
          </div>
        </div>
        <div class="grid">
          <div class="stat"><div class="k">CVSS</div><div class="v">${esc(scoreText(it.cvss_score))}</div></div>
          <div class="stat"><div class="k">向量</div><div class="v">${esc(it.cvss_vector || "-")}</div></div>
          <div class="stat"><div class="k">CWE</div><div class="v">${esc(it.cwe || "-")}</div></div>
          <div class="stat"><div class="k">类型</div><div class="v">${esc(it.kind || it.kind_en || "-")}</div></div>
          <div class="stat"><div class="k">公开</div><div class="v">${esc(it.published_time || "-")}</div></div>
          <div class="stat"><div class="k">利用成本</div><div class="v">${esc(it.exploit_requirement_cost || "-")}</div></div>
          <div class="stat"><div class="k">可利用性</div><div class="v">${esc(it.exploitability || "-")}</div></div>
          <div class="stat"><div class="k">修复建议</div><div class="v">${esc(it.fix_suggestion || "-")}</div></div>
        </div>
        <div class="section"><h3>描述</h3><div class="box">${esc(it.description || "无描述")}</div></div>
        ${it.scope_influence ? `<div class="section"><h3>影响范围</h3><div class="box">${esc(it.scope_influence)}</div></div>` : ""}
        ${pocUrls.length ? `<div class="section"><h3>POC 链接</h3><div class="refs">${pocUrls.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join("")}</div></div>` : ""}
        <div class="section"><h3>参考链接</h3>${refsHtml(it)}</div>
        ${articlesHtml(it)}
      `;
    }

    function selectById(id) {
      const it = filtered.find((x) => (x.mps_id || x.cve_id) === id) ||
                 items.find((x) => (x.mps_id || x.cve_id) === id);
      if (!it) return;
      activeId = it.mps_id || it.cve_id;
      renderList();
      renderDetail(it);
      const btn = document.querySelector(`.item[data-id="${CSS.escape(activeId)}"]`);
      if (btn) btn.scrollIntoView({ block: "nearest" });
      history.replaceState(null, "", "#" + encodeURIComponent(activeId));
    }

    function applyFilter(q) {
      const query = (q || "").trim().toLowerCase();
      filtered = !query ? items.slice() : items.filter((it) => {
        const blob = [
          it.cve_id, it.mps_id, it.title, it.kind, it.kind_en, it.cwe, it.description, it.level
        ].map((x) => String(x || "").toLowerCase()).join(" ");
        return blob.includes(query);
      });
      renderList();
      if (filtered.length) {
        const still = filtered.some((x) => (x.mps_id || x.cve_id) === activeId);
        selectById(still ? activeId : (filtered[0].mps_id || filtered[0].cve_id));
      } else {
        activeId = null;
        renderDetail(null);
      }
    }

    $("search").addEventListener("input", (e) => applyFilter(e.target.value));

    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement !== $("search")) {
        e.preventDefault();
        $("search").focus();
        return;
      }
      if (!filtered.length) return;
      const idx = filtered.findIndex((x) => (x.mps_id || x.cve_id) === activeId);
      if (e.key === "ArrowDown") {
        e.preventDefault();
        const next = filtered[Math.min(filtered.length - 1, Math.max(0, idx) + 1)];
        selectById(next.mps_id || next.cve_id);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        const prev = filtered[Math.max(0, idx - 1)];
        selectById(prev.mps_id || prev.cve_id);
      }
    });

    const hashId = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    if (hashId && items.some((x) => (x.mps_id || x.cve_id) === hashId)) {
      activeId = hashId;
      renderList();
      selectById(hashId);
    } else if (items.length) {
      selectById(items[0].mps_id || items[0].cve_id);
    } else {
      renderList();
      renderDetail(null);
    }
  </script>
</body>
</html>
