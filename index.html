u7-awhk"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-72852", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.5}]}, "cvss_score": 8.5, "cvss_vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-787", "description": "hank-ai/darknet 通过以未经检查的 32 位 int 算术乘以从 .cfg 文件中获取的配置字段来调整卷积层的权重和输出堆缓冲区的大小。在 src-lib/convolutional_layer.cpp 中，l.nweights 计算为 (c / groups) * n * size * size，l.outputs 计算为 l.out_h * l.out_w * l.out_c，并且两者都直接输入 xcalloc。真实维度积超过 INT_MAX 的 .cfg 会回绕到较小值或零值，因此分配大小不足；例如，宽度和高度为 256，过滤器为 65536 的结果为 2^32，它会换算为 0。forward_convolutional_layer 然后使用不同的操作数顺序重新导出 GEMM 维度，将 k 计算为 l.size*l.size*l.c / l.groups，其中分配在乘法之前进行划分，并通过尺寸不足的缓冲区进行读取和写入。加载精心设计的 .cfg 进行推理或训练就足够了，不需要有效的 .weights 文件。所报告的概念证明观察到在相同输入的发布版本中，AddressSanitizer MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-347", "description": "HP OMEN Gaming Hub 是惠普为 OMEN 系列游戏 PC 预装的闭源 Windows 客户端软件，用于控制设备灯光、性能模式、风扇曲线与温度监控等硬件功能。\n受影响版本中，OMEN Gaming Hub 对部分组件的访问控制与加密签名校验不充分（CWE-347：对加密签名的验证不当），具备本地账户的低权限攻击者可绕过预期安全检查，在目标机器上提升权限并以更高权限上下文执行任意代码。\n修复版本中通过 HP 安全公告 HPSBGN04144 加固了受影响组件的访问控制与签名验证逻辑，切断了本地权限提升路径；建议升级至 1101.2608.0.0 及以上版本。", "effects": [{"comp_name": "OMEN Gaming Hub", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1101.2608.0.0)", "min_fixed_version": "1101.2608.0.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "密码学签名的验证不恰当", "kind_en": "密码签名验证不当", "last_modified_time": "2026-08-21", "level": "High", "mps_id": "MPS-up8l-fo7q", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-up8l-fo7q", "name": "https://www.oscs1024.com/hd/MPS-up8l-fo7q"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-75946", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-75946"}, {"url": "https://support.hp.com/us-en/document/ish_15491615-15491654-16/hpsbgn04144", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "HP OMEN Gaming Hub本地权限提升漏洞", "_translated": true, "_saved_at": "2026-08-21T15:26:38+00:00", "_first_saved_at": "2026-08-21T15:26:38+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-up8l-fo7q"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-47884", "cvss": {}, "cvss_score": 8.1, "cvss_vector": "", "cwe": "CWE-22", "description": "Spring Framework 是开源 Java 应用开发框架，spring-webmvc 模块提供 XsltView，用于将模型数据经 XSLT 样式表转换为响应内容。\n受影响版本中，XsltView.getStylesheetSource() 将视图 URL 直接交给 ApplicationContext.getResource() 加载样式表，未限制路径穿越、URL 协议或 url: 前缀。当应用配置了会导致视图渲染且未显式指定视图名的 \"/**\" 映射时，请求路径可成为样式表位置，从而发起 SSRF，并在加载恶意 XSLT 后执行远程代码。\n修复版本中通过在 getStylesheetSource() 中调用 ResourceHandlerUtils.normalizeInputPath() 与 shouldIgnoreInputPath() 拒绝非法样式表位置，阻断不可信路径进入资源加载与 XSLT 变换流程。", "effects": [{"comp_name": "org.springframework:spring-webmvc", "ecosystem": "maven", "versions": [{"affected_version": "[6.2.0,6.2.20)", "min_fixed_version": "6.2.20", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[7.0.0,7.0.9)", "min_fixed_version": "7.0.9", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[6.0.0,6.0.31)", "min_fixed_version": "6.0.31", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "(-∞,5.2.26)", "min_fixed_version": "5.2.26", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[6.1.0,6.1.29)", "min_fixed_version": "6.1.29", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[5.3.0,5.3.50)", "min_fixed_version": "5.3.50", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-08-21", "level": "High", "mps_id": "MPS-93b3-a54b", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://spring.io/security/cve-2026-47884", "name": ""}, {"url": "https://spring.io/security/cve-2026-47884/", "name": ""}, {"url": "https://github.com/spring-projects/spring-framework/commit/692dbc9160de3b5de50ccedeee014716d0cedb7b", "name": ""}, {"url": "https://github.com/spring-projects/spring-framework/issues/37029", "name": ""}, {"url": "https://github.com/spring-projects/spring-framework/releases/tag/v7.0.9", "name": ""}, {"url": "https://cwe.mitre.org/data/definitions/22.html", "name": ""}, {"url": "https://cwe.mitre.org/data/definitions/918.html", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "Spring XsltView路径限制不当", "_translated": true, "_saved_at": "2026-08-20T18:29:33+00:00", "_first_saved_at": "2026-08-20T18:29:33+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-93b3-a54b"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-65644", "cvss": {}, "cvss_score": 8, "cvss_vector": "", "cwe": "CWE-79", "description": "Rocket.Chat 是开源团队聊天与客服平台，使用 TypeScript/React 与 Node.js 构建，提供 Livechat 实时客服等 Omnichannel 能力。\n受影响版本中，公开 REST 端点 POST /api/v1/livechat/visitor（即 apps/meteor/server/api/v1/omnichannel/visitor.ts 中 livechat/visitor 路由的 post 方法）以 Match.Maybe(String) 接收未经身份校验的 visitor.name 字段，并通过 saveRoomInfo 写入访客名称。随后前端 InquireSidePanelItem.tsx 在渲染 Omnichannel 侧栏消息预览时，将该名称以模板字符串 `${room.lastMessage.u.name || room.lastMessage.u.username}` 直接拼接到 message，并整体赋给 \u003cspan dangerouslySetInnerHTML={{ __html: message }}\u003e，导致客服在查看队列时被注入指向任意域名的可点击链接或社工文本。\n修复版本中通过在 InquireSidePanelItem.tsx 引入 escapeHTML 包住访客名称输出，确保写入的原始字符串在进入 dangerouslySetInnerHTML 之前被转义，切断存储型 XSS 的渲染路径。", "effects": [{"comp_name": "rocket.chat", "ecosystem": "npm", "versions": [{"affected_version": "(-∞,7.10.15)", "min_fixed_version": "7.10.15", "repository": "npm", "solutions": [], "upstream": true}, {"affected_version": "[8.1.0,8.1.8)", "min_fixed_version": "8.1.8", "repository": "npm", "solutions": [], "upstream": true}, {"affected_version": "[8.5.0,8.5.3)", "min_fixed_version": "8.5.3", "repository": "npm", "solutions": [], "upstream": true}, {"affected_version": "[8.7.0,8.7.1)", "min_fixed_version": "8.7.1", "repository": "npm", "solutions": [], "upstream": true}, {"affected_version": "[8.4.0,8.4.6)", "min_fixed_version": "8.4.6", "repository": "npm", "solutions": irement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "服务端安全的客户端实施", "kind_en": "服务器端安全的客户端实施", "last_modified_time": "2026-08-21", "level": "High", "mps_id": "MPS-i75r-vbgp", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-i75r-vbgp", "name": "https://www.oscs1024.com/hd/MPS-i75r-vbgp"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73267", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73267"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-73267", "name": ""}, {"url": "https://bugzilla.redhat.com/show_bug.cgi?id=2514218", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-73267漏洞", "_translated": true, "_saved_at": "2026-08-21T04:31:51+00:00", "_first_saved_at": "2026-08-21T04:31:51+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-i75r-vbgp"}, {"analysis_status": 0, "articles": [{"content": "由于应用程序或系统中存在敏感信息未经适当保护而被泄露给攻击者或未经授权的用户，这些敏感信息可能包括用户凭据、个人身份信息、敏感业务数据、系统配置信息等。信息暴露漏洞通常是由于设计、实施或配置错误引起的，例如不正确的访问控制、弱密码策略、缺乏加密、错误的日志处理等。", "title": "什么是未授权敏感信息泄露"}, {"content": "- 直接访问敏感信息：攻击者可以通过直接访问不正确配置或不受保护的资源来获取敏感信息，如通过公开可访问的URL、未经授权的文件目录访问等。\n- 越权访问：攻击者可能利用访问控制错误或不正确的权限配置来获取他们没有权限访问的敏感信息。\n- 错误信息披露：应用程序在错误处理过程中可能泄露敏感信息，例如将错误消息中的敏感数据返回给客户端或显示在日志文件中。\n- 信息泄露通过响应：攻击者可能利用应用程序在响应中不正确地包含敏感信息，如通过网页源代码、响应头部或响应消息体中的敏感数据。", "title": "未授权敏感信息泄露常见的攻击方式"}, {"content": "- 访问控制：确保只有经过授权的用户能够访问敏感信息，使用强大的身份验证和授权机制。\n- 数据加密：对于敏感信息，使用适当的加密算法对数据进行加密，包括数据传输和存储过程中的加密。\n- 错误处理和日志安全：正确处理错误情况，避免在错误消息中暴露敏感信息。同时，确保日志记录功能的安全性，避免将敏感信息记录在日志文件中。\n- 安全配置和最佳实践：遵循安全最佳实践，对应用程序、服务器和系统进行适当的配置，包括访问控制、权限管理、密码策略等。\n- 审计和监控：实施日志审计和监控机制，及时检测和响应任何异常活动或潜在的信息暴露事件。\n- 安全开发实践：在应用程序开发过程中，进行安全代码审查、漏洞扫描和安全测试，以及敏感信息的正确处理和保护。", "title": "如何预防未授权敏感信息泄露"}], "cnvd_id": "", "cve_id": "CVE-2026-73137", "cvss": {"cvssv31": [{"source": "secalert@redhat.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:N/A:N", "severity": "high", "base_score": 7.7}]}, "cvss_score": 7.7, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:N/A:N", "cwe": "CWE-200", "description": "红帽高级集群管理 (RHACM) 的 multicloud-operators-subscription 组件中发现了一个缺陷。具有 HelmRelease 创建权限的租户可以通过操纵“secretRef.Namespace”字段来利用此漏洞。这允许 HelmRelease 控制器中的 GetSecret() 函数从任何命名空间获取敏感凭据，然后将其发送到攻击者控制的 Helm 存储库。这可能导致凭证从任意命名空间 Secret 中泄露，从而导致信息泄露。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "未授权敏感信息泄露", "kind_en": "向未经授权的行为者泄露敏感信息", "last_modified_time": "2026-08-21", "level": "High", "mps_id": "MPS-o4y7-hsrp", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-o4y7-hsrp", "name": "https://www.oscs1024.com/hd/MPS-o4y7-hsrp"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73137", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73137"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-73137", "name": ""}, {"url": "https://bugzilla.redhat.com/show_bug.cgi?id=2514223", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-73137漏洞", "_translated": true, "_saved_at": "2026-08-20T22:20:17+00:00", "_first_saved_at": "2026-08-20T22:20:17+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-o4y7-hsrp"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-47877", "cvss": {}, "cvss_score": 7.6, "cvss_vector": "", "cwe": "CWE-79", "description": "Spring Security Authorization Server 是 Spring Security 提供的开源 OAuth2 / OpenID Connect 授权服务器实现，用于在 OAuth2 授权码流程中向最终用户展示客户端的授权请求并收集用户授权。\n受影响版本中，org.springframework.security.oauth2.server.authorization.web.DefaultConsentPage 类的 generateConsentPage 方法在拼接 HTML 时未对用户可控值进行 HTML 实体编码，直接将 clientId、principal.getName()、state、userCode、request.getRequestURI() 以及 requestedScopes 中的 scope 字符串拼接进 HTML 输出。攻击者可以通过构造恶意的 OAuth2 授权请求，将这些字段设置为包含 JavaScript 或 HTML 片段的值，这些值会在用户后续访问默认同意页时被原样渲染，从而触发反射型/存储型跨站脚本（XSS），可在最终用户的浏览器会话中执行任意脚本、窃取会话凭据或进行钓鱼等操作。使用自定义 consent page（通过 OAuth2AuthorizationServerConfigurer.authorizationEndpoint(c -\u003e c.consentPage(...)) 配置）的应用不受影响。\n修复版本中通过在 generateConsentPage 中引入 org.springframework.web.util.HtmlUtils.htmlEscape，对 clientId、state、principal.getName()、request.getRequestURI()、userCode 以及每个 scope 分别进行 HTML 实体编码后再拼接到 HTML 中，切断用户可控字符串直接进入响应体的路径，并新增回归测试 doFilterWhenAuthorizationRequestConsentRequiredThenConsentResponseHtmlEscaped 验证 HTML 转义已被应用。", "effects": [{"comp_name": "org.springframework.security:spring-security-oauth2-authorization-server", "ecosystem": "maven", "versions": [{"affected_version": "[7.1.0,7.1.0]", "min_fixed_version": "", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[7.0.0,7.0.6]", "min_fixed_version": "", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-08-21", "level": "High", "mps_id": "MPS-63ad-e9d1", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://spring.io/security/cve-2026-47877", "name": ""}, {"url": "https://github.com/spring-projects/spring-security/commit/ac15cdbea3f89b3b6882ff25e2a5a9a4b7b99a76", "name": ""}, {"url": "https://github.com/spring-projects/spring-security/releases/tag/7.0.7", "name": ""}, {"url": "https://nvd.nist.gov/vuln-metrics/cvss/v3-calculator?vector=AV:N/AC:L/PR:N/UI:R/S:C/C:H/I:L/A:N\u0026version=3.1", "name": ""}], "scope_influence": "", "tags": [], "title": "Spring Security Authorization Server 默认同意页跨站脚本漏洞", "_translated": true, "_saved_at": "2026-08-21T07:37:38+00:00", "_first_saved_at": "2026-08-21T06:35:32+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-63ad-e9d1"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，从而导致未授权的用户或资源可以被访问或篡改。", "title": "什么是访问控制不当"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n", "title": "访问控制不当常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防访问控制不当"}], "cnvd_id": "", "cve_id": "CVE-2026-65613", "cvss": {}, "cvss_score": 7.6, "cvss_vector": "", "cwe": "CWE-284", "description": "Apache CloudStack 是开源基础设施即服务（IaaS）云管理平台，提供计算、网络、存储资源编排和租户隔离能力，Webhook 模块用于把平台事件推送到外部 URL。\n受影响版本中，WebhookApiServiceImpl 的 listWebhookDeliveries 与 deleteWebhookDelivery 在按账号或域校验调用者可见 Webhook 之前就允许发起搜索与删除。listWebhookDeliveries 调用 webhookDeliveryJoinDao.searchAndCountByListApiParameters 时，仅在调用者显式传入 webhookId 时才用其过滤，否则直接调用 getIdsOfAccessibleWebhooks(caller) 返回 root admin 的空列表，导致非 admin 调用者提供的 webhookId 不在自身可见集时仍可越权命中其他账号下的交付记录并读取；deleteWebhookDelivery 直接把入参 webhookId 透传给 webhookDeliveryDao.deleteByDeleteApiParams，未先用 isCallerRootAdmin 与 getIdsOfAccessibleWebhooks 把可删除范围收缩到调用者自身可见的 Webhook，且 basicWebhookDeliveryApiCheck 调用时未传入 isCallerRootAdmin，跨账号交付也可被删除。\n修复版本中通过在 basicWebhookDeliveryApiCheck 增加 isCallerRootAdmin 形参并在 listWebhookDeliveries、deleteWebhookDelivery 中显式调用 accountManager.isRootAdmin 与 accountManager.isAdmin 重新判定调用者身份，把 list 与 delete 的范围限制到 getIdsOfAccessibleWebhooks 返回的可见 Webhook 集，同时把 isCallerRootAdmin 透传到 DAO 层 searchAndCountByListApiParameters 与 deleteByDeleteApiParams，避免 root admin 拿到空列表时退化为未过滤查询，切断了跨账号读取与跨账号删除路径。", "effects": [{"comp_name": "apache-cloudstack", "ecosystem": "linux", "versions": [{"affected_version": "[4.20.0.0,4.20.3.1)", "min_fixed_version": "4.20.3.1", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[4.21.0.0,4.22.1.1)", "min_fixed_version": "4.22.1.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "访问控制不当", "kind_en": "访问控制不当", "last_modified_time": "2026-08-21", "level": "High", "mps_id": "MPS-pxqk-jrd3", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-pxqk-jrd3", "name": "https://www.oscs1024.com/hd/MPS-pxqk-jrd3"}, {"url": "https://nvd.nist.gov/vuln/detai tream": true}, {"affected_version": "[2.0.0,2.0.0]", "min_fixed_version": "", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "未经控制的递归", "kind_en": "Uncontrolled Recursion", "last_modified_time": "2026-08-21", "level": "High", "mps_id": "MPS-12d7-0d70", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://spring.io/security/cve-2026-47851", "name": ""}, {"url": "https://github.com/spring-projects/spring-ai/commit/8a1fd8ed79011f63c1d9c02fec52778416a3d2d2", "name": ""}, {"url": "https://github.com/spring-projects/spring-ai/issues/6753", "name": ""}, {"url": "https://nvd.nist.gov/vuln-metrics/cvss/v3-calculator?vector=AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H\u0026version=3.1", "name": ""}], "scope_influence": "", "tags": ["AI", "java", "开源"], "title": "Spring AI PDF Document Reader 目录树递归栈溢出漏洞", "_translated": true, "_saved_at": "2026-08-21T12:34:32+00:00", "_first_saved_at": "2026-08-21T12:34:32+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-12d7-0d70"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-16959", "cvss": {}, "cvss_score": 7.5, "cvss_vector": "", "cwe": "CWE-89", "description": "Media Library Assistant 是面向 WordPress 的开源媒体库增强插件，遵循 GPLv2+ 许可并托管于 WordPress.org 插件 SVN 仓库，主要用于扩展附件管理、媒体库查询与相册短代码。\n受影响版本中，MLAQuery::mla_query_list_table_items 入口接收用户提交的 mla_search_connector 参数后，由 _prepare_list_table_query 内部的 switch/case 直接将其写入 $clean_request，未做任何白名单校验；随后该值会作为 AND/OR 连接词拼接到搜索生成的 SQL WHERE 子句中。具有 Author 及以上权限的攻击者可构造恶意 mla_search_connector 参数，将任意 SQL 片段注入到 WordPress 数据库查询中，从而读取或篡改 wp_posts、wp_options 等表内容。\n修复版本中通过在 _prepare_list_table_query 的 switch 中新增 mla_search_connector 分支，仅当值匹配 OR 时保留 OR，否则统一规范化为 AND，使连接词被严格限制在两个常量之间，从根本上切断不可信值进入 SQL 字符串的链路。", "effects": [{"comp_name": "media-library-assistant", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,3.40)", "min_fixed_version": "3.40", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-08-21", "level": "High", "mps_id": "MPS-5yqg-f9kd", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-5yqg-f9kd", "name": "https://www.oscs1024.com/hd/MPS-5yqg-f9kd"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-16959", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-16959"}, {"url": "https://wpscan.com/vulnerability/7b13e3d3-42ee-4fe2-bb47-75bd2273f1b0/", "name": ""}], "scope_influence": "", "tags": [], "title": "Media Library Assistant SQL注入漏洞", "_translated": true, "_saved_at": "2026-08-21T08:32:41+00:00", "_first_saved_at": "2026-08-21T08:32:41+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-5yqg-f9kd"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-59279", "cvss": {}, "cvss_score": 7.5, "cvss_vector": "", "cwe": "CWE-770", "description": "Spring AI is an open-source application framework for building AI/LLM applications; its MCP module provides Model Context Protocol (MCP) server transports for integrating LLM agents with tools and data sources, and ships both a WebFlux and a WebMvc Streamable HTTP server transport provider.\n受影响版本中，MCP Streamable HTTP server transport 在 POST 请求处理方法 handlePost 收到 method 为 initialize 的 JSON-RPC 请求时，会无条件地通过 sessionFactory.startSession 创建新会话并写入 sessions 这个 ConcurrentHashMap，且默认不要求客户端认证，也没有对 sessions 容量做任何上限控制；远程攻击者可以持续发送 initialize 请求，使服务端在内存中累积无界的会话对象并最终耗尽可用内存，导致面向所有合法客户端的拒绝服务。\n修复版本中通过在 WebFluxStreamableServerTransportProvider 与 WebMvcStreamableServerTransportProvider 中引入 maxSessions 上限与会话空闲回收机制解决了该问题：构造器新增 maxSessions 与可选的 sessionIdleTimeout 参数，启动一个基于 Flux.interval 的 idleSessionScheduler 周期调用 evictIdleSessions，并新增 lastAccess 时间表 sessionLastAccessTimes；在 handlePost 创建会话前增加 if (this.sessions.size() \u003e= this.maxSessions) 检查，超限时返回 503 Service Unavailable 并以 INTERNAL_ERROR 消息 Max number of sessions reached 拒绝新增会话。", "effects": [{"comp_name": "org.springframework.ai:spring-ai-mcp", "ecosystem": "maven", "versions": [{"affected_version": "[2.0.0,2.0.0]", "min_fixed_version": "", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "不加限制或调节的资源分配", "kind_en": "不受限制或节流地分配资源", "last_modified_time": "2026-08-21", "level": "High", "mps_id": "MPS-9d85-d0a6", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://spring.io/security/cve-2026-59279", "name": ""}, {"url": "https://spring.io/security/cve-2026-59279/", "name": ""}, {"url": "https://github.com/spring-projects/spring-ai/commit/023867c80be379f53296fbb0002ac522d0d44449", "name": ""}, {"url": "https://github.com/spring-projects/spring-ai/blob/v2.0.1/mcp/transport/mcp-spring-webflux/src/main/java/org/springframework/ai/mcp/server/webflux/transport/WebFluxStreamableServerTransportProvider.java", "name": ""}, {"url": "https://github.com/spring-projects/spring-ai/blob/v2.0.1/mcp/transport/mcp-spring-webmvc/src/main/java/org/springframework/ai/mcp/server/webmvc/transport/WebMvcStreamableServerTransportProvider.java", "name": ""}, {"url": "https://github.com/spring-projects/spring-ai/releases/tag/v2.0.1", "name": ""}, {"url": "https://github.com/spring-projects/spring-ai/security/advisories", "name": ""}], "scope_influence": "", "tags": ["AI", "java", "开源"], "title": "Spring AI MCP Streamable HTTP 服务器传输无界会话分配拒绝服务", "_translated": true, "_saved_at": "2026-08-21T18:27:53+00:00", "_first_saved_at": "2026-08-21T12:34:30+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-9d85-d0a6"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-16323", "cvss": {"cvssv31": [{"source": "iletisim@usom.gov.tr", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "cwe": "CWE-698", "description": "ArchitectPanel Web Admin Panel 是 FuyaWeb Internet and Informatics Services 提供的商用 Web 管理面板，用于对网络与信息服务设备进行集中管理与维护，源代码未公开。\n受影响版本中，面板在基于重定向的访问控制路径上存在执行后重定向（Execution After Redirect，EAR）缺陷。攻击者可在未提供有效凭据的前提下，使服务端在重定向指令发出之后继续执行后续受保护逻辑，从而绕过认证并访问仅限管理员的接口与数据。\n修复版本中通过厂商安全更新收紧了认证路径在重定向后的执行控制，公开资料未披露更细粒度的源码修改，建议向厂商索取并部署 28072026 之后的修复构建。", "effects": [{"comp_name": "ArchitectPanel Web Admin Panel", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,28072026]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "重定向后执行（EAR）", "kind_en": "重定向后执行 (EAR)", "last_modified_time": "2026-08-21", "level": "High", "mps_id": "MPS-km3a-6rty", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-km3a-6rty", "name": "https://www.oscs1024.com/hd/MPS-km3a-6rty"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-16323", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-16323"}, {"url": "https://siberguvenlik.gov.tr/guvenlik-bildirimleri/detay/tr-26-0882", "name": ""}], "scope_influence": "", "tags": [], "title": "ArchitectPanel Web Admin Panel 执行后重定向（EAR）认证绕过漏洞", "_translated": true, "_saved_at": "2026-08-21T09:30:09+00:00", "_first_saved_at": "2026-08-21T09:30:09+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-km3a-6rty"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-77642", "cvss": {"cvssv31": [{"source": "cve@mitre.org", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:C/C:N/I:L/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:C/C:N/I:L/A:H", "cwe": "CWE-787", "description": "0.4.9.9 之前的 tor 在解析具有意外签名摘要类型的共识或分离签名时容易出现越界写入。对于大多数 Tor 角色来说影响很小，但对于目录权限来说影响可能很大。这是 TROVE-2026-019。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-08-21", "level": "High", "mps_id": "MPS-ognc-av43", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ognc-av43", "name": "https://www.oscs1024.com/hd/MPS-ognc-av43"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-77642", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-77642"}, {"url": "https://gitlab.torproject.org/tpo/core/tor/-/raw/tor-0.4.9.9/ChangeLog", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-77642漏洞", "_translated": true, "_saved_at": "2026-08-21T02:22:24+00:00", "_first_saved_at": "2026-08-20T23:20:00+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ognc-av43"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，从而导致未授权的用户或资源可以被访问或篡改。", "title": "什么是访问控制不当"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n", "title": "访问控制不当常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防访问控制不当"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-13736", "cvss": {}, "cvss_score": 7.5, "cvss_vector": "", "cwe": "CWE-284", "description": "NewPath WildApricotPress Add-on 是一款由 NewPath 提供的 WordPress 商业插件，用于在 WordPress 站点中集成并展示 WildApricot 成员目录，支持为成员资料字段设置 members-only 隐私标记。\n受影响版本中，插件注册的 WordPress REST 路由在处理 members-only 字段（如成员邮箱与电话）时未对当前请求强制执行 members-only 隐私判定，匿名访问者无需任何凭证即可直接调用该 REST 端点读取被配置为仅向登录成员公开的成员邮箱地址与电话号码，造成未授权个人敏感信息泄露。\n修复版本中通过在该 REST 路由的处理函数上按字段隐私配置进行权限校验，仅向具备访问权限的请求返回 members-only 字段，未登录或无权限请求不再暴露成员邮箱与电话等 PII，从而切断匿名读取受限字段的链路。", "effects": [{"comp_name": "wildapricotpress-add-on", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.0.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "访问控制不当", "kind_en": "访问控制不当", "last_modified_time": "2026-08-21", "level": "High", "mps_id": "MPS-ogrp-jv9e", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ogrp-jv9e", "name": "https://www.oscs1024.com/hd/MPS-ogrp-jv9e"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-13736", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-13736"}, {"url": "https://wpscan.com/vulnerability/97fe9780-ad69-4f36-9496-5ca9c0e2bc39/", "name": ""}], "scope_influence": "", "tags": [], "title": "NewPath WildApricotPress 插件未授权成员信息泄露漏洞", "_translated": true, "_saved_at": "2026-08-21T08:32:42+00:00", "_first_saved_at": "2026-08-21T08:32:42+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ogrp-jv9e"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-47827", "cvss": {"cvssv31": [{"source": "security@vmware.com", "vector": "CVSS:3.1/AV:A/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:A/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-78", "description": "Cloud Foundry BOSH CLI 是 Cloud Foundry 基金会发布的开源命令行工具，用于与 BOSH 部署交互，包括 SSH/SCP 到 BOSH 管理虚拟机、上传/下载 release、查看日志等。\n受影响版本中，BOSH CLI 在 Windows 平台上调用外部命令（用于 SSH/SCP 到目标虚拟机或与本地系统交互）时存在命令注入缺陷；攻击者可以通过影响传入命令行参数的字段触发任意 shell 命令执行，从而在运行 BOSH CLI 的用户主机上以当前用户权限执行任意命令。\n修复版本中通过在 BOSH CLI v7.10.10 中将构建工具链升级至 Go 1.26.7 并刷新 vendored 依赖（包括 github.com/cloudfoundry/bosh-utils、golang.org/x/crypto/ssh 等），消除了 Windows 平台上命令注入路径；用户升级到 v7.10.10 及以上即可避免该问题。", "effects": [{"comp_name": "github.com/cloudfoundry/bosh-cli", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,7.10.10)", "min_fixed_version": "7.10.10", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-08-21", "level": "High", "mps_id": "MPS-pray-6cjd", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-pray-6cjd", "name": "https://www.oscs1024.com/hd/MPS-pray-6cjd"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-47827", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-47827"}, {"url": "https://www.cloudfoundry.org/blog/cve-2026-47827-bosh-cli-powershell-injection/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "BOSH CLI Windows 命令注入漏洞", "_translated": true, "_saved_at": "2026-08-21T11:19:54+00:00", "_first_saved_at": "2026-08-21T11:19:54+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-pray-6cjd"}, {"analysis_status": 0, "articles": [], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-68745", "cvss": {}, "cvss_score": 7.4, "cvss_vector": "", "cwe": "CWE-347", "description": "Apache CloudStack 是开源 IaaS 云管理平台，使用 Java 实现，主要用于构建和管理公有云、私有云及混合云环境。\n受影响版本中，plugins/user-authenticators/saml2 模块的 SAML2LoginAPIAuthenticatorCmd.authenticate 方法在处理 SAML Response 时，签名校验守卫条件写成 idpMetadata.getSigningCertificate() != null \u0026\u0026 sig != null。当 IdP 元数据未注册签名证书而 SAML Response 仍包含 ds:Signature 元素时，整个签名校验块被静默跳过；攻击者只要再满足欺骗 IdP 的 IP 地址或在管理服务器上注册一个攻击者可控的 URL 之一，便可凭借一份携带任意虚假签名的 SAML Response 完成认证、获得合法会话，实现未授权身份绕过。同一漏洞模式在方法内层的 EncryptedAssertion 签名校验处再次出现。\n修复版本中通过将签名校验拆出为独立的 validateSAMLSignature 方法，并改为仅在 sig 为 null 时直接返回；签名存在时强制要求 IdP 已注册签名证书，无证书立即抛出 ACCOUNT_ERROR，SignatureValidator.validate 抛出 ValidationException 时同样抛出 ACCOUNT_ERROR，从根本上切断\"IdP 无签名证书即跳过验签\"的逻辑路径。", "effects": [{"comp_name": "apache-cloudstack", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,4.20.3.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,4.22.1.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "密码学签名的验证不恰当", "kind_en": "密码签名验证不当", "last_modified_time": "2026-08-21", "level": "High", "mps_id": "MPS-34k1-bvoi", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-34k1-bvoi", "name": "https://www.oscs1024.com/hd/MPS-34k1-bvoi"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-68745", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-68745"}, {"url": "https://lists.apache.org/thread/g6cwddtjrwbh1d56wjz4cfp3fzfm4kbc", "name": ""}], "scope_influence": "", "tags": [], "title": "Apache CloudStack SAML 认证绕过漏洞", "_translated": true, "_saved_at": "2026-08-21T10:23:04+00:00", "_first_saved_at": "2026-08-21T10:23:04+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-34k1-bvoi"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-47841", "cvss": {}, "cvss_score": 7.4, "cvss_vector": "", "cwe": "CWE-697", "description": "Spring Security 是开源 Java 安全框架，WebAuthn（Passkey）模块用于无密码认证。\n受影响版本中，WebAuthn 认证流程在校验 UserVerificationRequirement 时使用对象身份（==）而非 equals 比较；当应用启用分布式 HTTP 会话存储（如 Spring Session 配合 Redis、JDBC 或 Hazelcast）时，会话在反序列化后得到的 UserVerificationRequirement 实例与静态常量 REQUIRED 不是同一对象引用，恒等比较结果为 false，userVerification 校验被静默关闭。攻击者只要持有受害者的认证器设备，即可在不满足 PIN 或生物识别等用户验证要求的情况下完成 WebAuthn 认证。\n修复版本中通过将 UserVerificationRequirement 的比较方式由对象身份比较改为基于 equals 的内容比较，确保反序列化后的实例能够正确匹配 REQUIRED 常量，恢复 userVerification=REQUIRED 时的强制校验。", "effects": [{"comp_name": "org.springframework.security:spring-security-web", "ecosystem": "maven", "versions": [{"affected_version": "[7.0.0,7.0.7)", "min_fixed_version": "7.0.7", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[7.1.0,7.1.1)", "min_fixed_version": "7.1.1", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[6.5.0,6.5.12)", "min_fixed_version": "6.5.12", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[6.4.0,6.4.19)", "min_fixed_version": "6.4.19", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "不充分的比较", "kind_en": "不正确的比较", "last_modified_time": "2026-08-21", "level": "High", "mps_id": "MPS-e04f-2f84", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://spring.io/security/cve-2026-47841", "name": ""}, {"url": "https://nvd.nist.gov/vuln-metrics/cvss/v3-calculator?vector=AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:N\u0026version=3.1", "name": ""}], "scope_influence": "", "tags": [], "title": "Spring Security WebAuthn 用户验证绕过漏洞", "_translated": true, "_saved_at": "2026-08-21T06:35:37+00:00", "_first_saved_at": "2026-08-21T06:35:37+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-e04f-2f84"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-18409", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "cwe": "CWE-79", "description": "WPForms Pro 是商业 WordPress 插件，用于构建联系表单、订阅表单与其他用户提交表单，分发渠道为 WordPress 官方插件仓库与厂商官网，源码不在 GitHub 开源生态中托管。\n受影响版本中，插件对 Single Line Text 与 Paragraph Text 字段值未进行充分输入净化与输出转义。攻击者可借助插件自身注册的 wp_kses_allowed_html 过滤器把 'post' 白名单扩展为允许 iframe 元素携带 data-src 属性，而 data-src 不在 WordPress 的 URI 属性清理列表中，导致存放在 data-src 中的 javascript: URI 可绕过 kses 处理；随后在加载表单记录的页面中，由插件捆绑的管理脚本 view-entry.min.js 将 data-src 提升为 live src 属性，任何访问受污染页面的用户都会触发其中存储的 JavaScript 代码。\n修复版本中通过收紧 wp_kses_allowed_html 过滤器的扩展范围并更新 view-entry.min.js 阻止 javascript: URI 被提升为 src，从而切断存储型 XSS 链路，建议升级至官方最新版本。", "effects": [{"comp_name": "wpforms-pro", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.0.0.2]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-08-21", "level": "High", "mps_id": "MPS-5aj3-vlfh", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-5aj3-vlfh", "name": "https://www.oscs1024.com/hd/MPS-5aj3-vlfh"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-18409", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-18409"}, {"url": "https://wpforms.com/docs/how-to-view-recent-changes-to-the-wpforms-plugin-changelog/#Changelog", "name": ""}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/f26cbc41-8ed9-4dc6-a8bc-9986ecab5e6e?source=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "WPForms Pro 插件存储型 XSS 漏洞", "_translated": true, "_saved_at": "2026-08-21T05:27:01+00:00", "_first_saved_at": "2026-08-21T05:27:01+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-5aj3-vlfh"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-75796", "cvss": {}, "cvss_score": 7.2, "cvss_vector": "", "cwe": "CWE-269", "description": "AI Engine 是开源的 WordPress 插件（PHP），提供 AI 对话、内容生成、图像与 MCP（Model Context Protocol）工具等能力，源代码托管于 jordymeow/ai-engine 仓库。\n受影响版本中，labs/mcp-core.php 中 Meow_MWAI_Labs_MCP_Core::dispatch() 的 wp_create_user 与 wp_update_user 分支仅校验调用者持有 administrator 角色，未对目标账户做对象级权限检查。在 WordPress Multisite 环境下，子站点 Administrator 可通过 wp_update_user 直接修改任意账户（包括 Network Administrator）的密码或角色，并通过 wp_create_user 授予超出自身权限的角色，从而接管网络上任意账户。\n修复版本中通过在 dispatch() 的 wp_create_user 分支增加 current_user_can('create_users') 校验与目标角色在 get_editable_roles() 中的白名单校验，在 wp_update_user 分支增加 current_user_can('edit_user', $target_id) 与角色变更时的 current_user_can('promote_user') 校验，使对象级权限边界与 WordPress 后台一致，从而切断 Multisite 子站点管理员的越权提权链路。", "effects": [{"comp_name": "ai-engine", "ecosystem": "linux", "versions": [{"affected_version": "[2.8.0,3.6.1)", "min_fixed_version": "3.6.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-08-21", "level": "High", "mps_id": "MPS-gfb8-muzp", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-gfb8-muzp", "name": "h ns；SetupWizard::user_can_install_plugin 同时校验 install_plugins 与 activate_plugins；AdminOnboardingController::install_required_plugins 复用该谓词跳过无权限安装；SetupWizardNoWC::install_woocommerce 在调度前调用该谓词拒绝未授权安装，关闭 Shop Manager 触发的提权链。", "effects": [{"comp_name": "dokan-lite", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,5.0.14)", "min_fixed_version": "5.0.14", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "访问控制不当", "kind_en": "访问控制不当", "last_modified_time": "2026-08-21", "level": "High", "mps_id": "MPS-nre1-i2ax", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-nre1-i2ax", "name": "https://www.oscs1024.com/hd/MPS-nre1-i2ax"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-16576", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-16576"}, {"url": "https://wpscan.com/vulnerability/801e9008-e912-4606-8c21-3d31dc0bd2c7/", "name": ""}], "scope_influence": "", "tags": [], "title": "Dokan插件REST API权限校验缺陷导致任意插件安装", "_translated": true, "_saved_at": "2026-08-21T18:27:53+00:00", "_first_saved_at": "2026-08-21T08:32:43+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-nre1-i2ax"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-75910", "cvss": {"cvssv31": [{"source": "ff89ba41-3aa1-4d27-914a-91399e9639e5", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:N", "severity": "medium", "base_score": 6.5}], "cvssv4": [{"source": "ff89ba41-3aa1-4d27-914a-91399e9639e5", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR ，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-75115", "cvss": {"cvssv4": [{"source": "security@joomla.org", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:L/VA:L/SC:L/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7}]}, "cvss_score": 7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:L/VA:L/SC:L/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-22", "description": "YOOtheme Pro 是商业 Joomla 扩展，用于在 Joomla 站点中构建页面、表单与应用，属于闭源商业组件。\n受影响版本中，Filesystem 数据源的路径过滤逻辑未充分考虑 glob 通配语义，未授权但已认证且具备相应权限的攻击者，可构造 glob 模式绕过路径过滤读取任意文件内容。\n修复版本中通过收紧 Filesystem 数据源对路径模式的解析与判定，阻断利用 glob 通配进行的目录越界读取，使受信任权限用户只能访问预期目录下的文件。", "effects": [{"comp_name": "com_yootheme_pro", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,5.0.40]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-08-21", "level": "High", "mps_id": "MPS-3gv2-7ds5", "poc": f H/PR:N/UI:N/S:U/C:L/I:H/A:L", "cwe": "CWE-821", "description": "0.4.9.10 之前的 Tor 不会拒绝到达已附加流的电路的 CONFLUX_LINK 信元。恶意客户端可以在同一电路上的 CONFLUX_LINK 之前发送 RELAY_COMMAND_BEGIN，附加一个退出流，该退出流随后将成为孤立流，在电路被释放时留下悬空的电路后向指针和释放后使用 (UAF)。这是 TROVE-2026-025。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "不正确的同步机制", "kind_en": "同步不正确", "last_modified_time": "2026-08-21", "level": "High", "mps_id": "MPS-q3yu-bkwi", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-q3yu-bkwi", "name": "https://www.oscs1024.com/hd/MPS-q3yu-bkwi"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-77584", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-77584"}, {"url": "https://gitlab.torproject.org/tpo/core/tor/-/raw/tor-0.4.9.10/ChangeLog", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-77584漏洞", "_translated": true, "_saved_at": "2026-08-20T22:20:12+00:00", "_first_saved_at": "2026-08-20T22:20:12+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-q3yu-bkwi"}, {"analysis_status": 0, "articles": [{"content": "- 命令注入是一种攻击，其目标是通过易受攻击的应用程序在主机操作系统上执行任意命令。 当应用程序将不安全的用户提供的数据（表单、cookie、HTTP 标头等）传递到系统 shell 时，就会产生缺陷。攻击者通过构造恶意的命令或数据，将其注入到程序执行的上下文中，从而绕过程序的输入验证和安全措施，实现对程序操作的恶意操作。", "title": "什么是命令注入"}, {"content": "- 文件上传：攻击者通过构造恶意的文件上传请求，将包含恶意命令的文件上传到服务器，从而利用命令注入漏洞执行恶意命令。\n- SQL 注入：攻击者通过构造恶意的 SQL 查询语句，将包含恶意命令的 SQL 语句注入到数据库中，从而执行恶意命令，窃取数据或者破坏系统。\n- 命令执行：攻击者通过在 Web 应用程序的表单提交数据中注入恶意命令，从而执行恶意命令，例如删除文件、格式化硬盘等。\n- 命令注入漏洞的旁路攻击：攻击者可以利用命令注入漏洞旁路控制程序的执行流程，从而窃取数据、破坏系统、控制程序等。\n", "title": "命令注入常见的攻击方式"}, {"content": "- 输入验证：在程序输入处对输入数据进行严格的验证和过滤，确保输入数据符合预期的格式和类型，避免被攻击者注入恶意命令。\n- 输出过滤：在程序输出处对输出数据进行严格的过滤和检查，确保输出数据符合预期的格式和类型，避免被攻击者截获和篡改。\n- 使用安全的编程模型：使用安全的编程模型，例如避免使用原生的命令执行方式，使用安全的框架和库来处理输入数据和执行命令，避免命令注入漏洞。\n- 数据库加密和访问控制：对于敏感数据和命令，使用加密和访问控制措施，确保只有授权用户可以访问和执行命令，避免被攻击者窃取和篡改。\n- 定期更新和升级：定期更新和升级应用程序和库的版本，确保应用程序和库的最新版本包含了最新的安全补丁和修复措施，避免安全漏洞的出现和利用。\n- 安全审计和监控：定期对系统和应用程序进行安全审计和监控，及时发现和阻止潜在的安全漏洞和攻击，确保系统和数据的安全和可靠性。", "title": "如何预防命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-77004", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:N/AC:L/Au:S/C:P/I:P/A:P", "severity": "medium", "base_score": 6.5}], "cvssv31": [{"source": "cna@vuldb.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:L/I:L/A:L", "severity": "high", "base_score": 7.4}], "cvssv4": [{"source": "cna@vuldb.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:L/VI:L/VA:L/SC:L/SI:L/SA:L/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "low", "base_score": 2.1}]}, "cvss_score": 2.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:L/VI:L/VA:L/SC:L/SI:L/SA:L/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-77", "description": "COMFAST CF-N1-S 是 Comfast 出品的闭源无线网络设备，固件提供基于 CGI 的 Web 管理接口，用于设备配置。\n受影响版本中，已登录管理面的攻击者可向 /cgi-bin/mbox-config?method=SET\u0026section=ptest_sn 提交 JSON 字段 sn。该路径把 sn 经 sprintf 拼入命令字符串后交给 popen 执行，可在设备上执行任意系统命令。\n修复版本中通过厂商安全固件更新切断 sn 进入 popen 的命令拼接路径；截至本报告日期，官方尚未公布修复版本与补丁细节。", "effects": [{"comp_name": "cf-n1-s", "ecosystem": "linux", "versions": [{"affected_version": "[2.6.0.1,2.6.0.1]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "命令注入", "kind_en": "命令中使用的特殊元素的不正确中和（“命令注入”）", "last_modified_time": "2026-08-21", "level": "High", "mps_id": "MPS-7o1x-gv4f", "poc": false, "poc_url": [], "published_time": "2026-08-21", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-7o1x-gv4f", "name": "https://www.oscs1024.com/hd/MPS-7o1x-gv4f"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-77004", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-77004"}, {"url": "https://github.com/lxiansheng488-bit/-/blob/main/%E5%8E%82%E5%95%86comefast%20%20CF-N1-S%20V2.pdf", "name": ""}, {"url": "https://vuldb.com/cve/CVE-2026-77004", "name": ""}, {"url": "https://vuldb.com/submit/880584", "name": ""}, {"url": "https://vuldb.com/vuln/393623", "name": ""}, {"url": "https://vuldb.com/vuln/393623/cti", "name": ""}], "scope_influence": "", "tags": [], "title": "CF-N1-S命令注入漏洞", "_translated": true, "_saved_at": "2026-08-20T17:22:54+00:00", "_first_saved_at": "2026-08-20T17:22:54+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-7o1x-gv4f"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- nvd_id": "", "cve_id": "CVE-2026-74580", "cvss": {}, "cvss_score": 7.8, "cvss_vector": "", "cwe": "CWE-787", "description": "Linux kernel 是开源操作系统内核，其 vhost 子系统为用户态进程（如 QEMU）管理 virtqueue 并执行 device IOTLB 翻译，是 KVM 半虚拟化 I/O 路径的核心组件。\n受影响版本中，drivers/vhost/vhost.c 的 vhost_vring_set_num_addr 在响应 VHOST_SET_VRING_ADDR 与 VHOST_SET_VRING_NUM 两个 ioctl 时未把 vq-\u003emeta_iotlb[] 缓存清空。当目标 virtqueue 已挂载 device IOTLB、处于 live 状态时，用户态后续重新下发新的 desc/avail/used 基地址或新的 vring 尺寸后，iotlb_access_ok() 仍以旧缓存命中直接返回 true，跳过对新地址的 iotlb_access_ok 慢路径校验；vhost_vq_meta_fetch() 用陈旧 vhost_iotlb_map 执行 map-\u003eaddr + addr - map-\u003estart，得到的目标地址已不再落在当前 IOTLB 实际映射范围。后续 used ring 更新或 desc 取指路径上的 vhost_copy_to_user() 与 vhost_copy_from_user() 会进一步将该地址交给 __copy_to_user() / __copy_from_user()，访问映射外的主机内核内存。\n修复版本中通过在 vhost_vring_set_num_addr 解锁 vq-\u003emutex 之前增加 __vhost_vq_meta_reset(vq)，使得 vq-\u003emeta_iotlb[] 中缓存的 vhost_iotlb_map 全部失效；后续 iotlb_access_ok() 必须重新走慢路径，针对当前真实 IOTLB 映射重新校验，禁止使用 vring 重新配置前残留的陈旧映射，从而切断越界复制链路。", "effects": [{"comp_name": "linux_kernel", "ecosystem": "linux", "versions": [{"affected_version": "[4.11,5.10.265)", "min_fixed_version": "5.10.265", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.7-rc1,6.12.104)", "min_fixed_version": "6.12.104", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.2-rc1,6.6.152)", "min_fixed_version": "6.6.152", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[7.2-rc1,7.2)", "min_fixed_version": "7.2", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[5.16-rc1,6.1.183)", "min_fixed_version": "6.1.183", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.19-rc1,7.1.9)", "min_fixed_version": "7.1.9", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[5.11-rc1,5.15.216)", "min_fixed_version": "5.15.216", "repository": "unmanaged", "solu 。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "attack_vector_type": "Local", "cnvd_id": "", "cve_id": "CVE-2026-74583", "cvss": {}, "cvss_score": 7.8, "cvss_vector": "", "cwe": "CWE-416", "description": "Linux 内核是开源操作系统核心，net/sched 子系统提供基于路由的流量分类能力，其中 cls_route (route4) 分类器通过 16 槽 fastmap 缓存按 (id, iif) 索引已命中的 struct route4_filter 指针以加速后续分类。\n受影响版本中，route4_classify 在 RCU 读侧查找 filter 后通过 route4_set_fastmap 将其写入 fastmap，而 route4_delete、route4_change 与 route4_destroy 仅在调用 route4_reset_fastmap 清空 fastmap 之后再通过 tcf_queue_work / kfree_rcu 释放 filter。由于清空与写回之间没有同步，读者在 reset 之后、kfree 之前把即将释放的 filter 重新写回 fastmap，后续命中同一 (id, iif) 的数据包会从 fastmap 读取已被释放的 route4_filter 并解引用 f-\u003eres，触发 KASAN 报告的 slab use-after-free。\n修复版本中通过在 struct route4_filter 增加 dying 布尔字段，并在 route4_destroy、route4_delete、route4_change 调用 route4_reset_fastmap 前于 fastmap_lock 内将该 filter 标记为 dying，同时让 route4_set_fastmap 在写回 fastmap 前跳过 dying 的 filter，从而切断释放后引用路径。", "effects": [{"comp_name": "linux_kernel", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,47d7f7051253bdc02b1d245d87e38f16d31a74df)", "min_fixed_version": "47d7f7051253bdc02b1d245d87e38f16d31a74df", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "UAF", "kind_en": "免费后使用", "last_modified_time": "2026-08-22", "level": "High", "mps_id": "MPS-wn5d-mz1h", "poc": false, "poc_url": [], "published_time": "2026 的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-54789", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-787", "description": "mod_auth_openidc 是 Apache 2.x HTTP 服务器的 OpenID Certified 身份认证与授权模块，实现 OpenID Connect Relying Party 功能；该项目以 C 语言实现并以 Apache 模块形式加载，开源维护。\n受影响版本中，公开导出的 oidc_state_cookies_clean_expired 函数在请求处理路径上从 r-\u003eheaders_in 读取客户端 Cookie 头、按分号切分为多个 token 后交给内部 oidc_state_cookies_parse_token 解析。该函数使用 while (cookie != NULL \u0026\u0026 *cookie != OIDC_CHAR_EQUAL) 扫描 token 中的等号以分离 cookie 名与值，但 cookie 指针仅被自增、永不重新赋值为 NULL，因此 cookie != NULL 判断恒为真，循环只能靠遇到 '=' 退出。当未认证客户端发送以默认前缀 mod_auth_openidc_state_ 开头但不包含 '=' 的 Cookie token 时，循环会越过 token 缓冲区末端继续在相邻内存中扫描直到偶然命中 '='（越界读，命中未映射页时可导致进程崩溃/拒绝服务），随后在该偏移处写入 '\\0'（攻击者可控位置的一字节越界写）。\n修复版本中通过将扫描条件改为 (*cookie != '\\0' \u0026\u0026 *cookie != OIDC_CHAR_EQUAL)，在到达字符串结束符时即停止扫描；既有的 if (*cookie != OIDC_CHAR_EQUAL) return 0 检查随后可正常拒绝无值 token，从而切断越界读写路径，并补充 test_state_cookies_clean_no_value 回归测试覆盖该输入形态。", "effects": [{"comp_name": "mod_auth_openidc", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.4.19.4)", "min_fixed_version": "2.4.19.4", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_s       if (v === null || v === undefined || v === "" || v === -1) return "-";
      return String(v);
    }

    function renderList() {
      const list = $("list");
      $("listCount").textContent = String(filtered.length);
      if (!filtered.length) {
        list.innerHTML = '<div class="empty">没有匹配项</div>';
        return;
      }
      list.innerHTML = filtered.map((it) => {
        const id = it.mps_id || it.cve_id;
        const active = id === activeId ? " active" : "";
        return `
          <button class="item${active}" data-id="${esc(id)}" type="button">
            <div class="item-top">
              <span class="cve">${esc(it.cve_id || it.mps_id || "-")}</span>
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
            </div>
            <div class="title">${esc(it.title || "-")}</div>
            <div class="item-foot">
              <span>CVSS ${esc(scoreText(it.cvss_score))}</span>
              <span>${esc(it.published_time || "-")}</span>
              ${it.poc ? "<span>POC</span>" : ""}
            </div>
          </button>`;
      }).join("");
      list.querySelectorAll(".item").forEach((btn) => {
        btn.addEventListener("click", () => selectById(btn.dataset.id));
      });
    }

    function refsHtml(it) {
      const refs = Array.isArray(it.reference_url_list) ? it.reference_url_list : [];
      const links = [];
      if (it._source_page) links.push({ url: it._source_page, name: "OSCS 详情" });
      if (it.cve_id) links.push({ url: `https://nvd.nist.gov/vuln/detail/${it.cve_id}`, name: "NVD" });
      refs.forEach((r) => {
        if (r && r.url) links.push({ url: r.url, name: r.name || r.url });
      });
      const seen = new Set();
      const uniq = [];
      for (const l of links) {
        if (seen.has(l.url)) continue;
        seen.add(l.url);
        uniq.push(l);
      }
      if (!uniq.length) return '<div class="box">无参考链接</div>';
      return `<div class="refs">${uniq.map((l) =>
        `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name || l.url)}</a>`
      ).join("")}</div>`;
    }

    function articlesHtml(it) {
      const arts = Array.isArray(it.articles) ? it.articles : [];
      if (!arts.length) return "";
      return `<div class="section"><h3>相关说明</h3>${arts.map((a) => `
        <div class="article">
          <h4>${esc(a.title || "说明")}</h4>
          <p>${esc(a.content || "")}</p>
        </div>`).join("")}</div>`;
    }

    function renderDetail(it) {
      const detail = $("detail");
      if (!it) {
        detail.innerHTML = '<div class="empty">暂无数据</div>';
        return;
      }
      const pocUrls = Array.isArray(it.poc_url) ? it.poc_url : [];
      detail.innerHTML = `
        <div class="d-head">
          <div>
            <h1 class="d-title">${esc(it.title || "-")}</h1>
            <div class="ids">
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
              <span class="chip">${esc(it.cve_id || "无 CVE")}</span>
              <span class="chip">${esc(it.mps_id || "-")}</span>
              ${it.poc ? '<span class="chip">有 POC</span>' : ""}
              ${it.exp ? '<span class="chip">有 EXP</span>' : ""}
            </div>
          </div>
          <div class="actions">
            ${it._source_page ? `<a class="btn" href="${esc(it._source_page)}" target="_blank" rel="noopener">OSCS</a>` : ""}
            ${it.cve_id ? `<a class="btn" href="https://nvd.nist.gov/vuln/detail/${esc(it.cve_id)}" target="_blank" rel="noopener">NVD</a>` : ""}
          </div>
        </div>
        <div class="grid">
          <div class="stat"><div class="k">CVSS</div><div class="v">${esc(scoreText(it.cvss_score))}</div></div>
          <div class="stat"><div class="k">向量</div><div class="v">${esc(it.cvss_vector || "-")}</div></div>
          <div class="stat"><div class="k">CWE</div><div class="v">${esc(it.cwe || "-")}</div></div>
          <div class="stat"><div class="k">类型</div><div class="v">${esc(it.kind || it.kind_en || "-")}</div></div>
          <div class="stat"><div class="k">公开</div><div class="v">${esc(it.published_time || "-")}</div></div>
          <div class="stat"><div class="k">利用成本</div><div class="v">${esc(it.exploit_requirement_cost || "-")}</div></div>
          <div class="stat"><div class="k">可利用性</div><div class="v">${esc(it.exploitability || "-")}</div></div>
          <div class="stat"><div class="k">修复建议</div><div class="v">${esc(it.fix_suggestion || "-")}</div></div>
        </div>
        <div class="section"><h3>描述</h3><div class="box">${esc(it.description || "无描述")}</div></div>
        ${it.scope_influence ? `<div class="section"><h3>影响范围</h3><div class="box">${esc(it.scope_influence)}</div></div>` : ""}
        ${pocUrls.length ? `<div class="section"><h3>POC 链接</h3><div class="refs">${pocUrls.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join("")}</div></div>` : ""}
        <div class="section"><h3>参考链接</h3>${refsHtml(it)}</div>
        ${articlesHtml(it)}
      `;
    }

    function selectById(id) {
      const it = filtered.find((x) => (x.mps_id || x.cve_id) === id) ||
                 items.find((x) => (x.mps_id || x.cve_id) === id);
      if (!it) return;
      activeId = it.mps_id || it.cve_id;
      renderList();
      renderDetail(it);
      const btn = document.querySelector(`.item[data-id="${CSS.escape(activeId)}"]`);
      if (btn) btn.scrollIntoView({ block: "nearest" });
      history.replaceState(null, "", "#" + encodeURIComponent(activeId));
    }

    function applyFilter(q) {
      const query = (q || "").trim().toLowerCase();
      filtered = !query ? items.slice() : items.filter((it) => {
        const blob = [
          it.cve_id, it.mps_id, it.title, it.kind, it.kind_en, it.cwe, it.description, it.level
        ].map((x) => String(x || "").toLowerCase()).join(" ");
        return blob.includes(query);
      });
      renderList();
      if (filtered.length) {
        const still = filtered.some((x) => (x.mps_id || x.cve_id) === activeId);
        selectById(still ? activeId : (filtered[0].mps_id || filtered[0].cve_id));
      } else {
        activeId = null;
        renderDetail(null);
      }
    }

    $("search").addEventListener("input", (e) => applyFilter(e.target.value));

    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement !== $("search")) {
        e.preventDefault();
        $("search").focus();
        return;
      }
      if (!filtered.length) return;
      const idx = filtered.findIndex((x) => (x.mps_id || x.cve_id) === activeId);
      if (e.key === "ArrowDown") {
        e.preventDefault();
        const next = filtered[Math.min(filtered.length - 1, Math.max(0, idx) + 1)];
        selectById(next.mps_id || next.cve_id);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        const prev = filtered[Math.max(0, idx - 1)];
        selectById(prev.mps_id || prev.cve_id);
      }
    });

    const hashId = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    if (hashId && items.some((x) => (x.mps_id || x.cve_id) === hashId)) {
      activeId = hashId;
      renderList();
      selectById(hashId);
    } else if (items.length) {
      selectById(items[0].mps_id || items[0].cve_id);
    } else {
      renderList();
      renderDetail(null);
    }
  </script>
</body>
</html>
