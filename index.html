r/ultimate-addons-for-contact-form-7/tags/3.5.48/addons/signature/ultimate-signature.php#L300", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/ultimate-addons-for-contact-form-7/tags/3.5.48/addons/pdf-generator/pdf-generator.php#L608", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/ultimate-addons-for-contact-form-7/tags/3.5.48/addons/pdf-generator/pdf-generator.php#L807", "name": ""}, {"url": "https://plugins.trac.wordpress.org/changeset/3698232/ultimate-addons-for-contact-form-7", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-82901漏洞", "_translated": true, "_saved_at": "2026-09-26T20:31:44+00:00", "_first_saved_at": "2026-09-26T20:31:44+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-o6h8-ydta"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-100741", "cvss": {"cvssv31": [{"source": "cve@gitlab.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-95", "description": "hMailServer 是 Progressive Robot Ltd 开发的开源 Windows 邮件服务器，提供 SMTP、POP3 与 IMAP 邮件服务，支持以 VBScript 或 JScript 事件脚本扩展登录校验、投递与外部账户下载等服务器行为。\n受影响版本中，Events::FireOnClientValidatePassword 在 JScript 分支只把密码中的单引号替换为反斜杠加单引号，未处理作为 JScript 转义符的反斜杠，随后把密码以字符串字面量拼入事件调用文本 OnClientValidatePassword(HMAILSERVER_ACCOUNT, '%s') 交给脚本引擎解析。未认证的远程客户端对任一已存在且活跃的账号发起 SMTP AUTH、POP3 或 IMAP 登录，密码中成对出现的反斜杠先把自身转义、紧随的单引号闭合字面量，剩余部分作为语句在 hMailServer.exe 进程内以服务账号权限执行；默认 ScriptAllowedObjects 取值为 * 时可创建任意 COM 对象，WScript.Shell 等对象带来命令执行。\n修复版本中通过新增 ScriptServer::EscapeForJScriptLiteral 单趟转义解决该问题，先转义反斜杠再统一处理单引号、双引号、回车、换行、U+2028、U+2029 与 NUL，FireOnClientValidatePassword、FireOnDeliveryFailed 与 FireOnExternalAccountDownload 的 JScript 分支统一改用该转义，FireEvent 同步拒绝非合法标识符的规则函数名，事件值无法再闭合字符串字面量或注入语句。", "effects": [{"comp_name": "hmailserver", "ecosystem": "linux", "versions": [{"affected_version": "[6.0.0,6.3.4)", "min_fixed_version": "6.3.4", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "eval注入", "kind_en": "动态评估代码中指令的不当中和（“评估注入”）", "last_modified_time": "2026-09-27", "level": "Critical", "mps_id": "MPS-x2rn-hmc9", "poc": false, "poc_url": [], "published_time": "2026-09-27", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-x2rn-hmc9", "name": "https://www.oscs1024.com/hd/MPS-x2rn-hmc9"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-100741", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-100741"}, {"url": "https://gitlab.com/Progressiverobot/hmailserver/-/commit/5a3de9001d6c5e833662ada8e44ce10d42d76b1a", "name": ""}, {"url": "https://gitlab.com/Progressiverobot/hmailserver/-/releases/v6.3.4", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "hMailServer脚本注入漏洞", "_translated": true, "_saved_at": "2026-09-27T09:43:48+00:00", "_first_saved_at": "2026-09-27T09:43:48+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-x2rn-hmc9"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-87799", "cvss": {"cvssv31": [{"source": "security@ubuntu.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.9}]}, "cvss_score": 9.9, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "cwe": "CWE-59", "description": "Canonical LXD 是 Canonical 开源的系统容器与虚拟机管理器，使用 Go 语言编写，用于在单机与集群环境中创建和管理容器、虚拟机与自定义存储卷，并支持实例与存储卷在服务器之间通过迁移协议复制、移动与刷新。\n受影响版本中，迁移接收端把来源端控制的数据流交给 rsync 或优化的 btrfs receive 在宿主机上重放，lxd/rsync/rsync.go 的 Recv 函数经 assertSafePath 校验目标根路径为绝对路径且不含 .. 段后，以 root 身份运行 rsync --server 将流内条目按普通路径系统调用写入卷目录，父目录未被传输时 rsync 按接收端已存在的路径解析写入目标，同一流中先前植入的符号链接（如指向 / 的 rootfs，或虚拟机的 root.img）会在后续条目以及后续快照与主卷流写入时被解析；具备在项目中创建实例或自定义存储卷权限的已认证客户端，或被目标指定为迁移来源的服务器，可借此在宿主机任意路径以 root 身份写入任意文件，导致完整主机失陷。\n修复版本中通过在接收期间将接收路径以 nosymfollow 属性绑定挂载使传输写入不再解析符号链接，为 btrfs receive 增加 --chroot 把优化的 btrfs 传输限制在目标子卷内，并在写入块卷文件前校验其为普通文件以拒绝被符号链接替换的 root.img，切断了流内植入符号链接后写入宿主任意路径的利用链；LXD 官方修复版本为 4.0.14、5.0.10、5.21.8 与 6.10，canonical/lxd 公开仓库未包含对应修复 commit，上述修复方式来自同源上游 Incus 已验证修复 commit b46c2b45f（随 Incus 7.5.0 发布）。", "effects": [{"comp_name": "lxd", "ecosystem": "linux", "versions": [{"affected_version": "[4.0,4.0.14)", "min_fixed_version": "4.0.14", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[5.21,5.21.8)", "min_fixed_version": "5.21.8", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.0,6.10)", "min_fixed_version": "6.10", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[5.0,5.0.10)", "min_fixed_version": "5.0.10", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "在文件访问前对链接解析不恰当（链接跟随）", "kind_en": "文件访问前的链接解析不正确（“链接跟踪”）", "last_modified_time": "2026-09-28", "level": "Critical", "mps_id": "MPS-3esw-z4o5", "poc": false, "poc_url": [], "published_time": "2026-09-28", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-3esw-z4o5", "name": "https://www.oscs1024.com/hd/MPS-3esw-z4o5"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-87799", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-87799"}, {"url": "https://github.com/canonical/lxd/security/advisories/GHSA-fmc3-3cpq-6whr", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Canonical LXD迁移接收路径任意文件写入漏洞", "_translated": true, "_saved_at": "2026-09-28T14:51:35+00:00", "_first_saved_at": "2026-09-28T14:51:35+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-3esw-z4o5"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-90924", "cvss": {"cvssv31": [{"source": "iletisim@usom.gov.tr", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-1392", "description": "Logsign SIEM 是 Innotim Software, Telecommunications and Consultancy Trade Ltd. Co. 提供的商业安全信息与事件管理软件，用于集中采集和分析安全日志，官方记录未给出公开源码仓库。\n受影响版本中，6.4.101（含）至 6.4.117（不含）存在可被远程尝试的默认管理员凭据。未授权的远程攻击者无需用户交互，可以尝试常见或默认用户名与口令完成认证；凭据保持默认时，攻击者可获得高权限访问，官方评定机密性、完整性与可用性影响均为高。公开记录未披露具体账户、口令或源码位置。\n修复版本中通过发布 6.4.117 修复该默认管理员凭据问题。TR-CERT 公告建议升级至 6.4.117 及以上版本。公开资料未披露具体代码修改。", "effects": [{"comp_name": "Logsign SIEM", "ecosystem": "linux", "versions": [{"affected_version": "[6.4.101,6.4.117)", "min_fixed_version": "6.4.117", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "", "kind_en": "", "last_modified_time": "2026-09-28", "level": "Critical", "mps_id": "MPS-flc9-zxt8", "poc": false, "poc_url": [], "published_time": "2026-09-28", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-flc9-zxt8", "name": "https://www.oscs1024.com/hd/MPS-flc9-zxt8"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-90924", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-90924"}, {"url": "https://siberguvenlik.gov.tr/guvenlik-bildirimleri/detay/tr-26-1202", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Logsign默认凭据漏洞", "_translated": true, "_saved_at": "2026-09-28T14:51:32+00:00", "_first_saved_at": "2026-09-28T14:51:32+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-flc9-zxt8"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-85185", "cvss": {"cvssv31": [{"source": "security@ubuntu.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:N/I:H/A:H", "severity": "critical", "base_score": 9.6}]}, "cvss_score": 9.6, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:N/I:H/A:H", "cwe": "CWE-22", "description": "Canonical LXD 是使用 Go 开发的开源 Linux 容器与虚拟机管理器，模块路径为 github.com/canonical/lxd，用于在主机上管理实例、镜像与存储池。\n受影响版本中，拥有项目 CanCreateInstances 权限的已认证客户端可向 POST /1.0/instances 提交优化 btrfs 备份或迁移接收请求。btrfs 驱动从 backup/optimized_header.yaml 或迁移报文 BTRFSMetaDataHeader 读取 BTRFSSubVolume.Path，未做目录约束即执行 filepath.Join(v.MountPath(), subVol.Path)，并以 root 调用 os.Remove 与 os.Rename。现有比较只跳过等于单个路径分隔符的根子卷，不能拦截 ../。攻击者可删除主机上的任意文件；当主机根文件系统为 btrfs 时，还可把接收到的子卷内容放到存储池之外的路径，导致主机被控制。\n修复版本中通过约束 BTRFSSubVolume.Path 切断越界拼接这一修复，尚未出现在已核对的公开源码中。CVE.org 与 GHSA 将 4.0.14、5.0.10、5.21.8 和 6.10（GHSA 另列 6.9-bf243da）标为修复版本，但标签 lxd-4.0.14、lxd-5.0.10、lxd-5.21.8、lxd-6.9 与 main 仍直接拼接该字段，仓库中不存在 lxd-6.10 与 lxd-6.9-bf243da 引用，提交说明也未出现 CVE-2026-85185。", "effects": [{"comp_name": "github.com/canonical/lxd", "ecosystem": "go", "versions": [{"affected_version": "[4.0.2,+∞)", "min_fixed_version": "", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-09-28", "level": "Critical", "mps_id": "MPS-98rf-expt", "poc": false, "poc_url": [], "published_ti 00", "_first_saved_at": "2026-09-27T21:48:24+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ao18-fvmu"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-101000", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:N/AC:L/Au:N/C:C/I:C/A:C", "severity": "high", "base_score": 10}], "cvssv3": [{"source": "VulDB", "vector": "CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H/E:P/RL:X/RC:R", "severity": "critical", "base_score": 10}], "cvssv31": [{"source": "cna@vuldb.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 10}], "cvssv4": [{"source": "cna@vuldb.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-863", "description": "Netcore NBR100V2 是磊科闭源路由器固件，ACL Handler 使用 rpcd 的 ACL 文件限制 ubus 上 uci 对象可调用的方法与可改写的配置。\n受影响版本中，出厂未初始化状态会加载 /usr/share/rpcd/acl.d/unauthenticated.json，向匿名 ubus 会话授予 uci 的 get、set、apply 以及 wificfg、system、auto_update 的写权限。远程攻击者无需认证即可调用 uci.set，借助参数 section 与 values 改写上述配置的暂存内容，再调用 uci.apply 把暂存结果提交到持久配置并重载相关服务，从而篡改无线参数或自动更新配置。\n修复版本中通过已发布补丁切断匿名会话对 uci.set 与 uci.apply 写权限的事实无法确认，厂商未提供修复版本；设备在首次配置完成且 initialized 置为 1 后会把该宽松 ACL 替换为受限 ACL，匿名写权限随之撤销。", "effects": [{"comp_name": "NBR100V2", "ecosystem": "linux", "versions": [{"affected_version": "[1.3.240614.030928,1.3.240614.030928]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-09-28", "level": "Critical", "mps_id": "MPS-flbg-8ik0", "poc": false, "poc_url": [], "published_time": "2026-09-28", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-flbg-8ik0", "name": "https://www.oscs1024.com/hd/MPS-flbg-8ik0"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-101000", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-101000"}, {"url": "https://vuldb.com/vuln/410870", "name": "VDB-410870 | Netcore NBR100V2 ACL unauthenticated.json uci.apply authorization"}, {"url": "https://vuldb.com/vuln/410870/cti", "name": "VDB-410870 | CTI Indicators (IOB, IOC, IOA)"}, {"url": "https://vuldb.com/cve/CVE-2026-101000", "name": "CVE-2026-101000 | CVE Analysis and Report"}, {"url": "https://vuldb.com/submit/919999", "name": "Submit #919999 | Netcore磊科 Router Firmware NBR100V2_V1.3.240614.030928 missing-authorization vulnerability"}, {"url": "https://github.com/senxitoyshuyi-ui/HACKALL/blob/main/netcore_NBR100V2_V1.3.240614.030928%20Router/netcore_nbr100v2_uci_config_tamper.md", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "NBR100V2未授权配置篡改", "_translated": true, "_saved_at": "2026-09-28T06:14:15+00:00", "_first_saved_at": "2026-09-28T06:14:15+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-flbg-8ik0"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2026-100886", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:N/AC:L/Au:N/C:C/I:C/A:C", "severity": "high", "base_score": 10}], "cvssv3": [{"source": "VulDB", "vector": "CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H/E:P/RL:W/RC:R", "severity": "critical", "base_score": 10}], "cvssv31": [{"source": "cna@vuldb.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 10}], "cvssv4": [{"source": "cna@vuldb.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-287", "description": "Seetong ll4j through 4.0 Missing Authentication in Password Update Endpoint"}], "scope_influence": "", "tags": ["应用软件"], "title": "mall4j未认证改密漏洞", "_translated": true, "_saved_at": "2026-09-29T01:23:34+00:00", "_first_saved_at": "2026-09-29T01:23:34+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-2ij0-f64y"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "cnvd_id": "", "cve_id": "CVE-2026-77203", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-269", "description": "WordPress 的群组 - 会员资格和访问控制插件在 4.6.0 及之前的所有版本中都容易受到权限升级的影响。这是因为 groups_join() 函数通过全局 $post-\u003epost_author 从环境帖子的作者能力中派生出组加入资格，而不是从当前经过身份验证的用户自己的能力中得出组加入资格，同时在同一响应中为调用者创建并返回有效的组加入数据哈希和 WordPress 随机数 - 消除了自我注册的所有授权障碍。这使得具有订阅者级别及以上访问权限的经过身份验证的攻击者可以将自己注册到任何组中，包括具有 groups_admin_groups 功能的特权组，并随后创建并加入包含每个已注册 WordPress 功能的组，从而有效地将其权限升级为管理员。利用该漏洞需要攻击者通过经过身份验证的 wp_ajax_parse_media_shortcode 处理程序的 post_ID 参数提供管理员编写的帖子 ID，以便建立有缺陷的授权检查所使用的特权环境帖子上下文。", "effects": [{"comp_name": "Groups – Memberships and Access Control", "ecosystem": "linux", "  函数基于当前请求生成，Symfony 从请求的 Host 头（可信代理场景下为 X-Forwarded-Host）推导链接的协议与域名，应用默认未通过 framework.trusted_hosts 限制可接受的 Host。攻击者在获知管理员邮箱后，向管理端 /admin/forgotten-password 表单或 POST /api/v2/admin/administrators/reset-password 接口发送携带伪造 Host 头的未认证请求，重置邮件中的链接即指向攻击者控制的域名；管理员点击该链接后，有效的重置 token 被传送到攻击者服务器，攻击者可在真实站点上设置新密码并接管管理员账户。\n修复版本中通过在 ResetPasswordEmailManager 中新增 generateAdminResetPasswordUrl() 方法，改用数据库中当前渠道配置的 hostname 在 PHP 侧拼接协议前缀，并以 ABSOLUTE_PATH 模式仅用路由生成器生成路径部分；渠道解析失败、渠道未配置 hostname 或管理端路由不存在时返回 null，邮件模板回退为展示裸重置 token，链接生成不再依赖请求 Host 头，从而阻断密码重置链接投毒。", "effects": [{"comp_name": "sylius/sylius", "ecosystem": "composer", "versions": [{"affected_version": "[1.12.0,1.12.25)", "min_fixed_version": "1.12.25", "repository": "composer", "solutions": [], "upstream": true}, {"affected_version": "[2.2.0,2.2.9)", "min_fixed_version": "2.2.9", "repository": "composer", "solutions": [], "upstream": true}, {"affected_version": "[2.0.0,2.1.16)", "min_fixed_version": "2.1.16", "repository": "composer", "solutions": [], "upstream": true}, {"affected_version": "[1.13.0,1.13.17)", "min_fixed_version": "1.13.17", "repository": "composer", "solutions": [], "upstream": true}, {"affected_version": "[1.14.0,1.14.20)", "min_fixed_version": "1.14.20", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "忘记口令恢复机制弱", "kind_en": "忘记密码的弱密码恢复机制", "last_modified_time": "2026-09-27", "level": "High", "mps_id": "MPS-h6iz-u4dm", "poc": false, "poc_url": [], "published_time": "2026-09-27", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-h6iz-u4dm", "name": "https://www.oscs1024.com/hd/MPS-h6iz-u4dm"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-100870", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-100870"}, {"url": "https://github.com/Sylius/Sylius", "name": ""}, {"url": "https://github.com/Sylius/Sylius/commit/1255d75b20d3d88a5e5c8d46791504134c838480", "name": ""}, {"url": "https://github.com/Sylius/Sylius/pull/19215", "name": ""}, {"url": "https://github.com/Sylius/Sylius/releases/tag/v2.2.9", "name": ""}, {"url": "https://github.com/Sylius/Sylius/security/advisories/GHSA-77w3-2367-7xvq", "name": ""}, {"url": "https://www.vulncheck.com/advisories/sylius-before-1.12.25-1.13.17-1.14.20-2.1.16-and-2.2.9-admin-password-reset-poisoning-via-host-header", "name": ""}], "scope_influence": "", "tags": ["php", "开源"], "title": "Sylius 密码重置链接投毒漏洞", "_translated": true, "_saved_at": "2026-09-27T14:56:42+00:00", "_first_saved_at": "2026-09-27T14:56:42+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-h6iz-u4dm"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2026-100871", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-287", "description": "Sylius 是一个基于 PHP/Symfony 的开源电商框架，其 API 分为 Admin API 与 Shop API，分别由两个独立 JWT 防火墙（2.x 为 api_admin/api_shop，1.12 至 1.14 为 new_api_admin_user/new_api_shop_user）经 lexik/jwt-authentication-bundle 保护。\n受影响版本中，两类 API 签发的 JWT 均不携带标识签发防火墙的 aud 或 principal_type 声明，防火墙校验签名后按令牌 username 声明中的 email 调用各自的用户提供器解析主体（UsernameOrEmailProvider::findUser 在本防火墙用户表中 findOneByEmail），而管理员与店铺客户分表存储、email 允许相同；攻击者用已知的管理员 email 在店铺端注册客户，以自己的密码从 Shop API 换取令牌，再将该令牌发送到 Admin API，Admin API 将其解析为共享该 email 的管理员，攻击者获得订单、商品、客户及其他管理员账户等完整管理 API 权限，反向方向的管理员令牌同样被 Shop API 接受并解析为同 email 客户。\n修复版本中通过新增 Sylius\\Bundle\\ApiBundle\\EventListener\\JwtAudienceListener 并注册到 lexik_jwt_authentication 的 on_jwt_created 与 on_jwt_decoded 事件：签发时按用户类型写入 aud（sylius-api-admin 或 sylius-api-shop）与 principal_type 声明，解码时按当前请求防火墙对应的期望配置核对这两项声明，不匹配即拒绝令牌，切断了跨防火墙令牌复用的提权链；修复版本为 1.12.25、1.13.17、1.14.20、2.1.16 与 2.2.9。", "effects": [{"comp_name": "sylius/sylius", "ecosystem": "composer", "versions": [{"affected_version": "[1.11.0,1.12.25)", "min_fixed_version": "1.12.25", "repository": "composer", "solutions": [], "upstream": true}, {"affected_version": "[2.2.0,2.2.9)", "min_fixed_version": "2.2.9", "repository": "composer", "solutions": [], "upstream": true}, {"affected_version": "[1.13.0,1.13.17)", "min_fixed_version": "1.13.17", "repository": "composer", "solutions": [], "upstream": true}, {"affected_version": "[1.14.0,1.14.20)", "min_fixed_version": "1.14.20", "repository": "composer", "solutions": [], "upstream": true}, {"affected_version": "[2.0.0,2.1.16)", "min_fixed_version": "2.1.16", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "身份验证不当", "kind_en": "认证不当", "last_modified_time": "2026-09-27", "level": "High", "mps_id": "MPS-k7z6-rxuq", "poc": false, "poc_url": [], "published_time": "2026-09-27", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-k7z6-rxuq", "name": "https://www.oscs1024.com/hd/MPS-k7z6-rxuq"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-100871", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-100871"}, {"url": "https://github.com/Sylius/Sylius", "name": ""}, {"url": "https://github.com/Sylius/Sylius/commit/cdfb672a4d174eb2c73159b25cf5b5f44088f45c", "name": ""}, {"url": "https://github.com/Sylius/Sylius/pull/19213", "name": ""}, {"url": "https://github.com/Sylius/Sylius/releases/tag/v2.2.9", "name": ""}, {"url": "https://github.com/Sylius/Sylius/security/advisories/GHSA-f6mx-qxjc-55xf", "name": ""}, {"url": "https://www.vulncheck.com/advisories/sylius-before-1.12.25-1.13.17-1.14.20-2.1.16-and-2.2.9-jwt-audience-confusion-allows-admin-api-authentication", "name": ""}], "scope_influence": "", "tags": ["php", "开源"], "title": "Sylius JWT 越权冒充管理员漏洞", "_translated": true, "_saved_at": "2026-09-27T14:56:40+00:00", "_first_saved_at": "2026-09-27T14:56:40+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-k7z6-rxuq"}, {"analysis_status": 0, "articles": [{"content": "应用程序在处理用户输入时的不完善或缺乏验证机制，所以攻击者能够通过向应用程序发送恶意输入，利用应用程序对输入数据的错误处理方式来注入自己的恶意代码。这些恶意代码会被应用程序误认为是合法的指令或数据，并在执行过程中被执行。", "title": "什么是代码注入"}, {"content": "应用程序使用可执行动态代码的函数来执行用户可控的参数，当应用程序对于用户输入过滤不完全时，攻击者可以注入恶意代码并控制代码执行流程。", "title": "代码注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对所有用户输入进行验证和过滤，确保只接受预期的有效输入。这包括对输入数据进行输入长度验证、类型检查和格式验证等。\r\n- 使用参数化查询或预编译语句：对于数据库查询操作，应该使用参数化查询或预编译语句，确保输入数据不会被误认为是执行代码。\r\n- 最小特权原则：应用程序在执行操作系统命令或动态代码时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。\r\n- 安全编码实践：开发人员应该采用安全编码实践，包括避免使用eval函数、避免拼接用户输入的字符串作为代码执行等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止代码注入攻击。", "title": "如何预防代码注入"}], "cnvd_id": "", "cve_id": " "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-100869", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:N/I:H/A:N", "severity": "medium", "base_score": 5.9}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:H/AT:P/PR:N/UI:N/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.2}]}, "cvss_score": 8.2, "cvss_vector": "CVSS:4.0/AV:N/AC:H/AT:P/PR:N/UI:N/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-863", "description": "Sylius 是一个基于 Symfony 框架的开源 PHP 电子商务平台，以 composer 包 sylius/sylius 分发，其 Shop API 面向店面客户端提供订单与支付请求操作接口。\n受影响版本中，Shop API 接口 POST /api/v2/shop/orders/{tokenValue}/payment-requests 接受调用方提交的任意 action 并原样写入新建的 PaymentRequest，再在支付请求命令总线上广播；该接口仅校验订单归属，ChosenPaymentRequestActionEligibilityValidator 只检查所选网关的动作索引命令提供方是否存在该动作，未限制店面上下文可请求的动作类型。持有已完成订单 token 的客户提交 action 为 refund 的请求后，命令提供方将其转换为网关退款指令并在支付服务提供商侧执行退款，而 Sylius 本地支付仍为 completed、订单仍为 paid，客户收回货款且订单照常发货，造成资金损失。\n修复版本中通过在店面上下文引入动作白名单切断该链路：ChosenPaymentRequestActionEligibilityVa severity": "medium", "base_score": 6.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:H/AT:P/PR:L/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.6}]}, "cvss_score": 7.6, "cvss_vector": "CVSS:4.0/AV:N/AC:H/AT:P/PR:L/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-918", "description": "0.0.109 之前的 heym 在 Slack、Discord 和 Crawler 工作流节点中包含服务器端请求伪造漏洞。这些节点使用不受保护的 HTTP 客户端向从用户创建的凭据 (webhook_url /flaresolverr_url) 获取的 URL 发出 HTTP 请求，绕过已经保护 HTTP、WebSocket 和 MCP 节点的 SSRF 出口防护；凭证 API 仅验证 URL 非空。任何注册用户都可以创建指向内部地址的凭证并执行工作流，从而使后端到达环回、私有、链接本地或云元数据端点，并在节点输出中返回完整的响应正文（非盲 SSRF）。", "effects": [{"comp_name": "heym", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,0.0.109]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(0,0.0.109)", "min_fixed_version": "0.0.109", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SSRF", "kind_en": "服务器端请求伪造 (SSRF)", "last_modified_time": "2026-09-27", "level": "High", "mps_id": "MPS-duvx-zfk1", "poc": false, "poc_url": [], "published_time": "2026-09-27", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-duvx-zfk1", "name": "https://www.oscs1024.com/hd/MPS-duvx-zfk1"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-100858", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-100858"}, {"url": "https://github.com/heymrun/heym/security/advisories/GHSA-39j3-6x3x-8rcr", "name": "GitHub Security Advisory (GHSA-39j3-6x3x-8rcr)"}, {"url": "https://www.vulncheck.com/advisories/heym-before-0.0.109-server-side-request-forgery-via-workflow-nodes", "name": "VulnCheck Advisory: heym before 0.0.109 Server-Side Request Forgery via Workflow Nodes"}], "scope_influence": "", "tags": ["应用软件"], "title": "0.0.109 之前的 heym 通过工作流节点进行服务器端请求伪造", "_translated": true, "_saved_at": "2026-09-27T03:07:55+00:00", "_first_saved_at": "2026-09-27T03:07:55+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-duvx-zfk1"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-97319", "cvss": {}, "cvss_score": 7.6, "cvss_vector": "", "cwe": "CWE-79", "description": "Blubrry PowerPress 是 WordPress 平台的开源播客插件，用于发布播客 feed 并在文章中嵌入播客播放器，其注册的 powerpress/player-block 区块负责在页面中渲染播放器。\n受影响版本中，powerpress.php 的 powerpress_init_block 函数为播放器区块注册的渲染回调未对区块属性做任何转义，feed_slug 属性被直接拼接进返回的 [powerpress channel=\"...\"] 短代码字符串，id 属性被直接写入 select 元素与提示元素的 HTML 属性，contributor 角色及以上的用户在文章中保存携带恶意属性的区块后，属性值可闭合短代码或 HTML 属性并注入任意脚本，在页面被浏览时执行，形成存储型 XSS。\n修复版本中通过 esc_attr() 先对 feed_slug 与 id 两个区块属性转义并分别存入 $player_feed_slug 与 $player_id，短代码字符串、select 元素 id、class 及编辑器示例渲染等输出位置统一改用转义后的变量，切断属性值注入 HTML 的路径，消除存储型 XSS 风险。", "effects": [{"comp_name": "powerpress", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,11.17.2)", "min_fixed_version": "11.17.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-09-27", "level": "High", "mps_id": "MPS-fnlz-7r93", "poc": false, "poc_url": [], "published_time": "2026-09-27", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-fnlz-7r93", "name": "https://www.oscs1024.com/hd/MPS-fnlz-7r93"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-97319", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-97319"}, {"url": "https://wpscan.com/vulnerability/6ea7d2b5-8406-4efe-9b61-465af40d9a32/", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "PowerPress存储型XSS漏洞", "_translated": true, "_saved_at": "2026-09-27T09:43:49+00:00", "_first_saved_at": "2026-09-27T09:43:49+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-fnlz-7r93"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-101032", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:L/AC:H/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:L/AC:H/AT:P/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.3}]}, "cvss_score": 7.3, "cvss_vector": "CVSS:4.0/AV:L/AC:H/AT:P/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-78", "description": "navi 是一款使用 Rust 编写的开源命令行交互式速查表（cheatsheet）工具，以 Apache-2.0 协议发布于 GitHub 与 crates.io，用于在终端中浏览并执行速查表片段命令。\n受影响版本中，src/commands/core/actor.rs 的 replace_variables_from_snippet 在变量替换时通过 replacen 将变量值作为纯文本拼接到片段命令中，未做任何 shell 转义，拼接结果交由 src/common/shell.rs 的 shell::out 以 \u003cshell\u003e -c 方式执行；当速查表变量通过建议命令取值（如 $ file: ls \u003cdir\u003e）时，变量值来自目录中的文件名等不受速查表作者控制的外部数据，攻击者在建议命令扫描的目录中放置文件名含 shell 元字符的文件，受害者运行 navi 选中对应片段并选择该建议项后，元字符被直接拼入命令，以受害者权限执行任意命令。\n修复版本中通过，可通过在变量值拼接前进行 shell 转义切断上述注入链（上游开放 PR #1038 提出以 shellwords::escape 处理），临时缓解可使用 navi --prevent-interpolation 禁用变量插值，并避免在不可信仓库或共享目录中执行带变量建议的速查表片段。", "effects": [{"comp_name": "navi", "ecosystem": "cargo", "versions": [{"affected_v 可能会导致以随后与该代理交互的更高特权用户的身份执行特权操作。同一用户还可以编写工作流程，这可以扩展到对 Kibana 和 Elasticsearch 集群的完全管理控制。", "effects": [{"comp_name": "Kibana", "ecosystem": "linux", "versions": [{"affected_version": "(9.4.0,9.4.6]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "混淆代理", "kind_en": "非预期的代理或中介（“困惑的代理”）", "last_modified_time": "2026-09-27", "level": "High", "mps_id": "MPS-xpvr-4zbj", "poc": false, "poc_url": [], "published_time": "2026-09-27", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-xpvr-4zbj", "name": "https://www.oscs1024.com/hd/MPS-xpvr-4zbj"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-72668", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-72668"}, {"url": "https://discuss.elastic.co/t/kibana-9-4-7-9-5-0-security-update-esa-2026-85/390678", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "CVE-2026-72668漏洞", "_translated": true, "_saved_at": "2026-09-26T23:19:39+00:00", "_first_saved_at": "2026-09-26T23:19:39+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-xpvr-4zbj"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-96896", "cvss": {}, "cvss_score": 7.2, "cvss_vector": "", "cwe": "CWE-862", "description": "Malcure Malware Shield — Removal, Repair, Monitor（WordPress 插件目录标识 wp-malware-removal）是 Malcure 发布的开源 WordPress 安全插件，提供恶意软件扫描、文件修复、白名单管理与监控能力。\n受影响版本中，traits/wpmr_helpers.php 的 wpmr_ajax_request() 通用 AJAX 分发器在通过 nonce 与 current_user_can('activate_plugins') 校验后，把 $_REQUEST['request'][0] 作为方法名、$_REQUEST['request'][1] 作为参数数组，通过 call_user_func_array 动态调用插件实例的任意公开方法；多站点网络中子站点管理员在其站点上下文持有 activate_plugins 能力，可借助该分发器触达文件修复与删除逻辑，对网络共享文件系统中的任意绝对路径执行写入或删除，最终可提升为远程代码执行。\n修复版本中通过移除 wpmr_ajax_request 分发器及其 AJAX 注册，新增 set_current_user 钩子 wpmr_set_can_remediate() 以 ! is_multisite() || is_super_admin() 生成 can_remediate 门禁，为文件修复、删除、白名单等 remediation 处理器统一补充该门禁，写文件前增加 SHA256 内容校验与符号链接检测，并把高危路由改为带独立 nonce 的专用 AJAX 处理器，阻断子站点管理员对共享文件系统的越权写删操作。", "effects": [{"comp_name": "wp-malware-removal", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,19.9.7)", "min_fixed_version": "19.9.7", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-09-27", "level": "High", "mps_id": "MPS-3k42-6cm0", "poc": false, "poc_url": [], "published_time": "2026-09-27", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-3k42-6cm0", "name": "https://www.oscs1024.com/hd/MPS-3k42-6cm0"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-96896", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-96896"}, {"url": "https://wpscan.com/vulnerability/7ab467f9-4340-464c-a436-978a5acbad3a/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Malcure Malware Shield AJAX越权文件操作漏洞", "_translated": true, "_saved_at": "2026-09-27T ）的 HTTP 通信插件，用于按调用模板访问 HTTP、SSE 和可流式 HTTP 工具端点，服务于智能体工具调用。\n受影响版本中，HttpCommunicationProtocol.call_tool 仅对路径参数替换后的初始工具 URL 执行 ensure_secure_url，随后使用 aiohttp 默认跟随重定向发出请求，不再校验 Location 指向的地址。攻击者控制的工具端点可返回 302，把客户端请求引向云元数据接口或内网 HTTP 服务，并使响应体返回给调用方。\n修复版本中通过 safe_request_with_redirects 关闭自动重定向，在每一跳 Location 上重新执行 ensure_secure_url，并将跳转上限限制为 5 次；call_tool 改为经该函数发请求，未通过校验的重定向目标不再被访问。", "effects": [{"comp_name": "utcp-http", "ecosystem": "pip", "versions": [{"affected_version": "(-∞,1.1.4)", "min_fixed_version": "1.1.4", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SSRF", "kind_en": "服务器端请求伪造 (SSRF)", "last_modified_time": "2026-09-28", "level": "High", "mps_id": "MPS-508p-b2ew", "poc": false, "poc_url": [], "published_time": "2026-09-28", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-508p-b2ew", "name": "https://www.oscs1024.com/hd/MPS-508p-b2ew"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-101060", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-101060"}, {"url": "https://github.com/universal-tool-calling-protocol/python-utcp/security/advisories/GHSA-9qhg-99ww-9mqc", "name": "GitHub Security Advisory (GHSA-9qhg-99ww-9mqc)"}, {"url": "https://www.vulncheck.com/advisories/python-utcp-before-1.1.4-ssrf-via-unvalidated-http-redirects", "name": "VulnCheck Advisory: python-utcp before 1.1.4 SSRF via unvalidated HTTP redirects"}], "scope_influence": "", "tags": ["AI", "python", "开源"], "title": "utcp-http重定向SSRF", "_translated": true, "_saved_at": "2026-09-27T18:53:35+00:00", "_first_saved_at": "2026-09-27T18:53:35+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-508p-b2ew"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-96419", "cvss": {}, "cvss_score": 7.8, "cvss_vector": "", "cwe": "CWE-22", "description": "Wireshark 是 Wireshark Foundation 维护的开源网络协议分析器，用于捕获、解析和检查网络流量，并内置配置 profile 的 ZIP 导入功能。\n受影响版本中，用户在配置对话框选择的 ZIP 会经 ProfileDialog::importFromZip 进入 ProfileModel::importProfilesFromZip，再由 WiresharkZipHelper::unzip 解压。用于拒绝写出解压根目录之外路径的检查位于 #ifndef _WIN32，Windows 构建不执行该检查，仅拦截带盘符的绝对路径，相对路径中的父目录引用仍按 ZIP 条目名写出。厂商公告确认，导入畸形配置 profile 可使 Wireshark 崩溃或执行任意代码。\n修复版本中通过在所有操作系统上先把 Windows 绝对路径转换成相对 profile 名，再用 QDir::cleanPath 要求目标路径以解压根目录为前缀，跳过不满足该约束的条目，阻断配置 ZIP 在导入时写出解压目录之外的文件。", "effects": [{"comp_name": "wireshark", "ecosystem": "linux", "versions": [{"affected_version": "[4.4.0,4.4.19)", "min_fixed_version": "4.4.19", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[4.6.0,4.6.9)", "min_fixed_version": "4.6.9", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-09-28", "level": "High", "mps_id": "MPS-5280-07c0", "poc": false, "poc_url": [], "published_time": "2026-09-28", "reference_url_list": [{"url": "https://cybersecuritynews.com/wireshark-4-6-9-fixes-19-vulnerabilities/", " SI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-121", "description": "Eyeplus 是网络摄像机固件产品，当前未确认其存在可公开获取的源代码仓库，p2pcam HTTP Parser 用于解析设备对外 HTTP 接口上的请求。\n受影响版本中，固件 57.0.0.0308 的 p2pcam HTTP Parser 在处理未认证 HTTP 请求中的超长 URI 时发生栈缓冲区溢出。公开测试显示 TCP 8001 停止接受连接，并短时间中断设备上的其他网络服务，远程代码执行未被确认。\n修复版本中通过公开材料无法确认具体修复动作；CVE 记录仅标明 57.0.0.0308 受影响，未给出 patched version、补丁差异或修复函数。", "effects": [{"comp_name": "eyeplus", "ecosystem": "linux", "versions": [{"affected_version": "[57.0.0.0308,57.0.0.0308]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "栈缓冲区溢出", "kind_en": "基于堆栈的缓冲区溢出", "last_modified_time": "2026-09-28", "level": "High", "mps_id": "MPS-qr3m-xtha", "poc": false, "poc_url": [], "published_time": "2026-09-28", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-qr3m-xtha", "name": "https://www.oscs1024.com/hd/MPS-qr3m-xtha"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-100908", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-100908"}, {"url": "https://vuldb.com/vuln/410859", "name": "VDB-410859 | Eyeplus p2pcam HTTP stack-based overflow"}, {"url": "https://vuldb.com/vuln/410859/cti", "name": "VDB-410859 | CTI Indicators (IOB, IOC)"}, {"url": "https://vuldb.com/cve/CVE-2026-100908", "name": "CVE-2026-100908 | CVE Analysis and Report"}, {"url": "https://vuldb.com/submit/919787", "name": "Submit #919787 | Eyeplus EYEPLUS_DEV 57.0.0.0308 Denial of Service"}, {"url": "https://github.com/devjanger/iot-advisories/blob/main/EYEPLUS-8001-Long-URI-DoS.md", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Eyeplus栈溢出漏洞", "_translated": true, "_saved_at": "2026-09-28T06:14:16+00:00", "_first_saved_at": "2026-09-28T06:14:16+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-qr3m-xtha"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-97335", "cvss": {"cvssv31": [{"source": "security@ubuntu.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:N/A:N", "severity": "high", "base_score": 7.7}]}, "cvss_score": 7.7, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:N/A:N", "cwe": "CWE-863", "description": "LXD是Canonical开源的容器与虚拟机管理工具，基于Go语言实现，通过REST API统一管理容器、虚拟机、存储卷与网络，并依靠项目（project）机制提供多租户隔离能力。\n受影响版本中，POST /1.0/storage-pools/{pool}/volumes/custom 接口仅在请求显式设置 source.type 为 copy 时才对源存储卷执行 can_view 权限检查，请求省略 source.type 但携带源卷名与 source.project 时，storagePoolVolumesPost 会经 switch 空值分支进入 doVolumeCreateOrCopy，该函数按调用方指定的 source.project 解析源项目并直接执行跨项目卷复制，全程缺少对源卷的权限校验，持有任意项目自定义卷创建权限的认证客户端可复制并读取服务器上其他项目中的自定义存储卷及其快照与配置，破坏项目隔离。\n修复版本中通过将指定了源卷但省略 source.type 的请求统一规范化为 copy 类型，使其与显式 copy 请求共用同一条源卷 can_view 权限检查路径，未授权的跨项目复制请求被直接拒绝，该规范化修复包含于 5.0.10、5.21.8 和 6.10 版本。", "effects": [{"comp_name": "github.com/canonical/lxd", "ecosystem": "go", "versions": [{"affected_version": "[5.21.0,5.21.8)", "min_fixed_version": "5.21.8", "repository": "go", "solutions": [], "upstream": true}, {"affected_version": "[5.0.0,5.0.10)", "min_fixed_version": "5.0.10", "repository": "go", "solutions": [], "upstream": true}, {"affected_version": "[6.0.0,6.10)", "min_fixed_version": "6.10", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-09-28", "level": "High", "mps_id": "MPS-w30m-u9jn", "poc": false, "poc_url": [], "published_time": "2026-09-28", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-w30m-u9jn", "name": "https://www.oscs1024.com/hd/MPS-w30m-u9jn"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-97335", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-97335"}, {"url": "https://github.com/canonical/lxd/security/advisories/GHSA-p456-92fx-44xh", "name": ""}], "scope_influence": "", "tags": ["go"], "title": "LXD跨项目存储卷越权读取漏洞", "_translated": true, "_saved_at": "2026-09-28T14:51:26+00:00", "_first_saved_at": "2026-09-28T14:51:26+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-w30m-u9jn"}, {"analysis_status": 0, "articles": [], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-96280", "cvss": {"cvssv31": [{"source": "secalert@redhat.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:R/S:U/C:H/I:H/A:H", "cwe": "CWE-197", "description": "Flatpak 是 freedesktop.org 维护的开源 Linux 应用沙箱与分发工具，用于从 OSTree 或 OCI registry 安装、更新和运行桌面应用。\n受影响版本中，OCI delta 流解析把长度按 guint64 读出，再传入只接受 gsize 的 GLib 分配与读取接口。在 32 位系统上 gsize 为 32 位，长度被截断后分配的堆缓冲区小于后续仍按原始长度执行的写入；delta_read_data 在计算 size+1 时还可能回绕为 0，随后 g_input_stream_read_all 向过小缓冲区写入。该逻辑由 flatpak_oci_registry_apply_delta_stream 在处理 DELTA_OP_OPEN 路径名时进入，攻击者控制的 OCI registry 可在 flatpak install 或 flatpak update 期间造成客户端堆缓冲区溢出，并可能执行代码。64 位系统上 gsize 与 guint64 等宽，该截断不会发生，默认 OSTree 传输不受影响。\n修复版本中通过将 delta 长度改为 gsize 并拒绝超过 G_MAXSIZE 的变长整数，在 delta_read_data 中拒绝会使 size+1 回绕的长度，同时把 DELTA_OP_OPEN 路径长度限制在 PATH_MAX 以内，阻断超长 delta 长度进入过小堆分配与读取。", "effects": [{"comp_name": "flatpak", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.18.1)", "min_fixed_version": "1.18.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "数值截断错误", "kind_en": "数字截断错误", "last_modified_time": "2026-09-28", "level": "High", "mps_id": "MPS-hjk3-bqy1", "poc": false, "poc_url": [], "published_time": "2026-09-28", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-hjk3-bqy1", "name": "https://www.oscs1024.com/hd/MPS-hjk3-bqy1"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-96280", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-96280"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-96280", "name": ""}, {"url": "https://bugzilla.redhat.com/show_bug.cgi?id=2539419", "name": "RHBZ#2539419"}, {"url": "https://github.com/flatpak/flatpak/security/advisories/GHSA-jr92-2v97-wgvc", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Flatpak OCI堆溢出", "_translated": true, "_saved_at": "2026-09-27T21:48:22+00:00", "_first_saved_at": "2026-09-27T21:48:22+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-hjk3-bqy1"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "cnvd_id": "", "cve_id": "CVE-2026-101086", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:N", "severity": "medium", "base_score": 6.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-269", "description": "哪吒监控（Nezha）Dashboard 是开源 Go 组件，模块路径为 github.com/nezhahq/nezha，用于集中管理监控 Agent 并下发探测与运维任务。\n受影响版本中，服务监控与命令执行、Agent 配置等特权操作共用 protobuf Task.Type 命名空间。createService 与 updateService 将调用方提交的 ServiceForm.Type 写入 Service，未将其限制为 HTTP GET、ICMP ping 或 TCP ping；Service.PB 再把该类型和 Target 填入 pb.Task，调度器向调用方已获授权范围内的 Agent 下发该任务。具备 nezha:service:write 的 RoleMember 或 PAT 因此可以用服务监控接口投递命令执行或 Agent 配置任务，但不能越过既有的服务器归属与 PAT server_ids 限制。\n修复版本中通过 ValidateServiceMonitorType 白名单只允许三类探针任务，并在创建与更新接口、模型持久化、调度加载和 DispatchTask 下发前拒绝其他类型；Service.PB 对非探针类型返回 nil，已入库的非法记录不再被调度或下发。", "effects": [{"comp_name": "github.com/nezhahq/nezha", "ecosystem": "go", "versions": [{"affected_version": "[0,2.3.5)", "min_fixed_version": "2.3.5", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-09-28", "level": "High", "mps_id": "MPS-06eu-xg2p", "poc": false, "poc_url": [], "published_time": "2026-09-28", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-06eu-xg2p", "name": "https://www.oscs1024.com/hd/MPS-06eu-xg2p"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-101086", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-101086"}, {"url": "https://github.com/nezhahq/nezha/security/advisories/GHSA-grrw-fx36-fv32", "name": "GitHub Security Advisory (GHSA-grrw-fx36-fv32)"}, {"url": "https://github.com/nezhahq/nezha/commit/38824dbc11a63964c5b9296ae4c68e62b34fa04b", "name": "Patch Commit"}, {"url": "https://www.vulncheck.com/advisories/nezha-dashboard-before-2.3.5-task-type-validation-bypass", "name": "VulnCheck Advisory: Nezha Dashboard before 2.3.5 Task Type Validation Bypass"}], "scope_influence": "", "tags": ["go"], "title": "哪吒监控任务类型越权", "_translated": true, "_saved_at": "2026-09-27T21:48:24+00:00", "_first_saved_at": "2026-09-27T21:48:24+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-06eu-xg2p"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-90925", "cvss": {"cvssv31": [{"source": "iletisim@usom.gov.tr", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:H/A:L", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:H/A:L", "cwe": "CWE-22", "description": "Logsign SIEM 是 Innotim Software, Telecommunications and Consultancy Trade Ltd. Co. 提供的闭源安全信息与事件管理产品，用于集中采集、关联和分析安全日志。\n受影响版本中，产品未把路径名限制在受限目录内，形成 CWE-22 路径穿越。CVE.org 记录受影响范围为 6.4.101（含）至 6.4.117（不含）。CNA 的通用评分场景为远程访问、低权限且无需用户交互，完整性影响为高，可用性影响为低，机密性无影响。公开公告未披露具体接口、文件或函数。\n修复版本中通过 6.4.117 版本更新消除该路径穿越缺陷。TR-CERT 公告 TR-26-1202 建议升级至 6.4.117 及以上版本，公开资料未披露具体修复代码。", "effects": [{"comp_name": "Logsign SIEM", "ecosystem": "linux", "versions": [{"affected_version": "[6.4.101,6.4.117)", "min_fixed_version": "6.4.117", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-09-28", "level": "High", "mps_id": "MPS-n5c4-386d", "poc": false, "poc_url": [], "published_time": "2026-09-28", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-n5c4-386d", "name": "https://www.oscs1024.com/hd/MPS-n5c4-386d"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-90925", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-90925"}, {"url": "https://siberguvenlik.gov.tr/guvenlik-bildirimleri/detay/tr-26-1202", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Logsign路径穿越漏洞", "_translated": true, "_saved_at": "2026-09-28T14:51:29+00:00", "_first_saved_at": "2026-09-28T14:51:29+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-n5c4-386d"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-101085", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:N/A:H", "severity": "medium", "base_score": 6.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-197", "description": "Nezha（哪吒监控）是采用 Apache-2.0 许可的开源 Go 服务器监控面板，用于汇集 Agent 状态并提供告警与控制面管理。\n受影响版本中，已登录的非管理员用户可通过 POST /api/v1/alert-rule 调用 createAlertRule。validateRule 只检查 Cover、Duration 下限和部分归属关系，不校验 Rule.Type 是否属于已知集合，也不限制 uint64 类型的 Duration 上界。规则写入数据库后，由无 recover 的告警评估协程 checkStatus 周期执行。gpu_max 与 temperature_max 在 GPU 或温度采样为空时直接调用 slices.Max，offline 规则把超出 int 可表示范围的 Duration 直接转换成 int 后用作切片下标，两类路径都会触发未恢复的 panic，导致 Dashboard 进程退出。规则仍保留在数据库中，进程重启后会再次崩溃，监控与控制面随之中断。\n修复版本中通过在 validateRule 中拒绝未知规则类型以及超过 MaxAlertRuleDuration 的持续时间，并在 Rule.Snapshot 对空采样提前返回、在 AlertRule.Check 使用 DurationInt 做带上界检查的整数转换，同时由 checkStatusForServer 捕获评估过程中的 panic，且对已落库的异常规则执行 IsSafeToEvaluate 后跳过，避免异常规则再使 Dashboard 进程退出。", "effects": [{"comp_name": "github.com/nezhahq/nezha", "ecosystem": "go", "versions": [{"affected_version": "(-∞,2.3.8)", "min_fixed_version": "2.3.8", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "数值截断错误", "kind_en": "数字截断错误", "last_modified_time": "2026-09-28", "level": "High", "mps_id": "MPS-nhdu-fqik", "poc": false, "poc_url": [], "published_time": "2026-09-28", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-nhdu-fqik", "name": "https://www.oscs1024.com/hd/MPS-nhdu-fqik"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-101085", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-101085"}, {"url": "https://github.com/nezhahq/nezha/security/advisories/GHSA-2qc6-x993-hjq9", "name": "GitHub Security Advisory (GHSA-2qc6-x993-hjq9)"}, {"url": "https://www.vulncheck.com/advisories/nezha-before-2.3.8-denial-of-ser utcp 项目的开源 Python 插件（PyPI 包名 utcp-http），实现 Universal Tool Calling Protocol 的 HTTP、SSE 和 Streamable HTTP 工具发现与调用传输，属于 AI 代理工具调用基础设施组件。\n受影响版本中，HttpCommunicationProtocol、SseCommunicationProtocol 和 StreamableHttpCommunicationProtocol 的 register_manual 方法在从远程非环回源发现手写 UTCP manual 时，仅通过 ensure_secure_url 校验发现 URL，该函数为支持本地开发默认放行明文 HTTP 环回地址，而原生 manual 不经过 OpenAPI 转换器的环回检查，manual 内各工具 call_template 的 URL 未与发现源比对。攻击者诱导受害者注册指向其所控 HTTPS 源的 manual 后，可在 manual 中声明指向 127.0.0.1 的工具 URL，客户端后续调用该工具时 ensure_secure_url 同样放行环回地址，请求发往受害者主机仅监听环回接口的服务并将响应体返回调用方，形成服务器端请求伪造。\n修复版本中通过新增 reject_remote_loopback_tool_urls 校验解决该问题，http、sse 和 streamable_http 三种协议的 register_manual 在解析出 manual 后调用该函数，发现源为非环回地址而 manual 中存在环回工具 URL 时抛出 ValueError 拒绝注册，环回源发现的 manual 保留本地开发豁免，utcp-http 1.1.12 起生效。", "effects": [{"comp_name": "utcp-http", "ecosystem": "pip", "versions": [{"affected_version": "(-∞,1.1.12)", "min_fixed_version": "1.1.12", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SSRF", "kind_en": "服务器端请求伪造 (SSRF)", "last_modified_time": "2026-09-28", "level": "High", "mps_id": "MPS-tkdu-r1we", "poc": false, "poc_url": [], "published_time": "2026-09-28", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-tkdu-r1we", "name": "https://www.oscs1024.com/hd/MPS-tkdu-r1we"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-101058", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-101058"}, {"url": "https://github.com/universal-tool-calling-protocol/python-utcp/security/advisories/GHSA-8vxx-v7r9-948g", "name": "GitHub Security Advisory (GHSA-8vxx-v7r9-948g)"}, {"url": "https://www.vulncheck.com/advisories/python-utcp-before-1.1.12-ssrf-via-remote-http-manual", "name": "VulnCheck Advisory: python-utcp before 1.1.12 SSRF via Remote HTTP Manual"}], "scope_influence": "", "tags": ["AI", "python", "开源"], "title": "utcp-http SSRF漏洞", "_translated": true, "_saved_at": "2026-09-27T18:53:37+00:00", "_first_saved_at": "2026-09-27T18:53:37+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-tkdu-r1we"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-87741", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-78", "description": "ConvertPlus（插件目录名 convertplug）是 Brainstorm Force 发布的 WordPress 弹窗插件，以 GPL 许可分发，用于创建模态弹窗、通知栏和滑入表单，官方没有公开的 Git 仓库。\n受影响版本中，Subscriber 及以上已登录用户可访问仅挂在 wp_ajax_cp_display_preview_modal 的预览回调。Convert_Plug::cp_display_preview_modal 会引入 modules/modal/style-preview-ajax.php；该文件把 nonce 校验放在 isset($_REQUEST['cp_admin_page_nonce']) 条件内，请求不携带 cp_admin_page_nonce 时继续执行，且没有能力检查。$_GET['style'] 经 sanitize_text_field 后被拼进 [smile_modal] 短代码并传入 do_shortcode，该过滤不会去掉短代码分隔符，调用方可以插入第二个受控的 [smile_modal]，使 smile_modal_popup 对 base64 解码后的 settings_encoded 调用不带 allowed_classes 的 maybe_unserialize，注入 PHP 对象。插件自身没有已知 POP 链，仅当其他插件或主题提供 POP 链时，才可能删除任意文件、读取敏感数据或执行代码。\n修复版本中通   <script>
    const payload = JSON.parse(document.getElementById("payload").textContent);
    const levelLabels = payload.level_labels || {};
    const items = payload.items || [];
    let filtered = items.slice();
    let activeId = null;

    const $ = (id) => document.getElementById(id);
    $("generatedAt").textContent = payload.generated_at || "-";
    $("retention").textContent = payload.retention_days ?? "-";
    $("cutoff").textContent = payload.cutoff_date || "-";
    $("count").textContent = String(payload.count ?? items.length);

    function levelClass(level) {
      const cn = levelLabels[level] || level || "";
      if (level === "Critical" || cn === "严重") return "crit";
      if (level === "High" || cn === "高危") return "high";
      return "other";
    }
    function levelText(level) {
      return levelLabels[level] || level || "-";
    }
    function esc(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }
    function scoreText(v) {
      if (v === null || v === undefined || v === "" || v === -1) return "-";
      return String(v);
    }

    function renderList() {
      const list = $("list");
      $("listCount").textContent = String(filtered.length);
      if (!filtered.length) {
        list.innerHTML = '<div class="empty">没有匹配项</div>';
        return;
      }
      list.innerHTML = filtered.map((it) => {
        const id = it.mps_id || it.cve_id;
        const active = id === activeId ? " active" : "";
        return `
          <button class="item${active}" data-id="${esc(id)}" type="button">
            <div class="item-top">
              <span class="cve">${esc(it.cve_id || it.mps_id || "-")}</span>
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
            </div>
            <div class="title">${esc(it.title || "-")}</div>
            <div class="item-foot">
              <span>CVSS ${esc(scoreText(it.cvss_score))}</span>
              <span>${esc(it.published_time || "-")}</span>
              ${it.poc ? "<span>POC</span>" : ""}
            </div>
          </button>`;
      }).join("");
      list.querySelectorAll(".item").forEach((btn) => {
        btn.addEventListener("click", () => selectById(btn.dataset.id));
      });
    }

    function refsHtml(it) {
      const refs = Array.isArray(it.reference_url_list) ? it.reference_url_list : [];
      const links = [];
      if (it._source_page) links.push({ url: it._source_page, name: "OSCS 详情" });
      if (it.cve_id) links.push({ url: `https://nvd.nist.gov/vuln/detail/${it.cve_id}`, name: "NVD" });
      refs.forEach((r) => {
        if (r && r.url) links.push({ url: r.url, name: r.name || r.url });
      });
      const seen = new Set();
      const uniq = [];
      for (const l of links) {
        if (seen.has(l.url)) continue;
        seen.add(l.url);
        uniq.push(l);
      }
      if (!uniq.length) return '<div class="box">无参考链接</div>';
      return `<div class="refs">${uniq.map((l) =>
        `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name || l.url)}</a>`
      ).join("")}</div>`;
    }

    function articlesHtml(it) {
      const arts = Array.isArray(it.articles) ? it.articles : [];
      if (!arts.length) return "";
      return `<div class="section"><h3>相关说明</h3>${arts.map((a) => `
        <div class="article">
          <h4>${esc(a.title || "说明")}</h4>
          <p>${esc(a.content || "")}</p>
        </div>`).join("")}</div>`;
    }

    function renderDetail(it) {
      const detail = $("detail");
      if (!it) {
        detail.innerHTML = '<div class="empty">暂无数据</div>';
        return;
      }
      const pocUrls = Array.isArray(it.poc_url) ? it.poc_url : [];
      detail.innerHTML = `
        <div class="d-head">
          <div>
            <h1 class="d-title">${esc(it.title || "-")}</h1>
            <div class="ids">
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
              <span class="chip">${esc(it.cve_id || "无 CVE")}</span>
              <span class="chip">${esc(it.mps_id || "-")}</span>
              ${it.poc ? '<span class="chip">有 POC</span>' : ""}
              ${it.exp ? '<span class="chip">有 EXP</span>' : ""}
            </div>
          </div>
          <div class="actions">
            ${it._source_page ? `<a class="btn" href="${esc(it._source_page)}" target="_blank" rel="noopener">OSCS</a>` : ""}
            ${it.cve_id ? `<a class="btn" href="https://nvd.nist.gov/vuln/detail/${esc(it.cve_id)}" target="_blank" rel="noopener">NVD</a>` : ""}
          </div>
        </div>
        <div class="grid">
          <div class="stat"><div class="k">CVSS</div><div class="v">${esc(scoreText(it.cvss_score))}</div></div>
          <div class="stat"><div class="k">向量</div><div class="v">${esc(it.cvss_vector || "-")}</div></div>
          <div class="stat"><div class="k">CWE</div><div class="v">${esc(it.cwe || "-")}</div></div>
          <div class="stat"><div class="k">类型</div><div class="v">${esc(it.kind || it.kind_en || "-")}</div></div>
          <div class="stat"><div class="k">公开</div><div class="v">${esc(it.published_time || "-")}</div></div>
          <div class="stat"><div class="k">利用成本</div><div class="v">${esc(it.exploit_requirement_cost || "-")}</div></div>
          <div class="stat"><div class="k">可利用性</div><div class="v">${esc(it.exploitability || "-")}</div></div>
          <div class="stat"><div class="k">修复建议</div><div class="v">${esc(it.fix_suggestion || "-")}</div></div>
        </div>
        <div class="section"><h3>描述</h3><div class="box">${esc(it.description || "无描述")}</div></div>
        ${it.scope_influence ? `<div class="section"><h3>影响范围</h3><div class="box">${esc(it.scope_influence)}</div></div>` : ""}
        ${pocUrls.length ? `<div class="section"><h3>POC 链接</h3><div class="refs">${pocUrls.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join("")}</div></div>` : ""}
        <div class="section"><h3>参考链接</h3>${refsHtml(it)}</div>
        ${articlesHtml(it)}
      `;
    }

    function selectById(id) {
      const it = filtered.find((x) => (x.mps_id || x.cve_id) === id) ||
                 items.find((x) => (x.mps_id || x.cve_id) === id);
      if (!it) return;
      activeId = it.mps_id || it.cve_id;
      renderList();
      renderDetail(it);
      const btn = document.querySelector(`.item[data-id="${CSS.escape(activeId)}"]`);
      if (btn) btn.scrollIntoView({ block: "nearest" });
      history.replaceState(null, "", "#" + encodeURIComponent(activeId));
    }

    function applyFilter(q) {
      const query = (q || "").trim().toLowerCase();
      filtered = !query ? items.slice() : items.filter((it) => {
        const blob = [
          it.cve_id, it.mps_id, it.title, it.kind, it.kind_en, it.cwe, it.description, it.level
        ].map((x) => String(x || "").toLowerCase()).join(" ");
        return blob.includes(query);
      });
      renderList();
      if (filtered.length) {
        const still = filtered.some((x) => (x.mps_id || x.cve_id) === activeId);
        selectById(still ? activeId : (filtered[0].mps_id || filtered[0].cve_id));
      } else {
        activeId = null;
        renderDetail(null);
      }
    }

    $("search").addEventListener("input", (e) => applyFilter(e.target.value));

    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement !== $("search")) {
        e.preventDefault();
        $("search").focus();
        return;
      }
      if (!filtered.length) return;
      const idx = filtered.findIndex((x) => (x.mps_id || x.cve_id) === activeId);
      if (e.key === "ArrowDown") {
        e.preventDefault();
        const next = filtered[Math.min(filtered.length - 1, Math.max(0, idx) + 1)];
        selectById(next.mps_id || next.cve_id);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        const prev = filtered[Math.max(0, idx - 1)];
        selectById(prev.mps_id || prev.cve_id);
      }
    });

    const hashId = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    if (hashId && items.some((x) => (x.mps_id || x.cve_id) === hashId)) {
      activeId = hashId;
      renderList();
      selectById(hashId);
    } else if (items.length) {
      selectById(items[0].mps_id || items[0].cve_id);
    } else {
      renderList();
      renderDetail(null);
    }
  </script>
</body>
</html>
