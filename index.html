hangeset?reponame=\u0026old=3667867%40the-events-calendar\u0026new=3667867%40the-events-calendar", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-78159漏洞", "_translated": true, "_saved_at": "2026-09-12T11:53:39+00:00", "_first_saved_at": "2026-09-12T11:53:39+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-7d85-i6uk"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过向受信任的数据序列化过程中添加恶意数据，从而在序列化和反序列化过程中执行恶意代码的攻击漏洞。这种漏洞通常存在于使用序列化 (serialization) 机制存储和传输数据的程序中。\n", "title": "什么是反序列化"}, {"content": "- 注入攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码注入到程序中，从而实现代码执行的目的。\n- 反射攻击：攻击者使用反射机制，在序列化过程中动态生成恶意数据，并将恶意代码注入到程序中，从而实现代码执行的目的。\n- 缓冲区溢出攻击：攻击者通过在序列化过程中向缓冲区输入恶意数据，导致缓冲区溢出，从而破坏程序的内存管理，实现代码执行的目的。\n- 格式字符串攻击：攻击者通过在序列化过程中输入恶意数据，导致程序使用错误的格式字符串，从而实现代码执行的目的。\n- 数据流攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码作为一个数据流传递给程序，从而实现代码执行的目的。\n", "title": "反序列化常见的攻击方式"}, {"content": "- 不信任输入数据：程序应该严格检查输入数据的有效性，并避免使用不受信任的数据。\n- 使用安全的序列化机制：程序应该使用安全的序列化机制，如 JSON 或 XML 序列化，而不是第三方序列化库。\n- 最小特权原则：程序应该限制对受信任数据的处理权限，并避免在运行时修改数据。\n- 代码审查和漏洞扫描：程序应该进行代码审查和漏洞扫描，以发现和修复潜在的安全漏洞。\n", "title": "如何预防反序列化"}], "cnvd_id": "", "cve_id": "CVE-2026-78006", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-502", "description": "WordPress 的事件日历插件在 6.17.4 及之前的所有版本中都容易通过 is_safe_widget_instance 函数受到远程代码执行的攻击。这是由于 is_safe_widget_instance 中的保护不足造成的，可以绕过它，因为 PHP 在预解析期间会触发魔术方法，并在达到 unserialize() 之前结合 enable_rendering_widget_copied() 伪造有效的 wp_hash 完整性属性。这使得未经身份验证的攻击者可以在服务器上执行代码。无需身份验证或批准即可利用此漏洞，因为该插件的 V2 单事件模板在缓冲的评论 HTML 上运行 do_blocks()，并且 WordPress 返回一个审核哈希 URL，允许未经身份验证的评论者立即查看自己的待处理评论，从而在发生任何审核之前将注入的块标记传递到易受攻击的代码路径。这确实需要启用评论并在事件中可见。", "effects": [{"comp_name": "The Events Calendar", "ecosystem": "linux", "versions": [{"affected_version": "(0,6.17.4]", "min_fixed_version": "", "repository": "unmanaged", "solutions" 5-pnsw"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-72710", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-72710"}, {"url": "https://blog.lexfo.fr/casse-spip-sqli-to-rce.html", "name": "Researcher Blog"}, {"url": "https://blog.spip.net/Mise-a-jour-critique-de-securite-sortie-de-SPIP-4-4-18.html", "name": "Release Notes"}, {"url": "https://www.vulncheck.com/advisories/spip-remote-code-execution-via-editer-objet-php-job-queue-injection", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "SPIP editer_objet远程代码执行漏洞", "_translated": true, "_saved_at": "2026-09-11T18:05:28+00:00", "_first_saved_at": "2026-09-11T18:05:28+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-69f5-pnsw"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-72709", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT 47漏洞", "_translated": true, "_saved_at": "2026-09-13T00:32:35+00:00", "_first_saved_at": "2026-09-13T00:32:35+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-54yk-l9q0"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过向受信任的数据序列化过程中添加恶意数据，从而在序列化和反序列化过程中执行恶意代码的攻击漏洞。这种漏洞通常存在于使用序列化 (serialization) 机制存储和传输数据的程序中。\n", "title": "什么是反序列化"}, {"content": "- 注入攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码注入到程序中，从而实现代码执行的目的。\n- 反射攻击：攻击者使用反射机制，在序列化过程中动态生成恶意数据，并将恶意代码注入到程序中，从而实现代码执行的目的。\n- 缓冲区溢出攻击：攻击者通过在序列化过程中向缓冲区输入恶意数据，导致缓冲区溢出，从而破坏程序的内存管理，实现代码执行的目的。\n- 格式字符串攻击：攻击者通过在序列化过程中输入恶意数据，导致程序使用错误的格式字符串，从而实现代码执行的目的。\n- 数据流攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码作为一个数据流传递给程序，从而实现代码执行的目的。\n", "title": "反序列化常见的攻击方式"}, {"content": "- 不信任输入数据：程序应该严格检查输入数据的有效性，并避免使用不受信任的数据。\n- 使用安全的序列化机制：程序应该使用安全的序列化机制，如 JSON 或 XML 序列化，而不是第三方序列化库。\n- 最小特权原则：程序应该限制对受信任数据的处理权限，并避免在运行时修改数据。\n- 代码审查和漏洞扫描：程序应该进行代码审查和漏洞扫描，以发现和修复潜在的安全漏洞。\n", "title": "如何预防反序列化"}], "cnvd_id": "", "cve_id": "CVE-2026-78175", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-502", "description": "Tutor LMS – WordPress 的电子学习和在线课程解决方案插件在 4.0.7 及之前的所有版本中都容易通过“tutor_save_withdraw_account” AJAX 处理程序的“withdraw_method_field”参数受到 PHP 对象注入攻击。这是因为处理程序缺乏任何功能或角色检查，仅依赖于随机数，同时还通过“esc_sql()”传递攻击者提供的值，在数据通过“update_user_meta()”序列化和存储之前，它会用 66 字节 HMAC 占位符令牌替换每个“%”字符；当稍后检索元时，占位符会折叠回单个“%”，使序列化字符串长度声明比实际内容大 65 个字节，并且由于数组键源自完全未转义的 POST 字段名称，“unserialize()”会过度读取攻击者控制的字节，从而允许注入任意序列化对象流。这使得具有订阅者级别及以上访问权限的经过身份验证的攻击者可以通过触发“GuzzleHttp\\Cookie\\FileCookieJar” POP 链在服务器上实现远程代码执行，该 POP 链可通过“TUTOR\\RestAPI”中的“spl_autoload_register”加载器访问，该加载器加载插件自己的捆绑 PayPal Composer 自动加载器，将攻击者控制的内容写入攻击者指定的文件名。当启用用户注册时，这有一个未经身份验证的途径，这对于学生和教师注册来说很常见，并且需要启用货币化功能。", "effects": [{"comp_name": "Tutor LMS – eLearning and online course solution", "ecosystem": "linux", "versions": [{"affected_version": "(0,4.0.7]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "反序列化", "kind_en": "不可信数据的反序列化", "last_modified_time": "2026-09-12", "level": "High", "mps_id": "MPS-rugs-a12c", "poc": false, "poc_url": [], "published_time": "2026-09-12", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-rugs-a12c", "name": "https://www.oscs1024.com/hd/MPS-rugs-a12c"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-78175", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-78175"}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/d0077d56-11e7-4e74-abe0-63e81db67be3?source=cve", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/tutor/tags/4.0.7/classes/Withdraw.php#L213", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/tutor/tags/4.0.7/classes/Withdraw.php#L217", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/tutor/tags/4.0.7/classes/Withdraw.php#L204", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/tutor/tags/4.0.7/classes/Withdraw.php#L44", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/tutor/tags/4.0.7/classes/RestAPI.php#L190", "name": ""}, {"url": "https://plugins.trac.wordpress.org/changeset?reponame=\u0026old=3690454%40tutor\u0026new=3690454%40tutor", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-78175漏洞", "_translated": true, "_saved_at": "2026-09-12T11:53:47+00:00", "_first_saved_at": "2026-09-12T11:53:47+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-rugs-a12c"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-89266", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:L/A:H", "severity": "high", "base_score": 8.2}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:L/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:L/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-787", "description": "stb_vorbis 到 1.22 包含 start_decoder() 中的堆缓冲区溢出，其中码本被乘数分配大小从 size_t 截断为 int。攻击者可以制作具有大条目和维度值的恶意 Ogg Vorbis 文件，以触发越界写入，从而导致进程崩溃或堆损坏。", "effects": [{"comp_name": "stb_vorbis", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.22]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-09-12", "level": "High", "mps_id": "MPS-vwx1-ogys", "poc": false, "poc_url": [], "published_time": "2026-09-12", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-vwx1-ogys", "name": "https://www.oscs1024.com/hd/MPS-vwx1-ogys"}, {"url": "https://nvd.nist.gov/vuln ption": "MoguBlog（蘑菇博客）是 moxi624 开源的基于微服务架构的前后端分离博客系统，后端采用 Spring Boot、Spring Cloud 与 Spring Security/JWT 构建，mogu_web 模块对外提供前台评论接口。\n受影响版本中，mogu_web 模块 CommentRestApi 的 deleteBatch 方法（POST /web/comment/delete）校验评论属主时，将数据库中评论记录的 userUid 与请求体传入的 commentVO.getUserUid() 直接比对，未与登录主体关联；WebSecurityConfig 将 /web/comment/** 配置为 permitAll，该接口无需认证访问，攻击者从同样无需认证的 /web/comment/getList 响应中获取目标评论的 uid 与作者 userUid 后构造删除请求，可删除任意评论，getToCommentList 还会递归将其全部子评论置为禁用，导致站点公开评论内容被清除。\n修复版本中通过，可通过网关或反向代理限制外部对 /web/comment/delete 接口的匿名访问，或自行修改源码将属主校验改为与 JWT 解析出的登录用户 userUid 比对，避免信任请求体中的属主字段；截至 2026-09-12，官方最新发行版 6.2 与主分支最新代码仍保留该请求体属主校验，尚未发布修复版本。", "effects": [{"comp_name": "mogublog", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,6.2]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "通过用户控制密钥绕过授权机制", "kind_en": "通过用户控制的密钥绕过授权", "last_modified_time": "2026-09-12", "level": "High", "mps_id": "MPS-lmtz-xwgd", "poc": false, "poc_url": [], "published_time": "2026-09-12", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-lmtz-xwgd", "name": "https://www.oscs1024.com/hd/MPS-lmtz-xwgd"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-89262", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-89262"}, {"url": "https://github.com/LinYuanyi1/cve-request-poc/blob/master/mogublog-poc/C04_comment_delete_idor.py", "name": "C04 - POST /web/comment/delete proof of concept"}, {"url": "https://github.com/moxi624/mogu_blog_v2/blob/025d78c7ac7e19b1abf796fa3cc158d855723d15/mogu_web/src/main/java/com/moxi/mogublog/web/restapi/CommentRestApi.java", "name": "CommentRestApi.deleteBatch compares the stored author uid against a request-body field"}, {"url": "https://github.com/moxi624/mogu_blog_v2/blob/025d78c7ac7e19b1abf796fa3cc158d855723d15/mogu_web/src/main/java/com/moxi/mogublog/web/config/WebSecurityConfig.java", "name": "mogu_web WebSecurityConfig permits /web/comment/** for all callers"}, {"url": "https://gitee.com/moxi159753/mogu_blog_v2/releases", "name": "MoguBlog releases"}, {"url": "https://github.com/moxi624/mogu_blog_v2", "name": "Product"}, {"url": "https://www.vulncheck.com/advisories/mogublog-through-6.2-arbitrary-comment-deletion-via-request-body-ownership-check", "name": "VulnCheck Advisory: MoguBlog through 6.2 Arbitrary Comment Deletion via Request-Body Ownership Check"}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "MoguBlog评论删除越权漏洞", "_translated": true, "_saved_at": "2026-09-11T18:05:32+00:00", "_first_saved_at": "2026-09-11T18:05:32+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-lmtz-xwgd"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-72708", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "high", "base_score": 7.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-89", "description": "SPIP 是一个采用 GNU/GPL 许可的开源 PHP 内容管理系统，通过模板引擎渲染公开页面并访问 MySQL 等数据库，核心代码托管在 git.spip.net。\n受影响版本中，公开 sitemap 模板 squelettes-dist/sitemap.xml.html 将 URL 参数 annee 作为日期条件编译为对文章日期列的比较，取值经 sql_quote 传入 MySQL 引擎转义函数 ecrire/req/mysql.php 的 spip_mysql_cite()；该函数在目标列为日期类型且取值匹配 /^\\w+\\(/ 时原样返回而不转义，未认证攻击者通过 /sitemap.xml?annee= 提交 sleep(5) 之类的取值，可将任意 SQL 片段拼入查询，实施基于时间与布尔的盲注，读取任意数据库内容，包括用于签名 action nonce 的 alea_ephemere 密钥。\n修复版本中通过把日期类型字段的原样透传条件收紧为仅允许 NOW()（大小写不敏感）切断注入链，其余取值回落到 addslashes 转义，并在 req/sqlite_generique.php 的 _sqlite_calculer_cite() 中同步应用相同修复；SPIP 4.4.18（2026-08-10 发布）已包含该修复。", "effects": [{"comp_name": "spip", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,4.4.18)", "min_fixed_version": "4.4.18", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "spip/ecrire", "ecosystem": "composer", "versions": [{"affected_version": "(-∞,4.4.18)", "min_fixed_version": "4.4.18", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-09-12", "level": "High", "mps_id": "MPS-od94-5its", "poc": false, "poc_url": [], "published_time": "2026-09-12", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-od94-5its", "name": "https://www.oscs1024.com/hd/MPS-od94-5its"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-72708", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-72708"}, {"url": "https://blog.lexfo.fr/casse-spip-sqli-to-rce.html", "name": "Researcher Blog"}, {"url": "https://blog.spip.net/Mise-a-jour-critique-de-securite ": 8.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-1392", "description": "示例环境配置文件附带一个固定的、公开的秘密值，用于为捆绑的数据包分析组件签署身份验证 cookie。将此示例文件复制到活动配置而不运行重新生成该值的设置例程的部署将使用已知的默认值，从而允许攻击者了解默认值，从而伪造该组件的有效身份验证 cookie。", "effects": [{"comp_name": "Malcolm", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,v26.06.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "", "kind_en": "", "last_modified_time": "2026-09-12", "level": "High", "mps_id": "MPS-cty9-v6aq", "poc": false, "poc_url": [], "published_time": "2026-09-12", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-cty9-v6aq", "name": "https://www.oscs1024.com/hd/MPS-cty9-v6aq"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-90451", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-90451"}, {"url": "https://raw.githubusercontent.com/cisagov/CSAF/develop/csaf_files/OT/white/2026/icsa-26-254-01.json", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-90451漏洞", "_translated": true, "_saved_at": "2026-09-12T07:34:53+00:00", "_first_saved_at": "2026-09-11T23:47:42+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-cty9-v6aq"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-90460", "cvss": {"cvssv4": [{"source": "cve@mitre.org", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:L/UI:N/VC:H/VI:H/VA:L/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.6}]}, "cvss_score": 7.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:L/UI:N/VC:H/VI:H/VA:L/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-863", "description": "在 29.0.3 之前的 OpenStack Keystone 中发现了一个问题。通过委托身份验证方法（EC2 凭证、应用程序凭证、OAuth1 访问令牌和信任）获取的令牌不会被阻止通过 /v3/credentials API 创建、修改或删除凭证。 EC2 派生的令牌还可以读取凭证 blob，从而暴露 TOTP MFA 种子和其他秘密。此外，PATCH /v3/credentials 不会验证请求的更新后 project_id，从而允许任何委托令牌将凭证移动到未经授权的项目。所有使用委托身份验证的 Keystone 部署都会受到影响。", "effects": [{"comp_name": "keystone", "ecosystem": "linux", "versions": [{"affected_version": "[13.0.0,27.0.3)", "min_fixed_version": "27.0.3", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[28.0.0,28.0.3)", "min_fixed_version": "28.0.3", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[29.0.0,29.0.3)", "min_fixed_version": "29.0.3", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-09-12", "level": "High", "mps_id": "MPS-8do2-7pj5", "poc": false, "poc_url": [], "published_time": "2026-09-12", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-8do2-7pj5", "name": "https://www.oscs1024.com/hd/MPS-8do2-7pj5"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-90460", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-90460"}, {"url": "https://launchpad.net/bugs/2159643", "name": ""}, {"url": "https://launchpad.net/bugs/2158931", "name": ""}, {"url": "https://review.opendev.org/1002330", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-90460漏洞", "_translated": true, "_saved_at": "2026-09-12T07:34:51+00:00", "_first_saved_at": "2026-09-11T23:47:37+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-8do2-7pj5"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2026-90474", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:R/S:U/C:H/I:H/A:N", "severity": "medium", "base_score": 6.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:P/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X" 区溢出、格式化字符串漏洞或其他内存错误导致的。", "title": "什么是越界读取"}, {"content": "攻击者可以通过不当构造的输入来触发跨界内存读漏洞。攻击者可能会通过向应用程序发送特定的输入，使其读取超过预期的内存区域。攻击者可以利用这个漏洞来获取敏感信息，如其他用户的数据、操作系统的敏感数据或应用程序的内部状态。", "title": "越界读取常见的攻击方式"}, {"content": "- 输入验证和限制：应用程序应对所有输入数据进行严格的验证和限制。确保输入数据的长度、格式和内容符合预期，避免超出缓冲区或访问非预期的内存区域。\n- 内存安全编程实践：开发人员应使用安全的编程实践，如避免使用不安全的函数、正确处理内存分配和释放操作，以及遵循最小特权原则。\n- 使用安全的编程语言和库：选择使用安全性较高的编程语言和库，这些语言和库在内存管理和安全性方面提供了更多的保护机制。\n- 定期进行代码审查和安全测试：定期审查应用程序的代码，并进行安全测试，以发现潜在的跨界内存读漏洞。使用静态代码分析工具和漏洞扫描工具来辅助检测和修复问题。\n- 实施防御性编程技术：应用程序应采用防御性编程技术，如使用随机化地址空间布局（ASLR）、堆栈保护机制（如堆栈溢出保护）和数据执行预防（DEP）等。\n- 及时更新和修补：及时应用程序和操作系统的安全更新和补丁，以确保已知的跨界内存读漏洞得到修复。及时更新相关软件和库，以避免使用已知存在漏洞的版本。", "title": "如何预防越界读取"}], "cnvd_id": "", "cve_id": "CVE-2026-90560", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:H", "severity": "high", "base_score": 8.2}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:L/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:L/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-125", "description": "zstd-jni 版本 1.2.0 到 1.5.7-13 在 ZstdDictDecompress 构造函数中包含越界读取漏洞，因为偏移量和长度参数从未针对字典数组边界进行验证。攻击者可以提供任意偏移量或长度值来读取超出所提供数组末尾的内存，从而可能导致 JVM 终止。", "effects": [{"comp_name": "zstd-jni", "ecosystem": "linux", "versions": [{"affected_version": "(1.2.0,1.5.7)", "min_fixed_version": "1.5.7", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界读取", "kind_en": "越界读取", "last_modified_time": "2026-09-13", "level": "High", "mps_id": "MPS-apio-98zj", "poc": fals 合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2025-43936", "cvss": {}, "cvss_score": 8.1, "cvss_vector": "", "cwe": "CWE-287", "description": "Dell ObjectScale 是戴尔面向企业的商业对象存储软件，用于提供可扩展对象存储与云原生存储服务，并非开源项目。\n受影响版本中，认证实现存在缺陷，未认证远程攻击者可在无需用户交互的条件下获得未授权访问，并同时影响机密性、完整性与可用性；厂商将其归类为 Improper Authentication，攻击复杂度为高。\n修复版本中通过官方安全更新收紧认证处理，阻断未认证远程访问路径；公开资料未披露具体源码修改，建议升级至 ObjectScale 4.4.0.0 及以上版本。", "effects": [{"comp_name": "objectscale", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,4.4.0.0)", "min_fixed_version": "4.4.0.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "身份验证不当", "kind_en": "认证不当", "last_modified_time": "2026-09-13", "level": "High", "mps_id": "MPS-9a6f-bd3f", "poc": false, "poc_url": [], "published_time": "2026-09-13", "reference_url_list": [{"url": "https://cybersecuritynews.com/dell-objectscale-vulnerabilities/", "name": ""}, {"url": "https://www.dell.com/support/kbdoc/en-us/000505935/dsa-2026-393-security-update-for-dell-objectscale-multiple-vulnerabilities", "name": ""}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2025-43936", "name": ""}, {"url": "https://dl.dell.com/content/manual40091046-dell-objectscale-4-4-0-0-security-configuration-guide.pdf", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "ObjectScale认证不当漏洞", "_translated": true, "_saved_at": "2026-09-13T17:50:34+00:00", "_first_saved_at": "2026-09-13T17:50:34+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-9a6f-bd3f"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-90651", "cvss": {"cvssv31": [{"source": "cve@mitre.org", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:C/C:L/I:H/A:L", "severity": "high", "base_score": 8.1}]}, "cvss_score": 8.1, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:C/C:L/I:H/A:L", "cwe": "CWE-295", "description": "2.0.0之前的注册表模式下的套接字防火墙（socketdev/socket-registry-firewall）默认不验证上游TLS证书。当socket.yml中省略了api_ssl_verify和upstream_ssl_verify配置键时，生成的配置设置SOCKET_API_SSL_VERIFY='false'和UPSTREAM_SSL_VERIFY='false'，并且用于出站请求的OpenResty/Lua HTTP客户端接受任何证书，包括自签名和其他不受信任的证书，而不验证链。拦截 Socket Firewall 和 Socket API 或上游包注册表之间流量的攻击者可以提供精心设计的证书并修改传输中的响应，包括替换恶意包内容或更改防火墙强制执行的允许/阻止决策。设置 api_ssl_verify: true 和upstream_ssl_verify: true 启用验证；但是，在1.1.334之前的版本中，生成的nginx配置不会发出lua_ssl_trusted_certificate，因此如果不手动修补生成的配置，则无法成功使用验证。版本 2.0.0 将这两个设置的默认值更改为 true。", "effects": [{"comp_name": "Socket Firewall", "ecosystem": "linux", "versions": [{"affected_version": "(0,2.0.0)", "min_fixed_version": "2.0.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "证书验证不恰当", "kind_en": "证书验证不当", "last_modified_time": "2026-09-13", "level": "High", "mps_id": "MPS-xoah-mlbe", "poc": false, "poc_url": [], "published_time": "2026-09-13", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-xoah-mlbe", "name": "https://www.oscs1024.com/hd/MPS-xoah-mlbe"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-90651", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-90651"}, {"url": "https://github.com/SocketDev/socket-registry-firewall/releases/tag/v2.0.0", "name": ""}, {"url": "https://docs.socket.dev/docs/registry-mode-configuration-reference", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-90651 漏洞", "_translated": true, "_saved_at": "2026-09-13T05:34:13+00:00", "_first_saved_at": "2026-09-13T00:32:30+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-xoah-mlbe"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-90678", "cvss": {"cvssv31": [{"source": "cve@mitre.org", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:C/C:N/I:H/A:L", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:C/C:N/I:H/A:L", "cwe": "CWE-130", "description": "在 HAProxy 3.3.0 到 3.4.4 以及 3.5-dev1 到 3.5-dev5 中发现了一个问题。利用该漏洞需要 HTTP/3 前端：HAProxy 必须使用 QUIC 支持构建并配置 QUIC 绑定侦听器，并且受影响的流量必须在重用连接上使用分块传输编码通过 HTTP/1.1 到达后端。在这些条件下，当 HTTP/3 请求不携带 Content-Length 标头时，HTTP/3 多路复用器会将 DATA 帧标头中声明的长度记入帧标头解码时、接收到有效负载之前的流端点的已知输入有效负载估计，并且该声明的长度将逐字发出作为 HTTP/1.1 块大小。远程未经身份验证的客户端声明的有效负载多于其传递的负载，然后结束流，导致 HAProxy 宣布一个大于其写入字节的块，并将连接返回到处于不同步状态的空闲池。结果是在重用的后端连接上潜在的 HTTP 请求走私：攻击者可以将请求放置在前端规则之外，例如基于路径的 http 请求拒绝，以便 HAProxy 的 HTTP 分析永远不会发现走私的请求，并且可能导致并发客户端的请求（包括其请求行和授权标头）被用作攻击者的请求正文并丢失。剥削不是确定性的；它取决于后端连接池的竞赛，在测试过程中大多数但不是全部试验都成功，并且可以自由重试。该机制在3.3-dev10中引入； 3.2.x 及更早版本不受影响。", "effects": [{"comp_name": "HAProxy", "ecosystem": "linux", "versions": [{"affected_version": "(3.4.0,3.4.4]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,3.5]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(3.3.0,3.3.14]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "长度参数不一致性处理不恰当", "kind_en": "长度参数不一致处理不当", "last_modified_time": "2026-09-13", "level": "High", "mps_id": "MPS-86qp-7i4b", "poc": false, "poc_url": [], "published_time": "2026-09-13", "reference_url_list": [{ vel": "High", "mps_id": "MPS-hj86-izu0", "poc": false, "poc_url": [], "published_time": "2026-09-13", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-hj86-izu0", "name": "https://www.oscs1024.com/hd/MPS-hj86-izu0"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-90616", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-90616"}, {"url": "https://github.com/flatpak/flatpak/security/advisories/GHSA-8688-9x26-hhxj", "name": ""}, {"url": "https://www.openwall.com/lists/oss-security/2026/08/11/9", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-90616 漏洞", "_translated": true, "_saved_at": "2026-09-13T00:32:36+00:00", "_first_saved_at": "2026-09-12T22:45:39+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-hj86-izu0"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-90648", "cvss": {"cvssv4": [{"source": "cve@mitre.org", "vector": "CVSS:4.0/AV:L/AC:L/AT:P/PR:N/UI:N/VC:N/VI:H/VA:H/SC:N/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:L/AC:L/AT:P/PR:N/UI:N/VC:N/VI:H/VA:H/SC:N/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-252", "description": "WebAssembly wabt 至 1.0.41 中的 wasm2c 允许在某些主要涉及 32 位平台的情况下进行沙箱逃逸，即“翻桌”攻击。它不会检查 wasm_rt_allocate_funcref_table() (wasm2c/wasm-rt-impl-tableops.inc) 中 calloc() 的返回值。当 funcref 表分配失败时，table-\u003edata 保留为 NULL，而 table-\u003esize 保留 guest 声明的元素计数；因此，边界检查仍然通过，并且表元素访问解析为绝对内存地址 (i * sizeof(wasm_rt_funcref_t))。这使得主机进程内存可以任意读写，并且通过 table.get、table.set 和 call_indirect 可以执行任意代码，从而破坏了 wasm2c 提供的隔离（完整的沙箱逃逸）。 wasm2c 被 RLBox 和 WasmBoxC 用作进程内沙箱边界，包括在 Firefox 中，它通过 wasm2c 编译 Graphite、Hunspell、Ogg、Expat 和 Woff2 库以包含不受信任的字体、媒体和 XML 输入。因此，这些应用程序中的沙箱可能会受到影响。利用该漏洞需要 funcref 表分配失败，例如在地址空间限制 (RLIMIT_AS) 下、在 32 位主机上、vm.overcommit_memory=2 或内存压力下。在默认过量使用的 64 位 Linux 上，分配成功并且不会触发缺陷。 wasm2c 内存分配器在同一运行时的 calloc 失败时中止；表分配器缺乏这种中止行为。这是在提交 ab9e0b55 (PR #813) 中引入的。", "effects": [{"comp_name": "wabt", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.0.41]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "未加检查的返回值", "kind_en": "Unchecked Return Value", "last_modified_time": "2026-09-13", "level": "High", "mps_id": "MPS-igw2-0oex", "poc": false, "poc_url": [], "published_time": "2026-09-13", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-igw2-0oex", "name": "https://www.oscs1024.com/hd/MPS-igw2-0oex"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-90648", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-90648"}, {"url": "https://github.com/trustsig-eu/wasm2c-tableflip", "name": ""}, {"url": "https://github.com/WebAssembly/wabt", "name": ""}, {"url": "https://bugzilla.mozilla.org/show_bug.cgi?id=1827704", "name": ""}, {"url": "https://https://blog.mozilla.org/attack-and-defense/2021/12/06/webassembly-and-back-again-fine-grained-sandboxing-in-firefox-95", "name": ""}, {"url": "https://rlbox.dev", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "CVE-2026-90648漏洞", "_translated": true, "_saved_at": "2026-09-13T00:32:33+00:00", "_first_saved_at": "2026-09-13T00:32:33+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-igw2-0oex"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-85129", "cvss": {"cvssv31": [{"source": "contact@wpscan.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "cwe": "CWE-79", "description": "Hoo Companion 是开源 WordPress 插件，用于为 HooThemes 主题提供 metabox 选项与演示站点导入能力。\n受影响版本中，HooSiter 将 AJAX 动作 hoo-sites-import-customizer-settings 同时注册到已登录与未登录接口，import_customizer_data 未做授权或 nonce 校验，直接把 $_POST['customizer_data'] 解码后交给 Hoo_Customizer_Import::_import_settings，以 update_option 覆盖当前主题设置。未授权攻击者可写入含脚本的主题配置，站点访客与管理员浏览页面时执行，同一请求还会销毁原有主题设置。\n修复版本中通过官方渠道尚未给出可用补丁。WPScan 标明无已知修复，WordPress.org 已关闭该插件目录条目，公开 1.0.2 源码仍将未校验的导入数据直接写入主题设置。", "effects": [{"comp_name": "hoo-companion", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.0.2]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-09-14", "level": "High", "mps_id": "MPS-dz4y-ukcw", "poc": false, "poc_url": [], "published_time": "2026-09-14", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-dz4y-ukcw", "name": "https://www.oscs1024.com/hd/MPS-dz4y-ukcw"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-85129", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-85129"}, {"url": "https://wpscan.com/vulnerability/a50f6ec1-4297-453e-b45f-6fd889b6b0d2/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Hoo Companion存储型XSS", "_translated": true, "_saved_at": "2026-09-13T22:46:35+00:00", "_first_saved_at": "2026-09-13T22:46:35+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-dz4y-ukcw"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过构造恶意的数据，将过多的数据输入到程序的缓冲区中，使得缓冲区的空间被填满，从而溢出到程序的栈 (stack) 或堆 (heap) 中，导致程序崩溃、拒绝服务、数据泄露等安全问题。\n", "title": "什么是经典缓冲区溢出"}, {"content": "| 类型        | 描述                                                         |\n| ----------- | ------------------------------------------------------------ |\n| 代码注入攻击      | 攻击者通过向程序的缓冲区输入恶意代码，从而控制程序执行流程，实现对程序操作的恶意操作。例如，攻击者可以通过向 Web 应用程序的输入框中输入恶意代码，从而执行任意的代码，破坏系统、窃取数据等。 |\n| 数据覆盖攻击      | 攻击者通过向程序的缓冲区输入过多的数据，从而覆盖程序中的重要数据或代码，实现对程序操作的恶意操作。例如，攻击者可以通过向聊天应用程序的输入框中输入过多的表情符号，从而覆盖程序中的重要数据，例如聊天消息、账号密码等。 |\n| 栈溢出攻击 | 攻击者通过向程序的栈中输入过多的数据，从而溢出到栈外部，实现对程序操作的恶意操作。例如，攻击者可以通过向游戏应用程序的输入框中输入过多的道具名称，从而覆盖程序中的重要数据，例如游戏数据、账号密码等。 |\n| 堆溢出攻击       | 攻击者通过向程序的堆中输入过多的数据，从而溢出到堆外部，实现对程序操作的恶意操作。例如，攻击者可以通过向操作系统工具的输入框中输入过多的命令，从而覆盖程序中的重要数据，例如系统文件、配置文件等。 |", "title": "经典缓冲区溢出常见的攻击方式"}, {"content": "- 输入验证：在程序输入处对输入数据进行严格的验证和过滤，确保输入数据符合预期的格式和类型，避免被攻击者注入恶意命令或数据。可以使用正则表达式、格式字符串等方式进行输入验证。\n- 输出过滤：在程序输出处对输出数据进行严格的过滤和检查，确保输出数据符合预期的格式和类型，避免被攻击者截获和篡改。可以使用安全的输出过滤库等方式进行输出过滤。\n- 使用安全的编程模型：使用安全的编程模型，例如避免使用原生的缓冲区管理函数，使用安全的框架和库来处理输入数据和执行命令，避免缓冲区溢出漏洞。\n- 数据库加密和访问控制：对于敏感数据和命令，使用加密和访问控制措施，确保只有授权用户可以访问和执行命令，避免被攻击者窃取和篡改。\n- 定期更新和升级：定期更新和升级应用程序和库的版本，确保应用程序和库的最新版本包含了最新的安全补丁和修复措施，避免安全漏洞的出现和利用。\n- 安全审计和监控：定期对系统和应用程序进行安全审计和监控，及时发现和阻止潜在的安全漏洞和攻击，确保系统和数据的安全和可靠性。", "title": "如何预防经典缓冲区溢出"}], "cnvd_id": "", "cve_id": "CVE-2026-90605", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:N/AC:L/Au:S/C:C/I:C/A:C", "severity": "high", "base_score": 9}], "cvssv3": [{"source": "VulDB", "vector": "CVSS:3.0/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H/E:P/RL:X/RC:R", "severity": "critical", "base_score": 9.9}], "cvssv31": [{"source": "cna@vuldb.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.9}], "cvssv4": [{"source": "cna@vuldb.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-120", "description": "TOTOLINK A3002MU 是闭源家用千兆无线路由器，内置 boa Web 管理组件，用于设备配置、过滤规则与远程管理。\n受影响版本中，boa 对外接口 /boafrm/formFilter 的 formFilter 函数在读取 HTTP 参数 ip6addr 后，使用 strcpy 将其写入固定大小缓冲区，且未做可靠长度限制。已认证攻击者可远程提交超长 ip6addr，覆盖相邻内存并使 boa 进程崩溃，造成管理面拒绝服务。\n修复版本中通过为 formFilter 处理 ip6addr 增加长度边界并避免不安全字符串拷贝切断溢出路径；公开来源尚未确认官方修复固件，建议限制 Web 管理接口仅对可信网络开放，并关注厂商后续更新。", "effects": [{"comp_name": "A3002MU", "ecosystem": "linux", "versions": [{"affected_version": "[Hh-B20211125.1046,Hh-B20211125.1046]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "经典缓冲区溢出", "kind_en": "不检查输入大小的缓冲区复制（“经典缓冲区溢出” 作的恶意操作。例如，攻击者可以通过向操作系统工具的输入框中输入过多的命令，从而覆盖程序中的重要数据，例如系统文件、配置文件等。 |", "title": "经典缓冲区溢出常见的攻击方式"}, {"content": "- 输入验证：在程序输入处对输入数据进行严格的验证和过滤，确保输入数据符合预期的格式和类型，避免被攻击者注入恶意命令或数据。可以使用正则表达式、格式字符串等方式进行输入验证。\n- 输出过滤：在程序输出处对输出数据进行严格的过滤和检查，确保输出数据符合预期的格式和类型，避免被攻击者截获和篡改。可以使用安全的输出过滤库等方式进行输出过滤。\n- 使用安全的编程模型：使用安全的编程模型，例如避免使用原生的缓冲区管理函数，使用安全的框架和库来处理输入数据和执行命令，避免缓冲区溢出漏洞。\n- 数据库加密和访问控制：对于敏感数据和命令，使用加密和访问控制措施，确保只有授权用户可以访问和执行命令，避免被攻击者窃取和篡改。\n- 定期更新和升级：定期更新和升级应用程序和库的版本，确保应用程序和库的最新版本包含了最新的安全补丁和修复措施，避免安全漏洞的出现和利用。\n- 安全审计和监控：定期对系统和应用程序进行安全审计和监控，及时发现和阻止潜在的安全漏洞和攻击，确保系统和数据的安全和可靠性。", "title": "如何预防经典缓冲区溢出"}], "cnvd_id": "", "cve_id": "CVE-2026-90606", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:N/AC:L/Au:S/C:C/I:C/A:C", "severity": "high", "base_score": 9}], "cvssv3": [{"source": "VulDB", "vector": "CVSS:3.0/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H/E:P/RL:X/RC:R", "severity": "critical", "base_score": 9.9}], "cvssv31": [{"source": "cna@vuldb.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.9}], "cvssv4": [{"source": "cna@vuldb.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-120", "description": "TOTOLINK A3002MU 是 TOTOLINK 出品的闭源 AC1200 千兆无线路由器，内置 boa Web 管理服务，用于家庭和小型网络的无线接入及 IPv6 配置。\n受影响版本中，boa 组件对外接口 formIpv6Setup 在处理 HTTP 参数 static_ipv6 时未校验输入长度，并将该值以不安全字符串拷贝写入固定长度缓冲区。远程攻击者在持有管理会话后向 /boafrm/formIpv6Setup 提交超长 static_ipv6，可覆盖相邻内存并使 boa 进程崩溃，公开验证已证实可造成管理服务拒绝服务。\n修复版本中通过官方固件补丁阻断 formIpv6Setup 对超长 static_ipv6 的溢出路径。截至 2026-09-14，CVE.org 与厂商公开渠道均未给出明确修复版本或已验证提交，建议限制管理接口暴露并关注后续安全固件。", "effects": [{"comp_name": "a3002mu", "ecosystem": "linux", "versions": [{"affected_version": "[[Hh-B20211125.1046],+∞)", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "经典缓冲区溢出", "kind_en": "不检查输入大小的缓冲区复制（“经典缓冲区溢出”）", "last_modified_time": "2026-09-14", "level": "High", "mps_id": "MPS-tsod-2m53", "poc": false, "poc_url": [], "published_time": "2026-09-14", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-tsod-2m53", "name": "https://www.oscs1024.com/hd/MPS-tsod-2m53"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-90606", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-90606"}, {"url": "https://vuldb.com/vuln/403188", "name": "VDB-403188 | Totolink A3002MU boa formIpv6Setup buffer overflow"}, {"url": "https://vuldb.com/vuln/403188/cti", "name": "VDB-403188 | CTI Indicators (IOB, IOC, IOA)"}, {"url": "https://vuldb.com/cve/CVE-2026-90606", "name": "CVE-2026-90606 | CVE Analysis and Report"}, {"url": "https://vuldb.com/submit/914010", "name": "Submit #914010 | totolink A3002MU Hh-B20211125.1046 Buffer Overflow"}, {"url": "https://github.com/SunnyYANGyaya/cuicuishark-sheep-fishIOT/blob/main/ToTolink/A3002MU/bof-formIpv6Setup.md", "name": ""}, {"url": "https://www.totolink.net/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "A3002MU缓冲区溢出", "_translated": true, "_saved_at": "2026-09-14T00:35:47+00:00", "_first_saved_at": "2026-09-14T00:35:47+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-tsod-2m53"}]}</script>
  <script>
    const payload = JSON.parse(document.getElementById("payload").textContent);
    const levelLabels = payload.level_labels || {};
    const items = payload.items || [];
    let filtered = items.slice();
    let activeId = null;

    const $ = (id) => document.getElementById(id);
    $("generatedAt").textContent = payload.generated_at || "-";
    $("retention").textContent = payload.retention_days ?? "-";
    $("cutoff").textContent = payload.cutoff_date || "-";
    $("count").textContent = String(payload.count ?? items.length);

    function levelClass(level) {
      const cn = levelLabels[level] || level || "";
      if (level === "Critical" || cn === "严重") return "crit";
      if (level === "High" || cn === "高危") return "high";
      return "other";
    }
    function levelText(level) {
      return levelLabels[level] || level || "-";
    }
    function esc(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }
    function scoreText(v) {
      if (v === null || v === undefined || v === "" || v === -1) return "-";
      return String(v);
    }

    function renderList() {
      const list = $("list");
      $("listCount").textContent = String(filtered.length);
      if (!filtered.length) {
        list.innerHTML = '<div class="empty">没有匹配项</div>';
        return;
      }
      list.innerHTML = filtered.map((it) => {
        const id = it.mps_id || it.cve_id;
        const active = id === activeId ? " active" : "";
        return `
          <button class="item${active}" data-id="${esc(id)}" type="button">
            <div class="item-top">
              <span class="cve">${esc(it.cve_id || it.mps_id || "-")}</span>
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
            </div>
            <div class="title">${esc(it.title || "-")}</div>
            <div class="item-foot">
              <span>CVSS ${esc(scoreText(it.cvss_score))}</span>
              <span>${esc(it.published_time || "-")}</span>
              ${it.poc ? "<span>POC</span>" : ""}
            </div>
          </button>`;
      }).join("");
      list.querySelectorAll(".item").forEach((btn) => {
        btn.addEventListener("click", () => selectById(btn.dataset.id));
      });
    }

    function refsHtml(it) {
      const refs = Array.isArray(it.reference_url_list) ? it.reference_url_list : [];
      const links = [];
      if (it._source_page) links.push({ url: it._source_page, name: "OSCS 详情" });
      if (it.cve_id) links.push({ url: `https://nvd.nist.gov/vuln/detail/${it.cve_id}`, name: "NVD" });
      refs.forEach((r) => {
        if (r && r.url) links.push({ url: r.url, name: r.name || r.url });
      });
      const seen = new Set();
      const uniq = [];
      for (const l of links) {
        if (seen.has(l.url)) continue;
        seen.add(l.url);
        uniq.push(l);
      }
      if (!uniq.length) return '<div class="box">无参考链接</div>';
      return `<div class="refs">${uniq.map((l) =>
        `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name || l.url)}</a>`
      ).join("")}</div>`;
    }

    function articlesHtml(it) {
      const arts = Array.isArray(it.articles) ? it.articles : [];
      if (!arts.length) return "";
      return `<div class="section"><h3>相关说明</h3>${arts.map((a) => `
        <div class="article">
          <h4>${esc(a.title || "说明")}</h4>
          <p>${esc(a.content || "")}</p>
        </div>`).join("")}</div>`;
    }

    function renderDetail(it) {
      const detail = $("detail");
      if (!it) {
        detail.innerHTML = '<div class="empty">暂无数据</div>';
        return;
      }
      const pocUrls = Array.isArray(it.poc_url) ? it.poc_url : [];
      detail.innerHTML = `
        <div class="d-head">
          <div>
            <h1 class="d-title">${esc(it.title || "-")}</h1>
            <div class="ids">
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
              <span class="chip">${esc(it.cve_id || "无 CVE")}</span>
              <span class="chip">${esc(it.mps_id || "-")}</span>
              ${it.poc ? '<span class="chip">有 POC</span>' : ""}
              ${it.exp ? '<span class="chip">有 EXP</span>' : ""}
            </div>
          </div>
          <div class="actions">
            ${it._source_page ? `<a class="btn" href="${esc(it._source_page)}" target="_blank" rel="noopener">OSCS</a>` : ""}
            ${it.cve_id ? `<a class="btn" href="https://nvd.nist.gov/vuln/detail/${esc(it.cve_id)}" target="_blank" rel="noopener">NVD</a>` : ""}
          </div>
        </div>
        <div class="grid">
          <div class="stat"><div class="k">CVSS</div><div class="v">${esc(scoreText(it.cvss_score))}</div></div>
          <div class="stat"><div class="k">向量</div><div class="v">${esc(it.cvss_vector || "-")}</div></div>
          <div class="stat"><div class="k">CWE</div><div class="v">${esc(it.cwe || "-")}</div></div>
          <div class="stat"><div class="k">类型</div><div class="v">${esc(it.kind || it.kind_en || "-")}</div></div>
          <div class="stat"><div class="k">公开</div><div class="v">${esc(it.published_time || "-")}</div></div>
          <div class="stat"><div class="k">利用成本</div><div class="v">${esc(it.exploit_requirement_cost || "-")}</div></div>
          <div class="stat"><div class="k">可利用性</div><div class="v">${esc(it.exploitability || "-")}</div></div>
          <div class="stat"><div class="k">修复建议</div><div class="v">${esc(it.fix_suggestion || "-")}</div></div>
        </div>
        <div class="section"><h3>描述</h3><div class="box">${esc(it.description || "无描述")}</div></div>
        ${it.scope_influence ? `<div class="section"><h3>影响范围</h3><div class="box">${esc(it.scope_influence)}</div></div>` : ""}
        ${pocUrls.length ? `<div class="section"><h3>POC 链接</h3><div class="refs">${pocUrls.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join("")}</div></div>` : ""}
        <div class="section"><h3>参考链接</h3>${refsHtml(it)}</div>
        ${articlesHtml(it)}
      `;
    }

    function selectById(id) {
      const it = filtered.find((x) => (x.mps_id || x.cve_id) === id) ||
                 items.find((x) => (x.mps_id || x.cve_id) === id);
      if (!it) return;
      activeId = it.mps_id || it.cve_id;
      renderList();
      renderDetail(it);
      const btn = document.querySelector(`.item[data-id="${CSS.escape(activeId)}"]`);
      if (btn) btn.scrollIntoView({ block: "nearest" });
      history.replaceState(null, "", "#" + encodeURIComponent(activeId));
    }

    function applyFilter(q) {
      const query = (q || "").trim().toLowerCase();
      filtered = !query ? items.slice() : items.filter((it) => {
        const blob = [
          it.cve_id, it.mps_id, it.title, it.kind, it.kind_en, it.cwe, it.description, it.level
        ].map((x) => String(x || "").toLowerCase()).join(" ");
        return blob.includes(query);
      });
      renderList();
      if (filtered.length) {
        const still = filtered.some((x) => (x.mps_id || x.cve_id) === activeId);
        selectById(still ? activeId : (filtered[0].mps_id || filtered[0].cve_id));
      } else {
        activeId = null;
        renderDetail(null);
      }
    }

    $("search").addEventListener("input", (e) => applyFilter(e.target.value));

    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement !== $("search")) {
        e.preventDefault();
        $("search").focus();
        return;
      }
      if (!filtered.length) return;
      const idx = filtered.findIndex((x) => (x.mps_id || x.cve_id) === activeId);
      if (e.key === "ArrowDown") {
        e.preventDefault();
        const next = filtered[Math.min(filtered.length - 1, Math.max(0, idx) + 1)];
        selectById(next.mps_id || next.cve_id);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        const prev = filtered[Math.max(0, idx - 1)];
        selectById(prev.mps_id || prev.cve_id);
      }
    });

    const hashId = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    if (hashId && items.some((x) => (x.mps_id || x.cve_id) === hashId)) {
      activeId = hashId;
      renderList();
      selectById(hashId);
    } else if (items.length) {
      selectById(items[0].mps_id || items[0].cve_id);
    } else {
      renderList();
      renderDetail(null);
    }
  </script>
</body>
</html>
