的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-82684", "cvss": {"cvssv31": [{"source": "ics-cert@hq.dhs.gov", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N", "severity": "high", "base_score": 8.1}], "cvssv4": [{"source": "ics-cert@hq.dhs.gov", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-862", "description": "Tycon Systems TPDIN-Monitor-WEB3 版本 2.2.9 及更早版本容易受到缺少授权漏洞的影响。这可能允许攻击者提取系统凭据、配置或闪存内容。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-09-05", "level": "High", "mps_id": "MPS-iv6y-fa48", "poc": false, "poc_url": [], "published_time": "2026-09-05", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-iv6y-fa48", "name": "https://www.oscs1024.com/hd/MPS-iv6y-fa48"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-82684", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-82684"}, {"url": "https://firm.tyconsystems.com/tpdin-monitor-web3-v2/TPDIN-MONITOR-WEB3-V2_v2.4.2.tfw", "name": ""}, {"url": "https://firm.tyconsystems.com/tpdin-monitor-web3-v2/TPDIN-MONITOR-WEB3-V2_v2.4.2T.hex", "name": ""}, {"url": "https://github.com/cisagov/CSAF/blob/develop/csaf_files/OT/white/2026/icsa-26-246-08.json", "name": ""}, {"url": "https://www.cisa.gov/news-events/ics-advisories/icsa-26-246-08", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-82684漏洞", "_translated": true, "_saved_at": "2026-09-05T00:33:23+00:00", "_first_saved_at": "2026-09-05T00:33:23+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-iv6y-fa48"}, {"analysis_status": 0, "articles": [{"content": "跨站点请求伪造 (CSRF)通过利用网站对用户请求的信任进行攻击。当用户在网站A登录并在同一浏览器会话中访问网站B时，攻击者可以构造特制的请求并诱使用户执行，以使网站B误以为这些请求是用户合法发起的。\n攻击者通常通过欺骗用户点击恶意链接、在受信任的网站中植入恶意代码或通过钓鱼等手段来实施CSRF攻击，一旦用户执行了恶意请求，攻击者可以以用户的身份执行任意操作，包括更改用户密码、发起资金转账或删除重要数据等。", "title": "什么是CSRF"}, {"content": "- 链接欺骗：攻击者通过向用户发送包含恶意链接的电子邮件或社交媒体消息，诱使用户点击并执行恶意请求。\n- 图片引用攻击：攻击者通过在恶意网站上包含指向目标网站的图片引用，以触发用户浏览器自动发送目标网站的请求。\n- XSS利用：如果目标网站存在XSS漏洞，攻击者可以注入恶意脚本，以使用户在浏览器中执行恶意请求。", "title": "CSRF常见的攻击方式"}, {"content": "- 随机令牌：网站可以在每个请求中包含一个随机生成的令牌（CSRF Token），并验证该令牌的有效性，以确认请求的来源是合法的。\n- SameSite Cookie：使用SameSite属性来限制跨站点请求，将Cookie的发送限制在同一站点上，减少了跨站请求伪造的风险。\n- 双重验证：对于敏感操作，网站可以要求用户进行额外的验证，例如输入验证码、提供第二个因素的身份验证等。\n- 强化浏览器策略：网站可以设置Content-Security-Policy（CSP）头，限制浏览器执行恶意脚本的能力，减少CSRF攻击的风险。\n- 限制用户操作：网站可以要求用户在执行敏感操作之前进行明确的确认或授权，防止恶意请求被误触发。\n- 安全编码实践：开发人员应遵循安全编码实践，对用户输入进行适当的验证和过滤，防止恶意请求的注入。", "title": "如何预防CSRF"}], "cnvd_id": "", "cve_id": "CVE-2026-82712", "cvss": {"cvssv31": [{"source": "ics-cert@hq.dhs.gov", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}], "cvssv4": [{"source": "ics-cert@hq.dhs.gov", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:A/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:A/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-352", "description": "Tycon Systems TPDIN-Monitor-WEB3 版本 2.2.9 及更早版本容易受到跨站点请求伪造漏洞的影响。这可能允许攻击者在设备上执行状态更改操作。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit A-vw42-752g-5mrp）在 HttpSignatureService.php 新增私有方法 validateKeyIdUrl()，强制 keyId URL 必须为 https 协议、把主机解析得到的所有 IPv4（gethostbyname）与 IPv6（dns_get_record DNS_AAAA）地址均使用 FILTER_FLAG_NO_PRIV_RANGE|FILTER_FLAG_NO_RES_RANGE 校验拒绝 127.x、10.x、172.16/12、192.168.x、169.254.x、0.x、240.x、::1、fc00::/7，并单独补检 IPv6 fe80::/10 链路本地地址，随后在 verifySignature() 发起 httpClient-\u003erequest('GET', $keyId) 之前调用该新方法，由此切断任意出站目标到达出站 HTTP 请求的全部路径，公网以外的恶意 keyId 将被拒绝而不再触发服务端请求。", "effects": [{"comp_name": "yeswiki/yeswiki", "ecosystem": "composer", "versions": [{"affected_version": "[4.6.2,4.6.6)", "min_fixed_version": "4.6.6", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SSRF", "kind_en": "服务器端请求伪造 (SSRF)", "last_modified_time": "2026-07-12", "level": "High", "mps_id": "MPS-imdu-vtlo", "poc": false, "poc_url": [], "published_time": "2026-09-05", "reference_url_list": [{"url": "https://github.com/YesWiki/yeswiki/security/advisories/GHSA-vw42-752g-5mrp", "name": ""}, {"url": "http://github.com/YesWiki/yeswiki/commit/87e627f33e79879827a3669fee2aa1244612c487", "name": ""}, {"url": "https://github.com/advisories/GHSA-vw42-752g-5mrp", "name": ""}], "scope_influence": "", "tags": ["php", "开源"], "title": "YesWiki 未经身份验证 SSRF 漏洞", "_translated": true, "_saved_at": "2026-09-05T05:10:36+00:00", "_first_saved_at": "2026-09-05T05:10:36+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-imdu-vtlo"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-52767", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:H/A:L", "severity": "high", "base_score": 8.2}]}, "cvss_score": 8.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:H/A:L", "cwe": "CWE-347", "description": "YesWiki 是开源 PHP Wiki 引擎，其 Bazar 模块通过 ActivityPub 协议处理跨实例联邦内容；入站收件箱控制器调用 HttpSignatureService::verifySignature 校验请求签名时，以 `!openssl_verify(...)` 的布尔取反判定签名成败，但 `openssl_verify` 在内部错误时返回 `-1`（PHP 真值规则下为真），导致校验失败抛错被跳过，攻击者可在未认证情况下向启用 ActivityPub 的 Bazar 表单投递 Create/Update/Delete 活动，触发对 EntryManager::create/update/delete 的未授权调用。\n受影响版本中，`tools/bazar/services/HttpSignatureService.php` 中 `HttpSignatureService::verifySignature(Request $request)` 方法（v4.6.5 = origin/doryphore-dev HEAD）使用 `if (!openssl_verify(join(\"\\n\", $sigParts), base64_decode($sigConf['signature']), $actorPublicKey, strtoupper($sigConf['algorithm'])))` 判定签名；攻击者将 `keyId` 指向自建 actor URL、actor 文档返回 DSA 公钥、签名头中 `algorithm` 设为 `RSA-SHA256`，PHP 8.3 + OpenSSL 3.x 下 `openssl_verify` 因算法与公钥类型不匹配返回 `-1`，`!(-1)` 为 `false`，`throw new Exception('Signature verification failed')` 被跳过，控制器随后进入 `processActivity()` 并依次调用 `EntryManager::create()`、`EntryManager::update()`、`EntryManager::delete()` 对 `yeswiki_pages` 与 `yeswiki_triples` 表进行未授权 CRUD；composer 包 `yeswiki/yeswiki` 受影响版本区间为 `[4.6.2, 4.6.6)`。\n修复版本中通过提交 d1795e0301e1a1078f17b4b98f56fff70de2029e（已合入 v4.6.6）将 `if (!openssl_verify(...))` 改为 `if (openssl_verify(...) !== 1)`，仅在返回码严格等于成功值 `1` 时放行，从而同时拒绝签名无效（`0`）、内部错误（`-1`）与入参错误（`false`），切断攻击者通过伪造 actor 公钥与算法名触发 `-1` 的旁路逻辑。", "effects": [{"comp_name": "yeswiki/yeswiki", "ecosystem": "composer", "versions": [{"affected_version": "[4.6.2,4.6.6)", "min_fixed_version": "4.6.6", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "密码学签名的验证不恰当", "kind_en": "密码签名验证不当", "last_modified_time": "2026-07-12", "level": "High", "mps_id": "MPS-el47-sk58", "poc": false, "poc_url": [], "published_time": "2026-09-05", "reference_url_list": [{"url": "https://github.com/YesWiki/yeswiki/security/advisories/GHSA-mv28-wj57-f57g", "name": ""}, {"url": "https://github.com/YesWiki/yeswiki/commit/d1795e0301e1a1078f17b4b98f56fff70de2029e", "name": ""}, {"url": "https://github.com/advisories/GHSA-mv28-wj57-f57g", "name": ""}], "scope_influence": "", "tags": ["php", "开源"], "title": "YesWiki ActivityPub 签名验证绕过漏洞", "_translated": true, "_saved_at": "2026-09-05T05:10:32+00:00", "_first_saved_at": "2026-09-05T05:10:32+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-el47-sk58"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2026-18221", "cvss": {"cvssv31": [{"source": "psirt@us.ibm.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.1}]}, "cvss_score": 8.1, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-287", "description": "由于对客户端提供的身份验证参数的验证不正确，IBM i 7.6、7.5、7.4 和 7.3 可能允许远程攻击者获得未经授权的访问。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "身份验证不当", "kind_en": "认证不当", "last_modified_time": "2026-09-05", "level": "High", "mps_id": "MPS-yrxi-4ndb", "poc": false, "poc_url": [], "published_time": "2026-09-05", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-yrxi-4ndb", "name": "https://www.oscs1024.com/hd/MPS-yrxi-4ndb"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-18221", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-18221"}, {"url": "https://www.ibm.com/support/pages/node/7286186", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-18221漏洞", "_translated": true, "_saved_at": "2026-09-04T17:59:05+00:00", "_first_saved_at": "2026-09-04T17:59:05+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-yrxi-4ndb"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-52770", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "cwe": "CWE-89", "description": "YesWiki 是一款基于 PHP 编写的开源协作维基系统，其内置 Bazar 模块对外提供的条目列表 API 在处理数值型字段过滤条件时仅对用户输入执行 mysqli_real_escape_string 转义却未加引号或进行数值合法性校验，导致未认证远程攻击者可在 query / queries GET 参数中注入布尔 SQL 子查询，并依据返回条目数差异推断数据库内容。\n受影响版本中，yeswiki/yeswiki 组件在低于 4.6.6 的版本内，SearchManager::buildQueriesConditions() 方法在字段 _type_ 等于 number 时将经 mysqli_real_escape_string 转义但未加引号、未做数值校验的 $vValue 裸值拼接到 'CAST(... AS DOUBLE) ' . $vComparisonOperator . ' ' . $vValue 的 SQL 片段中，攻击者通过 ACL=public 的 /api/forms/{formId}/entries/{output}/{selectedEntries}、/api/entries/{output}/{selectedEntries} 和 /api/entries/bazarlist 路由在 query / queries GET 参数传入例如 100 OR (SELECT COUNT(*) FROM yeswiki_users)\u003e0 的载荷，在 WHERE 子句中嵌入任意只读布尔 SQL 表达式，利用返回条目数差异构成 boolean oracle 来推断 yeswiki_* 表中账号、密码哈希、密码恢复素材及维基元数据等敏感内容。\n修复版本中通过在 tools/bazar/services/SearchManager.php 的 SearchManager::buildQueriesConditions() 方法生成数值 WHERE 子句前对 trim($vValue) 增加 is_numeric 与 is_finite 双重校验，对非法数值用常量 FALSE 替代、对合法数值以 (float) trim($vValue) 强制转换后再拼接到 CAST 表达式右侧，从而切断 WHERE 子句中任意 SQL 表达式的写入路径；该修复在 yeswiki/yeswiki 4.6.6 版本中以 commit f3b0dd093a7ace47dc29a515faeb02635baceae2（commit message：fix(bazar): GHSA-qg78-vmvc-fhjw）落地。", "effects": [{"comp_name": "yeswiki/yeswiki", "ecosystem": "composer", "versions": [{"affected_version": "(-∞,4.6.6)", "min_fixed_version": "4.6.6", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-07-12", "level": "High", "mps_id": "MPS-hyvj-fpto", "poc": false, "poc_url": [], "published_time": "2026-09-05", "reference_url_list": [{"url": "https://github.com/YesWiki/yeswiki/security/advisories/GHSA-qg78-vmvc-fhjw", "name": ""}, {"url": "https://github.com/YesWiki/yeswiki/commit/f3b0dd093a7ace47dc29a515faeb02635baceae2", "name": ""}, {"url": "https://github.com/advisories/GHSA-qg78-vmvc-fhjw", "name": ""}], "scope_influence": "", "tags": ["php", "开源"], "title": "YesWiki 公共 Bazar 列表 API 数值过滤器 SQL 注入漏洞", "_translated": true, "_saved_at": "2026-09-05T05:10:35+00:00", "_first_saved_at": "2026-09-05T05:10:35+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-hyvj-fpto"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-84961", "cvss": {"cvssv31": [{"source": "ce714d77-add3-4f53-aff5-83d477b104bb", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:N", "severity": "high", "base_score": 7.4}]}, "cvss_score": 7.4, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:N", "cwe": "CWE-295", "description": "undici 的 BalancedPool 构造函数通过内部深度克隆传递其整个选项对象，该深度克隆将值序列化并重新解析为 JSON。由于 JSON 无法表示函数，因此任何函数值 TLS 选项（例如调用者提供的 checkServerIdentity 回调或 connect 选项内的自定义连接器）在到达 TLS 层之前都会被悄悄丢弃。因此，当通过 BalancedPool 到达时，应用程序的自定义 checkServerIdentity 的证书被写入拒绝，但仍通过节点的默认主机名和链检查的对等点将被接受。客户端、池和代理调度程序不受影响，因为它们在克隆之前提取 connect 和 tls 选项。这会影响从 7.24.1 到 7.29.1 以及从 8.0.0 到 8.10.2 的 undici 版本，并且仅当应用程序向 BalancedPool 提供函数值连接或 tls 选项时。用户应升级到 undici 7.29.1 或 8.10.2。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "证书验证不恰当", "kind_en": "证书验证不当", "last_modified_time": "2026-09-05", "level": "High", "mps_id": "MPS-68mf-jrhg", "poc": false, "poc_url": [], "published_time": "2026-09-05", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-68mf-jrhg", "name": "https://www.oscs1024.com/hd/MPS-68mf-jrhg"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-84961", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-84961"}, {"url": "https://cna.openjsf.org/security-advisories.html", "name": ""}, {"url": "https://github.com/nodejs/undici/security/advisories/GHSA-w293-vg96-wgc3", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-84961漏洞", "_translated": true, "_saved_at": "2026-09-04T17:59:01+00:00", "_first_saved_at": "2026-09-04T17:59:01+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-68mf-jrhg"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-85152", "cvss": {"cvssv31": [{"source": "ce714d77-add3-4f53-aff5-83d477b104bb", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:N", "severity": "high", "base_score": 7.4}]}, "cvss_score": 7.4, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:N", "cwe": "CWE-346", "description": "当缓存或重复数据删除拦截器直接组合到客户端或池上时，undici 8.10.0 会忽略缓存和请求重复数据删除键中的目标来源。由于内部缓存键回退到空源字符串，因此每当方法、路径和相关标头匹配时，都会返回来自一个上游源的可缓存或正在进行的响应，以针对对不同受信任源的请求，这允许跨源信息泄露和持久缓存中毒。记者演示了一种完整的身份验证绕过方法，其中使用攻击者控制的密钥签名的 JWT 被接受为属于受信任的发行者，并且从未联系过受信任的来源。这是 8.10.0 中引入的回归，影响 8.10.0 到 8.10.2 的 undici 版本。使用代理（在其调度选项中携带源）的应用程序不受影响。用户应升级到undici 8.10.2。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "源验证错误", "kind_en": "来源验证错误", "last_modified_time": "2026-09-05", "level": "High", "mps_id": "MPS-srm3-qwly", "poc": false, "poc_url": [], "published_time": "2026-09-05", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-srm3-qwly", "name": "https://www.oscs1024.com/hd/MPS-srm3-qwly"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-85152", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-85152"}, {"url": "https://cna.openjsf.org/security-advisories.html", "name": ""}, {"url": "https://github.com/nodejs/undici/security/advisories/GHSA-vp8m-p9jh-q5pm", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-85152漏洞", "_translated": true, "_saved_at": "2026-09-04T17:58:59+00:00", "_first_saved_at": "2026-09-04T17:58:59+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-srm3-qwly"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-83625", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "cwe": "CWE-79", "description": "由于输入清理和输出转义不足，适用于 WordPress 的 Supsystic 插件的联系表单在 1.10.2 及之前的所有版本中都容易受到通过 IP 地址标头的存储跨站点脚本攻击。这使得未经身份验证的攻击者可以在页面中注入任意 Web 脚本，每当用户访问注入的页面时就会执行这些脚本。未经身份验证的攻击者可以首先调用“updateNonce”操作（由于该操作不存在于插件的权限列表中，无需身份验证即可访问）来获取有效的随机数，然后在欺骗性 IP 标头（例如 X-Forwarded-For）中提交包含恶意负载的联系表单。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-09-05", "level": "High", "mps_id": "MPS-g8m2-7n3t", "poc": false, "poc_url": [], "published_time": "2026-09-05", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-g8m2-7n3t", "name": "https://www.oscs1024.com/hd/MPS-g8m2-7n3t"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-83625", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-83625"}, { PS-1qrk-5vu3"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用了空指针，并在不进行有效检查的情况下对其进行取消引用操作。当程序试图取消引用空指针时，由于空指针不指向任何有效的内存地址，会导致程序崩溃或产生未定义的行为。这种错误通常发生在开发者未对指针进行正确的初始化或验证时。", "title": "什么是空指针取消引用"}, {"content": "- 拒绝服务：攻击者可以通过构造恶意输入或请求，触发程序中的空指针取消引用错误，导致程序崩溃或无法正常运行。这可能导致拒绝服务攻击，使系统无法提供正常的服务。\r\n- 内存信息泄露：攻击者可以通过利用空指针取消引用错误，访问程序中的敏感内存信息。这可能包括栈上的变量、函数指针或其他敏感数据，从而暴露系统的机密信息。\r\n- 代码执行：在某些情况下，空指针取消引用错误可能导致执行恶意代码或注入恶意代码的机会。攻击者可以通过精心构造的输入，利用空指针取消引用错误来执行任意的代码，进而获取系统控制权或执行未经授权的操作。", "title": "空指针取消引用常见的攻击方式"}, {"content": "- 指针初始化和验证：开发者应该正确地初始化指针，并在使用指针之前进行有效的验证，确保指针不为空。在取消引用指针之前，应始终检查其是否为空。\r\n- 异常处理和错误恢复：程序应该具备健壮的异常处理和错误恢复机制，以便在发生空指针取消引用错误时能够适当地处理异常，而不是导致程序崩溃或暴露敏感信息。\r\n- 防御性编程：采用防御性编程的原则，如避免在未经验证的指针上进行操作，避免使用未初始化的指针等，以防止空指针取消引用错误的发生。\r\n- 静态代码分析和测试：使用静态代码分析工具和测试技术来检测和识别潜在的空指针取消引用错误。这些工具可以帮助发现代码中可能存在的空指针问题，并及时修复。\r\n- 强制性编码标准和最佳实践：制定强制性的编码标准和最佳实践，包括良好的指针使用和管理规范，以帮助开发者编写更可靠、安全的代码。", "title": "如何预防空指针取消引用"}], "cnvd_id": "", "cve_id": "CVE-2026-86097", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "medium", "base_score": 6.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:A/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:A/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-476", "description": "PX4 Autopilot 至 1.17.0 版本在 param_set_default_file() 和 param_set_backup_file() 函数中包含空指针取消引用漏洞，允许攻击者使 Autopilot 进程崩溃。攻击者可以从任何 PX4 shell 调用不带路径参数的“param select”或“param select-backup”命令来触发崩溃。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "空指 | ----------- | ------------------------------------------------------------ |\n| 代码注入攻击      | 攻击者通过向程序的缓冲区输入恶意代码，从而控制程序执行流程，实现对程序操作的恶意操作。例如，攻击者可以通过向 Web 应用程序的输入框中输入恶意代码，从而执行任意的代码，破坏系统、窃取数据等。 |\n| 数据覆盖攻击      | 攻击者通过向程序的缓冲区输入过多的数据，从而覆盖程序中的重要数据或代码，实现对程序操作的恶意操作。例如，攻击者可以通过向聊天应用程序的输入框中输入过多的表情符号，从而覆盖程序中的重要数据，例如聊天消息、账号密码等。 |\n| 栈溢出攻击 | 攻击者通过向程序的栈中输入过多的数据，从而溢出到栈外部，实现对程序操作的恶意操作。例如，攻击者可以通过向游戏应用程序的输入框中输入过多的道具名称，从而覆盖程序中的重要数据，例如游戏数据、账号密码等。 |\n| 堆溢出攻击       | 攻击者通过向程序的堆中输入过多的数据，从而溢出到堆外部，实现对程序操作的恶意操作。例如，攻击者可以通过向操作系统工具的输入框中输入过多的命令，从而覆盖程序中的重要数据，例如系统文件、配置文件等。 |", "title": "经典缓冲区溢出常见的攻击方式"}, {"content": "- 输入验证：在程序输入处对输入数据进行严格的验证和过滤，确保输入数据符合预期的格式和类型，避免被攻击者注入恶意命令或数据。可以使用正则表达式、格式字符串等方式进行输入验证。\n- 输出过滤：在程序输出处对输出数据进行严格的过滤和检查，确保输出数据符合预期的格式和类型，避免被攻击者截获和篡改。可以使用安全的输出过滤库等方式进行输出过滤。\n- 使用安全的编程模型：使用安全的编程模型，例如避免使用原生的缓冲区管理函数，使用安全的框架和库来处理输入数据和执行命令，避免缓冲区溢出漏洞。\n- 数据库加密和访问控制：对于敏感数据和命令，使用加密和访问控制措施，确保只有授权用户可以访问和执行命令，避免被攻击者窃取和篡改。\n- 定期更新和升级：定期更新和升级应用程序和库的版本，确保应用程序和库的最新版本包含了最新的安全补丁和修复措施，避免安全漏洞的出现和利用。\n- 安全审计和监控：定期对系统和应用程序进行安全审计和监控，及时发现和阻止潜在的安全漏洞和攻击，确保系统和数据的安全和可靠性。", "title": "如何预防经典缓冲区溢出"}], "cnvd_id": "", "cve_id": "CVE-2026-86165", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:N/AC:L/Au:N/C:C/I:C/A:C", "severity": "high", "base_score": 10}], "cvssv31": [{"source": "cna@vuldb.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}], "cvssv4": [{"source": "cna@vuldb.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.9}]}, "cvss_score": 8.9, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-120", "description": "Tenda HG10 是腾达推出的 AC1200 双频 Wi-Fi xPON 光网络终端，固件为闭源商业固件，设备内置 Boa Web 服务器，通过 /boaform 路径下的表单处理程序提供管理配置功能。\n受影响版本中，固件 /bin/boa 的 formURL 表单处理函数（对应 POST /boaform/admin/formURL 入口）使用 boaGetVar 读取请求参数 Keywd，随后调用 strcpy 将其复制到固定大小的栈缓冲区，复制前未校验参数长度；远程攻击者可在未经认证的请求中提交超长 Keywd 值，越界覆盖相邻内存，公开 PoC 验证该请求会使设备停止响应，造成拒绝服务。\n修复版本中通过在复制前校验 Keywd 参数长度并拒绝超长输入，可切断上述越界写入链路；截至 2026-09-06，厂商尚未发布标注修复该漏洞的固件版本，官方下载渠道仍提供 300001138 固件，建议将设备管理页面限制在可信网络内并关注官方更新。", "effects": [{"comp_name": "hg10", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,300001138]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "经典缓冲区溢出", "kind_en": "不检查输入大小的缓冲区复制（“经典缓冲区溢出”）", "last_modified_time": "2026-09-06", "level": "High", "mps_id": "MPS-h1ta-ro3n", "poc": false, "poc_url": [], "published_time": "2026-09-06", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-h1ta-ro3n", "name": "https://www.oscs1024.com/hd/MPS-h1ta-ro3n"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-86165", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-86165"}, {"url": "https://github.com/SunnyYANGyaya/cuicuishark-sheep-fishIOT/blob/main/Tenda/HG10/bof-formURL-keywd.md", "name": ""}, {"url": "https://vuldb.com/cve/CVE-2026-86165", "name": ""}, {"url": "https://vuldb.com/submit/895583", "name": ""}, {"url": "https://vuldb.com/submit/895594", "name": ""}, {"url": "https://vuldb.com/vuln/399304", "name": ""}, {"url": "https://vuldb.com/vuln/399304/cti", "name": ""}, {"url": "https://www.tenda.com.cn/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "腾达HG10缓冲区溢出漏洞", "_translated": true, "_saved_at": "2026-09-06T05:24:53+00:00", "_first_saved_at": "2026-09-06T05:24:53+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-h1ta-ro3n"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-18480", "cvss": {}, "cvss_score": 8.8, "cvss_vector": "", "cwe": "CWE-269", "description": "SureCart 是一款面向 WordPress 的开源电商插件，以 GPLv2 或更高协议通过 WordPress.org 插件目录分发，提供购物车、结账、客户与订单管理能力。\n受影响版本中，编辑客户的 REST 路由 /surecart/v1/customers/{id} 经 edit_sc_customer 授权检查确认请求者可更新自己名下的客户记录后，CustomerController::edit 按请求中的客户编号反查关联的 WordPress 账户，并把请求体中的 email、first_name、last_name、phone 通过 wp_update_user 直接写入该账户；客户记录与 WordPress 账户的绑定缺乏唯一性校验，User::setCustomerId 允许绑定其他用户已持有的客户编号，结账列表接口又向任意已登录用户泄露客户编号与邮箱，订阅者级别账户得以把管理员关联账户的邮箱改写为受控值，再通过 WordPress 找回密码流程完成管理员账户接管。\n修复版本中通过重写 CustomerController::edit 切断该链条：先调用 parent::edit 完成平台侧客户更新，再经新增的 syncWPUser 依据平台返回的客户数据同步关联账户，同步前重新执行 edit_sc_customer 授权检查，字段写入统一收敛到 UsersService::applyCustomerToWPUser 且不再写入 email；同版本 User::setCustomerId 拒绝绑定其他用户已持有的客户编号，User::findByCustomerId 对歧义查询结果失败关闭，结账列表不再向缺少 edit_sc_checkouts 权限的用户输出编辑上下文字段。", "effects": [{"comp_name": "surecart", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,4.6.3)", "min_fixed_version": "4.6.3", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-09-06", "level": "Hi forum.mikrotik.com/t/7-23-4-long-term-is-released/272801", "name": ""}, {"url": "https://forum.mikrotik.com/t/7-24-2-stable-is-released/272800", "name": ""}, {"url": "https://mikrotik.com/supportsec/september-2026-vulnerability/", "name": ""}, {"url": "https://npratley.net/reversing-mikrotiks-silent-patch-the-routeros-7-23-4-fix-they-wouldnt-explain/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "MikroTik RouterOS WebFig 任意文件读取漏洞", "_translated": true, "_saved_at": "2026-09-06T00:29:34+00:00", "_first_saved_at": "2026-09-05T20:53:37+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-h302-es1i"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-86258", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "medium", "base_score": 5.9}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.2}]}, "cvss_score": 8.2, "cvss_vector": "CVSS:4.0/AV:N TTP 框架，被 Nuxt、Nitro 等项目用作底层请求处理层，其 serveStatic() 工具用于为应用提供静态文件服务。\n受影响版本中，serveStatic() 通过 decodeURI(withLeadingSlash(withoutTrailingSlash(event.url.pathname))) 计算请求文件标识，而 Node.js 部署下 event.url 由 srvx 的 FastURL 以字符串切片方式解析，不归一化点段，%2e%2e 被原样保留；decodeURI() 将 %2e 解码为 .. 后生成含 ../ 的路径，该路径未经任何穿越校验即传入 getMeta()/getContents() 回调执行文件系统读取，未认证攻击者发送 GET /%2e%2e/%2e%2e/…/etc/passwd 类请求可以读出静态根目录之外的任意文件；v1 分支在 src/utils/static.ts 中经 ufo 的 decodePath() 解码 parseURL(event.path).pathname，存在相同问题。\n修复版本中通过在 src/utils/internal/path.ts 新增 resolveDotSegments() 消解路径中的 . 与 .. 点段，并在 serveStatic() 中以该函数包裹 decodeURI() 结果（v2 修复 commit 0e751b4），传入回调的文件标识不再包含 .. 且无法越过根路径；v1 分支修复（commit 6465e1b）在 serveStatic() 中直接拒绝包含 .. 的请求路径并返回 404，对应升级版本分别为 1.15.6 与 2.0.1-rc.15。", "effects": [{"comp_name": "h3", "ecosystem": "npm", "versions": [{"affected_version": "[2.0.0-beta.0,2.0.1-rc.15)", "min_fixed_version": "2.0.1-rc.15", "repository": "npm", "solutions": [], "upstream": true}, {"affected_version": "(-∞,1.15.6)", "min_fixed_version": "1.15.6", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-09-06", "level": "High", "mps_id": "MPS-swko-59hu", "poc": false, "poc_url": [], "published_time": "2026-09-06", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-swko-59hu", "name": "https://www.oscs1024.com/hd/MPS-swko-59hu"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-86253", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-86253"}, {"url": "https://github.com/h3js/h3/security/advisories/GHSA-wr4h-v87w-p3r7", "name": ""}, {"url": "https://www.vulncheck.com/advisories/h3-before-1.15.6-path-traversal-via-percent-encoded-dot-segments", "name": ""}], "scope_influence": "", "tags": ["npm", "开源"], "title": "h3 serveStatic 路径穿越漏洞", "_translated": true, "_saved_at": "2026-09 Notes/GA/Content/N-central_2026.3_HF3_Release_Notes.htm", "name": ""}, {"url": "https://me.n-able.com/s/security-advisory/aArVy0000002LUzKAM/cve202686207-authentication-bypass-leads-to-unauthorised-access-to-ncentral", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "N-central认证绕过漏洞", "_translated": true, "_saved_at": "2026-09-05T22:34:43+00:00", "_first_saved_at": "2026-09-05T20:53:43+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-q6dx-umok"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-84219", "cvss": {}, "cvss_score": 7.5, "cvss_vector": "", "cwe": "CWE-79", "description": "Kirki 是一款面向 WordPress 的 GPL 开源可视化页面构建器与主题定制器插件，站点页头、页脚和内容页由它在服务端渲染输出，并支持把文章评论作为动态内容绑定到页面元素。\n受影响版本中，Kirki 输出构建页面前会调用 HelperFunctions::decode_entities_without_creating_markup()，该函数先用区分大小写的正则 '/\u0026(?:lt|gt|#0*(?:60|62)|#[xX]0*3[ceCE]);/' 暂存角括号实体，再对其余内容执行 html_entity_decode()，未登录访客在评论中写入 \u0026LT;script\u0026GT;、\u0026#X3C; 这类大写或变体拼写时暂存正则无法命中，这些拼写被解码回字面 \u003c 与 \u003e，评论中存储的脚本在页面输出中恢复为可执行标记，并在包括管理员在内的任何查看者的浏览器会话中执行，当页头或页脚由 Kirki 搭建并展示评论时全站每个页面均受影响。\n修复版本中通过为暂存正则追加 i 修饰符使其不区分大小写，全部拼写变体在解码前统一暂存并在解码后原样还原，实体解码不再生成新的活动标记，6.3.0 同时将构建器评论查询限定为已批准状态，未批准评论不再进入渲染管线。", "effects": [{"comp_name": "kirki", "ecosystem": "linux", "versions": [{"affected_version": "[6.2.1,6.3.0)", "min_fixed_version": "6.3.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-09-06", "level": "High", "mps_id": "MPS-dk4t-07jb", "poc": false, "poc_url": [], "published_time": "2026-09-06", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-dk4t-07jb", "name": "https://www.oscs1024.com/hd/MPS-dk4t-07jb"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-84219", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-84219"}, {"url": "https://wpscan.com/vulnerability/e95bd1e3-6f61-423f-add6-519e1ca7bf66/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Kirki 未授权存储型 XSS", "_translated": true, "_saved_at": "2026-09-06T10:05:34+00:00", "_first_saved_at": "2026-09-06T10:05:34+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-dk4t-07jb"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过构造恶意的数据，将过多的数据输入到程序的缓冲区中，使得缓冲区的空间被填满，从而溢出到程序的栈 (stack) 或堆 (heap) 中，导致程序崩溃、拒绝服务、数据泄露等安全问题。\n", "title": "什么是经典缓冲区溢出"}, {"content": "| 类型        | 描述                                                         |\n| ----------- | ------------------------------------------------------------ |\n| 代码注入攻击      | 攻击者通过向程序的缓冲区输入恶意代码，从而控制程序执行流程，实现对程序操作的恶意操作。例如，攻击者可以通过向 Web 应用程序的输入框中输入恶意代码，从而执行任意的代码，破坏系统、窃取数据等。 |\n| 数据覆盖攻击      | 攻击者通过向程序的缓冲区输入过多的数据，从而覆盖程序中的重要数据或代码，实现对程序操作的恶意操作。例如，攻击者可以通过向聊天应用程序的输入框中输入过多的表情符号，从而覆盖程序中的重要数据，例如聊天消息、账号密码等。 |\n| 栈溢出攻击 | 攻击者通过向程序的栈中输入过多的数据，从而溢出到栈外部，实现对程序操作的恶意操作。例如，攻击者可以通过向游戏应用程序的输入框中输入过多的道具名称，从而覆盖程序中的重要数据，例如游戏数据、账号密码等。 |\n| 堆溢出攻击       | 攻击者通过向程序的堆中输入过多的数据，从而溢出到堆外部，实现对程序操作的恶意操作。例如，攻击者可以通过向操作系统工具的输入框中输入过多的命令，从而覆盖程序中的重要数据，例如系统文件、配置文件等。 |", "title": "经典缓冲区溢出常见的攻击方式"}, {"content": "- 输入验证：在程序输入处对输入数据进行严格的验证和过滤，确保输入数据符合预期的格式和类型，避免被攻击者注入恶意命令或数据。可以使用正则表达式、格式字符串等方式进行输入验证。\n- 输出过滤：在程序输出处对输出数据进行严格的过滤和检查，确保输出数据符合预期的格式和类型，避免被攻击者截获和篡改。可以使用安全的输出过滤库等方式进行输出过滤。\n- 使用安全的编程模型：使用安全的编程模型，例如避免使用原生的缓冲区管理函数，使用安全的框架和库来处理输入数据和执行命令，避免缓冲区溢出漏洞。\n- 数据库加密和访问控制：对于敏感数据和命令，使用加密和访问控制措施，确保只有授权用户可以访问和执行命令，避免被攻击者窃取和篡改。\n- 定期更新和升级：定期更新和升级应用程序和库的版本，确保应用程序和库的最新版本包含了最新的安全补丁和修复措施，避免安全漏洞的出现和利用。\n- 安全审计和监控：定期对系统和应用程序进行安全审计和监控，及时发现和阻止潜在的安全漏洞和攻击，确保系统和数据的安全和可靠性。", "title": "如何预防经典缓冲区溢出"}], "cnvd_id": "", "cve_id": "CVE-2026-86166", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:N/AC:L/Au:S/C:C/I:C/A:C", "severity": "high", "base_score": 9}], "cvssv31": [{"source": "cna@vuldb.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}], "cvssv4": [{"source": "cna@vuldb.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.4}]}, "cvss_score": 7.4, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-120", "description": "Tenda HG10 是腾达（Tenda）推出的 AC1200 双频 Wi-Fi xPON 光网络终端（ONT），其闭源固件内置 Boa Web 服务器，用于处理 Web 管理界面的表单请求，同一固件包同时覆盖 HG7、HG9、HG10C 等型号。\n受影响版本中，固件 bin/boa 的 formWanRedirect 表单处理函数（注册于 /boaform/formWanRedirect）通过 boaGetVar 读取 if 参数（WAN 接口名）后，未做任何长度校验即调用 strcpy 将其复制到 0x52DB70 处的固定大小缓冲区（与下一个相邻对象间隔 0x80 字节）；已登录的低权限用户通过 HTTP 请求提交超长 if 值即可越界写入相邻内存，导致 Boa 服务崩溃、设备停止响应。\n修复版本中通过，可通过将设备 Web 管理界面限制于可信内网、关闭 WAN 侧远程管理并使用强口令缓解该风险；经与官方最新固件 300002266（2026-05-27 发布）比对，formWanRedirect 中该无长度校验的 strcpy 调用仍然存在，建议关注腾达官方后续安全更新。", "effects": [{"comp_name": "HG10", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,300002266]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "经典缓冲区溢出", "kind_en": "不检查输入大小的缓冲区复制（“经典缓冲区溢出”）", "last_modified_time": "2026-09-06", "level": "High", "mps_id": "MPS-v8oy-eudz", "poc": false, "poc_url": [], "published_time": "2026-09-06", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-v8oy-eudz", "name": "https://www.oscs1024.com/hd/MPS-v8oy-eudz"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-86166", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-86166"}, {"url": "https://github.com/SunnyYANGyaya/cuicuishark-sheep-fishIOT/blob/main/Tenda/HG10/bof-formWanRedirect-if.md", "name": ""}, {"url": "https://vuldb.com/cve/CVE-2026-86166", "name": ""}, {"url": "https://vuldb.com/submit/895595", "name": ""}, {"url": "https://vuldb.com/vuln/399305", "name": ""}, {"url": "https://vuldb.com/vuln/399305/cti", "name": ""}, {"url": "https://www.tenda.com.cn/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Tenda HG10缓冲区溢出漏洞", "_translated": true, "_saved_at": "2026-09-06T05:24:55+00:00", "_first_saved_at": "2026-09-06T05:24:55+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-v8oy-eudz"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能有效地控制资源的使用，导致攻击者可以利用这个漏洞耗尽应用程序所依赖的资源。这些资源可以是计算资源（CPU、内存）、网络带宽、数据库连接或其他系统资源。攻击者可以通过发送特制的请求、恶意输入或其他方式，使应用程序消耗大量资源，导致拒绝服务或系统崩溃。", "title": "什么是拒绝服务"}, {"content": "- 消耗计算资源：攻击者可以发送计算密集型的请求，例如复杂的计算、无限循环或递归操作，以耗尽应用程序的计算资源，导致应用程序无法响应其他请求。\r\n- 消耗内存资源：攻击者可以发送大量的数据或恶意输入，以导致应用程序消耗过多的内存资源，从而使系统的可用内存耗尽，并导致应用程序崩溃或变得不可用。\r\n- 消耗网络带宽：攻击者可以发送大量的请求或大型数据包，以消耗应用程序所依赖的网络带宽。这会导致其他合法用户无法正常访问应用程序或降低系统的整体网络性能。\r\n- 消耗存储资源：攻击者可以发送大量的请求或上传大文件，以耗尽应用程序的存储资源，导致系统无法处理其他请求或存储新的数据。", "title": "拒绝服务常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对输入数据进行合理的验证和过滤，防止恶意输入导致资源消耗过高。\r\n- 实施资源限制：应用程序应该实施适当的资源限制策略，例如限制计算操作的时间或次数，限制内存使用量，限制并发连接数等，以防止资源被耗尽。\r\n- 异常处理与错误恢复：应用程序应该具备健壮的异常处理和错误恢复机制，以防止因意外错误导致资源泄漏或无法释放的情况。\r\n- 资源监控与警报：应用程序应该实施适当的资源监控和警报机制，及时发现异常的资源消耗情况，并采取相应的措施来应对。\r\n- 压力测试与性能优化：应用程序应该进行压力测试，以评估其在高负载情况下的性能，并进行必要的性能优化，以确保能够有效地处理大量请求而不耗尽资源。", "title": "如何预防拒绝服务"}], "cnvd_id": "", "cve_id": "CVE-2026-86255", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:N/A:H", "severity": "medium", "base_score": 6.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-400", "description": "wger 是一个开源的健身与体重管理平台，基于 Django 和 Django REST Framework 构建，提供训练计划、训练日志与统计分析等功能，并通过 REST API 服务 Web 与移动端客户端。\n受影响版本中，Routine 模型（wger/manager/models/routine.py）的 clean 方法仅校验 start 不晚于 end，RoutineSerializer（wger/manager/api/serializers.py）也未限制两个日期的跨度，任意注册用户可通过创建接口提交跨度达数十年的 start 与 end；routine 详情类接口处理请求时会进入 date_sequence 属性中按天推进的 while 循环，循环次数完全由用户提交的 end 决定且无上限，跨度 100 年的计划需迭代约 36525 次，每步还伴随当天槽位、条目、多种配置与训练日志的计算，单个请求即可占用工作线程数秒，反复请求会耗尽全部工作线程，使正常用户无法获得服务。\n修复版本中通过把校验迁移到序列化器层并限制计划时长来切断该链路：Routine 模型新增 MAX_DURATION_DAYS=120 的时长上限，RoutineSerializer 新增 validate 方法，对 end 早于 start 或跨度超过 120 天的提交返回校验错误，模型层原有的 clean 校验被移除并补充了对应的 API 测试，超长计划在创建阶段被直接拒绝，date_sequence 的循环上限不再受攻击者控制。", "effects": [{"comp_name": "wger", "ecosystem": "pip", "versions": [{"affected_version": "(-∞,2.6)", "min_fixed_version": "2.6", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "拒绝服务", "kind_en": "不受控制的资源消耗", "last_modified_time": "2026-09-06", "level": "High", "mps_id": "MPS-fjqi-tr79", "poc": false, "poc_url": [], "published_time": "2026-09-06", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-fjqi-tr79", "name": "https://www.oscs1024.com/hd/MPS-fjqi-tr79"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-86255", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-86255"}, {"url": "https://github.com/wger-project/wger/security/advisories/GHSA-v25j-wqcw-fvhj", "name": ""}, {"url": "https://www.vulncheck.com/advisories/wger-before-2.5-uncontrolled-resource-consumption-via-date-sequence", "name": ""}], "scope_influence": "", "tags": ["python", "开源"], "title": "wger 训练计划资源耗尽漏洞", "_translated": true, "_saved_at": "2026-09-06T13:53:36+00:00", "_first_saved_at": "2026-09-06T13:53:36+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-fjqi-tr79"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-86283", "cvss": {"cvssv4": [{"source": "5a6e4751-2f3f-4070-9419-94fb35b644e8", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-862", "description": "MISP 是一个开源的威胁情报共享平台（PHP/CakePHP 编写），用于组织间共享威胁事件、指标与归因信息，UiBeta 为其 2.5 系列提供新版界面的主题。\n受影响版本中，集合详情页控制器 CollectionsController::view() 通过 Event::fetchSimpleEvents($user, ...) 按调用者 ACL 解析集合元素，而 UiBeta 主题模板 app/View/Themed/UiBeta/Collections/view.ctp 随后仅以 ['Event.uuid' =\u003e $eventUuids] 条件对同一批元素 UUID 执行二次查询，缺失 Event::createEventConditions() 授权过滤；集合元素 UUID 由 CollectionElementsController::add() 保存时不做事件级授权校验，拥有集合查看权限的认证用户可读取无权访问事件的编号、info、日期、创建组织、全部事件标签与 galaxy cluster，形成事件边界的横向越权。\n修复版本中通过在模板内补齐调用者 ACL，以 $_me = $this-\u003eget('me') 取当前登录用户并用 Event::createEventConditions($_me) 构造授权条件、在其 AND 分支叠加 Event.uuid IN (...) 后再执行查询，同时将 attachClustersToEventIndex() 的用户参数统一为当前登录用户，未授权事件被 ACL 过滤，越权读取路径被切断。", "effects": [{"comp_name": "MISP", "ecosystem": "linux", "versions": [{"affected_version": "[2.5.41,2.5.46)", "min_fixed_version": "2.5.46", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-09-06", "level": "High", "mps_id": "MPS-ygno-tkpu", "poc": false, "poc_url": [], "published_time": "2026-09-06", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ygno-tkpu", "name": "https://www.oscs1024.com/hd/MPS-ygno-tkpu"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-86283", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-86283"}, {"url": "https://github.com/MISP/MISP/commit/44573e4a8.patch", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "MISP 集合视图越权访问漏洞", "_translated": true, "_saved_at": "2026-09-06T16:39:08+00:00", "_first_saved_at": "2026-09-06T16:39:08+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ygno-tkpu"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-19633", "cvss": {"cvssv31": [{"source": "f86ef6dc-4d3a-42ad-8f28-e6d5547a5007", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-89", "description": "PostgreSQL Anonymizer contains a vulnerability that allows unprivileged masked users to execute arbitrary code by abusing operators, domain casts, or view subqueries that carry untrusted expressions. When these objects are evaluated in the context of the extension’s masking mechanisms, the malicious code can run with elevated privileges. The issue is fixed in PostgreSQL Anonymizer 3.1.4 and later versions", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-09-07", "level": "High", "mps_id": "MPS-ycxn-i6mv", "poc": false, "poc_url": [], "published_time": "2026-09-07", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ycxn-i6mv", "name": "https://www.oscs1024.com/hd/MPS-ycxn-i6mv"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-19633", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-19633"}, {"url": "https://gitlab.com/dalibo/postgresql_anonymizer/-/issues/665", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-19633漏洞", "_translated": true, "_saved_at": "2026-09-06T16:39:11+00:00", "_first_saved_at": "2026-09-06T16:39:06+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ycxn-i6mv"}]}</script>
  <script>
    const payload = JSON.parse(document.getElementById("payload").textContent);
    const levelLabels = payload.level_labels || {};

    $("count").textContent = String(payload.count ?? items.length);

    function levelClass(level) {
      const cn = levelLabels[level] || level || "";
      if (level === "Critical" || cn === "严重") return "crit";
      if (level === "High" || cn === "高危") return "high";
      return "other";
    }
    function levelText(level) {
      return levelLabels[level] || level || "-";

    function esc(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }
    function scoreText(v) {
      if (v === null || v === undefined || v === "" || v === -1) return "-";

    }

    function renderList() {
      const list = $("list");
      $("listCount").textContent = String(filtered.length);
      if (!filtered.length) {
        list.innerHTML = '<div class="empty">没有匹配项</div>';
        return;
      }
      list.innerHTML = filtered.map((it) => {
        const id = it.mps_id || it.cve_id;
        const active = id === activeId ? " active" : "";
        return `
          <button class="item${active}" data-id="${esc(id)}" type="button">
            <div class="item-top">
              <span class="cve">${esc(it.cve_id || it.mps_id || "-")}</span>
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
            </div>
            <div class="title">${esc(it.title || "-")}</div>
            <div class="item-foot">
              <span>CVSS ${esc(scoreText(it.cvss_score))}</span>
              <span>${esc(it.published_time || "-")}</span>
              ${it.poc ? "<span>POC</span>" : ""}
            </div>
          </button>`;
      }).join("");
      list.querySelectorAll(".item").forEach((btn) => {
        btn.addEventListener("click", () => selectById(btn.dataset.id));
      });
    }

    function refsHtml(it) {
      const refs = Array.isArray(it.reference_url_list) ? it.reference_url_list : [];
      const links = [];
      if (it._source_page) links.push({ url: it._source_page, name: "OSCS 详情" });
      if (it.cve_id) links.push({ url: `https://nvd.nist.gov/vuln/detail/${it.cve_id}`, name: "NVD" });
      refs.forEach((r) => {
        if (r && r.url) links.push({ url: r.url, name: r.name || r.url });
      });
      const seen = new Set();
      const uniq = [];
      for (const l of links) {
        if (seen.has(l.url)) continue;
        seen.add(l.url);
        uniq.push(l);
      }
      if (!uniq.length) return '<div class="box">无参考链接</div>';
      return `<div class="refs">${uniq.map((l) =>
        `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name || l.url)}</a>`
      ).join("")}</div>`;
    }

    function articlesHtml(it) {
      const arts = Array.isArray(it.articles) ? it.articles : [];
      if (!arts.length) return "";
      return `<div class="section"><h3>相关说明</h3>${arts.map((a) => `
        <div class="article">
          <h4>${esc(a.title || "说明")}</h4>
          <p>${esc(a.content || "")}</p>
        </div>`).join("")}</div>`;
    }

    function renderDetail(it) {
      const detail = $("detail");
      if (!it) {
        detail.innerHTML = '<div class="empty">暂无数据</div>';
        return;
      }
      const pocUrls = Array.isArray(it.poc_url) ? it.poc_url : [];
      detail.innerHTML = `
        <div class="d-head">
          <div>
            <h1 class="d-title">${esc(it.title || "-")}</h1>
            <div class="ids">
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
              <span class="chip">${esc(it.cve_id || "无 CVE")}</span>
              <span class="chip">${esc(it.mps_id || "-")}</span>
              ${it.poc ? '<span class="chip">有 POC</span>' : ""}
              ${it.exp ? '<span class="chip">有 EXP</span>' : ""}
            </div>
          </div>
          <div class="actions">
            ${it._source_page ? `<a class="btn" href="${esc(it._source_page)}" target="_blank" rel="noopener">OSCS</a>` : ""}
            ${it.cve_id ? `<a class="btn" href="https://nvd.nist.gov/vuln/detail/${esc(it.cve_id)}" target="_blank" rel="noopener">NVD</a>` : ""}
          </div>
        </div>
        <div class="grid">
          <div class="stat"><div class="k">CVSS</div><div class="v">${esc(scoreText(it.cvss_score))}</div></div>
          <div class="stat"><div class="k">向量</div><div class="v">${esc(it.cvss_vector || "-")}</div></div>
          <div class="stat"><div class="k">CWE</div><div class="v">${esc(it.cwe || "-")}</div></div>
          <div class="stat"><div class="k">类型</div><div class="v">${esc(it.kind || it.kind_en || "-")}</div></div>
          <div class="stat"><div class="k">公开</div><div class="v">${esc(it.published_time || "-")}</div></div>
          <div class="stat"><div class="k">利用成本</div><div class="v">${esc(it.exploit_requirement_cost || "-")}</div></div>
          <div class="stat"><div class="k">可利用性</div><div class="v">${esc(it.exploitability || "-")}</div></div>
          <div class="stat"><div class="k">修复建议</div><div class="v">${esc(it.fix_suggestion || "-")}</div></div>
        </div>
        <div class="section"><h3>描述</h3><div class="box">${esc(it.description || "无描述")}</div></div>
        ${it.scope_influence ? `<div class="section"><h3>影响范围</h3><div class="box">${esc(it.scope_influence)}</div></div>` : ""}
        ${pocUrls.length ? `<div class="section"><h3>POC 链接</h3><div class="refs">${pocUrls.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join("")}</div></div>` : ""}
        <div class="section"><h3>参考链接</h3>${refsHtml(it)}</div>
        ${articlesHtml(it)}
      `;
    }

    function selectById(id) {
      const it = filtered.find((x) => (x.mps_id || x.cve_id) === id) ||
                 items.find((x) => (x.mps_id || x.cve_id) === id);
      if (!it) return;
      activeId = it.mps_id || it.cve_id;
      renderList();
      renderDetail(it);
      const btn = document.querySelector(`.item[data-id="${CSS.escape(activeId)}"]`);
      if (btn) btn.scrollIntoView({ block: "nearest" });
      history.replaceState(null, "", "#" + encodeURIComponent(activeId));
    }

    function applyFilter(q) {
      const query = (q || "").trim().toLowerCase();
      filtered = !query ? items.slice() : items.filter((it) => {
        const blob = [
          it.cve_id, it.mps_id, it.title, it.kind, it.kind_en, it.cwe, it.description, it.level
        ].map((x) => String(x || "").toLowerCase()).join(" ");
        return blob.includes(query);
      });
      renderList();
      if (filtered.length) {
        const still = filtered.some((x) => (x.mps_id || x.cve_id) === activeId);
        selectById(still ? activeId : (filtered[0].mps_id || filtered[0].cve_id));
      } else {
        activeId = null;
        renderDetail(null);
      }
    }

    $("search").addEventListener("input", (e) => applyFilter(e.target.value));

    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement !== $("search")) {
        e.preventDefault();
        $("search").focus();
        return;
      }
      if (!filtered.length) return;
      const idx = filtered.findIndex((x) => (x.mps_id || x.cve_id) === activeId);
      if (e.key === "ArrowDown") {
        e.preventDefault();
        const next = filtered[Math.min(filtered.length - 1, Math.max(0, idx) + 1)];
        selectById(next.mps_id || next.cve_id);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        const prev = filtered[Math.max(0, idx - 1)];
        selectById(prev.mps_id || prev.cve_id);
      }
    });

    const hashId = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    if (hashId && items.some((x) => (x.mps_id || x.cve_id) === hashId)) {
      activeId = hashId;
      renderList();
      selectById(hashId);
    } else if (items.length) {
      selectById(items[0].mps_id || items[0].cve_id);
    } else {
      renderList();
      renderDetail(null);
    }
  </script>
</body>
</html>
