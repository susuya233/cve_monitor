被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-82090", "cvss": {"cvssv4": [{"source": "cve@mitre.org", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.2}]}, "cvss_score": 9.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-79", "description": "Pocket 是 Mozilla 与 Read It Later 提供的稍后阅读客户端，Android 包名为 com.ideashower.readitlater.pro，用于保存网页并在应用内阅读；该应用已停止服务，不是 GitHub 开源项目。\n受影响版本中，Save to Pocket 会把外部文章 HTML 注入 WebView DOM。assets/html/j/articleview-mobile.js 的 loadCallback 将远端 content 直接交给 $(document.body).html(content) 且未做净化，页面中的脚本可在应用内执行，并调用 PocketAndroidArticleInterface 等原生桥接方法改写应用状态；后台 DownloadingService 还会自动拉取并渲染已保存文章。\n修复版本中通过卸载受影响应用切断外部 HTML 进入 WebView 的执行路径。官方未发布代码补丁，最终发行版 8.33.0.0 仍包含原 html() 调用，产品已被标记为 unsupported-when-assigned。", "effects": [{"comp_name": "Pocket", "ecosystem": "description": "Shinobi 是 Shinobi Systems 开发的开源 Node.js 视频监控系统（CCTV/NVR），支持本地与网络摄像头接入，并通过 childNodes 主/子节点模式实现多机分布式部署，主节点在独立端口上为子节点提供 WebSocket 接入服务。\n受影响版本中，libs/config.js 为未配置 childNodes.key 的部署内置默认连接密钥 3123asdasdf1dtj1hjk23sdfaasd12asdasddfdbtnkkfgvesra3asdsd3123afdsfqw345，libs/childNode.js 的认证回调 onAuthenticate 仅通过 config.childNodes.key.indexOf(data.socketKey) 校验该密钥；攻击者向主节点子节点服务端口（默认 8288）的 /childNode 通道发送携带该硬编码密钥的 init 消息完成认证后，后续消息进入 libs/childNode/utils.js 的 onWebSocketDataFromChildNode，其 case 'sql' 分支将消息中的 query 直接交给 s.sqlQuery 执行并经 sqlCallback 返回结果，未认证攻击者可读取、修改数据库中的用户记录与摄像头配置。\n修复版本中通过移除 libs/config.js 内置的默认连接密钥，改为未配置时使用 crypto.randomBytes 随机生成会话密钥，在 libs/childNode.js 新增基于 crypto.timingSafeEqual 的 isChildNodeKeyValid 进行精确密钥比较并替换两处 indexOf 校验，同时删除 onWebSocketDataFromChildNode 的 case 'sql' 分支，切断外部输入直达数据库查询的链路。", "effects": [{"comp_name": "shinobi", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,5a76c74f3977661ff3f9fd55a260db352c0b19c0)", "min_fixed_version": "5a76c74f3977661ff3f9fd55a260db352c0b19c0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "使用硬编码的凭证", "kind_en": "使用硬编码凭证", "last_modified_time": "2026-08-29", "level": "Critical", "mps_id": "MPS-9nrz-ihlm", "poc": false, "poc_url": [], "published_time": "2026-08-29", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-9nrz-ihlm", "name": "https://www.oscs1024.com/hd/MPS-9nrz-ihlm"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-82448", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-82448"}, {"url": "https://gitlab.com/Shinobi-Systems/Shinobi", "name": ""}, {"url": "https://gitlab.com/Shinobi-Systems/Shinobi/-/blob/f04e685b8bd4c6190fcd62993131b86a76c2b806/libs/childNode/utils.js", "name": ""}, {"url": "https://gitlab.com/Shinobi-Systems/Shinobi/-/commit/5a76c74f3977661ff3f9fd55a260db352c0b19c0", "name": ""}, {"ur ence_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-mctw-7f6h", "name": "https://www.oscs1024.com/hd/MPS-mctw-7f6h"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-77012", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-77012"}, {"url": "https://wpscan.com/vulnerability/025664f8-2af7-4692-a9a0-1d28916a1565/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "爱采集插件未授权SSRF漏洞", "_translated": true, "_saved_at": "2026-08-29T10:39:26+00:00", "_first_saved_at": "2026-08-29T10:39:26+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-mctw-7f6h"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-82454", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N", "severity": "critical", "base_score": 9.1}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-347", "description": "Omnivore 是一个开源的稍后阅读（read-it-later）应用，支持网页与移动端保存和阅读内容，其 packages/api 为后端 API 服务，支持自建部署。\n受影响版本中，packages/api 的 decodeAppleToken 函数从攻击者提交的 Apple 登录令牌头部读取 alg 字段，并将其作为唯一允许的算法传入 jwt.verify()，所依赖的 jsonwebtoken v8 不校验密钥类型与算法的匹配关系，攻击者把 alg 设为 HS256，以公开可获取的 Apple RSA 公钥作为 HMAC 密钥为伪造令牌签名，使签名校验通过，进而冒充任意绑定 Apple 登录的账号，实现未授权账户接管。\n修复版本中通过不再信任令牌头部的 alg 字段，把 jwt.verify() 的允许算法固定为 Apple 身份服务使用的 ['RS256']，HS256 伪造令牌在签名校验阶段直接失败，切断了算法混淆链路。", "effects": [{"comp_name": "omnivore", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,0.227.0)", "min_fixed_version": "0.227.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "密码学签名的验证不恰当", "kind_en": "密码签名验证不当", "last_modified_time": "2026-08-29", "level": "Critical", "mps_id": "MPS-ncoz-biat", "poc": false, "poc_url": [], "published_time": "2026-08-29", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ncoz-biat", "name": "https://www.oscs1024.com/hd/MPS-ncoz-biat"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-82454", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-82454"}, {"url": "https://github.com/omnivore-app/omnivore", "name": ""}, {"url": "https://github.com/omnivore-app/omnivore/commit/abf53d6508755d3d22a994e28e370a9193ea977a", "name": ""}, {"url": "https://github.com/omnivore-app/omnivore/pull/4652", "name": ""}, {"url": "https://www.vulncheck.com/advisories/omnivore-before-android-0.227.0-authentication-bypass-via-apple-sign-in", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Omnivore Apple登录认证绕过漏洞", "_translated": true, "_saved_at": "2026-08-29T15:24:03+00:00", "_first_saved_at": "2026-08-29T15:24:03+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ncoz-biat"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "cnvd_id": "", "cve_id": "CVE-2026-15369", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-269", "description": "Custom User Registration Fields for WooCommerce 是 Addify 开发、经 WooCommerce Marketplace 分发的商业 WordPress 插件，用于在注册与结账流程中自定义用户注册字段，并支持由客户在结账时选择用户角色。\n受影响版本中，af_reg_checkout_data_to_order_meta_data_block() 函数接受未经身份验证的 WooCommerce Store API /wc/store/v1/checkout 请求中攻击者可控的 afreg_select_user_role 值并写入订单 meta，随后挂在 woocommerce_thankyou 钩子上的 af_reg_custom_order_processing_function() 函数将该值直接传给 WP_User::add_role()，未校验其是否属于管理员配置的允许角色列表，未认证攻击者在结账创建账户时通过修改 JSON 请求体指定 administrator 等任意角色即可完成提权。\n修复版本中通过官方在 2.2.4 版本收紧结账角色数据的处理，消除角色值未经验证直接写入用户账户的问题，阻断未认证攻击者的提权路径，公开资料未披露更细粒度的源码修改。", "effects": [{"comp_name": "custom_user_registration_fields_for_woocommerce", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.2.4)", "min_fixed_version": "2.2.4", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-08-30", "level": "Critical", "mps_id": "MPS-hrmk-jd5s", "poc": false, "poc_url": [], "published_time": "2026-08-30", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-hrmk-jd5s", "name": "https://www.oscs1024.com/hd/MPS-hrmk-jd5s"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-15369", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-15369"}, {"url": "https://woocommerce.com/products/custom-user-registration-fields-for-woocommerce/", "name": ""}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/715723e7-5820-4a64-848f-f89b5b73a681?source=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "WooCommerce自定义注册字段提权漏洞", "_translated": true, "_saved_at": "2026-08-30T00:56:30+00:00", "_first_saved_at": "2026-08-29T22:10:36+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-hrmk-jd5s"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-15980", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-289", "description": "WordPress 的 MyHome Core 插件在 4.4.5 及之前的所有版本中都容易受到身份验证绕过的影响。这是由于 send_link() AJAX 处理程序中缺少授权以及 activate() 函数中的令牌验证不正确造成的。这使得未经身份验证的攻击者可以为未经确认的用户帐户生成激活令牌，并获取该帐户（包括管理员）的有效身份验证 cookie。成功利用该漏洞需要在传统/WPBakery 模式下配置 MyHome 主题，并启用前端注册和确认电子邮件，并且目标帐户不得已具有 myhome_agent_confirmed 用户元集。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "使用候选名称进行的认证绕过", "kind_en": "通过备用名称绕过身份验证", "last_modified_time": "2026-08-30", "level": "Critical", "mps_id": "MPS-wrpf-3sd0", "poc": false, "poc_url": [], "published_time": "2026-08-30", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-wrpf-3sd0", "name": "https://www.oscs1024.com/hd/MPS-wrpf-3sd0"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-15980", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-15980"}, {"url": "https://themeforest.net/item/myhome-real-estate-wordpress-theme/19508653", "name": ""}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/c458e018-5901-4917-9847-35f07646e068?source=cve", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-15980漏洞", "_translated": true, "_saved_at": "2026-08-30T06:13:30+00:00", "_first_saved_at": "2026-08-30T06:13:30+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-wrpf-3sd0"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-82653", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:R/S:C/C:H/I:H/A:L", "severity": "high", "base_score": 8.9}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:P/VC:H/VI:H/VA:L/SC:H/SI:H/SA:L/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:P/ XSS漏洞", "_translated": true, "_saved_at": "2026-08-30T17:06:59+00:00", "_first_saved_at": "2026-08-30T17:06:59+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-vjq4-0hzd"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-81730", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:H/A:L", "severity": "high", "base_score": 8.2}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:H/VA:L/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:H/VA:L/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-22", "description": "Dolibarr 是开源 PHP ERP/CRM 系统，用于管理客户、发票、工单和项目等业务；EmailCollector 模块从指定邮箱采集入站邮件，并按规则创建工单、项目或归档附件。\n受影响版本中，EmailCollector 将入站邮件附件按 MIME 头提供的文件名直接落盘，未规约为安全 basename。全局函数 saveAttachment() 以 $path.$filename.'.'.$ext 调用 file_put_contents()，类内私有 saveAttachment() 以 $destdir.'/'.$filename 写入；文件名来自附件 getName() 或 getFilename()，经记录关联、创建工单和创建项目操作传入。攻击者向被监控邮箱发送含路径穿越序列的附件名，即可在未持有 Dolibarr 账号的情况下把可控内容写到对象附件目录之外；在 htdocs 只读的加固布局下写入被限制在 documents 树，htdocs 可写时同一原语可落到 Web 可执行路径。\n修复版本中通过在写入前对目标目录调用 dol_sanitizePathName()、对文件名调用 dol_sanitizeFileName()，并移除未做净化的全局 saveAttachment()，阻断穿越序列进入 file_put_contents() 路径。", "effects": [{"comp_name": "dolibarr", "ecosystem": "linux", "versions": [{"affected_version": "[9.0.0,24.0.0)", "min_fixed_version": "24.0.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-08-28", "level": "High", "mps_id": "MPS-pn1w-6bhr", "poc": false, "poc_url": [], "published_time": "2026-08-28", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-pn1w-6bhr", "name": "https://www.oscs1024.com/hd/MPS-pn1w-6bhr"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-81730", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-81730"}, {"url": "https://github.com/Dolibarr/dolibarr", "name": ""}, {"url": "https://github.com/Dolibarr/dolibarr/blob/23.0.4/htdocs/emailcollector/lib/emailcollector.lib.php#L187", "name": ""}, {"url": "https://github.com/Dolibarr/dolibarr/commit/264a44defb5e438689c75679617f6edc4c038abc", "name": ""}, {"url": "https://www.vulncheck.com/advisories/dolibarr-9.0.0-through-23.0.4-path-traversal-via-emailcollector-attachment-filename", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Dolibarr附件路径穿越", "_translated": true, "_saved_at": "2026-08-27T23:27:44+00:00", "_first_saved_at": "2026-08-27T23:27:44+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-pn1w-6bhr"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-82089", "cvss": {"cvssv4": [{"source": "cve@mitre.org", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:L/UI:P/VC:H/VI:H/VA:L/SC:H/SI:H/SA:L/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:Y/R:U/V:C/RE:M/U:Green", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:L/UI:P/VC:H/VI:H/VA:L/SC:H/SI:H/SA:L/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:Y/R:U/V:C/RE:M/U:Green", "cwe": "CWE-79", "description": "wallabag Android 应用（Google Play 包名 fr.gaulupeau.apps.InThePoche）是开源 GPL-3.0 客户端，用于 ag/wallabag/security/advisories/GHSA-q2g2-www6-wf5h", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "wallabag Android XSS", "_translated": true, "_saved_at": "2026-08-28T08:32:10+00:00", "_first_saved_at": "2026-08-28T08:32:10+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-z348-hslt"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-81728", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N", "severity": "high", "base_score": 8.1}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-89", "description": "Dolibarr 是开源 ERP/CRM 套件，提供客户、财务、库存等业务管理能力，其中 CSV 与 XLSX 导入向导用于将表格数据写入业务表。\n受影响版本中，导入向导通过 GETPOST('updatekeys', 'array') 读取更新键，仅套用 alphanohtml 过滤，不会清除 SQL 关键字、注释、括号、空格和引号。import_insert() 将提交值拼进 $where[] = $key.' = '.$data[$key]，preg_replace('/^.*\\./i', '', $key) 无法处理不含点号的注入载荷，随后经 $this-\u003edb-\u003equery() 执行。持有导入权限的用户可借助 UNION SELECT 回显任意表内容，并把后续 UPDATE 指向选定行；分类关联表还会把原始过滤数组直接拼进 UPDATE。\n修复版本中通过将 updatekeys 与 array_import_updatekeys 白名单交叉校验，并对字段名执行 sanitize，阻止非法列名进入 SQL 过滤条件，从而切断注入链路。", "effects": [{"comp_name": "dolibarr", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,24.0.0)", "min_fixed_version": "24.0.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-08-28", "level": "High", "mps_id": "MPS-pa9o-k1w5", "poc": false, "poc_url": [], "published_time": "2026-08-28", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-pa9o-k1w5", "name": "https://www.oscs1024.com/hd/MPS-pa9o-k1w5"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-81728", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-81728"}, {"url": "https://github.com/Dolibarr/dolibarr", "name": ""}, {"url": "https://github.com/Dolibarr/dolibarr/blob/23.0.4/htdocs/core/modules/import/import_csv.modules.php#L925", "name": ""}, {"url": "https://github.com/Dolibarr/dolibarr/commit/24b1b99c89c79a3fe2d1e83b22dc1810cf0fa6e1", "name": ""}, {"url": "https://www.vulncheck.com/advisories/dolibarr-before-24.0.0-sql-injection-via-the-csv-and-xlsx-import-update-keys", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Dolibarr导入SQL注入", "_translated": true, "_saved_at": "2026-08-27T23:27:46+00:00", "_first_saved_at": "2026-08-27T23:27:46+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-pa9o-k1w5"}, {"analysis_status": 0, "articles": [{"content": "- 程序未正确处理用户上传的文件，从而导致程序可以读取、处理或存储未经授权的文件\n", "title": "什么是任意文件上传"}, {"content": "- 欺骗攻击：攻击者可以通过发送伪造的文件来欺骗程序，从而导致程序读取、处理或存储未经授权的文件。\n- 文件格式攻击：  DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-77365", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "cwe": "CWE-79", "description": "Optimole（插件目录名 optimole-wp）是开源 WordPress 图片优化插件，提供压缩、WebP/AVIF 转换、CDN 分发和懒加载能力。\n受影响版本中，REST 路由 optml/v1/optimizations 的 permission_callback 为 __return_true，Optml_Rest::optimizations() 读取参数 a（above_fold_images）后只截取前 6 项，未限制为数值 ID 即交给 Profile::store()，并以 array_fill_keys() 作为画像键保存。Profile::get_current_profile_html_comment() 使用默认 json_encode() 把画像写入 HTML 注释，无法转义标签与注释结束符，未认证攻击者可向 a 注入可闭合注释的脚本，使用户访问注入页面时执行。\n修复版本中通过在 optimizations() 内用 is_numeric 与 intval 过滤 a 参数，只保留整数图片 ID，并在 get_current_profile_html_comment() 以 JSON_HEX_TAG 与 JSON_HEX_AMP 编码输出，阻断恶意图片 ID 破坏 HTML 注释并执行脚本。", "effects": [{"comp_name": "optimole-wp", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,4.2.11)", "min_fixed_version": "4.2.11", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-08-28", "level": "High", "mps_id": "MPS-2ldv-0n67", "poc": false, "poc_url": [], "published_time": "2026-08-28", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MP RP_Translation_Render::translate_page 把整页 HTML 交给内置 simple_html_dom 解析；remove_noise 用可预测的 ___noise___ 加五位序号替换评论和 code 等内容，parse_attr 再对属性值执行 restore_noise。title 中的伪造占位键会把 code 内脚本还原进属性并突破引号，访问该页面即可执行任意脚本。\n修复版本中通过在每次解析时生成随机 salt 并写入全部 noise 占位键，使 restore_noise 只还原带该 salt 的标记，未知或截断占位符被丢弃，攻击者无法再伪造占位键把无关内容写进属性。", "effects": [{"comp_name": "translatepress-multilingual", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,3.3.4)", "min_fixed_version": "3.3.4", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-08-28", "level": "High", "mps_id": "MPS-wfxu-ym5k", "poc": false, "poc_url": [], "published_time": "2026-08-28", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-wfxu-ym5k", "name": "https://www.oscs1024.com/hd/MPS-wfxu-ym5k"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-76053", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-76053"}, {"url": "https://plugins.trac.wordpress.org/browser/translatepress-multilingual/tags/3.3.1/assets/lib/simplehtmldom/simple_html_dom.php#L1549", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/translatepress-multilingual/tags/3.3.1/assets/lib/simplehtmldom/simple_html_dom.php#L2125", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/translatepress-multilingual/tags/3.3.1/assets/lib/simplehtmldom/simple_html_dom.php#L2220", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/translatepress-multilingual/tags/3.3.1/assets/lib/simplehtmldom/simple_html_dom.php#L497", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/translatepress-multilingual/tags/3.3.1/includes/class-translation-render.php#L1226", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/translatepress-multilingual/tags/3.3.1/includes/class-translation-render.php#L664", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/translatepress-multilingual/tags/3.3.2/assets/lib/simplehtmldom/simple_html_dom.php#L1549", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/translatepress-multilingual/tags/3.3.2/assets/lib/simplehtmldom/simple_html_dom.php#L2125", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/translatepress-multilingual/tags/3.3.2/assets/lib/simplehtmldom/simple_html_dom.php#L2220", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/translatepress-multilingual/tags/3.3.2/assets/lib/simplehtmldom/simple_html_dom.php#L497", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/translatepress-multilingual/tags/3.3.2/includes/class-translation-render.php#L1226", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/translatepress-multilingual/tags/3.3.2/includes/class-translation-render.php#L664", "name": ""}, {"url": "https://plugins.trac.wordpress.org/changeset/3665013/translatepress-multilingual/trunk/assets/lib/simplehtmldom/simple_html_dom.php", "name": ""}, {"url": "https://plugins.trac.wordpress.org/changeset?old_path=%2Ftranslatepress-multilingual/tags/3.3.3\u0026new_path=%2Ftranslatepress-multilingual/tags/3.3.4", "name": ""}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/990e04ed-ff17-4e10-9224-64a674a40416?source=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "TranslatePress存储型XSS", "_translated": true, "_saved_at": "2026-08-28T08:32:16+00:00", "_first_saved_at": "2026-08-28T08:32:16+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-wfxu-ym5k"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-81729", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:H/A:N", "severity": "medium", "base_score": 6.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-863", "description": "Dolibarr 是开源 ERP/CRM 系统，提供客户、财务、库存与文档管理能力，并通过 REST API 对接第三方系统完成文档下载、上传和删除。\n受影响版本中，REST 接口 Documents::delete() 在处理 DELETE /api/index.php/documents 时，调用 dol_check_secure_access_document() 将 mode 参数设为 'read'，而同文件中会改写存储数据的 builddoc() 正确传入 'write'。仅持有 societe:lire 或 facture:lire 等模块读权限、不具备创建、写入、删除或管理员权限的认证 API 用户可通过校验，永久删除第三方文件、发票、订单、报价、项目文件和已生成 PDF，且没有恢复路径。\n修复版本中通过将 delete() 内 dol_check_secure_access_document() 的 mode 参数改为 'write'，使删除操作必须具备写权限，阻止只读用户进入文档删除路径。", "effects": [{"comp_name": "dolibarr_erp/crm", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,23.0.4)", "min_fixed_version": "23.0.4", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-82227", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:N/A:L", "severity": "high", "base_score": 8.5}]}, "cvss_score": 8.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:N/A:L", "cwe": "CWE-89", "description": "WPBulky - WordPress Bulk Edit Post Types 是 VillaTheme 开发的 WordPress 开源插件（GPL v2 及以上许可），用于在后台批量编辑文章、页面、媒体等内容类型，源码发布于 WordPress 官方插件目录。\n受影响版本中，插件经 admin-ajax.php 的 vi_wpbulky_ajax 接口（sub_action=add_filter_data）接收筛选参数并写入用户级瞬态，BULKYWP\\Admin\\Filters 在 posts_where 钩子回调 add_filter_to_posts_where 中把 post_date_from、post_date_to 直接拼进 WHERE 语句，text_search 又把检索值拼接进等值、LIKE 与 REGEXP 条件，相关值仅经过 sanitize_text_field 处理，单引号未被过滤，拥有 edit_posts 权限（贡献者及以上）的用户可注入恶意 SQL 语句，进而读取数据库中的敏感信息。\n修复版本中通过在 1.2.3 版本新增 sanitize_filter_date 对日期值执行 Y-m-d 格式校验、把日期与文本检索条件全部改为 $wpdb-\u003eprepare 参数化拼接，并为文本检索列引入白名单限制，切断了筛选参数进入 SQL 语句的注入路径。", "effects": [{"comp_name": "wpbulky", "ecosystem": "linux", "versions": [{"affected_version": "[1.0.0,1.2.3)", "min_fixed_version": "1.2.3", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", 询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-80488", "cvss": {}, "cvss_score": 8.2, "cvss_vector": "", "cwe": "CWE-89", "description": "WP Ultimate CSV Importer 是 Smackcoders 开发的 WordPress 开源插件（GPLv3），用于把 CSV、XML、Excel 数据批量导入 WordPress 文章、页面、用户、WooCommerce 以及 All In One SEO 等第三方扩展字段，官方统计活跃安装量超过 2 万。\n受影响版本中，具备 manage_options 权限的用户在后台通过 wp_ajax_StartImport 触发导入（SaveMapping::background_starts_function），经 fgetcsv 解析出的 CSV 字段值沿 main_import_process 进入 AllInOneSeoImport::all_seo_import_function，og_title、keyphrases、aioseo_title 等导入字段值被直接拼入 INSERT INTO wp_aioseo_posts 语句（182 行），Update 分支的列名与列值同样未经参数化（333 行），攻击者在映射为 AIOSEO 字段的 CSV 列中注入 SQL 片段，可改变语句结构并读取或改写数据库数据。\n修复版本中通过参数绑定消除拼接：9.0 将 Insert 分支改为固定列名的 $wpdb-\u003einsert()（post_id 取 %d、其余列取 %s），Update 分支新增 get_allowed_aioseo_columns() 列名白名单并以 $wpdb-\u003eupdate() 绑定列值，全部拼接式 SQL 被移除，注入路径被切断。", "effects": [{"comp_name": "wp_ultimate_csv_importer", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,9.0)", "min_fixed_version": "9.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-08-29", "level": "High", "mps_id": "MPS-90wm-6vdf", "poc": false, "poc_url": [], "published_time": "2026-08-29", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-90wm-6vdf", "name": "https://www.oscs1024.com/hd/MPS-90wm-6vdf"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-80488", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-80488"}, {"url": "https://wpscan.com/vulnerability/94ed94c8-88e9-4fe8-ad83-cacd4f39dd20/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "WP Ultimate CSV 导入器 SQL 注入", "_translated": true, "_saved_at": "2026-08-29T10:39:25+00:00", "_first_saved_at": "2026-08-29T10:39:25+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-90wm-6vdf"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "attack_vector_type": "Local", "cnvd_id": "", "cve_id": "CVE-2026-80725", "cvss": {}, "cvss_score": 7.8, "cvss_vector": "", "cwe": "CWE-787", "description": "Linux kernel 是开源的操作系统内核，其网络子系统通过 GRO（通用接收卸载）在接收路径聚合报文以提升吞吐，BIG TCP 特性允许 TCP 聚合超过 64KB 的超大报文。\n受影响版本中，net/core/gro.c 的 skb_gro_receive() 在判断聚合能否超过 64KB 时，使用 skb_headroom(p)（包含 mac_len 的总头部空间）代替 MAC 头之前的实际空间 p-\u003emac_header 来校验 HBH jumbo 头的插入空间，并且放行 VLAN（ETH_P_8021Q/ETH_P_8021AD）等非 IPv4/IPv6 协议流量以及 SIT 等封装流量。攻击者可通过 AF_PACKET 等途径注入 MAC 头前空间不足 8 字节的帧并构造 IPv6 TCP 流量，当聚合报文超过 64KB 时，ipv6_gro_complete() 插入 HBH jumbo 头的 memmove 会越过 skb-\u003ehead 向前写入，造成内核越界写入并回绕 skb-\u003emac_header。\n修复版本中通过在 skb_gro_receive() 内收紧 BIG TCP 聚合条件：要求 NAPI_GRO_CB(skb)-\u003eproto 为 IPPROTO_TCP、协议为 ETH_P_IP 或 ETH_P_IPV6、未被封装（NAPI_GRO_CB(skb)-\u003eencap_mark 与 p-\u003eencapsulation 均为否），并在 IPv6 场景下要求 p-\u003emac_header 不小于 sizeof(struct hop_jumbo_hdr)；不满足条件时返回 -E2BIG，使报文在 64KB 内正常刷出，从而消除越界写入。", "effects": [{"comp_name": "linux_kernel", "ecosystem": "linux", "versions": [{"affected_version": "[5.19,6.1.185)", "min_fixed_version": "6.1.185", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.19,7.0)", "min_fixed_version": "7.0", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.2,6.6.154)", "min_fixed_version": "6.6.154", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.7,6.12.106)", "min_fixed_version": "6.12.106", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.13,6.18.47)", "min_fixed_version": "6.18.47", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-08-29", "level": "High", "mps_id": "MPS-fmj9-6g0o", "poc": false, "poc_url": [], "published_time": "2026-08-29", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-fmj9-6g0o", "name": "https://www.oscs1024.com/hd/MPS-fmj9-6g0o"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-80725", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-80725"}, {"url": "https://git.kernel.org/stable/c/03cb8cc2961f5f781d12e903782cb3815ed84b1c", "name": ""}, {"url": "https://git.kernel.org/stable/c/37a5dcd6837fc2afc44a7bc3ed8af4e983783d46", "name": ""}, {"url": "https://git.kernel.org/stable/c/3ce832e2bd431d0c12ba525ed73ad8fbc4191da5", "name": ""}, {"url": "https://git.kernel.org/stable/c/81be30c1f5f2bffda1f04c0efd0746af10b9643a", "name": ""}, {"url": "https://git.kernel.org/stable/c/e907bf694ed55bdfe421be99dba35751a655df25", "name": ""}], "scope_influence": "", "tags": ["操作系统"], "title": "Linux内核GRO越界写入漏洞", "_translated": true, "_saved_at": "2026-08-29T10:39:22+00:00", "_first_saved_at": "2026-08-29T10:39:22+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-fmj9-6g0o"}, {"analysis_status": 0, "articles": [{"content": "- 条件竞争漏洞是由于程序中存在多个代码块同时访问同一个条件判断语句而导致的错误。在程序中，条件判断语句通常用于决定是否执行某些代码块。当一个程序有多个代码块同时访问同一个条件判断语句时，这些代码块可能会同时执行，从而导致程序执行结果出现不可预测的错误。", "title": "什么是竞争条件"}, {"content": "- 线程切换攻击：线程切换攻击是指攻击者通过利用竞争条件漏洞，使程序在执行时频繁切换线程，从而导致系统资源耗尽，最终实现拒绝服务攻击。\n- 内存泄漏攻击：内存泄漏攻击是指攻击者通过利用竞争条件漏洞，使得程序不断申请内存，但最终无法释放内存，从而导致内存泄漏，最终程序崩溃。\n- 缓存穿透攻击：缓存穿透攻击是指攻击者通过利用竞争条件漏洞，使得程序在访问缓存时，被缓存的数据并非当前最新的数据，从而攻击者可以获取到未更新的数据。\n- 指令重放攻击：指令重放攻击是指攻击者通过利用竞争条件漏洞，在程序执行时，将先前保存的指令序列重新执行，从而实现绕过某些验证，获取系统权限等攻击目的。\n", "title": "竞争条件常见的攻击方式"}, {"content": "- 使用互斥锁：在条件判断语句中，使用互斥锁来确保只有一个代码块能够访问变量。使用互斥锁可以提高程序的安全性和可靠性。\n- 使用条件封印：在条件判断语句中，将可能会修改变量的代码块封印起来，以确保这些代码块无法被其他代码块访问。\n- 使用条件过滤：在条件判断语句中，使用条件过滤来过滤掉那些不可能发生的条件判断语句。例如，对于一个包含多个条件判断语句的循环，可以只保留其中一个条件的判断，而将其他条件的判断语句过滤掉。\n- 使用性能优化：对于一些条件判断语句，可以使用性能优化来避免条件竞争的情况。例如，可以使用数组或链表等数据结构来存储条件判断语句中的变量，从而避免条件竞争的情况。", "title": "如何预防竞争条件"}], "cnvd_id": "", "cve_id": "CVE-2026-55784", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-362", "description": "free5GC 是开源 5G 核心网实现，其 AUSF 组件通过 SBI/N12 接口为 UE 提供接入认证服务，支持 5G-AKA 与 EAP-AKA' 认证流程，代码以 Go 语言开源发布。\n受影响版本中，AUSF 将每个签约用户的认证状态保存在以 SUPI 为唯一键的全局 sync.Map（AUSFContext.UePool）中，UeAuthPostRequestProcedure 为每个认证请求新建 AusfUeContext 并经 AddAusfUeContextToPool 执行 UePool.Store(Supi, ctx)，无条件覆盖同一 SUPI 的既有上下文；拥有 AUSF SBI/N12 接口访问权的攻击者可对同一目标 SUPI 并发发送 POST /nausf-auth/v1/ue-authentications 请求，使全部认证尝试共享同一逻辑上下文 URL，K_aut、XRES 与 EapID 被持续改写，合法 EAP-AKA' 响应随后被拿去与最新上下文比对，AT_MAC 完整性校验失败，目标签约用户的认证被持续拒绝。\n修复版本中通过，可通过在承载 SBI 接口的网络启用 mTLS 与 OAuth2 访问控制、限制 AUSF 端口暴露范围并对同一 SUPI 的认证请求限速来缓解该风险；上游公告给出的修复方向是以唯一认证会话标识替代 SUPI 作为 UePool 键并在上下文 URL 中返回该标识，或改用 Load _source_page": "https://www.oscs1024.com/hd/MPS-wkyl-r5m6"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-82655", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "high", "base_score": 7.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-89", "description": "Admidio 是 PHP 语言开发的开源会员管理系统，面向组织与团体提供用户、角色与权限管理能力，可通过 Composer 以 admidio/admidio 包安装部署。\n受影响版本中，模块页面 modules/groups-roles/lists_show.php 加载 system/common.php 后未校验登录状态，其读取 GET 参数 relation_type_list 并未经格式校验即拆分为数组传入 ListConfiguration，getSQL 方法在该文件第 989 行至第 996 行将数组元素以单引号包裹拼接进 urt_uuid IN (...) 子句并以空参数数组执行查询，攻击者可利用反斜杠转义闭合单引号注入任意 SQL，并借助子查询报错与正常响应的差异形成布尔盲注；配合 role_list 传入格式合法但不存在的 UUID 时角色权限检查不会执行，未认证攻击者可读取包括用户密 份验证和授权机制。\n- 数据加密：对于敏感信息，使用适当的加密算法对数据进行加密，包括数据传输和存储过程中的加密。\n- 错误处理和日志安全：正确处理错误情况，避免在错误消息中暴露敏感信息。同时，确保日志记录功能的安全性，避免将敏感信息记录在日志文件中。\n- 安全配置和最佳实践：遵循安全最佳实践，对应用程序、服务器和系统进行适当的配置，包括访问控制、权限管理、密码策略等。\n- 审计和监控：实施日志审计和监控机制，及时检测和响应任何异常活动或潜在的信息暴露事件。\n- 安全开发实践：在应用程序开发过程中，进行安全代码审查、漏洞扫描和安全测试，以及敏感信息的正确处理和保护。", "title": "如何预防未授权敏感信息泄露"}], "cnvd_id": "", "cve_id": "CVE-2026-82657", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "high", "base_score": 7.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-200", "description": "Admidio 是一个开源（GPL-2.0）的 PHP 会员与组织管理网站系统，提供论坛、公告、活动、相册等模块，并通过 RSS 输出各模块最新内容。\n受影响版本中，交互入口 modules/forum.php 与 modules/announcements.php 会对登录专用模式（forum_module_enabled、announcements_module_enabled 为 2）执行 $gValidLogin 校验，而公开入口 rss/forum.php 与 rss/announcements.php 仅在模式为 0 时抛出 SYS_MODULE_DISABLED，缺少同样的登录专用边界；匿名攻击者发送 GET 请求，ForumService::rssFeed 与 AnnouncementsService::rssFeed 检查 enable_rss 后调用 findAll(0, 50)，把最多 50 条登录用户才可见的论坛主题或公告写入 RSS，泄露标题、完整正文、作者姓名、分类与时间戳；未设置查看角色限制的分类（新建分类的默认状态）不会被访客角色的分类可见性过滤拦截。\n修复版本中通过在 rss/forum.php 与 rss/announcements.php 增加模式为 2 且未登录时抛出 SYS_NO_RIGHTS 的分支，并把 rss/events.php、rss/links.php、rss/photos.php 的模式判断统一为相同边界，使 RSS 入口与交互模块页面执行一致的登录专用限制，匿名请求被拒绝，登录用户才能查看的内容不再经 RSS 外泄。", "effects": [{"comp_name": "admidio/admidio", "ecosystem": "composer", "versions": [{"affected_version": "[0,5.0.12)", "min_fixed_version": "5.0.12", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploi 序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-82475", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N", "severity": "high", "base_score": 8.1}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-862", "description": "astron-agent 是科大讯飞开源的企业级 Agentic Workflow 开发平台，采用 Apache 2.0 协议，提供 AI 工作流编排、模型管理、AI 与 MCP 工具集成、RPA 自动化及多租户团队协作等能力，其 console 后台基于 Java Spring Boot 实现。\n受影响版本中，console 后台的 GET /workflow/copy-flow 接口由 WorkflowController.copyFlow 接收 sourceFlowId 与 targetFlowId 后直接转入 WorkflowService.copyFlow，该方法仅按 flowId 等值查询源、目标两条工作流记录，未调用同类工作流操作普遍使用的 dataPermissionCheckTool 归属与可见性校验，随后将源工作流的完整 data 写入目标工作流并落库；flowId 为时间有序的雪花整数，可被登录用户枚举，也会随已发布 Bot 的公开服务地址暴露，攻击者枚举其他租户的 flowId 后可越权覆盖其工作流定义，或将他人私密工作流复制到自己名下再通过常规详情接口读取完整定义。\n修复版本中通过在复制前调用 dataPermissionCheckTool.checkWorkflowVisible 校验源工作流对当前用户的可见性，调用 assertTopLeve  字符串格式化攻击：攻击者通过控制格式化字符串的输入，可以读取或写入任意内存位置，从而执行恶意操作。", "title": "缓冲区溢出常见的攻击方式"}, {"content": "- 输入验证和边界检查：对于所有接受用户输入的缓冲区操作，确保验证输入数据的长度和内容，以避免缓冲区溢出或下溢。\n- 使用安全的字符串操作函数：使用安全的字符串操作函数（如strncpy、strncat）替代不安全的函数（如strcpy、strcat），这些函数会在操作时自动限制操作的边界。\n- 使用内存安全工具：使用内存安全工具（如内存分析器、静态分析工具）来检测和修复潜在的缓冲区溢出问题。\n- 采用安全编码实践：遵循安全编码实践，如最小特权原则、避免使用不受信任的输入等。\n- 定期更新和修补程序：及时应用程序厂商提供的安全更新和补丁，以修复已知的缓冲区溢出漏洞。\n- 使用编程语言和框架提供的安全功能：利用编程语言和框架提供的安全特性，如内存安全函数、边界检查等。", "title": "如何预防缓冲区溢出"}], "cnvd_id": "", "cve_id": "CVE-2026-82539", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:N/AC:L/Au:M/C:C/I:C/A:C", "severity": "high", "base_score": 8.3}], "cvssv31": [{"source": "cna@vuldb.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.1}], "cvssv4": [{"source": "cna@vuldb.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.5}]}, "cvss_score": 8.5, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-119", "description": "TOTOLINK A720R 是 TOTOLINK 公司的闭源无线路由器产品，其固件中的 cstecgi.cgi 程序负责处理 Web 管理界面下发的 CGI 请求。\n受影响版本中，cstecgi.cgi 的 setMacFilterRules 函数在处理 MAC 地址过滤规则时，通过 websGetVar 读取请求中的 desc 参数，并使用 strcpy 将该参数复制到大小为 22 字节的栈缓冲区 acStack_c2 中，全程未做长度校验；固件编译时未启用栈保护且未启用地址随机化，已认证的管理员向 /cgi-bin/cstecgi.cgi 提交 topicurl 为 setMacFilterRules、desc 参数超长的请求能够覆写保存的返回地址并劫持进程控制流，公开分析已演示可跳转到二进制内已有的休眠、重启、注销登录、清除日志和开启 Telnet 服务等代码路径。\n修复版本中通过官方后续固件更新消除该越界复制，当前官方尚未发布修复版本，公开资料未披露修复代码；在官方修复发布前，可通过限制 Web 管理界面访问范围、修改管理员默认口令并将管理接口仅暴露给可信网络降低被利用风险。", "effects": [{"comp_name": "a720r", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,4.1.5cu.630_B20250509]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": tr pt 与 log_subcmds 选项提供命令拦截和子命令审计能力。\n受影响版本中，sudo 在 sudoers 启用 intercept 或 log_subcmds 后进入基于 ptrace 的拦截模式，seccomp 过滤器同时拦截 execve(2) 与 execveat(2)，但监视进程在 ptrace_intercept_execve 中对 __NR_execveat、X32_execveat 与 COMPAT_execveat 分支直接返回放行，不执行 intercept_check_policy，该放行逻辑用于支撑 sudo 自身 fdexec 设置依赖的 fexecve(3)；被授权运行特定命令的本地用户可在被追踪进程内直接调用 execveat(2) 或经 glibc fexecve(3) 执行 sudoers 未授权的程序，绕过策略限制且不产生命令日志。\n修复版本中通过将 execveat(2) 纳入统一拦截策略实现修复：ptrace_intercept_execve 以 is_execveat 标记该系统调用并继续执行 intercept_check_policy，get_exec_info 按 dirfd、path、argv、envp、flags 五参数读取入参，并借助 /proc/PID/fd/N 与 /proc/PID/cwd 解析 AT_EMPTY_PATH、相对路径及 /proc/self/fd/N 形式的目标，使未授权程序被拒绝执行并进入日志记录。", "effects": [{"comp_name": "sudo", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.9.17p2]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "保护机制失效", "kind_en": "保护机制失效", "last_modified_time": "2026-08-30", "level": "High", "mps_id": "MPS-okxw-8fig", "poc": false, "poc_url": [], "published_time": "2026-08-30", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-okxw-8fig", "name": "https://www.oscs1024.com/hd/MPS-okxw-8fig"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-82474", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-82474"}, {"url": "https://github.com/sudo-project/sudo", "name": ""}, {"url": "https://github.com/sudo-project/sudo/blob/v1.9.17p2/src/exec_ptrace.c", "name": ""}, {"url": "https://github.com/sudo-project/sudo/commit/71fbe42dcd5a1c8f799540583a2dfb2ae6221edf", "name": ""}, {"url": "https://www.vulncheck.com/advisories/sudo-through-1.9-17p2-intercept-policy-bypass-via-execveat", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "sudo execveat 策略绕过漏洞", "_translated": true, "_saved_at": "2026-08-29T19:04:14+00:00", "_first_saved_at": "2026-08-29T19:04:14+00:00", "_source_pag ""}, {"url": "https://github.com/erlef/oidcc/security/advisories/GHSA-533g-4vf3-xwrj", "name": ""}, {"url": "https://osv.dev/vulnerability/EEF-CVE-2026-75759", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-75759漏洞", "_translated": true, "_saved_at": "2026-08-30T06:13:33+00:00", "_first_saved_at": "2026-08-30T06:13:33+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-q7zt-2jya"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2026-75807", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:R/S:U/C:H/I:H/A:H", "cwe": "CWE-287", "description": "SAML Single Sign On – SSO Login 是 miniOrange 发布在 WordPress.org 官方插件目录的开源插件（GPL/Expat 许可），用于在 WordPress 站点与 Okta、Entra ID、Google Workspace 等 SAML 2.0 身份提供商之间建立单点登录。\n受影响版本中，注册在 WordPress init 钩子上的 mo_saml_handle_login_validate() 会把任意访问者提交的 $_POST['SAMLResponse'] 交给 class-mo-saml-login-validate.php 中的 mo_saml_login_validate() 处理，该 ACS 处理器在产生签名校验结论之前（5.4.6 第 236 行）执行 update_option(MO_SAML_REQUIRED_CERTIFICATE, $saml_required_certificate)，把报文中携带的 X.509 证书持久化到 mo_saml_required_certificate 选项，而签名验证所依赖的 mo_saml_find_certificate()（class-mo-saml-utilities.php 第 739 行）在证书指纹不匹配时仅返回 false、不终止请求，未认证攻击者可借此把该选项替换为自有证书；当管理员在测试配置中收到 test_config_error_wpsamlerr004 证书不匹配提示并点击修复按钮后，第 292 行的 mo_saml_fix_certificate 分支会把该选项内容写入受信任的 X509_CERTIFICATE 配置，攻击者随后可用自有私钥为包括管理员在内的任意 WordPress 账户伪造 SAML 断言并获得完整特权会话。\n修复版本中通过删除签名校验结论产生前的证书持久化操作并整体移除 mo_saml_fix_certificate 一键修复分支，收到的证书仅在测试配置错误页经由 mo_saml_display_test_config_error_page()/mo_saml_render_certificate_mismatch_details() 转义展示供管理员人工核对、不再写入数据库，切断了攻击者证书被提升为受信任 IdP 签名证书的利用链。", "effects": [{"comp_name": "miniorange-saml-20-single-sign-on", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,5.4.7)", "min_fixed_version": "5.4.7", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "身份验证不当", "kind_en": "认证不当", "last_modified_time": "2026-08-30", "level": "High", "mps_id": "MPS-6ers-2zqf", "poc": false, "poc_url": [], "published_time": "2026-08-30", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-6ers-2zqf", "name": "https://www.oscs1024.com/hd/MPS-6ers-2zqf"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-75807", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-75807"}, {"url": "https://plugins.trac.wordpress.org/browser/miniorange-saml-20-single-sign-on/tags/5.4.6/class-mo-saml-login-validate.php#L236", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/miniorange-saml-20-single-sign-on/tags/5.4.6/class-mo-saml-login-validate.php#L292", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/miniorange-saml-20-single-sign-on/tags/5.4.6/class-mo-saml-utilities.php#L739", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/miniorange-saml-20-single-sign-on/tags/5.4.6/mo-saml-settings-pag 径。", "effects": [{"comp_name": "ash_postgres", "ecosystem": "linux", "versions": [{"affected_version": "[0.25.0,2.13.0)", "min_fixed_version": "2.13.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "未加检查的返回值", "kind_en": "Unchecked Return Value", "last_modified_time": "2026-08-31", "level": "High", "mps_id": "MPS-i5sl-nwr1", "poc": false, "poc_url": [], "published_time": "2026-08-31", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-i5sl-nwr1", "name": "https://www.oscs1024.com/hd/MPS-i5sl-nwr1"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-78699", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-78699"}, {"url": "https://cna.erlef.org/cves/CVE-2026-78699.html", "name": ""}, {"url": "https://github.com/ash-project/ash_postgres/commit/8544ab15fe45784553c2d2da8ee1a388eee0174b", "name": ""}, {"url": "https://github.com/ash-project/ash_postgres/security/advisories/GHSA-6fqq-j9c4-5766", "name": ""}, {"url": "https://osv.dev/vulnerability/EEF-CVE-2026-78699", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "AshPostgres跨租户访问漏洞", "_translated": true, "_saved_at": "2026-08-30T17:06:58+00:00", "_first_saved_at": "2026-08-30T17:06:58+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-i5sl-nwr1"}]}</script>
  <script>
    const payload = JSON.parse(document.getElementById("payload").textContent);
    const levelLabels = payload.level_labels || {};
    const items = payload.items || [];
    let filtered = items.slice();
    let activeId = null;

    const $ = (id) => document.getElementById(id);
    $("generatedAt").textContent = payload.generated_at || "-";
    $("retention").textContent = payload.retention_days ?? "-";
    $("cutoff").textContent = payload.cutoff_date || "-";
    $("count").textContent = String(payload.count ?? items.length);

    function levelClass(level) {
      const cn = levelLabels[level] || level || "";
      if (level === "Critical" || cn === "严重") return "crit";
      if (level === "High" || cn === "高危") return "high";
      return "other";
    }
    function levelText(level) {
      return levelLabels[level] || level || "-";
    }
    function esc(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }
    function scoreText(v) {
      if (v === null || v === undefined || v === "" || v === -1) return "-";
      return String(v);
    }

    function renderList() {
      const list = $("list");
      $("listCount").textContent = String(filtered.length);
      if (!filtered.length) {
        list.innerHTML = '<div class="empty">没有匹配项</div>';
        return;
      }
      list.innerHTML = filtered.map((it) => {
        const id = it.mps_id || it.cve_id;
        const active = id === activeId ? " active" : "";
        return `
          <button class="item${active}" data-id="${esc(id)}" type="button">
            <div class="item-top">
              <span class="cve">${esc(it.cve_id || it.mps_id || "-")}</span>
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
            </div>
            <div class="title">${esc(it.title || "-")}</div>
            <div class="item-foot">
              <span>CVSS ${esc(scoreText(it.cvss_score))}</span>
              <span>${esc(it.published_time || "-")}</span>
              ${it.poc ? "<span>POC</span>" : ""}
            </div>
          </button>`;
      }).join("");
      list.querySelectorAll(".item").forEach((btn) => {
        btn.addEventListener("click", () => selectById(btn.dataset.id));
      });
    }

    function refsHtml(it) {
      const refs = Array.isArray(it.reference_url_list) ? it.reference_url_list : [];
      const links = [];
      if (it._source_page) links.push({ url: it._source_page, name: "OSCS 详情" });
      if (it.cve_id) links.push({ url: `https://nvd.nist.gov/vuln/detail/${it.cve_id}`, name: "NVD" });
      refs.forEach((r) => {
        if (r && r.url) links.push({ url: r.url, name: r.name || r.url });
      });
      const seen = new Set();
      const uniq = [];
      for (const l of links) {
        if (seen.has(l.url)) continue;
        seen.add(l.url);
        uniq.push(l);
      }
      if (!uniq.length) return '<div class="box">无参考链接</div>';
      return `<div class="refs">${uniq.map((l) =>
        `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name || l.url)}</a>`
      ).join("")}</div>`;
    }

    function articlesHtml(it) {
      const arts = Array.isArray(it.articles) ? it.articles : [];
      if (!arts.length) return "";
      return `<div class="section"><h3>相关说明</h3>${arts.map((a) => `
        <div class="article">
          <h4>${esc(a.title || "说明")}</h4>
          <p>${esc(a.content || "")}</p>
        </div>`).join("")}</div>`;
    }

    function renderDetail(it) {
      const detail = $("detail");
      if (!it) {
        detail.innerHTML = '<div class="empty">暂无数据</div>';
        return;
      }
      const pocUrls = Array.isArray(it.poc_url) ? it.poc_url : [];
      detail.innerHTML = `
        <div class="d-head">
          <div>
            <h1 class="d-title">${esc(it.title || "-")}</h1>
            <div class="ids">
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
              <span class="chip">${esc(it.cve_id || "无 CVE")}</span>
              <span class="chip">${esc(it.mps_id || "-")}</span>
              ${it.poc ? '<span class="chip">有 POC</span>' : ""}
              ${it.exp ? '<span class="chip">有 EXP</span>' : ""}
            </div>
          </div>
          <div class="actions">
            ${it._source_page ? `<a class="btn" href="${esc(it._source_page)}" target="_blank" rel="noopener">OSCS</a>` : ""}
            ${it.cve_id ? `<a class="btn" href="https://nvd.nist.gov/vuln/detail/${esc(it.cve_id)}" target="_blank" rel="noopener">NVD</a>` : ""}
          </div>
        </div>
        <div class="grid">
          <div class="stat"><div class="k">CVSS</div><div class="v">${esc(scoreText(it.cvss_score))}</div></div>
          <div class="stat"><div class="k">向量</div><div class="v">${esc(it.cvss_vector || "-")}</div></div>
          <div class="stat"><div class="k">CWE</div><div class="v">${esc(it.cwe || "-")}</div></div>
          <div class="stat"><div class="k">类型</div><div class="v">${esc(it.kind || it.kind_en || "-")}</div></div>
          <div class="stat"><div class="k">公开</div><div class="v">${esc(it.published_time || "-")}</div></div>
          <div class="stat"><div class="k">利用成本</div><div class="v">${esc(it.exploit_requirement_cost || "-")}</div></div>
          <div class="stat"><div class="k">可利用性</div><div class="v">${esc(it.exploitability || "-")}</div></div>
          <div class="stat"><div class="k">修复建议</div><div class="v">${esc(it.fix_suggestion || "-")}</div></div>
        </div>
        <div class="section"><h3>描述</h3><div class="box">${esc(it.description || "无描述")}</div></div>
        ${it.scope_influence ? `<div class="section"><h3>影响范围</h3><div class="box">${esc(it.scope_influence)}</div></div>` : ""}
        ${pocUrls.length ? `<div class="section"><h3>POC 链接</h3><div class="refs">${pocUrls.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join("")}</div></div>` : ""}
        <div class="section"><h3>参考链接</h3>${refsHtml(it)}</div>
        ${articlesHtml(it)}
      `;
    }

    function selectById(id) {
      const it = filtered.find((x) => (x.mps_id || x.cve_id) === id) ||
                 items.find((x) => (x.mps_id || x.cve_id) === id);
      if (!it) return;
      activeId = it.mps_id || it.cve_id;
      renderList();
      renderDetail(it);
      const btn = document.querySelector(`.item[data-id="${CSS.escape(activeId)}"]`);
      if (btn) btn.scrollIntoView({ block: "nearest" });
      history.replaceState(null, "", "#" + encodeURIComponent(activeId));
    }

    function applyFilter(q) {
      const query = (q || "").trim().toLowerCase();
      filtered = !query ? items.slice() : items.filter((it) => {
        const blob = [
          it.cve_id, it.mps_id, it.title, it.kind, it.kind_en, it.cwe, it.description, it.level
        ].map((x) => String(x || "").toLowerCase()).join(" ");
        return blob.includes(query);
      });
      renderList();
      if (filtered.length) {
        const still = filtered.some((x) => (x.mps_id || x.cve_id) === activeId);
        selectById(still ? activeId : (filtered[0].mps_id || filtered[0].cve_id));
      } else {
        activeId = null;
        renderDetail(null);
      }
    }

    $("search").addEventListener("input", (e) => applyFilter(e.target.value));

    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement !== $("search")) {
        e.preventDefault();
        $("search").focus();
        return;
      }
      if (!filtered.length) return;
      const idx = filtered.findIndex((x) => (x.mps_id || x.cve_id) === activeId);
      if (e.key === "ArrowDown") {
        e.preventDefault();
        const next = filtered[Math.min(filtered.length - 1, Math.max(0, idx) + 1)];
        selectById(next.mps_id || next.cve_id);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        const prev = filtered[Math.max(0, idx - 1)];
        selectById(prev.mps_id || prev.cve_id);
      }
    });

    const hashId = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    if (hashId && items.some((x) => (x.mps_id || x.cve_id) === hashId)) {
      activeId = hashId;
      renderList();
      selectById(hashId);
    } else if (items.length) {
      selectById(items[0].mps_id || items[0].cve_id);
    } else {
      renderList();
      renderDetail(null);
    }
  </script>
</body>
