  <style>

      --radius: 16px;

    * { box-sizing: border-box; }
    html, body {

      background-size: 28px 28px;
      mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
    }
    .shell {

      margin: 0 auto;
      padding: 28px 20px 40px;
      display: grid;
      gap: 18px;
      min-height: 100vh;
    }
    header.hero {

      gap: 10px;
      padding: 22px 24px;
      border: 1px solid var(--line);

    .brand {

    .sub {

      font-size: 0.78rem;
      color: var(--muted);
    }
    .meta b { color: var(--text); font-weight: 500; }

      grid-template-columns: minmax(280px, 360px) 1fr;
      gap: 16px;
      min-height: 70vh;
    }
    @media (max-width: 900px) {

    }

      flex-direction: column;
      gap: 6px;

      padding: 12px;
      background: transparent;
      color: inherit;

      justify-content: space-between;
      margin-bottom: 14px;

      letter-spacing: -0.02em;
      margin: 0 0 8px;

      border: 1px solid var(--line);
      color: #cfe4da;

is_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-137090", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-78", "description": "build-git-clone 是一个用 TypeScript 编写、以 MIT 许可证发布的开源 npm 包，用于把 Git 仓库克隆到指定目录，并支持在克隆完成后执行附加命令。\n受影响版本中，库导出的 clone() 函数把调用方传入的 url 参数未做转义地拼接进 cd \u003c目标目录\u003e \u0026\u0026 git clone \u003curl\u003e . 命令字符串，再交给内部 exec() 函数执行；exec() 在非 Windows 平台以 sh -c、在 Windows 平台以 cmd /C 调用 child_process.spawn 运行该字符串，url 中的 ; 或 $() 等 shell 元字符被 shell 解释，攻击者通过传入携带这些元字符的仓库 URL，即可以 Node.js 进程权限执行任意系统命令（src/index.ts 第 77 :L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:Clear", "cwe": "CWE-862", "description": "Vertex AI 是 Google Cloud 提供的全托管机器学习与生成式 AI 平台，Vertex AI Assistant 为其控制台内置的 AI 助手功能，用户可在 Google Cloud 控制台中通过聊天方式获取模型开发与云资源操作辅助，该组件为闭源托管形态，无需用户自行部署。\n受影响版本中，Vertex AI 私有控制台 API 在处理 Vertex AI Assistant 聊天会话的列出、读取、创建与发送消息等操作时未校验请求者与会话归属的授权关系，构成 CWE-862 定义的授权缺失，未经身份验证的远程攻击者通过构造 API 请求可列出、读取其他用户的聊天会话内容，并可在他人会话中创建与发送消息，导致跨用户会话数据泄露与会话内容被伪造。\n修复版本中通过在服务端补齐私有控制台 API 对聊天会话操作的授权校验，拒绝未授权的会话访问与写入请求，切断未经身份验证请求触达其他用户聊天会话的路径，Google 已于 2026-04-13 完成修复并下发至托管服务，客户无需执行任何操作。", "effects": [{"comp_name": "vertex_ai", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2026-04-13)", "min_fixed_version": "2026-04-13", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-11-27", "level": "Critical", "mps_id": "MPS-2gp1-rdln", "poc": false, "poc_url": [], "published_time": "2026-11-27", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-2gp1-rdln", "name": "https://www.oscs1024.com/hd/MPS-2gp1-rdln"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-85258", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-85258"}, {"url": "https://docs.cloud.google.com/vertex-ai/docs/release-notes#April_13_2026", "name": ""}], "scope_influence": "", "tags": ["AI", "应用软件"], "title": "Vertex AI助手越权漏洞", "_translated": true, "_saved_at": "2026-11-27T14:35:37+00:00", "_first_saved_at": "2026-11-27T14:35:37+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-2gp1-rdln"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-138003", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:N/AC:H/Au:N/C:C/I:C/A:C", "severity": "high", "base_score": 7.6}], "c , "kind": "栈缓冲区溢出", "kind_en": "基于堆栈的缓冲区溢出", "last_modified_time": "2026-11-28", "level": "Critical", "mps_id": "MPS-ma3i-k5f0", "poc": false, "poc_url": [], "published_time": "2026-11-28", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ma3i-k5f0", "name": "https://www.oscs1024.com/hd/MPS-ma3i-k5f0"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-138003", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-138003"}, {"url": "https://vuldb.com/vuln/444938", "name": "VDB-444938 | TRENDnet TEW-751DR UPnP/WFA wfadev.cgi FUN_0040ed90 stack-based overflow"}, {"url": "https://vuldb.com/vuln/444938/cti", "name": "VDB-444938 | CTI Indicators (IOB, IOC, IOA)"}, {"url": "https://vuldb.com/cve/CVE-2026-138003", "name": "CVE-2026-138003 | CVE Analysis and Report"}, {"url": "https://vuldb.com/submit/1066758", "name": "Submit #1066758 | TRENDnet TEW-751DR 1.03B01 Stack-based Buffer Overflow (CWE-121)"}, {"url": "https://gist.github.com/qwq-nm/4120495fb8a560921da0f102fa90fa0d", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "TRENDnet路由器栈溢出漏洞", "_translated": true, "_saved_at": "2026-11-27T23:08:52+00:00", "_first_saved_at": "2026-11-27T23:08:52+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ma3i-k5f0"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-129243", "cvss": {}, "cvss_score": 8.8, "cvss_vector": "", "cwe": "CWE-863", "description": "GeoServer 是开源 Java 地理空间数据服务器，gs-ows 模块中的 Dispatcher 负责解析并分发 WMS、WFS 等 OGC Web 服务请求。\n受影响版本中，Dispatcher.findService 在选择服务实现前会截去服务标识里第一个斜杠及其之前的前缀，但 Request.service 仍保存请求中的原始服务名。OperationSecurityCallback.operationDispatched 用该原始值匹配 security/services.properties 中的服务安全规则，名称不能命中时规则不会生效。默认配置只允许管理员调用 wfs.CreateStoredQuery 和 wfs.DropStoredQuery，未认证请求使用带前缀的服务名可以创建或删除 WFS 存储查询。图层与数据安全规则仍然生效。\n修复版本中通过在 Dispatcher.service 解析出实际服务后，将 Request.service 改写为 serviceDescriptor.getId()，使后续服务安全检查按实际执行的服务标识匹配规则，带前缀的服务名不能再绕过默认的存储查询权限限制。", "effects": [{"comp_name": "geoserver", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.27.7)", "min_fixed_version": "2.27.7", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[2.28.0,2.28.6)", "min_fixed_version": "2.28.6", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[3.0.0,3.0.2)", "min_fixed_version": "3.0.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "org.geoserver:gs-ows", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,2.27.7)", "min_fixed_version": "2.27.7", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[2.28.0,2.28.6)", "min_fixed_version": "2.28.6", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[3.0.0,3.0.2)", "min_fixed_version": "3.0.2", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-11-25", "level": "High", "mps_id": "MPS-8081-8bc7", "poc": false, "poc_url": [], "published_time": "2026-11-25", "reference_url_list": [{"url": "https://github.com/geoserver/geoserver/security/advisories/GHSA-rv5g-g2r9-58rj", "name": ""}, {"url": "https://geoserver.org/vulnerability/2026/11/23/cve-update.html", "name": ""}, {"url": "https://osgeo-org.atlassian.net/browse/GEOS-12195", "name": ""}, {"url": "https://github.com/geoserver/geoserver/pull/9922", "name": ""}, {"url": "https://github.com/geoserver/geoserver/commit/e5a79f69fc6d3375fc562ca89799a01796b58e9c", "name": ""}, {"url": "https://github.com/geoserver/geoserver/commit/a43218e551a45a9b103030b13553b3f8293813fe", "name": ""}, {"url": "https://github.com/geoserver/geoserver/commit/9a6169e6c0c96dcdd49c5566ad0e00852095548e", "name": ""}, {"url": "https://github.com/geoserver/geoserver/commit/d116fc8a171233b03468be17e88a76c83cfd5132", "name": ""}, {"url": "https://docs.geoserver.org/stable/en/user/security/service/", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "GeoServer服务授权绕过", "_translated": true, "_saved_at": "2026-11-25T02:53:54+00:00", "_first_saved_at": "2026-11-25T02:53:54+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-8081-8bc7"}, {"analysis_status": 0, "articles": [{"content": "跨站点请求伪造 (CSRF)通过利用网站对用户请求的信任进行攻击。当用户在网站A登录并在同一浏览器会话中访问网站B时，攻击者可以构造特制的请求并诱使用户执行，以使网站B误以为这些请求是用户合法发起的。\n攻击者通常通过欺骗用户点击恶意链接、在受信任的网站中植入恶意代码或通过钓鱼等手段来实施CSRF攻击，一旦用户执行了恶意请求，攻击者可以以用户的身份执行任意操作，包括更改用户密码、发起资金转账或删除重要数据等。", "title": "什么是CSRF"}, {"content": "- 链接欺骗：攻击者通过向用户发送包含恶意链接的电子邮件或社交媒体消息，诱使用户点击并执行恶意请求。\n- 图片引用攻击：攻击者通过在恶意网站上包含指向目标网站的图片引用，以触发用户浏览器自动发送目标网站的请求。\n- XSS利用：如果目标网站存在XSS漏洞，攻击者可以注入恶意脚本，以使用户在浏览器中执行恶意请求。", "title": "CSRF常见的攻击方式"}, {"content": "- 随机令牌：网站可以在每个请求中包含一个随机生成的令牌（CSRF Token），并验证该令牌的有效性，以确认请求的来源是合法的。\n- SameSite Cookie：使用SameSite属性来限制跨站点请求，将Cookie的发送限制在同一站点上，减少了跨站请求伪造的风险。\n- 双重验证：对于敏感操作，网站可以要求用户进行额外的验证，例如输入验证码、提供第二个因素的身份验证等。\n- 强化浏览器策略：网站可以设置Content-Security-Policy（CSP）头，限制浏览器执行恶意脚本的能力，减少CSRF攻击的风险。\n- 限制用户操作：网站可以要求用户在执行敏感操作之前进行明确的确认或授权，防止恶意请求被误触发。\n- 安全编码实践：开发人员应遵循安全编码实践，对用户输入进行适当的验证和过滤，防止恶意请求的注入。", "title": "如何预防CSRF"}], "cnvd_id": "", "cve_id": "CVE-2026-82359", "cvss": {}, "cvss_score": 8.8, "cvss_vector": "", "cwe": "CWE-352", "description": "Apache JSPWiki 是开源 Java Wiki 引擎，基于 Servlet 与 JSP 提供页面编辑、附件管理以及用户和权限控制。受影响发布物为 Maven 构件 org.apache.jspwiki:jspwiki-war，源码仓库为 apache/jspwiki。\n受影响版本中，3.0.0 的 jspwiki.war 没有在 WEB-INF/web.xml 注册 CsrfProtectionFilter。该过滤器只声明在 jspwiki-http-3.0.0.jar 的 META-INF/web-fragment.xml，并映射到 /*。该片段使用 Java EE 3.0 描述符，war 的 web.xml 使用 Jakarta Servlet 5.0 描述符。厂商公告确认该 CSRF 防护配置未生效，过滤器没有进入请求处理链。CsrfProtectionFilter.doFilter 不会在 POST 请求中比较参数 X-XSRF-TOKEN 与 Session.antiCsrfToken()，无效令牌也不会被重定向到 /error/Forbidden.html。已登录用户在跨站页面提交 POST 后，可以绕过同步令牌校验，执行页面删除、重命名、安装参数提交或工作流决策等状态变更。\n修复版本中通过将 CsrfProtectionFilter 及 url-pattern /* 写入 jspwiki-war 的 WEB-INF/web.xml，并删除 jspwiki-http 模块的 META-INF/web-fragment.xml，使 3.0.1 在部署时注册该过滤器。POST 请求重新进入 doFilter，令牌不匹配的请求被重定向到 /error/Forbidden.html。", "effects": [{"comp_name": "org.apache.jspwiki:jspwiki-war", "ecosystem": "maven", "versions": [{"affected_version": "[3.0.0,3.0.1)", "min_fixed_version": "3.0.1", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "CSRF", "kind_en": "跨站请求伪造 (CSRF)", "last_modified_time": "2026-11-25", "level": "High", "mps_id": "MPS-8de8-1460", "poc": false, "poc_url": [], "published_time": "2026-11-25", "reference_url_list": [{"url": "http://www.mail-archive.com/announce@apache.org/msg12814.html", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-82359", "name": ""}, {"url": "https://issues.apache.org/jira/browse/JSPWIKI-1303", "name": ""}, {"url": "https://jspwiki.apache.org/", "name": ""}, {"url": "https://github.com/apache/jspwiki/commit/96bffc7d8333dd97a190d66dc0a3371cca005bc3", "name": ""}, {"url": "https://github.com/apache/jspwiki/commit/96374c1d8f22d596ecc98a7a5bb9222683a444c2", "name": ""}, {"u "tags": ["java", "开源"], "title": "GeoServer WFS XML注入", "_translated": true, "_saved_at": "2026-11-25T02:53:52+00:00", "_first_saved_at": "2026-11-25T02:53:52+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-a5a2-ffd4"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-133442", "cvss": {}, "cvss_score": 8.6, "cvss_vector": "", "cwe": "CWE-89", "description": "Hibernate ORM 是 Red Hat 主导的开源 Java 对象关系映射框架，提供 HQL 查询语言与面向多种数据库方言的 SQL 生成能力，受影响代码位于通过 Maven 坐标 org.hibernate.orm:hibernate-core 分发的核心模块。\n受影响版本中，当目标方言不支持 JSON 路径 passing 子句时（对应 MySQL 与 MariaDB 的 json_* HQL 函数渲染器），JsonValueFunction、JsonQueryFunction、JsonExistsFunction 等函数描述符会调用 JsonPathHelper.appendInlinedJsonPathIncludingPassingClause，把 passing 参数的字面值直接内联到 JSON 路径字符串中，并作为内联 SQL 字符串字面量拼入语句。该路径上的转义逻辑 JsonPathHelper.appendJsonPassingLiteralValue 只对单引号做双写处理，不转义反斜杠，而 MySQL 与 MariaDB 默认把反斜杠视为字符串字面量内的转义字符，攻击者通过 passing 路径参数传入以反斜杠结尾的字符串可以吞掉内联字面量的闭合引号，使后续受控内容被数据库当作 SQL 解析，形成一阶 SQL 注入，可绕过授权并读取、篡改数据库数据。\n修复版本中通过引入方言感知的字面量转义机制切断上述注入链路：SqlAppender、LiteralSupport 与 Dialect 新增 appendLiteral 与 appendLiteralContent 方法，JsonValueFunction 等 JSON 函数渲染器改为经方言转义后输出 JSON 路径片段与 passing 值，MySQLDialect 与 MySQLLegacyDialect 在未启用 NO_BACKSLASH_ESCAPES 时对反斜杠做双写转义，消除以反斜杠破坏字符串边界的可能。", "effects": [{"comp_name": "hibernate_orm", "ecosystem": "linux", "versions": [{"affected_version": "[7.3.0.CR1,7.4.17.Final)", "min_fixed_version": "7.4.17.Final", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[8.0.0.Alpha1,8.0.0.CR2)", "min_fixed_version": "8.0.0.CR2", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[7.0.0.Beta2,7.2.26.Final)", "min_fixed_version": "7.2.26.Final", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "org.hibernate.orm:hibernate-core", "ecosystem": "maven", "versions": [{"affected_version": "[7.0.0.Beta2,7.2.26.Final)", "min_fixed_version": "7.2.26.Final", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[7.3.0.CR1,7.4.17.Final)", "min_fixed_version": "7.4.17.Final", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[8.0.0.Alpha1,8.0.0.CR2)", "min_fixed_version": "8.0.0.CR2", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-11-25", "level": "High", "mps_id": "MPS-ccd2-3817", "poc": false, "poc_url": [], "published_time": "2026-11-25", "reference_url_list": [{"url": "https://www.ibm.com/support/pages/node/7297919", "name": ""}, {"url": "https://github.com/hibernate/hibernate-orm/security/advisories/GHSA-v5mr-59hq-7mvm", "name": ""}, {"url": "https://hibernate.atlassian.net/browse/HHH-21164", "name": ""}, {"url": "https://github.com/hibernate/hibernate-orm/commit/61f3bad1f7b0a43f984b028f8756d931ee3890cc", "name": ""}, {"url": "https://github.com/hibernate/hibernate-orm/commit/8443783b1d8bd1abb8c3e9b3a749f80c0f2fda32", "name": ""}, {"url": "https://github.com/hibernate/hibernate-orm/commit/3299d2b76f5cfee2a2ffee19ca22f 026-80283", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-80283"}, {"url": "https://www.dell.com/support/kbdoc/en-us/000503504/dsa-2026-386-security-update-for-dell-secure-connect-gateway-virtual-edition-multiple-vulnerabilities", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "Dell SCG VE身份认证缺失漏洞", "_translated": true, "_saved_at": "2026-11-25T11:59:09+00:00", "_first_saved_at": "2026-11-25T11:59:09+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-f6ro-7381"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-80273", "cvss": {"cvssv31": [{"source": "security_alert@emc.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.4}]}, "cvss_score": 8.4, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-78", "description": "Dell Secure Connect Gateway (SCG) Virtual Edition 是 Dell 提供的闭源商业虚拟设备，以虚拟机镜像形式部署，用于在客户数据中心与 Dell 后端支持服务之间建立安全连接，承担设备发现、远程支持、遥测收集与更新分发等管理功能。\n受影响版本中，设备在处理进入操作系统命令执行路径的输入时未对特殊元素进行正确中和，具备设备本地访问权限的攻击者可以借助该缺陷注入并执行任意操作系统命令，进而获得权限提升，最终导致设备机密性、完整性与可用性完全丧失。\n修复版本中通过官方安全更新修正对操作系统命令特殊元素的中和处理，阻止注入内容被系统当作命令执行并提升权限，官方公告未提供替代 tions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SSRF", "kind_en": "服务器端请求伪造 (SSRF)", "last_modified_time": "2026-11-25", "level": "High", "mps_id": "MPS-9nvc-7h3b", "poc": false, "poc_url": [], "published_time": "2026-11-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-9nvc-7h3b", "name": "https://www.oscs1024.com/hd/MPS-9nvc-7h3b"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-82170", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-82170"}, {"url": "https://www.dell.com/support/kbdoc/en-us/000535705/dsa-2026-510-security-update-for-virtual-storage-integrator-for-vmware-vsphere-web-client-vulnerabilities", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "VSI服务端请求伪造", "_translated": true, "_saved_at": "2026-11-24T18:33:45+00:00", "_first_saved_at": "2026-11-24T18:33:45+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-9nvc-7h3b"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2026-80284", "cvss": {"cvssv31": [{"source": "security_alert@emc.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N", "severity": "high", "base_score": 7.7}]}, "cvss_score": 7.7, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N", "cwe": "CWE-287", "description": "Dell Secure Connect Gateway（SCG）Virtual Edition 是 Dell 提供的闭源商用虚拟设备，用于在客户环境与 Dell 之间建立安全连接，承载服务请求、遥测数据与升级流程的管理。\n受影响版本中，SCG Virtual Edition 的身份认证机制存在缺陷（CWE-287），攻击者在具备本地访问条件时无需账号权限即可触发，可能导致敏感数据暴露，并可对系统操作实施未授权修改。\n修复版本中通过官方安全更新修复该身份认证缺陷，5.36.00.16 及以上版本不再受此问题影响，官方公告未提供替代缓解措施，建议升级至 5.36.00.16 或更高版本。", "effects": [{"comp_name": "secure_connect_gateway", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,5.36.00.16)", "min_fixed_version": "5.36.00.16", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "身份验证不当", "kind_en": "认证不当", "last_modified_time": "2026-11-25", "level": "High", "mps_id": "MPS-wn4y-txjz", "poc": false, "poc_url": [], "published_time": "2026-11-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-wn4y-txjz", "name": "https://www.oscs1024.com/hd/MPS-wn4y-txjz"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-80284", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-80284"}, {"url": "https://www.dell.com/support/kbdoc/en-us/000503504/dsa-2026-386-security-update-for-dell-secure-connect-gateway-virtual-edition-multiple-vulnerabilities", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "Dell SCG VE 身份认证缺陷漏洞", "_translated": true, "_saved_at": "2026-11-25T11:59:03+00:00", "_first_saved_at": "2026-11-25T11:59:03+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-wn4y-txjz"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-78098", "cvss": {}, "cvss_score": 7, "cvss_vector": "", "cwe": "CWE-285", "description": "Apache JSPWiki 是 Apache 软件基金会维护的开源 Java Wiki 引擎，以 WAR 包形式部署在 Servlet 容器中，通过页面级 ACL 标记对单个 Wiki 页面实施查看与编辑控制。\n受影响版本中，jspwiki-main 模块的 PermissionFactory.getPagePermission() 方法使用 wiki.hashCode() ^ page.hashCode() ^ actions.hashCode() 作为静态权限缓存 WeakHashMap 的键。Java 字符串哈希值可以相等（例如 Aa 与 BB 哈希相同），攻击者创建页面名称与受保护页面哈希碰撞的页面后，该页面的权限对象占据受保护页面的缓存槽位，后续请求受保护页面时 PermissionFactory 返回攻击者页面的 PagePermission 对象，DefaultAuthorizationManager.checkPermission() 按该对象携带的页面名查找 ACL，命中无 ACL 配置的攻击者页面并在策略检查通过后放行，未授权用户可读取或编辑设置了页面级 ACL 的受保护页面。\n修复版本中通过将缓存键改为 wiki、页面名与动作拼接而成的唯一字符串，消除哈希碰撞导致的键冲突，并新增 PermissionFactoryTest 回归测试验证哈希相同的页面名各自获得独立的 PagePermission 对象。", "effects": [{"comp_name": "org.apache.jspwiki:jspwiki-war", "ecosystem": "maven", "versions": [{"affected_version": "[2.5.54,3.0.1)", "min_fixed_version": "3.0.1", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权机制不恰当", "kind_en": "不当授权", "last_modified_time": "2026-11-25", "level": "High", "mps_id": "MPS-5fbc-7dd1", "poc": false, "poc_url": [], "published_time": "2026-11-25", "reference_url_list": [{"url": "http://www.mail-archive.com/announce@apache.org/msg12821.html", "name": ""}, {"url": "https://issues.apache.org/jira/browse/JSPWIKI-1286", "name": ""}, {"url": "https://github.com/apache/jspwiki/commit/9e3766063988644ea786a9b5a6dc3977aa9d83fc", "name": ""}, {"url": "https://github.com/apache/jspwiki/pull/515", "name": ""}, {"url": "https://github.com/apache/jspwiki/commit/d278a33d9711cfe1e7b9e15d52c300c28af88b16", "name": ""}, {"url": "https://github.com/apache/jspwiki/releases/tag/3.0.1", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-78098", "name": ""}, {"url": "https://jspwiki.apache.org/", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "Apache JSPWiki 页面 ACL 绕过漏洞", "_translated": true, "_saved_at": "2026-11-25T11:59:01+00:00", "_first_saved_at": "2026-11-25T11:59:01+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-5fbc-7dd1"}, {"analysis_status": 0, "articles": [{"content": "应用程序在处理用户输入时的不完善或缺乏验证机制，所以攻击者能够通过向应用程序发送恶意输入，利用应用程序对输入数据的错误处理方式来注入自己的恶意代码。这些恶意代码会被应用程序误认为是合法的指令或数据，并在执行过程中被执行。", "title": "什么是代码注入"}, {"content": "应用程序使用可执行动态代码的函数来执行用户可控的参数，当应用程序对于用户输入过滤不完全时，攻击者可以注入恶意代码并控制代码执行流程。", "title": "代码注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对所有用户输入进行验证和过滤，确保只接受预期的有效输入。这包括对输入数据进行输入长度验证、类型检查和格式验证等。\r\n- 使用参数化查询或预编译语句：对于数据库查询操作，应该使用参数化查询或预编译语句，确保输入数据不会被误认为是执行代码。\r\n- 最小特权原则：应用程序在执行操作系统命令或动态代码时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。\r\n- 安全编码实践：开发人员应该采用安全编码实践，包括避免使用eval函数、避免拼接用户输入的字符串作为代码执行等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止代码注入攻击。", "title": "如何预防代码注入"}], "cnvd_id": "", "cve_id": "CVE-2026-137305", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-94", "description": "Grav Form 是 Grav CMS 的官方表单插件，以 Composer 包 getgrav/grav-plugin-form 形式发布的 PHP 开源组件，用于在 Grav 页面中定义与处理表单，包含文件上传字段和邮件通知等动作。\n受影响版本中，Form::uploadFiles() 直接采用页面 frontmatter 中文件字段声明的 destination，支持页面令牌、theme@:/templates 等流式路径、相对路径与绝对路径，解析后未校验落点便写入上传文件；文件名检查仅拦截 PHP 与页面内容类扩展名，攻击者可将含 Twig 代码的 .txt 或 .svg 文件上传至主题或插件的 templates 目录、system/templates 等 Twig 模板路径，该文件随后被当作受信任模板在 Twig 内容沙箱之外渲染，例如通过表单 email 动作按同一 frontmatter 中的 template 名称渲染该文件，最终以 Web 服务器用户身份执行任意代码；destination 指向站点目录之外时，上传文件还可写入 Web 服务器用户可写的任意位置。\n修复版本中通过在 uploadFiles() 与 copyFiles() 中新增 isAllowedUploadFolder() 校验，要求上传目录必须位于 user/ 之内，且不得落入任何主题或插件的 tem akeDataUnique"}], "scope_influence": "", "tags": ["应用软件", "开源"], "title": "6.0.6 之前的 Assimp 通过 MD5 导入器 MakeDataUnique 越界写入", "_translated": true, "_saved_at": "2026-11-25T21:24:36+00:00", "_first_saved_at": "2026-11-25T21:24:36+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-8pta-u36v"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-136459", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "severity": "hi d/MPS-rtyu-x6vl"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-135808", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-135808"}, {"url": "https://patchstack.com/database/wordpress/plugin/ele-custom-skin/vulnerability/wordpress-ecs-ele-custom-skin-for-elementor-plugin-4-3-14-cross-site-scripting-xss-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-135808漏洞", "_translated": true, "_saved_at": "2026-11-26T13:27:40+00:00", "_first_saved_at": "2026-11-26T13:27:40+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-rtyu-x6vl"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-137309", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:H/A:N", "severity": "medium", "base_score": 6.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-863", "description": "Friendica 是开源 PHP 去中心化社交网络平台，采用 AGPL-3.0 许可发布，用于自建可与 ActivityPub 联邦网络互通的社交站点。\n受影响版本中，mod/item.php 的 item_edit() 函数通过 Post::selectFirst(Item::ITEM_FIELDLIST, ['id' =\u003e $request['post_id'], 'uid' =\u003e $uid]) 获取待编辑帖子，查询条件仅匹配当前用户存储的帖子副本 id，未校验该副本是否为用户本人的原始帖子，也未校验 author-id 是否属于当前用户。已登录本地用户向 /item 发起 POST 请求并提交自己存储副本对应的 post_id 后，函数按共享 uri-id 调用 Post\\Media::deleteByURIId 删除原帖附件，并通过 Item::update 将攻击者可控的 body、title、content-warning 等字段写入共享内容，篡改结果继续展示在原作者名下。\n修复版本中通过改用 Post::selectOriginFirst 查询并附加 author-id 等于当前用户公开联系 ID、deleted 为 false 的条件，将可编辑范围限定为本人原创且未删除的帖子，同时隐藏非本人帖子的编辑入口，阻断越权编辑与附件删除。", "effects": [{"comp_name": "friendica", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2026.05-1]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-11-26", "level": "High", "mps_id": "MPS-uj4c-91xn", "poc": false, "poc_url": [], "published_time": "2026-11-26", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-uj4c-91xn", "name": "https://www.oscs1024.com/hd/MPS-uj4c-91xn"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-137309", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-137309"}, {"url": "https://github.com/friendica/friendica/pull/16527", "name": ""}, {"url": "https://github.com/friendica/friendica/commit/63dc02336f89cdd0ae851a6b85a3a48cbd0f3fa7", "name": ""}, {"url": "https://github.com/friendica/friendica/blob/2026.05-1/mod/item.php#L87-L126", "name": ""}, {"url": "https://www.vulncheck.com/advisories/friendica-through-2026.05-1-incorrect-authorization-in-post-editing-via-item-edit", "name": "VulnCheck Advisory: L v3）的 PHP Web 项目管理软件，用于项目、任务、工时与团队协作管理，官方通过 projeqtor.com 与 SourceForge 以源码包形式分发。\n受影响版本中，tool/getAFieldForAClassById.php 直接读取请求参数 Class、id、field，未对目标对象执行任何访问权限校验，通过 SqlElement::getSingleSqlElementFromCriteria 按任意类名加载数据后以 json_encode($obj-\u003e$field) 返回对象属性，进入该脚本前仅存在登录会话校验。已登录的低权限用户请求 Class=User、id 指向管理员账号、field=password 或 field=email，读取对应用户的密码哈希与邮箱地址，密码哈希以 MD5 形式存储，可离线破解后用于接管管理员账户。\n修复版本中通过在 tool/getAFieldForAClassById.php 增加 Class 与 field 白名单，仅允许读取 Notifiable 类的 notifiableItem 字段，输入统一改由 RequestHandler::getValue 与 RequestHandler::getId 处理，其余请求记录为 hack 并终止执行，切断了任意对象属性的读取路径。", "effects": [{"comp_name": "projeqtor", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,13.1.2)", "min_fixed_version": "13.1.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-11-26", "level": "High", "mps_id": "MPS-wdlp-u5fi", "poc": false, "poc_url": [], "published_time": "2026-11-26", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-wdlp-u5fi", "name": "https://www.oscs1024.com/hd/MPS-wdlp-u5fi"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-137085", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-137085"}, {"url": "https://changelog.projeqtor.org/", "name": ""}, {"url": "https://changelog.projeqtor.org/getTickets.php?idVersion=527", "name": ""}, {"url": "https://www.projeqtor.com", "name": ""}, {"url": "https://www.vulncheck.com/advisories/projeqtor-before-13.1.2-missing-authorization-via-getafieldforaclassbyid-php", "name": "VulnCheck Advisory: ProjeQtOr before 13.1.2 Missing Authorization via getAFieldForAClassById.php"}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "ProjeQtOr访问控制缺失漏洞", "_translated": true, "_saved_at": "2026-11-25T21:24:37+00:00", "_first_saved_at": "2026-11-25T21:24:37+00:00", "_source_page": "https://w  "CWE-78", "description": "Dell Secure Connect Gateway Virtual Edition 是 Dell 提供的闭源商业虚拟设备，用于在企业环境与 Dell 技术支持之间建立安全连接，并集中收集、上传受管设备的日志与遥测数据。\n受影响版本中，产品在涉及操作系统命令执行的流程中未对特殊元素进行正确中和，未认证的本地攻击者可注入可控输入并被命令解析执行，形成 OS 命令注入，官方公告指出利用该漏洞可导致脚本注入。\n修复版本中通过官方在 5.36.00.16 版本发布的修复程序消除相关流程的命令注入缺陷，阻断可控输入进入操作系统命令执行路径，避免本地攻击者触发脚本注入。", "effects": [{"comp_name": "secure_connect_gateway", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,5.36.00.16)", "min_fixed_version": "5.36.00.16", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-11-27", "level": "High", "mps_id": "MPS-1aqx-c7pl", "poc": false, "poc_url": [], "published_time": "2026-11-27", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-1aqx-c7pl", "name": "https://www.oscs1024.com/hd/MPS-1aqx-c7pl"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-80485", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-80485"}, {"url": "https://www.dell.com/support/kbdoc/en-cv/000534756/dsa-2026-507-security-update-for-dell-secure-connect-gateway-virtual-edition-multiple-vulnerabilities-version-2", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "Dell SCG VE命令注入漏洞", "_translated": true, "_saved_at": "2026-11-27T14:35:41+00:00", "_first_saved_at": "2026-11-27T14:35:41+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-1aqx-c7pl"}, {"analysis_status": 0, "articles": [{"content": "- 编写代码时没有正确处理输入数据或没有正确验证用户输入而导致的。", "title": "什么是关键资源权限分配不当"}, {"content": "- 弱密码或未使用的密码：当管理员或系统管理员在创建帐户时，没有使用强密码或未对帐户进行密码更新时，可能会发生这种情况。弱密码可能会被黑客破解或通过其他方式轻松访问系统。\n- 未正确配置权限：在系统中，不同的资源通常需要不同的权限才能访问。如果管理员未正确配置权限，那么未经授权的用户可能会通过欺骗系统或利用其他漏洞来访问关键资源。\n- 权限重用：在某些情况下，管理员可能会将某些权限分配给某个用户，但这些权限并未被正确地限制或授权给该用户。如果其他用户尝试使用这些权限访问关键资源，那么他们可能会获得未经授权的访问权限。\n- 未正确验证用户输入：当开发人员没有正确验证用户输入时，可能会发生这种情况。例如，如果开发人员未正确过滤用户输入的用户名或密码，那么黑客可能会利用这些信息轻松地访问系统。\n", "title": "关键资源权限分配不当常见的攻击方式"}, {"content": "- 使用强密码：管理员应该使用强密码来保护系统，并定期更改密码。强密码应该包括数字、字母和符号，并且应该不同于其他帐户使用的密码。\n- 正确配置权限：管理员应该正确配置系统中不同资源所需的权限。用户可以被授予访问特定资源的权限，但不应该被授予访问其他资源的权限。\n- 权限限制：管理员应该使用权限限制来限制用户对特定资源的访问。例如，用户可以被授予访问特定文件夹的权限，但不能访问其他文件夹。\n- 输入验证：开发人员应该正确验证用户输入。例如，他们可以过滤用户输入的用户名和密码，以确保它们符合预期的格式。\n- 安全培训：管理员和用户应该接受安全培训，以便了解如何识别和避免常见的安全漏洞，例如不正确权限授予漏洞。\n- 定期更新和修补软件：系统软件和应用程序应该定期更新和修补，以确保它们不受最新安全漏洞的影响。", "title": "如何预防关键资源权限分配不当"}], "cnvd_id": "", "cve_id": "CVE-2026-80501", "cvss": {"cvssv31": [{"source": "security_alert@emc.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-732", "description": "Dell Secure Connect Gateway Virtual Edition 是 Dell 提供的闭源商业虚拟设备，用于为企业的服务器、网络与存储设备提供统一的安全连接、远程访问与监控管理能力。\n受影响版本中，系统对关键资源的权限分配不正确，本地低权限攻击者可以访问或修改本应受保护的关键资源，干扰网关服务的正常运行，最终导致拒绝服务。\n修复版本中通过修正关键资源的权限分配，限制本地低权限账户对相关资源的访问，消除由此引发的拒绝服务风险。", "effects": [{"comp_name": "secure_connect_gateway", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,5.36.00.16)", "min_fixed_version": "5.36.00.16", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "关键资源权限分配不当", "kind_en": "关键资源的权限分配不正确", "last_modified_time": "2026-11-27", "level": "High", "mps_id": "MPS-496l-ozgn", "poc": false, "poc_url": [], "published_time": "2026-11-27", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-496l-ozgn", "name": "https://www.oscs1024.com/hd/MPS-496l-ozgn"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-80501", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-80501"}, {"url": "https://www.dell.com/support/kbdoc/en-cv/000534756/dsa-2026-507-security-update-for-dell-secure-connect-gateway-virtual-edition-multiple-vulnerabilitie pe_influence": "", "tags": ["应用软件", "终端软件"], "title": "Dell SCG 硬编码加密密钥漏洞", "_translated": true, "_saved_at": "2026-11-27T14:35:40+00:00", "_first_saved_at": "2026-11-27T14:35:40+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-bw62-9yxe"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2026-80500", "cvss": {"cvssv31": [{"source": "security_alert@emc.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N", "severity": "high", "base_score": 7.7}]}, "cvss_score": 7.7, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N", "cwe": "CWE-287", "description": "Dell Secure Connect Gateway（SCG）Virtual Edition 是 Dell 提供的闭源虚拟化网关设备，以虚拟设备形式部署在客户数据中心，用于在本地 Dell 基础设施与 Dell 后端支持体系之间建立安全连接，集中完成遥测上报、远程支持访问与设备连通性管理。\n受影响版本中，5.36.00.16 之前的版本在认证环节存在校验缺陷（CWE-287），认证流程未能有效鉴别本地访问请求的合法性，未通过身份认证的攻击者在获得虚拟机本地访问环境后可绕过认证校验，获得对网关受保护功能的未授权访问，导致机密性与完整性受损，官方 CVSS 基础评分为 7.7（CVSS:3.1/AV:L/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N）。\n修复版本中通过 5.36.00.16 安全更新修复该认证校验缺陷，阻断未认证的本地访问请求继续进入受保护的管理功能，Dell 在 DSA-2026-507 中说明升级至 5.36.00.16 及以上版本可修复该漏洞。", "effects": [{"comp_name": "secure_connect_gateway_virtual_edition", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,5.36.00.16)", "min_fixed_version": "5.36.00.16", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "身份验证不当", "kind_en": "认证不当", "last_modified_time": "2026-11-27", "level": "High", "mps_id": "MPS-qf5c-d926", "poc": false, "poc_url": [], "published_time": "2026-11-27", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-qf5c-d926", "name": "https://www.oscs1024.com/hd/MPS-qf5c-d926"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-80500", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-80500"}, {"url": "https://www.dell.com/support/kbdoc/en-cv/000534756/dsa-2026-507-security-update-for-dell-secure-connect-gateway-virtual-edition-multiple-vulnerabilities-version-2", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Dell SCG Virtual Edition认证缺陷漏洞", "_translated": true, "_saved_at": "2026-11-27T14:35:43+00:00", "_first_saved_at": "2026-11-27T14:35:43+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-qf5c-d926"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "cnvd_id": "", "cve_id": "CVE-2026-135626", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-269", "description": "The Simple Membership plugin for WordPress is vulnerable to Privilege Escalation in all versions up to, and including, 4.9.0 This is due to the `SwpmLevelForm::role()` function applying only `sanitize_text_field()` to the user-supplied `role` parameter with no allowlist, permitting the `administrator` role to be stored verbatim into `swpm_membership_tbl` and subsequently applied to a member's WordPress account via `$user-\u003eadd_role()` inside `update_wp_user_role()` — also without any role allowlist — when the `swpm_membership_level_changed` action fires. This makes it possible for authenticated attackers with Contributor-level access and above to create a membership level specifying the `administrator` WordPress role, assign themselves to that level, and thereby elevate their own WordPress account to full Administrator, gaining complete site control including the ability to install plugins, edit themes, and manage users. Exploitation requires that the site owner has lowered the plugin's \"Admin Dashboard Access Permission\" setting from its default `manage_options` capability to a lesser capability such as `edit_posts`, `edit_published_posts`, or `edit_pages`, which grants lower-privileged users access to the SWPM admin dashboard where the vulnerable level-creation form resides. Successful exploitation causes the attacker's own account to receive the complete administrator role.", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-11-27", "level": "High", "mps_id": "MPS-2hr6-agil", " 访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "cnvd_id": "", "cve_id": "CVE-2026-135627", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-269", "description": "The Simple Membership plugin for WordPress is vulnerable to Privilege Escalation in all versions up to, and including, 4.9.0 The vulnerability exists because the `bulk_operation_menu()` function accepts the `swpm_bulk_change_level_to` parameter from `$_REQUEST` with only `sanitize_text_field()` applied, and passes it to `SwpmMemberUtils::update_membership_level_and_role()` without the `id != 1` allowlist exclusion that every other level-selection path in the plugin enforces — leaving membership level 1, which the installer maps to the WordPress `administrator` role on every fresh install, freely selectable as a bulk-change target. This makes it possible for authenticated attackers with Contributor-level access and above to elevate their own WordPress account to the full Administrator role, gaining complete site control including plugin installation, user creation, and all other administrator capabilities. Exploitation requires that an administrator has first lowered the plugin's \"Admin Dashboard Access Permission\" setting from its default of `manage_options` to a lesser capability such as `edit_posts` (Contributor), `edit_published_posts` (Author), or `edit_pages` (Editor), which is a non-default granted-access configuration; the bulk screen's nonce protection (`swpm_bulk_change_level_nonce_action`) does not mitigate the issue because the nonce is emitted on the same page the delegated lower-role user can already reach. Successful exploitation causes the attacker's own account to receive the complete administrator role.", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-11-27", "level": "High", "mps_id": "MPS-p5dz-b147", "poc": false, "poc_url": [], "published_time": "2026-11-27", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-p5dz-b147", "name": "https://www.oscs1024.com/hd/MPS-p5dz-b147"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-135627", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-135627"}, {"url": "https://downloads.wordpress.org/plugin/simple-membership.4.9.1.zip", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/simple-membership/tags/4.9.0/classes/class.swpm-members.php#L564", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/simple-membership/tags/4.9.0/classes/class.swpm-members.php#L575", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/simple-membership/tags/4.9.0/classes/class.swpm-self-action-handler.php#L133", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/simple-membership/tags/4.9.0/classes/class.swpm-utils-member.php#L264", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/simple-membership/tags/4.9.0/classes/class.swpm-utils-member.php#L641", "name": ""}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/8010de75-785c-4a51-b521-330576081b42?source=cve", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-135627漏洞", "_translated": true, "_saved_at": "2026-11-27T23:08:58+00:00", "_first_saved_at": "2026-11-27T04:42:53+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-p5dz-b147"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-138034", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "high", "base_score": 7.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-306", "description": "bigcommerce-api-mcp 是一个基于 Node.js 与 Express 的开源 Model Context Protocol（MCP）服务器，用于向 MCP 客户端暴露 BigCommerce 店铺的商品、订单与客户查询工具，工具执行时使用部署方配置的 BIGCOMMERCE_API_KEY 访问 BigCommerce API，属于大模型与 AI 基础设施组件。\n受影响版本中，setupStreamableHttp 注册的 /mcp 路由挂载了 authenticateRequest 中间件，而 setupSSE 注册的 GET /sse 与 POST /messages 路由未挂载该中间件，MCP_AUTH_TOKEN 配置在 SSE 模式下不生效；SSE 服务通过 app.listen(port) 监听且未指定绑定地址，默认绑定全部网卡。远程攻击者无需任何凭据，可先 GET /sse 建立会话获得 sessionId，再向 /messages?sessionId= 提交 JSON-RPC 工具调用请求，transport.handlePostMessage 将请求分发给已注册的 MCP 工具，以部署方的 BIGCOMMERCE_API_KEY 读取店铺商品、订单与客户记录，造成敏感信息泄露。\n修复版本中通过在 GET /sse 与 POST /messages 路由上挂载 authenticateRequest 中间件恢复对 MCP_AUTH_TOKEN 的校验，未携带有效 Bearer 令牌的请求返回 401；同时为 HTTP 监听引入 HOST 环境变量并默认绑定 127.0.0.1，仅显式配置时对外暴露，并新增 test-auth.js 回归测试覆盖两种传输方式的未认证访问，切断未认证会话建立与工具调用链路。", "effects": [{"comp_name": "bigcommerce-api-mcp", "ecosystem": "linux", "versions": [{"affected_version": "[1.0.0,1.0.1)", "min_fixed_version": "1.0.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "关键功能的认证机制缺失", "kind_en": "缺少关键功能的身份验证", "last_modified_time": "2026-11-28", "level": "High", "mps_id": "MPS-lwbh-2eo8", "poc": false, "poc_url": [], "published_time": "2026-11-28", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-lwbh-2eo8", "name": "https://www.oscs1024.com/hd/MPS-lwbh-2eo8"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-138034", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-138034"}, {"url": "https://github.com/isaacgounton/bigcommerce-api-mcp/security/advisories/GHSA-q9p3-23c9-686x", "name": "GitHub Security Advisory (GHSA-q9p3-23c9-686x)"}, {"url": "https://github.com/isaacgounton/bigcommerce-api-mcp/commit/6680235dbcbf1a57cb81f0981caf519c4a38e413", "name": ""}, {"url": "https://github.com/isaacgounton/bigcommerce-api-mcp/releases/tag/v1.0.1", "name": "bigcommerce-api-mcp v1.0.1 Release Notes"}, {"url": "https://github.com/isaacgounton/bigcommerce-api-mcp/blob/091efc6b69f3651516fa0e0a3b6db8e6c4e3d227/mcpServer.js#L269-L306", "name": ""}, {"url": "https://www.vulncheck.com/advisories/bigcommerce-api-mcp-before-1.0.1-missing-authentication-via-sse-transport-routes", "name": "VulnCheck Advisory: bigcommerce-api-mcp before 1.0.1 Missing Authentication via SSE Transport Routes"}], "scope_influence": "", "tags": ["AI", "应用软件"], "title": "bigcommerce-api-mcp未授权访问漏洞", "_translated": true, "_saved_at": "2026-11-27T23:08:56+00:00", "_first_saved_at": "2026-11-27T23:08:56+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-lwbh-2eo8"}, {"analysis_status": 0, "articles": [{"content": "跨界内存读是指应用程序在读取内存时，未正确验证或限制读取的内存范围。攻击者利用这种漏洞可以读取应用程序内存中的敏感数据，如密码、加密密钥、会话令牌等。常见的原因是由于缓冲区溢出、格式化字符串漏洞或其他内存错误导致的。", "title": "什么是越界读取"}, {"content": "攻击者可以通过不当构造的输入来触发跨界内存读漏洞。攻击者可能会通过向应用程序发送特定的输入，使其读取超过预期的内存区域。攻击者可以利用这个漏洞来获取敏感信息，如其他用户的数据、操作系统的敏感数据或应用程序的内部状态。", "title": "越界读取常见的攻击方式"}, {"content": "- 输入验证和限制：应用程序应对所有输入数据进行严格的验证和限制。确保输入数据的长度、格式和内容符合预期，避免超出缓冲区或访问非预期的内存区域。\n- 内存安全编程实践：开发人员应使用安全的编程实践，如避免使用不安全的函数、正确处理内存分配和释放操作，以及遵循最小特权原则。\n- 使用安全的编程语言和库：选择使用安全性较高的编程语言和库，这些语言和库在内存管理和安全性方面提供了更多的保护机制。\n- 定期进行代码审查和安全测试：定期审查应用程序的代码，并进行安全测试，以发现潜在的跨界内存读漏洞。使用静态代码分析工具和漏洞扫描工具来辅助检测和修复问题。\n- 实施防御性编程技术：应用程序应采用防御性编程技术，如使用随机化地址空间布局（ASLR）、堆栈保护机制（如堆栈溢出保护）和数据执行预防（DEP）等。\n- 及时更新和修补：及时应用程序和操作系统的安全更新和补丁，以确保已知的跨界内存读漏洞得到修复。及时更新相关软件和库，以避免使用已知存在漏洞的版本。", "title": "如何预防越界读取"}], "attack_vector_type": "Local", "cnvd_id": "", "cve_id": "CVE-2026-137941", "cvss": {"cvssv31": [{"source": "secalert@redhat.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "cwe": "CWE-125", "description": "GIMP 是 GNOME 项目开发的开源跨平台图像编辑器，广泛用于照片后期、图像合成与数字绘画，XCF 为其原生工程文件格式，非破坏性图层滤镜的参数会随 XCF 一并保存。\n受影响版本中，app/operations/gimplevelsconfig.c 的 GimpLevelsConfig 以固定 5 元素数组 low_input、high_input、gamma、low_output、high_output 存储各通道参数，channel 属性基于 GimpHistogramChannel 枚举，该枚举注册了包含 GIMP_HISTOGRAM_LUMINANCE（5）与 GIMP_HISTOGRAM_RGB（6）在内的 7 个值；gimp_levels_config_set_property 在 PROP_CHANNEL 分支未做范围校验直接写入 self-\u003echannel，后续 per-channel 属性处理又以 self-\u003echannel 作为数组下标读写。攻击者构造带非破坏性 Levels 图层滤镜并把 channel 设为 LUMINANCE 或 RGB 的 XCF 文件，GIMP 打开文件经 XCF 加载器还原滤镜配置时触发堆越界读与越界写，越界写把攻击者可控的 gdouble 写入堆上配置对象之后的固定偏移，可能导致崩溃或任意代码执行。\n修复版本中通过在 gimp_levels_config_set_property 的 PROP_CHANNEL 分支增加 GIMP_HISTOGRAM_VALUE 至 GIMP_HISTOGRAM_ALPHA 的范围校验，仅当通道枚举值落在合法区间时才写入 self-\u003echannel 并发出属性通知，使越界通道下标不再进入 per-channel 数组读写，从而切断上述越界访问路径。", "effects": [{"comp_name": "gimp", "ecosystem": "linux", "versions": [{"affected_version": "[3.0.0,3.2.8]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[2.10.0,2.10.38]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界读取", "kind_en": "越界读取", "last_modified_time": "2026-11-28", "level": "High", "mps_id": "MPS-hl91-wt02", "poc": false, "poc_url": [], "published_time": "2026-11-28", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-hl91-wt02", "name": "https://www.oscs1024   <script>
    const payload = JSON.parse(document.getElementById("payload").textContent);
    const levelLabels = payload.level_labels || {};
    const items = payload.items || [];
    let filtered = items.slice();

    const $ = (id) => document.getElementById(id);
    $("generatedAt").textContent = payload.generated_at || "-";
    $("retention").textContent = payload.retention_days ?? "-";
    $("cutoff").textContent = payload.cutoff_date || "-";
    $("count").textContent = String(payload.count ?? items.length);

    function levelClass(level) {
      const cn = levelLabels[level] || level || "";
      if (level === "Critical" || cn === "严重") return "crit";
      if (level === "High" || cn === "高危") return "high";
      return "other";
    }
    function levelText(level) {
      return levelLabels[level] || level || "-";
    }
    function esc(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }
    function scoreText(v) {
      if (v === null || v === undefined || v === "" || v === -1) return "-";
      return String(v);
    }

    function renderList() {
      const list = $("list");
      $("listCount").textContent = String(filtered.length);
      if (!filtered.length) {
        list.innerHTML = '<div class="empty">没有匹配项</div>';
        return;
      }
      list.innerHTML = filtered.map((it) => {
        const id = it.mps_id || it.cve_id;
        const active = id === activeId ? " active" : "";
        return `
          <button class="item${active}" data-id="${esc(id)}" type="button">
            <div class="item-top">
              <span class="cve">${esc(it.cve_id || it.mps_id || "-")}</span>
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
            </div>
            <div class="title">${esc(it.title || "-")}</div>

            </div>
          </button>`;
      }).join("");
      list.querySelectorAll(".item").forEach((btn) => {
        btn.addEventListener("click", () => selectById(btn.dataset.id));
      });
    }

    function refsHtml(it) {
      const refs = Array.isArray(it.reference_url_list) ? it.reference_url_list : [];
      const links = [];
      if (it._source_page) links.push({ url: it._source_page, name: "OSCS 详情" });
      if (it.cve_id) links.push({ url: `https://nvd.nist.gov/vuln/detail/${it.cve_id}`, name: "NVD" });

        if (r && r.url) links.push({ url: r.url, name: r.name || r.url });
      });
      const seen = new Set();
      const uniq = [];
      for (const l of links) {
        if (seen.has(l.url)) continue;
        seen.add(l.url);
        uniq.push(l);
      }
      if (!uniq.length) return '<div class="box">无参考链接</div>';
      return `<div class="refs">${uniq.map((l) =>
        `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name || l.url)}</a>`
      ).join("")}</div>`;
    }

    function articlesHtml(it) {
      const arts = Array.isArray(it.articles) ? it.articles : [];

        <div class="article">
          <h4>${esc(a.title || "说明")}</h4>

          <div class="stat"><div class="k">类型</div><div class="v">${esc(it.kind || it.kind_en || "-")}</div></div>
          <div class="stat"><div class="k">公开</div><div class="v">${esc(it.published_time || "-")}</div></div>
          <div class="stat"><div class="k">利用成本</div><div class="v">${esc(it.exploit_requirement_cost || "-")}</div></div>
          <div class="stat"><div class="k">可利用性</div><div class="v">${esc(it.exploitability || "-")}</div></div>
          <div class="stat"><div class="k">修复建议</div><div class="v">${esc(it.fix_suggestion || "-")}</div></div>
        </div>
        <div class="section"><h3>描述</h3><div class="box">${esc(it.description || "无描述")}</div></div>
        ${it.scope_influence ? `<div class="section"><h3>影响范围</h3><div class="box">${esc(it.scope_influence)}</div></div>` : ""}
        ${pocUrls.length ? `<div class="section"><h3>POC 链接</h3><div class="refs">${pocUrls.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join("")}</div></div>` : ""}
        <div class="section"><h3>参考链接</h3>${refsHtml(it)}</div>
        ${articlesHtml(it)}
      `;
    }

    function selectById(id) {
      const it = filtered.find((x) => (x.mps_id || x.cve_id) === id) ||
                 items.find((x) => (x.mps_id || x.cve_id) === id);
      if (!it) return;
      activeId = it.mps_id || it.cve_id;
      renderList();
      renderDetail(it);
      const btn = document.querySelector(`.item[data-id="${CSS.escape(activeId)}"]`);
      if (btn) btn.scrollIntoView({ block: "nearest" });
      history.replaceState(null, "", "#" + encodeURIComponent(activeId));
    }

    function applyFilter(q) {
      const query = (q || "").trim().toLowerCase();
      filtered = !query ? items.slice() : items.filter((it) => {
        const blob = [
          it.cve_id, it.mps_id, it.title, it.kind, it.kind_en, it.cwe, it.description, it.level
        ].map((x) => String(x || "").toLowerCase()).join(" ");
        return blob.includes(query);
      });
      renderList();
      if (filtered.length) {
        const still = filtered.some((x) => (x.mps_id || x.cve_id) === activeId);
        selectById(still ? activeId : (filtered[0].mps_id || filtered[0].cve_id));
      } else {
        activeId = null;
        renderDetail(null);
      }
    }

    $("search").addEventListener("input", (e) => applyFilter(e.target.value));

    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement !== $("search")) {
        e.preventDefault();
        $("search").focus();
        return;
      }
      if (!filtered.length) return;
      const idx = filtered.findIndex((x) => (x.mps_id || x.cve_id) === activeId);
      if (e.key === "ArrowDown") {
        e.preventDefault();
        const next = filtered[Math.min(filtered.length - 1, Math.max(0, idx) + 1)];
        selectById(next.mps_id || next.cve_id);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        const prev = filtered[Math.max(0, idx - 1)];
        selectById(prev.mps_id || prev.cve_id);
      }
    });

    const hashId = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    if (hashId && items.some((x) => (x.mps_id || x.cve_id) === hashId)) {
      activeId = hashId;
      renderList();
      selectById(hashId);
    } else if (items.length) {
      selectById(items[0].mps_id || items[0].cve_id);
    } else {
      renderList();
      renderDetail(null);
    }
  </script>
</body>
</html>
