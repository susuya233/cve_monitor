gf-x6pq 建立了威胁模型：“任何呈现攻击者控制模板的应用程序”。这一发现表明修复并不完整——添加了 #se​​t 阻塞，但属性读取表达式仍未过滤，这使得问题变得更糟（RCE 与原型污染）。\n\n### 补丁\n\n已在 [velocityjs 2.1.7](https://www.npmjs.com/package/velocityjs/v/2.1.7) 中修复。该修复已合并到 [pull request #192](https://github.com/shepherdwind/velocity.js/pull/192) 中，并作为 [v2.1.7](https://github.com/shepherdwind/velocity.js/releases/tag/v2.1.7) 发布。用户应升级到2.1.7或更高版本。", "effects": [{"comp_name": "velocityjs", "ecosystem": "npm", "versions": [{"affected_version": "(-∞,2.1.6]", "min_fixed_version": "", "repository": "npm", "solutions": [], "upstream": true}, {"affected_version": "(-∞,2.1.7)", "min_fixed_version": "2.1.7", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "代码注入", "kind_en": "代码生成控制不当（“代码注入”）", "last_modified_time": "2026-08-14", "level": "Critical", "mps_id": "MPS-2dgi-697b", "poc": false, "poc_url": [], "published_time": "2026-08-14", "reference_url_list": [{"url": "https://github.com/shepherdwind/velocity.js/security/advisories/GHSA-7gfh-x38p-prh3", "name": ""}, {"url": "https://github.com/shepherdwind/velocity.js/pull/192", "name": ""}, {"url": "https://github.com/shepherdwind/velocity.js/commit/f8e47a6c4607249b9c967d3a1ced959b4dd64dba", "name": ""}, {"url": "https://github.com/shepherdwind/velocity.js/releases/tag/v2.1.7", "name": ""}, {"url": "https://github.com/advisories/GHSA-7gfh-x38p-prh3", "name": ""}], "scope_influence": "", "tags": ["npm", "开源"], "title": "Velocity.js：通过属性读取到函数构造函数来远程执行代码（绕过 GHSA-j658-c2gf-x6pq 修复）", "_translated": true, "_saved_at": "2026-08-13T19:53:44+00:00", "_first_saved_at": "2026-08-13T19:53:44+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-2dgi-697b"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-12949", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity" ags": [], "title": "CVE-2026-8715漏洞", "_translated": true, "_saved_at": "2026-08-13T22:34:44+00:00", "_first_saved_at": "2026-08-13T22:34:44+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-k05s-ec39"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-73644", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:N", "severity": "critical", "base_score": 9.6}]}, "cvss_score": 9.6, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:N", "cwe": "CWE-639", "description": "### 总结\n当 SASL PLAIN 绑定提供解析为 **不同** 用户的授权身份 (authzid) 时，PlainSASLMechanismHandler 仅验证 PROXIED_AUTH 权限，并且从未评估“代理”访问控制权限（mayProxy ACI 范围检查）。因此，任何拥有代理身份验证权限的帐户都可以采用**任何可解析的非 root 身份**，而无需授予该目标的代理 ACI。\n\n这与 OpenDJ 中的所有其他代理路径不同 - 代理授权控件 (RFC 4370) 和 DIGEST-MD5 / GSSAPI authzid 处理程序都需要**权限**和** mayProxy 范围授予。\n\n### 影响\n权限升级/授权绕过：proxied-auth 的持有者可以充当超出部署代理 ACI 预期范围的任意目录用户，从而突破了基于 ACI 的对“哪些”身份可能被冒充的限制。根/目录管理器不能以这种方式假设。\n\n### 修复\n对 SASL PLAIN authzid 路径（dn: 和 u:/bare 形式）强制执行 mayProxy 范围检查，与 DIGEST-MD5/GSSAPI 路径共享一个 hasProxyAccess 帮助程序。拒绝返回 INVALID_CREDENTIALS (49) **在**密码验证之前（匹配 DIGEST-MD5/GSSAPI），因此未经身份验证的客户端无法区分缺少的权限和缺少的 ACI 授予。\n\n### 解决方法\n限制或撤销代理身份验证权限，直至升级。", "effects": [{"comp_name": "org.openidentityplatform.opendj:opendj-server-legacy", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,5.1.2)", "min_fixed_version": "5.1.2", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "通过用户控制密钥绕过授权机制", "kind_en": "通过用户控制的密钥绕过授权", "last_modified_time": "2026-08-14", "level": "Critical", "mps_id": "MPS-vxpc-n5of", "poc": false, "poc_url": [], "published_time": "2026-08-14", "reference_url_list": [{"url": "https://github.com/OpenIdentityPlatform/OpenDJ/security/advisories/GHSA-p279-2cqp-84jg", "name": ""}, {"url": "https://github.com/OpenIdentity 盖或删除文件，即使当“allowWrite”为“false”时也是如此。\n\n当浏览器模式 API 暴露于网络时（例如设置了“test.api.host”，或者可以从另一台机器或源访问开发服务器），这一点最为重要。在该配置中，“allowWrite”默认为“false”，正是为了阻止文件访问，并且这些命令绕过了该保护。在具有受信任测试代码的默认仅本地主机设置中，没有不受信任的一方可以利用它。无论您依赖“allowWrite: false”来包含不受信任的测试代码，这一差距仍然很重要，因为这些命令会忽略该标志。\n\n## Affected commands and impact\n\n|命令 |运营|影响 |\n|---|---|---|\n| `upload` (Playwright + WebdriverIO) |阅读 | Arbitrary local file read;内容加载到页面中并可由测试代码读取。影响最大的案例。 |\n| `takeScreenshot` (Playwright + WebdriverIO) |写 |将 PNG 写入任意路径（逐字使用绝对路径），创建父目录。 |\n| `screenshotMatcher` |写 | Writes reference/diff PNGs;从客户端路径派生的目录允许部分遍历。 |\n| `stopChunkTrace` |写 |将 Playwright 跟踪“.zip”写入可通过跟踪名称中的“../”转义的路径。 |\n| `删除跟踪` |删除| Deletes arbitrary files by path. |\n| `注释痕迹` |阅读（披露）|记录客户端控制的附件路径，报告者将其复制到附件目录中，从而公开文件内容。 |\n\n写入不允许攻击者选择文件内容（它们生成 PNG 图像或跟踪存档），因此完整性影响是在任意路径创建、覆盖或删除文件，而不是写入选定的有效负载。读取（“upload”、“annotateTraces”）更为严重，因为它们会暴露任意文件的完整内容。\n\n该修复程序为每个文件接触提供程序命令添加了“allowWrite”检查，以检查写入/删除操作以及对项目根目录的路径限制（与现有的“fs”命令模式匹配），因此客户端提供的绝对路径和“../”遍历将被拒绝。", "effects": [{"comp_name": "@vitest/browser", "ecosystem": "npm", "versions": [{"affected_version": "[5.0.0-beta.1,5.0.0-beta.6)", "min_fixed_version": "5.0.0-beta.6", "repository": "npm", "solutions": [], "upstream": true}, {"affected_version": "(-∞,3.2.7)", "min_fixed_version": "3.2.7", "repository": "npm", "solutions": [], "upstream": true}, {"affected_version": "[4.0.0,4.1.10)", "min_fixed_version": "4.1.10", "repository": "npm", "solutions": [], "upstream": true}]}, {"comp_name": "vitest", "ecosystem": "npm", "versions": [{"affected_version": "[3.0.0,3.2.7)", "min_fixed_version": "3.2.7", "repository": "npm", "solutions": [], "upstream": true}, {"affected_version": "[4.0.0,4.1.10)", "min_fixed_version": "4.1.10", "repository": "npm", "solutions": [], "upstream": true}, {"affected_version": "[5.0.0-beta.1,5.0.0-beta.6)", "min_fixed_version": "5.0.0-beta.6", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_ ical", "mps_id": "MPS-2adp-zj1t", "poc": false, "poc_url": [], "published_time": "2026-08-14", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-2adp-zj1t", "name": "https://www.oscs1024.com/hd/MPS-2adp-zj1t"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-19297", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-19297"}, {"url": "https://www.ibm.com/support/pages/node/7283558", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-19297漏洞", "_translated": true, "_saved_at": "2026-08-13T22:34:53+00:00", "_first_saved_at": "2026-08-13T22:34:53+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-2adp-zj1t"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-73567", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N", "severity": "critical", "base_score": 9.1}]}, "cvss_score": 9.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N", "cwe": "CWE-338", "description": "## 总结\n\n`sm-crypto` （npm 包 **0.4.0**，最新版本，发布于 2026-01-20）\n从单个密钥生成 SM2 私钥并签署临时标量\n模块范围的 RNG 实例（`src/sm2/utils.js`：`const rng = new SecureRandom()`）。\n`SecureRandom` 是 jsbn 的 PRNG，它从以下位置播种 **ARC4** 流\n`window.crypto.getRandomValues`（如果可用）。 **在 Node.js 中 — sm-crypto 的\n主运行时 - `window` 是 `undefined`，因此 CSPRNG 分支被跳过**\n种子池由 `Math.random()` 填充（V8 `xorshift128+`，\n可从一些输出中恢复）加上 `new Date().getTime()` （挂钟，\n攻击者可估计）。\n\n节点*确实*将 Web Crypto 公开为“globalThis.crypto”，但 jsbn 检查\n“window.crypto”，而不是“globalThis.crypto”，因此永远不会采用安全路径。\n因此，默认生成的每个 SM2 私钥\n`sm2.generateKeyPairHex()` 和每个签名临时标量都源自\n非加密来源，并且可以被可以观察到的攻击者**预测**\n一些 `Math.random()` 输出并估计生成时间。\n\n这是库的**默认**（无参数）路径；未选择呼叫者\n需要参数或配置才能触发它。已转载\n端到端针对未修改的真实 npm 包（`sm-crypto@0.4.0` +\n`jsbn@1.1.0`);下面的 PoC 针对实际安装的软件包运行，而不是\n复制。该缺陷在最新发布的版本 (0.4.0) 上仍然存在，并且\n不属于任何现有的“JuneAndGreen/sm-crypto”问题（0 afldl 问题\n存在；最近的问题是不相关的 SM3/HKDF/PBKDF2 功能请求）。\n\n## 详细信息\n\n`jsbn@1.1.0` `index.js` — RNG 池初始化（在 Node 中进行回退）：\n\n````js\nif (rng_pool == null) {\n  rng_pool = 新数组(); rng_pptr = 0;变量t；\n  if (typeof window !== \"undefined\" \u0026\u0026 window.crypto) { // \u003c-- Node 中为 false\n    if (window.crypto.getRandomValues) { /* webcrypto */ }\n    ...\n  }\n  while (rng_pptr \u003c rng_psize) { // \u003c-- 后备路径\n    t = Math.floor(65536 * Math.random());                  // Math.random()\n    rng_pool[rng_pptr++] = t \u003e\u003e\u003e 8;\n    rng_pool[rng_pptr++] = t \u0026 255;\n  }\n  rng_pptr = 0;\n  rng_seed_time();                                           // + Date.getTime()\n}\n````\n\n`sm-crypto` `src/sm2/utils.js`:\n\n````js\nconst { SecureRandom } = require('jsbn');\nconst rng = new SecureRandom();                              // 单模块范围的 RNG\n...\n函数generateKeyPairHex(a, b, c) {\n  常量随机 = a ?新的大整数（a，b，c）\n                   : new BigInteger(n.bitLength(), rng);     // 使用 rng\n  const d = random.mod(n.subtract(BigInteger.ONE)).add(BigInteger.ONE); // 私钥\n  ...\n}\n````\n\n默认（无参数）调用路径使用“rng”，即 jsbn ARC4 实例种子\n来自“Math.random()”+时间。相同的“rng”为签名提供了短暂的信息\nSM2 签名期间的标量。\n\n## 概念验证\n\nPoC 针对实际安装的 npm 软件包运行。它固定“Math.random”\n和 `Date` **之前** `require('sm-crypto')` 所以 jsbn 的种子池是从构建的\n受控输入。然后三个独立的新鲜节点进程产生\n**相同** SM2 私钥，证明密钥是以下的纯确定性函数\n那些非加密来源。它还打印一个探针来确认回退\n分支是在 Node.js 中获取的。\n\n### 一行复制器\n\n````bash\nWORK=$(mktemp -d) \u0026\u0026 cd \"$WORK\" \u0026\u0026 npm init -y \u003e/dev/null \\\n  \u0026\u0026 npm install sm-crypto@0.4.0 jsbn@1.1.0 \u003e/dev/null \\\n  \u0026\u0026 导出 NODE_PATH=\"$WORK/node_modules\" \\\n  \u0026\u0026 节点 poc.js 探测 \u0026\u0026 节点 poc.js 确定性 \u0026\u0026 节点 poc.js 确定性\n````\n\n### `poc.js`\n\n````js\n/*\n * Node.js 中 sm-crypto 可预测默认 RNG 的 PoC。\n *\n * sm-crypto (npm 0.4.0) 使用以下命令生成 SM2 私钥/临时标量\n * jsbn 的 SecureRandom。在浏览器中，jsbn 从 window.crypto 种子 ARC4，但在\n * Node.js `window` 未定义，因此 CSPRNG 分支被跳过，池被\n * 由 Math.random() 加上 new Date().getTime() 填充。两者都是\n * 非加密；时间是攻击者可估计的，V8 的 Math.random 是\n * 可恢复的 xorshift128+ 流。因此 SM2 密钥由\n * 默认路径是可预测的。\n ** 这个 PoC 证明关键是这两个输入的确定性函数：我们\n * 在 sm-crypto 之前将 Math.random 和时钟固定为固定值（因此\n * jsbn) 被加载，然后生成密钥对。使用相同的固定重新运行\n * 值复制完全相同的私钥。\n */\n\nconst MODE = process.argv[2] || '探测'; // '探测' | “确定性”\n\nif (MODE === '确定性') {\n  // --- 在需要 sm-crypto/jsbn 之前固定熵源 ---\n  const 固定时间 = 1700000000000;\n  让 s = 0x12345678 \u003e\u003e\u003e 0;\n  Math.random = 函数 () {\n    // 微小的确定性 LCG 代表（已经是非加密的）Math.random\n    s = (Math.imul(s, 1103515245) + 12345) \u003e\u003e\u003e 0;\n    返回s/0x100000000；\n  };\n  const RealDate = globalThis.Date;\n  类固定日期扩展 RealDate {\n    构造函数(...a) { super(...(a.length === 0 ? [fixedTime] : a)); }\n  }\n  固定日期.now = () =\u003e 固定时间;\n  globalThis.Date = 固定日期;\n}\n\nconst sm2 = require('sm-crypto').sm2;\nconst kp = sm2.generateKeyPairHex();\nconsole.log('PRIVATE=' + kp.privateKey);\n\nif (MODE === '探测') {\n  console.log('--- 探测 ---');\n  console.log('typeof window =', typeof window, '(Node 中未定义 =\u003e jsbn CSPRNG 分支已跳过)');\n  console.log('typeof globalThis.crypto =', typeof globalThis.crypto, '(Node Web Crypto 存在，但 jsbn 检查 window.crypto，而不是 globalThis.crypto)');\n  console.log('Math.random 样本 =', Math.random());\n  console.log('Date.now() =', Date.now(), '(攻击者可估计，混合到 ARC4 种子中)');\n}\n````\n\n真实捕获的输出：\n\n````\n===== PROBE（真正的默认路径，无需修补）=====\n私人=6072e45733a4187791ec28ce906fef18c7d33c8529969e1a852833c4349cfc38\n--- 探头 ---\ntypeof window = undefined（Node 中未定义 =\u003e jsbn CSPRNG 分支已跳过）\ntypeof globalThis.crypto = object（Node Web Crypto 存在，但 jsbn 检查 window.crypto，而不是 globalThis.crypto）\nMath.随机样本 = 0.704452488761137\nDate.now() = 1784455686795（攻击者可估计，混合到 ARC4 种子中）\n\n===== 确定性（Math.random + 在需要 sm-crypto 之前固定的日期） =====\n--- 运行 #1 --- PRIVATE=143268fa0939b4da09eab8c9a2e027a04555b6c433fef4f54fc5edd517c0a6b1\n--- 运行 #2 --- PRIVATE=143268fa0939b4da09eab8c9a2e027a04555b6c433fef4f54fc5edd517c0a6b1\n````\n\n两次确定性运行产生**相同** SM2 私钥，\n演示的关键是“Math.random()”+挂钟时间的纯函数。\n\n## 影响\n\n**使用生成的任何 SM2 密钥对的私钥恢复/签名伪造\nNode.js 中的默认 API。** 这是最严重的一类缺陷\n维护的 SM2 库：*默认*密钥生成路径是\n在其主要运行时是非加密的。\n\n- **私钥恢复。** 使用默认 API 生成的任何 SM2 密钥对\n  节点源自“Math.random()”+挂钟时间。攻击者可以\n  观察一些 `Math.random()` 输出（V8 `xorshift128+` 状态是\n  可从〜4个观察到的双打中恢复）并估计生成时间可以\n  复制私钥并伪造签名。\n- **签署临时重用/伪造。** 相同的 RNG 为临时提供数据\n  SM2 签名期间的标量“k”；可预测的“k”泄露了来自\n  单一签名（SM2 类似于 EC-Schnorr：`s = (k^-1)(e + d·r) mod n`）。\n- 预认证/无需特权：任何可以诱导受害者的人\n  生成密钥或签署消息（正常 API 使用）的位置是\n  预测秘密材料。\n\n### 建议修复\n\n从 Node.js 中的 CSPRNG 中播种 RNG。 `sm-crypto` 中最简单的修复是\n将 jsbn ARC4 实例替换为 Web Crypto / `crypto.randomBytes`：\n\n````js\n// src/sm2/utils.js\nconst nodeCrypto = (typeof require === '函数') ?要求（'加密'）：空；\n函数 csrandBytes(n) {\n  if (nodeCrypto) 返回nodeCrypto.randomBytes(n);          // 节点\n  if (globalThis.crypto) { // Web 加密（浏览器/节点 ≥ 19）\n    const b = new Uint8Array(n); globalThis.crypto.getRandomValues(b);返回b；\n  }\n  抛出新错误（'没有可用的 CSPRNG'）；\n}\n````\n\n并使用它直接生成私钥/临时密钥，或者重新播种\njsbn 池。 jsbn 中有一个单独的（上游）修复程序需要检查除了“window.crypto”之外，还有“globalThis.crypto”。\n\n### 受影响的版本\n\n- npm `sm-crypto` **0.4.0**（最新，发布于 2026 年 1 月 20 日）。取决于\n  `jsbn ^1.1.0`（`jsbn@1.1.0`，其`index.js` RNG 是根本原因）。\n- 运行时：Node.js（主要运行时；在浏览器中 jsbn CSPRNG 分支\n  被采取）。\n\n## 信用\n\n由 diff/ambidiff 安全研究工作 (afldl) 报告。", "effects": [{"comp_name": "sm-crypto", "ecosystem": "npm", "versions": [{"affected_version": "(-∞,0.5.0)", "min_fixed_version": "0.5.0", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "使用具有密码学弱点缺陷的PRNG", "kind_en": "使用弱加密伪随机数生成器 (PRNG)", "last_modified_time": "2026-08-14", "level": "Critical", "mps_id": "MPS-ud2g-bech", "poc": false, "poc_url": [], "published_time": "2026-08-14", "reference_url_list": [{"url": "https://github.com/JuneAndGreen/sm-crypto/security/advisories/GHSA-vh45-f885-3848", "name": ""}, {"url": "https://github.com/JuneAndGreen/sm-crypto/commit/1f9bd7bd160c24efd9c26c8f7fda997c68c823d0", "name": ""}, {"url": "https://github.com/advisories/GHSA-vh45-f885-3848", "name": ""}], "scope_influence": "", "tags": ["npm", "开源"], "title": ty/advisories/GHSA-g98q-rm45-q9h8", "name": ""}, {"url": "https://www.vulncheck.com/advisories/flowise-before-remote-code-execution-via-custom-mcp", "name": ""}, {"url": "https://github.com/FlowiseAI/Flowise/commit/a4c4e4988cded15edf725e762560575b889ae351", "name": "Commit"}], "scope_influence": "广", "tags": ["AI", "npm", "poc", "专家校准", "开源"], "title": "Flowise Custom MCP 远程代码执行漏洞", "_translated": true, "_saved_at": "2026-08-14T06:09:18+00:00", "_first_saved_at": "2026-08-14T04:01:33+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-sb9i-wqop"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-19188", "cvss": {"cvssv31": [{"source": "ics-cert@hq.dhs.gov", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 10}], "cvssv4": [{"source": "ics-cert@hq.dhs.gov", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 10}]}, "cvss_score": 10, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/S 编码实践：开发人员应该采用安全编码实践，包括避免使用eval函数、避免拼接用户输入的字符串作为代码执行等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止代码注入攻击。", "title": "如何预防代码注入"}], "cnvd_id": "", "cve_id": "CVE-2026-73678", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 10}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 10}]}, "cvss_score": 10, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-94", "description": "MindsDB Minds Platform 版本 26.1.0 及更早版本包含未经身份验证的远程代码执行漏洞，该漏洞允许未经身份验证的攻击者通过向未受保护的 POST /api/v1/responses/ 端点提交精心设计的提示来执行任意操作系统命令，该端点会到达 Anton 代理的暂存器工具，该工具在没有沙箱的情况下在受攻击者影响的 Python 源上调用 exec()。攻击者可以首先通过未经身份验证的 PUT /api/v1/settings/ 端点配置自己的 LLM API 密钥，然后发布提示，指示代理使用任意 Python 代码调用暂存器工具，在用户运行桌面应用程序时实现完整的操作系统命令执行，并允许访问 SSH 密钥、存储的凭据和环境机密。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "代码注入", "kind_en": "代码生成控制不当（“代码注入”）", "last_modified_time": "2026-08-15", "level": "Critical", "mps_id": "MPS-5y9a-3gnx", "poc": false, "poc_url": [], "published_time": "2026-08-15", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-5y9a-3gnx", "name": "https://www.oscs1024.com/hd/MPS-5y9a-3gnx"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73678", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73678"}, {"url": "https://github.com/mindsdb/minds-platform", "name": ""}, {"url": "https://github.com/mindsdb/minds-platform/security/advisories/GHSA-jcxw-h8ph-pxpv", "name": ""}, {"url": "https://www.vulncheck.com/advisories/mindsdb-minds-platform-unauthenticated-rce-via-scratchpad-exec", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-73678漏洞", "_translated": true, "_saved_at": "2026-08-14T20:25:03+00:00", "_first_saved_at": "2026-08-14T20:25:03+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-5y9a-3gnx"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过向受信任的数据序列化过程中添加恶意数据，从而在序列化和反序列化过程中执行恶意代码的攻击漏洞。这种漏洞通常存在于使用序列化 (serialization) 机制存储和传输数据的程序中。\n", "title": "什么是反序列化"}, {"content": "- 注入攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码注入到程序中，从而实现代码执行的目的。\n- 反射攻击：攻击者使用反射机制，在序列化过程中动态生成恶意数据，并将恶意代码注入到程序中，从而实现代码执行的目的。\n- 缓冲区溢出攻击：攻击者通过在序列化过程中向缓冲区输入恶意数据，导致缓冲区溢出，从而破坏程序的内存管理，实现代码执行的目的。\n- 格式字符串攻击：攻击者通过在序列化过程中输入恶意数据，导致程序使用错误的格式字符串，从而实现代码执行的目的。\n- 数据流攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码作为一个数据流传递给程序，从而实现代码执行的目的。\n", "title": "反序列化常见的攻击方式"}, {"content": "- 不信任输入数据：程序应该严格检查输入数据的有效性，并避免使用不受信任的数据。\n- 使用安全的序列化机制：程序应该使用安全的序列化机制，如 JSON 或 XML 序列化，而不是第三方序列化库。\n- 最小特权原则：程序应该限制对受信任数据的处理权限，并避免在运行时修改数据。\n- 代码审查和漏洞扫描：程序应该进行代码审查和漏洞扫描，以发现和修复潜在的安全漏洞。\n", "title": "如何预防反序列化"}], "cnvd_id": "", "cve_id": "CVE-2025-7639", "cvss": {"cvssv4": [{"source": "ics-cert@hq.dhs.gov", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 10}]}, "cvss_score": 10, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-502", "description": "该漏洞如果被利用，可能会允许经过身份验证的不法分子 \n拥有“DNA权威-操作员”权限篡改序列化 \n数据，可能导致反序列化期间代码执行 \n在企业 SCADA 安全组“DNA Apps”的权限下。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "反序列化", "kind_en": "不可信数据的反序列化", "last_modified_time": "2026-08-15", "level": "Critical", "mps_id": "MPS-nv04-e6rg", "poc": false, "poc_url": [], "published_time": "2026-08-15", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-nv04-e6rg", "name": "https://www.oscs1024.com/hd/MPS-nv04-e6rg"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2025-7639", "name": "https://nvd.nist.gov/vuln/detail/CVE-2025-7639"}, {"url": "https://github.com/cisagov/CSAF/blob/develop/csaf_files/OT/white/2026/icsa-26-225-01.json", "name": ""}, {"url": "https://www.aveva.com/content/dam/aveva/documents/support/cyber-security-updates/SecurityBulletin_AVEVA-2026-005.pdf", "name": ""}, {"url": "https://www.cisa.gov/news-events/ics-advisories/icsa-26-225-01", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2025-7639漏洞", "_translated": true, "_saved_at": "2026-08-14T20:25:14+00:00", "_first_saved_at": "2026-08-14T20:25:14+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-nv04-e6rg"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-17186", "cvss": {"cvssv31": [{"source": "psirt@us.ibm.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:H", "severity": "critical", "base_score": 9.9}]}, "cvss_score": 9.9, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:H", "cwe": "CWE-78", "description": "IBM Db2 Mirror for i 7.4、7.5 和 7.6 可能允许远程攻击者由于命令中特殊元素的不正确中和而执行任意 CL 命令。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-08-15", "level": "Critical", "mps_id": "MPS-9zgr-t52w", "poc": false, "poc_url": [], "published_time": "2026-08-15", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-9zgr-t52w", "name": "https://www.oscs1024.com/hd/MPS-9zgr-t52w"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-17186", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-17186"}, {"url": "https://www.ibm.com/support/pages/node/7283359", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-17186漏洞", "_translated": true, "_saved_at": "2026-08-14T21:19:30+00:00", "_first_saved_at": "2026-08-14T21:19:30+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-9zgr-t52w"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-20 stgreSQL“CAST”函数通过任意子查询的结果生成错误，然后将其注入 Metacat 返回的 XML 错误消息中。攻击者无需经过身份验证即可执行攻击。  此外，还可以执行在Metacat数据库中插入、更新和删除数据的任意SQL语句，从而导致数据库中的所有数据被完全泄露。针对这些漏洞已经开发并验证了完整的概念验证攻击。此漏洞的影响对于 DataONE 网络中的 Metacat 部署至关重要，其中数据库中的信息可能会被泄露、添加、更改或删除。这包括有关数据目录的管理信息、有关谁访问数据的访问日志信息、有关个人的识别信息（包括其 ORCID 标识符和客户端 IP 地址）、有关谁应该能够访问和修改数据的访问控制信息，以及数据系统的其他关键内部结构。此 SQL 注入漏洞已在 Metacat 3.4.1 版本中得到完全修复。如果无法立即升级到 Metacat 3.4.1，大多数部署可以通过禁用 web 应用程序部署中的“/cn” REST 端点来缓解该问题。 DataONE 网络中的成员存储库不需要或使用此 API，因为它仅由 DataONE 协调节点部署使用。因此，可以禁用此 API，而不会减少大多数部署的功能。要禁用易受攻击的端点，只需删除与两个 servlet“edu.ucsb.nceas.metacat.restservice.v1.CNRestServlet”和“edu.ucsb.nceas.metacat.restservice.v2.CNRestServlet”关联的 servlet 引擎中“/cn”端点的 servlet 和 servlet 映射即可。例如，在 Tomcat 中，从 Metacat 中的应用程序 web.xml 文件中删除相关的“servlet-mapping”元素。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "身份验证不当", "kind_en": "认证不当", "last_modified_time": "2026-08-15", "level": "Critical", "mps_id": "MPS-7c0b-42rw", "poc": false, "poc_url": [], "published_time": "2026-08-15", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-7c0b-42rw", "name": "https://www.oscs1024.com/hd/MPS-7c0b-42rw"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-48528", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-48528"}, {"url": "https://github.com/NCEAS/metacat/security/advisories/GHSA-6g6j-wh5h-77h5", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-48528漏洞", "_translated": true, "_saved_at": "2026-08-14T19:44:07+00:00", "_first_saved_at": "2026-08-14T18:44:19+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-7c0b-42rw"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如C , HTTPException, BackgroundTasks 引入 FastAPI 符号而未引入 Depends，第 43 行通过 router = APIRouter() 实例化路由器时也未设置 dependencies= 形参，并且文件整体没有从 ..oauth.middleware 引入 require_read_access、require_write_access、AuthenticationResult，导致 upload_document、batch_upload_documents、get_upload_status、get_upload_history、remove_document、remove_documents_by_tags、search_document_content 这七个 /api/documents/* 路由处理器在签名中均缺少 Depends(require_read_access) / Depends(require_write_access) 形参，直接进入 storage.store、storage.delete_by_tags 等存储后端逻辑；当运维启用 HTTP REST 模式并配置 MCP_API_KEY 或 OAuth 时，/api/memories 路由会被 require_read_access/require_write_access 守卫拦截返回 401，但 /api/documents/* 路由仍允许任意请求访问，从而造成未授权的内存读写删链路。\n修复版本中通过，修复版本（10.67.1）中通过在 documents.py 头部 import 中补齐 Depends 并新增 from ..oauth.middleware import require_read_access, require_write_access, AuthenticationResult，然后为 upload_document、batch_upload_documents、remove_document、remove_documents_by_tags 等写操作路由添加 user: AuthenticationResult = Depends(require_write_access) 形参，为 get_upload_status、get_upload_history、search_document_content 等读操作路由添加 user: AuthenticationResult = Depends(require_read_access) 形参，使每一个进入 storage.store / storage.delete_by_tags 的请求都必须先经 MCP_API_KEY 或 OAuth 校验，未授权访问被 FastAPI 依赖注入在路由入口拦截，从而切断未认证读写删的利用路径；用户应升级至 10.67.1 及以上版本，或在升级前通过反向代理/防火墙限制对 /api/documents/* 的外部访问作为临时缓解。", "effects": [{"comp_name": "mcp-memory-service", "ecosystem": "pip", "versions": [{"affected_version": "[0,10.67.1)", "min_fixed_version": "10.67.1", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "关键功能的认证机制缺失", "kind_en": "缺少关键功能的身份验证", "last_modified_time": "2026-07-03", "level": "Critical", "mps_id": "MPS-maq4-8hue", "poc": false, "poc_url": [], "published_time": "2026-08-15", "reference_url_list": [{"url": "https://github.com/doobidoo/mcp-memory-service/security/advisories/GHSA-84hp-mqvj-3p8h", "name": ""}, {"url": "https://gi 通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-19682", "cvss": {"cvssv31": [{"source": "vulnreport@tenable.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.9}], "cvssv4": [{"source": "vulnreport@tenable.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.4}]}, "cvss_score": 9.4, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-78", "description": "安全中心中存在命令注入漏洞，未经身份验证的远程攻击者可以利用此问题以服务帐户的权限在底层操作系统上执行任意命令。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-08-15", "level": "Critical", "mps_id": "MPS-edyj-8n3r", "poc": false, "poc_url": [], "published_time": "2026-08-15", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-edyj-8n3r", "name": ev-7jmz"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73683", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73683"}, {"url": "https://github.com/laravel/socialite", "name": ""}, {"url": "https://github.com/laravel/socialite/commit/caf714f55d51ab0d914b40033d8b0f489d6219cc", "name": ""}, {"url": "https://github.com/laravel/socialite/pull/789", "name": ""}, {"url": "https://www.vulncheck.com/advisories/laravel-socialite-facebook-provider-authentication-bypass-via-nonce-replay", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-73683漏洞", "_translated": true, "_saved_at": "2026-08-14T23:16:08+00:00", "_first_saved_at": "2026-08-14T23:16:08+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-rfev-7jmz"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-67365", "cvss": {"cvssv4": [{"source": "security@joomla.org", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:L/VA:L/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.2}]}, "cvss_score": 9.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:L/VA:L/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X ic_connection.erl 的 process_tls_message 中对客户端引入 quic_tls:verify_certificate_verify/4 签名校验与新增模块 quic_cert:validate_server/4（基于 public_key:pkix_path_validation 与 public_key:pkix_verify_hostname）的证书链与主机名校验，将 verify 默认改为 true 并新增 cacerts 选项，仅在显式 verify =\u003e false 时才接受任意证书。", "effects": [{"comp_name": "quic", "ecosystem": "hex", "versions": [{"affected_version": "(-∞,1.4.4)", "min_fixed_version": "1.4.4", "repository": "hex", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "对宿主不匹配的证书验证不恰当", "kind_en": "主机不匹配导致证书验证不当", "last_modified_time": "2026-08-15", "level": "Critical", "mps_id": "MPS-glz7-hkba", "poc": false, "poc_url": [], "published_time": "2026-08-15", "reference_url_list": [{"url": "https://github.com/benoitc/erlang_quic/security/advisories/GHSA-2r8v-p65x-3663", "name": ""}, {"url": "https://github.com/advisories/GHSA-2r8v-p65x-3663", "name": ""}], "scope_influence": "", "tags": [], "title": "QUIC 客户端 TLS 服务器身份校验失效漏洞", "_translated": true, "_saved_at": "2026-08-14T20:25:09+00:00", "_first_saved_at": "2026-08-14T20:25:09+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-glz7-hkba"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-14484", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:H/A:H", "severity": "critical", "base_score": 9.1}]}, "cvss_score": 9.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:H/A:H", "cwe": "CWE-22", "description": "WordPress 的 RapiSafe – 用于联系表单 7 的安全多文件上传插件容易受到任意文件删除的影响，因为在 1.0.4 及之前的所有版本中，handleAjaxRemoveUpload 函数中的文件路径验证不足。这使得未经身份验证的攻击者可以删除服务器上的任意文件，当删除正确的文件（例如wp-config.php）时，很容易导致远程代码执行。调用删除处理程序所需的随机数在每个呈现 RapiSafe 上传字段的联系表单 7 页面上以 RSMFCF7Vars.nonce 的形式在面向公众的 JavaScript 中公开，使得任何未经身份验证的访问者都可以获取该随机数。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-08-15", "level": "Critical", "mps_id": "MPS-n5jc-e72h", "poc": false, "poc_url": [], "published_time": "2026-08-15", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-n5jc-e72h", "name": "https://www.oscs1024.com/hd/MPS-n5jc-e72h"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-14484", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-14484"}, {"url": "https://plugins.trac.wordpress.org/browser/rapisafe-multi-file-cf7/trunk/src/RSMFCF7_Assets.php#L201", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/rapisafe-multi-file-cf7/trunk/src/RSMFCF7_Assets.php#L235", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/rapisafe-multi-file-cf7/trunk/src/RSMFCF7_Assets.php#L237", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/rapisafe-multi-file-cf7/trunk/src/RSMFCF7_Assets.php#L244", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/rapisafe-multi-file-cf7/trunk/src/RSMFCF7_Assets.php#L264", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/rapisafe-multi-file-cf7/  存档，可能会导致提取的文件写入预期的提取目录之外。这可能允许攻击者覆盖 Pandora 工作进程可访问的文件，并可能导致应用程序泄露、任意代码执行或拒绝服务，具体取决于目标文件和 Pandora 进程的权限。\n\n\n该漏洞已通过使用 Python 的 filter='data' 提取过滤器得到纠正，该过滤器会拒绝或清理危险的 TAR 成员，包括逃逸目标目录和不安全链接目标的路径。 \n\n\n该弱点对应于 MITRE 的一般路径遍历类别，其中包括攻击者控制的文件名导致文件被写入预期目录之外的存档提取情况。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-08-16", "level": "Critical", "mps_id": "MPS-6qsp-bmcl", "poc": false, "poc_url": [], "published_time": "2026-08-16", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-6qsp-bmcl", "name": "https://www.oscs1024.com/hd/MPS-6qsp-bmcl"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-74764", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-74764"}, {"url": "https://github.com/pandora-analysis/pandora/commit/186b58d41e04248a154d274fffb5813e7fa2012e", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-74764漏洞", "_translated": true, "_saved_at": "2026-08-16T02:20:45+00:00", "_first_saved_at": "2026-08-15T23:14:04+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-6qsp-bmcl"}, {"analysis_status": 0, "articles": [{"content": "- 程序未正确处理用户上传的文件，从而导致程序可以读取、处理或存储未经授权的文件\n", "title": "什么是任意文件上传"}, {"content": "- 欺骗攻击：攻击者可以通过发送伪造的文件来欺骗程序，从而导致程序读取、处理或存储未经授权的文件。\n- 文件格式攻击：攻击者可以通过选择特定的文件格式，例如压缩文件或 ZIP 文件，从而利用上传的文件来篡改程序的执行结果或窃取程序中的重要数据。\n", "title": "任意文件上传常见的攻击方式"}, {"content": "- 使用安全文件传输协议 (FTP):使用安全 FTP 协议可以确保上传的文件格式、大小、权限等符合预期，同时可以防止文件读取、篡改或存储漏洞。\n- 使用文件上传过滤器：使用文件上传过滤器可以过滤上传的文件，以确保文件的格式、大小、权限等符合预期，同时可以防止文件读取、篡改或存储漏洞。\n- 使用白名单机制：使用白名单机制可以只允许特定的文件格式、大小、权限等存在的文件上传，从而防止非法文件的上传和攻击。\n- 定期更新和升级程序：定期更新和升级程序可以修复已知的漏洞，并增强程序的安全性。", "title": "如何预防任意文件上传"}], "cnvd_id": "", "cve_id": "CVE-2026-16098", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-434", "description": "WordPress 的 ProSolution WP 客户端插件在 2.0.10 及之前的所有版本中都容易通过 proSol_handleFileUpload 函数受到任意文件上传的攻击。这是由于缺少对攻击者控制的 Content-Disposition 标头文件名的验证（该文件名会在保存文件之前覆盖允许列出的多部分文件名），以及保存后扩展检查无法删除已写入的文件。这使得未经身份验证的攻击者可以上传可执行的文件，从而使远程代码执行成为可能。到达上传处理程序所需的随机数通过呈现作业门户短代码的任何前端页面上的 wp_localize_script 公开公开，允许未经身份验证的访问者获取有效的随机数并完全绕过该门控检查。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "任意文件上传", "kind_en": "危险类型文件无限制上传", "last_modified_time": "2026-08-16", "level": "Critical", "mps_id": "MPS-7cia-s25k", "poc": false, "poc_url": [], "published_time": "2026-08-16", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-7cia-s25k", "name": "https://www.oscs1024.com/hd/MPS-7cia-s25k"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-16098", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-16098"}, {"url": "https://plugins.trac.wordpress.org/browser/prosolution-wp-client/tags/2.0.6/includes/UploadHandler.php#L1090", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/prosolution-wp-client/tags/2.0.6/includes/UploadHandler.php#L1327", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/prosolution-wp-client/tags/2.0.6/includes/class-prosolwpclient.php#L254", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/prosolution-wp-client/tags/2.0.6/public/class-prosolwpclient-public.php#L1033", "name": ""}, {"url": "https://plugins.trac.wordpress.org/changeset?reponame=\u0026old=3644463%40prosolution-wp-client\u0026new=3644463%40prosolution-wp-client", "name": ""}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/3c4a7aef-09ec-4d17-87d6-f507d64e0afa?source=cve", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-16098漏洞", "_translated": true, "_saved_at": "2026-08-16T05:22:22+00:00", "_first_saved_at": "2026-08-16T05:22:22+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-7cia-s25k"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-19598", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-863", "description": "在 3.3.9 及之前的所有版本中，Pods – WordPress 的自定义内容类型和字段插件很容易通过授权绕过进行权限升级。该漏洞的存在是因为 pods_admin AJAX 路由器通过 pods_error() 汇集了每个访问检查（包括方法白名单、随机数验证、登录强制和功能门），该方法在 JSON 元盒加载器兼容性路径下仅将失败写入 PHP 错误日志并返回 false，而不是终止请求，从而使所有防护措施无效。  这使得未经身份验证的攻击者可以将其权限升级为管理员或覆盖任何用户帐户的密码（包括站点所有者的密码），从而实现完全站点接管，或执行其他管理员操作。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-08-16", "level": "Critical", "mps_id": "MPS-m6ji-8r40", "poc": false, "poc_url": [], "published_time": "2026-08-16", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-m6ji-8r40", "name": "https://www.oscs1024.com/hd/MPS-m6ji-8r40"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-19598", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-19598"}, {"url": "https://plugins.trac.wordpress.org/browser/pods/tags/3.3.9/includes/general.php#L400", "name": ""}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/3628032a-3121-45a7-8a78-cfcd8ba6af2f?source=cve", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-19598漏洞", "_translated": true, "_saved_at": "2026-08-15T22:14:38+00:00", "_first_saved_at": "2026-08-15T19:16:54+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-m6ji-8r40"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "cnvd_id": "", "cve_id": "CVE-2026-18432", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-269", "description": "WordPress 的 Frontend Admin by DynamiApps 插件在 3.29.9 及之前的所有版本中都容易受到权限升级的影响。该漏洞的存在是因为 `ActionUser::conditions_logic()` 在 `is_numeric()` 测试后面控制了 `current_user_can('edit_user', $user_id)` 授权检查，导致当 `$user_id` 是非数字字符串时完全跳过检查 — 这种情况可以通过将精心设计的值（例如 `1one`）传递到未经验证的未经验证的 `item_id` 参数来引发。 `wp_ajax_nopriv_frontend_admin/forms/change_form` AJAX 端点。这使得攻击者可以通过获取带有非数字用户 ID 的服务器签名“_acf_objects”负载来将权限升级为管理员，WordPress 随后将其强制为整数 1（默认管理员），从而允许攻击者覆盖该帐户的密码或电子邮件地址。未经身份验证的用户利用该漏洞需要配置面向公众的前端用户表单；在所有其他情况下，订户级帐户就足够了。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-08-16", "level": "Critical", "mps_id": "MPS-unoy-trgw", "poc": false, "poc_url": [], "published_time": "2026-08-16", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-unoy-trgw", "name": "https://www.oscs1024.com/hd/MPS-unoy-trgw"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-18432", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-18432"}, {"url": "https://plugins.trac.wordpress.org/browser/acf-frontend-form-element/tags/3.29.3/main/frontend/forms/actions/user.php#L565", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/acf-frontend-form-element/tags/3.29.3/main/frontend/forms/actions/user.php#L680", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/acf-frontend-form-element/tags/3.29.3/main/frontend/forms/classes/display.php#L1654", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/acf-frontend-form-element/tags/3.29.3/main/frontend/forms/classes/display.php#L1953", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/acf-frontend-form-element/tags/3.29.3/main/frontend/forms/classes/display.php#L37", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/acf-frontend-form-element/tags/3.29.9/main/frontend/forms/actions/user.php#L565", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/acf-frontend-form-element/tags/3.29.9/main/frontend/forms/actions/user.php#L680", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/acf-frontend-form-element/tags/3.29.9/main/frontend/forms/classes/display.php#L1654", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/acf-frontend-form-element/tags/3.29.9/main/frontend/forms/classes/display.php#L1953", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/acf-frontend-form-element/tags/3.29.9/main/frontend/forms/classes/display.php#L37", "name": ""}, {"url": "https://plugins.trac.wordpress.org/changeset?reponame=\u0026old=3633030%40acf-frontend-form-element\u0026new=3633030%40acf-frontend-form-element", "name": ""}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/01404fad-7b5a-485a-b557-c608fe25e6c9?source=cve", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-18432漏洞", "_translated": true, "_saved_at": "2026-08-16T05:22:16+00:00", "_first_saved_at": "2026-08-16T05:22:16+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-unoy-trgw"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过向受信任的数据序列化过程中添加恶意数据，从而在序列化和反序列化过程中执行恶意代码的攻击漏洞。这种漏洞通常存在于使用序列化 (serialization) 机制存储和传输数据的程序中。\n", "title": "什么是反序列化"}, {"content": "- 注入攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码注入到程序中，从而实现代码执行的目的。\n- 反射攻击：攻击者使用反射机制，在序列化过程中动态生成恶意数据，并将恶意代码注入到程序中，从而实现代码执行的目的。\n- 缓冲区溢出攻击：攻击者通过在序列化过程中向缓冲区输入恶意数据，导致缓冲区溢出，从而破坏程序的内存管理，实现代码执行的目的。\n- 格式字符串攻击：攻击者通过在序列化过程中输入恶意数据，导致程序使用错误的格式字符串，从而实现代码执行的目的。\n- 数据流攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码作为一个数据流传递给程序，从而实现代码执行的目的。\n", "title": "反序列化常见的攻击方式"}, {"content": "- 不信任输入数据：程序应该严格检查输入数据的有效性，并避免使用不受信任的数据。\n- 使用安全的序列化机制：程序应该使用安全的序列化机制，如 JSON 或 XML 序列化，而不是第三方序列化库。\n- 最小特权原则：程序应该限制对受信任数据的处理权限，并避免在运行时修改数据。\n- 代码审查和漏洞扫描：程序应该进行代码审查和漏洞扫描，以发现和修复潜在的安全漏洞。\n", "title": "如何预防反序列化"}], "cnvd_id": "", "cve_id": "CVE-2024-13784", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-502", "description": "在 1.8.5 及之前的所有版本中，联系表单、调查、测验和弹出表单生成器 – WordPress 的 ARForms 插件很容易通过反序列化表单提交中的不受信任的输入而受到 PHP 对象注入的攻击。这使得未经身份验证的攻击者可以注入 PHP 对象。易受攻击的软件中不存在已知的 POP 链，这意味着除非网站上安装了另一个包含 POP 链的插件或主题，否则此漏洞不会产生影响。如果通过目标系统上安装的附加插件或主题存在 POP 链，则可能允许攻击者根据存在的 POP 链执行删除任意文件、检索敏感数据或执行代码等操作。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "反序列化", "kind_en": "不可信数据的反序列化", "last_modified_time": "2026-08-16", "level": "Critical", "mps_id": "MPS-w6m3-1dze", "poc": false, "poc_url": [], "published_time": "2026-08-16", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-w6m3-1dze", "name": "https://www.oscs1024.com/hd/MPS-w6m3-1dze"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2024-13784", "name": "https://nvd.nist.gov/vuln/detail/CVE-2024-13784"}, {"url": "https://wordpress.org/plugins/arforms-form-builder/", "name": ""}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/5e0116d6-91c3-4212-9c68-6b706ab09768?source=cve", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2024-13784漏洞", "_translated": true, "_saved_at": "2026-08-16T14:16:20+00:00", "_first_saved_at": "2026-08-16T10:16:44+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-w6m3-1dze"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-73052", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:R/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:P/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.4}]}, "cvss_score": 9.4, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:P/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-79", "description": "v3.7.4之前的SiYuan存储属性视图字段名称，不进行HTML转义，并通过排序菜单中的innerHTML将它们直接插入到选项元素中。攻击者可以通过重命名数据库字段来注入标记，以便在用户打开排序菜单时执行任意 JavaScript，并在桌面客户端中启用节点集成来执行代码。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-08-16", "level": "Critical", "mps_id": "MPS-2ljs-rn8t", "poc": false, "poc_url": [], "published_time": "2026-08-16", "reference_url_list": vd.nist.gov/vuln/detail/CVE-2026-73050"}, {"url": "https://github.com/siyuan-note/siyuan/security/advisories/GHSA-m7cc-jh9q-wxg8", "name": ""}, {"url": "https://www.vulncheck.com/advisories/siyuan-before-stored-xss-via-select-option-color", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-73050漏洞", "_translated": true, "_saved_at": "2026-08-15T23:14:13+00:00", "_first_saved_at": "2026-08-15T23:14:13+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-v89j-4mac"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-74251", "cvss": {"cvssv4": [{"source": "security@joomla.org", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-89", "description": "Joomla 扩展 - phoca.cz - 通过 Phoca Cart 5.0.0-6.1.16 中的属性过滤器进行未经身份验证的 SQL 注入 - Phoca Cart 公共商店商品页面上的 a[]（属性）和 s[]（规范）GET 数组参数原始连接到 SQ 来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-18316", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:H/A:H", "severity": "critical", "base_score": 9.1}]}, "cvss_score": 9.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:H/A:H", "cwe": "CWE-862", "description": "WordPress 的 Solace Extra 插件容易受到未经授权的修改和数据丢失，因为在 1.6.0 及以下版本中缺少对 import_zip() 函数的功能检查。该处理程序在 wp_ajax_action-import-zip 和 wp_ajax_nopriv_action-import-zip 上注册，并且仅验证“ajax-nonce”随机数，该随机数通过 wp_localize_script （不受限制的 admin_enqueue_scripts 挂钩）在每个管理页面上发出，因此任何经过身份验证的用户（包括订阅者）都可以访问该随机数。这使得具有订阅者级别及以上访问权限的经过身份验证的攻击者可以擦除导航菜单、侧边栏小部件（通过 update_option('sidebars_widgets', array())）、所有主题 mod（通过 remove_theme_mods()）和 Elementor 模板，以及触发任意演示内容导入。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-08-16", "level": "Critical", "mps_id": "MPS-0ugv-8dyb", "poc": false, "poc_url": [], "published_time": "2026-08-16", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-0ugv-8dyb", "name": "https://www.oscs1024.com/hd/MPS-0ugv-8dyb"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-18316", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-18316"}, {"url": "https://plugins.trac.wordpress.org/browser/solace-extra/tags/1.6.0/admin/class-solace-extra-admin.php#L289", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/solace-extra/tags/1.6.0/admin/import.php#L2382", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/solace-extra/tags/1.6.0/includes/class-solace-extra.php#L336", "name": ""}, {"url": "https://plugins.trac.wordpress.org/changeset?reponame=\u0026old=3627961%40solace-extra\u0026new=3627961%40solace-extra", "name": ""}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/4e427c4e-3e27-49e3-ba64-6241b430d5d8?source=cve", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-18316漏洞", "_translated": true, "_saved_at": "2026-08-16T06:29:41+00:00", "_first_saved_at": "2026-08-16T06:29:41+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-0ugv-8dyb"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-18855", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:H/A:H", "severity": "critical", "base_score": 9.1}]}, "cvss_score": 9.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:H/A:H", "cwe": "CWE-22", "description": "WordPress 的链接库插件容易受到任意文件删除的影响，因为在 7.9.4 及之前的所有版本中，ll_delete_link_fields 函数中的文件路径验证不足，这使得未经身份验证的攻击者可以删除服务器上的任意文件，当删除正确的文件（例如 wp-config.php）时，很容易导致远程代码执行。利用该漏洞需要管理员启用“删除链接时删除本地文件”插件选项（默认情况下禁用），并随后永久删除攻击者提交的链接，这是例行的审核操作。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "k 令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-73570", "cvss": {"cvssv31": [{"source": "cve@mitre.org", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:C/C:H/I:H/A:L", "severity": "high", "base_score": 8.9}]}, "cvss_score": 8.9, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:C/C:H/I:H/A:L", "cwe": "CWE-78", "description": "当安装可选的 zimbra-snmp 软件包并启用 SNMP 通知时，10.1.20 之前的 Zimbra Collaboration (ZCS) 中存在远程执行代码漏洞。由于 SNMP 通知处理期间对不受信任输入的清理不当，未经身份验证的攻击者可以发送特制的 SMTP 请求，这可能导致以 Zimbra 用户身份执行任意操作系统命令。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-08-14", "level": "High", "mps_id": "MPS-vhp8-rung", "poc": false, "poc_url": [], "published_time": "2026-08-14", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-vhp8-rung", "name": "https://www.oscs1024.com/hd/MPS-vhp8-rung"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73570", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73570"}, {"url": "https://wiki.zimbra.com/wiki/Security_Center", "name": ""}, {"url": "https://wiki.zimbra.com/wiki/Zimbra_Security_Advisories", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-73570漏洞" ": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-843", "description": "PostgreSQL 是广泛使用的开源对象关系型数据库，其 SQL 解析层负责将用户提交的函数调用、操作符与类型转换分发到 C 语言实现的内置函数与扩展。\n受影响版本中，引擎内部有一种名叫 internal 的特殊类型，只给数据库自己的底层函数使用，普通 SQL 本不该碰到它。系统原先只拦住了把普通值直接改写成 internal 的写法，但通过函数调用、运算符或另一类隐式转换仍能绕过去。任意能执行 SQL 的数据库账号，都可以把引擎无法正确理解的数据交给这些底层函数，让进程按错误类型去解释内存，最终以运行数据库的操作系统用户身份执行代码。\n修复版本中通过在解析函数调用（ParseFuncOrColumn）和运算符时直接拒绝接受或返回 internal 的函数，并禁止其他类型与 internal 互相转换，普通 SQL 再也进不了这条路径，看错类型并执行系统代码的问题被切断。", "effects": [{"comp_name": "postgresql", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,14.24)", "min_fixed_version": "14.24", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[15.0,15.19)", "min_fixed_version": "15.19", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[16.0,16.15)", "min_fixed_version": "16.15", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[17.0,17.11)", "min_fixed_version": "17.11", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[18.0,18.6)", "min_fixed_version": "18.6", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "使用不兼容类型访问资源（类型混淆）", "kind_en": "使用不兼容类型访问资源（“类型混淆”）", "last_modified_time": "2026-08-14", "level": "High", "mps_id": "MPS-my97-jv3r", "poc": false, "poc_url": [], "published_time": "2026-08-14", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-my97-jv3r", "name": "https://www.oscs1024.com/hd/MPS-my97-jv3r"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-14680", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-14680"}, {"url": "https://www.postgresql.org/support/security/CVE-2026-14680/", "name": ""}, {"url": "https://github.com/postgres/postgres/commit/54649de65f0822ee0678cc2b2df "", "exploit_requirement_cost": "低", "exploitability": "极高", "fix_suggestion": "建议修复", "kind": "关键功能的认证机制缺失", "kind_en": "缺少关键功能的身份验证", "last_modified_time": "2026-08-14", "level": "High", "mps_id": "MPS-6rz0-9ic3", "poc": true, "poc_url": [], "published_time": "2026-08-14", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-6rz0-9ic3", "name": "https://www.oscs1024.com/hd/MPS-6rz0-9ic3"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73673", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73673"}, {"url": "https://github.com/ozcanpng/CVE-2026-73673", "name": ""}, {"url": "https://ozcanpng.dev/blog/cve-2026-73673-netis-nc63-unauthenticated-firmware-update/", "name": ""}, {"url": "https://www.netis-systems.com/detail/proid/307/NC63.html", "name": ""}, {"url": "https://www.vulncheck.com/advisories/netis-nc63-unauthenticated-firmware-update-with-missing-cryptographic-firmware-authentication", "name": ""}], "scope_influence": "", "tags": ["poc"], "title": "CVE-2026-73673漏洞", "_translated": true, "_saved_at": "2026-08-14T14:12:46+00:00", "_first_saved_at": "2026-08-14T14:12:46+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-6rz0-9ic3"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-59109", "cvss": {"cvssv31": [{"source": "a6d3dc9e-0591-4a13-bce7-0f5b31ff6158", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}], "cvssv4": [{"source": "a6d3dc9e-0591-4a13-bce7-0f5b31ff6158", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-89", "description": "Zalktis 会计应用程序中的 SQL 注入通过\n收到的电子发票中由贸易伙伴控制的文本字段。当\n导入收到的电子发票 (UBL/PEPPOL) 或电子商务出口，Zalktis\n使用以下命令将合作伙伴控制的值直接连接到 SQL 语句文本中\n字符串连接，既没有参数化查询，也没有转义。的\n应用程序自己的转义助手 Dazadi.sql_txt(),\n不会在这些代码路径上调用，因此发送发票的一方可能会中断\n脱离字符串文字并更改查询逻辑。\n\n\n\n\n\n\n\n\n\n此问题影响 Zalktis：2026.1.586 之前和 2026.2.592 之前。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-08-14", "level": "High", "mps_id": "MPS-grdx-yae2", "poc": false, "poc_url": [], "published_time": "2026-08-14", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-grdx-yae2", "name": "https://www.oscs1024.com/hd/MPS-grdx-yae2"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-59109", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-59109"}, {"url": "https://cvd.cert.lv/disclosed/vuln-all-631428755", "name": ""}, {"url": "https://offseq.com/en/research/zalktis-cve-2026-59109", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-59109漏洞", "_translated": true, "_saved_at": "2026-08-13T18:55:18+00:00", "_first_saved_at": "2026-08-13T18:55:18+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-grdx-yae2"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "cnvd_id": "", "cve_id": "CVE-2026-72833", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-269", "description": "Grav API 插件 (getgrav/grav-plugin-api) 版本 \u003e= 1.0.6 和 \u003c= 1.0.11 包含权限提升漏洞。在超级管理员帐户上创建的作用域 API 密钥会绕过其在四个 isSuperAdmin() 门控写入端点（在 GroupsController、AccountsConfigController、PreferencesController 和 DashboardWidgetController 中）声明的作用域上限。这些端点通过超级管理员提前返回进行授权，该提前返回从不调用 requirePermission()（范围上限的唯一执行点），因此“只读”范围的密钥（例如 api.pages.read）可以执行仅超级写入操作，包括重写组 ACL 映射以向任意帐户授予超级管理员权限。因此，泄露或委托的只读 CI/监控密钥可以获得完整的超级管理员写入能力。已在 1.0.13 中修复。", "ef n- 定期更新和修补软件：系统软件和应用程序应该定期更新和修补，以确保它们不受最新安全漏洞的影响。", "title": "如何预防关键资源权限分配不当"}], "cnvd_id": "", "cve_id": "CVE-2026-73664", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-732", "description": "FreePBX 是一个开源 IP PBX。从 17.0.5.34 到 17.0.11，Backup.class.php 中的 publicKeySave AJAX 端点接受经过身份验证的管理员的 SSH 公钥，并将其附加到 asterisk 系统用户的 /home/asterisk/.ssh/authorized_keys 中，而无需可靠地强制执行仅备份命令和源限制。该密钥授予持久的 shell 访问权限，可以执行任意命令、访问 FreePBX 和调用数据、修改系统文件以及中断服务。此问题已在版本 17.0.11 中修复。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "关键资源权限分配不当", "kind_en": "关键资源的权限分配不正确", "last_modified_time": "2026-08-14", "level": "High", "mps_id": "MPS-54qc-m8vo", "poc": false, "poc_url": [], "published_time": "2026-08-14", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-54qc-m8vo", "name": "https://www.oscs1024.com/hd/MPS-54qc-m8vo"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73664", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73664"}, {"url": "https://github.com/FreePBX/security-reporting/security/advisories/GHSA-24w6-hpg3-rwfg", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-73664漏洞", "_translated": true, "_saved_at": "2026-08-14T01:23:10+00:00", "_first_saved_at": "2026-08-13T23:35:15+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-54qc-m8vo"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-73670", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.2}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-89", "description": "CMS 在 admin/db_data.php 第 509 行中包含 SQL 注入漏洞，该漏洞允许经过身份验证的管理员通过 table_name GET 或 POST 参数提供未经净化的输入，将任意 SQL 注入 SHOW COLUMNS FROM 语句中。攻击者可以执行表遍历、基于时间的盲注、基于布尔的盲注和基于错误的注入技术来枚举完整的数据库模式、访问信息模式等系统表，并将泄露与辅助注入点链接起来以提取凭证数据。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-08-14", "level": "High", "mps_id": "MPS-mcuq-kgzd", "poc": false, "poc_url": [], "published_time": "2026-08-14", "reference_url_list": [{"url": "http ie"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-73650", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:H/I:L/A:N", "severity": "high", "base_score": 8.2}]}, "cvss_score": 8.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:H/I:L/A:N", "cwe": "CWE-184", "description": "### 总结\n\nSVGO 的 removeScripts 插件（默认情况下禁用）从 SVG 中删除脚本，但在某些情况下可执行脚本保持不变。如果消费者依赖此插件进行清理并将其提供给用户，这些 SVG 可能会打开 XSS 之门。\n\n### 详细信息\n\nSVGO 有一个用于从 SVG 中删除脚本的插件，它删除了：\n\n- `\u003cscript\u003e` 元素\n- JavaScript URI（仅限 v4 和 v3）\n- `on...` 事件处理程序（仅限 v4 和 v3）\n\n虽然 SVGO 不是一个清理库，但 SVGO 继续为那些已经为此目的使用该插件的人维护该插件。\n\n然而，有两个问题：\n\n- SVGO 不检查命名空间/前缀的“script”元素，例如，如果为 SVG 命名空间声明显式前缀（“\u003csvg:script\u003e”）而不是使用默认命名空间（“\u003cscript\u003e”），则“\u003csvg:script\u003e”标记将保持不变。\n- SVGO 区分大小写匹配 JavaScript URI，但它应该不区分大小写。\n\n#### 概念验证\n\n````js\n从'svgo'导入{优化}；\n\n/** 假设该字符串是通过其他方式获取的，例如网络。 */\n常量原始 = `\n  \u003csvg xmlns=\"http://www.w3.org/2000/svg\" xmlns:svg=\"http://www.w3.org/2000/svg\" xmlns:uwu=\"http://www.w3.org/1999/xlink\" viewBox=\"0 0 100 100\" version=\"1.1\"\u003e\n    \u003ca uwu:href=\"JavaScript:(() =\u003e {alert(document.cookie) })();\"\u003e\u003ctext y=\"30\"\u003euwu\u003c/text\u003e\u003c/a\u003e\n    \u003csvg：脚本\u003e\n      警报（文档.cookie）；\n    \u003c/svg：脚本\u003e\n  \u003c/svg\u003e\n`;\n\n优化（原始，{\n  插件：['removeScripts']\n});\n// 未删除 \u003csvg:script\u003e 或 uwu:href=\"JavaScript:... — 仍由浏览器执行。\n````\n\n### 影响\n\n如果您在不受信任的输入（例如，用户上传到 Web 应用程序）上运行 SVGO 并且依赖于 removeScripts，则某些脚本可能仍然存在。如果该 SVG 然后由同一域中的另一个用户直接打开，它可以调用可以读取本地存储或 cookie 的脚本。\n\n如果您启用了以下其中一项，这可能会影响您：\n\n| SVGO 版本 |插件名称 |\n|---|---|\n| v4 |删除脚本 |\n| v3 |删除脚本元素 |\n| v2 |删除脚本元素 |\n| v1 |删除脚本元素 |\n\n它不太可能影响仅在自己的 SVG 或构建管道中本地使用 SVGO 的用户。\n\n### 补丁\n\n#### \u003e= 3.0.0，\u003c= 4.0.1\n\nSVGO 修补了 v4.0.2 和 v3.3.4。只需使用您首选的包管理器升级依赖项即可！例如：\n\n````嘘\n纱线向上 svgo\n\n# 或者如果 SVGO 是嵌套依赖项\n纱线向上-R svgo\n````\n\n建议的修复是改进我们的命名空间感知处理，以仅显式地作用于默认命名空间、SVG 命名空间和 XHTML 命名空间。这会处理浏览器执行的所有脚本，但会保留完整的自定义前缀，这些前缀恰好有一个名为“\u003c*:script\u003e”的元素，客户端不应将其视为可执行文件。 \n\n#### \u003e= 2.0.0，\u003c= 2.8.2\n\nSVGO 修补了 v2.8.3，但是 SVGO v2 明确仅实现并记录了它将删除 `\u003cscript\u003e` 元素，仅此而已。它具有对“\u003csvg:script\u003e”或“\u003cxhtml:script\u003e”等标签的名称空间感知处理，但已更新**_not_**以删除 JavaScript URI 或事件处理程序（如 \u003e= v3）。如果您需要此功能，请升级到 v4 或 v3，或者使用最后记录的解决方法之一。\n\n#### \u003e= 1.0.0，\u003c= 1.3.2\n\nSVGO v1 现已弃用一段时间，并且不会修补。请升级到更新版本！如果有什么事情阻止您这样做，请联系我们！我们很乐意扩展我们的迁移指南，或者在您遇到问题时为您提供支持。\n\n### 解决方法\n\n如果您启用该插件的动机是 SVG 清理，请考虑使用专用的 SVG 清理工具并在将 SVG 传递到 SVGO 之前调用它。", "effects": [{"comp_name": "svgo", "ecosystem": "npm", "versions": [{"affected_version": "[3.0.0,3.3.4)", "min_fixed_version": "3.3.4", "repository": "npm", "solutions": [], "upstream": true}, {"affected_version": "[1.0.0,2.8.3)", "min_fixed_version": "2.8.3", "repository": "npm", "solutions": [], "upstream": true}, {"affected_version": "[4.0.0,4.0.2)", "min_fixed_version": "4.0.2", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "不完整的黑名单", "kind_en": "不允许的输入的不完整列表", "last_modified_time": "2026-08-14", "level": "High", "mps_id": "MPS-pijl-urts", "poc": false, "poc_url": [], "published_time": "2026-08-14", "reference_url_list": [{"url": "https://github.com/svg/svgo/security/advisories/GHSA-2p49-hgcm-8545", "name": ""}, {"url": "https://github.com/svg/svgo/commit/628e3bc7336625a30365d0a9b60185307d852466", "name": ""}, {"url": "https://github.com/svg/svgo/commit/72a23886b4698b27624b936f3a15a80afd36d75f", "name": ""}, {"url": "https://github.com/svg/svgo/commit/f529cfccc6c154d6f6eabe276ec637a8c5db6763", "name": ""}, {"url": "https://github.com/svg/svgo/releases/tag/v2.8.3", "name": ""}, {"url": "https://github.com/svg/svgo/releases/tag/v3.3.4", "name": ""}, {"url": "https://github.com/svg/svgo/releases/tag/v4.0.2", "name": ""}, {"url": "https://github.com/advisories/GHS b.com/openchoreo/openchoreo/security/advisories/GHSA-v7qx-mqhq-grvh", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-73666漏洞", "_translated": true, "_saved_at": "2026-08-14T01:23:11+00:00", "_first_saved_at": "2026-08-13T23:35:17+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-wo1h-5yes"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-73658", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:C/C:H/I:H/A:N", "severity": "high", "base_score": 8.2}]}, "cvss_score": 8.2, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:C/C:H/I:H/A:N", "cwe": "CWE-862", "description": "Trigger.dev 是一个用于构建和部署完全托管的 AI 代理和工作流程的平台。从 4.4.2 到 4.5.0-rc.5，apps/webapp/app/v3/objectStoreClient.server.ts 中的 Aws4FetchClient.buildUrl() 和 Aws4FetchClient.presign() 将用户控制的数据包密钥分配给 URL.pathname，而 apps/webapp/app/routes/api.v1.packets.$.ts 接受 params[\"*\"] 而不拒绝点段并使用findResource: async () =\u003e 1 没有每个资源所有权验证。 WHATWG 路径规范化在签名之前折叠 .. 段，允许具有有效环境 API 密钥的调用者获取另一个租户的对象存储密钥的预签名 URL，并读取或覆盖任务负载。此问题已在版本 4.5.0-rc.5 中修复。", "effects": [], "epss": -1, "e
