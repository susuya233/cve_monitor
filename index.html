s://www.oscs1024.com/hd/MPS-durt-qblh"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-96891", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:N/AC:L/Au:N/C:C/I:C/A:C", "severity": "high", "base_score": 10}], "cvssv3": [{"source": "VulDB", "vector": "CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H/E:X/RL:X/RC:R", "severity": "critical", "base_score": 9.8}], "cvssv31": [{"source": "cna@vuldb.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}], "cvssv4": [{"source": "cna@vuldb.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-787", "description": "D-Link DIR-825 3.00b32 中发现了一个漏洞。受影响的是组件rp-l2tp的tunnel.c文件中的函数tunnel_set_params。对参数 peer_hostname 的操作会导致越界写入。攻击可能是远程发起的。", "effects": [{"comp_name": "DIR-825", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,3.00b32 取、篡改或存储漏洞。\n- 使用白名单机制：使用白名单机制可以只允许特定的文件格式、大小、权限等存在的文件上传，从而防止非法文件的上传和攻击。\n- 定期更新和升级程序：定期更新和升级程序可以修复已知的漏洞，并增强程序的安全性。", "title": "如何预防任意文件上传"}], "cnvd_id": "", "cve_id": "CVE-2026-93352", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-434", "description": "Laravel-Mediable 是 Plank 开源的 Laravel 媒体管理组件（composer 包 plank/laravel-mediable），用于将上传文件附加到 Eloquent 模型并管理存储目录。\n受影响版本中，为修复 CVE-2026-49972 引入的 config/mediable.php forbidden_extensions 扩展名黑名单包含 phpt 但缺少 pht，MediaUploader::verifyExtension() 在默认 allowed_extensions 为空时仅拒绝黑名单内扩展名，File::sanitizeFileName() 依据同一黑名单改写嵌套扩展名，攻击者上传的 .pht 文件可通过两处校验并写入磁盘，在 Debian/Ubuntu 默认 Apache FilesMatch 配置下被作为 PHP 执行，最终获得 Web 服务器进程权限的远程代码执行。\n修复版本中通过在 forbidden_extensions 黑名单中补充 pht 切断该链路，MediaUploader::verifyExtension() 与 File::sanitizeFileName() 依赖的默认黑名单重新覆盖 .pht，直接上传 .pht 会抛出 FileNotSupportedException，嵌套 .pht 扩展名会被改写，7.0.2 起默认配置生效。", "effects": [{"comp_name": "plank/laravel-mediable", "ecosystem": "composer", "versions": [{"affected_version": "[7.0.0,7.0.2)", "min_fixed_version": "7.0.2", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "任意文件上传", "kind_en": "危险类型文件无限制上传", "last_modified_time": "2026-09-24", "level": "Critical", "mps_id": "MPS-o95v-x6c7", "poc": false, "poc_u :N/VC:H/VI:H/VA:H/SC:L/SI:L/SA:L/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.2}]}, "cvss_score": 9.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H/SC:L/SI:L/SA:L/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-288", "description": "PortSwigger Burp Suite DAST（前身为 Burp Suite Enterprise Edition）是 PortSwigger 公司推出的闭源商业化动态应用安全测试（DAST）平台，面向企业提供集中式 Web 漏洞自动化扫描、资产管理与扫描结果管理能力。\n受影响版本中，产品认证机制存在经由备用路径或通道的绕过缺陷（CWE-288），远程攻击者可绕过正常认证校验，未经授权访问 Burp Suite DAST 控制台的相关功能与扫描数据；官方公告未披露具体受影响接口与更多利用细节。\n修复版本中通过官方安全更新消除备用访问通道并完善认证校验逻辑，封堵该身份认证绕过路径；厂商发布说明确认该严重安全问题已在 2026.8 版本修复，建议用户及时升级。", "effects": [{"comp_name": "burp_suite_dast", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2026.8)", "min_fixed_version": "2026.8", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "使用候选路径或通道进行的认证绕过", "kind_en": "使用备用路径或通道绕过身份验证", "last_modified_time": "2026-09-24", "level": "Critical", "mps_id": "MPS-wuq2-fjat", "poc": false, "poc_url": [], "published_time": "2026-09-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-wuq2-fjat", "name": "https://www.oscs1024.com/hd/MPS-wuq2-fjat"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-90481", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-90481"}, {"url": "https://portswigger.net/burp/releases/dast-2026-8", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Burp Suite DAST 身份认证绕过漏洞", "_translated": true, "_saved_at": "2026-09-24T15:42:06+00:00", "_first_saved_at": "2026-09-24T15:42:06+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-wuq2-fjat"}, {"analysis_status": 0, "articles": [{"content": "应用程序在处理用户输入时的不完善或缺乏验证机制，所以攻击者能够通过向应用程序发送恶意输入，利用应用程序对输入数据的错误处理方式来注入自己的恶意代码。这些恶意代码会被应用程序误认为是合法的指令或数据，并在执行过程中被执行。", "title": "什么是代码注入"}, {"content": "应用程序使用可执行动态代码的函数来执行用户可控的参数，当应用程序对于用户输入过滤不完全时，攻击者可以注入恶意代码并控制代码执行流程。", "title": "代码注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对所有用户输入进行验证和过滤，确保只接受预期的有效输入。这包括对输入数据进行输入长度验证、类型检查和格式验证等。\r\n- 使用参数化查询或预编译语句：对于数据库查询操作，应该使用参数化查询或预编译语句，确保输入数据不会被误认为是执行代码。\r\n- 最小特权原则：应用程序在执行操作系统命令或动态代码时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。\r\n- 安全编码实践：开发人员应该采用安全编码实践，包括避免使用eval函数、避免拼接用户输入的字符串作为代码执行等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止代码注入攻击。", "title": "如何预防代码注入"}], "cnvd_id": "", "cve_id": "CVE-2026-96756", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.1}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.2}]}, "cvss_score": 9.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-94", "description": "orval 是一个开源的 OpenAPI 代码生成工具，其 @orval/core 核心库负责解析 OpenAPI 规范并生成 TypeScript 客户端代码与测试数据工厂函数。\n受影响版本中，packages/core/src/generators/factory.ts 的 buildDefaultPayload 在 useDates 开启且 schema.default 为 date 或 date-time 格式的字符串时，直接将 OpenAPI 文档中的默认值拼接为 new Date('${schema.default}')，未做任何转义。攻击者影响项目使用的 OpenAPI 文档后，可在 default 中插入单引号闭合字面量并追加任意表达式，生成出的工厂函数在每次被调用时以消费进程权限执行注入代码。\n修复版本中通过在拼接前调用 jsStringLiteralEscape 转义默认值中的单引号与反斜杠，使字面量无法被闭合、表达式无法被注入，恶意默认值退化为无效日期参数，合法规格的生成输出保持不变。", "effects": [{"comp_name": "@orval/core", "ecosystem": "npm", "versions": [{"affected_version": "(-∞,8.30.0)", "min_fixed_version": "8.30.0", "repository": "npm", "solutions": [], "upstream": true}]}, {"comp_name": "orval", "ecosystem": "npm", "versions": [{"affected_version": "(-∞,8.30.0)", "min_fixed_version": "8.30.0", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "代码注入", "kind_en": "代码生成控制不当（“代码注入”）", "last_modified_time": "2026-09-24", "level": "Critical", "mps_id": "MPS-ybga-si52", "poc": false, "poc_url": [], "published_time": "2026-09-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ybga-si52", "name": "https://www.oscs1024.com/hd/MPS-ybga-si52"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-96756", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-96756"}, {"url": "https://github.com/orval-labs/orval/security/advisories/GHSA-wx66-36r6-v5g7", "name": "GitHub Security Advisory (GHSA-wx66-36r6-v5g7)"}, {"url": "https://github.com/orval-labs/orval/pull/4038", "name": ""}, {"url": "https://github.com/orval-labs/orval/commit/b9b083576943c683540200eb957feced57dddc1a", "name": ""}, {"url": "https://github.com/orval-labs/orval/blob/v8.29.0/packages/core/src/generators/factory.ts#L493", "name": ""}, {"url": "https://github.com/orval-labs/orval", "name": ""}, {"url": "https://www.vulncheck.com/advisories/orval-before-8.30.0-code-injection-via-factory-generation", "name": "VulnCheck Advisory: orval before 8.30.0 Code Injection via Factory Generation"}], "scope_influence": "", "tags": ["npm", "开源"], "title": "orval 工厂代码注入漏洞", "_translated": true, "_saved_at": "2026-09-23T18:09:23+00:00", "_first_saved_at": "2026-09-23T18:09:23+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ybga-si52"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-78312", "cvss": {"cvssv31": [{"source": "759f5e80-c8e1-4224-bead-956d7b33c98b", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:H/A:H", "severity": "critical", "base_score": 9.1}]}, "cvss_score": 9.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:H/A:H", "cwe": "CWE-22", "description": "DIAEnergie 中的路径遍历。\n\n此问题影响 DIAEnergie：1.11.00.022 之前的版本。", "effects": [{"comp_name": "diaenergie", "ecosystem": "linux", "versions": [{"affected_version": "[0,1.11.00.022)", "min_fixed_version": "1.11.00.022", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-09-24", "level": "Critical", "mps_id": "MPS-9uf5-g3mt", "poc": false, "poc_url": [], "published_time": "2026-09-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-9uf5-g3mt", "name": "https://www.oscs1024.com/hd/MPS-9uf5-g3mt"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-78312", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-78312"}, {"url": "https://filecenter.deltaww.com/news/download/doc/Delta-PCSA-2026-00014_DIAEnergie%20Multiple%20Vulberabilities%20(CVE-2026-78308%20~%2078313).pdf", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "DIAEnergie 中的路径遍历", "_translated": true, "_saved_at": "2026-09-24T10:56:54+00:00", "_first_saved 原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-81552", "cvss": {"cvssv31": [{"source": "psirt@us.ibm.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-78", "description": "IBM DataStage on Cloud Pak for Data 是 IBM 商业数据集成组件，以 IBM Software Hub（原 Cloud Pak for Data）服务形式交付企业级 ETL 数据抽取、转换与加载能力，源码未公开。\n受影响版本中，5.4.0.0 在环境变量处理上未对其进行正确中和，远程认证攻击者可将恶意内容注入受影响的环境变量并进入操作系统命令执行流程，最终以服务权限执行任意命令。\n修复版本中通过厂商安全更新收紧了环境变量的中和处理，阻断不可信内容进入命令执行链路；官方公告未披露更细粒度的源码修改，建议升级至 5.4 patch 7 及以上版本。", "effects": [{"comp_name": "datastage_on_cloud_pak_for_data", "ecosystem": "linux", "versions": [{"affected_version": "[5.4.0.0,5.4 patch 7)", "min_fixed_version": "5.4 patch 7", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-09-24", "level": "High", "mps_id": "MPS-boyq-uer2", "poc": false, "poc_url": [], "published_time": "2026-09-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-boyq-uer2", "name": "https://www.oscs1024.com/hd/MPS-boyq-uer2"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-81552", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-81552"}, {"url": "https://www.ibm.com/support/pages/node/7288649", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "DataStage环境变量命令注入漏洞", "_translated": true, "_saved_at": "2026-09-24T15:42:08+00:00", "_first_saved_at": "2026-09-24T15:42:08+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-boyq-uer2"}, {"analysis_status" 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-78", "description": "IBM DataStage on Cloud Pak for Data 是 IBM 提供的商业数据集成组件，运行于 Cloud Pak for Data（IBM Software Hub）平台，用于构建、调度和管理企业级 ETL 数据管道。\n受影响版本中，5.4.0.0 对操作系统命令中的特殊元素中和不当（CWE-78），远程认证攻击者可将恶意输入注入操作系统命令执行路径，从而在该平台上执行任意代码；产品闭源，官方未披露具体注入入口的文件与函数。\n修复版本中通过官方安全更新消除该命令注入缺陷，IBM 要求用户按照 Cloud Pak for Data / Software Hub 5.4.x 补丁说明升级到 5.4 patch 7 或更高版本，官方未提供临时缓解措施。", "effects": [{"comp_name": "datastage_on_cloud_pak_for_data", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,5.4 patch 7)", "min_fixed_version": "5.4 patch 7", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-09-24", "level": "High", "mps_id": "MPS-eca1-7tx5", "poc": false, "poc_url": [], "published_time": "2026-09-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-eca1-7tx5", "name": "https://www.oscs1024.com/hd/MPS-eca1-7tx5"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-81539", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-81539"}, {"url": "https://www.ibm.com/support/pages/node/7288649", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "IBM DataStage命令注入漏洞", "_translated": true, "_saved_at": "2026-09-24T15:42:15+00:00", "_first_saved_at": "2026-09-24T15:42:15+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-eca1-7tx5"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过向受信任的数据序列化过程中添加恶意数据，从而在序列化和反序列化过程中执行恶意代码的攻击漏洞。这种漏洞通常存在于使用序列化 (serialization) 机制存储和传输数据的程序中。\n", "title": "什么是反序列化"}, {"content": "- 注入攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码注入到程序中，从而实现代码执行的目的。\n- 反射攻击：攻击者使用反射机制，在序列化过程中动态生成恶意数据，并将恶意代码注入到程序中，从而实现代码执行的目的。\n- 缓冲区溢出攻击：攻击者通过在序列化过程中向缓冲区输入恶意数据，导致缓冲区溢出，从而破坏程序的内存管理，实现代码执行的目的。\n- 格式字符串攻击：攻击者通过在序列化过程中输入恶意数据，导致程序使用错误的格式字符串，从而实现代码执行的目的。\n- 数据流攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码作为一个数据流传递给程序，从而实现代码执行的目的。\n", "title": "反序列化常见的攻击方式"}, {"content": "- 不信任输入数据：程序应该严格检查输入数据的有效性，并避免使用不受信任的数据。\n- 使用安全的序列化机制：程序应该使用安全的序列化机制，如 JSON 或 XML 序列化，而不是第三方序列化库。\n- 最小特权原则：程序应该限制对受信任数据的处理权限，并避免在运行时修改数据。\n- 代码审查和漏洞扫描：程序应该进行代码审查和漏洞扫描，以发现和修复潜在的安全漏洞。\n", "title": "如何预防反序列化"}], "cnvd_id": "", "cve_id": "CVE-2026-82093", "cvss": {"cvssv31": [{"source": "psirt@us.ibm.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-502", "description": "DataStage on Cloud Pak for Data 是 IBM 推出的商业数据集成 ETL 服务，作为 IBM Cloud Pak for Data（IBM Software Hub）平台的组件提供，用于企业级数据的抽取、转换与加载，源码不公开。\n受影响版本中，组件在处理不可信数据时执行不安全的反序列化（CWE-502），持有普通用户权限的远程攻击者通过提交恶意序列化数据可触发该反序列化流程，在服务器端执行任意代码，获取系统控制权限，导致机密性、完整性与可用性全部受损。\n修复版本中通过官方补丁完成修复，IBM 安全公告要求将 DataStage on Cloud Pak for Data 5.4.0.0 升级至 5.4 patch 7 及以上版本，同时公告说明无临时缓解措施，升级后远程认证攻击者无法再利用该漏洞执行任意代码。", "effects": [{"comp_name": "DataStage on Cloud Pak for Data", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,5.4.0.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "datastage_on_cloud_pak_for_data", "ecosystem": "linux", "versions": [{"affected_version": "[5.4.0.0,5.4 patch 7)", "min_fixed_version": "5.4 patch 7", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "反序列化", "kind_en": "不可信数据的反序列化", "last_modified_time": "2026-09-24", "level": "High", "mps_id": "MPS-sa79-tgmn", "poc": false, "poc_url": [], "published_time": "2026-09-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-sa79-tgmn", "name": "https://www.oscs1024.com/hd/MPS-sa79-tgmn"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-82093", "name": "https://nvd.nist.g 目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-90959", "cvss": {"cvssv31": [{"source": "secalert@redhat.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N", "severity": "high", "base_score": 8.1}]}, "cvss_score": 8.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N", "cwe": "CWE-22", "description": "pulpcore 是 Pulp 平台的开源核心框架，用于管理、同步和分发软件仓库内容，通过 REST API 提供内容上传、远程同步与发布能力，被 Red Hat Satellite、Ansible Automation Platform 和 Red Hat Update Infrastructure 等产品采用。\n受影响版本中，内容上传 API 的 file_url 参数允许具有仓库内容上传权限的用户提交一个由服务器自行下载的地址；RemoteSerializer.validate_url 仅以字符串前缀 startswith(\"file://\") 判定是否为本地文件地址，未命中该前缀的输入被直接放行，而下载链路按 urlparse 解析出的协议分发下载器，urlparse 将不带双斜杠的 file: 前缀同样识别为文件协议，两者判定标准不一致，攻击者可提交 file:../ 形式的相对穿越地址绕过 ALLOWED_IMPORT_PATHS 白名单，FileDownloader 按解析结果拼接绝对路径读取文件，最终以 Pulp 进程权限读取服务器上任意文件；在部署 Pulp Container 的环境中，攻击者可进一步读取容器注册表令牌签名私钥并伪造 bearer token，访问注册表中全部私有容器仓库。\n修复版本中通过将校验基准从字符串前缀比较改为 urlparse 解析后的协议字段，协议为 file 的输入一律要求绝对路径、拒绝未归一化路径并强制 realpath 落在 ALLOWED_IMPORT_PATHS 内，同时在 FileDownloader 入口增加协议必须为 file 的防御性校验，切断了绕过白名单校验进入本地文件下载器的路径。", "effects": [{"comp_name": "pulpcore", "ecosystem": "pip", "versions": [{"affected_version": "[3.57.0,3.119.1)", "min_fixed_version": "3.119.1", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-09-24", "level": "High", "mps_id": "MPS-5m7p-ivnz", "poc": false, "poc_url": [], "published_time": "2026-09-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-5m7p-ivnz", "name": "https://www.oscs1024.com/hd/MPS-5m7p-ivnz"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-90959", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-90959"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-90959", "name": ""}, {"url": "https://bugzilla.redhat.com/show_bug.cgi?id=2533037", "name": "RHBZ#2533037"}], "scope_influence": "", "tags": ["python", "开源"], "title": "pulpcore 路径穿越漏洞", "_translated": true, "_saved_at": "2026-09-24T15:42:04+00:00", "_first_saved_at": "2026-09-24T15:42:04+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-5m7p-ivnz"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-6935", "cvss": {"cvssv31": [{"source": "psirt@us.ibm.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-427", "description": "IBM Concert 1.0.0 到 3.0.0 调用操作系统命令，而无需完全限定可执行路径或充分限制搜索路径解析。因此，具有本地系统访问权限的攻击者可以操纵搜索路径环境来执行不受信任或恶意代码。", "effects": [{"comp_name": "Concert", "ecosystem": "linux", "versions": [{"affected_version": "(1.0.0,3.0.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "对搜索路径元素未加控制", "kind_en": "Uncontrolled Search Path Element", "last_modified_time": "2026-09-24", "level": "High", "mps_id": "MPS-80rm-q5vo", "poc": false, "poc_url": [], "published_time": "2026-09-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-80rm-q5vo", "name": "https://www.oscs1024.com/hd/MPS-80rm-q5vo"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-6935", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-6935"}, {"url": "https://www.ibm.com/support/pages/node/7288830", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "IBM Concert 软件中的多个漏洞", "_translated": true, "_saved_at": "2026-09-23T21:57:25+00:00", "_first_saved_at": "2026-09-23T21:57:25+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-80rm-q5vo"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "attack_vector_type": "Local", "cnvd_id": "", "cve_id": "CVE-2026-97185", "cvss": {"cvssv31": [{"source": "secalert@redhat.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "cwe": "CWE-787", "description": "GIMP 是开源跨平台位图图像编辑软件，GIMPressionist 是其内置的绘画风格化插件，支持从预设文件加载笔触方向与尺寸参数。\n受影响版本中，plug-ins/gimpressionist/presets.c 的 set_orient_vector() 与 set_size_vector() 使用 atoi() 从预设文件的 orientvector/sizevector 行解析向量索引 n，未做任何边界检查即写入 pcvals.orient_vectors[n] 与 pcvals.size_vectors[n] 定长数组（各 50 个元素）。用户在 GIMPressionist 对话框预设列表中选中并应用攻击者提供的预设文件时，超出 0 至 49 范围的索引（含负数）会越界写入并破坏进程内存，可能导致崩溃或在运行 GIMP 的用户上下文中执行任意代码。\n修复版本中通过在 set_orient_vector() 与 set_size_vector() 解析索引后增加 n \u003c 0 || n \u003e= MAXORIENTVECT/MAXSIZEVECT 判断并提前返回，拒绝非法索引进入数组写入，消除越界写风险。", "effects": [{"comp_name": "gimp", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,3.2.6]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-09-24", "level": "High", "mps_id": "MPS-v5mb-n3ip", "poc": false, "poc_url": [], "published_time": "2026-09-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-v5mb-n3ip", "name": "https://www.oscs1024.com/hd/MPS-v5mb-n3ip"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-97185", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-97185"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-97185", "name": ""}, {"url": "https://bugzilla.redhat.com/show_bug.cgi?id=2539980", "name": "RHBZ#2539980"}, {"url": "https://gitlab.gnome.org/GNOME/gimp/-/work_items/16788", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "GIMP GIMPressionist越界写漏洞", "_translated": true, "_saved_at": "2026-09-24T10:56:57+00:00", "_first_saved_at": "2026-09-24T10:56:57+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-v5mb-n3ip"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-6794", "cvss": {"cvssv31": [{"source": "psirt@us.ibm.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-415", "description": "IBM Concert 1.0.0 到 3.0.0 存在由于内存管理不正确而存在的双重释放漏洞。本地攻击者可以利用此缺陷来破坏堆内存并在受影响进程的上下文中执行任意代码。", "effects": [{"comp_name": "Concert", "ecosystem": "linux", "versions": [{"affected_version": "(1.0.0,3.0.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, en 表记录，同样未通知 tokenizer，缓存中的旧令牌与身份保持有效；攻击者在事件发生前已持有的会话令牌可继续认证，密码重置后最长在令牌最大生命周期（默认 30 天）内保留原账号全部权限，最高可到管理员，用户删除后最长在一个轮换周期（默认 30 分钟）内仍可访问。\n修复版本中通过补齐两条路径的会话撤销解决该问题：UpdatePasswordByResetPasswordToken 在密码写入事务成功后调用 tokenizer.DeleteTokensByUserID，撤销该用户全部会话；DeleteUser 在软删除前的同一事务内依次调用 DeleteTokensByUserID 与 DeleteIdentity，被删除用户持有的令牌在下一次请求时返回 401，其中密码重置路径的撤销随 v0.137.1 发布，v0.143.0 同时将 opaque tokenizer 设为默认值。", "effects": [{"comp_name": "github.com/SigNoz/signoz", "ecosystem": "go", "versions": [{"affected_version": "[v0.98.0,v0.143.0)", "min_fixed_version": "v0.143.0", "repository": "go", "solutions": [], "upstream": true}]}, {"comp_name": "signoz", "ecosystem": "linux", "versions": [{"affected_version": "[v0.98.0,v0.143.0)", "min_fixed_version": "v0.143.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "不充分的会话过期机制", "kind_en": "会话过期时间不足", "last_modified_time": "2026-09-24", "level": "High", "mps_id": "MPS-k5yw-pc78", "poc": false, "poc_url": [], "published_time": "2026-09-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-k5yw-pc78", "name": "https://www.oscs1024.com/hd/MPS-k5yw-pc78"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-97056", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-97056"}, {"url": "https://github.com/SigNoz/signoz/security/advisories/GHSA-xrgp-3fq4-xg83", "name": "GitHub Security Advisory (GHSA-xrgp-3fq4-xg83)"}, {"url": "https://github.com/SigNoz/signoz/commit/faaed20dbd", "name": "Patch Commit"}, {"url": "https://github.com/SigNoz/signoz/commit/e2e9173986", "name": "Patch Commit"}, {"url": "https://github.com/SigNoz/signoz/commit/b02aae2db3", "name": "Patch Commit"}, {"url": "https://github.com/SigNoz/signoz/commit/c122bc09b4", "name": "Patch Commit"}, {"url": "https://www.vulncheck.com/advisories/signoz-before-0.143.0-insufficient-session-expiration-authentication- _influence": "", "tags": [], "title": "CVE-2026-75886漏洞", "_translated": true, "_saved_at": "2026-09-23T21:57:22+00:00", "_first_saved_at": "2026-09-23T21:57:22+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ybpa-tjk0"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-82094", "cvss": {"cvssv31": [{"source": "psirt@us.ibm.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:C/C:N/I:H/A:L", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:C/C:N/I:H/A:L", "cwe": "CWE-22", "description": "由于受限目录的路径名限制不当，IBM DataStage on Cloud Pak for Data 5.4.0.0 可能允许经过身份验证的远程攻击者遍历系统上的目录。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-09-24", "level": "High", "mps_id": "MPS-uqv7-rakl", "poc": false, "poc_url": [], "published_time": "2026-09-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-uqv7-rakl", "name": "https://www.oscs1024.com/hd/MPS-uqv7-rakl"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-82094" 问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-97898", "cvss": {"cvssv4": [{"source": "5a6e4751-2f3f-4070-9419-94fb35b644e8", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:A/VC:H/VI:L/VA:N/SC:H/SI:H/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.4}]}, "cvss_score": 8.4, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:A/VC:H/VI:L/VA:N/SC:H/SI:H/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-862", "description": "Akia 无钥匙进入云服务中不安全的直接对象引用/缺少对象级授权。解锁操作依赖于客户端提供的房间/门标识符，该标识符未针对经过身份验证的客人的预订在服务器端进行正确授权。经过身份验证的客人可以解锁自己房间以外的房间，从而导致未经授权的实体访问受影响酒店的客房。\n\n\n\n\n截至 2026 年 9 月 19 日，该服务不再容易受到此攻击（记者收到的反馈）。 \n\n\n\n\n攻击是远程的，但影响仅限于受影响的财产。", "effects": [{"comp_name": "akia", "ecosystem": "linux", "versions": [{"affected_version": "(0,2026.10.19)", "min_fixed_version": "2026.10.19", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-09-25", "level": "High", "mps_id": "MPS-dq3n-emlp", "poc": false, "poc_url": [], "published_time": "2026-09-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-dq3n-emlp", "name": "https://www.oscs1024.com/hd/MPS-dq3n-emlp"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-97898", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-97898"}, {"url": "https://www.akia.com/platform/keyless-entry", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Akia 无钥匙进入中的授权被破坏，可让经过身份验证的客人解锁其他房间", "_translated": true, "_saved_at": "2026-09-25T12:40:16+00:00", "_first_saved_at": "2026-09-25T12:40:16+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-dq3n-emlp"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2026-85056", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:L/A:N", "severity": "high", "base_score": 8.2}]}, "cvss_score": 8.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:L/A:N", "cwe": "CWE-287", "description": "ZITADEL 是一个开源身份管理平台。从 4.0.0 到 4.16.1，ZITADEL Login V2 在密码验证后创建浏览器会话，并且可以在以后的身份验证请求中重用该会话，而无需验证用户注册的 TOTP、OTP 或 U2F 第二因素。当放弃 MFA 步骤并再次开始登录时，仅当组织启用强制 MFA 或仅对本地用户强制 MFA 时，会话有效性检查才需要 MFA，因此在为客户应用程序完成 OIDC 或 SAML 回调时可以 态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-97735", "cvss": {"cvssv31": [{"source": "cve@mitre.org", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:R/S:C/C:H/I:H/A:N", "severity": "high", "base_score": 8}]}, "cvss_score": 8, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:R/S:C/C:H/I:H/A:N", "cwe": "CWE-79", "description": "26.08 之前的 ITFlow 允许在票证电子邮件解析器 (cron/ticket_email_parser.php) 中添加 SVG 附件，用于处理可能通过 SMTP 从任意发件人到达的电子邮件。", "effects": [{"comp_name": "itflow", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,26.08)", "min_fixed_version": "26.08", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-09-25", "level": "High", "mps_id": "MPS-ixlj-286u", "poc": false, "poc_url": [], "published_time": "2026-09-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ixlj-286u", "name": "https://www.oscs1024.com/hd/MPS-ixlj-286u"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-97735", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-97735"}, {"url": "https://github.com/itflow-org/itflow/security/advisories/GHSA-89fw-w69c-vghj", "name": ""}, {"url": "https://github.com/itflow-org/itflow/commit/16000efcf7f7c833aae9f8da22d2a82df21a49c0", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "CVE-2026-97735漏洞", "_translated": true, "_saved_at": "2026-09-25T06:59:35+00:00", "_first_saved_at": "2026-09-25T06:59:35+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ixlj-286u"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-87720", "cvss": {"cvssv4": [{"source": "cve-coordination@google.com", "vec _first_saved_at": "2026-09-25T06:59:32+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-cz05-n1hy"}, {"analysis_status": 0, "articles": [{"content": "应用程序在处理用户输入时的不完善或缺乏验证机制，所以攻击者能够通过向应用程序发送恶意输入，利用应用程序对输入数据的错误处理方式来注入自己的恶意代码。这些恶意代码会被应用程序误认为是合法的指令或数据，并在执行过程中被执行。", "title": "什么是代码注入"}, {"content": "应用程序使用可执行动态代码的函数来执行用户可控的参数，当应用程序对于用户输入过滤不完全时，攻击者可以注入恶意代码并控制代码执行流程。", "title": "代码注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对所有用户输入进行验证和过滤，确保只接受预期的有效输入。这包括对输入数据进行输入长度验证、类型检查和格式验证等。\r\n- 使用参数化查询或预编译语句：对于数据库查询操作，应该使用参数化查询或预编译语句，确保输入数据不会被误认为是执行代码。\r\n- 最小特权原则：应用程序在执行操作系统命令或动态代码时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。\r\n- 安全编码实践：开发人员应该采用安全编码实践，包括避免使用eval函数、避免拼接用户输入的字符串作为代码执行等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止代码注入攻击。", "title": "如何预防代码注入"}], "cnvd_id": "", "cve_id": "CVE-2026-96795", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-94", "description": "Horilla 是一款 HR 和 CRM 软件。在 2.0.0 之前，horilla_views/generic/cbv/views.py 中的 HorillaListView.export_data 接受经过身份验证的用户的列 POST 参数，采用 field_tuple[1]，将其插入到dynamic_fn_str 作为 Python 源，并将生成的函数定义传递给 exec()。在 ast.literal_eval 下保持有效的精心设计的字符串可以将 Python 语法注入到函数定义期间评估的默认参数中，从而允许使用应用程序进程权限执行任意操作系统命令，包括附带的 Docker 映像中的 root 权限。此问题已在 2.0.0 版本中修复。", "effects": [{"comp_name": "horilla-hr", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.0.0)", "min_fixed_version": "2.0.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "代码注入", "kind_en": "代码生成控制不当（“代码注入”）", "last_modified_time": "2026-09-26", "level": "High", "mps_id": "MPS-iz0o-qb2c", "poc": false, "poc_url": [], "published_time": "2026-09-26", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-iz0o-qb2c", "name": "https://www.oscs1024.com/hd/MPS-iz0o-qb2c"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-96795", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-96795"}, {"url": "https://github.com/horilla/horilla-hr/security/advisories/GHSA-5g4v-4rv4-r26f", "name": "https://github.com/horilla/horilla-hr/security/advisories/GHSA-5g4v-4rv4-r26f"}, {"url": "https://github.com/horilla/horilla-hr/releases/tag/2.0.0", "name": "https://github.com/horilla/horilla-hr/releases/tag/2.0.0"}], "scope_influence": "", "tags": ["应用软件"], "title": "Horilla：Horilla 列表视图导出中经过身份验证的 RCE", "_translated": true, "_saved_at": "2026-09-26T03:02:37+00:00", "_first_saved_at": "2026-09-25T23:54:07+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-iz0o-qb2c"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-100520", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X P 文件。具有manage_template_access权限的攻击者可以遍历layout目录之外，修改可执行PHP文件，并以Web服务器用户身份实现远程代码执行。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-09-26", "level": "High", "mps_id": "MPS-qkj8-ingr", "poc": false, "poc_url": [], "published_time": "2026-09-26", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-qkj8-ingr", "name": "https://www.oscs1024.com/hd/MPS-qkj8-ingr"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-100372", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-100372"}, {"url": "https://hackmd.io/@leediay/S1AIRjzqfx", "name": ""}, {"url": "https://github.com/MacWarrior/clipbucket-v5/commit/f31de49b2194482ffef7147aa1e9b1c8f0f04eb7", "name": ""}, {"url": "https://github.com/MacWarrior/clipbucket-v5/blob/61cce55ab26ef88fb782dfde47b44c17c56978cd/upload/admin_area/template_editor.php#L44-L69", "name": ""}, {"url": "https://github.com/MacWarrior/clipbucket-v5/releases/tag/5.5.3-%23197", "name": "clipbucket-v5 5.5.3-%23197 Release Notes"}, {"url": "https://github.com/MacWarrior/clipbucket-v5", "name": ""}, {"url": "https://www.vulncheck.com/advisories/clipbucket-v5-before-5.5.3-197-path-traversal-via-template-editor-php", "name": "VulnCheck Advisory: ClipBucket v5 before 5.5.3-#197 Path Traversal via template_editor.php"}], "scope_influence": "", "tags": ["应用软件"], "title": "ClipBucket v5 5.5.3-#197 之前的版本通过 template_editor.php 进行路径遍历", "_translated": true, "_saved_at": "2026-09-25T20:59:13+00:00", "_first_saved_at": "2026-09-25T20:59:13+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-qkj8-ingr"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-71483", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:A/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.5}]}, "cvss_score": 8.5, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:A/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-79", "description": "Horilla 是一款 HR 和 CRM 软件。在 1.6.0 之前，/employee/employee-filter-view 处的搜索参数由 jQuery .html() 反映在 employee/templates/employee_nav.html 中，而不进行 HTML 中和。外部攻击者可以制作并传递一个链接，当经过身份验证的员工或管理员到达员工过滤器时，该链接会导致 JavaScript 执行，从而允许使用受害者的应用程序权限访问浏览器可见的会话数据和操作。此问题已在 1.6.0 版本中修复。", "effects": [{"comp_name": "horilla-hr", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.6.0)", "min_fixed_version": "1.6.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-09-26", "level": "High", "mps_id": "MPS-zw6v-blyp", "poc": false, "poc_url": [], "published_time": "2026-09-26", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-zw6v-blyp", "name": "https://www.oscs1024.com/hd/MPS-zw6v-blyp"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-71483", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-71483"}, {"url": "https://github.com/horilla/horilla-hr/commit/39ed01306341a1f6b7702df2825ab5431b5401a9", "name": ""}, {"url": "https://github.com/horilla/horilla-hr/security/advisories/GHSA-rw86-x8hq-xgwh", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-71483 漏洞", "_translated": true, "_saved_at": "2026-09-25T23:54:12+00:00", "_first_saved_at": "2026-09-25T23:54:12+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-zw6v-blyp"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-100368", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.4}]}, "cvss_score": 8.4, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-78", "description": "CliInvoke 是一个用于调用命令行程序的 .NET 库，其“CliInvoke.Specializations”包为 PowerShell 和 Windows 命令提示符等 shell 提供了专门的包装器。 `CliInvoke.Specializations` 版本 2.2.0 到 2.8.4、2.9.0 到 2.9.3、2.10.0 到 2.10.4、3.0.0-alpha.1 到 3.0.0-alpha.4、3.0.0-alpha.8 到 3.0.0-alpha.10，以及“AlastairLundy.CliInvoke.Specializations”版本 1.0.0-rc.1 至 1.6.1.1 在其 PowerShell 和 Cmd 包装器中包含操作系统命令注入漏洞。包装器使用单个“ProcessStartInfo.Arguments”字符串将调用者控制的目标和参数传递给“pwsh -Command”或“cmd /c”，允许不受信任的输入中的双引号破坏操作系统级引用，并导致 shell 使用主机进程的权限执行附加命令。该漏洞已在“CliInvoke.Specializations”版本 2.8.5、2.9.4、2.10.5 和 3.0.0-beta.1 以及“AlastairLundy.CliInvoke.Specializations”版本 2.0.2 中修补。 No complete workaround is available;无法升级的用户应拒绝或删除目标路径和参数中的双引号，另外拒绝版本 2.2.0 到 2.9.2 以及 3.0.0-alpha.1 到 3.0.0-alpha.4 中的 shell 元字符，或者在处理不受信任的输入时绕过 PowerShell 和 Cmd 包装器并直接调用目标进程。", "effects": [{"comp_name": "CliInvoke.Specializations", "ecosystem": "linux", "versions": [{"affected_version": "[2.9.0,2.9.3]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[3.0.0-alpha.8,3.0.0-alpha.10]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[2.2.0,2.8.4]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[3.0.0-alpha.1,3.0.0-alpha.4]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[1.0.0-rc.1,1.6.1.1]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[2.10.0,2.10.4]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-09-26", "level": "High", "mps_id": "MPS-s7er-u4xo", "poc": false, "poc_url": [], "published_time": "2026-09-26", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-s7er-u4xo", "name": "https://www.oscs1024.com/hd/MPS-s7er-u4xo"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-100368", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-100368"}, {"url": "https://github.com/alastairlundy/CliInvoke/security/advisories/GHSA-wrvw-254r-wpmv", "name": "https://github.com/alastairlundy/CliInvoke/security/advisories/GHSA-wrvw-254r-wpmv"}], "scope_influence": "", "tags": ["应用软件"], "title": "CliInvoke.Specializations：PowerShell 和 Cmd shell 包装器中的命令注入", "_translated": true, "_saved_at": "2026-09-25T20:59:18+00:00", "_first_saved_at": "2026-09-25T20:59:18+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-s7er-u4xo"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-88003", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-863", "description": "InvoicePlane 是一个自托管开源应用程序，用于管理发票、客户和付款。在 1.7.2 之前，InvoicePlane 在角色降级后无法撤销管理权限，因为 Admin_Controller 信任现有会话中存储的 user_type 快照，而不是重新验证 ip_users.user_type。当一名管理员降级另一帐户时，目标的活动会话将继续授权管理请求。降级的用户可以使用Users::form()将user_type设置回1，恢复数据库角色并使权限提升持续存在。此漏洞已在 1.7.2 中修复。", "effects": [{"comp_name": "InvoicePlane", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.7.2)", "min_fixed_version": "1.7.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-09-26", "level": "High", "mps_id": "MPS-5my1-7b6k", "poc": false, "poc_url": [], "published_time": "2026-09-26", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-5my1-7b6k", "name": "https://www.oscs1024.com/hd/MPS-5my1-7b6k"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-88003", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-88003"}, {"url": "https://github.com/InvoicePlane/InvoicePlane/commit/904847f4e87b66fd6743cf9cc6f88b66c7fc3b81", "name": ""}, {"url": "https://github.com/InvoicePlane/InvoicePlane/commit/daa49ce3a50e0c93e01459b69c0d61bfc23d23eb", "name": ""}, {"url": "https:// 数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-57449", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-863", "description": "Actual是本地首创的个人理财工具。在 26.7.0 之前，Actual Sync Server 的 CORS 代理旨在让经过身份验证的用户仅从官方插件白名单中列出的存储库获取资源。配置“ACTUAL_GITHUB_TOKEN”后，代理会自动将服务器的 GitHub 令牌附加到 GitHub 请求。 GitHub API 白名单检查对“/repos/{owner}/{repo}”使用原始“startsWith()”前缀测试，无需在存储库名称后添加路径边界。如果列入白名单的公共插件存储库是“https://github.com/acme/plugin”，则代理还接受 GitHub API URL。这些 URL 位于允许列表存储库之外，但仍然通过，因为它们的 API 路径以“/repos/acme/plugin”开头。然后，代理使用服务器的“ACTUAL_GITHUB_TOKEN”转发请求，允许任何经过身份验证的实际用户读取可通过该令牌访问的私有 GitHub 资源。版本 26.7.0 修复了该问题。", "effects": [{"comp_name": "actual", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,26.7.0)", "min_fixed_version": "26.7.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-09-26", "level": "High", "mps_id": "MPS-253w-0boy", "poc": false, "poc_url": [], "published_time": "2026-09-26", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-253w-0boy", "name": "https://www.oscs1024.com/hd/MPS-253w-0boy"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-57449", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-57449"}, {"url": "https://github.com/actualbudget/actual/security/advisories/GHSA-m62         .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }
    function scoreText(v) {
      if (v === null || v === undefined || v === "" || v === -1) return "-";
      return String(v);
    }

    function renderList() {
      const list = $("list");
      $("listCount").textContent = String(filtered.length);
      if (!filtered.length) {
        list.innerHTML = '<div class="empty">没有匹配项</div>';
        return;
      }
      list.innerHTML = filtered.map((it) => {
        const id = it.mps_id || it.cve_id;
        const active = id === activeId ? " active" : "";
        return `
          <button class="item${active}" data-id="${esc(id)}" type="button">
            <div class="item-top">
              <span class="cve">${esc(it.cve_id || it.mps_id || "-")}</span>
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
            </div>
            <div class="title">${esc(it.title || "-")}</div>
            <div class="item-foot">
              <span>CVSS ${esc(scoreText(it.cvss_score))}</span>
              <span>${esc(it.published_time || "-")}</span>
              ${it.poc ? "<span>POC</span>" : ""}
            </div>
          </button>`;
      }).join("");
      list.querySelectorAll(".item").forEach((btn) => {
        btn.addEventListener("click", () => selectById(btn.dataset.id));
      });
    }

    function refsHtml(it) {
      const refs = Array.isArray(it.reference_url_list) ? it.reference_url_list : [];
      const links = [];
      if (it._source_page) links.push({ url: it._source_page, name: "OSCS 详情" });
      if (it.cve_id) links.push({ url: `https://nvd.nist.gov/vuln/detail/${it.cve_id}`, name: "NVD" });
      refs.forEach((r) => {
        if (r && r.url) links.push({ url: r.url, name: r.name || r.url });
      });
      const seen = new Set();
      const uniq = [];
      for (const l of links) {
        if (seen.has(l.url)) continue;
        seen.add(l.url);
        uniq.push(l);
      }
      if (!uniq.length) return '<div class="box">无参考链接</div>';
      return `<div class="refs">${uniq.map((l) =>
        `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name || l.url)}</a>`
      ).join("")}</div>`;
    }

    function articlesHtml(it) {
      const arts = Array.isArray(it.articles) ? it.articles : [];
      if (!arts.length) return "";
      return `<div class="section"><h3>相关说明</h3>${arts.map((a) => `
        <div class="article">
          <h4>${esc(a.title || "说明")}</h4>
          <p>${esc(a.content || "")}</p>
        </div>`).join("")}</div>`;
    }

    function renderDetail(it) {
      const detail = $("detail");
      if (!it) {
        detail.innerHTML = '<div class="empty">暂无数据</div>';
        return;
      }
      const pocUrls = Array.isArray(it.poc_url) ? it.poc_url : [];
      detail.innerHTML = `
        <div class="d-head">
          <div>
            <h1 class="d-title">${esc(it.title || "-")}</h1>
            <div class="ids">
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
              <span class="chip">${esc(it.cve_id || "无 CVE")}</span>
              <span class="chip">${esc(it.mps_id || "-")}</span>
              ${it.poc ? '<span class="chip">有 POC</span>' : ""}
              ${it.exp ? '<span class="chip">有 EXP</span>' : ""}
            </div>
          </div>
          <div class="actions">
            ${it._source_page ? `<a class="btn" href="${esc(it._source_page)}" target="_blank" rel="noopener">OSCS</a>` : ""}
            ${it.cve_id ? `<a class="btn" href="https://nvd.nist.gov/vuln/detail/${esc(it.cve_id)}" target="_blank" rel="noopener">NVD</a>` : ""}
          </div>
        </div>
        <div class="grid">
          <div class="stat"><div class="k">CVSS</div><div class="v">${esc(scoreText(it.cvss_score))}</div></div>
          <div class="stat"><div class="k">向量</div><div class="v">${esc(it.cvss_vector || "-")}</div></div>
          <div class="stat"><div class="k">CWE</div><div class="v">${esc(it.cwe || "-")}</div></div>
          <div class="stat"><div class="k">类型</div><div class="v">${esc(it.kind || it.kind_en || "-")}</div></div>
          <div class="stat"><div class="k">公开</div><div class="v">${esc(it.published_time || "-")}</div></div>
          <div class="stat"><div class="k">利用成本</div><div class="v">${esc(it.exploit_requirement_cost || "-")}</div></div>
          <div class="stat"><div class="k">可利用性</div><div class="v">${esc(it.exploitability || "-")}</div></div>
          <div class="stat"><div class="k">修复建议</div><div class="v">${esc(it.fix_suggestion || "-")}</div></div>
        </div>
        <div class="section"><h3>描述</h3><div class="box">${esc(it.description || "无描述")}</div></div>
        ${it.scope_influence ? `<div class="section"><h3>影响范围</h3><div class="box">${esc(it.scope_influence)}</div></div>` : ""}
        ${pocUrls.length ? `<div class="section"><h3>POC 链接</h3><div class="refs">${pocUrls.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join("")}</div></div>` : ""}
        <div class="section"><h3>参考链接</h3>${refsHtml(it)}</div>
        ${articlesHtml(it)}
      `;
    }

    function selectById(id) {
      const it = filtered.find((x) => (x.mps_id || x.cve_id) === id) ||
                 items.find((x) => (x.mps_id || x.cve_id) === id);
      if (!it) return;
      activeId = it.mps_id || it.cve_id;
      renderList();
      renderDetail(it);
      const btn = document.querySelector(`.item[data-id="${CSS.escape(activeId)}"]`);
      if (btn) btn.scrollIntoView({ block: "nearest" });
      history.replaceState(null, "", "#" + encodeURIComponent(activeId));
    }

    function applyFilter(q) {
      const query = (q || "").trim().toLowerCase();
      filtered = !query ? items.slice() : items.filter((it) => {
        const blob = [
          it.cve_id, it.mps_id, it.title, it.kind, it.kind_en, it.cwe, it.description, it.level
        ].map((x) => String(x || "").toLowerCase()).join(" ");
        return blob.includes(query);
      });
      renderList();
      if (filtered.length) {
        const still = filtered.some((x) => (x.mps_id || x.cve_id) === activeId);
        selectById(still ? activeId : (filtered[0].mps_id || filtered[0].cve_id));
      } else {
        activeId = null;
        renderDetail(null);
      }
    }

    $("search").addEventListener("input", (e) => applyFilter(e.target.value));

    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement !== $("search")) {
        e.preventDefault();
        $("search").focus();
        return;
      }
      if (!filtered.length) return;
      const idx = filtered.findIndex((x) => (x.mps_id || x.cve_id) === activeId);
      if (e.key === "ArrowDown") {
        e.preventDefault();
        const next = filtered[Math.min(filtered.length - 1, Math.max(0, idx) + 1)];
        selectById(next.mps_id || next.cve_id);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        const prev = filtered[Math.max(0, idx - 1)];
        selectById(prev.mps_id || prev.cve_id);
      }
    });

    const hashId = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    if (hashId && items.some((x) => (x.mps_id || x.cve_id) === hashId)) {
      activeId = hashId;
      renderList();
      selectById(hashId);
    } else if (items.length) {
      selectById(items[0].mps_id || items[0].cve_id);
    } else {
      renderList();
      renderDetail(null);
    }
  </script>
</body>
</html>
