[{"comp_name": "1456B Multi-User Gateway", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.10.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "", "kind_en": "", "last_modified_time": "2026-11-19", "level": "Critical", "mps_id": "MPS-yl87-am3b", "poc": false, "poc_url": [], "published_time": "2026-11-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-yl87-am3b", "name": "https://www.oscs1024.com/hd/MPS-yl87-am3b"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-110461", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-110461"}, {"url": "https://pro.comelitgroup.com/en-us/product/1456B", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Comelit 1456B 默认凭据漏洞", "_translated": true, "_saved_at": "2026-11-19T08:18:02+00:00", "_first_saved_at": "2026-11-19T08:18:02+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-yl87-am3b"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-87977", "cvss": {"cvssv31": [{"source": "psirt@us.ibm.com", "vector": "CVSS:3.1 列化机制，如 JSON 或 XML 序列化，而不是第三方序列化库。\n- 最小特权原则：程序应该限制对受信任数据的处理权限，并避免在运行时修改数据。\n- 代码审查和漏洞扫描：程序应该进行代码审查和漏洞扫描，以发现和修复潜在的安全漏洞。\n", "title": "如何预防反序列化"}], "cnvd_id": "", "cve_id": "CVE-2026-84236", "cvss": {"cvssv31": [{"source": "psirt@us.ibm.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-502", "description": "IBM Guardium Data Protection 12.2 容易受到 SharePoint Tap MulticastTransceiver 组件中不安全反序列化的影响。未经身份验证的远程攻击者可以利用此漏洞在受影响的系统上执行任意代码。", "effects": [{"comp_name": "Guardium Data Protection", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,12.2]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "反序列化", "kind_en": "不可信数据的反序列化", "last_modified_time": "2026-11-20", "level": "Critical", "mps_id": "MPS-vcea-y8mf", "poc": false, "poc_url": [], "published_time": "2026-11-20", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-vcea-y8mf", "name": "https://www.oscs1024.com/hd/MPS-vcea-y8mf"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-84236", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-84236"}, {"url": "https://www.ibm.com/support/pages/node/7297484", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-84236 漏洞", "_translated": true, "_saved_at": "2026-11-20T00:09:31+00:00", "_first_saved_at": "2026-11-20T00:09:31+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-vcea-y8mf"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-82339", "cvss": {"cvssv31": [{"source": "psirt@us.ibm.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N", "severity": "critical", "base_score": 9.1}]}, "cvss_score": 9.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H 误。具备管理员权限的已认证攻击者无需其他用户交互，可利用因安全最佳实践被忽略而暴露的入口进入系统。官方 CVSS 4.0 将攻击复杂度评为高，并标明存在攻击前提，同时将漏洞组件与后续系统的机密性、完整性与可用性影响均评为高。公告未披露具体配置项、入口符号或源码位置。\n修复版本中通过发布 10.2.26、12.1.13 和 13.0.1 消除该安全配置错误。10.2 线修复版本为 10.2.26 及以上，12.1 线为 12.1.13 及以上，13.0 线为 13.0.1 及以上。11.0 与 12.0 线没有同线修复版本，需要迁移到上述受支持版本。", "effects": [{"comp_name": "bamboo", "ecosystem": "linux", "versions": [{"affected_version": "[12.1.0,12.1.13)", "min_fixed_version": "12.1.13", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[12.0.0,12.0.2]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[11.0.0,11.0.8]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[10.2.0,10.2.26)", "min_fixed_version": "10.2.26", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "配置缺陷", "kind_en": "", "last_modified_time": "2026-11-18", "level": "High", "mps_id": "MPS-5534-037a", "poc": false, "poc_url": [], "published_time": "2026-11-18", "reference_url_list": [{"url": "https://confluence.atlassian.com/security/security-bulletin-november-17-2026-1874690748.html", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-21600", "name": ""}, {"url": "https://confluence.atlassian.com/pages/viewpage.action?pageId=1874690748", "name": ""}, {"url": "https://jira.atlassian.com/browse/BAM-26636", "name": ""}, {"url": "https://confluence.atlassian.com/bambooreleases/bamboo-release-notes-1189793869.html", "name": ""}, {"url": "https://www.atlassian.com/software/bamboo/download-archives", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Bamboo安全配置错误漏洞", "_translated": true, "_saved_at": "2026-11-17T19:01:39+00:00", "_first_saved_at": "2026-11-17T19:01:39+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-5534-037a"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过向受信任的数据序列化过程中添加恶意数据，从而在序列化和反序列化过程中执行恶意代码的攻击漏洞。这种漏洞通常存在于使用序列化 (serialization) 机制存储和传输数据的程序中。\n", "title": "什么是反序列化"}, {"content": "- 注入攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码注入到程序中，从而实现代码执行的目的。\n- 反射攻击：攻击者使用反射机制，在序列化过程中动态生成恶意数据，并将恶意代码注入到程序中，从而实现代码执行的目的。\n- 缓冲区溢出攻击：攻击者通过在序列化过程中向缓冲区输入恶意数据，导致缓冲区溢出，从而破坏程序的内存管理，实现代码执行的目的。\n- 格式字符串攻击：攻击者通过在序列化过程中输入恶意数据，导致程序使用错误的格式字符串，从而实现代码执行的目的。\n- 数据流攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码作为一个数据流传递给程序，从而实现代码执行的目的。\n", "title": "反序列化常见的攻击方式"}, {"content": "- 不信任输入数据：程序应该严格检查输入数据的有效性，并避免使用不受信任的数据。\n- 使用安全的序列化机制：程序应该使用安全的序列化机制，如 JSON 或 XML 序列化，而不是第三方序列化库。\n- 最小特权原则：程序应该限制对受信任数据的处理权限，并避免在运行时修改数据。\n- 代码审查和漏洞扫描：程序应该进行代码审查和漏洞扫描，以发现和修复潜在的安全漏洞。\n", "title": "如何预防反序列化"}], "cnvd_id": "", "cve_id": "CVE-2026-125820", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-502", "description": "Product Feed PRO for WooCommerce（woo-product-feed-pro）是 Rymera Web Co 开发的 WordPress 开源插件，用于将 WooCommerce 商品目录生成并同步到 Google Shopping 等电商渠道的商品 Feed 文件。\n受影响版本中，插件加载产品 Feed 配置时会把 adt_product_feed 自定义文章类型的 adt_ 前缀元数据原样交给 WordPress 核心 maybe_unserialize() 还原，Product_Feed::load_meta_data() 等读取路径底层调用的 unserialize() 未限制 allowed_classes，攻击者使用 Contributor 级别账号将构造的序列化对象字符串写入 Feed 元数据后，Feed 加载与生成流程会把其中的对象完整实例化，形成 PHP 对象注入，可导致敏感信息泄露与数据篡改，实际后果取决于站点插件生态中可用的 POP 链。\n修复版本中通过在 Helper 类新增 unserialize_without_objects() 统一使用 unserialize( trim( $value ), array( 'allowed_classes' =\u003e false ) ) 拒绝对象还原，并提供 maybe_safely_unserialize() 与 get_post_meta_safely() 封装，把 Product_Feed.php、Usage.php、Notices.php、Feed_Writer_Parquet.php 等处的 maybe_unserialize() 与 get_post_meta(..., true) 全部替换为对象拒绝版本，序列化对象被还原为无副作用的 __PHP_Incomplete_Class，切断了对象注入链。", "effects": [{"comp_name": "woo-product-feed-pro", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,13.5.9)", "min_fixed_version": "13.5.9", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "反序列化", "kind_en": "不可信数据的反序列化", "last_modified_time": "2026-11-18", "level": "High", "mps_id": "MPS-3dto-bw2c", "poc": false, "poc_url": [], "published_time": "2026-11-18", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-3dto-bw2c", "name": "https://www.oscs1024.com/hd/MPS-3dto-bw2c"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-125820", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-125820"}, {"url": "https://patchstack.com/database/wordpress/plugin/woo-product-feed-pro/vulnerability/wordpress-product-feed-pro-for-woocommerce-plugin-13-5-8-php-object-injection-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Product Feed PRO对象注入漏洞", "_translated": true, "_saved_at": "2026-11-18T09:56:11+00:00", "_first_saved_at": "2026-11-18T09:56:11+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-3dto-bw2c"}, {"analysis_status": 0, "articles": [{"content": "在程序试图读取、写入或复制内存缓冲区时，未对边界进行适当的检查和限制。缓冲区是用于存储数据的一块内存区域，当程序试图在缓冲区之外的位置进行操作时，就可能导致缓冲区溢出或下溢。攻击者可以利用这个漏洞来修改程序的执行流、执行任意代码或导致拒绝服务等安全问题。", "title": "什么是缓冲区溢出"}, {"content": "- 缓冲区溢出攻击：攻击者向输入缓冲区中注入超过其容量的数据，导致数据溢出到相邻的内存区域，可能覆盖关键数据、修改变量值或执行恶意代码。\n- 缓冲区下溢攻击：攻击者向输入缓冲区中注入少于其容量的数据，导致数据被读取时越过缓冲区边界，可能泄露敏感信息或破坏程序的正常执行流程。\n- 字符串格式化攻击：攻击者通过控制格式化字符串的输入，可以读取或写入任意内存位置，从而执行恶意操作。", "title": "缓冲区溢出常见的攻击方式"}, {"content": "- 输入验证和边界检查：对于所有接受用户输入的缓冲区操作，确保验证输入数据的长度和内容，以避免缓冲区溢出或下溢。\n- 使用安全的字符串操作函数：使用安全的字符串操作函数（如strncpy、strncat）替代不安全的函数（如strcpy、strcat），这些函数会在操作时自动限制操作的边界。\n- 使用内存安全工具：使用内存安全工具（如内存分析器、静态分析工具）来检测和修复潜在的缓冲区溢出问题。\n- 采用安全编码实践：遵循安全编码实践，如最小特权原则、避免使用不受信任的输入等。\n- 定期更新和修补程序：及时应用程序厂商提供的安全更新和补丁，以修复已知的缓冲区溢出漏洞。\n- 使用编程语言和框架提供的安全功能：利用编程语言和框架提供的安全特性，如内存安全函数、边界检查等。", "title": "如何预防缓冲区溢出"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-130020", "cvss": {}, "cvss_score": 8.8, "cvss_vector": "", "cwe": "CWE-119", "description": "Firefox 是 Mozilla 发布的开源网页浏览器，Graphics 子系统中的 CanvasWebGL 组件负责处理 WebGL 画布与帧缓冲绘制，Android 版通过设备图形驱动执行这些操作。\n受影响版本中，网页脚本调用 WebGL2 blitFramebuffer 时，请求由 ClientWebGLContext::BlitFramebuffer 转发到 WebGLFramebuffer::BlitFramebuffer。目标帧缓冲存在多个已启用颜色附件，或颜色附件纹理的基础层级大于 0，并且图形驱动厂商为 ARM 且当前上下文未使用 ANGLE 时，该函数直接调用 glBlitFramebuffer，没有先调用 glFinish。Mozilla 将这一错误边界条件定性为 Android 平台上的权限提升。\n修复版本中通过在 WebGLFramebuffer::BlitFramebuffer 中识别多个颜色附件或非零纹理基础层级，并在默认偏好下对 ARM 且非 ANGLE 的驱动先调用 glFinish，再执行 glBlitFramebuffer，避免 Mali 设备在该帧缓冲状态下直接进行传输。", "effects": [{"comp_name": "Firefox", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,160.0.1]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "firefox", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,160.0.1)", "min_fixed_version": "160.0.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "缓冲区溢出", "kind_en": "内存缓冲区范围内的操作限制不当", "last_modified_time": "2026-11-18", "level": "High", "mps_id": "MPS-3f8c-rdm2", "poc": false, "poc_url": [], "published_time": "2026-11-18", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-3f8c-rdm2", "name": "https://www.oscs1024.com/hd/MPS-3f8c-rdm2"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-130020", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-130020"}, {"url": "https://bugzilla.mozilla.org/show_bug.cgi?id=2068592", "name": ""}, {"url": "https://www.mozilla.org/security/advisories/mfsa2026-130/", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "CanvasWebGL权限提升", "_translated": true, "_saved_at": "2026-11-18T01:59:13+00:00", "_first_saved_at": "2026-11-18T01:59:13+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-3f8c-rdm2"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-130021", "cvss": {}, "cvss_score": 8.8, "cvss_vector": "", "cwe": "CWE-416", "description": "Firefox 是 Mozilla 发布的开源网页浏览器，Audio/Video Playback 组件通过 ChannelMediaDecoder 从网络通道加载并播放网页中的音视频。\n受影响版本中，ResourceCallback::NotifyDataArrived 在通知媒体所有者下载进度时未保持解码器引用，DownloadProgressed 在 GetOwner()-\u003eDownloadProgressed() 返回后也未检查关闭状态。所有者回调可以同步执行 Shutdown，Disconnect 会清空 mDecoder 并释放 mTimer，随后代码仍访问计时器与状态机，形成释放后使用。\n修复版本中通过在通知前持有 ChannelMediaDecoder 的 RefPtr，并在所有者回调返回后检查 mDecoder 与 IsShutdown，避免解码器关闭后继续使用计时器或状态机。", "effects": [{"comp_name": "Firefox", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,160.0.1]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "firefox", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,160.0.1)", "min_fixed_version": "160.0.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "UAF", "kind_en": "免费后使用", "last_modified_time": "2026-11-18", "level": "High", "mps_id": "MPS-6efi-akm0", "poc": false, "poc_url": [], "published_time": "2026-11-18", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-6efi-akm0", "name": "https://www.oscs1024.com/hd/MPS-6efi-akm0"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-130021", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-130021"}, {"url": "https://bugzilla.mozilla.org/show_bug.cgi?id=2088644", "name": ""}, {"url": "https://www.mozilla.org/security/advisories/mfsa2026-130/", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "Firefox播放组件UAF", "_translated": true, "_saved_at": "2026-11-18T01:59:14+00:00", "_first_saved_at": "2026-11-18T01:59:14+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-6efi-akm0"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2025-2235", "cvss": {"cvssv31": [{"source": "security@opentext.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "cwe": "CWE-347", "description": "OpenText Connected MX 是 OpenText 公司的商业云端端点数据保护服务（原 Micro Focus Connected 产品线），提供基于策略的端点数据备份与文件同步能力；其 macOS Agent 是部署在 macOS 终端上的客户端组件，负责与云端之间的文件传输活动，产品闭源。\n受影响版本中，macOS Agent 的更新流程未正确校验更新内容的加密签名，本地低权限用户可借助该更新流程促使未经有效签名的更新内容以 root 权限执行，从而在 macOS 终端上将权限提升至 root，完全控制目标设备。\n修复版本中通过在 25.2 版本纠正 Agent 更新流程对更新内容加密签名的验证，使未经有效签名的更新内容无法进入以 root 权限运行的执行路径，阻断了本地低权限用户到 root 的提权链路。", "effects": [{"comp_name": "connected_mx", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,25.2)", "min_fixed_version": "25.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "密码学签名的验证不恰当", "kind_en": "密码签名验证不当", "last_modified_time": "2026-11-18", "level": "High", "mps_id": "MPS-azwf-i014", "poc": false, "poc_url": [], "published_time": "2026-11-18", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-azwf-i014", "name": "https://www.oscs1024.com/hd/MPS-azwf-i014"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2025-2235", "name": "https://nvd.nist.gov/vuln/detail/CVE-2025-2235"}, {"url": "https://my.opentext.com/support/article/9394749", "name": "OpenText Connected MX macOS Agent Privilege Escalation (KB9394749)"}], "scope_influence": "", "tags": ["应用软件"], "title": "OpenText Connected MX提权漏洞", "_translated": true, "_saved_at": "2026-11-18T09:56:12+00:00", "_first_saved_at": "2026-11-18T09:56:12+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-azwf-i014"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-86061", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-862", "description": "Teable 是一个开源的面向企业的 AI 多维表格与无代码数据库平台，支持多租户协作、表格视图、仪表盘与插件体系，用于以可视化方式管理结构化数据。\n受影响版本中，PermissionGuard 对嵌套路由的鉴权仅作用于调用者可控的父级 tableId、baseId 或 spaceId，而各服务按全局唯一 ID 解析子资源，未将子资源回绑到已授权范围；PluginService::regenerateSecret 与 delete 对应路由缺少 @Permissions 装饰器，查询条件也未绑定 createdBy 归属，ViewService::getViewById 仅按 viewId 查询视图，DashboardService::updatePluginStorage 仅按 pluginInstallId 定位插件安装记录。已认证攻击者传入自己拥有的父级资源 ID 与受害者的子资源 ID，可跨租户读取任意视图配置（含内嵌过滤值、字段布局与 shareId）、轮换并获取任意插件的 OAuth 密钥、删除任意插件（含系统插件），并覆盖其他租户仪表盘与视图位置的插件存储。\n修复版本中通过在数据访问层绑定资源归属切断上述链路：插件 regenerateSecret、delete、unpublishPlugin 查询加入 createdBy 绑定并在失配时返回资源不存在，插件信息改以 maskedSecret 代替明文密钥返回；getViewById 改为按 tableId 与 viewId 联合查询；validateAndGetPluginInstall 增加 baseId、positionId 与 position 绑定；视图侧 updatePluginStorage 重新按 tableId、viewId 与 pluginInstallId 联合定位，跨租户访问被统一拒绝。", "effects": [{"comp_name": "teable", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,release.2026-07-17T05-20-38Z.2264)", "min_fixed_version": "release.2026-07-17T05-20-38Z.2264", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-11-18", "level": "High", "mps_id": "MPS-khvg-flp8", "poc": false, "poc_url": [], "published_time": "2026-11-18", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-khvg-flp8", "name": "https://www.oscs1024.com/hd/MPS-khvg-flp8"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-86061", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-86061"}, {"url": "https://github.com/teableio/teable/security/advisories/GHSA-7xph-fchg-qpwf", "name": "https://github.com/teableio/teable/security/advisories/GHSA-7xph-fchg-qpwf"}, {"url": "https://github.com/teableio/teable/commit/52c387e49ae88218cadc81cd0209653742b8add8", "name": "https://github.com/teableio/teable/commit/52c387e49ae88218cadc81cd0209653742b8add8"}, {"url": "https://github.com/teableio/teable/releases/tag/release.2026-07-17T05-20-38Z.2264", "name": "https://github.com/teableio/teable/releases/tag/release.2026-07-17T05-20-38Z.2264"}], "scope_influence": "", "tags": ["应用软件"], "title": "Teable 跨租户越权访问漏洞", "_translated": true, "_saved_at": "2026-11-17T19:01:33+00:00", "_first_saved_at": "2026-11-17T19:01:33+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-khvg-flp8"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-21607", "cvss": {"cvssv4": [{"source": "security@atlassian.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-22", "description": "Jira Software Data Center 是 Atlassian 推出的闭源商业软件，用于企业级项目与需求跟踪管理，以 Java Web 应用形式部署在组织内部环境中。\n受影响版本中，应用存在路径穿越缺陷，未认证攻击者可构造恶意请求访问预期资源位置之外的受保护应用文件，导致文件内容泄露，官方评估对机密性影响为高，对完整性与可用性无影响；该缺陷在 10.3.26 与 11.3.12 版本中引入，公开渠道未披露具体源码位置。\n修复版本中通过厂商安全更新消除了该路径穿越风险，公开资料未披露更细粒度的源码修改，用户应升级至 10.3.27 或 11.3.13 及以上版本。", "effects": [{"comp_name": "jira_data_center", "ecosystem": "linu :X", "cwe": "CWE-306", "description": "FL WLAN 系列是 Phoenix Contact 推出的工业无线局域网设备，本漏洞涉及 FL WLAN 1020、1021、1022、1120、1121、1122、2330、2331、2340、2341 型号，固件为闭源嵌入式软件，用于工业网络中的无线通信与设备管理。\n受影响版本中，设备 REST API 对修改用户密码等关键操作缺少必要的身份验证（CWE-306），持有低权限账户的远程攻击者可以调用该接口修改任意用户账户的密码，包括管理员账户；攻击者更改管理员密码后可获得设备完全管理权限，并可以修改全部配置，导致设备机密性、完整性与可用性完全丢失。\n修复版本中通过固件 26.10 修复 REST API 关键操作的访问控制缺陷，阻止低权限用户修改其他用户账户的密码，官方建议将全部受影响设备升级到固件 26.10。", "effects": [{"comp_name": "fl_wlan", "ecosystem": "linux", "versions": [{"affected_version": "[0.0,26.10)", "min_fixed_version": "26.10", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "fl_wlan_firmware", "ecosystem": "linux", "versions": [{"affected_version": "[0.0,26.10)", "min_fixed_version": "26.10", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "关键功能的认证机制缺失", "kind_en": "缺少关键功能的身份验证", "last_modified_time": "2026-11-18", "level": "High", "mps_id": "MPS-5x3t-8zvg", "poc": false, "poc_url": [], "published_time": "2026-11-18", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-5x3t-8zvg", "name": "https://www.oscs1024.com/hd/MPS-5x3t-8zvg"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-113497", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-113497"}, {"url": "https://www.certvde.com/en/advisories/VDE-2026-126/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "FL WLAN 固件提权漏洞", "_translated": true, "_saved_at": "2026-11-18T09:56:04+00:00", "_first_saved_at": "2026-11-18T09:56:04+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-5x3t-8zvg"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2026-21601", "cvss": {"cvssv4": [{"source": "security@atlassian.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-287", "description": "Jira Service Management Data Center 是 Atlassian 推出的商业 IT 服务管理软件，基于 Java 构建，面向企业提供工单管理、SLA 跟踪与服务台流程支持，不公开源码。\n受影响版本中，产品存在 BASM（Broken Authentication \u0026 Session Management）认证与会话管理缺陷，该缺陷在 10.0.0 与 11.0.0 版本中引入并影响 10.x 与 11.x 多个版本线。攻击者无需任何凭据便可通过网络请求以另一用户身份执行操作，造成高程度机密性影响，官方 CVSS 评分为 8.7，厂商未公开披露具体缺陷代码路径。\n修复版本中通过官方安全更新修复该认证与会话管理缺陷，使未认证请求无法再以其他用户身份执行操作，官方指定修复版本为 10.3.27 与 11.3.13，公开资料未披露更细粒度的源码修改。", "effects": [{"comp_name": "jira_service_management_data_center", "ecosystem": "linux", "versions": [{"affected_version": "[10.0.0,10.3.27)", "min_fixed_version": "10.3.27", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[10.4.0,11.3.13)", "min_fixed_version": "11.3.13", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "身份验证不当", "kind_en": "认证不当", "last_modified_time": "2026-11-18", "level": "High", "mps_id": "MPS-9a76-0355", "poc": false, "poc_url": [], "published_time": "2026-11-18", "reference_url_list": [{"url": "https://confluence.atlassian.com/security/security-bulletin-november-17-2026-1874690748.html", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-21601", "name": ""}, {"url": "https://jira.atlassian.com/browse/JSDSERVER-16892", "name": ""}, {"url": "https://confluence.atlassian.com/servicemanagement/jira-service-management-release-notes-780083086.html", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Jira Service Management Data Center认证绕过漏洞", "_translated": true, "_saved_at": "2026-11-17T19:01:37+00:00", "_first_saved_at": "2026-11-17T19:01:37+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-9a76-0355"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-21605", "cvss": {"cvssv4": [{"source": "security@atlassian.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-22", "description": "Confluence Data Center 是 Atlassian 提供的商业闭源企业知识库与协作软件，用于集中管理团队文档。产品 Web 层包含 CssServlet，按请求路径分发样式等资源。\n受影响版本中，CssServlet 将请求可控路径转发给 ServletRequest.getRequestDispatcher。分发器对该路径执行 URL 解码和规范化，未认证攻击者可使用编码路径穿越序列访问受保护的 Web 应用资源，例如 /WEB-INF/web.xml，从而读取可能包含配置或密钥的受保护文件。厂商已确认的影响限于机密性，未证实完整性或可用性影响。\n修复版本中通过发布 Confluence Data Center 9.2.27、10.2.20 与 11.0.1 修复该问题，对应版本线升级到这些版本后不再属于厂商标记的受影响范围。公开材料未披露 CssServlet 的源码级补丁。", "effects": [{"comp_name": "confluence_data_center", "ecosystem": "linux", "versions": [{"affected_version": "[2.0.0,2.0.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[4.0.0,4.0.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.0.1,6.0.1]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.5.0,6.5.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.7.0,6.7.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.11.0,6.11.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[3.0.0,3.0.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[5.0.0,5.0.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[3.0.1,3.0.1]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true ontent": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-21606", "cvss": {"cvssv4": [{"source": "security@atlassian.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-22", "description": "Atlassian Jira Software Data Center 是 Atlassian 推出的商业项目与问题跟踪平台，以数据中心模式部署，源码未公开；同平台发布的 Jira Service Management Data Center 受同一问题影响，两者均面向企业提供项目任务管理与服务请求管理能力。\n受影响版本中，漏洞为 10.3.26 与 11.3.12 两个维护版本引入，产品在资源访问处理中未能将访问限制在声明资源目录边界内，未认证攻击者可远程构造包含路径穿越序列的请求，读取部署目录中声明资源范围之外的受保护资源内容，官方 CVSS 向量显示机密性影响为高、完整性与可用性不受影响，该漏洞主要带来敏感资源泄露风险，受影响的具体源码位置厂商未披露。\n修复版本中通过厂商安全更新收紧资源路径处理逻辑，消除声明资源目录之外的资源访问能力，受影响实例需升级至 11.3 系列的 11.3.13 及以上版本或 10.3 系列的 10.3.27 及以上版本。", "effects": [{"comp_name": "jira", "ecosystem": "linux", "versions": [{"affected_version": "[10.3.26,10.3.27)", "min_fixed_version": "10.3.27", "repository": "unmanaged", "solutions": [], ": "high", "base_score": 8.3}]}, "cvss_score": 8.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:L/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:M/U:X", "cwe": "CWE-772", "description": "PingAuthorize 是 Ping Identity 推出的商业授权管理与 API 安全网关产品，闭源发布，可在 Gateway 模式下作为 API 安全网关，对发往上游 API 服务的请求执行策略决策与集中授权治理。\n受影响版本中，Gateway 模式下发往上游 API 服务的请求在 30 秒网关超时后，异步上游请求在特定条件下未被终止而继续等待响应；当底层 keep-alive 连接在原响应到达前被复用于其他请求时，迟到的响应被写入新的 HTTP 交换，后续调用方可能收到先前请求的响应数据，形成跨请求的未授权信息泄露，官方确认该行为影响所有已发布版本。\n修复版本中通过网关超时与连接复用处理修复（PAZ-24037，SECADV057）：网关改为遵守关联外部服务器配置的 connect-timeout 与 response-timeout，超时后的迟到响应不再写入复用连接上后续请求的交换，修复版本为 10.2.0.9、10.3.0.6、11.0.0.4 与 11.1.0.1，官方同时建议在前置代理或负载均衡器上禁用 HTTP keep-alive 与连接复用作为临时缓解。", "effects": [{"comp_name": "pingauthorize", "ecosystem": "linux", "versions": [{"affected_version": "[10.3,10.3.0.6)", "min_fixed_version": "10.3.0.6", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,10.2.0.9)", "min_fixed_version": "10.2.0.9", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[11.0,11.0.0.4)", "min_fixed_version": "11.0.0.4", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[11.1,11.1.0.1)", "min_fixed_version": "11.1.0.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "对已超过有效生命周期的资源丧失索引", "kind_en": "有效生命周期后缺少资源释放", "last_modified_time": "2026-11-18", "level": "High", "mps_id": "MPS-nykv-6cz0", "poc": false, "poc_url": [], "published_time": "2026-11-18", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-nykv-6cz0", "name": "https://www.oscs1024.com/hd/MPS-nykv-6cz0"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-80322", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-80322"}, {"url": "https://support.pingidentity.com/s/article/SECADV057-PingAuthorize-Cross-Request-Response-Leakage", "name": ""}, {"url": "https://docs.pingidentity.com/pingauthorize/11.1/release_notes/paz_release_notes_legacy_home.html", "name": ""}, {"url": "https://www.pingidentity.com/en/resources/downloads/pingauthorize.html", "name": ""}, {"url": "https://docs.pingidentity.com/pingauthorize/11.0/release_notes/paz_release_notes_legacy_home.html", "name": ""}, {"url": "https://docs.pingidentity.com/pingauthorize/10.3/release_notes/paz_release_notes_legacy_home.html", "name": ""}, {"url": "https://docs.pingidentity.com/pingauthorize/10.2/release_notes/paz_release_notes_legacy_home.html", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "PingAuthorize 跨请求响应泄露", "_translated": true, "_saved_at": "2026-11-17T19:01:33+00:00", "_first_saved_at": "2026-11-17T19:01:33+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-nykv-6cz0"}, {"analysis_status": 3, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-114938", "cvss": {"cvssv31": [{"source": "secalert_us@oracle.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.1}, {"source": "murphysec", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.1}]}, "cvss_score": 8.1, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-122", "description": "OpenJDK 是 Java SE 的开源参考实现，HotSpot 在 x86-64 上用 AVX-512 VBMI 指令为 java.util.Base64.Decoder 生成解码内建代码。\n受影响版本中，generate_base64_decodeBlock 在 CPU 支持 AVX-512 VBMI 与 AVX-512BW 且输入不是 MIME 时进入 AVX-512 路径：JDK 17 要求输入长度大于 128 字节，JDK 21 与 JDK 25 要求大于 31 字节。主循环按 64 字节整块解完后，末尾剩下、凑不满下一块的那一截进入 L_finalBit，再按 (len/4)*3 计算输出长度，遇到填充字符 = 再递减，长度下溢使 evmovdqub 以 64 字节全掩码越过 decode 预先分配的输出数组，造成堆越界写。Java 随后仍会拒绝非法 Base64，但相邻堆对象可能已被改写，可导致进程崩溃，在可控制的堆布局下可远程执行代码。\n修复版本中通过在 L_finalBit 入口把剩余长度小于 4 的尾部转到非 AVX-512 路径，使不足一个编码块的填充尾部不再执行下溢的掩码存储。", "effects": [{"comp_name": "openjdk", "ecosystem": "linux", "version "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-303", "description": "Synology DiskStation Manager (DSM) 是 Synology NAS 设备使用的闭源操作系统，提供文件服务、套件管理与基于 SAML 的 SSO 单点登录能力，由厂商通过系统更新维护。\n受影响版本中，SSO API 的认证算法实现不正确（CWE-303），认证流程对请求身份的判定存在缺陷，远程攻击者在事先获知目标用户 distinguished name (DN) 的条件下可借助该 API 读取或写入任意文件，并发动拒绝服务攻击；厂商公告同时说明 DSM 7.2.1-69057 不受影响，问题集中在 7.2.2 与 7.3.1 分支的对应版本范围。\n修复版本中通过修正 SSO API 的认证算法实现，阻断对已知 DN 用户的错误认证判定，消除任意文件读取、写入与拒绝服务风险，用户需升级至 DSM 7.2.2-72806-5 或 7.3.1-86003-1 及以上版本。", "effects": [{"comp_name": "diskstation_manager", "ecosystem": "linux", "versions": [{"affected_version": "[7.2.2,7.2.2-72806-5)", "min_fixed_version": "7.2.2-72806-5", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[7.3.1,7.3.1-86003-1)", "min_fixed_version": "7.3.1-86003-1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "认证算法的不正确实现", "kind_en": "Incorrect Implementation of Authentication Algorithm", "last_modified_time": "2026-11-18", "level": "High", "mps_id": "MPS-mgo3-k49j", "poc": false, "poc_url": [], "published_time": "2026-11-18", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-mgo3-k49j", "name": "https://www.oscs1024.com/hd/MPS-mgo3-k49j"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2025-15716", "name": "https://nvd.nist.gov/vuln/detail/CVE-2025-15716"}, {"url": "https://www.synology.com/en-global/security/advisory/Synology_SA_25_14", "name": "Synology-SA-25:14 DSM (PWN2OWN 2025)"}], "scope_influence": "", "tags": ["应用软件"], "title": "Synology DSM SSO认证算法缺陷", "_translated": true, "_saved_at": "2026-11-18T09:56:15+00:00", "_first_saved_at": "2026-11-18T09:56:15+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-mgo3-k49j"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-131959", "cvss": {"cvssv31": [{"source": "cve@mitre.org", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "cwe": "CWE-829", "description": "GNU Emacs 是 GNU 计划维护的开源可扩展文本编辑器，以 Emacs Lisp 作为扩展语言，广泛用于代码编辑与开发环境配置。\n受影响版本中，set-auto-mode 在模式选择时通过 hack-dir-local--get-variables 读取 .dir-locals.el 提供的 auto-mode-alist 并传入 set-auto-mode--apply-alist 匹配，其内部辅助函数 set-auto-mode--find-matching-alist-entry 在处理 (REGEXP FUNCTION t) 形式条目时把首个命中的 FUNCTION 暂存，并在继续命中下一个条目时先行调用 set-auto-mode-0 执行该函数，执行先于调用方的 set-auto-mode--dir-local-valid-p 白名单校验发生，攻击者在项目目录放置含此类条目的 .dir-locals.el，用户打开匹配文件后无需任何确认提示即可运行注入的任意 Emacs Lisp，执行权限与 Emacs 进程相同。\n修复版本中通过将匹配辅助函数重构为 set-auto-mode--from-matching-alist-entry 并新增 keep-mode-if-same 与 dir-local 参数，把 set-auto-mode-0 调用收拢到辅助函数内部，在每次执行待选模式前先经 set-auto-mode--dir-local-valid-p 校验，校验失败的条目仅打印 Ignoring invalid mode 并被忽略，set-auto-mode--apply-alist 不再只校验最终返回值，先执行后校验的路径被切断，经目录本地变量注入的非法函数不再被执行。", "effects": [{"comp_name": "emacs", "ecosystem": "linux", "versions": [{"affected_version": "[31.1,31.2)", "min_fixed_version": "31.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "从非可信控制范围包含功能例程", "kind_en": "包含来自不可信控制领域的功能", "last_modified_time": "2026-11-18", "level": "High", "mps_id": "MPS-k6b7-531r", "poc": false, "poc_url": [], "published_time": "2026-11-18", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-k6b7-531r", "name": "https://www.oscs1024.com/hd/MPS-k6b7-531r"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-131959", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-131959"}, {"url": "https://www.openwall.com/lists/oss-security/2026/11/11/7", "name": ""}, {"url": "https://cgit.git.savannah.gnu.org/cgit/emacs.git/commit/?id=205ae0b0583dbfe09e258164adbc49e130645221", "name": ""}, {"url": "https://x3r0day.github.io", "name": ""}, {"url": "https://debbugs.gnu.org/82213", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "Emacs 目录本地变量代码执行漏洞", "_translated": true, "_saved_at": "2026-11-18T09:56:08+00:00", "_first_saved_at": "2026-11-18T09:56:08+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-k6b7-531r"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-125829", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:N/I:N/A:H", "severity": "high", "base_score": 7.7}]}, "cvss_score": 7.7, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:N/I:N/A:H", "cwe": "CWE-22", "description": "Product Feed PRO for WooCommerce（插件标识 woo-product-feed-pro）是 Rymera Web Co 开源的 WooCommerce 产品 Feed 插件，在 WordPress 站点上把商品目录导出为 Google Shopping、Meta、Bing 等渠道的数据 Feed 文件，WordPress.org 统计约 8 万站点安装。\n受影响版本中，插件把表单提交的 project_hash 与 fileformat 未经校验写入 Feed 元数据 file_name 与 file_format，Product_Feed::get_file_path() 将两者原样拼接为 uploads/woo-product-feed-pro/\u003cformat\u003e/\u003cfile_name\u003e.\u003cfile_format\u003e 形式的绝对路径，包含 ../ 的名称与非常规扩展名均不被拦截；具备 Feed 管理能力的低权限账号（Patchstack 评估最低 Contributor 级）构造带路径穿越序列的 Feed 后删除该 Feed，Product_Feed::remove_file() 对拼接结果直接调用 wp_delete_file 且无目录边界检查，可删除 WordPress 站点目录内任意文件，例如 wp-config.php，导致站点配置丢失并可能被配合重装流程接管。\n修复版本中通过新增文件名与格式白名单完成修复：Product_Feed::is_valid_file_name() 仅接受字母、数字、下划线与连字符，is_valid_file_format() 仅接受插件支持的 Feed 格式，保存边界 Edit_Feed_Page 对非法 project_hash 重新生成安全名称、对不支持的 fileformat 直接拒绝，get_file_path() 等路径 getter 对非法值返回空，remove_file() 对目标路径执行 realpath 归一化并限定结果必须位于 Feed 上传目录内，另通过 Version_13_5_9_Feed_File_Name_Update 迁移存量非法文件名，切断路径穿越删除链。", "effects": [{"comp_name": "woo-product-feed-pro", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,13.5.9)", "min_fixed_version": "13.5.9", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-11-18", "level": "High", "mps_id": "MPS-tdl8-vbc5", "poc": false, "poc_url": [], "published_time": "2026-11-18", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-tdl8-vbc5", "name": "https://www.oscs1024.com/hd/MPS-tdl8-vbc5"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-125829", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-125829"}, {"url": "https://patchstack.com/database/wordpress/plugin/woo-product-feed-pro/vulnerability/wordpress-product-feed-pro-for-woocommerce-plugin-13-5-8-arbitrary-file-deletion-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Product Feed PRO任意文件删除漏洞", "_translated": true, "_saved_at": "2026-11-18T09:56:09+00:00", "_first_saved_at": "2026-11-18T09:56:09+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-tdl8-vbc5"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-21602", "cvss": {"cvssv4": [{"source": "security@atlassian.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:L/UI:P/VC:H/VI:H/VA:N/SC:L/SI:L/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.4}]}, "cvss_score": 7.4, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:L/UI:P/VC:H/VI:H/VA:N/SC:L/SI:L/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-79", "description": "Jira Core Data Center 与 Jira Software Data Center 是 Atlassian 推出的商业问题跟踪与项目管理软件，基于 Java 构建，以 Data Center 形式供企业私有化部署，不开放源代码。\n受影响版本中，该存储型 XSS 缺陷于 10.3.26 版本引入，相关功能在处理用户可控内容时缺少充分的安全处理，具备普通用户权限的攻击者可将任意 HTML 或 JavaScript 代码持久化写入系统，其他用户在浏览器中查看相关内容时，注入代码会在其会话上下文中执行，可被用于窃取会话凭据或以受害者身份执行操作。\n修复版本中通过厂商安全更新加固相关内容在存储与渲染环节的安全处理，阻止注入的 HTML 与 JavaScript 代码在受害者浏览器中执行，Atlassian 官方未披露更细粒度的源码修改。", "effects": [{"comp_name": "jira_data_center", "ecosystem": "linux", "versions": [{"affected_version": "[10.3.26,10.3.27)", "min_fixed_version": "10.3.27", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[11.3.0,11.3.13)", "min_fixed_version": "11.3.13", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-11-18", "level": "High", "mps_id": "MPS-b95f-b123", "poc": false, "poc_url": [], "published_time": "2026-11-18", "reference_url_list": [{"url": "https://confluence.atlassian.com/security/security-bulletin-november-17-2026-1874690748.html", "name": ""}, {"url": "https://jira.atlassian.com/browse/JRASERVER-79584", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-21602", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Jira存储型XSS漏洞", "_translated": true, "_saved_at": "2026-11-17T19:01:38+00:00", "_first_saved_at": "2026-11-17T19:01:38+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-b95f-b123"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-76538", "cvss": {}, "cvss_score": 8.8, "cvss_vector": "", "cwe": "CWE-943", "description": "Splunk Enterprise 是 Splunk 公司的商业化机器数据平台（闭源软件），用于采集、索引与检索机器数据，提供 SPL 搜索语言、数据模型与 REST API 等分析和管理能力。\n受影响版本中，不持有 admin 或 power 角色的低权限用户可通过 REST API 提交数据模型加速参数，Splunk Enterprise 在将调用方提供的这些加速值写入自动生成的汇总检索（summarization search）前未进行正确中和，注入的 Search Processing Language（SPL）随汇总检索以提升权限运行，导致低权限用户可令平台执行任意 SPL 检索（CWE-943）。\n修复版本中通过在将调用方提供的数据模型加速值写入生成的汇总检索之前对其进行正确中和，切断注入 SPL 进入高权限检索执行路径的链路，消除低权限用户以提升权限运行任意 SPL 的能力。", "effects": [{"comp_name": "splunk_enterprise", "ecosystem": "linux", "versions": [{"affected_version": "[9.4.0,9.4.16)", "min_fixed_version": "9.4.16", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[10.0.0,10.0.12)", "min_fixed_version": "10.0.12", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[10.2.0,10.2.9)", "min_fixed_version": "10.2.9", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[10.4.0,10.4.5)", "min_fixed_version": "10.4.5", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "数据查询逻辑中特殊元素的不当中和", "kind_en": "数据查询逻辑中特殊元素的不当中和", "last_modified_time": "2026-11-19", "level": "High", "mps_id": "MPS-0aa9-1558", "poc": false, "poc_url": [], "published_time": "2026-11-19", "reference_url_list": [{"url": "https://advisory.splunk.com/advisories/SVD-2026-1103", "name": ""}], "scope_influence": "", "tags": [], "title": "Splunk Enterprise SPL注入漏洞", "_translated": true, "_saved_at": "2026-11-19T00:55:01+00:00", "_first_saved_at": "2026-11-19T00:55:01+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-0aa9-1558"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "cnvd_id": "", "cve_id": "", "cvss": {}, "cvss_score": 8.8, "cvss_vector": "", "cwe": "CWE-416", "description": "Linux kernel 是开源的操作系统内核，其 SCTP（流控制传输协议）子系统位于 net/sctp，提供面向连接、支持多宿主与多流的传输服务，在多数发行版中以 sctp 模块随内核提供，应用程序首次打开 SCTP 套接字时由内核自动加载。\n受影响版本中，SCTP 发送路径存在竞态缺陷：发送操作在内核中等待期间，其关联（association）可被转移到另一个套接字，等待中的发送操作随后释放该关联；另一套接字继续访问已释放的关联时形成 use-after-free，特定条件下表现为 double free，Xint 在启用 KASAN 的内核上捕获到 double-free 报告。利用该缺陷可获得内核内存泄露与内核任意函数调用两个原语，前者可绕过 KASLR，后者可劫持内核执行流程，Xint 已在 nginx worker 账户环境中稳定获得 root，并在 nginx 运行于 Docker 容器时取得宿主机 root shell。该缺陷随 Linux v4.15 于 2018 年引入，已存在超过八年。\n在官方修复发布前，可通过在不使用 SCTP 的主机 /etc/modprobe.d/ 目录下的配置文件写入 install sctp /bin/false，阻止 sctp 模块经 modprobe 自动加载；该措施无法卸载已加载模块，也无法禁用编译进内核的 SCTP。上游内核补丁尚未发布，Xint 表示将在后续数周内提供，发布后应按发行版内核安全公告及时升级。", "effects": [{"comp_name": "linux_kernel", "ecosystem": "linux", "versions": [{"affected_version": "[4.15,+∞)", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "UAF", "kind_en": "免费后使用", "last_modified_time": "2026-11-19", "level": "High", "mps_id": "MPS-cf96-bda7", "poc": false, "poc_url": [], "published_time": "2026-11-19", "reference_url_list": [{"url": "https://seclists.org/oss-sec/2026/q4/781", "name": ""}, {"url": "https://nginx2root.com/", "name": ""}, {"url": "https://xint.io/blog/nginx2root-remote-code-execution", "name": ""}, {"url": "https://lwn.net/Articles/1108362/", "name": ""}, {"url": "https://github.com/torvalds/linux", "name": ""}], "scope_influence": "", "tags": ["操作系统"], "title": "Linux内核SCTP本地提权漏洞", "_translated": true, "_saved_at": "2026-11-19T08:18:05+00:00", "_first_saved_at": "2026-11-19T08:18:05+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-cf96-bda7"}, {"analysis_status": 0, "articles": [{"content": "- 命令注入是一种攻击，其目标是通过易受攻击的应用程序在主机操作系统上执行任意命令。 当应用程序将不安全的用户提供的数据（表单、cookie、HTTP 标头等）传递到系统 shell 时，就会产生缺陷。攻击者通过构造恶意的命令或数据，将其注入到程序执行的上下文中，从而绕过程序的输入验证和安全措施，实现对程序操作的恶意操作。", "title": "什么是命令注入"}, {"content": "- 文件上传：攻击者通过构造恶意的文件上传请求，将包含恶意命令的文件上传到服务器，从而利用命令注入漏洞执行恶意命令。\n- SQL 注入：攻击者通过构造恶意的 SQL 查询语句，将包含恶意命令的 SQL 语句注入到数据库中，从而执行恶意命令，窃取数据或者破坏系统。\n- 命令执行：攻击者通过在 Web 应用程序的表单提交数据中注入恶意命令，从而执行恶意命令，例如删除文件、格式化硬盘等。\n- 命令注入漏洞的旁路攻击：攻击者可以利用命令注入漏洞旁路控制程序的执行流程，从而窃取数据、破坏系统、控制程序等。\n", "title": "命令注入常见的攻击方式"}, {"content": "- 输入验证：在程序输入处对输入数据进行严格的验证和过滤，确保输入数据符合预期的格式和类型，避免被攻击者注入恶意命令。\n- 输出过滤：在程序输出处对输出数据进行严格的过滤和检查，确保输出数据符合预期的格式和类型，避免被攻击者截获和篡改。\n- 使用安全的编程模型：使用安全的编程模型，例如避免使用原生的命令执行方式，使用安全的框架和库来处理输入数据和执行命令，避免命令注入漏洞。\n- 数据库加密和访问控制：对于敏感数据和命令，使用加密和访问控制措施，确保只有授权用户可以访问和执行命令，避免被攻击者窃取和篡改。\n- 定期更新和升级：定期更新和升级应用程序和库的版本，确保应用程序和库的最新版本包含了最新的安全补丁和修复措施，避免安全漏洞的出现和利用。\n- 安全审计和监控：定期对系统和应用程序进行安全审计和监控，及时发现和阻止潜在的安全漏洞和攻击，确保系统和数据的安全和可靠性。", "title": "如何预防命令注入"}], "cnvd_id": "", "cve_id": "", "cvss": {}, "cvss_score": 8.7, "cvss_vector": "", "cwe": "CWE-77", "description": "lettre 是 Rust 生态中广泛使用的开源电子邮件发送库（crates.io 包 lettre，MIT 许可），提供 SMTP 传输、连接池与消息构建能力，常用于应用内通知、验证码等邮件发送。\n受影响版本中，SMTP DATA 阶段负责透明化的编解码器 ClientCodec 只在完整 CRLF 之后重置到行首状态，行首以点开头的行会被补写第二个点（dot-stuffing），而裸 LF 或裸 CR 之后的内容停留在行中状态，不会触发补点；攻击者控制 send_raw 传入的原始报文或未经编码的邮件正文时，可植入 \\n.\\n 序列，该序列以未补点形式原样发往服务器，在接受裸 LF 行结束符的服务器上被识别为 DATA 结束标记，其后的字节在同一已认证 SMTP 连接上被解析为命令，攻击者可复用该连接发送其他邮件。\n修复版本中通过重写 ClientCodec 状态机切断上述因果链：新增 AfterBareLf 状态，把裸 CR 与裸 LF 同样视为行边界，凡处于非行中状态时遇到的点一律先补写第二个点，DATA 结束序列仍只接受 CRLF，消除了对宽松服务器的 SMTP 命令注入。", "effects": [{"comp_name": "lettre", "ecosystem": "cargo", "versions": [{"affected_version": "(-∞,0.11.24)", "min_fixed_version": "0.11.24", "repository": "cargo", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "命令注入", "kind_en": "命令中使用的特殊元素的不正确中和（“命令注入”）", "last_modified_time": "2026-11-19", "level": "High", "mps_id": "MPS-af39-3670", "poc": false, "poc_url": [], "published_time": "2026-11-19", "reference_url_list": [{"url": "https://rustsec.org/advisories/RUSTSEC-2026-0561.html", "name": ""}, {"url": "https://github.com/lettre/lettre/commit/3d9a6e6a467c6ce00bd39ada6aa1a00e57540a1d", "name": ""}, {"url": "https://github.com/rustsec/advisory-db/blob/main/crates/lettre/RUSTSEC-2026-0561.md", "name": ""}, {"url": "https://api.osv.dev/v1/vulns/RUSTSEC-2026-0561", "name": ""}, {"url": "https://github.com/lettre/lettre/blob/master/CHANGELOG.md", "name": ""}, {"url": "https://github.com/lettre/lettre/releases/tag/v0.11.24", "name": ""}, {"url": "https://crates.io/crates/lettre", "name": ""}, {"url": "https://rustsec.org/advisories/RUSTSEC-2021-0069.html", "name": ""}], "scope_influence": "", "tags": [], "title": "lettre SMTP命令注入漏洞", "_translated": true, "_saved_at": "2026-11-19T08:18:05+00:00", "_first_saved_at": "2026-11-19T08:18:05+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-af39-3670"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-19609", "cvss": {"cvssv4": [{"source": "vulnerability@ncsc.ch", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-79", "description": "Unblu Spark 是 Unblu inc. 开发的商业客户互动与协同浏览平台，支持本地部署与云部署，提供嵌入式协同浏览、Agent Desk 客服工作台与 Single Conversation Desk 等组件，服务端源码未公开。\n受影响版本中，嵌入式协同浏览捕获的页面包含以前缀 dyn. 标记的动态属性，用于同步表单字段值、滚动位置等 DOM 属性的实时取值；坐席端浏览器把接收到的任意 dyn. 键直接应用为对应 DOM 属性，未做键名白名单校验，处于访客角色的未认证远程攻击者可发送类似 dyn.innerHTML 的键，向坐席浏览器的协同浏览视图中注入受控标记，使攻击者提供的 JavaScript 在坐席会话的上下文与身份下于 Agent Desk 或 Single Conversation Desk 中执行。\n修复版本中通过固定白名单将坐席端浏览器可应用的 dyn. 键限制为页面捕获产生的五个键，并在 Collaboration Server 侧于数据到达坐席浏览器前丢弃其余 dyn. 键，切断注入路径；8.40.4 额外对坐席浏览器中显示协同浏览页面的框架启用沙箱隔离，并在启用 CSP 时应用更严格的内容安全策略，修复版本包括 7.57.10，以及 8.35.2-hotfix.1、8.37.2-hotfix.4、8.38.2-hotfix.1、8.39.3-hotfix.0、8.40.4 及更高版本。", "effects": [{"comp_name": "unblu_spark", "ecosystem": "linux", "versions": [{"affected_version": "[8.0,8.40.4)", "min_fixed_version": "8.40.4", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[7.0,7.57.10)", "min_fixed_version": "7.57.10", "repository": "unmanaged", "solutions": [], "upstream": t rt 搜索中使用过滤器输入前未对其进行完整校验，不持有 admin 或 power 角色的普通用户可构造包含注入内容的 metric alert 过滤器输入，使计划执行的 metric alert 搜索运行任意 Search Processing Language（SPL）命令，并访问以明文形式存储的凭据；利用前提为实例上存在至少一个非内部 metric 索引。该漏洞对应厂商 Bug ID VULN-81808。\n修复版本中通过对 metric alert 过滤器输入的完整校验，消除计划搜索中的任意 SPL 执行路径，受影响分支需升级至 10.4.5、10.2.9、10.0.12、9.4.16 或更高版本；厂商公告未提供针对该漏洞的缓解措施或临时规避方案。", "effects": [{"comp_name": "splunk", "ecosystem": "linux", "versions": [{"affected_version": "[10.4.0,10.4.5)", "min_fixed_version": "10.4.5", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[10.2.0,10.2.9)", "min_fixed_version": "10.2.9", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[10.0.0,10.0.12)", "min_fixed_version": "10.0.12", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[9.4.0,9.4.16)", "min_fixed_version": "9.4.16", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "命令注入", "kind_en": "命令中使用的特殊元素的不正确中和（“命令注入”）", "last_modified_time": "2026-11-19", "level": "High", "mps_id": "MPS-47c0-01f7", "poc": false, "poc_url": [], "published_time": "2026-11-19", "reference_url_list": [{"url": "https://advisory.splunk.com/advisories/SVD-2026-1103", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-76544", "name": ""}], "scope_influence": "", "tags": [], "title": "Splunk 指标告警 SPL 注入漏洞", "_translated": true, "_saved_at": "2026-11-19T00:54:58+00:00", "_first_saved_at": "2026-11-19T00:54:58+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-47c0-01f7"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-131178", "cvss": {}, "cvss_score": 7.6, "cvss_vector": "", "cwe": "CWE-74", "description": "Splunk Enterprise 是 Splunk 公司推出的闭源商业数据平台，用于采集、索引与检索机器数据，并提供基于仪表板的可视化分析能力，Classic Dashboard（经典仪表板）支持用户保存搜索面板并共享给其他已认证用户。\n受影响版本中，持有 power 角色的用户可以构造一个共享的 Classic Dashboard，在其中嵌入任意 Search Processing Language（SPL）命令；当其他已认证用户打开该共享仪表板时，Splunk Enterprise 会以查看者的权限运行注入的 SPL，攻击者可读取和修改查看者可访问的数据，并部分破坏 Splunk Enterprise 的可用性。利用需要查看者打开共享仪表板，官方公告未披露源码位置，并提示参考 sparkline 添加、仪表板权限配置与 SPL 高危命令防护的官方文档。\n修复版本中通过升级至 Splunk Enterprise 10.4.5、10.2.9、10.0.12 或 9.4.17 及以上版本消除该注入链，官方公告未披露闭源代码改动，也未提供额外缓解措施，建议同步审计共享经典仪表板的共享范围并遵循 SPL 高危命令防护最佳实践。", "effects": [{"comp_name": "splunk", "ecosystem": "linux", "versions": [{"affected_version": "[10.4.0,10.4.5)", "min_fixed_version": "10.4.5", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[9.4.0,9.4.17)", "min_fixed_version": "9.4.17", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[10.2.0,10.2.9)", "min_fixed_version": "10.2.9", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[10.0.0,10.0.12)", "min_fixed_version": "10.0.12", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "注入", "kind_en": "下游组件使用的输出中特殊元素的不正确中和（“注入”）", "last_modified_time": "2026-11-19", "level": "High", "mps_id": "MPS-2e48-a4bc", "poc": false, "poc_url": [], "published_time": "2026-11-19", "reference_url_list": [{"url": "https://advisory.splunk.com/advisories/SVD-2026-1103", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-131178", "name": ""}, {"url": "https://help.splunk.com/en/splunk-enterprise/search/search-manual/10.6/calculate-statistics/add-sparklines-to-search-results", "name": ""}, {"url": "https://help.splunk.com/en/splunk-enterprise/create-dashboards-and-reports/simple-xml-dashboards/10.6/manage-and-share-dashboards/configure-dashboard-permissions", "name": ""}, {"url": "https://help.splunk.com/en/splunk-enterprise/administer/manage-users-and-security/10.6/best-practices-for-splunk-platform-security/spl-safeguards-for-risky-commands", "name": ""}], "scope_influence": "", "tags": [], "title": "Splunk Enterprise SPL 注入漏洞", "_translated": true, "_saved_at": "2026-11-19T00:54:55+00:00", "_first_saved_at": "2026-11-19T00:54:55+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-2e48-a4bc"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-131179", "cvss": {}, "cvss_score": 7.6, "cvss_vector": "", "cwe": "CWE-74", "description": "Splunk Enterprise 是 Splunk Inc. 开发的商业数据分析与安全信息事件管理平台，为闭源软件，用于采集、索引和检索机器数据，并通过搜索处理语言（SPL）与仪表板提供搜索和可视化能力。\n受影响版本中，持有 power 角色的用户可以向共享仪表板添加攻击者可控的 SPL 内容。Splunk Enterprise 在构建优化搜索作业前未中和搜索过滤值中的特殊元素，攻击者可控内容被拼接进生成的搜索作业；当其他用户在 Splunk Web 中打开该仪表板时，平台会以仪表板查看者的权限运行该 SPL，攻击者可控的 SPL 可泄露查看者可访问的存储凭据、修改索引数据并降低平台可用性。攻击者需要诱导受害用户在浏览器中发起请求，无法随意利用该漏洞。\n修复版本中通过在构建优化搜索作业前对搜索过滤值中的特殊元素进行中和处理，阻止共享仪表板中攻击者可控的 SPL 进入搜索作业执行路径，建议升级至 Splunk Enterprise 10.6.1、10.4.5、10.2.9、10.0.12 或 9.4.17 及以上版本。", "effects": [{"comp_name": "splunk", "ecosystem": "linux", "versions": [{"affected_version": "[10.4.0,10.4.5)", "min_fixed_version": "10.4.5", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[9.4.0,9.4.17)", "min_fixed_version": "9.4.17", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[10.6.0.5,10.6.1)", "min_fixed_version": "10.6.1", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[10.2.0,10.2.9)", "min_fixed_version": "10.2.9", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[10.0.0,10.0.12)", "min_fixed_version": "10.0.12", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "注入", "kind_en": "下游组件使用的输出中特殊元素的不正确中和（“注入”）", "last_modified_time": "2026-11-19", "level": "High", "mps_id": "MPS-c053-63e5", "poc": false, "poc_url": [], "published_time": "2026-11-19", "reference_url_list": [{"url": "https://advisory.splunk.com/advisories/SVD-2026-1103", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-131179", "name": ""}], "scope_influence": "", "tags": [], "title": "Splunk Enterprise SPL注入漏洞", "_translated": true, "_saved_at": "2026-11-19T00:54:57+00:00", "_first_saved_at": "2026-11-19T00:54:57+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-c053-63e5"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "", "cvss": {}, "cvss_score": 7.5, "cvss_vector": "", "cwe": "CWE-770", "description": "quinn-proto 是 Rust 语言的开源 QUIC 传输协议实现库，作为 quinn 框架的核心协议栈负责 QUIC 帧解析、流管理与流控状态处理，被 Rust 生态中的 QUIC 服务端与客户端广泛依赖。\n受影响版本中，quinn-proto/src/connection/streams/state.rs 的 StreamsState::received_max_stream_data 方法在处理对端 MAX_STREAM_DATA 帧时，未像 STREAM 与 RESET_STREAM 处理器那样先调用 validate_receive_id 校验流编号是否超出本端向对端宣告的流上限，对尚未打开的对端双向流不返回错误，最终进入 on_stream_frame 将 next_remote 更新为攻击者指定的流编号加一并置位 opened，把该编号及以下全部对端双向流标记为已打开。握手完成后，攻击者发送一个 13 字节、流编号达到 2^40 的 MAX_STREAM_DATA 帧，quinn 的 accept 与 accept_bi 循环会持续产出超过 2^40 个流，端点内存耗尽退出、停止接受新连接或长期占用处理器，形成远程拒绝服务。\n修复版本中通过在 received_max_stream_data 中对双向流增加 validate_receive_id 前置校验，流编号达到或超出已宣告上限时以 STREAM_LIMIT_ERROR 关闭连接，并在 on_stream_frame 的流隐式打开路径增加 max_remote 上限防御检查，阻止超出限制的流被批量标记为已打开，使处理行为符合 RFC 9000 第 4.6 节要求。", "effects": [{"comp_name": "quinn-proto", "ecosystem": "cargo", "versions": [{"affected_version": "[0.11.0,0.11.19)", "min_fixed_version": "0.11.19", "repository": "cargo", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "不加限制或调节的资源分配", "kind_en": "不受限制或节流地分配资源", "last_modified_time": "2026-11-19", "level": "High", "mps_id": "MPS-3a0c-a970", "poc": false, "poc_url": [], "published_time": "2026-11-19", "reference_url_list": [{"url": "https://rustsec.org/advisories/RUSTSEC-2026-0523.html", "name": ""}, {"url": "https://github.com/quinn-rs/quinn/security/advisories/GHSA-53rm-773f-4q8c", "name": ""}, {"url": "https://github.com/quinn-rs/quinn/commit/3eb7465d9e11d7a245e99cde1a4eb872ec26d264", "name": ""}, {"url": "https://github.com/quinn-rs/quinn/commit/73114d8289d42bd536c790fa00a9beed05a4e5fa", "name": ""}, {"url": "https://github.com/quinn-rs/quinn/releases/tag/quinn-proto-0.11.19", "name": ""}, {"url": "https://crates.io/crates/quinn-proto", "name": ""}, {"url": "https://datatracker.ietf.org/doc/html/rfc9000#section-4.6", "name": ""}], "scope_influence": "", "tags": [], "title": "quinn-proto流限制绕过致拒绝服务", "_translated": true, "_saved_at": "2026-11-19T08:18:04+00:00", "_first_saved_at": "2026-11-19T08:18:04+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-3a0c-a970"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-76516", "cvss": {"cvssv31": [{"source": "psirt@cisco.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:H/A:N", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:H/A:N", "cwe": "CWE-841", "description": "ClamAV 是 Cisco Talos 开源的跨平台反病毒引擎，以 C 语言实现，广泛用于邮件网关、文件服务与终端防护产品对不可信文件的恶意软件扫描，支持解析 XAR 等多种归档格式。\n受影响版本中，libclamav/xar.c 的 cli_scanxar 在提取 XAR 归档内 application/x-gzip 编码成员时，将累计解压输出计数变量 outsize 声明在内层 inflate 循环体内并每轮清零，解压数据先经 cli_writen 写入临时文件，随后传给 cli_checklimits 的始终是单个 FILEBUFF 缓冲区的字节数，配置的 MaxFileSize 与 MaxScanSize 无法被成员累计输出触发；同时外层 TOC 成员循环未在达到 MaxFiles、扫描超时或收到中止标志后停止。攻击者将高压缩比 deflate 流封装为 XAR GZIP 成员并提交扫描，引擎会持续解压并把全部输出写入临时文件直至流结束，可超出配置限额耗尽临时存储并陷入长时间循环，造成拒绝服务。\n修复版本中通过在写入前跟踪成员累计解压输出并校验 out_size 与本次解压字节之和，超出 MaxFileSize 或 MaxScanSize 时将本次写入截断到剩余配额并停止当前成员解压，超出部分计入聚合扫描配额避免后续成员重复占用；同时在提取每个成员前检查文件数、超时与中止标志，向上传播 CL_ETIMEOUT 与 CL_EMAXFILES 退出条件，切断了利用无界解压写入耗尽临时存储的路径。", "effects": [{"comp_name": "clamav", "ecosystem": "linux", "versions": [{"affected_version": "[0.98,1.4.7)", "min_fixed_version": "1.4.7", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[1.5.0,1.5.5)", "min_fixed_version": "1.5.5", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "行为工作流的不恰当实施", "kind_en": "Improper Enforcement of Behavioral Workflow", "last_modified_time": "2026-11-19", "level": "High", "mps_id": "MPS-4jcl-r1m5", "poc": false, "poc_url": [], "published_time": "2026-11-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-4jcl-r1m5", "name": "https://www.oscs1024.com/hd/MPS-4jcl-r1m5"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-76516", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-76516"}, {"url": "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-clamav-multi-e93M3vdA", "name": "cisco-sa-clamav-multi-e93M3vdA"}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "ClamAV XAR GZIP解压限额绕过致拒绝服务漏洞", "_translated": true, "_saved_at": "2026-11-18T18:36:43+00:00", "_first_saved_at": "2026-11-18T18:36:43+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-4jcl-r1m5"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "", "cvss": {}, "cvss_score": 7.5, "cvss_vector": "", "cwe": "CWE-617", "description": "quinn-proto 是 Rust 生态开源的 QUIC 传输协议核心实现（crates.io 组件），负责 QUIC 报文构造、解析与连接状态机，quinn 客户端与服务端均基于该组件工作。\n受影响版本中，客户端缓存 Retry 报文携带的令牌时没有任何长度限制，并在后续每个 Initial 报文头中原样写入该令牌。Initial 数据报固定为 1200 字节，当令牌与连接 ID 占满报文头后，PacketBuilder::new 计算出的最小报文尺寸大于最大可用尺寸，该矛盾仅由 debug_assert 检查；在下一次 poll_transmit 时，debug 构建触发断言 panic，release 构建按错误的最小尺寸执行单次超过 10 GiB 的内存分配，令牌更长时分配失败并中止进程。攻击者仅凭客户端发出的首个 Initial 即可构造匹配的 Retry 报文，发送者可以是客户端正在连接的服务端，也可以是能够抢在该服务端之前应答的任意网络位置攻击者，因此所有使用 quinn-proto 发起出站连接的应用均受影响，服务端不处理 Retry 报文。\n修复版本中通过在 PacketBuilder::new 中改用饱和减法计算最大尺寸，并在 Initial 报文头之后剩余帧空间不足时截断缓冲区、以 PROTOCOL_VIOLATION 关闭连接，统一覆盖 Retry 令牌与缓存的地址验证令牌两类来自对端的输入，同时在大型 Initial 报文头之后为 CONNECTION_CLOSE 保留帧空间，避免关闭帧越过报文边界，上述修复包含在 quinn-proto 0.11.19 中。", "effects": [{"comp_name": "quinn-proto", "ecosystem": "cargo", "versions": [{"affected_version": "[0.11.0,0.11.19)", "min_fixed_version": "0.11.19", "repository": "cargo", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "可达断言", "kind_en": "Reachable Assertion", "last_modified_time": "2026-11-19", "level": "High", "mps_id": "MPS-7ea8-570f", "poc": false, "poc_url": [], "published_time": "2026-11-19", "reference_url_list": [{"url": "https://rustsec.org/advisories/RUSTSEC-2026-0524.html", "name": ""}, {"url": "https://github.com/quinn-rs/quinn/security/advisories/GHSA-wppq-2f6r-wfvm", "name": ""}, {"url": "https://github.com/quinn-rs/quinn/releases/tag/quinn-proto-0.11.19", "name": ""}, {"url": "https://crates.io/crates/quinn-proto", "name": ""}, {"url": "https://github.com/quinn-rs/quinn/commit/3bba467893ceff64d6cda0b3a2c51a1429e10372", "name": ""}, {"url": "https://github.com/quinn-rs/quinn/commit/a6e78d1c8bf28630f1e92fbcc38f60e0a134b01a", "name": ""}, {"url": "https://github.com/quinn-rs/quinn/commit/74c33ff75281d7751488e410e21e4f030782b655", "name": ""}, {"url": "https://github.com/quinn-rs/quinn/commit/d45b5136ed1d5b2b04ff6456443c0662acf1d0d3", "name": ""}], "scope_influence": "", "tags": [], "title": "quinn-proto拒绝服务漏洞", "_translated": true, "_saved_at": "2026-11-19T08:18:03+00:00", "_first_saved_at": "2026-11-19T08:18:03+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-7ea8-570f"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-76422", "cvss": {"cvssv31": [{"source": "psirt@cisco.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-134", "description": "ClamAV 是 Cisco Talos 维护的开源防病毒引擎，用于邮件网关、终端防护等场景的文件扫描与恶意软件检测。\n受影响版本中，Rust 模块的日志桥接层 libclamav_rust/src/logging.rs 在 ClamLogger::log 方法中将已渲染完成的日志消息指针直接用作 C 侧变参日志函数 cli_dbgmsg_no_inline、cli_errmsg、cli_infomsg_simple、cli_warnmsg 的格式化字符串。在启用调试日志功能时，攻击者提交的待扫描文件中的可控文本（如归档内条目名等解析结果）可进入日志消息，其中的百分号指示符被变参函数当作格式说明符解析并读取不存在的变参参数，导致扫描进程终止，也可能造成内存信息泄露或内存破坏。\n修复版本中通过为全部 Rust 到 C 的日志调用改用固定 %s 格式说明符，并将已渲染的消息作为数据参数传入，日志内容不再被解释为格式化字符串，切断格式指示符注入路径，消除扫描进程崩溃风险。", "effects": [{"comp_name": "clamav", "ecosystem": "linux", "versions": [{"affected_version": "[0.105.0,1.4.7)", "min_fixed_version": "1.4.7", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[1.5.0,1.5.5)", "min_fixed_version": "1.5.5", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "使用外部控制的格式字符串", "kind_en": "使用外部控制的格式字符串", "last_modified_time": "2026-11-19", "level": "High", "mps_id": "MPS-8j7u-9il6", "poc": false, "poc_url": [], "published_time": "2026-11-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-8j7u-9il6", "name": "https://www.oscs1024.com/hd/MPS-8j7u-9il6"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-76422", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-76422"}, {"url": "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-clamav-multi-e93M3vdA", "name": "cisco-sa-clamav-multi-e93M3vdA"}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "ClamAV 格式字符串漏洞", "_translated": true, "_saved_at": "2026-11-18T18:36:45+00:00", "_first_saved_at": "2026-11-18T18:36:45+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-8j7u-9il6"}, {"analysis_status": 0, "articles": [{"content": "跨界内存读是指应用程序在读取内存时，未正确验证或限制读取的内存范围。攻击者利用这种漏洞可以读取应用程序内存中的敏感数据，如密码、加密密钥、会话令牌等。常见的原因是由于缓冲区溢出、格式化字符串漏洞或其他内存错误导致的。", "title": "什么是越界读取"}, {"content": "攻击者可以通过不当构造的输入来触发跨界内存读漏洞。攻击者可能会通过向应用程序发送特定的输入，使其读取超过预期的内存区域。攻击者可以利用这个漏洞来获取敏感信息，如其他用户的数据、操作系统的敏感数据或应用程序的内部状态。", "title": "越界读取常见的攻击方式"}, {"content": "- 输入验证和限制：应用程序应对所有输入数据进行严格的验证和限制。确保输入数据的长度、格式和内容符合预期，避免超出缓冲区或访问非预期的内存区域。\n- 内存安全编程实践：开发人员应使用安全的编程实践，如避免使用不安全的函数、正确处理内存分配和释放操作，以及遵循最小特权原则。\n- 使用安全的编程语言和库：选择使用安全性较高的编程语言和库，这些语言和库在内存管理和安全性方面提供了更多的保护机制。\n- 定期进行代码审查和安全测试：定期审查应用程序的代码，并进行安全测试，以发现潜在的跨界内存读漏洞。使用静态代码分析工具和漏洞扫描工具来辅助检测和修复问题。\n- 实施防御性编程技术：应用程序应采用防御性编程技术，如使用随机化地址空间布局（ASLR）、堆栈保护机制（如堆栈溢出保护）和数据执行预防（DEP）等。\n- 及时更新和修补：及时应用程序和操作系统的安全更新和补丁，以确保已知的跨界内存读漏洞得到修复。及时更新相关软件和库，以避免使用已知存在漏洞的版本。", "title": "如何预防越界读取"}], "cnvd_id": "", "cve_id": "CVE-2026-76430", "cvss": {"cvssv31": [{"source": "psirt@cisco.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-125", "description": "ClamAV 是 Cisco Talos 团队维护的开源反病毒引擎（GPL-2.0），以 libclamav 库及 clamscan、clamd 等工具提供，广泛用于邮件网关、文件上传扫描与终端防护产品（含 Cisco Secure Endpoint），可解析扫描 UPX 加壳的 PE 可执行文件。\n受影响版本中，libclamav 的 cli_scanpe 在解包 UPX 文件时让全部解码尝试共享同一块按 dsize + 8192 字节分配的堆缓冲区，并以指针方式传递逻辑输出长度 dsize；NRV2B/NRV2D/NRV2E 解码成功后 pefromupx 会把 *dsize 更新为重建 PE 的 foffset，随后的 LZMA 解码器 upx_inflatelzma 仍复用该缓冲区并按放大后的长度写入，而 pefromupx 仅以可被放大的 *dsize + 8192 作为 memcpy(dst, newbuf, foffset) 的边界依据，未对照真实分配容量校验长度，攻击者提交构造的 UPX 文件即可使长度检查失效，造成堆内存越界读取并使扫描进程崩溃，形成拒绝服务。\n修复版本中通过引入不可变的分配容量 dst_capacity 切断该链条：解码前校验 *dsize 不超过容量，优先匹配显式 LZMA stub 并在首个解码成功后停止复用目的缓冲区，要求 LZMA 输出完整结束并清理失败输出，把重建 PE 的段拷贝同时限制在解码输入与物理目的缓冲区边界内，并以无符号运算解码 NRV 回引偏移，消除越界访问导致的扫描进程崩溃。", "effects": [{"comp_name": "clamav", "ecosystem": "linux", "versions": [{"affected_version": "[0.94.1,1.4.7)", "min_fixed_version": "1.4.7", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[1.5.0,1.5.5)", "min_fixed_version": "1.5.5", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界读取", "kind_en": "越界读取", "last_modified_time": "2026-11-19", "level": "High", "mps_id": "MPS-hn8k-73r1", "poc": false, "poc_url": [], "published_time": "2026-11-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-hn8k-73r1", "name": "https://www.oscs1024.com/hd/MPS-hn8k-73r1"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-76430", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-76430"}, {"url": "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-clamav-multi-e93M3vdA", "name": "cisco-sa-clamav-multi-e93M3vdA"}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "ClamAV UPX堆越界读漏洞", "_translated": true, "_saved_at": "2026-11-18T18:36:47+00:00", "_first_saved_at": "2026-11-18T18:36:47+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-hn8k-73r1"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能有效地控制资源的使用，导致攻击者可以利用这个漏洞耗尽应用程序所依赖的资源。这些资源可以是计算资源（CPU、内存）、网络带宽、数据库连接或其他系统资源。攻击者可以通过发送特制的请求、恶意输入或其他方式，使应用程序消耗大量资源，导致拒绝服务或系统崩溃。", "title": "什么是拒绝服务"}, {"content": "- 消耗计算资源：攻击者可以发送计算密集型的请求，例如复杂的计算、无限循环或递归操作，以耗尽应用程序的计算资源，导致应用程序无法响应其他请求。\r\n- 消耗内存资源：攻击者可以发送大量的数据或恶意输入，以导致应用程序消耗过多的内存资源，从而使系统的可用内存耗尽，并导致应用程序崩溃或变得不可用。\r\n- 消耗网络带宽：攻击者可以发送大量的请求或大型数据包，以消耗应用程序所依赖的网络带宽。这会导致其他合法用户无法正常访问应用程序或降低系统的整体网络性能。\r\n- 消耗存储资源：攻击者可以发送大量的请求或上传大文件，以耗尽应用程序的存储资源，导致系统无法处理其他请求或存储新的数据。", "title": "拒绝服务常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对输入数据进行合理的验证和过滤，防止恶意输入导致资源消耗过高。\r\n- 实施资源限制：应用程序应该实施适当的资源限制策略，例如限制计算操作的时间或次数，限制内存使用量，限制并发连接数等，以防止资源被耗尽。\r\n- 异常处理与错误恢复：应用程序应该具备健壮的异常处理和错误恢复机制，以防止因意外错误导致资源泄漏或无法释放的情况。\r\n- 资源监控与警报：应用程序应该实施适当的资源监控和警报机制，及时发现异常的资源消耗情况，并采取相应的措施来应对。\r\n- 压力测试与性能优化：应用程序应该进行压力测试，以评估其在高负载情况下的性能，并进行必要的性能优化，以确保能够有效地处理大量请求而不耗尽资源。", "title": "如何预防拒绝服务"}], "cnvd_id": "", "cve_id": "CVE-2026-76515", "cvss": {"cvssv31": [{"source": "psirt@cisco.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-400", "description": "ClamAV 是 Cisco Talos 维护的开源反恶意软件扫描引擎，以 GPL-2.0 协议发布，提供 clamscan 命令行扫描器、clamd 扫描守护进程与 libclamav 扫描库，广泛用于邮件网关、文件上传检测和终端安全产品，其中 OLE2 解析器负责处理 Microsoft Compound File Binary（CFB）复合文档。\n受影响版本中，libclamav/ole2_extract.c 的 ole2_walk_property_tree() 在处理每个目录属性节点时都将 current_block 重置为 hdr-\u003eprop_start，并通过 ole2_get_next_block_number() 从头重走目录扇区 FAT 链定位属性所在扇区，重复遍历成本随属性节点数与目录链长叠加；该循环内唯一的超时检查 cli_json_timeout_cycle_check() 只在启用 JSON 元数据收集时才间接检查扫描时限，BAT/XBAT 扇区回读与 XBAT 链回溯均无截止时间检查，攻击者向扫描服务提交构造的 CFB 文件，可使 OLE2 解析超出 MaxScanTime 限制并陷入无限循环，耗尽扫描进程 CPU 造成拒绝服务。\n修复版本中通过新增 ole2_build_property_block_list() 一次性遍历并缓存可达的目录扇区链，配合 visited 位集检测环路、按文件长度限制扇区数上限，ole2_walk_property_tree() 改为按每扇区目录项数 entries_per_sector 直接从缓存定位属性，节点处理与 BAT/XBAT 链回溯统一接入 cli_checktimelimit() 实时时限检查，切断了反复重走 FAT 链的放大路径，保证 MaxScanTime 超时被及时强制执行。", "effects": [{"comp_name": "cisco:secure_endpoint_connector", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,8.6.4)", "min_fixed_version": "8.6.4", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,1.27.5)", "min_fixed_version": "1.27.5", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,1.29.3)", "min_fixed_version": "1.29.3", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "clamav", "ecosystem": "linux", "versions": [{"affected_version": "[0.98.1,1.4.7)", "min_fixed_version": "1.4.7", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[1.5.0,1.5.5)", "min_fixed_version": "1.5.5", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "拒绝服务", "kind_en": "不受控制的资源消耗", "last_modified_time": "2026-11-19", "level": "High", "mps_id": "MPS-no6g-v5rd", "poc": false, "poc_url": [], "published_time": "2026-11-19", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-no6g-v5rd", "name": "https://www.oscs1024.com/hd/MPS-no6g-v5rd"}
