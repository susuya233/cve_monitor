      min-height: 70vh;

      min-height: 520px;

      padding: 12px;
      background: transparent;
      color: inherit;

lowed_executables 校验可执行文件名，未限制后续参数，再把未检查的参数传入 StdioServerParameters 并拉起子进程。攻击者可使用 npx -y -c 在允许名单校验通过后执行任意系统命令；allowed_executables 为 None 时还会放行任意可执行文件。\n修复版本中通过从客户端请求移除 fullCommand，改为由开发者在 .chainlit/config.toml 的 [[features.mcp.servers]] 中声明 stdio 命令，客户端只能按名称连接，使命令字符串不再跨越客户端到服务端的信任边界。", "effects": [{"comp_name": "chainlit", "ecosystem": "pip", "versions": [{"affected_version": "[2.4.0rc0,2.12.0)", "min_fixed_version": "2.12.0", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-08-26", "level": "Critical", "mps_id": "MPS-6y71-izfk", "poc": false, "poc_url": [], "published_time": "2026-08-26", "reference_url_list": [{"url": "https://github.com/Chainlit/chainlit/security/advisories/GHSA-w3fx-mc44-mf6j", "name": ""}, {"url": "https://github.com/Chainlit/chainlit/commit/0565fd0eccb915fce159929598b053ed79f6e0c9", "name": ""}, {"url": "https://github.com/Chainlit/chainlit/releases/tag/2.12.0", "name": ""}, {"url": "https://github.com/advisories/GHSA-w3fx-mc44-mf6j", "name": ""}], "scope_influence": "", "tags": ["AI", "python", "开源"], "title": "Chainlit命令注入漏洞", "_translated": true, "_saved_at": "2026-08-25T21:21:05+00:00", "_first_saved_at": "2026-08-25T21:21:05+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-6y71-izfk"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-54523", "cvss": {"cvssv31": [{"source": "github_advisory", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:N", "severity": "critical", "base_score": 9.6}]}, "cvss_score": 9.6, "cvss_vector": "", "cwe": "CWE-862", "description": "## Summary\n\nIn Kyverno v1.18.1, a tenant who can create a `NamespacedMutatingPolicy` in their own namespace can instruct the admission controller to generate resources in any namespace by passing an arbitrary namespace string to the CEL `generator.apply(namespace, resources)` function.\n\n## Details\n\n`pkg/cel/libs/context.go:177` declares `GenerateResources(namespace string, dataList []map[string]any)`. The `namespace` argument arrives unvalidated from the CEL expression `generator.apply(\"\u003ctarget-namespace\u003e\", [...])`.\n\n### Version-Specific Impact\n\n**v1.18.0, v1.18.1 (affected via NamespacedMutatingPolicy only):**\n\nThe nmpol CEL compiler unintentionally exposes the `generator` library to match condition expressions. A namespaced mutating policy can invoke `generator.apply()` in a boolean CEL expression such as `matchConditions`, triggering the admission controller to generate resources in any namespace at request time. This side effect executes with the admission controller's cluster-wide privileges.\n\nNamespacedGeneratingPolicy is **not** a vector in v1.18.1 due to incomplete webhook and background processing wiring (not registered or functional).\n\n### Root Cause\n\nThe admission validator for `NamespacedMutatingPolicy` (`pkg/cel/policies/mpol/validate.go`) only checks that the policy compiles and does not enforce namespace scope on `generator.apply()` arguments.\n\nCompare correctly-guarded equivalents: `pkg/engine/context/loaders/configmap.go:102` rejects cross-namespace ConfigMap references for namespaced policies, and `pkg/engine/apicall/apicall.go:73-82` enforces namespace segment matching. `GenerateResources` has neither guard.\n\n## Proof of Concept\n\nPrerequisites: namespace `tenant-ns` exists; attacker has `create` on `namespacedmutatingpolicies.policies.kyverno.io` in `tenant-ns`.\n\n```yaml\napiVersion: policies.kyverno.io/v1beta1\nkind: NamespacedMutatingPolicy\nmetadata:\n  name: cross-ns-escalate\n  namespace: tenant-ns\nspec:\n  matchConstraints:\n    resourceRules:\n    - apiGroups: [\"\"]\n      apiVersions: [\"v1\"]\n      resources: [\"configmaps\"]\n      operations: [\"CREATE\"]\n  mutations:\n  - patchType: applyConfiguration\n    applyConfiguration:\n      expression: object\n  matchConditions:\n  - name: trigger-escalation\n    expression: |\n      generator.apply(\"kube-system\", [\n        {\n          \"apiVersion\": dyn(\"v1\"),\n          \"kind\": dyn(\"ConfigMap\"),\n          \"metadata\": dyn({\n            \"name\": \"kube-system-config\",\n            \"namespace\": \"kube-system\"\n          }),\n          \"data\": dyn({\n            \"injected-by\": \"tenant-policy\",\n            \"impact\": \"unauthorized access to kube-system namespace\"\n          })\n        }\n      ])\n```\n\nApply the policy, then create any ConfigMap in `tenant-ns` to trigger the admission webhook. The admission controller creates `configmap/kube-system-config` in `kube-system`. By default, the admission controller has `create` on ConfigMaps in all namespaces.\n\n## Impact\n\nA namespace-scoped user with `create` on `NamespacedMutatingPolicy` in \u003e=v1.18.1 can create ConfigMaps, NetworkPolicies, Secrets, and other resources in any namespace using the admission controller's cluster-wide RBAC. This allows:\n\nInjecting sensitive configuration into protected namespaces (e.g., `kube-system`, `default`)\nDisrupting cluster networking via NetworkPolicies\nPrivilege escalation via RoleBinding creation (for roles the admission controller holds or lesser-privileged roles)\nPrivilege escalation via RoleBinding creation in other namespaces\nAny installation that grants non-admin users access to `NamespacedMutatingPolicy` creation is affected.\n\n## Timeline\n\n* 2026-05-20: Vulnerability reproduced on main\n* 2026-07-13: CVE-2026-54523 / GHSA-79gf-7frw-68m9 published\n* 2026-07-22: Advisory clarified to document actual v1.18.1 attack vector (NamespacedMutatingPolicy in matchConditions, not NamespacedGeneratingPolicy)\n\n## Advisory Update\n\nThis advisory was updated to clarify the v1.18.1 attack surface. The nmpol vector in matchConditions was the reachable attack path in v1.18.1, while ngpol lacked end-to-end plumbing. The CVE, patched version, and CVSS score remain unchanged. Original report by @0xVijay.", "effects": [{"comp_name": "github.com/kyverno/kyverno", "ecosystem": "go", "versions": [{"affected_version": "[v1.18.0,v1.18.2)", "min_fixed_version": "v1.18.2", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-08-26", "level": "Critical", "mps_id": "MPS-k8as-t0x5", "poc": false, "poc_url": [], "published_time": "2026-08-26", "reference_url_list": [{"url": "https://github.com/kyverno/kyverno/security/advisories/GHSA-79gf-7frw-68m9", "name": ""}, {"url": "https://github.com/kyverno/kyverno/pull/16238", "name": ""}, {"url": "https://github.com/kyverno/kyverno/commit/0919553c0ea1904f8d891280c92018da97946a06", "name": ""}, {"url": "https://github.com/kyverno/kyverno/commit/5164bcdeda5b57678bc2d7a03ecc2cbb02982dae", "name": ""}, {"url": "https://github.com/kyverno/sdk/commit/6573937441443e1ba5af9fbb28d5c0f20297f9df", "name": ""}, {"url": "https://github.com/kyverno/kyverno/releases/tag/v1.18.2", "name": ""}, {"url": "https://github.com/advisories/GHSA-79gf-7frw-68m9", "name": ""}], "scope_influence": "", "tags": [], "title": "Kyverno's NamespacedGeneratingPolicy generator.apply() namespace argument unvalidated -- background controller creates RoleBindings in any namespace including kube-system", "_translated": true, "_saved_at": "2026-08-28T08:32:18+00:00", "_first_saved_at": "2026-08-26T14:38:06+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-k8as-t0x5"}, {"analysis_status": 3, "articles": [], "cnvd_id": "", "cve_id": "", "cvss": {"cvssv4": [{"source": "murphysec", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H", "severity": "critical", "base_score": 9.5}]}, "cvss_score": 9.5, "cvss_vector": "", "cwe": "CWE-122", "description": "Next.js 是开源的 React 全栈 Web 框架（npm 包名 next）。自带的图片优化功能会在服务端压缩、缩放图片；处理 AVIF 时，会经 sharp 调用底层 libheif 做解码。\n受影响版本中，对外入口 NextNodeServer.handleNextImageRequest 接收 /_next/image 请求后，由 imageOptimizer()/optimizeImage() 做优化；getSharp() 默认放开 VipsForeignLoadHeif，AVIF 会进入 libheif。上游在处理嵌套 iden/auxl 透明通道的异常 AVIF 时，HeifPixelImage::scale_nearest_neighbor() 按错误位深把高位深样本写入低位深透明平面，造成堆溢出，可导致远程代码执行。\n修复版本中通过把 AVIF 加入 BYPASS_TYPES，并默认不再放开 VipsForeignLoadHeif，使 imageOptimizer() 对 AVIF 直接返回原图、跳过 optimizeImage()，异常样本进不了有问题的 libheif 路径。", "effects": [{"comp_name": "next", "ecosystem": "npm", "versions": [{"affected_version": "[10.0.0,15.5.24)", "min_fixed_version": "15.5.24", "repository": "npm", "solutions": [], "upstream": true}, {"affected_version": "[16.0.0,16.3.3)", "min_fixed_version": "16.3.3", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "低", "fix_suggestion": "建议修复", "kind": "堆缓冲区溢出", "kind_en": "基于堆的缓冲区溢出", "last_modified_time": "2026-08-26", "level": "Critical", "mps_id": "MPS-p4n6-0re2", "poc": true, "poc_u n受影响版本中，CGI Handler 的 setSystemConfig 在处理 Hostname 参数时，经 websGetVar 取出用户提交的 hostname 后使用 strcpy 写入固定长度栈缓冲区，且未校验长度。远程攻击者可向 /cgi-bin/cstecgi.cgi 提交超长 hostname，覆盖返回地址并触发栈溢出，造成设备崩溃或任意代码执行。\n修复版本中通过限制 Hostname 写入栈缓冲区的长度、改用带边界检查的字符串拷贝切断溢出链；公开渠道尚未给出已验证修复版本。", "effects": [{"comp_name": "n600r_firmware", "ecosystem": "linux", "versions": [{"affected_version": "[4.3.0cu.7647_B20210106,4.3.0cu.7647_B20210106]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "栈缓冲区溢出", "kind_en": "基于堆栈的缓冲区溢出", "last_modified_time": "2026-08-26", "level": "Critical", "mps_id": "MPS-6xqw-mbal", "poc": false, "poc_url": [], "published_time": "2026-08-26", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-6xqw-mbal", "name": "https://www.oscs1024.com/hd/MPS-6xqw-mbal"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-79911", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-79911"}, {"url": "https://github.com/dxz0069/WAVLINK-WN530H4-Command-Injection-in-set_add_routing/blob/main/TOTOLINK_N600R_cstecgi_strcpy_sprintf_Multi_Function_Stack_Overflow.md", "name": ""}, {"url": "https://vuldb.com/cve/CVE-2026-79911", "name": ""}, {"url": "https://vuldb.com/submit/881258", "name": ""}, {"url": "https://vuldb.com/vuln/395061", "name": ""}, {"url": "https://vuldb.com/vuln/395061/cti", "name": ""}, {"url": "https://www.totolink.net/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "N600R栈溢出漏洞", "_translated": true, "_saved_at": "2026-08-26T12:39:25+00:00", "_first_saved_at": "2026-08-26T00:56:14+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-6xqw-mbal"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-79774", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:R/S:C/C:H/I:H/A:H", "severity": "high", "base_score st": [{"url": "https://www.oscs1024.com/hd/MPS-fn57-etpz", "name": "https://www.oscs1024.com/hd/MPS-fn57-etpz"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-79782", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-79782"}, {"url": "https://github.com/rclone/rclone/security/advisories/GHSA-gx4c-2hqx-cw2r", "name": ""}, {"url": "https://www.vulncheck.com/advisories/rclone-before-security-token-disclosure-via-https-to-http-redirect", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-79782漏洞", "_translated": true, "_saved_at": "2026-08-25T17:25:43+00:00", "_first_saved_at": "2026-08-25T17:25:43+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-fn57-etpz"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2026-79787", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-287", "description": "Alluxio 是开源数据编排平台与分布式虚拟文件系统，提供 S3 兼容 REST 代理，供对象存储客户端访问集群中的文件数据。\n受影响版本中，S3 REST 代理默认将 alluxio.s3.rest.authentication.enabled 设为 false，S3RestUtils.getUser 因此调用 getUserFromAuthorization，仅从 Authorization 头的 Credential 字段解析用户名，不对 AWS Signature Version 4 做密码学校验。未认证攻击者向默认端口 39999 的 /api/v1/s3/ 提交伪造 Credential 后，S3RequestServlet.service 与 S3Handler.doAuthentication（JAX-RS 路径则为 S3AuthenticationFilter.filter）会接受该身份，createFileSystemForUser 以被冒充用户（含 alluxio 服务账号）创建文件系统客户端，从而读取、写入和删除其数据。默认 alluxio.security.authentication.type 为 SIMPLE，Master 信任客户端自称身份。\n修复版本中通过在身份解析路径强制校验 AWS Signature Version 4 并拒绝未验证的 Credential 声明来切断冒充链路；公开仓库截至分析时尚未合入该修复，v2.9.5、v2.9.6 与 main 的 S3RestUtils.getUser 实现一致。", "effects": [{"comp_name": "alluxio", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.9.6]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "org.alluxio:alluxio-core-server-proxy", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,2.9.6]", "min_fixed_version": "", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "身份验证不当", "kind_en": "认证不当", "last_modified_time": "2026-08-26", "level": "Critical", "mps_id": "MPS-i9lm-gh0u", "poc": false, "poc_url": [], "published_time": "2026-08-26", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-i9lm-gh0u", "name": "https://www.oscs1024.com/hd/MPS-i9lm-gh0u"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-79787", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-79787"}, {"url": "https://github.com/Alluxio/alluxio", "name": ""}, {"url": "https://github.com/Alluxio/alluxio/blob/v2.9.5/core/server/proxy/src/main/java/alluxio/proxy/s3/S3RestUtils.java", "name": ""}, {"url": "https://github.com/Alluxio/alluxio/issues/18755", "name": ""}, {"url": "https://www.vulncheck.com/advisories/alluxio-through-2.9.5-s3-rest-proxy-authentication-bypass-via-unverified-request-signature", "name": ""}, {"url": "https://github.com/Alluxio/alluxio/issues/18755", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "Alluxio S3认证绕过", "_translated": true, "_saved_at": "2026-08-25T20:21:31+00:00", "_first_saved_at": "2026-08-25T20:21:31+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-i9lm-gh0u"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-80138", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MV , "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-uc5f-96gp", "name": "https://www.oscs1024.com/hd/MPS-uc5f-96gp"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-78379", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-78379"}, {"url": "https://aws.amazon.com/security/security-bulletins/2026-089-aws/", "name": ""}, {"url": "https://pypi.org/project/strands-agents-tools/0.8.5/", "name": ""}], "scope_influence": "", "tags": ["AI", "python", "开源"], "title": "Strands Tools同意绕过", "_translated": true, "_saved_at": "2026-08-25T20:21:28+00:00", "_first_saved_at": "2026-08-25T20:21:28+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-uc5f-96gp"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-63041", "cvss": {}, "cvss_score": 9.1, "cvss_vector": "", "cwe": "CWE-807", "description": "Apache APISIX 是开源云原生 API 网关，用于对上游服务进行路由、认证鉴权，并可通过插件把已认证消费者的标签附加到请求头。\n受影响版本中，attach-consumer-label 插件的 before_proxy 在 ctx.consumer 不存在或 consumer.labels 为空时直接返回，不会清除客户端提交的、与插件配置同名的请求头。攻击者向已启用该插件的路由发送伪造的 X-Consumer-Role 等标签头后，这些不可信取值会被原样转发到上游，使上游基于伪造身份做出安全决策，造成权限提升或授权绕过。\n修复版本中通过在无标签时对配置头调用 core.request.set_header(ctx, header, nil) 清除客户端取值，并在存在标签时用消费者标签覆盖同名请求头，切断伪造标签进入上游授权逻辑的路径。", "effects": [{"comp_name": "apisix", "ecosystem": "linux", "versions": [{"affected_version": "[3.11.0,3.18.0)", "min_fixed_version": "3.18.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "在安全决策中依赖未经信任的输入", "kind_en": "安全决策中对不可信输入的依赖", "last_modified_time": "2026-08-26", "level": "Critical", "mps_id": "MPS-2035-d23c", "poc": false, "poc_url": [], "published_time": "2026-08-26", "reference_url_list": [{"url": "http://www.mail-archive.com/announce@apache.org/msg11784.html", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-63041", "name": ""}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-63041", "name": ""}, {"url": "https://apisix.apache.org", "name": ""}, {"url": "https://apisix.apache.org/docs/apisix/plugins/attach-consumer-label/", "name": ""}, {"url": "https://github.com/apache/apisix/commit/d3f198486af31518e1bf039fc604d90008f732f5", "name": ""}, {"url": "https://github.com/apache/apisix/pull/13590", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "APISIX消费者标签头欺骗", "_translated": true, "_saved_at": "2026-08-26T14:38:07+00:00", "_first_saved_at": "2026-08-26T05:28:39+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-2035-d23c"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-59682", "cvss": {}, "cvss_score": 9.1, "cvss_vector": "", "cwe": "CWE-22", "description": "OpenRGB 是开源跨平台 RGB 灯效控制套件，提供图形界面、客户端以及默认监听 0.0.0.0:6742 且无认证的 SDK 网络服务。\n受影响版本中，NetworkServer::ListenThreadFunction 处理 NET_PACKET_ID_REQUEST_SAVE_PROFILE 时使用 profile_name.assign(data, header.pkt_size) 保留嵌入空字节，ProfileManager::SaveProfile 未校验路径中的斜杠、上级目录与空字节，只追加 .orp 或 .ors 扩展名并以 trunc 方式写入，未认证客户端可覆盖任意文件。\n修复版本中通过 StringUtils::make_filename 剔除斜杠、特殊字符和控制字符，将 SAVE_PROFILE 路径限制在配置目录内，阻断任意文件覆盖。", "effects": [{"comp_name": "openrgb", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.0rc3.1)", "min_fixed_version": "1.0rc3.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-08-26", "level": "Critical", "mps_id": "MPS-666c-0bfd", "poc": false, "poc_url": [], "published_time": "2026-08-26", "reference_url_list": [{"url": "https://www.openwall.com/lists/oss-security/2026/08/25/4", "name": ""}, {"url": "https://security.opensuse.org/2026/08/25/openrgb-remote-vulnerabilities.html", "name": ""}, {"url": "https://github.com/CalcProgrammer1/OpenRGB/commit/d2dd9dcc7369e78f47d01ace19af3750cd89ae66", "name": ""}, {"url": "https://gitlab.com/CalcProgrammer1/OpenRGB/-/commit/d2dd9dcc7369e78f47d01ace19af3750cd89ae66", "name": ""}, {"url": "https://gitlab.com/CalcProgrammer1/OpenRGB/-/releases/release_candidate_1.0rc3.1", "name": ""}, {"url": "https://bugzilla.suse.com/show_bug.cgi?id=1269523", "name": ""}, {"url": "https://github.com/CalcProgrammer1/OpenRGB/commit/d7ed55b264dee40f68e7a17c11eaa8f1b56d8dc6", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "OpenRGB任意文件覆盖漏洞", "_translated": true, "_saved_at": "2026-08-25T17:25:41+00:00", "_first_saved_at": "2026-08-25T17:25:41+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-666c-0bfd"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2026-68569", "cvss": {}, "cvss_score": 9.1, "cvss_vector": "", "cwe": "CWE-287", "description": "Apache Tomcat 是 Apache 软件基金会的开源 Java Servlet 容器与 Web 服务器，通过 Realm 将外部身份映射为容器内 Principal 与角色；DataSourceRealm 从 JDBC 数据源读取用户，Tomcat 9 仍保留功能相近的 JDBCRealm。\n受影响版本中，DataSourceRealm.getPrincipal() 在数据库连接失败时仍返回仅含用户名的 GenericPrincipal；连接成功时也不校验用户是否存在于用户表，而是直接按 CLIENT-CERT 或 SPNEGO 给出的用户名创建 Principal。攻击者只要出示服务端信任的客户端证书或有效 SPNEGO 票据，即使该用户未在数据库登记，也会被标记为已认证。角色查询异常时仍可能返回部分填充的 Principal。Tomcat 9 的 JDBCRealm.getPrincipal() 同样在未确认用户存在时创建 Principal。\n修复版本中通过新增 validateUser() 并改写 getPrincipal()，在无法连接数据库、用户不存在或角色查询失败时返回 null 使认证失败；密码认证路径在角色查询失败时同样拒绝登录，切断失败开放链路。", "effects": [{"comp_name": "tomcat", "ecosystem": "linux", "versions": [{"affected_version": "[11.0.0-M1,11.0.25)", "min_fixed_version": "11.0.25", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[7.0.0,7.0.109]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[8.5.0,8.5.100]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[10.1.0-M1,10.1.58)", "min_fixed_version": "10.1.58", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[9.0.0.M1,9.0.121)", "min_fixed_version": "9.0.121", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "身份验证不当", "kind_en": "认证不当", "last_modified_time": "2026-08-26", "level": "C 5604", "cvss": {"cvssv31": [{"source": "murphysec", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9}]}, "cvss_score": 9, "cvss_vector": "", "cwe": "CWE-22", "description": "Next.js 是 Vercel 维护的开源 React 全栈 Web 框架，npm 包名为 next，用于同时提供 Pages Router 与 App Router 的服务端渲染和增量静态再生。\n受影响版本中，Windows 文件系统上的 ISR 增量缓存把请求路径段直接拼进缓存文件路径。decodePathParams 先 decodeURIComponent 再调用 escapePathDelimiters(..., true)，而 escapePathDelimiters 只转义 /、#、? 以及仍保持百分号形式的 %5c，不会转义已经解码出来的反斜杠；FileSystemCache.getFilePath 随后对缓存键做 path.join，且不检查结果是否仍落在 pages 或 app 缓存根目录内。在同时存在 Pages Router 与 App Router、且未启用 Cache Components 的应用中，攻击者可通过含编码反斜杠的 catch-all 段访问 /_next/data/{buildId}/...json，使 get() 越界读取构建产物中的 server-reference-manifest.json（含 Server Actions encryptionKey）。官方将该问题认定为未授权远程代码执行；Linux 与 macOS 不受影响。\n修复版本中通过把反斜杠写入 escapePathDelimiters 的分隔符字符集，并在 getFilePath 中要求 path.join 结果必须以缓存根目录加 path.sep 为前缀，越界路径抛出 Invalid file path，切断该穿越读取。", "effects": [{"comp_name": "next", "ecosystem": "npm", "versions": [{"affected_version": "[13.4,15.5.24)", "min_fixed_version": "15.5.24", "repository": "npm", "solutions": [], "upstream": true}, {"affected_version": "[16.0,16.3.3)", "min_fixed_version": "16.3.3", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "低", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-08-26", "level": "Critical", "mps_id": "MPS-i3xe-wpbr", "poc": true, "poc_url": [], "published_time": "2026-08-26", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-i3xe-wpbr", "name": "https://www.oscs1024.com/hd/MPS-i3xe-wpbr"}, {"url": "https://vercel.com/changelog/nextjs-august-2026-security-release", "name": ""}, {"url": "https://github.com/vercel/next.js/security/advisories/GHSA-p293-qw3h-jr36", "name": ""}, {"url": "https://nextjs.org/blog/august-2026-security-release", "name": ""}, {"url": "https://github.com/vercel/next.js/releases/tag/v15.5.24", "name": ""}, {"url": "https://github.com/vercel/next.js/releases/tag/v16.3.3", "name": ""}, {"url": "https://github.com/vercel/next.js/pull/97876", "name": ""}, {"url": "https://github.com/vercel/next.js/commit/09f9c8a758a6b20f248b0e90e539bba8225c73bb", "name": ""}, {"url": "https://github.com/vercel/next.js/commit/968b9fcb26bdeb8e0a861a9df05361474666d51b", "name": ""}, {"url": "https://github.com/vercel/next.js/commit/b0f3460a92b955d3ca41fccff9a525a2b910fbf3", "name": ""}], "scope_influence": "广", "tags": ["npm", "poc", "专家校准", "开源", "终端软件"], "title": "Next.js Windows ISR路径穿越远程代码执行漏洞", "_translated": true, "_saved_at": "2026-08-26T13:49:40+00:00", "_first_saved_at": "2026-08-26T03:48:41+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-i3xe-wpbr"}, {"analysis_status": 0, "articles": [{"content": "- 程序未正确处理用户上传的文件，从而导致程序可以读取、处理或存储未经授权的文件\n", "title": "什么是任意文件上传"}, {"content": "- 欺骗攻击：攻击者可以通过发送伪造的文件来欺骗程序，从而导致程序读取、处理或存储未经授权的文件。\n- 文件格式攻击：攻击者可以通过选择特定的文件格式，例如压缩文件或 ZIP 文件，从而利用上传的文件来篡改程序的执行结果或窃取程序中的重要数据。\n", "title": "任意文件上传常见的攻击方式"}, {"content": "- 使用安全文件传输协议 (FTP):使用安全 FTP 协议可以确保上传的文件格式、大小、权限等符合预期，同时可以防止文件读取、篡改或存储漏洞。\n- 使用文件上传过滤器：使用文件上传过滤器可以过滤上传的文件，以确保文件的格式、大小、权限等符合预期，同时可以防止文件读取、篡改或存储漏洞。\n- 使用白名单机制：使用白名单机制可以只允许特定的文件格式、大小、权限等存在的文件上传，从而防止非法文件的上传和攻击。\n- 定期更新和升级程序：定期更新和升级程序可以修复已知的漏洞，并增强程序的安全性。", "title": "如何预防任意文件上传"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-75327", "cvss": {}, "cvss_score": 9.8, "cvss_vector": "", "cwe": "CWE-434", "description": "DocSys（又称 MxsDoc）是采用 GPL-2.0 协议的开源 Web 文档管理系统，提供在线文档存储、预览、编辑、权限控制与版本管理能力。\n受影响版本中，DocController 的 uploadMarkdownPic 接口未校验登录态，将 HTTP 参数 imgName 直接赋给 fileName，再连同 multipart 字段 editormd-image-file 交给 FileUtil.saveFile。FileUtil.saveFile 以 new File(path, fileName) 写入仓库备注资源目录，未规范化路径，攻击者可远程把任意内容写到服务器任意可写路径，包括 Web 目录以获取站点权限。\n修复版本中通过公开资料尚无法确认已发布修复，官方未给出修复版本或已验证修复提交；在官方修复发布前，可通过限制该接口对外暴露并拦截 imgName 中的路径穿越降低风险。", "effects": [{"c r::onEOM 将请求 JSON 中的每个键值交给 gflags::SetCommandLineOption，v3.8.0 不拒绝任何标志名，网络可达的调用方能在不重启守护进程的情况下关闭传输安全、改写日志路径或调整 failed_login_attempts、password_lock_time_in_secs 等行为。\n修复版本中通过为该 HTTP 管理接口增加认证并限制监听地址，切断未认证读取与改写运行时 gflags 的路径。截至本报告分析时官方尚未发布修复版本，GitHub issue #6157 仍为开放状态；master 上 PR #5936 仅拒绝修改 enable_authorize，不能阻止未认证读取全部标志以及改写其余运行时配置。", "effects": [{"comp_name": "nebula", "ecosystem": "linux", "versions": [{"affected_version": "[0,3.8.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "关键功能的认证机制缺失", "kind_en": "缺少关键功能的身份验证", "last_modified_time": "2026-08-27", "level": "Critical", "mps_id": "MPS-sh8c-54mb", "poc": false, "poc_url": [], "published_time": "2026-08-27", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-sh8c-54mb", "name": "https://www.oscs1024.com/hd/MPS-sh8c-54mb"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-81032", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-81032"}, {"url": "https://github.com/vesoft-inc/nebula", "name": ""}, {"url": "https://github.com/vesoft-inc/nebula/blob/v3.8.0/src/webservice/SetFlagsHandler.cpp", "name": ""}, {"url": "https://github.com/vesoft-inc/nebula/blob/v3.8.0/src/webservice/WebService.cpp", "name": ""}, {"url": "https://github.com/vesoft-inc/nebula/issues/6157", "name": ""}, {"url": "https://www.vulncheck.com/advisories/nebulagraph-through-3.8.0-unauthenticated-read-and-modification-of-runtime-configuration", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "NebulaGraph未认证配置漏洞", "_translated": true, "_saved_at": "2026-08-26T18:53:59+00:00", "_first_saved_at": "2026-08-26T18:53:59+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-sh8c-54mb"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-82082", "cvss": {"cvssv31": [{"source": "twcert@cert.org.tw", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}], "cvssv4": [{"source": "twcert@cert.org.tw", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-78", "description": "NUMail 是绿色运算（Green-Computing）开发的商业电子邮件系统，用于提供企业邮件收发、Webmail、行事历与通讯录等服务，当前没有公开可核验的源码仓库。\n受影响版本中，NUMail 存在操作系统命令注入漏洞，未经身份鉴别的远程攻击者可将任意操作系统命令注入并在服务器上执行，造成服务器被完全控制。\n修复版本中通过厂商发布的安全补丁阻断未授权命令注入执行路径，官方要求将 Patch 更新至 202602162 及以后版本。", "effects": [{"comp_name": "NUMail", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,202602162)", "min_fixed_version": "202602162", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-08-28", "level": "Critical", "mps_id": "MPS-zqjw-0bxo", "poc": false, "poc_url": [], "published_time": "2026-08-28", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-zqjw-0bxo", "name": "https://www.oscs1024.com/hd/MPS-zqjw-0bxo"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-82082", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-82082"}, {"url": "https://www.twcert.org.tw/en/cp-139-11145-5361d-2.html", "name": ""}, {"url": "https://www.twcert.org.tw/tw/cp-132-11144-45c6a-1.html", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "NUMail命令注入漏洞", "_translated": true, "_saved_at": "2026-08-28T08:32:12+00:00", "_first_saved_at": "2026-08-28T08:32:12+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-zqjw-0bxo"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-82090", "cvss": {"cvssv4": [{"source": "cve@mitre.org", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.2}]}, "cvss_score": 9.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-79", "description": "Pocket 是 Mozilla 与 Read It Later 提供的稍后阅读客户端，Android 包名为 com.ideashower.readitlater.pro，用于保存网页并在应用内阅读；该应用已停止服务，不是 GitHub 开源项目。\n受影响版本中，Save to Pocket 会把外部文章 HTML 注入 WebView DOM。assets/html/j/articleview-mobile.js 的 loadCallback 将远端 content 直接交给 $(document.body).html(content) 且未做净化，页面中的脚本可在应用内执行，并调用 PocketAndroidArticleInterface 等原生桥接方法改写应用状态；后台 DownloadingService 还会自动拉取并渲染已保存文章。\n修复版本中通过卸载受影响应用切断外部 HTML 进入 WebView 的执行路径。官方未发布代码补丁，最终发行版 8.33.0.0 仍包含原 html() 调用，产品已被标记为 unsupported-when-assigned。", "effects": [{"comp_name": "Pocket", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,8.33.0.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-08-28", "level": "Critical", "mps_id": "MPS-643w-fnc1", "poc": false, "poc_url": [], "published_time": "2026-08-28", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-643w-fnc1", "name": "https://www.oscs1024.com/hd/MPS-643w-fnc1"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-82090", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-82090"}, {"url": "https://github.com/FUNFACTOR1/pocket-android-xss-0click-cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Pocket跨站脚本漏洞", "_translated": true, "_saved_at": "2026-08-28T08:32:11+00:00", "_first_saved_at": "2026-08-28T08:32:11+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-643w-fnc1"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "cnvd_id": "", "cve_id": "CVE-2026-81934", "cvss": {"cvssv31": [{"source": "9119a7d8-5eab-497f-8521-727c672e3725", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}], "cvssv4": [{"source": "9119a7d8-5eab-497f-8521-727c672e3725", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.2}]}, "cvss_score": 9.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-416", "description": "Redis 是开源内存数据存储组件，提供键值存储、发布订阅与脚本执行能力，并可启用 TLS 加密客户端连接。\n受影响版本中，启用 TLS 后 tlsProcessPendingData() 使用 listIter 遍历 pending_list，listNext() 会预先缓存后继 listNode 指针；当前连接的 tlsHandleEvent() 在执行命令时可能关闭另一条仍位于该列表中的 TLS 连接，connTLSClose() 经 listDelNode() 释放该节点后，迭代器继续解引用已释放内存，远程未认证攻击者可在 redis-server 进程权限下执行任意命令。\n修复版本中通过将 pending_list 遍历改为按 listFirst() 有界取出当前节点，并在调用 tlsHandleEvent() 之前执行 tlsPendingRemove()，避免跨事件处理持有后继节点指针，切断释放后使用路径。", "effects": [{"comp_name": "redis", "ecosystem": "linux", "versions": [{"affected_version": "[8.2.0,8.2.9)", "min_fixed_version": "8.2.9", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[8.4.0,8.4.6)", "min_fixed_version": "8.4.6", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[8.10.0,8.10.1)", "min_fixed_version": "8.10.1", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[8.6.0,8.6.6)", "min_fixed_version": "8.6.6", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[8.8.0,8.8.2)", "min_fixed_version": "8.8.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "UAF", "kind_en": "免费后使用", "last_modified_time": "2026-08-28", "level": "Critical", "mps_id": "MPS-k6ys-i7nd", "poc": false, "poc_url": [], "published_time": "2026-08-28", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-k6ys-i7nd", "name": "https://www.oscs1024.com/hd/MPS-k6ys-i7nd"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-81934", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-81934"}, {"url": "https://github.com/redis/redis/commit/6d088c335d5c3ec49a6c28486140b498e70b7834", "name": ""}, {"url": "https://github.com/v12-security/pocs/tree/main/redis/server_ssl", "name": ""}, { rkspace 与授权 workspace 一致，或调整 resolveWorkspace 在同时存在资源类标识时不再无条件信任调用方 workspaceId，可切断该越权链。截至 2026-08-26，公开仓库最新正式版本仍为 2.0.0，main 分支 resolveWorkspace 仍优先信任 X-Airbyte-Workspace-Id，未找到已验证修复提交。", "effects": [{"comp_name": "airbyte-platform", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.0.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "通过用户控制密钥绕过授权机制", "kind_en": "通过用户控制的密钥绕过授权", "last_modified_time": "2026-08-26", "level": "High", "mps_id": "MPS-oi19-7qst", "poc": false, "poc_url": [], "published_time": "2026-08-26", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-oi19-7qst", "name": "https://www.oscs1024.com/hd/MPS-oi19-7qst"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-80049", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-80049"}, {"url": "https://github.com/airbytehq/airbyte-platform", "name": ""}, {"url": "https://github.com/airbytehq/airbyte-platform/blob/v2.0.0/airbyte-commons-server/src/main/kotlin/io/airbyte/commons/server/support/AuthenticationHeaderResolver.kt", "name": ""}, {"url": "https://github.com/geo-chen/oss/blob/main/airbyte-platform.md", "name": ""}, {"url": "https://www.vulncheck.com/advisories/airbyte-platform-through-2.0.0-cross-workspace-authorization-bypass-via-caller-supplied-workspaceid", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Airbyte工作区越权漏洞", "_translated": true, "_saved_at": "2026-08-25T20:21:26+00:00", "_first_saved_at": "2026-08-25T20:21:26+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-oi19-7qst"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-75498", "cvss": {"cvssv31": [{"source": "9119a7d8-5eab-497f-8521-727c672e3725", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.2}], "cvssv4": [{"source": "9119a7d8-5eab-497f-8521-727c672e3725", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-89", "description": "Webkul QloApps 在数据库查询之前不会验证请求参数。具有管理权限的经过身份验证的远程攻击者可以将精心设计的 SQL 查询发送到“Address.php”文件中的“bo_query”参数。已在 123c97c 中修复。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-08-26", "level": "High", "mps_id": "MPS-0wg3-bmyt", "poc": false, "poc_url": [], "published_time": "2026-08-26", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-0wg3-bmyt", "name": "https://www.oscs1024.com/hd/MPS-0wg3-bmyt"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-75498", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-75498"}, {"url": VC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-89", "description": "Webkul QloApps 在数据库查询之前不会验证请求参数。具有管理权限的经过身份验证的远程攻击者可以将精心设计的 SQL 查询发送到“CustomerMessage.php”文件中的“bo_query”参数。已在 123c97c 中修复。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-08-26", "level": "High", "mps_id": "MPS-gnui-oskw", "poc": false, "poc_url": [], "published_time": "2026-08-26", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-gnui-oskw", "name": "https://www.oscs1024.com/hd/MPS-gnui-oskw"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-75497", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-75497"}, {"url": "https://github.com/Qloapps/QloApps/pull/1783/changes/123c97c110b7053ea3297d8e58fe95b3c3536560", "name": ""}, {"url": "https://raw.githubusercontent.com/cisagov/CSAF/develop/csaf_files/IT/white/2026/va-26-237-01.json", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-75497", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-75497漏洞", "_translated": true, "_saved_at": "2026-08-25T18:31:09+00:00", "_first_saved_at": "2026-08-25T18:31:09+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-gnui-oskw"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-54511", "cvss": {"cvssv31": [{"source": "github_advisory", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:N/I:H/A:N", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "", "cwe": "CWE-93", "description": "`@logtape/syslog` contains two related output-encoding bugs in the structured data formatting code. Both only affect deployments with `includeStructuredData: true`, which is non-default.\n\n## 1. Unescaped C0 control characters in structured data values\n\n`escapeStructuredDataValue()` in `packages/syslog/src/syslog.ts` escapes `\\`, `\"`, and `]` per RFC 5424 but does not escape newline (`\\n`), carriage return (`\\r`), or any other C0 control characters (U+0000–U+001F):\n\n```typescript\nfunction escapeStructuredDataValue(value: string): string {\n  return value\n    .replace(/\\\\/g, \"\\\\\\\\\")\n    .replace(/\"/g, '\\\\\"')\n    .replace(/]/g, \"\\\\]\");\n  // \\n, \\r, and other C0 control characters are not escaped\n}\n```\n\nTCP syslog commonly uses `\\n` as a frame delimiter (RFC 6587, non-transparent framing). If an attacker-controlled value contains a literal newline, that newline terminates the current syslog frame. Bytes following the newline begin a new frame, and if they form a valid RFC 5424 header (`\u003cPRI\u003e1 …`), a downstream collector will accept them as a separate, authentic-looking syslog record.\n\n## 2. Unvalidated SD-NAME keys\n\nStructured data parameter keys are inserted into the message without validation or escaping:\n\n```typescript\nelements.push(`${key}=\"${escapedValue}\"`);\n```\n\nRFC 5424 defines SD-NAME as printable US-ASCII characters excluding `=`, `]`, `\"`, and space, with a maximum length of 32. A key containing any of those characters, control characters, or exceeding the length limit will produce malformed structured data. If the key itself contains an embedded `]`, it can prematurely close the structured-data element.\n\nIn typical usage, property keys are developer-defined string literals and therefore safe. However, if an application forwards attacker-controlled keys as log properties—for example by spreading request headers or arbitrary metadata into a log record—this becomes a second injection path.\n\n## Proof of concept\n\nThe following Node.js snippet (no dependencies, no network required) demonstrates that the escaped value still contains a literal newline:\n\n```javascript\nfunction escapeStructuredDataValue(value) {\n  return value\n    .replace(/\\\\/g, \"\\\\\\\\\")\n    .replace(/\"/g, '\\\\\"')\n    .replace(/]/g, \"\\\\]\");\n}\n\nconst payload =\n  'normal\\n\u003c134\u003e1 2026-01-01T00:00:00Z forged evil - - - INJECTED';\n\nconst result = escapeStructuredDataValue(payload);\nconsole.log(\"Newline present after escape:\", result.includes(\"\\n\")); // true\n```\n\nTested with Node.js 22.17.1.\n\n## Impact\n\nAn attacker who controls log property values can:\n\n- forge syslog records attributed to arbitrary hosts, applications, or process IDs;\n- insert records with arbitrary severity or facility levels;\n- obscure malicious activity by injecting misleading entries around legitimate ones;\n- break downstream log parsers or SIEM correlation rules that rely on log integrity.\n\nAffected downstream collectors include rsyslog, syslog-ng, Splunk, Elastic Stack, and any other system using RFC 6587 non-transparent framing.\n\n## Suggested fix\n\n### Structured data values\n\nEscape all C0 control characters (U+0000–U+001F) in addition to `\\`, `\"`, and `]`. RFC 5424 does not define an escape sequence for control characters in PARAM-VALUE; the most interoperable approach is to strip or replace them:\n\n```typescript\nfunction escapeStructuredDataValue(value: string): string {\n  return value\n    .replace(/\\\\/g, \"\\\\\\\\\")\n    .replace(/\"/g, '\\\\\"')\n    .replace(/]/g, \"\\\\]\")\n    .replace(/[\\x00-\\x1f]/g, (c) =\u003e\n      `\\\\x${c.charCodeAt(0).toString(16).padStart(2, \"0\")}`\n    );\n}\n```\n\nAlternatively, strip them entirely: `.replace(/[\\x00-\\x1f]/g, \"\")`. The right choice depends on whether downstream consumers need some representation of the original value.\n\n### SD-NAME keys\n\nValidate each key against the RFC 5424 SD-NAME grammar before including it. Keys that fail validation should be skipped or sanitized:\n\n```typescript\n// SD-NAME: printable US-ASCII, excluding '=', ']', '\"', SP; max 32 chars\nconst SD_NAME_RE = /^[!-\u003c\u003e-Z\\\\^-z|~]{1,32}$/;\n\nfor (const [key, value] of Object.entries(record.properties)) {\n  if (!SD_NAME_RE.test(key)) continue;\n  const escapedValue = escapeStructuredDataValue(String(value));\n  elements.push(`${key}=\"${escapedValue}\"`);\n}\n```", "effects": [{"comp_name": "@logtape/syslog", "ecosystem": "npm", "versions": [{"affected_version": "(-∞,1.3.11)", "min_fixed_version": "1.3.11", "repository": "npm", "solutions": [], "upstream": true}, {"affected_version": "[2.1.0,2.1.5)", "min_fixed_version": "2.1.5", "repository": "npm", "solutions": [], "upstream": true}, {"affected_version": "[2.0.0,2.0.14)", "min_fixed_version": "2.0.14", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "CRLF注入", "kind_en": "Improper Neutralization of CRLF Sequences ('CRLF Injection')", "last_modified_time": "2026-08-26", "level": "High", "mps_id": "MPS-hljv-oxcs", "poc": false, "poc_url": [], "published_time": "2026-08-26", "reference_url_list": [{"url": "https://github.com/dahlia/logtape/security/advisories/GHSA-8h6h-x5pq-56fq", "name": ""}, {"url": "https://github.com/dahlia/logtape/commit/7a6e5b9ddf7915edfff78fa129bc17c979b2a623", "name": ""}, {"url": "https://github.com/dahlia/logtape/releases/tag/1.3.11", "name": ""}, {"url": "https://github.com/dahlia/logtape/releases/tag/2.0.14", "name": ""}, {"url": "https://github.com/dahlia/logtape/releases/tag/2.1.5", "name": ""}, {"url": "https://github.com/advisories/GHSA-8h6h-x5pq-56fq", "name": ""}], "scope_influence": "", "tags": [], "title": "@logtape/syslog: syslog log injection via unescaped control characters and unvalidated SD-NAME keys", "_translated": true, "_saved_at": "2026-08-28T08:32:18+00:00", "_first_saved_at": "2026-08-26T14:38:01+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-hljv-oxcs"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-79784", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI: - 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-64204", "cvss": {"cvssv31": [{"source": "security@ni.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}], "cvssv4": [{"source": "security@ni.com", "vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.5}]}, "cvss_score": 8.5, "cvss_vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-787", "description": "最近存在内存损坏漏洞\n在NI LabVIEW中发现可能导致信息泄露或任意\n代码执行。  成功利用该漏洞需要攻击者获得\n用户打开一个特制的VI。  该漏洞影响NI\nLabVIEW 2026 Q3 (26.3.0) 及之前版本。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-08-26", "level": "High", "mps_id": "MPS-h3y5-g9v6", "poc": false, "poc_url": [], "published_time": "2026-08-26", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-h3y5-g9v6", "name": "https://www.oscs1024.com/hd/MPS-h3y5-g9v6"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-64204", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-64204"}, {"url": "https://www.ni.com/en/support/security/available-critical-and-security-updates-for-ni-software/2026/memory-corruption-vulnerabilities-ni-labview.html", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-64204漏洞", "_translated" 0/AV:N/AC:H/AT:P/PR:N/UI:N/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.2}]}, "cvss_score": 8.2, "cvss_vector": "CVSS:4.0/AV:N/AC:H/AT:P/PR:N/UI:N/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-295", "description": "X-AnyLabeling 的模型下载器禁用了 TLS 证书验证。 anylabeling/services/auto_labeling/model.py 中的 download_with_retry 使用 ssl._create_unverified_context() 构建了一个上下文并将其传递给 urllib.request.urlopen，因此在任何模型下载时都不会检查证书链和主机名，并且模型是通过 HTTPS 从项目的发布主机获取的。因此，任何拦截该连接的一方都可以用自己选择的内容进行应答。响应被写入 .part 文件并通过 os.replace 移至适当位置，唯一的下载后检查 safe_check_model 验证文件的格式而不是其出处：不会将哈希或签名与预期值进行比较。对于 ONNX 目标，替换文件传递 onnx.checker.check_model，然后用于推理，因此攻击者选择生成应用程序注释的模型。对于附带的 SAM2 视频、YOLOE、UPN 和 open_vision 配置使用的 .pth 或 .pt 目标，检查工作程序在不带 Weights_only 的情况下调用 torch.load，因此替换的文件将被 unpickle，并在早于 Weights_only 默认值的 PyTorch 版本上执行攻击者选择的代码。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "证书验证不恰当", "kind_en": "证书验证不当", "last_modified_time": "2026-08-26", "level": "High", "mps_id": "MPS-np4u-sa79", "poc": false, "poc_url": [], "published_time": "2026-08-26", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-np4u-sa79", "name": "https://www.oscs1024.com/hd/MPS-np4u-sa79"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-79785", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-79785"}, {"url": "https://github.com/CVHub520/X-AnyLabeling", "name": ""}, {"url": "https://github.com/CVHub520/X-AnyLabeling/blob/v4.0.0-beta.8/anylabeling/services/auto_labeling/model.py", "name": ""}, {"url": "https://github.com/CVHub520/X-AnyLabeling/commit/52f7c30333f3f99711f09334d740212aa30b9958", "name": ""}, {"url": "https://github.com/CVHub520/X-AnyLabeling/releases/tag/v4.0.0-b f.uid、user.username 与 conf.base_dn 未转义拼接 Distinguished Name，再以该字符串作为 consumers_kv 查找键。用户名中的逗号等 DN 结构字符会改变绑定目标或 Consumer 映射键，使持有某一目录条目有效凭据的调用者通过 APISIX 认证为映射到另一条目的 Consumer，而该条目本应处于插件 base_dn 作用域之外。\n修复版本中通过使用 ldap.ldap_authenticate 返回的、已按 RFC 4514 转义的 bind DN 作为消费者查找键，绑定身份与 Consumer 映射保持一致，切断跨子树身份假冒。", "effects": [{"comp_name": "apisix", "ecosystem": "linux", "versions": [{"affected_version": "[2.11.0,3.18.0)", "min_fixed_version": "3.18.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "LDAP注入", "kind_en": "LDAP 查询中使用的特殊元素的不正确中和（“LDAP 注入”）", "last_modified_time": "2026-08-26", "level": "High", "mps_id": "MPS-0163-bea7", "poc": false, "poc_url": [], "published_time": "2026-08-26", "reference_url_list": [{"url": "http://www.mail-archive.com/announce@apache.org/msg11787.html", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-75020", "name": ""}, {"url": "https://apisix.apache.org", "name": ""}, {"url": "https://github.com/apache/apisix/pull/13805", "name": ""}, {"url": "https://github.com/apache/apisix/commit/7bae5539816f08b30f3c534a53a43ce527771a2f", "name": ""}, {"url": "https://github.com/apache/apisix/blob/release/3.18/CHANGELOG.md", "name": ""}], "scope_influence": "", "tags": [], "title": "APISIX LDAP注入漏洞", "_translated": true, "_saved_at": "2026-08-26T16:12:56+00:00", "_first_saved_at": "2026-08-26T16:12:56+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-0163-bea7"}, {"analysis_status": 3, "articles": [{"content": "- 攻击者通过向受信任的数据序列化过程中添加恶意数据，从而在序列化和反序列化过程中执行恶意代码的攻击漏洞。这种漏洞通常存在于使用序列化 (serialization) 机制存储和传输数据的程序中。\n", "title": "什么是反序列化"}, {"content": "- 注入攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码注入到程序中，从而实现代码执行的目的。\n- 反射攻击：攻击者使用反射机制，在序列化过程中动态生成恶意数据，并将恶意代码注入到程序中，从而实现代码执行的目的。\n- 缓冲区溢出攻击：攻击者通过在序列化过程中向缓冲区输入恶意数据，导致缓冲区溢出，从而破坏程序的内存管理，实现代码执行的目的。\n- 格式字符串攻击：攻击者通过在序列化过程中输入恶意数据，导致程序使用错误的格式字符串，从而实现代码执行的目的。\n- 数据流攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码作为一个数据流传递给程序，从而实现代码执行的目的。\n", "title": "反序列化常见的攻击方式"}, {"content": "- 不信任输入数据：程序应该严格检查输入数据的有效性，并避免使用不受信任的数据。\n- 使用安全的序列化机制：程序应该使用安全的序列化机制，如 JSON 或 XML 序列化，而不是第三方序列化库。\n- 最小特权原则：程序应该限制对受信任数据的处理权限，并避免在运行时修改数据。\n- 代码审查和漏洞扫描：程序应该进行代码审查和漏洞扫描，以发现和修复潜在的安全漏洞。\n", "title": "如何预防反序列化"}], "cnvd_id": "", "cve_id": "", "cvss": {"cvssv31": [{"source": "murphysec", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.1}]}, "cvss_score": 8.1, "cvss_vector": "", "cwe": "CWE-502", "description": "Apache Log4j2 是 Apache 软件基金会维护的开源 Java 日志框架。log4j-api 提供 FilteredObjectInputStream，用于在反序列化日志事件流时实施类白名单；log4j-core 负责日志事件的序列化表示。\n受影响版本中，FilteredObjectInputStream 默认白名单包含 java.rmi.MarshalledObject，该类把内部对象存放在不透明字节数组 objBytes 中，resolveClass 只能看到外层类型。Log4jLogEvent.LogEventProxy 自 2.8 起将 Message 写入 marshalledMessage，并在 readResolve 调用的 message() 中执行 marshalledMessage.get()，该方法会新建未经过滤的 ObjectInputStream 反序列化载荷。攻击者向使用 FilteredObjectInputStream 的日志接收端写入一条序列化 LogEventProxy 即可绕过白名单触发任意反序列化，在类路径存在 gadget 时可导致远程代码执行，普通写日志不受影响。\n在官方修复发布前，可通过停止接收不可信来源的序列化 LogEvent，或设置 JVM 参数 -Djdk.serialFilter='!java.rmi.MarshalledObject' 阻断该绕过路径。", "effects": [{"comp_name": "org.apache.logging.log4j:log4j-api", "ecosystem": "maven", "versions": [{"affected_version": "[2.11.0,2.26.1]", "min_fixed_version": "", "repository": "maven", "solutions": [], "upstream": true}]}, {"comp_name": "org.apache.logging.log4j:log4j-core", "ecosystem": "maven", "versions": [{"affected_version": "[2.8.0,2.26.1]", "min_fixed_version": "", "repository": "maven", "solutions": [{"description": "不要用 FilteredObjectInputStream 接收不可信的序列化 LogEvent，改用 JSON 等非 Java 序列化传输；临时可加 JVM 参数 -Djdk.serialFilter='!java.rmi.MarshalledObject'。", "type": "缓解措施"}], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "反序列化", "kind_en": "不可信数据的反序列化", "last_modified_time": "2026-08-26", "level": "High", "mps_id": "MPS-wza3-h8l6", "poc": false, "poc_url": [], "published_time": "2026-08-26", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-wza3-h8l6", "name": "https://www.oscs1024.com/hd/MPS-wza3-h8l6"}, {"url": "https://github.com/apache/logging-log4j2/issues/4255", "name": ""}], "scope_influence": "小", "tags": ["java", "专家校准", "开源"], "title": "Apache Log4j2反序列化远程代码执行漏洞", "_translated": true, "_saved_at": "2026-08-26T14:37:56+00:00", "_first_saved_at": "2026-08-26T09:34:51+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-wza3-h8l6"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-79992", "cvss": {"cvssv31": [{"source": "secalert@redhat.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-78", "description": "Emacs TRAMP 中发现一个缺陷。本地攻击者可以通过处理恶意制作的文件名来利用此漏洞。发生这种情况是因为 TRAMP 在没有进行适当清理的情况下连接登录参数，然后将其传递到本地 shell。成功利用可能会导致任意代码执行。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-08-26", "level": "High", "mps_id": "MPS-73tw-cb0j", "poc": false, "poc_url": [], "published_time": "2026-08-26", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-73tw-cb0j", "name": "https://www.oscs1024.com/hd/MPS-73tw-cb0j"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-79992", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-79992"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-79992", "name": ""}, {"url": "https://bugzilla.redhat.com/show_bug.cgi?id=2523665", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-79992漏洞", "_translated": true, "_saved_at": "2026-08-25T19:26:14+00:00", "_first_saved_at": "2026-08-25T19:26:14+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-73tw-cb0j"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-75770", "cvss": {"cvssv31": [{"source": "psirt@adobe.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "cwe": "CWE-787", "description": "Substance3D - Painter 受到越界写入漏洞的影响，该漏洞可能导致在当前用户的上下文中执行任意代码。利用
