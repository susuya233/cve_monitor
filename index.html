oc_url": [], "published_time": "2026-08-26", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-tm7h-3w5n", "name": "https://www.oscs1024.com/hd/MPS-tm7h-3w5n"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-75769", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-75769"}, {"url": "https://helpx.adobe.com/security/products/substance3d_painter/apsb26-129.html", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-75769漏洞", "_translated": true, "_saved_at": "2026-08-25T19:26:21+00:00", "_first_saved_at": "2026-08-25T19:26:21+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-tm7h-3w5n"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过构造恶意的数据，将过多的数据输入到程序的缓冲区中，使得缓冲区的空间被填满，从而溢出到程序的栈 (stack) 或堆 (heap) 中，导致程序崩溃、拒绝服务、数据泄露等安全问题。\n", "title": "什么是经典缓冲区溢出"}, {"content": "| 类型        | 描述                                                         |\n| ----------- | ------------------------------------------------------------ |\n| 代码注入攻击      | 攻击者通过向程序的缓冲区输入恶意代码，从而控制程序执行流程，实现对程序操作的恶意操作。例如，攻击者可以通过向 Web 应用程序的输入框中输入恶意代码，从而执行任意的代码，破坏系统、窃取数据等。 |\n| 数据覆盖攻击      | 攻击者通过向程序的缓冲区输入过多的数据，从而覆盖程序中的重要数据或代码，实现对程序操作的恶意操作。例如，攻击者可以通过向聊天应用程序的输入框中输入过多的表情符号，从而覆盖程序中的重要数据，例如聊天消息、账号密码等。 |\n| 栈溢出攻击 | 攻击者通过向程序的栈中输入过多的数据，从而溢出到栈外部，实现对程序操作的恶意操作。例如，攻击者可以通过向游戏应用程序的输入框中输入过多的道具名称，从而覆盖程序中的重要数据，例如游戏数据、账号密码等。 |\n| 堆溢出攻击       | 攻击者通过向程序的堆中输入过多的数据，从而溢出到堆外部，实现对程序操作的恶意操作。例如，攻击者可以通过向操作系统工具的输入框中输入过多的命令，从而覆盖程序中的重要数据，例如系统文件、配置文件等。 |", "title": "经典缓冲区溢出常见的攻击方式"}, {"content": "- 输入验证：在程序输入处对输入数据进行严格的验证和过滤，确保输入数据符合预期的格式和类型，避免被攻击者注入恶意命令或数据。可以使用正则表达式、格式字符串等方式进行输入验证。\n- 输出过滤：在程序输出处对输出数据进行严格的过滤和检查，确保输出数据符合预期的格式和类型，避免被攻击者截获和篡改。可以使用安全的输出过滤库等方式进行输出过滤。\n- 使用安全的编程模型：使用安全的编程模型，例如避免使用原生的缓冲区管理函数，使用安全的框架和库来处理输入数据和执行命令，避免缓冲区溢出漏洞。\n- 数据库加密和访问控制：对于敏感数据和命令，使用加密和访问控制措施，确保只有授权用户可以访问和执行命令，避免被攻击者窃取和篡改。\n- 定期更新和升级：定期更新和升级应用程序和库的版本，确保应用程序和库的最新版本包含了最新的安全补丁和修复措施，避免安全漏洞的出现和利用。\n- 安全审计和监控：定期对系统和应用程序进行安全审计和监控，及时发现和阻止潜在的安全漏洞和攻击，确保系统和数据的安全和可靠性。", "title": "如何预防经典缓冲区溢出"}], "cnvd_id": "", "cve_id": "CVE-2026-80186", "cvss": {"cvssv31": [{"source": "secalert@redhat.com", "vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:U/C:L/I:L/A:H", "severity": "high", "base_score": 7.6}]}, "cvss_score": 7.6, "cvss_vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:U/C:L/I:L/A:H", "cwe": "CWE-120", "description": "BlueZ 是开源 Linux 蓝牙协议栈，提供 bluetoothd 守护进程及主机侧协议实现，用于设备发现、配对与配置文件通信。\n受影响版本中，蓝牙发现路径会把远程设备 Extended Inquiry Response 中的名称字段交给 eir_parse，再传入 name2utf8。name2utf8 在 250 字节栈缓冲 utf8_name 上调用 strncpy，且未将 len 限制为 HCI_MAX_NAME_LENGTH；当名称字段 field_len 为 254 时，拷贝长度可达 253 字节，造成 3 字节栈溢出，可导致 bluetoothd 崩溃，并可能进一步执行任意代码。\n修复版本中通过在 name2utf8 中执行 len = MIN(len, HCI_MAX_NAME_LENGTH)，将拷贝长度限制在 248 字节以内，使超长 EIR 设备名无法越过栈缓冲边界，从而阻断该溢出路径。", "effects": [{"comp_name": "bluez", "ecosystem": "linux", "versions": [{"affected_version": "[5.86,5.87]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "经典缓冲区溢出", "kind_en": "不检查输入大小的缓冲区复制（“经典缓冲区溢出”）", "last_modified_time": "2026-08-26", "level": "High", "mps_id": "MPS-elyz-f327", "poc": false, "poc_url": [], "published_time": "2026-08-26", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-elyz-f327", "name": "https://www.oscs1024.com/hd/MPS-elyz-f327"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-80186", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-80186"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-80186", "name": ""}, {"url": "https://bugzilla.redhat.com/show_bug.cgi?id=2524132", "name": ""}, {"url": "https://github.com/bluez/bluez/security/advisories/GHSA-68h6-5qgp-3975", "name": ""}], "scope_influence": "", "tags": [], "title": "BlueZ EIR栈溢出漏洞", "_translated": true, "_saved_at": "2026-08-26T02:23:09+00:00", "_first_saved_at": "2026-08-26T00:56:21+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-elyz-f327"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-80182", "cvss": {"cvssv4": [{"source": "cve@mitre.org", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:L/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.6}]}, "cvss_score": 7.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:L/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-863", "description": "In OpenStack Keystone before 29.0.3, tokens obtained via OAuth1 access token, application credential, or trust-scoped authentication could create new long-lived credentials or authorize new delegations that persist independently of, and outlive, the credential used to obtain them. The delegation restrictions that block these operations did not consistently apply to all delegated token types, allowing an OAuth1-scoped token, for example, to create application credentials or authorize OAuth1 request tokens despite those operations being restricted for other delegated token types. All Keystone deployments that permit delegated authentication through OAuth1 access tokens, application credentials, or trusts are affected.", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-08-26", "level": "High", "mps_id": "MPS-fta2-hk40", "poc": false, "poc_url": [], "published_time": "2026-08-26", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-fta2-hk40", "name": "https://www.oscs1024.com/hd/MPS-fta2-hk40"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-80182", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-80182"}, {"url": "https://launchpad.net/bugs/2153453", "name": ""}, {"url": "https://security.openstack.org/ossa/OSSA-2026-037.html", "name": ""}, {"url": "https://www.openwall.com/lists/oss-security/2026/08/25/5", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-80182漏洞", "_translated": true, "_saved_at": "2026-08-28T08:32:18+00:00", "_first_saved_at": "2026-08-26T00:56:20+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-fta2-hk40"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-80184", "cvss": {"cvssv4": [{"source": "cve@mitre.org", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:L/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.6}]}, "cvss_score": 7.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:L/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-863", "description": "OpenStack Keystone 是开源身份认证服务，用于签发令牌、绑定项目范围，并管理 application credential、OAuth1 访问令牌和 trust 等委托凭据。\n受影响版本中，攻击者可将已通过 application credential、OAuth1 访问令牌或 trust 获得的委托令牌提交到 POST /v3/auth/tokens 的 token 认证方法。AuthTokenResource.post 读取请求体中的 auth 数据后，token_authenticate() 对 trust 与 OAuth1 令牌会拒绝再签发，但对 application_credential 令牌只在请求显式 scope 时拦截；省略 scope 时会按凭据所有者的 default_project_id 签发新令牌，使原本绑定项目 A 的委托凭据获得项目 B 的访问能力。\n修复版本中通过在 token_authenticate() 调用 delegation.is_delegated_method(token)，将非主认证方法签发的委托令牌一律拒绝再认证，切断省略 scope 后回落到所有者默认项目的路径。该修复依赖配套补丁提供的委托分类逻辑和 [auth] additional_primary_auth_methods 配置，需成套应用。", "effects": [{"comp_name": "keystone", "ecosystem": "pip", "versions": [{"affected_version": "[13.0.0,27.0.3)", "min_fixed_version": "27.0.3", "repository": "pip", "solutions": [], "upstream": true}, {"affected_version": "[28.0.0,28.0.3)", "min_fixed_version": "28.0.3", "repository": "pip", "solutions": [], "upstream": true}, {"affected_version": "[29.0.0,29.0.3)", "min_fixed_version": "29.0.3", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-08-26", "level": "High", "mps_id": "MPS-y7zm-hsck", "poc": false, "poc_url": [], "published_time": "2026-08-26", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-y7zm-hsck", "name": "https://www.oscs1024.com/hd/MPS-y7zm-hsck"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-80184", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-80184"}, {"url": "https://launchpad.net/bugs/2158538", "name": ""}, {"url": "https://security.openstack.org/ossa/OSSA-2026-037.html", "name": ""}, {"url": "https://www.openwall.com/lists/oss-security/2026/08/25/5", "name": ""}], "scope_influence": "", "tags": ["python", "开源"], "title": "Keystone委托令牌越权", "_translated": true, "_saved_at": "2026-08-26T02:23:08+00:00", "_first_saved_at": "2026-08-26T02:23:08+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-y7zm-hsck"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-75005", "cvss": {}, "cvss_score": 7.5, "cvss_vector": "", "cwe": "CWE-407", "description": "Apache APISIX 是开源云原生 API 网关，用于对 HTTP 与 GraphQL 等流量进行路由、鉴权和插件化治理。graphql-limit-count 插件按 GraphQL 查询的选择嵌套深度计算配额并实施限流。\n受影响版本中，该插件在 access 阶段读取 POST 请求体并解析 GraphQL 文档后，由 node_depth 展开 fragment spread 以计算深度。visited 仅标记当前递归路径上的 fragment，走完后立即清除，同一 fragment 被多处引用时会被完整重复遍历。当文档中各 fragment 再双倍引用上一层 fragment 时，遍历代价随 fragment 数量指数上升，单次体积很小的请求即可在扣减限流配额前将网关 worker 长时间占用 100% CPU。\n修复版本中通过为每个 fragment 增加 memo 缓存，使同一 fragment 的深度只计算一次，把遍历复杂度降为与文档规模近似线性，并对 fragment 环返回 400，避免小请求拖垮 worker。", "effects": [{"comp_name": "apisix", "ecosystem": "linux", "versions": [{"affected_version": "[3.17.0,3.18.0)", "min_fixed_version": "3.18.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "低效算法复杂性", "kind_en": "低效的算法复杂性", "last_modified_time": "2026-08-26", "level": "High", "mps_id": "MPS-64b7-57ac", "poc": false, "poc_url": [], "published_time": "2026-08-26", "reference_url_list": [{"url": "https://www.openwall.com/lists/oss-security/2026/08/26/13", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-75005", "name": ""}, {"url": "https://apisix.apache.org", "name": ""}, {"url": "https://github.com/apache/apisix/commit/03922900726e086fa1002ecf76cc4edfd0ee2e7e", "name": ""}, {"url": "https://github.com/apache/apisix/pull/13809", "name": ""}, {"url": "https://github.com/apache/apisix/blob/3.18.0/CHANGELOG.md", "name": ""}, {"url": "https://github.com/apache/apisix/releases/tag/3.18.0", "name": ""}], "scope_influence": "", "tags": [], "title": "APISIX无认证CPU耗尽", "_translated": true, "_saved_at": "2026-08-26T16:12:54+00:00", "_first_saved_at": "2026-08-26T16:12:54+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-64b7-57ac"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能有效地控制资源的使用，导致攻击者可以利用这个漏洞耗尽应用程序所依赖的资源。这些资源可以是计算资源（CPU、内存）、网络带宽、数据库连接或其他系统资源。攻击者可以通过发送特制的请求、恶意输入或其他方式，使应用程序消耗大量资源，导致拒绝服务或系统崩溃。", "title": "什么是拒绝服务"}, {"content": "- 消耗计算资源：攻击者可以发送计算密集型的请求，例如复杂的计算、无限循环或递归操作，以耗尽应用程序的计算资源，导致应用程序无法响应其他请求。\r\n- 消耗内存资源：攻击者可以发送大量的数据或恶意输入，以导致应用程序消耗过多的内存资源，从而使系统的可用内存耗尽，并导致应用程序崩溃或变得不可用。\r\n- 消耗网络带宽：攻击者可以发送大量的请求或大型数据包，以消耗应用程序所依赖的网络带宽。这会导致其他合法用户无法正常访问应用程序或降低系统的整体网络性能。\r\n- 消耗存储资源：攻击者可以发送大量的请求或上传大文件，以耗尽应用程序的存储资源，导致系统无法处理其他请求或存储新的数据。", "title": "拒绝服务常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对输入数据进行合理的验证和过滤，防止恶意输入导致资源消耗过高。\r\n- 实施资源限制：应用程序应该实施适当的资源限制策略，例如限制计算操作的时间或次数，限制内存使用量，限制并发连接数等，以防止资源被耗尽。\r\n- 异常处理与错误恢复：应用程序应该具备健壮的异常处理和错误恢复机制，以防止因意外错误导致资源泄漏或无法释放的情况。\r\n- 资源监控与警报：应用程序应该实施适当的资源监控和警报机制，及时发现异常的资源消耗情况，并采取相应的措施来应对。\r\n- 压力测试与性能优化：应用程序应该进行压力测试，以评估其在高负载情况下的性能，并进行必要的性能优化，以确保能够有效地处理大量请求而不耗尽资源。", "title": "如何预防拒绝服务"}], "cnvd_id": "", "cve_id": "CVE-2026-68763", "cvss": {}, "cvss_score": 7.5, "cvss_vector": "", "cwe": "CWE-400", "description": "Apache Tomcat 是 Apache 软件基金会发布的开源 Java Servlet 容器与 Web 服务器，用于托管 Java Web 应用，并可通过 Http2Protocol 提供 HTTP/2。\n受影响版本中，HTTP/2 连接在连接级流量窗口不足时，会把尚未获得完整窗口分配的流放入 Http2UpgradeHandler 的 backlog，并用 backLogSize 累计待分配字节。客户端发送 RST_STREAM 重置仍处于 backlog 中的流时，replaceStream 未将该流移出 backlog，也未把已授予但未使用的 connectionAllocationMade 归还连接窗口；allocate 在完成部分分配后也未扣减 backLogSize。攻击者可在耗尽连接窗口后反复创建并重置流，使窗口与 backlog 记账持续泄漏，最终造成拒绝服务。\n修复版本中通过在 replaceStream 中移除已重置流及其未完成分配请求并归还剩余窗口、在 allocate 中同步减少 backLogSize，以及在 reserveWindowSize 中拒绝向已关闭流发放窗口、避免重复入队，切断该分配泄漏路径。", "effects": [{"comp_name": "org.apache.tomcat.embed:tomcat-embed-core", "ecosystem": "maven", "versions": [{"affected_version": "[11.0.0-M1,11.0.25)", "min_fixed_version": "11.0.25", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[9.0.39,9.0.121)", "min_fixed_version": "9.0.121", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[8.5.59,8.5.100]", "min_fixed_version": "", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[10.1.0-M1,10.1.58)", "min_fixed_version": "10.1.58", "repository": "maven", "solutions": [], "upstream": true}]}, {"comp_name": "tomcat", "ecosystem": "linux", "versions": [{"affected_version": "[11.0.0-M1,11.0.25)", "min_fixed_version": "11.0.25", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[10.1.0-M1,10.1.58)", "min_fixed_version": "10.1.58", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[9.0.39,9.0.121)", "min_fixed_version": "9.0.121", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[8.5.59,8.5.100]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "拒绝服务", "kind_en": "不受控制的资源消耗", "last_modified_time": "2026-08-26", "level": "High", "mps_id": "MPS-6d7a-972e", "poc": false, "poc_url": [], "published_time": "2026-08-26", "reference_url_list": [{"url": "http://www.mail-archive.com/announce@apache.org/msg11780.html", "name": ""}, {"url": "https://lists.apache.org/thread/tv51ty39ppv41v04hdtkp9dp7tg02nzl", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CV oc": false, "poc_url": [], "published_time": "2026-08-26", "reference_url_list": [{"url": "https://github.com/collective/icalendar/security/advisories/GHSA-cv84-9p8j-fj68", "name": ""}, {"url": "https://github.com/collective/icalendar/commit/b6b2608ae3af6de40695b4e40f71847485aa0b49", "name": ""}, {"url": "https://github.com/collective/icalendar/commit/cad40cd112c93fd142ec12cc5b37445a849b8a79", "name": ""}, {"url": "https://github.com/collective/icalendar/releases/tag/v7.1.3", "name": ""}, {"url": "https://github.com/advisories/GHSA-cv84-9p8j-fj68", "name": ""}], "scope_influence": "", "tags": ["python", "开源"], "title": "icalendar相等比较拒绝服务", "_translated": true, "_saved_at": "2026-08-25T21:21:03+00:00", "_first_saved_at": "2026-08-25T21:21:03+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-phtg-de6o"}, {"analysis_status": 3, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "cnvd_id": "", "cve_id": "CVE-2026-56684", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.5}, {"source": "murphysec", "vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-416", "description": "Valkey 是 Redis 协议兼容的开源内存键值数据库。同源 TLS 连接层同样存在于 Redis。启用 TLS 时，服务端用 pending 列表跟踪仍有已解密但未消费数据的连接。\n受影响版本中，tlsProcessPendingData() 使用 listIter/listNext 遍历 pending_list，而 listNext 会预先缓存下一节点指针。当某连接的读处理路径执行 CLIENT KILL（或等价地关闭另一 pending 连接）时，freeClient → connTLSClose → listDelNode 可同步释放迭代器已缓存的下一节点，随后 listNext 解引用已释放内存，造成认证后远程拒绝服务，并在堆布局可控时可能发展为远程代码执行。\n修复版本中通过在调用 tlsHandleEvent 之前将连接从 pending_list 头部摘下（不再跨 handler 持有 listIter 缓存的 next），使 handler 同步释放其他节点时不会留下悬空迭代器，从而切断该释放后使用路径。", "effects": [{"comp_name": "redis", "ecosystem": "linux", "versions": [{"affected_version": "[8.4.0,8.4.6)", "min_fixed_version": "8.4.6", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[8.8.0,8.8.2)", "min_fixed_version": "8.8.2", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.2.0,6.2.24)", "min_fixed_version": "6.2.24", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[7.2.0,7.2.16)", "min_fixed_version": "7.2.16", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[8.6.0,8.6.6)", "min_fixed_version": "8.6.6", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[7.4.0,7.4.11)", "min_fixed_version": "7.4.11", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[8.10.0,8.10.1)", "min_fixed_version": "8.10.1", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[8.2.0,8.2.9)", "min_fixed_version": "8.2.9", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "valkey", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,7.2.14)", "min_fixed_version": "7.2.14", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[9.1.0,9.1.1)", "min_fixed_version": "9.1.1", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[8.0.0,8.0.10)", "min_fixed_version 用的安全框架，oauth2-jose 模块提供 JWT 与 DPoP（Demonstrating Proof of Possession）相关能力。DPoPProofJwtDecoderFactory 是处理 DPoP 证明 JWT 的工厂实现，属于 spring-security-oauth2-jose 工件。\n受影响版本中，DPoPProofJwtDecoderFactory 内部使用 Collections.synchronizedMap(new JtiCache()) 缓存 DPoP 证明 JWT 的 jti 哈希以抵御重放，其中 JtiCache 继承 LinkedHashMap 并将 MAX_SIZE 固定为 1000，仅依赖 removeEldestEntry 在超出容量或条目过期（iat + 1 小时）时淘汰。攻击者只要截获一次合法用户的有效 DPoP 证明，即可向同一 jti 缓存所在服务持续发送大量伪造 jti 的请求以撑爆 LinkedHashMap，迫使目标合法 jti 被淘汰，之后再次提交截获的 DPoP 证明即可通过校验，伪装成受害者访问受保护资源。\n修复版本中通过新增独立的 DPoPProofReplayValidator 替换原 JtiClaimValidator：把缓存抽象为可注入的 Cache 接口，默认的 InMemoryCache 基于 ConcurrentHashMap，maxSize 默认提升到 100000，并新增按 JWK thumbprint 计数的 maxRequestsPerKey（默认 1000）和每 10 秒一次的过期清理循环，使攻击者无法仅靠并发填充就把目标合法 jti 挤出缓存。", "effects": [{"comp_name": "org.springframework.security:spring-security-oauth2-jose", "ecosystem": "maven", "versions": [{"affected_version": "[6.5.0,6.5.12)", "min_fixed_version": "6.5.12", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[7.0.0,7.0.7)", "min_fixed_version": "7.0.7", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[7.1.0,7.1.1)", "min_fixed_version": "7.1.1", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "使用捕获-重放进行的认证绕过", "kind_en": "通过捕获重放绕过身份验证", "last_modified_time": "2026-08-21", "level": "High", "mps_id": "MPS-4709-1dad", "poc": false, "poc_url": [], "published_time": "2026-08-26", "reference_url_list": [{"url": "https://spring.io/security/cve-2026-41707", "name": ""}, {"url": "https://github.com/spring-projects/spring-security/commit/6b2f892e66f69b1dd94abe5a78ac416043c6474e", "name": ""}], "scope_influence": "", "tags": [], "title": "Spring Security DPoPProofJwtDecoderFactory DPoP 证明重放漏洞", "_translated": true, "_saved_at": "2026-08-26T03:48:46+00:00", "_first_saved_at": "2026-08-26T00:56:18+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-4709-1dad"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-54550", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:N/I:H/A:N", "severity": "high", "base_score": 7.4}]}, "cvss_score": 7.4, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:N/I:H/A:N", "cwe": "CWE-22", "description": "IzPack 是开源 Java 跨平台安装包生成工具，用于将应用程序打包为可在多平台运行的安装程序。\n受影响版本中，UnpackerBase.unpack() 从 PackFile 读取攻击者可控的 targetPath，只经过 IoHelper.translatePath() 做路径分隔符转换，随后直接 new File(path) 并写入目标文件。该方法不规范化父目录片段，也不校验目标是否位于安装目录内。攻击者可分发含 ../ 序列的未签名安装包条目，在受害者运行安装程序时把文件写到启动目录、可执行文件搜索路径或其他受害者权限可达位置。\n修复版本中通过在 UnpackerBase.unpack() 构造 File 之前调用 validateTargetPath()，复用 PackFile.validateTargetPath 拒绝包含父目录穿越的目标路径，并拦截 Windows 保留设备名与 NTFS 尾部点或空格，从而切断恶意 pack 条目写出安装目录之外的路径。截至 2026-08-26，官方尚未发布包含该修复的发行版本。", "effects": [{"comp_name": "org.codehaus.izpack:izpack-installer", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,5.2.6]", "min_fixed_version": "", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-08-26", "level": "High", "mps_id": "MPS-7dup-qfn1", "poc": false, "poc_url": [], "published_time": "2026-08-26", "reference_url_list": [{"url": "https://github.com/izpack/izpack/security/advisories/GHSA-f63g-88cj-hjf9", "name": ""}, {"url": "https://github.com/izpack/izpack/pull/1193", "name": ""}, {"url": "https://github.com/izpack/izpack/commit/4233ba38d0f1825f9cf3e0204e5261a5498e29d8", "name": ""}, {"url": "https://github.com/izpack/izpack/commit/8b7c6792c4fe85e3b1759c106aae39b904848466", "name": ""}, {"url": "https://github.com/advisories/GHSA-f63g-88cj-hjf9", "name": ""}], "scope_influence": "", "tags": [], "title": "IzPack路径穿越漏洞", "_translated": true, "_saved_at": "2026-08-26T16:13:02+00:00", "_first_saved_at": "2026-08-26T14:38:03+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-7dup-qfn1"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-65927", "cvss": {}, "cvss_score": 7.4, "cvss_vector": "", "cwe": "CWE-193", "description": "Apache Tomcat 是 Apache 软件基金会维护的开源 Java Servlet 容器，RewriteValve 用于按 rewrite 规则对请求 URI 执行类似 Apache HTTP Server mod_rewrite 的重写处理。\n受影响版本中，RewriteValve.invoke 处理带 [N] 标志的重写规则时存在 off-by-one 错误：规则匹配后将循环下标设为 0 再 continue，for 循环随后自增，使重写处理从第二条规则而非第一条重新开始。攻击者发送可命中 [N] 规则的 HTTP 请求后，第一条用于访问控制的规则会被跳过，造成访问控制绕过。\n修复版本中通过将 [N] 匹配后的循环下标改为 -1，使 continue 之后从第一条规则重新执行，恢复从规则列表起始处重启重写的正确语义，避免访问控制规则被跳过。", "effects": [{"comp_name": "tomcat", "ecosystem": "linux", "versions": [{"affected_version": "[10.1.0-M1,10.1.58)", "min_fixed_version": "10.1.58", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[9.0.0.M1,9.0.121)", "min_fixed_version": "9.0.121", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[11.0.0-M1,11.0.25)", "min_fixed_version": "11.0.25", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "Off-by-one错误", "kind_en": "Off-by-one Error", "last_modified_time": "2026-08-26", "level": "High", "mps_id": "MPS-ab22-27af", "poc": false, "poc_url": [], "published_time": "2026-08-26", "reference_url_list": [{"url": "http://www.mail-archive.com/announce@apache.org/msg11776.html", "name": ""}, {"url": "https://tomcat.apache.org/security-11.html", "name": ""}, {"url": "https://tomcat.apache.org/security-10.html", "name": ""}, {"url": "https://tomcat.apache.org/security-9.html", "name": ""}, {"url": "https://github.com/apache/tomcat/commit/bce83410ffb1542752d52b536257e81a5c8dfcb8", "name": ""}, {"url": "https://github.com/apache/tomcat/commit/b80929d65be774dc90e378acdda2d16949d1e5f3", "name": ""}, {"url": "https://github.com/apache/tomcat/commit/3097902177a041a93476a036b9c8419b25d5cc0d", "name": ""}, {"url": "https://github.com/apache/tomcat/commit/ffa86dc683645f784e36ec87236d51ea866dcadf", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Tomcat重写访问绕过", "_translated": true, "_saved_at": "2026-08-25T23:19:39+00:00", "_first_saved_at": "2026-08-25T22:19:43+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ab22-27af"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-45019", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "cwe": "CWE-918", "description": "Chainlit 是开源 Python 框架，用于构建生产级对话式人工智能应用，提供聊天界面、会话通道，以及将 MCP 工具接入对话流程的能力。\n受影响版本中，部署在 .chainlit/config.toml 将 features.mcp.enabled 设为 true 后，未认证客户端即可调用 POST /mcp。ConnectSseMCPRequest 与 ConnectStreamableHttpMCPRequest 把 url 定义为无约束字符串，connect_mcp 再把该 url 与可选 headers 直接交给 sse_client() 或 streamablehttp_client()，缺少协议校验、私网过滤和白名单。服务端会对任意内网或外部地址发起盲 SSRF，并转发攻击者控制的 Authorization、Cookie 等请求头，可用于改写内部接口、发现服务、扫描端口和探测云元数据。SSE 目标自 2.4.0rc0 起即可被指定，2.6.4 起增加 streamable-http 与请求头转发。\n修复版本中通过将用户提供的 SSE/streamable-http 连接改为默认拒绝，仅在 features.mcp.user_servers.enabled 为 true 且 allowed_urls 非空时放行，并在 connect_mcp 中调用 validate_mcp_url() 与 validate_mcp_headers()，把出站目标限制为白名单内的 http/https URL，同时剥离 Cookie、Host、Forwarded 等受限头，切断任意 URL 进入 MCP 传输层。", "effects": [{"comp_name": "chainlit", "ecosystem": "pip", "versions": [{"affected_version": "[2.4.0rc0,2.12.0)", "min_fixed_version": "2.12.0", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SSRF", "kind_en": "服务器端请求伪造 (SSRF)", "last_modified_time": "2026-08-26", "level": "High", "mps_id": "MPS-s451-vj62", "poc": false, "poc_url": [], "published_time": "2026-08-26", "reference_url_list": [{"url": "https://github.com/Chainlit/chainlit/security/advisories/GHSA-hvfh-5mj3-5f3j", "name": ""}, {"url": "https://github.com/Chainlit/chainlit/commit/0565fd0eccb915fce159929598b053ed79f6e0c9", "name": ""}, {"url": "https://github.com/Chainlit/chainlit/blob/2.12.0/docs/security-advisory-2026-mcp.md#spl-2026-002--ssrf-via-mcp-streamable-http--sse", "name": ""}, {"url": "https://github.com/Chainlit/chainlit/releases/tag/2.12.0", "name": ""}, {"url": "https://github.com/advisories/GHSA-hvfh-5mj3-5f3j", "name": ""}], "scope_influence": "", "tags": ["AI", "python", "开源"], "title": "Chainlit MCP SSRF漏洞", "_translated": true, "_saved_at": "2026-08-25T21:21:06+00:00", "_first_saved_at": "2026-08-25T21:21:06+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-s451-vj62"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-68513", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:N/I:H/A:H", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:N/I:H/A:H", "cwe": "CWE-787", "description": "OpenEXR is the reference implementation and specification for the EXR image format, widely used in the motion picture industry. Versions 3.3.0 through 3.3.12 and 3.4.0 through 3.4.13 contain a heap buffer overflow in PyOpenEXR triggered by a channel-name key collision between literal and prefixed RGB channels. When separate_channels=false, PyOpenEXR maps each physical channel name through channelNameToRGBA() and coalesces the results into a shared RGB array. A crafted flat scanline EXR that contains both a literal channel such as left and prefixed channels such as left.R, left.G, and left.B causes these names to collide, so the wrapper reuses an undersized two-dimensional NumPy array for the coalesced RGB slices and writes out of bounds when OpenEXR.File(path) decodes the pixels. This issue is fixed in versions 3.3.13 and 3.4.14.", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-08-26", "level": "High", "mps_id": "MPS-2yj4-lexc", "poc": false, "poc_url": [], "published_time": "2026-08-26", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-2yj4-lexc", "name": "https://www.oscs1024.com/hd/MPS-2yj4-lexc"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-68513", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-68513"}, {"url": "https://github.com/AcademySoftwareFoundation/openexr/commit/c1f3ec0d91cfa5a8035ecd00920835ac76e01640", "name": ""}, {"url": "https://github.com/AcademySoftwareFoundation/openexr/commit/d134e3cd81a2e343f2919e86bf949f576b1ab16a", "name": ""}, {"url": "https://github.com/AcademySoftwareFoundation/openexr/security/advisories/GHSA-rw5h-3q4v-c3vc", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-68513漏洞", "_translated": true, "_saved_at": "2026-08-28T08:32:18+00:00", "_first_saved_at": "2026-08-25T21:21:00+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-2yj4-lexc"}, {"analysis_status": 0, "articles": [{"content": "跨界内存读是指应用程序在读取内存时，未正确验证或限制读取的内存范围。攻击者利用这种漏洞可以读取应用程序内存中的敏感数据，如密码、加密密钥、会话令牌等。常见的原因是由于缓冲区溢出、格式化字符串漏洞或其他内存错误导致的。", "title": "什么是越界读取"}, {"content": "攻击者可以通过不当构造的输入来触发跨界内存读漏洞。攻击者可能会通过向应用程序发送特定的输入，使其读取超过预期的内存区域。攻击者可以利用这个漏洞来获取敏感信息，如其他用户的数据、操作系统的敏感数据或应用程序的内部状态。", "title": "越界读取常见的攻击方式"}, {"content": "- 输入验证和限制：应用程序应对所有输入数据进行严格的验证和限制。确保输入数据的长度、格式和内容符合预期，避免超出缓冲区或访问非预期的内存区域。\n- 内存安全编程实践：开发人员应使用安全的编程实践，如避免使用不安全的函数、正确处理内存分配和释放操作，以及遵循最小特权原则。\n- 使用安全的编程语言和库：选择使用安全性较高的编程语言和库，这些语言和库在内存管理和安全性方面提供了更多的保护机制。\n- 定期进行代码审查和安全测试：定期审查应用程序的代码，并进行安全测试，以发现潜在的跨界内存读漏洞。使用静态代码分析工具和漏洞扫描工具来辅助检测和修复问题。\n- 实施防御性编程技术：应用程序应采用防御性编程技术，如使用随机化地址空间布局（ASLR）、堆栈保护机制（如堆栈溢出保护）和数据执行预防（DEP）等。\n- 及时更新和修补：及时应用程序和操作系统的安全更新和补丁，以确保已知的跨界内存读漏洞得到修复。及时更新相关软件和库，以避免使用已知存在漏洞的版本。", "title": "如何预防越界读取"}], "cnvd_id": "", "cve_id": "CVE-2026-59189", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:L/I:N/A:H", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:L/I:N/A:H", "cwe": "CWE-125", "description": "OpenEXR 是 EXR 图像格式的参考实现和规范，广泛应用于电影行业。在 OpenEXRUtil 版本 3.3.0 到 3.3.12 以及 3.4.0 到 3.4.12 中，当深度图像具有非零 dataWindow 原点时，已记录的 TypedDeepImageChannel\u003cT\u003e::row() API 可能会返回越界指针，从而导致堆越界读取和崩溃，并在受控堆布局下可能导致信息泄露。出现该缺陷的原因是 ImfDeepImageChannel 使用两个相互冲突的坐标模型：at(x, y) 使用绝对坐标（_base 偏移量为 dataWindow.min），而 row(r) 被记录为基于 0 的逻辑访问。因此，对于非零 dataWindow.min，row(0) 指向 _sampleListPointers 分配之外，而不是第一个逻辑行。此问题已在版本 3.3.13 和 3.4.13 中修复。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界读取", "kind_en": "越界读取", "last_modified_time": "2026-08-26", "level": "High", "mps_id": "MPS-9ipb-f73y", "poc": false, "poc_url": [], "published_time": "2026-08-26", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-9ipb-f73y", "name": "https://www.oscs1024.com/hd/MPS-9ipb-f73y"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-59189", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-59189"}, {"url": "https://github.com/AcademySoftwareFoundation/openexr/commit/37f03b6ed90f3dd9910f31de3a40f25f2bc2aca1", "name": ""}, {"url": "https://github.com/AcademySoftwareFoundation/openexr/commit/55b7958ecb5ac32c427ff39c1e063f6f7bbee77c", "name": ""}, {"url": "https://github.com/AcademySoftwareFoundation/openexr/commit/aef02224ba282a802de65d16c49c1cdb82089dec", "name": ""}, {"url": "https://github.com/AcademySoftwareFoundation/openexr/security/advisories/GHSA-hwmv-39v6-739m", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-59189漏洞", "_translated": true, "_saved_at": "2026-08-25T18:31:18+00:00", "_first_saved_at": "2026-08-25T18:31:18+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-9ipb-f73y"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-68515", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:N/I:H/A:H", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:N/I:H/A:H", "cwe": "CWE-787", "description": "OpenEXR is the reference implementation and specification for the EXR image format, widely used in the motion picture industry. In versions before 3.2.11, 3.3.0 through 3.3.12, and 3.4.0 through 3.4.13, exrmultiview can write past a heap allocation when it combines two attacker-supplied, individually valid scanline EXR files whose union dataWindow is not aligned to one view's channel subsampling. The utility allocates sampled channel storage using a truncated union_width / xSampling, then reads the sampled input through a Slice based on the misaligned union window, producing a heap out-of-bounds write. The trigger is normal public-tool processing, such as exrmultiview left A.exr right B.exr out.exr with crafted but valid inputs, so this is not solely an API or caller-precondition issue. This issue is fixed in versions 3.2.11, 3.3.13, and 3.4.14.", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-08-26", "level": "High", "mps_id": "MPS-gyt8-a3fk", "poc": false, "poc_url": [], "published_time": "2026-08-26", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-gyt8-a 端寻址或进入该归档对象后即可造成 rclone 进程退出；经 rclone serve sftp 时前两种变体可终止整个 SFTP 服务。\n修复版本中通过在 New、目录列举、打开文件及惰性读路径上恢复解析 panic，将畸形 SquashFS 镜像转为错误返回，并在 serve sftp 与 vfs 后台 goroutine 中阻止未捕获 panic 打垮整个进程。", "effects": [{"comp_name": "github.com/rclone/rclone", "ecosystem": "go", "versions": [{"affected_version": "[1.72.0,1.75.0)", "min_fixed_version": "1.75.0", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "对数组索引的验证不恰当", "kind_en": "数组索引验证不当", "last_modified_time": "2026-08-26", "level": "High", "mps_id": "MPS-jpm5-vt6s", "poc": false, "poc_url": [], "published_time": "2026-08-26", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-jpm5-vt6s", "name": "https://www.oscs1024.com/hd/MPS-jpm5-vt6s"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-79775", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-79775"}, {"url": "https://github.com/rclone/rclone/security/advisories/GHSA-6jcg-q3wp-x2f4", "name": ""}, {"url": "https://www.vulncheck.com/advisories/rclone-archive-backend-squashfs-parser-denial-of-service", "name": ""}], "scope_influence": "", "tags": [], "title": "rclone归档拒绝服务", "_translated": true, "_saved_at": "2026-08-25T17:25:52+00:00", "_first_saved_at": "2026-08-25T17:25:52+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-jpm5-vt6s"}, {"analysis_status": 0, "articles": [{"content": "跨界内存读是指应用程序在读取内存时，未正确验证或限制读取的内存范围。攻击者利用这种漏洞可以读取应用程序内存中的敏感数据，如密码、加密密钥、会话令牌等。常见的原因是由于缓冲区溢出、格式化字符串漏洞或其他内存错误导致的。", "title": "什么是越界读取"}, {"content": "攻击者可以通过不当构造的输入来触发跨界内存读漏洞。攻击者可能会通过向应用程序发送特定的输入，使其读取超过预期的内存区域。攻击者可以利用这个漏洞来获取敏感信息，如其他用户的数据、操作系统的敏感数据或应用程序的内部状态。", "title": "越界读取常见的攻击方式"}, {"content": "- 输入验证和限制：应用程序应对所有输入数据进行严格的验证和限制。确保输入数据的长度、格式和内容符合预期，避免超出缓冲区或访问非预期的内存区域。\n- 内存安全编程实践：开发人员应使用安全的编程实践，如避免使用不安全的函数、正确处理内存分配和释放操作，以及遵循最小特权原则。\n- 使用安全的编程语言和库：选择使用安全性较高的编程语言和库，这些语言和库在内存管理和安全性方面提供了更多的保护机制。\n- 定期进行代码审查和安全测试：定期审查应用程序的代码，并进行安全测试，以发现潜在的跨界内存读漏洞。使用静态代码分析工具和漏洞扫描工具来辅助检测和修复问题。\n- 实施防御性编程技术：应用程序应采用防御性编程技术，如使用随机化地址空间布局（ASLR）、堆栈保护机制（如堆栈溢出保护）和数据执行预防（DEP）等。\n- 及时更新和修补：及时应用程序和操作系统的安全更新和补丁，以确保已知的跨界内存读漏洞得到修复。及时更新相关软件和库，以避免使用已知存在漏洞的版本。", "title": "如何预防越界读取"}], "cnvd_id": "", "cve_id": "CVE-2026-59981", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:L/I:N/A:H", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:L/I:N/A:H", "cwe": "CWE-125", "description": "OpenEXR is the reference implementation and specification for the EXR image file format, widely used in the motion picture industry. In versions through 3.2.10, 3.3.0 through 3.3.12, and 3.4.0 through 3.4.13, the OpenEXRUtil library returns an out-of-bounds pointer from the SampleCountChannel::row() API when a deep image has a non-zero dataWindow origin. The row() accessor is documented as 0-based and computes its address from an internal base that is offset for absolute pixel coordinates, so the two coordinate models conflict whenever dataWindow.min is non-zero. For a deep image whose data window has a large negative vertical origin, row(0) points far outside the allocated sample-count buffer. An application that opens an attacker-controlled deep EXR file and accesses sample counts through row() performs an out-of-bounds read, which can crash the process or, under a controlled heap layout, return adjacent heap memory as sample-count values. This issue is fixed in versions 3.2.11, 3.3.13, and 3.4.14.", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "越界读取", "kind_en": "越界读取", "last_modified_time": "2026-08-26", "level": "High", "mps_id": "MPS-oa3j-nb5p", "poc": false, "poc_url": [], "published_time": "2026-08-26", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-oa3j-nb5p", "name": "https://www.oscs1024.com/hd/MPS-oa3j-nb5p"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-59981", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-59981"}, {"url": "https://github.com/AcademySoftwareFoundation/openexr/commit/37f03b6ed90f3dd9910f31de3a40f25f2bc2aca1", "name": ""}, {"url": "https://github.com/AcademySoftwareFoundation/openexr/commit/55b7958ecb5ac32c427ff39c1e063f6f7bbee77c", "name": ""}, {"url": "https://github.com/AcademySoftwareFoundation/openexr/commit/aef02224ba282a802de65d16c49c1cdb82089dec", "name": ""}, {"url": "https://github.com/AcademySoftwareFoundation/openexr/security/advisories/GHSA-m799-ffc3-8pxc", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-59981漏洞", "_translated": true, "_saved_at": "2026-08-28T08:32:18+00:00", "_first_saved_at": "2026-08-25T21:21:02+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-oa3j-nb5p"}, {"analysis_status": 0, "articles": [{"content": "- 程序未正确处理用户上传的文件，从而导致程序可以读取、处理或存储未经授权的文件\n", "title": "什么是任意文件上传"}, {"content": "- 欺骗攻击：攻击者可以通过发送伪造的文件来欺骗程序，从而导致程序读取、处理或存储未经授权的文件。\n- 文件格式攻击：攻击者可以通过选择特定的文件格式，例如压缩文件或 ZIP 文件，从而利用上传的文件来篡改程序的执行结果或窃取程序中的重要数据。\n", "title": "任意文件上传常见的攻击方式"}, {"content": "- 使用安全文件传输协议 (FTP):使用安全 FTP 协议可以确保上传的文件格式、大小、权限等符合预期，同时可以防止文件读取、篡改或存储漏洞。\n- 使用文件上传过滤器：使用文件上传过滤器可以过滤上传的文件，以确保文件的格式、大小、权限等符合预期，同时可以防止文件读取、篡改或存储漏洞。\n- 使用白名单机制：使用白名单机制可以只允许特定的文件格式、大小、权限等存在的文件上传，从而防止非法文件的上传和攻击。\n- 定期更新和升级程序：定期更新和升级程序可以修复已知的漏洞，并增强程序的安全性。", "title": "如何预防任意文件上传"}], "cnvd_id": "", "cve_id": "CVE-2026-80050", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:H/A:N", "severity": "medium", "base_score": 6.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-434", "description": "ContiNew Admin 是开源的前后端分离中后台管理系统框架，基于 Spring Boot 与 Vue，提供用户权限、文件存储等后台管理能力。\n受影响版本中，MultipartUploadController 映射的 /system/multipart-upload/init、/part、/complete/{uploadId}、/cancel/{uploadId} 四个接口未标注 @SaCheckPermission(\"system:file:upload\")，且 MultipartUploadServiceImpl.initMultipartUpload() 只把 fileName 的扩展名写入元数据，未对照 FileTypeEnum.getAllExtensions() 白名单拒绝。已登录但无文件上传权限的用户可初始化分片、上传分片并完成合并，将 .jsp、.html 等任意扩展名文件写入存储后端；常规 /system/file/upload 路径上的权限与类型校验无法阻止该绕过。\n修复版本中通过为上述四个接口补充 @SaCheckPermission(\"system:file:upload\")，并在 initMultipartUpload() 将扩展名转为小写后与白名单比对、不在名单时拒绝初始化，阻断低权限用户上传危险类型文件。", "effects": [{"comp_name": "top.continew.admin:continew-admin", "ecosystem": "linux", "versions": [{"affected_version": "[4.1.0,4.1.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "任意文件上传", "kind_en": "危险类型文件无限制上传", "last_modified_time": "2026-08-26", "level": "High", "mps_id": "MPS-otuq-m7ij", "poc": false, "poc_url": [], "published_time": "2026-08-26", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-otuq-m7ij", "name": "https://www.oscs1024.com/hd/MPS-otuq-m7ij"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-80050", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-80050"}, {"url": "https://github.com/continew-org/continew-admin", "name": ""}, {"url": "https://github.com/continew-org/continew-admin/blob/v4.1.0/continew-system/src/main/java/top/continew/admin/system/controller/MultipartUploadController.java", "name": ""}, {"url": "https://github.com/continew-org/continew-admin/issues/221", "name": ""}, {"url": "https://www.vulncheck.com/advisories/continew-admin-through-4.1.0-missing-authorization-and-file-type-allowlist-on-multipart-upload-endpoints", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "ContiNew Admin任意文件上传漏洞", "_translated": true, "_saved_at": "2026-08-25T21:21:07+00:00", "_first_saved_at": "2026-08-25T20:21:27+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-otuq-m7ij"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-59186", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:N/I:L/A:H", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:N/I:L/A:H", "cwe": "CWE-787", "description": "OpenEXR 是 EXR 图像格式的参考实现和规范，广泛应用于电影行业。在 3.2.11、3.3.0 到 3.3.12 以及 3.4.0 到 3.4.13 之前的版本中，通过公共 TiledRgbaInputFile RGBA API 读取时，精心设计的平铺 EXR 可以在 32 位/ILP32 版本上触发堆越界写入。该文件使用较小的 40x40 数据窗口，但图块大小为 65537x65537。在 ILP32 上，Array2D\u003cRgba\u003e 图块转换缓冲区大小计算溢出，分配一个小得多的堆缓冲区，并且图块解码会写入超过该分配的内容。此问题已在版本 3.2.11、3.3.13 和 3.4.14 中修复。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-08-26", "level": "High", "mps_id": "MPS-sofw-vbk2", "poc": false, "poc_url": [], " r 以 before_action :admin_required, if: -\u003e { defined?(Dradis::Pro) } 作为管理门禁，而 Community Edition 从不定义 Dradis::Pro，该回调不会安装。任意已认证非管理员用户可通过 POST /addons/echo/providers 创建 address 为任意 HTTP/HTTPS URL 的 Anthropic 提供商，再以 PATCH /addons/echo/agents/:id 把内置 Roslin 代理改绑到该提供商。Provider::Anthropic#build_uri 直接执行 URI(address) 且不追加路径，攻击者可完整控制服务端请求目标，包括 http://169.254.169.254/ 等链路本地地址。随后在项目中触发 AI 交互时，Provider::HttpStreaming#parse_sse_response 对上述 URL 发起 POST；非 2xx 响应体会被写入异常消息，并由 InteractionJob#perform 通过 Turbo Streams 回显到浏览器，形成可读 SSRF。\n修复版本中通过将 Provider::Anthropic#build_uri 改为 URI(\"#{address}/messages\")，使请求路径不再由 address 单独完整指定；同时以 ReplyJob 取代 InteractionJob，失败时只向用户展示 Message::GENERIC_ERROR 通用提示，不再把提供商原始响应体送回浏览器，从而切断可读 SSRF 回显链。", "effects": [{"comp_name": "dradis-ce", "ecosystem": "linux", "versions": [{"affected_version": "[5.1.0,5.3.0)", "min_fixed_version": "5.3.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SSRF", "kind_en": "服务器端请求伪造 (SSRF)", "last_modified_time": "2026-08-26", "level": "High", "mps_id": "MPS-th6l-2o17", "poc": false, "poc_url": [], "published_time": "2026-08-26", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-th6l-2o17", "name": "https://www.oscs1024.com/hd/MPS-th6l-2o17"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-79788", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-79788"}, {"url": "https://github.com/dradis/dradis-ce", "name": ""}, {"url": "https://github.com/dradis/dradis-ce/blob/v5.2.0/engines/dradis-echo/app/controllers/dradis/plugins/echo/providers_controller.rb", "name": ""}, {"url": "https://github.com/dradis/dradis-ce/issues/1641", "name": ""}, {"url": "https://www.vulncheck.com/advisories/dradis-community-edition-5.1.0-through-5.2.0-server-side-request-forgery-via-unrestricted-ai-provider-address", "name": ""}], "scope_influence": "", "tags": ["AI", "应用软件"], "title": "Dradis CE SSRF漏洞", "_translated": true, "_saved_at": "2026-08-25T20:21:25+00:00", "_first_saved_at": "2026-08-25T20:21:25+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-th6l-2o17"}, {"analysis_status": 0, "articles": [{"content": "跨界内存读是指应用程序在读取内存时，未正确验证或限制读取的内存范围。攻击者利用这种漏洞可以读取应用程序内存中的敏感数据，如密码、加密密钥、会话令牌等。常见的原因是由于缓冲区溢出、格式化字符串漏洞或其他内存错误导致的。", "title": "什么是越界读取"}, {"content": "攻击者可以通过不当构造的输入来触发跨界内存读漏洞。攻击者可能会通过向应用程序发送特定的输入，使其读取超过预期的内存区域。攻击者可以利用这个漏洞来获取敏感信息，如其他用户的数据、操作系统的敏感数据或应用程序的内部状态。", "title": "越界读取常见的攻击方式"}, {"content": "- 输入验证和限制：应用程序应对所有输入数据进行严格的验证和限制。确保输入数据的长度、格式和内容符合预期，避免超出缓冲区或访问非预期的内存区域。\n- 内存安全编程实践：开发人员应使用安全的编程实践，如避免使用不安全的函数、正确处理内存分配和释放操作，以及遵循最小特权原则。\n- 使用安全的编程语言和库：选择使用安全性较高的编程语言和库，这些语言和库在内存管理和安全性方面提供了更多的保护机制。\n- 定期进行代码审查和安全测试：定期审查应用程序的代码，并进行安全测试，以发现潜在的跨界内存读漏洞。使用静态代码分析工具和漏洞扫描工具来辅助检测和修复问题。\n- 实施防御性编程技术：应用程序应采用防御性编程技术，如使用随机化地址空间布局（ASLR）、堆栈保护机制（如堆栈溢出保护）和数据执行预防（DEP）等。\n- 及时更新和修补：及时应用程序和操作系统的安全更新和补丁，以确保已知的跨界内存读漏洞得到修复。及时更新相关软件和库，以避免使用已知存在漏洞的版本。", "title": "如何预防越界读取"}], "cnvd_id": "", "cve_id": "CVE-2026-74739", "cvss": {}, "cvss_score": 7.1, "cvss_vector": "", "cwe": "CWE-125", "description": "Linux 内核是开源操作系统内核，net/sched 子系统中的 u32 分类器（cls_u32）用于按报文头 32 位字段匹配流量并绑定到流量类。\n受影响版本中，u32_walk() 会把哈希表节点 struct tc_u_hnode 与键节点 struct tc_u_knode 一并交给 walker。u32_bind_class() 将传入的 fh 无条件转换为 tc_u_knode 并访问 \u0026n-\u003eres，而 tc_u_hnode 不含 tcf_result 成员，导致 tc_cls_bind_class() 越界读取 res-\u003eclassid，形成内核 slab 越界读。\n修复版本中通过在 u32_bind_class() 中以 TC_U32_KEY(n-\u003ehandle) == 0 识别哈希表节点并直接返回，跳过对 tc_u_hnode 的 class 绑定，切断 res-\u003eclassid 越界读取路径。", "effects": [{"comp_name": "linux_kernel", "ecosystem": "linux", "versions": [{"affected_version": "[4.14,6.1.184)", "min_fixed_version": "6.1.184", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.19-rc1,7.1.10)", "min_fixed_version": "7.1.10", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.2-rc1,6.6.153)", "min_fixed_version": "6.6.1 l/CVE-2026-81579", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-81579"}, {"url": "https://cdn.wibu.com/fileadmin/wibu_downloads/security_advisories/AdvisoryWIBU-100031.pdf", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "WibuKey驱动提权漏洞", "_translated": true, "_saved_at": "2026-08-27T13:36:11+00:00", "_first_saved_at": "2026-08-27T13:36:11+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-16ek-t7dr"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-74770", "cvss": {"cvssv31": [{"source": "security_alert@emc.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-78", "description": "Dell PowerProtect One 是戴尔面向企业备份与数据保护场景的商业软件，配套 PowerProtect One DM5510 一体机，用于集中保护、管理和恢复数据，源码不公开。\n受影响版本中，产品在构造操作系统命令时未能正确中和外部输入中的特殊元素，存在操作系统命令注入。具备远程访问能力的低权限攻击者可利用该缺陷在受影响系统上执行代码。\n修复版本中通过厂商安全更新收紧对命令相关输入的处理，阻止恶意特殊元素进入操作系统命令执行路径，官方修复版本为 20.3.0.0。", "effects": [{"comp_name": "powerprotect_one", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,20.3.0.0)", "min_fixed_version": "20.3.0.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-08-27", "level": "High", "mps_id": "MPS-js5x-1fwt", "poc": false, "poc_url": [], "published_time": "2026-08-27", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-js5x-1fwt", "name": "https://www.oscs1024.com/hd/MPS-js5x-1fwt"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-74770", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-74770"}, {"url": "https://www.dell.com/support/kbdoc/en-us/000500902/dsa-2026-369-security-update-for-dell-powerprotect-one-multiple-vulnerabilities", "name": ""}], "scope_influence": "", "tags": [], "title": "PowerProtect One命令注入漏洞", "_translated": true, "_saved_at": "2026-08-26T21:33:56+00:00", "_first_saved_at": "2026-08-26T21:33:56+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-js5x-1fwt"}, {"analysis_status": 0, "articles": [{"content": "在程序试图读取、写入或复制内存缓冲区时，未对边界进行适当的检查和限制。缓冲区是用于存储数据的一块内存区域，当程序试图在缓冲区之外的位置进行操作时，就可能导致缓冲区溢出或下溢。攻击者可以利用这个漏洞来修改程序的执行流、执行任意代码或导致拒绝服务等安全问题。", "title": "什么是缓冲区溢出"}, {"content": "- 缓冲区溢出攻击：攻击者向输入缓冲区中注入超过其容量的数据，导致数据溢出到相邻的内存区域，可能覆盖关键数据、修改变量值或执行恶意代码。\n- 缓冲区下溢攻击：攻击者向输入缓冲区中注入少于其容量的数据，导致数据被读取时越过缓冲区边界，可能泄露敏感信息或破坏程序的正常执行流程。\n- 字符串格式化攻击：攻击者通过控制格式化字符串的输入，可以读取或写入任意内存位置，从而执行恶意操作。", "title": "缓冲区溢出常见的攻击方式"}, {"content": "- 输入验证和边界检查：对于所有接受用户输入的缓冲区操作，确保验证输入数据的长度和内容，以避免缓冲区溢出或下溢。\n- 使用安全的字符串操作函数：使用安全的字符串操作函数（如strncpy、strncat）替代不安全的函数（如strcpy、strcat），这些函数会在操作时自动限制操作的边界。\n- 使用内存安全工具：使用内存安全工具（如内存分析器、静态分析工具）来检测和修复潜在的缓冲区溢出问题。\n- 采用安全编码实践：遵循安全编码实践，如最小特权原则、避免使用不受信任的输入等。\n- 定期更新和修补程序：及时应用程序厂商提供的安全更新和补丁，以修复已知的缓冲区溢出漏洞。\n- 使用编程语言和框架提供的安全功能：利用编程语言和框架提供的安全特性，如内存安全函数、边界检查等。", "title": "如何预防缓冲区溢出"}], "cnvd_id": "", "cve_id": "CVE-2026-81581", "cvss": {"cvssv31": [{"source": "2fc02b1f-71e7-4514-a878-169626f68903", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "cwe": "CWE-119", "description": "WibuKey 是 WIBU-SYSTEMS AG 提供的商业软件保护与授权组件，用于通过加密狗为 Windows 等平台上的应用程序提供许可证保护，其中 WibuKey64.sys 是以系统权限运行的 Windows 内核驱动。\n受影响版本中，Windows 平台的 WibuKey64.sys 将用户输入用于计算指针地址，但未正确校验内存边界，本地低权限攻击者可将指针设置到程序范围之外。该问题通常导致拒绝服务；因驱动以系统权限运行，官方不能排除代码执行与权限提升。\n修复版本中通过厂商安全更新收紧 WibuKey64.sys 对用户输入指针的校验，阻止将指针设置到程序范围之外，切断越界访问路径。", "effects": [{"comp_name": "wibukey", "ecosystem": "linux", "versions": [{"affected_version": "[0,6.71)", "min_fixed_version": "6.71", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "缓冲区溢出", "kind_en": "内存缓冲区范围内的操作限制不当", "last_modified_time": "2026-08-27", "level": "High", "mps_id": "MPS-o4in-drm3", "poc": false, "poc_url": [], "published_time": "2026-08-27", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-o4in-drm3", "name": "https://www.oscs1024.com/hd/MPS-o4in-drm3"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-81581", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-81581"}, {"url": "https://cdn.wibu.com/fileadmin/wibu_downloads/security_advisories/AdvisoryWIBU-100057.pdf", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "WibuKey指针校验漏洞", "_translated": true, "_saved_at": "2026-08-27T13:36:09+00:00", "_first_saved_at": "2026-08-27T13:36:09+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-o4in-drm3"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-81625", "cvss": {"cvssv31": [{"source": "info@cert.vde.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}], "cvssv4": [{"source": "info@cert.vde.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-787", "description": "openvas-scanner 是 Greenbone 开源漏洞扫描引擎，用于执行 NASL 漏洞测试（VT），并被 Greenbone OS 等产品集成。\n受影响版本中，NASL 内置函数 NTLMv1_HASH 由 nasl_ntlmv1_hash 实现，该函数将脚本传入的 passhash 复制到栈上 21 字节数组 p21，未强制 passhash 长度为 16 字节。超长 passhash 会越过 p21 边界写入栈，具备用户权限的远程攻击者可借助恶意或被篡改的 NASL VT 触发栈缓冲区溢出并获取系统完整控制权。\n修复版本中通过在复制前要求 passhash 必须恰好为 16 字节，长度不符则返回错误并拒绝写入，切断超长数据进入栈缓冲的路径。", "effects": [{"comp_name": "greenbone_os", "ecosystem": "linux", "versions": [{"affected_version": "[5.0,25.0.6)", "min_fixed_version": "25.0.6", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "openvas-scanner", "ecosystem": "linux", "versions": [{"affected_version": "[3.0,23.49.4)", "min_fixed_version": "23.49.4", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-08-27", "level": "High", "mps_id": "MPS-plke-jt60", "poc": false, "poc_url": [], "published_time": "2026-08-27", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-plke-jt60", "name": "https://www.oscs1024.com/hd/MPS-plke-jt60"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-81625", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-81625"}, {"url": "https://www.greenbone.net/.well-known/csaf/white/2026/gbsa2026-03.json", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "openvas-scanner栈溢出", "_translated": true, "_saved_at": "2026-08-27T13:35:59+00:00", "_first_saved_at": "2026-08-27T13:35:59+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-plke-jt60"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，从而导致未授权的用户或资源可以被访问或篡改。", "title": "什么是访问控制不当"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n", "title": "访问控制不当常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防访问控制不当"}], "cnvd_id": "", "cve_id": "CVE-2026-81573", "cvss": {"cvssv31": [{"source": "2fc02b1f-71e7-4514-a878-169626f68903", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:H/A:L", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:H/A:L", "cwe": "CWE-284", "description": "CodeMeter Runtime 是 WIBU-SYSTEMS AG 提供的商业软件许可运行时，用于在终端或网络许可证服务器上执行许可证校验与授权，不属于 GitHub 开源项目。\n受影响版本中，当 CodeMeter Runtime 被配置为网络服务器时，配置命令处理逻辑未强制实施网络来源限制，本应仅允许本地或同网客户端执行的配置命令可被任意远程对端调用。攻击者可读取敏感配置数据并覆盖 Server.ini 中的选定项，其中包括 CodeMeter WebAdmin 凭据哈希，进而接管 WebAdmin。\n修复版本中通过收紧配置命令处理对网络来源的校验，阻止远程对端执行仅限本地或同网的配置命令，切断对 Server.ini 及 WebAdmin 凭据哈希的未授权读写。", "effects": [{"comp_name": "codemeter-runtime", "ecosystem": "linux", "versions": [{"affected_version": "[6.00,8.00)", "min_fixed_version": "8.00", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[9.00,9.10)", "min_fixed_version": "9.10", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[8.00,8.41a)", "min_fixed_version": "8.41a", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "访问控制不当", "kind_en": "访问控制不当", "last_modified_time": "2026-08-27", "level": "High", "mps_id": "MPS-ri2c-ayuq", "poc": false, "poc_url": [], "published_time": "2026-08-27", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ri2c-ayuq", "name": "https://www.oscs1024.com/hd/MPS-ri2c-ayuq"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-81573", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-81573"}, {"url": "https://cdn.wibu.com/fileadmin/wibu_downloads/security_advisories/AdvisoryWIBU-103401.pdf", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "CodeMeter配置命令越权", "_translated": true, "_saved_at": "2026-08-27T13:36:15+00:00", "_first_saved_at": "2026-08-27T13:36:15+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ri2c-ayuq"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-81277", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:N/A:L", "severity": "high", "base_score": 8.5}]}, "cvss_score": 8.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:N/A:L", "cwe": "CWE-89", "description": "Suggestion Engine for WooCommerce 是 VillaTheme 发布的开源 WordPress 插件，插件标识为 woo-suggestion-engine，用于在 WooCommerce 商店搜索与页面中展示商品建议。\n受影响版本中，短代码处理函数 viwse_suggestion 将用户提供的 limit 属性直接拼入 top_searched 分支的 SQL LIMIT 子句，VIWSE_Tables::get_product_suggestion 也将 limit 与 product_id 列表以字符串拼接写入查询。具备 Contributor 权限的用户可在文章中插入该短代码并触发盲注，读取站点数据库中的敏感信息。\n修复版本中通过将 limit 转为正整数，并用 $wpdb-\u003eprepare 以 %d 占位符绑定 LIMIT 与 IN 子句参数，阻止短代码输入再作为 SQL 结构执行。", "effects": [{"comp_name": "woo-suggestion-engine", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.0.12)", "min_fixed_version": "2.0.12", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-08-27", "level": "High", "mps_id": "MPS-r1ms-qhgo", "poc": false, "poc_url": [], "published_time": "2026-08-27", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-r1ms-qhgo", "name": "https://www.oscs1024.com/hd/MPS-r1ms-qhgo"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-81277", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-81277"}, {"url": "https://patchstack.com/database/wordpress/plugin/woo-suggestion-engine/vulnerability/wordpress-suggestion-engine-for-woocommerce-plugin-2-0-11-sql-injection-vulnerability?_s_id=cve", "name": ""}], "CWE-134", "description": "CodeMeter Runtime 是 WIBU-SYSTEMS AG 的闭源商业许可保护与授权运行时，用于在 Windows、Linux 和 macOS 上管理 CmDongle、CmActLicense 以及局域网、广域网和云许可服务。\n受影响版本中，日志记录器在特定情况下未净化输入字符串，攻击者可注入 printf 风格格式化说明符。本地可通过 cmu --set-proxy 写入代理值触发；远程可在 CVE-2026-81573 改写 General.ProxyServer 后再触发，造成 CodeMeter 进程崩溃，并泄露进程内存、栈金丝雀等敏感信息。厂商公告说明本公告所列漏洞仅在 CodeMeter Runtime 配置为网络服务器（IsNetworkServer=1，非默认）时受影响。\n修复版本中通过官方安全更新收紧日志记录器对外部输入字符串的处理，阻止格式化说明符进入危险日志路径，消除进程崩溃与内存信息泄露。8.x 修复版本为 8.41a，9.x 修复版本为 9.10；7.x 无独立补丁，需升级到上述修复版本。", "effects": [{"comp_name": "codemeter-runtime", "ecosystem": "linux", "versions": [{"affected_version": "[7.00,8.41a)", "min_fixed_version": "8.41a", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[9.00,9.10)", "min_fixed_version": "9.10", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "使用外部控制的格式字符串", "kind_en": "使用外部控制的格式字符串", "last_modified_time": "2026-08-27", "level": "High", "mps_id": "MPS-etaz-5bk1", "poc": false, "poc_url": [], "published_time": "2026-08-27", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-etaz-5bk1", "name": "https://www.oscs1024.com/hd/MPS-etaz-5bk1"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-81574", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-81574"}, {"url": "https://cdn.wibu.com/fileadmin/wibu_downloads/security_advisories/AdvisoryWIBU-103401.pdf", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "CodeMeter格式化字符串漏洞", "_translated": true, "_saved_at": "2026-08-27T13:36:14+00:00", "_first_saved_at": "2026-08-27T13:36:14+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-etaz-5bk1"}, {"analysis_status": 0, "articles": [{"content": "跨站点请求伪造 (CSRF)通过利用网站对用户请求的信任进行攻击。当用户在网站A登录并在同一浏览器会话中访问网站B时，攻击者可以构造特制的请求并诱使用户执行，以使网站B误以为这些请求是用户合法发起的。\n攻击者通常通过欺骗用户点击恶意链接、在受信任的网站中植入恶意代码或通过钓鱼等手段来实施CSRF攻击，一旦用户执行了恶意请求，攻击者可以以用户的身份执行任意操作，包括更改用户密码、发起资金转账或删除重要数据等。", "title": "什么是CSRF"}, {"content": "- 链接欺骗：攻击者通过向用户发送包含恶意链接的电子邮件或社交媒体消息，诱使用户点击并执行恶意请求。\n- 图片引用攻击：攻击者通过在恶意网站上包含指向目标网站的图片引用，以触发用户浏览器自动发送目标网站的请求。\n- XSS利用：如果目标网站存在XSS漏洞，攻击者可以注入恶意脚本，以使用户在浏览器中执行恶意请求。", "title": "CSRF常见的攻击方式"}, {"content": "- 随机令牌：网站可以在每个请求中包含一个随机生成的令牌（CSRF Token），并验证该令牌的有效性，以确认请求的来源是合法的。\n- SameSite Cookie：使用SameSite属性来限制跨站点请求，将Cookie的发送限制在同一站点上，减少了跨站请求伪造的风险。\n- 双重验证：对于敏感操作，网站可以要求用户进行额外的验证，例如输入验证码、提供第二个因素的身份验证等。\n- 强化浏览器策略：网站可以设置Content-Security-Policy（CSP）头，限制浏览器执行恶意脚本的能力，减少CSRF攻击的风险。\n- 限制用户操作：网站可以要求用户在执行敏感操作之前进行明确的确认或授权，防止恶意请求被误触发。\n- 安全编码实践：开发人员应遵循安全编码实践，对用户输入进行适当的验证和过滤，防止恶意请求的注入。", "title": "如何预防CSRF"}], "cnvd_id": "", "cve_id": "CVE-2026-81273", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:N", "severity": "high", "base_score": 8.1}]}, "cvss_score": 8.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:N", "cwe": "CWE-352", "description": "FluentBooking Pro 是 WP Manage Ninja 出品的 WordPress 预约与日程管理商业插件，用于在站点中创建预约、活动和日程安排。\n受影响版本中，插件存在未认证跨站请求伪造漏洞。未登录攻击者可诱导已登录的高权限用户点击恶意链接、访问伪造页面或提交表单，从而以该用户当前身份执行非预期操作。\n修复版本中通过官方安全更新将 FluentBooking Pro 升级到 2.2.5 及以上，切断该跨站请求伪造利用路径。公开资料未披露更细粒度的源码修改。", "effects": [{"comp_name": "fluent-booking-pro", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.2.5)", "min_fixed_version": "2.2.5", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "CSRF", "kind_en": "跨站请求伪造 (CSRF)", "last_modified_time": "2026-08-27", "level": "High", "mps_id": "MPS-6jxb-e84v", "poc": false, "poc_url": [], "published_time": "2026-08-27", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-6jxb-e84v", "name": "https://www.oscs1024.com/hd/MPS-6jxb-e84v"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-81273", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-81273"}, {"url": "https://patchstack.com/database/wordpress/plugin/fluent-booking-pro/vulnerability/wordpress-fluentbooking-pro-plugin-2-2-4-cross-site-request-forgery-csrf-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "FluentBooking Pro CSRF漏洞", "_translated": true, "_saved_at": "2026-08-27T13:36:18+00:00", "_first_saved_at": "2026-08-27T13:36:18+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-6jxb-e84v"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-32258", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:R/S:C/C:H/I:H/A:N", "severity": "high", "base_score": 8.1}]}, "cvss_score": 8.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:R/S:C/C:H/I:H/A:N", "cwe": "CWE-79", "description": "Winter CMS 是开源 PHP 内容管理系统，Composer 组件 winter/wn-backend-module 提供后台管理界面与编辑器配置能力。\n受影响版本中，拥有 backend.manage_editor 权限的后台用户可在编辑器设置的 Markup Styles 中提交 html_custom_styles。System\\Controllers\\Settings::update_onSave 将该字段写入 EditorSetting 后，compileCss() 用 Less_Parser 编译自定义样式，renderCss() 将未过滤的编译结果输出到后台布局 _custom_styles.php 的 style 标签。攻击者可利用 LESS 的 ~\"...\" 转义写入 \u003c/style\u003e\u003cscript\u003e 片段，使其他后台用户访问任意后台页面时执行存储型跨站脚本。\n修复版本中通过在 EditorSetting::renderCss() 返回编译 CSS 前调用 strip_tags()，剥离注入的 HTML 标签，阻止恶意样式进入后台页面渲染。", "effects": [{"comp_name": "winter/wn-backend-module", "ecosystem": "composer", "versions": [{"affected_version": "[1.2.10,1.2.13)", "min_fixed_version": "1.2.13", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-08-19", "level": "High", "mps_id": "MPS-f0sq-t3y5", "poc": false, "poc_url": [], "published_time": "2026-08-27", "reference_url_list": [{"url": "https://github.com/wintercms/winter/security/advisories/GHSA-vgp4-2fc4-qff2", "name": ""}, {"url": "https://github.com/wintercms/winter/commit/d28f0b9474af79cfaa80eeb9d691f7a7c4469720", "name": ""}, {"url": "https://github.com/advisories/GHSA-vgp4-2fc4-qff2", "name": ""}], "scope_influence": "", "tags": ["php", "开源"], "title": "Winter CMS存储型XSS", "_translated": true, "_saved_at": "2026-08-26T18:53:55+00:00", "_first_saved_at": "2026-08-26T18:53:55+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-f0sq-t3y5"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺
