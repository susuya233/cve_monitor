T:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-121", "description": "T-CPE301K 4G Mini WiFi Router 是 Shenzhen Dbit Network Equipment 推出的便携式 4G 无线路由器，通过 4G SIM 卡创建 Wi-Fi 网络，设备固件未公开，属于闭源嵌入式设备。\n受影响版本中，设备 Web 服务对 /js/common/do_cmd.js 端点的 HTTP POST 请求参数缺少长度校验，已认证攻击者提交携带超长参数的请求，溢出数据覆盖栈上的 PC 与 RA 寄存器，导致系统崩溃并自动重启，形成拒绝服务。\n修复版本中通过，可通过限制设备 Web 管理界面的访问范围、使用高强度管理凭据并关闭不必要的远程管理功能降低风险，需关注厂商后续固件更新并及时升级。", "effects": [{"comp_name": "t-cpe301k_4g_mini_wifi_router", "ecosystem": "linux", "versions": [{"affected_version": "[0,29_09_2026)", "min_fixed_version": "29_09_2026", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "栈缓冲区溢出", "kind_en": "基于堆栈的缓冲区溢出", "last_modified_time": "2026-09-29", "level": "Critical", "mps_id": "MPS-ewf2-sn0a", "poc": false, "poc_url": [], "published_time": "2026-09-29", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ewf2-sn0a", "name": "https://www.oscs1024.com/hd/MPS-ewf2-sn0a"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-7192", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-7192"}, {"url": "https://www.incibe.es/en/incibe-cert/notices/aviso/multiple-vulnerabilities-t-cpe301k-4g-mini-wifi-router-shenzhen-dbit", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "T-CPE301K 路由器栈溢出漏洞", "_translated": true, "_saved_at": "2026-09-29T14:31:39+00:00", "_first_saved_at": "2026-09-29T14:31:39+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ewf2-sn0a"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-95357", "cvss": {"cvssv31": [{"source": "134c704f-9b21-4f2e-91b3-4a467353bcc0", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.6}]}, "cvss_score": 9.6, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:H/I:H/A:H", "cwe": "CWE-787", "description": "Google Chrome 是基于开源 Chromium 项目开发的跨平台网页浏览器，其 GPU 进程通过 ANGLE 与底层图形驱动为网页提供 WebGL 等图形加速能力。\n受影响版本中，WebGL2 脚本调用 texImage3D 对可变（非 immutable 格式）TEXTURE_3D 纹理的既有 mip level 重新定义并增大 depth 时，GPU 进程命令解码器与 ANGLE GL 后端会按原样把该指令下发给 Qualcomm Adreno 驱动，驱动在处理该场景时发生越界写入，恶意网页可借此破坏 GPU 进程内存并可能在 GPU 进程内执行任意代码，Google 将该漏洞评为 Critical。\n修复版本中通过双层缓解切断上述链路：ANGLE 在 Qualcomm Android 设备上检测到该场景时重建原生纹理并以 copyImageSubData 复制既有 level 数据，绕开驱动缺陷路径；GPU 命令解码器对命中 gpu_driver_bug_list 条目 489 的 Qualcomm 设备直接丢弃 GL 上下文，阻止指令到达驱动。修复随 Chrome 154.0.8037.57/.58 发布。", "effects": [{"comp_name": "chromium", "ecosystem": "linux", "versions": [{"affected_version": "影响所有版本", "min_fixed_version": "", "repository": "debian:12", "solutions": [], "upstream": false}, {"affected_version": "影响所有版本", "min_fixed_version": "", "repository": "debian:14", "solutions": [], "upstream": false}, {"affected_version": "(-∞,154.0.8037.57-1)", "min_fixed_version": "154.0.8037.57-1", "repository": "debian:unstable", "solutions": [], "upstream": false}, {"affected_version": "(-∞,154.0.8037.57-1~deb13u1)", "min_fixed_version": "154.0.8037.57-1~deb13u1", "repository": "debian:13", "solutions": [], "upstream": false}]}, {"comp_name": "chromium-common", "ecosystem": "linux", "versions": [{"affected_version": me": ""}, {"url": "https://chromium.googlesource.com/chromium/src/+/4b7f62da7b542428920cc978520620c49b6be583", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "Chrome GPU 越界写入漏洞", "_translated": true, "_saved_at": "2026-09-29T19:44:12+00:00", "_first_saved_at": "2026-09-29T19:44:12+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-mzab-dolw"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2026-94052", "cvss": {}, "cvss_score": 9.1, "cvss_vector": "", "cwe": "CWE-287", "description": "Apache MINA SSHD 是开源 Java 库，用于实现 SSH 客户端与服务端。可选模块 sshd-ldap（Maven 坐标 org.apache.sshd:sshd-ldap）为服务端提供基于 LDAP 的口令与公钥认证。\n受影响版本中，LdapPasswordAuthenticator.authenticate 在调用 resolveAttributes 完成 LDAP 查询后，把结果交给同名受保护方法，该方法不判断属性映射是否为空并直接返回 true。查询未抛出异常时，任意用户名与口令都会被接受，从而绕过口令认证。此缺陷仅在服务端启用 sshd-ldap 并将 LdapPasswordAuthenticator 配置为口令认证器时生效，sshd-core 内置口令认证不受影响。\n修复版本中通过要求 LDAP 查询返回的属性映射非空才判定认证成功，未命中目录条目的请求不再通过，并在拼接 LDAP 过滤器与专有名称时分别按 RFC 4515 与 RFC 4514 编码用户名和口令。", "effects": [{"comp_name": "org.apache.sshd:sshd-ldap", "ecosystem": "maven", "versions": [{"affected_version": "[1.2.0,2.20.0)", "min_f }, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-102992", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:H/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.2}]}, "cvss_score": 9.2, "cvss_vector": "CVSS:4.0/AV:N/AC:H/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-1321", "description": "piscina 是一个 Node.js 工作池实现。在 4.9.4、5.3.2 和 6.0.0-rc.5 之前，Piscina 将 ThreadPool.options 作为继承自 Object.prototype 的普通对象存储在 src/index.ts 中。因此，具有单独原型污染原语的应用程序可以为没有自己的默认值的安全敏感选项提供继承值。继承的 execArgv 值被传递给 Node.js Worker 构造函数，并且可以在工作线程中预加载攻击者控制的代码，继承的 loadBalancer 函数可以在任务调度期间执行，继承的 env 值可以改变工作线程环境。此问题已在版本 4.9.4、5.3.2 和 6.0.0-rc.5 中修复。", "effects": [{"comp_name": "piscina", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,4.9.4)", "min_fixed_version": "4.9.4", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[5.0.0,5.3.2)", "min_fixed_version": "5.3.2", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.0.0-rc.1,6.0.0-rc.5)", "min_fixed_version": "6.0.0-rc.5", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "原型污染", "kind_en": "对象原型属性的控制不当的修改（“原型污染”）", "last_modified_time": "2026-10-01", "level": "Critical", "mps_id": "MPS-y0pz-i8v1", "poc": false, "poc_url": [], "published_time": "2026-10-01", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-y0pz-i8v1", "name": "https://www.oscs1024.com/hd/MPS-y0pz-i8v1"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-102992", "name": "https://nvd.nist.gov/vuln/deta 、类型检查和格式验证等。\r\n- 使用参数化查询或预编译语句：对于数据库查询操作，应该使用参数化查询或预编译语句，确保输入数据不会被误认为是执行代码。\r\n- 最小特权原则：应用程序在执行操作系统命令或动态代码时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。\r\n- 安全编码实践：开发人员应该采用安全编码实践，包括避免使用eval函数、避免拼接用户输入的字符串作为代码执行等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止代码注入攻击。", "title": "如何预防代码注入"}], "cnvd_id": "", "cve_id": "CVE-2026-92966", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N", "severity": "critical", "base_score": 9.1}]}, "cvss_score": 9.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N", "cwe": "CWE-94", "description": "LatePoint（Appointment Booking Plugin – LatePoint | Calendar \u0026 Scheduling for WordPress）是一款在 WordPress.org 官方目录发布、遵循 GPLv3 授权的开源预约排期插件，面向服务型企业提供在线预约、日历排期、客户自助中心与在线支付能力，官方数据显示安装量超过 10 万个站点。\n受影响版本中，未授权访客可通过插件的 latepoint_route_call 路由进入预约流程，提交的 customer[first_name]、customer[last_name] 仅经 sanitize_text_field() 清洗后写入客户记录，该函数不移除方括号，短代码载荷得以存入数据库；当站点页面渲染 Customer Cabinet 区块时，OsBlockHelper::render_customer_dashboard() 调用 do_shortcode() 执行 [latepoint_customer_dashboard]，看板视图以 esc_html($customer-\u003efull_name) 输出客户姓名，esc_html 不会编码方括号，WordPress 核心 the_content 过滤器在优先级 11 上再次运行 do_shortcode，把姓名中的方括号语法重新解析为短代码并执行，未授权攻击者可借此执行站点内任意已注册短代码。\n修复版本中通过在 OsShortcodesHelper::shortcode_latepoint_customer_dashboard() 返回看板输出前调用新增的 encode_shortcode_delimiters()，将输出中的 [、] 统一编码为 \u0026#091;、\u0026#093; 实体，优先级 11 的 do_shortcode 扫描无法再匹配到短代码语法，存储在客户姓名中的载荷不再被执行。", "effects": [{"comp_name": "latepoint", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,5.7.1)", "min_fixed_version": "5.7.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "代码注入", "kind_en": "代码生成控制不当（“代码注入”）", "last_modified_time": "2026-10-01", "level": "Critical", "mps_id": "MPS-kbto-m2z7", "poc": false, "poc_url": [], "published_time": "2026-10-01", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-kbto-m2z7", "name": "https://www.oscs1024.com/hd/MPS-kbto-m2z7"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-92966", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-92966"}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/c9a030c0-6129-40b0-81da-4c420929d198?source=cve", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/latepoint/tags/5.7.0/lib/helpers/blocks_helper.php#L234", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/latepoint/tags/5.7.0/lib/views/customer_cabinet/dashboard.php#L19", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/latepoint/tags/5.7.0/lib/models/customer_model.php#L386", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/latepoint/tags/5.7.1/lib/helpers/blocks_helper.php", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "LatePoint 任意短代码执行漏洞", "_translated": true, "_saved_at": "2026-10-01T08:09:08+00:00", "_first_saved_at": "2026-10-01T08:09:08+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-kbto-m2z7"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-87741", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-78", "description": "ConvertPlus（插件目录名 convertplug）是 Brainstorm Force 发布的 WordPress 弹窗插件，以 GPL 许可分发，用于创建模态弹窗、通知栏和滑入表单，官方没有公开的 Git 仓库。\n受影响版本中，Subscriber 及以上已登录用户可访问仅挂在 wp_ajax_cp_display_preview_modal 的预览回调。Convert_Plug::cp_display_preview_modal 会引入 modules/modal/style-preview-ajax.php；该文件把 nonce 校验放在 isset($_REQUEST['cp_admin_page_nonce']) 条件内，请求不携带 cp_admin_page_nonce 时继续执行，且没有能力检查。$_GET['style'] 经 sanitize_text_field 后被拼进 [smile_modal] 短代码并传入 do_shortcode，该过滤不会去掉短代码分隔符，调用方可以插入第二个受控的 [smile_modal]，使 smile_modal_popup 对 base64 解码后的 settings_encoded 调用不带 allowed_classes 的 maybe_unserialize，注入 PHP 对象。插件自身没有已知 POP 链，仅当其他插件或主题提供 POP 链时，才可能删除任意文件、读取敏感数据或执行代码。\n修复版本中通过发布 3.6.4 修复该漏洞。Wordfence 将该版本标为补丁版本，公开材料未披露具体源码差异。", "effects": [{"comp_name": "convertplug", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,3.6.4)", "min_fixed_version": "3.6.4", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-09-29", "level": "High", "mps_id": "MPS-5rlv-qbdu", "poc": false, "poc_url": [], "published_time": "2026-09-29", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-5rlv-qbdu", "name": "https://www.oscs1024.com/hd/MPS-5rlv-qbdu"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-87741", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-87741"}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/286b4dde-974d-4bb5-8a7e-57c849beaab1?source=cve", "name": ""}, {"url": "https://convertpro.net", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "ConvertPlus对象注入", "_translated": true, "_saved_at": "2026-09-28T21:00:15+00:00", "_first_saved_at": "2026-09-28T21:00:15+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-5rlv-qbdu"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-86950", "cvss": {"cvssv31": [{"source": "134c704f-9b21-4f2e-91b3-4a467353bcc0", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "cwe": "CWE-787", "description": "CoreGraphics 是 Apple 操作系统中的闭源图形框架，随 iOS、iPadOS 与 macOS 提供，用于图形绘制及相关文件处理。\n受影响版本中，CoreGraphics 在处理恶意构造的文件时存在越界写入，文件内容进入解析流程后可越过边界改写内存，并可能导致任意代码执行。Apple 已获知该问题可能已在 iOS 27 之前的系统版本上，于针对特定目标人员的高度复杂攻击中被利用。\n修复版本中通过加强边界检查阻止解析过程越过合法边界写入内存，从而消除该任意代码执行路径。", "effects": [{"comp_name": "ipados", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,26.7.1)", "min_fixed_version": "26.7.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "iphone_os", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,26.7.1)", "min_fixed_version": "26.7.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "macOS Equipment 的 T-CPE301K 是闭源便携式 4G Mini WiFi 路由器，用于通过 SIM 卡组建无线网络。\n受影响版本中，设备 Telnet 服务（TCP 23 端口）使用预置静态凭据。与设备处于同一网络的攻击者可使用这些凭据登录并获得完整 root 权限。\n修复版本中通过移除或更换 Telnet 预置静态凭据切断未授权 root 登录。INCIBE 公告写明该修复目前尚未发布，也未提供固件版本号或修复代码，使用侧应限制不可信主机访问 TCP 23 端口。", "effects": [{"comp_name": "t-cpe301k_4g_mini_wifi_router", "ecosystem": "linux", "versions": [{"affected_version": "[0,29_09_2026)", "min_fixed_version": "29_09_2026", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "使用硬编码的凭证", "kind_en": "使用硬编码凭证", "last_modified_time": "2026-09-29", "level": "High", "mps_id": "MPS-ajci-muhe", "poc": false, "poc_url": [], "published_time": "2026-09-29", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ajci-muhe", "name": "https://www.oscs1024.com/hd/MPS-ajci-muhe"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-7193", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-7193"}, {"url": "https://www.incibe.es/en/incibe-cert/notices/aviso/multiple-vulnerabilities-t-cpe301k-4g-mini-wifi-router-shenzhen-dbit", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "T-CPE301K硬编码凭据", "_translated": true, "_saved_at": "2026-09-29T14:31:37+00:00", "_first_saved_at": "2026-09-29T14:31:37+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ajci-muhe"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-102437", "cvss": {"cvssv31": [{"source": "cve@gitlab.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "cwe": "CWE-78", "description": "Reasonix（DeepSeek-Reasonix）是 esengine 发布的开源大模型编程工作台，包含 Reasonix Studio 与 npm 包 reasonix，用于在本地工作区查看代码变更并代表用户调用 Git。\n受影响版本中，Reasonix Studio 的 gitcmd.Command 只用固定 -c 与 --no-ext-diff/--no-textconv 约束仓库配置程序，源码注释写明 filter.\u003cdriver\u003e.clean/smudge 不在该覆盖范围内。本地服务 changeDiff 经 gitstatus.Diff 执行 git diff 时，Git 仍按 .gitattributes 运行 .git/config 中的 clean 过滤器，从而以当前用户权限执行命令。同期 npm 包 reasonix 的 filterNeutralizingConfig 只在 diff 子命令上按配置段名清空 clean 与 process，不清空 smudge，且不跟随 include.path；桌面端 WorkspaceChangeDetail 经该函数发起 git diff。\n修复版本中通过在 driverOverrides 中先用 git config --show-scope 枚举 local 与 worktree 范围的 filter 驱动，再为每个驱动追加 -c filter.\u003cname\u003e.clean=、smudge=、process= 与 required=false，使宿主 Git 调用不再执行仓库定义的内容过滤器。", "effects": [{"comp_name": "Reasonix Studio", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.21.0)", "min_fixed_version": "2.21.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "reasonix", "ecosystem": "npm", "versions": [{"affected_version": "(-∞,1.39.3)", "min_fixed_version": "1.39.3", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-09-29", "level": "High", "mps_id": "MPS-gvbq-mr49", "poc": false, "poc_url": [], "published_time": "2026-09-29", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-gvbq-mr49", "name": "https://www.oscs1024.com/hd/MPS-gvbq-mr49"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-102437", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-102437"}, {"url": "https://github.com/esengine/DeepSeek-Reasonix/security/advisories/GHSA-grg2-7gc6-36m6", "name": ""}, {"url": "https://github.com/esengine/DeepSeek-Reasonix", "name": ""}], "scope_influence": "", "tags": ["AI", "npm", "开源"], "title": "Reasonix命令注入漏洞", "_translated": true, "_saved_at": "2026-09-29T14:31:43+00:00", "_first_saved_at": "2026-09-29T14:31:43+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-gvbq-mr49"}, {"analysis_status": 0, "articles": [{"content": "- 编写代码时没有正确处理输入数据或没有正确验证用户输入而导致的。", "title": "什么是关键资源权限分配不当"}, {"content": "- 弱密码或未使用的密码：当管理员或系统管理员在创建帐户时，没有使用强密码或未对帐户进行密码更新时，可能会发生这种情况。弱密码可能会被黑客破解或通过其他方式轻松访问系统。\n- 未正确配置权限：在系统中，不同的资源通常需要不同的权限才能访问。如果管理员未正确配置权限，那么未经授权的用户可能会通过欺骗系统或利用其他漏洞来访问关键资源。\n- 权限重用：在某些情况下，管理员可能会将某些权限分配给某个用户，但这些权限并未被正确地限制或授权给该用户。如果其他用户尝试使用这些权限访问关键资源，那么他们可能会获得未经授权的访问权限。\n- 未正确验证用户输入：当开发人员没有正确验证用户输入时，可能会发生这种情况。例如，如果开发人员未正确过滤用户输入的用户名或密码，那么黑客可能会利用这些信息轻松地访问系统。\n", "title": "关键资源权限分配不当常见的攻击方式"}, {"content": "- 使用强密码：管理员应该使用强密码来保护系统，并定期更改密码。强密码应该包括数字、字母和符号，并且应该不同于其他帐户使用的密码。\n- 正确配置权限：管理员应该正确配置系统中不同资源所需的权限。用户可以被授予访问特定资源的权限，但不应该被授予访问其他资源的权限。\n- 权限限制：管理员应该使用权限限制来限制用户对特定资源的访问。例如，用户可以被授予访问特定文件夹的权限，但不能访问其他文件夹。\n- 输入验证：开发人员应该正确验证用户输入。例如，他们可以过滤用户输入的用户名和密码，以确保它们符合预期的格式。\n- 安全培训：管理员和用户应该接受安全培训，以便了解如何识别和避免常见的安全漏洞，例如不正确权限授予漏洞。\n- 定期更新和修补软件：系统软件和应用程序应该定期更新和修补，以确保它们不受最新安全漏洞的影响。", "title": "如何预防关键资源权限分配不当"}], "cnvd_id": "", "cve_id": "CVE-2026-73598", "cvss": {"cvssv31": [{"source": "security_alert@emc.com", "vector": "CVSS:3.1/AV:L/AC:H/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:H/PR:L/UI:N/S:C/C:H/I:H/A:H", "cwe": "CWE-732", "description": "Dell Secure Connect Gateway（SCG）Policy Manager 是 Dell 闭源商业组件，随 Secure Connect Gateway Appliance 提供，用于集中管理安全连接策略。\n受影响版本中，该组件对关键资源分配了不正确的权限。已具备本地低权限的攻击者可以利用该权限缺陷提升权限，官方评定其影响可超出组件安全边界，并同时破坏机密性、完整性与可用性。\n修复版本中通过将 Dell Policy Manager for Secure Connect Gateway Appliance 更新到 5.36.00.16 及以上版本修正关键资源权限分配，官方未提供其他缓解措施，也未公开具体修复代码。", "effects": [{"comp_name": "policy_manager_for_secure_connect_gateway", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,5.36.00.16)", "min_fixed_version": "5.36.00.16", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "关键资源权限分配不当", "kind_en": "关键资源的权限分配不正确", "last_modified_time": "2026-09-29", "level": "High", "mps_id": "MPS-jzrq-c86n", "poc": false, "poc_url": [], "published_time": "2026-09-29", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-jzrq-c86n", "name": "https://www.oscs1024.com/hd/MPS-jzrq-c86n"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73598", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73598"}, {"url": "https://www.dell.com/support/kbdoc/en-ca/000503592/dsa-2026-385-security-update-for-dell-secure-connect-gateway-policy-manager-multiple-vulnerabilities?msockid=3021cac2195069ed3194ddad186a68f9", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "策略管理器权限提升漏洞", "_translated": true, "_saved_at": "2026-09-29T14:31:42+00:00", "_first_saved_at": "2026-09-29T14:31:42+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-jzrq-c86n"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-102004", "cvss": {"cvssv31": [{"source": "0bf9931a-6ebf-4f48-bd14-39ee5e1d61f8", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-787", "description": "Wind River VxWorks 7 是 Wind River Systems 的商业闭源实时操作系统，用于嵌入式设备的任务调度、内存管理与系统调用。\n受影响版本中，特定系统调用参数进入内存管理子系统后会造成内存破坏。该问题被归类为越界写入（CWE-787）。本地低权限调用方可触发该路径，并影响机密性、完整性与可用性。公开记录未披露具体系统调用名称、参数字段或源码位置。\n修复版本中通过发布 26.09，消除特定系统调用参数导致的内存管理子系统内存破坏。公开材料未披露具体代码修改。", "effects": [{"comp_name": "vxworks", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,26.09)", "min_fixed_version": "26.09", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-09-29", "level": "High", "mps_id": "MPS-yi62-bd95", "poc": false, "poc_url": [], "published_time": "2026-09-29", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-yi62-bd95", "name": "https://www.oscs1024.com/hd/MPS-yi62-bd95"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-102004", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-102004"}, {"url": "https://support2.windriver.com/index.php?page=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "VxWorks内存破坏漏洞", "_translated": true, "_saved_at": "2026-09-28T21:00:17+00:00", "_first_saved_at": "2026-09-28T21:00:17+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-yi62-bd95"} _requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "UNIX符号链接跟随", "kind_en": "UNIX 符号链接 (Symlink) 以下", "last_modified_time": "2026-09-29", "level": "High", "mps_id": "MPS-21bo-mp6y", "poc": false, "poc_url": [], "published_time": "2026-09-29", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-21bo-mp6y", "name": "https://www.oscs1024.com/hd/MPS-21bo-mp6y"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-97024", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-97024"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-97024", "name": ""}, {"url": "https://bugzilla.redhat.com/show_bug.cgi?id=2542625", "name": "RHBZ#2542625"}, {"url": "https://github.com/flatpak/flatpak/security/advisories/GHSA-8xgq-v545-vgvf", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Flatpak符号链接覆盖漏洞", "_translated": true, "_saved_at": "2026-09-29T07:46:02+00:00", "_first_saved_at": "2026-09-29T07:46:02+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-21bo-mp6y"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026 d/MPS-53mv-0hqp"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-102365", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-102365"}, {"url": "https://github.com/LinYuanyi1/cve-request-poc/blob/114b3f0d149e50a7678f591bf8043399fc9ac96c/mall4j/A02_admin_useraddr_bfla.py", "name": ""}, {"url": "https://github.com/gz-yami/mall4j", "name": ""}, {"url": "https://github.com/gz-yami/mall4j/blob/ffc672fc1aa4320ce02d0b93853bb456ae0a4dae/yami-shop-admin/src/main/java/com/yami/shop/admin/controller/UserAddrController.java#L46-L61", "name": ""}, {"url": "https://www.vulncheck.com/advisories/mall4j-through-4.0-missing-authorization-in-admin-user-address-endpoints", "name": "VulnCheck Advisory: mall4j through 4.0 Missing Authorization in Admin User Address Endpoints"}], "scope_influence": "", "tags": ["应用软件"], "title": "Mall4j地址越权漏洞", "_translated": true, "_saved_at": "2026-09-29T01:23:33+00:00", "_first_saved_at": "2026-09-29T01:23:33+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-53mv-0hqp"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "cnvd_id": "", "cve_id": "CVE-2026-74222", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:L/A:H", "severity": "high", "base_score": 8.2}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:L/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:L/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-416", "description": "U-Boot 是开源引导加载程序，用于嵌入式设备启动、网络引导和固件加载，其 lwIP wget 实现可通过 HTTP/HTTPS 将远程文件下载到指定内存地址。\n受影响版本中，lwIP wget 接收回调 httpc_recv_cb() 在 store_block() 写入 HTTP 数据失败时调用 altcp_abort() 释放连接 PCB，但返回 ERR_BUF 而非 ERR_ABRT，TCP 输入路径随后访问已释放内存并使引导加载程序崩溃。\n修复版本中通过将存储失败路径的返回值改为 ERR_ABRT，使 TCP 输入路径在连接中止后不再继续使用已释放的 PCB，消除该释放后使用崩溃。", "effects": [{"comp_name": "u-boot", "ecosystem": "linux", "versions": [{"affected_version": "[2025.07,2026.10-rc5)", "min_fixed_version": "2026.10-rc5", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "UAF", "kind_en": "免费后使用", "last_modified_time": "2026-09-30", "level": "High", "mps_id": "MPS-0br9-kc27", "poc": false, "poc_url": [], "published_time": "2026-09-30", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-0br9-kc27", "name": "https://www.oscs1024.com/hd/MPS-0br9-kc27"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-74222", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-74222"}, {"url": "https://github.com/u-boot/u-boot/commit/2d94618a58aeb7630f18eee33419ce48d0fd3616", "name": ""}, {"url": "https://github.com/u-boot/u-boot/blob/v2026.07/net/lwip/wget.c#L194", "name": ""}, {"url": "https://github.com/u-boot/u-boot", "name": ""}, {"url": "https://www.vulncheck.com/advisories/u-boot-before-2026.10-rc5-use-after-free-in-lwip-wget-receive-callback", "name": "VulnCheck Advisory: U-Boot before 2026.10-rc5 Use-After-Free in lwIP wget Receive Callback"}], "scope_influence": "", "tags": ["应用软件"], "title": "U-Boot wget释放后使用漏洞", "_translated": true, "_saved_at": "2026-09-29T23:21:21+00:00", "_first_saved_at": "2026-09-29T23:21:21+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-0br9-kc27"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-74221", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:L/A:H", "severity": "high", "base_score": 8.2}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:L/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:L/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-195", "description": "U-Boot 是开源引导加载程序，用于在嵌入式设备上从本地存储或网络加载操作系统内核与启动镜像，其 NFS 客户端可在 CONFIG_CMD_NFS 启用后通过 nfs 命令拉取远程文件。\n受影响版本中，NFS 客户端在处理服务器 READLINK 应答时，nfs_readlink_reply() 将符号链接长度写入有符号 int 变量 rlen。原边界检查以 rlen 与报文头偏移相加后再和 len 比较，负长度会使该比较通过；随后 rlen 作为无符号长度传入 memcpy()，相对路径分支中 pathlen 与 rlen 相加同样无法拦住负值，从而向 nfs_path_buff 越界拷贝并破坏相邻内存，导致引导程序崩溃。恶意 NFS 服务器可先对 READ 返回 ISDIR 将客户端切入 READLINK 状态，再下发负长度或超出报文范围的符号链接应答。\n修复版本中通过把 rlen 改为无符号 u32，从符号链接数据起点计算 data_offset 并拒绝超出已接收报文的长度，同时用无符号减法检查 nfs_path_buff 剩余空间，阻止负长度与超长长度进入 memcpy()，消除该缓冲溢出。", "effects": [{"comp_name": "u-boot", "ecosystem": "linux", "versions": [{"affected_version": "[0,2026.10-rc5)", "min_fixed_version": "2026.10-rc5", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "有符号至无符号转换错误", "kind_en": "有符号到无符号转换错误", "last_modified_time": "2026-09-30", "level": "High", "mps_id": "MPS-8hfn-pam9", "poc": false, "poc_url": [], "published_time": "2026-09-30", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-8hfn-pam9", "name": "https://www.oscs1024.com/hd/MPS-8hfn-pam9"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-74221", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-74221"}, {"url": "https://github.com/u-boot/u-boot/commit/1c0aff3a5fbfeee7a8948f624e0b8554e6e0d8fd", "name": ""}, {"url": "https://github.com/u-boot/u-boot/blob/v2026.07/net/nfs-common.c#L643", "name": ""}, {"url": "https://github.com/u-boot/u-boot", "name": ""}, {"url": "https://www.vulncheck.com/advisories/u-boot-before-2026.10-rc5-buffer-overflow-via-nfs-readlink", "name": "VulnCheck Advisory: U-Boot before 2026.10-rc5 Buffer Overflow via NFS READLINK"}], "scope_influence": "", "tags": ["应用软件"], "title": "U-Boot NFS缓冲溢出", "_translated": true, "_saved_at": "2026-09-29T23:21:24+00:00", "_first_saved_at": "2026-09-29T23:21:24+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-8hfn-pam9"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-74220", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:L/A:H", "severity": "high", "base_score": 8.2}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:L/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:L/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-195", "description": "U-Boot 是开源引导加载程序，广泛用于嵌入式设备启动，并支持通过 NFS 从网络加载内核或镜像。\n受影响版本中，nfs_read_reply() 把 NFS READ 应答里的数据长度读入有符号整数 rlen，再用应答头相对 rpc_pkt 的指针差加上 rlen 与报文长度比较。在 LP64 目标上指针减法得到 64 位 ptrdiff_t，长度最高位置位会使 rlen 为负并让校验通过；随后 store_block() 将该值按无符号整数交给 memcpy，可从约 1152 字节的 rpc_pkt 栈缓冲向 image_load_addr 复制约 2GB 数据，造成引导程序崩溃或内存损坏。\n修复版本中通过将 rlen 改为无符号 u32、拒绝超过 NFS_READ_SIZE 的长度，并从数据起始位置相对已收报文做边界检查，切断恶意长度进入 memcpy 的路径。", "effects": [{"comp_name": "u-boot", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2026.10-rc5)", "min_fixed_version": "2026.10-rc5", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "有符号至无符号转换错误", "kind_en": "有符号到无符号转换错误", "last_modified_time": "2026-09-30", "level": "High", "mps_id": "MPS-gdqm-zxe0", "poc": false, "poc_url": [], "published_time": "2026-09-30", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-gdqm-zxe0", "name": "https://www.oscs1024.com/hd/MPS-gdqm-zxe0"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-74220", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-74220"}, {"url": "https://github.com/u-boot/u-boot/commit/0bbf09859658b8cc9ac13be41af23b516b8ef69a", "name": ""}, {"url": "https://github.com/u-boot/u-boot/blob/v2026.07/net/nfs-common.c#L695", "name": ""}, {"url": "https://github.com/u-boot/u-boot", "name": ""}, {"url": "https://www.vulncheck.com/advisories/u-boot-before-2026.10-rc5-buffer-overflow-via-nfs-read-reply", "name": "VulnCheck Advisory: U-Boot before 2026.10-rc5 Buffer Overflow via NFS READ Reply"}], "scope_influence": "", "tags": ["应用软件"], "title": "U-Boot NFS缓冲溢出", "_translated": true, "_saved_at": "2026-09-29T23:21:23+00:00", "_first_saved_at": "2026-09-29T23:21:23+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-gdqm-zxe0"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-72507", "cvss": {"cvssv31": [{"source": "ics-cert@hq.dhs.gov", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:C/C:H/I:L/A:H", "severity": "critical", "base_score": 9}], "cvssv4": [{"source": "ics-cert@hq.dhs.gov", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:L/VA:H/SC:H/SI:L/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.5}]}, "cvss_score": 8.5, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:L/VA:H/SC:H/SI:L/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-89", "description": "Toptech Systems TMS7 与 TopHAT 是闭源商业终端管理软件。TMS7 提供基于 Web 的库存核算、配额管理以及装卸与门禁控制，TopHAT 用于集中管理多个 TMS7 站点的主数据与报表。\n受影响版本中，平衡报表分区的产品汇总报表功能对 reportType 参数存在基于时间的盲注 SQL 注入。具备高权限的远程攻击者无需额外用户交互即可通过该参数读取关键数据，并造成低完整性影响与高可用性影响。\n修复版本中通过发布 7.8 消除该时间盲注 SQL 注入；公开资料未披露具体代码修改。", "effects": [{"comp_name": "tms7", "ecosystem": "linux", "versions": [{"affected_version": "[7.6.3,7.6.3]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "tophat", "ecosystem": "linux", "versions": [{"affected_version": "[7.6.3,7.6.3]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": sv4": [{"source": "ics-cert@hq.dhs.gov", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:L/VA:H/SC:H/SI:L/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.5}]}, "cvss_score": 8.5, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:L/VA:H/SC:H/SI:L/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-89", "description": "Toptech Systems TMS7 与 TopHAT 是闭源商业终端管理软件。TMS7 通过 Web 应用管理终端库存核算、业务分配、门禁、装卸栈台与提单打印，TopHAT 用于集中管理多个 TMS7 站点的分配与主数据。\n受影响版本中，业务分配搜索功能的 supplier_no 参数存在基于时间的盲注 SQL 注入。具备高权限的远程攻击者无需用户交互即可利用该参数影响后端数据库查询，官方评定可导致高机密性影响、低完整性影响和高可用性影响。\n修复版本中通过发布 7.8 消除该时间盲注，并将 7.8 标记为不受影响版本。公开资料未披露具体源码修改。", "effects": [{"comp_name": "TMS7", "ecosystem": "linux", "versions": [{"affected_version": "[7.6.3,7.6.3]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "TopHAT", "ecosystem": "linux", "versions": [{"affected_version": "[7.6.3,7.6.3]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-09-30", "level": "High", "mps_id": "MPS-f0gy-vp4k", "poc": false, "poc_url": [], "published_time": "2026-09-30", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-f0gy-vp4k", "name": "https://www.oscs1024.com/hd/MPS-f0gy-vp4k"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-72510", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-72510"}, {"url": "https://www.toptech.com/blog/tms7-version-7-8-strengthens-security", "name": ""}, {"url": "https://www.cisa.gov/news-events/ics-advisories/icsa-26-272-02", "name": ""}, {"url": "https://github.com/cisagov/CSAF/blob/develop/csaf_files/OT/white/2026/icsa-26-272-02.json", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "TMS7 SQL注入漏洞", "_translated": true, "_saved_at": "2026-09-29T23:21:25+00:00", "_first_saved_at": "2026-09-29T23:21:25+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-f0gy-vp4k"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2026-93994", "cvss": {}, "cvss_score": 8.1, "cvss_vector": "", "cwe": "CWE-287", "description": "Apache MINA SSHD 是开源 Java 库，用于实现 SSH 客户端与服务端协议，sshd-core 模块提供服务端用户认证能力。\n受影响版本中，服务端可将 AUTH_METHODS 配置为 publickey,publickey 以要求两次不同公钥认证，但 UserAuthPublicKey.doAuth 未保存已成功验证的公钥，也未拒绝重复提交。已持有一对授权密钥的用户把同一公钥连续提交两次即可通过该策略并完成登录，造成部分认证绕过。\n修复版本中通过在 ServerSession 上记录 AUTHENTICATED_KEYS，并在 doAuth 中以 KeyUtils.compareKeys 拒绝已验证过的公钥（证书比较 certPubKey），使单密钥无法再满足多公钥策略。", "effects": [{"comp_name": "org.apache.sshd:sshd-core", "ecosystem": "maven", "versions": [{"affected_version": "[3.0.0-M1,3.0.0-M6)", "min_fixed_version": "3.0.0-M6", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "(-∞,2.20.0)", "min_fixed_version": "2.20.0", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "身份验证不当", "kind_en": "认证不当", "last_modified_time": "2026-09-30", "level": "High", "mps_id": "MPS-e008-8a85", "poc": false, "poc_url": [], "published_time": "2026-09-30", "reference_url_list": [{"url": "https://www.openwall.com/lists/oss-security/2026/09/29/33", "name": ""}, {"url": "https://mina.apache.org/", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-93994", "name": ""}, {"url": "https://github.com/apache/mina-sshd/commit/990e057e26dc602e9887e2df53bc87c7b316a571", "name": ""}, {"url": "https://github.com/apache/mina-sshd/releases/tag/sshd-2.20.0", "name": ""}, {"url": "https://github.com/apache/mina-sshd/releases/tag/sshd-3.0.0-M6", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "MINA SSHD多公钥认证绕过", "_translated": true, "_saved_at": "2026-09-29T19:44:07+00:00", "_first_saved_at": "2026-09-29T19:44:07+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-e008-8a85"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-84409", "cvss": {"cvssv31": [{"source": "ics-cert@hq.dhs.gov", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.5}], "cvssv4": [{"source": "ics-cert@hq.dhs.gov", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.7}]}, "cvss_score": 7.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-79", "description": "Lantronix G520 Series 是闭源物联网蜂窝网关产品，提供工业、交通和安全场景下的远程连接与 Web 管理界面。\n受影响版本中，设备更新机制通过未加密 HTTP 获取软件更新元数据，并保存其中部分内容供后续使用。管理接口在 JSON 响应中返回该存储值，负责展示更新信息的 Web 界面将此值直接作为 HTML 插入页面，使攻击者能够影响的元数据被解释为脚本。同一已认证来源还提供可执行 root 权限系统命令的接口，脚本可在设备管理上下文中执行任意代码。\n修复版本中通过发布 2.6.0.7R6 固件修复该跨站脚本问题，阻断更新元数据在管理上下文中触发 root 级任意代码执行的路径；公开资料未披露具体源码改动。", "effects": [{"comp_name": "G520 Series", "ecosystem": "linux", "versions": [{"affected_version": "[2.6.0.4R6_stable,2.6.0.4R6_stable]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitab P、G527、G528）是商用蜂窝网关固件，用于工业和关键基础设施场景的远程联网与设备管理。厂商以签名固件镜像分发该产品，公开材料未提供可复核的源码仓库。\n受影响版本中，更新机制会把未授权软件包接受为可信包。启动过程中的 done 函数先关闭 OPKG 配置里的签名校验，再从可写且未签名的软件源恢复可选软件包；公开分发的 SDK 包含生产私钥，其对应公钥被稳定版和测试版固件信任。攻击者能够向设备提供恶意软件包时，可在安装过程中以 root 权限执行任意代码。\n修复版本中通过发布固件 2.6.0.7R6 消除公告所述的软件包真实性缺陷，使未授权软件包不再被接受为可信包。公开材料未披露具体源码修改。", "effects": [{"comp_name": "g520_series", "ecosystem": "linux", "versions": [{"affected_version": "[2.6.0.4R6,2.6.0.7R6)", "min_fixed_version": "2.6.0.7R6", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "密码学签名的验证不恰当", "kind_en": "密码签名验证不当", "last_modified_time": "2026-09-30", "level": "High", "mps_id": "MPS-uos0-q6yr", "poc": false, "poc_url": [], "published_time": "2026-09-30", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-uos0-q6yr", "name": "https://www.oscs1024.com/hd/MPS-uos0-q6yr"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-91191", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-91191"}, {"url": "https://ltrxdev.atlassian.net/wiki/spaces/LTRXTS/pages/1889828865/Latest+firmware+for+the+G520+Series+G526+G526RP+G527+G528", "name": ""}, {"url": "https://www.lantronix.com/technical-support/security-updates/vulnerability-disclosure-policy/vulnerability-library/", "name": ""}, {"url": "https://www.cisa.gov/news-events/ics-advisories/icsa-26-272-01", "name": ""}, {"url": "https://github.com/cisagov/CSAF/blob/develop/csaf_files/OT/white/2026/icsa-26-272-01.json", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "G520固件签名校验绕过", "_translated": true, "_saved_at": "2026-09-29T23:21:18+00:00", "_first_saved_at": "2026-09-29T23:21:18+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-uos0-q6yr"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-103088", "cvss": {"cvssv31": [{"source": "cve@mitre.org", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "cwe": "CWE-24", "description": "Handlebars.java 是开源 Java 模板引擎，handlebars-springmvc 模块向 Spring MVC 提供 HandlebarsViewResolver 与 SpringTemplateLoader，用于按配置前缀加载并渲染服务端模板。\n受影响版本中，handlebars-springmvc 4.5.3 针对 CVE-2026-63490 加入的路径约束在未经百分号解码的 location 字符串上调用 Paths.get().normalize() 与前缀 startsWith，而打开模板时 JDK 的 file: URL 处理器会先解码路径。当应用将模板前缀设为 file: URL、且视图名来自请求参数时，攻击者可提交 %2e%2e/ 绕过 HandlebarsViewResolver.configure 对字面量“..”的拦截以及 SpringTemplateLoader.getResource 的目录包含检查，读取模板根目录之外、进程可读的文件。\n修复版本中通过先由 Spring ResourceLoader 解析目标资源，再对磁盘文件执行 getCanonicalFile() 并与规范化后的模板基目录做前缀包含校验，使约束作用于实际打开路径，阻断百分号编码目录穿越。", "effects": [{"comp_name": "com.github.jknack:handlebars-springmvc", "ecosystem": "maven", "versions": [{"affected_version": "[4.5.3,4.5.5)", "min_fixed_version": "4.5.5", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "路径遍历：'../filedir'", "last_modified_time": "2026-09-30", "level": "High", "mps_id": "MPS-9s5x-fhzu", "poc": false, "poc_url": [], "published_time": "2026-09-30", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-9s5x-fhzu", "name": "https://www.oscs1024.com/hd/MPS-9s5x-fhzu"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-103088", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-103088"}, {"url": "https://github.com/jknack/handlebars.java/security/advisories/GHSA-pvrx-3g7m-fpgv", "name": ""}, {"url": "https://github.com/jknack/handlebars.java/commit/f6ae3979917d05bef07f00befb4013ef00503660", "name": ""}, {"url": "https://github.com/jknack/handlebars.java/releases/tag/v4.5.5", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "Handlebars路径穿越漏洞", "_translated": true, "_saved_at": "2026-09-30T03:32:07+00:00", "_first_saved_at": "2026-09-30T03:32:07+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-9s5x-fhzu"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能有效地控制资源的使用，导致攻击者可以利用这个漏洞耗尽应用程序所依赖的资源。这些资源可以是计算资源（CPU、内存）、网络带宽、数据库连接或其他系统资源。攻击者可以通过发送特制的请求、恶意输入或其他方式，使应用程序消耗大量资源，导致拒绝服务或系统崩溃。", "title": "什么是拒绝服务"}, {"content": "- 消耗计算资源：攻击者可以发送计算密集型的请求，例如复杂的计算、无限循环或递归操作，以耗尽应用程序的计算资源，导致应用程序无法响应其他请求。\r\n- 消耗内存资源：攻击者可以发送大量的数据或恶意输入，以导致应用程序消耗过多的内存资源，从而使系统的可用内存耗尽，并导致应用程序崩溃或变得不可用。\r\n- 消耗网络带宽：攻击者可以发送大量的请求或大型数据包，以消耗应用程序所依赖的网络带宽。这会导致其他合法用户无法正常访问应用程序或降低系统的整体网络性能。\r\n- 消耗存储资源：攻击者可以发送大量的请求或上传大文件，以耗尽应用程序的存储资源，导致系统无法处理其他请求或存储新的数据。", "title": "拒绝服务常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对输入数据进行合理的验证和过滤，防止恶意输入导致资源消耗过高。\r\n- 实施资源限制：应用程序应该实施适当的资源限制策略，例如限制计算操作的时间或次数，限制内存使用量，限制并发连接数等，以防止资源被耗尽。\r\n- 异常处理与错误恢复：应用程序应该具备健壮的异常处理和错误恢复机制，以防止因意外错误导致资源泄漏或无法释放的情况。\r\n- 资源监控与警报：应用程序应该实施适当的资源监控和警报机制，及时发现异常的资源消耗情况，并采取相应的措施来应对。\r\n- 压力测试与性能优化：应用程序应该进行压力测试，以评估其在高负载情况下的性能，并进行必要的性能优化，以确保能够有效地处理大量请求而不耗尽资源。", "title": "如何预防拒绝服务"}], "cnvd_id": "", "cve_id": "CVE-2026-94002", "cvss": {}, "cvss_score": 7.5, "cvss_vector": "", "cwe": "CWE-400", "description": "Apache MINA SSHD 是开源 Java SSH 协议库，同时提供客户端与服务端实现；sshd-sftp 组件中的 DefaultSftpClient 是默认 SFTP 客户端，用于与远程 SFTP 服务器交互。\n受影响版本中，DefaultSftpClient.process 收到服务端 SFTP 应答后未校验该应答是否对应此前发出的请求，直接按 ID 写入 messages 映射。恶意服务器可持续发送无对应请求的应答，这些缓冲对象不会被消费，最终耗尽客户端可用内存。\n修复版本中通过将 messages 改为按请求 ID 注册 CompletableFuture，并在 process 中对无对应未完成请求或重复应答抛出异常拒绝入库，切断无主应答堆积导致的内存耗尽。", "effects": [{"comp_name": "org.apache.sshd:sshd-sftp", "ecosystem": "maven", "versions": [{"affected_version": "[3.0.0-M1,3.0.0-M6)", "min_fixed_version": "3.0.0-M6", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[0.9.0,2.20.0)", "min_fixed_version": "2.20.0", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "拒绝服务", "kind_en": "不受控制的资源消耗", "last_modified_time": "2026-09-30", "level": "High", "mps_id": "MPS-a108-29d4", "poc": false, "poc_url": [], "published_time": "2026-09-30", "reference_url_list": [{"url": "https://www.openwall.com/lists/oss-security/2026/09/29/36", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-94002", "name": ""}, {"url": "https://mina.apache.org/", "name": ""}, {"url": "https://github.com/apache/mina-sshd/commit/53bce94f4b27d1dd7b4d8d730af8b96b9616446f", "name": ""}, {"url": "https://github.com/apache/mina-sshd/releases/tag/sshd-2.20.0", "name": ""}, {"url": "https://github.com/apache/mina-sshd/releases/tag/sshd-3.0.0-M6", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "SSHD SFTP内存耗尽", "_translated": true, "_saved_at": "2026-09-29T19:44:08+00:00", "_first_saved_at": "2026-09-29T19:44:08+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-a108-29d4"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-75098", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "cwe": "CWE-22", "description": "Product Designer App 是发布于 WordPress.org 的开源 WooCommerce 产品在线设计插件，用于前台个性化设计、模板套用与印刷文件导出。\n受影响版本中，前台 AJAX 动作 pdapp-render-design 只通过 pdapp_check_token 校验 nonce 与 token，而 pdappNonce、pdappToken 会作为 JavaScript 全局变量写入任意渲染 [pdapp-studio-page] 短代码的页面，匿名访问者可以直接取得。攻击者将含 xlink:href 的 svg 字段（可使用 data:image/svg+xml;base64 避开文本清洗）随 design.json 上传后，pdapp_replace_image_svg 仅把 PDAPP_UPLOAD_URL 替换为 PDAPP_UPLOAD_DIR 并调用 pdapp_read_file，缺少目录规范化与前缀校验，响应中会带回任意本地文件内容。\n修复版本中通过把 xlink:href 解析限制在插件上传目录、拒绝目录穿越并校验规范化路径，切断任意文件读取。公开 1.1.4 与 1.1.3 在 pdapp_replace_image_svg 上无差异，截至 2026-09-30 未见可复核的路径校验补丁。", "effects": [{"comp_name": "product-designer-app", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.1.3]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-09-30", "level": "High", "mps_id": "MPS-slp1-63gi", "poc": false, "poc_url": [], "published_time": "2026-09-30", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-slp1-63gi", "name": "https://www.oscs1024.com/hd/MPS-slp1-63gi"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-75098", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-75098"}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/e94db231-e5d4-4b49-ad36-74c0284abfd2?source=cve", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/product-designer-app/trunk/includes/productdesignerapp-helpers.php#L2867", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/product-designer-app/trunk/includes/productdesignerapp-front-ajax.php#L625", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/product-designer-app/trunk/includes/productdesignerapp-helpers.php#L261", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/product-designer-app/trunk/templates/default/script/variants.php#L22", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "PDA插件任意文件读取", "_translated": true, "_saved_at": "2026-09-30T10:12:20+00:00", "_first_saved_at": "2026-09-30T10:12:20+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-slp1-63gi"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-97347", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "cwe": "CWE-79", "description": "Post Views Stats Counter 是面向 WordPress 的开源浏览统计插件，用于记录文章与页面访问次数，并在后台展示按日、周、月的统计，同时支持按 User-Agent 忽略爬虫。\n受影响版本中，未认证访问者请求任意前台页面时，pvs_counter_filter_footer 从 HTTP_USER_AGENT 读取 User-Agent 并写入 wp_pvs_counter.useragent，过滤仅依赖 bot、spider、crawler 等子串黑名单。攻击者省略这些子串即可把脚本入库；管理员打开设置页时，manage/admin.php 以 echo $useragent_bot 输出下拉选项文本且未做 HTML 转义，导致存储型跨站脚本执行。\n修复版本中通过尚未发布的官方更新处理该问题。公开最高版本 1.1.7 仍将 User-Agent 无转义输出到设置页，WordPress.org 已关闭该插件下载，部署方应停用并移除插件。", "effects": [{"comp_name": "post-views-stats-counter", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.1.7]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-09-30", "level": "High", "mps_id": "MPS-ut4l-y9i3", "poc": false, "poc_url": [], "published_time": "2026-09-30", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ut4l-y9i3", "name": "https://www.oscs1024.com/hd/MPS-ut4l-y9i3"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-97347", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-97347"}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/086a8577-eb23-4e05-8ff6-7bbfef62d25c?source=cve", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/post-views-stats-counter/tags/1.1.7/manage/admin.php#L681", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/post-views-stats-counter/tags/1.1.7/manage/admin.php#L447", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/post-views-stats-counter/tags/1.1.7/wp_pvscounter.php#L411", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/post-v "url": "https://github.com/gosub-io/gosub-engine/security/advisories/GHSA-c762-mxfh-vwvp", "name": ""}, {"url": "https://github.com/gosub-io/gosub-engine/pull/1229", "name": ""}], "scope_influence": "", "tags": [], "title": "Gosub SVG嵌套拒绝服务", "_translated": true, "_saved_at": "2026-09-30T03:32:08+00:00", "_first_saved_at": "2026-09-30T03:32:08+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-qztw-pjcf"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-74225", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:U/C:N/I:L/A:H", "severity": "high", "base_score": 7.1}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:A/AC:L/AT:N/PR:N/UI:N/VC:N/VI:L/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:A/AC:L/AT:N/PR:N/UI:N/VC:N/VI:L/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-787", "description": "U-Boot 是开源引导加载程序，广泛用于嵌入式设备启动与网络引导，并提供基于 RFC 8415 的 DHCPv6 IPv6 netboot。\n受影响版本中，dhcp6_parse_options() 解析 : "- 注入攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码注入到程序中，从而实现代码执行的目的。\n- 反射攻击：攻击者使用反射机制，在序列化过程中动态生成恶意数据，并将恶意代码注入到程序中，从而实现代码执行的目的。\n- 缓冲区溢出攻击：攻击者通过在序列化过程中向缓冲区输入恶意数据，导致缓冲区溢出，从而破坏程序的内存管理，实现代码执行的目的。\n- 格式字符串攻击：攻击者通过在序列化过程中输入恶意数据，导致程序使用错误的格式字符串，从而实现代码执行的目的。\n- 数据流攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码作为一个数据流传递给程序，从而实现代码执行的目的。\n", "title": "反序列化常见的攻击方式"}, {"content": "- 不信任输入数据：程序应该严格检查输入数据的有效性，并避免使用不受信任的数据。\n- 使用安全的序列化机制：程序应该使用安全的序列化机制，如 JSON 或 XML 序列化，而不是第三方序列化库。\n- 最小特权原则：程序应该限制对受信任数据的处理权限，并避免在运行时修改数据。\n- 代码审查和漏洞扫描：程序应该进行代码审查和漏洞扫描，以发现和修复潜在的安全漏洞。\n", "title": "如何预防反序列化"}], "cnvd_id": "", "cve_id": "CVE-2026-97284", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-502", "description": "Icegram Engage（插件标识 icegram）是一款 WordPress 开源营销互动插件（GPL-3.0），用于在站点前台创建弹窗、通知条、订阅表单等转化组件，其活动（Campaign）与消息（Message）以自定义文章类型及文章元数据存储。\n受影响版本中，拥有贡献者（Contributor）权限的用户在编辑自己的活动时，lite/classes/class-icegram-campaign-admin.php 的 save_campaign_settings() 对提交的 messages 参数不做结构校验并原样写入该活动的 messages 文章元数据；当站点管理员在活动列表点击复制（Duplicate）时，lite/class-icegram.php 的 Icegram::duplicate_in_db() 通过 get_post_custom() 读取全部元数据，并把键名 messages 的值直接传入 unserialize() 反序列化，攻击者构造的序列化串可在服务器上实例化任意类并触发 __wakeup、__destruct 等魔术方法调用链，结合 WordPress 核心或其他插件中可用的 gadget 可造成敏感信息泄露、文件篡改或代码执行。\n修复版本中通过新增的静态方法 Icegram::maybe_unserialize() 以 ['allowed_classes' =\u003e false] 调用 unserialize()，反序列化过程不再实例化任何对象，切断了对象注入链；save_campaign_settings() 同时改用 absint() 与 sanitize_text_field() 重建 messages 输入，仅保留数字 id 与 time 字段，使攻击载荷无法写入该元数据。", "effects": [{"comp_name": "icegram", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,3.1.44)", "min_fixed_version": "3.1.44", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "反序列 用这种漏洞可以读取应用程序内存中的敏感数据，如密码、加密密钥、会话令牌等。常见的原因是由于缓冲区溢出、格式化字符串漏洞或其他内存错误导致的。", "title": "什么是越界读取"}, {"content": "攻击者可以通过不当构造的输入来触发跨界内存读漏洞。攻击者可能会通过向应用程序发送特定的输入，使其读取超过预期的内存区域。攻击者可以利用这个漏洞来获取敏感信息，如其他用户的数据、操作系统的敏感数据或应用程序的内部状态。", "title": "越界读取常见的攻击方式"}, {"content": "- 输入验证和限制：应用程序应对所有输入数据进行严格的验证和限制。确保输入数据的长度、格式和内容符合预期，避免超出缓冲区或访问非预期的内存区域。\n- 内存安全编程实践：开发人员应使用安全的编程实践，如避免使用不安全的函数、正确处理内存分配和释放操作，以及遵循最小特权原则。\n- 使用安全的编程语言和库：选择使用安全性较高的编程语言和库，这些语言和库在内存管理和安全性方面提供了更多的保护机制。\n- 定期进行代码审查和安全测试：定期审查应用程序的代码，并进行安全测试，以发现潜在的跨界内存读漏洞。使用静态代码分析工具和漏洞扫描工具来辅助检测和修复问题。\n- 实施防御性编程技术：应用程序应采用防御性编程技术，如使用随机化地址空间布局（ASLR）、堆栈保护机制（如堆栈溢出保护）和数据执行预防（DEP）等。\n- 及时更新和修补：及时应用程序和操作系统的安全更新和补丁，以确保已知的跨界内存读漏洞得到修复。及时更新相关软件和库，以避免使用已知存在漏洞的版本。", "title": "如何预防越界读取"}], "cnvd_id": "", "cve_id": "CVE-2026-47520", "cvss": {"cvssv31": [{"source": "psirt@nvidia.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-125", "description": "适用于 Linux 的 NVIDIA vGPU 虚拟 GPU 管理器在内核模式层中包含一个漏洞，攻击者可能会导致越界读取。成功利用此漏洞可能会导致代码执行、拒绝服务、权限升级、信息泄露和数据篡改。", "effects": [{"comp_name": "Guest driver", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,582.53(AllversionspriortoandincludingvGPU19.5)]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,596.36(AllversionspriortoandincludingvGPU20.1)]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,580.159.03(AllversionspriortoandincludingvGPU19.5)]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,595.71.05(AllversionspriortoandincludingvGPU20.1)]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "Virtual GPU Manager", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,595.71.03(Allversionspriortoandincl oo/v1/ 下的 getorders、getorderdetails、createcustomer、deletePage 等接口，这些接口的权限回调 check_api_permission 只校验该密钥与 User-Agent 字符串，导致越权读取订单与客户数据、创建客户账号或删除页面。\n修复版本中通过在 gr_ajax_check_autologin 入口增加 _checkNonce 校验切断上述链路，请求需携带有效 gr_nonce 且当前用户具备 manage_options 能力，低权限用户无法再获取 payload；同一版本将 grwoo/v1 各接口的权限回调统一替换为依赖服务端校验 id_shop、id_site 与 payloadlite 的 check_api_permission_lite。", "effects": [{"comp_name": "gratisfaction-all-in-one-loyalty-contests-referral-program-for-woocommerce", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,4.6.4)", "min_fixed_version": "4.6.4", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-10-01", "level": "High", "mps_id": "MPS-2mfk-gnuv", "poc": false, "poc_url": [], "published_time": "2026-10-01", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-2mfk-gnuv", "name": "https://www.oscs1024.com/hd/MPS-2mfk-gnuv"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-97297", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-97297"}, {"url": "https://patchstack.com/database/wordpress/plugin/gratisfaction-all-in-one-loyalty-contests-referral-program-for-woocommerce/vulnerability/wordpress-gratisfaction-plugin-4-6-3-broken-access-control-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Gratisfaction访问控制缺失漏洞", "_translated": true, "_saved_at": "2026-10-01T15:54:13+00:00", "_first_saved_at": "2026-10-01T15:54:13+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-2mfk-gnuv"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系  攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-85679", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "cwe": "CWE-79", "description": "Extendify 是一款 GPLv2 开源的 WordPress 模板与版式库插件，为 Gutenberg 区块编辑器提供模板、图案与布局资源，并负责把设计流程中的区块样式变体注册进 WordPress 全局样式体系。\n受影响版本中，插件将 registerIncoming() 挂载到 rest_request_before_callbacks 过滤器，该回调先于路由 permission_callback 执行，未认证攻击者向 /wp/v2/global-styles 路由发送 POST、PUT 或 PATCH 请求便能进入该代码路径；registerIncoming() 从请求 styles 参数的 blocks 数组键中提取区块类型名，在缺少权限校验与格式校验的情况下经 registerNames() 把攻击者控制的键注册进 WP_Block_Styles_Registry，并持久化到 extendify_block_style_variations 选项；该区块类型键随后被 WordPress 核心以未转义方式内插到前台 registerBlockStyle() 内联脚本中，攻击者由此注入任意 Web 脚本，形成存储型 XSS，用户访问被注入页面时脚本执行。\n修复版本中通过在 registerIncoming() 中增加 current_user_can('edit_theme_options') 权限检查拦截未授权写入，并新增 isValidBlockType() 以正则 ^[a-z0-9-]+/[a-z0-9-]+$ 只放行合法的 namespace/block 形式键，读取存量选项时同步清理历史非法键，切断了未授权写入与脚本注入链。", "effects": [{"comp_name": "extendify", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,3.2.0)", "min_fixed_version": "3.2.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en   <script>
    const payload = JSON.parse(document.getElementById("payload").textContent);
    const levelLabels = payload.level_labels || {};
    const items = payload.items || [];
    let filtered = items.slice();
    let activeId = null;

    const $ = (id) => document.getElementById(id);
    $("generatedAt").textContent = payload.generated_at || "-";

    $("cutoff").textContent = payload.cutoff_date || "-";
