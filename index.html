"justhtml", "ecosystem": "pip", "versions": [{"affected_version": "(-∞,1.15.0]", "min_fixed_version": "", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "输入验证不恰当", "kind_en": "输入验证不当", "last_modified_time": "2026-08-23", "level": "Critical", "mps_id": "MPS-1lr0-tfhq", "poc": false, "poc_url": [], "published_time": "2026-08-23", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-1lr0-tfhq", "name": "https://www.oscs1024.com/hd/MPS-1lr0-tfhq"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-7808", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-7808"}, {"url": "https://github.com/EmilStenstrom/justhtml/security/advisories/GHSA-4p64-v8f5-r2gx", "name": ""}, {"url": "https://www.vulncheck.com/advisories/justhtml-before-multiple-security-issues-via-sanitization", "name": ""}], "scope_influence": "", "tags": ["python", "开源"], "title": "justhtml HTML 净化绕过漏洞", "_translated": true, "_saved_at": "2026-08-23T23:14:44+00:00", "_first_saved_at": "2026-08-23T15:15:55+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-1lr0-tfhq"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-8445", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-79", "description": "justhtml 是一款用纯 Python 编写的 HTML 解析与序列化库，主页托管在 GitHub（EmilStenstrom/justhtml），通过 PyPI 以同名包分发，提供 DOM 解析、to_html / to_text / to_markdown 等序列化接口以及可定制的 SanitizationPolicy，常被用于把不可信 HTML 安全地转换为其他格式。\n受影响版本中，JustHTML.to_markdown() 在序列化文本节点时仅对少量 Markdown 元字符（如 \\、*、_、[、]）插入反斜杠，未对 \u0026 与 \u003c 等 HTML 关键字符进行转义；解析阶段已经实体解码或来自 \u003ctitle\u003e、\u003ctextarea\u003e、\u003cnoscript\u003e、\u003cplaintext\u003e 等原始文本元素的字符串，在序列化阶段会被原样写回 Markdown 输出，从而绕过 to_html() 同样输入下原本依赖的清理路径。当下游系统把这段 Markdown 渲染为 HTML 时，攻击者控制的 \u003cimg onerror=...\u003e 等载荷会作为真实 HTML 执行，构成跨站脚本漏洞。\n修复版本中通过扩展 _markdown_escape_text（位于 src/justhtml/serializer/markdown.py，旧布局下为 src/justhtml/node.py）的转义表，在循环里追加对 \u0026 写 \u0026amp;、对 \u003c 写 \u0026lt; 的分支，使任何来自文本节点的字符都先被实体化再进入 Markdown 渲染，从而切断“解析产物 → Markdown 输出 → HTML 渲染”这一绕过链路。", "effects": [{"comp_name": "justhtml", "ecosystem": "pip", "versions": [{"affected_version": "[0,1.12.0)", "min_fixed_version": "1.12.0", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-08-23", "level": "Critical", "mps_id": "MPS-3f7c-sdb9", "poc": false, "poc_url": [], "published_time": "2026-08-23", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-3f7c-sdb9", "name": "https://www.oscs1024.com/hd/MPS-3f7c-sdb9"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-8445", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-8445"}, {"url": "https://github.com/EmilStenstrom/justhtml/security/advisories/GHSA-3rcm-vjrc-p45j", "name": ""}, {"url": "https://www.vulncheck.com/advisories/justhtml-before-sanitizer-bypass-via-markdown", "name": ""}], "scope_influence": "", "tags": ["python", "开源"], "title": "justhtml to_markdown 清理绕过 (XSS)", "_translated": true, "_saved_at": "2026-08-23T23:14:43+00:00", "_first_saved_at": "2026-08-23T15:15:54+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-3f7c-sdb9"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-5388", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/  模板，从而以 root 覆盖宿主机已有文件并取得宿主机 root 代码执行。\n修复版本中通过让 templateApplyNow 对目标路径执行 path.Clean，并始终调用 rootfsRoot.OpenFile 在 os.Root 句柄内创建或截断文件，父目录也改为 filesystem.MkdirAllOwner 在同一 Root 下创建，使穿越序列无法逃出容器 rootfs，切断对宿主机任意文件的写入。", "effects": [{"comp_name": "github.com/canonical/lxd", "ecosystem": "go", "versions": [{"affected_version": "[4.0.0,4.0.13)", "min_fixed_version": "4.0.13", "repository": "go", "solutions": [], "upstream": true}, {"affected_version": "[5.0.0,5.0.9)", "min_fixed_version": "5.0.9", "repository": "go", "solutions": [], "upstream": true}, {"affected_version": "[5.21.0,5.21.7)", "min_fixed_version": "5.21.7", "repository": "go", "solutions": [], "upstream": true}, {"affected_version": "[6.0.0,6.9]", "min_fixed_version": "", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "相对路径遍历", "kind_en": "相对路径遍历", "last_modified_time": "2026-08-24", "level": "Critical", "mps_id": "MPS-kgo3-7adq", "poc": false, "poc_url": [], "published_time": "2026-08-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-kgo3-7adq", "name": "https://www.oscs1024.com/hd/MPS-kgo3-7adq"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-66897", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-66897"}, {"url": "https://github.com/canonical/lxd/security/advisories/GHSA-q39m-8fx9-42fv", "name": ""}], "scope_influence": "", "tags": ["go"], "title": "LXD模板路径穿越漏洞", "_translated": true, "_saved_at": "2026-08-24T11:21:27+00:00", "_first_saved_at": "2026-08-24T10:31:40+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-kgo3-7adq"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-78183", "cvss": {}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-787", "description": "DBD::Pg version 3.21.0 for Perl has a heap out-of-bounds write in quote_float.\n\nquote_float() allocates the length of the string + 1, which is the size of the bare numeric symbol plus NULL.  But for special literals NaN, Inf, +Inf, -Inf, Infinity, +Infinity, -Infinity it emits the literal surrounded by quotes plus NULL, which is length + 3 bytes. Every recognised literal (case-insensitive) overflows by 2 bytes, a single quote and a NULL.\n\nThis can be reached by the $dbh-\u003equote method, for example\n\n    $dbh-\u003equote( \"Infinity\", DBI::SQL_NUMERIC ).\n\nThis regression was introduced in 3.21.0 by the quote.c rewrite.", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-08-24", "level": "Critical", "mps_id": "MPS-gncf-koz0", "poc": false, "poc_url": [], "published_time": "2026-08-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-gncf-koz0", "name": "https://www.oscs1024.com/hd/MPS-gncf-koz0"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-78183", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-78183"}, {"url": "https://github.com/bucardo/dbdpg/commit/6d6f47ed2403cda55c82b1bad56e388ba7390065.patch", "name": ""}, {"url": "https://github.com/bucardo/dbdpg/commit/adacf1de872326a465e13f9e4281a674ebcd227e", "name": ""}, {"url": "https://github.com/bucardo/dbdpg/security/advisories/GHSA-785p-fw3v-r822", "name": ""}, {"url": "https://metacpan.org/release/TURNSTEP/DBD-Pg-3.21.1/source/Changes", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-78183漏洞", "_translated": true, "_saved_at": "2026-08-25T05:26:02+00:00", "_first_saved_at": "2026-08-23T21:15:38+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-gncf-koz0"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-78387", "cvss": {"cvssv4": [{"source": "5a6e4751-2f3f-4070-9419-94fb35b644e8", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.4}]}, "cvss_score": 9.4, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-862", "description": "RansomLook 是开源 Python 勒索软件情报追踪平台，用于监控勒索团伙站点、泄露信息和通知集成，并提供 Web 管理界面。\n受影响版本中，Flask 路由 /admin/config 对应的 admin_config 仅使用 flask_login.login_required 校验登录会话，没有额外的管理员或特权授权检查。已认证的低权限用户可通过 GET 或 POST 访问该接口，把表单中的配置字段直接写入 config/generic.json，从而改动 notification、LDAP、SMTP 及通用应用设置，并可能改写认证相关配置、重定向通知或集成、干扰外部服务，或造成实例不可用。受影响版本含有避免把已识别口令、令牌和 API 密钥回显到浏览器的逻辑，但配置管理入口本身授权不足。\n修复版本中通过删除 website/web/__init__.py 中的 /admin/config 路由与 admin_config 处理函数，并移除 templates/admin/config.html、static/js/config.js 以及管理页中的配置编辑入口，使应用配置无法再经 Web UI 被修改。", "effects": [{"comp_name": "RansomLook", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.0.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-08-24", "level": "Critical", "mps_id": "MPS-aj1b-qos7", "poc": false, "poc_url": [], "published_time": "2026-08-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-aj1b-qos7", "name": "https://www.oscs1024.com/hd/MPS-aj1b-qos7"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-78387", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-78387"}, {"url": "https://github.com/RansomLook/RansomLook/commit/d411ff51446e9e8b04e15567b46d53e86a3116dd", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "RansomLook配置越权漏洞", "_translated": true, "_saved_at": "2026-08-24T16:29:36+00:00", "_first_saved_at": "2026-08-24T15:33:23+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-aj1b-qos7"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-77994", "cvss": {"cvssv4": [{"source": "security@joomla.org", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-89", "description": "Page Builder CK 是 joomlack.fr 提供的开源 Joomla 页面构建扩展，基于 GPLv2 授权，用于在文章、模块和独立页面中通过拖拽生成版面与样式。\n受影响版本中，前台页面模型 PagebuilderckModelPage 的 parseHtml 会读取页面 HTML 里 pagebuilderckparams 节点的 data-styles 属性，并交给 loadStyles。loadStyles 把该样式 ID 列表直接拼进 #__pagebuilderck_styles 表的 IN 查询。攻击者把恶意 data-styles 写入页面或文章内容后，前台渲染该内容时会执行二次 SQL 注入，读取或改写数据库。\n修复版本中通过在 loadStyles 内将 data-styles 按逗号拆分并逐项转为整数后再写入 IN 条件，阻止非数字片段进入 SQL，切断二次注入链路。", "effects": [{"comp_name": "page_builder_ck", "ecosystem": "linux", "versions": [{"affected_version": "[1.0.0,3.6.5)", "min_fixed_version": "3.6.5", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-08-24", "level": "Critical", "mps_id": "MPS-9pv0-ucow", "poc": false, "poc_url": [], "published_time": "2026-08-24", "reference_url_list": [{"u 4", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ae5u-h0st", "name": "https://www.oscs1024.com/hd/MPS-ae5u-h0st"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-78207", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-78207"}, {"url": "https://github.com/exceljs/exceljs", "name": ""}, {"url": "https://github.com/exceljs/exceljs/blob/v4.4.0/lib/utils/under-dash.js#L155-L181", "name": ""}, {"url": "https://github.com/mateocallec/exceljs-hardened/security/advisories/GHSA-qwr4-7h29-chpf", "name": ""}, {"url": "https://www.vulncheck.com/advisories/exceljs-through-prototype-pollution-via-deepmerge-reached-from-note-serialization", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-78207漏洞", "_translated": true, "_saved_at": "2026-08-25T05:26:02+00:00", "_first_saved_at": "2026-08-24T02:20:37+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ae5u-h0st"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-78211", "cvss": {"cvssv31": [{"source": "twcert@cert.org.tw", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}], "cvssv4": [{"source": cles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-78365", "cvss": {"cvssv4": [{"source": "4daa8cea-433a-44bd-9456-53b127fc289a", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-862", "description": "Authorization Bypass Through User-Controlled Key in the supplier API in Roskus Prospero Flow CRM 4.0.0 through 5.3.1 allows any authenticated user to read and modify another company's supplier record, and to reassign it to their own company, via a PUT request to /api/supplier/{id} setting company_id in the body.", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-08-24", "level": "Critical", "mps_id": "MPS-q6jy-pbi2", "poc": false, "poc_url": [], "published_time": "2026-08-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-q6jy-pbi2", "name": "https://www.oscs1024.com/hd/MPS-q6jy-pbi2"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-78365", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-78365"}, {"url": "https://github.com/Roskus/prospero-flow-crm/commit/4a52477e6ed66afa436814c80e7bcd68670dd596", "name": ""}, {"url": "https://github.com/Roskus/prospero-flow-crm/releases/tag/v5.5.3", "name": ""}, {"url": "https://secur0.com/en/cna/cve-list/cve-2026-78365-idor-supplier-api-cross-tenant-update", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-78365漏洞", "_translated": true, "_saved_at": "2026-08-25T05:26:03+00:00", "_first_saved_at": "2026-08-24T13:45:20+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-q6jy-pbi2"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2026-78167", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:N/AC:L/Au:N/C:C/I:C/A:C", "severity": "high", "base_score": 10}], "c uthorization flaw in its legacy database export functionality that can allow unauthenticated remote users to retrieve information intended to remain private.\n\nThe /export/\u003cdatabase\u003e endpoint permits selected internal databases to be exported without requiring authentication. While limited filtering is performed for some entity databases, other exportable databases are returned directly without consistently applying the application's private-entity access restrictions. As a result, information associated with groups, markets, posts, or other records marked as private may be included in an export accessible to an unauthenticated requester.\n\nAn attacker able to reach the RansomLook web application can request the affected export endpoint and retrieve data that should only be available to authorized users. Depending on the contents of the instance, this may disclose private ransomware intelligence, victim information, internal tracking data, or other information deliberately excluded from public views.\n\nThe patch removes the legacy unauthenticated export route and introduces centralized authorization handling that distinguishes ordinary authenticated API access from authorization to view private entries. API keys must now be explicitly granted private-data access, while existing keys do not automatically receive this privilege. The same private-data filtering is also applied consistently across API responses and database exports.", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-08-24", "level": "Critical", "mps_id": "MPS-24g1-xfop", "poc": false, "poc_url": [], "published_time": "2026-08-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-24g1-xfop", "name": "https://www.oscs1024.com/hd/MPS-24g1-xfop"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-78370", "name": "ht d ransom \nnotes marked as private. An unauthenticated or otherwise unauthorized \nremote attacker can access information associated with private entities \nthrough several web views and API endpoints.\n\n\nThe affected functionality can \ndisclose private group or market names, ransom-note content, and \nmetadata associated with private groups. The /compare\n functionality can also be queried directly with the name of a private \nentity, allowing an unauthorized user to retrieve information such as \npost counts, mirror totals, and uptime even when the entity is excluded \nfrom the normal user interface. The patch explicitly adds a privacy \ncheck before returning this information. \n\n\nRansom-note views, search results, \nand API endpoints were similarly missing consistent filtering. The fix \nintroduces normalized private-group identifiers and alias handling, then\n rejects or filters notes associated with private groups before \nreturning them to unauthorized callers.  \n\n\nAn attacker can exploit the issue \nremotely without authentication or user interaction, resulting in \ndisclosure of information that was explicitly intended to be restricted \nto authorized users.", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-08-24", "level": "Critical", "mps_id": "MPS-3u0l-tamj", "poc": false, "poc_url": [], "published_time": "2026-08-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-3u0l-tamj", "name": "https://www.oscs1024.com/hd/MPS-3u0l-tamj"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-78372", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-78372"}, {"url": "https://github.com/RansomLook/RansomLook/commit/dc92d6d5c076bcdbf3476aca42daf0260e8d99d7", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-78372漏洞", "_translated": true, "_saved_at": "2026-08-25 796658455-NC", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "OpenThread拒绝服务漏洞", "_translated": true, "_saved_at": "2026-08-24T18:30:50+00:00", "_first_saved_at": "2026-08-24T18:30:50+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-lso3-5ua8"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-78267", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-266", "description": "TranslatePress 是 Cozmoslabs 发布的开源 WordPress 多语言翻译插件，插件目录名为 translatepress-multilingual，用于在前端可视化编辑器中翻译站点内容，并支持自动翻译。\n受影响版本中，Translation Editor 预览模式在 TRP_Translation_Manager::conditions_met() 里只判断请求参数 trp-edit-translation 是否为 preview，不调用 current_user_can 校验 trp_translating_capability，未认证访问者可直接进入本应受限的编辑器预览路径。TRP_Translation_Render::translate_page() 在该预览分支把未校验的 data-trpgettextoriginal 写回页面属性，搜索查询等反射输入可借此注入标记并取得站点控制权。\n修复版本中通过新增 sanitize_gettext_original_id() 将 data-trpgettextoriginal 限制为纯数字，并在 setAttribute 与字符串拼接输出时使用 esc_attr()，阻止未校验标识进入预览写回路径。", "effects": [{"comp_name": "translatepress-multilingual", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,3.3.3)", "min_fixed_version": "3.3.3", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "特权授予不正确", "kind_en": "权限分配不正确", "last_modified_time": "2026-08-25", "level": "Critical", "mps_id": "MPS-70qc-3rjm", "poc": false, "poc_url": [], "published_time": "2026-08-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-70qc-3rjm", "name": "https://www.oscs1024.com/hd/MPS-70qc-3rjm"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-78267", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-78267"}, {"url": "https://patchstack.com/database/wordpress/plugin/translatepress-multilingual/vulnerability/wordpress-translatepress-plugin-3-3-2-privilege-escalation-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "TranslatePress未授权提权漏洞", "_translated": true, "_saved_at": "2026-08-25T00:55:34+00:00", "_first_saved_at": "2026-08-24T23:17:19+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-70qc-3rjm"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过向受信任的数据序列化过程中添加恶意数据，从而在序列化和反序列化过程中执行恶意代码的攻击漏洞。这种漏洞通常存在于使用序列化 (serialization) 机制存储和传输数据的程序中。\n", "title": "什么是反序列化"}, {"content": "- 注入攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码注入到程序中，从而实现代码执行的目的。\n- 反射攻击：攻击者使用反射机制，在序列化过程中动态生成恶意数据，并将恶意代码注入到程序中，从而实现代码执行的目的。\n- 缓冲区溢出攻击：攻击者通过在序列化过程中向缓冲区输入恶意数据，导致缓冲区溢出，从而破坏程序的内存管理，实现代码执行的目的。\n- 格式字符串攻击：攻击者通过在序列化过程中输入恶意数据，导致程序使用错误的格式字符串，从而实现代码执行的目的。\n- 数据流攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码作为一个数据流传递给程序，从而实现代码执行的目的。\n", "title": "反序列化常见的攻击方式"}, {"content": "- 不信任输入数据：程序应该严格检查输入数据的有效性，并避免使用不受信任的数据。\n- 使用安全的序列化机制：程序应该使用安全的序列化机制，如 JSON 或 XML 序列化，而不是第三方序列化库。\n- 最小特权原则：程序应该限制对受信任数据的处理权限，并避免在运行时修改数据。\n- 代码审查和漏洞扫描：程序应该进行代码审查和漏洞扫描，以发现和修复潜在的安全漏洞。\n", "title": "如何预防反序列化"}], "cnvd_id": "", "cve_id": "CVE-2026-78265", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}]}, "cvss_score": 9.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-502", "description": "The Events Calendar 是开源 WordPress 插件，用于在站点上创建、展示和管理活动日历。\n受影响版本中，Tribe\\Events\\Views\\V2\\Widgets\\Service_Provider 在处理遗留小组件复制粘贴时，将请求或区块中的 instance.encoded 做 Base64 解码后直接调用 wp_hash() 覆盖原哈希，绕过 WordPress 对小组件实例的完整性校验，使未认证攻击者可将任意 PHP 序列化对象送入后续 unserialize 流程。在存在 POP 链时，可导致远程代码执行、任意文件操作或拒绝服务。\n修复版本中通过在重写哈希前增加 is_safe_widget_instance() 校验，使用 allowed_classes =\u003e false 解析实例并拒绝包含对象的数据，切断恶意对象进入反序列化利用链。", "effects": [{"comp_name": "the-events-calendar", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,6.17.3)", "min_ d": "MPS-tohi-mxb9", "poc": true, "poc_url": [], "published_time": "2026-08-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-tohi-mxb9", "name": "https://www.oscs1024.com/hd/MPS-tohi-mxb9"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-76071", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-76071"}, {"url": "https://github.com/ozcanpng/CVE-2026-76071", "name": ""}, {"url": "https://ozcanpng.dev/blog/cve-2026-76071-netis-nc63-ipfilter-stack-buffer-overflow/", "name": ""}, {"url": "https://www.netis-systems.com/products/NC63.html", "name": ""}, {"url": "https://www.vulncheck.com/advisories/netis-nc63-stack-buffer-overflow-via-desthost-parameter", "name": ""}], "scope_influence": "", "tags": ["poc", "应用软件"], "title": "Netis NC63栈溢出漏洞", "_translated": true, "_saved_at": "2026-08-24T17:25:32+00:00", "_first_saved_at": "2026-08-24T17:25:32+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-tohi-mxb9"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-77635", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:H/VA:L/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.2}]}, "cvss_score": 9.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:H/VA:L/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-89", "description": "CakePHP 是开源 PHP 快速开发框架，通过 Composer 以 cakephp/cakephp 与 cakephp/database 分发，用于构建 Web 应用并提供 ORM 与 SQL 表达式生成能力。\n受影响版本中，FunctionsBuilder::jsonValue() 会把调用方提供的 jsonPath 编入 JSON_VALUE 表达式；Postgres 驱动在 _transformFunctionExpression() 中将其改写为 JSONB_PATH_QUERY，并用 quoteIdentifier() 把 jsonPath 直接拼进形如 '%s'::jsonpath 的 SQL 片段。quoteIdentifier() 只按标识符规则加引号，无法按 SQL 字符串规则转义单引号，攻击者可向 jsonPath 传入 x')) \u003e '0' OR (SELECT 1) -- 这类载荷打断 SQL 结构并执行额外语句。\n修复版本中通过停止将 jsonPath 内联拼接进 SQL，仅对 JSON 字段参数追加 ::jsonb 转换，并将 jsonPath 作为绑定参数交给 JSONB_PATH_QUERY，使恶意路径无法再脱离参数绑定进入 SQL 语句。", "effects": [{"comp_name": "cakephp/cakephp", "ecosystem": "composer", "versions": [{"affected_version": "[5.2.0,5.2.15)", "min_fixed_version": "5.2.15", "repository": "composer", "solutions": [], "upstream": true}, {"affected_version": "[5.1.0,5.1.10)", "min_fixed_version": "5.1.10", "repository": "composer", "solutions": [], "upstream": true}, {"affected_version": "[5.3.0,5.3.7)", "min_fixed_version": "5.3.7", "repository": "composer", "solutions": [], "upstream": true}]}, {"comp_name": "cakephp/database", "ecosystem": "composer", "versions": [{"affected_version": "[5.2.0,5.2.15)", "min_fixed_version": "5.2.15", "repository": "composer", "solutions": [], "upstream": true}, {"affected_version": "[5.3.0,5.3.7)", "min_fixed_version": "5.3.7", "repository": "composer", "solutions": [], "upstream": true}, {"affected_version": "[5.1.0,5.1.10)", "min_fixed_version": "5.1.10", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-08-25", "level": "Critical", "mps_id": "MPS-msg3-6dra", "poc": false, "poc_url": [], "published_time": "2026-08-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-msg3-6dra", "name": "https://www.oscs1024.com/hd/MPS-msg3-6dra"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-77635", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-77635"}, {"url": "https://github.com/cakephp/cakephp/commit/138f2f61486532c29ee4d106da2a9848c1ff1ab3", "name": ""}, {"url": "https://github.com/cakephp/cakephp/commit/489a40fb7c6e597af33fe0f7264047afccb90d55", "name": ""}, {"url": "https://github.com/cakephp/cakephp/commit/9f1ad970a3b72293d4a37e694276645f804e819f", "name": ""}, {"url": "https://github.com/cakephp/cakephp/releases/tag/5.1.10", "name": ""}, {"url": "https://github.com/cakephp/cakephp/releases/tag/5.2.15", "name": ""}, {"url": "https://github.com/cakephp/cakephp/releases/tag/5.3.7", "name": ""}, {"url": "https://github.com/cakephp/cakephp/security/advisories/GHSA-fxf7-vhh8-7vpq", "name": ""}], "scope_influence": "", "tags": ["php", "开源"], "title": "CakePHP SQL注入漏洞", "_translated": true, "_saved_at": "2026-08-24T22:19:20+00:00", "_first_saved_at": "2026-08-24T22:19:20+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-msg3-6dra"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过向受信任的数据序列化过程中添加恶意数据，从而在序列化和反序列化过程中执行恶意代码的攻击漏洞。这种漏洞通常存在于使用序列化 (serialization) 机制存储和传输数据的程序中。\n", "title": "什么是反序列化"}, {"content": "- 注入攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码注入到程序中，从而实现代码执行的目的。\n- 反射攻击：攻击者使用反射机制，在序列化过程中动态生成恶意数据，并将恶意代码注入到程序中，从而实现代码执行的目的。\n- 缓冲区溢出攻击：攻击者通过在序列化过程中向缓冲区输入恶意数据，导致缓冲区溢出，从而破坏程序的内存管理，实现代码执行的目的。\n- 格式字符串攻击：攻击者通过在序列化过程中输入恶意数据，导致程序使用错误的格式字符串，从而实现代码执行的目的。\n- 数据流攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码作为一个数据流传递给程序，从而实现代码执行的目的。\n", "title": "反序列化常见的攻击方式"}, {"content": "- 不信任输入数据：程序应该严格检查输入数据的有效性，并避免使用不受信任的数据。\n- 使用安全的序列化机制：程序应该使用安全的序列化机制，如 JSON 或 XML 序列化，而不是第三方序列化库。\n- 最小特权原则：程序应该限制对受信任数据的处理权限，并避免在运行时修改数据。\n- 代码审查和漏洞扫描：程序应该进行代码审查和漏洞扫描，以发现和修复潜在的安全漏洞。\n", "title": "如何预防反序列化"}], "cnvd_id": "", "cve_id": "CVE-2026-0551", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-502", "description": "PPWP – Password Protect Pages 是面向 WordPress 的开源密码保护插件，可对文章、页面以及按角色区分的内容设置访问密码。\n受影响版本中，includes/services/class-ppw-passwords.php 的 PPW_Password_Services::massage_pw_from_post_meta 在遍历 postmeta 时，对 PPW_Constants::POST_PROTECTION_ROLES 这个 meta_key 的 meta_value 直接调用 @unserialize($val-\u003emeta_value)，同文件 PPW_Password_Services::get_protected_post_ids 也对同一字段调用 @unserialize($value-\u003emeta_value)。具备 Contributor 及以上权限的认证用户可在创建或编辑文章时通过 WordPress 的 update_post_meta 写入任意 PHP 序列化字符串，该字符串随后会被上述方法反序列化。若站点同时安装了提供 POP 链的插件或主题，反序列化过程将触发任意文件删除、敏感数据读取甚至远程代码执行。\n修复版本中通过在 1.9.19 移除 massage_pw_from_post_meta 与 get_protected_post_ids 中对 post_protection_roles meta_value 的 @unserialize() 调用，让 ppw_free_fix_serialize_data 直接处理原始字符串，切断不可信序列化对象进入对象反序列化流程的链路。", "effects": [{"comp_name": "password-protect-page", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.9.19)", "min_fixed_version": "1.9.19", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "反序列化", "kind_en": "不可信数据的反序列化", "last_modified_time": "2026-08-23", "level": "High", "mps_id": "MPS-gji2-1eqb", "poc": false, "poc_url": [], "published_time": "2026-08-23", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-gji2-1eqb", "name": "https://www.oscs1024.com/hd/MPS-gji2-1eqb"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-0551", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-0551"}, {"url": "https://plugins.trac.wordpress.org/browser/password-protect-page/trunk/includes/services/class-ppw-passwords.php#L699", "name": ""}, {"url": "https://plugins.trac.wordpress.org/changeset/3567221/password-protect-page", "name": ""}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/b8f53282-740e-4ac3-a2e1-7a97893e3355?source=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "PPWP插件PHP对象注入漏洞", "_translated": true, "_saved_at": "2026-08-23T03:44:38+00:00", "_first_saved_at": "2026-08-23T00:57:50+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-gji2-1eqb"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "cnvd_id": "", "cve_id": "CVE-2026-16149", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-269", "description": "Security Hardener 是 WordPress 上由 Marc Armengou 维护的开源安全加固插件，提供安全响应头、登录保护、用户枚举拦截、限速以及内置安全清单等加固能力。\n受影响版本中，security-hardener.php 的 WPHN_Hardener::secure_user_endpoints 方法通过 rest_endpoints 过滤器，把 /wp/v2/users 与 /wp/v2/users/(?P\u003cid\u003e[\\d]+) 这两个 REST 路由上所有已注册 handler 的 permission_callback 全部覆盖为一个只返回 is_user_logged_in() 的闭包，连带覆盖 POST、PUT、PATCH、DELETE 等写操作 handler，从而剥离了 WordPress Core WP_REST_Users_Controller 原本强制要求的 create_users、promote_user、edit_users、delete_users 等能力校验。已认证的 Subscriber 级攻击者可向 /wp/v2/users 发起 POST 请求创建 administrator 账户，或向 /wp/v2/users/\u003cid\u003e 发起 PUT/POST 请求重置现有管理员密码；由于 block_user_enum 默认启用，攻击无须任何额外插件配置，插件安装后该覆写即在每次 REST 请求处理路径中生效。\n修复版本中通过收紧 secure_user_endpoints 的覆写范围解决了该问题，仅当 handler 的 methods 仅包含 GET 时才替换 permission_callback，POST、PUT、PATCH、DELETE 等写操作 handler 的 permission_callback 不再被覆写，WordPress Core 自带的 create_users、edit_users、delete_users 等能力校验得以恢复执行。", "effects": [{"comp_name": "security-hardener", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.4.5)", "min_fixed_version": "2.4.5", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-08-23", "level": "High", "mps_id": "MPS-qrat-bvp9", "poc": false, "poc_url": [], "published_time": "2026-08-23", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-qrat-bvp9", "name": "https://www.oscs1024.com/hd/MPS-qrat-bvp9"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-16149", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-16149"}, {"url": "https://plugins.trac.wordpress.org/browser/security-hardener/tags/2.4.4/security-hardener.php#L107", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/security-hardener/tags/2.4.4/security-hardener.php#L180", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/security-hardener/tags/2.4.4/security-hardener.php#L204", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/security-hardener/tags/2.4.4/security-hardener.php#L428", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/security-hardener/tags/2.4.4/security-hardener.php#L433", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/security-hardener/tags/2.4.4/security-hardener.php#L439", "name": ""}, {"url": "https://plugins.trac.wordpress.org/changeset/3630896/security-hardener", "name": ""}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/64f1a71f-e210-4191-bfb4-56f8568180ed?source=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Security Hardener WordPress插件Missing Authorization漏洞", "_translated": true, "_saved_at": "2026-08-23T03:44:37+00:00", "_first_saved_at": "2026-08-23T00:57:49+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-qrat-bvp9"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能有效地控制资源的使用，导致攻击者可以利用这个漏洞耗尽应用程序所依赖的资源。这些资源可以是计算资源（CPU、内存）、网络带宽、数据库连接或其他系统资源。攻击者可以通过发送特制的请求、恶意输入或其他方式，使应用程序消耗大量资源，导致拒绝服务或系统崩溃。", "title": "什么是拒绝服务"}, {"content": "- 消耗计算资源：攻击者可以发送计算密集型的请求，例如复杂的计算、无限循环或递归操作，以耗尽应用程序的计算资源，导致应用程序无法响应其他请求。\r\n- 消耗内存资源：攻击者可以发送大量的数据或恶意输入，以导致应用程序消耗过多的内存资源，从而使系统的可用内存耗尽，并导致应用程序崩溃或变得不可用。\r\n- 消耗网络带宽：攻击者可以发送大量的请求或大型数据包，以消耗应用程序所依赖的网络带宽。这会导致其他合法用户无法正常访问应用程序或降低系统的整体网络性能。\r\n- 消耗存储资源：攻击者可以发送大量的请求或上传大文件，以耗尽应用程序的存储资源，导致系统无法处理其他请求或存储新的数据。", "title": "拒绝服务常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对输入数据进行合理的验证和过滤，防止恶意输入导致资源消耗过高。\r\n- 实施资源限制：应用程序应该实施适当的资源限制策略，例如限制计算操作的时间或次数，限制内存使用量，限制并发连接数等，以防止资源被耗尽。\r\n- 异常处理与错误恢复：应用程序应该具备健壮的异常处理和错误恢复机制，以防止因意外错误导致资源泄漏或无法释放的情况。\r\n- 资源监控与警报：应用程序应该实施适当的资源监控和警报机制，及时发现异常的资源消耗情况，并采取相应的措施来应对。\r\n- 压力测试与性能优化：应用程序应该进行压力测试，以评估其在高负载情况下的性能，并进行必要的性能优化，以确保能够有效地处理大量请求而不耗尽资源。", "title": "如何预防拒绝服务"}], "cnvd_id": "", "cve_id": "CVE-2026-4671", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-400", "description": "justhtml 是开源 Python HTML 解析与 DOM 查询库，提供符合 HTML 标准的解析器、基于 CSS 选择器的 DOM 查询、Linkify 文本链接化以及可选的清理与变换流水线；该项目在 GitHub 上以 MIT 许可证分发。\n受影响版本中，justhtml.selector.query、justhtml.selector.matches 与 SelectorParser.parse 在解析攻击者可控的 CSS 选择器字符串时缺少结构性上限，对超大长度选择器、大量逗号分隔的子选择器、过大复合选择器项数、超长复杂选择器组合子链以及深层 :not(...)、:contains(...) 等函数式伪类会消耗不成比例的 CPU 或内存；SelectorMatcher 在祖先/兄弟/位置伪类匹配与 DOM 遍历中也缺少父链、子链与文本链的循环守卫，对程序化构造的环形或共享子节点 DOM 图会进入不可终止遍历。同时，linkify._trim_trailing 在剥离候选 URL 尾部未闭合右括号时使用 candidate.count(close) 在 while 循环中重复扫描整体字符串，对末尾附带大量未配对右括号的 URL 候选呈二次方时间复杂度。任一触发路径成立时，攻击者均可让使用 justhtml 的进程长时间占用 CPU 或内存，构成可用性拒绝服务。\n修复版本中通过引入 SelectorLimits 共享结构，强制约束 max_length、max_list_items、max_compound_simple_selectors、max_complex_selector_parts、max_parse_depth、max_match_depth、max_match_steps 与 max_match_bytes，并在 SelectorParser、query、matches 与 transform 编译入口统一应用；SelectorMatcher 增加祖先、兄弟、位置、属性、class、:not(...)、:nth-child(...) 与文本内容的预计算缓存以及程序化环路的去重与循环守卫；linkify._trim_trailing 改为一次性统计配对字符并以索引递减方式剥离尾部未闭合括号，消除原 O(n²) 重扫。", "effects": [{"comp_name": "justhtml", "ecosystem": "pip", "versions": [{"affected_version": "[0,1.18.0)", "min_fixed_version": "1.18.0", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "拒绝服务", "kind_en": "不受控制的资源消耗", "last_modified_time": "2026-08-23", "level": "High", "mps_id": "MPS-lzxq-vset", "poc": false, "poc_url": [], "published_time": "2026-08-23", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-lzxq-vset", "name": "https://www.oscs1024.com/hd/MPS-lzxq-vset"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-4671", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-4671"}, {"url": "https://github.com/EmilS ne 请求体中的 JSON 字段 timestr 后，将该字符串通过 sprintf 与固定格式 \"date -s \\\"%s\\\" \u003e /dev/null\" 拼入栈上的 128 字节缓冲 v10，写入过程缺少长度校验；攻击者在已建立 Web 管理会话的前提下提交超长 timestr，可触发栈缓冲区溢出并覆盖返回地址，从而在设备上以 Web 服务权限执行任意代码。\n修复版本中通过在调用 sprintf 前对 timestr 长度进行边界检查，或改用 snprintf 等带长度限制的格式化函数，避免用户输入覆盖栈缓冲及后续控制数据，从根本上切断溢出路径。", "effects": [{"comp_name": "comfast:cf-n1-s", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.6.0.1]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "栈缓冲区溢出", "kind_en": "基于堆栈的缓冲区溢出", "last_modified_time": "2026-08-23", "level": "High", "mps_id": "MPS-xum2-6ko7", "poc": false, "poc_url": [], "published_time": "2026-08-23", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-xum2-6ko7", "name": "https://www.oscs1024.com/hd/MPS-xum2-6ko7"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-78050", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-78050"}, {"url": "https://github.com/AdminSafe/CVE/issues/9", "name": ""}, {"url": "https://vuldb.com/cve/CVE-2026-78050", "name": ""}, {"url": "https://vuldb.com/submit/881293", "name": ""}, {"url": "https://vuldb.com/vuln/394291", "name": ""}, {"url": "https://vuldb.com/vuln/394291/cti", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Comfast CF-N1-S 路由器 ntp_timezone 栈缓冲区溢出漏洞", "_translated": true, "_saved_at": "2026-08-23T05:22:55+00:00", "_first_saved_at": "2026-08-23T00:57:48+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-xum2-6ko7"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-74640", "cvss": {}, "cvss_score": 8.5, "cvss_vector": "", "cwe": "CWE-787", "description": "Linux内核的ALSA子系统提供对USB音频设备的统一驱动框架，其中 sound/usb/fcp.c（Focusrite Control Protocol驱动）由 commit 46757a3e7d50 引入，用于在支持FCP的Focusrite USB音频接口上暴露Level Meter控件。该驱动以GPL开源形式随内核主线分发。\n受影响版本中，fcp_ioctl_set_meter_map() 仅按驱动自身上限 map.map_size\u003c1 || map.map_size\u003e255 校验用户传入的Level Meter map大小，并将该值原样赋给新控件 elem-\u003echannels；后续 fcp_meter_ctl_get() 在响应 /dev/snd/controlC0 上的 SNDRV_CTL_IOCTL_ELEM_READ 时，按 elem-\u003echannels 把每通道的8字节采样写入 struct snd_ctl_elem_value.value.integer.value[i]，但该数组在LP64下仅有128个long槽位，elem-\u003echannels 仍可能高达255，从而在第144个元素起发生堆外写入，最大越界888字节并越过kmalloc-2048的边界污染相邻slab对象。被污染的8字节内容来源于设备返回数据并由 meter_level_map[] 选择具体落点，因此越界长度与写入内容均可控。安装过大的map需要CAP_SYS_RAWIO，但被创建的kcontrol生命周期长于用于安装的hwdep描述符，因而任何具备读取 /dev/snd/controlC0 权限的本地进程都能触发该越界写。\n修复版本中通过在 sound/usb/fcp.c 中引入 FCP_MAX_METER_MAP_SIZE（即 sizeof_field(struct snd_ctl_elem_value, value.integer.value) / sizeof(long)），把 map.map_size 上限收紧为ABI真实允许的128，并在 fcp_meter_ctl_get() 的循环前加入 WARN_ON_ONCE(elem-\u003echannels \u003e FCP_MAX_METER_MAP_SIZE) 防御性校验，保证 elem-\u003echannels 任何取值都不会越界写入 value 数组。", "effects": [{"comp_name": "linux_kernel", "ecosystem": "linux", "versions": [{"affected_version": "[6.19-rc1,7.1.9)", "min_fixed_version": "7.1.9", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[7.2-rc1,7.2)", "min_fixed_version": "7.2", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.14,6.18.45)", "min_fixed_version": "6.18.45", "repository": "unmanag e API 端点进行白名单过滤，常用于限制 Traefik、Portainer 等容器编排组件对宿主机 Docker socket 的访问。\n受影响版本中，haproxy.cfg 的 frontend dockerfrontend 段仅对 /containers/{id}/start|stop|restart|kill|pause|unpause 这几个子路径做了显式 ACL，而 ^(/v[\\d\\.]+)?/containers 这条规则只匹配到 /containers 根路径。当运维人员把 CONTAINERS=1 当作“只读查看容器元数据”的安全配置启用时，/containers/{id}/archive、/containers/{id}/export、/containers/{id}/logs、/containers/{id}/top 这四个危险子路径没有命中任何 deny 规则，会一路穿透到 default_backend dockerbackend 并被转发到宿主 /var/run/docker.sock，导致任意联网调用方仅通过 GET 请求就能从任一容器内读取任意文件、下载完整文件系统 tar 包、读取容器日志以及枚举进程命令行。\n修复版本中通过为 /containers/{id}/archive、/containers/{id}/export、/containers/{id}/logs 引入新的 ALLOW_ARCHIVE、ALLOW_EXPORT、ALLOW_LOGS 环境变量，并在对应子路径未启用时显式 http-request deny 把请求阻断，从而把 CONTAINERS=1 的语义收窄为只能访问容器列表与 inspect 等只读元数据，攻击者即使保持 CONTAINERS=1 也无法再触达这四个危险子路径。", "effects": [{"comp_name": "tecnativa/docker-socket-proxy", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,0.5.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "高", "fix_suggestion": "建议修复", "kind": "访问控制的粒度不够", "kind_en": "访问控制粒度不够", "last_modified_time": "2026-08-23", "level": "High", "mps_id": "MPS-mktl-o3sf", "poc": true, "poc_url": [], "published_time": "2026-08-23", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-mktl-o3sf", "name": "https://www.oscs1024.com/hd/MPS-mktl-o3sf"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-78122", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-78122"}, {"url": "https://gist.github.com/nedlir/e4f52f88a757f02c67db1fd5dd70d732", "name": ""}, {"url": "https://github.com/Tecnativa/docker-socket-proxy", "name": ""}, {"url": "https://github.com/Tecnativa/docker-socket-proxy/blob/v0.5.0/haproxy.cfg#L49-L61", "name": ""}, {"url": "https://github.com/Tecnativa/docker-socket-proxy/issues/182", "name": ""}, {"url": "https://github.com/Tecnativa/docker-socket-proxy/pull/183", "name": ""}, {"url": "https://www.vulncheck.com/advisories/docker-socket-proxy-through-insufficient-access-control-granularity-exposes-container-filesystems", "name": ""}], "scope_influence": "", "tags": ["poc", "应用软件"], "title": "docker-socket-proxy CONTAINERS=1 容器文件系统读取漏洞", "_translated": true, "_saved_at": "2026-08-23T02:23:35+00:00", "_first_saved_at": "2026-08-23T00:57:51+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-mktl-o3sf"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-74641", "cvss": {}, "cvss_score": 7.8, "cvss_vector": "", "cwe": "CWE-787", "description": "ALSA usx2y 是 Linux 内核中面向 Tascam US-X2Y 系列 USB 音频接口的驱动模块，源码位于 sound/usb/usx2y/。\n受影响版本中，snd_us428ctls_vm_fault() 将调用者经 mmap() 传入的页偏移直接加到单页大小的 us428ctls_sharedmem 基地址上形成内核虚拟地址，再用 virt_to_page() 与 get_page() 取到任意 struct page 并填回 vmf-\u003epage，且 snd_us428ctls_mmap() 只校验映射长度不校验偏移；该字符设备的 file_mmap_size_max() 返回 ULONG_MAX，MM 子系统也不会强制上限，攻击者可以挑选任意页帧将原本不属于该对象的内核内存页以可读可写方式映射进用户态 VMA，若偏移命中未填充的 vmemmap 区则直接触发内核 oops。\n修复版本中通过在两个 vm_fault 处理入口处将偏移与各自共享区域的总页数 US428_SHAREDMEM_PAGES、USX2Y_HWDEP_PCM_PAGES 进行边界比较，超出范围的偏移返回 VM_FAULT_SIGBUS，拒绝任何超出共享区域的映射请求。", "effects": [{"comp_name": "linux_kernel", "ecosystem": "linux", "versions": [{"affected_version": "[2.6.12,5.15.216)", "min_fixed_v 47b51a1b2b330f2e083a454125f2", "name": ""}, {"url": "https://git.kernel.org/stable/c/f75d6f61f0d9c5c1ea725104014e10d26d1e3a00", "name": ""}], "scope_influence": "", "tags": ["操作系统"], "title": "Linux 内核 ALSA usx2y hwdep mmap 偏移量缺少边界导致任意内核页面映射", "_translated": true, "_saved_at": "2026-08-22T17:15:21+00:00", "_first_saved_at": "2026-08-22T17:15:21+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-1dju-5vc4"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "attack_vector_type": "Local", "cnvd_id": "", "cve_id": "CVE-2026-74727", "cvss": {}, "cvss_score": 7.8, "cvss_vector": "", "cwe": "CWE-416", "description": "Linux 内核是开源、跨平台的操作系统内核，其中 drivers/net/ovpn 子系统实现基于 WireGuard 思路的 OVPN 隧道驱动，对外通过 generic netlink 接口与 UDP 套接字管理 peer 与传输端点。\n受影响版本中，ovpn_nl_peer_set_doit() 先通过 ovpn_peer_get_by_id() 解析目标 peer，仅持有引用计数后再获取 ovpn-\u003elock；窗口期内的并发 OVPN_CMD_PEER_DEL、keepalive 过期或套接字拆除可能先获得锁，调用 ovpn_peer_remove() 将 peer 从 by_id、by_vpn_addr4/6、by_transp_addr 四张哈希表中 unhash 并释放锁；set_doit 之后才取得锁并调用 ovpn_peer_hash_vpn_ip()，将已被移除的 peer 重新插入哈希表。float 路径上 ovpn_peer_endpoints_update() 在异步 AEAD 解密与 netlink 通知之后才取锁，同样会在 by_transp_addr 中再次哈希同一 peer。peer 在引用计数归零后通过 call_rcu 释放，但内嵌的哈希节点尚未断链，形成 UAF 窗口。\n修复版本中通过在 ovpn-\u003elock 保护下判断 hash_entry_id 是否已 unhash 来跳过 rehash，复用 ovpn_peer_remove() 已有的哨兵检测；该检查对 add 路径是无副作用的，因为 ovpn_peer_add_mp() 在调用 ovpn_peer_hash_vpn_ip() 之前已插入 hash_entry_id，从而切断「先移除再被 rehash」的因果链，关闭 UAF 窗口。", "effects": [{"comp_name": "linux:linux_kernel", "ecosystem": "linux", "versions": [{"affected_version": "[6.16,6.18.45)", "min_fixed_version": "6.18.45", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.16,7.1.9)", "min_fixed_version": "7.1.9", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.16,7.2)", "min_fixed_version": "7.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "UAF", "kind_en": "免费后使用", "last_modified_time": "2026-08-23", "level": "High", "mps_id": "MPS-5qsy-cw9r", "poc": false, "poc_url": [], "published_time": "2026-08-23", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-5qsy-cw9r", "name": "https://www.oscs1024.com/hd/MPS-5qsy-cw9r"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-74727", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-74727"}, {"url": "https://git.kernel.org/stable/c/33ec10567fe14456063daf549fdf1a4f53448e4c", "name": ""}, {"url": "https://git.kernel.org/stable/c/66745480298775f188b2f5ad266643e85a90f73b", "name": ""}, {"url": "https://git.kernel.org/stable/c/d20c181088984b6eaa8d7fe7cb5ab3510988df59", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Linux 内核 OVPN 驱动哈希重入导致 UAF", "_translated": true, "_saved_at": "2026-08-22T22:15:23+00:00", "_first_saved_at": "2026-08-22T18:20:12+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-5qsy-cw9r"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（ ": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "eval注入", "kind_en": "动态评估代码中指令的不当中和（“评估注入”）", "last_modified_time": "2026-08-23", "level": "High", "mps_id": "MPS-dy7m-6ej1", "poc": false, "poc_url": [], "published_time": "2026-08-23", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-dy7m-6ej1", "name": "https://www.oscs1024.com/hd/MPS-dy7m-6ej1"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-78136", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-78136"}, {"url": "https://github.com/cduram/CHIRP-CodeExecution_via_Malicious_ImageFile", "name": ""}, {"url": "https://github.com/kk7ds/chirp/commit/39178dbfc4fece083ab9ed20286d6ae3a91a718e", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "CHIRP Kenwood ITM 驱动 eval 注入漏洞", "_translated": true, "_saved_at": "2026-08-23T05:22:54+00:00", "_first_saved_at": "2026-08-23T02:23:30+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-dy7m-6ej1"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "attack_vector_type": "Local", "cnvd_id": "", "cve_id": "CVE-2026-74724", "cvss": {}, "cvss_score": 7.8, "cvss_vector": "", "cwe": "CWE-787", "description": "Linux 内核是开源操作系统内核，IPVS（IP Virtual Server）作为 netfilter 模块提供基于 LVS 的四层负载均衡与 NAT 转发能力，其中 ip_vs_nat_icmp 负责在 ICMP 差错报文中改写内嵌的传输层头。\n受影响版本中，ip_vs_nat_icmp 在 has_ports 分支直接以 ciph-\u003eihl*4 推导端口偏移，但 ihl 字段在 skb 进入 IPVS 钩子与该函数读取之间并未冻结，本地攻击者可在两次读取之间改写 ihl，使后续对 (void *)ciph + ciph-\u003eihl*4 处的写入越过已校验的 ICMP/内嵌 IP 区域，造成内核堆越界写入并可能被进一步利用。ip_vs_out_icmp 与 ip_vs_in_icmp 中也存在多处重复读取 ihl 的同类问题，构成相同的越界风险。\n修复版本中通过将 ip_vs_iphdr ciph 参数从调用方传入（与 IPv6 处理方式一致）并在 has_ports 分支改用 ciph-\u003elen 作为内嵌传输层头偏移，消除了对 ihl 的二次读取，同时把 ip_vs_out_icmp/ip_vs_in_icmp 中多处 IPv4 头校验统一为只读取一次 ihl，从根本上切断本地攻击者借助 TOCTOU 改包触发越界写入的链路。", "effects": [{"comp_name": "linux_kernel", "ecosystem": "linux", "versions": [{"affected_version": "[2.6.12,6.1.183)", "min_fixed_version": "6.1.183", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.2-rc1,6.6.152)", "min_fixed_version": "6.6.152", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.7-rc1,6.12.104)", "min_fixed_version": "6.12.104", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.13-rc1,6.18.45)", "min_fixed_version": "6.18.45", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.19-rc1,7.1.9)", "min_fixed_version": "7.1.9", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[7.2-rc1,7.2)", "min_fixed_version": "7.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-08-23", "level": "High", "mps_id": "MPS-i3yv-ejxa", "poc": false, "poc_url": [], "published_time": "2026-08-23", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-i3yv-ejxa", "name": "https://www.oscs1024.com/hd/MPS-i3yv-ejxa"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-74724", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-74724"}, {"url": "https://git.kernel.org/stable/c/243d0187ec4c3837b9b0004f18d1068e46115760", "name": ""}, {"url": "https://git.kernel.org/stable/c/3b8f79af0e98f27b932b0b416e9c52b692d31ff9", "name": ""}, {"url": "https://git.kernel.org/stable/c/3c779b258c9c3c3567af68d4f45c2f751f35bd0e", "name": ""}, {"url": "https://git.kernel.org/stable/c/646922a0379496154e8c8faca4f8e2fd9100cacc", "name": ""}, {"url": "https://git.kernel.org/stable/c/a69a4b3fff5814d079beff9a1e9d369994b2ed47", "name": ""}, {"url": "https://git.kernel.org/stable/c/be65fa324640c7a95e30b146159a2be5cc73f22e", "name": ""}], "scope_influence": "", "tags": ["操作系统"], "title": "Linux内核IPVS ICMP模块越界写入漏洞", "_translated": true, "_saved_at": "2026-08-22T22:15:24+00:00", "_first_saved_at": "2026-08-22T21:15:25+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-i3yv-ejxa"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "attack_vector_type": "Local", "cnvd_id": "", "cve_id": "CVE-2026-74637", "cvss": {}, "cvss_score": 7.8, "cvss_vector": "", "cwe": "CWE-416", "description": "Linux 内核是开源操作系统内核，其 perf 子系统负责硬件性能计数与事件采样，并通过 file_operations 中的 ioctl 接口向用户态进程开放 perf_event 文件描述符的创建、组管理、过滤与启用等操作。\n受影响版本中，kernel/events/core.c 中的 perf_group_detach 对组领导者与成员事件采用不同的分离路径：成员事件以 DETACH_GROUP 方式脱离上下文时，仅从原领导者的 sibling_list 中移除，但自身的 group_leader 指针仍指向已被分离或随后被释放的原领导者。用户态通过 PERF_IOC_FLAG_GROUP 等 ioctl 命中 perf_ioctl 时，perf_event_for_each 会沿 sibling-\u003egroup_leader 跟随陈旧指针，再在 perf_event_for_each_child 中解引用已释放领导者的 context，导致内核页错误与本地拒绝服务，并具备权限提升风险。\n修复版本中通过新增 perf_promote_sibling_to_leader 辅助函数，在成员事件脱离时主动将其提升为独立事件，重置 group_leader 为自身并修正 group_caps、active_list 与 PERF_ATTACH_CONTEXT 关联，从而切断陈旧指针路径，同时修复 __event_disable 中的 cgroup 记账与事件状态切换。", "effects": [{"comp_name": "linux_kernel", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,6.18.7]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "UAF", "kind_en": "免费后使用", "last_modified_time": "2026-08-23", "level": "High", "mps_id": "MPS-udfl-shoc", "poc": false, "poc_url": [], "published_time": "2026-08-23", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-udfl-shoc", "name": "https://www.oscs1024.com/hd/MPS-udfl-shoc"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-74637", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-74637"}, {"url": "https://git.kernel.org/stable/c/1e7abfeb23c12bf46f6457e4a3e1a1a300d50619", "name": ""}, {"url": "https://git.kernel.org/stable/c/42c5ca1f0a288a52878bd72a5595b08261057438", "name": ""}, {"url": "https://git.kernel.org/stable/c/a979a642402d0b1f856c7a729b4cb2d92de4cf2f", "name": ""}], "scope_influence": "", "tags": ["操作系统"], "title": "perf/core组领导者释放后使用漏洞", "_translated": true, "_saved_at": "2026-08-22T17:15:25+00:00", "_first_saved_at": "2026-08-22T17:15:25+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-udfl-shoc"}, {"analysis_status": 0, "articles": [{"content": "由于整数类型的有限范围，在进行算术运算或操作时，结果可能超出类型的表示范围，导致溢出或环绕。溢出指的是结果超过了类型的最大值或小于了最小值，而环绕指的是结果绕回到类型的最小值或最大值。", "title": "什么是整数溢出或环绕"}, {"content": "- 缓冲区溢出：整数溢出可能导致缓冲区溢出漏洞。当整数溢出导致分配的缓冲区大小不足以容纳结果时，攻击者可以利用这个漏洞覆盖相邻的内存区域，执行恶意代码或篡改程序的状态。\r\n- 身份验证绕过：在进行身份验证或访问控制时，整数溢出可能导致绕过验证的漏洞。攻击者可以构造特殊的输入，使溢出的整数值绕过了预期的验证逻辑，从而获得未经授权的访问权限。\r\n- 数据篡改：整数溢出可能导致数据篡改漏洞。攻击者可以通过使整数溢出，修改计数器、索引或其他控制数据的值，导致程序在处理数据时发生错误或执行意外的操作。", "title": "整数溢出或环绕常见的攻击方式"}, {"content": "- 输入验证与限制：对用户输入的整数进行合理的验证和限制，确保其在允许的范围内。\r\n- 使用安全的整数操作函数：使用安全的整数操作函数，如`add_with_overflow()`、`sub_with_overflow()`、`mul_with_overflow()`等，这些函数会检查并处理溢出情况，确保计算结果在安全范围内。\r\n- 类型检查和转换：在进行整数运算或操作之前，进行类型检查和转换，确保操作数的类型和范围是合适的。\r\n- 强制性编码标准和最佳实践：制定强制性的编码标准和最佳实践，包括对整数运算和操作的规范和限制，以帮助程序员编写更可靠、安全的代码。\r\n- 静态代码分析和测试：使用静态代码分析工具和测试技术来检测和识别潜在的整数溢出问题。这些工具可以帮助发现代码中可能存在的溢出漏洞，并及时修复。", "title": "如何预防整数溢出或环绕"}], "attack_vector_type": "Local", "cnvd_id": "", "cve_id": "CVE-2026-74721", "cvss": {}, "cvss_score": 7.8, "cvss_vector": "", "cwe": "CWE-190", "description": "Linux内核的 amdxdna 驱动属于 drivers/accel 子系统，为 AMD XDNA AI 引擎（NPU）加速器提供用户态 BO（Buffer Object）导入导出与 mmap 能力，是 AI/ML 推理加速的基础设施组件。\n受影响版本中，drivers/accel/amdxdna/amdxdna_gem.c 的 amdxdna_insert_pages 函数在两条错误返回路径上提前调用了 vma-\u003evm_ops-\u003eclose(vma)。该调用由 HMM 区间通知器注册函数所在的 amdxdna_gem_obj_mmap 触发，mmap 失败跳转到 hmm_unreg 路径后，本应仅撤销区间通知器注册，但代码同时把 shmem 的 pages_pin_count 与 GEM 对象引用计数一并释放；mmap 系统调用尚未返回 VMA 已活，等到进程 munmap 时内核 VMA 拆除会再次调用 vm_ops-\u003eclose，造成引用计数下溢。\n修复版本中通过新增 amdxdna_mark_mapp_invalid 把错误路径改为延迟缺页处理，保留 VMA 存活并交由 HMM range-fault 路径重试插入，从而切断 vm_ops-\u003eclose 在 mmap 返回前被提前调用的因果链。", "effects": [{"comp_name": "linux", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,6.16.0)", "min_fixed_version": "6.16.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "整数溢出或环绕", "kind_en": "整数溢出或环绕", "last_modified_time": "2026-08-23", "level": "High", "mps_id": "MPS-x5iz-wpek", "poc": false, "poc_url": [], "published_time": "2026-08-23", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-x5iz-wpek", "name": "https://www.oscs1024.com/hd/MPS-x5iz-wpek"}, {"url": "https:/ fied_time": "2026-08-23", "level": "High", "mps_id": "MPS-6d4l-0noq", "poc": false, "poc_url": [], "published_time": "2026-08-23", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-6d4l-0noq", "name": "https://www.oscs1024.com/hd/MPS-6d4l-0noq"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-47895", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-47895"}, {"url": "https://github.com/strongswan/strongswan/releases/tag/6.0.7", "name": ""}, {"url": "https://www.strongswan.org/download.html", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "strongSwan EAP身份克隆双重释放漏洞", "_translated": true, "_saved_at": "2026-08-23T02:23:36+00:00", "_first_saved_at": "2026-08-22T23:14:33+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-6d4l-0noq"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-74730", "cvss": {}, "cvss_score": 7.4, "cvss_vector": "", "cwe": "CWE-416", "description": "Linux kernel 是开源操作系统内核，其 NFSv4 客户端子系统负责通过网络文件系统协议访问远程文件服务器。\n受影响版本中，fs/nfs/nfs4proc.c 的 nfs41_free_stateid 函数在发起异步 FREE_STATEID RPC 时，仅通过 nfs_put_client 释放 nfs_client 的引用计数，并未对 nfs_server 关联的 superblock 做引用计数保护。Dan Aloni 报告，当 Free_STATEID 操作被延迟时，nfs_server 可能在 RPC 完成前被回收；后续 nfs41_free_stateid_release 回调访问 data-\u003eserver-\u003enfs_client 等已释放对象时，触发 use-after-free。该缺陷由 2013 年的 7c1d5fae4a87 提交（将 nfs41_free_stateid 改造为异步 RPC）引入。\n修复版本中通过在 nfs41_free_stateid 中先调用 nfs_sb_active(server-\u003esuper) 提升 superblock 引用计数，并在 nfs41_free_stateid_release 中对应调用 nfs_sb_deactive，确保 RPC 在途期间 nfs_server 不会被清理，从而切断 use-after-free 链路。", "effects": [{"comp_name": "bpftool", "ecosystem": "linux", "versions": [{"affected_version": "影响所有版本", "min_fixed_version": "", "repository": "debian:12", "solutions": [], "upstream": false}, {"affected_version": "影响所有版本", "min_fixed_version": "", "repository": "debian:11", "solutions": [], "upstream": false}, {"affected_version": "影响所有版本", "min_fixed_version": "", "repository": "debian:13", "solutions": [], "upstream": false}]}, {"comp_name": "hyperv-daemons", "ecosystem": "linux", "versions": [{"affected_version": "影响所有版本", "min_fixed_version": "", "repository": "debian:12", "solutions": [], "upstream": false}, {"affected_version": "影响所有版本", "min_fixed_version": "", "repository": "debian:11", "solutions": [], "upstream": false}, {"affected_version": "影响所有版本", "min_fixed_version": "", "repository": "debian:13", "solutions": [], "upstream": false}]}, {"comp_name": "intel-sdsi", "ecosystem": "linux", "versions": [{"affected_version": "影响所有版本", "min_fixed_version": "", "repository": "debian:13", "solutions": [], "upstream": false}]}, {"comp_name": "libcpupower-dev", "ecosystem": "linux", "versions": [{"affected_version": "影响所有版本", "min_fixed_version": "", "repository": "debian:12", "solutions": [], "upstream": false}, {"affected_version": "影响所有版本", "min_fixed_version": "", "repository": "debian:13", "solutions": [], "upstream": false}]}, {"comp_name": "libcpupower1", "ecosystem": "linux", "versions": [{"affected_version": "影响所有版本", "min_fixed_version": "", "repository": "debian:12", "solutions": [], "upstream": false}, {"affected_version": "影响所有版本", "min_fixed_version": "", "repository": "debian:11", "solutions": [], "upstream": false}, {"affected_version"
