xploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-10-14", "level": "Critical", "mps_id": "MPS-1zfx-3hsv", "poc": false, "poc_url": [], "published_time": "2026-10-14", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-1zfx-3hsv", "name": "https://www.oscs1024.com/hd/MPS-1zfx-3hsv"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-75732", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-75732"}, {"url": "https://helpx.adobe.com/security/products/experience-manager/apsb26-152.html", "name": ""}], "scope_influence": "", "tags": [], "title": "Adobe 体验经理 |授权不正确 (CWE-863)", "_translated": true, "_saved_at": "2026-10-13T22:11:00+00:00", "_first_saved_at": "2026-10-13T22:11:00+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-1zfx-3hsv"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "cnvd_id": "", "cve_id": "CVE-2026-105445", "cvss": {}, "cvss_score": 9.9, "cvss_vector": "", "cwe": "CWE-269", "description": "Docker Hub 是 Docker 提供的容器镜像托管与分发服务，账户、组织与仓库权限由厂商托管运行，不属于公开源码项目，主要用于镜像发布、拉取和团队协作。\n受影响版本中，将个人账户转换为组织时会把原账户的个人访问令牌改挂到被指定的新所有者名下，但不轮换也不吊销令牌密钥，也不征求或通知该所有者。攻击者可自建账户并签发个人访问令牌，再把该账户转成组织并指定受害用户为所有者，使原令牌在容器镜像仓库以受害用户身份通过认证，进而在令牌权限和受害用户仓库权限范围内拉取、推送或删除个人仓库及关联组织中的镜像。该缺陷不能用于访问 Docker Hub 网页、修改密码、邮箱或双因素认证，也不能完整接管账户。\n修复版本中通过从账户转组织流程中彻底移除个人访问令牌转移，使转换后令牌不再改挂到被指定所有者，并停用窗口期内已转移令牌，切断攻击者持有原密钥却以受害用户身份访问仓库的路径。", "effects": [{"comp_name": "docker_hub", "ecosystem": "linux", "versions": [{"affected_version": "[2024-08-26,2026-09-30)", "min_fixed_version": "2026-09-30", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-10-14", "level": "Critical", "mps_id": "MPS-6e3b-586a", "poc": false, "poc_url": [], "published_time": "2026-10-14", "reference_url_list": [{"url": "https://cybersecuritynews.com/docker-hub-vulnerability/", "name": ""}, {"url": "https://www.docker.com/blog/docker-hub-security-advisory-cve-2026-105445/", "name": ""}, {"url": "https://ghostpat.com/", "name": ""}, {"url": "https://www.bleepingcomputer.com/news/security/docker-hub-flaw-let-attackers-impersonate-users-tamper-with-images/", "name": ""}, {"url": "https://docs.docker.com/accounts/organization/setup/convert-account/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Docker Hub令牌冒用漏洞", "_translated": true, "_saved_at": "2026-10-13T17:26:05+00:00", "_first_saved_at": "2026-10-13T17:26:05+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-6e3b-586a"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-97381", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.9}]}, "cvss_score": 9.9, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "cwe": "CWE-393", "description": "Legacy Update 是用于在旧版 Windows PC 上激活和安装更新的工具。旧版更新 1.12.0 到 1.13.1 在其 ActiveX 控件的 IsPermissed 方法中包含源验证错误。成功读取托管文档的主机名后，不在允许列表中的主机名会在未设置 E_ACCESSDENIED 的 ed_at": "2026-10-14T01:31:54+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-nure-amgp"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-90531", "cvss": {"cvssv31": [{"source": "psirt@adobe.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:N", "severity": "critical", "base_score": 9.6}]}, "cvss_score": 9.6, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:N", "cwe": "CWE-611", "description": "Adobe Experience Manager 受到 XML 外部实体引用不当限制 (“XXE”) 漏洞的影响，该漏洞可能导致权限升级。低权限攻击者可以利用此漏洞来获得对内部资源的更高访问权限。利用此问题不需要用户交互。范围已更改。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XXE", "kind_en": "XML外部实体引用限制不当", "last_modified_time": "2026-10-14", "level": "Critical", "mps_id": "MPS-9d7i-g582", "poc": false, "poc_url": [], "published_time": "2026-10-14", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-9d7i-g582", "name": "https://www.oscs1024.com/hd/MPS-9d7i-g582"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-90531", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-90531"}, {"url": "https://helpx.adobe.com/security/products/experience-manager/apsb26-152.html", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-90531漏洞", "_translated": true, "_saved_at": "2026-10-13T22:10:50+00:00", "_first_saved_at": "2026-10-13T22:10:50+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-9d7i-g582"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-83662", "cvss": {"cvssv31": [{"source": "psirt@adobe.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:H/I:H/A:N", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:H/I:H/A:N", "cwe": "CWE-79", "description": "Adobe Experience Manager 受到反映的跨站点脚本 (XSS) 漏洞的影响。攻击者可以利用此漏洞将恶意脚本注入网页，从而可能获得对受害者帐户或会话的更高访问权限或控制权。利用此问题需要用户交互，因为受害者必须访问恶意制作的 URL 或与受感染的网页交互。范围已更改。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-10-14", "level": "Critical", "mps_id": "MPS-o2uw-gd7q", "poc": false, "poc_url": [], "published_time": "2026-10-14", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-o2uw-gd7q", "name": "https://www.oscs1024.com/hd/MPS-o2uw-gd7q"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-83662", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-83662"}, {"url": "https://helpx.adobe.com/security/products/experience-manager/apsb26-152.html", "name": ""}], "scope_influence": "", "tags": [], "title": "Adobe 体验经理 |跨站脚本（反射型 XSS）(CWE-79)", "_translated": true, "_saved_at": "2026-10-13T22:10:59+00:00", "_first_saved_at": "2026-10-13T22:10:59+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-o2uw-gd7q"}, {"analysis_status": 0, "articles": [{"content": "应用程序在处理用户输入时的不完善或缺乏验证机制，所以攻击者能够通过向应用程序发送恶意输入，利用应用程序对输入数据的错误处理方式来注入自己的恶意代码。这些恶意代码会被应用程序误认为是合法的指令或数据，并在执行过程中被执行。", "title": "什么是代码注入"}, {"content": "应用程序使用可执行动态代码的函数来执行用户可控的参数，当应用程序对于用户输入过滤不完全时，攻击者可以注入恶意代码并控制代码执行流程。", "title": "代码注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对所有用户输入进行验证和过滤，确保只接受预期的有效输入。这包括对输入数据进行输入长度验证、类型检查和格式验证等。\r\n- 使用参数化查询或预编译语句：对于数据库查询操作，应该使用参数化查询或预编译语句，确保输入数据不会被误认为是执行代码。\r\n- 最小特权原则：应用程序在执行操作系统命令或动态代码时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。\r\n- 安全编码实践：开发人员应该采用安全编码实践，包括避免使用eval函数、避免拼接用户输入的字符串作为代码执行等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止代码注入攻击。", "title": "如何预防代码注入"}], "cnvd_id": "", "cve_id": "CVE-2026-55695", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.1}]}, "cvss_score": 9.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:C/C:H/I:H/A:H", "cwe": "CWE-94", "description": "FearlessCMS 是以扁平文件存储为核心的开源内容管理系统，提供后台管理、插件扩展与系统更新能力。\n受影响版本中，已认证管理员可向 admin/updater-handler.php 提交任意 Git 仓库 URL，save_settings 未校验仓库身份即把 $_POST['repo'] 写入 config.json 的 update_repo_url。随后 perform_update 将该 URL 传给 update.sh，download_update 对其执行 git clone，perform_update 再用克隆内容覆盖 plugins/、admin/ 与 includes/。router.php 对 uploads/ 与 admin/ 之外且磁盘上已存在的 PHP 文件返回 false，PHP 内置开发服务器会直接执行 plugins 目录中植入的脚本，使恶意 PHP 以 Web 进程权限持久运行。\n修复版本中通过在 save_settings 增加仅允许 GitHub HTTPS 仓库地址的正则校验，拒绝任意仓库 URL 写入配置，阻止恶意内容进入更新覆盖流程。", "effects": [{"comp_name": "fearlessgeek/fearlesscms", "ecosystem": "composer", "versions": [{"affected_version": "(-∞,0.1.3b)", "min_fixed_version": "0.1.3b", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "代码注入", "kind_en": "代码生成控制不当（“代码注入”）", "last_modified_time": "2026-10-14", "level": "Critical", "mps_id": "MPS-l0id-tpbw", "poc": false, "poc_url": [], "published_time": "2026-10-14", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-l0id-tpbw", "name": "https://www.oscs1024.com/hd/MPS-l0id-tpbw"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-55695", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-55695"}, {"url": "https://github.com/fearlessgeekmedia/FearlessCMS/security/advisories/GHSA-56wm-3q3v-m93m", "name": "https://github.com/fearlessgeekmedia/FearlessCMS/security/advisories/GHSA-56wm-3q3v-m93m"}, {"url": "https://github.com/fearlessgeekmedia/FearlessCMS/pull/64", "name": "https://github.com/fearlessgeekmedia/FearlessCMS/pull/64"}, {"url": "https://github.com/fearlessgeekmedia/FearlessCMS/commit/6dba91d496463e3940a2c917af3cae97b191de92", "name": "https://github.com/fearlessgeekmedia/FearlessCMS/commit/6dba91d496463e3940a2c917af3cae97b191de92"}, {"url": "https://github.com/fearlessgeekmedia/FearlessCMS/releases/tag/0.1.3", "name": "https://github.com/fearlessgeekmedia/FearlessCMS/releases/tag/0.1.3"}], "scope_influence": "", "tags": ["php", "开源"], "title": "FearlessCMS更新器代码注入漏洞", "_translated": true, "_saved_at": "2026-10-13T17:26:07+00:00", "_first_saved_at": "2026-10-13T17:26:07+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-l0id-tpbw"}, {"analysis_status": 3, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "cnvd_id": "", "cve_id": "CVE-2026-97205", "cvss": {"cvssv31": [{"source": "f5sirt@f5.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.1}], "cvssv4": [{"source": "f5sirt@f5.com", "vector": "CVSS:4.0/AV:N/AC:H/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.2}, {"source": "murphysec", "vector": "CVSS:4.0/AV:N/AC:H/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.2}]}, "cvss_score": 9.2, "cvss_vector": "CVSS:4.0/AV:N/AC:H/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-416", "description": "NGINX 是一款开源的高性能 Web 服务器与反向代理软件，采用 C 语言编写，NGINX Plus 为 F5 提供的商业版本，二者广泛用于 Web 服务、负载均衡与 API 网关等场景。\n受影响版本中，当配置同时启用 Server Side Includes（ssi on）与异步文件 I/O（aio on 或 aio threads）时，处理含有 include virtual 命令的 SSI 页面会派生多个子请求，每个挂起的异步文件操作会把主请求的 r-\u003emain-\u003eblocked 计数器加一，而该字段为 8 位位域且递增处缺少上限检查，单个请求并发挂起的异步操作累计达到 256 个时计数器回绕为零，主请求及其内存池可能在异步操作仍持有引用时被提前释放，形成释放后使用，远程攻击者可借此造成内存破坏或 worker 进程崩溃，在 ASLR 被禁用或可被绕过的系统上还可能执行任意代码。\n修复版本中通过引入每请求 250 个（NGX_HTTP_MAX_BLOCKED）的挂起异步操作上限，达到上限时 copy filter 与文件缓存回退为同步读取、拒绝缓存锁等待与上游线程任务投递，使 r-\u003emain-\u003eblocked 无法溢出，切断了计数器回绕引发请求提前释放的因果链，消除了该释放后使用风险。", "effects": [{"comp_na , "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:H/A:L", "cwe": "CWE-602", "description": "Biletiva Ticketing Platform 是 Divasoft Software and E-Commerce Inc.（Divasoft Yazılım ve Elektronik Ticaret A.Ş.）提供的商业票务平台，用于在线查询和销售电影及活动门票。官方漏洞记录未指向公开源码仓库。\n受影响版本中，平台存在客户端实施服务端安全控制的问题，远程攻击者无需权限且无需用户交互即可操纵应用状态。官方将其归类为 CWE-602，攻击模式为 CAPEC-74，完整性影响为高，机密性与可用性影响为低。公开材料未给出具体接口、参数或源码位置。\n修复版本中通过安装厂商发布的日期版本更新替换受影响构建。土耳其国家网络安全机构建议至少升级到 2026-07-23 当日及之后的版本，但 CVE 记录将截至该日（含）标为受影响，两份材料对这一天是否仍受影响的表述不一致，上线前需向厂商确认实际修复构建。公开材料未披露代码修改。", "effects": [{"comp_name": "Biletiva Ticketing Platform", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2026-07-23]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "服务端安全的客户端实施", "kind_en": "服务器端安全的客户端实施", "last_modified_time": "2026-10-13", "level": "High", "mps_id": "MPS-39un-ek2c", "poc": false, "poc_url": [], "published_time": "2026-10-13", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-39un-ek2c", "name": "https://www.oscs1024.com/hd/MPS-39un-ek2c"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-13138", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-13138"}, {"url": "https://siberguvenlik.gov.tr/guvenlik-bildirimleri/detay/tr-26-1309", "name": ""}], "scope_influence": "", "tags": [], "title": "Biletiva客户端校验绕过", "_translated": true, "_saved_at": "2026-10-13T09:58:46+00:00", "_first_saved_at": "2026-10-13T09:58:46+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-39un-ek2c"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-93886", "cvss": {"cvssv31": [{"source": "psirt@us.ibm.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:R/S:C/C:H/I:H/A:L", "severity": "high", "base_score": 8.3}]}, "cvss_score": 8.3, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:R/S:C/C:H/I:H/A:L", "cwe": "CWE-79", "description": "IBM i 是 IBM 提供的闭源商用操作系统。HTTP Server Administration GUI 是其中用于管理 HTTP 服务器的图形界面，归属许可程序 5770-SS1。\n受影响版本中，该图形界面在生成网页时未充分中和用户提供的输入，远程已认证且具备高权限的攻击者可使该输入在页面中作为任意脚本执行。IBM 将其归类为 CWE-79，CVSS 要求高权限与用户交互。公开公告未披露源码文件或函数。\n修复版本中通过安装 IBM 为 5770-SS1 发布的程序临时修订（PTF）消除该输入校验缺陷。IBM i 7.6 安装 SJ11645，7.5 安装 SJ11644，7.4 安装 SJ11643，7.3 安装 SJ11641。公开材料未给出源码级修改，公告也未提供临时绕过措施。", "effects": [{"comp_name": "i", "ecosystem": "linux", "versions": [{"affected_version": "[7.4,7.4]", "min_fixed_version": "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-102523", "cvss": {}, "cvss_score": 8, "cvss_vector": "", "cwe": "CWE-73", "description": "MariaDB Server 是开源关系型数据库，用于提供 SQL 存储、查询以及分区表管理。\n受影响版本中，ALTER TABLE ... CONVERT ... PARTITION 在生成分区文件路径时未对用户指定的分区名做文件名编码。alter_partition_convert_out 与 alter_partition_convert_in 调用 create_partition_name 时传入 translate=FALSE，分区名被原样拼入 #P# 路径并交给 ha_rename_table，名称与磁盘上已编码的表文件错位，数据库用户可以读取或修改原本无权访问的表。\n修复版本中通过将这两处 create_partition_name 的 translate 参数改为 TRUE，先经 tablename_to_filename 编码分区名再拼接路径，使分区转换只作用于对应的分区文件。", "effects": [{"comp_name": "mariadb", "ecosystem": "linux", "versions": [{"affected_version": "[12.3.1,12.3.3)", "min_fixed_version": "12.3.3", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[10.11.1,10.11.19)", "min_fixed_version": "10.11.19", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[13.0.1,13.0.2)", "min_fixed_version": "13.0.2", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[11.4.1,11.4.13)", "min_fixed_version": "11.4.13", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[11.8.1,11.8.9)", "min_fixed_version": "11.8.9", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "文件名或路径的外部可控制", "kind_en": "文件名或路径的外部控制", "last_modified_time": "2026-10-13", "level": "High", "mps_id": "MPS-a76a-a750", "poc": false, "poc_url": [], "published_time": "2026-10-13", "reference_url_list": [{"url": "https://cybersecuritynews.com/critical-mariadb-flaws/", "name": ""}, {"url": "https://github.com/MariaDB/server/security/advisories/GHSA-h4vr-wpff-jfx4", "name": ""}, {"url": "https://jira.mariadb.org/browse/MDEV-40413", "name": ""}, {"url": "https://github.com/MariaDB/server/commit/98437c30ae52ed709f266e5f8095d779261a5879", "name": ""}], "scope_influence": "", "tags": [], "title": "MariaDB分区转换越权", "_translated": true, "_saved_at": "2026-10-13T09:58:45+00:00", "_first_saved_at": "2026-10-13T09:58:45+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-a76a-a750"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "cnvd_id": "", "cve_id": "CVE-2026-95837", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-269", "description": "containerd 是开源容器运行时，其 CRI 插件为 Kubernetes 等编排系统提供容器创建、检查点与恢复能力。\n受影响版本中，CreateContainer 把本地 checkpoint 归档或带检查点注解的 OCI 镜像交给 CRImportCheckpoint。该函数读取 checkpoint 中的 spec.dump、config.dump 与 status.dump，并以 restore 为 true 创建容器；StartContainer 在 Status.Restore 为 true 时调用 container.Restore，由 CRIU 按 checkpoint 恢复进程凭证、Linux capabilities、no_new_privs 与 seccomp，而不强制执行目的地 ContainerConfig。能够创建容器的攻击者可因此以 root、完整 capabilities 且无 seccomp 限制运行进程，CRI 状态仍报告请求的配置。未使用该恢复路径的系统不受影响。\n修复版本中通过默认关闭 CreateContainer 的 checkpoint restore 切断该路径。CRImportCheckpoint 在 enable_experimental_restore_via_create 为 false 时直接拒绝恢复；2.2.7 与 2.3.4 采用该默认值，2.4.0 移除该入口。重新打开该实验选项后，CRIU 恢复仍不会按目的地安全策略收敛进程状态。", "effects": [{"comp_name": "github.com/containerd/containerd/v2", "ecosystem": "go", "versions": [{"affected_version": "[2.1.0,2.2.7)", "min_fixed_version": "2.2.7", "repository": "go", "solutions": [], "upstream": true}, {"affected_version": "[2.3.0,2.3.4)", "min_fixed_version": "2.3.4", "repository": "go", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-10-13", "level": "High", "mps_id": "MPS-xtdm-h5jb", "poc": false, "poc_url": [], "published_time": "2026-10-13", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-xtdm-h5jb", "name": "https://www.oscs1024.com/hd/MPS-xtdm-h5jb"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-95837", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-95837"}, {"url": "https://github.com/containerd/containerd/security/advisories/GHSA-p7v4-vr35-mj6f", "name": "https://github.com/containerd/containerd/security/advisories/GHSA-p7v4-vr35-mj6f"}, {"url": "https://github.com/containerd/containerd/pull/13913", "name": "https://github.com/containerd/containerd/pull/13913"}, {"url": "https://github.com/containerd/containerd/commit/928c03c6898cad95f795300281fdff0dbc55a32f", "name": "https://github.com/containerd/containerd/commit/928c03c6898cad95f795300281fdff0dbc55a32f"}], "scope_influence": "", "tags": ["go"], "title": "containerd CRI权限绕过", "_translated": true, "_saved_at": "2026-10-12T20:44:55+00:00", "_first_saved_at": "2026-10-12T20:44:55+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-xtdm-h5jb"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-109687", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:C/C:H/I:N/A:L", "severity": "high", "base_score": 7.6}]}, "cvss_score": 7.6, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:C/C:H/I:N/A:L", "cwe": "CWE-89", "description": "Link Whisper Free 是 Link Whisper INC 在 WordPress.org 发布的开源插件（标识 link-whisper，GPLv2 或更高版本），用于生成站内链接建议并提供链接报告与点击统计。\n受影响版本中，具备 manage_categories 能力的已登录用户（WordPress Editor 及以上角色）打开 Clicks Report 时，Wpil_Table_Click::prepare_items 读取请求中的 orderby 与 s，并传入 Wpil_ClickTracker::get_data。该方法只对 orderby、search 和 post_type 做 sanitize_text_field，再把它们直接拼入 ORDER BY 与 LIKE 条件，请求中的特殊字符可以改变 SQL 语义，形成盲注并读取数据库中的敏感数据。\n修复版本中通过把 orderby 限制为 post_title、post_type、post_date、date、clicks，并用 $wpdb-\u003eprepare 与 esc_like 绑定 search 和 post_type，使这些输入不再作为 SQL 语法执行。", "effects": [{"comp_name": "link-whisper", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,0.9.8)", "min_fixed_version": "0.9.8", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-10-13", "level": "High", "mps_id": "MPS-slnt-7dwb", "poc": false, "poc_url": [], "published_time": "2026-10-13", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-sln ons": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "不加限制或调节的资源分配", "kind_en": "不受限制或节流地分配资源", "last_modified_time": "2026-10-13", "level": "High", "mps_id": "MPS-na7p-uyst", "poc": false, "poc_url": [], "published_time": "2026-10-13", "reference_url_list": [{"url": "https://github.com/corazawaf/coraza/security/advisories/GHSA-6r3q-mjv7-xr8m", "name": ""}, {"url": "https://github.com/corazawaf/coraza/commit/146c2f79f39ad16f13787e7d67ad400f8d8cb9a3", "name": ""}, {"url": "https://github.com/corazawaf/coraza/commit/814e1898e083d2ff2ceb644382d0da17e930f93f", "name": ""}, {"url": "https://github.com/corazawaf/coraza/commit/b98359bb7e7606c95100dcc7ad490d2d624e6dea", "name": ""}, {"url": "https://github.com/corazawaf/coraza/releases/tag/v3.8.1", "name": ""}, {"url": "https://github.com/advisories/GHSA-6r3q-mjv7-xr8m", "name": ""}], "scope_influence": "", "tags": ["go"], "title": "Coraza 参数泛洪规则绕过", "_translated": true, "_saved_at": "2026-10-12T20:44:56+00:00", "_first_saved_at": "2026-10-12T20:44:56+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-na7p-uyst"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期 :X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-304", "description": "TSplus 远程访问多重身份验证 (MFA) 机制中的不正确身份验证漏洞。使用有效的第一因素凭据进行身份验证的远程攻击者可以绕过第二因素验证，因为身份验证流程未正确应用 MFA 验证结果，从而允许攻击者在没有有效的第二因素令牌的情况下完成登录并获得对受保护应用程序和资源的访问权限。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "认证中关键步骤缺失", "kind_en": "缺少身份验证的关键步骤", "last_modified_time": "2026-10-14", "level": "High", "mps_id": "MPS-whjl-5fzk", "poc": false, "poc_url": [], "published_time": "2026-10-14", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-whjl-5fzk", "name": "https://www.oscs1024.com/hd/MPS-whjl-5fzk"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-108071", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-108071"}, {"url": "https://www.incibe.es/en/incibe-cert/notices/aviso/multiple-vulnerabilities-tsplus-remote-access", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "不正确的多重身份验证导致身份验证绕过", "_translated": true, "_saved_at": "2026-10-14T12:47:00+00:00", "_first_saved_at": "2026-10-14T12:47:00+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-whjl-5fzk"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-63174", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N", "severity": "high", "base_score": 8.1}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-862", "description": "26.10.0 之前的 Omnispace Agora 项目包含一个损坏的访问控制漏洞，该漏洞允许空间管理员将用户分配到其权限之外的空间，因为在执行 spaceAffectList 操作时没有验证调用者对目标空间的权限。攻击者可以利用导入流的连接 INSERT 中缺少的 readRight() 检查来破坏租户隔离并跨未经授权的空间操纵用户空间分配。", "effects": [{"comp_name": "Agora Project", "ecosystem": "linux", "versions": [{"affected_version": "(0,26.10.0)", "min_fixed_version": "26.10.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-10-14", "level": "High", "mps_id": "MPS-6oih-utcl", "poc": false, "poc_url": [], "published_time": "2026-10-14", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-6oih-utcl", "name": "https://www.oscs1024.com/hd/MPS-6oih-utcl"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-63174", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-63174"}, { ": "https://www.oscs1024.com/hd/MPS-9y4l-apeo"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-106931", "cvss": {"cvssv3": [{"source": "vultures@jpcert.or.jp", "vector": "CVSS:3.0/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}], "cvssv4": [{"source": "vultures@jpcert.or.jp", "vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.5}]}, "cvss_score": 8.5, "cvss_vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-78", "description": "SiteGuard Server Edition contains an OS command injection vulnerability, which may allow an attacker to execute arbitrary OS commands with root or SYSTEM privileges on the system running the affected product.", "effects": [{"comp_name": "SiteGuard Server Edition for Apache httpd", "ecosystem": "linux", "versions": [{"affected_version": "(Ver2.20,Ver8.00 Update 5)", "min_fixed_version": "Ver8.00 Update 5", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "SiteGuard Server Edition for Apache httpd on FreeBSD", "ecosystem": "linux", "versions": [{"affected_version": "(Ver2.20,Ver7.00 Update 6)", "min_fixed_version": "Ver7.00 Update 6", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "SiteGuard Server Edition for IIS", "ecosystem": "linux", "versions": [{"affected_version": "(Ver2.20,Ver8.00 Update 5)", "min_fixed_version": "Ver8.00 Update 5", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "SiteGuard Server Edition for Nginx", "ecosystem": "linux", "versions": [{"affected_version": "(Ver2.20,Ver8.00 Update 5)", "min_fixed_version": "Ver8.00 Update 5", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "SiteGuard Server Edition for Nginx on FreeBSD", "ecosystem": "linux", "versions": [{"affected_version": "(Ver2.20,Ver7.00 Update 6)", "min_fixed_version": "Ver7.00 Update 6", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-10-14", "level": "High", "mps_id": "MPS-ayxe-s68j", "poc": false, "poc_url": [], "published_time": "2026-10-14", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ayxe-s68j", "name": "https://www.oscs1024.com/hd/MPS-ayxe-s68j"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-106931", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-106931"}, {"url": "https://www.eg-secure.co.jp/siteguard/news/alert-202610-1", "name": ""}, {"url": "https://jvn.jp/en/jp/JVN88474777/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-106931漏洞", "_translated": true, "_saved_at": "2026-10-15T22:50:35+00:00", "_first_saved_at": "2026-10-14T06:59:37+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ayxe-s68j"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-86016", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:H/I:L/A:N", "severity": "high", "base_score": 8.2}]}, "cvss_score": 8.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:H/I:L/A:N", "cwe": "CWE-79", "description": "VNote 是一个笔记平台。在 4.3.0 之前，VNote 使用 src/data/extra/web/js/markdownit.js 中的赋值 `preNode.innerHTML = p_metaData` 在 protectedFromXss 清理路径运行之前将 YAML frontmatter 元数据插入到 pre 元素中。因此，打开攻击者提供的 Markdown 注释可以执行 file:// 查看器上下文中存储的 JavaScript。由于 QWebEngineSettings::LocalContentCanAccessRemoteUrls 允许本地内容访问远程 URL，因此该脚本可以读取可访问的本地笔记文件并将其内容传输到远程服务器，而无需在笔记打开后进行进一步交互。此问题已在 4.3.0 版本中修复。", "effects": [{"comp_name": "vnote", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,4.3.0)", "min_fixed_version": "4.3.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-10-14", "level": "High", "mps_id": "MPS-lj7w-1pfd", "poc": false, "poc_url": [], "published_time": "2026-10-14", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-lj7w-1pfd", "name": "https://www.oscs1024.com/hd/MPS-lj7w-1pfd"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-86016", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-86016"}, {"url": "https://github.com/vnotex/vnote/security/advisories/GHSA-vfhj-c636-h59x", "name": "https://github.com/vnotex/vnote/security/advisories/GHSA-vfhj-c636-h59x"}, {"url": "https://github.com/vnotex/vnote/commit/7371efde531312eb24beb982fb5fdd73469cb171", "name": "https://github.com/vnotex/vnote/commit/7371efde531312eb24beb982fb5fdd73469cb171"}, {"url": "https://github.com/vnotex/vnote/releases/tag/v4.3.0", "name": "https://github.com/vnotex/vnote/releases/tag/v4.3.0"}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "VNote：通过 YAML Frontmatter 存储的 XSS 导致本地文件读取和远程渗透", "_translated": true, "_saved_at": "2026-10-13T22:10:56+00:00", "_first_saved_at": "2026-10-13T22:10:56+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-lj7w-1pfd"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-110455", "cvss": {"cvssv31": [{"source": "fe490ce8-0395-4072-90d8-2707e1bd 区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "cnvd_id": "", "cve_id": "CVE-2026-94453", "cvss": {"cvssv31": [{"source": "d42dc95b-23f1-4e06-9076-20753a0fb0df", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-416", "description": "当使用 TCP 上的 IKE 连接的客户端关闭连接并且收到同一元组的另一个数据包（重新传输或恶意）时，Libreswan 的 pluto 守护程序存在释放后使用漏洞。客户端关闭连接后，IKE 状态保留在内存中，在 ike_sa.sa-\u003est_iface_endpoint 中存储指向 iface_endpoint 的指针。一旦使用了这个无效的指针，守护进程就会崩溃并重新启动。该漏洞可以在远程对等点验证自身身份之前触发。继续利用可能会导致拒绝服务。远程代码执行是可能的。默认情况下，不启用 IKE over TCP 选项；仅包含listen-tcp=yes 的配置会受到影响。", "effects": [{"comp_name": "libreswan", "ecosystem": "linux", "versions": [{"affected_version": "(5.4,5.4]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,5.3.3]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(4.0,5.3.2]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,5.4.1]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "UAF", "kind_en": "免费后使用", "last_modified_time": "2026-10-14", "level": "High", "mps_id": "MPS-16g4-evok", "poc": false, "poc_url 47)", "_translated": true, "_saved_at": "2026-10-14T01:32:04+00:00", "_first_saved_at": "2026-10-14T01:32:04+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-g6vf-7t8r"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-107431", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-862", "description": "Crocoblock JetFormBuilder jetformbuilder 中的缺少授权漏洞允许利用错误配置的访问控制安全级别。此问题影响 JetFormBuilder：从不适用到 3.6.6。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-10-14", "level": "High", "mps_id": "MPS-qtp5-befz", "poc": false, "poc_url": [], "published_time": "2026-10-14", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-qtp5-befz", "name": "https://www.oscs1024.com/hd/MPS-qtp5-befz"}, {"url": "https://nvd.nist.gov/vuln/d "", "tags": ["应用软件", "终端软件"], "title": "CVE-2026-86022漏洞", "_translated": true, "_saved_at": "2026-10-13T22:10:53+00:00", "_first_saved_at": "2026-10-13T22:10:53+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-uoyd-1aq9"}, {"analysis_status": 0, "articles": [{"content": "跨界内存读是指应用程序在读取内存时，未正确验证或限制读取的内存范围。攻击者利用这种漏洞可以读取应用程序内存中的敏感数据，如密码、加密密钥、会话令牌等。常见的原因是由于缓冲区溢出、格式化字符串漏洞或其他内存错误导致的。", "title": "什么是越界读取"}, {"content": "攻击者可以通过不当构造的输入来触发跨界内存读漏洞。攻击者可能会通过向应用程序发送特定的输入，使其读取超过预期的内存区域。攻击者可以利用这个漏洞来获取敏感信息，如其他用户的数据、操作系统的敏感数据或应用程序的内部状态。", "title": "越界读取常见的攻击方式"}, {"content": "- 输入验证和限制：应用程序应对所有输入数据进行严格的验证和限制。确保输入数据的长度、格式和内容符合预期，避免超出缓冲区或访问非预期的内存区域。\n- 内存安全编程实践：开发人员应使用安全的编程实践，如避免使用不安全的函数、正确处理内存分配和释放操作，以及遵循最小特权原则。\n- 使用安全的编程语言和库：选择使用安全性较高的编程语言和库，这些语言和库在内存管理和安全性方面提供了更多的保护机制。\n- 定期进行代码审查和安全测试：定期审查应用程序的代码，并进行安全测试，以发现潜在的跨界内存读漏洞。使用静态代码分析工具和漏洞扫描工具来辅助检测和修复问题。\n- 实施防御性编程技术：应用程序应采用防御性编程技术，如使用随机化地址空间布局（ASLR）、堆栈保护机制（如堆栈溢出保护）和数据执行预防（DEP）等。\n- 及时更新和修补：及时应用程序和操作系统的安全更新和补丁，以确保已知的跨界内存读漏洞得到修复。及时更新相关软件和库，以避免使用已知存在漏洞的版本。", "title": "如何预防越界读取"}], "cnvd_id": "", "cve_id": "CVE-2026-63626", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-125", "description": "Mongoose 是一个嵌入式 Web 服务器和网络库。在 7.23 之前，src/l2_ppp.c 中的 ppp_handle_ipv6cp() 信任 16 位 IPv6CP len 字段，而不根据接收到的有效负载大小进行检查。在使用 MG_ENABLE_TCPIP 和 MG_ENABLE_IPV6 的 PPP 或 PPPoE 链路上，未经身份验证的相邻对等方可以完成所需的 LCP 交换并发送长度过大的短配置请求，从而导致 ppp_tx_frame() 读取超出 recv_queue.buf 并写入超出 tx.buf。相同长度的误用还可能会暴露回复中的相邻堆字节或通过 find_opt() 挂起事件循环。此问题已在 7.23 版本中修复。", "effects": [{"comp_name": "mongoose", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,7.23)", "min_fixed_version": "7.23", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_ 部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-110908", "cvss": {"cvssv31": [{"source": "cve@mitre.org", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-78", "description": "Netgate pfSense FRR 软件包 (pfSense-pkg-frr) 2.0.2_1 和源版本 2.1.2_1 在 FRR 状态过滤器中包含操作系统命令注入漏洞。仅具有 page-status-frr 权限的经过身份验证的 WebGUI 用户可以提供一个过滤器值，该值突破单引号 sed 表达式（escapeshellarg() 输出连接到该表达式）。然后通过 popen() 管道评估 Shell 命令替换，从而允许攻击者选择的命令以 root 身份执行。 pfSense Plus 26.07/26.03.1 和 CE 2.9.0/2.8.1 已更新 FRR 软件包。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-10-15", "level": "High", "mps_id": "MPS-xhwt-9byd", "poc": false, "poc_url": [], "published_time": "2026-10-15", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-xhwt-9byd", "name": "https://www.oscs1024.com/hd/MPS-xhwt-9byd"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-110908", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-110908"}, {"url": "https://redmine.pfsense.org/issues/17134", "name": ""}, {"url": "https://github.com/pfsense/FreeBSD-ports/blob/a621624266b19a7f48b1f94a60821d2c2fc6ee4c/net/pfSense-pkg-frr/files/usr/local/www/status_frr.php#L62-L73", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-110908漏洞", "_translated": true, "_saved_at": "2026-10-15T10:42:38+00:00", "_first_saved_at": "2026-10-15T10:42:38+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-xhwt-9byd"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-77931", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}], "cvssv4": [{"s 意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-76066", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:H/A:N", "severity": "high", "base_score": 7.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-862", "description": "IntentKit 到 2.6.3 包含一个授权绕过漏洞，其中执行程序根据完整的工具注册表验证工具调用，而不是 ToolBindingMiddleware 强制执行的每个请求的缩小工具广告，从而允许仅所有者的状态更改工具（例如钱包传输、发布、内存写入和调用代理）在没有任何人机交互或批准门的情况下执行。 WEB、API、TWITTER 或 TELEGRAM 上下文中未经身份验证的或公共调用者可以通过间接提示注入提供准确的去广告工具名称和参数，或者通过在重用线程上重放检查点和历史数据来利用此漏洞，从而实现所有者限制功能的未经授权的执行。", "effects": [{"comp_name": "intentkit", "ecosystem": "linux", "versions": [{"affected_version": "(0,2.6.3]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modif flyto-core 未鉴权命令执行漏洞", "_translated": true, "_saved_at": "2026-10-15T22:50:35+00:00", "_first_saved_at": "2026-10-14T21:12:11+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-qj5y-1ua6"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能有效地控制资源的使用，导致攻击者可以利用这个漏洞耗尽应用程序所依赖的资源。这些资源可以是计算资源（CPU、内存）、网络带宽、数据库连接或其他系统资源。攻击者可以通过发送特制的请求、恶意输入或其他方式，使应用程序消耗大量资源，导致拒绝服务或系统崩溃。", "title": "什么是拒绝服务"}, {"content": "- 消耗计算资源：攻击者可以发送计算密集型的请求，例如复杂的计算、无限循环或递归操作，以耗尽应用程序的计算资源，导致应用程序无法响应其他请求。\r\n- 消耗内存资源：攻击者可以发送大量的数据或恶意输入，以导致应用程序消耗过多的内存资源，从而使系统的可用内存耗尽，并导致应用程序崩溃或变得不可用。\r\n- 消耗网络带宽：攻击者可以发送大量的请求或大型数据包，以消耗应用程序所依赖的网络带宽。这会导致其他合法用户无法正常访问应用程序或降低系统的整体网络性能。\r\n- 消耗存储资源：攻击者可以发送大量的请求或上传大文件，以耗尽应用程序的存储资源，导致系统无法处理其他请求或存储新的数据。", "title": "拒绝服务常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对输入数据进行合理的验证和过滤，防止恶意输入导致资源消耗过高。\r\n- 实施资源限制：应用程序应该实施适当的资源限制策略，例如限制计算操作的时间或次数，限制内存使用量，限制并发连接数等，以防止资源被耗尽。\r\n- 异常处理与错误恢复：应用程序应该具备健壮的异常处理和错误恢复机制，以防止因意外错误导致资源泄漏或无法释放的情况。\r\n- 资源监控与警报：应用程序应该实施适当的资源监控和警报机制，及时发现异常的资源消耗情况，并采取相应的措施来应对。\r\n- 压力测试与性能优化：应用程序应该进行压力测试，以评估其在高负载情况下的性能，并进行必要的性能优化，以确保能够有效地处理大量请求而不耗尽资源。", "title": "如何预防拒绝服务"}], "cnvd_id": "", "cve_id": "CVE-2026-110872", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "medium", "base_score": 5.9}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:H/AT:P/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.2}]}, "cvss_score": 8.2, "cvss_vector": "CVSS:4.0/AV:N/AC:H/AT:P/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-400", "description": "10.0.10 之前的 3.0.0 版本的 Nodemailer 在 SMTPConnection._onData 和 isPartialResponse 中的 SMTP 客户端回复解析器中包含二次复杂度拒绝服务漏洞。恶意 SMTP 服务器或中间攻击者可以在身份验证之前传输没有完成行的连续行，从而阻止 Node.js 事件循环并耗尽内存。", "effe 的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-71854", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:L/A:N", "severity": "high", "base_score": 8.2}]}, "cvss_score": 8.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:L/A:N", "cwe": "CWE-862", "description": "OpenAEV 是一个开源平台，允许组织规划、安排和进行网络对手模拟活动和测试。在版本 2.260622.0 之前，在默认安装中，无需身份验证即可调用“/api/player/**”课程端点，并且它们信任客户端提供的“userId”查询参数，而无需验证调用者是该用户还是练习的成员。知道练习 UUID 的未经身份验证的客户端可以读取经验教训问题和答案（包括每个答案的作者身份），并创建或覆盖归因于任意用户的答案。版本 2.260622.0 包含补丁。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-10-15", "level": "High", "mps_id": "MPS-jlgh-72ap", "poc": false, "poc_url": [], "published_time": "2026-10-15", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-jlgh-72ap", "name": "https://www.oscs1024.com/hd/MPS-jlgh-72ap"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-71854", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-71854"}, {"url": "https://github.com/OpenAEV-Platform/openaev/security/advisories/GHSA-47wr-wp4h-8v3f", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-71854漏洞", "_translated": true, "_saved_at": "2026-10-15T00:14:59+00:00", "_first_saved_at": "2026-10-15T00:14:59+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-jlgh-72ap"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-89068", "cvss": {"cvssv31": [{"source": "security@progress.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/ yment 资源与 Radius 资源的映射关系。\n受影响版本中，annotations.go 的 readAnnotations 函数对 deployment.Annotations[AnnotationRadiusStatus] 执行 json.Unmarshal 时，未校验用户传入的容器 ID 是否属于当前租户。deployment_reconciler.go 的 deleteContainer 直接将 annotations.Status.Container 作为删除操作的目标资源，攻击者可通过篡改其他租户 Deployment 的 radapp.io/status 注解使控制器删除任意租户的容器资源。\n修复版本中通过两阶段防护消除该风险：annotations.go 新增 validateDeploymentStatus 函数校验注解内容器 ID 格式与必填字段；deployment_reconciler.go 的 startDeleteOperationIfNeeded 新增 fetchContainerResource 和 containerHasResourceReference 逻辑，在删除前验证容器资源的 Resources 引用列表中是否包含当前 Deployment 的资源 ID，不匹配则拒绝删除。", "effects": [{"comp_name": "github.com/radius-project/radius", "ecosystem": "go", "versions": [{"affected_version": "(-∞,v0.58.0)", "min_fixed_version": "v0.58.0", "repository": "go", "solutions": [], "upstream": true}]}, {"comp_name": "github.com/radius-project/radius/pkg/controller/reconciler", "ecosystem": "go", "versions": [{"affected_version": "(-∞,v0.58.0-rc2)", "min_fixed_version": "v0.58.0-rc2", "repository": "go", "solutions": [], "upstream": true}]}, {"comp_name": "govulncheck-vulndb", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,0.0.20260723T184607-160000.1.1)", "min_fixed_version": "0.0.20260723T184607-160000.1.1", "repository": "opensuse:leap:16.0", "solutions": [], "upstream": false}]}], "epss": 0.00051, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "混淆代理", "kind_en": "非预期的代理或中介（“困惑的代理”）", "last_modified_time": "2026-10-15", "level": "High", "mps_id": "MPS-jhu8-xcp0", "poc": false, "poc_url": [], "published_time": "2026-10-15", "reference_url_list": [{"url": "https://github.com/radius-project/radius/security/advisories/GHSA-fp5j-4fj2-4jvq", "name": ""}, {"url": "https://github.com/radius-project/radius/releases/tag/v0.58.0", "name": ""}, {"url": "https://github.com/advisories/GHSA-fp5j-4fj2-4jvq", "name": ""}], "scope_influence": "", "tags": ["go"], "title": "Radius Kubernetes 控制器部署注解注入导致跨租户容器删除漏洞", "_translated": true, "_saved_at": "2026-10-14T21:12:10+00:00", "_first_saved_at": "2026-10-14T21:12:10+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-jhu8-xcp0"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-91159", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:N/I:H/A:N", "severity": "high", "base_score": 7.7}]}, "cvss_score": 7.7, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:N/I:H/A:N", "cwe": "CWE-79", "description": "Discourse 是一个开源讨论平台。在 2026.9.0、2026.8.1、2026.7.3 和 2026.1.9 之前，当攻击者控制的整个 HTML 片段包含其源与配置的允许列表匹配的 iframe 时，oEmbed 处理会将整个攻击者控制的 HTML 片段视为可信。拥有发帖权限且控制公共网页及其 oEmbed 响应的用户可以将列入许可名单的 iframe 与不相关的同级 HTML 或 CSS 结合起来，导致存储的视觉覆盖或其他样式内容出现在帖子内容中，并导致误导或欺诈性的用户界面。利用该漏洞需要一个发布帐户、控制所获取的网页和 oEmbed 响应，以及列入许可名单的 iframe 源。该问题会影响内容完整性，但不会暴露受限数据、破坏可用性或需要与话语内容安全策略进行交互。此问题已在版本 2026.9.0、2026.8.1、2026.7.3 和 2026.1.9 中修复。", "effects": [{"comp_name": "discourse", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2026.1.9)", "min_fixed_version": "2026.1.9", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[2026.8.0-latest,2026.8.1)", "min_fixed_version": "2026.8.1", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[2026.9.0-latest,2026.9.0)", "min_fixed_version": "2026.9.0", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[2026.7.0-latest,2026.7.3)", "min_fixed_version": "2026.7.3", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-10-15", "level": "High", "mps_id": "MPS-w7ih-one8", "poc": false, "poc_url": [], "published_time": "2026-10-15", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-w7ih-one8", "name": "https://www.oscs1024.com/hd/MPS-w7ih-one8"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-91159", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-91159"}, {"url": "https://github.com/discourse/discourse/security/advisories/GHSA-f9jx-vv33-4282", "name": "https://github.com/discourse/discourse/security/advisories/GHSA-f9jx-vv33-4282"}, {"url": "https://github.com/discourse/discourse/commit/0953b31f5c2949d7d6ab5f6dc4c5e2f1b8bf0b22", "name": "https://github.com/discourse/discourse/commit/0953b 或访问非预期的内存区域。\n- 内存安全编程实践：开发人员应使用安全的编程实践，如避免使用不安全的函数、正确处理内存分配和释放操作，以及遵循最小特权原则。\n- 使用安全的编程语言和库：选择使用安全性较高的编程语言和库，这些语言和库在内存管理和安全性方面提供了更多的保护机制。\n- 定期进行代码审查和安全测试：定期审查应用程序的代码，并进行安全测试，以发现潜在的跨界内存读漏洞。使用静态代码分析工具和漏洞扫描工具来辅助检测和修复问题。\n- 实施防御性编程技术：应用程序应采用防御性编程技术，如使用随机化地址空间布局（ASLR）、堆栈保护机制（如堆栈溢出保护）和数据执行预防（DEP）等。\n- 及时更新和修补：及时应用程序和操作系统的安全更新和补丁，以确保已知的跨界内存读漏洞得到修复。及时更新相关软件和库，以避免使用已知存在漏洞的版本。", "title": "如何预防越界读取"}], "cnvd_id": "", "cve_id": "CVE-2026-73261", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", "cwe": "CWE-125", "description": "Mongoose 是一个嵌入式 Web 服务器和网络库。在 7.23 之前，由 src/net_builtin.c 中的 MG_ENABLE_TCPIP 启用的内置 TCP/IP 堆栈不会拒绝声明的 opts[1] 长度超过剩余选项字节的 TCP 选项。在handle_opt()中，NOP后跟截断的MSS选项会导致opts[3]在声明的选项区域之外被读取并用作dmss的低字节。未经身份验证的远程对等点可能会损坏每个连接的 MSS 值，因此稍后的 mg_send() 调用会传输截断或零长度的应用程序负载，而 TCP 连接则显得健康。此问题已在 7.23 版本中修复。", "effects": [{"comp_name": "mongoose", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,7.23)", "min_fixed_version": "7.23", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界读取", "kind_en": "越界读取", "last_modified_time": "2026-10-15", "level": "High", "mps_id": "MPS-jbfi-e6wh", "poc": false, "poc_url": [], "published_time": "2026-10-15", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-jbfi-e6wh", "name": "https://www.oscs1024.com/hd/MPS-jbfi-e6wh"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-73261", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-73261"}, {"url": "https://github.com/cesanta/mongoose/security/advisories/GHSA-3fmr-92g4-wchx", "name": "https://github.com/cesanta/mongoose/security/advisories/GHSA-3fmr-92g4-wchx"}, {"url": "https://github.com/cesanta/mongoose/commit/c thorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-102298", "cvss": {"cvssv4": [{"source": "f23511db-6c3e-4e32-a477-6aa17d310630", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-862", "description": "在 Omada 控制器 MSP 模式下，用户确认端点无法强制执行所需的权限检查。经过身份验证的用户可以提供调用者控制的标识符参数来验证另一个帐户的凭据，并接收区分不存在的用户、无效密码和成功身份验证的响应。 \n\n成功利用该漏洞可能会允许用户枚举、凭据验证以及对 MSP 资源的未授权访问或目标帐户的泄露。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-10-15", "level": "High", "mps_id": "MPS-pal0-znvr", "poc": false, "poc_url": [], "published_time": "2026-10-15", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-pal0-znvr", "name": "https://www.oscs1024.com/hd/MPS-pal0-znvr"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-102298", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-102298"}, {"url": "https://support.omadanetworks.com/en/download/software/omada-controller/", "name": ""}, {"url": "https://support. ability", "_translated": true, "_saved_at": "2026-10-15T22:50:35+00:00", "_first_saved_at": "2026-10-15T22:50:32+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-54fi-703n"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "cnvd_id": "", "cve_id": "CVE-2026-108446", "cvss": {"cvssv31": [{"source": "secure@microsoft.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "cwe": "CWE-416", "description": "Use after free in Microsoft Office Excel allows an unauthorized attacker to execute code over a network.", "effects": [{"comp_name": "365_apps", "ecosystem": "linux", "versions": [{"affected_version": "[16.0.1,+∞)", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "office_2021", "ecosystem": "linux", "versions": [{"affected_version": "[16.0.1,16.0.14334.20974)", "min_fixed_version": "16.0.14334.20974", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[16.0.0.0,16.0.10417.20228)", "min_fixed_version": "16.0.10417.20228", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "office_2024", "ecosystem": "linux", "versions": [{"affected_version": "[16.0.0,16.0.17932.21056)", "min_fixed_version": "16.0.17932.21056", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "office_365", "ecosystem": "linux", "versions": [{"affected_version": "[1.0.0,16.114.26101123)", "min_fixed_version": "16.114.26101123", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "office_macos_2021", "ecosystem": "linux", "versions": [{"affected_version": "[16.0.1,16.114.26101123)", "min_fixed_version": "16.114.26101123", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "office_macos_2024", "ecosystem": "linux", "versions": [{"affected_version": "[16.0.0,16.114.26101123)", "min_fixed_version": "16.114.26101123", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "UAF", "kind_en": "免费后使用", "last_modified_time": "2026-10-16", "level": "High", "mps_id": "MPS-pnza-vtbr", "poc": false, "poc_url": [], "published_time": "2026-10-16", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-pnza-vtbr", "name": "https://www.oscs1024.com/hd/MPS-pnza-vtbr"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-108446", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-108446"}, {"url": "https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-108446", "name": "Microsoft Office Excel Remote Code Execution Vulnerability"}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "Microsoft Office Excel Remote Code Execution Vulnerability", "_translated": true, "_saved_at": "2026-10-15T22:50:35+00:00", "_first_saved_at": "2026-10-15T22:50:35+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-pnza-vtbr"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-55103", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:N/A:N", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:N/A:N", "cwe": "CWE-863", "description": "Discourse ActivityPub adds ActivityPub support to Discourse. Prior to commit 1c8518b0f2abdf31cbea3e0b242f74d8994a9ba5, inbound ActivityPub processing does not sufficiently verify that the actor authenticated by the signed request matches the Activity actor and owns the referenced federated post. A remote attacker can exploit these missing identity and ownership checks to edit, delete, or reply to federated posts without the required permissions. This vulnerability is fixed with commit 1c8518b0f2abdf31cbea3e0b242f74d8994a9ba5.", "effects": [{"comp_name": "discourse-activity-pub", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1c8518b0f2abdf31cbea3e0b242f74d8994a9ba5)", "min_fixed_version": "1c8518b0f2abdf31cbea3e0b242f74d8994a9ba5", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-10-16", "level": "High", "mps_id": "MPS-vfa9-x68w", "poc": false, "poc_url": [], "published_time": "2026-10-16", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-vfa9-x68w", "name": "https://www.oscs1024.com/hd/MPS-vfa9-x68w"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-55103", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-55103"}, {"url": "https://github.com/discourse/discourse-activity-pub/security/advisories/GHSA-jw39-rch6-mhwf", "name": "https://github.com/discourse/discourse-activity-pub/security/advisories/GHSA-jw39-rch6-mhwf"}, {"url": "https://github.com/discourse/discourse-activity-pub/commit/1c8518b0f2abdf31cbea3e0b242f74d8994a9ba5", "name": "https://github.com/discourse/discourse-activity-pub/commit/1c8518b0f2abdf31cbea3e0b242f74d8994a9ba5"}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-55103漏洞", "_translated": true, "_saved_at": "2026-10-15T22:50:35+00:00", "_first_saved_at": "2026-10-15T19:38:04+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-vfa9-x68w"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-55246", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "sev
