以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-78302", "cvss": {"cvssv4": [{"source": "security@joomla.org", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:A/VC:H/VI:H/VA:L/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:A/VC:H/VI:H/VA:L/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-79", "description": "SP Property（组件名 com_spproperty）是 JoomShaper 开发的 Joomla 房地产列表扩展，用于管理房源、经纪人与预约等房地产内容，按 Pro 授权分发，属于闭源商业组件，无公开源码仓库。\n受影响版本中，前端视图与后台管理列表的多处模板文件将属性和文本值直接渲染进 HTML，未做上下文转义；未经身份验证的攻击者可将恶意脚本写 ": "CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-187", "description": "SSSD 的 IdP 身份验证提供商中发现了一个缺陷。 eval_access_token_buf() 函数使用 strncmp() 将 OIDC 主体标识符与经过身份验证的用户标识符长度进行比较，执行前缀比较而不是精确匹配。 IdP 标识符是目标用户标识符的严格前缀的攻击者可以作为目标用户进行身份验证。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "部分比较", "kind_en": "部分字符串比较", "last_modified_time": "2026-09-10", "level": "High", "mps_id": "MPS-a8zt-4jnh", "poc": false, "poc_url": [], "published_time": "2026-09-10", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-a8zt-4jnh", "name": "https://www.oscs1024.com/hd/MPS-a8zt-4jnh"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-87853", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-87853"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-87853", "name": ""}, {"url": "https://bugzilla.redhat.com/show_bug.cgi?id=2530888", "name": "RHBZ#2530888"}], "scope_influence": "", "tags": [], "title": "sssd：sssd：idp身份验证前缀比较允许跨用户模拟", "_translated": true, "_saved_at": "2026-09-09T18:22:38+00:00", "_first_saved_at": "2026-09-09T18:22:38+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-a8zt-4jnh"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-0310", "cvss": {"cvssv4": [{"source": "psirt@paloaltonetworks.com", "vector": "CVSS:4.0/AV:N/AC:H/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:L/SI:L/SA:N/E:U/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:N/R:U/V:D/RE:M/U:Red", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:4.0/AV:N/AC:H/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:L/SI:L/SA:N/E:U/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:N/R:U/V:D/RE:M/U:Red", "cwe": "CWE-787", "description": "PAN-OS 是 Palo Alto Networks 开发的闭源商业防火墙操作系统，运行于 PA-Series 硬件防火墙与 VM-Series 虚拟化防火墙，并支撑 Panorama 管理平台以及 Cloud NGFW、Prisma Access 等云交付服务。\n受影响版本中，PAN-OS 的 XML 处理功能存在越界写入缺陷（CWE-787），未经身份验证的攻击者在网络可达管理 Web 接口或数据面接口的条件下提交恶意构造的 XML 数据可触发该缺陷，在 PA-Series 硬件防火墙上以 root 权限执行任意代码，在 VM-Series 虚拟化防火墙上导致拒绝服务，官方确认 Panorama 同样受影响。\n修复版本中通过修正 XML 处理功能消除了该越界写入缺陷，受影响用户需升级至 PAN-OS 12.2.3、12.1.10、11.2.13-h2、11.1.16-h2、10.2.18-h10 或所在分支对应的修复版本，并将管理接口访问限制为可信内部 IP 地址以降低风险。", "effects": [{"comp_name": "cloud-ngfw", "ecosystem": "linux", "versions": [{"affected_version": "影响所有版本", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "pan-os", "ecosystem": "linux", "versions": [{"affected_version": "[10.2.0,10.2.7-h37)", "min_fixed_version": "10.2.7-h37", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[10.2.8,10.2.10-h40)", "min_fixed_version": "10.2.10-h40", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[10.2.17,10.2.18-h10)", "min_fixed_version": "10.2.18-h10", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[11.1.0,11.1.4-h36)", "min_fixed_version": "11.1.4-h36", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[10.2. 在的跨界内存读漏洞。使用静态代码分析工具和漏洞扫描工具来辅助检测和修复问题。\n- 实施防御性编程技术：应用程序应采用防御性编程技术，如使用随机化地址空间布局（ASLR）、堆栈保护机制（如堆栈溢出保护）和数据执行预防（DEP）等。\n- 及时更新和修补：及时应用程序和操作系统的安全更新和补丁，以确保已知的跨界内存读漏洞得到修复。及时更新相关软件和库，以避免使用已知存在漏洞的版本。", "title": "如何预防越界读取"}], "cnvd_id": "", "cve_id": "CVE-2026-87961", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:L/I:N/A:H", "severity": "high", "base_score": 7.1}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:L/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:L/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-125", "description": "ESP32-audioI2S 是 schreibfaul1 在 GitHub 开源的 ESP32 音频解码库（GPL-3.0 许可证），用于在 ESP32 上播放网络音频流与本地音频文件，支持 MP3 等格式解码及 ID3 元数据解析，被广泛用于网络收音机等物联网音频项目。\n受影响版本中，Audio::read_ID3_Header 函数在处理 ID3v2 同步歌词帧 SYLT 与旧版 ID3v2.2 SLT 帧时，块内各自声明的局部变量 size_t len = 0 遮蔽了函数形参 len（表示本次调用实际缓冲的字节数）；由于 size_t 为无符号类型，边界检查 if (m_ID3Hdr.SYLT.size \u003c len) return 0 恒为假并失效，随后 syltBuff.copy_from(data, m_ID3Hdr.SYLT.size) 直接按标签声明的帧大小从 data 缓冲区复制数据，攻击者在恶意 MP3 文件或 HTTP 音频流中声明超出实际缓冲数据量的帧大小，可读取分配边界之外的堆内存，导致设备崩溃或泄露相邻堆数据。\n修复版本中通过移除 SYLT 与 SLT 两处遮蔽形参的局部 len 声明，将边界检查修正为 if (m_ID3Hdr.SYLT.size \u003e len) return 0，使超出实际缓冲数据量的帧大小声明返回 0 并等待更多数据，同时将 SLT 块中复用的 len 重命名为 descLen，从而切断堆越界读取路径。", "effects": [{"comp_name": "ESP32-audioI2S", "ecosystem": "linux", "versions": [{"affected_version": "[3.4.4,4.0.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界读取", "kind_en": "越界读取", "last_modified_time": "2026 e": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-87998", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:H/A:L", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:H/A:L", "cwe": "CWE-863", "description": "Open WebUI 是一个可扩展、功能丰富且用户友好的自托管人工智能平台。从 0.10.0 到 0.11.1，backend/open_webui/routers/knowledge.py 中的 DELETE /api/v1/knowledge/{id}/delete 授权删除知识库，但随后删除了其管理员拥有的外部连接，而无需单独的管理员检查或其他依赖知识库的检查。对一个外部知识库具有写入权限的非管理员可以删除共享实例配置，并使使用该连接的所有其他知识库不可用。此问题已在 0.11.1 版本中修复。", "effects": [{"comp_name": "open-webui", "ecosystem": "linux", "versions": [{"affected_version": "[0.10.0,0.11.1)", "min_fixed_version": "0.11.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-09-10", "level": "High", "mps_id": "MPS-obci-vw1s", "poc": false, "poc_url": [], "published_time": "2026-09-10", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-obci-vw1s", "name": "https://www.oscs1024.com/hd/MPS-obci-vw1s"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-87998", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-87998"}, {"url": "https://github.com/open-webui/open-webui/security/advisories/GHSA-2724-6cpj-gf3v", "name": "https://github.com/open-webui/open-webui/security/advisories/GHSA-2724-6cpj-gf3v"}, {"url": "https://github.com/open-webui/open-webui/pull/28113", "name": "https://github.com/open-webui/open-webui/pull/28113"}, {"url": "https://github.com/open-webui/open-webui/commit/dc03e7e595d61be97b25a1dd7bb99ad264f73199", "name": "https://github.com/open-webui/open-webui/commit/dc03e7e595d61be97b25a1dd7bb99ad264f73199"}, {"url": "https://github.com/open-webui/open-webui/releases/tag/v0.11.1", "name": "https://github.com/open-webui/open-webui/releases/tag/v0.11.1"}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-87998漏洞", "_translated": true, "_saved_at": "2026-09-09T23:45:49+00:00", "_first_saved_at": "2026-09-09T23:45:49+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-obci-vw1s"}, {"analysis_status": 0, "articles": [{"content": "跨站点请求伪造 (CSRF)通过利用网站对用户请求的信任进行攻击。当用户在网站A登录并在同一浏览器会话中访问网站B时，攻击者可以构造特制的请求并诱使用户执行，以使网站B误以为这些请求是用户合法发起的。\n攻击者通常通过欺骗用户点击恶意链接、在受信任的网站中植入恶意代码或通过钓鱼等手段来实施CSRF攻击，一旦用户执行了恶意请求，攻击者可以以用户的身份执行任意操作，包括更改用户密码、发起资金转账或删除重要数据等。", "title": "什么是CSRF"}, {"content": "- 链接欺骗：攻击者通过向用户发送包含恶意链接的电子邮件或社交媒体消息，诱使用户点击并执行恶意请求。\n- 图片引用攻击：攻击者通过在恶意网站上包含指向目标网站的图片引用，以触发用户浏览器自动发送目标网站的请求。\n- XSS利用：如果目标网站存在XSS漏洞，攻击者可以注入恶意脚本，以使用户在浏览器中执行恶意请求。", "title": "CSRF常见的攻击方式"}, {"content": "- 随机令牌：网站可以在每个请求中包含一个随机生成的令牌（CSRF Token），并验证该令牌的有效性，以确认请求的来源是合法的。\n- SameSite Cookie：使用SameSite属性来限制跨站点请求，将Cookie的发送限制在同一站点上，减少了跨站请求伪造的风险。\n- 双重验证：对于敏感操作，网站可以要求用户进行额外的验证，例如输入验证码、提供第二个因素的身份验证等。\n- 强化浏览器策略：网站可以设置Content-Security-Policy（CSP）头，限制浏览器执行恶意脚本的能力，减少CSRF攻击的风险。\n- 限制用户操作：网站可以要求用户在执行敏感操作之前进行明确的确认或授权，防止恶意请求被误触发。\n- 安全编码实践：开发人员应遵循安全编码实践，对用户输入进行适当的验证和过滤，防止恶意请求的注入。", "title": "如何预防CSRF"}], "cnvd_id": "", "cve_id": "CVE-2026-78083", "cvss": {"cvssv4": [{"source": "security@joomla.org", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-352", "description": "SP Property 是 JoomShaper 公司开发的商业 Joomla! 房地产组件（闭源付费扩展），用于管理房源、房源特色、经纪人与预约看房活动，并提供 Ajax 表单提交房源预约与经纪人联系请求。\n受影响版本中，房源预约（properties.booking）与经纪人联系表单提交（agents.sendmail）两个对外端点在处理 POST 请求时未校验 Joomla! 会话反 CSRF 令牌，攻击者可构造诱导页面，使访问该页面的用户浏览器在目标站点上下文中提交伪造请求，以受害者会话创建房源预约或向经纪人发送邮件，导致预约数据被污染、站点邮件功能被滥用。\n修复版本中通过在房源预约与经纪人联系表单处理流程中补充 Joomla! 会话反 CSRF 令牌校验，拒绝缺少有效令牌的跨站 POST 请求，切断伪造请求进入预约与发信业务逻辑的路径。", "effects": [{"comp_name": "sp_property", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,4.1.4)", "min_fixed_version": "4.1.4", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "CSRF", "kind_en": "跨站请求伪造 (CSRF)", "last_modified_time": "2026-09-10", "level": "High", "mps_id": "MPS-rkf8-bev0", "poc": false, "poc_url": [], "published_time": "2026-09-10", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-rkf8-bev0", "name": "https://www.oscs1024.com/hd/MPS-rkf8-bev0"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-78083", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-78083"}, {"url": "https://www.joomshaper.com/joomla-extensions/sp-property", "name": ""}], "scope_influence": "", "tags": [], "title": "SP Property 跨站请求伪造漏洞", "_translated": true, "_saved_at": "2026-09-10T12:37:09+00:00", "_first_saved_at": "2026-09-10T12:37:09+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-rkf8-bev0"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-87999", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:C/C:H/I:L/A:N", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:C/C:H/I:L/A:N", "cwe": "CWE-918", "description": "Open WebUI 是一个可扩展、功能丰富且用户友好的自托管人工智能平台。在 0.11.1 之前，backend/open_webui/retrieval/web/utils.py 中的 POST /api/v1/retrieval/process/web 和 POST /api/v1/retrieval/process/web/search 将 Python 的全局可路由地址分类视为目的地是外部的证据。经过身份验证的用户可以使 Azure 托管实例从 168.63.129.16、Azure 平台通道以及标准分类未拒绝的其他保留范围获取并返回内容。此问题已在 0.11.1 版本中修复。", "effects": [{"comp_name": "open-webui", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,0.11.1)", "min_fixed_version": "0.11.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SSRF", "kind_en": "服务器端请求伪造 (SSRF)", "last_modified_time": "2026-09-10", "level": "High", "mps_id": "MPS-tzle-umrh", "poc": false, "poc_url": [], "published_time": "2026-09-10", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-tzle-umrh", "name": "https://www.oscs1024.com/hd/MPS-tzle-umrh"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-87999", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-87999"}, {"url": "https://github.com/open-webui/open-webui/security/advisories/GHSA-34r3-9m95-vq73", "name": "https://github.com/open-webui/open-webui/security/advisories/GHSA-34r3-9m95-vq73"}, {"url": "https://github.com/open-webui/open-webui/pull/27823", "name": "https://github.com/open-webui/open-webui/pull/27823"}, {"url": "https://github.com/open-webui/open-webui/commit/e3e4bd87df6fc629e7e22081d980d55a7632b8b7", "name": "https://github.com/open-webui/open-webui/commit/e3e4bd87df6fc629e7e22081d980d55a7632b8b7"}, {"url": "https://github.com/open-webui/open-webui/releases/tag/v0.11.1", "name": "https://github.com/open-webui/open-webui/releases/tag/v0.11.1"}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-87999漏洞", "_translated": true, "_saved_at": "2026-09-09T23:45:52+00:00", "_first_saved_at": "2026-09-09T23:45:52+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-tzle-umrh"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-82098", "cvss": {"cvssv31": [{"source": "psirt@us.ibm.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-78", "description": "IBM DataStage on Cloud Pak for Data 是 IBM 商业闭源的数据集成组件，运行于 IBM Software Hub（原 Cloud Pak for Data）平台，用于企业级数据的抽取、转换与加载。\n受影响版本中，5.4.0.0 对进入操作系统命令执行路径的输入缺乏充分的中和处理（CWE-78），远程认证攻击者在可控制输入中拼接命令分隔符等特殊元素后，命令语义被改变并以服务进程权限执行任意命令，可导致机密性、完整性与可用性全面失陷。\n修复版本中通过对命令相关输入的中和与校验加固切断注入路径，IBM 于 2026-09-07 发布官方公告，修复载体为 5.4 Patch 5 及以上版本，升级后任意命令执行风险消除。", "effects": [{"comp_name": "IBM DataStage on Cloud Pak for Data", "ecosystem": "linux", "versions": [{"affected_version": "[5.4.0.0,5.4.0.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-09-11", "level": "High", "mps_id": "MPS-79ru-wpx2", "poc": false, "poc_url": [], "published_time": "2026-09-11", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-79ru-wpx2", "name": "https://www.oscs1024.com/hd/MPS-79ru-wpx2"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-82098", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-82098"}, {"url": "https://www.ibm.com/support/pages/node/7286562", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "DataStage命令注入漏洞", "_translated": true, "_saved_at": "2026-09-11T00:46:12+00:00", "_first_saved_at": "2026-09-11T00:46:12+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-79ru-wpx2"}, {"analysis_status": 0, "articles": [{"content": "跨界内存读是指应用程序在读取内存时，未正确验证或限制读取的内存范围。攻击者利用这种漏洞可以读取应用程序内存中的敏感数据，如密码、加密密钥、会话令牌等。常见的原因是由于缓冲区溢出、格式化字符串漏洞或其他内存错误导致的。", "title": "什么是越界读取"}, {"content": "攻击者可以通过不当构造的输入来触发跨界内存读漏洞。攻击者可能会通过向应用程序发送特定的输入，使其读取超过预期的内存区域。攻击者可以利用这个漏洞来获取敏感信息，如其他用户的数据、操作系统的敏感数据或应用程序的内部状态。", "title": "越界读取常见的攻击方式"}, {"content": "- 输入验证和限制：应用程序应对所有输入数据进行严格的验证和限制。确保输入数据的长度、格式和内容符合预期，避免超出缓冲区或访问非预期的内存区域。\n- 内存安全编程实践：开发人员应使用安全的编程实践，如避免使用不安全的函数、正确处理内存分配和释放操作，以及遵循最小特权原则。\n- 使用安全的编程语言和库：选择使用安全性较高的编程语言和库，这些语言和库在内存管理和安全性方面提供了更多的保护机制。\n- 定期进行代码审查和安全测试：定期审查应用程序的代码，并进行安全测试，以发现潜在的跨界内存读漏洞。使用静态代码分析工具和漏洞扫描工具来辅助检测和修复问题。\n- 实施防御性编程技术：应用程序应采用防御性编程技术，如使用随机化地址空间布局（ASLR）、堆栈保护机制（如堆栈溢出保护）和数据执行预防（DEP）等。\n- 及时更新和修补：及时应用程序和操作系统的安全更新和补丁，以确保已知的跨界内存读漏洞得到修复。及时更新相关软件和库，以避免使用已知存在漏洞的版本。", "title": "如何预防越界读取"}], "cnvd_id": "", "cve_id": "CVE-2026-89046", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:H", "severity": "high", "base_score": 8.2}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:L/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:L/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-125", "description": "zstd-jni 是开源的 Zstandard 压缩算法 Java 绑定库，通过 JNI 封装原生 zstd 实现，供 Java 应用进行高性能压缩、解压与帧信息解析。\n受影响版本中，com.github.luben.zstd.Zstd 的 getFrameContentSize 方法对 srcPosition 与 srcSize 仅做上界校验，未拒绝负值；负数 srcPosition 可绕过 srcPosition \u003e= src.length 与 srcPosition + srcSize \u003e src.length 两处检查进入原生层，jni_zstd.c 中的 getFrameContentSize0 在 GetPrimitiveArrayCritical 取得数组首址后以 (char*)src_buff + offset 计算帧头解析起始地址，负偏移使指针越过数组起点、负长度被转换为巨大 size_t，帧头解析器越界读取内存，导致信息泄露或 JVM 崩溃。\n修复版本中通过在 getFrameContentSize 入口补充 srcPosition \u003c 0 与 srcSize \u003c 0 前置校验，任一参数为负时立即抛出 ArrayIndexOutOfBoundsException，阻止非法偏移进入原生帧头解析，同批修复在 ZstdInputStreamNoFinalizer 的 read 与 readInternal 中补充 len \u003c 0 校验，消除越界读取路径。", "effects": [{"comp_name": "com.github.luben:zstd-jni", "ecosystem": "maven", "versions": [{"affected_version": "[1.5.5-6,1.5.7-14)", "min_fixed_version": "1.5.7-14", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界读取", "kind_en": "越界读取", "last_modified_time": "2026-09-11", "level": "High", "mps_id": "MPS-agmx-echj", "poc": false, "poc_url": [], "published_time": "2026-09-11", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-agmx-echj", "name": "https://www.oscs1024.com/hd/MPS-agmx-echj"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-89046", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-89046"}, {"url": "https://github.com/luben/zstd-jni/security/advisories/GHSA-rm53-6wf5-f34m", "name": "GitHub Security Advisory (GHSA-rm53-6wf5-f34m)"}, {"url": "https://github.com/luben/zstd-jni/commit/dd08685ef913a32e76fb27f43470035c06758646", "name": "Fix commit: reject a negative source position and size"}, {"url": "https://github.com/luben/zstd-jni/blob/v1.5.7-13/src/main/java/com/github/luben/zstd/Zstd.java#L730", "name": "Upper-bound-only bounds check at v1.5.7-13"}, {"url": "https://github.com/luben/zstd-jni/blob/v1.5.7-13/src/main/native/jni_zstd.c#L87", "name": "Native routine that offsets the critical array pointer without re-validating"}, {"url": "https://github.com/luben/zstd-jni/releases/tag/v1.5.7-14", "name": "zstd-jni v1.5.7-14 Release Notes"}, {"url": "https://github.com/luben/zstd-jni", "name": "luben/zstd-jni"}, {"url": "https://www.vulncheck.com/advisories/zstd-jni-1.5.5-6-through-1.5.7-13-out-of-bounds-read-via-negative-offset", "name": "VulnCheck Advisory: zstd-jni 1.5.5-6 through 1.5.7-13 Out-of-Bounds Read via Negative Offset"}], "scope_influence": "", "tags": ["java", "开源"], "title": "zstd-jni越界读取漏洞", "_translated": true, "_saved_at": "2026-09-10T19:25:30+00:00", "_first_saved_at": "2026-09-10T19:25:30+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-agmx-echj"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-84889", "cvss": {"cvssv31": [{"source": "psirt@us.ibm.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-22", "description": "Langflow 是 IBM 开源的 LLM 应用可视化编排框架，用于以拖拽工作流方式构建 Agent 与 RAG 等大模型应用，提供 REST API、文件上传以及本地、S3、Google Drive 等多种文件存储后端。\n受影响版本中，文件上传接口 upload_user_file 直接信任 multipart 请求 Content-Disposition 中的文件名并拼入存储路径，携带 ../ 序列的文件名可把上传内容写到用户存储边界之外；Write File 组件 SaveToFileComponent 的 save_to_file 方法在本地保存分支 _save_to_local 中对租户可控的 file_name 输入执行 Path(...).expanduser() 展开，未做路径包含校验即创建父目录并写入文件。持有有效 API key 的低权限认证用户可将任意内容写入服务器进程可访问的任意路径，覆盖敏感文件后实现任意代码执行。\n修复版本中通过双重收敛切断该攻击链：upload_user_file 在入口拒绝包含路径分隔符、.. 序列、空字节与控制字符的文件名并仅保留基名；Write File 组件新增 _get_safe_local_file_name 仅接受纯文件名，并把本地写入路径收敛到认证用户的存储命名空间，越界时由 enforce_local_file_access 失败关闭。", "effects": [{"comp_name": "langflow", "ecosystem": "pip", "versions": [{"affected_version": "[1.0.0,1.11.0)", "min_fixed_version": "1.11.0", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-09-11", "level": "High", "mps_id": "MPS-ieln-a0uv", "poc": false, "poc_url": [], "published_time": "2026-09-11", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ieln-a0uv", "name": "https://www.oscs1024.com/hd/MPS-ieln-a0uv"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-84889", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-84889"}, {"url": "https://www.ibm.com/support/pages/node/7286656", "name": ""}], "scope_influence": "", "tags": ["AI", "python", "开源"], "title": "Langflow 路径穿越任意代码执行漏洞", "_translated": true, "_saved_at": "2026-09-11T00:46:10+0 志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-88939", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:L", "severity": "high", "base_score": 8.3}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:L/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:L/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-863", "description": "knowns 是一个面向 AI 原生开发的开源（MIT 许可证）项目记忆与任务管理层，使用 Go 实现、经 npm 包 knowns 分发，通过内置 MCP 服务器为 AI 代理提供项目切换、任务、文档与代码变更等工具接口，并支持按预设（如 read-only）约束代理会话权限。\n受影响版本中，权限守卫中间件 NewGuardMiddleware 在能力检查前先调用 isBootstrapAction，project.set 被静态列入引导豁免名单且该豁免不校验项目存储是否已初始化，操作直接放行而不进入 CheckCapability；权限注册表将 project.set 归类为 CapAdmin，包括 read-only 在内的全部标准预设均拒绝该能力，但拒绝规则从未参与判定。已持只读会话的代理可携带任意 projectRoot 调用 project.set，handleProjectSet 仅确认目标目录存在 .knowns/config.json 便将路径交给 setStore，s.store 与 s.root 被原子替换后会话改按目标项目策略（缺省 read-write-no-delete）运行，获得写入与代码变更能力。\n修复版本中通过为引导豁免增加项目存储初始化状态前置条件切断该链路：project.set 仅在存储尚未建立时豁免，已初始化会话中的 project.set 须通过 CheckCapability 并受 CapAdmin 拒绝规则约束；截至 2026-09-09 官方安全公告发布尚无包含该修复的发布版本，升级补丁可用前建议避免将 MCP 会话暴露给不可信代理并限制其网络可达范围。", "effects": [{"comp_name": "knowns", "ecosystem": "npm", "versions": [{"affected_version": "(-∞,0.33.0]", "min_fixed_version": "", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exp 和转换，确保操作数的类型和范围是合适的。\r\n- 强制性编码标准和最佳实践：制定强制性的编码标准和最佳实践，包括对整数运算和操作的规范和限制，以帮助程序员编写更可靠、安全的代码。\r\n- 静态代码分析和测试：使用静态代码分析工具和测试技术来检测和识别潜在的整数溢出问题。这些工具可以帮助发现代码中可能存在的溢出漏洞，并及时修复。", "title": "如何预防整数溢出或环绕"}], "cnvd_id": "", "cve_id": "CVE-2026-16174", "cvss": {"cvssv4": [{"source": "psirt@netskope.com", "vector": "CVSS:4.0/AV:L/AC:L/AT:P/PR:H/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:L/AC:L/AT:P/PR:H/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-190", "description": "Netskope Endpoint DLP（EPDLP）是 Netskope Client 面向 Windows 终端的数据防泄漏模块，属于闭源商业组件，通过内核驱动与用户态进程监控终端数据外发行为。\n受影响版本中，EPDLP 组件处理发送至 EPDLP 进程端口的消息时对长度相关参数执行整数运算且缺少溢出校验，本地高权限攻击者向该端口发送构造消息可触发整数溢出，导致内核池溢出与内存破坏，可能造成本地拒绝服务、任意代码执行或权限提升；成功利用需要客户端配置中启用 EPDLP 模块，且目标系统关闭内存完整性（Memory Integrity）保护。\n修复版本中通过修复该整数运算缺陷切断内核池溢出路径，官方将 141.0 及以上版本列为不受影响版本，建议用户升级至 141.0 及以上版本，并保持内存完整性（Memory Integrity）保护开启以降低风险。", "effects": [{"comp_name": "netskope_endpoint_dlp", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,141.0)", "min_fixed_version": "141.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "整数溢出或环绕", "kind_en": "整数溢出或环绕", "last_modified_time": "2026-09-11", "level": "High", "mps_id": "MPS-tb1f-ismc", "poc": false, "poc_url": [], "published_time": "2026-09-11", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-tb1f-ismc", "name": "https://www.oscs1024.com/hd/MPS-tb1f-ismc"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-16174", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-16174"}, {"url": "https://support.netskope.com/s/article/Netskope-Secur n": "2.7.0A", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "kingdom_communication_associated:eh2070", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.8.0A)", "min_fixed_version": "2.8.0A", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "kingdom_communication_associated:eh3040", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.5.0A)", "min_fixed_version": "2.5.0A", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "kingdom_communication_associated:eh4200", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.5.0A)", "min_fixed_version": "2.5.0A", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "过多认证尝试的限制不恰当", "kind_en": "对过多身份验证尝试的不当限制", "last_modified_time": "2026-09-11", "level": "High", "mps_id": "MPS-xwbk-ozcf", "poc": false, "poc_url": [], "published_time": "2026-09-11", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-xwbk-ozcf", "name": "https://www.oscs1024.com/hd/MPS-xwbk-ozcf"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-89174", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-89174"}, {"url": "https://www.twcert.org.tw/tw/cp-132-11198-b8bba-1.html", "name": ""}, {"url": "https://www.twcert.org.tw/en/cp-139-11199-38e1e-2.html", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "铠锋智慧对讲系统暴力破解漏洞", "_translated": true, "_saved_at": "2026-09-11T10:25:48+00:00", "_first_saved_at": "2026-09-11T10:25:48+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-xwbk-ozcf"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-88051", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-787", "description": "Tesseract 是 Google 开源 OCR 引擎，用于图像文字识别，被广泛嵌入各类文档处理与 OCR 服务。\n受影响版本中，回调形式的 GenericVector\u003cT\u003e::read（src/ccutil/genericvector.h）从 .traineddata 模型先后读入两个相互独立的 int32 字段 reserved 与 size_used_，前者经 reserve(reserved) 分配堆缓冲区，后者直接驱动 cb(f, data_ + i) 元素写入循环，两个字段既无上限校验也无 size_used_ \u003c= reserved 不变式检查；攻击者构造含 version_id \u003e= 4 的 TESSDATA_INTTEMP 组件并令 reserved 取小值、size_used_ 取大值，目标经 TessBaseAPI::Init 以 legacy 引擎加载该模型触发 fontinfo_table_.read(fp, read_info) 时，对 FontInfo 结构体的写入越过堆缓冲区边界，造成堆越界写、堆破坏、崩溃或可控内存破坏。\n修复版本中通过在写入循环前增加双重校验切断上述因果链：拒绝负数或超过 50000000 上限的 reserved，并拒绝 size_used_ \u003c 0 或 size_used_ \u003e reserved 的模型文件，使不一致的计数无法进入写入循环，不一致的模型在加载时直接报错中止。", "effects": [{"comp_name": "tesseract", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,5.5.3]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-09-11", "level": "High", "mps_id": "MPS-9t24-mp8l", "poc": false, "poc_url": [], "published_time": "2026-09-11", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-9t24-mp8l", "name": "https://www.oscs1024.com/hd/MPS-9t24-mp8l"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-88051", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-88051"}, {"url": "https://github.com/tesseract-ocr/tesseract/security/advisories/GHSA-88qp-4g94-3rf3", "name": "https://github.com/tesseract-ocr/tesseract/security/advisories/GHSA-88qp-4g94-3rf3"}, {"url": "https://github.com/tesseract-ocr/tesseract/commit/56e09ca12e751623fe796ce1554ce704bffd2ef0", "name": "https://github.com/tesseract-ocr/tesseract/commit/56e09ca12e751623fe796ce1554ce704bffd2ef0"}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "Tesseract堆越界写入漏洞", "_translated": true, "_saved_at": "2026-09-10T19:25:32+00:00", "_first_saved_at": "2026-09-10T19:25:32+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-9t24-mp8l"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-88053", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": y/advisories/GHSA-rphx-x795-5qjv", "name": "https://github.com/tesseract-ocr/tesseract/security/advisories/GHSA-rphx-x795-5qjv"}, {"url": "https://github.com/tesseract-ocr/tesseract/commit/8b0574680f3b22f246ade6a4c8e3029104255c63", "name": "https://github.com/tesseract-ocr/tesseract/commit/8b0574680f3b22f246ade6a4c8e3029104255c63"}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "Tesseract OCR 堆越界写入漏洞", "_translated": true, "_saved_at": "2026-09-10T19:25:34+00:00", "_first_saved_at": "2026-09-10T19:25:34+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-riq0-ac5z"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-88937", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:A/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:A/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-22", "description": "knowns 是一个使用 Go 编写、通过 npm 分发并托管于 GitHub 的开源 AI 原生项目管理 CLI（knowns-dev/knowns），内置代码生成模板引擎，用于按模板批量创建与修改项目文件。\n受影响版本中，internal/codegen/template_engine.go 的 resolveDest 对绝对路径目标原样返回，对相对路径仅做 filepath.Join 拼接而不校验结果是否落在项目根内，add、modify、append 动作经该函数解析目标后交给 writeFile 执行 os.MkdirAll 与 os.WriteFile 写盘，addMany 则把攻击者可控的 action.Destination 直接与 ProjectRoot 拼接；loadAndRenderTemplate 还允许 action.Template 携带绝对路径或 ../ 穿越段，经 os.ReadFile 读取项目外任意文件。攻击者发布内置恶意模板的仓库并诱导用户执行 knowns import add 导入后，用户运行 knowns template run 时恶意模板能够覆写 ~/.bashrc、crontab 或 ~/.ssh/authorized_keys 等宿主文件获得持久代码执行，也能把 ~/.ssh/id_rsa 等机密文件渲染写入项目内路径完成外带。\n修复版本中通过 safepath 强制项目根边界校验的修复方案已由上游在 GHSA-68cq-4rwm-f7jr 中给出，但截至 2026-09-11 尚无发布版本包含该修复，最新版本 0.33.0 仍受影响，用户需在官方修复发布前避免导入与运行不受信任来源的代码生成模板，包含修复的版本发布后应及时升级。", "effects": [{"comp_name": "knowns", "ecosystem": "npm", "versions": [{"affected_version": "(-∞,0.33.0]", "min_fixed_version": "", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-09-11", "level": "High", "mps_id": "MPS-t6su-f0ex", "poc": false, "poc_url": [], "published_time": "2026-09-11", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-t6su-f0ex", "name": "https://www.oscs1024.com/hd/MPS-t6su-f0ex"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-88937", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-88937"}, {"url": "https://github.com/knowns-dev/knowns/security/advisories/GHSA-68cq-4rwm-f7jr", "name": "GitHub Security Advisory (GHSA-68cq-4rwm-f7jr)"}, {"url": "https://github.com/knowns-dev/knowns/security/advisories/GHSA-xjcg-5j3r-m6f9", "name": "GitHub Security Advisory (GHSA-xjcg-5j3r-m6f9)"}, {"url": "https://git  "kind_en": "密码签名验证不当", "last_modified_time": "2026-09-11", "level": "High", "mps_id": "MPS-dyz1-lt8n", "poc": false, "poc_url": [], "published_time": "2026-09-11", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-dyz1-lt8n", "name": "https://www.oscs1024.com/hd/MPS-dyz1-lt8n"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-80469", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-80469"}, {"url": "https://www.sick.com/psirt", "name": ""}, {"url": "https://www.sick.com/media/docs/9/19/719/special_information_sick_operating_guidelines_cybersecurity_by_sick_en_im0106719.pdf", "name": ""}, {"url": "https://www.cisa.gov/resources-tools/resources/ics-recommended-practices", "name": ""}, {"url": "https://www.first.org/cvss/calculator/3.1", "name": ""}, {"url": "https://www.sick.com/.well-known/csaf/white/2026/sca-2026-0012.json", "name": ""}, {"url": "https://www.sick.com/.well-known/csaf/white/2026/sca-2026-0012.pdf", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "SICK Device Manager 任意代码执行漏洞", "_translated": true, "_saved_at": "2026-09-11T10:25:47+00:00", "_first_saved_at": "2026-09-11T10:25:47+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-dyz1-lt8n"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "cnvd_id": "", "cve_id": "CVE-2026-87958", "cvss": {"cvssv31": [{"source": "psirt@us.ibm.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:H/A:H", "severity": "high", "base_score": 8.1}]}, "cvss_score": 8.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:H/A:H", "cwe": "CWE-269", "description": "IBM Db2 for Linux, UNIX and Windows 是 IBM 的商业闭源关系型数据库管理系统，广泛用于企业级事务处理与数据分析场景。\n受影响版本中，服务器存在权限管理缺陷（CWE-269），具备一定权限的用户在特定条件下可禁用 Db2 服务器上的特定功能，导致该功能失效并形成拒绝服务；厂商未披露具体受影响的功能与复现步骤，无法进一步确认代码级成因。\n修复版本中通过官方安全更新（APAR DT474170）修正相关权限管理逻辑，阻断用户禁用该功能的路径，消除拒绝服务风险；V11.5.9 需应用 Security Update #90467 或更高版本，V12.1.4 需应用 Security Update #91310 或更高版本，V12.1.5 需应用 Security Update #89304 或更高版本。", "effects": [{"comp_name": "db2", "ecosystem": "linux", "versions": [{"affected_version": "[11.5.0,11.5.9]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[12.1.0,12.1.5]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-09-11", "level": "High", "mps_id": "MPS-5wzx-td0j", "poc": false, "poc_url": [], "published_time": "2026-09-11", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-5wzx-td0j", "name": "https://www.oscs1024.com/hd/MPS-5wzx-td0j"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-87958", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-87958"}, {"url": "https://www.ibm.com/support/pages/node/7286987", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "IBM Db2拒绝服务漏洞", "_translated": true, "_saved_at": "2026-09-11T00:46:08+00:00", "_first_saved_at": "2026-09-11T00:46:08+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-5wzx-td0j"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-88052", "cvss": {"cvssv31": [{"source": "security-advisories@github.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "cwe": "CWE-787", "description": "Tesseract 是 Google 维护的开源 OCR 文字识别引擎（C++ 实现，Apache-2.0 许可），通过加载 traineddata 语言包与 unicharset 字符集文件完成字符集初始化，广泛用于图像文字识别服务与本地工具。\n受影响版本中，src/ccutil/unicharset.cpp 的 UNICHARSET::load_via_fgets 通过 sscanf 读取文件首行声明的字符总数并直接将其作为循环上界，循环内 unichar_insert_backwards_compatible 对空表示、重复表示或已可编码的字符执行空操作，使 unichars 向量长度落后于循环索引 id；后续 set_isalpha、set_script、set_normed 等未校验边界的访问器与 unichars[id].properties.enabled 写入随即越过向量末尾写 UNICHAR_PROPERTIES，其中 set_normed 还包含 std::string 赋值，LSTM 与传统两种引擎的初始化路径均受影响，攻击者诱导用户或服务加载畸形 unicharset 文件可造成堆越界写，导致堆破坏、崩溃或潜在的受控内存破坏。\n修复版本中通过 main 分支 commit 2d04d640db2e8c7e3bab2369d599343b5a8b8443 修复：load_via_fgets 拒绝非正的字符总数，并在每次插入后校验 unichars 向量长度与 id 同步，不一致时报出错误行并拒绝加载整个文件，从而切断越界写路径；官方修复版本发布前，建议仅加载可信来源的 unicharset 与 traineddata 文件。", "effects": [{"comp_name": "tesseract", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,5.5.3]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirem eflags 的 PCRE2_MD_COPIED_SUBJECT 标志，置位时先经 match_data-\u003ememctl.free 释放旧的主题串拷贝并清除该标志，切断泄漏与错误释放的因果链，并同步更新 pcre2jit 文档、在 pcre2test 与 test 17 中补充快路径复用场景的回归测试。", "effects": [{"comp_name": "pcre2", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,10.48)", "min_fixed_version": "10.48", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "堆缓冲区溢出", "kind_en": "释放不在堆上的内存", "last_modified_time": "2026-09-11", "level": "High", "mps_id": "MPS-def1-6t8n", "poc": false, "poc_url": [], "published_time": "2026-09-11", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-def1-6t8n", "name": "https://www.oscs1024.com/hd/MPS-def1-6t8n"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-89161", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-89161"}, {"url": "https://github.com/PCRE2Project/pcre2/releases/tag/pcre2-10.48", "name": ""}, {"url": "https://github.com/PCRE2Project/pcre2/pull/937", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "PCRE2 快路径错误释放漏洞", "_translated": true, "_saved_at": "2026-09-11T05:32:04+00:00", "_first_saved_at": "2026-09-11T05:32:04+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-def1-6t8n"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2025-15679", "cvss": {"cvssv4": [{"source": "5bcc34ac-0282-4e8a-96fc-046c583d3048", "vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:L/SI:L/SA:L/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:P/AU:N/R:U/V:C/RE:L/U:Clear", "severity": "high", "base_score": 7.3}]}, "cvss_score": 7.3, "cvss_vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:L/SI:L/SA:L/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:P/AU:N/R:U/V:C/RE:L/U:Clear", "cwe": "CWE-258", "description": "BullSequana XH3406 与 BullSequana XH3515 是 Eviden（Atos 集团）BullSequana X3000 系列高性能计算节点，其 BMC 为节点板载的闭源带外管理控制器固件，用于节点电源管理、硬件状态监控与远程维护；该漏洞由 Eviden PSIRT 内部发现并以公告 PSIRT-2066 披露。\n受影响版本中，在某些情况下（如执行恢复出厂默认操作）BMC root 账户被激活且未设置密码，账户配置中形成空口令的特权账户（CWE-258）；能够访问 BMC 管理通道的攻击者可直接以无密码的 root 账户登录，获得 BMC 完全控制权，进而操纵节点电源与固件配置，机密性、完整性与可用性均受影响。\n修复版本中通过应用修复后的 Technical State（BullSequana XH3406 为 TS 04.05，BullSequana XH3515 为 TS 43.01）消除 BMC root 账户无密码激活的问题；厂商同时说明正常配置下 BMC ssh 访问默认禁用、该弱点不会被暴露利用，过渡期内可通过 ssh 访问为 root 设置密码作为临时措施。", "effects": [{"comp_name": "BullSequana XH3406", "ecosystem": "linux", "versions": [{"affected_version": "[0,TS 04.05)", "min_fixed_version": "TS 04.05", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "BullSequana XH3515", "ecosystem": "linux", "versions": [{"affected_version": "[0,TS 43.01)", "min_fixed_version": "TS 43.01", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "配置文件中缺省空口令", "kind_en": "配置文件中的密码为空", "last_modified_time": "2026-09-11", "level": "High", "mps_id": "MPS-4hq9-ipe6", "poc": false, "poc_url": [], "published_time": "2026-09-11", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-4hq9-ipe6", "name": "https://www.oscs1024.com/hd/MPS-4hq9-ipe6"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2025-15679", "name": "https://nvd.nist.gov/vuln/detail/CVE-2025-15679"}, {"url": "https://myatos.my.site.com/psmcustomer/s/contentdocument/069ci00000eJrEVAA0", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "BullSequana BMC root空密码漏洞", "_translated": true, "_saved_at": "2026-09-11T10:25:43+00:00", "_first_saved_at": "2026-09-11T10:25:43+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-4hq9-ipe6"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "cnvd_id": "", "cve_id": "CVE-2026-57842", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:L/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:L/AC:H/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.3}]}, "cvss_score": 7.3, "cvss_vector": "CVSS:4.0/AV:L/AC:H/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-416", "description": "NetBSD 是 The NetBSD Foundation 开源维护的跨平台类 Unix 操作系统，其内核的 COMPAT_NETBSD32 兼容层让 64 位系统可以运行 32 位用户程序。\n受影响版本中，本地用户运行 32 位程序并以 msg_iovlen 介于 9 与 IOV_MAX 之间的 msghdr 调用 recvmsg(2) 时，32 位系统调用入口 netbsd32_recvmsg 所调用的辅助函数 msg_recv_copyin 会在堆上分配 iovec 缓冲；该函数成功路径缺少 return 语句而落入 out: 清理标签，把本应交给接收流程继续使用的 iovec 缓冲提前释放，调用方随后仍通过悬空的 msg.msg_iov 访问该缓冲，并在自身出口处再次释放同一块内存，最终造成内核 use-after-free 与双重释放，引发内核 panic 或内存破坏，官方在 netbsd-10 拉取单中将该问题归类为本地提权漏洞。\n修复版本中通过在 msg_recv_copyin 成功路径补写 error = 0，并把缓冲清理条件改为仅出错时释放堆上的 iovec 缓冲，成功路径保留缓冲交由调用方使用与释放，切断释放后使用与双重释放链路，消除本地触发的内核内存破坏风险。", "effects": [{"comp_name": "netbsd", "ecosystem": "linux", "versions": [{"affected_version": "[8.0,8.3]", "min_fixed_version": "", "repositor 要在第一个会话保持打开状态时进行稍后的相同用户名登录。此问题已在版本 1.75.1 中修复。", "effects": [{"comp_name": "rclone", "ecosystem": "linux", "versions": [{"affected_version": "[1.64.0,1.75.1)", "min_fixed_version": "1.75.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "对错误会话暴露数据元素", "kind_en": "数据元素暴露于错误会话", "last_modified_time": "2026-09-11", "level": "High", "mps_id": "MPS-hjoe-xp81", "poc": false, "poc_url": [], "published_time": "2026-09-11", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-hjoe-xp81", "name": "https://www.oscs1024.com/hd/MPS-hjoe-xp81"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-88017", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-88017"}, {"url": "https://github.com/rclone/rclone/security/advisories/GHSA-c476-6w5q-jw77", "name": "https://github.com/rclone/rclone/security/advisories/GHSA-c476-6w5q-jw77"}, {"url": "https://github.com/rclone/rclone/commit/c6af0b57c2b4af848bc968c2b407354476184b99", "name": "https://github.com/rclone/rclone/commit/c6af0b57c2b4af848bc968c2b407354476184b99"}, {"url": "https://github.com/rclone/rclone/releases/tag/v1.75.1", "name": "https://github.com/rclone/rclone/releases/tag/v1.75.1"}], "scope_influence": "", "tags": [], "title": "rclone：FTP 跨会话身份验证代理后端混淆", "_translated": true, "_saved_at": "2026-09-10T16:50:55+00:00", "_first_saved_at": "2026-09-10T16:50:55+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-hjoe-xp81"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-81825", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "cwe": "CWE-79", "description": "Simple Ajax Chat（插件标识 simple-ajax-chat）是一款开源的 WordPress 聊天插件，作者 Jeff Starr，通过短代码或模板标签在站点任意页面嵌入 Ajax 聊天窗口，聊天消息持久存储于数据库并向所有访客展示。\n受影响版本中，聊天消息经公开端点 simple-ajax-chat-core.php 提交，存储前的 sac_special_chars() 仅执行 wp_strip_all_tags 与 sanitize_text_field，未对引号等特殊字符做实体编码；防护提交的 nonce 以明文打印在公开聊天页面中，未认证攻击者获取该 nonce 后可携带恶意聊天消息提交入库。simple_ajax_chat() 渲染消息时仅做 sanitize_text_field（保留引号），再用正则 /(http|https|ftp|ftps)\\:\\/\\/[a-zA-Z0-9\\-\\.]+\\.[a-zA-Z]{2,3}(\\/\\S*)?/ 将类 URL 文本拼入 \u003ca href=\"\\0\"\u003e 的 href 属性并未经转义直接回显，消息中的引号可闭合 href 属性注入任意脚本属性，形成对所有访客执行的存储型 XSS。\n修复版本中通过官方 changeset 3669278（随 20260827 版本 C:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "cwe": "CWE-79", "description": "Vigilant（插件标识 vigilante）是运行于 WordPress 的开源安全防护插件，提供防火墙、双因素认证、登录保护、安全响应头与活动日志审计等功能。\n受影响版本中，未认证攻击者向 WordPress 登录入口提交携带恶意 User-Agent 的失败登录后，Vigilante_Login_Security 的 handle_failed_login 方法触发 includes/class-database.php 的 record_login_attempt 与 insert_activity_log，将该请求头经 sanitize_text_field 清理后存入登录尝试与活动日志表，引号字符原样保留；管理员打开安全审计页面时，assets/js/admin.js 的 escapeHtml 只转义尖括号与 \u0026 符号、不编码单双引号，User-Agent 被拼入 data-details、data-value 等引号定界的 HTML 属性中，攻击者得以闭合属性并注入任意 Web 脚本，在管理员浏览器中执行。\n修复版本中通过重写 admin.js 的 escapeHtml 为显式替换 \u0026、\u003c、\u003e、双引号与单引号对应的 HTML 实体，并改用 attr 读取白名单与黑名单按钮取值，使属性位置无法被引号闭合，切断未认证攻击者经失败登录 User-Agent 注入、借管理员浏览日志页面执行的攻击链路；2.10.3 版本已包含该修复。", "effects": [{"comp_name": "vigilante", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.10.3)", "min_fixed_version": "2.10.3", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-09-11", "level": "High", "mps_id": "MPS-dez8-goyf", "poc": false, "poc_url": [], "published_time": "2026-09-11", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-dez8-goyf", "name": "https://www.oscs1024.com/hd/MPS-dez8-goyf"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-81754", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-81754"}, {"url": "https://www.wordfence.com/threat-intel/vulnerabilities/id/c483cdc5-56e4-4ee7-a782-0505816728ab?source=cve", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/vigilante/tags/2.9.5/includes/class-database.php#L448", "name": ""}, {"url": "https://plugins.trac.wordpress.org/browser/vigilante/tags/2.9.5/includes/class-database.php#L639", "name": ""}, "last_modified_time": "2026-09-11", "level": "High", "mps_id": "MPS-3ati-49ne", "poc": false, "poc_url": [], "published_time": "2026-09-11", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-3ati-49ne", "name": "https://www.oscs1024.com/hd/MPS-3ati-49ne"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-88016", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-88016"}, {"url": "https://github.com/rclone/rclone/security/advisories/GHSA-f8g7-2xjc-7mfh", "name": "https://github.com/rclone/rclone/security/advisories/GHSA-f8g7-2xjc-7mfh"}, {"url": "https://github.com/rclone/rclone/commit/17b0c03338a857bcb0a68d2d4c82ddbdec3f7893", "name": "https://github.com/rclone/rclone/commit/17b0c03338a857bcb0a68d2d4c82ddbdec3f7893"}, {"url": "https://github.com/rclone/rclone/commit/a7ab39d3d1958afa1446982c1dc4e4a73a887e3e", "name": "https://github.com/rclone/rclone/commit/a7ab39d3d1958afa1446982c1dc4e4a73a887e3e"}, {"url": "https://github.com/rclone/rclone/releases/tag/v1.75.1", "name": "https://github.com/rclone/rclone/releases/tag/v1.75.1"}], "scope_influence": "", "tags": [], "title": "CVE-2026-88016漏洞", "_translated": true, "_saved_at": "2026-09-10T16:50:59+00:00", "_first_saved_at": "2026-09-10T16:50:59+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-3ati-49ne"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-88938", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:N", "severity": "medium", "base_score": 6.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-22", "description": "knowns 到 0.33.0 无法将 code.find MCP 工具的路径参数限制到项目根目录，从而允许 AI 代理会话读取主机上任何位置的源文件。攻击者可以向路径参数提供绝对路径或相对遍历序列，并从预期项目目录外部检索完整文件内容。", "effects": [{"comp_name": "knowns", "ecosystem": "linux", "versions": [{"affected_version": "(0,0.33.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-09-10", "level": "High", "mps_id": "MPS-w9qm-o4cf", "poc": false, "poc_url": [], "published_time": "2026-09-11", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-w9qm-o4cf", "name": "https://www.oscs1024.com/hd/MPS-w9qm-o4cf"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-88938", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-88938"}, {"url": "https://github.com/knowns-dev/knowns/security/advisories/GHSA-5cj9-fcqq-g2h7", "name": "GitHub Security Advisory (GHSA-5cj9-fcqq-g2h7)"}, {"url": "https://github.com/knowns-dev/knowns/blob/v0.33.0/internal/mcp/handlers/code.go#L873-L902", "name": ""}, {"url": "https://github.com/knowns-dev/knowns/blob/v0.33.0/internal/mcp/handlers/code.go#L1293-L1354", "name": ""}, {"url": "https://www.vulncheck.com/advisories/knowns-through-0.33.0-path-traversal-via-code-find-mcp-tool", "name": "VulnCheck Advisory: knowns through 0.33.0 Path Traversal via code.find MCP tool"}], "scope_influence": "", "tags": [], "title": "通过 code.find MCP 工具通过 0.33.0 进行路径遍历", "_translated": true, "_saved_at": "2026-09-10T16:50:47+00:00", "_first_saved_at": "2026-09-10T16:50:47+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-w9qm-o4cf"}]}</script>
  <script>
    const payload = JSON.parse(document.getElementById("payload").textContent);
    const levelLabels = payload.level_labels || {};
    const items = payload.items || [];
    let filtered = items.slice();
    let activeId = null;

    const $ = (id) => document.getElementById(id);
    $("generatedAt").textContent = payload.generated_at || "-";
    $("retention").textContent = payload.retention_days ?? "-";
    $("cutoff").textContent = payload.cutoff_date || "-";
    $("count").textContent = String(payload.count ?? items.length);

    function levelClass(level) {
      const cn = levelLabels[level] || level || "";
      if (level === "Critical" || cn === "严重") return "crit";
      if (level === "High" || cn === "高危") return "high";
      return "other";
    }
    function levelText(level) {
      return levelLabels[level] || level || "-";
    }
    function esc(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }
    function scoreText(v) {
      if (v === null || v === undefined || v === "" || v === -1) return "-";
      return String(v);
    }

    function renderList() {
      const list = $("list");
      $("listCount").textContent = String(filtered.length);
      if (!filtered.length) {
        list.innerHTML = '<div class="empty">没有匹配项</div>';
        return;
      }
      list.innerHTML = filtered.map((it) => {
        const id = it.mps_id || it.cve_id;
        const active = id === activeId ? " active" : "";
        return `
          <button class="item${active}" data-id="${esc(id)}" type="button">
            <div class="item-top">
              <span class="cve">${esc(it.cve_id || it.mps_id || "-")}</span>
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
            </div>
            <div class="title">${esc(it.title || "-")}</div>
            <div class="item-foot">
              <span>CVSS ${esc(scoreText(it.cvss_score))}</span>
              <span>${esc(it.published_time || "-")}</span>
              ${it.poc ? "<span>POC</span>" : ""}
            </div>
          </button>`;
      }).join("");
      list.querySelectorAll(".item").forEach((btn) => {
        btn.addEventListener("click", () => selectById(btn.dataset.id));
      });
    }

    function refsHtml(it) {
      const refs = Array.isArray(it.reference_url_list) ? it.reference_url_list : [];
      const links = [];
      if (it._source_page) links.push({ url: it._source_page, name: "OSCS 详情" });
      if (it.cve_id) links.push({ url: `https://nvd.nist.gov/vuln/detail/${it.cve_id}`, name: "NVD" });
      refs.forEach((r) => {
        if (r && r.url) links.push({ url: r.url, name: r.name || r.url });
      });
      const seen = new Set();
      const uniq = [];
      for (const l of links) {
        if (seen.has(l.url)) continue;
        seen.add(l.url);
        uniq.push(l);
      }
      if (!uniq.length) return '<div class="box">无参考链接</div>';
      return `<div class="refs">${uniq.map((l) =>
        `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name || l.url)}</a>`
      ).join("")}</div>`;
    }

    function articlesHtml(it) {
      const arts = Array.isArray(it.articles) ? it.articles : [];
      if (!arts.length) return "";
      return `<div class="section"><h3>相关说明</h3>${arts.map((a) => `
        <div class="article">
          <h4>${esc(a.title || "说明")}</h4>
          <p>${esc(a.content || "")}</p>
        </div>`).join("")}</div>`;
    }

    function renderDetail(it) {
      const detail = $("detail");
      if (!it) {
        detail.innerHTML = '<div class="empty">暂无数据</div>';
        return;
      }
      const pocUrls = Array.isArray(it.poc_url) ? it.poc_url : [];
      detail.innerHTML = `
        <div class="d-head">
          <div>
            <h1 class="d-title">${esc(it.title || "-")}</h1>
            <div class="ids">
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
              <span class="chip">${esc(it.cve_id || "无 CVE")}</span>
              <span class="chip">${esc(it.mps_id || "-")}</span>
              ${it.poc ? '<span class="chip">有 POC</span>' : ""}
              ${it.exp ? '<span class="chip">有 EXP</span>' : ""}
            </div>
          </div>
          <div class="actions">
            ${it._source_page ? `<a class="btn" href="${esc(it._source_page)}" target="_blank" rel="noopener">OSCS</a>` : ""}
            ${it.cve_id ? `<a class="btn" href="https://nvd.nist.gov/vuln/detail/${esc(it.cve_id)}" target="_blank" rel="noopener">NVD</a>` : ""}
          </div>
        </div>
        <div class="grid">
          <div class="stat"><div class="k">CVSS</div><div class="v">${esc(scoreText(it.cvss_score))}</div></div>
          <div class="stat"><div class="k">向量</div><div class="v">${esc(it.cvss_vector || "-")}</div></div>
          <div class="stat"><div class="k">CWE</div><div class="v">${esc(it.cwe || "-")}</div></div>
          <div class="stat"><div class="k">类型</div><div class="v">${esc(it.kind || it.kind_en || "-")}</div></div>
          <div class="stat"><div class="k">公开</div><div class="v">${esc(it.published_time || "-")}</div></div>
          <div class="stat"><div class="k">利用成本</div><div class="v">${esc(it.exploit_requirement_cost || "-")}</div></div>
          <div class="stat"><div class="k">可利用性</div><div class="v">${esc(it.exploitability || "-")}</div></div>
          <div class="stat"><div class="k">修复建议</div><div class="v">${esc(it.fix_suggestion || "-")}</div></div>
        </div>
        <div class="section"><h3>描述</h3><div class="box">${esc(it.description || "无描述")}</div></div>
        ${it.scope_influence ? `<div class="section"><h3>影响范围</h3><div class="box">${esc(it.scope_influence)}</div></div>` : ""}
        ${pocUrls.length ? `<div class="section"><h3>POC 链接</h3><div class="refs">${pocUrls.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join("")}</div></div>` : ""}
        <div class="section"><h3>参考链接</h3>${refsHtml(it)}</div>
        ${articlesHtml(it)}
      `;
    }

    function selectById(id) {
      const it = filtered.find((x) => (x.mps_id || x.cve_id) === id) ||
                 items.find((x) => (x.mps_id || x.cve_id) === id);
      if (!it) return;
      activeId = it.mps_id || it.cve_id;
      renderList();
      renderDetail(it);
      const btn = document.querySelector(`.item[data-id="${CSS.escape(activeId)}"]`);
      if (btn) btn.scrollIntoView({ block: "nearest" });
      history.replaceState(null, "", "#" + encodeURIComponent(activeId));
    }

    function applyFilter(q) {
      const query = (q || "").trim().toLowerCase();
      filtered = !query ? items.slice() : items.filter((it) => {
        const blob = [
          it.cve_id, it.mps_id, it.title, it.kind, it.kind_en, it.cwe, it.description, it.level
        ].map((x) => String(x || "").toLowerCase()).join(" ");
        return blob.includes(query);
      });
      renderList();
      if (filtered.length) {
        const still = filtered.some((x) => (x.mps_id || x.cve_id) === activeId);
        selectById(still ? activeId : (filtered[0].mps_id || filtered[0].cve_id));
      } else {
        activeId = null;
        renderDetail(null);
      }
    }

    $("search").addEventListener("input", (e) => applyFilter(e.target.value));

    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement !== $("search")) {
        e.preventDefault();
        $("search").focus();
        return;
      }
      if (!filtered.length) return;
      const idx = filtered.findIndex((x) => (x.mps_id || x.cve_id) === activeId);
      if (e.key === "ArrowDown") {
        e.preventDefault();
        const next = filtered[Math.min(filtered.length - 1, Math.max(0, idx) + 1)];
        selectById(next.mps_id || next.cve_id);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        const prev = filtered[Math.max(0, idx - 1)];
        selectById(prev.mps_id || prev.cve_id);
      }
    });

    const hashId = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    if (hashId && items.some((x) => (x.mps_id || x.cve_id) === hashId)) {
      activeId = hashId;
      renderList();
      selectById(hashId);
    } else if (items.length) {
      selectById(items[0].mps_id || items[0].cve_id);
    } else {
      renderList();
      renderDetail(null);
    }
  </script>
</body>
</html>
