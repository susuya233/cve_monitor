 "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "反序列化", "kind_en": "不可信数据的反序列化", "last_modified_time": "2026-10-11", "level": "Critical", "mps_id": "MPS-y8r9-kzi2", "poc": false, "poc_url": [], "published_time": "2026-10-11", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-y8r9-kzi2", "name": "https://www.oscs1024.com/hd/MPS-y8r9-kzi2"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-78535", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-78535"}, {"url": "https://patchstack.com/database/wordpress/theme/photolia/vulnerability/wordpress-photolia-theme-1-0-3-php-object-injection-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": [], "title": "Photolia 主题 PHP 对象注入漏洞", "_translated": true, "_saved_at": "2026-10-10T22:09:22+00:00", "_first_saved_at": "2026-10-10T22:09:22+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-y8r9-kzi2"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-105889", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:N/A:L", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:N/A:L", "cwe": "CWE-89", "description": "Tickera 是一款开源（GPLv2 或更高版本）的 WordPress 活动售票与票务管理插件，提供活动管理、订单处理、检票接口与销售统计等功能。\n受影响版本中，插件 Sales API 通过 init 钩子对外提供服务且无需登录，TC_Sales_API 将请求参数 period_compare 仅经 sanitize_text_field 处理后传入 TC_Orders_Search，其 filter_where 方法经 posts_where 过滤器把该值以字符串拼接方式并入 WP_Query 的 WHERE 子句，攻击者可在请求中注入 SQL 比较表达式构造布尔或延时盲注；受影响版本对 api_key 的校验在 api_key 为空时因 meta 查询空值语义而失效，未认证请求可到达上述拼接点，最终形成未认证盲注 SQL 注入，导致数据库信息泄露。\n修复版本中通过在 TC_Orders_Search 构造函数中对 period_compare 实施操作符白名单校验并将非法值回落为 '='，filter_where 改用 $wpdb-\u003eprepare 以占位符绑定日期与 post_status，切断了外部输入拼接进入 SQL 语句的路径；Sales API 的 api_key 校验对空值改为直接失败，未认证请求无法再进入统计查询。", "effects": [{"comp_name": "tickera-event-ticketing-system", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,3.6.0.7)", "min_fixed_version": "3.6.0.7", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-10-11", "level": "Critical", "mps_id": "MPS-4wqj-klu9", "poc": false, "poc_url": [], "published_time": "2026-10-11", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-4wqj-klu9", "name": "https://www.oscs1024.com/hd/MPS-4wqj-klu9"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-105889", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-105889"}, {"url": "https://patchstack.com/database/wordpress/plugin/tickera-event-ticketing-system/vulnerability/wordpress-tickera-plugin-3-6-0-6-sql-injection-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Tickera SQL注入漏洞", "_translated": true, "_saved_at": "2026-10-10T18:10:15+00:00", "_first_saved_at": "2026-10-10T18:10:15+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-4wqj-klu9"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id 开发人员应该采用安全编码实践，包括避免使用eval函数、避免拼接用户输入的字符串作为代码执行等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止代码注入攻击。", "title": "如何预防代码注入"}], "cnvd_id": "", "cve_id": "CVE-2026-96119", "cvss": {"cvssv31": [{"source": "psirt@us.ibm.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.9}]}, "cvss_score": 9.9, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "cwe": "CWE-94", "description": "IBM i 是 IBM 提供的商业操作系统，不是开源项目，HTTP Server Administration 图形界面随许可程序 5770-SS1 提供，用于通过 Web 管理本机 HTTP 服务器。\n受影响版本中，HTTP Server Administration Web 应用对输入数据净化不当，远程已认证攻击者可通过该管理界面获取系统敏感信息或执行任意代码。\n修复版本中通过为 IBM i 7.3、7.4、7.5 和 7.6 分别安装 PTF SJ11641、SJ11643、SJ11644 和 SJ11645 修复该数据净化缺陷，安装对应 PTF 后可消除敏感信息泄露与任意代码执行风险。", "effects": [{"comp_name": "i", "ecosystem": "linux", "versions": [{"affected_version": "[7.3,7.3-SJ11641)", "min_fixed_version": "7.3-SJ11641", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[7.4,7.4-SJ11643)", "min_fixed_version": "7.4-SJ11643", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[7.5,7.5-SJ11644)", "min_fixed_version": "7.5-SJ11644", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[7.6,7.6-SJ11645)", "min_fixed_version": "7.6-SJ11645", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "代码注入", "kind_en": "代码生成控制不当（“代码注入”）", "last_modified_time": "2026-10-13", "level": "Critical", "mps_id": "MPS-vtfr-a3ih", "poc": false, "poc_url": [], "published_time": "2026-10-13", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-vtfr-a3ih", "name": "https://www.oscs1024.com/hd/MPS-vtfr-a3ih"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-96119", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-96119"}, {"url": "https://www.ibm.com/support/pages/nod me": "2026-10-13", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-zk0s-q9vm", "name": "https://www.oscs1024.com/hd/MPS-zk0s-q9vm"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-109422", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-109422"}, {"url": "https://gist.github.com/LeoWSY-hashblue/10e5383fc2d4d75faf74a9507c6bba9f", "name": "Researcher Disclosure"}, {"url": "https://hr.163.com/product.html/music", "name": "Product Page"}, {"url": "https://www.vulncheck.com/advisories/netease-cloud-music-rce-via-os-navigateexternal-ipc", "name": "VulnCheck Advisory: NetEase Cloud Music RCE via os.navigateExternal IPC"}], "scope_influence": "", "tags": ["应用软件"], "title": "网易云音乐远程代码执行", "_translated": true, "_saved_at": "2026-10-12T20:44:59+00:00", "_first_saved_at": "2026-10-12T20:44:59+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-zk0s-q9vm"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2026-108865", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:L/A:N", "severity": "high", "base_score": 8.2}], "cvssv4": md.io/@1ExmmukzRMWN7B4gQ4W-4Q/amoylab-unla-oauth-self-issued-token-authz", "name": ""}, {"url": "https://github.com/AmoyLab/Unla/blob/v0.10.0/internal/auth/oauth.go#L86-L147", "name": ""}, {"url": "https://github.com/AmoyLab/Unla/blob/v0.10.0/internal/core/server.go#L229-L261", "name": ""}, {"url": "https://github.com/AmoyLab/Unla", "name": ""}, {"url": "https://www.vulncheck.com/advisories/amoylab-unla-through-0.10.0-oauth2-authentication-bypass-via-authorize", "name": "VulnCheck Advisory: AmoyLab Unla through 0.10.0 OAuth2 Authentication Bypass via /authorize"}], "scope_influence": "", "tags": ["AI", "go"], "title": "Unla OAuth2认证绕过", "_translated": true, "_saved_at": "2026-10-11T15:15:50+00:00", "_first_saved_at": "2026-10-11T15:15:50+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-5u3j-6plq"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-88827", "cvss": {}, "cvss_score": 8.8, "cvss_vector": "", "cwe": "CWE-287", "description": "Disable Users 是 Jared Atchison 开发的开源（GPLv2）WordPress 插件（slug：disable-users），允许管理员在用户资料页勾选禁用特定账号，使其无法通过登录表单进入站点。\n受影响版本中，插件将账号禁用检查唯一挂载在 wp_login 动作钩子上，user_login() 方法读取用户元数据 ja_disable_user，在值为 1 时清除登录态并跳转登录页；wp_login 钩子只在 wp-login.php 表单登录流程中触发，XML-RPC 认证与 REST API 应用密码认证均不经过该钩子，持有被禁用账号有效凭据的攻击者可通过 xmlrpc.php 或应用密码以该账号的完整权限继续完成认证。\n修复版本中通过，可通过停用并卸载该插件缓解，同时吊销被禁用账号的应用密码；wordpress.org 已于 2026-09-28 将该插件下架待审，截至 2026-10-11 官方未发布任何修复版本。", "effects": [{"comp_name": "disable-users", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.0.5]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "身份验证不当", "kind_en": "认证不当", "last_modified_time": "2026-10-11", "level": "High", "mps_id": "MPS-atcf-rmw8", "poc": false, "poc_url": [], "published_time": "2026-10-11", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-atcf-rmw8", "name": "https://www.oscs1024.com/hd/MPS-atcf-rmw8"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-88827", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-88827"}, {"url": "https://wpscan.com/vulnerability/1120d99a-9853-4b41-a2ce-d4909b19aea1/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Disable Users禁用账户认证绕过漏洞", "_translated": true, "_saved_at": "2026-10-11T08:09:12+00:00", "_first_saved_at": "2026-10-11T08:09:12+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-atcf-rmw8"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-88905", "cvss": {}, "cvss_score": 8.8, "cvss_vector": "", "cwe": "CWE-79", "description": "KeyWord Collector（插件标识 keyword-collector）是 AdSimple 发布的 WordPress 开源插件，通过 SISTRIX API 采集页面关键词，并支持以 [keywords_collector] 短代码或自动插入方式在文章、页面中展示这些关键词。\n受影响版本中，lib/WPKeyWordSettings.php 的 WPKeyWordSettings 方法同时挂载 wp_ajax_WPKeyWordSettings 与 wp_ajax_nopriv_WPKeyWordSettings 动作，处理请求时未做任何用户权限或 nonce 校验，未认证攻击者向 admin-ajax.php 提交 action=WPKeyWordSettings 后，可将 before_list、before_items 等设置值原样写入 wp_options；wp_keyword.php 的 add_keywords 短代码回调与后台设置页 WPKeyWordOptions 随后以 echo get_option(...) 的方式原样输出这些值，导致注入的 JavaScript 在访客加载相关页面或管理员打开设置页时执行。\n修复版本中通过，WPScan 将该漏洞标注为 No known fix，WordPress.org 已于 2026-09-28 关闭该插件下载页并等待完整审查；在官方修复发布前，建议停用并删除该插件，或在边界防护中拦截未认证用户对 admin-ajax.php 的 action=WPKeyWordSettings 请求。", "effects": [{"comp_name": "keyword-collector", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.4]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstr 03", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-88903"}, {"url": "https://wpscan.com/vulnerability/173b07dd-6404-49c0-9e01-90b5b68d1dec/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Topcontent 插件存储型 XSS 漏洞", "_translated": true, "_saved_at": "2026-10-11T08:09:09+00:00", "_first_saved_at": "2026-10-11T08:09:09+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-junk-8yif"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-88826", "cvss": {}, "cvss_score": 8.8, "cvss_vector": "", "cwe": "CWE-79", "description": "SmugMug Embed 是一个采用 GPL v2 许可的开源 WordPress 插件，用于将站长 SmugMug 账号中的相册与图片嵌入 WordPress 文章或页面，最新版本为 3.13，该插件已自 2026-09-28 起从 WordPress.org 插件目录暂时下架以待审查。\n受影响版本中，includes/class_SME_helper.php 将 saveSelectedAlbums 动作同时注册到 wp_ajax 与 wp_ajax_nopriv，处理函数不校验 nonce，也不检查用户权限，直接把 $_POST['selectedAlbums'] 原样写入 SME_SelectedAlbums 选项；管理员访问插件设置页时，includes/class_SME_Settings.php 的 SME_SmugMugEmbed_options_gallery_display() 将该选项内容未经转义地拼入内联 \u003cscript\u003e 标签输出，未认证攻击者可在后台管理页面注入并执行任意 Web 脚本。\n修复版本中通过，可通过停用并删除该插件进行处置，同时排查 SME_SelectedAlbums 选项中的可疑内容；上游已将其从 WordPress.org 目录暂时关闭，截至 2026-10-11 未发布包含修复的版本。", "effects": [{"comp_name": "smugmug-embed", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,3.13]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-10-11", "level": "High", "mps_id": "MPS-x1wn-6bkm", "poc": false, "poc_url": [], "published_time": "2026-10-11", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-x1wn-6bkm", "name": "https://www.oscs1024.com/hd/MPS-x1wn-6bkm"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-88826", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-88826"}, {"url": "https://wpscan.com/vulnerability/6e8925b5-85a1-48e3-b744-df1c6fa24ed4/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "SmugMug Embed未授权存储型XSS", "_translated": true, "_saved_at": "2026-10-11T08:09:07+00:00", "_first_saved_at": "2026-10-11T08:09:07+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-x1wn-6bkm"}, {"analysis_status": 0, "articles": [{"content": "- 程序未正确处理用户上传的文件，从而导致程序可以读取、处理或存储未经授权的文件\n", "title": "什么是任意文件上传"}, {"content": "- 欺骗攻击：攻击者可以通过发送伪造的文件来欺骗程序，从而导致程序读取、处理或存储未经授权的文件。\n- 文件格式攻击：攻击者可以通过选择特定的文件格式，例如压缩文件或 ZIP 文件，从而利用上传的文件来篡改程序的执行结果或窃取程序中的重要数据。\n", "title": "任意文件上传常见的攻击方式"}, {"content": "- 使用安全文件传输协议 (FTP):使用安全 FTP 协议可以确保上传的文件格式、大小、权限等符合预期，同时可以防止文件读取、篡改或存储漏洞。\n- 使用文件上传过滤器：使用文件上传过滤器可以过滤上传的文件，以确保文件的格式、大小、权限等符合预期，同时可以防止文件读取、篡改或存储漏洞。\n- 使用白名单机制：使用白名单机制可以只允许特定的文件格式、大小、权限等存在的文件上传，从而防止非法文件的上传和攻击。\n- 定期更新和升级程序：定期更新和升级程序可以修复已知的漏洞，并增强程序的安全性。", "title": "如何预防任意文件上传"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-93550", "cvss": {}, "cvss_score": 8.8, "cvss_vector": "", "cwe": "CWE-434", "description": "Veeqo for WooCommerce 是一款开源（BSD-3-Clause 许可）的 WordPress 插件，用于将 WooCommerce 商店与 Veeqo 库存与订单管理平台对接，支持库存同步、订单管理与物流面单打印。\n受影响版本中，插件在 includes/wordpress_hooks.php 中将 start_veeqo_connection_process 注册为 wp_ajax_start_veeqo_connection_process AJAX 处理器，未设置能力（capability）与 nonce 校验，Subscriber 及以上任意登录用户均可调用；includes/bridge_class.php 的 valid_bridge_url_loaded 方法使用未锚定的正则校验 bridge_url 参数，攻击者可构造包含合法 URL 子串的任意地址绕过校验，使 process_bridge_upload 将该地址内容下载为站点根目录下的 bridge.zip 并经 unzip_file 解压到 WordPress 根目录，最终攻击者压缩包内的任意 PHP 文件落地站点根目录并导致远程代码执行。\n修复版本中通过。该插件已于 2026-10-06 在 WordPress.org 插件目录被标记关闭待完整审核，官方修复发布前可通过停用并删除该插件、限制开放注册并审计站点根目录异常 PHP 文件作为临时防护。", "effects": [{"comp_name": "veeqo-for-woocommerce", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.2.8]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "任意文件上传", "kind_en": "危险类型文件无限制上传", "last_modified_time": "2026-10-11", "level": "High", "mps_id": "MPS-xa20-kdun", "poc": false, "poc_url": [], "published_time": "2026-10-11", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-xa20-kdun", "name": "https://www.oscs1024.com/hd/MPS-xa20-kdun"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-93550", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-93550"}, {"url": "https://wpscan.com/vulnerability/09517757-2f99-42d5-8300-e1f618373059/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Veeqo for WooCommerce任意文件上传漏洞", "_translated": true, "_saved_at": "2026-10-11T08:09:05+00:00", "_first_saved_at": "2026-10-11T08:09:05+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-xa20-kdun"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-108863", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "high", "base_score": 7.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-306", "description": "Katanemo Plano 是开源 AI 原生代理与数据面，用于 LLM 路由、可观测性、智能体编排和护栏。其 Python 包 planoai 随版本发布，并内置 Envoy 配置模板与启动逻辑。\n受影响版本中，config/envoy.template.yaml 将 Envoy 管理接口绑定到 0.0.0.0:9901，未设置认证或路径限制。默认 planoai up 使用原生模式，start_native 直接加载该配置；指定 Docker 启动时，docker_start_plano_detached 还会把容器端口 9901 映射到宿主机 19901。validate_and_render_schema 把含 model_providers.access_key 的配置经 yaml.dump 写入 plano_llm_config，模板将其嵌入 WASM 过滤器的 google.protobuf.StringValue，启动阶段的环境变量替换会展开为明文密钥。未认证的网络调用方请求 /config_dump 即可读出 LLM 提供商 API 密钥。\n修复版本中通过尚未发布的官方更新切断未授权管理接口访问；截至 2026-10-11，最新发布版 0.4.37 与 main 分支仍保留上述监听绑定、端口发布和未脱敏序列化，公开仓库没有已验证的修复提交。", "effects": [{"comp_name": "plano", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,0.4.37]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "planoai", "ecosystem": "pip", "versions": [{"affected_version": "(-∞,0.4.37]", "min_fixed_version": "", "repository": "pip", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "关键功能的认证机制缺失", "kind_en": "缺少关键功能的身份验证", "last_modified_time": "2026-10-11", "level": "High", "mps_id": "MPS-fhx3-m7tl", "poc": false, "poc_url": [], "published_time": "2026-10-11", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-fhx3-m7tl", "name": "https://www.oscs1024.com/hd/MPS-fhx3-m7tl"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-108863", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-108863"}, {"url": "https://hackmd.io/@1ExmmukzRMWN7B4gQ4W-4Q/katanemo-plano-envoy-admin-config-secret-disclosure", "name": ""}, {"url": "https://github.com/katanemo/plano/blob/0.4.37/config/envoy.template.yaml#L1-L3", "name": ""}, {"url": "https://github.com/katanemo/plano/blob/0.4.37/cli/planoai/config_generator.py#L588-L656", "name": ""}, {"url": "https://github.com/katanemo/plano", "name": ""}, {"url": "https://www.vulncheck.com/advisories/katanemo-plano-through-0.4.37-missing-authentication-on-envoy-admin-interface", "name": "VulnCheck Advisory: Katanemo Plano through 0.4.37 Missing Authentication on Envoy Admin Interface"}], "scope_influence": "", "tags": ["AI", "python", "开源"], "title": "Plano管理接口认证缺失", "_translated": true, "_saved_at": "2026-10-11T15:15:50+00:00", "_first_saved_at": "2026-10-11T15:15:50+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-fhx3-m7tl"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-88930", "cvss": {}, "cvss_score": 8.6, "cvss_vector": "", "cwe": "CWE-89", "description": "Social Web Suite 是一款 GPLv2 开源的 WordPress 社交媒体自动发布插件，用于将 WordPress 文章自动分享或定时发布到 Instagram、Facebook、LinkedIn、X 等社交平台。\n受影响版本中，插件在 admin-ajax.php 上注册了 wp_ajax_nopriv_sws_list_posts 等未认证接口，请求合法性由 SocialWebSuite::verify 以共享密钥 secret_key 计算 HMAC-SHA256 校验，而该密钥仅在管理员打开插件设置页时生成，未初始化时 hash_hmac 以空字符串参与运算，攻击者可自行计算 hash 并附带未来时间戳通过校验；ajax_list_posts 将 GET 参数 exclude_posts 未经参数化处理直接拼入 posts.ID IN (...) 的两处 SQL 语句并由 $wpdb-\u003eget_results 执行，未调用 $wpdb-\u003eprepare，未认证攻击者可借助返回 JSON 中的 total 字段形成布尔盲注，读取数据库中的敏感数据。\n修复版本中通过，管理员可通过停用并删除该插件消除风险；wordpress.org 已于 2026-09-28 将该插件下架以接受完整审查，后续应仅安装官方重新上架且包含修复的版本。", "effects": [{"comp_name": "social-web-suite", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,4.1.12]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-10-11", "level": "High", "mps_id": "MPS-0asr-87id", "poc": false, "poc_url": [], "published_time": "2026-10-11", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-0asr-87id", "name": "https://www.oscs1024.com/hd/MPS-0asr-87id"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-88930", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-88930"}, {"url": "https://wpscan.com/vulnerability/79204810-fd42-479d-bd2f-8762210f0fc5/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Social Web Suite未授权SQL注入漏洞", "_translated": true, "_saved_at": "2026-10-11T08:09:07+00:00", "_first_saved_at": "2026-10-11T08:09:07+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-0asr-87id"}, {"analysis_status": 0, "articles": [{"content": "攻击者可以通过构造特定的输入来绕过应用程序对文件路径的验证，进而访问应用程序之外的文件或目录。这种漏洞通常出现在应用程序根据用户提供的输入来确定文件路径的场景中，如文件下载、文件读取或包含其他文件的操作。", "title": "什么是路径遍历"}, {"content": "- 字符串拼接：攻击者提供包含特殊字符的文件路径，以获取目标文件系统中的敏感文件。例如，攻击者可以使用\"../\"表示向上导航到上层目录，然后获取目标目录中的文件。\n- NULL字节攻击：攻击者通过插入空字节（\\0）来截断文件路径，绕过应用程序的路径检查。这种攻击通常针对使用C/C++编程语言的应用程序，因为C字符串是以NULL字节结尾的。\n- 编码绕过攻击：攻击者可以尝试使用特殊编码（如URL编码、Unicode编码）绕过输入验证，使应用程序无法正确解析文件路径，从而实现路径遍历。", "title": "路径遍历常见的攻击方式"}, {"content": "- 输入验证和过滤：应该对所有从用户输入或不可信来源获取的文件路径进行验证和过滤。确保输入只包含允许的字符，并且没有包含特殊字符或路径导航符号。\n- 白名单验证：使用白名单机制来限制文件路径的选择范围。只允许用户访问应用程序所需的特定目录或文件，拒绝访问其他目录或文件。\n- 完整的路径解析：在构造文件路径时，使用完整的路径解析方法，以确保路径的正确性和合法性。避免使用相对路径或不完整的路径。\n- 限制访问权限：确保应用程序和服务器的文件系统设置正确，限制应用程序只能访问必要的文件和目录。使用操作系统级别的文件系统权限控制来限制访问权限。\n- 安全编码实践：开发人员应遵循安全的编码实践，如使用安全的API和框架、避免拼接用户输入和文件路径、不信任用户输入等。", "title": "如何预防路径遍历"}], "cnvd_id": "", "cve_id": "CVE-2026-78530", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:N/I:N/A:H", "severity": "high", "base_score": 7.7}]}, "cvss_score": 7.7, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:N/I:N/A:H", "cwe": "CWE-22", "description": "Subscriber Arbitrary File Deletion in FoodBakery \u003c= 4.6 versions.", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "路径遍历", "kind_en": "对受限制目录的路径名的不正确限制（“路径遍历”）", "last_modified_time": "2026-10-11", "level": "High", "mps_id": "MPS-0njl-d6gk", "poc": false, "poc_url": [], "published_time": "2026-10-11", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-0njl-d6gk", "name": "https://www.oscs1024.com/hd/MPS-0njl-d6gk"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-78530", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-78530"}, {"url": "https://patchstack.com/database/wordpress/theme/foodbakery/vulnerability/wordpress-foodbakery-theme-4-6-arbitrary-file-deletion-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": [], "title": "WordPress FoodBakery theme \u003c= 4.6 - Arbitrary File Deletion vulnerability", "_translated": true, "_saved_at": "2026-10-13T09:58:47+00:00", "_first_saved_at": "2026-10-10T22:09:25+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-0njl-d6gk"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-106609", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:H/A:N", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:H/A:N", "cwe": "CWE-862", "description": "Bayarcash WooCommerce（bayarcash-wc）是 Web Impian 开源的 WordPress 支付网关插件，用于在 WooCommerce 商店中接入 Bayarcash 支付通道，支持 FPX、Direct Debit、DuitNow 等马来西亚本地支付方式。\n受影响版本中，DirectDebitGateway 覆写的 process_callback 方法读取 php://input 中的 JSON 请求体并按 record_type 分发到 handle_bank_approval、handle_authorization_callback 与 handle_return_callback，整条链路未校验 Bayarcash checksum，也未做任何权限检查；该回调经 woocommerce_api_bayarcash_callback 挂载在站点公开的 ?wc-api=bayarcash_callback 端点上，未认证攻击者可伪造 bank_approval、authorization、transaction 回调，触发订阅激活、订单状态变更等支付结果处理，破坏订单与订阅数据的完整性。\n修复版本中通过在 process_callback 的 record_type 分发前新增 has_valid_callback_checksum 校验，按回调类型调用 SDK 的 verifyDirectDebitBankApprovalCallbackData、verifyDirectDebitAuthorizationCallbackData 或 verifyDirectDebitTransactionCallbackData，以商户 api_secret_key 验证 checksum，校验失败时返回 403，切断伪造回调进入支付状态处理的链路。", "effects": [{"comp_name": "bayarcash-wc", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,4.4.3)", "min_fixed_version": "4.4.3", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-10-11", "level": "High", "mps_id": "MPS-9azs-hjbf", "poc": false, "poc_url": [], "published_time": "2026-10-11", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-9azs-hjbf", "name": "https://www.oscs1024.com/hd/MPS-9azs-hjbf"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-106609", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-106609"}, {"url": "https://patchstack.com/database/wordpress/plugin/bayarcash-wc/vulnerability/wordpress-bayarcash-woocommerce-plugin-4-4-2-broken-access-control-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Bayarcash WooCommerce回调越权漏洞", "_translated": true, "_saved_at": "2026-10-10T18:10:18+00:00", "_first_saved_at": "2026-10-10T18:10:18+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-9azs-hjbf"}, {"analysis_status": 0, "articles": [{"content": "应用程序在处理用户输入时的不完善或缺乏验证机制，所以攻击者能够通过向应用程序发送恶意输入，利用应用程序对输入数据的错误处理方式来注入自己的恶意代码。这些恶意代码会被应用程序误认为是合法的指令或数据，并在执行过程中被执行。", "title": "什么是代码注入"}, {"content": "应用程序使用可执行动态代码的函数来执行用户可控的参数，当应用程序对于用户输入过滤不完全时，攻击者可以注入恶意代码并控制代码执行流程。", "title": "代码注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对所有用户输入进行验证和过滤，确保只接受预期的有效输入。这包括对输入数据进行输入长度验证、类型检查和格式验证等。\r\n- 使用参数化查询或预编译语句：对于数据库查询操作，应该使用参数化查询或预编译语句，确保输入数据不会被误认为是执行代码。\r\n- 最小特权原则：应用程序在执行操作系统命令或动态代码时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。\r\n- 安全编码实践：开发人员应该采用安全编码实践，包括避免使用eval函数、避免拼接用户输入的字符串作为代码执行等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止代码注入攻击。", "title": "如何预防代码注入"}], "cnvd_id": "", "cve_id": "CVE-2026-103071", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "cwe": "CWE-94", "description": "Thank You Page Customizer for WooCommerce（woo-thank-you-page-customizer）是 VillaTheme 开发的 WordPress 开源插件（GPL v2 及以上授权），用于自定义 WooCommerce 下单后的感谢页，支持以 {billing_first_name} 等占位符把订单信息嵌入页面文本并自动发放优惠券。\n受影响版本中，感谢页模板 templates/thankyou.php 读取订单账单姓名、邮箱、地址等字段构建 $shortcodes 数组时未做任何转义，随后把这些字段经 str_replace 原样替换进管理员配置的标题与文本编辑器内容，并执行 echo do_shortcode( $text )；下单客户（含游客结账）在账单字段写入 [shortcode] 语法后，订单感谢页渲染时该 shortcode 会在站点上下文被 do_shortcode 执行，攻击者可在站点已注册 shortcode 的能力范围内实现代码/内容注入。\n修复版本中通过在占位符替换前生成 $safe_value = wp_kses_post( str_replace( array('[',']'), array('\u0026#91;','\u0026#93;'), (string) $value ) )，使订单字段中的中括号被转义、无法再拼出 shortcode 语法，从而在 do_shortcode 之前切断注入链；同一修复还将优惠券邮件 AJAX 处理器的占位符来源由 $_POST['shortcodes'] 改为服务端 build_order_shortcodes() 从已验证订单生成。", "effects": [{"comp_name": "woo-thank-you-page-customizer", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.2.4)", "min_fixed_version": "1.2.4", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "代码注入", "kind_en": "代码生成控制不当（“代码注入”）", "last_modified_time": "2026-10-11", "level": "High", "mps_id": "MPS-x2lp-e5r7", "poc": false, "poc_url": [], "published_time": "2026-10-11", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-x2lp-e5r7", "name": "https://www.oscs1024.com/hd/MPS-x2lp-e5r7"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-103071", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-103071"}, {"url": "https://patchstack.com/database/wordpress/plugin/woo-thank-you-page-customizer/vulnerability/wordpress-thank-you-page-customizer-for-woocommerce-plugin-1-2-3-content-injection-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "WordPress感谢页插件代码注入漏洞", "_translated": true, "_saved_at": "2026-10-10T18:10:20+00:00", "_first_saved_at": "2026-10-10T18:10:20+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-x2lp-e5r7"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过向受信任的数据序列化过程中添加恶意数据，从而在序列化和反序列化过程中执行恶意代码的攻击漏洞。这种漏洞通常存在于使用序列化 (serialization) 机制存储和传输数据的程序中。\n", "title": "什么是反序列化"}, {"content": "- 注入攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码注入到程序中，从而实现代码执行的目的。\n- 反射攻击：攻击者使用反射机制，在序列化过程中动态生成恶意数据，并将恶意代码注入到程序中，从而实现代码执行的目的。\n- 缓冲区溢出攻击：攻击者通过在序列化过程中向缓冲区输入恶意数据，导致缓冲区溢出，从而破坏程序的内存管理，实现代码执行的目的。\n- 格式字符串攻击：攻击者通过在序列化过程中输入恶意数据，导致程序使用错误的格式字符串，从而实现代码执行的目的。\n- 数据流攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码作为一个数据流传递给程序，从而实现代码执行的目的。\n", "title": "反序列化常见的攻击方式"}, {"content": "- 不信任输入数据：程序应该严格检查输入数据的有效性，并避免使用不受信任的数据。\n- 使用安全的序列化机制：程序应该使用安全的序列化机制，如 JSON 或 XML 序列化，而不是第三方序列化库。\n- 最小特权原则：程序应该限制对受信任数据的处理权限，并避免在运行时修改数据。\n- 代码审查和漏洞扫描：程序应该进行代码审查和漏洞扫描，以发现和修复潜在的安全漏洞。\n", "title": "如何预防反序列化"}], "cnvd_id": "", "cve_id": "CVE-2026-62044", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-502", "description": "Super Video Player 是 bPlugins 开发的开源 WordPress 视频播放器插件（GPLv2 或更高许可），支持自托管 MP4、HLS 与 DASH 视频播放，可通过 Gutenberg 区块或 [vplayer] 短代码在页面中嵌入播放器并配置播放列表、字幕与画质切换，WordPress.org 显示安装量约 2000。\n受影响版本中，具备编辑（Editor）及以上权限的用户保存播放器配置时，Codestar Framework 的 CSF_Metabox::save_meta_box 会把请求中的 tabStyles 字段仅经 wp_kses_post 清理后写入同名文章元数据，该清理不会中和 PHP 序列化对象语法；页面通过短代码或区块渲染播放器时，inc/block-video-player.php 读取该元数据并调用 maybe_unserialize()，对判定为序列化数据的内容直接执行 unserialize()，编辑级用户预先写入的双重序列化载荷由此触发 PHP 对象注入，可借助站点已安装插件或主题中的魔术方法链导致文件操作、数据库注入乃至任意代码执行等后果。\n修复版本中通过，WordPress.org 官方渠道最新版本仍为 1.8.13，建议收回非必要的编辑权限、审计站点中 svplayer 文章的 tabStyles 元数据是否包含以 O: 开头的序列化对象片段，并部署 WAF 或虚拟补丁规则拦截携带 PHP 序列化对象特征的配置保存请求，待官方补丁发布后及时升级。", "effects": [{"comp_name": "super-video-player", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.8.13]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "反序列化", "kind_en": "不可信数据的反序列化", "last_modified_time": "2026-10-11", "level": "High", "mps_id": "MPS-5sxu-lgvf", "poc": false, "poc_url": [], "published_time": "2026-10-11", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-5sxu-lgvf", "name": "https://www.oscs1024.com/hd/MPS-5sxu-lgvf"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-62044", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-62044"}, {"url": "https://patchstack.com/database/wordpress/plugin/super-video-player/vulnerability/wordpress-super-video-player-plugin-1-8-13-php-object-injection-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Super Video Player对象注入漏洞", "_translated": true, "_saved_at": "2026-10-10T18:10:14+00:00", "_first_saved_at": "2026-10-10T18:10:14+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-5sxu-lgvf"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-106608", "cvss": {"cvssv31": [{"source": "audit@patchstack.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-266", "description": "WooCommerce 是 Automattic 开发的开源 WordPress 电商插件，为站点提供商品、订单与客户管理能力，并内置面向已认证用户的 REST API。\n受影响版本中，wc_rest_check_user_permissions() 判定店铺管理员（shop_manager）可编辑的目标用户时使用 array_intersect 统计角色交集，目标用户任一角色命中默认 customer 可编辑列表即通过 edit_users 检查，wc_modify_map_meta_cap() 的 meta cap 判定存在同型缺陷；拥有 shop_manager 角色的攻击者向 /wc/v3/customers/{id} 发送更新请求，可对同时持有 customer 与 administrator 等混合角色的用户改写 email 与 password，接管管理员账号完成权限提升。\n修复版本中通过将判定改为 array_diff，要求目标用户全部角色都位于 woocommerce_shop_manager_editable_roles 列表内，wc_modify_map_meta_cap() 同步收紧为同一条件并对混合角色用户返回 do_not_allow，混合角色用户不再可被店铺管理员编辑，密码与邮箱接管链路被切断。", "effects": [{"comp_name": "woocommerce", "ecosystem": "linux", "versions": [{"affected_version": "[9.8.0,11.2.0)", "min_fixed_version": "11.2.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "特权授予不正确", "kind_en": "权限分配不正确", "last_modified_time": "2026-10-11", "level": "High", "mps_id": "MPS-b7k9-1hlv", "poc": false, "poc_url": [], "published_time": "2026-10-11", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-b7k9-1hlv", "name": "https://www.oscs1024.com/hd/MPS-b7k9-1hlv"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-106608", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-106608"}, {"url": "https://patchstack.com/database/wordpress/plugin/woocommerce/vulnerability/wordpress-woocommerce-plugin-9-8-0-11-1-2-privilege-escalation-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "WooCommerce权限提升漏洞", "_translated": true, "_saved_at": "2026-10-10T18:10:16+00:00", "_first_saved_at": "2026-10-10T18:10:16+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-b7k9-1hlv"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-91829", "cvss": {}, "cvss_score": 7.1, "cvss_vector": "", "cwe": "CWE-79", "description": "Subscribe to Comments 是 WordPress 官方插件目录中的开源评论订阅插件（作者 Mark Jaquith），允许访客通过电子邮件订阅文章的后续评论，并提供订阅管理页面维护订阅。\n受影响版本中，订阅管理页将未经校验的 ref 参数作为“返回之前浏览的页面”链接目标，该参数仅经协议白名单过滤，由 entry_link 拼接进锚点标记后经消息系统原样输出，未身份验证的攻击者可构造含恶意 ref 参数的 URL，访问者（包括管理员）点击后浏览器执行注入的脚本。\n修复版本中通过重构 entry_link 的链接生成流程切断上述链路：返回地址先经 absint 与 get_post 解析，无对应文章的外部地址单独走经 esc_url 限制的静态文本链接分支，不可公开查看的文章改输出纯文本，链接文本以 esc_html 转义，攻击者可控的返回地址无法再进入未转义的链接标记。", "effects": [{"comp_name": "subscribe-to-comments", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.3.3)", "min_fix 序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-108677", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:N", "severity": "medium", "base_score": 6.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-862", "description": "JeecgBoot 是 jeecgboot 在 GitHub 上开源（Apache-2.0）的 Java 低代码开发平台，用于快速搭建后台管理系统、OA、ERP 等企业应用，内置用户、角色、权限与消息等模块。\n受影响版本中，SystemApiController 对外暴露的服务化内部接口 /sys/api/getUserByName 未添加 @RequiresPermissions 等权限注解，/sys/api/** 路径仅被只做身份认证的全局 JWT 过滤器覆盖，低权限登录用户传入任意 username 参数即可获取目标用户的 LoginUser 及其中的 password 字段；返回的 password 仅为使用 EncryptedString 中硬编码的密钥与 IV 进行的 AES/CBC 编码，且密钥与 IV 可通过 GET /sys/getEncryptedString 匿名获取，攻击者离线解密后可还原管理员口令密文用于离线猜解。\n修复版本中通过为 /sys/api 服务化内部接口补充功能级授权校验、将敏感信息加密密钥改为随部署随机生成并移除加密串接口的匿名暴露，切断上述未授权读取与明文密钥利用链；截至分析日期官方仓库尚未发布包含修复的版本，受影响用户应先按访问控制措施缓解并持续关注官方更新。", "effects": [{"comp_name": "jeecgboot:JeecgBoot", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,3.9.5]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-10-11", "level": "High", "mps_id": "MPS-l1u9-kj52", "poc": false, "poc_url": [], "published_time": "2026-10-11", "reference_url_list": [{"url": "https: : 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-105407", "cvss": {"cvssv31": [{"source": "3DS.Information-Security@3ds.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-78", "description": "Tuleap Enterprise Edition 是达索系统提供的商业应用生命周期管理平台，用于需求跟踪、任务协同与软件交付管理。\n受影响版本中，CNA 将 17.0-1 至 17.0-40 以及 17.5-1 至 17.5-31 标为存在操作系统命令注入。具备低权限的远程攻击者无需用户交互即可在服务器上执行任意命令，从而同时影响主机机密性、完整性与可用性。公告摘要写为 17.0 至 17.5，结构化受影响范围仅包含上述两条产品线，公开材料未给出具体文件、函数或参数。\n修复版本中通过达索系统向授权客户发布的安全更新处理该命令注入问题。公开 CVE 记录与厂商公告页未披露修复版本号和代码差异，修复说明位于需登录的客户门户，不能将 17.0-40 或 17.5-31 的后续修订号直接认定为修复版本。", "effects": [{"comp_name": "tuleap_enterprise_edition", "ecosystem": "linux", "versions": [{"affected_version": "[17.0-1,17.0-40]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[17.5-1,17.5-31]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-10-12", "level": "High", "mps_id": "MPS-vtja-ksu5", "poc": false, "poc_url": [], "published_time": "2026-10-12", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-vtja-ksu5", "name": "https://www.oscs1024.com/hd/MPS-vtja-ksu5"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-105407", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-105407"}, {"url": "https://www.3ds.com/trust-center/security/security-advisories/cve-2026-105407", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Tuleap企业版命令注入", "_translated": true, "_saved_at": "2026-10-12T11:34:08+00:00", "_first_saved_at": "2026-10-12T11:34:08+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-vtja-ksu5"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-105410", "cvss": {"cvssv31": [{"source": "3DS.Information-Security@3ds.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:R/S:C/C:H/I:H/A:N", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:R/S:C/C:H/I:H/A:N", "cwe": "CWE-79", "description": "Tuleap Enterprise Edition 是 Dassault Systèmes 提供的商业应用生命周期管理软件，用于需求跟踪、任务协同与软件交付管理。公开资料未确认该企业版漏洞代码位于可访问的 GitHub 仓库。\n受影响版本中，已认证的低权限用户可将脚本内容保存到应用内，其他用户浏览包含该内容的页面时，脚本在其浏览器会话中执行，可造成会话数据泄露或代替受害者操作。官方记录将该问题定性为存储型跨站脚本，但未披露具体入口文件、函数或参数。\n修复版本中通过厂商公告指向的 Enalean 客户门户所提供的修复信息消除该存储型跨站脚本风险，公开公告未给出修复版本号，也未提供可复核的代码变更。", "effects": [{"comp_name": "Tuleap Enterprise Edition", "ecosystem": "linux", "versions": [{"affected_version": "[17.0-1,17.0-41]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[17.5-1,17.5-32]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-10-12", "level": "High", "mps_id": "MPS-jl0a-4prz", "poc": false, "poc_url": [], "published_time": "2026-10-12", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-jl0a-4prz", "name": "https://www.oscs1024.com/hd/MPS-jl0a-4prz"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-105410", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-105410"}, {"url": "https://www.3ds.com/trust-center/security/security-advisories/cve-2026-105410" 要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-105408", "cvss": {"cvssv31": [{"source": "3DS.Information-Security@3ds.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:R/S:C/C:H/I:H/A:N", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:R/S:C/C:H/I:H/A:N", "cwe": "CWE-79", "description": "Tuleap Enterprise Edition 是 Dassault Systèmes 维护的企业级软件研发协作平台，用于项目、制品与文档管理。本次记录只覆盖企业版，分析时未确认可公开核验的源码仓库。\n受影响版本中，应用在生成页面时未正确中和已存储的用户输入。具备低权限的攻击者写入脚本后，其他用户浏览对应页面时会在自身浏览器会话中执行该脚本；官方评分为机密性与完整性高影响、可用性无影响。CNA 仅将 17.0-1 至 17.0-41 与 17.5-1 至 17.5-32 标为受影响，未列出的版本默认不受影响。公开材料未给出入口文件、函数或污点参数。\n修复版本中通过安装 Dassault Systèmes 发布的企业版安全更新，使部署脱离上述受影响构建，切断已存储脚本在用户浏览器会话中执行的路径。公开公告未披露具体输出编码改动、修复函数或具名修复版本。", "effects": [{"comp_name": "tuleap", "ecosystem": "linux", "versions": [{"affected_version": "[17.0-1,17.0-41]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[17.5-1,17.5-32]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-10-12", "level": "High", "mps_id": "MPS-p2ot-abm4", "poc": false, "poc_url": [], "published_time": "2026-10-12", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-p2ot-abm4", "name": "https://www.oscs1024.com/hd/MPS-p2ot-abm4"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-105408", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-105408"}, {"url": "https://www.3ds.com/trust-center/security/security-advisories/cve-2026-105408", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Tuleap企业版存储型XSS", "_translated": true, "_saved_at": "2026-10-12T11:34:04+00:00", "_first_saved_at": "2026-10-12T11:34:04+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-p2ot-abm4"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-103903", "cvss": {"cvssv31": [{"source": "a6d3dc9e-0591-4a13-bce7-0f5b31ff6158", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}], "cvssv4": [{"source": "a6d3dc9e-0591-4a13-bce7-0f5b31ff6158", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-863", "description": "MikroTik RouterOS 是闭源网络操作系统，用于路由、交换、防火墙和设备管理；WinBox 是其图形化管理通道，默认通过 TCP 8291 使用 EC-SRP 完成登录认证。\n受影响版本中，WinBox 认证流程没有把第一阶段已经验证的账户与第二阶段用于安装会话授权策略的用户名绑定为同一主体。第一阶段 EC-SRP 挑战和证明按攻击者持有的低权限账户校验，第二阶段单独提交的用户名则被用来安装目标账户的授权策略。远程攻击者只要持有允许使用 WinBox 的低权限账户凭据，即可指定已存在的高权限账户（例如 admin），在不知道目标口令的情况下取得完整管理会话，并借该会话提升自己账户的权限。\n修复版本中通过升级到 RouterOS 7.24.5 stable、7.25rc1 testing 或包含该修复的后续版本，拒绝第一阶段身份与第二阶段用户名不一致的认证请求，使低权限账户不能再安装其他账户的授权策略。公开资料未披露具体源码修改。", "effects": [{"comp_name": "routeros", "ecosystem": "linux", "versions": [{"affected_version": "[7.0.0,7.24.5)", "min_fixed_version": "7.24.5", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-10-12", "level": "High", "mps_id": "MPS-p502-c34u", "poc": false, "poc_url": [], "published_time": "2026-10-12", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-p502-c34u", "name": "https://www.oscs1024.com/hd/MPS-p502-c34u"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-103903", "name": "https://nvd.nist.gov/vuln/de  "不允许的输入的不完整列表", "last_modified_time": "2026-10-12", "level": "High", "mps_id": "MPS-ugma-i5eh", "poc": false, "poc_url": [], "published_time": "2026-10-12", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ugma-i5eh", "name": "https://www.oscs1024.com/hd/MPS-ugma-i5eh"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-108976", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-108976"}, {"url": "https://ftp.gnu.org/gnu/tramp/tramp-2.8.2.tar.gz", "name": ""}, {"url": "https://www.openwall.com/lists/oss-security/2026/10/11/1", "name": ""}, {"url": "https://www.openwall.com/lists/oss-security/2026/08/21/1", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "TRAMP文件名命令注入", "_translated": true, "_saved_at": "2026-10-11T23:22:26+00:00", "_first_saved_at": "2026-10-11T23:22:26+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ugma-i5eh"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "cnvd_id": "", "cve_id": "CVE-2026-19935", "cvss": {"cvssv31": [{"source": "vulnerabilities@zephyrproject.org", "vector": "CVSS:3.1/AV:A/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:A/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-416", "description": "Zephyr 是开源实时操作系统，Bluetooth LE Host 提供低功耗蓝牙主机协议栈，并处理 L2CAP 面向连接信道（CoC）。\n受影响版本中，动态 PSM（0x0080-0x00FF）的 L2CAP CoC 在收到数据 K 帧时，l2cap_chan_recv_queue() 将嵌入信道对象的 le_chan-\u003erx_work 通过 k_work_submit() 提交到系统工作队列，回调为 l2cap_rx_process()；l2cap_chan_destroy() 仅取消 rtx_work 并排空 rx_queue，未取消 rx_work。远端未认证对端在已建立的 CoC 上发送数据 K 帧后立即发送 L2CAP Disconnect Request 时，默认 Bluetooth RX 工作队列优先级高于系统工作队列，le_disconn_req() 会先经 l2cap_chan_del() 执行 l2cap_chan_destroy() 并调用 released()。应用按接口约定释放或复用该信道对象后，系统工作队列仍持有它；随后对已释放或已复用内存中的链表节点和 handler 解引用，或在 l2cap_chan_add() 里对仍在队列中的工作项执行 k_work_init()，形成释放后使用并破坏工作队列。\n修复版本中通过把 l2cap_chan_recv_queue() 的提交改为 bt_work_submit()，使 RX 工作项与拆除路径运行在同一 Bluetooth 工作队列，并在 l2cap_chan_destroy() 中执行 k_work_cancel(\u0026le_chan-\u003erx_work)，使 released() 返回后不再残留指向信道对象的待处理工作项。", "effects": [{"comp_name": "zephyr", "ecosystem": "linux", "versions": [{"affected_version": "[2.0.0,4.4.2]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "UAF", "kind_en": "免费后使用", "last_modified_time": "2026-10-12", "level": "High", "mps_id": "MPS-6194-thsx", "poc": false, "poc_url": [], "published_time": "2026-10-12", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-6194-thsx", "name": "https://www.oscs1024.com/hd/MPS-6194-thsx"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-19935", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-19935"}, {"url": "https://github.com/zephyrproject-rtos/zephyr/commit/22896cb8d6f23feffe4b637119fb3e974ac3bed8", "name": "Fix commit"}, {"url": "https://github.com/zephyrproject-rtos/zephyr/security/advisories/GHSA-6gp4-cwf7-2vp8", "name": "GHSA-6gp4-cwf7-2vp8"}], "scope_influence": "", "tags": ["应用软件"], "title": "蓝牙L2CAP释放后使用", "_translated": true, "_saved_at": "2026-10-11T19:51:08+00:00", "_first_saved_at": "2026-10-11T19:51:08+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-6194-thsx"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-108982", "cvss": {"cvssv4": [{"source": "cve@mitre.org", "vector": "CVSS:4.0/AV:L/AC:L/AT:P/PR:L/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:4.0/AV:L/AC:L/AT:P/PR:L/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-459", "description": "VeraCrypt 是 IDRIX 维护的开源磁盘加密软件，用于创建、挂载和卸载加密卷，macOS 上同时提供 macFUSE 构建与 FUSE-T 构建。\n受影响版本中，1.26.29 的 FUSE-T 构建在 CoreMacOSX::DismountVolume 对辅助挂载点执行 umount 并删除该挂载点后即结束卸载流程，没有终止仍停留在 fuse_main 中的辅助 FUSE 服务以及 FUSE-T 的 go-nfsv4 进程。VeraCrypt 报告卷已卸载后，残留进程继续通过回环 SMB 会话提供已解密的 /volume.dmg，并保持到底层原始设备的打开句柄，本地用户或进程无需口令即可再次访问明文数据。macFUSE 构建不受此问题影响。\n修复版本中通过在卸载路径调用 FuseService::RequestDismount，读取并回写辅助文件系统 /shutdown 中的进程号、序列号和槽位以确认目标服务后请求其退出，再由 FuseService::WaitForDismount 等到对应进程结束后才删除挂载点，从而撤销对已解密卷的继续访问。该修复已合入上游 master，截至 2026-10-11 尚无包含该修复的正式发布版本。", "effects": [{"comp_name": "veracrypt", "ecosystem": "linux", "versions": [{"affected_version": "[1.26.29,1.26.29]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "清理环节不完整", "kind_en": "清理不彻底", "last_modified_time": "2026-10-12", "level": "High", "mps_id": "MPS-z14x-fd0u", "poc": false, "poc_url": [], "published_time": "2026-10-12", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-z14x-fd0u", "name": "https://www.oscs1024.com/hd/MPS-z14x-fd0u"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-108982", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-108982"}, {"url": "https://github.com/veracrypt/VeraCrypt/issues/1779", "name": "Original public report (June 2026) with maintainer acknowledgment and diagnosis"}, {"url": "https://sourceforge.net/p/veracrypt/discussion/general/thread/57f938df8b/", "name": "Independent report with first process-level diagnosis and maintainer reply (June 2026)"}, {"url": "https://github.com/veracrypt/VeraCrypt/issues/1845", "name": "Consolidated issue: reproductions, lsof evidence, kernel panic analysis, status"}, {"url": "https://github.com/veracrypt/VeraCrypt/pull/1866", "name": "Community fix: terminate auxiliary FUSE-T service on dismount"}, {"url": "https://github.com/veracrypt/VeraCrypt/releases/tag/VeraCrypt_1.26.29", "name": "Affected release 1.26.29"}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "VeraCrypt卸载残留访问", "_translated": true, "_saved_at": "2026-10-12T03:49:12+00:00", "_first_saved_at": "2026-10-12T03:49:12+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-z14x-fd0u"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-108985", "cvss": {"cvssv31": [{"source": "cve@mitre.org", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:N/I:L/A:H", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:N/I:L/A:H", "cwe": "CWE-787", "description": "libnfs 是开源 C 语言 NFS 客户端库，用于在用户态访问远程 NFS 共享，其 ZDR 模块负责对 RPC 与 NFS 报文中的字节、字符串和数组字段编解码。\n受影响版本中，lib/libnfs-zdr.c 的 libnfs_zdr_bytes()、libnfs_zdr_string() 与 libnfs_zdr_array() 接收调用方传入的 maxsize，但解码时不按该上界约束报文长度。libnfs_zdr_bytes() 在 ZDR_DECODE 且 *bufp 非空时按报文中的 *size 执行 memcpy()，可写穿调用方按 maxsize 准备的缓冲区；生成解码器传入的 NFS4_FHSIZE 与 NFS4_OPAQUE_LIMIT 也同样未被执行。\n修复版本中通过在拷贝或分配前调用 libnfs_zdr_size_ok()，将正数 maxsize 作为硬上界并在长度超出时失败返回，阻止按报文长度写穿调用方缓冲区。", "effects": [{"comp_name": "libnfs", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,8.0.0]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-10-12", "level": "High", "mps_id": "MPS-eqa2-s4ok", "poc": false, "poc_url": [], "published_time": "2026-10-12", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-eqa2-s4ok", "name": "https://www.oscs1024.com/hd/MPS-eqa2-s4ok"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-108985", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-108985"}, {"url": "https://github.com/sahlberg/libnfs/commit/7613236464317bee2d9636f087f995148de4db27", "name": ""}], "scope_influence": "", "tags": [], "title": "libnfs ZDR越界写入", "_translated": true, "_saved_at": "2026-10-12T03:49:13+00:00", "_first_saved_at": "2026-10-12T03:49:13+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-eqa2-s4ok"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-105412", "cvss": {"cvssv31": [{"source": "3DS.Information-Security@3ds.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:L", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:L", "cwe": "CWE-89", "description": "Tuleap Enterprise Edition 是 Dassault Systèmes 发行的商业应用生命周期管理平台，用于项目协作、需求跟踪与软件交付，本次受影响对象是企业版产品发行包，公开材料未将其对应到可独立引用的开源库坐标。\n受影响版本中，官方确认产品存在 SQL 注入，具备低权限的已认证攻击者可经网络直接读取 Tuleap 数据库；公开公告未给出注入入口、参数或 SQL 语句构造位置。\n修复版本中通过厂商发布在 Enalean 客户文档门户中的修复说明处理该读取风险，公开公告与 CVE 记录均未写明修复版本号，也未提供可复核的代码变更。", "effects": [{"comp_name": "tuleap_enterprise_edition", "ecosystem": "linux", "versions": [{"affected_version": "[17.5-1,17.5-35]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-10-12", "level": "High", "mps_id": "MPS-iw7n-tlvb", "poc": false, "poc_url": [], "published_time": "2026-10-12", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-iw7n-tlvb", "name": "https://www.oscs1024.com/hd/MPS-iw7n-tlvb"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-105412", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-105412"}, {"url": "https://www.3ds.com/trust-center/security/security-advisories/cve-2026-105412", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Tuleap企业版SQL注入", "_translated": true, "_saved_at": "2026-10-12T11:34:00+00:00", "_first_saved_at": "2026-10-12T11:34:00+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-iw7n-tlvb"}, {"analysis_status": 0, "articles": [{"content": "跨界内存读是指应用程序在读取内存时，未正确验证或限制读取的内存范围。攻击者利用这种漏洞可以读取应用程序内存中的敏感数据，如密码、加密密钥、会话令牌等。常见的原因是由于缓冲区溢出、格式化字符串漏洞或其他内存错误导致的。", "title": "什么是越界读取"}, {"content": "攻击者可以通过不当构造的输入来触发跨界内存读漏洞。攻击者可能会通过向应用程序发送特定的输入，使其读取超过预期的内存区域。攻击者可以利用这个漏洞来获取敏感信息，如其他用户的数据、操作系统的敏感数据或应用程序的内部状态。", "title": "越界读取常见的攻击方式"}, {"content": "- 输入验证和限制：应用程序应对所有输入数据进行严格的验证和限制。确保输入数据的长度、格式和内容符合预期，避免超出缓冲区或访问非预期的内存区域。\n- 内存安全编程实践：开发人员应使用安全的编程实践，如避免使用不安全的函数、正确处理内存分配和释放操作，以及遵循最小特权原则。\n- 使用安全的编程语言和库：选择使用安全性较高的编程语言和库，这些语言和库在内存管理和安全性方面提供了更多的保护机制。\n- 定期进行代码审查和安全测试：定期审查应用程序的代码，并进行安全测试，以发现潜在的跨界内存读漏洞。使用静态代码分析工具和漏洞扫描工具来辅助检测和修复问题。\n- 实施防御性编程技术：应用程序应采用防御性编程技术，如使用随机化地址空间布局（ASLR）、堆栈保护机制（如堆栈溢出保护）和数据执行预防（DEP）等。\n- 及时更新和修补：及时应用程序和操作系统的安全更新和补丁，以确保已知的跨界内存读漏洞得到修复。及时更新相关软件和库，以避免使用已知存在漏洞的版本。", "title": "如何预防越界读取"}], "cnvd_id": "", "cve_id": "CVE-2026-19577", "cvss": {"cvssv31": [{"source": "vulnerabilities@zephyrproject.org", "vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:H", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:H", "cwe": "CWE-125", "description": "Zephyr 是开源实时操作系统，网络子系统负责 IPv6 收包、邻居发现和路由转发。\n受影响版本中，net_route_ipv6_packet() 在下一跳邻居尚未绑定链路层地址时，仍将 nbr-\u003eidx 传给 net_nbr_get_lladdr()。未解析邻居的 idx 为 NET_NBR_LLADDR_UNKNOWN（0xff），而 net_nbr_get_lladdr() 除 NET_ASSERT 外没有运行时边界检查，会返回 net_neighbor_lladdr 数组末尾之后的地址；该指针不为 NULL，后续空指针判断无法拦截。同一链路上的未认证攻击者可先使邻居缓存停留在未解析状态，再发送目的地址不属于本接口的 IPv6 单播报文，报文经 net_recv_data() 进入 net_ipv6_input() 和 ipv6_route_packet() 后触发固定偏移越界读。启用 CONFIG_ASSERT 时断言失败并导致设备崩溃，未启用时最多 8 字节无关静态内存会被复制到发出帧的目的链路层地址。\n修复版本中通过在 net_route_ipv6_packet() 调用 net_nbr_get_lladdr() 之前检查 nbr-\u003eidx 是否为 NET_NBR_LLADDR_UNKNOWN，未知时直接返回 -ESRCH，切断对未绑定链路层地址邻居的越界读取。", "effects": [{"comp_name": "zephyr", "ecosystem": "linux", "versions": [{"affected_version": "[1.8.0,4.4.2]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界读取", "kind_en": "越界读取", "last_modified_time": "2026-10-12", "level": "High", "mps_id": "MPS-xipq-ayo7", "poc": false, "poc_url": [], "published_time": "2026-10-12", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-xipq-ayo7", "name": "https://www.oscs1024.com/hd/MPS-xipq-ayo7"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-19577", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-19577"}, {"url": "https://github.com/zephyrproject-rtos/zephyr/commit/b0b0e8973d1967114adbb9ed1611d448b5a46519", "name": "Fix commit"}, {"url": "https://github.com/zephyrproject-rtos/zephyr/security/advisories/GHSA-vv76-4m89-95q5", "name": "GHSA-vv76-4m89-95q5"}], "scope_influence": "", "tags": ["应用软件"], "title": "Zephyr IPv6越界读", "_translated": true, "_saved_at": "2026-10-11T19:51:10+00:00", "_first_saved_at": "2026-10-11T19:51:10+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-xipq-ayo7"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-13138", "cvss": {"cvssv31": [{"source": "iletisim@usom.gov.tr", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:H/A:L", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:H/A:L", "cwe": "CWE-602", "description": "Biletiva Ticketing Platform 是 Divasoft Software and E-Commerce Inc.（Divasoft Yazılım ve Elektronik Ticaret A.Ş.）提供的商业票务平台，用于在线查询和销售电影及活动门票。官方漏洞记录未指向公开源码仓库。\n受影响版本中，平台存在客户端实施服务端安全控制的问题，远程攻击者无需权限且无需用户交互即可操纵应用状态。官方将其归类为 CWE-602，攻击模式为 CAPEC-74，完整性影响为高，机密性与可用性影响为低。公开材料未给出具体接口、参数或源码位置。\n修复版本中通过安装厂商发布的日期版本更新替换受影响构建。土耳其国家网络安全机构建议至少升级到 2026-07-23 当日及之后的版本，但 CVE 记录将截至该日（含）标为受影响，两份材料对这一天是否仍受影响的表述不一致，上线前需向厂商确认实际修复构建。公开材料未披露代码修改。", "effects": [{"comp_name": "Biletiva Ticketing Platform", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2026-07-23]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "服务端安全的客户端实施", "kind_en": "服务器端安全的客户端实施", "last_modified_time": "2026-10-13", "level": "High", "mps_id": "MPS-39un-ek2c", "poc": false, "poc_url": [], "published_time": "2026-10-13", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-39un-ek2c", "name": "https://www.oscs1024.com/hd/MPS-39un-ek2c"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-13138", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-13138"}, {"url": "https://siberguvenlik.gov.tr/guvenlik-bildirimleri/detay/tr-26-1309", "name": ""}], "scope_influence": "", "tags": [], "title": "Biletiva客户端校验绕过", "_translated": true, "_saved_at": "2026-10-13T09:58:46+00:00", "_first_saved_at": "2026-10-13T09:58:46+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-39un-ek2c"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-93886", "cvss": {"cvssv31": [{"source": "psirt@us.ibm.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:R/S:C/C:H/I:H/A:L", "severity": "high", "base_score": 8.3}]}, "cvss_score": 8.3, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:R/S:C/C:H/I:H/A:L", "cwe": "CWE-79", "description": "IBM i 是 IBM 提供的闭源商用操作系统。HTTP Server Administration GUI 是其中用于管理 HTTP 服务器的图形界面，归属许可程序 5770-SS1。\n受影响版本中，该图形界面在生成网页时未充分中和用户提供的输入，远程已认证且具备高权限的攻击者可使该输入在页面中作为任意脚本执行。IBM 将其归类为 CWE-79，CVSS 要求高权限与用户交互。公开公告未披露源码文件或函数。\n修复版本中通过安装 IBM 为 5770-SS1 发布的程序临时修订（PTF）消除该输入校验缺陷。IBM i 7.6 安装 SJ11645，7.5 安装 SJ11644，7.4 安装 SJ11643，7.3 安装 SJ11641。公开材料未给出源码级修改，公告也未提供临时绕过措施。", "effects": [{"comp_name": "i", "ecosystem": "linux", "versions": [{"affected_version": "[7.4,7.4]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[7.3,7.3]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[7.5,7.5]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[7.6,7.6]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-10-13", "level": "High", "mps_id": "MPS-1b8z-2a5p", "po
