", "name": "core/user/service_v2.go at 0485310"}, {"url": "https://github.com/crawlab-team/crawlab-core/blob/main/user/service.go", "name": "crawlab-core user/service.go, the module vendored at v0.6.3"}, {"url": "https://www.vulncheck.com/advisories/crawlab-through-0.6.3-authentication-bypass-via-hard-coded-jwt-secret", "name": "VulnCheck Advisory: Crawlab through 0.6.3 Authentication Bypass via Hard-coded JWT Secret"}], "scope_influence": "", "tags": ["go"], "title": "Crawlab硬编码JWT密钥", "_translated": true, "_saved_at": "2026-09-15T00:09:13+00:00", "_first_saved_at": "2026-09-14T21:18:35+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-6w2s-cbd4"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-90943", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:R/S:C/C:H/I:H/A:N", "severity": "high", "base_score": 8.7}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:P/VC:H/VI:H/VA:N/SC:H/SI:H/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:P/VC:H/VI:H/VA:N/SC:H/SI:H/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-79", "description": "parallax/filament-comments 是开源 Composer 组件，用于在 Laravel Filament 管理面板中为 Eloquent 模型添加评论能力。\n受影响版本中，已认证面板用户可通过 Livewire CommentsComponent 的 create 方法提交 comment 字段，组件将其原样写入数据库；comments.blade.php 使用 Str::of($comment-\u003ecomment)-\u003etoHtmlString()（markdown 配置下先调用 markdown()）把正文变为 Htmlable，Blade 双花括号输出时不再转义，其他用户（含管理员）查看评论时会执行其中的脚本，进而导致会话令牌被窃取以及未授权操作。\n修复版本中通过在评论渲染前增加 HTML 净化切断脚本执行链。公开研究建议使用 Symfony HTML Sanitizer 白名单过滤事件处理器与危险 URI；截至 2026-09-14，官方 GitHub 仓库与 Packagist 均未发布含该修复的版本，3.0.0 及更早版本仍直接调用 toHtmlString() 输出。", "effects": [{"comp_name": "parallax/filament-comments", "ecosystem": "composer", "versions": [{"affected_version": "(-∞,3.0.0]", "min_fixed_version": "", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-09-15", "level": "Critical", "mps_id": "MPS-bfw1-myev", "poc": false, "poc_url": [], "published_time": "2026-09-15", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-bfw1-myev", "name": "https://www.oscs1024.com/hd/MPS-bfw1-myev"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-90943", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-90943"}, {"url": "https://hackindex.io/research/stored-xss-filament-comments-unescaped-rendering", "name": "HackIndex: Stored XSS in parallax/filament-comments through unescaped comment rendering"}, {"url": "https://github.com/parallax/filament-comments/blob/3.0.0/resources/views/comments.blade.php", "name": ""}, {"url": "https://github.com/parallax/filament-comments/blob/3.0.0/src/Policies/FilamentCommentPolicy.php", "name": ""}, {"url": "https://packagist.org/packages/parallax/filament-comments", "name": ""}, {"url": "https://www.vulncheck.com/advisories/parallax-filament-comments-through-3.0.0-stored-xss-via-comment-body", "name": "VulnCheck Advisory: parallax filament-comments through 3.0.0 Stored XSS via Comment Body"}], "scope_influence": "", "tags": ["php", "开源"], "title": "filament-comments存储型XSS", "_translated": true, "_saved_at": "2026-09-14T17:25:50+00:00", "_first_saved_at": "2026-09-14T17:25:50+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-bfw1-myev"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- st.gov/vuln/detail/CVE-2026-90942", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-90942"}, {"url": "https://github.com/geo-chen/oss/blob/main/casdoor.md#finding-3-organization-admin-can-read-the-global-built-in-jwt-signing-private-key-via-apiget-certs-and-apiget-cert-incomplete-fix-of-3003--enables-cross-organization-token-forgery", "name": "Researcher write-up, Finding 3"}, {"url": "https://github.com/casdoor/casdoor/blob/v4.4.0/controllers/cert.go", "name": "controllers/cert.go at v4.4.0"}, {"url": "https://github.com/casdoor/casdoor/blob/v4.4.0/object/cert.go", "name": "object/cert.go at v4.4.0"}, {"url": "https://github.com/casdoor/casdoor", "name": ""}, {"url": "https://www.vulncheck.com/advisories/casdoor-through-4.4.0-private-key-exposure-via-certificate-endpoints", "name": "VulnCheck Advisory: Casdoor through 4.4.0 Private Key Exposure via Certificate Endpoints"}], "scope_influence": "", "tags": ["go"], "title": "Casdoor证书私钥泄露", "_translated": true, "_saved_at": "2026-09-15T00:09:14+00:00", "_first_saved_at": "2026-09-14T21:18:39+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-y7rd-06uv"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过向受信任的数据序列化过程中添加恶意数据，从而在序列化和反序列化过程中执行恶意代码的攻击漏洞。这种漏洞通常存在于使用序列化 (serialization) 机制存储和传输数据的程序中。\n", "title": "什么是反序列化"}, {"content": "- 注入攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码注入到程序中，从而实现代码执行的目的。\n- 反射攻击：攻击者使用反射机制，在序列化过程中动态生成恶意数据，并将恶意代码注入到程序中，从而实现代码执行的目的。\n- 缓冲区溢出攻击：攻击者通过在序列化过程中向缓冲区输入恶意数据，导致缓冲区溢出，从而破坏程序的内存管理，实现代码执行的目的。\n- 格式字符串攻击：攻击者通过在序列化过程中输入恶意数据，导致程序使用错误的格式字符串，从而实现代码执行的目的。\n- 数据流攻击：攻击者通过在序列化过程中注入恶意数据，将恶意代码作为一个数据流传递给程序，从而实现代码执行的目的。\n", "title": "反序列化常见的攻击方式"}, {"content": "- 不信任输入数据：程序应该严格检查输入数据的有效性，并避免使用不受信任的数据。\n- 使用安全的序列化机制：程序应该使用安全的序列化机制，如 JSON 或 XML 序列化，而不是第三方序列化库。\n- 最小特权原则：程序应该限制对受信任数据的处理权限，并避免在运行时修改数据。\n- 代码审查和漏洞扫描：程序应该进行代码审查和漏洞扫描，以发现和修复潜在的安全漏洞。\n", "title": "如何预防反序列化"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-62263", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.2}]}, "cvss_score": 9.2, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-502", "description": "OpenAM WebAuthn 认证模块的 ObjectInputFilter 仅依据 stream depth 是否大于 1 无条件放行所有非根对象而未校验实际类名，导致以 AuthenticatorImpl 为根、内嵌任意 gadget 链的反序列化流可在用户登录认证阶段触发任意代码执行，构成远程代码执行漏洞。\n受影响版本中，org.openidentityplatform.openam:openam-auth-webauthn 的 16.1.1 及以下版本中，WebAuthnAuthentication.deserialize 在调用 ObjectInputStream 反序列化外部可控的 authBytes 字节流之前注册的 setObjectInputFilter 回调，会先判断 filterInfo.depth() 是否大于 1，若是则无条件返回 ObjectInputFilter.Status.ALLOWED，再依据 filterInfo.serialClass().getName() 与 ALLOWED_AUTHENTICATOR_CLASSES 进行白名单匹配；由于 Java 反序列化过滤器会为对象图中的每一个类调用一次回调，而 depth==1 只在根对象的实际类解析时出现，因此白名单只能约束根对象的最终类型，AuthenticatorImpl 字段内任意嵌套的 gadget 类（包括不在 webauthn4j 包内、未列入任何白名单的应用或第三方类）在 readObject/readResolve 阶段会被无条件实例化并执行任意代码，攻击者通过 WebAuthn 登录请求中可控的 userHandle 输入即可触发，构成远程代码执行。\n修复版本中通过 16.1.2 中发布的提交 9dd0fbe07f70f118cf45042d3a9ffb32f3c21e08，WebAuthnAuthentication.deserialize 的过滤器回调移除了「depth \u003e 1 直接放行」的早退分支，改为对每一层 depth 都按 serialClass 的实际类名进行校验：先对数组类型递归取其组件类型，对 primitive 类型直接放行，再将类名与新增的 WEBAUTHN4J_PACKAGE_PREFIX（com.webauthn4j. 前缀）及 ALLOWED_JDK_CLASSES（涵盖 java.lang.Number/String/Enum、UUID、BigInteger、java.util.* 容器类及其不可变/单例视图）匹配，命中则放行，未命中则返回 REJECTED，同时仅在 depth==1 时强制根类必须为 AuthenticatorImpl；上述改动对对象图每一节点都强制走类名校验，覆盖了原过滤器只校验根类名的拦截缺陷，切断 gadget 链通过用户可控反序列化输入进入应用代码的路径。", "effects": [{"comp_name": "org.openidentityplatform.openam:openam-auth-webauthn", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,16.1.2)", "min_fixed_version": "16.1.2", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "反序列化", "kind_en": "不可信数据的反序列化", "last_modified_time": "2026-09-15", "level": "Critical", "mps_id": "MPS-30sz-phln", "poc": false, "poc_url": [], "published_time": "2026-09-15", "reference_url_list": [{"url": "https://github.com/OpenIdentityPlatform/OpenAM/security/advisories/GHSA-gf8h-gq53-288j", "name": ""}, {"url": "https://github.com/OpenIdentityPlatform/OpenAM/commit/9dd0fbe07f70f118cf45042d3a9ffb32f3c21e08", "name": ""}, {"url": "https://github.com/OpenIdentityPlatform/OpenAM/releases/tag/16.1.2", "name": ""}, {"url": "https://github.com/advisories/GHSA-gf8h-gq53-288j", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "OpenAM WebAuthn Java 反序列化远程代码执行漏洞", "_translated": true, "_saved_at": "2026-09-15T10:51:23+00:00", "_first_saved_at": "2026-09-15T10:51:23+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-30sz-phln"}, {"analysis_status": 0, "articles": [], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-48717", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:H/AT:P/PR:N/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.1}]}, "cvss_score": 9.1, "cvss_vector": "CVSS:4.0/AV:N/AC:H/AT:P/PR:N/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-285", "description": "OpenAM 是开源身份管理与 OAuth2/OIDC 实现，其 OAuth2 模块在授权码兑换环节处理 PKCE 验证时存在逻辑缺陷。\n受影响版本中，当 OAuth2 Provider 的 codeVerifierEnforced 配置关闭（默认为 false）时，AuthorizationCodeGrantTypeHandler.handle() 方法仅在请求附带 code_verifier 参数时才校验 PKCE；若攻击者省略该参数，授权码关联的 code_challenge 完全不被验证，形成 PKCE 绕过。攻击者拦截授权码后可跳过 code_verifier 直接兑换令牌，对使用默认配置的公开客户端部署可直接劫持用户会话。\n修复版本中通过在 AuthorizationCodeGrantTypeHandle  "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-90783"}, {"url": "https://codeberg.org/mbunkus/mkvtoolnix/commit/1495126138e086080f0163bee27fafbdf956a1d0", "name": "Patch Commit"}, {"url": "https://codeberg.org/mbunkus/mkvtoolnix/src/tag/release-101.0/lib/avilib-0.6.10/avilib.c#L2552-L2570", "name": "Unchecked video superindex allocation in avi_parse_input_file() at release-101.0"}, {"url": "https://codeberg.org/mbunkus/mkvtoolnix", "name": ""}, {"url": "https://www.vulncheck.com/advisories/mkvtoolnix-through-101.0-heap-buffer-overflow-via-avilib-odml-superindex-integer-wraparound", "name": "VulnCheck Advisory: MKVToolNix through 101.0 Heap Buffer Overflow via avilib ODML Superindex Integer Wraparound"}], "scope_influence": "", "tags": ["应用软件"], "title": "MKVToolNix堆溢出漏洞", "_translated": true, "_saved_at": "2026-09-13T14:47:03+00:00", "_first_saved_at": "2026-09-13T14:47:03+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-fysa-k683"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2025-43936", "cvss": {}, "cvss_score": 8.1, "cvss_vector": "", "cwe": "CWE-287", "description": "Dell ObjectScale 是戴尔面向企业的商业对象存储软件，用于提供可扩展对象存储与云原生存储服务，并非开源项目。\n受影响版本中，认证实现存在缺陷，未认证远程攻击者可在无需用户交互的条件下获得未授权访问，并同时影响机密性、完整性与可用性；厂商将其归类为 Improper Authentication，攻击复杂度为高。\n修复版本中通过官方安全更新收紧认证处理，阻断未认证远程访问路径；公开资料未披露具体源码修改，建议升级至 ObjectScale 4.4.0.0 及以上版本。", "effects": [{"comp_name": "objectscale", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,4.4.0.0)", "min_fixed_version": "4.4.0.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "身份验证不当", "kind_en": "认证不当", "last_modified_time": "2026-09-13", "level": "High", "mps_id": "MPS-9a6f-bd3f", "poc": false, "poc_url": [], "published_time": "2026-09-13", "reference_url_list": [{"url": "https://cybersecuritynews.com/dell-objectscale-vulnerabilities/", "name": ""}, {"url": "https://www.dell.com/support/kbdoc/en-us/000505935/dsa-2026-393-security-update-for-dell-objectscale-multiple-vulnerabilities", "name": ""}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2025-43936", "name": ""}, {"url": "https://dl.dell.com/content/manual40091046-dell-objectscale-4-4-0-0-security-configuration-guide.pdf", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "ObjectScale认证不当漏洞", "_translated": true, "_saved_at": "2026-09-13T17:50:34+00:00", "_first_saved_at": "2026-09-13T17:50:34+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-9a6f-bd3f"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-90651", "cvss": {"cvssv31": [{"source": "cve@mitre.org", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:C/C:L/I:H/A:L", "severity": "high", "base_score": 8.1}]}, "cvss_score": 8.1, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:C/C:L/I:H/A:L", "cwe": "CWE-295", "description": "2.0.0之前的注册表模式下的套接字防火墙（socketdev/socket-registry-firewall）默认不验证上游TLS证书。当socket.yml中省略了api_ssl_verify和upstream_ssl_verify配置键时，生成的配置设置SOCKET_API_SSL_VERIFY='false'和UPSTREAM_SSL_VERIFY='false'，并且用于出站请求的OpenResty/Lua HTTP客户端接受任何证书，包括自签名和其他不受信任的证书，而不验证链。拦截 Socket Firewall 和 Socket API 或上游包注册表之间流量的攻击者可以提供精心设计的证书并修改传输中的响应，包括替换恶意包内容或更改防火墙强制执行的允许/阻止决策。设置 api_ssl_verify: true 和upstream_ssl_verify: true 启用验证；但是，在1.1.334之前的版本中，生成的nginx配置不会发出lua_ssl_trusted_certificate，因此如果不手动修补生成的配置，则无法成功使用验证。版本 2.0.0 将这两个设置的默认值更改为 true。", "effects": [{"comp_name": "Socket Firewall", "ecosystem": "linux", "versions": [{"affected_version": "(0,2.0.0)", "min_fixed_version": "2.0.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "证书验证不恰当", "kind_en": "证书验证不当", "last_modified_time": "2026-09-13", "level": "High", "mps_id": "MPS-xoah-mlbe", "poc": false, "poc_url": [], "published_time": "2026-09-13", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-xoah-mlbe", "name": "https://www.oscs1024.com/hd/MPS-xoah-mlbe"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-90651", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-90651"}, {"url": "https://github.com/SocketDev/socket-registry-firewall/releases/tag/v2.0.0", "name": ""}, {"url": "https://docs.socket.dev/docs/registry-mode-configuration-reference", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-90651 漏洞", "_translated": true, "_saved_at": "2026-09-13T05:34:13+00:00", "_first_saved_at": "2026-09-13T00:32:30+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-xoah-mlbe"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-90678", "cvss": {"cvssv31": [{"source": "cve@mitre.org", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:C/C:N/I:H/A:L", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:C/C:N/I:H/A:L", "cwe": "CWE-130", "description": "在 HAProxy 3.3.0 到 3.4.4 以及 3.5-dev1 到 3.5-dev5 中发现了一个问题。利用该漏洞需要 HTTP/3 前端：HAProxy 必须使用 QUIC 支持构建并配置 QUIC 绑定侦听器，并且受影响的流量必须在重用连接上使用分块传输编码通过 HTTP/1.1 到达后端。在这些条件下，当 HTTP/3 请求不携带 Content-Length 标头时，HTTP/3 多路复用器会将 DATA 帧标头中声明的长度记入帧标头解码时、接收到有效负载之前的流端点的已知输入有效负载估计，并且该声明的长度将逐字发出作为 HTTP/1.1 块大小。远程未经身份验证的客户端声明的有效负载多于其传递的负载，然后结束流，导致 HAProxy 宣布一个大于其写入字节的块，并将连接返回到处于不同步状态的空闲池。结果是在重用的后端连接上潜在的 HTTP 请求走私：攻击者可以将请求放置在前端规则之外，例如基于路径的 http 请求拒绝，以便 HAProxy 的 HTTP 分析永远不会发现走私的请求，并且可能导致并发客户端的请求（包括其请求行和授权标头）被用作攻击者的请求正文并丢失。剥削不是确定性的；它取决于后端连接池的竞赛，在测试过程中大多数但不是全部试验都成功，并且可以自由重试。该机制在3.3-dev10中引入； 3.2.x 及更早版本不受影响。", "effects": [{"comp_name": "HAProxy", "ecosystem": "linux", "versions": [{"affected_version": "(3.4.0,3.4.4]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(-∞,3.5]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "(3.3.0,3.3.14]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "长度参数不一致性处理不恰当", "kind_en": "长度参数不一致处理不当", "last_modified_time": "2026-09-13", "level": "High", "mps_id": "MPS-86qp-7i4b", "poc": false, "poc_url": [], "published_time": "2026-09-13", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-86qp-7i4b", "name": "https://www.oscs1024.com/hd/MPS-86qp-7i4b"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-90678", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-90678"}, {"url": "https://github.com/haproxy/haproxy/commit/86a4ebc761a278838e8cb06f3a292282ba704c65", "name": "BUG/MAJOR: h3: reject H3 truncated frames"}, {"url": "http://git.haproxy.org/?p=haproxy.git;a=commit;h=86a4ebc761a278838e8cb06f3a292282ba704c65", "name": ""}, {"url": "https://www.haproxy.org/download/3.5/src/CHANGELOG", "name": "HAProxy 3.5-dev6 ChangeLog"}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2026-90678漏洞", "_translated": true, "_saved_at": "2026-09-13T05:34:06+00:00", "_first_ "https://www.oscs1024.com/hd/MPS-hj86-izu0"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-90648", "cvss": {"cvssv4": [{"source": "cve@mitre.org", "vector": "CVSS:4.0/AV:L/AC:L/AT:P/PR:N/UI:N/VC:N/VI:H/VA:H/SC:N/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:L/AC:L/AT:P/PR:N/UI:N/VC:N/VI:H/VA:H/SC:N/SI:H/SA:H/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-252", "description": "WebAssembly wabt 至 1.0.41 中的 wasm2c 允许在某些主要涉及 32 位平台的情况下进行沙箱逃逸，即“翻桌”攻击。它不会检查 wasm_rt_allocate_funcref_table() (wasm2c/wasm-rt-impl-tableops.inc) 中 calloc() 的返回值。当 funcref 表分配失败时，table-\u003edata 保留为 NULL，而 table-\u003esize 保留 guest 声明的元素计数；因此，边界检查仍然通过，并且表元素访问解析为绝对内存地址 (i * sizeof(wasm_rt_funcref_t))。这使得主机进程内存可以任意读写，并且通过 table.get、table.set 和 call_indirect 可以执行任意代码，从而破坏了 wasm2c 提供的隔离（完整的沙箱逃逸）。 wasm2c 被 RLBox 和 WasmBoxC 用作进程内沙箱边界，包括在 Firefox 中，它通过 wasm2c 编译 Graphite、Hunspell、Ogg、Expat 和 Woff2 库以包含不受信任的字体、媒体和 XML 输入。因此，这些应用程序中的沙箱可能会受到影响。利用该漏洞需要 funcref 表分配失败，例如在地址空间限制 (RLIMIT_AS) 下、在 32 位主机上、vm.overcommit_memory=2 或内存压力下。在默认过量使用的 64 位 Linux 上，分配成功并且不会触发缺陷。 wasm2c 内存分配器在同一运行时的 calloc 失败时中止；表分配器缺乏这种中止行为。这是在提交 ab9e0b55 (PR #813) 中引入的。", "effects": [{"comp_name": "wabt", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.0.41]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "未加检查的返回值", "kind_en": "Unchecked Return Value", "last_modified_time": "2026-09-13", "level": "High", "mps_id": "MPS-igw2-0oex", "poc": false, "poc_url": [], "published_time": "2026-09-13", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-igw2-0oex", "name": "https://www.oscs1024.com/hd/MPS-igw2-0oex"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-90648", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-90648"}, {"url": "https://github.com/trustsig-eu/wasm2c-tableflip", "name": ""}, {"url": "https://github.com/WebAssembly/wabt", "name": ""}, {"url": "https://bugzilla.mozilla.org/show_bug.cgi?id=1827704", "name": ""}, {"url": "https://https://blog.mozilla.org/attack-and-defense/2021/12/06/webassembly-and-back-again-fine-grained-sandboxing-in-firefox-95", "name": ""}, {"url": "https://rlbox.dev", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "CVE-2026-90648漏洞", "_translated": true, "_saved_at": "2026-09-13T00:32:33+00:00", "_first_saved_at": "2026-09-13T00:32:33+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-igw2-0oex"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-85129", "cvss": {"cvssv31": [{"source": "contact@wpscan.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "cwe": "CWE-79", "description": "Hoo Companion 是开源 WordPress 插件，用于为 HooThemes 主题提供 metabox 选项与演示站点导入能力。\n受影响版本中，HooSiter 将 AJAX 动作 hoo-sites-import-customizer-settings 同时注册到已登录与未登录接口，import_customizer_data 未做授权或 nonce 校验，直接把 $_POST['customizer_data'] 解码后交给 Hoo_Customizer_Import::_import_settings，以 update_option 覆盖当前主题设置。未授权攻击者可写入含脚本的主题配置，站点访客与管理员浏览页面时执行，同一请求还会销毁原有主题设置。\n修复版本中通过官方渠道尚未给出可用补丁。WPScan 标明无已知修复，WordPress.org 已关闭该插件目录条目，公开 1.0.2 源码仍将未校验的导入数据直接写入主题设置。", "effects": [{"comp_name": "hoo-companion", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,1.0.2]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-09-14", "level": "High", "mps_id": "MPS-dz4y-ukcw", "poc": false, "poc_url": [], "published_time": "2026-09-14", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-dz4y-ukcw", "name": "https://www.oscs1024.com/hd/MPS-dz4y-ukcw"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-85129", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-85129"}, {"url": "https://wpscan.com/vulnerability/a50f6ec1-4297-453e-b45f-6fd889b6b0d2/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Hoo Companion存储型XSS", "_translated": true, "_saved_at": "2026-09-13T22:46:35+00:00", "_first_saved_at": "2026-09-13T22:46:35+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-dz4y-ukcw"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-90699", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:N/AC:L/Au:S/C:C/I:C/A:C", "severity": "high", "base_score": 9}], "cvssv3": [{"source": "VulDB", "vector": "CVSS:3.0/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H/E:P/RL:X/RC:R", "severity": "critical", "base_score": 9.9}], "cvssv31": [{"source": "cna@vuldb.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.9}], "cvssv4": [{"source": "cna@vuldb.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.6}]}, "cvss_score": 8.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:P/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-78", "description": "D-Link DWR-M920 是友讯网络出品的闭源 4G LTE 无线路由器，用于提供蜂窝上网、Wi-Fi 接入和 Web 管理能力。\n受影响版本中，Web 管理接口 /boafrm/formPinManageSetup 对应处理函数 sub_41E60C 将请求参数 newPin 未经验证拼入 sprintf 格式串 at-cmd 'at+CLCK=\"SC\",1,\"%s\"' \u003e /var/tmpAtRet，随后交给 system() 执行。远程攻击者在通过管理界面认证后提交含单引号逃逸的 newPin，可以在设备上以 root 权限执行任意系统命令。\n修复版本中通过停止将未过滤的 newPin 直接拼入 system() 命令串，并改为对 PIN 码做数字白名单校验，切断命令注入链。截至 2026-09-14，厂商未公布明确修复版本，公开资料未披露已验证的固件补丁。", "effects": [{"comp_name": "dwr-m920", "ecosystem": "linux", "versions": [{"affected_version": "[1.1.7,1.1.7]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-09-14", "level": "High", "mps_id": "MPS-axeo-h29m", "poc": false, "poc_url": [], "published_time": "2026-09-14", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-axeo-h29m", "name": "https://www.oscs1024.com/hd/MPS-axeo-h29m"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-90699", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-90699"}, {"url": "https://vuldb.com/vuln/403232", "name": "VDB-403232 | D-Link DWR-M920 formPinManageSetup sub_41E60C os command injection"}, {"url": "https://vuldb.com/vuln/403232/cti", "name": "VDB-403232 | CTI Indicators (IOB, IOC, TTP, IOA)"}, {"url": "https://vuldb.com/cve/CVE-2026-90699", "name": "CVE-2026-90699 | CVE Analysis and Report"}, {"url": "https://vuldb.com/submit/916259", "name": "Submit #916259 | D-Link Router DWR-M920 B2 V1.1.70 Command Injection"}, {"url": "https://github.com/H3rmesk1t/vulnerability-paper/issues/9", "name": ""}, {"url": "https://www.dlink.com/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "DWR-M920命令注入漏洞", "_translated": true, "_saved_at": "2026-09-14T11:29:44+00:00", "_first_saved_at": "2026-09-14T11:29:44+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-axeo-h29m"}, {"analysis_status": 0, "articles": [{"content": "- 攻击者通过构造恶意的数据，将过多的数据输入到程序的缓冲区中，使得缓冲区的空间被填满，从而溢出到程序的栈 (stack) 或堆 (heap) 中，导致程序崩溃、拒绝服务、数据泄露等安全问题。\n", "title": "什么是经典缓冲区溢出"}, {"content": "| 类型        | 描述                                                         |\n| ----------- | ------------------------------------------------------------ |\n| 代码注入攻击      | 攻击者通过向程序的缓冲区输入恶意代码，从而控制程序执行流程，实现对程序操作的恶意操作。例如，攻击者可以通过向 Web 应用程序的输入框中输入恶意代码，从而执行任意的代码，破坏系统、窃取数据等。 |\n| 数据覆盖攻击      | 攻击者通过向程序的缓冲区输入过多的数据，从而覆盖程序中的重要数据或代码，实现对程序操作的恶意操作。例如，攻击者可以通过向聊天应用程序的输入框中输入过多的表情符号，从而覆盖程序中的重要数据，例如聊天消息、账号密码等。 |\n| 栈溢出攻击 | 攻击者通过向程序的栈中输入过多的数据，从而溢出到栈外部，实现对程序操作的恶意操作。例如，攻击者可以通过向游戏应用程序的输入框中输入过多的道具名称，从而覆盖程序中的重要数据，例如游戏数据、账号密码等。 |\n| 堆溢出攻击       | 攻击者通过向程序的堆中输入过多的数据，从而溢出到堆外部，实现对程序操作的恶意操作。例如，攻击者可以通过向操作系统工具的输入框中输入过多的命令，从而覆盖程序中的重要数据，例如系统文件、配置文件等。 |", "title": "经典缓冲区溢出常见的攻击方式"}, {"content": "- 输入验证：在程序输入处对输入数据进行严格的验证和过滤，确保输入数据符合预期的格式和类型，避免被攻击者注入恶意命令或数据。可以使用正则表达式、格式字符串等方式进行输入验证。\n- 输出过滤：在程序输出处对输出数据进行严格的过滤和检查，确保输出数据符合预期的格式和类型，避免被攻击者截获和篡改。可以使用安全的输出过滤库等方式进行输出过滤。\n- 使用安全的编程模型：使用安全的编程模型，例如避免使用原生的缓冲区管理函数，使用安全的框架和库来处理输入数据和执行命令，避免缓冲区溢出漏洞。\n- 数据库加密和访问控制：对于敏感数据和命令，使用加密和访问控制措施，确保只有授权用户可以访问和执行命令，避免被攻击者窃取和篡改。\n- 定期更新和升级：定期更新和升级应用程序和库的版本，确保应用程序和库的最新版本包含了最新的安全补丁和修复措施，避免安全漏洞的出现和利用。\n- 安全审计和监控：定期对系统和应用程序进行安全审计和监控，及时发现和阻止潜在的安全漏洞和攻击，确保系统和数据的安全和可靠性。", "title": "如何预防经典缓冲区溢出"}], "cnvd_id": "", "cve_id": "CVE-2026-90605", "cvss": {"cvssv2": [{"source": "cna@vuldb.com", "vector": "AV:N/AC:L/Au:S/C:C/I:C/A:C", "severity": "high", "base_score": 9}], "cvssv3": [{"source": "VulDB", "vector": "CVSS:3.0/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H/E:P/RL:X/RC:R", "severity": "critical", "base_score": 9.9}], "cvssv31": [{"source": "cna@vuldb.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H", "severity": "critical", "base_score": 9.9}], "cvssv4": [{"source": "cna@vuldb.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/S erflow"}, {"url": "https://vuldb.com/vuln/403188/cti", "name": "VDB-403188 | CTI Indicators (IOB, IOC, IOA)"}, {"url": "https://vuldb.com/cve/CVE-2026-90606", "name": "CVE-2026-90606 | CVE Analysis and Report"}, {"url": "https://vuldb.com/submit/914010", "name": "Submit #914010 | totolink A3002MU Hh-B20211125.1046 Buffer Overflow"}, {"url": "https://github.com/SunnyYANGyaya/cuicuishark-sheep-fishIOT/blob/main/ToTolink/A3002MU/bof-formIpv6Setup.md", "name": ""}, {"url": "https://www.totolink.net/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "A3002MU缓冲区溢出", "_translated": true, "_saved_at": "2026-09-14T00:35:47+00:00", "_first_saved_at": "2026-09-14T00:35:47+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-tsod-2m53"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-90895", "cvss": {"cvssv4": [{"source": "5a6e4751-2f3f-4070-9419-94fb35b644e8", "vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.4}]}, "cvss_score": 8.4, "cvss_vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-862", "description": "MISP 是开源威胁情报共享平台，交互式 CLI Shell 通过 CakePHP 命令 app/Console/cake CLI 在终端浏览和管理 MISP 数据。\n受影响版本中，CLIShell 独立实现访问控制，未复用 Web 应用的模型访问器。非宿主组织且非站点管理员用户执行 list feed 时不会附加 lookup_visible 过滤；view feed 未按 FeedsController::view() 校验宿主组织或站点管理员，完整 Feed 记录会被返回，Feed.headers 中的 HTTP 凭据会暴露；view server 会输出同步 authkey；view sharing_group 未调用 SharingGroup::checkIfAuthorised()；use 命令未先确认当前用户有权查看目标记录即写入导航上下文。\n修复版本中通过将 CLI 列表与详情查询改走与 Web 相同的 ACL 路径，新增 __fetchFeedDetail 拒绝未授权 Feed 详情并把 headers、authkey 列入 hiddenFields 隐藏或掩码，同时让 use 命令先经 __fetchDetail 校验可见性，切断 CLI 越权读取与凭据泄露。", "effects": [{"comp_name": "MISP", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.5.46)", "min_fixed_version": "2.5.46", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-09-14", "level": "High", "mps_id": "MPS-39lt-dshx", "poc": false, "poc_url": [], "published_time": "2026-09-14", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-39lt-dshx", "name": "https://www.oscs1024.com/hd/MPS-39lt-dshx"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-90895", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-90895"}, {"url": "https://github.com/MISP/MISP/commit/cd9f548ed", "name": "Security patch"}], "scope_influence": "", "tags": ["应用软件"], "title": "MISP CLI授权绕过漏洞", "_translated": true, "_saved_at": "2026-09-14T11:29:39+00:00", "_first_saved_at": "2026-09-14T11:29:39+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-39lt-dshx"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "cnvd_id": "", "cve_id": "CVE-2026-90894", "cvss": {"cvssv31": [{"source": "reefs@jfrog.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-269", "description": "Parallels Desktop for Mac 是商业桌面虚拟化软件，用于在 macOS 主机上运行 Windows 与 Linux 等虚拟机，其调度守护进程 prl_disp_service 以 root 权限运行。\n受影响版本中，本地客户端可通过全局可写套接字 /var/run/prl_disp_service.socket 连接该服务；PrlSrv_LoginLocal 仅接受对端凭据，不校验 Parallels 签名、也不要求管理员组。登录后 PrlSrv_InstallAppliance 允许指定 appliance 目录 sVmParentPath，守护进程以 tar -xf \"%1\" -C \"%2\" 单字符串解包，再由 Qt QProcess::splitCommand 按词拆分。目录名中的引号会提前闭合引号，剩余文本成为额外 tar 参数，macOS tar --use-compress-program= 随即以 root 身份运行指定程序。\n修复版本中通过官方安全更新阻断该 appliance 解包参数注入路径，使目录名无法再被拆成额外 tar 标志；CVE.org 将 27.0.1 标为 unaffected，并要求升级至 27.0.1 及以上版本。", "effects": [{"comp_name": "parallels_desktop", "ecosystem": "linux", "versions": [{"affected_version": "[26.4.0,27.0.1)", "min_fixed_version": "27.0.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-09-14", "level": "High", "mps_id": "MPS-7492-dyx5", "poc": false, "poc_url": [], "published_time": "2026-09-14", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-7492-dyx5", "name": "https://www.oscs1024.com/hd/MPS-7492-dyx5"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-90894", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-90894"}, {"url": "https://www.parallels.com/products/desktop/", "name": "Parallels Desktop for Mac"}, {"url": "https://kb.parallels.com/en/131168", "name": "Parallels Desktop 27 updates summary"}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "Parallels参数注入提权", "_translated": true, "_saved_at": "2026-09-14T11:29:37+00:00", "_first_saved_at": "2026-09-14T11:29:37+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-7492-dyx5"}, {"analysis_status": 0, "articles": [], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2023-32803", "cvss": {"cvssv31": [{"source": "cve@mitre.org", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:H/A:N", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:H/A:N", "cwe": "CWE-669", "description": "The ca-certificates package before ca-certificates-2021.2.50-72 for Amazon Linux 2 (AL2) does not properly remove certain TrustCor root certificates from the root store. NOTE: this issue exists because of an incorrect fix for CVE-2022-23491.", "effects": [{"comp_name": "n/a", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,n/a]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "", "exploitability": "低", "fix_suggestion": "建议修复", "kind": "在范围间的资源转移不正确", "kind_en": "Incorrect Resource Transfer Between Spheres", "last_modified_time": "2026-09-14", "level": "High", "mps_id": "MPS-nar0-qx5o", "poc": false, "poc_url": [], "published_time": "2026-09-14", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-nar0-qx5o", "name": "https://www.oscs1024.com/hd/MPS-nar0-qx5o"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2023-32803", "name": "https://nvd.nist.gov/vuln/detail/CVE-2023-32803"}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2023-32803漏洞", "_translated": true, "_saved_at": "2026-09-15T15:23:41+00:00", "_first_saved_at": "2026-09-14T05:39:04+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-nar0-qx5o"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2023-28148", "cvss": {"cvssv31": [{"source": "cve@mitre.org", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "cwe": "CWE-79", "description": "A bodyclass XSS issue was discovered in Paessler PRTG before 23.3.86.1520.", "effects": [{"comp_name": "prtg_network_monitor", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,23.3.86.1520)", "min_fixed_version": "23.3.86.1520", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "", "exploitability": "低", "fix_suggestion": "建议修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-09-14", "level": "High", "mps_id": "MPS-2023-7704", "poc": false, "poc_url": [], "published_time": "2026-09-14", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-2023-7704", "name": "https://www.oscs1024.com/hd/MPS-2023-7704"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2023-28148", "name": "https://nvd.nist.gov/vuln/detail/CVE-2023-28148"}], "scope_influence": "", "tags": ["应用软件"], "title": "CVE-2023-28148漏洞", "_translated": true, "_saved_at": "2026-09-15T15:23:41+00:00", "_first_saved_at": "2026-09-14T05:39:06+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-2023-7704"}, {"analysis_status": 0, "articles": [{"content": "应用程序在权限管理方面存在缺陷，未能正确地验证和限制用户的权限。这可能包括访问控制列表（ACL）的不当配置、权限检查的缺失或错误、不恰当的身份验证和授权过程等。攻击者可以利用这些缺陷来绕过访问控制，获得未经授权的权限，执行敏感操作或访问敏感信息。", "title": "什么是权限管理不当"}, {"content": "- 水平权限提升：攻击者以与当前授权相同的权限冒充其他用户，获取对其他用户的访问权限。这可能是由于应用程序未能适当验证和限制用户的身份验证和授权。\r\n- 垂直权限提升：攻击者以比其当前授权更高的权限执行操作，获取对更高权限资源的访问。这可以发生在应用程序未正确验证用户请求的权限级别，或者在权限检查过程中存在漏洞的情况下。\r\n- 特权维持：攻击者通过利用特权管理的不当实施，将其特权保持在系统中。这可以包括未及时撤销特权、未正确管理特权的生命周期等。", "title": "权限管理不当常见的攻击方式"}, {"content": "- 适当的访问控制：应用程序应该实施适当的访问控制机制，包括强制访问控制列表（ACL）、角色基础访问控制（RBAC）、最小权限原则等，以确保用户只能访问其授权范围内的资源。\r\n- 身份验证和授权的正确实施：应用程序应该正确实施身份验证和授权机制，包括验证用户的身份、验证请求的权限级别，以及在授权过程中进行必要的权限检查。\r\n- 权限分离原则：应用程序应该根据职责和功能将特权分离，并只授予用户所需的最低权限，遵循最小特权原则。\r\n- 审计和监控：应用程序应该记录和监控特权操作，及时检测和响应异常或未经授权的特权访问。\r\n- 安全编码实践：开发人员应遵循安全编码实践，如输入验证、输出编码、错误处理等，以防止特权管理不当的漏洞。", "title": "如何预防权限管理不当"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-92073", "cvss": {"cvssv31": [{"source": "134c704f-9b21-4f2e-91b3-4a467353bcc0", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "cwe": "CWE-269", "description": "Mozilla Firefox 是开源 Web 浏览器，Enterprise Policies 用于通过 policies.json 或组策略锁定扩展的安装与启停。\n受影响版本中，企业将扩展列入 Extensions.Locked 或设置为 force_installed 后，偏好设置里的禁用扩展按钮仍会显示；about:addons、WebExtensions 的 browser.management.setEnabled 以及 Firefox Sync 同步路径均可调用 AddonManager 禁用接口。AddonInternal.setUserDisabled 未校验 Services.policies.isAllowed(\"disable-extension:id\")，导致本机用户或同一账号下其他客户端能够关闭管理员锁定的扩展。\n修复版本中通过在 setUserDisabled、management.setEnabled 与同步引擎中强制执行 disable-extension 策略，并按 PERM_CAN_DISABLE 隐藏禁用按钮，切断对策略锁定扩展的禁用路径。", "effects": [{"comp_name": "firefox", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,156)", "min_fixed_version": "156", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "firefox_esr", "ecosystem": "linux", "versions": [{"affected_version": "[153,153.3)", "min_fixed_version": "153.3", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "权限管理不当", "kind_en": "权限管理不当", "last_modified_time": "2026-09-15", "level": "High", "mps_id": "MPS-8a35-4bqp", "poc": false, "poc_url": [], "published_time": "2026-09-15", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-8a35-4bqp", "name": "https://www.oscs1024.com/hd/MPS-8a35-4bqp"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-92073", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-92073"}, {"url": "https://bugzilla.mozilla.org/show_bug.cgi?id=2062527", "name": ""}, {"url": "https://www.mozilla.org/security/advisories/mfsa2026-90/", "name": ""}, {"url": "https://www.mozilla.org/security/advisories/mfsa2026-93/", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "Firefox企业策略提权", "_translated": true, "_saved_at": "2026-09-15T15:23:41+00:00", "_first_saved_at": "2026-09-15T15:23:41+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-8a35-4bqp"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-16140", "cvss": {"cvssv31": [{"source": "44488dab-36db-4358-99f9-bc116477f914", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}]}, "cvss_score": 8.8, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-863", "description": "OpenBMC 是开源基板管理控制器固件项目，phosphor-net-ipmid 是其网络 IPMI（RMCP+）服务实现，NVIDIA BlueField-3、H3C HDM3 等下游产品会集成该组件。\n受影响版本中，command::RAKP12 仅按 BMC 会话 ID 检索会话，不要求会话处于 setupInProgress，也不把请求绑定到打开该会话的对端。低权限账户完成 Open Session 与 RAKP Message 1/3 并进入 active 后，可对同一会话再发送指向已启用管理员账户的 RAKP Message 1，覆盖 userName、userID、reqMaxPrivLevel 与权限字段，同时保留原会话的完整性/机密性对象、报文密钥与序号状态。随后 Set Session Privilege Level 依据改写后的管理员字段将会话提升为 Administrator，攻击者无需管理员密码即可获得管理级 IPMI 能力。\n修复版本中通过官方尚未发布的会话授权修复切断该提权链；截至 2026-09-15 公开披露，厂商仅确认修复进行中，phosphor-net-ipmid 主线未见已验证修复提交，公开资料未给出修复版本号。", "effects": [{"comp_name": "phosphor-net-ipmid", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,759f0500a4d9f9e2063206ea64d60079175b7d75]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-09-15", "level": "High", "mps_id": "MPS-gjzh-rucm", "poc": false, "poc_url": [], "published_time": "2026-09-15", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-gjzh-rucm", "name": "https://www.oscs1024.com/hd/MPS-gjzh-rucm"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-16140", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-16140"}, {"url": "https://www.runzero.com/advisories/openbmc-ipmi-privsec-rakp-cve-2026-16140/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "OpenBMC IPMI权限提升漏洞", "_translated": true, "_saved_at": "2026-09-15T15:23:37+00:00", "_first_saved_at": "2026-09-15T15:23:37+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-gjzh-rucm"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-90944", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:H/A:L", "severity": "high", "base_score": 8.2}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:H/VA:L/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "s  "tags": ["AI", "应用软件"], "title": "DeepWiki任意文件读取", "_translated": true, "_saved_at": "2026-09-15T00:09:12+00:00", "_first_saved_at": "2026-09-14T21:18:38+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-i3yx-90v7"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-16141", "cvss": {"cvssv31": [{"source": "44488dab-36db-4358-99f9-bc116477f914", "vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.1}]}, "cvss_score": 8.1, "cvss_vector": "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-798", "description": "OpenBMC 的 phosphor-net-ipmid 是开源网络 IPMI 服务，用于在 BMC 上完成 RMCP+ 会话建立与 RAKP 认证，NVIDIA BlueField-3 DPU BMC 与 H3C HDM3 等下游产品也会采用该实现。\n受影响版本中，RAKP12 处理 RAKP Message 1 时，若请求权限不超过 CALLBACK，会在覆盖认证对象构造默认值之前返回 UNAUTH_ROLE_PRIV。此时 userKey 仍为构造函数写入的常量字符串 0penBmc（20 字节，其余为零），bmcRandomNum 保持未初始化堆内容。随后 RAKP34 不检查 RAKP Message 1 是否成功，继续用该常量密钥与可预测随机数校验 HMAC，未认证攻击者可建立 CALLBACK 会话。\n修复版本中通过阻止 RAKP12 在 CALLBACK 早退路径上保留构造默认 userKey 与未初始化 bmcRandomNum，并禁止 RAKP34 在认证对象未完成初始化时继续校验 HMAC，切断未认证会话建立。截至 2026-09-15 公开披露，厂商确认修复进行中，尚未发布带版本号的补丁。", "effects": [{"comp_name": "phosphor-net-ipmid", "ecosystem": "linux", "versions": [{"affected_version": "[0,759f0500a4d9f9e2063206ea64d60079175b7d75]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "使用硬编码的凭证", "kind_en": "使用硬编码凭证", "last_modified_time": "2026-09-15", "level": "High", "mps_id": "MPS-06i4-82gx", "poc": false, "poc_url": [], "published_time": "2026-09-15", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-06i4-82gx", "name": "https://www.oscs1024.com/hd/MPS-06i4-82gx"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-16141", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-16141"}, {"url": "https://www.runzero.com/advisories/openbmc-ipmi-auth-bypass-rakp-cve-2026-16141/", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "OpenBMC IPMI认证绕过", "_translated": true, "_saved_at": "2026-09-15T15:23:35+00:00", "_first_saved_at": "2026-09-15T15:23:35+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-06i4-82gx"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "attack_vector_type": "Local", "cnvd_id": "", "cve_id": "CVE-2026-90947", "cvss": {"cvssv31": [{"source": "secalert@redhat.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "cwe": "CWE-787", "description": "GIMP 是开源图像处理程序，内置 Lighting Effects 滤镜插件，用于为图像施加光照效果，并支持通过预设文件保存和加载光源配置。\n受影响版本中，Lighting Effects 插件在 load_preset_response 中用 fscanf 从预设文件读取 Number of lights 计数值，未校验返回值，也未将计数值限制在 NUM_LIGHTS（6）以内，随后以该计数值为上界循环写入 mapvals.lightsource 固定数组。超过 6 个光源的预设文件会造成越界写，导致进程崩溃或在当前用户上下文执行任意代码。\n修复版本中通过将 num_lights 初始化为 0，并在写入循环前使用 CLAMP 将其限制到 [0, NUM_LIGHTS]，阻止超界计数值进入光源数组写入路径。", "effects": [{"comp_name": "gimp", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,3.2.6)", "min_fixed_version": "3.2.6", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界写入", "kind_en": "越界写入", "last_modified_time": "2026-09-15", "level": "High", "mps_id": "MPS-mal0-h1d6", "poc": false, "poc_url": [], "published_time": "2026-09-15", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-mal0-h1d6", "name": "https://www.oscs1024.com/hd/MPS-mal0-h1d6"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-90947", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-90947"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-90947", "name": ""}, {"url": "https://bugzilla.redhat.com/show_bug.cgi?id=2533005", "name": "RHBZ#2533005"}, {"url": "https://gitlab.gnome.org/GNOME/gimp/-/work_items/16682", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "GIMP光照预设越界写漏洞", "_translated": true, "_saved_at": "2026-09-14T17:25:51+00:00", "_first_saved_at": "2026-09-14T17:25:51+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-mal0-h1d6"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-47426", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:L/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.6}]}, "cvss_score": 7.6, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:L/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-287", "description": "OpenAM 是开源身份访问管理组件，其 OAuth2 模块支持 private_key_jwt 客户端认证方式。\n受影响版本中，ClientCredentialsReader 类的 verifyJwtBearer 方法未验证 JWT 的 iss 与 sub 声明是否匹配客户端注册信息，同时 OpenAMClientRegistration 的 byJWKsURI 方法将 JWT 声称的 iss 用作缓存键而非绑定到注册客户端本身，导致攻击者可利用自己注册的 OAuth2 客户端向任意其他使用 jwks_uri 发布密钥的客户端伪造令牌。\n修复版本中通过在 ClientCredentialsReader 中新增 iss/sub 一致性校验，并在 OpenAMClientRegistration 中引入按 clientId|jwks_uri 为键的独立缓存 ClientJwksResolverCache，将解析器的绑定 issuer 限定为注册客户端的 client_id，切断了跨客户端伪装的攻击路径。", "effects": [{"comp_name": "org.openidentityplatform.openam:openam-oauth2", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,16.1.1)", "min_fixed_version": "16.1.1", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "身份验证不当", "kind_en": "认证不当", "last_modified_time": "2026-09-15", "level": "High", "mps_id": "MPS-il7x-8sz4", "poc": false, "poc_url": [], "published_time": "2026-09-15", "reference_url_list": [{"url": "https://github.com/OpenIdentityPlatform/OpenAM/security/advisories/GHSA-f2cx-463q-7m2c", "name": ""}, {"url": "https://github.com/advisories/GHSA-f2cx-463q-7m2c", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "OpenAM OAuth Client Impersonation漏洞", "_translated": true, "_saved_at": "2026-09-15T10:51:18+00:00", "_first_saved_at": "2026-09-15T10:51:18+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-il7x-8sz4"}, {"analysis_status": 0, "articles": [], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-47424", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:H/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-693", "description": "OpenAM是开源身份访问管理解决方案，提供身份认证、授权和联邦服务，其服务端脚本沙箱用于隔离用户脚本与JVM底层资源。\n受影响版本中，GroovySandboxValueFilter的onMethodCall方法缺少对ProcessGroovyMethods.execute()扩展方法的拦截检查。当脚本调用execute()方法时，ProcessGroovyMethods会在任何返回值过滤之前直接启动OS进程，导致沙箱的类allow/deny列表无法拦截该调用，脚本作者可借此在OpenAM JVM上执行任意操作系统命令。\n修复版本中通过在GroovySandboxValueFilter.onMethodCall中新增isProcessLaunchExtension检测逻辑，在方法分发前判断receiver类型是否为CharSequence、List或String[]数组，以及method是否为execute或通过invokeMethod调用的execute，命中条件时抛出SecurityException阻断进程执行。", "effects": [{"comp_name": "org.openidentityplatform.openam:openam-scripting", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,16.1.1)", "min_fixed_version": "16.1.1", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "保护机制失效", "kind_en": "保护机制失效", "last_modified_time": "2026-09-15", "level": "High", "mps_id": "MPS-7xr8-1sbu", "poc": false, "poc_url": [], "published_time": "2026-09-15", "reference_url_list": [{"url": "https://github.com/OpenIdentityPlatform/OpenAM/security/advisories/GHSA-69j4-qvqr-hpw3", "name": ""}, {"url": "https://github.com/advisories/GHSA-69j4-qvqr-hpw3", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "OpenAM Groovy沙箱逃逸导致远程代码执行漏洞", "_translated": true, "_saved_at": "2026-09-15T10:51:14+00:00", "_first_saved_at": "2026-09-15T10:51:14+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-7xr8-1sbu"}, {"analysis_status": 0, "articles": [], "attack_vector_type": "Network", "cnvd_id": "", "cve_id": "CVE-2026-53660", "cvss": {"cvssv4": [{"source": "security-advisories@github.com", "vector": "CVSS:4.0/AV:N/AC:H/AT:P/PR:N/UI:A/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.4}]}, "cvss_score": 7.4, "cvss_vector": "CVSS:4.0/AV:N/AC:H/AT:P/PR:N/UI:A/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-1275", "description": "OpenAM 是 ForgeRock/OpenIdentityPlatform 维护的开源 Java 访问管理与 SSO 组件，OpenAM Community Edition 以 Maven 包 org.openidentityplatform.openam:openam-core 发布，浏览器侧的会话标识由名为 iPlanetDirectoryPro 的 SSO cookie 承担，并同时兼任 OAuth2/OIDC 同意页的 CSRF 凭据。\n受影响版本中，默认配置由 ServicesDefaultValues 与 serverdefaults.properties 同时落下 com.iplanet.am.cookie.secure=false、com.sun.identity.cookie.httponly=false 与缺失的 SameSite 属性三处不安全的默认值，再加上 ConsentRequiredResource 直接把 SSO 令牌 ID 注入同意页用作 csrf 值，导致 iPlanetDirectoryPro 这个本应仅作服务端会话标识的 cookie 既能被浏览器脚本读取、又会被作为 OAuth2 同意决策的 anti-CSRF 凭据复用一个完整的会话身份：任何同源 XSS 都能直接读取 cookie 拿到会话令牌完成 SSO session 窃取与攻击者驱动的 OAuth 同意授权，而即便没有 XSS，未带 SameSite 的 cookie 也会被同站顶层导航带回，从而允许跨站请求伪造对同意决策接口发起绕过 CSRF 的授权同意，造成会话身份与 CSRF 边界被混为一体。\n修复版本中通过重新拆分 CsrfProtection 的职责解除了这一耦合，CsrfProtection#createCsrfToken 使用 SecureRandom 为每次授权请求生成独立的 csrf 令牌，对有状态会话作为受保护的 session 属性存储、对无状态会话以 __Host-oauth2_csrf（或明文 HTTP 下的 oauth2_csrf）双提交回写带 HttpOnly 与 SameSite 的 cookie 颁发与校验，ConsentRequiredResource 的同意页仅渲染该独立令牌、AuthorizeResource 与 DeviceCodeVerificationResource 不再以 SSO 令牌 ID 作为 csrf 比较对象；同时在 ServicesDefaultValues 中根据部署协议自动推导 com.iplanet.am.cookie.secure，并在 serverdefaults.properties 与 validserverconfig.properties 中新增 org.openidentityplatform.openam.cookie.samesite=Lax 的默认值，使 iPlanetDirectoryPro 不再被默认强行暴露给脚本并填补缺失的 SameSite 防护。", "effects": [{"comp_name": "org.openidentityplatform.openam:openam-core", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,16.1.1)", "min_fixed_version": "16.1.1", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "具有不正确 SameSite 属性的敏感 Cookie", "kind_en": "具有不正确 SameSite 属性的敏感 Cookie", "last_modified_time": "2026-09-15", "level": "High", "mps_id": "MPS-165c-wh4p", "poc": false, "poc_url": [], "published_time": "2026-09-15", "reference_url_list": [{"url": "https://github.com/OpenIdentityPlatform/OpenAM/security/advisories/GHSA-fpmh-vx4h-xc33", "name": ""}, {"url": "https://github.com/OpenIdentityPlatform/OpenAM/releases/tag/16.1.1", "name": ""}, {"url": "https://github.com/advisories/GHSA-fpmh-vx4h-xc33", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "OpenAM 默认 SSO Cookie 配置不安全漏洞", "_translated": true, "_saved_at": "2026-09-15T10:51:16+00:00", "_first_saved_at": "2026-09-15T10:51:16+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-165c-wh4p"}]}</script>
  <script>
    const payload = JSON.parse(document.getElementById("payload").textContent);
    const levelLabels = payload.level_labels || {};
    const items = payload.items || [];
    let filtered = items.slice();
    let activeId = null;

    const $ = (id) => document.getElementById(id);
    $("generatedAt").textContent = payload.generated_at || "-";
    $("retention").textContent = payload.retention_days ?? "-";
    $("cutoff").textContent = payload.cutoff_date || "-";
    $("count").textContent = String(payload.count ?? items.length);

    function levelClass(level) {
      const cn = levelLabels[level] || level || "";
      if (level === "Critical" || cn === "严重") return "crit";
      if (level === "High" || cn === "高危") return "high";
      return "other";
    }
    function levelText(level) {
      return levelLabels[level] || level || "-";
    }
    function esc(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }
    function scoreText(v) {
      if (v === null || v === undefined || v === "" || v === -1) return "-";
      return String(v);
    }

    function renderList() {
      const list = $("list");
      $("listCount").textContent = String(filtered.length);
      if (!filtered.length) {
        list.innerHTML = '<div class="empty">没有匹配项</div>';
        return;
      }
      list.innerHTML = filtered.map((it) => {
        const id = it.mps_id || it.cve_id;
        const active = id === activeId ? " active" : "";
        return `
          <button class="item${active}" data-id="${esc(id)}" type="button">
            <div class="item-top">
              <span class="cve">${esc(it.cve_id || it.mps_id || "-")}</span>
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
            </div>
            <div class="title">${esc(it.title || "-")}</div>
            <div class="item-foot">
              <span>CVSS ${esc(scoreText(it.cvss_score))}</span>
              <span>${esc(it.published_time || "-")}</span>
              ${it.poc ? "<span>POC</span>" : ""}
            </div>
          </button>`;
      }).join("");
      list.querySelectorAll(".item").forEach((btn) => {
        btn.addEventListener("click", () => selectById(btn.dataset.id));
      });
    }

    function refsHtml(it) {
      const refs = Array.isArray(it.reference_url_list) ? it.reference_url_list : [];
      const links = [];
      if (it._source_page) links.push({ url: it._source_page, name: "OSCS 详情" });
      if (it.cve_id) links.push({ url: `https://nvd.nist.gov/vuln/detail/${it.cve_id}`, name: "NVD" });
      refs.forEach((r) => {
        if (r && r.url) links.push({ url: r.url, name: r.name || r.url });
      });
      const seen = new Set();
      const uniq = [];
      for (const l of links) {
        if (seen.has(l.url)) continue;
        seen.add(l.url);
        uniq.push(l);
      }
      if (!uniq.length) return '<div class="box">无参考链接</div>';
      return `<div class="refs">${uniq.map((l) =>
        `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name || l.url)}</a>`
      ).join("")}</div>`;
    }

    function articlesHtml(it) {
      const arts = Array.isArray(it.articles) ? it.articles : [];
      if (!arts.length) return "";
      return `<div class="section"><h3>相关说明</h3>${arts.map((a) => `
        <div class="article">
          <h4>${esc(a.title || "说明")}</h4>
          <p>${esc(a.content || "")}</p>
        </div>`).join("")}</div>`;
    }

    function renderDetail(it) {
      const detail = $("detail");
      if (!it) {
        detail.innerHTML = '<div class="empty">暂无数据</div>';
        return;
      }
      const pocUrls = Array.isArray(it.poc_url) ? it.poc_url : [];
      detail.innerHTML = `
        <div class="d-head">
          <div>
            <h1 class="d-title">${esc(it.title || "-")}</h1>
            <div class="ids">
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
              <span class="chip">${esc(it.cve_id || "无 CVE")}</span>
              <span class="chip">${esc(it.mps_id || "-")}</span>
              ${it.poc ? '<span class="chip">有 POC</span>' : ""}
              ${it.exp ? '<span class="chip">有 EXP</span>' : ""}
            </div>
          </div>
          <div class="actions">
            ${it._source_page ? `<a class="btn" href="${esc(it._source_page)}" target="_blank" rel="noopener">OSCS</a>` : ""}
            ${it.cve_id ? `<a class="btn" href="https://nvd.nist.gov/vuln/detail/${esc(it.cve_id)}" target="_blank" rel="noopener">NVD</a>` : ""}
          </div>
        </div>
        <div class="grid">
          <div class="stat"><div class="k">CVSS</div><div class="v">${esc(scoreText(it.cvss_score))}</div></div>
          <div class="stat"><div class="k">向量</div><div class="v">${esc(it.cvss_vector || "-")}</div></div>
          <div class="stat"><div class="k">CWE</div><div class="v">${esc(it.cwe || "-")}</div></div>
          <div class="stat"><div class="k">类型</div><div class="v">${esc(it.kind || it.kind_en || "-")}</div></div>
          <div class="stat"><div class="k">公开</div><div class="v">${esc(it.published_time || "-")}</div></div>
          <div class="stat"><div class="k">利用成本</div><div class="v">${esc(it.exploit_requirement_cost || "-")}</div></div>
          <div class="stat"><div class="k">可利用性</div><div class="v">${esc(it.exploitability || "-")}</div></div>
          <div class="stat"><div class="k">修复建议</div><div class="v">${esc(it.fix_suggestion || "-")}</div></div>
        </div>
        <div class="section"><h3>描述</h3><div class="box">${esc(it.description || "无描述")}</div></div>
        ${it.scope_influence ? `<div class="section"><h3>影响范围</h3><div class="box">${esc(it.scope_influence)}</div></div>` : ""}
        ${pocUrls.length ? `<div class="section"><h3>POC 链接</h3><div class="refs">${pocUrls.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join("")}</div></div>` : ""}
        <div class="section"><h3>参考链接</h3>${refsHtml(it)}</div>
        ${articlesHtml(it)}
      `;
    }

    function selectById(id) {
      const it = filtered.find((x) => (x.mps_id || x.cve_id) === id) ||
                 items.find((x) => (x.mps_id || x.cve_id) === id);
      if (!it) return;
      activeId = it.mps_id || it.cve_id;
      renderList();
      renderDetail(it);
      const btn = document.querySelector(`.item[data-id="${CSS.escape(activeId)}"]`);
      if (btn) btn.scrollIntoView({ block: "nearest" });
      history.replaceState(null, "", "#" + encodeURIComponent(activeId));
    }

    function applyFilter(q) {
      const query = (q || "").trim().toLowerCase();
      filtered = !query ? items.slice() : items.filter((it) => {
        const blob = [
          it.cve_id, it.mps_id, it.title, it.kind, it.kind_en, it.cwe, it.description, it.level
        ].map((x) => String(x || "").toLowerCase()).join(" ");
        return blob.includes(query);
      });
      renderList();
      if (filtered.length) {
        const still = filtered.some((x) => (x.mps_id || x.cve_id) === activeId);
        selectById(still ? activeId : (filtered[0].mps_id || filtered[0].cve_id));
      } else {
        activeId = null;
        renderDetail(null);
      }
    }

    $("search").addEventListener("input", (e) => applyFilter(e.target.value));

    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement !== $("search")) {
        e.preventDefault();
        $("search").focus();
        return;
      }
      if (!filtered.length) return;
      const idx = filtered.findIndex((x) => (x.mps_id || x.cve_id) === activeId);
      if (e.key === "ArrowDown") {
        e.preventDefault();
        const next = filtered[Math.min(filtered.length - 1, Math.max(0, idx) + 1)];
        selectById(next.mps_id || next.cve_id);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        const prev = filtered[Math.max(0, idx - 1)];
        selectById(prev.mps_id || prev.cve_id);
      }
    });

    const hashId = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    if (hashId && items.some((x) => (x.mps_id || x.cve_id) === hashId)) {
      activeId = hashId;
      renderList();
      selectById(hashId);
    } else if (items.length) {
      selectById(items[0].mps_id || items[0].cve_id);
    } else {
      renderList();
      renderDetail(null);
    }
  </script>
</body>
</html>
