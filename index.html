:H", "cwe": "CWE-416", "description": "Linux 内核中的 io_uring 是随 5.1 版本引入的开源异步 I/O 框架，通过 io_uring_setup 与 io_uring_enter 系统调用向用户态提供提交队列和完成队列，其中 IORING_OP_WAITID 操作用于以异步方式等待本进程子进程的状态变化，对应实现位于内核文件 io_uring/waitid.c。\n受影响版本中，子进程退出唤醒时在等待队列锁保护下执行的回调 io_waitid_wait() 先通过 list_del_init 摘除等待项并以 smp_store_release 清空 iw-\u003ehead，随后才以 atomic_fetch_inc(\u0026iw-\u003erefs) 竞争请求所有权；而 io_waitid_remove_wq() 仅在 iw-\u003ehead 非空时才获取等待队列锁，因此另一 CPU 上持有引用的释放或取消路径（__do_wait() 找到其他子进程后的完成路径，或 __io_waitid_cancel() 取消路径）可在此窗口内完成请求并释放 io_kiocb，回调随后仍对已释放请求执行 atomic_fetch_inc(\u0026iw-\u003erefs)，递增的实为复用该请求内存的下一个操作的同名字段，计数恰为零时回调还会在其上调度 io_waitid_cb()，形成 slab-use-after-free，官方 KASAN 记录显示请求被 IORING_OP_RECV 复用后在 __wake_up_common() 触发释放后访问。\n修复版本中通过调整 io_waitid_wait() 的执行顺序消除竞争窗口：先以 atomic_fetch_inc(\u0026iw-\u003erefs) 竞争请求所有权，仅在实际取得所有权后才以 smp_store_release 清空 iw-\u003ehead；未取得所有权时保留 iw-\u003ehead，使请求拥有者必须先获取回调调用方持有的等待队列锁才能完成并释放请求，重复对已摘除节点执行 list_del_init 无副作用，该修复已回传至 6.12.115、6.18.60 与 7.2.14。", "effects": [{"comp_name": "linux_kernel", "ecosystem": "linux", "versions": [{"affected_version": "[6.12.113,6.12.115)", "min_fixed_version": "6.12.115", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.18.52,6.18.60)", "min_fixed_version": "6.18.60", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.19,7.2.14)", "min_fixed_version": "7.2.14", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "UAF", "kind_en": "免费后使用", "last_modified_time": "2026-11-03", "level": "High", "mps_id": "MPS-ji4s-kbzn", "poc": false, "poc_url": [], "published_time": "2026-11-03", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-ji4s-kbzn", "name": "https://www.oscs1024.com/hd/MPS-ji4s-kbzn"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-99231", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-99231"}, {"url": "https://git.kernel.org/stable/c/bf01da1a9cca4a54e5c30b8344e52c26afb87be7", "name": ""}, {"url": "https://git.kernel.org/stable/c/8381a912c65b8de16e8a848225c7c5a56b6ea834", "name": ""}, {"url": "https://git.kernel.org/stable/c/c10ad2813e15186fb51b37a4d17fafddc99e89a5", "name": ""}], "scope_influence": "", "tags": ["操作系统"], "title": "Linux内核io_uring waitid释放后使用漏洞", "_translated": true, "_saved_at": "2026-11-02T17:40:53+00:00", "_first_saved_at": "2026-11-02T17:40:53+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ji4s-kbzn"}, {"analysis_status": 0, "articles": [{"content": "跨界内存读是指应用程序在读取内存时，未正确验证或限制读取的内存范围。攻击者利用这种漏洞可以读取应用程序内存中的敏感数据，如密码、加密密钥、会话令牌等。常见的原因是由于缓冲区溢出、格式化字符串漏洞或其他内存错误导致的。", "title": "什么是越界读取"}, {"content": "攻击者可以通过不当构造的输入来触发跨界内存读漏洞。攻击者可能会通过向应用程序发送特定的输入，使其读取超过预期的内存区域。攻击者可以利用这个漏洞来获取敏感信息，如其他用户的数据、操作系统的敏感数据或应用程序的内部状态。", "title": "越界读取常见的攻击方式"}, {"content": "- 输入验证和限制：应用程序应对所有输入数据进行严格的验证和限制。确保输入数据的长度、格式和内容符合预期，避免超出缓冲区或访问非预期的内存区域。\n- 内存安全编程实践：开发人员应使用安全的编程实践，如避免使用不安全的函数、正确处理内存分配和释放操作，以及遵循最小特权原则。\n- 使用安全的编程语言和库：选择使用安全性较高的编程语言和库，这些语言和库在内存管理和安全性方面提供了更多的保护机制。\n- 定期进行代码审查和安全测试：定期审查应用程序的代码，并进行安全测试，以发现潜在的跨界内存读漏洞。使用静态代码分析工具和漏洞扫描工具来辅助检测和修复问题。\n- 实施防御性编程技术：应用程序应采用防御性编程技术，如使用随机化地址空间布局（ASLR）、堆栈保护机制（如堆栈溢出保护）和数据执行预防（DEP）等。\n- 及时更新和修补：及时应用程序和操作系统的安全更新和补丁，以确保已知的跨界内存读漏洞得到修复。及时更新相关软件和库，以避免使用已知存在漏洞的版本。", "title": "如何预防越界读取"}], "cnvd_id": "", "cve_id": "CVE-2026-99236", "cvss": {"cvssv31": [{"source": "416baaa9-dc9f-4396-8d5f-8c081fb06d67", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-125", "description": "Linux 内核是开源的操作系统内核，其 tracing 子系统通过 tracefs 与 perf 接口提供事件过滤能力，用于按表达式匹配并筛选跟踪事件。\n受影响版本中，predicate_parse() 的外层解析循环在输入以 \u0026\u0026、|| 或一元 ! 结尾时会带着未消解的运算符状态直接进入收尾阶段，prog[0].target 保持为 -1，第二轮优化遍历以该值作为下标访问 prog 数组并读取 prog[-1]，构成数组起始位置之前的越界读，相邻 slab 内存中的数据还可能被复制进通过前向跳转检查的分支目标；本地攻击者可通过 PERF_EVENT_IOC_SET_FILTER 或写入 tracefs 事件 filter 文件触达该解析路径。\n修复版本中通过在外层循环结束后增加已解析谓词计数 N 的非零检查，直接返回 -EINVAL 并记录 FILT_ERR_INVALID_FILTER 错误，使非空表达式只有在内部循环消解完全部运算符后才允许进入收尾阶段，从而阻断越界下标访问。", "effects": [{"comp_name": "linux_kernel", "ecosystem": "linux", "versions": [{"affected_version": "[4.17,7.4)", "min_fixed_version": "7.4", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.12,6.12.115)", "min_fixed_version": "6.12.115", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.18,6.18.60)", "min_fixed_version": "6.18.60", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[5.10,5.10.273)", "min_fixed_version": "5.10.273", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.1,6.1.191)", "min_fixed_version": "6.1.191", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[5.15,5.15.224)", "min_fixed_version": "5.15.224", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.6,6.6.161)", "min_fixed_version": "6.6.161", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[7.2,7.2.15)", "min_fixed_version": "7.2.15", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[7.3,7.3.1)", "min_fixed_version": "7.3.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "越界读取", "kind_en": "越界读取", "last_modified_time": "2026-11-03", "level": "High", "mps_id": "MPS-n15w-aykh", "poc": false, "poc_url": [], "published_time": "2026-11-03", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-n15w-aykh", "name": "https://www.oscs1024.com/hd/MPS-n15w-aykh"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-99236", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-99236"}, {"url": "https://git.kernel.org/stable/c/4a1a6d35359991c5d47f4bf101cfbe1475c94093", "name": ""}, {"url": "https://git.kernel.org/stable/c/2a98f5d4913ec081e08e1075512cb7ec313d9f72", "name": ""}, {"url": "https://git.kernel.org/stable/c/15ff3cc7f2beecc3f95d66358f20ad7b057466aa", "name": ""}, {"url": "https://git.kernel.org/stable/c/b205ff58e02922ac324f931cf9eb238a3acdb048", "name": ""}, {"url": "https://git.kernel.org/stable/c/5a999b5a16530898f0dbe5f8c50fd45ea72e110b", "name": ""}, {"url": "https://git.kernel.org/stable/c/1008e9e0b8280d47f1ab5e9c113f666a023a9697", "name": ""}, {"url": "https://git.kernel.org/stable/c/64993d970dde2a2da353e9e99595a4fa88ec27d9", "name": ""}, {"url": "https://git.kernel.org/stable/c/5bcdf3c18c3471122ee9652b0e2f5cdb718d9a46", "name": ""}], "scope_influence": "", "tags": ["操作系统"], "title": "Linux内核过滤器越界读漏洞", "_translated": true, "_saved_at": "2026-11-02T17:40:47+00:00", "_first_saved_at": "2026-11-02T17:40:47+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-n15w-aykh"}, {"analysis_status": 0, "articles": [{"content": "应用程序使用已释放的内存区域。当一个对象被释放后，程序可能继续引用该内存地址，导致使用了无效的内存。攻击者可以利用这个漏洞，通过修改已释放的内存内容来执行恶意代码或者获取敏感信息。", "title": "什么是UAF"}, {"content": "- 悬空指针攻击：攻击者利用程序中的已释放指针，重新分配内存并故意将指针指向已释放的内存区域。然后，当程序继续使用该指针时，攻击者可以执行恶意代码或者篡改内存数据。\r\n- 虚函数表劫持：针对面向对象的程序，攻击者可以通过修改已释放对象的虚函数表（VTable）指针，来改变程序的行为。攻击者可以控制程序执行任意代码或者调用任意函数。\r\n- 堆喷射：攻击者通过大量分配和释放特定大小的内存块，以创建特定的内存布局。然后，攻击者可以利用UAF漏洞来操作特定的内存块，例如修改函数指针，从而实现代码执行。", "title": "UAF常见的攻击方式"}, {"content": "- 释放后置空指针：在释放内存后，立即将指针置为空，防止后续误用。\r\n- 使用析构函数：在对象被释放时，使用析构函数来清理相关资源，避免UAF漏洞的发生。\r\n- 使用引用计数或垃圾回收机制：引入引用计数或垃圾回收机制可以自动处理内存释放，减少UAF的发生。\r\n- 使用现代化的编程语言和框架：现代编程语言和框架通常具有内存管理机制，如自动内存回收和强类型检查，可以有效减少UAF漏洞的发生。\r\n- 定期更新和修复：及时更新和修复软件，包括操作系统、应用程序和库文件，以防止已知的UAF漏洞被攻击利用。", "title": "如何预防UAF"}], "cnvd_id": "", "cve_id": "CVE-2026-99233", "cvss": {"cvssv31": [{"source": "416baaa9-dc9f-4396-8d5f-8c081fb06d67", "vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}]}, "cvss_score": 7.8, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-416", "description": "Linux kernel 是开源的操作系统内核，其 tracing 子系统通过 tracefs 向用户态提供 ftrace 跟踪能力，直方图触发器（hist trigger）与合成事件（synthetic event）用于对跟踪事件进行统计与跨事件关联。\n受影响版本中，event_hist_trigger_parse() 与 hist_unreg_all() 在注册或注销直方图时调用 find_synth_event() 按事件名称查找合成事件并调整其引用计数 se-\u003eref，该查找通过 strcmp 仅比较名称，不校验 event_call 对象身份；当某个非合成 trace 事件的名称与合成事件同名时，在该事件上注册或移除直方图会错误修改合成事件的引用计数，按照先在非合成事件上注册直方图、后创建并移除同名合成事件的顺序操作，se-\u003eref 会在缺少配对递增的情况下被递减，合成事件对象在仍被直方图 action 持有指针时被释放，最终形成释放后使用。\n修复版本中通过新增 find_synth_event_call() 在名称匹配之外增加 \u0026se-\u003ecall 与 file-\u003eevent_call 的指针一致性校验，event_hist_trigger_parse() 的注册与注销路径以及 hist_unreg_all() 改用该函数执行查找，仅当命中的合成事件确实对应当前 event_call 时才调整 se-\u003eref，切断了引用计数失配导致合成事件被提前释放的因果链。", "effects": [{"comp_name": "linux_kernel", "ecosystem": "linux", "versions": [{"affected_version": "[4.17,6.1.191)", "min_fixed_version": "6.1.191", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[4.17,6.12.115)", "min_fixed_version": "6.12.115", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[4.17,6.6.161)", "min_fixed_version": "6.6.161", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[4.17,7.2.15)", "min_fixed_version": "7.2.15", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[4.17,7.3.1)", "min_fixed_version": "7.3.1", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[4.17,6.18.60)", "min_fixed_version": "6.18.60", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[4.17,7.4)", "min_fixed_version": "7.4", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "UAF", "kind_en": "免费后使用", "last_modified_time": "2026-11-03", " 攻击者可借此触发内存破坏，导致内核崩溃或权限提升。\n修复版本中通过 将 update_last_data_if_empty() 拆分为带 trace_types_lock 的对外入口与 __update_last_data_if_empty() 内部实现，内部实现加入 lockdep_assert_held(\u0026trace_types_lock) 断言，读者路径先获取 trace_types_lock 再执行 LAST_BOOT 检查与 module_delta 释放，已持锁的 tracer_init() 与 tracing_set_clock() 改用免锁变体，使检查、清标志与释放全程在同一把锁下串行执行，消除双重释放与并发更新风险。", "effects": [{"comp_name": "linux_kernel", "ecosystem": "linux", "versions": [{"affected_version": "[6.18,6.18.60)", "min_fixed_version": "6.18.60", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[6.16-rc1,7.4-rc1)", "min_fixed_version": "7.4-rc1", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[7.2,7.2.14)", "min_fixed_version": "7.2.14", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[7.3,7.3.1)", "min_fixed_version": "7.3.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "双重释放", "kind_en": "双重免费", "last_modified_time": "2026-11-03", "level": "High", "mps_id": "MPS-zem2-twk1", "poc": false, "poc_url": [], "published_time": "2026-11-03", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-zem2-twk1", "name": "https://www.oscs1024.com/hd/MPS-zem2-twk1"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-99237", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-99237"}, {"url": "https://git.kernel.org/stable/c/92b69f6db640dadc0851762ee2e12db99f083cad", "name": ""}, {"url": "https://git.kernel.org/stable/c/d6d991afe775ab7fcf89523a2502b7ca3be56ffd", "name": ""}, {"url": "https://git.kernel.org/stable/c/1f06cfe0b60a878619d1d8efe1cd0f515b7dc2aa", "name": ""}], "scope_influence": "", "tags": ["操作系统"], "title": "Linux内核tracing双重释放漏洞", "_translated": true, "_saved_at": "2026-11-02T17:40:50+00:00", "_first_saved_at": "2026-11-02T17:40:50+00:00", "_source_page": "http A:N", "severity": "high", "base_score": 7.4}]}, "cvss_score": 7.4, "cvss_vector": "CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:C/C:H/I:N/A:N", "cwe": "CWE-125", "description": "libslirp 是 freedesktop.org 维护的开源用户态 TCP/IP 库，供 QEMU 和容器运行时为客户机或容器提供用户态网络。\n受影响版本中，icmp_forward_error() 组装 ICMP 差错响应时，引用原始 IPv4 报文的长度 s_ip_len 取自 IP 首部字段 ip_len，只在超过 ICMP_MAXDATALEN 时被截断，未与源 mbuf 的实际长度 msrc-\u003em_len 比较。截断或畸形报文可使随后的 memcpy 按该长度越过 msrc-\u003em_data 末尾读取宿主堆，并把读到的内容写入返回给客户机或容器的 ICMP 差错报文。\n修复版本中通过在拷贝前将 s_ip_len 限制为不超过 msrc-\u003em_len，使引用长度不再超出源缓冲区，从而阻止宿主堆数据进入 ICMP 差错响应。", "effects": [{"comp_name": "libslirp", "ecosystem": "linux", "versions": [{"affected_version": "[4.4.0,4.9.7)", "min_fixed_version": "4.9.7", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "极高", "fix_suggestion": "建议修复", "kind": "越界读取", "kind_en": "越界读取", "last_modified_time": "2026-11-03", "level": "High", "mps_id": "MPS-d7cn-6pqu", "poc": true, "poc_url": [], "published_time": "2026-11-03", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-d7cn-6pqu", "name": "https://www.oscs1024.com/hd/MPS-d7cn-6pqu"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-120830", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-120830"}, {"url": "https://access.redhat.com/security/cve/CVE-2026-120830", "name": ""}, {"url": "https://bugzilla.redhat.com/show_bug.cgi?id=2565424", "name": "RHBZ#2565424"}, {"url": "https://gitlab.freedesktop.org/slirp/libslirp/-/commit/21b33a6c5588af9f58d15e528fdc1019452708e4", "name": ""}], "scope_influence": "", "tags": ["poc", "开源"], "title": "libslirp越界读取漏洞", "_translated": true, "_saved_at": "2026-11-03T07:28:15+00:00", "_first_saved_at": "2026-11-03T07:28:15+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-d7cn-6pqu"}]}</script>
  <script>
    const payload = JSON.parse(document.getElementById("payload").textContent);
    const levelLabels = payload.level_labels || {};
    const items = payload.items || [];
    let filtered = items.slice();
    let activeId = null;

    const $ = (id) => document.getElementById(id);
    $("generatedAt").textContent = payload.generated_at || "-";
    $("retention").textContent = payload.retention_days ?? "-";
    $("cutoff").textContent = payload.cutoff_date || "-";
    $("count").textContent = String(payload.count ?? items.length);

    function levelClass(level) {
      const cn = levelLabels[level] || level || "";
      if (level === "Critical" || cn === "严重") return "crit";
      if (level === "High" || cn === "高危") return "high";
      return "other";
    }
    function levelText(level) {
      return levelLabels[level] || level || "-";
    }
    function esc(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }
    function scoreText(v) {
      if (v === null || v === undefined || v === "" || v === -1) return "-";
      return String(v);
    }

    function renderList() {
      const list = $("list");
      $("listCount").textContent = String(filtered.length);
      if (!filtered.length) {
        list.innerHTML = '<div class="empty">没有匹配项</div>';
        return;
      }
      list.innerHTML = filtered.map((it) => {
        const id = it.mps_id || it.cve_id;
        const active = id === activeId ? " active" : "";
        return `
          <button class="item${active}" data-id="${esc(id)}" type="button">
            <div class="item-top">
              <span class="cve">${esc(it.cve_id || it.mps_id || "-")}</span>
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
            </div>
            <div class="title">${esc(it.title || "-")}</div>
            <div class="item-foot">
              <span>CVSS ${esc(scoreText(it.cvss_score))}</span>
              <span>${esc(it.published_time || "-")}</span>
              ${it.poc ? "<span>POC</span>" : ""}
            </div>
          </button>`;
      }).join("");
      list.querySelectorAll(".item").forEach((btn) => {
        btn.addEventListener("click", () => selectById(btn.dataset.id));
      });
    }

    function refsHtml(it) {
      const refs = Array.isArray(it.reference_url_list) ? it.reference_url_list : [];
      const links = [];
      if (it._source_page) links.push({ url: it._source_page, name: "OSCS 详情" });
      if (it.cve_id) links.push({ url: `https://nvd.nist.gov/vuln/detail/${it.cve_id}`, name: "NVD" });
      refs.forEach((r) => {
        if (r && r.url) links.push({ url: r.url, name: r.name || r.url });
      });
      const seen = new Set();
      const uniq = [];
      for (const l of links) {
        if (seen.has(l.url)) continue;
        seen.add(l.url);
        uniq.push(l);
      }
      if (!uniq.length) return '<div class="box">无参考链接</div>';
      return `<div class="refs">${uniq.map((l) =>
        `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name || l.url)}</a>`
      ).join("")}</div>`;
    }

    function articlesHtml(it) {
      const arts = Array.isArray(it.articles) ? it.articles : [];
      if (!arts.length) return "";
      return `<div class="section"><h3>相关说明</h3>${arts.map((a) => `
        <div class="article">
          <h4>${esc(a.title || "说明")}</h4>
          <p>${esc(a.content || "")}</p>
        </div>`).join("")}</div>`;
    }

    function renderDetail(it) {
      const detail = $("detail");
      if (!it) {
        detail.innerHTML = '<div class="empty">暂无数据</div>';
        return;
      }
      const pocUrls = Array.isArray(it.poc_url) ? it.poc_url : [];
      detail.innerHTML = `
        <div class="d-head">
          <div>
            <h1 class="d-title">${esc(it.title || "-")}</h1>
            <div class="ids">
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
              <span class="chip">${esc(it.cve_id || "无 CVE")}</span>
              <span class="chip">${esc(it.mps_id || "-")}</span>
              ${it.poc ? '<span class="chip">有 POC</span>' : ""}
              ${it.exp ? '<span class="chip">有 EXP</span>' : ""}
            </div>
          </div>
          <div class="actions">
            ${it._source_page ? `<a class="btn" href="${esc(it._source_page)}" target="_blank" rel="noopener">OSCS</a>` : ""}
            ${it.cve_id ? `<a class="btn" href="https://nvd.nist.gov/vuln/detail/${esc(it.cve_id)}" target="_blank" rel="noopener">NVD</a>` : ""}
          </div>
        </div>
        <div class="grid">
          <div class="stat"><div class="k">CVSS</div><div class="v">${esc(scoreText(it.cvss_score))}</div></div>
          <div class="stat"><div class="k">向量</div><div class="v">${esc(it.cvss_vector || "-")}</div></div>
          <div class="stat"><div class="k">CWE</div><div class="v">${esc(it.cwe || "-")}</div></div>
          <div class="stat"><div class="k">类型</div><div class="v">${esc(it.kind || it.kind_en || "-")}</div></div>
          <div class="stat"><div class="k">公开</div><div class="v">${esc(it.published_time || "-")}</div></div>
          <div class="stat"><div class="k">利用成本</div><div class="v">${esc(it.exploit_requirement_cost || "-")}</div></div>
          <div class="stat"><div class="k">可利用性</div><div class="v">${esc(it.exploitability || "-")}</div></div>
          <div class="stat"><div class="k">修复建议</div><div class="v">${esc(it.fix_suggestion || "-")}</div></div>
        </div>
        <div class="section"><h3>描述</h3><div class="box">${esc(it.description || "无描述")}</div></div>
        ${it.scope_influence ? `<div class="section"><h3>影响范围</h3><div class="box">${esc(it.scope_influence)}</div></div>` : ""}
        ${pocUrls.length ? `<div class="section"><h3>POC 链接</h3><div class="refs">${pocUrls.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join("")}</div></div>` : ""}
        <div class="section"><h3>参考链接</h3>${refsHtml(it)}</div>
        ${articlesHtml(it)}
      `;
    }

    function selectById(id) {
      const it = filtered.find((x) => (x.mps_id || x.cve_id) === id) ||
                 items.find((x) => (x.mps_id || x.cve_id) === id);
      if (!it) return;
      activeId = it.mps_id || it.cve_id;
      renderList();
      renderDetail(it);
      const btn = document.querySelector(`.item[data-id="${CSS.escape(activeId)}"]`);
      if (btn) btn.scrollIntoView({ block: "nearest" });
      history.replaceState(null, "", "#" + encodeURIComponent(activeId));
    }

    function applyFilter(q) {
      const query = (q || "").trim().toLowerCase();
      filtered = !query ? items.slice() : items.filter((it) => {
        const blob = [
          it.cve_id, it.mps_id, it.title, it.kind, it.kind_en, it.cwe, it.description, it.level
        ].map((x) => String(x || "").toLowerCase()).join(" ");
        return blob.includes(query);
      });
      renderList();
      if (filtered.length) {
        const still = filtered.some((x) => (x.mps_id || x.cve_id) === activeId);
        selectById(still ? activeId : (filtered[0].mps_id || filtered[0].cve_id));
      } else {
        activeId = null;
        renderDetail(null);
      }
    }

    $("search").addEventListener("input", (e) => applyFilter(e.target.value));

    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement !== $("search")) {
        e.preventDefault();
        $("search").focus();
        return;
      }
      if (!filtered.length) return;
      const idx = filtered.findIndex((x) => (x.mps_id || x.cve_id) === activeId);
      if (e.key === "ArrowDown") {
        e.preventDefault();
        const next = filtered[Math.min(filtered.length - 1, Math.max(0, idx) + 1)];
        selectById(next.mps_id || next.cve_id);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        const prev = filtered[Math.max(0, idx - 1)];
        selectById(prev.mps_id || prev.cve_id);
      }
    });

    const hashId = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    if (hashId && items.some((x) => (x.mps_id || x.cve_id) === hashId)) {
      activeId = hashId;
      renderList();
      selectById(hashId);
    } else if (items.length) {
      selectById(items[0].mps_id || items[0].cve_id);
    } else {
      renderList();
      renderDetail(null);
    }
  </script>
</body>
</html>
