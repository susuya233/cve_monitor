ty-advisories/CVE-2026-82320", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "SolarWinds Serv-U权限提升漏洞", "_translated": true, "_saved_at": "2026-11-24T18:33:40+00:00", "_first_saved_at": "2026-11-24T18:33:40+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-v9gc-3uws"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-137090", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "critical", "base_score": 9.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "critical", "base_score": 9.3}]}, "cvss_score": 9.3, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-78", "description": "build-git-clone 是一个用 TypeScript 编写、以 MIT 许可证发布的开源 npm 包，用于把 Git 仓库克隆到指定目录，并支持在克隆完成后执行附加命令。\n受影响版本中，库导出的 clone() 函数把调用方传入的 url 参数未做转义地拼接进 cd \u003c目标目录\u003e \u0026\u0026 git clone \u003curl\u003e . 命令字符串，再交给内部 exec() 函数执行；exec() 在非 Windows 平台以 sh -c、在 Windows 平台以 cmd /C 调用 child_process.spawn 运行该字符串，url 中的 ; 或 $() 等 shell 元字符被 shell 解释，攻击者通过传入携带这些元字符的仓库 URL，即可以 Node.js 进程权限执行任意系统命令（src/index.ts 第 77 行）。\n修复版本中通过重构代码结构，把克隆逻辑迁移至新增的 src/clone.ts 并新增 cloneCommand() 函数，以 spawn(git, ['clone', '--', url, dest], { shell: false }) 的参数化方式直接执行 git，url 作为独立位置参数传递且不再进入 shell 命令行，shell 元字符失去解释语义，命令注入链被切断；该修复随 npm 1.0.4 版本发布（发布于 2026-11-12）。", "effects": [{"comp_name": "build-git-clone", "ecosystem": "npm", "versions": [{"affected_version": "(-∞,1.0.4)", "min_fixed_version": "1.0.4", "repository": "npm", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-11-26", "level": "Critical", "mps_id": "MPS-zbvp-1dfx", "poc": false, "poc_url": [], "published_time": "2026-11-26", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-zbvp-1dfx", "name": "https://www.oscs1024.com/hd/MPS-zbvp-1dfx"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-137090", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-137090"}, {"url": "https://github.com/emanuelmoraes-dev/build-git-clone/commit/3d55e64e5b7c61e560b5d030d6a918cad5c67a29", "name": ""}, {"url": "https://github.com/emanuelmoraes-dev/build-git-clone/pull/1", "name": ""}, {"url": "https://github.com/emanuelmoraes-dev/build-git-clone/blob/68bc305028d04c9a71a030c4b0b5cc36450201b9/src/index.ts#L77", "name": ""}, {"url": "https://www.vulncheck.com/advisories/build-git-clone-before-1.0.4-os-command-injection-in-clone-via-repository-url", "name": "VulnCheck Advisory: build-git-clone before 1.0.4 OS Command Injection in clone() via repository URL"}], "scope_influence": "", "tags": ["npm", "开源"], "title": "build-git-clone 命令注入 ，av_malloc(0) 仍返回 1 字节堆块，memcpy() 得到负的 int 长度并转换为超大 size_t，写入越过堆分配，破坏内存并导致进程崩溃。\n修复版本中通过把 recv_msg() 改为使用 av_strndup()，按 size_t 长度复制消息，并在分配失败时返回错误，不再把长度截断为 int 后交给 memcpy()，避免写入越过堆分配。", "effects": [{"comp_name": "ffmpeg", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,9.1)", "min_fixed_version": "9.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "数值截断错误", "kind_en": "数字截断错误", "last_modified_time": "2026-11-24", "level": "High", "mps_id": "MPS-jsch-8nu9", "poc": false, "poc_url": [], "published_time": "2026-11-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-jsch-8nu9", "name": "https://www.oscs1024.com/hd/MPS-jsch-8nu9"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-135742", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-135742"}, {"url": "https://code.ffmpeg.org/FFmpeg/FFmpeg/pulls/26081", "name": ""}, {"url": "https://github.com/FFmpeg/FFmpeg/commit/78afb1d6e99ba2d3264f053ae4c0e4487a9c824c", "name": "Patch Commit"}, {"url": "https://github.com/FFmpeg/FFmpeg/blob/n9.0.2/libavfilter/f_zmq.c#L138", "name": ""}, {"url": "https://github.com/FFmpeg/FFmpeg", "name": ""}, {"url": "https://www.vulncheck.com/advisories/ffmpeg-before-9.1-integer-truncation-via-zmq-filter-recv-msg", "name": "VulnCheck Advisory: FFmpeg before 9.1 Integer Truncation via zmq Filter recv_msg()"}], "scope_influence": "", "tags": ["应用软件"], "title": "FFmpeg整数截断漏洞", "_translated": true, "_saved_at": "2026-11-24T06:40:30+00:00", "_first_saved_at": "2026-11-24T06:40:30+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-jsch-8nu9"}, {"analysis_status": 0, "articles": [{"content": "在程序没有正确验证和限制内存写操作的情况下，攻击者通过向应用程序提供恶意输入，成功地将数据写入超出其预期范围的内存位置。这可能导致程序的内存损坏，使攻击者能够执行任意代码或破坏应用程序的正常运行。", "title": "什么是越界写入"}, {"content": "- 缓冲区溢出：攻击者向应用程序的输入缓冲区中输入超出其容量的数据，导致数据溢出到相邻的内存区域，从而修改重要的数据结构或执行恶意代码。\n- 栈溢出：攻击者通过向函数调用栈中注入超出其容量的数据，覆盖返回地址或重要的控制信息，控制程序的执行流程。\n- 格式化字符串漏洞：攻击者利用格式化字符串函数的漏洞，通过提供恶意格式字符串来修改内存内容，进而执行任意代码。", "title": "越界写入常见的攻击方式"}, {"content": "- 输入验证和过滤：对于所有用户输入的数据，进行严格的验证和过滤，确保只接受合法的输入数据。\n- 使用安全的内存操作函数：使用安全的内存操作函数，如安全的字符串拷贝函数（如strcpy_s、strncpy_s）和安全的格式化函数（如snprintf、sprintf_s），确保内存操作的安全性。\n- 边界检查：在进行内存写操作时，确保操作不会超出内存的边界，可以使用边界检查函数或标准库提供的安全函数来实现。\n- 内存保护机制：启用操作系统或编译器提供的内存保护机制，如地址空间布局随机化（ASLR）、数据执行保护（DEP）等，以增加攻击的难度。\n- 定期更新和修复：及时应用厂商发布的安全补丁和更新，修复已知的跨界内存写漏洞。", "title": "如何预防越界写入"}], "cnvd_id": "", "cve_id": "CVE-2026-135740", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 7.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.5}]}, "cvss_score": 8.5, "cvss_vector": "CVSS:4.0/AV:L/AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-787", "description": "FFmpeg 是开源多媒体框架，采用 LGPL 或 GPL 许可，用于音视频编解码、滤镜处理和格式转换。其中 readeia608 滤镜从输入视频扫描 EIA-608 闭路字幕并写入帧元数据。\n受影响版本中，libavfilter/vf_readeia608.c 的 build_histogram() 按像素位深名义上限 s-\u003emax 分配直方图，但直接使用未钳制的 line[i].input 作为下标递增。config_input() 将 s-\u003emax 设为 (1 \u003c\u003c depth) - 1；位深大于 8 时 read_word() 以 uint16_t 读取亮度采样。攻击者提交 9、10、12 或 14 位灰度或 YUV 视频且采样值超过该名义上限时，直方图写入越过堆缓冲区，可造成进程崩溃，并可能进一步执行代码。\n修复版本中通过在 build_histogram() 内使用 FFMIN(line[i].input, s-\u003emax) 将下标限制到直方图上界后再递增计数，超过名义位深上限的亮度采样不再越过已分配堆内存。", "effects": [{"comp_name": "ffmpeg", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,9.1)", "min_fixed_version": "9.1", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exp 用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-96298", "cvss": {}, "cvss_score": 8.3, "cvss_vector": "", "cwe": "CWE-862", "description": "Apache Texera（孵化中）是 Apache 软件基金会托管的开源可视化数据科学系统，用于协作设计数据分析工作流，并在 computing unit 中执行。\n受影响版本中，computing unit 的 workflow websocket 端点 /wsapi/workflow-websocket 未校验调用者是否被授予目标 computing unit。ServletAwareConfigurator.modifyHandshake 在缺少访问控制服务注入的身份头时把 UserComputingUnitAccess 固定为 WRITE，WorkflowWebsocketResource.myOnOpen 再按查询参数 wid 与 cuid 订阅对应工作流。已认证用户因而可以查看未被授予的 computing unit 中的工作流结果、控制执行并运行代码。本地 JVM 与单节点 Docker Compose 部署可直接连接；Kubernetes 部署中，可由集群内另一个 computing unit 中运行的代码发起连接。\n修复版本中通过为 computing unit pool 增加拒绝池内 Pod 互相入站访问的 NetworkPolicy，切断一个 computing unit 直接连接另一个 computing unit workflow websocket 的路径。本地 JVM 与 Docker Compose 部署仍不提供完整安全模型，仅供受信任用户使用。", "effects": [{"comp_name": "texera", "ecosystem": "linux", "versions": [{"affected_version": "[1.1.0,1.3.0)", "min_fixed_version": "1.3.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-11-24", "level": "High", "mps_id": "MPS-4890-0b25", "poc": false, "poc_url": [], "published_time": "2026-11-24", "reference_url_list": [{"url": "http://www.mail-archive.com/announce@apache.org/msg12777.html", "name": ""}, {"url": "https://texera.apache.org", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-96298", "name": ""}, {"url": "https://texera.apache.org/releases/1.3.0-incubating/", "name": ""}, {"url": "https://github.com/apache/texera/commit/3c87a969ccb1ec39110a1320fe378ee50a6972c3", "name": ""}, {"url": "https://github.com/apache/texera/commit/cf6faeb7b31ff3defeab77cc2bbd614035dabf 通过移除已弃用的项目功能切断上述越权访问。1.3.0-incubating 删除 ProjectResource、PublicProjectResource 与 ProjectAccessResource 及其在 TexeraWebApplication.run 中的 Jersey 注册，并经由 sql/updates/45.sql 删除 project、project_user_access、workflow_of_project 与 public_project 表，项目 REST API 不再对外提供。", "effects": [{"comp_name": "texera", "ecosystem": "linux", "versions": [{"affected_version": "[1.1.0-incubating,1.3.0-incubating)", "min_fixed_version": "1.3.0-incubating", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-11-24", "level": "High", "mps_id": "MPS-e80d-1466", "poc": false, "poc_url": [], "published_time": "2026-11-24", "reference_url_list": [{"url": "http://www.mail-archive.com/announce@apache.org/msg12779.html", "name": ""}, {"url": "https://www.mail-archive.com/announce@apache.org/msg12779.html", "name": ""}, {"url": "https://texera.apache.org", "name": ""}, {"url": "https://texera.apache.org/releases/1.3.0-incubating/", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-96353", "name": ""}, {"url": "https://github.com/apache/texera/pull/9284", "name": ""}, {"url": "https://github.com/apache/texera/commit/e70bbbf838eda11d34f287a9d83f5fa97059041f", "name": ""}, {"url": "https://github.com/apache/texera/pull/7464", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "Texera项目接口越权", "_translated": true, "_saved_at": "2026-11-23T22:23:16+00:00", "_first_saved_at": "2026-11-23T22:23:16+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-e80d-1466"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-82303", "cvss": {"cvssv31": [{"source": "security@elastic.co", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "severity": "high", "base_score": 7.5}]}, "cvss_score": 7.5, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N", "cwe": "CWE-126", "description": "Elasticsearch 是 Elastic 开源的分布式搜索与分析引擎，基于 Java 实现，通过节点间传输协议在集群节点与远程集群之间交换请求和响应数据。\n受影响版本中，传输层 LZ4 解压组件 Lz4TransportDecompressor 的 decodeBlock 方法处理压缩块时，将入站网络缓冲区的完整底层数组交给 LZ4 解压器，未以块头声明的 compressedLength 作为读取上界。攻击者通过可达的传输接口提交压缩块头声明字面量长度超过其 compressedLength 的请求，解压器越过该块边界继续读取共享网络缓冲区中其他请求的残留数据，解压结果作为当前请求的负载返回，造成跨请求数据泄露；远程集群传输接口无需身份认证。\n修复版本中通过将解压器源数据封装为按 compressedLength 截取的 ByteBuffer 并校验实际读取字节数等于声明长度，不满足时抛出 IllegalStateException 拒绝该压缩块，阻断对共享缓冲区的越界读取，修复随 8.19.24、9.4.9、9.5.6 版本发布。", "effects": [{"comp_name": "elasticsearch", "ecosystem": "linux", "versions": [{"affected_version": "[8.0.0,8.19.24)", "min_fixed_version": "8.19.24", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[9.0.0,9.4.9)", "min_fixed_version": "9.4.9", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[7.14.0,7.17.29]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[9.5.0,9.5.6)", "min_fixed_version": "9.5.6", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "缓冲区上溢读取", "kind_en": "缓冲区超读", "last_modified_time": "2026-11-24", "level": "High", "mps_id": "MPS-8zns-7hcr", "poc": false, "poc_url": [], "published_time": "2026-11-24", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-8zns-7hcr", "name": "https://www.oscs1024.com/hd/MPS-8zns-7hcr"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-82303", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-82303"}, {"url": "https://discuss.elastic.co/t/391840", "name": ""}], "scope_influence": "", "tags": ["应用软件", "数据库"], "title": "Elasticsearch LZ4传输解压越界读取漏洞", "_translated": true, "_saved_at": "2026-11-23T22:23:18+00:00", "_first_saved_at": "2026-11-23T22:23:18+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-8zns-7hcr"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-129243", "cvss": {}, "cvss_score": 8.8, "cvss_vector": "", "cwe": "CWE-863", "description": "GeoServer 是开源 Java 地理空间数据服务器，gs-ows 模块中的 Dispatcher 负责解析并分发 WMS、WFS 等 OGC Web 服务请求。\n受影响版本中，Dispatcher.findService 在选择服务实现前会截去服务标识里第一个斜杠及其之前的前缀，但 Request.service 仍保存请求中的原始服务名。OperationSecurityCallback.operationDispatched 用该原始值匹配 security/services.properties 中的服务安全规则，名称不能命中时规则不会生效。默认配置只允许管理员调用 wfs.CreateStoredQuery 和 wfs.DropStoredQuery，未认证请求使用带前缀的服务名可以创建或删除 WFS 存储查询。图层与数据安全规则仍然生效。\n修复版本中通过在 Dispatcher.service 解析出实际服务后，将 Request.service 改写为 serviceDescriptor.getId()，使后续服务安全检查按实际执行的服务标识匹配规则，带前缀的服务名不能再绕过默认的存储查询权限限制。", "effects": [{"comp_name": "geoserver", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2.27.7)", "min_fixed_version": "2.27.7", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[2.28.0,2.28.6)", "min_fixed_version": "2.28.6", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[3.0.0,3.0.2)", "min_fixed_version": "3.0.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "org.geoserver:gs-ows", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,2.27.7)", "min_fixed_version": "2.27.7", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[2.28.0,2.28.6)", "min_fixed_version": "2.28.6", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[3.0.0,3.0.2)", "min_fixed_version": "3.0.2", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-11-25", "level": "High", "mps_id": "MPS-8081-8bc7", "poc": false, "poc_url": [], "published_time": "2026-11-25", "reference_url_list": [{"url": "https://github.com/geoserver/geoserver/security/advisories/GHSA-rv5g-g2r9-58rj", "name": ""}, {"url": "https://geoserver.org/vulnerability/2026/11/23/cve-update.html", "name": ""}, {"url": "https://osgeo-org.atlassian.net/browse/GEOS-12195", "name": ""}, {"url": "https://github.com/geoserver/geoserver/pull/9922", "name": ""}, {"url": "https://github.com/geoserver/geoserver/commit/e5a79f69fc6d3375fc562ca89799a01796b58e9c", "name": ""}, {"url": "https://github.com/geoserver/geoserver/commit/a43218e551a45a9b103030b13553b3f8293813fe", "name": ""}, {"url": "https://github.com/geoserver/geoserver/commit/9a6169e6c0c96dcdd49c5566ad0e00852095548e", "name": ""}, {"url": "https://github.com/geoserver/geoserver/commit/d116fc8a171233b03468be17e88a76c83cfd5132", "name": ""}, {"url": "https://docs.geoserver.org/stable/en/user/security/service/", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "GeoServer服务授权绕过", "_translated": true, "_saved_at": "2026-11-25T02:53:54+00:00", "_first_saved_at": "2026-11-25T02:53:54+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-8081-8bc7"}, {"analysis_status": 0, "articles": [{"content": "跨站点请求伪造 (CSRF)通过利用网站对用户请求的信任进行攻击。当用户在网站A登录并在同一浏览器会话中访问网站B时，攻击者可以构造特制的请求并诱使用户执行，以使网站B误以为这些请求是用户合法发起的。\n攻击者通常通过欺骗用户点击恶意链接、在受信任的网站中植入恶意代码或通过钓鱼等手段来实施CSRF攻击，一旦用户执行了恶意请求，攻击者可以以用户的身份执行任意操作，包括更改用户密码、发起资金转账或删除重要数据等。", "title": "什么是CSRF"}, {"content": "- 链接欺骗：攻击者通过向用户发送包含恶意链接的电子邮件或社交媒体消息，诱使用户点击并执行恶意请求。\n- 图片引用攻击：攻击者通过在恶意网站上包含指向目标网站的图片引用，以触发用户浏览器自动发送目标网站的请求。\n- XSS利用：如果目标网站存在XSS漏洞，攻击者可以注入恶意脚本，以使用户在浏览器中执行恶意请求。", "title": "CSRF常见的攻击方式"}, {"content": "- 随机令牌：网站可以在每个请求中包含一个随机生成的令牌（CSRF Token），并验证该令牌的有效性，以确认请求的来源是合法的。\n- SameSite Cookie：使用SameSite属性来限制跨站点请求，将Cookie的发送限制在同一站点上，减少了跨站请求伪造的风险。\n- 双重验证：对于敏感操作，网站可以要求用户进行额外的验证，例如输入验证码、提供第二个因素的身份验证等。\n- 强化浏览器策略：网站可以设置Content-Security-Policy（CSP）头，限制浏览器执行恶意脚本的能力，减少CSRF攻击的风险。\n- 限制用户操作：网站可以要求用户在执行敏感操作之前进行明确的确认或授权，防止恶意请求被误触发。\n- 安全编码实践：开发人员应遵循安全编码实践，对用户输入进行适当的验证和过滤，防止恶意请求的注入。", "title": "如何预防CSRF"}], "cnvd_id": "", "cve_id": "CVE-2026-82359", "cvss": {}, "cvss_score": 8.8, "cvss_vector": "", "cwe": "CWE-352", "description": "Apache JSPWiki 是开源 Java Wiki 引擎，基于 Servlet 与 JSP 提供页面编辑、附件管理以及用户和权限控制。受影响发布物为 Maven 构件 org.apache.jspwiki:jspwiki-war，源码仓库为 apache/jspwiki。\n受影响版本中，3.0.0 的 jspwiki.war 没有在 WEB-INF/web.xml 注册 CsrfProtectionFilter。该过滤器只声明在 jspwiki-http-3.0.0.jar 的 META-INF/web-fragment.xml，并映射到 /*。该片段使用 Java EE 3.0 描述符，war 的 web.xml 使用 Jakarta Servlet 5.0 描述符。厂商公告确认该 CSRF 防护配置未生效，过滤器没有进入请求处理链。CsrfProtectionFilter.doFilter 不会在 POST 请求中比较参数 X-XSRF-TOKEN 与 Session.antiCsrfToken()，无效令牌也不会被重定向到 /error/Forbidden.html。已登录用户在跨站页面提交 POST 后，可以绕过同步令牌校验，执行页面删除、重命名、安装参数提交或工作流决策等状态变更。\n修复版本中通过将 CsrfProtectionFilter 及 url-pattern /* 写入 jspwiki-war 的 WEB-INF/web.xml，并删除 jspwiki-http 模块的 META-INF/web-fragment.xml，使 3.0.1 在部署时注册该过滤器。POST 请求重新进入 doFilter，令牌不匹配的请求被重定向到 /error/Forbidden.html。", "effects": [{"comp_name": "org.apache.jspwiki:jspwiki-war", "ecosystem": "maven", "versions": [{"affected_version": "[3.0.0,3.0.1)", "min_fixed_version": "3.0.1", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "CSRF", "kind_en": "跨站请求伪造 (CSRF)", "last_modified_time": "2026-11-25", "level": "High", "mps_id": "MPS-8de8-1460", "poc": false, "poc_url": [], "published_time": "2026-11-25", "reference_url_list": [{"url": "http://www.mail-archive.com/announce@apache.org/msg12814.html", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-82359", "name": ""}, {"url": "https://issues.apache.org/jira/browse/JSPWIKI-1303", "name": ""}, {"url": "https://jspwiki.apache.org/", "name": ""}, {"url": "https://github.com/apache/jspwiki/commit/96bffc7d8333dd97a190d66dc0a3371cca005bc3", "name": ""}, {"url": "https://github.com/apache/jspwiki/commit/96374c1d8f22d596ecc98a7a5bb9222683a444c2", "name": ""}, {"url": "https://github.com/apache/jspwiki/pull/526", "name": ""}, {"url": "https://repo1.maven.org/maven2/org/apache/jspwiki/jspwiki-war/3.0.0/jspwiki-war-3.0.0.war", "name": ""}, {"url": "https://repo1.maven.org/maven2/org/apache/jspwiki/jspwiki-war/3.0.1/jspwiki-war-3.0.1.war", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "JSPWiki CSRF绕过", "_translated": true, "_saved_at": "2026-11-25T02:53:49+00:00", "_first_saved_at": "2026-11-25T02:53:49+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-8de8-1460"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-120705", "cvss": {}, "cvss_score": 8.6, "cvss_vector": "", "cwe": "CWE-91", "description": "GeoServer 是开源 Java 地理空间数据服务器，通过 WFS、WMS 等开放标准发布和编辑空间数据。\n受影响版本中，公开的 WFS GetFeature 操作会展开内置存储查询 urn:ogc:def:query:OGC-WFS::GetFeatureById。StoredQuery.compile() 用字符串替换把调用方的 ID 参数写入模板中的 fes:ResourceId rid 属性，替换时不转义引号和尖括号，随后使用未设置 GeoServer entity resolver 的 Parser 解析替换结果。未认证调用方可以注入 XML，包括 xi:include，读取 GeoServer 进程可读的本地文本文件，或让服务器请求指定的 HTTP 或 HTTPS 地址。匿名用户可访问图层时，读取到的文本会出现在 Illegal property name 错误响应中；否则文件仍会被读取但不会返回。\n修复版本中通过在目录关联的存储查询解析路径上设置 ResourcePool 的 entity resolver，并在 GeoTools PreventLocalEntityResolver 中关闭自动跳转、于跟随 HTTP Location 前按允许列表复核目标，限制外部实体和 XInclude 的任意 URI 访问。内置 StoredQuery.DEFAULT 的 catalog 为空，compile() 在该对象上不会安装 entity resolver。", "effects": [{"comp_name": "org.geoserver:gs-wfs-core", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,2.27.7)", "min_fixed_version": "2.27.7", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[2.28.0,2.28.6)", "min_fixed_version": "2.28.6", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[3.0.0,3.0.2)", "min_fixed_version": "3.0.2", "repository": "maven", "solutions": [], "upstream": true}]}, {"comp_name": "org.geotools:gt-metadata", "ecosystem": "maven", "versions": [{"affected_version": "(-∞,33.7)", "min_fixed_version": "33.7", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[34.0,34.6)", "min_fixed_version": "34.6", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[35.0,35.2)", "min_fixed_version": "35.2", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "XPath盲注", "kind_en": "XML 注入（又名 XPath 盲注入）", "last_modified_time": "2026-11-25", "level": "High", "mps_id": "MPS-a5a2-ffd4", "poc": false, "poc_url": [], "published_time": "2026-11-25", "reference_url_list": [{"url": "https://github.com/geoserver/geoserver/security/advisories/GHSA-39mw-5chv-jh47", "name": ""}, {"url": "https://github.com/geoserver/geoserver/pull/9928", "name": ""}, {"url": "https://github.com/geoserver/geoserver/commit/8e43e96b913ebc3a1e2a6a5f6004321543ab189c", "name": ""}, {"url": "https://github.com/geoserver/geoserver/commit/6a525902fabbc9b0d2bc3e4062a6b1bfa4506228", "name": ""}, {"url": "https://github.com/geoserver/geoserver/commit/2f5e2d071ed517a27ecfa0dbd4c53d9af6e7a35c", "name": ""}, {"url": "https://github.com/geoserver/geoserver/releases/tag/2.27.7", "name": ""}, {"url": "https://github.com/geoserver/geoserver/releases/tag/2.28.6", "name": ""}, {"url": "https://github.com/geoserver/geoserver/releases/tag/3.0.2", "name": ""}, {"url": "https://osgeo-org.atlassian.net/browse/GEOS-12199", "name": ""}, {"url": "https://osgeo-org.atlassian.net/browse/GEOT-7938", "name": ""}, {"url": "https://github.com/geotools/geotools/commit/361a0131b49eaab33b62026ac6f0617121df8633", "name": ""}, {"url": "https://github.com/geotools/geotools/releases/tag/33.7", "name": ""}, {"url": "https://github.com/geotools/geotools/releases/tag/34.6", "name": ""}, {"url": "https://github.com/geotools/geotools/releases/tag/35.2", "name": ""}, {"url": "https://cryptocat.me/blog/research/analysis/geoserver_preauth_rce/", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "GeoServer WFS XML注入", "_translated": true, "_saved_at": "2026-11-25T02:53:52+00:00", "_first_saved_at": "2026-11-25T02:53:52+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-a5a2-ffd4"}, {"analysis_status": 0, "articles": [{"content": "当应用程序接受来自用户的输入，并将其直接拼接到SQL查询语句中，而没有对输入进行充分的验证和转义时，就会发生SQL注入。攻击者可以通过在输入中插入恶意的SQL代码，改变原始查询的意图，从而执行未经授权的操作或访问敏感数据。", "title": "什么是SQL注入"}, {"content": "- 基于错误的输入过滤：攻击者通过向输入字段中插入特殊字符或SQL语句片段来破坏应用程序的输入过滤机制。这可能导致应用程序执行意外的SQL查询。\n- 基于布尔盲注：攻击者利用应用程序在查询结果中显示的不同响应来确定SQL语句的真假。通过构造特定的查询，攻击者可以逐步推断出数据库的结构和敏感信息。\n- 基于时间的盲注：攻击者通过在SQL查询中插入延迟语句来测试条件的真假。通过测量响应时间的差异，攻击者可以推断出SQL语句的真假和敏感数据的存在性。", "title": "SQL注入常见的攻击方式"}, {"content": "- 使用参数化查询或预编译语句：避免将用户输入直接拼接到SQL查询语句中，而是使用参数化查询或预编译语句。这样可以将用户输入作为参数传递给查询，从而避免了注入攻击。\n- 输入验证和过滤：对用户输入进行充分的验证和过滤，确保输入符合预期的格式和范围。可以使用白名单验证、正则表达式或输入验证库等方法来过滤输入。\n- 最小权限原则：确保数据库用户具有最小的权限，并严格限制其对敏感数据和数据库操作的访问权限。\n- 不透明化敏感数据：对于敏感数据，如密码和信用卡号等，应该使用适当的加密和哈希算法进行存储，以减少数据泄露的风险。\n- 定期更新和维护：及时应用数据库供应商发布的安全补丁和更新，以修复已知的漏洞和弱点。", "title": "如何预防SQL注入"}], "cnvd_id": "", "cve_id": "CVE-2026-133442", "cvss": {}, "cvss_score": 8.6, "cvss_vector": "", "cwe": "CWE-89", "description": "Hibernate ORM 是 Red Hat 主导的开源 Java 对象关系映射框架，提供 HQL 查询语言与面向多种数据库方言的 SQL 生成能力，受影响代码位于通过 Maven 坐标 org.hibernate.orm:hibernate-core 分发的核心模块。\n受影响版本中，当目标方言不支持 JSON 路径 passing 子句时（对应 MySQL 与 MariaDB 的 json_* HQL 函数渲染器），JsonValueFunction、JsonQueryFunction、JsonExistsFunction 等函数描述符会调用 JsonPathHelper.appendInlinedJsonPathIncludingPassingClause，把 passing 参数的字面值直接内联到 JSON 路径字符串中，并作为内联 SQL 字符串字面量拼入语句。该路径上的转义逻辑 JsonPathHelper.appendJsonPassingLiteralValue 只对单引号做双写处理，不转义反斜杠，而 MySQL 与 MariaDB 默认把反斜杠视为字符串字面量内的转义字符，攻击者通过 passing 路径参数传入以反斜杠结尾的字符串可以吞掉内联字面量的闭合引号，使后续受控内容被数据库当作 SQL 解析，形成一阶 SQL 注入，可绕过授权并读取、篡改数据库数据。\n修复版本中通过引入方言感知的字面量转义机制切断上述注入链路：SqlAppender、LiteralSupport 与 Dialect 新增 appendLiteral 与 appendLiteralContent 方法，JsonValueFunction 等 JSON 函数渲染器改为经方言转义后输出 JSON 路径片段与 passing 值，MySQLDialect 与 MySQLLegacyDialect 在未启用 NO_BACKSLASH_ESCAPES 时对反斜杠做双写转义，消除以反斜杠破坏字符串边界的可能。", "effects": [{"comp_name": "hibernate_orm", "ecosystem": "linux", "versions": [{"affected_version": "[7.3.0.CR1,7.4.17.Final)", "min_fixed_version": "7.4.17.Final", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[8.0.0.Alpha1,8.0.0.CR2)", "min_fixed_version": "8.0.0.CR2", "repository": "unmanaged", "solutions": [], "upstream": true}, {"affected_version": "[7.0.0.Beta2,7.2.26.Final)", "min_fixed_version": "7.2.26.Final", "repository": "unmanaged", "solutions": [], "upstream": true}]}, {"comp_name": "org.hibernate.orm:hibernate-core", "ecosystem": "maven", "versions": [{"affected_version": "[7.0.0.Beta2,7.2.26.Final)", "min_fixed_version": "7.2.26.Final", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[7.3.0.CR1,7.4.17.Final)", "min_fixed_version": "7.4.17.Final", "repository": "maven", "solutions": [], "upstream": true}, {"affected_version": "[8.0.0.Alpha1,8.0.0.CR2)", "min_fixed_version": "8.0.0.CR2", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SQL注入", "kind_en": "SQL 命令中使用的特殊元素的不正确中和（“SQL 注入”）", "last_modified_time": "2026-11-25", "level": "High", "mps_id": "MPS-ccd2-3817", "poc": false, "poc_url": [], "published_time": "2026-11-25", "reference_url_list": [{"url": "https://www.ibm.com/support/pages/node/7297919", "name": ""}, {"url": "https://github.com/hibernate/hibernate-orm/security/advisories/GHSA-v5mr-59hq-7mvm", "name": ""}, {"url": "https://hibernate.atlassian.net/browse/HHH-21164", "name": ""}, {"url": "https://github.com/hibernate/hibernate-orm/commit/61f3bad1f7b0a43f984b028f8756d931ee3890cc", "name": ""}, {"url": "https://github.com/hibernate/hibernate-orm/commit/8443783b1d8bd1abb8c3e9b3a749f80c0f2fda32", "name": ""}, {"url": "https://github.com/hibernate/hibernate-orm/commit/3299d2b76f5cfee2a2ffee19ca22f0c2957c5d01", "name": ""}, {"url": "https://github.com/hibernate/hibernate-orm/commit/ff2615069a1601baa9cd72d348a1dd996f8e2028", "name": ""}, {"url": "https://github.com/hibernate/hibernate-orm/pull/14021", "name": ""}, {"url": "https://github.com/hibernate/hibernate-orm/security/advisories/GHSA-834x-qc2r-wc59", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "Hibernate ORM json函数SQL注入漏洞", "_translated": true, "_saved_at": "2026-11-25T11:59:00+00:00", "_first_saved_at": "2026-11-25T11:59:00+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-ccd2-3817"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-80283", "cvss": {"cvssv31": [{"source": "security_alert@emc.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.4}]}, "cvss_score": 8.4, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-306", "description": "Dell Secure Connect Gateway (SCG) Virtual Edition 是戴尔推出的商业虚拟一体机软件，部署在客户环境中用于与 Dell 后端支持体系建立安全连接，执行系统巡检、固件与驱动信息收集等远程支持任务，产品源码未公开。\n受影响版本中，官方公告说明该产品的关键功能缺失身份认证校验。攻击者在获得本地访问环境后无需特权凭据便能直接调用受影响的关键功能，造成敏感信息被未授权泄露、系统资源被未授权修改，并可执行特权操作，最终导致一体机面临被完整控制的风险。\n修复版本中通过官方安全更新为该关键功能补齐身份认证校验，未经认证的本地请求无法再进入特权功能路径，敏感信息泄露、系统资源篡改与特权操作执行的风险被消除。", "effects": [{"comp_name": "secure_connect_gateway", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,5.36.00.16)", "min_fixed_version": "5.36.00.16", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "关键功能的认证机制缺失", "kind_en": "缺少关键功能的身份验证", "last_modified_time": "2026-11-25", "level": "High", "mps_id": "MPS-f6ro-7381", "poc": false, "poc_url": [], "published_time": "2026-11-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-f6ro-7381", "name": "https://www.oscs1024.com/hd/MPS-f6ro-7381"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-80283", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-80283"}, {"url": "https://www.dell.com/support/kbdoc/en-us/000503504/dsa-2026-386-security-update-for-dell-secure-connect-gateway-virtual-edition-multiple-vulnerabilities", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "Dell SCG VE身份认证缺失漏洞", "_translated": true, "_saved_at": "2026-11-25T11:59:09+00:00", "_first_saved_at": "2026-11-25T11:59:09+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-f6ro-7381"}, {"analysis_status": 0, "articles": [{"content": "应用程序未能正确验证和过滤用户输入，将用户提供的数据直接用作操作系统命令的一部分。攻击者可以利用这个漏洞，通过注入恶意的操作系统命令来执行任意系统命令、获取敏感信息或者对系统进行未授权的操作。", "title": "什么是OS命令注入"}, {"content": "- 命令拼接：应用程序将用户输入直接拼接到操作系统命令中，而不进行合适的过滤和验证。攻击者可以通过在输入中注入特殊字符、命令分隔符等，来执行额外的命令或修改原始命令的行为。\r\n- 命令注释：攻击者通过在输入中注入特殊字符或命令注释符号，如\"#\"或\"//\"，来注释掉原始命令中的一部分，然后执行自己的恶意命令。\r\n- 命令管道：攻击者通过在输入中注入管道符号\"|\"，将多个命令连接起来执行。这使得攻击者可以在单个注入点上执行多个命令，进一步扩大攻击的范围。", "title": "OS命令注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对用户输入进行严格的验证和过滤，确保只接受预期的有效输入。可以使用白名单验证，限制用户输入的字符集和格式，防止特殊字符和命令注释符的注入。\r\n- 使用参数化命令或预编译语句：应该使用参数化命令或预编译语句，而不是将用户输入直接拼接到命令中。这样可以将输入数据视为参数，而不是命令的一部分，从而避免命令注入漏洞。\r\n- 最小特权原则：应用程序在执行操作系统命令时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。这样即使发生命令注入漏洞，攻击者的权限也会受到限制。\r\n- 安全编码实践：开发人员应避免使用不受信任的用户输入来拼接命令，并使用安全的编码实践，如输入验证、输出编码和参数化查询等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止命令注入攻击。", "title": "如何预防OS命令注入"}], "cnvd_id": "", "cve_id": "CVE-2026-80273", "cvss": {"cvssv31": [{"source": "security_alert@emc.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.4}]}, "cvss_score": 8.4, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "cwe": "CWE-78", "description": "Dell Secure Connect Gateway (SCG) Virtual Edition 是 Dell 提供的闭源商业虚拟设备，以虚拟机镜像形式部署，用于在客户数据中心与 Dell 后端支持服务之间建立安全连接，承担设备发现、远程支持、遥测收集与更新分发等管理功能。\n受影响版本中，设备在处理进入操作系统命令执行路径的输入时未对特殊元素进行正确中和，具备设备本地访问权限的攻击者可以借助该缺陷注入并执行任意操作系统命令，进而获得权限提升，最终导致设备机密性、完整性与可用性完全丧失。\n修复版本中通过官方安全更新修正对操作系统命令特殊元素的中和处理，阻止注入内容被系统当作命令执行并提升权限，官方公告未提供替代缓解措施，建议升级至 5.36.00.16 及以上版本。", "effects": [{"comp_name": "secure_connect_gateway", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,5.36.00.16)", "min_fixed_version": "5.36.00.16", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "OS命令注入", "kind_en": "操作系统命令中使用的特殊元素的不正确中和（“操作系统命令注入”）", "last_modified_time": "2026-11-25", "level": "High", "mps_id": "MPS-vtya-n0lm", "poc": false, "poc_url": [], "published_time": "2026-11-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-vtya-n0lm", "name": "https://www.oscs1024.com/hd/MPS-vtya-n0lm"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-80273", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-80273"}, {"url": "https://www.dell.com/support/kbdoc/en-us/000503504/dsa-2026-386-security-update-for-dell-secure-connect-gateway-virtual-edition-multiple-vulnerabilities", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "Dell SCG命令注入漏洞", "_translated": true, "_saved_at": "2026-11-25T11:59:05+00:00", "_first_saved_at": "2026-11-25T11:59:05+00:00", "_source_page": "https://www rity_alert@emc.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:N/A:N", "severity": "high", "base_score": 7.7}]}, "cvss_score": 7.7, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:N/A:N", "cwe": "CWE-918", "description": "Dell Virtual Storage Integrator（VSI）for VMware vSphere Web Client 是 Dell 提供的闭源 vCenter 插件，用于在 vSphere Client 中查看、供应、监控和管理 Dell 存储系统上的数据存储。\n受影响版本中，httpRest.js 存在服务端请求伪造缺陷。低权限远程攻击者可利用该缺陷未经授权访问内部服务，厂商评定机密性影响为高，完整性与可用性不受影响。\n修复版本中通过发布 10.12.0.0 修复 httpRest.js 的服务端请求伪造。公开资料未披露具体源码修改，厂商未提供临时缓解措施，升级后低权限远程攻击者不能再通过该缺陷未经授权访问内部服务。", "effects": [{"comp_name": "virtual_storage_integrator", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,10.12.0.0)", "min_fixed_version": "10.12.0.0", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "SSRF", "kind_en": "服务器端请求伪造 (SSRF)", "last_modified_time": "2026-11-25", "level": "High", "mps_id": "MPS-9nvc-7h3b", "poc": false, "poc_url": [], "published_time": "2026-11-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-9nvc-7h3b", "name": "https://www.oscs1024.com/hd/MPS-9nvc-7h3b"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-82170", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-82170"}, {"url": "https://www.dell.com/support/kbdoc/en-us/000535705/dsa-2026-510-security-update-for-virtual-storage-integrator-for-vmware-vsphere-web-client-vulnerabilities", "name": ""}], "scope_influence": "", "tags": ["应用软件"], "title": "VSI服务端请求伪造", "_translated": true, "_saved_at": "2026-11-24T18:33:45+00:00", "_first_saved_at": "2026-11-24T18:33:45+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-9nvc-7h3b"}, {"analysis_status": 0, "articles": [{"content": "应用程序在进行身份验证时使用了不恰当的机制或实施不安全的验证方法。这可能包括使用未限制登录次数、使用不安全的会话管理、缺乏多因素身份验证等。攻击者可以利用这些弱点来绕过身份验证，冒充合法用户，获取未授权的访问权限。", "title": "什么是身份验证不当"}, {"content": "- 密码破解：攻击者尝试使用暴力破解或字典攻击等方法，通过尝试各种密码组合来猜测合法用户的密码。如果应用程序没有限制登录次数并使用弱密码或密码哈希算法，攻击者可以成功地破解密码并获取访问权限。\r\n- 会话劫持：攻击者通过获取合法用户的会话标识符（如Cookie）来劫持其会话。这可以通过窃取会话标识符、使用会话固定攻击或通过 XSS 等方式实现。一旦攻击者获得有效的会话，他们可以冒充合法用户执行未经授权的操作。\r\n- CSRF攻击：攻击者通过欺骗受害者利用其身份在已登录的应用程序中执行恶意操作。这种攻击利用了应用程序在处理来自受信任网站的请求时未进行适当验证的漏洞。", "title": "身份验证不当常见的攻击方式"}, {"content": "- 使用强密码策略：应用程序应该要求用户使用强密码，并通过密码复杂性要求、密码长度限制等措施来确保密码的强度。\r\n- 密码哈希和盐值：应用程序应该使用适当的密码哈希算法，并为每个用户生成唯一的盐值。这样可以防止攻击者通过哈希碰撞或彩虹表攻击破解密码。\r\n- 多因素身份验证：应用程序可以引入多因素身份验证，结合密码与其他因素（如指纹、短信验证码、硬件令牌等）来提高安全性。\r\n- 安全的会话管理：使用安全的会话管理机制，如随机生成会话标识符、在会话过期时强制重新验证等，以防止会话劫持攻击。\r\n- 输入验证与过滤：在进行身份验证之前，应该对用户输入进行适当的验证和过滤，以防止 XSS 和其他攻击。\r\n- 定期安全审计：进行定期的安全审计和漏洞扫描，及时修复发现的安全问题。", "title": "如何预防身份验证不当"}], "cnvd_id": "", "cve_id": "CVE-2026-80284", "cvss": {"cvssv31": [{"source": "security_alert@emc.com", "vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N", "severity": "high", "base_score": 7.7}]}, "cvss_score": 7.7, "cvss_vector": "CVSS:3.1/AV:L/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N", "cwe": "CWE-287", "description": "Dell Secure Connect Gateway（SCG）Virtual Edition 是 Dell 提供的闭源商用虚拟设备，用于在客户环境与 Dell 之间建立安全连接，承载服务请求、遥测数据与升级流程的管理。\n受影响版本中，SCG Virtual Edition 的身份认证机制存在缺陷（CWE-287），攻击者在具备本地访问条件时无需账号权限即可触发，可能导致敏感数据暴露，并可对系统操作实施未授权修改。\n修复版本中通过官方安全更新修复该身份认证缺陷，5.36.00.16 及以上版本不再受此问题影响，官方公告未提供替代缓解措施，建议升级至 5.36.00.16 或更高版本。", "effects": [{"comp_name": "secure_connect_gateway", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,5.36.00.16)", "min_fixed_version": "5.36.00.16", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "身份验证不当", "kind_en": "认证不当", "last_modified_time": "2026-11-25", "level": "High", "mps_id": "MPS-wn4y-txjz", "poc": false, "poc_url": [], "published_time": "2026-11-25", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-wn4y-txjz", "name": "https://www.oscs1024.com/hd/MPS-wn4y-txjz"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-80284", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-80284"}, {"url": "https://www.dell.com/support/kbdoc/en-us/000503504/dsa-2026-386-security-update-for-dell-secure-connect-gateway-virtual-edition-multiple-vulnerabilities", "name": ""}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "Dell SCG VE 身份认证缺陷漏洞", "_translated": true, "_saved_at": "2026-11-25T11:59:03+00:00", "_first_saved_at": "2026-11-25T11:59:03+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-wn4y-txjz"}, {"analysis_status": 0, "articles": [], "cnvd_id": "", "cve_id": "CVE-2026-78098", "cvss": {}, "cvss_score": 7, "cvss_vector": "", "cwe": "CWE-285", "description": "Apache JSPWiki 是 Apache 软件基金会维护的开源 Java Wiki 引擎，以 WAR 包形式部署在 Servlet 容器中，通过页面级 ACL 标记对单个 Wiki 页面实施查看与编辑控制。\n受影响版本中，jspwiki-main 模块的 PermissionFactory.getPagePermission() 方法使用 wiki.hashCode() ^ page.hashCode() ^ actions.hashCode() 作为静态权限缓存 WeakHashMap 的键。Java 字符串哈希值可以相等（例如 Aa 与 BB 哈希相同），攻击者创建页面名称与受保护页面哈希碰撞的页面后，该页面的权限对象占据受保护页面的缓存槽位，后续请求受保护页面时 PermissionFactory 返回攻击者页面的 PagePermission 对象，DefaultAuthorizationManager.checkPermission() 按该对象携带的页面名查找 ACL，命中无 ACL 配置的攻击者页面并在策略检查通过后放行，未授权用户可读取或编辑设置了页面级 ACL 的受保护页面。\n修复版本中通过将缓存键改为 wiki、页面名与动作拼接而成的唯一字符串，消除哈希碰撞导致的键冲突，并新增 PermissionFactoryTest 回归测试验证哈希相同的页面名各自获得独立的 PagePermission 对象。", "effects": [{"comp_name": "org.apache.jspwiki:jspwiki-war", "ecosystem": "maven", "versions": [{"affected_version": "[2.5.54,3.0.1)", "min_fixed_version": "3.0.1", "repository": "maven", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权机制不恰当", "kind_en": "不当授权", "last_modified_time": "2026-11-25", "level": "High", "mps_id": "MPS-5fbc-7dd1", "poc": false, "poc_url": [], "published_time": "2026-11-25", "reference_url_list": [{"url": "http://www.mail-archive.com/announce@apache.org/msg12821.html", "name": ""}, {"url": "https://issues.apache.org/jira/browse/JSPWIKI-1286", "name": ""}, {"url": "https://github.com/apache/jspwiki/commit/9e3766063988644ea786a9b5a6dc3977aa9d83fc", "name": ""}, {"url": "https://github.com/apache/jspwiki/pull/515", "name": ""}, {"url": "https://github.com/apache/jspwiki/commit/d278a33d9711cfe1e7b9e15d52c300c28af88b16", "name": ""}, {"url": "https://github.com/apache/jspwiki/releases/tag/3.0.1", "name": ""}, {"url": "https://www.cve.org/CVERecord?id=CVE-2026-78098", "name": ""}, {"url": "https://jspwiki.apache.org/", "name": ""}], "scope_influence": "", "tags": ["java", "开源"], "title": "Apache JSPWiki 页面 ACL 绕过漏洞", "_translated": true, "_saved_at": "2026-11-25T11:59:01+00:00", "_first_saved_at": "2026-11-25T11:59:01+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-5fbc-7dd1"}, {"analysis_status": 0, "articles": [{"content": "应用程序在处理用户输入时的不完善或缺乏验证机制，所以攻击者能够通过向应用程序发送恶意输入，利用应用程序对输入数据的错误处理方式来注入自己的恶意代码。这些恶意代码会被应用程序误认为是合法的指令或数据，并在执行过程中被执行。", "title": "什么是代码注入"}, {"content": "应用程序使用可执行动态代码的函数来执行用户可控的参数，当应用程序对于用户输入过滤不完全时，攻击者可以注入恶意代码并控制代码执行流程。", "title": "代码注入常见的攻击方式"}, {"content": "- 输入验证与过滤：应用程序应该对所有用户输入进行验证和过滤，确保只接受预期的有效输入。这包括对输入数据进行输入长度验证、类型检查和格式验证等。\r\n- 使用参数化查询或预编译语句：对于数据库查询操作，应该使用参数化查询或预编译语句，确保输入数据不会被误认为是执行代码。\r\n- 最小特权原则：应用程序在执行操作系统命令或动态代码时，应该使用最小特权原则，即使用具有最低权限的用户或服务来执行操作。\r\n- 安全编码实践：开发人员应该采用安全编码实践，包括避免使用eval函数、避免拼接用户输入的字符串作为代码执行等。\r\n- 使用Web应用程序防火墙（WAF）：部署Web应用程序防火墙可以帮助检测和阻止代码注入攻击。", "title": "如何预防代码注入"}], "cnvd_id": "", "cve_id": "CVE-2026-137305", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H", "severity": "high", "base_score": 8.8}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 8.7}]}, "cvss_score": 8.7, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-94", "description": "Grav Form 是 Grav CMS 的官方表单插件，以 Composer 包 getgrav/grav-plugin-form 形式发布的 PHP 开源组件，用于在 Grav 页面中定义与处理表单，包含文件上传字段和邮件通知等动作。\n受影响版本中，Form::uploadFiles() 直接采用页面 frontmatter 中文件字段声明的 destination，支持页面令牌、theme@:/templates 等流式路径、相对路径与绝对路径，解析后未校验落点便写入上传文件；文件名检查仅拦截 PHP 与页面内容类扩展名，攻击者可将含 Twig 代码的 .txt 或 .svg 文件上传至主题或插件的 templates 目录、system/templates 等 Twig 模板路径，该文件随后被当作受信任模板在 Twig 内容沙箱之外渲染，例如通过表单 email 动作按同一 frontmatter 中的 template 名称渲染该文件，最终以 Web 服务器用户身份执行任意代码；destination 指向站点目录之外时，上传文件还可写入 Web 服务器用户可写的任意位置。\n修复版本中通过在 uploadFiles() 与 copyFiles() 中新增 isAllowedUploadFolder() 校验，要求上传目录必须位于 user/ 之内，且不得落入任何主题或插件的 templates 目录或 Twig loader 注册的模板路径，normalizeFolder() 将相对路径、.. 序列与符号链接归一化为真实路径参与比对，destination 不满足条件的表单上传被直接拒绝，切断了上传文件进入 Twig 模板路径并被渲染执行的利用链。", "effects": [{"comp_name": "getgrav/grav-plugin-form", "ecosystem": "composer", "versions": [{"affected_version": "(-∞,9.2.4)", "min_fixed_version": "9.2.4", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "代码注入", "kind_en": "代码生成控制不当（“代码注入”）", "last_modified_time": "2026-11-26", "level": "High", "mps_id": "MPS-0qbz-wvsa", "poc": false, "poc_url": [], "published_time": "2026-11-26", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-0qbz-wvsa", "name": "https://www.oscs1024.com/hd/MPS-0qbz-wvsa"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-137305", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-137305"}, {"url": "https://github.com/getgrav/grav/security/advisories/GHSA-4grx-p93p-25w8", "name": "GitHub Security Advisory (GHSA-4grx-p93p-25w8)"}, {"url": "https://github.com/getgrav/grav-plugin-form/commit/3daa9cb66c43b6d472473dcbf0c312c8e66b1769", "name": ""}, {"url": "https://www.vulncheck.com/advisories/gra 录、账户管理与站点内容维护功能。\n受影响版本中，LoginController::taskForgot() 处理忘记密码请求时生成有效期为 1 小时的重置令牌，并在 plugins.login.site_host 未配置时通过 getAbsoluteAdminUrl() 拼接重置链接，该函数经由 Grav Pages::baseUrl() 以请求 Host 头作为链接主机，整个流程不校验 Login 插件的 Require Trusted Host(plugins.login.require_trusted_host)设置；知晓管理员用户名的未认证攻击者在提交忘记密码表单时伪造 Host 头，可使站点向管理员邮箱发送指向攻击者控制主机的真实重置链接，管理员点击后重置令牌被攻击者获取，进而接管包括超级管理员在内的管理员账户。\n修复版本中通过在发送重置邮件前增加受信主机校验解决该问题：1.10.65 版本的 taskForgot() 在 plugins.login.require_trusted_host 开启且 LoginEmail::isTrustedHostConfigured() 判定 site_host 与 custom_base_url 均未设置时拒绝发送重置邮件，记录错误日志并返回与成功发送一致的提示响应，使重置链接主机不再受请求 Host 头控制，同时避免表单被用于探测账户。", "effects": [{"comp_name": "getgrav/grav-plugin-admin", "ecosystem": "composer", "versions": [{"affected_version": "(-∞,1.10.65)", "min_fixed_version": "1.10.65", "repository": "composer", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "忘记口令恢复机制弱", "kind_en": "忘记密码的弱密码恢复机制", "last_modified_time": "2026-11-26", "level": "High", "mps_id": "MPS-obfd-3rvi", "poc": false, "poc_url": [], "published_time": "2026-11-26", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-obfd-3rvi", "name": "https://www.oscs1024.com/hd/MPS-obfd-3rvi"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-137306", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-137306"}, {"url": "https://github.com/getgrav/grav/security/advisories/GHSA-v8r8-3hq6-qgff", "name": "GitHub Security Advisory (GHSA-v8r8-3hq6-qgff)"}, {"url": "https://github.com/getgrav/grav-plugin-admin/commit/4d09bd84ed1f7871e4a1a07a14eb11c33cafd5b9", "name": ""}, {"url": "https://www.vulncheck.com/advisories/grav-admin-plugin-before-1.10.65-password-reset-poisoning-via-host-header", "name": "VulnCheck Advisory: Grav Admin Plugin before 1.10.65 Password Reset Poisoning via Host Header"}], "scope_influence": "", "tags": ["php", "开源"], "title": "Grav Admin插件忘记密码重置链接Host头投毒导致管理员账户接管漏洞", "_tra ame": "https://nvd.nist.gov/vuln/detail/CVE-2026-137092"}, {"url": "https://github.com/assimp/assimp/pull/6701", "name": ""}, {"url": "https://github.com/assimp/assimp/commit/e04b60f61522e1d5594ef25addcfae7cb156f085", "name": ""}, {"url": "https://github.com/assimp/assimp/commit/bf9dabb617c46e5133dac65cca6bff177917afcb", "name": ""}, {"url": "https://github.com/assimp/assimp/releases/tag/v6.0.6", "name": "assimp v6.0.6 Release Notes"}, {"url": "https://github.com/assimp/assimp/blob/v6.0.5/code/AssetLib/MD5/MD5Loader.cpp#L200-L230", "name": ""}, {"url": "https://www.vulncheck.com/advisories/assimp-before-6.0.6-out-of-bounds-write-via-md5-importer-makedataunique", "name": "VulnCheck Advisory: Assimp before 6.0.6 Out-of-Bounds Write via MD5 Importer MakeDataUnique"}], "scope_influence": "", "tags": ["应用软件", "开源"], "title": "6.0.6 之前的 Assimp 通过 MD5 导入器 MakeDataUnique 越界写入", "_translated": true, "_saved_at": "2026-11-25T21:24:36+00:00", "_first_saved_at": "2026-11-25T21:24:36+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-8pta-u36v"}, {"analysis_status": 0, "articles": [{"content": "- 当攻击者欺骗合法的基于 Web 的应用程序或站点接受来自可信来源的请求时，就会发生跨站点脚本攻击。\r\n- 这是通过转义 Web 应用程序的上下文来完成的； 然后，Web 应用程序将该数据与其他受信任的动态内容一起交付给其用户，而无需对其进行验证。 浏览器不知不觉地在客户端执行恶意脚本（通过客户端语言；通常是 JavaScript 或 HTML）以执行通常被浏览器的同源策略阻止的操作。\r\n- ֿ注入恶意代码是最普遍的XSS利用方式； 因此，转义字符以防止这种操作是保护代码免受此漏洞影响的首要方法。\r\n- 转义意味着应用程序被编码以标记关键字符，特别是用户输入中包含的关键字符，以防止这些字符在危险的上下文中被解释。 例如，在 HTML 中，\u003c 可以编码为 \u0026lt; 并且\u003e可以被编码为\u0026gt; 为了在文本中被解释和显示为它们自己，而在代码本身中，它们被用于 HTML 标记。 如果将恶意内容注入到转义特殊字符的应用程序中，并且该恶意内容使用 \u003c 和 \u003e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-136459", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "cwe": "CWE-79", "description": "Nexter Extension（全称 Nexter Extension – Security, Performance, Code Snippets \u0026 Site Toolkit）是 POSIMYTH 开发的 WordPress 开源插件，经 WordPress.org 官方插件目录分发，提供 SEO、安全加固、性能优化、代码片段与站点工具箱等扩展功能。\n受影响版本中，插件 SEO（Content SEO）模块启用后 nofollow_comments 选项默认开启，Nexter_Content_SEO::filter_nofollow_comment_links 挂载于 comment_text 与 get_comment_author_link 过滤器，以正则 /\u003ca\\s([^\u003e]+)\u003e/i 匹配评论锚点并按字符串拼接方式重建标签；未认证攻击者向 wp-comments-post.php 提交一条评论，在链接的 title 等引号包裹的属性值中放置 \"\u003e\" 与 \"rel=\" 文本，正则在属性值内部的 \"\u003e\" 处截断标签，剩余文本被浏览器重新解析为新的标签属性，注入 onfocus 等可执行脚本属性，载荷在用户访问被注入页面时执行，构成存储型 XSS。\n修复版本中通过改用 WordPress HTML API（WP_HTML_Tag_Processor）解析评论锚点并经 set_attribute 写回 rel 属性，引号包裹的属性值被完整解析且属性输出转义，属性值内部的 \"\u003e\" 不再截断标签，切断了脚本属性注入路径；该修复随 2026-11-25 发布的 4.9.2 版本提供。", "effects": [{"comp_name": "nexter-extension", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,4.9.2)", "min_fixed_version": "4.9.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "高", "exploitability": "中", "fix_suggestion": "建议修复", " e 作为 HTML 标记，那么如果这些字符在应用程序代码中正确转义，那么这些字符将不会被浏览器解释为 HTML 标记。 转移未遂攻击的方式。\r\n- XSS 最突出的用途是窃取 cookie（来源：OWASP HttpOnly）和劫持用户会话，但 XSS 漏洞已被用于暴露敏感信息、允许访问特权服务和功能以及传播恶意软件。", "title": "什么是XSS"}, {"content": "| 类型        | 描述                                                         |\r\n| ----------- | ------------------------------------------------------------ |\r\n| 存储型      | 攻击者将恶意代码插入到应用程序中（通常作为链接）。 每次用户单击链接时，代码都会被激活。 |\r\n| 反射型      | 攻击者从易受攻击的网站应用程序外部向用户提供恶意链接。 单击时，恶意代码将发送到易受攻击的网站，将攻击反映回用户的浏览器。 |\r\n| 基于 DOM 的 | 攻击者强制用户的浏览器呈现恶意页面。 页面中的数据本身提供跨站点脚本数据。 |\r\n| 变异        | 攻击者注入看似安全的代码，但随后在解析标记时被浏览器重写和修改。 一个例子是重新平衡未闭合的引号，甚至为未引用的参数添加引号。 |", "title": "XSS常见的攻击方式"}, {"content": "- 在将 HTTP 请求中的数据输入反射回来之前对其进行清理，确保在将任何数据回显给用户之前验证、过滤或转义所有数据，例如搜索期间的查询参数值。\r\n- 将特殊字符（如 ?、\u0026、/、\u003c、\u003e 和空格）转换为其各自的 HTML 或 URL 编码等价物。\r\n- 为用户提供禁用客户端脚本的选项。\r\n- 重定向无效请求。\r\n- 检测同时登录，包括来自两个不同 IP 地址的登录，并使这些会话无效。\r\n- 使用并执行内容安全策略（Content Safe Policy）来禁用可能被 XSS 攻击操纵的任何功能。\r\n- 阅读代码中引用的所有库的文档，了解哪些元素允许嵌入 HTML。", "title": "如何预防XSS"}], "cnvd_id": "", "cve_id": "CVE-2026-137284", "cvss": {"cvssv31": [{"source": "security@wordfence.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "severity": "high", "base_score": 7.2}]}, "cvss_score": 7.2, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N", "cwe": "CWE-79", "description": "JetFormBuilder（Dynamic Blocks Form Builder）是 jetmonsters 开发的 WordPress 开源表单构建插件，用于在站点前端搭建表单并执行 Insert/Update Post 等提交动作。\n受影响版本中，未认证攻击者提交的表单字段值经 Insert/Update Post 动作的 fields_map 映射后，由 Post_Meta_Property::do_after() 通过 update_post_meta() 原样写入文章元数据；Get_From_DB 选项源读取该元数据键时将原始 meta_value 同时作为 Radio 或 Checkbox 选项的 value 与 label 回读并输出到页面标记，输入清理与输出转义不充分；在页面存在宏默认值字段而加载 dynamic.value.js 的条件下，前端 parseInput() 使用未限定自身表单边界的 closest('.jet-form-builder-row') 解析字段设置，攻击者存储的内容进入浏览器端字段设置解析路径并被执行，访问者打开被注入页面时任意网页脚本得以运行，形成存储型 XSS。\n修复版本中通过新增 findFieldWrapper() 辅助函数并应用于 dynamic.value、Observable、calculated.field、media.field 与 advanced.reporting 等前端模块，要求 closest() 解析到的包装元素位于当前字段所属表单的根节 :L", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:L", "cwe": "CWE-79", "description": "dudaster ECS – Elementor ele-custom-skin 的 Ele 自定义皮肤中存在网页生成期间输入不正确的中和（“跨站脚本”）漏洞，允许存储 XSS。此问题影响 ECS – Elementor 的 Ele 自定义皮肤：从 n/a 到 4.3.14。", "effects": [], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "低", "exploitability": "中", "fix_suggestion": "可选修复", "kind": "XSS", "kind_en": "网页生成期间输入的不正确中和（“跨站点脚本”）", "last_modified_time": "2026-11-26", "level": "High", "mps_id": "MPS-rtyu-x6vl", "poc": false, "poc_url": [], "published_time": "2026-11-26", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-rtyu-x6vl", "name": "https://www.oscs1024.com/hd/MPS-rtyu-x6vl"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-135808", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-135808"}, {"url": "https://patchstack.com/database/wordpress/plugin/ele-custom-skin/vulnerability/wordpress-ecs-ele-custom-skin-for-elementor-plugin-4-3-14-cross-site-scripting-xss-vulnerability?_s_id=cve", "name": ""}], "scope_influence": "", "tags": [], "title": "CVE-2026-135808漏洞", "_translated": true, "_saved_at": "2026-11-26T13:27:40+00:00", "_first_saved_at": "2026-11-26T13:27:40+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-rtyu-x6vl"}, {"analysis_status": 0, "articles": [{"content": "- 程序中的访问控制机制未正确实现，这种缺陷通常会导致未授权的用户或资源可以访问程序中的重要数据或资源，从而导致程序崩溃或出现其他错误。", "title": "什么是授权检查错误"}, {"content": "- 特权提升攻击：攻击者可以通过利用此缺陷，绕过应用程序的访问控制机制，获取系统管理员权限，从而完全控制系统。\n- 数据泄露攻击：攻击者可以通过利用此缺陷，获取系统中敏感数据，如用户凭证、信用卡信息等。\n- 拒绝服务攻击：攻击者可以通过利用此缺陷，对系统进行拒绝服务攻击，从而使系统无法正常工作。\n- 恶意软件传播：攻击者可以通过利用此缺陷，将恶意软件传播到系统中，从而控制系统或窃取敏感数据。\n", "title": "授权检查错误常见的攻击方式"}, {"content": "- 使用访问控制列表 (ACL):使用 ACL 可以限制用户对程序中的不同资源的访问权限。ACL 通常由用户名、权限和资源地址组成，可以确保只有授权用户才能访问程序中的重要数据或资源。\n- 使用访问令牌：使用访问令牌可以确保只有授权用户才能访问程序中的不同资源。令牌通常由用户 ID、权限和资源地址组成，可以确保只有授权用户才能更改令牌的权限。\n- 使用安全审计：在程序中记录安全审计日志，可以确保管理员可以追踪未授权用户的活动。同时，定期审查安全审计日志，可以及时发现未授权的活动并采取相应的措施。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查错误"}], "cnvd_id": "", "cve_id": "CVE-2026-137309", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:H/A:N", "severity": "medium", "base_score": 6.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-863", "description": "Friendica 是开源 PHP 去中心化社交网络平台，采用 AGPL-3.0 许可发布，用于自建可与 ActivityPub 联邦网络互通的社交站点。\n受影响版本中，mod/item.php 的 item_edit() 函数通过 Post::selectFirst(Item::ITEM_FIELDLIST, ['id' =\u003e $request['post_id'], 'uid' =\u003e $uid]) 获取待编辑帖子，查询条件仅匹配当前用户存储的帖子副本 id，未校验该副本是否为用户本人的原始帖子，也未校验 author-id 是否属于当前用户。已登录本地用户向 /item 发起 POST 请求并提交自己存储副本对应的 post_id 后，函数按共享 uri-id 调用 Post\\Media::deleteByURIId 删除原帖附件，并通过 Item::update 将攻击者可控的 body、title、content-warning 等字段写入共享内容，篡改结果继续展示在原作者名下。\n修复版本中通过改用 Post::selectOriginFirst 查询并附加 author-id 等于当前用户公开联系 ID、deleted 为 false 的条件，将可编辑范围限定为本人原创且未删除的帖子，同时隐藏非本人帖子的编辑入口，阻断越权编辑与附件删除。", "effects": [{"comp_name": "friendica", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,2026.05-1]", "min_fixed_version": "", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查错误", "kind_en": "授权错误", "last_modified_time": "2026-11-26", "level": "High", "mps_id": "MPS-uj4c-91xn", "poc": false, "poc_url": [], "published_time": "2026-11-26", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-uj4c-91xn", "name": "https://www.oscs1024.com/hd/MPS-uj4c-91xn"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-137309", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-137309"}, {"url": "https://github.com/friendica/friendica/pull/16527", "name": ""}, {"url": "https://github.com/friendica/friendica/commit/63dc02336f89cdd0ae851a6b85a3a48cbd0f3fa7", "name": ""}, {"url": "https://github.com/friendica/friendica/blob/2026.05-1/mod/item.php#L87-L126", "name": ""}, {"url": "https://www.vulncheck.com/advisories/friendica-through-2026.05-1-incorrect-authorization-in-post-editing-via-item-edit", "name": "VulnCheck Advisory: Friendica through 2026.05-1 Incorrect Authorization in Post Editing via item_edit()"}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "Friendica 帖子编辑越权漏洞", "_translated": true, "_saved_at": "2026-11-26T03:53:12+00:00", "_first_saved_at": "2026-11-26T03:53:12+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-uj4c-91xn"}, {"analysis_status": 0, "articles": [{"content": "- 程序中未正确实现授权机制，从而导致程序可以被未授权的用户访问或篡改", "title": "什么是授权检查缺失"}, {"content": "- 伪造授权请求：攻击者可以通过发送伪造的授权请求来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过伪造用户名和密码、证书等来模拟授权请求，从而绕过授权验证。\n- 命令注入攻击：攻击者可以通过在应用程序中注入恶意的命令来绕过授权验证，从而实现访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中注入恶意的命令来访问受保护的数据库或文件系统。\n- 文件包含攻击：攻击者可以通过在应用程序中包含恶意的文件，从而利用 Missing Authorization 漏洞来访问受保护的资源或数据。例如，攻击者可以通过在 Web 应用程序中包含恶意的 CSS 或 JavaScript 文件来欺骗应用程序将用户输入的数据执行为授权请求，从而绕过授权验证。\n- 拒绝服务攻击 (DDoS):攻击者可以通过向应用程序发送大量的请求来占用其资源，从而实现拒绝服务攻击。例如，攻击者可以通过向 Web 服务器发送大量的 HTTP 请求来占用其资源，从而使 Web 服务器无法正常响应合法的请求。\n", "title": "授权检查缺失常见的攻击方式"}, {"content": "- 使用身份验证和授权机制：程序应该使用适当的身份验证和授权机制来验证用户的身份和权限，以确保只有授权用户可以访问受保护的资源或数据。\n- 最小特权原则：程序应该限制用户输入的数据的权限，只允许授权用户进行特定的操作，以减少未授权用户对受保护资源或数据的访问。\n- 输入验证：程序应该对用户输入的数据进行适当的验证和过滤，以确保输入的数据符合预期的格式和类型。\n- 安全编码实践：程序应该遵循一些安全编码实践，如使用安全的算法和加密机制、避免使用未认证的库和框架、避免使用默认设置等，以减少漏洞的出现。\n", "title": "如何预防授权检查缺失"}], "cnvd_id": "", "cve_id": "CVE-2026-137085", "cvss": {"cvssv31": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:N", "severity": "medium", "base_score": 6.5}], "cvssv4": [{"source": "disclosure@vulncheck.com", "vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "severity": "high", "base_score": 7.1}]}, "cvss_score": 7.1, "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X", "cwe": "CWE-862", "description": "ProjeQtOr 是一套开源（AGPL v3）的 PHP Web 项目管理软件，用于项目、任务、工时与团队协作管理，官方通过 projeqtor.com 与 SourceForge 以源码包形式分发。\n受影响版本中，tool/getAFieldForAClassById.php 直接读取请求参数 Class、id、field，未对目标对象执行任何访问权限校验，通过 SqlElement::getSingleSqlElementFromCriteria 按任意类名加载数据后以 json_encode($obj-\u003e$field) 返回对象属性，进入该脚本前仅存在登录会话校验。已登录的低权限用户请求 Class=User、id 指向管理员账号、field=password 或 field=email，读取对应用户的密码哈希与邮箱地址，密码哈希以 MD5 形式存储，可离线破解后用于接管管理员账户。\n修复版本中通过在 tool/getAFieldForAClassById.php 增加 Class 与 field 白名单，仅允许读取 Notifiable 类的 notifiableItem 字段，输入统一改由 RequestHandler::getValue 与 RequestHandler::getId 处理，其余请求记录为 hack 并终止执行，切断了任意对象属性的读取路径。", "effects": [{"comp_name": "projeqtor", "ecosystem": "linux", "versions": [{"affected_version": "(-∞,13.1.2)", "min_fixed_version": "13.1.2", "repository": "unmanaged", "solutions": [], "upstream": true}]}], "epss": -1, "exp": false, "exploit_requirement": "", "exploit_requirement_cost": "中", "exploitability": "中", "fix_suggestion": "建议修复", "kind": "授权检查缺失", "kind_en": "缺少授权", "last_modified_time": "2026-11-26", "level": "High", "mps_id": "MPS-wdlp-u5fi", "poc": false, "poc_url": [], "published_time": "2026-11-26", "reference_url_list": [{"url": "https://www.oscs1024.com/hd/MPS-wdlp-u5fi", "name": "https://www.oscs1024.com/hd/MPS-wdlp-u5fi"}, {"url": "https://nvd.nist.gov/vuln/detail/CVE-2026-137085", "name": "https://nvd.nist.gov/vuln/detail/CVE-2026-137085"}, {"url": "https://changelog.projeqtor.org/", "name": ""}, {"url": "https://changelog.projeqtor.org/getTickets.php?idVersion=527", "name": ""}, {"url": "https://www.projeqtor.com", "name": ""}, {"url": "https://www.vulncheck.com/advisories/projeqtor-before-13.1.2-missing-authorization-via-getafieldforaclassbyid-php", "name": "VulnCheck Advisory: ProjeQtOr before 13.1.2 Missing Authorization via getAFieldForAClassById.php"}], "scope_influence": "", "tags": ["应用软件", "终端软件"], "title": "ProjeQtOr访问控制缺失漏洞", "_translated": true, "_saved_at": "2026-11-25T21:24:37+00:00", "_first_saved_at": "2026-11-25T21:24:37+00:00", "_source_page": "https://www.oscs1024.com/hd/MPS-wdlp-u5fi"}]}</script>
  <script>
    const payload = JSON.parse(document.getElementById("payload").textContent);
    const levelLabels = payload.level_labels || {};
    const items = payload.items || [];
    let filtered = items.slice();
    let activeId = null;

    const $ = (id) => document.getElementById(id);
    $("generatedAt").textContent = payload.generated_at || "-";
    $("retention").textContent = payload.retention_days ?? "-";
    $("cutoff").textContent = payload.cutoff_date || "-";
    $("count").textContent = String(payload.count ?? items.length);

    function levelClass(level) {
      const cn = levelLabels[level] || level || "";
      if (level === "Critical" || cn === "严重") return "crit";
      if (level === "High" || cn === "高危") return "high";
      return "other";
    }
    function levelText(level) {
      return levelLabels[level] || level || "-";
    }
    function esc(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }
    function scoreText(v) {
      if (v === null || v === undefined || v === "" || v === -1) return "-";
      return String(v);
    }

    function renderList() {
      const list = $("list");
      $("listCount").textContent = String(filtered.length);
      if (!filtered.length) {
        list.innerHTML = '<div class="empty">没有匹配项</div>';
        return;
      }
      list.innerHTML = filtered.map((it) => {
        const id = it.mps_id || it.cve_id;
        const active = id === activeId ? " active" : "";
        return `
          <button class="item${active}" data-id="${esc(id)}" type="button">
            <div class="item-top">
              <span class="cve">${esc(it.cve_id || it.mps_id || "-")}</span>
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
            </div>
            <div class="title">${esc(it.title || "-")}</div>
            <div class="item-foot">
              <span>CVSS ${esc(scoreText(it.cvss_score))}</span>
              <span>${esc(it.published_time || "-")}</span>
              ${it.poc ? "<span>POC</span>" : ""}
            </div>
          </button>`;
      }).join("");
      list.querySelectorAll(".item").forEach((btn) => {
        btn.addEventListener("click", () => selectById(btn.dataset.id));
      });
    }

    function refsHtml(it) {
      const refs = Array.isArray(it.reference_url_list) ? it.reference_url_list : [];
      const links = [];
      if (it._source_page) links.push({ url: it._source_page, name: "OSCS 详情" });
      if (it.cve_id) links.push({ url: `https://nvd.nist.gov/vuln/detail/${it.cve_id}`, name: "NVD" });
      refs.forEach((r) => {
        if (r && r.url) links.push({ url: r.url, name: r.name || r.url });
      });
      const seen = new Set();
      const uniq = [];
      for (const l of links) {
        if (seen.has(l.url)) continue;
        seen.add(l.url);
        uniq.push(l);
      }
      if (!uniq.length) return '<div class="box">无参考链接</div>';
      return `<div class="refs">${uniq.map((l) =>
        `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name || l.url)}</a>`
      ).join("")}</div>`;
    }

    function articlesHtml(it) {
      const arts = Array.isArray(it.articles) ? it.articles : [];
      if (!arts.length) return "";
      return `<div class="section"><h3>相关说明</h3>${arts.map((a) => `
        <div class="article">
          <h4>${esc(a.title || "说明")}</h4>
          <p>${esc(a.content || "")}</p>
        </div>`).join("")}</div>`;
    }

    function renderDetail(it) {
      const detail = $("detail");
      if (!it) {
        detail.innerHTML = '<div class="empty">暂无数据</div>';
        return;
      }
      const pocUrls = Array.isArray(it.poc_url) ? it.poc_url : [];
      detail.innerHTML = `
        <div class="d-head">
          <div>
            <h1 class="d-title">${esc(it.title || "-")}</h1>
            <div class="ids">
              <span class="badge ${levelClass(it.level)}">${esc(levelText(it.level))}</span>
              <span class="chip">${esc(it.cve_id || "无 CVE")}</span>
              <span class="chip">${esc(it.mps_id || "-")}</span>
              ${it.poc ? '<span class="chip">有 POC</span>' : ""}
              ${it.exp ? '<span class="chip">有 EXP</span>' : ""}
            </div>
          </div>
          <div class="actions">
            ${it._source_page ? `<a class="btn" href="${esc(it._source_page)}" target="_blank" rel="noopener">OSCS</a>` : ""}
            ${it.cve_id ? `<a class="btn" href="https://nvd.nist.gov/vuln/detail/${esc(it.cve_id)}" target="_blank" rel="noopener">NVD</a>` : ""}
          </div>
        </div>
        <div class="grid">
          <div class="stat"><div class="k">CVSS</div><div class="v">${esc(scoreText(it.cvss_score))}</div></div>
          <div class="stat"><div class="k">向量</div><div class="v">${esc(it.cvss_vector || "-")}</div></div>
          <div class="stat"><div class="k">CWE</div><div class="v">${esc(it.cwe || "-")}</div></div>
          <div class="stat"><div class="k">类型</div><div class="v">${esc(it.kind || it.kind_en || "-")}</div></div>
          <div class="stat"><div class="k">公开</div><div class="v">${esc(it.published_time || "-")}</div></div>
          <div class="stat"><div class="k">利用成本</div><div class="v">${esc(it.exploit_requirement_cost || "-")}</div></div>
          <div class="stat"><div class="k">可利用性</div><div class="v">${esc(it.exploitability || "-")}</div></div>
          <div class="stat"><div class="k">修复建议</div><div class="v">${esc(it.fix_suggestion || "-")}</div></div>
        </div>
        <div class="section"><h3>描述</h3><div class="box">${esc(it.description || "无描述")}</div></div>
        ${it.scope_influence ? `<div class="section"><h3>影响范围</h3><div class="box">${esc(it.scope_influence)}</div></div>` : ""}
        ${pocUrls.length ? `<div class="section"><h3>POC 链接</h3><div class="refs">${pocUrls.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join("")}</div></div>` : ""}
        <div class="section"><h3>参考链接</h3>${refsHtml(it)}</div>
        ${articlesHtml(it)}
      `;
    }

    function selectById(id) {
      const it = filtered.find((x) => (x.mps_id || x.cve_id) === id) ||
                 items.find((x) => (x.mps_id || x.cve_id) === id);
      if (!it) return;
      activeId = it.mps_id || it.cve_id;
      renderList();
      renderDetail(it);
      const btn = document.querySelector(`.item[data-id="${CSS.escape(activeId)}"]`);
      if (btn) btn.scrollIntoView({ block: "nearest" });
      history.replaceState(null, "", "#" + encodeURIComponent(activeId));
    }

    function applyFilter(q) {
      const query = (q || "").trim().toLowerCase();
      filtered = !query ? items.slice() : items.filter((it) => {
        const blob = [
          it.cve_id, it.mps_id, it.title, it.kind, it.kind_en, it.cwe, it.description, it.level
        ].map((x) => String(x || "").toLowerCase()).join(" ");
        return blob.includes(query);
      });
      renderList();
      if (filtered.length) {
        const still = filtered.some((x) => (x.mps_id || x.cve_id) === activeId);
        selectById(still ? activeId : (filtered[0].mps_id || filtered[0].cve_id));
      } else {
        activeId = null;
        renderDetail(null);
      }
    }

    $("search").addEventListener("input", (e) => applyFilter(e.target.value));

    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement !== $("search")) {
        e.preventDefault();
        $("search").focus();
        return;
      }
      if (!filtered.length) return;
      const idx = filtered.findIndex((x) => (x.mps_id || x.cve_id) === activeId);
      if (e.key === "ArrowDown") {
        e.preventDefault();
        const next = filtered[Math.min(filtered.length - 1, Math.max(0, idx) + 1)];
        selectById(next.mps_id || next.cve_id);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        const prev = filtered[Math.max(0, idx - 1)];
        selectById(prev.mps_id || prev.cve_id);
      }
    });

    const hashId = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    if (hashId && items.some((x) => (x.mps_id || x.cve_id) === hashId)) {
      activeId = hashId;
      renderList();
      selectById(hashId);
    } else if (items.length) {
      selectById(items[0].mps_id || items[0].cve_id);
    } else {
      renderList();
      renderDetail(null);
    }
  </script>
</body>
</html>
